# fin-market-rules — Competency Questions

cqs:
  - id: "CQ-MR1"
    question: "Given a venue and an instrument class at a specific point in time (three-axis as-of), what is the applicable settlement cycle?"
    scope: "rule applicability temporal query"
    expectedResult: "returns the active SettlementConvention with its T+N value and effective interval"
    negativeExample: "query before the rule's effective date or after its expiry returns 'no applicable rule'"
    dependsOn: ["MarketRule", "RuleApplicability", "SettlementConvention", "TradingVenue"]
    riskLevel: "high"
    status: "draft"

  - id: "CQ-MR2"
    question: "What is the price limit (limit up / limit down) for a given instrument class on a given venue at a specific point in time?"
    scope: "price limit rule query"
    expectedResult: "returns the active MarketRule with its limit percentage and effective interval"
    negativeExample: "rule from a superseded revision not returned; rule from a different venue not returned"
    dependsOn: ["MarketRule", "RuleApplicability", "TradingVenue"]
    riskLevel: "high"
    status: "draft"

  - id: "CQ-MR3"
    question: "If a market rule is revised, does a historical query return the old rule or the new one?"
    scope: "temporal rule versioning"
    expectedResult: "returns the rule that was active at the query's as-of time; revised rule only returned for queries after the revision's effective date"
    negativeExample: "query before revision returns old rule, not new; query after returns new, not old"
    dependsOn: ["MarketRule", "RuleApplicability"]
    riskLevel: "high"
    status: "draft"
