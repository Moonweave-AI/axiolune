# fin-foundation — Competency Questions (CQ)
# M2-PLAN §2.1: CQ drives scope and verifiability. Each CQ must be convertible to a query/probe.

cqs:
  - id: "CQ-F1"
    question: "Given an ISIN and a LEI, do they identify the same financial instrument and the same issuer?"
    scope: "identity resolution across identifier types"
    expectedResult: "returns the matching Instrument and LegalEntity, or an explicit 'no match' with conflict reason"
    negativeExample: "invalid ISIN checksum or mismatched LEI-instrument pair rejected"
    dependsOn: ["ISIN", "LEI", "FinancialInstrument", "LegalEntity"]
    riskLevel: "high"
    status: "draft"

  - id: "CQ-F2"
    question: "What currencies are valid for a given jurisdiction?"
    scope: "currency-jurisdiction mapping"
    expectedResult: "returns a list of valid ISO 4217 currency codes for the jurisdiction"
    negativeExample: "invalid or expired currency code rejected"
    dependsOn: ["Currency", "Jurisdiction"]
    riskLevel: "medium"
    status: "draft"

  - id: "CQ-F3"
    question: "Is a given MIC code active, and which trading venue does it identify?"
    scope: "market identification"
    expectedResult: "returns the TradingVenue identified by the MIC, with its market status"
    negativeExample: "expired or unknown MIC code rejected"
    dependsOn: ["MIC", "TradingVenue"]
    riskLevel: "medium"
    status: "draft"
