# fin-foundation — Terminology Cards
# Each card: term, IRI, ISO 704 definition, excludes, source (M2-PLAN §3.3)
# Source provenance: FIBO .rdf files (extracted verbatim), ISO standards (referenced)

cards:
  - term: "LegalEntity"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/LegalEntity"
    definition: "organization that is legally or financially responsible for the performance of financial transactions and is capable of accruing liability on its own part"
    genus: "organization"
    differentia:
      - "legally or financially responsible for performance of financial transactions"
      - "capable of accruing liability on its own part"
      - "excludes natural persons but includes governments and supranational entities"
    excludes:
      - "natural persons acting in individual capacity"
      - "informal groups without legal personality"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO BE/LegalEntities/LEIEntities — ContractuallyCapableEntity; Commons/Organizations/LegalEntity"
    candidateM3Type: "ObjectTypeDefinition"
    status: review

  - term: "Party"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/Party"
    definition: "autonomous agent that can participate in legal or financial relationships"
    genus: "autonomous agent"
    differentia:
      - "can participate in legal or financial relationships"
      - "may be a natural person or a legal entity"
    excludes:
      - "non-autonomous resources (e.g. instruments, currencies)"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO FND/Parties/Parties — Party; Commons/PartiesAndSituations/Party"
    candidateM3Type: "ObjectTypeDefinition"
    status: review

  - term: "ISIN"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/ISIN"
    definition: "12-character alphanumeric code that identifies a security as specified by ISO 6166, consisting of a 2-character ISO 3166-1 country code, a 9-character national securities identifying number, and a Luhn check digit"
    genus: "identifier"
    differentia:
      - "12-character alphanumeric"
      - "conforms to ISO 6166"
      - "comprises country code + NSIN + check digit"
    excludes:
      - "CUSIP (a type of NSIN, not itself an ISIN)"
      - "SEDOL"
      - "ticker symbol"
    sources:
      - reference: "iso-6166"
        locator: "ISO 6166:2021 §1"
      - reference: "fibo-2026Q1"
        locator: "FIBO SEC/Securities/SecuritiesIdentification/InternationalSecuritiesIdentificationNumber"
    candidateM3Type: "IdentifierTypeDefinition"
    status: review

  - term: "LEI"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/LEI"
    definition: "20-character alphanumeric code that uniquely identifies a legal entity as defined in ISO 17442, consisting of a 4-character LOU prefix, 12-character entity-specific identifier, and 2 check digits"
    genus: "identifier"
    differentia:
      - "20-character alphanumeric"
      - "conforms to ISO 17442"
      - "identifies a legal entity (not a natural person)"
    excludes:
      - "ISIN (identifies securities, not entities)"
      - "tax identification numbers"
    sources:
      - reference: "iso-17442"
        locator: "ISO 17442:2020"
      - reference: "fibo-2026Q1"
        locator: "FIBO BE/LegalEntities/LEIEntities/LegalEntityIdentifier"
    candidateM3Type: "IdentifierTypeDefinition"
    status: review

  - term: "MIC"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/MIC"
    definition: "market identifier code that uniquely identifies an exchange, trading platform, or market as specified by ISO 10383, comprising a 4-character alphanumeric operating-level code or a 4+4 character segment-level code"
    genus: "identifier"
    differentia:
      - "4-character operating-level or 4+4 segment-level code"
      - "conforms to ISO 10383"
      - "identifies a market or trading venue"
    excludes:
      - "venue-specific internal codes"
      - "broker identifiers"
    sources:
      - reference: "iso-10383"
        locator: "ISO 10383:2012"
      - reference: "fibo-2026Q1"
        locator: "FIBO FBC/FunctionalEntities/Markets/MarketIdentifier"
    candidateM3Type: "IdentifierTypeDefinition"
    status: review

  - term: "Currency"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/Currency"
    definition: "medium of exchange value defined by reference to the geographical location of the monetary authorities responsible for it, as specified in ISO 4217"
    genus: "medium of exchange"
    differentia:
      - "defined by reference to monetary authority geography"
      - "has a 3-character alphabetic code and a 3-digit numeric code (ISO 4217)"
      - "has a minor unit (decimal places)"
    excludes:
      - "cryptocurrency tokens without ISO 4217 codes"
      - "commodity units"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO FND/Accounting/CurrencyAmount/Currency"
    candidateM3Type: "ObjectTypeDefinition"
    status: review

  - term: "Jurisdiction"
    canonicalIri: "https://axiolune.ai/ontology/finance/foundation/Jurisdiction"
    definition: "legal authority that has the power to make and enforce rules of conduct within a defined geographical or functional scope"
    genus: "legal authority"
    differentia:
      - "has power to make and enforce rules"
      - "scope is geographical or functional"
    excludes:
      - "informal standards bodies without enforcement power"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO Commons/RegulatoryAgencies/Jurisdiction"
    candidateM3Type: "ObjectTypeDefinition"
    status: review
