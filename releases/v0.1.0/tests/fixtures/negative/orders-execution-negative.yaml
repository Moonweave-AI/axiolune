# fin-orders-execution — Negative Test Fixtures
# Validates rejection of invalid state transitions, missing required fields, and constraint violations

fixtures:
  - id: "orders-neg-001"
    description: "Missing availableFrom (fail-closed per ADR-012)"
    type: "https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent"
    instance:
      iri: "https://axiolune.ai/data/test/order-event-invalid-001"
      type: "https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent"
      transitionsOrder: "https://axiolune.ai/data/test/order-intent-invalid-001"
      hasLifecycleState: "Accepted"
      hasPreviousState: "Submitted"
      hasExternalOrderId: "VENUE-ORD-BAD"
      validFrom: "2026-07-25T10:00:00Z"
      knowledgeFrom: "2026-07-25T10:00:00Z"
      # availableFrom: MISSING
    expectedResult: "rejected"
    expectedViolation: "missing availableFrom"
    note: "ADR-012: availableFrom is required and must fail-closed when missing"

  - id: "orders-neg-002"
    description: "Temporal constraint violation: validTo before validFrom"
    type: "https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent"
    instance:
      iri: "https://axiolune.ai/data/test/order-event-invalid-002"
      type: "https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent"
      transitionsOrder: "https://axiolune.ai/data/test/order-intent-001"
      hasLifecycleState: "Accepted"
      hasPreviousState: "Submitted"
      validFrom: "2026-07-25T18:00:10Z"
      validTo: "2026-07-25T18:00:05Z"  # INVALID: validTo < validFrom
      knowledgeFrom: "2026-07-25T18:00:10Z"
      availableFrom: "2026-07-25T18:00:11Z"
    expectedResult: "rejected"
    expectedViolation: "interval inversion: validTo < validFrom"
    note: "PIT validator: validFrom < validTo (half-open interval [from, to))"

  - id: "orders-neg-003"
    description: "Future availableFrom relative to current time (look-ahead bias)"
    type: "https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent"
    instance:
      iri: "https://axiolune.ai/data/test/order-event-invalid-003"
      type: "https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent"
      transitionsOrder: "https://axiolune.ai/data/test/order-intent-001"
      hasLifecycleState: "Filled"
      hasPreviousState: "Accepted"
      validFrom: "2026-07-25T19:00:00Z"
      knowledgeFrom: "2026-07-25T19:00:01Z"
      availableFrom: "2099-12-31T23:59:59Z"  # INVALID: far future availability
    expectedResult: "rejected"
    expectedViolation: "availableFrom in far future"
    note: "PIT validator: availableFrom should not be in far future relative to validFrom/knowledgeFrom."

  - id: "orders-neg-004"
    description: "Missing required field: OrderIntent without hasOrderSide"
    type: "https://axiolune.ai/ontology/finance/orders-execution/OrderIntent"
    instance:
      iri: "https://axiolune.ai/data/test/order-intent-invalid-004"
      type: "https://axiolune.ai/ontology/finance/orders-execution/OrderIntent"
      # hasOrderSide: MISSING
      hasOrderType: "Limit"
      hasTimeInForce: "GTC"
      hasOrderQuantity: 100
      hasLimitPrice: 50.00
      validFrom: "2026-07-25T15:00:00Z"
      knowledgeFrom: "2026-07-25T15:00:00Z"
      availableFrom: "2026-07-25T15:00:01Z"
    expectedResult: "rejected"
    expectedViolation: "missing required attribute: hasOrderSide (minCount=1)"
    note: "SHACL cardinality constraint: OrderIntent.hasOrderSide minCount=1"

  - id: "orders-neg-005"
    description: "Missing required field: OrderIntent without hasOrderQuantity"
    type: "https://axiolune.ai/ontology/finance/orders-execution/OrderIntent"
    instance:
      iri: "https://axiolune.ai/data/test/order-intent-invalid-005"
      type: "https://axiolune.ai/ontology/finance/orders-execution/OrderIntent"
      hasOrderSide: "Buy"
      hasOrderType: "Market"
      hasTimeInForce: "IOC"
      # hasOrderQuantity: MISSING
      validFrom: "2026-07-25T15:00:00Z"
      knowledgeFrom: "2026-07-25T15:00:00Z"
      availableFrom: "2026-07-25T15:00:01Z"
    expectedResult: "rejected"
    expectedViolation: "missing required attribute: hasOrderQuantity (minCount=1)"
    note: "SHACL cardinality constraint: OrderIntent.hasOrderQuantity minCount=1"

  - id: "orders-neg-006"
    description: "Missing required field: Execution without hasExecutionPrice"
    type: "https://axiolune.ai/ontology/finance/orders-execution/Execution"
    instance:
      iri: "https://axiolune.ai/data/test/execution-invalid-006"
      type: "https://axiolune.ai/ontology/finance/orders-execution/Execution"
      executesOrder: "https://axiolune.ai/data/test/order-intent-001"
      executedInstrument: "https://axiolune.ai/data/test/instrument-AAPL"
      executedAtVenue: "https://axiolune.ai/data/test/venue-XNAS"
      hasOrderSide: "Buy"
      # hasExecutionPrice: MISSING
      hasExecutionQuantity: 100
      hasCommission: 1.50
      validFrom: "2026-07-25T16:00:00Z"
      knowledgeFrom: "2026-07-25T16:00:00Z"
      availableFrom: "2026-07-25T16:00:01Z"
    expectedResult: "rejected"
    expectedViolation: "missing required attribute: hasExecutionPrice (minCount=1)"
    note: "SHACL cardinality constraint: Execution.hasExecutionPrice minCount=1"

  - id: "orders-neg-007"
    description: "Missing required field: Execution without hasExecutionQuantity"
    type: "https://axiolune.ai/ontology/finance/orders-execution/Execution"
    instance:
      iri: "https://axiolune.ai/data/test/execution-invalid-007"
      type: "https://axiolune.ai/ontology/finance/orders-execution/Execution"
      executesOrder: "https://axiolune.ai/data/test/order-intent-001"
      executedInstrument: "https://axiolune.ai/data/test/instrument-AAPL"
      executedAtVenue: "https://axiolune.ai/data/test/venue-XNAS"
      hasOrderSide: "Buy"
      hasExecutionPrice: 149.95
      # hasExecutionQuantity: MISSING
      hasCommission: 1.50
      validFrom: "2026-07-25T16:00:00Z"
      knowledgeFrom: "2026-07-25T16:00:00Z"
      availableFrom: "2026-07-25T16:00:01Z"
    expectedResult: "rejected"
    expectedViolation: "missing required attribute: hasExecutionQuantity (minCount=1)"
    note: "SHACL cardinality constraint: Execution.hasExecutionQuantity minCount=1"

  - id: "orders-neg-008"
    description: "Missing required participant: Execution without executesOrder"
    type: "https://axiolune.ai/ontology/finance/orders-execution/Execution"
    instance:
      iri: "https://axiolune.ai/data/test/execution-invalid-008"
      type: "https://axiolune.ai/ontology/finance/orders-execution/Execution"
      # executesOrder: MISSING (orphaned execution)
      executedInstrument: "https://axiolune.ai/data/test/instrument-AAPL"
      executedAtVenue: "https://axiolune.ai/data/test/venue-XNAS"
      hasOrderSide: "Buy"
      hasExecutionPrice: 149.95
      hasExecutionQuantity: 100
      validFrom: "2026-07-25T17:00:00Z"
      knowledgeFrom: "2026-07-25T17:00:00Z"
      availableFrom: "2026-07-25T17:00:01Z"
    expectedResult: "rejected"
    expectedViolation: "missing required participant: executesOrder (minCount=1)"
    note: "CQ-OE4: Execution must be traceable to OrderIntent. Orphaned executions are rejected."

  - id: "orders-neg-009"
    description: "Missing required field: ExternalOrderStatusMapping without hasExternalStatus"
    type: "https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping"
    instance:
      iri: "https://axiolune.ai/data/test/status-mapping-invalid-009"
      type: "https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping"
      appliesToVenue: "https://axiolune.ai/data/test/venue-binance"
      # hasExternalStatus: MISSING
      hasCanonicalState: "Accepted"
      validFrom: "2024-01-01T00:00:00Z"
      knowledgeFrom: "2024-01-01T00:00:00Z"
      availableFrom: "2024-01-01T00:00:00Z"
    expectedResult: "rejected"
    expectedViolation: "missing required attribute: hasExternalStatus (minCount=1)"
    note: "SHACL cardinality constraint: ExternalOrderStatusMapping.hasExternalStatus minCount=1"
