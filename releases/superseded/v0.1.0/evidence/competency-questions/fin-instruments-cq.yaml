# fin-instruments — Competency Questions

cqs:
  - id: "CQ-I1"
    question: "Given an ISIN, which financial instrument does it identify, and who is its issuer?"
    scope: "instrument identification and issuer resolution"
    expectedResult: "returns the FinancialInstrument and its Issuer (LegalEntity)"
    negativeExample: "invalid ISIN or ISIN with no registered instrument rejected"
    dependsOn: ["ISIN", "FinancialInstrument", "Issuer", "isIssuedBy"]
    riskLevel: "high"
    status: "draft"

  - id: "CQ-I2"
    question: "On which trading venues is a given instrument listed, and what are the listing terms (tick size, lot size, currency)?"
    scope: "listing lookup"
    expectedResult: "returns a list of InstrumentListings with their venue, tick size, lot size, and currency"
    negativeExample: "delisted instrument returns empty list or explicitly marked delisted"
    dependsOn: ["FinancialInstrument", "InstrumentListing", "TradingVenue"]
    riskLevel: "medium"
    status: "draft"

  - id: "CQ-I3"
    question: "What is the inheritance hierarchy of a given instrument (e.g. is AAPL an EquityInstrument, which is a Security, which is a FinancialInstrument)?"
    scope: "instrument classification"
    expectedResult: "returns the full superTypes chain from the concrete type to FinancialInstrument"
    negativeExample: "an instrument with a circular or broken superTypes chain rejected"
    dependsOn: ["FinancialInstrument", "Security", "EquityInstrument"]
    riskLevel: "medium"
    status: "draft"
