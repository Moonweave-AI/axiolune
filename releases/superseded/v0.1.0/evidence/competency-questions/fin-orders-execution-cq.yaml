# fin-orders-execution — Competency Questions (CQ)
# M2-PLAN §6.3: Slice B order lifecycle CQ with state machine validation

cqs:
  - id: "CQ-OE1"
    question: "Given an order intent ID, what is the complete lifecycle event sequence in temporal order?"
    scope: "Order lifecycle audit trail"
    expectedResult: "returns all OrderLifecycleEvent instances for the order, ordered by validFrom (or knowledgeFrom if validFrom identical), showing state transitions: Initialized → Submitted → Accepted → PartiallyFilled → Filled (or other terminal states)"
    negativeExamples:
      - "events out of temporal order are flagged"
      - "events with invalid state transitions (e.g., Initialized → Filled without Accepted) are rejected"
      - "events with missing previousState (except Initialized) are rejected"
    dependsOn: ["OrderIntent", "OrderLifecycleEvent", "TemporalFact"]
    riskLevel: "high"
    status: "draft"
    note: "Core audit trail query. Event-sourced design per nautilus_trader. State machine validation ensures no invalid transitions."

  - id: "CQ-OE2"
    question: "Given an order intent, was the order accepted by the venue, and if so, what is the external order ID?"
    scope: "Order acceptance and external ID lookup"
    expectedResult: "returns the OrderLifecycleEvent with state=Accepted and the hasExternalOrderId value, or returns explicit 'not accepted' if no Accepted event exists"
    negativeExamples:
      - "order in Initialized or Submitted state returns 'not accepted'"
      - "order in Rejected state returns 'rejected, no external ID'"
    dependsOn: ["OrderIntent", "OrderLifecycleEvent", "OrderLifecycleState"]
    riskLevel: "medium"
    status: "draft"
    note: "Critical for order tracking and reconciliation with venue systems."

  - id: "CQ-OE3"
    question: "Given an order intent, what is the total executed quantity and average execution price?"
    scope: "Order fill summary and execution aggregation"
    expectedResult: "returns sum of all Execution.hasExecutionQuantity for the order, and weighted average of Execution.hasExecutionPrice by quantity, or returns 'no executions' if no Execution facts exist"
    negativeExamples:
      - "order with no executions returns zero quantity"
      - "order with PartiallyFilled state but no Execution facts is flagged as inconsistent"
    dependsOn: ["OrderIntent", "Execution", "OrderLifecycleEvent"]
    riskLevel: "high"
    status: "draft"
    note: "Enables position derivation from execution stream. M2-PLAN §6.3: Execution → Position derivation."

  - id: "CQ-OE4"
    question: "Given an execution, can I trace back to the originating order intent and its lifecycle events?"
    scope: "Execution-to-order traceability"
    expectedResult: "returns the OrderIntent via Execution.executesOrder relation, and all OrderLifecycleEvent instances for that order, forming complete audit chain"
    negativeExamples:
      - "execution with no executesOrder relation is rejected (orphaned execution)"
      - "execution for order with no lifecycle events is flagged as incomplete"
    dependsOn: ["Execution", "OrderIntent", "OrderLifecycleEvent"]
    riskLevel: "high"
    status: "draft"
    note: "Critical for trade reconciliation and audit. Analogous to CQ-S4 price-to-valuation traceability."

  - id: "CQ-OE5"
    question: "Given a venue and external status code, what is the canonical lifecycle state?"
    scope: "External status mapping lookup"
    expectedResult: "returns the ExternalOrderStatusMapping.hasCanonicalState for the given venue and external status, with mapping valid time and provenance"
    negativeExamples:
      - "unknown external status code returns 'no mapping found'"
      - "mapping outside valid time range is excluded"
      - "mapping with missing provenance is rejected"
    dependsOn: ["ExternalOrderStatusMapping", "TradingVenue", "OrderLifecycleState"]
    riskLevel: "medium"
    status: "draft"
    note: "M2-PLAN §5.2: ExternalOrderStatusMapping bridges venue codes to canonical states. Each venue has its own mapping set."

  - id: "CQ-OE6"
    question: "Given an order intent, are all state transitions valid according to the canonical state machine?"
    scope: "State machine validation"
    expectedResult: "validates that each OrderLifecycleEvent.previousState matches the prior event's lifecycleState, and that transitions follow valid paths (e.g., Initialized→Submitted→Accepted, not Initialized→Filled)"
    negativeExamples:
      - "Initialized → Filled without intermediate Accepted is rejected"
      - "Filled → PartiallyFilled (backward transition) is rejected"
      - "Canceled → Accepted (terminal to active) is rejected"
      - "event with previousState mismatch is rejected"
    dependsOn: ["OrderLifecycleEvent", "OrderLifecycleState"]
    riskLevel: "high"
    status: "draft"
    note: "State machine constraint per M2-PLAN §6.3. Valid transitions: Initialized→{Submitted,Rejected}, Submitted→{Accepted,Rejected}, Accepted→{PartiallyFilled,Filled,Canceled,Expired}, PartiallyFilled→{Filled,Canceled}. Terminal states: Filled, Canceled, Rejected, Expired."
    sparqlPattern: |
      # Pseudo-SPARQL for state machine validation
      SELECT ?event ?state ?prevState ?priorEventState
      WHERE {
        ?event a fin-orders:OrderLifecycleEvent ;
               fin-orders:transitionsOrder ?order ;
               fin-orders:hasLifecycleState ?state ;
               fin-orders:hasPreviousState ?prevState ;
               m3:validFrom ?eventTime .

        # Find prior event
        OPTIONAL {
          ?priorEvent a fin-orders:OrderLifecycleEvent ;
                      fin-orders:transitionsOrder ?order ;
                      fin-orders:hasLifecycleState ?priorEventState ;
                      m3:validFrom ?priorTime .
          FILTER(?priorTime < ?eventTime)
        }

        # Validate previousState matches priorEventState
        FILTER(?prevState = ?priorEventState || !BOUND(?priorEvent))
      }

  - id: "CQ-OE7"
    question: "Given an execution, what was the commission and liquidity side, and how does it impact position cost basis?"
    scope: "Execution cost breakdown and position derivation"
    expectedResult: "returns Execution.hasCommission, Execution.hasLiquiditySide, Execution.hasExecutionPrice, and Execution.hasExecutionQuantity, enabling cost basis calculation: costBasis = (executionPrice × executionQuantity) + commission"
    negativeExamples:
      - "execution with missing commission is flagged (or assumed zero with warning)"
      - "execution with missing liquidity side is noted (some venues don't report)"
    dependsOn: ["Execution", "LiquiditySide"]
    riskLevel: "medium"
    status: "draft"
    note: "Enables accurate position cost basis tracking. M2-PLAN §6.3: Execution → Position derivation."

  - id: "CQ-OE8"
    question: "Can historical order lifecycle queries at a fixed knowledge-time reproduce past order states?"
    scope: "Knowledge-time reproducibility for order events"
    expectedResult: "query with asOfKnowledge = T1 returns order state as known at T1; after event revision at T2, query with asOfKnowledge = T1 still returns original state, and query with asOfKnowledge = T2 returns revised state"
    negativeExamples:
      - "revision overwrites history without preserving old version (fails reproducibility)"
      - "knowledge-time not recorded (cannot distinguish versions)"
    dependsOn: ["OrderLifecycleEvent", "TemporalFact"]
    riskLevel: "high"
    status: "draft"
    note: "Analogous to CQ-S5 for market data. Critical for order reconciliation and dispute resolution."

  - id: "CQ-OE9"
    question: "Given a time window and venue, return all executions with their order intents and instruments"
    scope: "Execution query with denormalized context"
    expectedResult: "returns all Execution instances where validFrom in [t_start, t_end) and executedAtVenue = venue, joined with executedInstrument and executesOrder, providing complete execution context for reporting"
    negativeExamples:
      - "executions outside time window are excluded"
      - "executions with missing temporal fields are rejected"
      - "executions with missing executesOrder or executedInstrument are flagged as incomplete"
    dependsOn: ["Execution", "OrderIntent", "FinancialInstrument", "TradingVenue"]
    riskLevel: "medium"
    status: "draft"
    note: "Common reporting query for trade blotter and execution analysis."

  - id: "CQ-OE10"
    question: "Can out-of-order or duplicate lifecycle events be detected and reconciled?"
    scope: "Event reconciliation and idempotency"
    expectedResult: "duplicate events (same order, same state, same timestamp, same external ID) are detected and deduplicated; out-of-order events (validFrom earlier than latest event, but knowledgeFrom later) are flagged for reconciliation via OrderLifecycleEvent.reconciliation field"
    negativeExamples:
      - "duplicate events with different state or timestamp are rejected as conflicting"
      - "out-of-order events silently rewrite history without reconciliation flag"
    dependsOn: ["OrderLifecycleEvent", "TemporalFact", "ProvenancedFact"]
    riskLevel: "high"
    status: "draft"
    note: "M2-PLAN §6.3: handles out-of-order, duplicates, missing acknowledgments. Nautilus_trader OrderEvent.reconciliation field."
