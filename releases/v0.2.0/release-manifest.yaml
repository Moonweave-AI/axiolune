# Axiolune M2 Domain Ontology Release v0.2.0

**Release Date**: 2026-07-31
**Status**: approved (authorized by ADR-014 after Round-9 comprehensive review)
**M3 Baseline**: v0.5.1 (commit 1fefc18)
**Stop-Ship**: NO — all §0.1 conditions addressed; OWL-RL consistency and SHACL execution verified

