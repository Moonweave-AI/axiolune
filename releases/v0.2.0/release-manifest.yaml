## Release Scope

11 finance domain modules:
- fin-foundation, fin-market-structure, fin-instruments, fin-market-rules
- fin-market-data, fin-portfolio-positions, fin-orders-execution
- fin-strategy-research, fin-risk, fin-post-trade-operations
- ext-fibo-release-local (adapter)

