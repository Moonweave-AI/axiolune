schemaVersion: "1.0"
fixtures:
  - id: portfolio-v03-negative-portfolio-missing-id
    description: Portfolio cannot be materialized without its stable portfolioId.
    profile: portfolio-positions-v03-shacl
    target: Portfolio
    omit: [portfolioId]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-portfolio-missing-id
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioId

  - id: portfolio-v03-negative-membership-missing-account
    description: PortfolioAccountMembership requires one Foundation FinancialAccount.
    profile: portfolio-positions-v03-shacl
    target: PortfolioAccountMembership
    omit: [memberAccount]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-membership-missing-account
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembership/role/memberAccount

  - id: portfolio-v03-negative-mandate-missing-manager
    description: Management mandate requires exactly one managing Party.
    profile: portfolio-positions-v03-shacl
    target: PortfolioManagementMandate
    omit: [managingParty]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-mandate-missing-manager
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandate/role/managingParty

  - id: portfolio-v03-negative-holding-missing-quantity
    description: HoldingSnapshot requires its canonical holdingQuantity value.
    profile: portfolio-positions-v03-shacl
    target: HoldingSnapshot
    omit: [holdingQuantity]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-holding-missing-quantity
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/holdingQuantity

  - id: portfolio-v03-negative-position-mutable-knowledge-end
    description: PositionSnapshot fact versions cannot carry mutable knowledgeTo.
    profile: portfolio-positions-v03-shacl
    target: PositionSnapshot
    add: [knowledgeTo]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MaxCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-position-mutable-knowledge-end
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeTo

  - id: portfolio-v03-negative-external-basis-missing-observation-stream
    description: External cost basis cannot omit the logical provider observation stream that scopes externalBasisId.
    profile: portfolio-positions-v03-shacl
    target: ExternalCostBasisObservation
    omit: [externalBasisObservationStream]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-external-basis-missing-observation-stream
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalCostBasisObservation/role/externalBasisObservationStream

  - id: portfolio-v03-negative-external-basis-missing-definition
    description: External cost basis cannot omit the exact calculation-definition version used by the source.
    profile: portfolio-positions-v03-shacl
    target: ExternalCostBasisObservation
    omit: [externalBasisDefinition]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-external-basis-missing-definition
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalCostBasisObservation/role/externalBasisDefinition

  - id: portfolio-v03-negative-valuation-both-inputs
    description: PositionValuation cannot select both holding and position inputs.
    profile: portfolio-positions-v03-shacl
    target: PositionValuation
    input: both
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#XoneConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-valuation-both-inputs
      severity: http://www.w3.org/ns/shacl#Violation

  - id: portfolio-v03-negative-valuation-no-input
    description: PositionValuation cannot omit both snapshot input branches.
    profile: portfolio-positions-v03-shacl
    target: PositionValuation
    input: none
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#XoneConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-valuation-no-input
      severity: http://www.w3.org/ns/shacl#Violation

  - id: portfolio-v03-negative-valuation-missing-market-value
    description: PositionValuation requires exactly one M3 MonetaryAmount marketValue.
    profile: portfolio-positions-v03-shacl
    target: PositionValuation
    input: holding
    omit: [marketValue]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/portfolio-v03-negative-valuation-missing-market-value
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/portfolio-positions/marketValue

