# Axiolune M2 Finance — Portfolio & Positions Negative Test Fixtures
# Module: fin-portfolio-positions
# Version: 0.1.0
# Purpose: Demonstrate invalid temporal constraints, missing required fields, and price-to-valuation traceability violations
fixtures:
  - id: portfolio-neg-001
    description: holding snapshot with missing availableFrom (must fail-closed per ADR-012)
    type: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    instance:
      iri: https://axiolune.ai/data/holdings/hold-neg-001
      heldInPortfolio: https://axiolune.ai/data/portfolios/port-001
      heldInstrument: https://axiolune.ai/data/instruments/inst-001
      hasQuantity:
        type: QuantityValue
        hasNumericAmount: '100.00'
        hasUnitCode: share
      hasPositionSide: Long
      validFrom: '2026-01-15T00:00:00Z'
      knowledgeFrom: '2026-01-15T16:00:00Z'
      availableFrom: null
      source: portfolio-service-eod
    expectedResult: rejected
    violationType: missing-availability-time
    note: 'ADR-012 §2.5: availableFrom missing must fail-closed'
  - id: portfolio-neg-002
    description: holding snapshot queried before availableFrom (look-ahead bias)
    type: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    instance:
      iri: https://axiolune.ai/data/holdings/hold-neg-002
      heldInPortfolio: https://axiolune.ai/data/portfolios/port-001
      heldInstrument: https://axiolune.ai/data/instruments/inst-001
      hasQuantity:
        type: QuantityValue
        hasNumericAmount: '100.00'
        hasUnitCode: share
      hasPositionSide: Long
      validFrom: '2026-01-15T00:00:00Z'
      knowledgeFrom: '2026-01-15T16:00:00Z'
      availableFrom: '2026-01-15T20:00:00Z'
      source: portfolio-service-eod
    pitQuery:
      asOfValid: '2026-01-15T12:00:00Z'
      asOfKnowledge: '2026-01-15T18:00:00Z'
      asOfAvailable: '2026-01-15T19:00:00Z'
    expectedResult: rejected
    note: 'PIT query fails: asOfAvailable < availableFrom (prevents future data leakage)'
  - id: portfolio-neg-003
    description: holding snapshot queried before knowledgeFrom
    type: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    instance:
      iri: https://axiolune.ai/data/holdings/hold-neg-003
