    pitQuery:
      asOfValid: '2026-01-15T12:00:00Z'
      asOfKnowledge: '2026-01-15T10:00:00Z'
      asOfAvailable: '2026-01-15T21:00:00Z'
    expectedResult: rejected
    note: 'PIT query fails: asOfKnowledge < knowledgeFrom (knowledge not yet established)'
  - id: portfolio-neg-004
    description: holding snapshot queried before validFrom
    type: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    instance:
      iri: https://axiolune.ai/data/holdings/hold-neg-004
