  - id: portfolio-neg-005
    description: temporal interval inversion (validFrom > validTo)
    type: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    instance:
      iri: https://axiolune.ai/data/holdings/hold-neg-005
