  - id: ordinary-mode-forbids-due-bill-fields
    baseFixtureId: iso4217-and-scoped-executable-market-rules
    expectedViolation: corporate-action-entitlement-mode
    mutation:
      op: replace
      path: /marketRules/clauses/5/entitlementMode
      value: ordinaryRecordPosition
  - id: non-rights-rule-forbids-rights-only-contract
    baseFixtureId: iso4217-and-scoped-executable-market-rules
    expectedViolation: corporate-action-rights-v03-contract
    mutation:
      op: add
      path: /marketRules/rules/4/nonTransferableDirectSubscription
      value: true
  - id: rule-kind-closes-its-legal-clause-subtypes
    baseFixtureId: iso4217-and-scoped-executable-market-rules
