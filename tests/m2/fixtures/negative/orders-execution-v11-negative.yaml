# Orders Execution v1.1.0 (ADR-025) negative staging fixtures.
# Structural negatives for the new v1.1.0 association/object types. These
# fixtures use the instances: dialect with typed predicates. Cardinality /
# minCount enforcement is verified by validate-m2-core --all --strict and the
# generated SHACL shapes; the v1.1.0-specific logical contracts
# (OrderRevisionContract, MatchedTradeContract, ExecutionAllocationConservation,
# OrderIntentRoutingPolicy, FillSnapshotConsistency) are Custom-language
# constraints verified by the strict structural validator (parse-verified for
# the SHACL Tier-2 components; pySHACL enforcement of parameterized components
# is pending a SPARQL-capable engine per ADR-025).

fixtures:
  # --- OrderRevision: cancel kind must NOT carry replacedTerms ---
  - id: oe-v11-neg-revision-cancel-with-replaced-terms
    description: An OrderRevision with revisionKind=cancel must not carry replacedTerms.
    type: https://axiolune.ai/ontology/finance/orders-execution/OrderRevision
    expectedResult: rejected
    expectedViolation:
      component: https://axiolune.ai/ontology/finance/orders-execution/OrderRevisionContract
      focus: https://axiolune.ai/data/orders/v11-neg-revision-cancel-with-terms/version/v1
      severity: http://www.w3.org/ns/shacl#Violation
    instances:
      - iri: https://axiolune.ai/data/orders/v11-neg-revision-cancel-with-terms/version/v1
        type: https://axiolune.ai/ontology/finance/orders-execution/OrderRevision
        revisionOrder: https://axiolune.ai/orders/external/v11-neg-order-1/version/v1
        revisionRequestId: req-cancel-001
        revisionKind: https://axiolune.ai/ontology/finance/orders-execution/RevisionKind/value/cancel
        replacedTerms: limitPrice 100 -> 101
        observedAt: '2026-08-01T09:45:00Z'
        validFrom: '2026-08-01T09:45:00Z'
        knowledgeFrom: '2026-08-01T09:45:01Z'
        availableFrom: '2026-08-01T09:45:02Z'

