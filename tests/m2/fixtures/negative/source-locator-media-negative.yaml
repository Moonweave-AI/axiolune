fixtures:
  - id: source-locator-plain-string
    contract: SourceLocator
    expectedResult: rejected
    violationType: scalar-locator
    instance:
      locator: regulatory/dtc.pdf#page=10
  - id: source-locator-pdf-with-text-media
    contract: SourceLocator
    expectedResult: rejected
    violationType: wrong-media
    instance:
      locator:
        kind: pdfPageRange
        path: regulatory/dtc.pdf
        mediaType: text/plain
        extractorProfileRef: {kind: iri, iri: https://axiolune.ai/toolchain/extractor/v1}
        extractorProfileDigest: sha256:1111111111111111111111111111111111111111111111111111111111111111
        selectionDigest: sha256:2222222222222222222222222222222222222222222222222222222222222222
        startPage: 1
        endPage: 2
  - id: source-locator-cross-branch-field
