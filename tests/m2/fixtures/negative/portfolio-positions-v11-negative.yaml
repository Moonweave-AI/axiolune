# Portfolio Positions v1.1.0 (ADR-029) negative staging fixtures.
# Structural negatives exercising the v1.1.0 contracts. Each fixture states an
# expectedViolation so validate-pit.cjs can confirm rejection. These use the
# instances: dialect. Full SHACL enforcement via the generic fixture-to-TTL
# converter is pending the runner's object-value handling; structural/
# cardinality enforcement is verified by validate-m2-core --strict.

fixtures:
  # --- PositionChange missing changeKind (PositionChangeContract) ---
  - id: pp-v11-neg-change-missing-kind
    type: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChange
    expectedResult: rejected
    expectedViolation:
      constraint: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeContract
      component: MinCount
      message: changeKind is required
    instances:
      - iri: https://axiolune.ai/data/portfolio/v11-neg-change-no-kind/version/v1
        type: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChange
