schemaVersion: "1.0"
fixtures:
  - id: orders-v03-negative-missing-availability
    description: TemporalFact fails closed when availableFrom is absent.
    profile: orders-execution-v03-shacl
    target: OrderIntent
    context: listed
    omit: [availableFrom]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-missing-availability
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom

  - id: orders-v03-negative-intent-both-contexts
    description: OrderIntent cannot select both listing and OTC context branches.
    profile: orders-execution-v03-shacl
    target: OrderIntent
    context: both
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#XoneConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-intent-both-contexts
      severity: http://www.w3.org/ns/shacl#Violation

  - id: orders-v03-negative-intent-missing-quantity
    description: OrderIntent requires exactly one canonical QuantityValue.
    profile: orders-execution-v03-shacl
    target: OrderIntent
    context: listed
    omit: [orderQuantity]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-intent-missing-quantity
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/orderQuantity

  - id: orders-v03-negative-event-missing-order-key
    description: Lifecycle event requires one normalized sourceOrderKey.
    profile: orders-execution-v03-shacl
    target: OrderLifecycleEvent
    context: listed
    omit: [sourceOrderKey]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-event-missing-order-key
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/sourceOrderKey

  - id: orders-v03-negative-lineage-missing-result-intent
    description: A lineage fact must bind at least one exact result OrderIntent version.
    profile: orders-execution-v03-shacl
    target: OrderIntentLineage
    context: listed
    omit: [resultOrderIntent]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-lineage-missing-result-intent
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLineage/role/resultOrderIntent

  - id: orders-v03-negative-lineage-missing-key-digest
    description: Closed endpoint roles cannot substitute for the immutable transformation key digest.
    profile: orders-execution-v03-shacl
    target: OrderIntentLineage
    context: listed
    omit: [orderLineageKeyDigest]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-lineage-missing-key-digest
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/orderLineageKeyDigest

  - id: orders-v03-negative-execution-missing-price
    description: Execution requires exactly one M3 MonetaryAmount price.
    profile: orders-execution-v03-shacl
    target: Execution
    context: listed
    omit: [executionPrice]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-execution-missing-price
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/executionPrice

  - id: orders-v03-negative-execution-missing-principal-party
    description: Execution requires a principal execution Party even when an executing broker is present.
    profile: orders-execution-v03-shacl
    target: Execution
    context: listed
    omit: [executionParty]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-execution-missing-principal-party
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/Execution/role/executionParty

  - id: orders-v03-negative-execution-missing-contra-account
    description: Execution requires an explicit contra FinancialAccount; executingBroker cannot substitute for it.
    profile: orders-execution-v03-shacl
    target: Execution
    context: listed
    omit: [contraAccount]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-execution-missing-contra-account
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/Execution/role/contraAccount

  - id: orders-v03-negative-execution-missing-contra-party
    description: Execution requires an explicit contra Party; executingBroker cannot substitute for it.
    profile: orders-execution-v03-shacl
    target: Execution
    context: listed
    omit: [contraParty]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-execution-missing-contra-party
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/Execution/role/contraParty

  - id: orders-v03-negative-execution-both-contexts
    description: Execution cannot select both listing and OTC context branches.
    profile: orders-execution-v03-shacl
    target: Execution
    context: both
    expectedResult: rejected
    expectedViolations:
      - component: http://www.w3.org/ns/shacl#XoneConstraintComponent
        focus: https://axiolune.ai/data/test/orders-v03-negative-execution-both-contexts
        severity: http://www.w3.org/ns/shacl#Violation
      - component: http://www.w3.org/ns/shacl#XoneConstraintComponent
        focus: https://axiolune.ai/data/test/orders-v03-negative-execution-both-contexts/intent/version/v1
        severity: http://www.w3.org/ns/shacl#Violation

  - id: orders-v03-negative-fee-missing-effect
    description: Fee magnitude cannot replace the separate charge-or-rebate effect truth.
    profile: orders-execution-v03-shacl
    target: Fee
    context: listed
    omit: [feeEffect]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-fee-missing-effect
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/feeEffect

  - id: orders-v03-negative-status-mapping-missing-raw-code
    description: Status mapping without its exact raw provider code is invalid.
    profile: orders-execution-v03-shacl
    target: ExternalOrderStatusMapping
    context: none
    omit: [rawStatusCode]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-status-mapping-missing-raw-code
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/finance/orders-execution/rawStatusCode

  - id: orders-v03-negative-mutable-knowledge-end
    description: Canonical fact versions cannot store a mutable knowledgeTo value.
    profile: orders-execution-v03-shacl
    target: OrderIntent
    context: listed
    add: [knowledgeTo]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MaxCountConstraintComponent
      focus: https://axiolune.ai/data/test/orders-v03-negative-mutable-knowledge-end
      severity: http://www.w3.org/ns/shacl#Violation
      path: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeTo
