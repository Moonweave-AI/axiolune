  - id: price-obs-neg-004-future-valid-time
    description: PIT query returns observation with validFrom after asOfValid
    type: https://axiolune.ai/ontology/finance/market-data/PriceObservation
    instance:
      iri: https://axiolune.ai/data/market-data/price-obs-neg-004
      observedInstrument: https://axiolune.ai/data/instruments/equity-AAPL-US
      hasPriceValue:
        type: MonetaryAmount
        hasNumericAmount: '150.25'
        hasCurrencyCode: USD
      hasPriceKind: Last
      hasCurrencyCode: USD
      validFrom: '2026-07-29T15:00:00Z'
      validTo: '2026-07-29T15:00:01Z'
      knowledgeFrom: '2026-07-29T14:30:00.123Z'
      knowledgeTo: null
      availableFrom: '2026-07-29T14:30:00.500Z'
      source: nasdaq-data-feed
    pitQuery:
      asOfValid: '2026-07-29T14:30:00Z'
      asOfKnowledge: '2026-07-29T14:35:00Z'
      asOfAvailable: '2026-07-29T14:35:00Z'
    expectedResult: rejected
    violationType: future-valid-time
    note: 'CQ-MD1: validFrom <= asOfValid < validTo must hold; this observation is not yet valid'
