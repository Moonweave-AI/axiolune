    profile: market-data-v03-shacl
    target: PriceObservation
    context: listed
    omit: [availableFrom]
    expectedResult: rejected
    expectedViolation:
      component: http://www.w3.org/ns/shacl#MinCountConstraintComponent
      focus: https://axiolune.ai/data/test/market-data-v03-neg-missing-availability
      path: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom
      severity: http://www.w3.org/ns/shacl#Violation

