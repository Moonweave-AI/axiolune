        hasNumericAmount: '150.45'
        hasCurrencyCode: USD
      hasHighPrice:
        type: MonetaryAmount
        hasNumericAmount: '150.3'
        hasCurrencyCode: USD
      hasLowPrice:
        type: MonetaryAmount
        hasNumericAmount: '150.5'
        hasCurrencyCode: USD
      hasClosePrice:
        type: MonetaryAmount
        hasNumericAmount: '150.45'
        hasCurrencyCode: USD
      hasVolume:
        type: QuantityValue
        hasNumericAmount: '125000'
        hasUnitCode: share
      hasBarAggregation: Time
      hasCurrencyCode: USD
      validFrom: '2026-07-29T14:25:00Z'
      validTo: '2026-07-29T14:30:00Z'
