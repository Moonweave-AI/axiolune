# CN market RuleApplicability negatives — gate regression (R4 minor)

fixtures:
  - id: rule-app-neg-missing-availableFrom
    description: "RuleApplicability without availableFrom must reject (ADR-012 fail-closed)"
    type: "https://axiolune.ai/ontology/finance/market-rules/RuleApplicability"
    instance:
      iri: "https://axiolune.ai/data/rules/app-neg-no-avail"
      appliesRule: "https://axiolune.ai/data/rules/rule-tplus1-equity"
      scopedToVenue: "https://axiolune.ai/data/venues/XSHG"
      appliesToInstrumentClass: "Equity"
      hasLifecycleStatus: "active"
      validFrom: "2023-01-01T00:00:00Z"
      knowledgeFrom: "2023-01-01T00:00:00Z"
      source: "synthetic-negative"
    expectedResult: rejected
    expectedViolation: missing-availability-time

  - id: rule-app-neg-interval-inversion
    description: "validTo <= validFrom rejects applicability fact"
    type: "https://axiolune.ai/ontology/finance/market-rules/RuleApplicability"
    instance:
      iri: "https://axiolune.ai/data/rules/app-neg-invert"
      appliesRule: "https://axiolune.ai/data/rules/rule-price-limit-10pct"
      scopedToVenue: "https://axiolune.ai/data/venues/XSHG"
      appliesToInstrumentClass: "Equity"
      hasLifecycleStatus: "active"
      validFrom: "2020-06-01T00:00:00Z"
      validTo: "2020-01-01T00:00:00Z"
      knowledgeFrom: "2020-06-01T00:00:00Z"
      availableFrom: "2020-06-01T00:00:00Z"
      source: "synthetic-negative"
    expectedResult: rejected
    expectedViolation: interval-inversion

  - id: rule-app-neg-future-availability
    description: "asOfAvailable before availableFrom must reject"
    type: "https://axiolune.ai/ontology/finance/market-rules/RuleApplicability"
    instance:
      iri: "https://axiolune.ai/data/rules/app-neg-future"
      appliesRule: "https://axiolune.ai/data/rules/rule-close-today-offset"
      scopedToVenue: "https://axiolune.ai/data/venues/SHFE"
      appliesToInstrumentClass: "Future"
      hasLifecycleStatus: "active"
      validFrom: "2015-01-01T00:00:00Z"
      knowledgeFrom: "2015-01-01T00:00:00Z"
      availableFrom: "2015-06-01T00:00:00Z"
      source: "synthetic-negative"
    pitQuery:
      asOfValid: "2015-03-01T00:00:00Z"
      asOfKnowledge: "2015-03-01T00:00:00Z"
      asOfAvailable: "2015-03-01T00:00:00Z"
    expectedResult: rejected
    expectedViolation: future-availability
