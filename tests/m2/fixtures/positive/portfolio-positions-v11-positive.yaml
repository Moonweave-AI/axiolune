# Portfolio Positions v1.1.0 (ADR-029) positive staging fixtures.
# These fixtures stage the new v1.1.0 object/association types so the CQ
# honesty probes (CQ-PP8..PP15) report staged data rather than contract-only
# guarantees. They use the instances: dialect read by loadStaging() in
# run-all-cq-probes.cjs, with typed predicates on each fact. Structural/
# cardinality enforcement of these types is verified by validate-m2-core
# --all --strict; full SHACL enforcement of the new association types via
# the generic fixture-to-TTL converter is documented as pending the SHACL
# runner's object-value handling (see traceability matrix).

