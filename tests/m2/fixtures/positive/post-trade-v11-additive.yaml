schemaVersion: '1.1'
description: >-
  Post-Trade Operations v1.1.0 additive staging fixtures (ADR-030). Stages the new
  object/association types introduced by the core + profile layering so the CQ
  probes PTO11-PTO19 can report staged counts. Structural/cardinality enforcement
  is verified by validate-m2-core --strict; these fixtures stage instance facts.
fixtures:
  # --- D2: Simple DvP/FoP Settlement Profile + internal transfer (CQ-PTO11) ---
  - id: post-trade-simple-dvp-fop-profile-positive
    expectedResult: accepted
    type: SimpleDvpFopSettlementProfile
    instance:
      records:
        - typeIri: https://axiolune.ai/ontology/finance/post-trade-operations/SimpleDvpFopSettlementProfile
          versionIri: https://example.test/post-trade/profile-simple-dvp-fop/v1
          profileScopeDigest: 'sha256:profile-simple-dvp-fop-v1'
          validFrom: '2026-08-05T00:00:00Z'
          knowledgeFrom: '2026-08-05T00:00:01Z'
          availableFrom: '2026-08-05T00:00:02Z'

  - id: post-trade-internal-transfer-positive
    expectedResult: accepted
    type: SettlementInstruction
    instance:
      instructions:
        - type: SettlementInstruction
          versionIri: https://example.test/post-trade/internal-transfer/v1
          settlementMethod: freeOfPayment
          settlementDate: '2026-08-12'
          settlementSystem: 'INTERNAL-BOOK'
          settlementLocation: 'BOOK-TRANSFER'
          confirmationRef: https://example.test/confirm/ct-1
          affirmationRef: https://example.test/affirm/at-1
          clearingRef: https://example.test/clear/cl-1
          nettingSetRef: https://example.test/netting/ns-1
          validFrom: '2026-08-12T00:00:00Z'
          knowledgeFrom: '2026-08-12T00:00:01Z'
          availableFrom: '2026-08-12T00:00:02Z'

