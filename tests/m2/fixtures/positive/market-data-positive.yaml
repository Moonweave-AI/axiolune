# Canonical Market Data v0.3 SHACL execution fixtures.
# The runner expands each profile row into typed M3-v0.6 RDF: participant-role
# predicates, core MonetaryAmount/QuantityValue nodes, three axes, provenance,
# an exact MarketDataStream version, and (for bars) an exact BarSpecification.
schemaVersion: "1.0"
fixtures:
  - id: market-data-v03-price-listed
    profile: market-data-v03-shacl
    description: complete listed PriceObservation with one direct-unit quotation contract
    target: PriceObservation
    context: listed
    expectedResult: accepted
  - id: market-data-v03-price-otc
    profile: market-data-v03-shacl
    description: complete OTC PriceObservation retaining the exact observed instrument role
    target: PriceObservation
    context: otc
    expectedResult: accepted
  - id: market-data-v03-quote-paired
    profile: market-data-v03-shacl
    description: complete paired QuoteObservation with structural bid and ask fields
    target: QuoteObservation
    context: listed
    expectedResult: accepted
  - id: market-data-v03-trade
    profile: market-data-v03-shacl
    description: TradeObservation with source trade ID, Last kind, exact context, and Quantity
    target: TradeObservation
    context: listed
    expectedResult: accepted
  - id: market-data-v03-trade-bar
    profile: market-data-v03-shacl
    description: TradeBar with distinct OHLCV fields and exact time BarSpecification
    target: TradeBar
    context: listed
    expectedResult: accepted
  - id: market-data-v03-quote-bar
    profile: market-data-v03-shacl
    description: QuoteBar preserving bid and ask OHLC sides under a non-time BarSpecification
    target: QuoteBar
    context: listed
    expectedResult: accepted
  - id: market-data-v03-fx-rate
    profile: market-data-v03-shacl
    description: FXRateObservation with logical base/quote Currency roles and a controlled Quantity rate
    target: FXRateObservation
    context: otc
    expectedResult: accepted
