# M2 Market Data — Positive Test Fixtures
# Valid PriceObservation instances with complete three-axis temporal semantics
fixtures:
  - id: price-obs-001-valid
    description: Valid price observation with complete three-axis time
    type: https://axiolune.ai/ontology/finance/market-data/PriceObservation
    instance:
      iri: https://axiolune.ai/data/market-data/price-obs-001
      observedInstrument: https://axiolune.ai/data/instruments/equity-AAPL-US
      observedAtVenue: https://axiolune.ai/data/venues/XNAS
      hasPriceValue:
        type: MonetaryAmount
        hasNumericAmount: '150.25'
        hasCurrencyCode: USD
      hasPriceKind: Last
      hasCurrencyCode: USD
      validFrom: '2026-07-29T14:30:00Z'
      validTo: '2026-07-29T14:30:01Z'
      knowledgeFrom: '2026-07-29T14:30:00.123Z'
      knowledgeTo: null
      availableFrom: '2026-07-29T14:30:00.500Z'
      availableTo: null
      source: nasdaq-data-feed
      sourceRevision: '1'
      assertionTime: '2026-07-29T14:30:00.123Z'
    expectedResult: accepted
    note: 'Base case: all temporal axes present, no inversions, availableFrom after validFrom'
