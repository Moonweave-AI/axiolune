  - id: risk-v11-risk-category-positive
    expectedResult: accepted
    type: RiskCategory
    instance:
      records:
        - typeIri: https://axiolune.ai/ontology/finance/risk/RiskCategory
          versionIri: https://example.test/risk/category/market/v1
          riskCategoryValue: market
          riskCategoryName: Market Risk
          validFrom: '2026-08-05T00:00:00Z'
          knowledgeFrom: '2026-08-05T00:00:01Z'
          availableFrom: '2026-08-05T00:00:02Z'

