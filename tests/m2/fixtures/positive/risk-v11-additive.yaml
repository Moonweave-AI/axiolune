schemaVersion: '1.1'
description: >-
  fin-risk v1.1.0 additive staging fixtures (ADR-032). Stages the new object/association types
  introduced by the risk-core + measure-spec/profile/implementation split + limit-rule + breach-case
  governance + scenario-shock layering so the CQ probes CQ-R6..CQ-R13 can report staged counts.
  Structural/cardinality enforcement is verified by validate-m2-core --strict; these fixtures stage
  instance facts. Existing v0.3/v1.0.0 risk-v03 fixtures remain valid (additive).
