# Orders Execution v1.1.0 (ADR-025) positive staging fixtures.
# These fixtures stage the new v1.1.0 association/object types so the CQ
# honesty probes (CQ-OE12..OE17) report staged data rather than contract-only
# guarantees. They use the events:/instances: dialect read by loadStaging()
# in run-all-cq-probes.cjs (the order-lifecycle-valid.yaml precedent), with
# typed predicates on each fact. Structural/cardinality enforcement of these
# types is verified by validate-m2-core --all --strict; full SHACL enforcement
# of the new association types via the generic fixture-to-TTL converter is
# documented as pending the SHACL runner's object-value handling (see
# traceability matrix).

fixtures:
  # --- OrderIntentLifecycleEvent (internal, no provider order/stream) ---
  - id: oe-v11-pos-internal-initialized
    type: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLifecycleEvent
    expectedResult: accepted
    instances:
