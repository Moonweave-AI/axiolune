    mutations:
      - {op: set, path: 'executions[0].externalOrderVersionIri', value: 'urn:external-order:rejected:v0'}
    expectedErrorCode: CQ_OE4_TRACE_CHAIN

  - id: cq-oe4-executing-broker-does-not-substitute-contra-party
