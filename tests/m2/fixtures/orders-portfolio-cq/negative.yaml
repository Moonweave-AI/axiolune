schemaVersion: '1.0'
contract: axiolune-m2-cq-orders-portfolio/v1

pivots:
  noon: &noon
    asOfValid: '2026-07-31T12:00:00Z'
    asOfKnowledge: '2026-07-31T12:00:00Z'
    asOfAvailable: '2026-07-31T12:00:00Z'

cases:
  - id: cq-oe2-missing-external-id-rejected
    cqId: CQ-OE2
    query: {orderIntentVersionIri: 'urn:order-intent:accepted:v0', pivot: *noon}
    mutations:
      - {op: delete, path: 'externalOrders[0].externalOrderId'}
    expectedErrorCode: CQ_OE2_EXTERNAL_ID

  - id: cq-oe3-cross-currency-vwap-rejected
    cqId: CQ-OE3
    query: {orderIntentVersionIri: 'urn:order-intent:accepted:v0', pivot: *noon}
    mutations:
      - {op: set, path: 'executions[1].price.currency', value: EUR}
      - {op: set, path: 'executions[1].quotationContractVersionIri', value: 'urn:quotation:aapl-direct-eur:v0'}
    expectedErrorCode: CQ_OE3_PRICE_CURRENCY

  - id: cq-oe3-cross-unit-quantity-rejected
    cqId: CQ-OE3
    query: {orderIntentVersionIri: 'urn:order-intent:accepted:v0', pivot: *noon}
    mutations:
      - {op: set, path: 'executions[1].quantity.unit', value: 'urn:unit:bond'}
      - {op: set, path: 'executions[1].quotationContractVersionIri', value: 'urn:quotation:aapl-direct-bond-unit:v0'}
    expectedErrorCode: CQ_OE3_QUANTITY_UNIT

  - id: cq-oe4-cross-order-trace-rejected
