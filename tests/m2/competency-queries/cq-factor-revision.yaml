schemaVersion: '1.0'
contract: factor-observation-v0.3-immutable-closure
moduleScope:
  - fin-strategy-research
referenceEvidence:
  - reference/project-reference/qlib/docs/advanced/PIT.rst
  - reference/project-reference/qlib/scripts/dump_pit.py
note: >-
  Qlib's linked-record storage layout is conflict evidence, not domain
  vocabulary. These probes execute Axiolune's three-axis FactVersion contract:
  successors point to the exact prior version and interval ends are derived
  from separate closure assertions.
probes:
  - id: CQ-FR1
    question: Which revision is usable before the corrected version becomes known and available?
    asOf:
      asOfValid: '2024-02-15T00:00:00Z'
      asOfKnowledge: '2024-04-20T12:00:00Z'
      asOfAvailable: '2024-04-20T12:00:00Z'
    expected:
      observationIri: https://axiolune.ai/data/factor-observation/roe/AAPL/2024Q1/provider-roe/version/0
      factorValue: '0.185'
      sourceRevision: v1
    assertNotTerminal: true

  - id: CQ-FR2
    question: Which revision is usable after the corrected version becomes known and available?
    asOf:
      asOfValid: '2024-02-15T00:00:00Z'
      asOfKnowledge: '2024-05-15T12:00:00Z'
      asOfAvailable: '2024-05-15T12:00:00Z'
    expected:
      observationIri: https://axiolune.ai/data/factor-observation/roe/AAPL/2024Q1/provider-roe/version/1
      factorValue: '0.191'
      sourceRevision: v2

  - id: CQ-FR3
    question: Does the query fail closed when availability is earlier than the first usable version?
    asOf:
      asOfValid: '2024-02-15T00:00:00Z'
      asOfKnowledge: '2024-04-20T12:00:00Z'
      asOfAvailable: '2024-04-15T08:00:00Z'
    expectedResult: empty
