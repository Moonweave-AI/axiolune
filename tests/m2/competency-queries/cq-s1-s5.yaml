# Legacy Slice A staging probes.
#
# This file drives scripts/domain/run-slice-a.cjs only. It is not the v0.3
# release CQ registry and cannot satisfy the MaterializationBatchRun,
# batch-scoped PITValidationRequest, ReplayReport, or evidence-ledger contract.
schemaVersion: '1.0'
status: draft-legacy-staging
runner:
  implementation: scripts/domain/run-slice-a.cjs
  capability: minimal-slot-interpreter-v0

moduleScope:
  - fin-foundation
  - fin-instruments
  - fin-market-structure
  - fin-market-data
  - fin-portfolio-positions

materializationRun: https://axiolune.ai/run/finance/synthetic/slice-a/2026-07-30-r1
mapping: https://axiolune.ai/mapping/finance/synthetic/slice-a-v0.1

probes:
  - id: CQ-S1
    question: Does the synthetic ISIN and internal identifier resolve to one instrument and issuer?
    asOf:
      asOfValid: '2026-07-29T14:30:00Z'
      asOfKnowledge: '2026-07-29T21:05:00Z'
      asOfAvailable: '2026-07-29T21:05:00Z'
    expected:
      instrumentIri: https://axiolune.ai/data/instruments/AX-EQ-AAPL
      isin: US0378331005
      issuerName: Apple Inc.
    negative:
      description: duplicate identifier assignment is rejected by the legacy uniqueness check
      expectedResult: rejected-or-isolated

  - id: CQ-S2
    disposition: legacy-local-probe; canonical v0.3 CQ-S2 is an alias of CQ-MD1
    question: Which synthetic last price is PIT-eligible under all three pivots?
    asOf:
      asOfValid: '2026-07-29T14:30:00Z'
      asOfKnowledge: '2026-07-29T14:30:00.123Z'
      asOfAvailable: '2026-07-29T14:30:00.500Z'
    expected:
      priceObsIri: https://axiolune.ai/data/market-data/px-aapl-001
      priceValue: '150.25'
      priceKind: Last
    negative:
      description: an observation arriving after asOfAvailable is not returned
      asOfAvailable: '2026-07-29T14:30:00.100Z'
      expectedResult: empty-or-rejected

  - id: CQ-S3
    question: Which synthetic holding is PIT-eligible under all three pivots?
    asOf:
      asOfValid: '2026-07-29T12:00:00Z'
      asOfKnowledge: '2026-07-29T21:00:00Z'
      asOfAvailable: '2026-07-29T21:05:00Z'
    expected:
      holdingIri: https://axiolune.ai/data/holdings/hold-001
      instrumentInternalId: AX-EQ-AAPL
      quantity: '100'
    negative:
      description: an inverted interval is rejected by the legacy PIT check

  - id: CQ-S4
    question: Which synthetic price and currency were used by the valuation?
    asOf:
      asOfValid: '2026-07-29T21:05:00Z'
      asOfKnowledge: '2026-07-29T21:05:00Z'
      asOfAvailable: '2026-07-29T21:05:00Z'
    expected:
      valuationIri: https://axiolune.ai/data/valuations/val-001
      priceObsIri: https://axiolune.ai/data/market-data/px-aapl-001
      marketValue: '15025.00'
      currency: USD
    negative:
      description: a valuation input with a future availability revision is rejected
      expectedResult: rejected

  - id: CQ-S5
    question: Does the fixed staging graph replay to identical facts?
    expected:
      replay: identical staging facts
    negative:
      description: a semantic append changes the graph while remaining invisible to an earlier PIT pivot
      expectedResult: stable-historical-answer

statusNote: >-
  Passing these legacy probes proves only the staging interpreter behaviors
  above. The v0.3 release gate uses the discovered CQ cards and strict batch
  evidence; no module approval may be inferred from this file.
