# Slice A competency probes CQ-S1..S5 (M2-PLAN §6.2)
# Status: draft executable contract.
# Runner: scripts/domain/run-slice-a.cjs — minimal-slot-interpreter-v0
#   interprets mappings/finance/synthetic/slice-a-semantic-mapping.yaml
# Honesty: CQ-S5 digest = deterministic JSON canon of interpreter facts (NOT RDF URDNA2015).
# SPARQL/SHACL engine against RDF staging graph: pending Adopt of SHACL-ENGINE-PIN.

moduleScope:
  - fin-foundation
  - fin-instruments
  - fin-market-structure
  - fin-market-data
  - fin-portfolio-positions

materializationRun: "https://axiolune.ai/run/finance/synthetic/slice-a/2026-07-30-r1"
mapping: "https://axiolune.ai/mapping/finance/synthetic/slice-a-v0.1"

probes:
  - id: CQ-S1
    question: "某个 ISIN 与内部标识是否指向同一 Instrument，并由谁发行？"
    dependsOn:
      - "https://axiolune.ai/ontology/finance/instruments/FinancialInstrument"
      - "https://axiolune.ai/ontology/finance/instruments/isIssuedBy"
      - "https://axiolune.ai/ontology/finance/foundation/ISIN"
    asOf:
      asOfValid: "2026-07-29T14:30:00Z"
      asOfKnowledge: "2026-07-29T21:05:00Z"
      asOfAvailable: "2026-07-29T21:05:00Z"
    expected:
      instrumentIri: "https://axiolune.ai/data/instruments/AX-EQ-AAPL"
      isin: "US0378331005"
      issuerName: "Apple Inc."
    negative:
      description: "duplicate/conflicting identifier assignment must not silently merge"
      expectedResult: rejected-or-isolated

  - id: CQ-S2
    question: "给定 listing、场所和三轴 as-of，可使用的指定类型价格是什么？"
    dependsOn:
      - "https://axiolune.ai/ontology/finance/market-data/PriceObservation"
    asOf:
      asOfValid: "2026-07-29T14:30:00Z"
      asOfKnowledge: "2026-07-29T14:30:00.123Z"
      asOfAvailable: "2026-07-29T14:30:00.500Z"
    expected:
      priceObsIri: "https://axiolune.ai/data/market-data/px-aapl-001"
      priceValue: "150.25"
      priceKind: "Last"
    negative:
      description: "asOfAvailable before availableFrom must not return the observation"
      asOfAvailable: "2026-07-29T14:30:00.100Z"
      expectedResult: empty-or-rejected

  - id: CQ-S3
    question: "在指定三轴 as-of 下，组合持有哪些工具、数量是多少？"
    dependsOn:
      - "https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot"
    asOf:
      asOfValid: "2026-07-29T12:00:00Z"
      asOfKnowledge: "2026-07-29T21:00:00Z"
      asOfAvailable: "2026-07-29T21:05:00Z"
    expected:
      holdingIri: "https://axiolune.ai/data/holdings/hold-001"
      instrumentInternalId: "AX-EQ-AAPL"
      quantity: "100"
    negative:
      description: "interval inversion or expired availability rejects snapshot"
      fixture: "tests/m2/fixtures/negative/portfolio-positions-negative.yaml"

  - id: CQ-S4
    question: "组合估值使用了哪一个价格事实、哪个币种和哪个估值规则？"
    dependsOn:
      - "https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation"
    asOf:
      asOfValid: "2026-07-29T21:05:00Z"
      asOfKnowledge: "2026-07-29T21:05:00Z"
      asOfAvailable: "2026-07-29T21:05:00Z"
    expected:
      valuationIri: "https://axiolune.ai/data/valuations/val-001"
      priceObsIri: "https://axiolune.ai/data/market-data/px-aapl-001"
      marketValue: "15025.00"
      currency: "USD"
    negative:
      description: "valuation that references a future-revised price must fail"
      expectedResult: rejected

  - id: CQ-S5
    question: "同一来源修订后，固定历史请求是否仍可重放？"
    dependsOn:
      - "https://axiolune.ai/run/finance/synthetic/slice-a/2026-07-30-r1"
    fixedInputs:
      mappingDigest: "sha256:pending"
      snapshotId: "slice-a-2026-07-30-r1"
      asOfValid: "2026-07-29T14:30:00Z"
      asOfKnowledge: "2026-07-29T21:05:00Z"
      asOfAvailable: "2026-07-29T21:05:00Z"
    expected:
      replay: "RDF-isomorphic staging graph for identical digests"
    negative:
      description: "appending future rows must not change historical answer under fixed digests"
      expectedResult: fail-determinism-check

statusNote: "Probes are the CQ contract; full SPARQL engine execution is P1. Presence of this file is required for Slice A evidence pack."
