    bucketQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/bucketQuantity
      namespace: fin-risk
      localName: bucketQuantity
      label: Bucket Quantity
      definition: required structured Quantity scalar for one risk bucket
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    measuredMoney:
      iri: https://axiolune.ai/ontology/finance/risk/measuredMoney
      namespace: fin-risk
      localName: measuredMoney
