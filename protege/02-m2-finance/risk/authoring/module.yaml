    closureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/risk/closureProbeDigest
      namespace: fin-risk
      localName: closureProbeDigest
      label: Closure Probe Digest
      definition: SHA-256 digest of the executable closure probe and its frozen parameters
