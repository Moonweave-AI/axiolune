    limitMoney:
      iri: https://axiolune.ai/ontology/finance/risk/limitMoney
      namespace: fin-risk
      localName: limitMoney
      label: Limit Money
      definition: optional canonical Money threshold selected by the limit value xone
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
    limitQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/limitQuantity
      namespace: fin-risk
      localName: limitQuantity
      label: Limit Quantity
      definition: optional canonical Quantity threshold selected by the limit value xone
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    approvalDecisionRef:
      iri: https://axiolune.ai/ontology/finance/risk/approvalDecisionRef
      namespace: fin-risk
      localName: approvalDecisionRef
      label: Approval Decision Reference
      definition: absolute immutable reference to the human or governed limit-approval decision
      valueType: uri
    approvalDecisionDigest:
      iri: https://axiolune.ai/ontology/finance/risk/approvalDecisionDigest
      namespace: fin-risk
      localName: approvalDecisionDigest
      label: Approval Decision Digest
      definition: SHA-256 digest of the exact limit-approval decision record
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    approvedBy:
      iri: https://axiolune.ai/ontology/finance/risk/approvedBy
      namespace: fin-risk
      localName: approvedBy
      label: Approved By
      definition: absolute principal IRI that approved the limit version
      valueType: uri
    approvedAt:
      iri: https://axiolune.ai/ontology/finance/risk/approvedAt
      namespace: fin-risk
      localName: approvedAt
      label: Approved At
      definition: explicit-timezone instant at which the limit version was approved
      valueType: instant
    evaluationResult:
      iri: https://axiolune.ai/ontology/finance/risk/evaluationResult
      namespace: fin-risk
      localName: evaluationResult
      label: Evaluation Result
      definition: required closed result of a risk-limit evaluation
      valueType: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult
    evaluationReason:
      iri: https://axiolune.ai/ontology/finance/risk/evaluationReason
      namespace: fin-risk
      localName: evaluationReason
      label: Evaluation Reason
      definition: optional deterministic reason explaining an indeterminate evaluation
      valueType: string
    evaluatorDigest:
      iri: https://axiolune.ai/ontology/finance/risk/evaluatorDigest
      namespace: fin-risk
      localName: evaluatorDigest
      label: Evaluator Digest
      definition: SHA-256 digest of the executable comparison implementation
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
  identifierTypes: {}
  codeLists:
    RiskLimitEvaluationResult:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult
      namespace: fin-risk
      localName: RiskLimitEvaluationResult
      label: Risk Limit Evaluation Result
      definition: >-
        closed classification that makes a successful comparison, detected breach, or evidence-limited indeterminate
        conclusion explicit
      vocabulary: Axiolune Risk Limit Evaluation Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult/value/withinLimit
          notation: withinLimit
          label: Within Limit
          definition: compatible measurement is within or equal to the approved threshold
        - iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult/value/breach
          notation: breach
          label: Breach
          definition: compatible measurement exceeds the approved threshold
        - iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult/value/indeterminate
          notation: indeterminate
          label: Indeterminate
          definition: comparison cannot conclude within-limit or breach from complete admissible evidence
  constraints:
    RiskMeasureDefinitionRepresentationXone:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinitionRepresentationXone
      namespace: fin-risk
      localName: RiskMeasureDefinitionRepresentationXone
      label: Risk Measure Definition Representation Xone
      definition: requires exactly one Money currency, Quantity unit, or bucket schema branch
      constraintType: Cardinality
      scope: Object
      expression:
        language: SHACL
        expression: sh:xone(definitionCurrency,definitionUnit,definitionBucketSchema)
      severity: Error
      message: RiskMeasureDefinition must select exactly one result representation
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
    RiskMeasurementValueXone:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementValueXone
      namespace: fin-risk
      localName: RiskMeasurementValueXone
      label: Risk Measurement Value Xone
      definition: requires exactly one Money, Quantity, or bucket-set result branch
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(measuredMoney,measuredQuantity,measurementBucketSet)
      severity: Error
      message: RiskMeasurement must carry exactly one result representation
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
    RiskLimitValueXone:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitValueXone
      namespace: fin-risk
      localName: RiskLimitValueXone
      label: Risk Limit Value Xone
      definition: requires exactly one Money, Quantity, or bucket-set threshold branch
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(limitMoney,limitQuantity,limitBucketSet)
      severity: Error
      message: RiskLimit must carry exactly one threshold representation
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimit
    RiskMeasureDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinitionContract
      namespace: fin-risk
      localName: RiskMeasureDefinitionContract
      label: Risk Measure Definition Contract
      definition: >-
        freezes logical identity, method/version/digests, parameter dimensions, and representation-specific currency,
        unit, or bucket-schema evidence
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(riskMeasureId); method/version/implementation/input/output digests immutable; confidenceLevel is
          dimensionless and in (0,1); window and horizon use duration units; xone branch fixes every result
      severity: Error
      message: risk-measure definition identity, parameters, or result dimension is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
    RiskBucketSchemaContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSchemaContract
      namespace: fin-risk
      localName: RiskBucketSchemaContract
      label: Risk Bucket Schema Contract
      definition: freezes schema identity, dimension, key contract, and Quantity unit
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: logicalKey(bucketSchemaId); dimension and unit are absolute IRIs; key contract digest is immutable
      severity: Error
      message: risk bucket schema identity or dimension contract is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
    RiskBucketSetClosureContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSetClosureContract
      namespace: fin-risk
      localName: RiskBucketSetClosureContract
      label: Risk Bucket Set Closure Contract
      definition: >-
        requires the complete unique current RiskBucketValue version set, exact count, canonical digest, successful
        probe, and one exact schema version
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(bucketSetId,generatingContextRef); closureCompleted=true; unique current bucket keys;
          bucketValueCount and bucketValueSetDigest equal the completed reverse-membership probe
      severity: Error
      message: RiskBucketSet membership closure is incomplete, duplicated, or stale
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
    RiskBucketValueContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketValueContract
      namespace: fin-risk
      localName: RiskBucketValueContract
      label: Risk Bucket Value Contract
      definition: requires key, dimension, unit, and generating context to equal the governing set/schema
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(bucketValueSet version IRI,bucketKey); bucketValueSchema equals the set schema; dimension equals
          exact schema dimension; Quantity unit equals schema unit; generatingContextRef equals set generatingContextRef
      severity: Error
      message: RiskBucketValue does not conform to its exact completed set and schema
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskBucketValue
    RiskMeasurementContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementContract
      namespace: fin-risk
      localName: RiskMeasurementContract
      label: Risk Measurement Contract
      definition: >-
        requires an explicit scope, completed strictly prior input context, and representation/dimension compatibility
        with the exact measure definition
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          atLeastOne(measurementPortfolio,measurementAccount,measurementPosition); inputContextCompleted=true;
          inputContextRef precedes and differs from generatingContextRef; selected value branch equals definition
          branch; Money currency, Quantity unit, or bucket schema must match exactly
      severity: Error
      message: RiskMeasurement scope, context evidence, or value dimension is incompatible
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
    RiskLimitContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitContract
      namespace: fin-risk
      localName: RiskLimitContract
      label: Risk Limit Contract
      definition: >-
        requires stable owner-scoped identity, at least one explicit scope, immutable approval evidence, and a threshold
        branch compatible with its exact measure definition
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(limitOwner logical IRI,limitId); atLeastOne(limitPortfolio,limitAccount,limitPosition); approvedAt
          within valid interval; approval digest immutable; selected threshold branch and currency/unit/schema equal
          definition
      severity: Error
      message: RiskLimit identity, scope, approval, or threshold dimension is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimit
    RiskLimitEvaluationContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationContract
      namespace: fin-risk
      localName: RiskLimitEvaluationContract
      label: Risk Limit Evaluation Contract
      definition: >-
        compares only compatible exact versions and makes the deterministic withinLimit, breach, or evidence-limited
        indeterminate result explicit
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(evaluatedMeasurement version IRI,evaluatedLimit version IRI); same definition and scope; same
          representation and currency/unit/schema; withinLimit iff value<=threshold; breach iff value>threshold;
          indeterminate requires evaluationReason
      severity: Error
      message: RiskLimitEvaluation versions, compatibility, identity, or result is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
    LimitBreachContract:
      iri: https://axiolune.ai/ontology/finance/risk/LimitBreachContract
      namespace: fin-risk
      localName: LimitBreachContract
      label: Limit Breach Contract
      definition: >-
        requires a breach fact if and only if the evaluation result is breach and fixes exact role/context equality plus
        the canonical version key
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exists iff breachEvaluation.evaluationResult=breach; logicalKey(breachEvaluation version IRI);
          breachMeasurement=evaluation.measurement; breachLimit=evaluation.limit;
          generatingContextRef=evaluation.generatingContextRef;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: LimitBreach does not exactly close its breach evaluation
      targetElement: https://axiolune.ai/ontology/finance/risk/LimitBreach
    ScenarioDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioDefinitionContract
      namespace: fin-risk
      localName: ScenarioDefinitionContract
      label: Scenario Definition Contract
      definition: >-
        requires stable scenario identity, immutable shock parameter digest, and source evidence locked to the version
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(scenarioDefinitionId); shockParameterDigest immutable; sourceArtifactDigest matches shock digest
          evidence; valid interval non-zero
      severity: Error
      message: ScenarioDefinition identity, shock digest, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
    StressTestRunContract:
      iri: https://axiolune.ai/ontology/finance/risk/StressTestRunContract
      namespace: fin-risk
      localName: StressTestRunContract
      label: Stress Test Run Contract
      definition: >-
        requires exact scenario, portfolio, and output measurement versions plus generating context for replay
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(stressRunId); stressRunScenario exact version; stressRunPortfolio logical identity;
          stressRunOutput exact measurement version; generatingContextRef present
      severity: Error
      message: StressTestRun scenario, portfolio, output, or context linkage is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/StressTestRun
  relationUses:
