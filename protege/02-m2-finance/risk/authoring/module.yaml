      definition: optional canonical Money result selected by the measurement value xone
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
    measuredQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/measuredQuantity
      namespace: fin-risk
      localName: measuredQuantity
      label: Measured Quantity
      definition: optional canonical Quantity result selected by the measurement value xone
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    inputContextCompleted:
      iri: https://axiolune.ai/ontology/finance/risk/inputContextCompleted
      namespace: fin-risk
      localName: inputContextCompleted
      label: Input Context Completed
      definition: true only when the strictly prior input context record is complete and immutable
      valueType: boolean
    limitId:
      iri: https://axiolune.ai/ontology/finance/risk/limitId
      namespace: fin-risk
      localName: limitId
      label: Limit ID
      definition: owner-scoped stable lexical identifier of a risk limit
      valueType: string
