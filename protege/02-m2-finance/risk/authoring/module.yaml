module:
  moduleIri: https://axiolune.ai/ontology/finance/risk
  baseIri: https://axiolune.ai/ontology/finance/risk/
  preferredPrefix: fin-risk
  version: 1.0.0
  label: Risk
  definition: >-
    versioned risk-measure specifications, completed measurements, compatible limits, explicit limit evaluations,
    bucketed results, and breach facts whose values, scopes, model inputs, and run provenance remain point-in-time
    reproducible
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    RiskMeasureDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      namespace: fin-risk
      localName: RiskMeasureDefinition
      label: Risk Measure Definition
      definition: >-
        versioned specification of one risk measure whose method, implementation, parameterization, input/output
        contracts, and exactly one Money, Quantity, or bucket-schema result dimension are fixed independently of any
        computed result
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskMeasureId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/methodRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/methodVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/methodDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/observationWindow
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/confidenceLevel
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskHorizon
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/samplingMethodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/benchmarkRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/definitionUnit
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskBucketSchema:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      namespace: fin-risk
      localName: RiskBucketSchema
      label: Risk Bucket Schema
      definition: >-
        versioned schema fixing the dimension, admissible bucket-key contract, and Quantity unit shared by one complete
        bucketed risk result
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketSchemaId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketDimensionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketKeyContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketUnit
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskBucketSet:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
      namespace: fin-risk
      localName: RiskBucketSet
      label: Risk Bucket Set
      definition: >-
        completed versioned closure over every current RiskBucketValue version belonging to one exact RiskBucketSchema
        version, with an ordered-set digest and successful completeness probe
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketSetId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketValueCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketValueSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/closureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/closureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/closureCompleted
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ScenarioDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
      namespace: fin-risk
      localName: ScenarioDefinition
      label: Scenario Definition
      definition: >-
        versioned stress or what-if scenario whose shock parameters are fixed independently of any stress-test run
        or resulting measurement
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockParameterDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    RiskBucketValue:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketValue
      namespace: fin-risk
      localName: RiskBucketValue
      label: Risk Bucket Value
      definition: >-
        one temporal/provenanced scalar member of a complete risk bucket set, identified within that set by an explicit
        dimension and bucket key
      participantRoles:
        - id: bucketValueSet
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
          minCount: 1
          maxCount: 1
          label: bucket value set
          definition: exact RiskBucketSet version whose closure contains this value version
        - id: bucketValueSchema
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
          minCount: 1
          maxCount: 1
          label: bucket value schema
          definition: exact RiskBucketSchema version copied from the governing set for executable validation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketValueDimensionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskMeasurement:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
      namespace: fin-risk
      localName: RiskMeasurement
      label: Risk Measurement
      definition: >-
        completed point-in-time result for one exact risk-measure definition and at least one explicit portfolio,
        account, or position scope, carrying exactly one Money, Quantity, or complete RiskBucketSet representation and
        strictly prior input/run evidence
      participantRoles:
        - id: measurementDefinition
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
          minCount: 1
          maxCount: 1
          label: measurement definition
          definition: exact RiskMeasureDefinition version used to compute the result
        - id: measurementPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 0
          maxCount: 1
          label: measurement portfolio
          definition: optional logical Portfolio identity included in the measurement scope
        - id: measurementAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: measurement account
          definition: optional logical FinancialAccount identity included in the measurement scope
        - id: measurementPosition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: measurement position
          definition: optional exact PositionSnapshot version included in the measurement scope
        - id: measurementMarketDataStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 0
          maxCount: 1
          label: measurement market data stream
          definition: optional exact source-locked MarketDataStream version used by the input context
        - id: measurementBucketSet
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
          minCount: 0
          maxCount: 1
          label: measurement bucket set
          definition: optional exact completed RiskBucketSet version selected by the bucket branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/measuredMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/measuredQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputContextCompleted
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimit:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimit
      namespace: fin-risk
      localName: RiskLimit
      label: Risk Limit
      definition: >-
        approved temporal/provenanced threshold fact binding one exact RiskMeasureDefinition version, at least one
        explicit scope, an owner, and exactly one Money, Quantity, or complete bucket-set representation
      participantRoles:
        - id: limitDefinition
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
          minCount: 1
          maxCount: 1
          label: limit definition
          definition: exact RiskMeasureDefinition version that fixes the threshold representation
        - id: limitPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 0
          maxCount: 1
          label: limit portfolio
          definition: optional logical Portfolio identity included in the limit scope
        - id: limitAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: limit account
          definition: optional logical FinancialAccount identity included in the limit scope
        - id: limitPosition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: limit position
          definition: optional exact PositionSnapshot version included in the limit scope
        - id: limitOwner
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: limit owner
          definition: logical Party identity accountable for the approved limit
        - id: limitBucketSet
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
          minCount: 0
          maxCount: 1
          label: limit bucket set
          definition: optional exact complete RiskBucketSet version selected by the bucket branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/limitId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/limitMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/limitQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvalDecisionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvalDecisionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvedBy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimitEvaluation:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
      namespace: fin-risk
      localName: RiskLimitEvaluation
      label: Risk Limit Evaluation
      definition: >-
        explicit deterministic conclusion for one exact RiskMeasurement version and one compatible exact RiskLimit
        version, with withinLimit, breach, or indeterminate represented as a required code value rather than absence
      participantRoles:
        - id: evaluatedMeasurement
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 1
          maxCount: 1
          label: evaluated measurement
          definition: exact RiskMeasurement version evaluated against the limit
        - id: evaluatedLimit
          range: https://axiolune.ai/ontology/finance/risk/RiskLimit
          minCount: 1
          maxCount: 1
          label: evaluated limit
          definition: exact compatible RiskLimit version used by the evaluation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/evaluationResult
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/evaluationReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/evaluatorDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LimitBreach:
      iri: https://axiolune.ai/ontology/finance/risk/LimitBreach
      namespace: fin-risk
      localName: LimitBreach
      label: Limit Breach
      definition: >-
        immutable breach fact that exists only for a breach evaluation and repeats that evaluation's exact measurement,
        exact limit, and generating context without introducing a second threshold or result truth
      participantRoles:
        - id: breachEvaluation
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
          minCount: 1
          maxCount: 1
          label: breach evaluation
          definition: exact RiskLimitEvaluation version whose result is breach
        - id: breachMeasurement
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 1
          maxCount: 1
          label: breach measurement
          definition: exact RiskMeasurement version copied from the evaluation
        - id: breachLimit
          range: https://axiolune.ai/ontology/finance/risk/RiskLimit
          minCount: 1
          maxCount: 1
          label: breach limit
          definition: exact RiskLimit version copied from the evaluation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StressTestRun:
      iri: https://axiolune.ai/ontology/finance/risk/StressTestRun
      namespace: fin-risk
      localName: StressTestRun
      label: Stress Test Run
      definition: >-
        completed stress test applying one exact ScenarioDefinition version to a portfolio scope and recording the
        output RiskMeasurement version produced by the run
      participantRoles:
        - id: stressRunScenario
          range: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
          minCount: 1
          maxCount: 1
          label: stress run scenario
          definition: exact ScenarioDefinition version whose shock parameters were applied
        - id: stressRunPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: stress run portfolio
          definition: logical Portfolio identity whose holdings were shocked
        - id: stressRunOutput
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 1
          maxCount: 1
          label: stress run output
          definition: exact RiskMeasurement version produced by the stress run
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/stressRunId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    definitionCurrency:
      iri: https://axiolune.ai/ontology/finance/risk/definitionCurrency
      namespace: fin-risk
      localName: definitionCurrency
      label: Definition Currency
      definition: optional Money-branch Currency logical identity fixed by a RiskMeasureDefinition version
      domain: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    definitionBucketSchema:
      iri: https://axiolune.ai/ontology/finance/risk/definitionBucketSchema
      namespace: fin-risk
      localName: definitionBucketSchema
      label: Definition Bucket Schema
      definition: optional bucket-branch RiskBucketSchema version fixed by a RiskMeasureDefinition
      domain: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      range: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      characteristics:
        - functional
    bucketSetSchema:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSetSchema
      namespace: fin-risk
      localName: bucketSetSchema
      label: Bucket Set Schema
      definition: exact RiskBucketSchema version governing a complete RiskBucketSet version
      domain: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
      range: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      characteristics:
        - functional
  attributeTypes:
    riskMeasureId:
      iri: https://axiolune.ai/ontology/finance/risk/riskMeasureId
      namespace: fin-risk
      localName: riskMeasureId
      label: Risk Measure ID
      definition: authority-scoped stable lexical identifier of a risk-measure definition
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    methodRef:
      iri: https://axiolune.ai/ontology/finance/risk/methodRef
      namespace: fin-risk
      localName: methodRef
      label: Method Reference
      definition: absolute reference identifying the declared calculation method
      valueType: uri
    methodVersion:
      iri: https://axiolune.ai/ontology/finance/risk/methodVersion
      namespace: fin-risk
      localName: methodVersion
      label: Method Version
      definition: immutable version label of the declared calculation method
      valueType: string
    methodDigest:
      iri: https://axiolune.ai/ontology/finance/risk/methodDigest
      namespace: fin-risk
      localName: methodDigest
      label: Method Digest
      definition: SHA-256 digest of the method specification selected by the definition
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    observationWindow:
      iri: https://axiolune.ai/ontology/finance/risk/observationWindow
      namespace: fin-risk
      localName: observationWindow
      label: Observation Window
      definition: optional Quantity-valued historical observation window used by the method
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    confidenceLevel:
      iri: https://axiolune.ai/ontology/finance/risk/confidenceLevel
      namespace: fin-risk
      localName: confidenceLevel
      label: Confidence Level
      definition: optional dimensionless Quantity confidence level required by a statistical measure
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    riskHorizon:
      iri: https://axiolune.ai/ontology/finance/risk/riskHorizon
      namespace: fin-risk
      localName: riskHorizon
      label: Risk Horizon
      definition: optional duration Quantity over which the risk result is interpreted
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    samplingMethodRef:
      iri: https://axiolune.ai/ontology/finance/risk/samplingMethodRef
      namespace: fin-risk
      localName: samplingMethodRef
      label: Sampling Method Reference
      definition: optional absolute reference to the sampling or resampling contract
      valueType: uri
    benchmarkRef:
      iri: https://axiolune.ai/ontology/finance/risk/benchmarkRef
      namespace: fin-risk
      localName: benchmarkRef
      label: Benchmark Reference
      definition: optional absolute reference to the benchmark version used by the measure
      valueType: uri
    scenarioRef:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioRef
      namespace: fin-risk
      localName: scenarioRef
      label: Scenario Reference
      definition: optional absolute reference to the scenario version used by the measure
      valueType: uri
    scenarioDefinitionId:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioDefinitionId
      namespace: fin-risk
      localName: scenarioDefinitionId
      label: Scenario Definition ID
      definition: authority-scoped stable lexical identifier of a stress scenario definition
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    shockParameterDigest:
      iri: https://axiolune.ai/ontology/finance/risk/shockParameterDigest
      namespace: fin-risk
      localName: shockParameterDigest
      label: Shock Parameter Digest
      definition: SHA-256 digest of the canonical shock parameter payload for the scenario
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    stressRunId:
      iri: https://axiolune.ai/ontology/finance/risk/stressRunId
      namespace: fin-risk
      localName: stressRunId
      label: Stress Run ID
      definition: authority-scoped stable lexical identifier of one stress test run
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    definitionUnit:
      iri: https://axiolune.ai/ontology/finance/risk/definitionUnit
      namespace: fin-risk
      localName: definitionUnit
      label: Definition Unit
      definition: optional Quantity-branch unit IRI fixed by a RiskMeasureDefinition version
      valueType: uri
    implementationDigest:
      iri: https://axiolune.ai/ontology/finance/risk/implementationDigest
      namespace: fin-risk
      localName: implementationDigest
      label: Implementation Digest
      definition: SHA-256 digest of the executable implementation selected by the definition
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    inputContractDigest:
      iri: https://axiolune.ai/ontology/finance/risk/inputContractDigest
      namespace: fin-risk
      localName: inputContractDigest
      label: Input Contract Digest
      definition: SHA-256 digest of the canonical risk-model input contract
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    outputContractDigest:
      iri: https://axiolune.ai/ontology/finance/risk/outputContractDigest
      namespace: fin-risk
      localName: outputContractDigest
      label: Output Contract Digest
      definition: SHA-256 digest of the canonical risk-model output contract
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    bucketSchemaId:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSchemaId
      namespace: fin-risk
      localName: bucketSchemaId
      label: Bucket Schema ID
      definition: stable lexical identifier of a risk bucket schema
      valueType: string
