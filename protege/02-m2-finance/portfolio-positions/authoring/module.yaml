  identifierTypes: {}
  codeLists:
    PositionSourceKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind
      namespace: fin-portfolio
      localName: PositionSourceKind
      label: Position Source Kind
      definition: Closed source branch for holding and position snapshots.
      vocabulary: Position Source Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/externalReported
          notation: externalReported
          label: external reported
          definition: snapshot supplied by an external account or custody source
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/executionDerived
          notation: executionDerived
          label: execution derived
          definition: snapshot derived from closed Execution lot state
    ValuationMethod:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod
      namespace: fin-portfolio
      localName: ValuationMethod
      label: Valuation Method
      definition: Closed classification of the calculation method used to derive a PortfolioValuation from its locked inputs.
      vocabulary: Valuation Method
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/directUnitPriceTimesQuantity
          notation: directUnitPriceTimesQuantity
          label: direct unit price times quantity
          definition: signed snapshot quantity multiplied by exact direct-unit Money price
    CostBasisMethod:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisMethod
      namespace: fin-portfolio
      localName: CostBasisMethod
      label: Cost Basis Method
      definition: >-
        Closed classification of methods that derive position cost basis from exact Executions, allocations, fees,
        foreign-exchange conversions, and rounding rules.
      vocabulary: Cost Basis Method
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: >-
            https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisMethod/value/executionAllocatedDirectUnitCost
          notation: executionAllocatedDirectUnitCost
          label: execution allocated direct unit cost
          definition: basis derived from exact execution price, allocation quantity, fees, FX, and rounding
    FeeTreatment:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FeeTreatment
      namespace: fin-portfolio
      localName: FeeTreatment
      label: Fee Treatment
      definition: Closed branch controlling whether exact Fee facts enter basis.
      vocabulary: Fee Treatment
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FeeTreatment/value/included
          notation: included
          label: included
          definition: every exact Fee is fully allocated into opening basis
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FeeTreatment/value/excluded
          notation: excluded
          label: excluded
          definition: no Fee allocation enters opening basis
    LotOpeningPolicy:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotOpeningPolicy
      namespace: fin-portfolio
      localName: LotOpeningPolicy
      label: Lot Opening Policy
      definition: Closed classification of policies governing how residual signed exposure from an Execution opens a PositionLot.
      vocabulary: Lot Opening Policy
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotOpeningPolicy/value/openingRemainder
          notation: openingRemainder
          label: opening remainder
          definition: at most one residual lot is opened per execution account instrument and definition tuple
    LotConsumptionPolicy:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy
      namespace: fin-portfolio
      localName: LotConsumptionPolicy
      label: Lot Consumption Policy
      definition: Closed reviewed deterministic lot selection policies.
      vocabulary: Lot Consumption Policy
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy/value/fifo
          notation: fifo
          label: FIFO
          definition: consume oldest eligible lot first by reviewed key
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy/value/lifo
          notation: lifo
          label: LIFO
          definition: consume newest eligible lot first by reviewed key
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy/value/specificIdentification
          notation: specificIdentification
          label: specific identification
          definition: consume exact explicitly identified lots
    PositionLotAllocationKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind
      namespace: fin-portfolio
      localName: PositionLotAllocationKind
      label: Position Lot Allocation Kind
      definition: >-
        Closed classification distinguishing an allocation that opens a new PositionLot from one that consumes an
        existing PositionLot.
      vocabulary: Position Lot Allocation Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind/value/opening
          notation: opening
          label: opening
          definition: allocation opens the original signed lot quantity
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind/value/consumption
          notation: consumption
          label: consumption
          definition: allocation consumes prior remaining lot quantity
    FXConversionDirection:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection
      namespace: fin-portfolio
      localName: FXConversionDirection
      label: FX Conversion Direction
      definition: Closed orientation for applying the canonical FX rate equation.
      vocabulary: FX Conversion Direction
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection/value/baseToQuote
          notation: baseToQuote
          label: base to quote
          definition: output amount equals input amount multiplied by the rate
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection/value/quoteToBase
          notation: quoteToBase
          label: quote to base
          definition: output amount equals input amount divided by the rate
    PortfolioReconciliationKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind
      namespace: fin-portfolio
      localName: PortfolioReconciliationKind
      label: Portfolio Reconciliation Kind
      definition: Closed external-versus-derived position and basis comparison results.
      vocabulary: Portfolio Reconciliation Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/matched
          notation: matched
          label: matched
          definition: exact compared values agree
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/quantityMismatch
          notation: quantityMismatch
          label: quantity mismatch
          definition: external and derived signed quantities differ
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/basisMismatch
          notation: basisMismatch
          label: basis mismatch
          definition: external and derived cost basis differ
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/missingExternal
          notation: missingExternal
          label: missing external
          definition: complete comparison has no external evidence
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/missingDerived
          notation: missingDerived
          label: missing derived
          definition: complete comparison has no execution-derived evidence
  constraints:
    PortfolioContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioContract
      namespace: fin-portfolio
      localName: PortfolioContract
      label: Portfolio Contract
      definition: validation contract for stable Portfolio identity
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: stable(portfolioId); logicalKey(portfolioId); versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: portfolio identity or standard version key is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
    PortfolioObservationStreamContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStreamContract
      namespace: fin-portfolio
      localName: PortfolioObservationStreamContract
      label: Portfolio Observation Stream Contract
      definition: validation contract for provider-scoped observation-stream identity and byte-locked ingestion semantics
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(portfolioObservationStreamProvider.logicalIri,portfolioObservationSourceContractRef,
          portfolioObservationStreamId); source-contract, completeness-contract, pagination-contract, and
          source-artifact reference/digest pairs are complete and immutable; sourceLocator is present;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: portfolio observation stream identity, source contract, completeness, pagination, or provenance is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
    PortfolioAccountMembershipContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipContract
      namespace: fin-portfolio
      localName: PortfolioAccountMembershipContract
      label: Portfolio Account Membership Contract
      definition: validation contract for the sole temporal portfolio-to-account membership path
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(membershipPortfolio.logicalIri,memberAccount.logicalIri, membershipId); membershipAuthority,
          authorityScope, approval, and source evidence are complete; versionKey(validFrom,knowledgeFrom,
          availableFrom,revision)
      severity: Error
      message: portfolio account membership identity, authority, approval, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembership
    PortfolioManagementMandateContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandateContract
      namespace: fin-portfolio
      localName: PortfolioManagementMandateContract
      label: Portfolio Management Mandate Contract
      definition: validation contract for temporal managing-party authority and approval
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(managedPortfolio.logicalIri,managingParty.logicalIri, mandateId); mandateAuthority, authorityScope,
          approval, and source evidence are complete; versionKey(validFrom,knowledgeFrom, availableFrom,revision)
      severity: Error
      message: portfolio mandate identity, authority, scope, approval, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandate
    PortfolioAccountMembershipClosureContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosureContract
      namespace: fin-portfolio
      localName: PortfolioAccountMembershipClosureContract
      label: Portfolio Account Membership Closure Contract
      definition: validation contract for the exact PIT-eligible membership set used by valuation
      constraintType: Dependency
      scope: Association
      expression:
        language: Custom
        expression: >-
          closedMembership equals the sorted exact-version set of all PIT-eligible memberships for closurePortfolio
          under pitRequestRef and strictly prior completed inputContextRef; membershipCount equals set cardinality;
          membershipVersionSetDigest verifies the section 5.8 digest; completed membershipClosureProbe proves no
          omission; generatingContextRef is the producer
      severity: Error
      message: portfolio membership closure set, digest, probe, or temporal input context is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosure
    HoldingSnapshotContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshotContract
      namespace: fin-portfolio
      localName: HoldingSnapshotContract
      label: Holding Snapshot Contract
      definition: validation contract for non-negative owned-interest snapshots
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          holdingQuantity.value >= 0; exactly one holdingObservationStream, holdingAccount, and holdingInstrument;
          supplied holdingListing is PIT-eligible and lists holdingInstrument; account, instrument, optional listing,
          quantity, source kind, and source evidence are immutable version content; no outgoing edge may target a
          Portfolio or Portfolio/LogicalIdentity, and fin-orders:orderSide plus fin-portfolio:positionSide are absent;
          logicalKey(holdingObservationStream.logicalIri,snapshotId) is a key-to-logical-identity bijection across
          versions; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: holding snapshot scope, non-negative quantity, listing, source, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    PositionSnapshotContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshotContract
      namespace: fin-portfolio
      localName: PositionSnapshotContract
      label: Position Snapshot Contract
      definition: validation contract for signed-exposure snapshots with one directional truth
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactly one positionObservationStream; positionQuantity is the sole signed directional truth; supplied
          positionListing is PIT-eligible and lists positionInstrument; account, instrument, optional listing, quantity,
          source kind, and source evidence are immutable version content; direct Portfolio, stored side, stored basis,
          and stored PnL duplicate truths are forbidden; logicalKey(positionObservationStream.logicalIri,snapshotId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: position snapshot signed quantity, scope, listing, source, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
    PositionLotContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotContract
      namespace: fin-portfolio
      localName: PositionLotContract
      label: Position Lot Contract
      definition: validation contract for exact execution-derived lot identity and immutable basis content
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          lotDiscriminator NFC lexical value = openingRemainder;
          logicalKey(lotInAccount.logicalIri,lotForInstrument.logicalIri,
          openingExecution.logicalIri,costBasisDefinition.logicalIri, lotDiscriminator); originalQuantity.value != 0;
          openingGross.amount > 0; sign(openingCostBasis.amount)=sign(originalQuantity.value); execution price currency
          = basis currency forbids openingGrossFxConversion and computes openingGross directly; differing currencies
          require exactly one direction-correct exact openingGrossFxConversion whose input is allocated quantity times
          execution price and whose output equals openingGross in the basis currency; lotQuotationContract =
          openingExecution.executionQuotationContract = costBasisDefinitionQuotationContract; supplied lotAtListing is
          PIT-eligible and lists lotForInstrument; exact opening execution and definition versions, original quantity,
          gross, signed basis, calculation context, quotation, listing, and source are immutable version content;
          forbidden(cost,side,strategy,rowNumber,arrivalOrder);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: position lot identity, immutable execution/quotation/basis chain, sign, or source is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    PositionLotOpeningAllocationCompletenessContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotOpeningAllocationCompletenessContract
      namespace: fin-portfolio
      localName: PositionLotOpeningAllocationCompletenessContract
      label: Position Lot Opening Allocation Completeness Contract
      definition: >-
        Closed inverse-cardinality contract requiring each PositionLot version to be targeted by exactly one opening
        PositionLotAllocation version with the same opening Execution, definition, context, listing, and absolute
        original Quantity.
      constraintType: Cardinality
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(inverse PositionLotAllocation.allocatedLot = this PositionLot version and
          lotAllocationKind=opening); allocationExecution = openingExecution; allocatedQuantity=abs(originalQuantity);
          allocationCostBasisDefinition=costBasisDefinition; calculation context, account, instrument, optional listing,
          unit, and quotation contract agree
      severity: Error
      message: position lot lacks exactly one matching opening allocation
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    ValuationCalculationDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinitionContract
      namespace: fin-portfolio
      localName: ValuationCalculationDefinitionContract
      label: Valuation Calculation Definition Contract
      definition: validation contract for one locked direct-unit valuation method
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(valuationDefinitionAuthority.logicalIri, valuationDefinitionId);
          valuationMethod=directUnitPriceTimesQuantity; exactly one logical valuationDefinitionAuthority; at least one
          exact valuationDefinitionQuotationContract and
          closedSet(valuationDefinitionQuotationContract,valuationQuotationContractCount,
          valuationQuotationContractVersionSetDigest) under RFC section 5.8; formulaDigest, inputContractDigest,
          outputContractDigest, precision and rounding ref/digest pairs, tool lock ref/digest, and runtimeDigest verify
          locked executable evidence; versionKey(validFrom,knowledgeFrom, availableFrom,revision)
      severity: Error
      message: valuation definition method, quotation input, policy, or executable evidence closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
    CostBasisCalculationDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinitionContract
      namespace: fin-portfolio
      localName: CostBasisCalculationDefinitionContract
      label: Cost Basis Calculation Definition Contract
      definition: validation contract for the sole execution-derived cost-basis specification
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(costBasisDefinitionAuthority.logicalIri, costBasisDefinitionId);
          costBasisMethod=executionAllocatedDirectUnitCost; lotOpeningPolicy=openingRemainder; exactly one reviewed fee
          treatment and lot-consumption policy; exactly one logical costBasisDefinitionAuthority, one exact
          costBasisDefinitionQuotationContract and one logical costBasisDefinitionBasisCurrency; currencyPolicy and
          fxPolicy require explicit direction-correct FXConversion before grouping; precision, rounding, implementation,
          input/output contract, tool lock, runtime, and source evidence digests are complete;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: cost-basis definition method, basis currency, quotation, policies, or evidence closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
    PortfolioValuationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuationContract
      namespace: fin-portfolio
      localName: PortfolioValuationContract
      label: Portfolio Valuation Contract
      definition: validation contract for a closed valuation header and calculation run
      constraintType: Dependency
      scope: Association
      expression:
        language: Custom
        expression: >-
          memberAccountClosure.closurePortfolio=valuedPortfolio; exact valuationDefinition fixes the sole
          valuationMethod and closed quotation-input set; exactly one reportingCurrency; conversion context ref/digest,
          PIT request ref/digest, strictly prior completed input context ref/digest, valuationRunId, and
          generatingContextRef are complete; logicalKey(valuedPortfolio.logicalIri,valuationRunId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: portfolio valuation header, member closure, definition, currency, or run evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuation
    PositionValuationInputXone:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuationInputXone
      namespace: fin-portfolio
      localName: PositionValuationInputXone
      label: Position Valuation Input Xone
      definition: executable exclusive branch requiring one exact holding or position snapshot
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(valuedHoldingSnapshot,valuedPositionSnapshot)
      severity: Error
      message: position valuation must select exactly one holding or position snapshot
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
    PositionValuationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuationContract
      namespace: fin-portfolio
      localName: PositionValuationContract
      label: Position Valuation Contract
      definition: validation contract for direct-unit same- or cross-currency valuation lines
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          input snapshot account belongs to valuationHeader.memberAccountClosure; snapshot instrument and supplied exact
          listing equal valuationPrice truths; snapshot Quantity unit equals the exact quotation denominator;
          valuationPrice quotation contract is a member of the valuation definition's RFC-section-5.8 closed exact
          quotation-contract set; same currency forbids valuationFxConversion and
          marketValue.amount=quantity.value*price.amount; differing currencies require exactly one direction-correct
          exact valuationFxConversion and apply the header rounding policy; marketValue currency equals
          reportingCurrency; forbidden(line valuation method,par,accrued,inverse,notional,multiplier fallback);
          logicalKey(valuationHeader.versionIri,inputSnapshot.versionIri);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: valuation line snapshot, price, quotation, currency, FX, arithmetic, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
    FXConversionContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionContract
      namespace: fin-portfolio
      localName: FXConversionContract
      label: FX Conversion Contract
      definition: validation contract for exact PIT FX evidence and direction-correct arithmetic
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          conversionRate is PIT-eligible and base Currency != quote Currency; baseToQuote requires input currency=base,
          output currency=quote, and output.amount=input.amount*rate; quoteToBase requires input currency=quote, output
          currency=base, and output.amount=input.amount/rate; inputContextRef/digest identifies a strictly prior
          completed context; rounding policy ref/digest and generatingContextRef are complete;
          exactlyOne(conversionValuationLine, conversionOpeningLot,conversionFeeAllocation), and that consumer's exact
          forward conversion role points back here; logicalKey( conversionConsumer.versionIri,inputMoney,outputMoney,
          fxConversionDirection,conversionRate.versionIri, roundingPolicyDigest,inputContextRecordDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: FX conversion orientation, arithmetic, context, rounding, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversion
    PositionLotAllocationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationContract
      namespace: fin-portfolio
      localName: PositionLotAllocationContract
      label: Position Lot Allocation Contract
      definition: validation contract for opening and consumption allocation branches
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          allocatedQuantity.value > 0; allocationCostBasisDefinition equals the lot definition and calculationContextRef
          is equal across allocation, lot, and closure; opening requires allocationExecution =
          allocatedLot.openingExecution, side creates sign(originalQuantity), and quantity=abs(originalQuantity);
          consumption requires opposite execution side, equal account/instrument/listing/unit, and quantity <= prior
          remaining quantity; logicalKey(allocationExecution.versionIri, allocatedLot.versionIri,lotAllocationKind);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: lot allocation kind, positive quantity, exact definition/context, side, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocation
    PositionLotFeeAllocationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotFeeAllocationContract
      namespace: fin-portfolio
      localName: PositionLotFeeAllocationContract
      label: Position Lot Fee Allocation Contract
      definition: validation contract for positive fee allocation and optional exact basis conversion
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          allocatedFeeAmount.amount > 0 and currency=allocatedFee.feeAmount.currency; feeCostBasisDefinition and
          calculationContextRef equal the target lot allocation truths; same basis currency forbids feeFxConversion and
          differing currency requires one exact direction-correct conversion; feeLotAllocation must be a member of the
          governing ExecutionLotAllocationClosure.closureAllocation;
          logicalKey(allocatedFee.versionIri,feeLotAllocation.versionIri);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: fee allocation magnitude, currency, definition, context, conversion, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotFeeAllocation
    ExecutionLotAllocationClosureContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosureContract
      namespace: fin-portfolio
      localName: ExecutionLotAllocationClosureContract
      label: Execution Lot Allocation Closure Contract
      definition: validation contract for eligible-lot selection and closed allocation, Fee, and fee-allocation sets
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          closureEligibleLot equals the complete exact-version set eligible at closureExecution under account,
          instrument, optional listing, unit, side, and closureCostBasisDefinition; eligibleLotCount and set digest
          agree and the completed selection probe proves no omission; FIFO sorts by lot opening time then exact version
          IRI and exhausts each earlier lot before a later lot; LIFO applies the reverse order; specificIdentification
          requires specificSelectionRef/digest plus closureSelectedLot count and set digest, every consumed lot is
          selected and every selected lot is eligible; FIFO/LIFO forbid specific selection evidence and all policies
          forbid row-number or arrival-order proxies; closureAllocation, closureFee, and closureFeeAllocation equal
          their sorted complete exact-version sets for closureExecution and closureCostBasisDefinition; counts and
          section 5.8 set digests agree; completed allocation and fee probes prove no omission in the exact strictly
          prior input context; allocation quantities conserve Execution Quantity once each; every fee allocation targets
          a member closureAllocation and an existing Fee; every Fee follows exactly the definition-selected excluded or
          included branch; included positive allocations may legally split one Fee across multiple distinct lot
          allocations and their per-Fee aggregate exactly conserves Fee magnitude and currency before direction-correct
          FX conversion; logicalKey(closureExecution.versionIri, closureCostBasisDefinition.versionIri);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: execution allocation closure set, probe, conservation, fee branch, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
    PositionLotStateClosureContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotStateClosureContract
      namespace: fin-portfolio
      localName: PositionLotStateClosureContract
      label: Position Lot State Closure Contract
      definition: validation contract for complete open-lot state and snapshot conservation
      constraintType: Dependency
      scope: Association
      expression:
        language: Custom
        expression: >-
          openLot, stateAllocation, and stateExecutionClosure equal their sorted complete exact-version sets and section
          5.8 digests at snapshotPivotRef; completed lot/allocation probes prove no omissions; all facts agree on
          account, instrument, optional exact listing, unit, definition, quotation, pivot, and calculation context;
          remainingQuantity = sign(originalQuantity)*(abs(originalQuantity)-sum(consumption)); consumption <=
          abs(originalQuantity); zero lots excluded; remainingCostBasis sums openingCostBasis*
          abs(remainingQuantity)/abs(originalQuantity) after exact FX; closedPositionSnapshot.quantity sums
          remainingQuantity; external source snapshots forbid this branch; logicalKey(
          closedPositionSnapshot.versionIri,stateCostBasisDefinition.versionIri);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: position lot state closure sets, probes, equality chain, conservation, basis, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotStateClosure
