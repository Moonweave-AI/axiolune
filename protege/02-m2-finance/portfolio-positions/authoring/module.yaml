    PortfolioPositionReconciliationFindingContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioPositionReconciliationFindingContract
      namespace: fin-portfolio
      localName: PortfolioPositionReconciliationFindingContract
      label: Portfolio Position Reconciliation Finding Contract
      definition: validation contract for explicit external-versus-derived quantity or basis comparison
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactly one comparison family is present: quantity ((comparedExternalSnapshot xor
          comparedExternalPositionSnapshot),comparedDerivedSnapshot) or basis
          (comparedExternalBasis,comparedLotStateClosure), and each selected family has at least one side; the
          digest-bound input context inventories the complete canonical candidate graph and the digest-bound
          PITValidationRequest supplies the exact validAt, knowledgeAt, and availableAt pivot; the runtime independently
          selects every PIT-eligible candidate matching family, account, instrument, optional listing, and source
          branch, rejects more than one candidate per side, and requires the selected roles to equal that closed
          candidate set; separate external and derived candidate counts and version-set digests equal the independently
          recomputed sorted sets for explicit source scopes, and the completed reconciliationClosureProbe binds that
          set, the input context, PIT request, selected nullable roles, scope, and finding version; two-sided
          comparisons agree on account, instrument, optional listing, and unit/currency, and basis comparisons
          additionally require comparedExternalBasis.externalBasisDefinition to equal
          comparedLotStateClosure.stateCostBasisDefinition exactly; the digest-bound reconciliation context binds the
          same request, candidate set, scope, exact values, and generating context; one-sided comparisons recompute to
          missingExternal or missingDerived only when the closed candidate set proves the corresponding side empty;
          two-sided comparisons recompute to matched, quantityMismatch, or basisMismatch; reconciliationSubjectDigest
          domain-separates the family, external record type, and exact nullable compared versions; generatingContextRef
          is an exact version; every selected and candidate input is PIT-eligible for the request and every
          context/probe completes after its locked inputs and strictly before the finding;
          logicalKey(reconciliationQueryDefinitionRef,pitRequestRef,reconciliationSubjectDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: portfolio reconciliation comparison branch, equality scope, result, or subject digest is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioPositionReconciliationFinding
