module:
  moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  baseIri: https://axiolune.ai/ontology/finance/portfolio-positions/
  preferredPrefix: fin-portfolio
  version: 1.0.0
  label: Portfolio and Positions
  definition: >-
    Portfolio membership and mandate, external holding and signed position snapshots, execution-derived lots, closed
    allocation and fee accounting, valuation header and lines, FX conversion, cost basis, unrealized PnL, and typed
    reconciliation semantics.
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/orders-execution
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    Portfolio:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
      namespace: fin-portfolio
      localName: Portfolio
      label: Portfolio
      definition: >-
        Stable managed collection whose logical identity is an authority-scoped portfolio identifier and whose account
        membership and management authority are represented only by temporal associations.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioObservationStream:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
      namespace: fin-portfolio
      localName: PortfolioObservationStream
      label: Portfolio Observation Stream
      definition: >-
        Versioned provider-owned stream that scopes source identifiers for holding, signed-position, and external
        cost-basis observations. Its logical identity is provider, immutable source contract, and provider stream ID;
        completeness and pagination contracts are byte-locked version content.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationStreamId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationSourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationSourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationCompletenessContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationCompletenessContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationPaginationContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationPaginationContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ValuationCalculationDefinition:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
      namespace: fin-portfolio
      localName: ValuationCalculationDefinition
      label: Valuation Calculation Definition
      definition: >-
        Authority-scoped versioned valuation specification that is the sole valuation-method truth and fixes direct-unit
        quotation-input closure, formula or implementation, input/output contracts, precision and rounding, runtime, and
        tool lock.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationMethod
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationQuotationContractCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationQuotationContractVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/formulaDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/runtimeDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CostBasisCalculationDefinition:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
      namespace: fin-portfolio
      localName: CostBasisCalculationDefinition
      label: Cost Basis Calculation Definition
      definition: >-
        Authority-scoped versioned sole execution-derived cost-basis specification fixing the reviewed method,
        direct-unit quotation input, fee treatment, lot opening and consumption, currency and FX policy, precision and
        rounding, implementation, runtime, tool, and input/output contracts.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisMethod
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeTreatment
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotOpeningPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotConsumptionPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/currencyPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/fxPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExecutionLotAllocationClosure:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      namespace: fin-portfolio
      localName: ExecutionLotAllocationClosure
      label: Execution Lot Allocation Closure
      definition: >-
        Closed-world header for one exact Execution and CostBasisCalculationDefinition version containing the complete
        eligible PositionLot set, deterministic selection evidence, and all current PositionLotAllocation, Fee, and
        PositionLotFeeAllocation exact versions, with completed probes that prove selection, quantity, fee, gross, and
        basis conservation.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/eligibleLotVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/eligibleLotCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeAllocationVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeAllocationCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationClosureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationClosureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeClosureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeClosureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/consumptionSelectionProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/consumptionSelectionProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionVersionSetDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionCount
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    PortfolioAccountMembership:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembership
      namespace: fin-portfolio
      localName: PortfolioAccountMembership
      label: Portfolio Account Membership
      definition: >-
        Effective-dated and source-approved membership of one FinancialAccount in one Portfolio, providing the sole
        graph path used to resolve member accounts at a PIT pivot.
      participantRoles:
        - id: membershipPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: membership portfolio
          definition: logical Portfolio whose membership is asserted
        - id: memberAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: member account
          definition: logical FinancialAccount included in the Portfolio
        - id: membershipAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: membership authority
          definition: logical Party authorized to assert the membership
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioManagementMandate:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandate
      namespace: fin-portfolio
      localName: PortfolioManagementMandate
      label: Portfolio Management Mandate
      definition: >-
        Effective-dated, source-approved authority of one managing Party over one Portfolio with explicit mandate
        authority and scope, providing the sole management path used by portfolio governance queries.
      participantRoles:
        - id: managedPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: managed portfolio
          definition: logical Portfolio governed by the mandate
        - id: managingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: managing party
          definition: logical Party receiving management authority
        - id: mandateAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: mandate authority
          definition: logical Party granting or approving the mandate
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/mandateId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioAccountMembershipClosure:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosure
      namespace: fin-portfolio
      localName: PortfolioAccountMembershipClosure
      label: Portfolio Account Membership Closure
      definition: >-
        PIT-scoped complete exact-version set of all effective account memberships for one Portfolio, with sorted-set
        digest and a completed closure probe that makes account absence closed-world evidence.
      participantRoles:
        - id: closurePortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: closure portfolio
          definition: logical Portfolio whose membership is closed
        - id: closedMembership
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembership
          minCount: 0
          maxCount: null
          label: closed membership
          definition: exact current membership version included in the complete set
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipClosureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipClosureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    HoldingSnapshot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
      namespace: fin-portfolio
      localName: HoldingSnapshot
      label: Holding Snapshot
      definition: >-
        Source-observed owned financial interest from exactly one typed observation stream for exactly one account and
        instrument with a non-negative Quantity and optional consistent exact listing; it is not a Portfolio membership
        edge and is not equivalent to signed execution-derived exposure.
      participantRoles:
        - id: holdingObservationStream
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
          minCount: 1
          maxCount: 1
          label: holding observation stream
          definition: exact provider-owned stream FactVersion whose locked closure contains the selected holding row
        - id: holdingAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: holding account
          definition: logical FinancialAccount owning the interest
        - id: holdingInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: holding instrument
          definition: logical FinancialInstrument owned by the account
        - id: holdingListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: holding listing
          definition: optional exact PIT-eligible listing version for the instrument
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/snapshotId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/holdingQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionSourceKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionSnapshot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
      namespace: fin-portfolio
      localName: PositionSnapshot
      label: Position Snapshot
      definition: >-
        Signed exposure snapshot from exactly one typed observation stream for exactly one account and instrument whose
        signed Quantity is the sole stored directional truth: positive is long, negative is short, and zero is flat; any
        side label is derived.
      participantRoles:
        - id: positionObservationStream
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
          minCount: 1
          maxCount: 1
          label: position observation stream
          definition: logical provider-owned stream that scopes snapshotId
        - id: positionAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: position account
          definition: logical FinancialAccount exposed to the instrument
        - id: positionInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: position instrument
          definition: logical FinancialInstrument to which the account is exposed
        - id: positionListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: position listing
          definition: optional exact PIT-eligible listing version for the instrument
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/snapshotId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionSourceKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionLot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
      namespace: fin-portfolio
      localName: PositionLot
      label: Position Lot
      definition: >-
        Execution-derived opening exposure whose logical identity is exactly account logical IRI, instrument logical
        IRI, opening Execution logical IRI, CostBasisCalculationDefinition logical IRI, and the fixed openingRemainder
        discriminator; quantity, gross, signed basis, exact versions, context, and source are immutable version content.
      participantRoles:
