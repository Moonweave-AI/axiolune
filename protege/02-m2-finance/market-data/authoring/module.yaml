          label: Range
          definition: fixed positive price-range threshold aggregation
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/renko
          notation: renko
          label: Renko
          definition: fixed positive brick threshold aggregation
    BarPriceBasis:
      iri: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis
      namespace: fin-market-data
      localName: BarPriceBasis
      label: Bar Price Basis
      definition: closed discriminator between trade OHLCV and paired quote-side OHLC semantics
      vocabulary: Bar Price Basis
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis/value/trade
          notation: trade
          label: Trade
          definition: bar aggregates executed trade prices and volume
        - iri: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis/value/bidAsk
          notation: bidAsk
          label: Bid and Ask
          definition: bar preserves separate bid and ask OHLC series and side sizes
    BarTimestampConvention:
      iri: https://axiolune.ai/ontology/finance/market-data/BarTimestampConvention
      namespace: fin-market-data
      localName: BarTimestampConvention
