module:
  moduleIri: https://axiolune.ai/ontology/finance/market-data
  baseIri: https://axiolune.ai/ontology/finance/market-data/
  preferredPrefix: fin-market-data
  version: 1.0.0
  label: Market Data
  definition: >-
    Source-contract-bound price, quote, trade, bar, quality, and FX-rate facts with immutable version identity, exact
    observation context, and fail-closed valid, knowledge, and availability time semantics.
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-rules
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    MarketDataStream:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
      namespace: fin-market-data
      localName: MarketDataStream
      label: Market Data Stream
      definition: >-
        Immutable version of one provider-owned market-data stream and its locked source contract. Its logical key is
        the provider logical IRI, sourceContractRef, and providerStreamId; a bare provider-stream IRI is not a valid
        observation reference.
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerStreamId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceApiIdentifier
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceSchemaIdentifier
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceSchemaVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/observationIdFieldLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionFieldLocator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/orderingTransformRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/orderingTransformDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/streamPurpose
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRecordRevisionMode
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BarSpecification:
      iri: https://axiolune.ai/ontology/finance/market-data/BarSpecification
      namespace: fin-market-data
      localName: BarSpecification
      label: Bar Specification
      definition: >-
        Versioned, source-locked aggregation contract for one stream. It selects one aggregation kind, one price basis,
        one timestamp convention, one source time zone and calendar, and exactly one time-interval or non-time threshold
        branch.
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/barSpecificationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barAggregation
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barPriceBasis
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barSourceTimeZone
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barTimestampConvention
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barInterval
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barThreshold
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    PriceObservation:
      iri: https://axiolune.ai/ontology/finance/market-data/PriceObservation
      namespace: fin-market-data
      localName: PriceObservation
      label: Price Observation
      definition: >-
        Source-record-scoped observation of one non-FX instrument price. It names an exact stream, instrument,
        listing-or-OTC context, and direct-unit quotation contract; Money carries the sole currency truth. VWAP and TWAP
        observations additionally bind an exact calculation definition and an immutable calculation run whose
        byte-locked input FactVersion set, selection window, input-set digest, output, and recalculation policy are
        replayable.
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this observation
        - id: observedInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: observed instrument
          definition: exact FinancialInstrument version whose price is observed
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
        - id: quotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: quotation contract
          definition: exact direct-unit quotation contract governing instrument, context, currency, and quantity unit
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/priceValue
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/priceKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/calculationDefinitionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/calculationDefinitionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/calculationRunRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/calculationRunDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/calculationInputSetDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    QuoteObservation:
      iri: https://axiolune.ai/ontology/finance/market-data/QuoteObservation
      namespace: fin-market-data
      localName: QuoteObservation
      label: Quote Observation
      definition: >-
        Complete top-of-book observation containing paired bid price, bid size, ask price, and ask size. Bid and ask are
        structural fields, never PriceKind members; a crossed quote is retained only with its required quality finding.
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this quote
        - id: observedInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: observed instrument
          definition: exact FinancialInstrument version whose quote is observed
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
        - id: quotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: quotation contract
          definition: exact direct-unit quotation contract governing both quote sides
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/bidPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/bidSize
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/askPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/askSize
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradeObservation:
      iri: https://axiolune.ai/ontology/finance/market-data/TradeObservation
      namespace: fin-market-data
      localName: TradeObservation
      label: Trade Observation
      definition: >-
        Provider-declared trade event with an immutable source trade identifier, positive quantity, Last price kind,
        exact direct-unit quotation contract, and deterministic canonical ordering tuple.
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this trade
        - id: observedInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: observed instrument
          definition: exact FinancialInstrument version traded by the source event
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
        - id: quotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: quotation contract
          definition: exact direct-unit quotation contract governing trade price and size
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradePrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradeSize
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/priceKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceTradeId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradeBar:
      iri: https://axiolune.ai/ontology/finance/market-data/TradeBar
      namespace: fin-market-data
      localName: TradeBar
      label: Trade Bar
      definition: >-
        Trade-price OHLCV observation governed by one exact BarSpecification. Time bars use a half-open interval;
        non-time bars use sequence and contributing event bounds. OHLC values and volume are never mixed with quote-side
        bars.
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this bar
        - id: observedInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: observed instrument
          definition: exact FinancialInstrument version aggregated by this trade bar
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
        - id: quotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: quotation contract
          definition: exact direct-unit quotation contract governing all OHLC values and volume unit
        - id: barSpecification
          range: https://axiolune.ai/ontology/finance/market-data/BarSpecification
          minCount: 1
          maxCount: 1
          label: bar specification
          definition: exact BarSpecification version controlling aggregation, basis, calendar, and timestamp semantics
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradeOpenPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradeHighPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradeLowPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradeClosePrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/tradeVolume
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/intervalStart
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/intervalEnd
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barSequence
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/firstContributingEventAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/lastContributingEventAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    QuoteBar:
      iri: https://axiolune.ai/ontology/finance/market-data/QuoteBar
      namespace: fin-market-data
      localName: QuoteBar
      label: Quote Bar
      definition: >-
        Quote-side bar preserving complete bid and ask OHLC series plus side sizes. It is distinct from TradeBar and has
        no observation-level PriceKind.
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this bar
        - id: observedInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: observed instrument
          definition: exact FinancialInstrument version aggregated by this quote bar
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
        - id: quotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: quotation contract
          definition: exact direct-unit quotation contract governing both OHLC sides and size units
        - id: barSpecification
          range: https://axiolune.ai/ontology/finance/market-data/BarSpecification
          minCount: 1
          maxCount: 1
          label: bar specification
          definition: exact BarSpecification version controlling aggregation, basis, calendar, and timestamp semantics
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/bidOpenPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/bidHighPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/bidLowPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/bidClosePrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/askOpenPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/askHighPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/askLowPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/askClosePrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/lastBidSize
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/lastAskSize
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/intervalStart
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/intervalEnd
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/barSequence
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/firstContributingEventAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/lastContributingEventAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MarketDataQualityFinding:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFinding
      namespace: fin-market-data
      localName: MarketDataQualityFinding
      label: Market Data Quality Finding
      definition: >-
        Immutable, generated finding over one exact stream and a kind-discriminated, sorted unique set of exact
        observation versions. The closed kinds are crossed quote, duplicate source-record conflict, and canonical-order
        collision.
      participantRoles:
        - id: findingStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: finding stream
          definition: exact MarketDataStream version whose policy and observations determine the finding
        - id: affectedPriceObservation
          range: https://axiolune.ai/ontology/finance/market-data/PriceObservation
          minCount: 0
          maxCount: null
          label: affected price observation
          definition: exact PriceObservation version included in the finding subject set
        - id: affectedQuoteObservation
          range: https://axiolune.ai/ontology/finance/market-data/QuoteObservation
          minCount: 0
          maxCount: null
          label: affected quote observation
          definition: exact QuoteObservation version included in the finding subject set
        - id: affectedTradeObservation
          range: https://axiolune.ai/ontology/finance/market-data/TradeObservation
          minCount: 0
          maxCount: null
          label: affected trade observation
          definition: exact TradeObservation version included in the finding subject set
        - id: affectedTradeBar
          range: https://axiolune.ai/ontology/finance/market-data/TradeBar
          minCount: 0
          maxCount: null
          label: affected trade bar
          definition: exact TradeBar version included in the finding subject set
        - id: affectedQuoteBar
          range: https://axiolune.ai/ontology/finance/market-data/QuoteBar
          minCount: 0
          maxCount: null
          label: affected quote bar
          definition: exact QuoteBar version included in the finding subject set
        - id: affectedFxRateObservation
          range: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
          minCount: 0
          maxCount: null
          label: affected FX rate observation
          definition: exact FXRateObservation version included in the finding subject set
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/qualityFindingKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/affectedSubjectDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FXRateObservation:
      iri: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
      namespace: fin-market-data
      localName: FXRateObservation
      label: FX Rate Observation
      definition: >-
        Observation of quote-currency units equal to one base-currency unit. Base and quote currencies are different
        logical Currency identities and the rate is a strictly positive dimensionless Quantity under the same stream,
        revision, PIT, and context contracts as other market observations.
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this FX rate
        - id: baseCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 1
          maxCount: 1
          label: base currency
          definition: logical Currency for the one-unit left side of the FX equation
        - id: quoteCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 1
          maxCount: 1
          label: quote currency
          definition: logical Currency whose units are counted by the FX rate
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/fxRate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
