module:
  moduleIri: https://axiolune.ai/ontology/finance/market-structure
  baseIri: https://axiolune.ai/ontology/finance/market-structure/
  preferredPrefix: fin-market-structure
  version: 1.0.0
  label: Market Structure
  definition: >-
    market-structure vocabulary for versioned trading facilities, MIC registry entries, calendars, session schedules,
    exceptions, and non-listing trading contexts
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    TradingFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      namespace: fin-market-structure
      localName: TradingFacility
      label: Trading Facility
      definition: >-
        identifiable market facility that provides a common reference range for an operating trading venue or one of its
        market segments
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingVenue:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
      namespace: fin-market-structure
      localName: TradingVenue
      label: Trading Venue
      definition: TradingFacility that operates a market on which financial instruments may be admitted to trading
      superTypes:
        - https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MarketSegment:
      iri: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
      namespace: fin-market-structure
      localName: MarketSegment
      label: Market Segment
      definition: TradingFacility that is a separately identified segment of exactly one operating trading venue
      superTypes:
        - https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MICRegistryEntry:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      namespace: fin-market-structure
      localName: MICRegistryEntry
      label: MIC Registry Entry
      definition: >-
        temporal registry fact that binds one four-character MIC value and one OPRT or SGMT entry kind to the exact
        TradingFacility version identified by that registry record
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/micEntryType
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingCalendar:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      namespace: fin-market-structure
      localName: TradingCalendar
      label: Trading Calendar
      definition: immutable version of an authority-maintained calendar for one trading facility, jurisdiction, and IANA time zone
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/authorityCalendarId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/ianaTimeZone
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingSessionTemplate:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingSessionTemplate
      namespace: fin-market-structure
      localName: TradingSessionTemplate
      label: Trading Session Template
      definition: recurring local-clock session specification attached to one exact TradingCalendar version
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionRecurrence
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/localSessionStart
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/localSessionEnd
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingSessionOccurrence:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      namespace: fin-market-structure
      localName: TradingSessionOccurrence
      label: Trading Session Occurrence
      definition: >-
        dated UTC half-open trading interval materialized from one exact session template and calendar version for one
        exact facility version
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionBusinessDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionStartUtc
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionEndUtc
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingCalendarException:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarException
      namespace: fin-market-structure
      localName: TradingCalendarException
      label: Trading Calendar Exception
      definition: >-
        temporal exception fact that deterministically closes or changes one exact session occurrence without mutating
        its session template
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/calendarExceptionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/exceptionBusinessDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/replacementSessionStartUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/replacementSessionEndUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OTCTradingContext:
      iri: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      namespace: fin-market-structure
      localName: OTCTradingContext
      label: OTC Trading Context
      definition: >-
        non-listing trading context whose logical identity is the source-provider logical IRI, immutable source-contract
        IRI, and provider-scoped context identifier
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/providerContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/marketConvention
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    JurisdictionCalendarBinding:
      iri: https://axiolune.ai/ontology/finance/market-structure/JurisdictionCalendarBinding
      namespace: fin-market-structure
      localName: JurisdictionCalendarBinding
      label: Jurisdiction Calendar Binding
      definition: >-
        explicit temporal binding between one logical Jurisdiction identity and one exact TradingCalendar version,
        materializing calendarJurisdiction for audit and mapping slices
      participantRoles:
        - id: bindingJurisdiction
          range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
          minCount: 1
          maxCount: 1
          label: binding jurisdiction
          definition: logical Jurisdiction identity governed by the calendar
        - id: bindingCalendar
          range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
          minCount: 1
          maxCount: 1
          label: binding calendar
          definition: exact TradingCalendar version bound to the jurisdiction
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    marketSegmentVenue:
      iri: https://axiolune.ai/ontology/finance/market-structure/marketSegmentVenue
      namespace: fin-market-structure
      localName: marketSegmentVenue
      label: Market Segment Venue
      definition: relates a market segment to its one operating trading venue
      domain: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
      range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
      characteristics:
        - functional
    registryMICValue:
      iri: https://axiolune.ai/ontology/finance/market-structure/registryMICValue
      namespace: fin-market-structure
      localName: registryMICValue
      label: Registry MIC Value
      definition: relates a MIC registry entry to its one four-character MIC logical identity
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/MICValue
      characteristics:
        - functional
    registryAuthority:
      iri: https://axiolune.ai/ontology/finance/market-structure/registryAuthority
      namespace: fin-market-structure
      localName: registryAuthority
      label: Registry Authority
      definition: relates a MIC registry entry to the logical identifier authority that maintains it
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
      characteristics:
        - functional
    registryFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/registryFacility
      namespace: fin-market-structure
      localName: registryFacility
      label: Registry Facility
      definition: relates a MIC registry entry to the exact TradingFacility version identified by that entry
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    operatingMICEntry:
      iri: https://axiolune.ai/ontology/finance/market-structure/operatingMICEntry
      namespace: fin-market-structure
      localName: operatingMICEntry
      label: Operating MIC Entry
      definition: relates a segment MIC entry to the exact operating MIC entry for its trading venue
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      characteristics:
        - functional
    calendarFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarFacility
      namespace: fin-market-structure
      localName: calendarFacility
      label: Calendar Facility
      definition: relates a trading calendar to the stable logical identity of its trading facility
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    calendarAuthority:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarAuthority
      namespace: fin-market-structure
      localName: calendarAuthority
      label: Calendar Authority
      definition: relates a trading calendar to the Party logical identity of its maintaining authority
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    calendarJurisdiction:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarJurisdiction
      namespace: fin-market-structure
      localName: calendarJurisdiction
      label: Calendar Jurisdiction
      definition: relates a trading calendar to its one governing jurisdiction logical identity
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
      characteristics:
        - functional
    templateCalendar:
      iri: https://axiolune.ai/ontology/finance/market-structure/templateCalendar
      namespace: fin-market-structure
      localName: templateCalendar
      label: Template Calendar
      definition: relates a session template to the exact trading-calendar version it specializes
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionTemplate
      range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      characteristics:
        - functional
    occurrenceTemplate:
      iri: https://axiolune.ai/ontology/finance/market-structure/occurrenceTemplate
      namespace: fin-market-structure
      localName: occurrenceTemplate
      label: Occurrence Template
      definition: relates a session occurrence to the exact template version that generated it
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      range: https://axiolune.ai/ontology/finance/market-structure/TradingSessionTemplate
      characteristics:
        - functional
    occurrenceCalendar:
      iri: https://axiolune.ai/ontology/finance/market-structure/occurrenceCalendar
      namespace: fin-market-structure
      localName: occurrenceCalendar
      label: Occurrence Calendar
      definition: relates a session occurrence to the exact calendar version applied to it
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      characteristics:
        - functional
    occurrenceFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/occurrenceFacility
      namespace: fin-market-structure
      localName: occurrenceFacility
      label: Occurrence Facility
      definition: relates a session occurrence to the exact TradingFacility version whose interval it controls
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    exceptionOccurrence:
      iri: https://axiolune.ai/ontology/finance/market-structure/exceptionOccurrence
      namespace: fin-market-structure
      localName: exceptionOccurrence
      label: Exception Occurrence
      definition: relates a calendar exception to the exact session occurrence it deterministically alters
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarException
      range: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      characteristics:
        - functional
    otcSourceProvider:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcSourceProvider
      namespace: fin-market-structure
      localName: otcSourceProvider
      label: OTC Source Provider
      definition: relates an OTC trading context to its exact source-provider Party version
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    otcQuoteCurrency:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcQuoteCurrency
      namespace: fin-market-structure
      localName: otcQuoteCurrency
      label: OTC Quote Currency
      definition: relates an OTC trading context to its one quote Currency logical identity
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    otcSettlementCurrency:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcSettlementCurrency
      namespace: fin-market-structure
      localName: otcSettlementCurrency
      label: OTC Settlement Currency
      definition: relates an OTC trading context to its optional settlement Currency logical identity
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    otcReportingFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcReportingFacility
      namespace: fin-market-structure
      localName: otcReportingFacility
      label: OTC Reporting Facility
      definition: relates an OTC trading context to its optional exact reporting-facility version
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    otcCounterpartyA:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyA
      namespace: fin-market-structure
      localName: otcCounterpartyA
      label: OTC Counterparty A
      definition: relates an OTC trading context to the lexically first exact Party version in its optional counterparty pair
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    otcCounterpartyB:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyB
      namespace: fin-market-structure
      localName: otcCounterpartyB
      label: OTC Counterparty B
      definition: relates an OTC trading context to the lexically second exact Party version in its optional counterparty pair
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
  attributeTypes:
    micEntryType:
      iri: https://axiolune.ai/ontology/finance/market-structure/micEntryType
      namespace: fin-market-structure
      localName: micEntryType
      label: MIC Entry Type
      definition: closed OPRT or SGMT classification carried by one MIC registry entry
      valueType: https://axiolune.ai/ontology/finance/market-structure/MICEntryType
      defaultCardinality:
        minCount: 1
        maxCount: 1
    authorityCalendarId:
      iri: https://axiolune.ai/ontology/finance/market-structure/authorityCalendarId
      namespace: fin-market-structure
      localName: authorityCalendarId
      label: Authority Calendar Identifier
      definition: non-empty NFC identifier assigned to a calendar by its maintaining authority
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    ianaTimeZone:
      iri: https://axiolune.ai/ontology/finance/market-structure/ianaTimeZone
      namespace: fin-market-structure
      localName: ianaTimeZone
      label: IANA Time Zone
      definition: canonical IANA time-zone identifier used to interpret a trading calendar's local-clock sessions
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^[A-Za-z_+-]+(?:/[A-Za-z0-9_+-]+)+$
    sessionRecurrence:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionRecurrence
      namespace: fin-market-structure
      localName: sessionRecurrence
      label: Session Recurrence
      definition: deterministic recurrence expression selecting the business dates to which a session template applies
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    localSessionStart:
      iri: https://axiolune.ai/ontology/finance/market-structure/localSessionStart
      namespace: fin-market-structure
      localName: localSessionStart
      label: Local Session Start
      definition: ISO local-clock time at which a recurring session interval begins
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$
    localSessionEnd:
      iri: https://axiolune.ai/ontology/finance/market-structure/localSessionEnd
      namespace: fin-market-structure
      localName: localSessionEnd
      label: Local Session End
      definition: ISO local-clock time at which a recurring half-open session interval ends
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$
    sessionBusinessDate:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionBusinessDate
      namespace: fin-market-structure
      localName: sessionBusinessDate
      label: Session Business Date
      definition: local calendar date to which a concrete trading-session occurrence belongs
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sessionStartUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionStartUtc
      namespace: fin-market-structure
      localName: sessionStartUtc
      label: Session Start UTC
      definition: inclusive UTC instant at which a concrete trading-session occurrence starts
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sessionEndUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionEndUtc
      namespace: fin-market-structure
      localName: sessionEndUtc
      label: Session End UTC
      definition: exclusive UTC instant at which a concrete trading-session occurrence ends
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    calendarExceptionKind:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarExceptionKind
      namespace: fin-market-structure
      localName: calendarExceptionKind
      label: Calendar Exception Kind
      definition: closed holiday, closure, early-session, or late-session classification of a calendar exception
      valueType: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    exceptionBusinessDate:
      iri: https://axiolune.ai/ontology/finance/market-structure/exceptionBusinessDate
      namespace: fin-market-structure
      localName: exceptionBusinessDate
      label: Exception Business Date
      definition: local business date on which a trading-calendar exception applies
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    replacementSessionStartUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/replacementSessionStartUtc
      namespace: fin-market-structure
      localName: replacementSessionStartUtc
      label: Replacement Session Start UTC
      definition: optional inclusive replacement start instant supplied by an early or late session exception
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    replacementSessionEndUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/replacementSessionEndUtc
      namespace: fin-market-structure
      localName: replacementSessionEndUtc
      label: Replacement Session End UTC
      definition: optional exclusive replacement end instant supplied by an early or late session exception
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerContextId:
      iri: https://axiolune.ai/ontology/finance/market-structure/providerContextId
      namespace: fin-market-structure
      localName: providerContextId
      label: Provider Context Identifier
      definition: non-empty NFC business identifier scoped by one source provider and immutable source contract
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    marketConvention:
      iri: https://axiolune.ai/ontology/finance/market-structure/marketConvention
      namespace: fin-market-structure
      localName: marketConvention
      label: Market Convention
      definition: reviewed convention member that fixes the orientation and application semantics of one OTC context
      valueType: https://axiolune.ai/ontology/finance/market-structure/MarketConvention
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceContractRef:
      iri: https://axiolune.ai/ontology/finance/market-structure/sourceContractRef
      namespace: fin-market-structure
      localName: sourceContractRef
      label: Source Contract Reference
      definition: absolute IRI of the immutable provider schema or contract that defines providerContextId extraction
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceContractDigest:
      iri: https://axiolune.ai/ontology/finance/market-structure/sourceContractDigest
      namespace: fin-market-structure
      localName: sourceContractDigest
      label: Source Contract Digest
      definition: lowercase SHA-256 digest authenticating the exact bytes of the referenced source contract
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
  identifierTypes: {}
  codeLists:
    MICEntryType:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType
      namespace: fin-market-structure
      localName: MICEntryType
      label: MIC Entry Type
      definition: closed ISO 10383 registry-entry discriminator distinguishing operating MICs from segment MICs
      vocabulary: MIC Entry Type
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType/value/OPRT
          notation: OPRT
          label: Operating MIC
          definition: registry entry that identifies an operating-level TradingVenue
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType/value/SGMT
          notation: SGMT
          label: Segment MIC
          definition: registry entry that identifies a MarketSegment and refers to its operating MIC entry
    CalendarExceptionKind:
      iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind
      namespace: fin-market-structure
      localName: CalendarExceptionKind
      label: Calendar Exception Kind
      definition: closed classification of deterministic changes to scheduled session occurrences
      vocabulary: Calendar Exception Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/holiday
          notation: holiday
          label: Holiday
          definition: calendar exception that removes the affected session occurrence for a recognized holiday
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/closure
          notation: closure
          label: Closure
          definition: calendar exception that removes the affected session occurrence for a non-holiday closure
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/earlySession
          notation: earlySession
          label: Early Session
          definition: calendar exception that shortens an occurrence by replacing its exclusive end instant
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/lateSession
          notation: lateSession
          label: Late Session
          definition: calendar exception that delays an occurrence by replacing its inclusive start instant
