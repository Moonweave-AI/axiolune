  BuildEvidenceBinding:
    iri: https://axiolune.ai/ontology/meta/data-binding/BuildEvidenceBinding
    cnNote: 构建证据绑定，是本体工程中每个控制记录共享的精确构建身份，旨在为所有控制记录绑定不可变的构建来源。
