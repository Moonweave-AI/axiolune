module:
  moduleIri: https://axiolune.ai/ontology/meta/data-binding
  baseIri: https://axiolune.ai/ontology/meta/data-binding/
  preferredPrefix: ax-binding
  version: 0.6.0
  label: Data Binding Meta-Model
  definition: the meta-model mapping physical data sources to ontology concepts
  cnNote: 数据绑定元模型层，是本体工程中把物理数据映射到本体概念的元模型层，旨在为数据物化提供带身份、时序、溯源与证据锁的可复现映射，是物理与语义之间的桥梁。
  imports:
    - moduleIri: https://axiolune.ai/ontology/meta/core
      version: 0.6.0
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/meta/patterns
      version: 0.6.0
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/meta/behavior
      version: 0.6.0
      importMode: All
  exports: []
DataBinding:
  version: 0.6.0
  description: Meta-model for mapping physical data sources to ontology concepts
    (ADR-011, ADR-012 compliant)
  layer: 4
  changes:
    - "v0.6.0: RuntimeContextBinding can bind the immutable
      MaterializationRun.iri so generatingContextRef is produced by the
      canonical mapping rather than injected by an adapter"
    - "v0.6.0: Added strict identity, source-locator, fact-version and batch
      control contracts"
    - "v0.5.0: BREAKING - Implement ADR-011 single truth source architecture"
    - "v0.5.0: REMOVED Field.semanticMapping and SemanticFieldMapping (violated
      single truth source)"
    - "v0.5.0: SemanticMappingDefinition is now canonical truth source with
      complete mapping capabilities"
    - "v0.5.0: Added SourceBinding, RowSetSpec, IdentitySpec for row-level
      semantics"
    - "v0.5.0: Renamed fieldMappings to slotMappings (supports attributes,
      roles, relations, pattern fields)"
    - "v0.5.0: Added MaterializationRun for immutable runtime state (separated
      from static definitions)"
    - "v0.5.0: Implement ADR-012 three-axis temporal model
      (valid/knowledge/availability)"
    - "v0.5.0: Added TemporalMappingSpec with explicit source bindings for all
      three time axes"
    - "v0.5.0: REMOVED MaterializationPlanDefinition.watermark (moved to
      MaterializationRun)"
    - "v0.5.0: All transformations require explicit named inputs, version,
      digest, test cases"
    - "v0.4.0: Removed Dataset.semanticMappings (ADR-007), Field.semanticMapping
      now sole truth source"
    - "v0.4.0: Added TransformationDefinition with typed references (ADR-007)"
    - "v0.4.0: Removed standalone FieldMappingDefinition (ADR-007)"
    - "v0.3.0: Global rename to *Definition suffix (ADR-004)"
    - "v0.3.0: Updated module system with version-locked imports"
    - "v0.3.0: Introduced TargetSlot union type for Association mapping
      (ADR-003)"
    - "v0.3.0: Created MaterializationPlanDefinition, deprecated
      IngestionPipelineDefinition"
  note: >
    Layer 4 maps PHYSICAL data artifacts to SEMANTIC ontology concepts.


    ADR-011 COMPLIANCE:

    - SemanticMappingDefinition is the ONLY structure for semantic mappings

    - Physical structure (FieldDefinition) contains NO semantic annotations

    - All row-level and dataset-level semantics expressible (joins, filters,
    identity, provenance, temporal)

    - Static definitions (plans) separated from runtime state (runs)


    ADR-012 COMPLIANCE:

    - Three-axis temporal model: valid time, knowledge time, availability time

    - All time sources explicitly declared in TemporalMappingSpec

    - No CURRENT_TIMESTAMP or non-reproducible time functions

    - MaterializationRun provides immutable runtime context for reproducible
    queries
  ArtifactRef:
    iri: https://axiolune.ai/ontology/meta/data-binding/ArtifactRef
    cnNote: 工件引用，是本体工程中对一个绝对工件或构建根下相对路径的闭引用，旨在为本体构建产物的引用提供可校验、可复现的基本单元。
    definition: a closed reference to either an absolute artifact IRI or one path below an explicitly named build root, intended to provide the verifiable, reproducible basic unit of reference for all build-artifact evidence locking in Layer 4
    owlProjection:
      kind: structuredValueClass
      classIri: https://axiolune.ai/ontology/meta/data-binding/structures/ArtifactRef
    discriminator: kind
    variants:
      iri:
        requiredFields:
          kind:
            type: const
            value: iri
          iri:
            type: uri
      path:
        requiredFields:
          kind:
            type: const
            value: path
          root:
            type: enum
            values:
              - sourceTree
              - buildEvidence
              - payload
              - adoptionEvidence
          path:
            type: posixRelativePath
  SourceLocator:
    iri: https://axiolune.ai/ontology/meta/data-binding/SourceLocator
    cnNote: 来源定位器，是本体工程中在锁定源工件内精确选定一段非空字节的闭媒体感知选择器，旨在让"证据来自哪几个字节"可复现、可审计。
    definition: a closed media-aware selector for one canonical non-empty byte selection inside a locked source artifact, intended to make "which exact bytes the evidence came from" reproducible and auditable
    owlProjection:
      kind: structuredValueClass
      classIri: https://axiolune.ai/ontology/meta/data-binding/structures/SourceLocator
    discriminator: kind
    commonRequiredFields:
      path:
        type: posixRelativePath
      mediaType:
        type: ianaMediaType
      extractorProfileRef:
        type: ArtifactRef
      extractorProfileDigest:
        type: digest
      selectionDigest:
        type: digest
    variants:
      wholeFile:
        requiredFields:
          kind:
            type: const
            value: wholeFile
      textLineRange:
        requiredFields:
          kind:
            type: const
            value: textLineRange
          startLine:
            type: positiveSafeInteger
          endLine:
            type: positiveSafeInteger
      textHeading:
        requiredFields:
          kind:
            type: const
            value: textHeading
          heading:
            type: nfcString
            minLength: 1
          occurrence:
            type: positiveSafeInteger
        optionalFields:
          headingLevel:
            type: positiveSafeInteger
      pdfPageRange:
        requiredFields:
          kind:
            type: const
            value: pdfPageRange
          startPage:
            type: positiveSafeInteger
          endPage:
            type: positiveSafeInteger
      pdfNamedSection:
        requiredFields:
          kind:
            type: const
            value: pdfNamedSection
          sectionTitle:
            type: nfcString
            minLength: 1
          occurrence:
            type: positiveSafeInteger
        optionalFields:
          startPage:
            type: positiveSafeInteger
          endPage:
            type: positiveSafeInteger
      jsonPointer:
        requiredFields:
          kind:
            type: const
            value: jsonPointer
          pointer:
            type: canonicalJsonPointer
      rdfResource:
        requiredFields:
          kind:
            type: const
            value: rdfResource
          resourceIri:
            type: uri
        optionalFields:
          graphIri:
            type: uri
      xmlElement:
        requiredFields:
          kind:
            type: const
            value: xmlElement
          elementId:
            type: xmlId
      htmlFragment:
        requiredFields:
          kind:
            type: const
            value: htmlFragment
          fragmentId:
            type: nfcString
            minLength: 1
    invariants:
      - range starts are not greater than range ends
      - pdfNamedSection startPage and endPage are both present or both absent
      - mediaType and selector kind are accepted by the locked extractor profile
      - selectionDigest is recomputed from the exact selected bytes
  sourceArtifactRef:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
    namespace: ax-binding
    localName: sourceArtifactRef
    label: Source Artifact Reference
    definition: closed artifact reference that identifies the immutable source
      artifact supporting a materialized claim
    valueType: ArtifactRef
  sourceArtifactDigest:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
    namespace: ax-binding
    localName: sourceArtifactDigest
    label: Source Artifact Digest
    definition: SHA-256 digest that authenticates the exact immutable source
      artifact supporting a materialized claim
    valueType: string
    pattern: ^sha256:[0-9a-f]{64}$
  sourceLocator:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
    namespace: ax-binding
    localName: sourceLocator
    label: Source Locator
    definition: closed media-aware source selector whose locked extraction
      identifies the exact supporting bytes
    valueType: SourceLocator
  SemanticValueDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/SemanticValueDefinition
    cnNote: 语义值定义，是本体工程中描述一个可见本体值的闭定位器，旨在为身份组件与派生提供语义输入，是身份契约与派生的基本构成单元。
    definition: a closed semantic locator for one visible ontology value used by an identity component or derivation, intended to provide the semantic input for identity contracts and derivations
    discriminator: valueKind
    variants:
      attributeUse:
        requiredFields:
          valueKind:
            type: const
            value: attributeUse
          containingType:
            type: uri
          attributeRef:
            type: uri
      participantRole:
        requiredFields:
          valueKind:
            type: const
            value: participantRole
          containingAssociation:
            type: uri
          roleId:
            type: asciiIdentifier
          effectivePredicate:
            type: uri
      relationUse:
        requiredFields:
          valueKind:
            type: const
            value: relationUse
          relationRef:
            type: uri
          subjectType:
            type: uri
          objectType:
            type: uri
      patternField:
        requiredFields:
          valueKind:
            type: const
            value: patternField
          containingType:
            type: uri
          patternRef:
            type: uri
          fieldRef:
            type: uri
      derivation:
        requiredFields:
          valueKind:
            type: const
            value: derivation
          derivationRef:
            type: uri
          derivationDigest:
            type: digest
          outputName:
            type: asciiIdentifier
  IdentityComponentDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/IdentityComponentDefinition
    cnNote: 身份组件，是本体工程中逻辑身份或版本身份的一个有序语义分量，旨在为事实的稳定 IRI 构造提供可组合的砖块。
    definition: one ordered semantic component of a target logical or version identity, intended to provide composable bricks for constructing a fact's stable IRI
    requiredFields:
      name:
        type: asciiIdentifier
      semanticValue:
        type: SemanticValueDefinition
      termContractRef:
        type: uri
      termContractDigest:
        type: digest
      normalizationRuleRef:
        type: uri
      normalizationRuleDigest:
        type: digest
  IdentityTermContractDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/IdentityTermContractDefinition
    cnNote: 身份术语契约，是本体工程中版本化的闭 RDF 项契约，旨在规定身份组件如何成帧为规范 RDF 项，保证身份的可复现性。
    definition: a versioned closed RDF-term contract used by identity components, intended to prescribe how identity components frame into canonical RDF terms, ensuring identity reproducibility
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
      definition:
        type: string
      termContract:
        type: IdentityTermContract
    structures:
      IdentityTermContract:
        discriminator: termKind
        variants:
          factReference:
            requiredFields:
              termKind:
                type: const
                value: iri
              referenceMode:
                type: enum
                values:
                  - logical
                  - version
              expectedTargetType:
                type: uri
          controlledIri:
            requiredFields:
              termKind:
                type: const
                value: iri
              referenceMode:
                type: const
                value: controlledIri
              controlledSetRef:
                type: uri
              controlledSetDigest:
                type: digest
          literal:
            requiredFields:
              termKind:
                type: const
                value: literal
              datatypeIri:
                type: uri
            optionalFields:
              languageTag:
                type: canonicalBcp47
  IdentityNormalizationRuleDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/IdentityNormalizationRuleDefinition
    cnNote: 身份规范化规则，是本体工程中成帧前施加的确定性规范化，旨在把输入术语转成输出术语，保证身份归一化的可复现。
    definition: a versioned deterministic normalization rule applied before identity-term framing, intended to convert input terms into output terms, ensuring identity normalization is reproducible
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
      definition:
        type: string
      inputTermContractRef:
        type: uri
      inputTermContractDigest:
        type: digest
      outputTermContractRef:
        type: uri
      outputTermContractDigest:
        type: digest
      algorithmId:
        type: asciiIdentifier
      algorithmVersion:
        type: semver
      specificationRef:
        type: ArtifactRef
      specificationDigest:
        type: digest
      implementationRef:
        type: ArtifactRef
      implementationDigest:
        type: digest
      testVectorsRef:
        type: ArtifactRef
      testVectorsDigest:
        type: digest
  IdentityDerivationDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/IdentityDerivationDefinition
    cnNote: 身份派生，是本体工程中从语义输入确定性派生命名身份输出的闭规则，旨在规定"如何由语义算出 IRI"，使身份构造可审计。
    definition: a versioned deterministic derivation from declared semantic inputs to one or more named identity outputs, intended to prescribe "how to compute an IRI from semantics", making identity construction auditable
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
      definition:
        type: string
      inputSemanticValues:
        type: list[SemanticValueDefinition]
        minCount: 1
        ordered: true
      outputs:
        type: list[IdentityDerivationOutput]
        minCount: 1
        uniqueBy: outputName
        order: outputName
      expressionRef:
        type: ArtifactRef
      expressionDigest:
        type: digest
      implementationRef:
        type: ArtifactRef
      implementationDigest:
        type: digest
      testVectorsRef:
        type: ArtifactRef
      testVectorsDigest:
        type: digest
    structures:
      IdentityDerivationOutput:
        requiredFields:
          outputName:
            type: asciiIdentifier
          termContractRef:
            type: uri
          termContractDigest:
            type: digest
  ControlledIriSetDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/ControlledIriSetDefinition
    cnNote: 受控 IRI 集合，是本体工程中版本化的非空规范 IRI 集合，旨在为受控身份组件提供可版本化、带证据锁的 IRI 白名单。
    definition: a versioned non-empty canonical set of IRIs authorized for controlled identity components, intended to provide a versionable, evidence-locked IRI whitelist for controlled identity
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
      definition:
        type: string
      setKind:
        type: enum
        values:
          - codeList
          - reviewedIriInventory
      sourceDefinitionRef:
        type: uri
      sourceEvidenceRef:
        type: uri
      sourceEvidenceDigest:
        type: digest
      sourceLocator:
        type: SourceLocator
      members:
        type: list[uri]
        minCount: 1
        unique: true
        order: unsignedUtf8
  TargetIdentityContractDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/TargetIdentityContractDefinition
    cnNote: 目标身份契约，是本体工程中为某物化目标类型决定稳定逻辑身份与不可变版本身份的静态契约，旨在为身份规格提供权威依据。
    definition: a static contract that determines stable logical and immutable version identity for one materialized target type, intended to provide the authoritative basis for identity specs
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
      definition:
        type: string
      targetType:
        type: union[ObjectTypeDefinition,AssociationTypeDefinition]
      identityBaseIri:
        type: uri
      logicalComponents:
        type: list[IdentityComponentDefinition]
        minCount: 1
        ordered: true
      versionComponents:
        type: list[IdentityComponentDefinition]
        ordered: true
  ReferenceIdentityBinding:
    iri: https://axiolune.ai/ontology/meta/data-binding/ReferenceIdentityBinding
    cnNote: 引用身份绑定，是本体工程中通过已接受身份契约解析被引用目标的机制，旨在声明"引用走哪条身份"，支持逻辑或版本两种引用模式。
    definition: a mapping binding that resolves a referenced target through its accepted identity contract, intended to declare "which identity a reference follows", supporting both logical and version reference modes
    requiredFields:
      bindingType:
        type: const
        value: referenceIdentity
      targetMappingRef:
        type: uri
      referenceMode:
        type: enum
        values:
          - logical
          - version
      keyBindings:
        type: map[string,ValueBinding]
  FactIdentity:
    iri: https://axiolune.ai/ontology/meta/data-binding/FactIdentity
    cnNote: 事实身份，是本体工程中一个版本化物化对象的稳定逻辑身份锚，旨在把"同一个事实的不同版本"归并到同一逻辑身份之下。
    definition: a generic stable logical identity anchor for one versioned materialized object or association, intended to unify "different versions of the same fact" under one logical identity
    owlProjection:
      kind: class
      classIri: https://axiolune.ai/ontology/meta/data-binding/FactIdentity
  FactVersion:
    iri: https://axiolune.ai/ontology/meta/data-binding/FactVersion
    cnNote: 事实版本，是本体工程中一个不可变物化事实版本的标记类型，旨在作为实际的数据载体，通过取代关系形成版本链。
    definition: a generic marker class for one immutable materialized fact version, intended to serve as the actual data carrier, forming a version chain through the supersedes relation
    owlProjection:
      kind: class
      classIri: https://axiolune.ai/ontology/meta/data-binding/FactVersion
  FactClosureAssertion:
    iri: https://axiolune.ai/ontology/meta/data-binding/FactClosureAssertion
    cnNote: 事实闭包断言，是本体工程中不修改旧版本即可关闭其时间区间的不变证据，旨在支持"超时不改写只追加闭包"的审计语义。
    definition: immutable evidence that closes one knowledge-time or availability-time interval without mutating the older fact version, intended to support the audit semantics of "append closure without rewriting the old version"
    owlProjection:
      kind: class
      classIri: https://axiolune.ai/ontology/meta/data-binding/FactClosureAssertion
  versionOf:
    iri: https://axiolune.ai/ontology/meta/data-binding/properties/versionOf
    cnNote: 版本归属关系，是从一个不可变事实版本指向其稳定事实身份锚的函数式语义关系，用于把同一个事实的不同版本归并到同一逻辑身份之下。
    definition: functional relation from one immutable FactVersion to its stable
      FactIdentity anchor
    owlProjection:
      kind: objectProperty
      propertyIri: https://axiolune.ai/ontology/meta/data-binding/properties/versionOf
      domain: https://axiolune.ai/ontology/meta/data-binding/FactVersion
      range: https://axiolune.ai/ontology/meta/data-binding/FactIdentity
      characteristics:
        - functional
  supersedes:
    iri: https://axiolune.ai/ontology/meta/data-binding/properties/supersedes
    cnNote: 取代关系，是从一个不可变事实版本指向其同一身份锚下直接前一版本的有向语义关系，用于构成版本链、记录新版本替换了哪个旧版本。
    definition: relation from one immutable FactVersion to its direct previous
      version with the same FactIdentity anchor
    owlProjection:
      kind: objectProperty
      propertyIri: https://axiolune.ai/ontology/meta/data-binding/properties/supersedes
      domain: https://axiolune.ai/ontology/meta/data-binding/FactVersion
      range: https://axiolune.ai/ontology/meta/data-binding/FactVersion
  generatingContextRef:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
    namespace: ax-binding
    localName: generatingContextRef
    label: Generating Context Reference
    definition: reference to the immutable MaterializationRun or
      MaterializationBatchRun that generated this fact version
    valueType: uri
  inputContextRef:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
    namespace: ax-binding
    localName: inputContextRef
    label: Input Context Reference
    definition: reference to the immutable resolved input-context record used to
      generate this fact version
    valueType: uri
  inputContextRecordDigest:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
    namespace: ax-binding
    localName: inputContextRecordDigest
    label: Input Context Record Digest
    definition: SHA-256 digest of the immutable resolved input-context record used
      to generate this fact version
    valueType: string
    pattern: ^sha256:[0-9a-f]{64}$
  pitRequestRef:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
    namespace: ax-binding
    localName: pitRequestRef
    label: PIT Request Reference
    definition: reference to the exact immutable PITValidationRequest authorizing
      point-in-time consumption
    valueType: uri
  pitRequestRecordDigest:
    iri: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
    namespace: ax-binding
    localName: pitRequestRecordDigest
    label: PIT Request Record Digest
    definition: SHA-256 digest of the exact immutable PITValidationRequest
      authorizing point-in-time consumption
    valueType: string
    pattern: ^sha256:[0-9a-f]{64}$
  DataSource:
    iri: https://axiolune.ai/ontology/meta/data-binding/DataSource
    cnNote: 数据源，是本体工程中外部或内部数据提供方的元类型，旨在为数据的来源与访问方式提供带连接与认证的类型化定义。
    definition: a meta-classifier for external or internal data providers with connection and authentication metadata, intended to provide typed definitions for where data originates and how to access it
    purpose: Defines where data originates and how to access it
    requiredFields:
      iri:
        type: uri
        unique: true
      namespace:
        type: string
        required: true
      localName:
        type: string
        required: true
      label:
        type: string
        required: true
      definition:
        type: string
        required: true
        example: Bloomberg market data feed providing real-time and historical price
          information
      sourceType:
        type: enum
        required: true
        values:
          - relationalDatabase
          - documentDatabase
          - timeSeriesDatabase
          - objectStorage
          - fileSystem
          - restAPI
          - graphQL
          - grpc
          - streamingKafka
          - streamingKinesis
          - dataWarehouse
      connection:
        type: ConnectionSpec
        description: connection parameters (sensitive fields should reference secrets
          manager)
    optionalFields:
      vendor:
        type: string
        example: Bloomberg L.P.
      version:
        type: string
        example: BPIPE v3.14
      updateFrequency:
        type: enum
        values:
          - realtime
          - intraday
          - daily
          - weekly
          - monthly
          - onDemand
          - static
      latency:
        typical:
          type: duration
          example: PT0.5S
        maximum:
          type: duration
          example: PT2S
      reliability:
        sla:
          type: decimal
          description: uptime SLA as decimal
          example: 0.999
        historicalUptime:
          type: decimal
      costModel:
        type: string
        description: pricing structure
        example: per-query with 10k free tier
      dataGovernance:
        owner:
          type: string
        classification:
          type: enum
          values:
            - public
            - internal
            - confidential
            - restricted
        retentionPolicy:
          type: uri
          description: PolicyType reference
        privacyRegime:
          type: list[enum]
          values:
            - GDPR
            - CCPA
            - SOX
            - MiFID
      provenance:
        type: Layer2:ProvenancedFact
        description: source metadata binding
    structures:
      ConnectionSpec:
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        schema:
          type: string
        credentialsRef:
          type: string
          description: reference to secrets manager entry
        ssl:
          type: boolean
          default: true
        connectionPoolSize:
          type: integer
          default: 10
        timeout:
          type: duration
          default: PT30S
  DatasetDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/DatasetDefinition
    cnNote: 数据集定义，是本体工程中数据源内逻辑数据集合的元类型，旨在为物理数据提供带 schema、分区与更新模式的逻辑视图。
    definition: a meta-classifier for logical collections of data within a data source, intended to provide a logical view of physical data with schema, partitioning, and update patterns
    purpose: Represents tables, collections, topics, or files that contain entity data
    requiredFields:
      iri:
        type: uri
        unique: true
      namespace:
        type: string
        required: true
      localName:
        type: string
        required: true
      label:
        type: string
        required: true
      definition:
        type: string
        required: true
        example: table containing daily end-of-day equity prices from all global
          exchanges
      dataSource:
        type: uri
        required: true
        description: reference to DataSource IRI
      physicalIdentifier:
        type: string
        required: true
        description: actual table name, file path, topic, or collection name
        example: market_data.equity_prices_eod
    optionalFields:
      schema:
        type: DatasetSchema
        description: physical schema definition
      partitioning:
        type: PartitioningSpec
        description: how dataset is partitioned (for performance and temporal queries)
      updatePattern:
        type: enum
        values:
          - append
          - upsert
          - snapshot
          - cdc
          - eventSourcing
        description: how data is updated
      temporalCoverage:
        startDate:
          type: instant
          description: earliest available data
        endDate:
          type: instant
          description: latest available data; null=ongoing
      volumetrics:
        rowCount:
          type: integer
        storageSize:
          type: string
          example: 1.2 TB
        growthRate:
          type: string
          example: 50 GB/month
      qualityMetrics:
        completeness:
          type: decimal
          description: fraction of non-null required fields
        accuracy:
          type: decimal
          description: measured accuracy vs reference data
        timeliness:
          type: duration
          description: typical lag from event to availability
    structures:
      DatasetSchema:
        fields:
          type: list[FieldDefinition]
        primaryKey:
          type: list[string]
        indexes:
          type: list[IndexDefinition]
      PartitioningSpec:
        strategy:
          type: enum
          values:
            - range
            - hash
            - list
            - composite
        partitionKeys:
          type: list[string]
        example:
          strategy: range
          partitionKeys:
            - trade_date
  FieldDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/FieldDefinition
    cnNote: 字段定义，是本体工程中物理数据集 schema 里的字段元类型，旨在描述字段的物理结构，本身不含语义注解，语义由语义映射表达。
    definition: a meta-classifier for physical field definitions in dataset schemas, intended to describe the physical structure of fields; it contains no semantic annotations, as all semantics are expressed by SemanticMappingDefinition
    purpose: Defines the structure of fields in physical datasets
    requiredFields:
      name:
        type: string
        required: true
        description: field name in the physical schema
      dataType:
        type: string
        required: true
        description: native data type in source system
        example: VARCHAR(255), DECIMAL(18,4), TIMESTAMP
    optionalFields:
      nullable:
        type: boolean
        default: true
      primaryKey:
        type: boolean
        default: false
      foreignKey:
        type: ForeignKeyReference
      defaultValue:
        type: any
      constraints:
        type: list[uri]
        description: references to ConstraintDefinition IRIs
      description:
        type: string
    structures:
      ForeignKeyReference:
        targetDataset:
          type: uri
          required: true
          description: referenced DatasetDefinition IRI
        targetField:
          type: string
          required: true
        onDelete:
          type: enum
          values:
            - cascade
            - setNull
            - restrict
          default: restrict
        onUpdate:
          type: enum
          values:
            - cascade
            - setNull
            - restrict
          default: restrict
  IndexDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/IndexDefinition
    cnNote: 索引定义，是本体工程中物理数据集索引结构的元类型，旨在为查询性能优化提供索引的类型化定义。
    definition: a meta-classifier for physical index structures in datasets, intended to provide typed definitions of index structures for query performance optimization
    purpose: Defines indexes for query performance optimization
    requiredFields:
      name:
        type: string
        required: true
        description: index name
      fields:
        type: list[string]
        required: true
        minCount: 1
        description: field names included in this index
    optionalFields:
      unique:
        type: boolean
        default: false
        description: whether this is a unique index
      indexType:
        type: enum
        values:
          - BTree
          - Hash
          - GiST
          - GIN
          - BRIN
        default: BTree
        description: physical index structure type
      partial:
        type: string
        description: partial index predicate expression
  SourceBinding:
    iri: https://axiolune.ai/ontology/meta/data-binding/SourceBinding
    cnNote: 来源绑定，是本体工程中语义映射的物理数据源与行集操作规格，旨在声明"从哪些表如何取行"，支持多表连接与聚合。
    definition: a specification of physical data sources and row-set operations for semantic mapping, intended to declare "which tables and how to read rows from them", supporting multi-table joins and aggregation
    purpose: Enables multi-table joins, filtering, and aggregation before field mapping
    requiredFields:
      datasets:
        type: list[DatasetReference]
        required: true
        minCount: 1
        description: physical datasets to read from
    optionalFields:
      rowSet:
        type: RowSetSpec
        description: row-level operations applied before mapping to slots
    structures:
      DatasetReference:
        dataset:
          type: uri
          required: true
          description: DatasetDefinition IRI
        alias:
          type: string
          required: true
          description: alias for use in field references and expressions
  RowSetSpec:
    iri: https://axiolune.ai/ontology/meta/data-binding/RowSetSpec
    cnNote: 行集规格，是本体工程中在槽映射前施加的行级操作，旨在表达字段级映射无法表达的多表连接、过滤与分组逻辑。
    definition: a specification of row-level operations applied before slot mapping, intended to express multi-table joins, filters, and grouping logic that field-level mapping cannot express
    purpose: Expresses joins, filters, and aggregations that field-level mappings
      cannot express
    optionalFields:
      filters:
        type: list[FilterExpression]
        description: row filtering conditions
      joins:
        type: list[JoinExpression]
        description: multi-table join specifications
      grouping:
        type: GroupingSpec
        description: aggregation specification for derived entities
    structures:
      FilterExpression:
        dataset:
          type: string
          required: true
          description: dataset alias from SourceBinding
        field:
          type: string
          required: true
          description: field name in dataset
        operator:
          type: enum
          required: true
          values:
            - =
            - "!="
            - ">"
            - <
            - ">="
            - <=
            - IN
            - NOT IN
            - LIKE
            - IS NULL
            - IS NOT NULL
        value:
          type: any
          description: comparison value (null for IS NULL / IS NOT NULL)
      JoinExpression:
        leftDataset:
          type: string
          required: true
          description: left dataset alias
        rightDataset:
          type: string
          required: true
          description: right dataset alias
        joinType:
          type: enum
          required: true
          values:
            - inner
            - left
            - right
            - full
          default: inner
        conditions:
          type: list[JoinCondition]
          required: true
          minCount: 1
      JoinCondition:
        leftField:
          type: string
          required: true
          description: field name in left dataset
        operator:
          type: string
          required: true
          default: =
          description: comparison operator
        rightField:
          type: string
          required: true
          description: field name in right dataset
      GroupingSpec:
        groupBy:
          type: list[FieldReference]
          required: true
          minCount: 1
          description: fields to group by
        aggregations:
          type: list[AggregationSpec]
          required: true
          minCount: 1
          description: aggregation functions to apply
      AggregationSpec:
        function:
          type: enum
          required: true
          values:
            - count
            - sum
            - avg
            - min
            - max
            - first
            - last
        sourceField:
          type: FieldReference
          description: source field (null for count)
        targetField:
          type: string
          required: true
          description: name for aggregated result
      FieldReference:
        dataset:
          type: string
          required: true
          description: dataset alias from SourceBinding
        field:
          type: string
          required: true
          description: field name in dataset
  IdentitySpec:
    iri: https://axiolune.ai/ontology/meta/data-binding/IdentitySpec
    cnNote: 身份规格，是本体工程中把物理值映射到目标身份契约有序组件的机制，旨在防止不同映射各自发明不兼容的身份键，强制走统一契约。
    definition: a contract-bound specification that maps physical values to the ordered components of one accepted TargetIdentityContractDefinition, intended to prevent independent mappings from inventing incompatible identity keys, enforcing a unified contract
    purpose: Prevents independent mappings from inventing incompatible logical keys,
      version keys, or IRI templates
    requiredFields:
      contractRef:
        type: uri
        required: true
        description: TargetIdentityContractDefinition IRI registered for the mapping target
      logicalKeyBindings:
        type: map[string,ValueBinding]
        required: true
        description: exact one-to-one bindings for all ordered logical components
      versionKeyBindings:
        type: map[string,ValueBinding]
        required: true
        description: exact one-to-one bindings for all ordered version components
  ValueBinding:
    iri: https://axiolune.ai/ontology/meta/data-binding/ValueBinding
    cnNote: 值绑定，是本体工程中槽取值的计算规格，旨在用闭联合类型声明"这个槽怎么填值"，支持直接取值、变换、字面量与运行时上下文。
    definition: a specification of value computation for slot population, intended to declare "how to fill this slot" via a closed union of direct field, transformation, literal, runtime context, and reference identity
    purpose: Union type supporting direct fields, transformations, literals, and
      runtime context
    discriminator: bindingType
    variants:
      DirectFieldBinding:
        description: value sourced directly from physical field
        fields:
          bindingType:
            type: literal
            value: directField
          source:
            type: FieldReference
            required: true
            description: source field reference
      TransformationBinding:
        description: value computed via versioned transformation
        fields:
          bindingType:
            type: literal
            value: transformation
          transformationRef:
            type: uri
            required: true
            description: TransformationDefinition IRI with version
          inputs:
            type: map[string, ValueBinding]
            required: true
            description: named inputs to transformation (keys match transformation.inputs)
      LiteralBinding:
        description: static literal value
        fields:
          bindingType:
            type: literal
            value: literal
          value:
            type: any
            required: true
            description: literal value of any type
      RuntimeContextBinding:
        description: value from immutable MaterializationRun context
        fields:
          bindingType:
            type: literal
            value: runtimeContext
          contextField:
            type: enum
            required: true
            values:
              - iri
              - assertionTime
              - referenceTime
              - runId
            description: closed field from MaterializationRun; iri is the exact
              generating-context IRI and the other values are immutable runtime
              scalars
            example: assertionTime
      ReferenceIdentityBinding:
        description: reference resolved through one accepted target identity contract
        fields:
          bindingType:
            type: literal
            value: referenceIdentity
          targetMappingRef:
            type: uri
            required: true
          referenceMode:
            type: enum
            required: true
            values:
              - logical
              - version
          keyBindings:
            type: map[string,ValueBinding]
            required: true
  SlotMapping:
    iri: https://axiolune.ai/ontology/meta/data-binding/SlotMapping
    cnNote: 槽映射，是本体工程中把源数据映射到本体槽的机制，旨在支持属性、参与者角色、关系与模式字段等多种映射目标。
    definition: a specification of target slot population, intended to support mapping to attributes, participant roles, relations, and pattern fields
    purpose: Maps source data to ontology slots (attributes, participant roles,
      relations, pattern fields)
    requiredFields:
      target:
        type: TargetSlot
        required: true
        description: slot to populate
      value:
        type: ValueBinding
        required: true
        description: value computation specification
  TransformationDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/TransformationDefinition
    cnNote: 变换定义，是本体工程中版本化的可复用变换逻辑，旨在为数据映射提供带类型化输入输出、实现摘要与测试用量的可复现变换。
    definition: a versioned reusable transformation logic for data mapping, intended to provide reproducible transformations with typed inputs, outputs, an implementation digest, and test cases
    purpose: Defines reproducible transformations with explicit inputs, outputs,
      version, digest, and test cases
    requiredFields:
      iri:
        type: uri
        unique: true
        required: true
      definition:
        type: string
        required: true
        description: clear definition of transformation purpose and behavior
      kind:
        type: enum
        required: true
        values:
          - LookupTransformation
          - MappingTransformation
          - ExpressionTransformation
          - ScriptTransformation
        description: type of transformation
      inputs:
        type: map[string, TypeReference]
        required: true
        description: named input parameters with explicit types
        example:
          isin: string
          sourceSystem: string
      outputs:
        type: TypeReference
        required: true
        description: output type specification
      version:
        type: string
        required: true
        description: semantic version (MAJOR.MINOR.PATCH)
        example: 1.2.0
      implementationDigest:
        type: string
        required: true
        description: SHA-256 digest of implementation artifact for reproducibility
        example: sha256:a3b2c1d4e5f6...
      testCases:
        type: list[TransformationTestCase]
        required: true
        minCount: 1
        description: test cases demonstrating correct behavior
    optionalFields:
      implementation:
        type: TransformationImplementation
        description: implementation details specific to transformation kind
    structures:
      TypeReference:
        definition: type specification for transformation inputs and outputs
        discriminator: typeKind
        variants:
          PrimitiveType:
            fields:
              typeKind:
                type: literal
                value: primitive
              primitiveType:
                type: enum
                required: true
                values:
                  - string
                  - integer
                  - decimal
                  - boolean
                  - instant
                  - duration
                  - uri
          StructuredType:
            fields:
              typeKind:
                type: literal
                value: structured
              typeRef:
                type: uri
                required: true
                description: ObjectTypeDefinition or ValueTypeDefinition IRI
          ListType:
            fields:
              typeKind:
                type: literal
                value: list
              elementType:
                type: TypeReference
                required: true
                description: type of list elements
      TransformationImplementation:
        lookupTable:
          type: uri
          description: reference to lookup table dataset
        lookupKeyField:
          type: string
        lookupValueField:
          type: string
        cacheSeconds:
          type: integer
        onMissingKey:
          type: enum
          values:
            - error
            - null
            - default
        defaultValue:
          type: string
        mapping:
          type: map[string,string]
          description: static key-value mappings
        expression:
          type: string
          description: transformation expression
        language:
          type: enum
          values:
            - sql
            - jsonPath
            - jq
            - python
        scriptPath:
          type: string
        entrypoint:
          type: string
        runtime:
          type: enum
          values:
            - python
            - javascript
            - wasm
      TransformationTestCase:
        input:
          type: any
        expectedOutput:
          type: any
        description:
          type: string
  TargetSlot:
    iri: https://axiolune.ai/ontology/meta/data-binding/TargetSlot
    cnNote: 目标槽，是本体工程中映射目标的闭联合类型，旨在让语义映射不仅能映射到属性，还能映射到参与者角色、关系与模式字段。
    definition: a union type representing different kinds of mapping targets, intended to let SemanticMappingDefinition map to not just attributes but also participant roles, relations, and pattern fields
    purpose: Allows SemanticMappingDefinition to target not just attributes but also
      Association participant roles, relations, and pattern-injected fields
    note: "Replaces simple targetAttribute: IRI with a discriminated union to
      support all mapping target types"
    discriminator: slotType
    variants:
      AttributeSlot:
        description: maps to an AttributeTypeDefinition
        fields:
          slotType:
            type: literal
            value: attribute
          targetAttribute:
            type: uri
            required: true
            description: AttributeTypeDefinition IRI
      ParticipantRoleSlot:
        description: maps to a participant role in an AssociationTypeDefinition
        fields:
          slotType:
            type: literal
            value: participantRole
          targetAssociation:
            type: uri
            required: true
            description: AssociationTypeDefinition IRI
          targetRole:
            type: string
            required: true
            description: ParticipantRole.id
      RelationSlot:
        description: maps to a RelationTypeDefinition
        fields:
          slotType:
            type: literal
            value: relation
          targetRelation:
            type: uri
            required: true
            description: RelationTypeDefinition IRI
          targetObjectType:
            type: uri
            required: false
            description: range ObjectTypeDefinition IRI (for disambiguation)
      PatternFieldSlot:
        description: maps to a field injected by a Layer 2 pattern
        fields:
          slotType:
            type: literal
            value: patternField
          targetPattern:
            type: uri
            required: true
            description: PatternDefinition IRI
          targetField:
            type: string
            required: true
            description: injected attribute local name
  TimeAxisBinding:
    iri: https://axiolune.ai/ontology/meta/data-binding/TimeAxisBinding
    cnNote: 时间轴绑定，是本体工程中一个时间轴区间的绑定规格，旨在为三轴时间映射的每条轴声明起止与闭包策略。
    definition: a binding specification for one temporal axis (from/to interval), intended to declare the start, end, and close policy for each of the three axes in a temporal mapping spec
    purpose: Expresses how to populate one of three time axes per ADR-012
    requiredFields:
      from:
        type: ValueBinding
        required: true
        description: start of time interval (inclusive)
    optionalFields:
      to:
        type: ValueBinding
        description: end of time interval (exclusive); null means unbounded
      closePolicy:
        type: enum
        values:
          - closePreviousVersion
          - explicitOnly
        description: how to set knowledgeTo for superseded versions (knowledgeTime axis
          only)
        default: closePreviousVersion
  ProvenanceBinding:
    iri: https://axiolune.ai/ontology/meta/data-binding/ProvenanceBinding
    cnNote: 溯源绑定，是本体工程中把物理字段映射到来源模式字段的机制，旨在捕获数据的来源、采集时间与责任方等溯源元数据。
    definition: a specification of data provenance metadata capture, intended to map physical fields to Layer 2 provenance pattern fields, capturing source, acquisition time, and responsible agent
    purpose: Maps physical fields to Layer 2 provenance pattern fields
    optionalFields:
      sourceSystem:
        type: ValueBinding
        description: identifier of originating system
      acquisitionTime:
        type: ValueBinding
        description: when data was acquired from source
      responsibleAgent:
        type: ValueBinding
        description: agent responsible for data acquisition
      confidence:
        type: ValueBinding
        description: confidence score or quality metric
  TemporalMappingSpec:
    iri: https://axiolune.ai/ontology/meta/data-binding/TemporalMappingSpec
    cnNote: 时序映射规格，是本体工程中三轴时间模型的显式源绑定，旨在为有效时间、知识时间与可用时间三条轴同时声明来源，防止前视偏差。
    definition: a specification of three-axis temporal semantics mapping, intended to explicitly bind sources for valid time, knowledge time, and availability time simultaneously, preventing look-ahead bias
    purpose: Maps physical time fields to valid time, knowledge time, and
      availability time axes
    note: >
      This spec is the three-axis (TemporalFact) temporal mapping. All three
      axes

      (validTime, knowledgeTime, availabilityTime) are REQUIRED so a
      TemporalFact

      mapping cannot silently omit an axis (ADR-012). Single-axis temporal
      patterns

      (e.g., TemporalObservation) bind their fields (observedAt/recordedAt) via

      slotMappings with slotType: patternField, NOT via this spec.
    requiredFields:
      patternRef:
        type: uri
        required: true
        description: temporal pattern IRI (e.g., ax-pattern:TemporalFact)
      validTime:
        type: TimeAxisBinding
        required: true
        description: when fact holds true in reality (business time) — required for
          three-axis completeness
      knowledgeTime:
        type: TimeAxisBinding
        required: true
        description: when platform knows/retracts this version (transaction time) —
          required; SHOULD bind assertionTime from runtime context
      availabilityTime:
        type: TimeAxisBinding
        required: true
        description: when consumers can use this data (regulatory/access control time) —
          required; prevents look-ahead bias
  SemanticMappingDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/SemanticMappingDefinition
    cnNote: 语义映射定义，是本体工程中物理数据到本体概念的唯一权威映射结构，旨在把所有映射能力统一到单一真相源，是物理到语义的桥梁。
    definition: the canonical specification of mapping between physical data and ontology concepts, intended to unify all mapping capabilities into a single truth source; it is the bridge from physical data to semantics
    purpose: Single truth source for all semantic mappings per ADR-011
    note: Replaces all field-level, dataset-level, and inline mappings with unified
      structure
    requiredFields:
      iri:
        type: uri
        unique: true
        required: true
      label:
        type: string
        required: true
      source:
        type: SourceBinding
        required: true
        description: physical data sources with row-set operations
      targetType:
        type: uri
        required: true
        description: ObjectTypeDefinition or AssociationTypeDefinition IRI
        example: fin:Equity
      mappingType:
        type: enum
        required: true
        values:
          - directTable
          - joinedTables
          - aggregation
          - transformation
          - view
          - denormalized
      identity:
        type: IdentitySpec
        required: true
        description: contract-bound logical and version identity; mandatory for every
          concrete materialized domain target
    optionalFields:
      slotMappings:
        type: list[SlotMapping]
        description: mappings to attributes, participant roles, relations, and pattern
          fields
      temporal:
        type: TemporalMappingSpec
        description: three-axis temporal semantics per ADR-012
      provenance:
        type: ProvenanceBinding
        description: provenance metadata capture specification
      validationRules:
        type: list[ValidationRule]
        description: data quality checks applied during materialization
      priority:
        type: integer
        default: 0
        description: when multiple mappings provide same attribute, higher priority wins
      effectiveDate:
        type: instant
        description: when this mapping became active
      expirationDate:
        type: instant
        description: when this mapping should no longer be used
    structures:
      ValidationRule:
        id:
          type: string
          required: true
        type:
          type: enum
          values:
            - required
            - format
            - range
            - uniqueness
            - referentialIntegrity
            - custom
          required: true
        expression:
          type: string
          required: true
        failureAction:
          type: enum
          values:
            - reject
            - quarantine
            - accept-with-warning
          required: true
        severity:
          type: enum
          values:
            - error
            - warning
            - info
          default: error
  MaterializationBatchDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/MaterializationBatchDefinition
    cnNote: 物化批次定义，是本体工程中多个物化计划在单一快照与时间上下文上的原子组合，旨在保证跨计划的事务一致性。
    definition: a static atomic composition of multiple module-scoped MaterializationPlanDefinitions over one source snapshot and one temporal context, intended to guarantee transactional consistency across plans
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
      definition:
        type: string
      plans:
        type: list[uri]
        minCount: 1
        unique: true
        order: unsignedUtf8
      targetDataset:
        type: uri
      consistencyRequirement:
        type: const
        value: Transactional
  MaterializationRun:
    iri: https://axiolune.ai/ontology/meta/data-binding/MaterializationRun
    cnNote: 物化运行，是本体工程中一次完成或失败的物化的不可变控制记录，旨在为可复现查询提供显式的时间上下文与输入证据锁。
    definition: an immutable standalone control record for one completed or failed module-scoped materialization, intended to provide explicit time context and input evidence locking for reproducible queries
    requiredFields:
      schemaVersion:
        type: const
        value: "1.0"
      iri:
        type: uri
        unique: true
      recordType:
        type: const
        value: materializationRun
      slotId:
        type: recordId
      runId:
        type: recordId
      attemptId:
        type: recordId
      plannedInputDigest:
        type: digest
      resolvedInputDigest:
        type: digest
      planRef:
        type: uri
      planSourceDigest:
        type: digest
      sourceSchemaClosureDigest:
        type: digest
      sourceSnapshotRootDigest:
        type: digest
      inputDatasets:
        type: list[InputDatasetSnapshot]
        minCount: 1
        uniqueBy: dataset
        order: dataset
      mappingClosure:
        type: list[MappingClosureEntry]
        minCount: 1
        uniqueBy: mappingRef
        order: mappingRef
      mappingClosureDigest:
        type: digest
      ontologyClosureRef:
        type: ArtifactRef
      ontologyClosureDigest:
        type: digest
      referenceLockRef:
        type: ArtifactRef
      referenceLockDigest:
        type: digest
      build:
        type: BuildEvidenceBinding
      compilerDigest:
        type: digest
      validatorDigest:
        type: digest
      executorDigest:
        type: digest
      outputRdfCanonicalization:
        type: const
        value: RDFC-1.0
      assertionTime:
        type: instant
      referenceTime:
        type: instant
      result:
        type: MaterializationResult
  MaterializationPlanDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/MaterializationPlanDefinition
    cnNote: 物化计划定义，是本体工程中声明式物化规格，旨在定义"物化什么、数据如何映射"的静态配置，运行时状态与编排分离到运行与外部工具。
    definition: a declarative specification of ontology instance materialization from physical data sources, intended to define "what to materialize and how data maps to the ontology" as static configuration only; runtime state and orchestration are separated
    purpose: Defines WHAT should be materialized and HOW data maps to ontology
      (static configuration only per ADR-011)
    note: Runtime state moved to MaterializationRun per ADR-011; orchestration moved
      to external layer
    requiredFields:
      iri:
        type: uri
        unique: true
        required: true
      label:
        type: string
        required: true
      definition:
        type: string
        required: true
        description: purpose and scope of this materialization plan
      sourceDatasets:
        type: list[uri]
        required: true
        minCount: 1
        description: DatasetDefinition IRIs to be materialized
      targetOntologyModule:
        type: uri
        required: true
        description: OntologyModuleDefinition IRI where instances will be created
      semanticMappings:
        type: list[uri]
        required: true
        minCount: 1
        description: SemanticMappingDefinition IRIs that define how data maps to ontology
      materializationMode:
        type: enum
        required: true
        values:
          - Incremental
          - Full
          - CDC
          - EventSourcing
        description: how materialization handles updates
    optionalFields:
      consistencyRequirement:
        type: enum
        values:
          - Eventual
          - Snapshot
          - Transactional
        default: Eventual
        description: consistency level required for materialized instances
      validationRules:
        type: list[ConstraintBinding]
        description: validation rules applied during materialization
      conflictResolution:
        type: ConflictResolutionStrategy
        description: how to handle conflicts when multiple sources provide same data
      incrementalKey:
        type: string
        description: field name for incremental updates (e.g., updated_at timestamp)
      targetGraphUri:
        type: uri
        description: named graph URI where RDF triples will be stored
      owner:
        type: string
        description: team or role responsible for this plan
    structures:
      ConflictResolutionStrategy:
        strategy:
          type: enum
          required: true
          values:
            - AuthoritySource
            - TimestampPriority
            - ManualReview
            - Merge
            - RejectConflict
          description: how to resolve conflicts when multiple mappings provide same
            attribute
        authoritySourcePriority:
          type: list[uri]
          description: ordered list of DataSource IRIs by authority (highest first)
        timestampField:
          type: string
          description: field name for timestamp comparison (when strategy=TimestampPriority)
    deprecated_note: >
      IngestionPipelineDefinition with schedule, retry, monitoring has been
      deprecated.

      Use MaterializationPlanDefinition for declarative mapping specifications.

      For runtime orchestration, use dedicated workflow/orchestration tools
      (Airflow, Prefect, etc.)

      or the platform's runtime execution layer.
  DataLineage:
    iri: https://axiolune.ai/ontology/meta/data-binding/DataLineage
    cnNote: 数据血缘，是本体工程中跟踪数据流向与变换链的元类型，旨在为影响分析与调试提供从源到本体实例的可追溯链路。
    definition: a meta-classifier for tracking data flow and transformation chains, intended to provide a traceable link from sources through transformations to ontology instances for impact analysis and debugging
    purpose: Documents how data moves from sources through transformations to
      ontology instances
    requiredFields:
      iri:
        type: uri
        unique: true
      sourceDatasets:
        type: list[uri]
        description: upstream DatasetDefinition IRIs
      targetDatasets:
        type: list[uri]
        description: downstream DatasetDefinition IRIs or ontology instances
      transformations:
        type: list[uri]
        description: Transformation IRIs applied
    optionalFields:
      lineageGraph:
        type: string
        description: serialized graph representation (e.g., DOT, JSON-LD)
      updateFrequency:
        type: duration
        example: P1D
      lastRun:
        timestamp:
          type: instant
        status:
          type: enum
          values:
            - success
            - failure
            - partial
        recordsProcessed:
          type: integer
        recordsFailed:
          type: integer
  PITValidationRequest:
    iri: https://axiolune.ai/ontology/meta/data-binding/PITValidationRequest
    cnNote: PIT 校验请求，是本体工程中绑定物化证据、RDF 字节与三轴枢轴的不可变请求，旨在授权点-in-time 消费并防止前视偏差。
    definition: an immutable standalone request that binds exact materialization evidence, RDF bytes, explicit three-axis pivots, and a locked PIT validator, intended to authorize point-in-time consumption and prevent look-ahead bias
    requiredFields:
      schemaVersion:
        type: const
        value: "1.0"
      iri:
        type: uri
        unique: true
      slotId:
        type: recordId
      requestId:
        type: recordId
      attemptId:
        type: recordId
      plannedInputDigest:
        type: digest
      resolvedInputDigest:
        type: digest
      recordType:
        type: const
        value: pitRequest
      targetRdfCanonicalization:
        type: const
        value: RDFC-1.0
      asOfValid:
        type: instant
      asOfKnowledge:
        type: instant
      asOfAvailable:
        type: instant
      build:
        type: BuildEvidenceBinding
      validatorRef:
        type: ArtifactRef
      validatorDigest:
        type: digest
      materializationContext:
        type: MaterializationContext
  MaterializationBatchRun:
    iri: https://axiolune.ai/ontology/meta/data-binding/MaterializationBatchRun
    cnNote: 物化批次运行，是本体工程中一次完成或失败的原子物化批次的不可变控制记录，旨在为批次执行提供成员清单与输出摘要。
    definition: an immutable standalone control record for one completed or failed atomic materialization batch, intended to provide the member list and output digest for batch execution
    requiredFields:
      schemaVersion:
        type: const
        value: "1.0"
      iri:
        type: uri
        unique: true
      recordType:
        type: const
        value: materializationBatchRun
      slotId:
        type: recordId
      runId:
        type: recordId
      attemptId:
        type: recordId
      plannedInputDigest:
        type: digest
      resolvedInputDigest:
        type: digest
      batchRef:
        type: uri
      batchSourceDigest:
        type: digest
      sourceSnapshotRootDigest:
        type: digest
      ontologyClosureRef:
        type: ArtifactRef
      ontologyClosureDigest:
        type: digest
      referenceLockRef:
        type: ArtifactRef
      referenceLockDigest:
        type: digest
      build:
        type: BuildEvidenceBinding
      compilerDigest:
        type: digest
      validatorDigest:
        type: digest
      executorDigest:
        type: digest
      outputRdfCanonicalization:
        type: const
        value: RDFC-1.0
      assertionTime:
        type: instant
      referenceTime:
        type: instant
      targetDataset:
        type: uri
      result:
        type: MaterializationBatchResult
    structures:
      MaterializationBatchResult:
        discriminator: outcome
        variants:
          completed:
            requiredFields:
              outcome:
                type: const
                value: completed
              members:
                type: list[CompletedBatchMember]
                minCount: 1
                uniqueBy: planRef
                order: planRef
              outputDatasetDigest:
                type: digest
              validationReportRef:
                type: uri
              validationReportDigest:
                type: digest
          failed:
            requiredFields:
              outcome:
                type: const
                value: failed
              attemptedMembers:
                type: list[AttemptedBatchMember]
                uniqueBy: planRef
                order: planRef
              failureStage:
                type: asciiIdentifier
              failureReportRef:
                type: uri
              failureReportDigest:
                type: digest
              errors:
                type: list[ExecutionError]
                minCount: 1
  ValidationReport:
    iri: https://axiolune.ai/ontology/meta/data-binding/ValidationReport
    cnNote: 校验报告，是本体工程中一次实际执行的校验门的不可变机器证据信封，旨在为校验结果提供带规范化的可复现证据。
    definition: an immutable common machine-evidence envelope for one actually executed validation gate, intended to provide reproducible evidence with canonicalization and digest locking for validation results
    requiredFields:
      schemaVersion:
        type: const
        value: "1.0"
      iri:
        type: uri
        unique: true
      slotId:
        type: recordId
      reportId:
        type: recordId
      attemptId:
        type: recordId
      plannedInputDigest:
        type: digest
      resolvedInputDigest:
        type: digest
      recordType:
        type: const
        value: validationReport
      profileRef:
        type: uri
      gateId:
        type: asciiIdentifier
      reportKind:
        type: asciiIdentifier
      criterionRefs:
        type: list[uri]
        minCount: 1
        unique: true
        order: unsignedUtf8
      subjectRef:
        type: ArtifactRef
      build:
        type: BuildEvidenceBinding
      inputs:
        type: list[ArtifactBinding]
        minCount: 1
        uniqueBy: name
        order: name
      toolId:
        type: asciiIdentifier
      capabilityId:
        type: asciiIdentifier
      capabilityRef:
        type: ArtifactRef
      capabilityDigest:
        type: digest
      entrypointRef:
        type: ArtifactRef
      entrypointDigest:
        type: digest
      discoveryContractRef:
        type: ArtifactRef
      discoveryContractDigest:
        type: digest
      subjectInventoryRef:
        type: ArtifactRef
      subjectInventoryDigest:
        type: digest
      kindEvidence:
        type: KindEvidenceBinding
      counts:
        type: GateCounts
      result:
        type: GateResult
    optionalFields:
      requestRef:
        type: uri
      requestRecordDigest:
        type: digest
      contextRef:
        type: uri
      contextRecordDigest:
        type: digest
      recomputedTargetDigest:
        type: digest
      asOfValid:
        type: instant
      asOfKnowledge:
        type: instant
      asOfAvailable:
        type: instant
      memberRunRecordDigests:
        type: list[digest]
        unique: true
        order: unsignedUtf8
      outputDatasetDigest:
        type: digest
    invariants:
      - PIT reports require exactly requestRef, requestRecordDigest, contextRef,
        contextRecordDigest, recomputedTargetDigest, asOfValid, asOfKnowledge,
        and asOfAvailable
      - Batch reports require exactly memberRunRecordDigests and
        outputDatasetDigest
      - all other report kinds forbid PIT- and batch-specific optional fields
  FailureReport:
    iri: https://axiolune.ai/ontology/meta/data-binding/FailureReport
    cnNote: 失败报告，是本体工程中失败执行阶段的不可变独立证据记录，旨在为失败诊断提供阶段、输入与错误清单。
