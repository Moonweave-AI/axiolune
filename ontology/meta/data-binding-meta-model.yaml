# Axiolune Ontology Meta-Model - Layer 4: Data Binding
# Version: 0.5.0
# Date: 2026-07-29
# Governance: ADR-011 (Canonical Data Binding Truth Source), ADR-012 (Three-Axis Temporal Semantics)

module:
  moduleIri: "https://axiolune.ai/ontology/meta/data-binding"
  baseIri: "https://axiolune.ai/ontology/meta/data-binding/"
  preferredPrefix: "ax-binding"
  version: "0.5.0"
  imports:
    - moduleIri: "https://axiolune.ai/ontology/meta/core#sha256:df6c5aa670df2d1bc5444c283132d3142a54a44fe97a88b6a70220e8731e8821"
      version: "0.4.0"
      artifactDigest: "sha256:df6c5aa670df2d1bc5444c283132d3142a54a44fe97a88b6a70220e8731e8821"
      importMode: All
    - moduleIri: "https://axiolune.ai/ontology/meta/patterns#sha256:c03298a22caa07942caca8d0cafadec3c087ff64c8d92b4737fd0b26f213d40d"
      version: "0.4.0"
      artifactDigest: "sha256:c03298a22caa07942caca8d0cafadec3c087ff64c8d92b4737fd0b26f213d40d"
      importMode: All
    - moduleIri: "https://axiolune.ai/ontology/meta/behavior#sha256:d633bd3132bd549807b6ca1df518454c9173256d843d7f40f07500c253678185"
      version: "0.4.0"
      artifactDigest: "sha256:d633bd3132bd549807b6ca1df518454c9173256d843d7f40f07500c253678185"
      importMode: All
  exports: []

DataBinding:
  version: "0.5.0"
  description: "Meta-model for mapping physical data sources to ontology concepts (ADR-011, ADR-012 compliant)"
  layer: 4
  changes:
    - "v0.5.0: BREAKING - Implement ADR-011 single truth source architecture"
    - "v0.5.0: REMOVED Field.semanticMapping and SemanticFieldMapping (violated single truth source)"
    - "v0.5.0: SemanticMappingDefinition is now canonical truth source with complete mapping capabilities"
    - "v0.5.0: Added SourceBinding, RowSetSpec, IdentitySpec for row-level semantics"
    - "v0.5.0: Renamed fieldMappings to slotMappings (supports attributes, roles, relations, pattern fields)"
    - "v0.5.0: Added MaterializationRun for immutable runtime state (separated from static definitions)"
    - "v0.5.0: Implement ADR-012 three-axis temporal model (valid/knowledge/availability)"
    - "v0.5.0: Added TemporalMappingSpec with explicit source bindings for all three time axes"
    - "v0.5.0: REMOVED MaterializationPlanDefinition.watermark (moved to MaterializationRun)"
    - "v0.5.0: All transformations require explicit named inputs, version, digest, test cases"
    - "v0.4.0: Removed Dataset.semanticMappings (ADR-007), Field.semanticMapping now sole truth source"
    - "v0.4.0: Added TransformationDefinition with typed references (ADR-007)"
    - "v0.4.0: Removed standalone FieldMappingDefinition (ADR-007)"
    - "v0.3.0: Global rename to *Definition suffix (ADR-004)"
    - "v0.3.0: Updated module system with version-locked imports"
    - "v0.3.0: Introduced TargetSlot union type for Association mapping (ADR-003)"
    - "v0.3.0: Created MaterializationPlanDefinition, deprecated IngestionPipelineDefinition"

  note: |
    Layer 4 maps PHYSICAL data artifacts to SEMANTIC ontology concepts.

    ADR-011 COMPLIANCE:
    - SemanticMappingDefinition is the ONLY structure for semantic mappings
    - Physical structure (FieldDefinition) contains NO semantic annotations
    - All row-level and dataset-level semantics expressible (joins, filters, identity, provenance, temporal)
    - Static definitions (plans) separated from runtime state (runs)

    ADR-012 COMPLIANCE:
    - Three-axis temporal model: valid time, knowledge time, availability time
    - All time sources explicitly declared in TemporalMappingSpec
    - No CURRENT_TIMESTAMP or non-reproducible time functions
    - MaterializationRun provides immutable runtime context for reproducible queries

  # ==================== Data Source ====================
  DataSource:
    definition: "a meta-classifier for external or internal data providers with connection and authentication metadata"
    purpose: "Defines where data originates and how to access it"

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string, required: true}
      localName: {type: string, required: true}
      label: {type: string, required: true}

      definition:
        type: string
        required: true
        example: "Bloomberg market data feed providing real-time and historical price information"

      sourceType:
        type: enum
        required: true
        values:
          - relationalDatabase
          - documentDatabase
          - timeSeriesDatabase
          - objectStorage
          - fileSystem
          - restAPI
          - graphQL
          - grpc
          - streamingKafka
          - streamingKinesis
          - dataWarehouse

      connection:
        type: ConnectionSpec
        description: "connection parameters (sensitive fields should reference secrets manager)"

    optionalFields:
      vendor:
        type: string
        example: "Bloomberg L.P."

      version:
        type: string
        example: "BPIPE v3.14"

      updateFrequency:
        type: enum
        values: [realtime, intraday, daily, weekly, monthly, onDemand, static]

      latency:
        typical: {type: duration, example: "PT0.5S"}
        maximum: {type: duration, example: "PT2S"}

      reliability:
        sla: {type: decimal, description: "uptime SLA as decimal", example: 0.999}
        historicalUptime: {type: decimal}

      costModel:
        type: string
        description: "pricing structure"
        example: "per-query with 10k free tier"

      dataGovernance:
        owner: {type: string}
        classification: {type: enum, values: [public, internal, confidential, restricted]}
        retentionPolicy: {type: uri, description: "PolicyType reference"}
        privacyRegime: {type: "list[enum]", values: [GDPR, CCPA, SOX, MiFID]}

      provenance:
        type: "Layer2:ProvenancedFact"
        description: "source metadata binding"

    structures:
      ConnectionSpec:
        host: {type: string}
        port: {type: integer}
        database: {type: string}
        schema: {type: string}
        credentialsRef: {type: string, description: "reference to secrets manager entry"}
        ssl: {type: boolean, default: true}
        connectionPoolSize: {type: integer, default: 10}
        timeout: {type: duration, default: "PT30S"}

  # ==================== DatasetDefinition ====================
  DatasetDefinition:
    definition: "a meta-classifier for logical collections of data within a data source"
    purpose: "Represents tables, collections, topics, or files that contain entity data"

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string, required: true}
      localName: {type: string, required: true}
      label: {type: string, required: true}

      definition:
        type: string
        required: true
        example: "table containing daily end-of-day equity prices from all global exchanges"

      dataSource:
        type: uri
        required: true
        description: "reference to DataSource IRI"

      physicalIdentifier:
        type: string
        required: true
        description: "actual table name, file path, topic, or collection name"
        example: "market_data.equity_prices_eod"

    optionalFields:
      schema:
        type: DatasetSchema
        description: "physical schema definition"

      partitioning:
        type: PartitioningSpec
        description: "how dataset is partitioned (for performance and temporal queries)"

      updatePattern:
        type: enum
        values: [append, upsert, snapshot, cdc, eventSourcing]
        description: "how data is updated"

      temporalCoverage:
        startDate: {type: instant, description: "earliest available data"}
        endDate: {type: instant, description: "latest available data; null=ongoing"}

      volumetrics:
        rowCount: {type: integer}
        storageSize: {type: string, example: "1.2 TB"}
        growthRate: {type: string, example: "50 GB/month"}

      qualityMetrics:
        completeness: {type: decimal, description: "fraction of non-null required fields"}
        accuracy: {type: decimal, description: "measured accuracy vs reference data"}
        timeliness: {type: duration, description: "typical lag from event to availability"}

    structures:
      DatasetSchema:
        fields: {type: "list[FieldDefinition]"}
        primaryKey: {type: "list[string]"}
        indexes: {type: "list[IndexDefinition]"}

      PartitioningSpec:
        strategy: {type: enum, values: [range, hash, list, composite]}
        partitionKeys: {type: "list[string]"}
        example: {strategy: range, partitionKeys: ["trade_date"]}

  # ==================== Field Definition ====================
  FieldDefinition:
    definition: "a meta-classifier for physical field definitions in dataset schemas"
    purpose: "Defines the structure of fields in physical datasets"

    requiredFields:
      name:
        type: string
        required: true
        description: "field name in the physical schema"

      dataType:
        type: string
        required: true
        description: "native data type in source system"
        example: "VARCHAR(255), DECIMAL(18,4), TIMESTAMP"

    optionalFields:
      nullable:
        type: boolean
        default: true

      primaryKey:
        type: boolean
        default: false

      foreignKey:
        type: ForeignKeyReference

      defaultValue:
        type: any

      constraints:
        type: "list[uri]"
        description: "references to ConstraintDefinition IRIs"

      description:
        type: string

    structures:
      ForeignKeyReference:
        targetDataset: {type: uri, required: true, description: "referenced DatasetDefinition IRI"}
        targetField: {type: string, required: true}
        onDelete: {type: enum, values: [cascade, setNull, restrict], default: restrict}
        onUpdate: {type: enum, values: [cascade, setNull, restrict], default: restrict}

  # ==================== Index Definition ====================
  IndexDefinition:
    definition: "a meta-classifier for physical index structures in datasets"
    purpose: "Defines indexes for query performance optimization"

    requiredFields:
      name:
        type: string
        required: true
        description: "index name"

      fields:
        type: "list[string]"
        required: true
        minCount: 1
        description: "field names included in this index"

    optionalFields:
      unique:
        type: boolean
        default: false
        description: "whether this is a unique index"

      indexType:
        type: enum
        values: [BTree, Hash, GiST, GIN, BRIN]
        default: BTree
        description: "physical index structure type"

      partial:
        type: string
        description: "partial index predicate expression"

  # ==================== Source Binding (ADR-011) ====================
  SourceBinding:
    definition: "specification of physical data sources and row-set operations for semantic mapping according to genus-differentia form"
    purpose: "Enables multi-table joins, filtering, and aggregation before field mapping"

    requiredFields:
      datasets:
        type: "list[DatasetReference]"
        required: true
        minCount: 1
        description: "physical datasets to read from"

    optionalFields:
      rowSet:
        type: RowSetSpec
        description: "row-level operations applied before mapping to slots"

    structures:
      DatasetReference:
        dataset:
          type: uri
          required: true
          description: "DatasetDefinition IRI"

        alias:
          type: string
          required: true
          description: "alias for use in field references and expressions"

  # ==================== Row Set Spec (ADR-011) ====================
  RowSetSpec:
    definition: "row-level operations applied to source datasets before slot mapping according to genus-differentia form"
    purpose: "Expresses joins, filters, and aggregations that field-level mappings cannot express"

    optionalFields:
      filters:
        type: "list[FilterExpression]"
        description: "row filtering conditions"

      joins:
        type: "list[JoinExpression]"
        description: "multi-table join specifications"

      grouping:
        type: GroupingSpec
        description: "aggregation specification for derived entities"

    structures:
      FilterExpression:
        dataset:
          type: string
          required: true
          description: "dataset alias from SourceBinding"

        field:
          type: string
          required: true
          description: "field name in dataset"

        operator:
          type: enum
          required: true
          values: ["=", "!=", ">", "<", ">=", "<=", "IN", "NOT IN", "LIKE", "IS NULL", "IS NOT NULL"]

        value:
          type: any
          description: "comparison value (null for IS NULL / IS NOT NULL)"

      JoinExpression:
        leftDataset:
          type: string
          required: true
          description: "left dataset alias"

        rightDataset:
          type: string
          required: true
          description: "right dataset alias"

        joinType:
          type: enum
          required: true
          values: [inner, left, right, full]
          default: inner

        conditions:
          type: "list[JoinCondition]"
          required: true
          minCount: 1

      JoinCondition:
        leftField:
          type: string
          required: true
          description: "field name in left dataset"

        operator:
          type: string
          required: true
          default: "="
          description: "comparison operator"

        rightField:
          type: string
          required: true
          description: "field name in right dataset"

      GroupingSpec:
        groupBy:
          type: "list[FieldReference]"
          required: true
          minCount: 1
          description: "fields to group by"

        aggregations:
          type: "list[AggregationSpec]"
          required: true
          minCount: 1
          description: "aggregation functions to apply"

      AggregationSpec:
        function:
          type: enum
          required: true
          values: [count, sum, avg, min, max, first, last]

        sourceField:
          type: FieldReference
          description: "source field (null for count)"

        targetField:
          type: string
          required: true
          description: "name for aggregated result"

      FieldReference:
        dataset:
          type: string
          required: true
          description: "dataset alias from SourceBinding"

        field:
          type: string
          required: true
          description: "field name in dataset"

  # ==================== Identity Spec (ADR-011) ====================
  IdentitySpec:
    definition: "specification of entity identity determination and IRI construction according to genus-differentia form"
    purpose: "Defines logical keys, version keys, and IRI generation strategy for stable entity references"

    requiredFields:
      logicalKey:
        type: "list[FieldReference]"
        required: true
        minCount: 1
        description: "fields that uniquely identify entity across all versions"

      iriTemplate:
        type: string
        required: true
        description: "template for constructing entity IRI with {field} placeholders"
        example: "https://axiolune.ai/data/instruments/{isin}"

    optionalFields:
      versionKey:
        type: "list[FieldReference]"
        description: "fields that distinguish versions of same logical entity"

      namespace:
        type: string
        description: "namespace prefix for generated IRIs"
        example: "fin-inst"

  # ==================== Value Binding (ADR-011) ====================
  ValueBinding:
    definition: "specification of value computation for slot population according to genus-differentia form"
    purpose: "Union type supporting direct fields, transformations, literals, and runtime context"

    discriminator: bindingType

    variants:
      DirectFieldBinding:
        description: "value sourced directly from physical field"
        fields:
          bindingType:
            type: literal
            value: "directField"

          source:
            type: FieldReference
            required: true
            description: "source field reference"

      TransformationBinding:
        description: "value computed via versioned transformation"
        fields:
          bindingType:
            type: literal
            value: "transformation"

          transformationRef:
            type: uri
            required: true
            description: "TransformationDefinition IRI with version"

          inputs:
            type: "map[string, ValueBinding]"
            required: true
            description: "named inputs to transformation (keys match transformation.inputs)"

      LiteralBinding:
        description: "static literal value"
        fields:
          bindingType:
            type: literal
            value: "literal"

          value:
            type: any
            required: true
            description: "literal value of any type"

      RuntimeContextBinding:
        description: "value from immutable MaterializationRun context"
        fields:
          bindingType:
            type: literal
            value: "runtimeContext"

          contextField:
            type: string
            required: true
            description: "field from MaterializationRun (assertionTime, referenceTime, runId)"
            example: "assertionTime"

  # ==================== Slot Mapping (ADR-011) ====================
  SlotMapping:
    definition: "specification of target slot population according to genus-differentia form"
    purpose: "Maps source data to ontology slots (attributes, participant roles, relations, pattern fields)"

    requiredFields:
      target:
        type: TargetSlot
        required: true
        description: "slot to populate"

      value:
        type: ValueBinding
        required: true
        description: "value computation specification"

  # ==================== Transformation Definition (Enhanced for ADR-011) ====================
  TransformationDefinition:
    definition: "versioned reusable transformation logic for data mapping according to genus-differentia form"
    purpose: "Defines reproducible transformations with explicit inputs, outputs, version, digest, and test cases"

    requiredFields:
      iri: {type: uri, unique: true, required: true}

      definition:
        type: string
        required: true
        description: "clear definition of transformation purpose and behavior"

      kind:
        type: enum
        required: true
        values: [LookupTransformation, MappingTransformation, ExpressionTransformation, ScriptTransformation]
        description: "type of transformation"

      inputs:
        type: "map[string, TypeReference]"
        required: true
        description: "named input parameters with explicit types"
        example: {isin: "string", sourceSystem: "string"}

      outputs:
        type: TypeReference
        required: true
        description: "output type specification"

      version:
        type: string
        required: true
        description: "semantic version (MAJOR.MINOR.PATCH)"
        example: "1.2.0"

      implementationDigest:
        type: string
        required: true
        description: "SHA-256 digest of implementation artifact for reproducibility"
        example: "sha256:a3b2c1d4e5f6..."

      testCases:
        type: "list[TransformationTestCase]"
        required: true
        minCount: 1
        description: "test cases demonstrating correct behavior"

    optionalFields:
      implementation:
        type: TransformationImplementation
        description: "implementation details specific to transformation kind"

    structures:
      TypeReference:
        definition: "type specification for transformation inputs and outputs"

        discriminator: typeKind

        variants:
          PrimitiveType:
            fields:
              typeKind: {type: literal, value: "primitive"}
              primitiveType:
                type: enum
                required: true
                values: [string, integer, decimal, boolean, instant, duration, uri]

          StructuredType:
            fields:
              typeKind: {type: literal, value: "structured"}
              typeRef:
                type: uri
                required: true
                description: "ObjectTypeDefinition or ValueTypeDefinition IRI"

          ListType:
            fields:
              typeKind: {type: literal, value: "list"}
              elementType:
                type: TypeReference
                required: true
                description: "type of list elements"

      TransformationImplementation:
        # For LookupTransformation
        lookupTable:
          type: uri
          description: "reference to lookup table dataset"
        lookupKeyField: {type: string}
        lookupValueField: {type: string}
        cacheSeconds: {type: integer}
        onMissingKey: {type: enum, values: [error, null, default]}
        defaultValue: {type: string}

        # For MappingTransformation
        mapping:
          type: "map[string,string]"
          description: "static key-value mappings"

        # For ExpressionTransformation
        expression:
          type: string
          description: "transformation expression"
        language: {type: enum, values: [sql, jsonPath, jq, python]}

        # For ScriptTransformation
        scriptPath: {type: string}
        entrypoint: {type: string}
        runtime: {type: enum, values: [python, javascript, wasm]}

      TransformationTestCase:
        input: {type: any}
        expectedOutput: {type: any}
        description: {type: string}

  # ==================== Target Slot ====================
  TargetSlot:
    definition: "a union type representing different kinds of mapping targets (attributes, participant roles, relations, or pattern fields)"
    purpose: "Allows SemanticMappingDefinition to target not just attributes but also Association participant roles, relations, and pattern-injected fields"
    note: "Replaces simple targetAttribute: IRI with a discriminated union to support all mapping target types"

    discriminator: slotType

    variants:
      AttributeSlot:
        description: "maps to an AttributeTypeDefinition"
        fields:
          slotType: {type: literal, value: "attribute"}
          targetAttribute: {type: uri, required: true, description: "AttributeTypeDefinition IRI"}

      ParticipantRoleSlot:
        description: "maps to a participant role in an AssociationTypeDefinition"
        fields:
          slotType: {type: literal, value: "participantRole"}
          targetAssociation: {type: uri, required: true, description: "AssociationTypeDefinition IRI"}
          targetRole: {type: string, required: true, description: "ParticipantRole.id"}

      RelationSlot:
        description: "maps to a RelationTypeDefinition"
        fields:
          slotType: {type: literal, value: "relation"}
          targetRelation: {type: uri, required: true, description: "RelationTypeDefinition IRI"}
          targetObjectType: {type: uri, required: false, description: "range ObjectTypeDefinition IRI (for disambiguation)"}

      PatternFieldSlot:
        description: "maps to a field injected by a Layer 2 pattern"
        fields:
          slotType: {type: literal, value: "patternField"}
          targetPattern: {type: uri, required: true, description: "PatternDefinition IRI"}
          targetField: {type: string, required: true, description: "injected attribute local name"}

  # ==================== Time Axis Binding (ADR-012) ====================
  TimeAxisBinding:
    definition: "binding specification for one temporal axis (from/to intervals) according to genus-differentia form"
    purpose: "Expresses how to populate one of three time axes per ADR-012"

    requiredFields:
      from:
        type: ValueBinding
        required: true
        description: "start of time interval (inclusive)"

    optionalFields:
      to:
        type: ValueBinding
        description: "end of time interval (exclusive); null means unbounded"

      closePolicy:
        type: enum
        values: [closePreviousVersion, explicitOnly]
        description: "how to set knowledgeTo for superseded versions (knowledgeTime axis only)"
        default: closePreviousVersion

  # ==================== Provenance Binding (ADR-011) ====================
  ProvenanceBinding:
    definition: "specification of data provenance metadata capture according to genus-differentia form"
    purpose: "Maps physical fields to Layer 2 provenance pattern fields"

    optionalFields:
      sourceSystem:
        type: ValueBinding
        description: "identifier of originating system"

      acquisitionTime:
        type: ValueBinding
        description: "when data was acquired from source"

      responsibleAgent:
        type: ValueBinding
        description: "agent responsible for data acquisition"

      confidence:
        type: ValueBinding
        description: "confidence score or quality metric"

  # ==================== Temporal Mapping Spec (ADR-012) ====================
  TemporalMappingSpec:
    definition: "specification of three-axis temporal semantics mapping according to genus-differentia form and ADR-012"
    purpose: "Maps physical time fields to valid time, knowledge time, and availability time axes"
    note: |
      This spec is the three-axis (TemporalFact) temporal mapping. All three axes
      (validTime, knowledgeTime, availabilityTime) are REQUIRED so a TemporalFact
      mapping cannot silently omit an axis (ADR-012). Single-axis temporal patterns
      (e.g., TemporalObservation) bind their fields (observedAt/recordedAt) via
      slotMappings with slotType: patternField, NOT via this spec.

    requiredFields:
      patternRef:
        type: uri
        required: true
        description: "temporal pattern IRI (e.g., ax-pattern:TemporalFact)"

      validTime:
        type: TimeAxisBinding
        required: true
        description: "when fact holds true in reality (business time) — required for three-axis completeness"

      knowledgeTime:
        type: TimeAxisBinding
        required: true
        description: "when platform knows/retracts this version (transaction time) — required; SHOULD bind assertionTime from runtime context"

      availabilityTime:
        type: TimeAxisBinding
        required: true
        description: "when consumers can use this data (regulatory/access control time) — required; prevents look-ahead bias"

  # ==================== Semantic Mapping (ADR-011 Compliant) ====================
  SemanticMappingDefinition:
    definition: "canonical specification of mapping between physical data and ontology concepts according to genus-differentia form"
    purpose: "Single truth source for all semantic mappings per ADR-011"
    note: "Replaces all field-level, dataset-level, and inline mappings with unified structure"

    requiredFields:
      iri: {type: uri, unique: true, required: true}
      label: {type: string, required: true}

      source:
        type: SourceBinding
        required: true
        description: "physical data sources with row-set operations"

      targetType:
        type: uri
        required: true
        description: "ObjectTypeDefinition or AssociationTypeDefinition IRI"
        example: "fin:Equity"

      mappingType:
        type: enum
        required: true
        values:
          - directTable        # one table row = one entity instance
          - joinedTables       # entity requires joining multiple tables
          - aggregation        # entity derived from aggregating rows
          - transformation     # entity requires complex transformation
          - view               # entity sourced from database view
          - denormalized       # one table contains multiple related entity types

    optionalFields:
      slotMappings:
        type: "list[SlotMapping]"
        description: "mappings to attributes, participant roles, relations, and pattern fields"

      identity:
        type: IdentitySpec
        description: "entity identity and IRI construction specification"

      temporal:
        type: TemporalMappingSpec
        description: "three-axis temporal semantics per ADR-012"

      provenance:
        type: ProvenanceBinding
        description: "provenance metadata capture specification"

      validationRules:
        type: "list[ValidationRule]"
        description: "data quality checks applied during materialization"

      priority:
        type: integer
        default: 0
        description: "when multiple mappings provide same attribute, higher priority wins"

      effectiveDate:
        type: instant
        description: "when this mapping became active"

      expirationDate:
        type: instant
        description: "when this mapping should no longer be used"

    structures:
      ValidationRule:
        id: {type: string, required: true}
        type: {type: enum, values: [required, format, range, uniqueness, referentialIntegrity, custom], required: true}
        expression: {type: string, required: true}
        failureAction: {type: enum, values: [reject, quarantine, accept-with-warning], required: true}
        severity: {type: enum, values: [error, warning, info], default: error}

  # ==================== Materialization Run (ADR-011, ADR-012) ====================
  MaterializationRun:
    definition: "immutable record of one materialization execution according to genus-differentia form"
    purpose: "Separates runtime state from static definitions (ADR-011); provides immutable time context (ADR-012)"

    requiredFields:
      iri: {type: uri, unique: true, required: true}

      runId:
        type: string
        required: true
        unique: true
        description: "unique identifier for this run"
        example: "mr_2026-07-29_093000_abc123"

      planRef:
        type: uri
        required: true
        description: "MaterializationPlanDefinition IRI"

      assertionTime:
        type: instant
        required: true
        description: "when this run asserted knowledge (immutable, used for knowledgeFrom in ADR-012)"

      referenceTime:
        type: instant
        required: true
        description: "reference point for time-based queries (immutable, replaces CURRENT_TIMESTAMP)"

      inputSnapshotDigest:
        type: string
        required: true
        description: "SHA-256 digest of input dataset versions for reproducibility"

      inputDatasets:
        type: "list[InputDatasetSnapshot]"
        required: true
        minCount: 1
        description: "snapshot of input datasets at run time"

    optionalFields:
      status:
        type: enum
        values: [pending, running, completed, failed, partial]
        description: "execution status"

      startedAt: {type: instant, description: "when execution started"}
      completedAt: {type: instant, description: "when execution completed"}
      outputRowCount: {type: integer, description: "number of entity instances materialized"}

      watermark:
        type: any
        description: "watermark value for next incremental run (moved from plan per ADR-011)"

      errors:
        type: "list[ExecutionError]"
        description: "errors encountered during execution"

      metrics:
        type: ExecutionMetrics
        description: "performance and quality metrics"

    structures:
      InputDatasetSnapshot:
        dataset:
          type: uri
          required: true
          description: "DatasetDefinition IRI"

        versionDigest:
          type: string
          required: true
          description: "SHA-256 digest of dataset version"

        rowCount:
          type: integer
          description: "number of rows in snapshot"

        snapshotTime:
          type: instant
          required: true
          description: "when snapshot was taken"

      ExecutionError:
        severity:
          type: enum
          required: true
          values: [error, warning, info]

        code: {type: string}

        message:
          type: string
          required: true
          description: "error message"

        sourceRow:
          type: integer
          description: "row number that caused error"

        context:
          type: "map[string,any]"
          description: "additional error context"

      ExecutionMetrics:
        rowsRead: {type: integer}
        rowsProcessed: {type: integer}
        rowsSkipped: {type: integer}
        rowsFailed: {type: integer}
        duration: {type: duration}
        throughput: {type: decimal, description: "rows per second"}

  # ==================== Materialization Plan (ADR-011 Compliant) ====================
  MaterializationPlanDefinition:
    definition: "declarative specification of ontology instance materialization from physical data sources according to genus-differentia form"
    purpose: "Defines WHAT should be materialized and HOW data maps to ontology (static configuration only per ADR-011)"
    note: "Runtime state moved to MaterializationRun per ADR-011; orchestration moved to external layer"

    requiredFields:
      iri: {type: uri, unique: true, required: true}
      label: {type: string, required: true}

      definition:
        type: string
        required: true
        description: "purpose and scope of this materialization plan"

      sourceDatasets:
        type: "list[uri]"
        required: true
        minCount: 1
        description: "DatasetDefinition IRIs to be materialized"

      targetOntologyModule:
        type: uri
        required: true
        description: "OntologyModuleDefinition IRI where instances will be created"

      semanticMappings:
        type: "list[uri]"
        required: true
        minCount: 1
        description: "SemanticMappingDefinition IRIs that define how data maps to ontology"

      materializationMode:
        type: enum
        required: true
        values: [Incremental, Full, CDC, EventSourcing]
        description: "how materialization handles updates"

    optionalFields:
      consistencyRequirement:
        type: enum
        values: [Eventual, Snapshot, Transactional]
        default: Eventual
        description: "consistency level required for materialized instances"

      validationRules:
        type: "list[ConstraintBinding]"
        description: "validation rules applied during materialization"

      conflictResolution:
        type: ConflictResolutionStrategy
        description: "how to handle conflicts when multiple sources provide same data"

      incrementalKey:
        type: string
        description: "field name for incremental updates (e.g., updated_at timestamp)"

      targetGraphUri:
        type: uri
        description: "named graph URI where RDF triples will be stored"

      owner:
        type: string
        description: "team or role responsible for this plan"

    structures:
      ConflictResolutionStrategy:
        strategy:
          type: enum
          required: true
          values: [AuthoritySource, TimestampPriority, ManualReview, Merge, RejectConflict]
          description: "how to resolve conflicts when multiple mappings provide same attribute"

        authoritySourcePriority:
          type: "list[uri]"
          description: "ordered list of DataSource IRIs by authority (highest first)"

        timestampField:
          type: string
          description: "field name for timestamp comparison (when strategy=TimestampPriority)"

    deprecated_note: |
      IngestionPipelineDefinition with schedule, retry, monitoring has been deprecated.
      Use MaterializationPlanDefinition for declarative mapping specifications.
      For runtime orchestration, use dedicated workflow/orchestration tools (Airflow, Prefect, etc.)
      or the platform's runtime execution layer.

  # ==================== Data Lineage ====================
  DataLineage:
    definition: "a meta-classifier for tracking data flow and transformation chains"
    purpose: "Documents how data moves from sources through transformations to ontology instances"

    requiredFields:
      iri: {type: uri, unique: true}

      sourceDatasets:
        type: "list[uri]"
        description: "upstream DatasetDefinition IRIs"

      targetDatasets:
        type: "list[uri]"
        description: "downstream DatasetDefinition IRIs or ontology instances"

      transformations:
        type: "list[uri]"
        description: "Transformation IRIs applied"

    optionalFields:
      lineageGraph:
        type: string
        description: "serialized graph representation (e.g., DOT, JSON-LD)"

      updateFrequency:
        type: duration
        example: "P1D"

      lastRun:
        timestamp: {type: instant}
        status: {type: enum, values: [success, failure, partial]}
        recordsProcessed: {type: integer}
        recordsFailed: {type: integer}

  # ==================== Ingestion Pipeline (DEPRECATED) ====================
  IngestionPipelineDefinition:
    definition: "a meta-classifier for ETL/ELT workflows that materialize ontology instances from data sources"
    purpose: "Orchestrates data extraction, transformation, validation, and loading"
    deprecated: true
    deprecationReason: "Mixed declarative mapping with runtime orchestration, violating Layer 4 boundaries. Use MaterializationPlanDefinition for mapping specifications and external orchestration tools for runtime execution."
    deprecatedSince: "0.3.0"
    removalVersion: "0.4.0"
    migrationPath: "Convert to MaterializationPlanDefinition for mapping logic; move schedule/retry/monitoring to external orchestration layer (Airflow, Prefect, etc.)"

    requiredFields:
      iri: {type: uri, unique: true}
      label: {type: string, required: true}

      stages:
        type: "list[PipelineStage]"
        minSize: 1
        description: "ordered stages in the pipeline"

      schedule:
        type: ScheduleSpec
        description: "when and how often to run"

    optionalFields:
      errorHandling:
        strategy: {type: enum, values: [failFast, continueOnError, quarantine]}
        notificationChannels: {type: "list[string]"}

      monitoring:
        type: MonitoringSpec

      owner:
        type: string

    structures:
      PipelineStage:
        id: {type: string, required: true}
        type: {type: enum, values: [extract, transform, validate, load, notify], required: true}
        description: {type: string}
        implementation: {type: string, description: "code or tool reference"}
        dependencies: {type: "list[string]", description: "stage IDs that must complete first"}
        timeout: {type: duration}
        retryPolicy: {type: "Layer3:RetryPolicy"}

      ScheduleSpec:
        type: {type: enum, values: [cron, interval, eventDriven, manual], required: true}
        cronExpression: {type: string, example: "0 2 * * *"}
        interval: {type: duration, example: "PT1H"}
        triggerEvent: {type: string, description: "event type for eventDriven"}

      MonitoringSpec:
        metricsEndpoint: {type: uri}
        alertThresholds:
          errorRate: {type: decimal, example: 0.01}
          latency: {type: duration, example: "PT10M"}
          recordsProcessed: {type: integer, example: 1000}

  # ==================== Examples (Updated for ADR-011/012) ====================
  Examples:

    EquityPriceMapping:
      semanticMapping:
        iri: "fin:mapping:EquityEODPrice"
        label: "Equity End-of-Day Price Observation Mapping"

        source:
          datasets:
            - {dataset: "datasource:bloomberg/equity_prices_eod", alias: "prices"}
          rowSet:
            filters:
              - {dataset: "prices", field: "security_type", operator: "=", value: "EQUITY"}

        targetType: "fin:PriceObservation"
        mappingType: directTable

        slotMappings:
          - target:
              slotType: participantRole
              targetAssociation: "fin:PriceObservation"
              targetRole: "observedInstrument"
            value:
              bindingType: transformation
              transformationRef: "data:LookupInstrumentByISIN#v1.0.0"
              inputs:
                isin:
                  bindingType: directField
                  source: {dataset: "prices", field: "isin"}

          - target:
              slotType: participantRole
              targetAssociation: "fin:PriceObservation"
              targetRole: "venue"
            value:
              bindingType: transformation
              transformationRef: "data:LookupMarketByMIC#v1.0.0"
              inputs:
                mic:
                  bindingType: directField
                  source: {dataset: "prices", field: "exchange_code"}

          - target:
              slotType: attribute
              targetAttribute: "fin:quotedPrice"
            value:
              bindingType: transformation
              transformationRef: "data:CreateMoney#v2.1.0"
              inputs:
                amount:
                  bindingType: directField
                  source: {dataset: "prices", field: "close_price"}
                currency:
                  bindingType: directField
                  source: {dataset: "prices", field: "currency_code"}

          - target:
              slotType: attribute
              targetAttribute: "fin:tradedVolume"
            value:
              bindingType: transformation
              transformationRef: "data:CreateQuantity#v1.0.0"
              inputs:
                value:
                  bindingType: directField
                  source: {dataset: "prices", field: "volume"}
                unit:
                  bindingType: literal
                  value: "shares"

        identity:
          logicalKey:
            - {dataset: "prices", field: "isin"}
            - {dataset: "prices", field: "exchange_code"}
            - {dataset: "prices", field: "trade_date"}
          iriTemplate: "https://moonweave.ai/observation/price/{isin}/{exchange_code}/{trade_date}"
          namespace: "fin-obs"

        temporal:
          patternRef: "ax-pattern:TemporalFact"
          validTime:
            from:
              bindingType: directField
              source: {dataset: "prices", field: "trade_date_close"}
            to:
              bindingType: literal
              value: null
          knowledgeTime:
            from:
              bindingType: runtimeContext
              contextField: "assertionTime"
            closePolicy: closePreviousVersion
          availabilityTime:
            from:
              bindingType: directField
              source: {dataset: "prices", field: "publish_timestamp"}
            note: "price is consumable once the source publishes; no embargo for this feed"

        provenance:
          sourceSystem:
            bindingType: literal
            value: "Bloomberg BPIPE"
          acquisitionTime:
            bindingType: runtimeContext
            contextField: "referenceTime"

        validationRules:
          - id: isinRequired
            type: required
            expression: "isin IS NOT NULL"
            failureAction: reject
            severity: error

          - id: pricePositive
            type: range
            expression: "close_price > 0"
            failureAction: reject
            severity: error

    HoldingMappingWithJoin:
      semanticMapping:
        iri: "fin:mapping:PortfolioHoldingJoined"
        label: "Portfolio Holding with Account Details (Multi-Table Join)"

        source:
          datasets:
            - {dataset: "datasource:internal/portfolio_positions", alias: "pos"}
            - {dataset: "datasource:internal/accounts", alias: "acc"}
          rowSet:
            joins:
              - leftDataset: "pos"
                rightDataset: "acc"
                joinType: inner
                conditions:
                  - {leftField: "account_id", operator: "=", rightField: "account_id"}

        targetType: "fin:Holding"
        mappingType: joinedTables

        slotMappings:
          - target:
              slotType: participantRole
              targetAssociation: "fin:Holding"
              targetRole: "account"
            value:
              bindingType: transformation
              transformationRef: "data:LookupAccountByID#v1.0.0"
              inputs:
                accountId:
                  bindingType: directField
                  source: {dataset: "pos", field: "account_id"}

          - target:
              slotType: participantRole
              targetAssociation: "fin:Holding"
              targetRole: "instrument"
            value:
              bindingType: transformation
              transformationRef: "data:LookupInstrumentByISIN#v1.0.0"
              inputs:
                isin:
                  bindingType: directField
                  source: {dataset: "pos", field: "isin"}

          - target:
              slotType: attribute
              targetAttribute: "fin:quantity"
            value:
              bindingType: directField
              source: {dataset: "pos", field: "quantity"}

          - target:
              slotType: attribute
              targetAttribute: "fin:costBasis"
            value:
              bindingType: transformation
              transformationRef: "data:CreateMoney#v2.1.0"
              inputs:
                amount:
                  bindingType: directField
                  source: {dataset: "pos", field: "avg_cost"}
                currency:
                  bindingType: directField
                  source: {dataset: "acc", field: "base_currency"}

        identity:
          logicalKey:
            - {dataset: "pos", field: "account_id"}
            - {dataset: "pos", field: "isin"}
          versionKey:
            - {dataset: "pos", field: "effective_date"}
          iriTemplate: "https://moonweave.ai/holding/{account_id}/{isin}"

        temporal:
          patternRef: "ax-pattern:TemporalFact"
          validTime:
            from:
              bindingType: directField
              source: {dataset: "pos", field: "effective_date"}
            to:
              bindingType: directField
              source: {dataset: "pos", field: "expiration_date"}
          knowledgeTime:
            from:
              bindingType: runtimeContext
              contextField: "assertionTime"
            closePolicy: explicitOnly
            note: "knowledge time is the platform assertion time (MaterializationRun.assertionTime), NOT the source updated_at field (ADR-012)"
          availabilityTime:
            from:
              bindingType: directField
              source: {dataset: "pos", field: "updated_at"}
            note: "internal position snapshot; available to consumers once the source row is updated (no embargo)"

  # ==================== Validation Rules (ADR-011/012 Compliant) ====================
  ValidationRules:
    - "SemanticMappingDefinition.source must be SourceBinding (not sourceDataset uri)"
    - "SemanticMappingDefinition.slotMappings (not fieldMappings) required for attribute mapping"
    - "SemanticMappingDefinition must reference valid DatasetDefinition and ObjectTypeDefinition/AssociationTypeDefinition"
    - "SlotMapping.target must be valid TargetSlot variant (attribute, participantRole, relation, patternField)"
    - "SlotMapping.value must be valid ValueBinding variant (directField, transformation, literal, runtimeContext)"
    - "TargetSlot.targetAttribute must reference valid AttributeTypeDefinition from Layer 1"
    - "TargetSlot.targetAssociation must reference valid AssociationTypeDefinition from Layer 1"
    - "TargetSlot.targetRole must match ParticipantRole.id in referenced AssociationTypeDefinition"
    - "TargetSlot.targetRelation must reference valid RelationTypeDefinition from Layer 1"
    - "TargetSlot.targetPattern must reference valid PatternDefinition from Layer 2"
    - "IdentitySpec.logicalKey must use FieldReference with dataset alias from SourceBinding"
    - "IdentitySpec.iriTemplate must produce stable, reproducible IRIs"
    - "TemporalMappingSpec must use TimeAxisBinding (not recordedAtSource: currentTimestamp)"
    - "When temporal.patternRef = TemporalFact, validTime, knowledgeTime, AND availabilityTime MUST all be present (ADR-012 three-axis completeness; text rules are a contract — enforced by the domain-ontology validator)"
    - "knowledgeTime.from SHOULD use bindingType: runtimeContext (assertionTime); using a source field as knowledgeTime is discouraged unless it provably equals the platform assertion time (ADR-012)"
    - "TemporalMappingSpec.patternRef must reference valid temporal pattern from Layer 2"
    - "TimeAxisBinding.from and TimeAxisBinding.to must use ValueBinding (no CURRENT_TIMESTAMP)"
    - "RuntimeContextBinding.contextField must reference valid MaterializationRun field (assertionTime, referenceTime, runId)"
    - "TransformationDefinition.version required (semantic versioning)"
    - "TransformationDefinition.implementationDigest required (SHA-256)"
    - "TransformationDefinition.inputs required (map[string, TypeReference])"
    - "TransformationDefinition.outputs required (TypeReference)"
    - "TransformationDefinition.testCases required with minCount >= 1"
    - "TransformationBinding.inputs keys must match TransformationDefinition.inputs keys"
    - "MaterializationPlanDefinition.semanticMappings must all target same OntologyModuleDefinition"
    - "MaterializationPlanDefinition must NOT contain watermark field (moved to MaterializationRun)"
    - "MaterializationRun.assertionTime and referenceTime required for reproducible queries"
    - "MaterializationRun.inputSnapshotDigest required for reproducibility"
    - "Field.semanticMapping PROHIBITED (deleted in v0.5)"
    - "SemanticFieldMapping type PROHIBITED (deleted in v0.5)"
    - "TransformationReference type PROHIBITED (deleted in v0.5)"
    - "FieldMapping type PROHIBITED (replaced by SlotMapping in v0.5)"
    - "SemanticMappingDefinition.sourceDataset PROHIBITED (replaced by source: SourceBinding in v0.5)"
    - "SemanticMappingDefinition.fieldMappings PROHIBITED (renamed to slotMappings in v0.5)"
    - "TemporalMappingSpec.recordedAtSource: currentTimestamp PROHIBITED per ADR-012"
    - "Multiple SlotMappings targeting same attribute must have conflict resolution strategy in plan"
    - "IngestionPipelineDefinition is deprecated; use MaterializationPlanDefinition + external orchestration"
    - "TemporalMapping field references must exist in source dataset schema"
    - "Multiple SemanticMappings for same targetType must have non-overlapping filters or priority"
    - "Transformation artifacts must be version-controlled and reproducible"
    - "DataSource credentials must never be stored in mapping definitions (use credentialsRef)"
    - "Materialization must emit audit events for Layer 2 Provenance tracking"

  # ==================== Implementation Notes ====================
  ImplementationNotes:
    - "ADR-011: SemanticMappingDefinition is the ONLY truth source for semantic mappings"
    - "ADR-011: Field-level mappings (Field.semanticMapping) deleted - violated single truth source"
    - "ADR-011: SourceBinding enables multi-table joins, filters, aggregations"
    - "ADR-011: Static definitions (plans) separated from runtime state (runs)"
    - "ADR-012: Three-axis temporal model (valid/knowledge/availability) with explicit bindings"
    - "ADR-012: No CURRENT_TIMESTAMP - use MaterializationRun.assertionTime or referenceTime"
    - "ADR-012: MaterializationRun provides immutable time context for reproducible queries"
    - "Layer 4 is the ONLY layer that references physical data structures"
    - "Layers 1-3 remain independent of data storage choices"
    - "SemanticMappingDefinition enables multiple physical representations of same concept"
    - "IdentitySpec ensures stable IRIs across materialization runs"
    - "TemporalMappingSpec ensures Point-in-Time query correctness"
    - "ValidationRules enforce data quality before materializing ontology instances"
    - "DataLineage enables impact analysis and debugging"
    - "Transformation code must be testable, version-controlled, with rollback capability"
    - "All transformations require explicit version, digest, inputs, outputs, and test cases"
    - "ValueBinding union type supports direct fields, transformations, literals, and runtime context"
    - "SlotMapping replaces FieldMapping to support attributes, roles, relations, and pattern fields"
