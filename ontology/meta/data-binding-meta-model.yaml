  CompletedBatchMember:
    iri: https://axiolune.ai/ontology/meta/data-binding/CompletedBatchMember
    cnNote: 已完成批次成员，是原子物化批次中一个完成的成员，旨在记录每个成功成员的运行与输出摘要。
