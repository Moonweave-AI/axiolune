            exactCount: 0
      engineFailure:
        requiredFields:
          outcome:
            type: const
            value: engineFailure
          checks:
            type: list[GateCheck]
            uniqueBy: tuple[checkId,subjectId]
            order: tuple[checkId,subjectId]
          violations:
            type: list[GateViolation]
            exactCount: 0
          errors:
            type: list[ExecutionError]
            minCount: 1
            order: executionErrorCanonicalTuple
  ReplayComparison:
    iri: https://axiolune.ai/ontology/meta/data-binding/ReplayComparison
    cnNote: 重放比对，是本体工程中原始对重放工件摘要的命名比对，旨在为每项产物的可复现性留下逐项判定。
    definition: one named original-versus-replay artifact digest comparison, intended to leave a per-artifact verdict for the reproducibility of each product
    requiredFields:
      name:
        type: asciiIdentifier
      artifactRef:
        type: ArtifactRef
      originalDigest:
        type: digest
      replayDigest:
        type: digest
      equal:
        type: boolean
  ReplayResult:
    iri: https://axiolune.ai/ontology/meta/data-binding/ReplayResult
    cnNote: 重放结果，是本体工程中确定性重放比对的闭最终结果，旨在区分一致、不一致与引擎故障三种结局。
    definition: a closed final result of deterministic replay comparison, intended to distinguish identical, mismatch, and engine-failure outcomes
    discriminator: outcome
    variants:
      identical:
        requiredFields:
          outcome:
            type: const
            value: identical
          comparisons:
            type: list[ReplayComparison]
            minCount: 1
            uniqueBy: name
            order: name
          errors:
            type: list[ExecutionError]
            exactCount: 0
      mismatch:
        requiredFields:
          outcome:
            type: const
            value: mismatch
          comparisons:
            type: list[ReplayComparison]
            minCount: 1
            uniqueBy: name
            order: name
          errors:
            type: list[ExecutionError]
            exactCount: 0
      engineFailure:
        requiredFields:
          outcome:
            type: const
            value: engineFailure
          comparisons:
            type: list[ReplayComparison]
            uniqueBy: name
            order: name
          errors:
            type: list[ExecutionError]
            minCount: 1
            order: executionErrorCanonicalTuple
  EvidenceSlotSelection:
    iri: https://axiolune.ai/ontology/meta/data-binding/EvidenceSlotSelection
    cnNote: 证据槽选择，是本体工程中为证据账本一个槽位选中的活跃控制记录，旨在为每个证据位绑定其当前生效的记录。
    definition: the one active control-record alternative selected for an evidence-ledger slot, intended to bind the currently effective record for each evidence slot
    requiredFields:
      slotId:
        type: recordId
      recordType:
        type: enum
        values:
          - materializationRun
          - materializationBatchRun
          - pitRequest
          - validationReport
          - failureReport
          - replayReport
      recordId:
        type: recordId
      attemptId:
        type: recordId
      recordIri:
        type: uri
  EvidenceLedgerEntry:
    iri: https://axiolune.ai/ontology/meta/data-binding/EvidenceLedgerEntry
    cnNote: 证据账本条目，是本体工程中一条已定稿控制记录的内容寻址索引项，旨在为每条记录提供带摘要与规范化方式的不可变索引。
    definition: a content-addressed index entry for one finalized standalone control record, intended to provide an immutable index with digest and canonicalization for each record
    requiredFields:
      slotId:
        type: recordId
      recordIri:
        type: uri
      recordType:
        type: enum
        values:
          - materializationRun
          - materializationBatchRun
          - pitRequest
          - validationReport
          - failureReport
          - replayReport
      mediaType:
        type: const
        value: application/json
      canonicalization:
        type: const
        value: RFC8785-JCS
      byteLength:
        type: nonNegativeSafeInteger
      recordDigest:
        type: digest
  ExecutionError:
    iri: https://axiolune.ai/ontology/meta/data-binding/ExecutionError
    cnNote: 执行错误，是本体工程中嵌入失败控制记录的可排序诊断，旨在为执行失败提供错误码、阶段与消息。
    definition: a deterministically sortable execution failure diagnostic embedded in a failed control record, intended to provide error code, stage, and message for execution failures
    requiredFields:
      code:
        type: asciiIdentifier
      stage:
        type: asciiIdentifier
      message:
        type: nfcString
        minLength: 1
    optionalFields:
      sourcePath:
        type: posixRelativePath
      constraintRef:
        type: uri
      causeDigest:
        type: digest
  InputDatasetSnapshot:
    iri: https://axiolune.ai/ontology/meta/data-binding/InputDatasetSnapshot
    cnNote: 输入数据集快照，是本体工程中物化输入数据集的不可变嵌入绑定，旨在为可复现锁定输入的字节、schema 与快照时间。
    definition: an immutable embedded binding of one input dataset to exact snapshot bytes, intended to lock the bytes, schema, and snapshot time of inputs for reproducibility
    requiredFields:
      dataset:
        type: uri
      snapshotRef:
        type: ArtifactRef
      artifactDigest:
        type: digest
      schemaDigest:
        type: digest
      snapshotTime:
        type: instant
    optionalFields:
      rowCount:
        type: nonNegativeSafeInteger
  IngestionPipelineDefinition:
    iri: https://axiolune.ai/ontology/meta/data-binding/IngestionPipelineDefinition
    cnNote: 摄取管线定义，是本体工程中已弃用的 ETL 工作流元类型，曾混合声明式映射与运行时编排，现由物化计划与外部编排工具取代。
    definition: a deprecated meta-classifier for ETL/ELT workflows that materialize ontology instances, superseded by MaterializationPlanDefinition and external orchestration tools because it mixed declarative mapping with runtime orchestration
    purpose: Orchestrates data extraction, transformation, validation, and loading
    deprecated: true
    deprecationReason: Mixed declarative mapping with runtime orchestration,
      violating Layer 4 boundaries. Use MaterializationPlanDefinition for
      mapping specifications and external orchestration tools for runtime
      execution.
    deprecatedSince: 0.3.0
    removalVersion: 0.4.0
    migrationPath: Convert to MaterializationPlanDefinition for mapping logic; move
      schedule/retry/monitoring to external orchestration layer (Airflow,
      Prefect, etc.)
    requiredFields:
      iri:
        type: uri
        unique: true
      label:
        type: string
        required: true
      stages:
        type: list[PipelineStage]
        minSize: 1
        description: ordered stages in the pipeline
      schedule:
        type: ScheduleSpec
        description: when and how often to run
    optionalFields:
      errorHandling:
        strategy:
          type: enum
          values:
            - failFast
            - continueOnError
            - quarantine
        notificationChannels:
          type: list[string]
      monitoring:
        type: MonitoringSpec
      owner:
        type: string
    structures:
      PipelineStage:
        id:
          type: string
          required: true
        type:
          type: enum
          values:
            - extract
            - transform
            - validate
            - load
            - notify
          required: true
        description:
          type: string
        implementation:
          type: string
          description: code or tool reference
        dependencies:
          type: list[string]
          description: stage IDs that must complete first
        timeout:
          type: duration
        retryPolicy:
          type: Layer3:RetryPolicy
      ScheduleSpec:
        type:
          type: enum
          values:
            - cron
            - interval
            - eventDriven
            - manual
          required: true
        cronExpression:
          type: string
          example: 0 2 * * *
        interval:
          type: duration
          example: PT1H
        triggerEvent:
          type: string
          description: event type for eventDriven
      MonitoringSpec:
        metricsEndpoint:
          type: uri
        alertThresholds:
          errorRate:
            type: decimal
            example: 0.01
          latency:
            type: duration
            example: PT10M
          recordsProcessed:
            type: integer
            example: 1000
  Examples:
    EquityPriceMapping:
      semanticMapping:
        iri: fin:mapping:EquityEODPrice
        label: Equity End-of-Day Price Observation Mapping
        source:
          datasets:
            - dataset: datasource:bloomberg/equity_prices_eod
              alias: prices
          rowSet:
            filters:
              - dataset: prices
                field: security_type
                operator: =
                value: EQUITY
        targetType: fin:PriceObservation
        mappingType: directTable
        slotMappings:
          - target:
              slotType: participantRole
              targetAssociation: fin:PriceObservation
              targetRole: observedInstrument
            value:
              bindingType: transformation
              transformationRef: data:LookupInstrumentByISIN#v1.0.0
              inputs:
                isin:
                  bindingType: directField
                  source:
                    dataset: prices
                    field: isin
          - target:
              slotType: participantRole
              targetAssociation: fin:PriceObservation
              targetRole: venue
            value:
              bindingType: transformation
              transformationRef: data:LookupMarketByMIC#v1.0.0
              inputs:
                mic:
                  bindingType: directField
                  source:
                    dataset: prices
                    field: exchange_code
          - target:
              slotType: attribute
              targetAttribute: fin:quotedPrice
            value:
              bindingType: transformation
              transformationRef: data:CreateMoney#v2.1.0
              inputs:
                amount:
                  bindingType: directField
                  source:
                    dataset: prices
                    field: close_price
                currency:
                  bindingType: directField
                  source:
                    dataset: prices
                    field: currency_code
          - target:
              slotType: attribute
              targetAttribute: fin:tradedVolume
            value:
              bindingType: transformation
              transformationRef: data:CreateQuantity#v1.0.0
              inputs:
                value:
                  bindingType: directField
                  source:
                    dataset: prices
                    field: volume
                unit:
                  bindingType: literal
                  value: shares
        identity:
          contractRef: data:PriceObservationIdentityContract
          logicalKeyBindings:
            instrument:
              bindingType: directField
              source:
                dataset: prices
                field: isin
            venue:
              bindingType: directField
              source:
                dataset: prices
                field: exchange_code
          versionKeyBindings:
            observationDate:
              bindingType: directField
              source:
                dataset: prices
                field: trade_date
          namespace: fin-obs
        temporal:
          patternRef: ax-pattern:TemporalFact
          validTime:
            from:
              bindingType: directField
              source:
                dataset: prices
                field: trade_date_close
            to:
              bindingType: literal
              value: null
          knowledgeTime:
            from:
              bindingType: runtimeContext
              contextField: assertionTime
            closePolicy: closePreviousVersion
          availabilityTime:
            from:
              bindingType: directField
              source:
                dataset: prices
                field: publish_timestamp
            note: price is consumable once the source publishes; no embargo for this feed
        provenance:
          sourceSystem:
            bindingType: literal
            value: Bloomberg BPIPE
          acquisitionTime:
            bindingType: runtimeContext
            contextField: referenceTime
        validationRules:
          - id: isinRequired
            type: required
            expression: isin IS NOT NULL
            failureAction: reject
            severity: error
          - id: pricePositive
            type: range
            expression: close_price > 0
            failureAction: reject
            severity: error
    HoldingMappingWithJoin:
      semanticMapping:
        iri: fin:mapping:PortfolioHoldingJoined
        label: Portfolio Holding with Account Details (Multi-Table Join)
        source:
          datasets:
            - dataset: datasource:internal/portfolio_positions
              alias: pos
            - dataset: datasource:internal/accounts
              alias: acc
          rowSet:
            joins:
              - leftDataset: pos
                rightDataset: acc
                joinType: inner
                conditions:
                  - leftField: account_id
                    operator: =
                    rightField: account_id
        targetType: fin:Holding
        mappingType: joinedTables
        slotMappings:
          - target:
              slotType: participantRole
              targetAssociation: fin:Holding
              targetRole: account
            value:
              bindingType: transformation
              transformationRef: data:LookupAccountByID#v1.0.0
              inputs:
                accountId:
                  bindingType: directField
                  source:
                    dataset: pos
                    field: account_id
          - target:
              slotType: participantRole
              targetAssociation: fin:Holding
              targetRole: instrument
            value:
              bindingType: transformation
              transformationRef: data:LookupInstrumentByISIN#v1.0.0
              inputs:
                isin:
                  bindingType: directField
                  source:
                    dataset: pos
                    field: isin
          - target:
              slotType: attribute
              targetAttribute: fin:quantity
            value:
              bindingType: directField
              source:
                dataset: pos
                field: quantity
          - target:
              slotType: attribute
              targetAttribute: fin:costBasis
            value:
              bindingType: transformation
              transformationRef: data:CreateMoney#v2.1.0
              inputs:
                amount:
                  bindingType: directField
                  source:
                    dataset: pos
                    field: avg_cost
                currency:
                  bindingType: directField
                  source:
                    dataset: acc
                    field: base_currency
        identity:
          contractRef: data:HoldingIdentityContract
          logicalKeyBindings:
            account:
              bindingType: directField
              source:
                dataset: pos
                field: account_id
            instrument:
              bindingType: directField
              source:
                dataset: pos
                field: isin
          versionKeyBindings:
            effectiveDate:
              bindingType: directField
              source:
                dataset: pos
                field: effective_date
        temporal:
          patternRef: ax-pattern:TemporalFact
          validTime:
            from:
              bindingType: directField
              source:
                dataset: pos
                field: effective_date
            to:
              bindingType: directField
              source:
                dataset: pos
                field: expiration_date
          knowledgeTime:
            from:
              bindingType: runtimeContext
              contextField: assertionTime
            closePolicy: explicitOnly
            note: knowledge time is the platform assertion time
              (MaterializationRun.assertionTime), NOT the source updated_at
              field (ADR-012)
          availabilityTime:
            from:
              bindingType: directField
              source:
                dataset: pos
                field: updated_at
            note: internal position snapshot; available to consumers once the source row is
              updated (no embargo)
  ValidationRules:
    - SemanticMappingDefinition.source must be SourceBinding (not sourceDataset
      uri)
    - SemanticMappingDefinition.slotMappings (not fieldMappings) required for
      attribute mapping
    - SemanticMappingDefinition must reference valid DatasetDefinition and
      ObjectTypeDefinition/AssociationTypeDefinition
    - SlotMapping.target must be valid TargetSlot variant (attribute,
      participantRole, relation, patternField)
    - SlotMapping.value must be valid ValueBinding variant (directField,
      transformation, literal, runtimeContext)
    - TargetSlot.targetAttribute must reference valid AttributeTypeDefinition
      from Layer 1
    - TargetSlot.targetAssociation must reference valid
      AssociationTypeDefinition from Layer 1
    - TargetSlot.targetRole must match ParticipantRole.id in referenced
      AssociationTypeDefinition
    - TargetSlot.targetRelation must reference valid RelationTypeDefinition from
      Layer 1
    - TargetSlot.targetPattern must reference valid PatternDefinition from Layer
      2
    - IdentitySpec.contractRef must resolve the unique
      TargetIdentityContractDefinition registered for the mapping target
    - IdentitySpec.logicalKeyBindings and versionKeyBindings keys must exactly
      equal the selected contract component names
    - ReferenceIdentityBinding.targetMappingRef and nested keyBindings must
      resolve an acyclic visible target mapping
    - "TemporalMappingSpec must use TimeAxisBinding (not recordedAtSource:
      currentTimestamp)"
    - When temporal.patternRef = TemporalFact, validTime, knowledgeTime, AND
      availabilityTime MUST all be present (ADR-012 three-axis completeness;
      text rules are a contract — enforced by the domain-ontology validator)
    - "knowledgeTime.from SHOULD use bindingType: runtimeContext
      (assertionTime); using a source field as knowledgeTime is discouraged
      unless it provably equals the platform assertion time (ADR-012)"
    - TemporalMappingSpec.patternRef must reference valid temporal pattern from
      Layer 2
    - TimeAxisBinding.from and TimeAxisBinding.to must use ValueBinding (no
      CURRENT_TIMESTAMP)
    - RuntimeContextBinding.contextField must be exactly one of
      MaterializationRun.iri, assertionTime, referenceTime, or runId;
      generatingContextRef must bind iri rather than an adapter-supplied literal
    - TransformationDefinition.version required (semantic versioning)
    - TransformationDefinition.implementationDigest required (SHA-256)
    - TransformationDefinition.inputs required (map[string, TypeReference])
    - TransformationDefinition.outputs required (TypeReference)
    - TransformationDefinition.testCases required with minCount >= 1
    - TransformationBinding.inputs keys must match
      TransformationDefinition.inputs keys
    - MaterializationPlanDefinition.semanticMappings must all target same
      OntologyModuleDefinition
    - MaterializationPlanDefinition and MaterializationRun must NOT contain
      watermark or operational telemetry
    - MaterializationRun.assertionTime and referenceTime are immutable explicit
      build inputs
    - MaterializationRun source, mapping, ontology, reference, tool, and
      snapshot closure digests must recompute
    - MaterializationRun.result is exactly completed or failed;
      pending/running/partial are orchestration-only
    - Field.semanticMapping PROHIBITED (deleted in v0.5)
    - SemanticFieldMapping type PROHIBITED (deleted in v0.5)
    - TransformationReference type PROHIBITED (deleted in v0.5)
    - FieldMapping type PROHIBITED (replaced by SlotMapping in v0.5)
    - "SemanticMappingDefinition.sourceDataset PROHIBITED (replaced by source:
      SourceBinding in v0.5)"
    - SemanticMappingDefinition.fieldMappings PROHIBITED (renamed to
      slotMappings in v0.5)
    - "TemporalMappingSpec.recordedAtSource: currentTimestamp PROHIBITED per
      ADR-012"
    - Multiple SlotMappings targeting same attribute must have conflict
      resolution strategy in plan
    - IngestionPipelineDefinition is deprecated; use
      MaterializationPlanDefinition + external orchestration
    - TemporalMapping field references must exist in source dataset schema
    - Multiple SemanticMappings for same targetType must have non-overlapping
      filters or priority
    - Transformation artifacts must be version-controlled and reproducible
    - DataSource credentials must never be stored in mapping definitions (use
      credentialsRef)
    - Materialization must emit audit events for Layer 2 Provenance tracking
    - PITValidationRequest.materializationContext binds a completed Run graph or
      completed Batch dataset and its recomputed digest
    - PITValidationRequest.asOfAvailable binds $queryTime for
      AvailabilityBeforeUse (ADR-012)
    - PITValidationRequest rejects failed, stale, substituted, or
      canonicalization-mismatched materialization context
  ImplementationNotes:
    - "ADR-011: SemanticMappingDefinition is the ONLY truth source for semantic
      mappings"
    - "ADR-011: Field-level mappings (Field.semanticMapping) deleted - violated
      single truth source"
    - "ADR-011: SourceBinding enables multi-table joins, filters, aggregations"
    - "ADR-011: Static definitions (plans) separated from runtime state (runs)"
    - "ADR-012: Three-axis temporal model (valid/knowledge/availability) with
      explicit bindings"
    - "ADR-012: No CURRENT_TIMESTAMP - use MaterializationRun.assertionTime or
      referenceTime"
    - "ADR-012: MaterializationRun provides immutable time context for
      reproducible queries"
    - Layer 4 is the ONLY layer that references physical data structures
    - Layers 1-3 remain independent of data storage choices
    - SemanticMappingDefinition enables multiple physical representations of
      same concept
    - IdentitySpec ensures stable IRIs across materialization runs
    - TemporalMappingSpec ensures Point-in-Time query correctness
    - ValidationRules enforce data quality before materializing ontology
      instances
    - DataLineage enables impact analysis and debugging
    - Transformation code must be testable, version-controlled, with rollback
      capability
    - All transformations require explicit version, digest, inputs, outputs, and
      test cases
    - ValueBinding union type supports direct fields, transformations, literals,
      and runtime context
    - SlotMapping replaces FieldMapping to support attributes, roles, relations,
      and pattern fields
