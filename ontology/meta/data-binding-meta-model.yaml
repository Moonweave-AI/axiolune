      failureStage:
        type: asciiIdentifier
      inputs:
        type: list[ArtifactBinding]
        minCount: 1
        uniqueBy: name
        order: name
      errors:
        type: list[ExecutionError]
        minCount: 1
  ReplayReport:
    iri: https://axiolune.ai/ontology/meta/data-binding/ReplayReport
