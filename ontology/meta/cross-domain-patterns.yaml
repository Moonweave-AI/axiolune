module:
  moduleIri: https://axiolune.ai/ontology/meta/patterns
  baseIri: https://axiolune.ai/ontology/meta/patterns/
  preferredPrefix: ax-pattern
  version: 0.6.0
  label: Cross-Domain Patterns
  definition: reusable patterns for time, provenance, evidence, and lifecycle across domain objects
  cnNote: 跨域模式层，是本体工程中定义时间、来源、证据、生命周期等通用关注点的可复用模式层，旨在把这些与具体领域无关的能力形式化为一等本体元素，供各领域通过绑定复用。
  curiePrefixes:
    ax-meta: https://axiolune.ai/ontology/meta/
    ax-pattern: https://axiolune.ai/ontology/meta/patterns/
    fin: https://axiolune.ai/ontology/domain/
  imports:
    - moduleIri: https://axiolune.ai/ontology/meta/core
      version: 0.6.0
      importMode: All
  exports: []
CrossDomainPatterns:
  version: 0.6.0
  description: Reusable patterns for identity, time, provenance, evidence, and
    lifecycle that apply across domain objects
  layer: 2
  changes:
    - "v0.6.0: Made the owl:Class signature of every concrete PatternDefinition
      IRI explicit"
    - "v0.6.0: Rebased pattern injection and constraint closure on the strict M3
      0.6.0 core"
    - "v0.4.0: All 10 constraints migrated to ConstraintDefinition grammar
      (expression structure, scope, capitalized enums)"
    - "v0.4.0: NoFutureKnowledge severity raised to Error (production-blocking)"
    - "v0.4.0: AvailabilityBeforeUse made fail-closed (availableFrom required,
      OR NULL escape removed)"
    - "v0.4.0: Added AvailabilityIntervalConsistency constraint (availableFrom
      <= availableTo)"
    - "v0.4.0: TemporalFact availableFrom injection minCount raised to 1
      (fail-closed for PIT)"
    - "v0.4.0: NoFutureKnowledge uses $referenceTime instead of
      CURRENT_TIMESTAMP (ADR-012 reproducibility)"
    - "v0.4.0: Added AvailabilityBeforeUse constraint (ADR-012)"
    - "v0.4.0: TemporalFact injects availableFrom/availableTo (three-axis
      availability, ADR-012)"
    - "v0.4.0: asOfQuerySemantics requires explicit asOfAvailable (no implicit
      now)"
    - "v0.3.0: Global rename to *Definition suffix (ADR-004)"
    - "v0.3.0: Updated module system with version-locked imports"
    - "v0.3.0: Introduced formal PatternDefinition (ADR-003)"
  note: |
    Layer 2 patterns are now formally defined using PatternDefinition.
    Each pattern has:
    - IRI for stable reference
    - Version for evolution tracking
    - Parameters for customization
    - Injected attributes/relations
    - OWL/SHACL projection rules
  PatternDefinition:
    iri: https://axiolune.ai/ontology/meta/patterns/PatternDefinition
    cnNote: 模式定义，是本体工程中可绑定到对象类型与关联类型的跨域语义模式元类型，旨在把时间、来源、证据等通用关注点形式化为一等本体元素，供各领域复用。
    definition: a meta-classifier for reusable cross-domain semantic patterns that can be bound to ObjectTypes and AssociationTypes, intended to formalize cross-cutting concerns such as time, provenance, and evidence as first-class ontology elements for reuse across domains
    purpose: Formalizes patterns like Temporal, Provenance, Evidence as first-class
      ontology elements with IRIs, versions, and composition rules
    owlProjection:
      kind: class
      note: Every concrete PatternDefinition IRI is an owl:Class; instance-level
        owlProjection describes additional axioms contributed when the pattern
        is bound
    requiredFields:
      iri:
        type: uri
        unique: true
        required: true
        description: globally unique IRI for this pattern
        example: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      namespace:
        type: string
        required: true
        description: module namespace prefix
      localName:
        type: string
        required: true
        description: pattern name within namespace
      label:
        type: string
        required: true
        example: Bi-Temporal Fact Pattern
      definition:
        type: string
        required: true
        iso704: true
        example: pattern for bi-temporal semantics distinguishing business validity time
          from system knowledge time
      version:
        type: string
        required: true
        pattern: ^\d+\.\d+\.\d+$
        example: 1.0.0
      appliesTo:
        type: list[enum]
        required: true
        values:
          - ObjectTypeDefinition
          - AssociationTypeDefinition
          - AttributeTypeDefinition
          - RelationTypeDefinition
        description: which meta-types this pattern can be bound to
      injectedAttributes:
        type: list[AttributeUse]
        required: true
        minCount: 1
        description: attributes that will be added to types using this pattern
    optionalFields:
      parameters:
        type: list[PatternParameter]
        description: parameterized configuration options
      dependencies:
        type: list[uri]
        description: other patterns that must also be bound
      conflicts:
        type: list[uri]
        description: patterns that cannot be bound simultaneously
      injectedRelations:
        type: list[RelationUse]
        description: relations that will be added to types using this pattern
      constraintsAdded:
        type: list[ConstraintBinding]
        description: validation rules enforced by this pattern
      owlProjection:
        type: PatternOWLProjection
        description: how this pattern projects to OWL ontology
      shaclShape:
        type: PatternSHACLShape
        description: SHACL shape for validating pattern conformance
      alignments:
        type: list[Alignment]
        description: mappings to external standards (FIBO, PROV-O, etc.)
      examples:
        type: list[PatternExample]
        description: example usages of this pattern
  PatternParameter:
    iri: https://axiolune.ai/ontology/meta/patterns/PatternParameter
    cnNote: 模式参数，是本体工程中自定义模式行为的配置参数，旨在让同一模式在不同类型上以不同精度或配置生效，提升模式的复用灵活性。
    definition: a configuration parameter for customizing pattern behavior, intended to let the same pattern take effect on different types with different precision or configuration, improving reuse flexibility
    requiredFields:
      name:
        type: string
        required: true
        example: timeGranularity
      type:
        type: string
        required: true
        description: parameter value type
        example: enum
    optionalFields:
      required:
        type: boolean
        default: false
      defaultValue:
        type: any
        example: instant
      allowedValues:
        type: list[any]
        example:
          - instant
          - date
          - dateTime
      description:
        type: string
  PatternOWLProjection:
    iri: https://axiolune.ai/ontology/meta/patterns/PatternOWLProjection
    cnNote: 模式 OWL 投影，是本体工程中模式到 OWL 构造的映射规格，旨在描述模式绑定时贡献哪些 OWL 公理，使模式语义可被推理机理解。
    definition: a specification of how a pattern maps to OWL constructs, intended to describe which OWL axioms a pattern contributes when bound, so that pattern semantics can be understood by reasoners
    fields:
      kind:
        type: enum
        values:
          - mixin
          - restriction
          - unionOf
          - propertyChain
        description: OWL projection strategy
      additionalClasses:
        type: list[uri]
        description: OWL classes to add to types using this pattern
        example:
          - owl:Class
          - time:TemporalEntity
      propertyRestrictions:
        type: list[OWLRestriction]
        description: OWL property restrictions
  OWLRestriction:
    iri: https://axiolune.ai/ontology/meta/patterns/OWLRestriction
    cnNote: OWL 限制，是本体工程中模式投影到绑定类型时发出的闭 OWL 限制，旨在把模式语义固化为可推理的公理，如基数约束与存在性约束。
    definition: a closed OWL restriction emitted when a pattern is projected onto a bound domain type, intended to solidify pattern semantics into inferable axioms such as cardinality and existential restrictions
    requiredFields:
      onProperty:
        type: uri
      restrictionKind:
        type: enum
        values:
          - someValuesFrom
          - allValuesFrom
          - hasValue
          - minCardinality
          - maxCardinality
          - exactCardinality
      value:
        type: union[uri,nonNegativeSafeInteger]
  PatternSHACLShape:
    iri: https://axiolune.ai/ontology/meta/patterns/PatternSHACLShape
    cnNote: 模式 SHACL 形状，是本体工程中模式贡献的校验形状，旨在让使用该模式的实例可被机器校验，是模式"可执行"的一面。
    definition: a SHACL shape for validating instances that use this pattern, intended to make pattern-conforming instances machine-verifiable; it is the executable side of a pattern
    fields:
      shapeIri:
        type: uri
        description: IRI of the SHACL shape
      targetClass:
        type: uri
        description: target class for this shape
      propertyShapes:
        type: list[SHACLPropertyShape]
        description: property-level constraints
  SHACLPropertyShape:
    iri: https://axiolune.ai/ontology/meta/patterns/SHACLPropertyShape
    cnNote: SHACL 属性形状，是本体工程中模式贡献的属性级校验投影，旨在把模式注入属性的基数与类型约束固化为可校验形状。
    definition: a closed property-level SHACL projection contributed by one cross-domain pattern, intended to solidify the cardinality and type constraints of pattern-injected properties into verifiable shapes
    requiredFields:
      path:
        type: uri
    optionalFields:
      minCount:
        type: nonNegativeSafeInteger
      maxCount:
        type: nonNegativeSafeInteger
      datatype:
        type: uri
      class:
        type: uri
      nodeKind:
        type: uri
      pattern:
        type: string
      in:
        type: list[any]
      hasValue:
        type: any
  PatternExample:
    iri: https://axiolune.ai/ontology/meta/patterns/PatternExample
    cnNote: 模式示例，是本体工程中展示模式使用方式的示例记录，旨在帮助理解模式如何落到具体类型上，是模式文档的一部分。
    definition: an example of how this pattern is used, intended to help understand how a pattern applies to concrete types; it is part of pattern documentation
    fields:
      description:
        type: string
      boundToType:
        type: uri
        description: ObjectTypeDefinition or AssociationTypeDefinition IRI
      parameterValues:
        type: dict
        description: parameter values for this binding
      resultingAttributes:
        type: list[string]
        description: attributes added to the type
  constraints:
    PublishBeforeReceive:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/PublishBeforeReceive
      namespace: pattern
      localName: PublishBeforeReceive
      label: Publish Before Receive Constraint
      definition: validation rule ensuring that the publication timestamp of
        information does not occur after its reception timestamp
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: publishedAt <= receivedAt OR receivedAt IS NULL
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/publishedAt
      severity: Error
      message: Publication time must not be after reception time
      note: Allows null receivedAt for unpublished drafts; enforces causal consistency
    ValidIntervalConsistency:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/ValidIntervalConsistency
      namespace: pattern
      localName: ValidIntervalConsistency
      label: Valid Interval Consistency Constraint
      definition: validation rule ensuring that the start of a business validity
        interval does not occur after its end
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: validFrom <= validTo OR validTo IS NULL
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/validFrom
      severity: Error
      message: Valid interval start must not be after end
      note: Allows open-ended intervals (null validTo); enforces temporal coherence
    KnowledgeIntervalConsistency:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/KnowledgeIntervalConsistency
      namespace: pattern
      localName: KnowledgeIntervalConsistency
      label: Knowledge Interval Consistency Constraint
      definition: validation rule ensuring that the start of a knowledge time interval
        does not occur after its end
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: knowledgeFrom <= knowledgeTo OR knowledgeTo IS NULL
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeFrom
      severity: Error
      message: Knowledge interval start must not be after end
      note: Allows open-ended knowledge (null knowledgeTo); critical for bi-temporal
        queries
    NoFutureKnowledge:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/NoFutureKnowledge
      namespace: pattern
      localName: NoFutureKnowledge
      label: No Future Knowledge Constraint
      definition: validation rule ensuring that knowledge acquisition time does not
        occur in the future relative to the immutable reference time of the
        materialization run
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: knowledgeFrom <= $referenceTime
      parameters:
        - name: referenceTime
          type: instant
          required: true
          description: immutable reference time from MaterializationRun (ADR-012); bound
            by PIT validator, not static SHACL
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeFrom
      severity: Error
      message: Knowledge time must not be in the future relative to the run reference
        time
      note: "Reproducible (ADR-012): $referenceTime is bound to
        MaterializationRun.referenceTime, an immutable value captured at run
        start. Severity is Error (production-blocking) for financial PIT
        integrity. Enforced by the PIT validator, not static SHACL."
    ObservationBeforeRecording:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/ObservationBeforeRecording
      namespace: pattern
      localName: ObservationBeforeRecording
      label: Observation Before Recording Constraint
      definition: validation rule ensuring that the observation timestamp does not
        occur after the recording timestamp
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: observedAt <= recordedAt
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
      severity: Error
      message: Observation time must not be after recording time
      note: Used by TemporalObservation pattern; enforces causal ordering
    ConfidenceRange:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/ConfidenceRange
      namespace: pattern
      localName: ConfidenceRange
      label: Confidence Range Constraint
      definition: validation rule ensuring that confidence values are bounded within
        the closed interval from zero to one
      constraintType: ValueRange
      scope: Attribute
      expression:
        language: Custom
        expression: confidence >= 0.0 AND confidence <= 1.0
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/confidence
      severity: Error
      message: Confidence must be between 0.0 and 1.0 inclusive
      note: Enforces probability interpretation; 0.0 = no confidence, 1.0 = certainty
    DigestFormat:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/DigestFormat
      namespace: pattern
      localName: DigestFormat
      label: Digest Format Constraint
      definition: validation rule ensuring that cryptographic digest values conform to
        the canonical format of algorithm prefix followed by colon and
        hexadecimal hash
      constraintType: Pattern
      scope: Attribute
      expression:
        language: Regex
        expression: ^(sha256|sha512|blake3):[a-f0-9]{64,128}$
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceDigest
      severity: Error
      message: Digest must be in format algorithm:hexdigest (e.g., sha256:abc123...)
      note: Supports sha256 (64 hex), sha512 (128 hex), blake3 (64 hex); ensures
        integrity verification
    SemanticVersionFormat:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/SemanticVersionFormat
      namespace: pattern
      localName: SemanticVersionFormat
      label: Semantic Version Format Constraint
      definition: validation rule ensuring that semantic version strings conform to
        the MAJOR.MINOR.PATCH specification
      constraintType: Pattern
      scope: Attribute
      expression:
        language: Regex
        expression: ^\\d+\\.\\d+\\.\\d+$
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/semanticVersion
      severity: Error
      message: Semantic version must be in format MAJOR.MINOR.PATCH (e.g., 1.2.3)
      note: Follows SemVer 2.0.0 specification; pre-release and build metadata not
        currently supported
    AvailabilityBeforeUse:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/AvailabilityBeforeUse
      namespace: pattern
      localName: AvailabilityBeforeUse
      label: Availability Before Use Constraint
      definition: fail-closed validation rule ensuring that a fact is not consumed
        before the beginning of its availability period, preventing look-ahead
        bias in backtesting and enforcing data-licensing compliance
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: $queryTime >= availableFrom
      parameters:
        - name: queryTime
          type: instant
          required: true
          description: explicit asOfAvailable query parameter (ADR-012); bound by PIT
            validator, not static SHACL
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom
      severity: Error
      message: Cannot query data before its availability period begins
      note: "Fail-closed (ADR-012): availableFrom MUST be present for PIT consumption
        — the OR availableFrom IS NULL escape was removed. If availableFrom is
        missing the fact is NOT consumable in a PIT context. $queryTime is the
        explicit asOfAvailable parameter; implicit 'now' is forbidden."
    AvailabilityIntervalConsistency:
      iri: https://axiolune.ai/ontology/meta/patterns/constraints/AvailabilityIntervalConsistency
      namespace: pattern
      localName: AvailabilityIntervalConsistency
      label: Availability Interval Consistency Constraint
      definition: validation rule ensuring that the start of an availability interval
        does not occur after its end
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: availableFrom <= availableTo OR availableTo IS NULL
      targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom
      severity: Error
      message: Availability interval start must not be after end
      note: Allows open-ended availability (null availableTo = available indefinitely
        once availableFrom is reached)
  patterns:
    - pattern: PublicationTiming
      iri: https://axiolune.ai/ontology/meta/patterns/PublicationTiming
      namespace: pattern
      localName: PublicationTiming
      label: Publication Timing Pattern
      definition: foundational pattern for tracking when information was published by
        its source and received by the platform
      cnNote: 发布时序模式，是本体工程中跟踪信息发布与接收时序的跨域模式，旨在为数据流记录"源何时发布、平台何时接收"，支撑发布先于接收的时序一致性校验。
      version: 1.0.0
      appliesTo:
        - ObjectTypeDefinition
        - AssociationTypeDefinition
      note: Extracted as shared base pattern to avoid conflicts between TemporalFact
        and ProvenancedFact
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/publishedAt
          minCount: 0
          maxCount: 1
          label: Published At
          description: when the data provider published this information
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/receivedAt
          minCount: 0
          maxCount: 1
          label: Received At
          description: when the platform received this information
      constraintsAdded:
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/PublishBeforeReceive
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/publishedAt
          parameters:
            rule: publishedAt <= receivedAt OR receivedAt IS NULL
            message: Publication must occur before or at reception time
    - pattern: TemporalFact
      iri: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      namespace: pattern
      localName: TemporalFact
      label: Bi-Temporal Fact Pattern
      definition: pattern for bi-temporal semantics distinguishing business validity
        time (when the fact was true in the world) from system knowledge time
        (when the platform learned about it)
      cnNote: 双时态事实模式，是本体工程中区分业务有效时间与系统获知时间的双时态跨域模式，旨在为事实建立"何时为真"与"何时被知"两条时间轴，是回测与审计防前视偏差的核心。
      version: 1.0.0
      appliesTo:
        - ObjectTypeDefinition
        - AssociationTypeDefinition
      dependencies:
        - https://axiolune.ai/ontology/meta/patterns/PublicationTiming
      conflicts:
        - https://axiolune.ai/ontology/meta/patterns/TemporalObservation
      note: Depends on PublicationTiming for publishedAt field; conflicts with
        TemporalObservation (mutually exclusive temporal models)
      parameters:
        - name: timeGranularity
          type: enum
          allowedValues:
            - instant
            - date
            - dateTime
          defaultValue: instant
          description: precision of temporal fields
        - name: requireValidTo
          type: boolean
          defaultValue: false
          description: whether validTo must be specified (true) or can be null for ongoing
            facts
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/validFrom
          minCount: 1
          maxCount: 1
          label: Valid From
          description: business time when this fact became true in the real world
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/validTo
          minCount: 0
          maxCount: 1
          label: Valid To
          description: business time when this fact ceased to be true (null = still valid)
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeFrom
          minCount: 1
          maxCount: 1
          label: Knowledge From
          description: system time when the platform began to assert this version as true
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeTo
          minCount: 0
          maxCount: 1
          label: Knowledge To
          description: system time when the platform ceased to assert this version (null =
            current version, not superseded or retracted)
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 0
          maxCount: 1
          label: Observed At
          description: when the observation or measurement was made (for market data)
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom
          minCount: 1
          maxCount: 1
          label: Available From
          description: beginning of the availability period during which this data may be
            consumed (delays, authorization, embargo). Required (fail-closed)
            for TemporalFact — a fact without an availability start is NOT
            consumable in PIT contexts.
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/availableTo
          minCount: 0
          maxCount: 1
          label: Available To
          description: end of the availability period (null = available indefinitely once
            availableFrom is reached)
      constraintsAdded:
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/ValidIntervalConsistency
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/validFrom
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/KnowledgeIntervalConsistency
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeFrom
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/NoFutureKnowledge
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeFrom
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/AvailabilityBeforeUse
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/AvailabilityIntervalConsistency
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/availableFrom
      owlProjection:
        kind: mixin
        additionalClasses:
          - owl:Class
          - time:TemporalEntity
      shaclShape:
        shapeIri: https://axiolune.ai/ontology/meta/patterns/shapes/TemporalFactShape
        propertyShapes:
          - path: https://axiolune.ai/ontology/meta/patterns/attributes/validFrom
            minCount: 1
            maxCount: 1
            datatype: xsd:dateTime
          - path: https://axiolune.ai/ontology/meta/patterns/attributes/knowledgeFrom
            minCount: 1
            maxCount: 1
            datatype: xsd:dateTime
      asOfQuerySemantics:
        description: formal Point-in-Time query semantics across three temporal axes
          (ADR-012)
        parameters:
          - name: asOfKnowledge
            type: instant
            required: true
            description: query at this point on the knowledge time axis; required (no
              implicit now)
          - name: asOfValid
            type: instant
            required: true
            description: query at this point on the business (valid) time axis; required
          - name: asOfAvailable
            type: instant
            required: true
            description: query restricted to data available at this point on the
              availability time axis; required (prevents look-ahead bias)
        logicalQuery: |
          SELECT *
          FROM facts
          WHERE knowledgeFrom <= :asOfKnowledge
            AND (knowledgeTo IS NULL OR knowledgeTo > :asOfKnowledge)
            AND validFrom <= :asOfValid
            AND (validTo IS NULL OR validTo > :asOfValid)
            AND availableFrom <= :asOfAvailable
            AND (availableTo IS NULL OR availableTo > :asOfAvailable)
          ORDER BY knowledgeFrom DESC, validFrom DESC
          LIMIT 1 PER logical_key
      examples:
        - description: Market price observation with bi-temporal tracking
          boundToType: fin:PriceObservation
          parameterValues:
            timeGranularity: instant
            requireValidTo: false
          resultingAttributes:
            - validFrom
            - validTo
            - knowledgeFrom
            - knowledgeTo
            - observedAt
            - publishedAt
    - pattern: TemporalObservation
      iri: https://axiolune.ai/ontology/meta/patterns/TemporalObservation
      namespace: pattern
      localName: TemporalObservation
      label: Temporal Observation Pattern
      definition: pattern for single-timestamp observations without explicit validity
        periods (e.g., sensor readings, event timestamps)
      cnNote: 时态观测模式，是本体工程中带单一时间戳的观测跨域模式，旨在为传感器读数、行情快照等无需双时态的观测提供轻量时序标注。
      version: 1.0.0
      appliesTo:
        - AssociationTypeDefinition
      conflicts:
        - https://axiolune.ai/ontology/meta/patterns/TemporalFact
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
          label: Observed At
          description: when the measurement or observation was made
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/recordedAt
          minCount: 1
          maxCount: 1
          label: Recorded At
          description: when the observation was recorded in the system
      constraintsAdded:
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/ObservationBeforeRecording
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          parameters:
            rule: observedAt <= recordedAt
            message: Observation must occur before or at recording time
    - pattern: ProvenancedFact
      iri: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
      namespace: pattern
      localName: ProvenancedFact
      label: Provenance Tracking Pattern
      definition: pattern for tracking the origin, authority, lineage, and confidence
        of information
      cnNote: 溯源事实模式，是本体工程中跟踪事实来源、权威与谱系的跨域模式，旨在为每个事实记录"来自哪里、由谁负责、可信程度"，支撑数据可追溯与可审计。
      version: 1.0.0
      appliesTo:
        - ObjectTypeDefinition
        - AssociationTypeDefinition
      reference: W3C PROV-O
      dependencies:
        - https://axiolune.ai/ontology/meta/patterns/PublicationTiming
      note: Depends on PublicationTiming for publishedAt and receivedAt fields
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/source
          minCount: 1
          maxCount: 1
          label: Source
          description: originating data source or provider URI
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/sourceVersion
          minCount: 0
          maxCount: 1
          label: Source Version
          description: version or snapshot identifier of the source
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/confidence
          minCount: 0
          maxCount: 1
          label: Confidence Score
          description: confidence score or probability (0.0 to 1.0)
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/revision
          minCount: 0
          maxCount: 1
          label: Revision Number
          description: revision number for this fact (increments on updates)
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/derivedFrom
          minCount: 0
          maxCount: null
          label: Derived From
          description: URIs of facts this was derived from (for computed/transformed data)
      constraintsAdded:
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/ConfidenceRange
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/confidence
          parameters:
            rule: confidence >= 0.0 AND confidence <= 1.0
            message: Confidence must be between 0.0 and 1.0
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/PublishBeforeReceive
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/publishedAt
          parameters:
            rule: publishedAt <= receivedAt
            message: Source publication must precede platform receipt
    - pattern: Evidence
      iri: https://axiolune.ai/ontology/meta/patterns/Evidence
      namespace: pattern
      localName: Evidence
      label: Evidence Tracking Pattern
      definition: pattern for linking facts to supporting evidence, documents, and
        data artifacts for audit and reproducibility
      cnNote: 证据模式，是本体工程中把事实链接到支持证据的跨域模式，旨在为断言提供带加密摘要的证据绑定，使每个事实都可追溯到不可篡改的证据工件。
      version: 1.0.0
      appliesTo:
        - ObjectTypeDefinition
        - AssociationTypeDefinition
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceType
          minCount: 1
          maxCount: 1
          label: Evidence Type
          description: category of evidence
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceRef
          minCount: 1
          maxCount: 1
          label: Evidence Reference
          description: URI reference to evidence artifact
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceDigest
          minCount: 0
          maxCount: 1
          label: Evidence Digest
          description: cryptographic hash of evidence artifact for immutability verification
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceTimestamp
          minCount: 0
          maxCount: 1
          label: Evidence Timestamp
          description: when the evidence was created or captured
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceDescription
          minCount: 0
          maxCount: 1
          label: Evidence Description
          description: human-readable description of the evidence
      constraintsAdded:
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/DigestFormat
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/evidenceDigest
          parameters:
            pattern: ^(sha256|sha512):[a-f0-9]+$
            message: Evidence digest must be in format 'algorithm:hexhash'
    - pattern: Lifecycle
      iri: https://axiolune.ai/ontology/meta/patterns/Lifecycle
      namespace: pattern
      localName: Lifecycle
      label: Lifecycle State Management Pattern
      definition: pattern for managing entity lifecycle states, transitions, and history
      cnNote: 生命周期模式，是本体工程中管理实体状态与状态转移的跨域模式，旨在为实体提供"草稿、活跃、弃用、退役"等状态的类型化追踪，支撑本体演化的可审计。
      version: 1.0.0
      appliesTo:
        - ObjectTypeDefinition
        - AssociationTypeDefinition
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/lifecycleState
          minCount: 1
          maxCount: 1
          label: Lifecycle State
          description: current lifecycle state of the entity
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/lifecycleVersion
          minCount: 1
          maxCount: 1
          label: Lifecycle Version
          description: version number incremented on each state transition
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/createdAt
          minCount: 1
          maxCount: 1
          label: Created At
          description: when the entity was first created
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/updatedAt
          minCount: 1
          maxCount: 1
          label: Updated At
          description: when the entity was last updated
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/deprecatedAt
          minCount: 0
          maxCount: 1
          label: Deprecated At
          description: when the entity was deprecated (if applicable)
      note: State transition history should be tracked as separate StateTransition
        events, not as a list field
    - pattern: Versioning
      iri: https://axiolune.ai/ontology/meta/patterns/Versioning
      namespace: pattern
      localName: Versioning
      label: Semantic Versioning Pattern
      definition: pattern for tracking semantic versions of ontology artifacts (not
        business fact revisions)
      cnNote: 版本化模式，是本体工程中跟踪本体工件语义版本的跨域模式，旨在为本体工件本身（区别于业务事实）提供版本链与不兼容声明，支撑本体的兼容性管理。
      version: 1.0.0
      appliesTo:
        - ObjectTypeDefinition
        - AssociationTypeDefinition
        - AttributeTypeDefinition
        - RelationTypeDefinition
      note: This is for ONTOLOGY ARTIFACT versioning, not business fact modification
        (use TemporalFact for that)
      injectedAttributes:
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/semanticVersion
          minCount: 1
          maxCount: 1
          label: Semantic Version
          description: semantic version in MAJOR.MINOR.PATCH format
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/versionedIri
          minCount: 1
          maxCount: 1
          label: Versioned IRI
          description: IRI including version identifier
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/priorVersion
          minCount: 0
          maxCount: 1
          label: Prior Version
          description: IRI of the immediately preceding version
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/incompatibleWith
          minCount: 0
          maxCount: null
          label: Incompatible With
          description: version IRIs this version is incompatible with
      constraintsAdded:
        - constraintRef: https://axiolune.ai/ontology/meta/patterns/constraints/SemanticVersionFormat
          targetElement: https://axiolune.ai/ontology/meta/patterns/attributes/semanticVersion
          parameters:
            pattern: ^\d+\.\d+\.\d+$
            message: Semantic version must be in MAJOR.MINOR.PATCH format
  ValidationRules:
    - All PatternDefinition instances must have unique IRIs
    - PatternBinding.pattern must reference a valid PatternDefinition IRI
    - Patterns with conflicts cannot be bound to the same type simultaneously
    - Pattern dependencies must form a DAG (no circular dependencies)
    - Injected attributes must not conflict with type's own attributes (same IRI)
    - Pattern parameters must be provided if required=true
    - Pattern composition must respect applicability constraints
    - "All pattern constraints MUST conform to ConstraintDefinition grammar
      (core Layer 1): required fields
      iri/namespace/localName/label/definition/constraintType/scope/expression/\
      severity/message, where expression is structured {language, expression}"
    - "Runtime-parameterized constraints (NoFutureKnowledge: $referenceTime,
      AvailabilityBeforeUse: $queryTime) are enforced by the dedicated PIT
      validator with MaterializationRun as explicit input (ADR-012); the SHACL
      sh:ConstraintComponent definitions serve as declarative specifications
      only — static SHACL shapes cannot bind runtime parameters"
  Notes:
    - Patterns are now first-class ontology elements with IRIs and versions
    - PatternBinding in Layer 1 refers to PatternDefinition.iri in Layer 2
    - TemporalFact and TemporalObservation are mutually exclusive (conflicts)
    - Identity pattern is implicit in
      ObjectTypeDefinition/AssociationTypeDefinition; not a separate pattern
    - FIBO alignment references retained for compatibility but should be
      formalized as Alignment objects
    - Classification pattern omitted pending decision on whether it should be a
      pattern or a relation
    - All IRIs are final per ADR-002 (Accepted); CURIE prefixes (ax-meta,
      ax-pattern, fin) expand to
      https://axiolune.ai/ontology/{meta,meta/patterns,domain}/ respectively;
      absolute IRIs are canonical
