# Axiolune Ontology Meta-Model - Layer 1: Semantic Core
# Version: 0.3.0
# Date: 2026-07-28
# Governance: Follows ADR-001, ADR-004 architecture decisions

module:
  moduleIri: "https://axiolune.ai/ontology/meta/core"
  baseIri: "https://axiolune.ai/ontology/meta/core/"
  preferredPrefix: "ax-meta"
  version: "0.3.0"
  imports: []
  exports: []  # Empty means export all defined types

MetaModel:
  version: "0.3.0"
  description: "Semantic core meta-model defining ontology structure, types, and alignment"
  layer: 1
  changes:
    - "v0.3.0: Global rename to *Definition suffix (ADR-004)"
    - "v0.3.0: Updated module system with moduleIri, baseIri, preferredPrefix"
    - "v0.3.0: Added LocalizedTextDefinition"

  # ==================== Module Management ====================
  OntologyModuleDefinition:
    definition: "a named collection of ontology elements with versioning and dependency management"
    owlProjection:
      kind: ontology
    note: "Updated in ADR-004 to support version-locked imports and symbol resolution"

    requiredFields:
      moduleIri:
        type: iri
        unique: true
        description: "globally unique IRI for this module (identifies the module itself)"
        example: "https://axiolune.ai/ontology/finance/instruments"
        note: "Module IRI is distinct from baseIri"

      baseIri:
        type: iri
        required: true
        description: "base IRI for concepts defined in this module (used for symbol resolution)"
        example: "https://axiolune.ai/ontology/finance/instruments/"
        note: "Note trailing slash; concatenated with localName to form concept IRIs"

      preferredPrefix:
        type: string
        unique: true
        required: true
        description: "short prefix for this module (used in prefix:localName references)"
        example: "fin-inst"
        pattern: "^[a-z][a-z0-9-]*$"

      version:
        type: string
        required: true
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        example: "1.0.0"
        note: "Semantic versioning"

      label:
        type: string
        required: true
        example: "Financial Instruments Ontology"

      definition:
        type: string
        required: true
        constraint: "ISO 704 genus-differentia structure"

    optionalFields:
      imports:
        type: "list[ModuleImportDefinition]"
        description: "version-locked imports of other modules"

      exports:
        type: "list[iri]"
        description: "explicitly exported symbol IRIs (empty list = export all)"

      status:
        type: enum
        values: [draft, review, approved, deprecated]
        default: draft

      governance:
        type: GovernanceMetadata
        description: "owner, approvers, change history"

  # ==================== Module Import ====================
  ModuleImportDefinition:
    definition: "a version-locked import of another ontology module"
    note: "Ensures deterministic symbol resolution and prevents breaking changes from implicit updates"

    requiredFields:
      moduleIri:
        type: iri
        required: true
        description: "IRI of the imported module"
        example: "https://axiolune.ai/ontology/finance/core"

      version:
        type: string
        required: true
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: "locked version of the imported module"
        note: "Prevents implicit breaking changes"

      artifactDigest:
        type: string
        required: true
        pattern: "^sha256:[0-9a-f]{64}$"
        description: "SHA-256 digest of the imported module file"
        note: "Ensures integrity and enables reproducible builds"

      importMode:
        type: enum
        required: true
        values: [All, Selective]
        description: "All = import all exported symbols; Selective = import only specified symbols"

    optionalFields:
      importedSymbols:
        type: "list[SymbolImportSpec]"
        description: "symbols to import (required if importMode=Selective)"

  # ==================== Symbol Import Spec ====================
  SymbolImportSpec:
    definition: "specification of a single imported symbol with optional local alias"

    requiredFields:
      symbolIri:
        type: iri
        required: true
        description: "complete IRI of the imported symbol"
        example: "https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/isIssuedBy"

    optionalFields:
      localAlias:
        type: string
        description: "optional local alias for this symbol"
        example: "isIssuedBy"
        note: "Allows 'fibo:FinancialInstrument as Instrument' style imports"

  # ==================== LocalizedText ====================
  LocalizedTextDefinition:
    definition: "a value object for multi-language text with language tags"
    kind: StructuredValueType
    owlProjection:
      kind: rdfLangString
      note: "Projects to rdf:langString with @en, @zh, etc. language tags"

    requiredFields:
      language:
        type: string
        required: true
        pattern: "^[a-z]{2}(-[A-Z]{2})?$"
        description: "language tag (ISO 639-1, optional ISO 3166-1)"
        example: ["en", "zh-CN", "ja", "en-US"]

      text:
        type: string
        required: true
        description: "text content in the specified language"

    optionalFields:
      defaultLanguage:
        type: string
        default: "en"
        description: "fallback language if requested language not available"

  # ==================== Value Type System ====================
  ValueType:
    definition: "a meta-classifier for primitive value types used in attributes"
    owlProjection:
      kind: datatype

    builtinTypes:
      - id: string
        definition: "Unicode character sequence"
        owlMapping: "xsd:string"

      - id: decimal
        definition: "arbitrary-precision decimal number"
        owlMapping: "xsd:decimal"

      - id: integer
        definition: "whole number"
        owlMapping: "xsd:integer"

      - id: boolean
        definition: "truth value (true or false)"
        owlMapping: "xsd:boolean"

      - id: date
        definition: "calendar date without time component"
        owlMapping: "xsd:date"

      - id: instant
        definition: "point in time with timezone"
        owlMapping: "xsd:dateTime"

      - id: duration
        definition: "time interval"
        owlMapping: "xsd:duration"

      - id: uri
        definition: "uniform resource identifier"
        owlMapping: "xsd:anyURI"

    note: "Domain-specific types (ISIN, MoneyTypeDefinition, QuantityTypeDefinition) defined as IdentifierTypeDefinition, MoneyTypeDefinition, QuantityTypeDefinition"

  # ==================== Identifier Type ====================
  IdentifierTypeDefinition:
    definition: "a meta-classifier for standard identifiers with validation rules and issuing authorities"
    owlProjection:
      kind: datatype

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string}
      localName: {type: string}
      label: {type: string, required: true}
      definition: {type: string, required: true, iso704: true}
      baseType: {type: ValueType, default: string}

      standard:
        type: string
        description: "governing standard"
        example: "ISO 6166"

      validatorRef:
        type: uri
        description: "reference to ConstraintDefinition IRI"

    optionalFields:
      issuingAuthority:
        type: string
        description: "organization responsible for identifier issuance"
        example: "ANNA (Association of National Numbering Agencies)"

      alignments:
        type: "list[Alignment]"

  # ==================== Money Type ====================
  MoneyTypeDefinition:
    definition: "a meta-classifier for monetary amounts with currency and scale"
    owlProjection:
      kind: structuredValueClass
      classIri: "https://axiolune.ai/ontology/meta/core/values/MonetaryAmount"
      properties:
        - predicateIri: "https://axiolune.ai/ontology/meta/core/properties/hasAmount"
          range: "xsd:decimal"
        - predicateIri: "https://axiolune.ai/ontology/meta/core/properties/hasCurrency"
          range: "xsd:string"
          pattern: "^[A-Z]{3}$"
        - predicateIri: "https://axiolune.ai/ontology/meta/core/properties/hasScale"
          range: "xsd:integer"
    note: "MUST NOT use generic number or decimal for financial amounts. Projected as a structured value class (not a simple datatype) to preserve currency, amount, and scale independence."

    structure:
      amount:
        type: decimal
        required: true
        description: "numeric value"

      currency:
        type: string
        required: true
        description: "ISO 4217 currency code (3-letter code)"
        pattern: "^[A-Z]{3}$"
        example: "USD"

      scale:
        type: integer
        default: 2
        description: "decimal places for rounding"

  # ==================== Quantity Type ====================
  QuantityTypeDefinition:
    definition: "a meta-classifier for measurements with units and precision"
    owlProjection:
      kind: structuredValueClass
      classIri: "https://axiolune.ai/ontology/meta/core/values/QuantityValue"
      properties:
        - predicateIri: "https://axiolune.ai/ontology/meta/core/properties/hasNumericValue"
          range: "xsd:decimal"
        - predicateIri: "https://axiolune.ai/ontology/meta/core/properties/hasUnit"
          range: "xsd:string"
        - predicateIri: "https://axiolune.ai/ontology/meta/core/properties/hasPrecision"
          range: "xsd:integer"
    note: "Projected as a structured value class to preserve value, unit, precision, and rounding independently. Unit should be a URI reference to a unit ontology (e.g., QUDT) in production."

    structure:
      value:
        type: decimal
        required: true

      unit:
        type: string
        required: true
        description: "unit of measurement (shares, contracts, kg, m³) - should be URI reference in production"
        example: "shares"
        note: "In production, use controlled unit vocabulary or QUDT unit URIs"

      precision:
        type: integer
        description: "significant digits or decimal places"

      rounding:
        type: enum
        values: [floor, ceiling, half-up, half-even]
        default: half-even

  # ==================== Code List Type ====================
  CodeListTypeDefinition:
    definition: "a meta-classifier for controlled vocabularies with versioning and maintenance"
    owlProjection:
      kind: class
      stereotype: enumeration

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string}
      localName: {type: string}
      label: {type: string, required: true}
      definition: {type: string, required: true}

      vocabulary:
        type: string
        description: "name of the code list"
        example: "ISO 10383 Market Identifier Codes"

      version:
        type: string
        required: true
        example: "2026-Q1"

      maintainer:
        type: string
        description: "organization maintaining the code list"

    optionalFields:
      values:
        type: "list[CodeValue]"
        description: "enumerated values"

      alignments:
        type: "list[Alignment]"

  # ==================== Object Type ====================
  ObjectTypeDefinition:
    definition: "a meta-classifier that defines domain entity types with identity, properties, and constraints"
    owlProjection:
      kind: class

    requiredFields:
      iri:
        type: uri
        unique: true
        constraint: "globally unique across all namespaces (FIBO hygiene rule #1)"
        example: "https://axiolune.ai/ontology/meta/core/finance/Equity"
        note: "IRI namespace strategy pending ADR-002"

      namespace:
        type: string
        required: true
        description: "module namespace prefix"
        example: "fin"

      localName:
        type: string
        required: true
        description: "name within namespace"
        example: "Equity"
        constraint: "unique within namespace"

      label:
        type: string
        required: true
        description: "human-readable name"
        example: "Equity Security"

      definition:
        type: string
        required: true
        constraint: "ISO 704 genus-differentia structure: genus (broader class) + differentia (distinguishing characteristics)"
        example: "financial instrument that represents an ownership position in a publicly-traded corporation"

    optionalFields:
      superTypes:
        type: "list[uri]"
        description: "semantic parent classes (multiple inheritance for true semantic subsumption)"
        example: ["fin:Instrument", "fin:TradableAsset"]
        note: "Replaces single baseClass; represents true semantic inheritance"

      attributeUses:
        type: "list[AttributeUse]"
        description: "attributes applied to this type with contextual constraints"

      patternBindings:
        type: "list[PatternBinding]"
        description: "cross-domain patterns bound to this type"
        example:
          - pattern: "fin:TemporalFact"
          - pattern: "fin:ProvenancedFact"

      constraints:
        type: "list[ConstraintBinding]"
        description: "validation rules applied to this type"

      alignments:
        type: "list[Alignment]"
        description: "mappings to external ontologies (FIBO, industry standards)"

      governance:
        type: GovernanceMetadata

  # ==================== Attribute Type ====================
  AttributeTypeDefinition:
    definition: "a meta-classifier for typed properties that attach literal values or structured value objects to entities"
    owlProjection:
      note: "Projection kind depends on valueType category: primitive types → datatypeProperty, structured value types (MoneyTypeDefinition, QuantityTypeDefinition) → objectProperty"
      rules:
        - "IF valueType references a primitive (string, integer, decimal, boolean, date, instant, duration, uri) THEN owl:DatatypeProperty"
        - "IF valueType references IdentifierTypeDefinition or CodeListTypeDefinition THEN owl:DatatypeProperty"
        - "IF valueType references MoneyTypeDefinition, QuantityTypeDefinition, or other StructuredValueType THEN owl:ObjectProperty with range = structured value class IRI"
    note: "Renamed from PropertyType to clarify it represents literal-valued attributes, not object relations. OWL projection is now conditional based on valueType complexity."

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string, required: true}
      localName: {type: string, required: true}

      label:
        type: string
        required: true
        example: "International Securities Identification Number"

      definition:
        type: string
        required: true
        iso704: true
        example: "unique identifier for securities that conforms to ISO 6166 standard"

      valueType:
        type: string
        required: true
        description: "reference to ValueType, IdentifierTypeDefinition, MoneyTypeDefinition, QuantityTypeDefinition, CodeListTypeDefinition, or other structured value type"
        example: "fin:ISIN"
        note: "Determines OWL projection: primitives → datatypeProperty, structured values → objectProperty"

    optionalFields:
      owlProjectionOverride:
        type: enum
        values: [datatypeProperty, objectProperty, annotationProperty]
        description: "explicit override of automatic OWL projection (use sparingly)"
        note: "Only needed for edge cases where automatic projection is incorrect"

      defaultCardinality:
        minCount: {type: integer, default: 0, description: "0=optional, 1=required"}
        maxCount: {type: integer, default: 1, description: "1=single-valued, null=unbounded"}
        note: "Default cardinality; can be overridden in AttributeUse"

      enumValues:
        type: "list[string]"
        description: "allowed values for enum types"
        example: ["BUY", "SELL"]

      pattern:
        type: string
        description: "regex validation pattern"
        example: "[A-Z]{2}[A-Z0-9]{9}[0-9]"

      unit:
        type: string
        description: "physical or financial unit for numeric types"
        example: "USD, shares, bps"

      alignments:
        type: "list[Alignment]"
        example:
          - vocabulary: FIBO
            targetIri: "https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/hasDateValue"
            relation: rdfs:subPropertyOf

    examples:
      - description: "Simple datatype property"
        iri: "fin:hasISIN"
        valueType: "fin:ISINType"
        owlProjection: "owl:DatatypeProperty with range xsd:string + pattern constraint"

      - description: "Structured value object property"
        iri: "fin:quotedPrice"
        valueType: "fin:MoneyTypeDefinition"
        owlProjection: "owl:ObjectProperty with range fin:MonetaryAmount (class with hasAmount, hasCurrency, hasScale properties)"

  # ==================== Attribute Use ====================
  AttributeUse:
    definition: "a binding of an AttributeTypeDefinition to an ObjectTypeDefinition with contextual constraints"
    note: "Separates global attribute definition from context-specific usage"

    requiredFields:
      attribute:
        type: uri
        required: true
        description: "reference to global AttributeTypeDefinition"
        example: "fin:hasISIN"

    optionalFields:
      minCount:
        type: integer
        description: "override global minCount; 1 means required in this context"
        example: 1

      maxCount:
        type: integer
        description: "override global maxCount; null means unbounded"
        example: 1

      label:
        type: string
        description: "context-specific display label (does NOT change semantics)"
        example: "Stock Identifier"
        note: "Allows UI customization without altering attribute definition"

      defaultValue:
        type: string
        description: "default value when not provided"

      constraints:
        type: "list[ConstraintBinding]"
        description: "additional validation rules for this usage context"

  # ==================== Relation Type ====================
  RelationTypeDefinition:
    definition: "a meta-classifier for binary semantic relationships between entity types"
    owlProjection:
      kind: objectProperty
    note: "For pure semantic relations; use AssociationTypeDefinition for relations with context"

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string, required: true}
      localName: {type: string, required: true}

      label:
        type: string
        required: true
        example: "is issued by"

      definition:
        type: string
        required: true
        iso704: true
        example: "relationship between a financial instrument and the legal entity that issued it"

      domain:
        type: uri
        required: true
        description: "subject type IRI"
        example: "fin:Equity"

      range:
        type: uri
        required: true
        description: "object type IRI"
        example: "fin:Organization"

    optionalFields:
      inverseOf:
        type: uri
        description: "inverse RelationTypeDefinition IRI for bidirectional relations"
        example: "fin:issues"
        note: "Strong-typed reference; no text inverseName"

      characteristics:
        type: "list[enum]"
        values: [functional, inverseFunctional, transitive, symmetric, asymmetric, reflexive, irreflexive]
        description: "OWL property characteristics"

      alignments:
        type: "list[Alignment]"

  # ==================== Relation Use ====================
  RelationUse:
    definition: "a contextual application of a RelationTypeDefinition with specific cardinality constraints"
    note: "Cardinality is contextual, not global, because subclasses may have different constraints"

    requiredFields:
      relation:
        type: uri
        required: true
        description: "reference to RelationTypeDefinition"
        example: "fin:isIssuedBy"

      subjectType:
        type: uri
        required: true
        description: "subject ObjectTypeDefinition IRI"
        example: "fin:Equity"

      objectType:
        type: uri
        required: true
        description: "object ObjectTypeDefinition IRI"
        example: "fin:Organization"

    optionalFields:
      outboundCardinality:
        minCount: {type: integer, default: 0}
        maxCount: {type: integer, default: null, description: "null=unbounded"}
        description: "how many targets one subject can have"
        note: "one Equity → how many Organizations"

      inboundCardinality:
        minCount: {type: integer, default: 0}
        maxCount: {type: integer, default: null}
        description: "how many subjects can point to one target"
        note: "one Organization ← how many Equities"

      constraints:
        type: "list[ConstraintBinding]"

  # ==================== Association Type ====================
  AssociationTypeDefinition:
    definition: "a meta-classifier for reifiable n-ary relations with identity, context, and lifecycle"
    owlProjection:
      kind: class
      stereotype: association
    note: "Use for relations that need timestamp, source, confidence, quantity, or state (e.g., PriceObservation, Holding, Execution)"
    reference: "https://www.w3.org/TR/swbp-n-aryRelations/"

    requiredFields:
      iri: {type: uri, unique: true}
      namespace: {type: string, required: true}
      localName: {type: string, required: true}
      label: {type: string, required: true}
      definition: {type: string, required: true, iso704: true}

      participantRoles:
        type: "list[ParticipantRole]"
        minCount: 2
        description: "typed participants in this association"
        example:
          - id: observedInstrument
            range: "fin:Instrument"
            minCount: 1
            maxCount: 1
          - id: venue
            range: "fin:Market"
            minCount: 1
            maxCount: 1

    optionalFields:
      attributeUses:
        type: "list[AttributeUse]"
        description: "attributes of the association itself"
        example:
          - attribute: "fin:quotedPrice"
            minCount: 1
            maxCount: 1

      patternBindings:
        type: "list[PatternBinding]"
        description: "cross-domain patterns (Temporal, Provenance) bound to this association"
        example:
          - pattern: "fin:TemporalFact"
          - pattern: "fin:ProvenancedFact"

      projectedRelations:
        type: "list[uri]"
        description: "convenience binary edges derived from this association (e.g., hasLatestPrice)"
        note: "Projections are views, not independent truth sources"

      alignments:
        type: "list[Alignment]"

  # ==================== Participant Role ====================
  ParticipantRole:
    definition: "a typed slot in an AssociationTypeDefinition specifying the role and type of a participant"

    requiredFields:
      id:
        type: string
        required: true
        description: "role identifier"
        example: "observedInstrument"

      range:
        type: uri
        required: true
        description: "participant ObjectTypeDefinition IRI"
        example: "fin:Instrument"

      minCount:
        type: integer
        default: 0
        description: "minimum number of participants in this role"

      maxCount:
        type: integer
        default: null
        description: "maximum number of participants in this role (null = unbounded)"

    optionalFields:
      label: {type: string}
      definition: {type: string}

  # ==================== Pattern Binding ====================
  PatternBinding:
    definition: "a declaration that an ObjectTypeDefinition or AssociationTypeDefinition adheres to a cross-domain pattern"
    note: "Patterns from Layer 2 (Temporal, Provenance, Evidence) inject attribute requirements and constraints"

    requiredFields:
      pattern:
        type: uri
        required: true
        description: "reference to cross-domain pattern IRI"
        example: "fin:TemporalFact"

    optionalFields:
      parameters:
        type: dict
        description: "pattern-specific configuration"
        example: {granularity: instant, requireValidTo: false}

  # ==================== Alignment ====================
  Alignment:
    definition: "a documented mapping between a local ontology element and an external standard"
    note: "Supports audit, version control, and semantic interoperability without requiring exactMatch for all concepts"

    requiredFields:
      vocabulary:
        type: string
        required: true
        description: "external vocabulary name"
        example: "FIBO"

      targetIri:
        type: uri
        required: true
        description: "IRI of the external concept (without version query parameters)"
        example: "https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/isIssuedBy"

      relation:
        type: enum
        required: true
        values:
          - skos:exactMatch       # high-confidence semantic equivalence (SKOS mapping, not OWL logical equivalence)
          - skos:closeMatch       # semantically related, useful for discovery
          - skos:broadMatch       # external concept is broader
          - skos:narrowMatch      # external concept is narrower
          - rdfs:subClassOf       # local class is a semantic subclass
          - rdfs:subPropertyOf    # local property is a semantic subproperty
          - owl:equivalentClass   # proven formal logical equivalence
          - owl:equivalentProperty
        description: "type of alignment relationship"
        note: "Use rdfs:subClassOf/subPropertyOf when local concept is narrower; reserve owl:equivalent* for proven formal equivalence"

    optionalFields:
      sourceRelease:
        vocabulary: {type: string}
        release: {type: string, example: "2026Q1"}
        artifactDigest: {type: string, example: "sha256:..."}
        description: "version locking for external vocabulary"

      sourceLocator:
        type: uri
        description: "human-readable URL with version (for documentation only)"
        example: "https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/isIssuedBy?version=master%2F2026Q1"

      rationale:
        type: string
        description: "justification for this alignment"
        example: "Direct semantic equivalence for issuer relationship"

      verification:
        status: {type: enum, values: [proposed, reviewed, approved, deprecated]}
        verifiedBy: {type: string, example: "ontology-team"}
        verifiedAt: {type: instant}
        notes: {type: string}

  # ==================== Constraint Definition ====================
  ConstraintDefinition:
    definition: "a meta-classifier for semantic validation rules that can be applied to types, attributes, relations, or associations"
    owlProjection:
      kind: class
      stereotype: constraint

    requiredFields:
      iri:
        type: uri
        unique: true
        description: "globally unique IRI for this constraint"
        example: "https://axiolune.ai/ontology/meta/core/constraints/ISINCheckDigit"

      namespace:
        type: string
        required: true
        description: "module namespace prefix"

      localName:
        type: string
        required: true
        description: "constraint name within namespace"

      label:
        type: string
        required: true
        example: "ISIN Check Digit Validation"

      definition:
        type: string
        required: true
        iso704: true
        example: "validation rule that verifies the check digit of an ISIN code using the Luhn algorithm"

      constraintType:
        type: enum
        required: true
        values: [Cardinality, ValueRange, Pattern, Custom, Logical, Uniqueness, Dependency]
        description: "category of constraint"

      scope:
        type: enum
        required: true
        values: [Attribute, Relation, Object, Association, Pattern, Module]
        description: "what kind of element this constraint applies to"

      expression:
        type: ConstraintExpression
        required: true
        description: "formal expression of the constraint"

      severity:
        type: enum
        required: true
        values: [Error, Warning, Info]
        default: Error

      message:
        type: LocalizedText
        required: true
        description: "error message template for violations"
        example: "ISIN check digit validation failed for value {value}"

    optionalFields:
      parameters:
        type: "list[ConstraintParameter]"
        description: "parameterized constraints"

      dependencies:
        type: "list[uri]"
        description: "other constraints that must be satisfied first"

      alignments:
        type: "list[Alignment]"

  # ==================== Constraint Expression ====================
  ConstraintExpression:
    definition: "the formal expression of a constraint rule"

    fields:
      language:
        type: enum
        required: true
        values: [SHACL, SPARQL, JSONSchema, Regex, Custom]
        description: "constraint expression language"

      expression:
        type: string
        required: true
        description: "the actual constraint expression"
        example: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"

      expressionDigest:
        type: string
        description: "SHA256 hash of expression for versioning"

  # ==================== Constraint Parameter ====================
  ConstraintParameter:
    definition: "a parameter for parameterized constraints"

    fields:
      name:
        type: string
        required: true

      type:
        type: string
        required: true
        description: "parameter value type"

      required:
        type: boolean
        default: true

      defaultValue:
        type: any

  # ==================== Constraint Binding ====================
  ConstraintBinding:
    definition: "the application of a ConstraintDefinition to a specific ontology element with parameter values"

    requiredFields:
      constraintRef:
        type: uri
        required: true
        description: "IRI reference to ConstraintDefinition"
        example: "https://axiolune.ai/ontology/meta/core/constraints/ISINCheckDigit"

      targetElement:
        type: uri
        required: true
        description: "IRI of the element being constrained (ObjectTypeDefinition, AttributeUse, RelationUse, etc.)"
        example: "https://axiolune.ai/ontology/meta/core/attributes/hasISIN"

    optionalFields:
      parameters:
        type: dict
        description: "parameter values for this constraint binding"
        example: {minLength: 12, maxLength: 12}

      enforcementLevel:
        type: enum
        values: [Mandatory, Advisory, Disabled]
        default: Mandatory
        description: "whether this constraint must be enforced"

      enforcementContext:
        type: enum
        values: [Write, Read, Query, Import, Export]
        description: "when to enforce this constraint"

  # ==================== Change Record ====================
  ChangeRecord:
    definition: "a record of a change to an ontology element for audit and version control"

    requiredFields:
      changeId:
        type: string
        unique: true
        required: true
        description: "unique identifier for this change"
        example: "CHG-20260728-001"

      timestamp:
        type: instant
        required: true
        description: "when this change was made"

      author:
        type: string
        required: true
        description: "who made this change"
        example: "ontology-team"

      changeType:
        type: enum
        required: true
        values: [Addition, Modification, Deprecation, Deletion, Restoration]
        description: "type of change"

      affectedElement:
        type: uri
        required: true
        description: "IRI of the element that was changed"

      description:
        type: LocalizedText
        required: true
        description: "human-readable description of the change"

    optionalFields:
      breakingChange:
        type: boolean
        default: false
        description: "whether this change breaks backward compatibility"

      previousValue:
        type: any
        description: "the value before the change (for Modification)"

      newValue:
        type: any
        description: "the value after the change (for Modification, Addition)"

      approvedBy:
        type: string
        description: "who approved this change"

      relatedChanges:
        type: "list[string]"
        description: "IDs of related changes"

  # ==================== Governance Metadata ====================
  GovernanceMetadata:
    definition: "ownership, approval, and change tracking metadata for ontology elements"

    fields:
      ownerRef:
        type: string
        description: "team or role responsible for this element"
        example: "fin:OntologyTeam"

      approvedBy:
        type: string
        example: "fin:DataGovernanceRole"

      approvedAt:
        type: instant

      status:
        type: enum
        values: [draft, review, approved, deprecated]

      rationale:
        type: string
        description: "business justification"

      changeHistory:
        type: "list[uri]"
        description: "references to ChangeRecord IRIs"

  # ==================== Validation Rules ====================
  ValidationRules:
    - "All IRIs must be globally unique and dereferenceable"
    - "All definitions must follow ISO 704 genus-differentia structure"
    - "localName must be unique within namespace"
    - "Alignment targetIri must reference valid external vocabulary URIs"
    - "AttributeUse minCount/maxCount override global AttributeTypeDefinition defaults"
    - "AttributeUse.label can be overridden for display, but definition CANNOT be changed"
    - "RelationTypeDefinition.inverseOf must reference a valid RelationTypeDefinition IRI"
    - "AssociationTypeDefinition.participantRoles must have at least 2 roles"
    - "OWL cardinality restrictions are axioms (reasoning); SHACL validates data completeness"
    - "Use max: null (not -1) for unbounded cardinality"
    - "Financial amounts MUST use MoneyTypeDefinition, not generic number or decimal"
    - "Percentages, basis points, and quantities are distinct types"

  # ==================== Notes ====================
  Notes:
    - "Layer 1 defines WHAT entities and relations exist (semantics)"
    - "Layer 2 (cross-domain-patterns.yaml) defines HOW facts are timestamped, sourced, evidenced"
    - "Layer 3 (behavior-meta-model.yaml) defines WHAT OPERATIONS are available"
    - "Layer 4 (data-binding-meta-model.yaml) defines HOW data maps to ontology"
    - "Removed deprecated 'required' field; use minCount: 1 instead"
    - "Removed redundant 'links' field from ObjectTypeDefinition; compiler generates reverse index from RelationTypeDefinition"
    - "AspectType removed; semantic inheritance uses superTypes, validation uses patternBindings"
    - "InterfaceType moved to Layer 3 (behavior-meta-model.yaml)"
