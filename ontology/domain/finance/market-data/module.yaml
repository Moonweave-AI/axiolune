      subjectType: https://axiolune.ai/ontology/finance/market-data/BarSpecification
      objectType: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
