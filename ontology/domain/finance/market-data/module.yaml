    MarketDataQualityFinding:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFinding
      namespace: fin-market-data
      localName: MarketDataQualityFinding
      label: Market Data Quality Finding
      definition: >-
        MarketDataQualityFinding is an immutable judgment generated over a set of observation versions on one data
        stream, used for surfacing quality issues such as crossed quotes, duplicate conflicts, and ordering collisions
        through a closed set of predicates.
      cnNote: 市场数据质量发现，是针对一条数据流上一组观测版本生成的不可变判定，用于以封闭谓词揭示交叉报价、重复冲突与排序碰撞等质量问题。
      participantRoles:
        - id: findingStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: finding stream
          definition: exact MarketDataStream version whose policy and observations determine the finding
        - id: affectedPriceObservation
          range: https://axiolune.ai/ontology/finance/market-data/PriceObservation
          minCount: 0
          maxCount: null
          label: affected price observation
          definition: exact PriceObservation version included in the finding subject set
        - id: affectedQuoteObservation
          range: https://axiolune.ai/ontology/finance/market-data/QuoteObservation
          minCount: 0
          maxCount: null
          label: affected quote observation
          definition: exact QuoteObservation version included in the finding subject set
        - id: affectedTradeObservation
          range: https://axiolune.ai/ontology/finance/market-data/TradeObservation
          minCount: 0
          maxCount: null
          label: affected trade observation
          definition: exact TradeObservation version included in the finding subject set
        - id: affectedTradeBar
          range: https://axiolune.ai/ontology/finance/market-data/TradeBar
          minCount: 0
          maxCount: null
          label: affected trade bar
          definition: exact TradeBar version included in the finding subject set
        - id: affectedQuoteBar
          range: https://axiolune.ai/ontology/finance/market-data/QuoteBar
          minCount: 0
          maxCount: null
          label: affected quote bar
          definition: exact QuoteBar version included in the finding subject set
        - id: affectedFxRateObservation
          range: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
          minCount: 0
          maxCount: null
          label: affected FX rate observation
          definition: exact FXRateObservation version included in the finding subject set
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/qualityFindingKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/affectedSubjectDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FXRateObservation:
      iri: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
      namespace: fin-market-data
      localName: FXRateObservation
      label: FX Rate Observation
      definition: >-
        FXRateObservation is a namable association that records how many units of a quote currency exchange for one unit
        of a base currency, used for modeling the exchange rate as a strictly positive dimensionless quantity that
        follows the same time and source contracts as other market observations.
      cnNote: 汇率观测，是记录一单位基准货币兑换若干计价货币单位的可具名关联，用于把汇率建模为正的无量纲量，并遵循与其他行情一致的时间与来源契约。
      participantRoles:
        - id: observationStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 1
          maxCount: 1
          label: observation stream
          definition: exact MarketDataStream version that supplies and governs this FX rate
        - id: baseCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 1
          maxCount: 1
          label: base currency
          definition: logical Currency for the one-unit left side of the FX equation
        - id: quoteCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 1
          maxCount: 1
          label: quote currency
          definition: logical Currency whose units are counted by the FX rate
        - id: observedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: observed listing
          definition: exact listed-market context version used by the listed branch
        - id: observedOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: observed OTC context
          definition: exact OTCTradingContext version used by the OTC branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-data/fxRate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/fxRateConvention
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/fxRateKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/fxValueDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/providerObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceSessionId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/sourceChannelId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/updateAction
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/marketEventAt
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    streamProvider:
      iri: https://axiolune.ai/ontology/finance/market-data/streamProvider
      namespace: fin-market-data
      localName: streamProvider
      label: Stream Provider
      definition: >-
        streamProvider is a functional relation that links a MarketDataStream version to the Party that owns it, used
        for declaring the supply party and the boundary of responsibility for a data stream.
      cnNote: 数据流提供方关系，是连接市场数据流与其归属方的功能关系，用于声明一条数据流的供应主体与责任边界。
      domain: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    barSpecificationStream:
      iri: https://axiolune.ai/ontology/finance/market-data/barSpecificationStream
      namespace: fin-market-data
      localName: barSpecificationStream
      label: Bar Specification Stream
      definition: >-
        barSpecificationStream is a functional relation that links a BarSpecification to its source data stream, used
        for declaring the exact source-contract version that the specification depends on.
      cnNote: K 线规格数据流关系，是连接 K 线规格与其来源数据流的功能关系，用于声明该规格所依赖的供应契约版本。
      domain: https://axiolune.ai/ontology/finance/market-data/BarSpecification
      range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
      characteristics:
        - functional
    barSpecificationCalendar:
      iri: https://axiolune.ai/ontology/finance/market-data/barSpecificationCalendar
      namespace: fin-market-data
      localName: barSpecificationCalendar
      label: Bar Specification Calendar
      definition: >-
        barSpecificationCalendar is a functional relation that links a BarSpecification to its source trading calendar,
        used for declaring the exact calendar version that governs its aggregation boundaries.
      cnNote: K 线规格日历关系，是连接 K 线规格与其源交易日历的功能关系，用于规定聚合边界所依据的日历版本。
      domain: https://axiolune.ai/ontology/finance/market-data/BarSpecification
      range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      characteristics:
        - functional
  attributeTypes:
    providerStreamId:
      iri: https://axiolune.ai/ontology/finance/market-data/providerStreamId
      namespace: fin-market-data
      localName: providerStreamId
      label: Provider Stream Identifier
      definition: >-
        providerStreamId is a non-empty identifier that forms part of the logical key of a data stream, used for
        uniquely distinguishing one stream within the scope of a given provider and source contract.
      cnNote: 提供方数据流标识，是数据流逻辑键的组成部分，用于在同一提供方与源契约范围内唯一区分一条数据流。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceContractRef:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceContractRef
      namespace: fin-market-data
      localName: sourceContractRef
      label: Source Contract Reference
      definition: >-
        sourceContractRef is an identifier that locks the field mapping and normalization rules of a data stream, used
        for pointing to the immutable provider source contract.
      cnNote: 来源契约引用，是锁定数据流字段映射与规范化规则的标识，用于指向不可变的提供方源契约。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceContractDigest:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceContractDigest
      namespace: fin-market-data
      localName: sourceContractDigest
      label: Source Contract Digest
      definition: >-
        sourceContractDigest is a digest of the source-contract bytes, used for verifying the consistency between the
        contract content and its reference.
      cnNote: 来源契约摘要，是源契约字节的摘要，用于校验契约内容与引用之间的一致性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    sourceApiIdentifier:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceApiIdentifier
      namespace: fin-market-data
      localName: sourceApiIdentifier
      label: Source API Identifier
      definition: >-
        sourceApiIdentifier is a stable identifier for a data delivery interface, used for locating the delivery
        channel that a data stream corresponds to.
      cnNote: 来源 API 标识，是数据交付接口的稳定标识，用于定位数据流所对应的交付通道。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceSchemaIdentifier:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceSchemaIdentifier
      namespace: fin-market-data
      localName: sourceSchemaIdentifier
      label: Source Schema Identifier
      definition: >-
        sourceSchemaIdentifier is a stable identifier for a source record schema, used for distinguishing different
        field-structure definitions.
      cnNote: 来源记录模式标识，是源记录结构的稳定标识，用于区分不同的字段结构定义。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceSchemaVersion:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceSchemaVersion
      namespace: fin-market-data
      localName: sourceSchemaVersion
      label: Source Schema Version
      definition: >-
        sourceSchemaVersion is the exact provider schema version interpreted by the locked source contract, used for
        pinning the specific version of the field structure.
      cnNote: 来源记录模式版本，是源契约所解释的提供方模式精确版本，用于锁定字段结构的具体版本。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    observationIdFieldLocator:
      iri: https://axiolune.ai/ontology/finance/market-data/observationIdFieldLocator
      namespace: fin-market-data
      localName: observationIdFieldLocator
      label: Observation Identifier Field Locator
      definition: >-
        observationIdFieldLocator is a locator structure that selects the observation-identifier field in a raw record,
        used for mapping a source field precisely to an observation identifier.
      cnNote: 观测标识字段定位器，是选择原始记录中观测标识字段的定位结构，用于精确映射来源字段到观测标识。
      valueType: https://axiolune.ai/ontology/meta/data-binding/structures/SourceLocator
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceRevisionFieldLocator:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceRevisionFieldLocator
      namespace: fin-market-data
      localName: sourceRevisionFieldLocator
      label: Source Revision Field Locator
      definition: >-
        sourceRevisionFieldLocator is a locator structure that selects the revision field in a raw record, used only by
        revisioned-record streams.
      cnNote: 来源修订字段定位器，是选择原始记录中修订字段的定位结构，仅在可修订记录流中使用。
      valueType: https://axiolune.ai/ontology/meta/data-binding/structures/SourceLocator
      defaultCardinality:
        minCount: 0
        maxCount: 1
    orderingTransformRef:
      iri: https://axiolune.ai/ontology/finance/market-data/orderingTransformRef
      namespace: fin-market-data
      localName: orderingTransformRef
      label: Ordering Transformation Reference
      definition: >-
        orderingTransformRef is an identifier that locks the normalization ordering rule of a data stream, used for
        pointing to a lossless, uniqueness-preserving ordering-tuple transformation.
      cnNote: 排序变换引用，是锁定数据流规范化排序规则的标识，用于指向无损保序的排序元组变换。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    orderingTransformDigest:
      iri: https://axiolune.ai/ontology/finance/market-data/orderingTransformDigest
      namespace: fin-market-data
      localName: orderingTransformDigest
      label: Ordering Transformation Digest
      definition: >-
        orderingTransformDigest is a digest of the ordering-transformation bytes, used for verifying the consistency
        between the ordering rule and its reference.
      cnNote: 排序变换摘要，是排序变换字节的摘要，用于校验排序规则与引用之间的一致性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    streamPurpose:
      iri: https://axiolune.ai/ontology/finance/market-data/streamPurpose
      namespace: fin-market-data
      localName: streamPurpose
      label: Stream Purpose
      definition: >-
        streamPurpose is a closed member that limits the kinds of records a data stream accepts, used for declaring the
        purpose contract at the data-stream level.
      cnNote: 数据流用途，是限定数据流所接受记录种类的封闭成员，用于在数据流层声明其用途契约。
      valueType: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceRecordRevisionMode:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceRecordRevisionMode
      namespace: fin-market-data
      localName: sourceRecordRevisionMode
      label: Source Record Revision Mode
      definition: >-
        sourceRecordRevisionMode is a closed member that declares the revision policy of a data stream, used for
        selecting between immutable-record and revisioned-record supply.
      cnNote: 来源记录修订模式，是声明数据流修订策略的封闭成员，用于选择不可变记录或可修订记录的供应方式。
      valueType: https://axiolune.ai/ontology/finance/market-data/SourceRecordRevisionMode
      defaultCardinality:
        minCount: 1
        maxCount: 1
    providerObservationId:
      iri: https://axiolune.ai/ontology/finance/market-data/providerObservationId
      namespace: fin-market-data
      localName: providerObservationId
      label: Provider Observation Identifier
      definition: >-
        providerObservationId is the raw observation identifier selected by the source contract of a data stream, used
        for uniquely identifying one observation within the scope of the stream.
      cnNote: 提供方观测标识，是数据流来源契约选定的原始观测标识，用于在数据流范围内唯一识别一条观测。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceTradeId:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceTradeId
      namespace: fin-market-data
      localName: sourceTradeId
      label: Source Trade Identifier
      definition: >-
        sourceTradeId is a provider-declared trade identifier, used as the final tiebreaker for canonical ordering and
        as a component of the logical key.
      cnNote: 来源成交标识，是提供方声明的成交标识，用于作为规范化排序的最终决胜项与逻辑键组成。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceRevisionToken:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceRevisionToken
      namespace: fin-market-data
      localName: sourceRevisionToken
      label: Source Revision Token
      definition: >-
        sourceRevisionToken is a normalized provider revision value used only under the revisioned-record policy, used
        for distinguishing different revisions of the same record.
      cnNote: 来源修订令牌，是提供方规范化的修订值，仅在可修订记录策略下使用，用于标识同一条记录的不同修订。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceRevisionOrder:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceRevisionOrder
      namespace: fin-market-data
      localName: sourceRevisionOrder
      label: Source Revision Order
      definition: >-
        sourceRevisionOrder is a non-negative provider-declared revision order used only under the revisioned-record
        policy, used for constraining the linear order of the revision chain.
      cnNote: 来源修订序号，是提供方声明的非负修订序号，仅在可修订记录策略下使用，用于约束修订链的线性顺序。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceOrderKey:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceOrderKey
      namespace: fin-market-data
      localName: sourceOrderKey
      label: Source Order Key
      definition: >-
        sourceOrderKey is a non-negative integer from the provider sequence or the output of the ordering
        transformation, used for establishing a normalized order for each observation.
      cnNote: 来源排序键，是提供方序列或排序变换输出的非负整数，用于为每条观测确定规范化排序。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    priceValue:
      iri: https://axiolune.ai/ontology/finance/market-data/priceValue
      namespace: fin-market-data
      localName: priceValue
      label: Price Value
      definition: >-
        priceValue is the monetary amount of a price observation, used for carrying the sole quote-currency truth of
        the price.
      cnNote: 价格值，是价格观测的货币金额，用于承载报价的唯一计价货币真值。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    priceKind:
      iri: https://axiolune.ai/ontology/finance/market-data/priceKind
      namespace: fin-market-data
      localName: priceKind
      label: Price Kind
      definition: >-
        priceKind is a closed member that annotates the semantic type of a price observation, used for classifying the
        price, with bid and ask excluded because they belong to the quote structure.
      cnNote: 价格种类，是标注价格观测语义类型的封闭成员，买盘与卖盘因属报价结构字段而被排除。
      valueType: https://axiolune.ai/ontology/finance/market-data/PriceKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    calculationDefinitionRef:
      iri: https://axiolune.ai/ontology/finance/market-data/calculationDefinitionRef
      namespace: fin-market-data
      localName: calculationDefinitionRef
      label: Calculation Definition Reference
      definition: >-
        calculationDefinitionRef is an identifier for the immutable calculation definition used to derive a
        volume- or time-weighted price, used only for derived prices.
      cnNote: 计算定义引用，是用于推导成交量或时间加权价格的不可变计算定义的标识，仅用于衍生价格。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    calculationDefinitionDigest:
      iri: https://axiolune.ai/ontology/finance/market-data/calculationDefinitionDigest
      namespace: fin-market-data
      localName: calculationDefinitionDigest
      label: Calculation Definition Digest
      definition: >-
        calculationDefinitionDigest is a digest of the calculation-definition bytes, used for verifying the
        consistency between the definition content and its reference.
      cnNote: 计算定义摘要，是计算定义字节的摘要，用于校验定义内容与引用之间的一致性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    calculationRunRef:
      iri: https://axiolune.ai/ontology/finance/market-data/calculationRunRef
      namespace: fin-market-data
      localName: calculationRunRef
      label: Calculation Run Reference
      definition: >-
        calculationRunRef is an identifier for the evidence of one calculation run, used for locking the replayable
        evidence of inputs, window, definition, output, and recalculation policy.
      cnNote: 计算运行引用，是识别一次计算运行证据的标识，用于锁定输入、窗口、定义、输出与重算策略的可重放证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    calculationRunDigest:
      iri: https://axiolune.ai/ontology/finance/market-data/calculationRunDigest
      namespace: fin-market-data
      localName: calculationRunDigest
      label: Calculation Run Digest
      definition: >-
        calculationRunDigest is a digest of the calculation-run evidence bytes, used for verifying the consistency
        between the run evidence and its reference.
      cnNote: 计算运行摘要，是计算运行证据字节的摘要，用于校验运行证据与引用之间的一致性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    calculationInputSetDigest:
      iri: https://axiolune.ai/ontology/finance/market-data/calculationInputSetDigest
      namespace: fin-market-data
      localName: calculationInputSetDigest
      label: Calculation Input Fact Set Digest
      definition: >-
        calculationInputSetDigest is a digest of the canonically selected input fact-version snapshots, used for
        invalidating the digest when the selected identity or payload drifts.
      cnNote: 计算输入事实集摘要，是规范选定输入事实版本快照的摘要，用于在输入身份或负载漂移时使摘要失效。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    bidPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/bidPrice
      namespace: fin-market-data
      localName: bidPrice
      label: Bid Price
      definition: >-
        bidPrice is the monetary amount of the bid side of a complete quote observation, used for recording the
        buy-side quote at the observation time and belonging to the quote structure rather than a price kind.
      cnNote: 买价，是完整报价观测买方的货币金额，用于记录观测时点的买入报价，属盘口结构字段而非价格种类。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    askPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/askPrice
      namespace: fin-market-data
      localName: askPrice
      label: Ask Price
      definition: >-
        askPrice is the monetary amount of the ask side of a complete quote observation, used for recording the
        sell-side quote at the observation time and belonging to the quote structure rather than a price kind.
      cnNote: 卖价，是完整报价观测卖方的货币金额，用于记录观测时点的卖出报价，属盘口结构字段而非价格种类。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    bidSize:
      iri: https://axiolune.ai/ontology/finance/market-data/bidSize
      namespace: fin-market-data
      localName: bidSize
      label: Bid Size
      definition: >-
        bidSize is the tradeable quantity corresponding to the observed bid price, used for recording the size of
        buy-side interest at the observation time.
      cnNote: 买量，是观测买价对应的可成交数量，用于记录买方在观测时点的挂单规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    askSize:
      iri: https://axiolune.ai/ontology/finance/market-data/askSize
      namespace: fin-market-data
      localName: askSize
      label: Ask Size
      definition: >-
        askSize is the tradeable quantity corresponding to the observed ask price, used for recording the size of
        sell-side interest at the observation time.
      cnNote: 卖量，是观测卖价对应的可成交数量，用于记录卖方在观测时点的挂单规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradePrice:
      iri: https://axiolune.ai/ontology/finance/market-data/tradePrice
      namespace: fin-market-data
      localName: tradePrice
      label: Trade Price
      definition: >-
        tradePrice is the monetary execution price reported by one trade observation, used for recording the actual
        traded price.
      cnNote: 成交价，是一笔成交观测报告的执行货币价格，用于记录实际成交价格。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradeSize:
      iri: https://axiolune.ai/ontology/finance/market-data/tradeSize
      namespace: fin-market-data
      localName: tradeSize
      label: Trade Size
      definition: >-
        tradeSize is the strictly positive traded quantity reported by one trade observation, used for recording the
        actual traded size.
      cnNote: 成交量，是一笔成交观测报告的严格为正的成交数量，用于记录实际成交规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradeOpenPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/tradeOpenPrice
      namespace: fin-market-data
      localName: tradeOpenPrice
      label: Trade Open Price
      definition: >-
        tradeOpenPrice is the monetary price of the first trade within a trade-bar aggregation window, used for
        recording the open price of the window.
      cnNote: 成交开盘价，是成交棒聚合窗口内首笔交易的货币价格，用于记录窗口开盘价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradeHighPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/tradeHighPrice
      namespace: fin-market-data
      localName: tradeHighPrice
      label: Trade High Price
      definition: >-
        tradeHighPrice is the highest trade monetary price within a trade-bar aggregation window, used for recording
        the high price of the window.
      cnNote: 成交最高价，是成交棒聚合窗口内最高的交易货币价格，用于记录窗口最高价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradeLowPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/tradeLowPrice
      namespace: fin-market-data
      localName: tradeLowPrice
      label: Trade Low Price
      definition: >-
        tradeLowPrice is the lowest trade monetary price within a trade-bar aggregation window, used for recording the
        low price of the window.
      cnNote: 成交最低价，是成交棒聚合窗口内最低的交易货币价格，用于记录窗口最低价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradeClosePrice:
      iri: https://axiolune.ai/ontology/finance/market-data/tradeClosePrice
      namespace: fin-market-data
      localName: tradeClosePrice
      label: Trade Close Price
      definition: >-
        tradeClosePrice is the monetary price of the last trade within a trade-bar aggregation window, used for
        recording the close price of the window.
      cnNote: 成交收盘价，是成交棒聚合窗口内末笔交易的货币价格，用于记录窗口收盘价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    tradeVolume:
      iri: https://axiolune.ai/ontology/finance/market-data/tradeVolume
      namespace: fin-market-data
      localName: tradeVolume
      label: Trade Volume
      definition: >-
        tradeVolume is the aggregate traded quantity of all trades within a trade-bar aggregation window, used for
        recording the cumulative size of the window.
      cnNote: 成交总量，是成交棒聚合窗口内所有成交的聚合成交量，用于记录窗口累计规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    bidOpenPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/bidOpenPrice
      namespace: fin-market-data
      localName: bidOpenPrice
      label: Bid Open Price
      definition: >-
        bidOpenPrice is the bid-side monetary price first observed within a quote-bar aggregation window, used for
        recording the bid-side open price.
      cnNote: 买方开盘价，是报价棒聚合窗口内首观测的买方货币价格，用于记录买侧开盘价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    bidHighPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/bidHighPrice
      namespace: fin-market-data
      localName: bidHighPrice
      label: Bid High Price
      definition: >-
        bidHighPrice is the highest bid-side monetary price within a quote-bar aggregation window, used for recording
        the bid-side high price.
      cnNote: 买方最高价，是报价棒聚合窗口内最高的买方货币价格，用于记录买侧最高价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    bidLowPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/bidLowPrice
      namespace: fin-market-data
      localName: bidLowPrice
      label: Bid Low Price
      definition: >-
        bidLowPrice is the lowest bid-side monetary price within a quote-bar aggregation window, used for recording the
        bid-side low price.
      cnNote: 买方最低价，是报价棒聚合窗口内最低的买方货币价格，用于记录买侧最低价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    bidClosePrice:
      iri: https://axiolune.ai/ontology/finance/market-data/bidClosePrice
      namespace: fin-market-data
      localName: bidClosePrice
      label: Bid Close Price
      definition: >-
        bidClosePrice is the bid-side monetary price last observed within a quote-bar aggregation window, used for
        recording the bid-side close price.
      cnNote: 买方收盘价，是报价棒聚合窗口内末观测的买方货币价格，用于记录买侧收盘价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    askOpenPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/askOpenPrice
      namespace: fin-market-data
      localName: askOpenPrice
      label: Ask Open Price
      definition: >-
        askOpenPrice is the ask-side monetary price first observed within a quote-bar aggregation window, used for
        recording the ask-side open price.
      cnNote: 卖方开盘价，是报价棒聚合窗口内首观测的卖方货币价格，用于记录卖侧开盘价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    askHighPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/askHighPrice
      namespace: fin-market-data
      localName: askHighPrice
      label: Ask High Price
      definition: >-
        askHighPrice is the highest ask-side monetary price within a quote-bar aggregation window, used for recording
        the ask-side high price.
      cnNote: 卖方最高价，是报价棒聚合窗口内最高的卖方货币价格，用于记录卖侧最高价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    askLowPrice:
      iri: https://axiolune.ai/ontology/finance/market-data/askLowPrice
      namespace: fin-market-data
      localName: askLowPrice
      label: Ask Low Price
      definition: >-
        askLowPrice is the lowest ask-side monetary price within a quote-bar aggregation window, used for recording the
        ask-side low price.
      cnNote: 卖方最低价，是报价棒聚合窗口内最低的卖方货币价格，用于记录卖侧最低价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    askClosePrice:
      iri: https://axiolune.ai/ontology/finance/market-data/askClosePrice
      namespace: fin-market-data
      localName: askClosePrice
      label: Ask Close Price
      definition: >-
        askClosePrice is the ask-side monetary price last observed within a quote-bar aggregation window, used for
        recording the ask-side close price.
      cnNote: 卖方收盘价，是报价棒聚合窗口内末观测的卖方货币价格，用于记录卖侧收盘价。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    lastBidSize:
      iri: https://axiolune.ai/ontology/finance/market-data/lastBidSize
      namespace: fin-market-data
      localName: lastBidSize
      label: Last Bid Size
      definition: >-
        lastBidSize is the representative bid-side quantity preserved by a quote bar, used for recording the bid-side
        size at the end of the window.
      cnNote: 末次买量，是报价棒保留的代表性买方数量，用于记录窗口末尾买侧规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    lastAskSize:
      iri: https://axiolune.ai/ontology/finance/market-data/lastAskSize
      namespace: fin-market-data
      localName: lastAskSize
      label: Last Ask Size
      definition: >-
        lastAskSize is the representative ask-side quantity preserved by a quote bar, used for recording the ask-side
        size at the end of the window.
      cnNote: 末次卖量，是报价棒保留的代表性卖方数量，用于记录窗口末尾卖侧规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    barSpecificationId:
      iri: https://axiolune.ai/ontology/finance/market-data/barSpecificationId
      namespace: fin-market-data
      localName: barSpecificationId
      label: Bar Specification Identifier
      definition: >-
        barSpecificationId is a non-empty logical identifier scoped to a source data stream, used for uniquely
        identifying one bar specification within a data stream.
      cnNote: K 线规格标识，是来源数据流范围内非空的逻辑标识，用于在某数据流下唯一识别一条 K 线规格。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    barAggregation:
      iri: https://axiolune.ai/ontology/finance/market-data/barAggregation
      namespace: fin-market-data
      localName: barAggregation
      label: Bar Aggregation
      definition: >-
        barAggregation is a closed member that selects the aggregation kind of a bar, used for distinguishing time,
        tick, volume, notional, range, or renko aggregation.
      cnNote: K 线聚合方式，是选择 K 线聚合种类的封闭成员，用于区分时间、笔数、成交量、名义、区间或砖型等聚合方式。
      valueType: https://axiolune.ai/ontology/finance/market-data/BarAggregation
      defaultCardinality:
        minCount: 1
        maxCount: 1
    barPriceBasis:
      iri: https://axiolune.ai/ontology/finance/market-data/barPriceBasis
      namespace: fin-market-data
      localName: barPriceBasis
      label: Bar Price Basis
      definition: >-
        barPriceBasis is a closed discriminator that distinguishes the price semantics of a bar, used for separating
        trade OHLCV bars from paired bid-and-ask OHLC bars.
      cnNote: K 线价格基准，是区分棒价格语义的封闭判别成员，用于区分成交 OHLCV 与成对买卖盘 OHLC 两种棒的语义。
      valueType: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis
      defaultCardinality:
        minCount: 1
        maxCount: 1
    barSourceTimeZone:
      iri: https://axiolune.ai/ontology/finance/market-data/barSourceTimeZone
      namespace: fin-market-data
      localName: barSourceTimeZone
      label: Bar Source Time Zone
      definition: >-
        barSourceTimeZone is a canonical IANA time-zone identifier used for deriving aggregation boundaries, used for
        fixing the time-zone semantics of the source calendar.
      cnNote: K 线来源时区，是用于推导聚合边界的规范时区标识，用于规定来源日历的时区语义。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^[A-Za-z_+-]+(?:/[A-Za-z0-9_+.-]+)+$|^UTC$
    barTimestampConvention:
      iri: https://axiolune.ai/ontology/finance/market-data/barTimestampConvention
      namespace: fin-market-data
      localName: barTimestampConvention
      label: Bar Timestamp Convention
      definition: >-
        barTimestampConvention is a closed member stating whether the observedAt of a time bar denotes the interval
        start or the interval end, used for unifying the timestamp semantics of time bars.
      cnNote: K 线时间戳约定，是声明时间棒观测时间戳指向区间起点还是终点的封闭成员，用于统一时间棒的戳记语义。
      valueType: https://axiolune.ai/ontology/finance/market-data/BarTimestampConvention
      defaultCardinality:
        minCount: 1
        maxCount: 1
    barInterval:
      iri: https://axiolune.ai/ontology/finance/market-data/barInterval
      namespace: fin-market-data
      localName: barInterval
      label: Bar Interval
      definition: >-
        barInterval is a strictly positive duration required for time-bar aggregation, used for specifying the
        aggregation period of a time bar.
      cnNote: K 线区间长度，是时间棒聚合所需的严格为正的时长，用于规定时间棒的聚合周期。
      valueType: duration
      defaultCardinality:
        minCount: 0
        maxCount: 1
    barThreshold:
      iri: https://axiolune.ai/ontology/finance/market-data/barThreshold
      namespace: fin-market-data
      localName: barThreshold
      label: Bar Threshold
      definition: >-
        barThreshold is a strictly positive quantity required for non-time-bar aggregation, used for specifying the
        trigger threshold of a non-time bar.
      cnNote: K 线阈值，是非时间棒聚合所需的严格为正的数量，用于规定非时间棒的触发阈值。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    intervalStart:
      iri: https://axiolune.ai/ontology/finance/market-data/intervalStart
      namespace: fin-market-data
      localName: intervalStart
      label: Interval Start
      definition: >-
        intervalStart is the UTC instant at which a time-bar aggregation window starts, used for marking the left
        boundary of the bar as a half-open interval.
      cnNote: 区间起点，是时间棒聚合窗口起始的 UTC 时间点，用于以半开区间界定棒的左边界。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    intervalEnd:
      iri: https://axiolune.ai/ontology/finance/market-data/intervalEnd
      namespace: fin-market-data
      localName: intervalEnd
      label: Interval End
      definition: >-
        intervalEnd is the UTC instant at which a time-bar aggregation window ends, used for marking the right
        boundary of the bar as a half-open interval.
      cnNote: 区间终点，是时间棒聚合窗口结束的 UTC 时间点，用于以半开区间界定棒的右边界。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    barSequence:
      iri: https://axiolune.ai/ontology/finance/market-data/barSequence
      namespace: fin-market-data
      localName: barSequence
      label: Bar Sequence
      definition: >-
        barSequence is a non-negative sequence number of a non-time bar within a data stream, used for providing an
        order position for a non-time bar.
      cnNote: 棒序号，是非时间棒在数据流中的非负序号，用于为非时间棒提供顺序定位。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    firstContributingEventAt:
      iri: https://axiolune.ai/ontology/finance/market-data/firstContributingEventAt
      namespace: fin-market-data
      localName: firstContributingEventAt
      label: First Contributing Event At
      definition: >-
        firstContributingEventAt is the UTC instant at which the first source event occurs within a non-time bar,
        used for recording the earliest event boundary of the bar.
      cnNote: 首贡献事件时间，是非时间棒内首个来源事件发生的 UTC 时刻，用于记录棒的最早事件边界。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    lastContributingEventAt:
      iri: https://axiolune.ai/ontology/finance/market-data/lastContributingEventAt
      namespace: fin-market-data
      localName: lastContributingEventAt
      label: Last Contributing Event At
      definition: >-
        lastContributingEventAt is the UTC instant at which the last source event occurs within a non-time bar, used
        for recording the latest event boundary of the bar.
      cnNote: 末贡献事件时间，是非时间棒内末个来源事件发生的 UTC 时刻，用于记录棒的最晚事件边界。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    qualityFindingKind:
      iri: https://axiolune.ai/ontology/finance/market-data/qualityFindingKind
      namespace: fin-market-data
      localName: qualityFindingKind
      label: Quality Finding Kind
      definition: >-
        qualityFindingKind is a closed member that annotates the predicate type of a quality finding, used for
        declaring the exact judgment type that one quality finding executes.
      cnNote: 质量发现种类，是标注质量发现谓词类型的封闭成员，用于声明一条质量发现所执行的精确判定类型。
      valueType: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFindingKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    affectedSubjectDigest:
      iri: https://axiolune.ai/ontology/finance/market-data/affectedSubjectDigest
      namespace: fin-market-data
      localName: affectedSubjectDigest
      label: Affected Subject Digest
      definition: >-
        affectedSubjectDigest is a digest over the unique exact-version IRI set of the affected observation versions,
        used for locking the subject set of a quality finding.
      cnNote: 受影响主体摘要，是对受影响观测版本唯一精确版本 IRI 集合的摘要，用于锁定质量发现的主体集合。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    fxRate:
      iri: https://axiolune.ai/ontology/finance/market-data/fxRate
      namespace: fin-market-data
      localName: fxRate
      label: FX Rate
      definition: >-
        fxRate is a strictly positive dimensionless quantity expressing the ratio of quote-currency units to one
        base-currency unit, used for recording the ratio value of an FX rate observation.
      cnNote: 汇率，是表示一单位基准货币对应若干计价货币单位兑换比率的严格为正的无量纲量，用于记录汇率观测的比率值。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceSessionId:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceSessionId
      namespace: fin-market-data
      localName: sourceSessionId
      label: Source Session Identifier
      definition: SourceSessionId is an optional identifier for the trading session or trading day partition under which a source record was produced, used for enriching observation identity with session context
      cnNote: 来源会话标识，是来源记录所属交易会话或交易日分区的可选标识，用于以会话上下文丰富观测身份。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    sourceChannelId:
      iri: https://axiolune.ai/ontology/finance/market-data/sourceChannelId
      namespace: fin-market-data
      localName: sourceChannelId
      label: Source Channel Identifier
      definition: SourceChannelId is an optional identifier for the data channel or feed partition under which a source record was produced, used for enriching observation identity with channel context
      cnNote: 来源通道标识，是来源记录所属数据通道或馈源分区的可选标识，用于以通道上下文丰富观测身份。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    updateAction:
      iri: https://axiolune.ai/ontology/finance/market-data/updateAction
      namespace: fin-market-data
      localName: updateAction
      label: Update Action
      definition: UpdateAction is an optional closed member that classifies the lifecycle action of a source market-data record, used for distinguishing new, change, delete, and correct actions
      cnNote: 更新动作，是分类来源行情记录生命周期动作的可选封闭成员，用于区分新增、变更、删除与更正动作。
      valueType: https://axiolune.ai/ontology/finance/market-data/UpdateAction
      defaultCardinality:
        minCount: 0
        maxCount: 1
    marketEventAt:
      iri: https://axiolune.ai/ontology/finance/market-data/marketEventAt
      namespace: fin-market-data
      localName: marketEventAt
      label: Market Event At
      definition: MarketEventAt is an optional UTC instant recording the source-declared market event timestamp (e.g., execution time, quote time), distinct from the TemporalFact validFrom which is platform-assigned per business validity
      cnNote: 市场事件时间，是记录来源声明的市场事件时间戳（如执行时间、报价时间）的可选 UTC 时刻，区别于平台按业务有效期赋予的 TemporalFact validFrom。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fxRateConvention:
      iri: https://axiolune.ai/ontology/finance/market-data/fxRateConvention
      namespace: fin-market-data
      localName: fxRateConvention
      label: FX Rate Convention
      definition: FXRateConvention is an optional closed member that classifies the settlement convention of an FX rate observation, used for distinguishing spot, forward, NDF, and swap
      cnNote: 汇率约定，是分类汇率观测结算约定的可选封闭成员，用于区分即期、远期、无本金交割远期与掉期。
      valueType: https://axiolune.ai/ontology/finance/market-data/FXRateConvention
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fxRateKind:
      iri: https://axiolune.ai/ontology/finance/market-data/fxRateKind
      namespace: fin-market-data
      localName: fxRateKind
      label: FX Rate Kind
      definition: FXRateKind is an optional closed member that classifies the nature of an FX rate observation, used for distinguishing tradeable, reference, fixing, and benchmark rates
      cnNote: 汇率种类，是分类汇率观测性质的可选封闭成员，用于区分可交易、参考、定盘与基准汇率。
      valueType: https://axiolune.ai/ontology/finance/market-data/FXRateKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fxValueDate:
      iri: https://axiolune.ai/ontology/finance/market-data/fxValueDate
      namespace: fin-market-data
      localName: fxValueDate
      label: FX Value Date
      definition: FXValueDate is an optional date for the settlement or value date of an FX rate, used for distinguishing spot, forward, and NDF value dates
      cnNote: 汇率交割日，是汇率结算或交割日期的可选日期，用于区分即期、远期与无本金交割远期的交割日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    barThresholdKind:
      iri: https://axiolune.ai/ontology/finance/market-data/barThresholdKind
      namespace: fin-market-data
      localName: barThresholdKind
      label: Bar Threshold Kind
      definition: BarThresholdKind is an optional closed member that classifies the threshold type of a non-time bar, used for strongly typing the bar threshold by its dimension
      cnNote: K 线阈值种类，是分类非时间棒阈值类型的可选封闭成员，用于按量纲强类型化棒的触发阈值。
      valueType: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    barThresholdNotional:
      iri: https://axiolune.ai/ontology/finance/market-data/barThresholdNotional
      namespace: fin-market-data
      localName: barThresholdNotional
      label: Bar Threshold Notional
      definition: BarThresholdNotional is an optional MonetaryAmount threshold for notional-aggregation bars, used when barThresholdKind is notional
      cnNote: K 线名义阈值，是名义聚合棒的可选货币金额阈值，在 barThresholdKind 为 notional 时使用。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    barThresholdPriceRange:
      iri: https://axiolune.ai/ontology/finance/market-data/barThresholdPriceRange
      namespace: fin-market-data
      localName: barThresholdPriceRange
      label: Bar Threshold Price Range
      definition: BarThresholdPriceRange is an optional MonetaryAmount threshold for price-range-aggregation bars, used when barThresholdKind is priceRange or renkoBrick
      cnNote: K 线价格区间阈值，是价格区间聚合棒的可选货币金额阈值，在 barThresholdKind 为 priceRange 或 renkoBrick 时使用。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    barThresholdEventCount:
      iri: https://axiolune.ai/ontology/finance/market-data/barThresholdEventCount
      namespace: fin-market-data
      localName: barThresholdEventCount
      label: Bar Threshold Event Count
      definition: BarThresholdEventCount is an optional positive integer threshold for event-count-aggregation bars, used when barThresholdKind is eventCount
      cnNote: K 线事件计数阈值，是事件计数聚合棒的可选正整数阈值，在 barThresholdKind 为 eventCount 时使用。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1

  identifierTypes: {}
  codeLists:
    MarketDataStreamPurpose:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose
      namespace: fin-market-data
      localName: MarketDataStreamPurpose
      label: Market Data Stream Purpose
      definition: >-
        MarketDataStreamPurpose is a closed controlled vocabulary that limits the kinds of records a data stream
        accepts, used for declaring the purpose contract at the data-stream level.
      cnNote: 市场数据流用途词表，是限定数据流所接受记录种类的封闭受控词汇，用于在数据流层声明其用途契约。
      vocabulary: Market Data Stream Purpose
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose/value/priceObservation
          notation: priceObservation
          label: Price Observation
          definition: stream admits PriceObservation records only
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose/value/quoteObservation
          notation: quoteObservation
          label: Quote Observation
          definition: stream admits complete paired QuoteObservation records only
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose/value/tradeObservation
          notation: tradeObservation
          label: Trade Observation
          definition: stream admits TradeObservation records only
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose/value/tradeBar
          notation: tradeBar
          label: Trade Bar
          definition: stream admits TradeBar records only
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose/value/quoteBar
          notation: quoteBar
          label: Quote Bar
          definition: stream admits QuoteBar records only
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamPurpose/value/fxRateObservation
          notation: fxRateObservation
          label: FX Rate Observation
          definition: stream admits FXRateObservation records only
    SourceRecordRevisionMode:
      iri: https://axiolune.ai/ontology/finance/market-data/SourceRecordRevisionMode
      namespace: fin-market-data
      localName: SourceRecordRevisionMode
      label: Source Record Revision Mode
      definition: >-
        SourceRecordRevisionMode is a closed policy vocabulary that determines whether a provider record can form a
        revision chain, used for declaring the revision semantics of a data stream.
      cnNote: 来源记录修订模式词表，是判定提供方记录能否形成修订链的封闭策略词汇，用于声明数据流的修订语义。
      vocabulary: Source Record Revision Mode
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/SourceRecordRevisionMode/value/immutableRecord
          notation: immutableRecord
          label: Immutable Record
          definition: provider record has no revision token, revision order, or supersession edge
        - iri: https://axiolune.ai/ontology/finance/market-data/SourceRecordRevisionMode/value/revisionedRecord
          notation: revisionedRecord
          label: Revisioned Record
          definition: provider records carry mapped revision tokens and orders in one linear chain
    PriceKind:
      iri: https://axiolune.ai/ontology/finance/market-data/PriceKind
      namespace: fin-market-data
      localName: PriceKind
      label: Price Kind
      definition: >-
        PriceKind is a closed vocabulary of price semantics grouped into tick, reference, and derived categories, used
        for annotating the type of a price observation, with bid and ask deliberately excluded because they belong to
        the quote structure.
      cnNote: 价格种类词表，是按即时、参考与衍生三类划分的封闭价格语义词汇，用于标注价格观测类型，买盘卖盘因属结构字段而刻意排除。
      vocabulary: Price Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/tick/last
          notation: last
          label: Last
          definition: last executed trade price reported by a source
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/derived/mid
          notation: mid
          label: Mid
          definition: source-reported midpoint price; no local bid/ask derivation is inferred from this member alone
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/reference/open
          notation: open
          label: Open
          definition: reviewed source-defined opening reference price
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/reference/high
          notation: high
          label: High
          definition: reviewed source-defined high reference price
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/reference/low
          notation: low
          label: Low
          definition: reviewed source-defined low reference price
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/reference/close
          notation: close
          label: Close
          definition: reviewed source-defined close reference price
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/reference/settlement
          notation: settlement
          label: Settlement
          definition: reviewed source-defined settlement reference price
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/derived/vwap
          notation: vwap
          label: VWAP
          definition: value generated by an exact locked volume-weighted calculation definition
        - iri: https://axiolune.ai/ontology/finance/market-data/PriceKind/value/derived/twap
          notation: twap
          label: TWAP
          definition: value generated by an exact locked time-weighted calculation definition
    BarAggregation:
      iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation
      namespace: fin-market-data
      localName: BarAggregation
      label: Bar Aggregation
      definition: >-
        BarAggregation is a closed aggregation-branch vocabulary selected by a bar specification, used for
        distinguishing time, tick, volume, notional, range, or renko aggregation.
      cnNote: K 线聚合方式词表，是供 K 线规格选择的封闭聚合分支词汇，用于区分时间、笔数、成交量、名义、区间与砖型等聚合方式。
      vocabulary: Bar Aggregation
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/time
          notation: time
          label: Time
          definition: half-open source-calendar interval aggregation
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/tick
          notation: tick
          label: Tick
          definition: fixed positive contributing-event count aggregation
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/volume
          notation: volume
          label: Volume
          definition: fixed positive quantity-volume threshold aggregation
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/notional
          notation: notional
          label: Notional
          definition: fixed positive quote-currency notional threshold aggregation
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/range
          notation: range
          label: Range
          definition: fixed positive price-range threshold aggregation
        - iri: https://axiolune.ai/ontology/finance/market-data/BarAggregation/value/renko
          notation: renko
          label: Renko
          definition: fixed positive brick threshold aggregation
    BarPriceBasis:
      iri: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis
      namespace: fin-market-data
      localName: BarPriceBasis
      label: Bar Price Basis
      definition: >-
        BarPriceBasis is a closed discriminator vocabulary that distinguishes trade OHLCV from paired bid-and-ask OHLC
        semantics, used for declaring the price semantics of a bar.
      cnNote: K 线价格基准词表，是区分成交 OHLCV 与成对买卖盘 OHLC 的封闭判别词汇，用于声明一根棒的价格语义。
      vocabulary: Bar Price Basis
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis/value/trade
          notation: trade
          label: Trade
          definition: bar aggregates executed trade prices and volume
        - iri: https://axiolune.ai/ontology/finance/market-data/BarPriceBasis/value/bidAsk
          notation: bidAsk
          label: Bid and Ask
          definition: bar preserves separate bid and ask OHLC series and side sizes
    BarTimestampConvention:
      iri: https://axiolune.ai/ontology/finance/market-data/BarTimestampConvention
      namespace: fin-market-data
      localName: BarTimestampConvention
      label: Bar Timestamp Convention
      definition: >-
        BarTimestampConvention is a closed rule vocabulary stating whether the observedAt of a time bar denotes the
        interval start or the interval end, used for unifying the timestamp semantics of time bars.
      cnNote: K 线时间戳约定词表，是声明时间棒观测时间戳指向区间起点还是终点的封闭规则词汇，用于统一时间棒的戳记语义。
      vocabulary: Bar Timestamp Convention
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/BarTimestampConvention/value/intervalStart
          notation: intervalStart
          label: Interval Start
          definition: observedAt equals the inclusive interval start
        - iri: https://axiolune.ai/ontology/finance/market-data/BarTimestampConvention/value/intervalEnd
          notation: intervalEnd
          label: Interval End
          definition: observedAt equals the exclusive interval end
    MarketDataQualityFindingKind:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFindingKind
      namespace: fin-market-data
      localName: MarketDataQualityFindingKind
      label: Market Data Quality Finding Kind
      definition: >-
        MarketDataQualityFindingKind is a closed vocabulary of executable generated outcomes, used for precisely
        describing the three quality-judgment types of crossed quote, duplicate conflict, and ordering collision.
      cnNote: 市场数据质量发现种类词表，是封闭的可执行生成结果词汇，用于精确描述交叉报价、重复冲突与排序碰撞三类质量判定。
      vocabulary: Market Data Quality Finding Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFindingKind/value/crossedQuote
          notation: crossedQuote
          label: Crossed Quote
          definition: exactly one QuoteObservation has bid price greater than ask price
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFindingKind/value/duplicateConflict
          notation: duplicateConflict
          label: Duplicate Conflict
          definition: at least two versions share one source-record collision key but have different canonical content
        - iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFindingKind/value/orderingCollision
          notation: orderingCollision
          label: Ordering Collision
          definition: at least two observations share the full canonical ordering tuple but have different canonical content
    UpdateAction:
      iri: https://axiolune.ai/ontology/finance/market-data/UpdateAction
      namespace: fin-market-data
      localName: UpdateAction
      label: Update Action
      definition: UpdateAction is a closed vocabulary that classifies the lifecycle action of a source market-data record, used for distinguishing new, change, delete, and correct actions
      cnNote: 更新动作词表，是分类来源行情记录生命周期动作的封闭词汇，用于区分新增、变更、删除与更正动作。
      vocabulary: Update Action
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/UpdateAction/value/new
          notation: new
          label: New
          definition: source record is a new observation or bar
        - iri: https://axiolune.ai/ontology/finance/market-data/UpdateAction/value/change
          notation: change
          label: Change
          definition: source record is a revision or correction of an existing observation
        - iri: https://axiolune.ai/ontology/finance/market-data/UpdateAction/value/delete
          notation: delete
          label: Delete
          definition: source record is a deletion or retraction of an existing observation
        - iri: https://axiolune.ai/ontology/finance/market-data/UpdateAction/value/correct
          notation: correct
          label: Correct
          definition: source record is a trade break or correction referencing a prior observation
    FXRateConvention:
      iri: https://axiolune.ai/ontology/finance/market-data/FXRateConvention
      namespace: fin-market-data
      localName: FXRateConvention
      label: FX Rate Convention
      definition: FXRateConvention is a closed vocabulary that classifies the settlement convention of an FX rate, used for distinguishing spot, forward, NDF, and other FX rate types
      cnNote: 汇率约定词表，是分类汇率结算约定的封闭词汇，用于区分即期、远期、无本金交割远期等汇率类型。
      vocabulary: FX Rate Convention
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateConvention/value/spot
          notation: spot
          label: Spot
          definition: spot FX rate with near-term settlement (typically T+2)
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateConvention/value/forward
          notation: forward
          label: Forward
          definition: forward FX rate with a specified value date beyond spot
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateConvention/value/ndf
          notation: ndf
          label: NDF
          definition: non-deliverable forward FX rate settled in a single currency
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateConvention/value/swap
          notation: swap
          label: FX Swap
          definition: FX swap combining spot and forward legs
    FXRateKind:
      iri: https://axiolune.ai/ontology/finance/market-data/FXRateKind
      namespace: fin-market-data
      localName: FXRateKind
      label: FX Rate Kind
      definition: FXRateKind is a closed vocabulary that classifies the nature of an FX rate observation, used for distinguishing tradeable, reference, fixing, and benchmark rates
      cnNote: 汇率种类词表，是分类汇率观测性质的封闭词汇，用于区分可交易、参考、定盘与基准汇率。
      vocabulary: FX Rate Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateKind/value/tradeable
          notation: tradeable
          label: Tradeable
          definition: rate at which a trade can be executed
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateKind/value/reference
          notation: reference
          label: Reference
          definition: published reference rate such as ECB reference rate, not directly tradeable
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateKind/value/fixing
          notation: fixing
          label: Fixing
          definition: fixing rate used for valuation or settlement at a specified time
        - iri: https://axiolune.ai/ontology/finance/market-data/FXRateKind/value/benchmark
          notation: benchmark
          label: Benchmark
          definition: benchmark rate such as WMR or ECB fixing used for portfolio valuation
    BarThresholdKind:
      iri: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind
      namespace: fin-market-data
      localName: BarThresholdKind
      label: Bar Threshold Kind
      definition: BarThresholdKind is a closed vocabulary that classifies the threshold type of a non-time bar, used for strongly typing the bar threshold by its dimension
      cnNote: K 线阈值种类词表，是分类非时间棒阈值类型的封闭词汇，用于按量纲强类型化棒的触发阈值。
      vocabulary: Bar Threshold Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind/value/eventCount
          notation: eventCount
          label: Event Count
          definition: threshold is a positive integer count of contributing events
        - iri: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind/value/volume
          notation: volume
          label: Volume
          definition: threshold is a positive QuantityValue of traded volume
        - iri: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind/value/notional
          notation: notional
          label: Notional
          definition: threshold is a positive MonetaryAmount of notional value
        - iri: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind/value/priceRange
          notation: priceRange
          label: Price Range
          definition: threshold is a positive MonetaryAmount of price difference
        - iri: https://axiolune.ai/ontology/finance/market-data/BarThresholdKind/value/renkoBrick
          notation: renkoBrick
          label: Renko Brick
          definition: threshold is a positive MonetaryAmount of brick size
  constraints:
    MarketDataStreamIdentityContract:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataStreamIdentityContract
      namespace: fin-market-data
      localName: MarketDataStreamIdentityContract
      label: Market Data Stream Identity Contract
      definition: >-
        Fixes stream logical and immutable version identity and closes the source contract, purpose, revision policy,
        identifier locator, and ordering contract.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          identityBaseIri=https://axiolune.ai/data/market-data-stream;
          logicalKey(versionOf(streamProvider),sourceContractRef,providerStreamId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); sourceContractRef uniqueWithin
          versionOf(streamProvider); digest(sourceContractBytes)=sourceContractDigest; exactlyOne(streamPurpose);
          exactlyOne(sourceRecordRevisionMode); exactlyOne(observationIdFieldLocator);
          exactlyOne(orderingTransformRef,orderingTransformDigest); immutableRecord =>
          absent(sourceRevisionFieldLocator); revisionedRecord => exactlyOne(sourceRevisionFieldLocator)
      severity: Error
      message: stream identity, locked source contract, purpose, revision policy, or raw field mappings are invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
    BarSpecificationContract:
      iri: https://axiolune.ai/ontology/finance/market-data/BarSpecificationContract
      namespace: fin-market-data
      localName: BarSpecificationContract
      label: Bar Specification Contract
      definition: >-
        Fixes BarSpecification identity and requires exactly one valid time or non-time aggregation branch with an exact
        stream and calendar.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          identityBaseIri=https://axiolune.ai/data/bar-specification;
          logicalKey(versionOf(barSpecificationStream),barSpecificationId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision);
          exactlyOne(barAggregation,barPriceBasis,barSourceTimeZone,barTimestampConvention); barAggregation=time =>
          exactlyOne(barInterval) and absent(barThreshold); barAggregation!=time => exactlyOne(barThreshold) and
          absent(barInterval); barInterval>PT0S when present; barThreshold.numericValue>0 when present
      severity: Error
      message: bar specification identity, source context, or aggregation branch is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/BarSpecification
    ObservationIdentityAndRevisionContract:
      iri: https://axiolune.ai/ontology/finance/market-data/ObservationIdentityAndRevisionContract
      namespace: fin-market-data
      localName: ObservationIdentityAndRevisionContract
      label: Observation Identity and Revision Contract
      definition: >-
        Shared source-record identity, standard version key, source-revision mode, linear immediate-predecessor chain,
        and non-negative deterministic order rule.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          identityBaseIri=https://axiolune.ai/data/market-observation;
          logicalKey(versionOf(observationStream),providerObservationId|sourceTradeId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); sourceOrderKey>=0; revision>=0; immutableRecord =>
          absent(sourceRevisionToken,sourceRevisionOrder,supersedes); revisionedRecord =>
          exactlyOne(sourceRevisionToken,sourceRevisionOrder) and sourceRevisionOrder>=0; revisioned initial =>
          absent(supersedes); revisioned nonInitial => exactlyOne(immediatePredecessor supersedes) and
            same(versionOf) and successor.sourceRevisionOrder>predecessor.sourceRevisionOrder and
            successor.revision=predecessor.revision+1 and successor.knowledgeFrom>predecessor.knowledgeFrom;
          predecessor hasAtMostOne directSuccessor
      severity: Error
      message: observation identity, source collision key, revision fields, or supersession chain is invalid
    ObservationContextXoneContract:
      iri: https://axiolune.ai/ontology/finance/market-data/ObservationContextXoneContract
      namespace: fin-market-data
      localName: ObservationContextXoneContract
      label: Observation Context Exclusive Choice Contract
      definition: requires exactly one exact market context for price, quote, trade, and bar observations
      constraintType: Logical
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(observedListing,observedOtcContext)
      severity: Error
      message: exactly one of observedListing and observedOtcContext is required
      targetElement: https://axiolune.ai/ontology/finance/market-data/PriceObservation
    QuoteObservationContextXoneContract:
      iri: https://axiolune.ai/ontology/finance/market-data/QuoteObservationContextXoneContract
      namespace: fin-market-data
      localName: QuoteObservationContextXoneContract
      label: Quote Observation Context Exclusive Choice Contract
      definition: requires exactly one exact market context for a quote observation
      constraintType: Logical
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(observedListing,observedOtcContext)
      severity: Error
      message: exactly one of observedListing and observedOtcContext is required
      targetElement: https://axiolune.ai/ontology/finance/market-data/QuoteObservation
    TradeObservationContextXoneContract:
      iri: https://axiolune.ai/ontology/finance/market-data/TradeObservationContextXoneContract
      namespace: fin-market-data
      localName: TradeObservationContextXoneContract
      label: Trade Observation Context Exclusive Choice Contract
      definition: requires exactly one exact market context for a trade observation
      constraintType: Logical
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(observedListing,observedOtcContext)
      severity: Error
      message: exactly one of observedListing and observedOtcContext is required
      targetElement: https://axiolune.ai/ontology/finance/market-data/TradeObservation
    TradeBarContextXoneContract:
      iri: https://axiolune.ai/ontology/finance/market-data/TradeBarContextXoneContract
      namespace: fin-market-data
      localName: TradeBarContextXoneContract
      label: Trade Bar Context Exclusive Choice Contract
      definition: requires exactly one exact market context for a trade bar
      constraintType: Logical
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(observedListing,observedOtcContext)
      severity: Error
      message: exactly one of observedListing and observedOtcContext is required
      targetElement: https://axiolune.ai/ontology/finance/market-data/TradeBar
    QuoteBarContextXoneContract:
      iri: https://axiolune.ai/ontology/finance/market-data/QuoteBarContextXoneContract
      namespace: fin-market-data
      localName: QuoteBarContextXoneContract
      label: Quote Bar Context Exclusive Choice Contract
      definition: requires exactly one exact market context for a quote bar
      constraintType: Logical
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(observedListing,observedOtcContext)
      severity: Error
      message: exactly one of observedListing and observedOtcContext is required
      targetElement: https://axiolune.ai/ontology/finance/market-data/QuoteBar
    ObservationContextQuotationContract:
      iri: https://axiolune.ai/ontology/finance/market-data/ObservationContextQuotationContract
      namespace: fin-market-data
      localName: ObservationContextQuotationContract
      label: Observation Context and Quotation Contract
      definition: >-
        Requires an exact observed instrument and an exact DirectUnitPriceQuotationContract matching instrument, the
        selected market context, currency, and every price-applicable quantity unit.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          listed => observedListing.listedInstrument=observedInstrument and
            quotationContract.quotationListingContext=observedListing and
            allMoney.currency=versionOf(observedListing.listingQuoteCurrency);
          OTC => quotationContract.quotationOTCContext=observedOtcContext and
            allMoney.currency=versionOf(observedOtcContext.otcQuoteCurrency);
          quotationContract.quotationInstrument=versionOf(observedInstrument);
          quotationContract.quotationQuoteCurrency=allMoney.currency; quotationContract.quotationKind=directUnitPrice
          and quotationContract.contractMultiplier=1;
          allPriceApplicableQuantity.unit=quotationContract.quotationDenominatorUnit
      severity: Error
      message: observation context, instrument, quotation contract, Money currency, or Quantity unit does not match
    PriceKindCompatibilityContract:
      iri: https://axiolune.ai/ontology/finance/market-data/PriceKindCompatibilityContract
      namespace: fin-market-data
      localName: PriceKindCompatibilityContract
      label: Price Kind Compatibility Contract
      definition: >-
        closed executable type-to-price-kind matrix with structural quote sides and a schema-locked, content-addressed,
        PIT-safe calculation-run closure for derived prices
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          PriceObservation => exactlyOne(priceKind) and priceKind in
            {last,mid,open,high,low,close,settlement,vwap,twap};
          TradeObservation => priceKind=last; QuoteObservation|TradeBar|QuoteBar => absent(priceKind); bid|ask not
          members PriceKind; vwap|twap => exactlyOne(calculationDefinitionRef,calculationDefinitionDigest,
          calculationRunRef,calculationRunDigest,calculationInputSetDigest); other PriceKind =>
          absent(calculationDefinitionRef,calculationDefinitionDigest,calculationRunRef,calculationRunDigest,
          calculationInputSetDigest); digest(bytes(calculationRunRef))=calculationRunDigest;
          calculationRun.schema=https://axiolune.ai/schemas/finance/market-data/calculation-run-evidence-v1#sha256:490f10b5923ba0e1190cb32c0e2ff49aeabc5a6f5123cfbfae10e1a074eda6d4;
          calculationRun binds exact output FactVersion, definition digest, deterministic selection/window, explicit
          output-axis PIT pivot, sorted input FactVersion set, and closureAssertionSetDigest;
          digest(canonicalSelectedInputFactSnapshotsWithClosures)=calculationInputSetDigest; select exactly one input
          FactVersion per logical identity whose half-open valid/knowledge/availability intervals contain the PIT pivot;
          calculationDefinition binds exact-rational intermediate arithmetic and final-output half-even scale policy;
          definition, selection, input-set, input payload, PIT, or relevant closure drift invalidates the run and
          requires an append-only output revision
      severity: Error
      message: observation type and PriceKind are incompatible or replayable derived-price evidence is absent
    QuoteObservationContract:
      iri: https://axiolune.ai/ontology/finance/market-data/QuoteObservationContract
      namespace: fin-market-data
      localName: QuoteObservationContract
      label: Quote Observation Contract
      definition: enforces a complete paired quote, non-negative sizes, common units, and crossed-quote finding semantics
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(bidPrice,bidSize,askPrice,askSize); bidSize.numericValue>=0; askSize.numericValue>=0;
          bidPrice.currency=askPrice.currency; bidSize.unit=askSize.unit=quotationContract.quotationDenominatorUnit;
          bidPrice.amount>askPrice.amount <=> exactlyOne(crossedQuote finding over this exact version)
      severity: Error
      message: quote pair, sizes, units, currencies, or crossed-quote finding is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/QuoteObservation
    TradeObservationContract:
      iri: https://axiolune.ai/ontology/finance/market-data/TradeObservationContract
      namespace: fin-market-data
      localName: TradeObservationContract
      label: Trade Observation Contract
      definition: enforces source trade ID, Last price, positive size, observedAt, and canonical order
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(sourceTradeId,observedAt,sourceOrderKey); tradeSize.numericValue>0; priceKind=last;
          canonicalOrder=(observedAt UTC,versionOf(observationStream) UTF8, sourceOrderKey integer,sourceTradeId NFC
          UTF8); fullTupleTieWithDifferentContent => orderingCollision
      severity: Error
      message: trade price kind, quantity, source identity, event time, or canonical ordering is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/TradeObservation
    TradeBarContract:
      iri: https://axiolune.ai/ontology/finance/market-data/TradeBarContract
      namespace: fin-market-data
      localName: TradeBarContract
      label: Trade Bar Contract
      definition: enforces trade basis, OHLC bounds, non-negative volume, and time/non-time bar instance branches
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          barSpecification.barPriceBasis=trade; tradeLowPrice<=tradeOpenPrice<=tradeHighPrice and
          tradeLowPrice<=tradeClosePrice<=tradeHighPrice and tradeVolume.numericValue>=0; apply
          BarInstanceBranchContract
      severity: Error
      message: TradeBar basis, OHLCV values, or aggregation branch is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/TradeBar
    QuoteBarContract:
      iri: https://axiolune.ai/ontology/finance/market-data/QuoteBarContract
      namespace: fin-market-data
      localName: QuoteBarContract
      label: Quote Bar Contract
      definition: enforces paired quote-side OHLC bounds, side sizes, bidAsk basis, and bar branch semantics
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          barSpecification.barPriceBasis=bidAsk; bidLowPrice<=bidOpenPrice<=bidHighPrice and
          bidLowPrice<=bidClosePrice<=bidHighPrice; askLowPrice<=askOpenPrice<=askHighPrice and
          askLowPrice<=askClosePrice<=askHighPrice; lastBidSize.numericValue>=0 and lastAskSize.numericValue>=0; all
          bid/ask Money currencies equal; apply BarInstanceBranchContract
      severity: Error
      message: QuoteBar basis, paired OHLC values, side sizes, currencies, or aggregation branch is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/QuoteBar
    BarInstanceBranchContract:
      iri: https://axiolune.ai/ontology/finance/market-data/BarInstanceBranchContract
      namespace: fin-market-data
      localName: BarInstanceBranchContract
      label: Bar Instance Branch Contract
      definition: shared executable time-bar versus non-time-bar instance and timestamp semantics
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: |-
          barSpecification.barAggregation=time => exactlyOne(intervalStart,intervalEnd) and
            intervalStart<intervalEnd and absent(barSequence,firstContributingEventAt,lastContributingEventAt) and
            intervalEnd-intervalStart=barSpecification.barInterval and
            (timestampConvention=intervalStart => observedAt=intervalStart) and
            (timestampConvention=intervalEnd => observedAt=intervalEnd);
          barSpecification.barAggregation!=time => absent(intervalStart,intervalEnd) and
            exactlyOne(barSequence,firstContributingEventAt,lastContributingEventAt) and barSequence>=0 and
            firstContributingEventAt<=lastContributingEventAt
      severity: Error
      message: bar interval, event bounds, sequence, or timestamp convention is invalid
    MarketDataQualityFindingContract:
      iri: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFindingContract
      namespace: fin-market-data
      localName: MarketDataQualityFindingContract
      label: Market Data Quality Finding Contract
      definition: executable closed predicate matrix and content-addressed identity for market-data findings
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          identityBaseIri=https://axiolune.ai/data/market-data-quality-finding;
          affectedSet=sortedUniqueExactVersionIris(all affected roles); affectedSubjectDigest=iriSetDigest(affectedSet);
          logicalKey(versionOf(findingStream),qualityFindingKind,affectedSubjectDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); crossedQuote => affectedSet exactlyOne
          QuoteObservation with bidPrice>askPrice; duplicateConflict => affectedSet allAndOnly atLeastTwo versions
          sharing sourceRecordCollisionKey with different canonical content; orderingCollision => affectedSet allAndOnly
          atLeastTwo observations sharing complete canonicalOrder tuple with different canonical content; lawful linear
          corrections with distinct sourceRevisionToken doNotProduce duplicateConflict
      severity: Error
      message: quality finding predicate, exact subject set, digest, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/MarketDataQualityFinding
    FXObservationContextXoneContract:
      iri: https://axiolune.ai/ontology/finance/market-data/FXObservationContextXoneContract
      namespace: fin-market-data
      localName: FXObservationContextXoneContract
      label: FX Observation Context Exclusive Choice Contract
      definition: requires exactly one exact listed or OTC market context for an FX rate observation
      constraintType: Logical
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(observedListing,observedOtcContext)
      severity: Error
      message: exactly one of observedListing and observedOtcContext is required for an FX rate observation
      targetElement: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
    FXRateObservationContract:
      iri: https://axiolune.ai/ontology/finance/market-data/FXRateObservationContract
      namespace: fin-market-data
      localName: FXRateObservationContract
      label: FX Rate Observation Contract
      definition: enforces FX dimensional equation, positive rate, distinct currencies, and inverse derivation discipline
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          baseCurrency!=quoteCurrency; fxRate.numericValue>0; fxRate.unit=quoteCurrencyUnitsPerOneBaseCurrencyUnit;
          equation(1 baseCurrency = fxRate * quoteCurrency); inverse rate only deterministicDerivation(1/fxRate) with
          exact source-version and transformation evidence
      severity: Error
      message: FX context, currencies, rate dimension, positivity, or inverse derivation is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
    ThreeAxisPITContract:
      iri: https://axiolune.ai/ontology/finance/market-data/ThreeAxisPITContract
      namespace: fin-market-data
      localName: ThreeAxisPITContract
      label: Three Axis PIT Contract
      definition: fail-closed PIT eligibility and immutable closure rule shared by every materialized market-data fact
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(validFrom,knowledgeFrom,availableFrom,revision,source); eligible iff
          validFrom<=asOfValid<effectiveValidTo and
            knowledgeFrom<=asOfKnowledge<effectiveKnowledgeTo and
            availableFrom<=asOfAvailable<effectiveAvailableTo;
          knowledgeFrom<=materializationContext.referenceTime; asOfKnowledge<=materializationContext.referenceTime;
          asOfAvailable<=materializationContext.referenceTime; no implicit clock functions; knowledgeTo and availableTo
          forbidden on FactVersion; effectiveKnowledgeTo and effectiveAvailableTo derive only from unique
          FactClosureAssertion
      severity: Error
      message: fact lacks three-axis starts, uses implicit current time, leaks future data, or mutates closure onto a version
    ThreeAxisObjectPITContract:
      iri: https://axiolune.ai/ontology/finance/market-data/ThreeAxisObjectPITContract
      namespace: fin-market-data
      localName: ThreeAxisObjectPITContract
      label: Three Axis Object PIT Contract
      definition: fail-closed PIT eligibility and immutable closure rule for materialized Market Data objects
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          exactlyOne(validFrom,knowledgeFrom,availableFrom,revision,source); eligible iff
          validFrom<=asOfValid<effectiveValidTo and
            knowledgeFrom<=asOfKnowledge<effectiveKnowledgeTo and
            availableFrom<=asOfAvailable<effectiveAvailableTo;
          knowledgeFrom<=materializationContext.referenceTime; asOfKnowledge<=materializationContext.referenceTime;
          asOfAvailable<=materializationContext.referenceTime; no implicit clock functions; knowledgeTo and availableTo
          forbidden on FactVersion; effectiveKnowledgeTo and effectiveAvailableTo derive only from unique
          FactClosureAssertion
      severity: Error
      message: object lacks three-axis starts, uses implicit current time, leaks future data, or mutates closure onto a version
