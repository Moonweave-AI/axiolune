prefixes:
  ax-meta:
    expansion: https://axiolune.ai/ontology/meta/
    description: M3 semantic core
  ax-pattern:
    expansion: https://axiolune.ai/ontology/meta/patterns/
    description: M3 cross-domain patterns
  fin-foundation:
    expansion: https://axiolune.ai/ontology/finance/foundation/
    description: Financial identity, identifiers, classification
  fin-market-structure:
    expansion: https://axiolune.ai/ontology/finance/market-structure/
    description: Trading venues, market segments, sessions
  fin-market-rules:
    expansion: https://axiolune.ai/ontology/finance/market-rules/
    description: Trading/settlement rules and applicability
  fin-instruments:
    expansion: https://axiolune.ai/ontology/finance/instruments/
    description: Financial instruments, issuers, listings
  fin-market-data:
    expansion: https://axiolune.ai/ontology/finance/market-data/
    description: Price/quote/trade/bar observations
  fin-portfolio-positions:
    expansion: https://axiolune.ai/ontology/finance/portfolio-positions/
    description: Holdings, positions, portfolio, valuation
  fin-portfolio:
    expansion: https://axiolune.ai/ontology/finance/portfolio-positions/
    description: Alias for fin-portfolio-positions (module-registry short prefix)
  fin-orders-execution:
    expansion: https://axiolune.ai/ontology/finance/orders-execution/
    description: Order intent, lifecycle, execution
  fin-orders:
    expansion: https://axiolune.ai/ontology/finance/orders-execution/
    description: Alias for fin-orders-execution (module-registry short prefix)
  fin-strategy-research:
    expansion: https://axiolune.ai/ontology/finance/strategy-research/
    description: Factors, signals, strategies, backtests
  fin-strategy:
    expansion: https://axiolune.ai/ontology/finance/strategy-research/
    description: Alias for fin-strategy-research (module-registry short prefix)
  fin-risk:
    expansion: https://axiolune.ai/ontology/finance/risk/
    description: Risk measures, limits, exposure
  fin-post-trade-operations:
    expansion: https://axiolune.ai/ontology/finance/post-trade-operations/
    description: Corporate actions, settlement, reconciliation
  fin-post-trade:
    expansion: https://axiolune.ai/ontology/finance/post-trade-operations/
    description: Alias for fin-post-trade-operations (module-registry short prefix)
  fibo:
    expansion: https://spec.edmcouncil.org/fibo/ontology/
    description: FIBO (Financial Industry Business Ontology)
  xsd:
    expansion: http://www.w3.org/2001/XMLSchema#
    description: XML Schema datatypes
