      definition: FX Policy, is a policy requiring an explicit PIT-eligible FX conversion when currencies differ, used for enforcing the auditability of cross-currency conversion.
      cnNote: FX 策略，是要求币种不同时显式使用 PIT 合格 FX 换算的策略，用于强制跨币种换算的可审计性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    lotDiscriminator:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/lotDiscriminator
      namespace: fin-portfolio
      localName: lotDiscriminator
      label: lot discriminator
      definition: >-
        Lot Discriminator, is a fixed discriminator that identifies one residual PositionLot within its identity
        context, used for uniquely distinguishing the lot. The openingRemainder value identifies an execution-derived
        opening-remainder lot; adjustedRemainder identifies a lot adjusted by a transformation; transferredLot
        identifies a lot sourced from a transfer.
      cnNote: 批判别式，是在其身份上下文内标识一个残余持仓批的固定判别值，用于唯一区分该批。openingRemainder 标识执行派生开仓余数批；adjustedRemainder 标识经变换调整的批；transferredLot 标识源自转仓的批。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^openingRemainder|adjustedRemainder|transferredLot$
    originalQuantity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/originalQuantity
      namespace: fin-portfolio
      localName: originalQuantity
      label: original signed quantity
      definition: Original Signed Quantity, is a non-zero signed quantity opened by the opening Execution, used for recording the initial scale and direction of a lot.
      cnNote: 原始符号数量，是开仓执行开立的非零带符号数量，用于记录批的初始规模与方向。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    openingGross:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/openingGross
      namespace: fin-portfolio
      localName: openingGross
      label: opening gross
      definition: Opening Gross, is a positive Money gross computed from the allocated quantity and the exact execution price, used for recording the opening trade amount of a lot.
      cnNote: 开仓毛额，是由分配数量与精确执行价格计算的正货币毛额，用于记录批的开仓交易额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    openingCostBasis:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/openingCostBasis
      namespace: fin-portfolio
      localName: openingCostBasis
      label: signed opening cost basis
      definition: Signed Opening Cost Basis, is a signed Money basis after applying the exact fee, FX, precision, and rounding policy, used for recording the initial cost of a lot.
      cnNote: 开仓符号成本基准，是经精确费用 FX 精度与舍入策略后的带符号货币基准，用于记录批的初始成本。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    calculationContextRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/calculationContextRef
      namespace: fin-portfolio
      localName: calculationContextRef
      label: calculation context reference
      definition: Calculation Context Reference, is an immutable reference to a completed calculation input context, used for fixing the input prerequisites of a calculation.
      cnNote: 计算上下文引用，是指向已完成计算输入上下文的不可变引用，用于固定计算的输入前提。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    valuationRunId:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/valuationRunId
      namespace: fin-portfolio
      localName: valuationRunId
      label: valuation run identifier
      definition: Valuation Run Identifier, is a stable identifier of a PortfolioValuation run header, used for uniquely marking a single valuation run.
      cnNote: 估值运行标识，是组合估值运行头部的稳定标识，用于唯一标记一次估值运行。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    conversionContextRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/conversionContextRef
      namespace: fin-portfolio
      localName: conversionContextRef
      label: conversion context reference
      definition: Conversion Context Reference, is an immutable reference to the complete valuation FX conversion context, used for fixing the conversion prerequisites.
      cnNote: 换算上下文引用，是指向完整估值 FX 换算上下文的不可变引用，用于固定换算前提。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    conversionContextDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/conversionContextDigest
      namespace: fin-portfolio
      localName: conversionContextDigest
      label: conversion context digest
      definition: Conversion Context Digest, is a hash digest of the complete FX conversion context, used for detecting changes to the conversion context.
      cnNote: 换算上下文摘要，是完整 FX 换算上下文的哈希摘要，用于检测换算上下文的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    marketValue:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/marketValue
      namespace: fin-portfolio
      localName: marketValue
      label: market value
      definition: Market Value, is the Money output of the exact direct-unit valuation calculation, used for recording the market value of a valuation line.
      cnNote: 市值，是精确直接计价估值计算输出的货币值，用于记录估值行的市场价值。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    inputMoney:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/inputMoney
      namespace: fin-portfolio
      localName: inputMoney
      label: input money
      definition: Input Money, is a Money value before an exact FX conversion, used as the input amount of the conversion.
      cnNote: 输入货币，是 FX 换算前的货币值，用于作为换算的输入金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    outputMoney:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/outputMoney
      namespace: fin-portfolio
      localName: outputMoney
      label: output money
      definition: Output Money, is a Money value after applying the declared FX direction and rounding policy, used for recording the conversion result.
      cnNote: 输出货币，是按声明方向与舍入策略换算后的货币值，用于记录换算结果。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    fxConversionDirection:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/fxConversionDirection
      namespace: fin-portfolio
      localName: fxConversionDirection
      label: FX conversion direction
      definition: FX Conversion Direction, is an attribute indicating base-to-quote or quote-to-base orientation, used for determining the application direction of the rate equation.
      cnNote: FX 换算方向，是表示基准转报价或报价转基准的属性，用于确定汇率方程的应用方向。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection
      defaultCardinality:
        minCount: 1
        maxCount: 1
    lotAllocationKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/lotAllocationKind
      namespace: fin-portfolio
      localName: lotAllocationKind
      label: lot allocation kind
      definition: Lot Allocation Kind, is an attribute distinguishing the opening or consumption branch, used for marking the nature of a lot allocation.
      cnNote: 批分配种类，是区分开仓或消耗分支的属性，用于标定一条批分配的性质。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    allocatedQuantity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/allocatedQuantity
      namespace: fin-portfolio
      localName: allocatedQuantity
      label: allocated quantity
      definition: Allocated Quantity, is a strictly positive quantity allocated by an opening or consumption fact, used for recording the allocation scale of a lot.
      cnNote: 已分配数量，是开仓或消耗事实分配的严格正数量，用于记录批的分配规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    allocatedFeeAmount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/allocatedFeeAmount
      namespace: fin-portfolio
      localName: allocatedFeeAmount
      label: allocated fee amount
      definition: Allocated Fee Amount, is a strictly positive Money magnitude allocated from one exact Fee, used for recording the scale of a fee entering a lot.
      cnNote: 已分配费用金额，是从一笔精确费用分配的严格正货币金额，用于记录费用计入批的规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    allocationVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/allocationVersionSetDigest
      namespace: fin-portfolio
      localName: allocationVersionSetDigest
      label: allocation version set digest
      definition: Allocation Version Set Digest, is a digest of all exact lot allocation versions for one Execution, used for verifying the completeness of the allocation set.
      cnNote: 分配版本集摘要，是一次执行全部精确批分配版本的摘要，用于验证分配集合完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    allocationCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/allocationCount
      namespace: fin-portfolio
      localName: allocationCount
      label: allocation count
      definition: Allocation Count, is the cardinality of the exact allocation version set, used for verifying the count of the allocation set.
      cnNote: 分配数量，是精确分配版本集的基数，用于核验分配集合的计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    eligibleLotVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/eligibleLotVersionSetDigest
      namespace: fin-portfolio
      localName: eligibleLotVersionSetDigest
      label: eligible lot version set digest
      definition: Eligible Lot Version Set Digest, is a digest of the complete exact PositionLot version set eligible for consumption by one Execution, used for verifying the completeness of the eligible domain.
      cnNote: 合格批版本集摘要，是一次执行可消耗的完整精确持仓批版本集的摘要，用于验证合格域完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    eligibleLotCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/eligibleLotCount
      namespace: fin-portfolio
      localName: eligibleLotCount
      label: eligible lot count
      definition: Eligible Lot Count, is the cardinality of the complete exact eligible-lot version set, used for verifying the count of the eligible domain.
      cnNote: 合格批数量，是完整精确合格批版本集的基数，用于核验合格域的计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    feeVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/feeVersionSetDigest
      namespace: fin-portfolio
      localName: feeVersionSetDigest
      label: fee version set digest
      definition: Fee Version Set Digest, is a digest of all exact Fee versions for one Execution, used for verifying the completeness of the fee set.
      cnNote: 费用版本集摘要，是一次执行全部精确费用版本的摘要，用于验证费用集合完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    feeCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/feeCount
      namespace: fin-portfolio
      localName: feeCount
      label: fee count
      definition: Fee Count, is the cardinality of the exact Fee version set, used for verifying the count of the fee set.
      cnNote: 费用数量，是精确费用版本集的基数，用于核验费用集合的计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    feeAllocationVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/feeAllocationVersionSetDigest
      namespace: fin-portfolio
      localName: feeAllocationVersionSetDigest
      label: fee allocation version set digest
      definition: Fee Allocation Version Set Digest, is a digest of all exact PositionLotFeeAllocation versions in the closure, used for verifying the completeness of the fee allocation set.
      cnNote: 费用分配版本集摘要，是闭包内全部精确费用分配版本的摘要，用于验证费用分配集合完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    feeAllocationCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/feeAllocationCount
      namespace: fin-portfolio
      localName: feeAllocationCount
      label: fee allocation count
      definition: Fee Allocation Count, is the cardinality of the exact fee allocation version set, used for verifying the count of the fee allocation set.
      cnNote: 费用分配数量，是精确费用分配版本集的基数，用于核验费用分配集合的计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    allocationClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/allocationClosureProbeRef
      namespace: fin-portfolio
      localName: allocationClosureProbeRef
