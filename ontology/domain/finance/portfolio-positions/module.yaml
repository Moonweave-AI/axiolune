      definition: Allocation Closure Probe Reference, is an immutable reference to the completed allocation completeness probe, used for proving the allocation set has no omissions.
      cnNote: 分配闭包探针引用，是指向已完成分配完整性探针的不可变引用，用于证明分配无遗漏。
      valueType: uri
