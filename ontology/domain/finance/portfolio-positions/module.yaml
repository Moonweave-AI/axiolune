module:
  moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  baseIri: https://axiolune.ai/ontology/finance/portfolio-positions/
  preferredPrefix: fin-portfolio
  version: 0.2.0
  label: Portfolio and Positions
  definition: >-
    account, portfolio, holding snapshots, position lots, and valuation observations that capture portfolio composition
    and valuation with three-axis temporal semantics and explicit price-to-valuation traceability
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
      version: 0.1.0
      artifactDigest: sha256:e64d6782499a636bb016bed59056cbcffef160c9ad43d78ff93a479285998295
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
      version: 0.1.0
      artifactDigest: sha256:081b14706df28e69f9b98308709c767885a58e2d958c265bf7b16768e3b901b7
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
      version: 0.1.0
      artifactDigest: sha256:478d6b9fc3592f526ffb6332a40d889d6e36e4ea711324313283f503a80519b8
      importMode: All
  exports: []
  status: approved
domain:
  PositionSide:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSide
    namespace: fin-portfolio
    localName: PositionSide
    label: Position Side
    definition: controlled vocabulary indicating whether a position is long (owns the asset) or short (owes the asset)
    values:
      - Long
      - Short
      - Flat
    note: Axiolune-native; corresponds to nautilus_trader PositionSide (LONG/SHORT/FLAT)
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSide
  ValuationMethod:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod
    namespace: fin-portfolio
    localName: ValuationMethod
    label: Valuation Method
    definition: controlled vocabulary of valuation methodologies (mark-to-market, mark-to-model, cost basis)
    values:
      - MarkToMarket
      - MarkToModel
      - CostBasis
      - LowerOfCostOrMarket
    note: Axiolune-native; captures common valuation approaches for financial positions
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod
  AccountType:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/AccountType
    namespace: fin-portfolio
    localName: AccountType
    label: Account Type
    definition: controlled vocabulary of account categories (cash, margin, simulated, managed)
    values:
      - Cash
      - Margin
      - Simulated
      - Managed
      - Custodial
    note: Axiolune-native; nautilus_trader distinguishes CASH/MARGIN accounts
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/portfolio-positions/AccountType
  hasQuantity:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasQuantity
    namespace: fin-portfolio
    localName: hasQuantity
    label: Has Quantity
    definition: relation from a holding or position to its decimal quantity value
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Should use Quantity type binding from M3 when cross-module type references are wired
  hasMarketValue:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasMarketValue
    namespace: fin-portfolio
    localName: hasMarketValue
    label: Has Market Value
    definition: relation from a valuation to its decimal market value amount
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Should use Money type binding from M3 when cross-module type references are wired
  hasCostBasis:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasCostBasis
    namespace: fin-portfolio
    localName: hasCostBasis
    label: Has Cost Basis
    definition: relation from a position or valuation to its decimal cost basis amount
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Cost basis is the original acquisition cost; optional as not all holdings have tracked cost
  hasUnrealizedPnL:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasUnrealizedPnL
    namespace: fin-portfolio
    localName: hasUnrealizedPnL
    label: Has Unrealized PnL
    definition: relation from a valuation to its decimal unrealized profit and loss amount
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Unrealized PnL = Market Value - Cost Basis; can be derived but captured for auditability
  hasPositionSide:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasPositionSide
    namespace: fin-portfolio
    localName: hasPositionSide
    label: Has Position Side
    definition: relation from a holding or position to its position side code (Long/Short/Flat)
    valueType: codelist
    codeListReference: PositionSide
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: References PositionSide code list
  hasValuationMethod:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasValuationMethod
    namespace: fin-portfolio
    localName: hasValuationMethod
    label: Has Valuation Method
    definition: relation from a valuation to its valuation methodology code
    valueType: codelist
    codeListReference: ValuationMethod
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: References ValuationMethod code list
  hasAccountType:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasAccountType
    namespace: fin-portfolio
    localName: hasAccountType
    label: Has Account Type
    definition: relation from an account to its account type code
    valueType: codelist
    codeListReference: AccountType
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: References AccountType code list
  hasAccountIdentifier:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasAccountIdentifier
    namespace: fin-portfolio
    localName: hasAccountIdentifier
    label: Has Account Identifier
    definition: relation from an account to its unique identifier string
    valueType: string
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Unique identifier for the account within the platform or external system
  hasPortfolioIdentifier:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasPortfolioIdentifier
    namespace: fin-portfolio
    localName: hasPortfolioIdentifier
    label: Has Portfolio Identifier
    definition: relation from a portfolio to its unique identifier string
    valueType: string
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Unique identifier for the portfolio within the platform
  hasPortfolioName:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/hasPortfolioName
    namespace: fin-portfolio
    localName: hasPortfolioName
    label: Has Portfolio Name
    definition: relation from a portfolio to its human-readable name
    valueType: string
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Display name for the portfolio
  Account:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/Account
    namespace: fin-portfolio
    localName: Account
    label: Account
    definition: >-
      financial account that serves as the unit of ownership, authorization, and accounting for trading activities and
      asset holdings
    superTypes: []
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasAccountIdentifier
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasAccountType
        minCount: 1
        maxCount: 1
    alignments:
      - vocabulary: FIBO
        targetIri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
        relation: skos:relatedMatch
        sourceRelease:
          vocabulary: FIBO
          release: local-evidence-bundle
          artifactDigest: sha256:13381a6f48642dc4b7e26c62960cc55accca20a33b7d0c52434538113672ce5a
          lockRef: fibo-local-evidence
          claimedReleaseLabel: 2026Q1
          releaseNote: >-
            Digest from references.lock#fibo-local-evidence; Production quarterly claim (2026Q1) unverified — see lock
            maturity.
        rationale: >-
          Axiolune Account is related to FIBO Account; FIBO is broader (banking/payments), Axiolune focuses on
          trading/holdings
        verification:
          status: proposed
  Portfolio:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
    namespace: fin-portfolio
    localName: Portfolio
    label: Portfolio
    definition: >-
      collection of financial instruments and cash positions managed as a unit for investment objectives, performance
      tracking, or risk management
    superTypes: []
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasPortfolioIdentifier
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasPortfolioName
        minCount: 0
        maxCount: 1
    alignments:
      - vocabulary: FIBO
        targetIri: https://spec.edmcouncil.org/fibo/ontology/SEC/Portfolios/PortfolioManagement/Portfolio
        relation: rdfs:subClassOf
        sourceRelease:
          vocabulary: FIBO
          release: local-evidence-bundle
          artifactDigest: sha256:13381a6f48642dc4b7e26c62960cc55accca20a33b7d0c52434538113672ce5a
          lockRef: fibo-local-evidence
          claimedReleaseLabel: 2026Q1
          releaseNote: >-
            Digest from references.lock#fibo-local-evidence; Production quarterly claim (2026Q1) unverified — see lock
            maturity.
        rationale: Axiolune Portfolio is a domain-level subclass of FIBO Portfolio
        verification:
          status: proposed
  HoldingSnapshot:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    namespace: fin-portfolio
    localName: HoldingSnapshot
    label: Holding Snapshot
    definition: >-
      time-stamped observation of an account or portfolio's holding of a specific financial instrument at a point in
      time, with three-axis temporal semantics distinguishing the business effective time, knowledge time, and data
      availability time
    participantRoles:
      - roleName: heldInAccount
        range: https://axiolune.ai/ontology/finance/portfolio-positions/Account
        minCount: 0
        maxCount: 1
        definition: the account in which the instrument is held
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/heldInAccount
      - roleName: heldInPortfolio
        range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
        minCount: 0
        maxCount: 1
        definition: the portfolio that contains this holding
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/heldInPortfolio
      - roleName: heldInstrument
        range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
        minCount: 1
        maxCount: 1
        definition: the financial instrument being held
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/heldInstrument
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasQuantity
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasPositionSide
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/foundation/hasCurrencyCode
        minCount: 0
        maxCount: 1
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    alignments:
      - vocabulary: FIBO
        targetIri: https://spec.edmcouncil.org/fibo/ontology/SEC/Portfolios/PortfolioManagement/PortfolioHolding
        relation: skos:relatedMatch
        sourceRelease:
          vocabulary: FIBO
          release: local-evidence-bundle
          artifactDigest: sha256:13381a6f48642dc4b7e26c62960cc55accca20a33b7d0c52434538113672ce5a
          lockRef: fibo-local-evidence
          claimedReleaseLabel: 2026Q1
          releaseNote: >-
            Digest from references.lock#fibo-local-evidence; Production quarterly claim (2026Q1) unverified — see lock
            maturity.
        rationale: >-
          Axiolune HoldingSnapshot is related to FIBO PortfolioHolding; Axiolune adds three-axis temporal semantics and
          explicit provenance not present in FIBO's current model
        verification:
          status: proposed
    note: >-
      HoldingSnapshot distinguishes externally reported holdings from execution-derived positions; both can coexist for
      reconciliation
  PositionValuation:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
    namespace: fin-portfolio
    localName: PositionValuation
    label: Position Valuation
    definition: >-
      time-stamped valuation of a holding that explicitly references the price observation used, the valuation method
      applied, and the resulting market value, enabling full traceability from price to valuation result
    participantRoles:
      - roleName: valuedHolding
        range: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
        minCount: 1
        maxCount: 1
        definition: the holding snapshot being valued
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/valuedHolding
      - roleName: usedPriceObservation
        range: https://axiolune.ai/ontology/finance/market-data/PriceObservation
        minCount: 1
        maxCount: 1
        definition: the price observation used to compute the market value
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/usedPriceObservation
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasMarketValue
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasCostBasis
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasUnrealizedPnL
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasValuationMethod
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/foundation/hasCurrencyCode
        minCount: 1
        maxCount: 1
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      PositionValuation makes the price-to-valuation link explicit and auditable, supporting CQ-S4 traceability
      requirement
  PositionLot:
    iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    namespace: fin-portfolio
    localName: PositionLot
    label: Position Lot
    definition: >-
      distinct acquisition or disposition of a specific quantity of an instrument, tracked separately for tax basis,
      holding period, or accounting purposes
    participantRoles:
      - roleName: lotForInstrument
        range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
        minCount: 1
        maxCount: 1
        definition: the financial instrument this lot represents
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/lotForInstrument
      - roleName: lotInAccount
        range: https://axiolune.ai/ontology/finance/portfolio-positions/Account
        minCount: 1
        maxCount: 1
        definition: the account that holds this lot
        roleIri: https://axiolune.ai/ontology/finance/portfolio-positions/lotInAccount
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasQuantity
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasCostBasis
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/hasPositionSide
        minCount: 1
        maxCount: 1
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      PositionLot enables lot-level tracking for tax accounting and detailed position management; aggregates to
      HoldingSnapshot
