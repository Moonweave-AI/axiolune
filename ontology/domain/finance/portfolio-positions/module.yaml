        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    HoldingSnapshot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
      namespace: fin-portfolio
      localName: HoldingSnapshot
      label: Holding Snapshot
      definition: >-
        Holding Snapshot, is a source-observed non-negative quantity observation of one account and instrument from a
        single observation stream, used for recording externally reported ownership facts rather than portfolio
        membership edges or execution-derived exposure.
      cnNote: 持仓快照，是源自单一观测流的账户工具非负持有量观测，用于记录外部报告的所有权事实而非组合成员边或执行派生敞口。
      participantRoles:
        - id: holdingObservationStream
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
          minCount: 1
          maxCount: 1
          label: holding observation stream
          definition: exact provider-owned stream FactVersion whose locked closure contains the selected holding row
        - id: holdingAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: holding account
          definition: logical FinancialAccount owning the interest
        - id: holdingInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: holding instrument
          definition: logical FinancialInstrument owned by the account
        - id: holdingListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: holding listing
          definition: optional exact PIT-eligible listing version for the instrument
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/snapshotId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/holdingQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionSourceKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionScope
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/balanceDimension
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/grossLongQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/grossShortQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/businessAsOf
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/statementPeriodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionSnapshot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
      namespace: fin-portfolio
      localName: PositionSnapshot
      label: Position Snapshot
      definition: >-
        Position Snapshot, is a signed exposure observation of one account and instrument from a single observation
        stream, used for storing the signed net quantity as the default directional truth where positive is long,
        negative is short, zero is flat, and any side label is derived. Optional grossLongQuantity, grossShortQuantity,
        positionScope, and balanceDimension carry the gross and per-bucket truths so that the signed net is no longer the
        only authoritative quantity.
      cnNote: 头寸快照，是源自单一观测流的带符号敞口观测，用于以符号净额为默认方向真相（正多负空零平，任何方向标签均为派生），可选 grossLongQuantity、grossShortQuantity、positionScope 与 balanceDimension 承载毛额与分桶真相，使符号净额不再为唯一权威量。
      participantRoles:
        - id: positionObservationStream
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
          minCount: 1
          maxCount: 1
          label: position observation stream
          definition: logical provider-owned stream that scopes snapshotId
        - id: positionAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: position account
          definition: logical FinancialAccount exposed to the instrument
        - id: positionInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: position instrument
          definition: logical FinancialInstrument to which the account is exposed
        - id: positionListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: position listing
          definition: optional exact PIT-eligible listing version for the instrument
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/snapshotId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionSourceKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/positionScope
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/balanceDimension
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/grossLongQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/grossShortQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/businessAsOf
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/statementPeriodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionLot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
      namespace: fin-portfolio
      localName: PositionLot
      label: Position Lot
      definition: >-
        Position Lot, is an execution-derived opening exposure, used for tracking immutable cost and context by taking
        account, instrument, opening execution, cost-basis definition, and the opening-remainder discriminator as its
        logical identity.
      cnNote: 持仓批，是执行派生的开仓敞口，用于以账户工具开仓执行与成本基准定义及开仓余数判别式为逻辑身份追踪不可变成本与上下文。
      participantRoles:
        - id: lotInAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: lot in account
          definition: logical FinancialAccount holding the lot
        - id: lotForInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: lot for instrument
          definition: logical FinancialInstrument represented by the lot
        - id: lotAtListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: lot at listing
          definition: optional exact listing version used by the opening execution
        - id: openingExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: opening execution
          definition: exact Execution version that opened the residual exposure
        - id: costBasisDefinition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
          minCount: 1
          maxCount: 1
          label: cost basis definition
          definition: exact calculation-definition version governing the lot
        - id: lotQuotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: lot quotation contract
          definition: exact quotation contract shared with the opening Execution and definition
        - id: openingGrossFxConversion
          range: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversion
          minCount: 0
          maxCount: 1
          label: opening gross FX conversion
          definition: exact conversion required only when execution price and cost-basis currencies differ
        - id: derivedFromChange
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChange
          minCount: 0
          maxCount: 1
          label: derived from change
          definition: optional PositionChange that derived this lot for non-execution sources (transfer, opening balance, corporate action)
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotDiscriminator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/originalQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/openingGross
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/openingCostBasis
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/calculationContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotSourceKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioValuation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuation
      namespace: fin-portfolio
      localName: PortfolioValuation
      label: Portfolio Valuation
      definition: >-
        Portfolio Valuation, is a valuation run header that fixes the portfolio, complete member-account closure,
        valuation definition, reporting currency, and PIT input context, used for encapsulating all prerequisites of one
        valuation calculation.
      cnNote: 组合估值，是固定组合、完整成员闭包、估值定义、报告货币与 PIT 输入上下文的估值运行头部，用于封装一次估值计算的全部前提。
      participantRoles:
        - id: valuedPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: valued portfolio
          definition: logical Portfolio evaluated by the run
        - id: memberAccountClosure
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosure
          minCount: 1
          maxCount: 1
          label: member account closure
          definition: exact PIT-complete account membership closure used by the run
        - id: valuationDefinition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
          minCount: 1
          maxCount: 1
          label: valuation definition
          definition: exact valuation calculation definition version
        - id: reportingCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 1
          maxCount: 1
          label: reporting currency
          definition: logical Currency in which header totals and lines are reported
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationRunId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/conversionContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/conversionContextDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionValuation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
      namespace: fin-portfolio
      localName: PositionValuation
      label: Position Valuation
      definition: >-
        Position Valuation, is a valuation line whose logical identity is the exact valuation header and input snapshot
        version, used for producing market value from a holding or position snapshot and an exact PIT price without
        carrying method truth.
      cnNote: 头寸估值行，是以估值头部与输入快照版本为逻辑身份的估值明细，用于在持仓或头寸快照与精确 PIT 价格下产出市值而不承载方法真相。
      participantRoles:
        - id: valuationHeader
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuation
          minCount: 1
          maxCount: 1
          label: valuation header
          definition: exact PortfolioValuation header version
        - id: valuedHoldingSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
          minCount: 0
          maxCount: 1
          label: valued holding snapshot
          definition: exact holding snapshot version selected by the input xone
        - id: valuedPositionSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: valued position snapshot
          definition: exact position snapshot version selected by the input xone
        - id: valuationPrice
          range: https://axiolune.ai/ontology/finance/market-data/PriceObservation
          minCount: 1
          maxCount: 1
          label: valuation price
          definition: exact PIT-eligible PriceObservation version used by the line
        - id: valuationFxConversion
          range: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversion
          minCount: 0
          maxCount: 1
          label: valuation FX conversion
          definition: exact conversion version required only when price and reporting currencies differ
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/marketValue
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationSubjectKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationFinality
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/coverageInclusionReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/exclusionReason
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FXConversion:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversion
      namespace: fin-portfolio
      localName: FXConversion
      label: FX Conversion
      definition: >-
        FX Conversion, is an auditable fact that applies an exact PIT FX rate and direction to convert one Money into
        another (a rate application, also referenced as FXRateApplication), used for being uniquely consumed by a
        valuation line, opening lot, or fee allocation that points back to this exact conversion version. Optional
        rateSource, quoteTime, rateDate, rateFinality, and crossRatePath carry the rate provenance and multi-leg
        cross-currency path. If this fact represents a real FX trade rather than a rate application, it belongs to
        trading or settlement semantics and should reference a settlement/trading module fact.
      cnNote: 外汇换算，是应用精确 PIT 汇率与方向把一笔货币换算为另一笔货币的可审计事实（汇率应用，亦称 FXRateApplication），用于被估值行、开仓批或费用分配唯一消费并回指此版本。可选 rateSource、quoteTime、rateDate、rateFinality 与 crossRatePath 承载汇率谱系与多腿跨币种路径。若该事实代表真实外汇交易而非汇率应用，则属交易或结算语义，应引用结算/交易模块事实。
      participantRoles:
        - id: conversionValuationLine
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
          minCount: 0
          maxCount: 1
          label: conversion valuation line
          definition: exact valuation-line version consuming this conversion
        - id: conversionOpeningLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 0
          maxCount: 1
          label: conversion opening lot
          definition: exact opening-lot version consuming this conversion for opening gross
        - id: conversionFeeAllocation
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotFeeAllocation
          minCount: 0
          maxCount: 1
          label: conversion fee allocation
          definition: exact fee-allocation version consuming this conversion
        - id: conversionRate
          range: https://axiolune.ai/ontology/finance/market-data/FXRateObservation
          minCount: 1
          maxCount: 1
          label: conversion rate
          definition: exact PIT-eligible FX rate observation version
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/inputMoney
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/outputMoney
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/fxConversionDirection
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/rateSource
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/quoteTime
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/rateDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/rateFinality
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/crossRatePath
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionLotAllocation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocation
      namespace: fin-portfolio
      localName: PositionLotAllocation
      label: Position Lot Allocation
      definition: >-
        Position Lot Allocation, is an opening or consumption allocation between one Execution and one PositionLot
        under the same cost-basis definition and calculation context, used for establishing a traceable chain through a
        strictly positive quantity and the allocation kind.
      cnNote: 持仓批分配，是一次执行与持仓批在相同成本基准定义与计算上下文下的开仓或消耗分配，用于以严格正数量与分配种类建立可追溯链。
      participantRoles:
        - id: allocationExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: allocation execution
          definition: exact Execution version allocated to a lot
        - id: allocatedLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 1
          maxCount: 1
          label: allocated lot
          definition: exact PositionLot version opened or consumed
        - id: allocationCostBasisDefinition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
          minCount: 1
          maxCount: 1
          label: allocation cost basis definition
          definition: exact calculation-definition version shared by execution and lot
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotAllocationKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocatedQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/calculationContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionLotFeeAllocation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotFeeAllocation
      namespace: fin-portfolio
      localName: PositionLotFeeAllocation
      label: Position Lot Fee Allocation
      definition: >-
        Position Lot Fee Allocation, is a fact that allocates a strictly positive Money fee to one PositionLotAllocation,
        used for carrying an exact FX conversion when currencies differ and bringing the fee effect into basis.
      cnNote: 持仓批费用分配，是把严格正货币费用分配到一条持仓批分配的事实，用于在币种不同时附带精确 FX 换算并把费用效果计入基准。
      participantRoles:
        - id: allocatedFee
          range: https://axiolune.ai/ontology/finance/orders-execution/Fee
          minCount: 1
          maxCount: 1
          label: allocated fee
          definition: exact Fee version whose magnitude is allocated
        - id: feeLotAllocation
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocation
          minCount: 1
          maxCount: 1
          label: fee lot allocation
          definition: exact lot allocation version receiving the fee effect
        - id: feeCostBasisDefinition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
          minCount: 1
          maxCount: 1
          label: fee cost basis definition
          definition: exact cost-basis definition shared with the lot allocation
        - id: feeFxConversion
          range: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversion
          minCount: 0
          maxCount: 1
          label: fee FX conversion
          definition: exact conversion required only for differing fee and basis currencies
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocatedFeeAmount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/calculationContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionLotStateClosure:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotStateClosure
      namespace: fin-portfolio
      localName: PositionLotStateClosure
      label: Position Lot State Closure
      definition: >-
        Position Lot State Closure, is a closed-world bridge from all non-zero PositionLot versions, their allocations,
        and execution closures to one execution-derived PositionSnapshot, used for conserving signed quantity and
        remaining cost basis.
      cnNote: 持仓批状态闭包，是从全部非零持仓批及其分配与执行闭包到执行派生头寸快照的闭世界桥接，用于守恒符号数量与剩余成本基准。
      participantRoles:
        - id: closedPositionSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 1
          maxCount: 1
          label: closed position snapshot
          definition: exact execution-derived PositionSnapshot version proved by the closure
        - id: stateCostBasisDefinition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
          minCount: 1
          maxCount: 1
          label: state cost basis definition
          definition: exact cost-basis definition governing all included lots
        - id: stateQuotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: state quotation contract
          definition: exact quotation contract shared across the closure
        - id: stateAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: state account
          definition: logical FinancialAccount shared by the snapshot, lots, and allocations
        - id: stateInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: state instrument
          definition: logical FinancialInstrument shared by the snapshot, lots, and allocations
        - id: stateListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: state listing
          definition: optional exact listing version shared by every listed input in the closure
        - id: openLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 0
          maxCount: null
          label: open lot
          definition: exact non-zero remaining PositionLot version in the complete set
        - id: stateAllocation
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocation
          minCount: 0
          maxCount: null
          label: state allocation
          definition: exact opening or consumption allocation used by the closure
        - id: stateExecutionClosure
          range: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
          minCount: 0
          maxCount: null
          label: state execution closure
          definition: exact execution allocation closure supporting the lot state
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/openLotVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/stateAllocationVersionSetDigest
