      defaultCardinality:
        minCount: 1
        maxCount: 1
    feeClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/feeClosureProbeDigest
      namespace: fin-portfolio
      localName: feeClosureProbeDigest
      label: fee closure probe digest
      definition: Fee Closure Probe Digest, is a hash digest of the completed Fee closure probe, used for detecting changes to the probe record.
      cnNote: 费用闭包探针摘要，是已完成费用闭包探针的哈希摘要，用于检测探针记录的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    consumptionSelectionProbeRef:
