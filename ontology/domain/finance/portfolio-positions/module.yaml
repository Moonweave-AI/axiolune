    PortfolioPositionReconciliationFinding:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioPositionReconciliationFinding
      namespace: fin-portfolio
      localName: PortfolioPositionReconciliationFinding
      label: Portfolio Position Reconciliation Finding
      definition: >-
        Portfolio Position Reconciliation Finding, is a break or notable result requiring disposition, sourced from a
        ReconciliationComparison between external and execution-derived holding, position, or basis evidence, used for
        preventing silent merge or overwrite of the two evidence sets. The compared roles on this type are retained for
        backward compatibility; the canonical comparison lives on ReconciliationComparison.
      cnNote: 组合头寸对账发现，是需处置的差异或显著结果，源自外部与执行派生持仓头寸或基准之间的对账比较，用于防止静默合并或覆盖两套证据。本类型上的比较角色为兼容保留；规范比较位于 ReconciliationComparison。
      participantRoles:
        - id: comparedExternalSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
          minCount: 0
          maxCount: 1
          label: compared external holding snapshot
          definition: optional exact externally reported HoldingSnapshot version
        - id: comparedExternalPositionSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: compared external position snapshot
          definition: optional exact externally reported signed PositionSnapshot version
        - id: comparedDerivedSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: compared derived snapshot
          definition: optional exact execution-derived PositionSnapshot version
        - id: comparedExternalBasis
          range: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalCostBasisObservation
          minCount: 0
          maxCount: 1
          label: compared external basis
          definition: optional exact external basis observation
        - id: comparedLotStateClosure
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotStateClosure
          minCount: 0
          maxCount: 1
          label: compared lot state closure
          definition: optional exact execution-derived basis closure
        - id: sourceComparison
          range: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparison
          minCount: 0
          maxCount: 1
          label: source comparison
          definition: optional exact ReconciliationComparison version that produced this finding
