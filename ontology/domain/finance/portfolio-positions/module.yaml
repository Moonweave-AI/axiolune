        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationExternalSourceScopeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationDerivedSourceScopeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationCandidateGraphRecordCount
          minCount: 1
