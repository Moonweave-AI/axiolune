      defaultCardinality:
        minCount: 1
        maxCount: 1
    stateAllocationClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/stateAllocationClosureProbeDigest
      namespace: fin-portfolio
      localName: stateAllocationClosureProbeDigest
      label: state allocation closure probe digest
      definition: State Allocation Closure Probe Digest, is a hash digest of the completed lot-allocation closure probe, used for detecting changes to the probe record.
      cnNote: 状态分配闭包探针摘要，是已完成批分配闭包探针的哈希摘要，用于检测探针记录的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    unrealizedPnl:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/unrealizedPnl
      namespace: fin-portfolio
      localName: unrealizedPnl
      label: unrealized PnL
      definition: Unrealized PnL, is a Money difference between the exact market value and the remaining cost basis, used for recording the floating profit and loss of an open position.
      cnNote: 未实现盈亏，是精确市值与剩余成本基准的货币差额，用于记录未平仓的浮动盈亏。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    externalBasisId:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/externalBasisId
      namespace: fin-portfolio
      localName: externalBasisId
      label: external basis identifier
      definition: External Basis Identifier, is a stable identifier of an external cost-basis observation within the source scope, used for uniquely marking a single external basis.
      cnNote: 外部基准标识，是外部成本基准观测在来源域内的稳定标识，用于唯一标记一条外部基准。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    externalCostBasis:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/externalCostBasis
      namespace: fin-portfolio
      localName: externalCostBasis
      label: external cost basis
      definition: External Cost Basis, is a source-provided Money basis retained independently from the execution-derived basis, used for recording externally reported cost.
      cnNote: 外部成本基准，是来源提供并独立留存于执行派生基准之外的货币基准，用于记录外部报告的成本。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    portfolioReconciliationKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioReconciliationKind
      namespace: fin-portfolio
      localName: portfolioReconciliationKind
      label: portfolio reconciliation kind
      definition: Portfolio Reconciliation Kind, is a typed result attribute of external-versus-derived comparison, used for marking the conclusion category of a reconciliation finding.
      cnNote: 组合对账种类，是外部与派生比较的类型化结果属性，用于标定对账发现的结论类别。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationSubjectDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationSubjectDigest
      namespace: fin-portfolio
      localName: reconciliationSubjectDigest
      label: reconciliation subject digest
      definition: Reconciliation Subject Digest, is a digest of the exact kind-discriminated versions compared, used for uniquely identifying the reconciliation subject.
      cnNote: 对账主摘要，是比较中按种类区分的精确版本摘要，用于唯一标识对账主语。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationExternalCandidateCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationExternalCandidateCount
      namespace: fin-portfolio
      localName: reconciliationExternalCandidateCount
      label: reconciliation external candidate count
      definition: >-
        Reconciliation External Candidate Count, is the count of the complete PIT-eligible external candidate-version
        set for the selected family, subject, and external source scope, used for verifying the count of the candidate
        domain.
      cnNote: 对账外部候选计数，是所选族主语与外部来源域内 PIT 合格外部候选版本集的计数，用于核验候选域计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationExternalCandidateVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationExternalCandidateVersionSetDigest
      namespace: fin-portfolio
      localName: reconciliationExternalCandidateVersionSetDigest
      label: reconciliation external candidate version set digest
      definition: >-
        Reconciliation External Candidate Version Set Digest, is a digest of the sorted complete PIT-eligible external
        candidate-version set for the selected family, subject, and source scope, used for verifying the completeness of
        the candidate domain.
      cnNote: 对账外部候选版本集摘要，是所选族主语与外部来源域内排序完整外部候选版本集的摘要，用于验证候选域完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationDerivedCandidateCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationDerivedCandidateCount
      namespace: fin-portfolio
      localName: reconciliationDerivedCandidateCount
      label: reconciliation derived candidate count
      definition: >-
        Reconciliation Derived Candidate Count, is the count of the complete PIT-eligible execution-derived
        candidate-version set for the selected family, subject, and derived source scope, used for verifying the count
        of the candidate domain.
      cnNote: 对账派生候选计数，是所选族主语与派生来源域内 PIT 合格执行派生候选版本集的计数，用于核验候选域计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationDerivedCandidateVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationDerivedCandidateVersionSetDigest
      namespace: fin-portfolio
      localName: reconciliationDerivedCandidateVersionSetDigest
      label: reconciliation derived candidate version set digest
      definition: >-
        Reconciliation Derived Candidate Version Set Digest, is a digest of the sorted complete PIT-eligible
        execution-derived candidate-version set for the selected family, subject, and source scope, used for verifying
        the completeness of the candidate domain.
      cnNote: 对账派生候选版本集摘要，是所选族主语与派生来源域内排序完整执行派生候选版本集的摘要，用于验证候选域完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationExternalSourceScopeRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationExternalSourceScopeRef
      namespace: fin-portfolio
      localName: reconciliationExternalSourceScopeRef
      label: reconciliation external source scope reference
      definition: Reconciliation External Source Scope Reference, is an immutable reference to the external observation stream or source namespace whose candidates are closed, used for fixing the external source scope.
      cnNote: 对账外部来源域引用，是指向候选被关闭的外部观测流或来源命名空间的不可变引用，用于固定外部来源范围。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationDerivedSourceScopeRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationDerivedSourceScopeRef
      namespace: fin-portfolio
      localName: reconciliationDerivedSourceScopeRef
      label: reconciliation derived source scope reference
      definition: Reconciliation Derived Source Scope Reference, is an immutable reference to the derivation run or namespace whose candidates are closed, used for fixing the derived source scope.
      cnNote: 对账派生来源域引用，是指向候选被关闭的派生运行或命名空间的不可变引用，用于固定派生来源范围。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationCandidateGraphRecordCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationCandidateGraphRecordCount
      namespace: fin-portfolio
      localName: reconciliationCandidateGraphRecordCount
      label: reconciliation candidate graph record count
      definition: Reconciliation Candidate Graph Record Count, is the total count of canonical candidate records bound into the reconciliation candidate graph before PIT selection, used for verifying the size of the candidate graph.
      cnNote: 对账候选图记录计数，是 PIT 选择前绑定到对账候选图的规范候选记录总数，用于核验候选图规模。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationCandidateGraphRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationCandidateGraphRef
      namespace: fin-portfolio
      localName: reconciliationCandidateGraphRef
      label: reconciliation candidate graph reference
      definition: >-
        Reconciliation Candidate Graph Reference, is an immutable reference to the canonical graph containing the
        complete external and derived candidate-record universe, used for fixing the complete candidate universe.
      cnNote: 对账候选图引用，是指向包含完整外部与派生候选记录全集的规范图的不可变引用，用于固定候选全集。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationCandidateGraphDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationCandidateGraphDigest
      namespace: fin-portfolio
      localName: reconciliationCandidateGraphDigest
      label: reconciliation candidate graph digest
      definition: Reconciliation Candidate Graph Digest, is a hash digest of the canonical candidate-graph artifact and its record-level digests, used for detecting changes to the candidate graph.
      cnNote: 对账候选图摘要，是规范候选图工件及其记录级摘要的哈希摘要，用于检测候选图的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationExternalSnapshotManifestRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationExternalSnapshotManifestRef
      namespace: fin-portfolio
      localName: reconciliationExternalSnapshotManifestRef
      label: reconciliation external snapshot manifest reference
      definition: Reconciliation External Snapshot Manifest Reference, is an immutable reference to the terminal complete-response manifest supplied under the external source contract, used for fixing the external response evidence.
      cnNote: 对账外部快照清单引用，是指向外部来源契约下终止完整响应清单的不可变引用，用于固定外部响应证据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationExternalSnapshotManifestDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationExternalSnapshotManifestDigest
      namespace: fin-portfolio
      localName: reconciliationExternalSnapshotManifestDigest
      label: reconciliation external snapshot manifest digest
      definition: Reconciliation External Snapshot Manifest Digest, is a hash digest of the terminal external full-snapshot response manifest, used for detecting changes to the response manifest.
      cnNote: 对账外部快照清单摘要，是终止外部完整快照响应清单的哈希摘要，用于检测响应清单的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationDerivedOutputManifestRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationDerivedOutputManifestRef
      namespace: fin-portfolio
      localName: reconciliationDerivedOutputManifestRef
      label: reconciliation derived output manifest reference
      definition: Reconciliation Derived Output Manifest Reference, is an immutable reference to the completed derivation-run output manifest, used for fixing the derived output evidence.
      cnNote: 对账派生输出清单引用，是指向已完成派生运行输出清单的不可变引用，用于固定派生输出证据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationDerivedOutputManifestDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationDerivedOutputManifestDigest
      namespace: fin-portfolio
      localName: reconciliationDerivedOutputManifestDigest
      label: reconciliation derived output manifest digest
      definition: Reconciliation Derived Output Manifest Digest, is a hash digest of the completed derivation-run output manifest, used for detecting changes to the output manifest.
      cnNote: 对账派生输出清单摘要，是已完成派生运行输出清单的哈希摘要，用于检测输出清单的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationQueryDefinitionRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationQueryDefinitionRef
      namespace: fin-portfolio
      localName: reconciliationQueryDefinitionRef
      label: reconciliation query definition reference
      definition: Reconciliation Query Definition Reference, is an immutable reference to the exact family, scope, source, and three-axis PIT candidate-selection definition, used for fixing the selection query.
      cnNote: 对账查询定义引用，是指向精确族范围来源与三轴 PIT 候选选择定义的不可变引用，用于固定选择查询。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationQueryDefinitionDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationQueryDefinitionDigest
      namespace: fin-portfolio
      localName: reconciliationQueryDefinitionDigest
      label: reconciliation query definition digest
      definition: Reconciliation Query Definition Digest, is a hash digest of the exact candidate-selection query definition, used for detecting changes to the query definition.
      cnNote: 对账查询定义摘要，是精确候选选择查询定义的哈希摘要，用于检测查询定义的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationQueryToolLockRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationQueryToolLockRef
      namespace: fin-portfolio
      localName: reconciliationQueryToolLockRef
      label: reconciliation query tool lock reference
      definition: Reconciliation Query Tool Lock Reference, is an immutable reference to the implementation and dependency lock used to execute the candidate-selection query, used for fixing the query tool.
      cnNote: 对账查询工具锁引用，是指向执行候选选择查询的实现与依赖锁的不可变引用，用于固定查询工具。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationQueryToolLockDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationQueryToolLockDigest
      namespace: fin-portfolio
      localName: reconciliationQueryToolLockDigest
      label: reconciliation query tool lock digest
      definition: Reconciliation Query Tool Lock Digest, is a hash digest of the candidate-selection implementation and dependency lock, used for detecting changes to the tool lock.
      cnNote: 对账查询工具锁摘要，是候选选择实现与依赖锁的哈希摘要，用于检测工具锁的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationClosureProbeRef
      namespace: fin-portfolio
      localName: reconciliationClosureProbeRef
      label: reconciliation closure probe reference
      definition: Reconciliation Closure Probe Reference, is an immutable reference to the completed probe that proves the exact candidate universe and role selection, used for proving the candidate domain has no omissions.
      cnNote: 对账闭包探针引用，是指向证明精确候选全集与角色选择已完成探针的不可变引用，用于证明候选域无遗漏。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationClosureProbeDigest
      namespace: fin-portfolio
      localName: reconciliationClosureProbeDigest
      label: reconciliation closure probe digest
      definition: Reconciliation Closure Probe Digest, is a hash digest of the completed reconciliation candidate-universe closure probe, used for detecting changes to the probe record.
      cnNote: 对账闭包探针摘要，是已完成对账候选全集闭包探针的哈希摘要，用于检测探针记录的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    reconciliationContextRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationContextRef
      namespace: fin-portfolio
      localName: reconciliationContextRef
      label: reconciliation context reference
      definition: Reconciliation Context Reference, is an immutable reference to the exact comparison context for a reconciliation finding, used for fixing the comparison prerequisites.
      cnNote: 对账上下文引用，是指向对账发现精确比较上下文的不可变引用，用于固定比较前提。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    reconciliationContextDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationContextDigest
      namespace: fin-portfolio
      localName: reconciliationContextDigest
      label: reconciliation context digest
      definition: Reconciliation Context Digest, is a hash digest of the exact comparison-context bytes for a reconciliation finding, used for detecting changes to the comparison context.
      cnNote: 对账上下文摘要，是对账发现精确比较上下文字节的哈希摘要，用于检测比较上下文的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    positionScope:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/positionScope
      namespace: fin-portfolio
      localName: positionScope
      label: position scope
      definition: >-
        Position Scope, is an optional branch attribute marking the view (custody, accounting, economic, regulatory)
        under which a snapshot is observed, used so that one signed quantity is not overloaded across views.
      cnNote: 头寸口径，是标记快照观测视角（托管、核算、经济、监管）的可选分支属性，用于避免单一符号数量跨视角过载。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/PositionScope
      defaultCardinality:
        minCount: 0
        maxCount: 1
    balanceDimension:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/balanceDimension
      namespace: fin-portfolio
      localName: balanceDimension
      label: balance dimension
      definition: >-
        Balance Dimension, is an optional branch attribute marking the sub-balance bucket (settled, pending,
        available, pledged, loaned, receivable, payable) of a snapshot, used so that gross long, gross short, and net
        can be reported per bucket.
      cnNote: 余额维度，是标记快照子余额桶（已结算、待结算、可用、质押、借出、应收、应付）的可选分支属性，用于按桶分别报告毛多、毛空与净额。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension
      defaultCardinality:
        minCount: 0
        maxCount: 1
    grossLongQuantity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/grossLongQuantity
      namespace: fin-portfolio
      localName: grossLongQuantity
      label: gross long quantity
      definition: >-
        Gross Long Quantity, is an optional absolute non-negative long exposure quantity for a snapshot, used for
        reporting gross long separately from net so that a negative net does not erase the gross long truth.
      cnNote: 毛多数量，是快照可选的绝对非负多头敞口数量，用于把毛多与净额分别报告，避免负净额抹去毛多真相。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    grossShortQuantity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/grossShortQuantity
      namespace: fin-portfolio
      localName: grossShortQuantity
      label: gross short quantity
      definition: >-
        Gross Short Quantity, is an optional absolute non-negative short exposure quantity for a snapshot, used for
        reporting gross short separately from net so that a positive net does not erase the gross short truth.
      cnNote: 毛空数量，是快照可选的绝对非负空头敞口数量，用于把毛空与净额分别报告，避免正净额抹去毛空真相。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    businessAsOf:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/businessAsOf
      namespace: fin-portfolio
      localName: businessAsOf
      label: business as-of
      definition: >-
        Business As-Of, is an optional business effective instant marking the statement/observation business point of a
        snapshot, used for distinguishing the business as-of from the three-axis temporal version axes.
      cnNote: 业务时点，是标记快照声明/观测业务时刻的可选业务生效时间点，用于区分业务时点与三轴时态版本轴。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statementPeriodRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/statementPeriodRef
      namespace: fin-portfolio
      localName: statementPeriodRef
      label: statement period reference
      definition: >-
        Statement Period Reference, is an optional reference to the statement or reporting period a snapshot belongs
        to, used for grouping snapshots by period in custody and accounting views.
      cnNote: 声明周期引用，是指向快照所属声明或报告周期的可选引用，用于在托管与核算视图下按周期分组快照。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    valuationSubjectKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/valuationSubjectKind
      namespace: fin-portfolio
      localName: valuationSubjectKind
      label: valuation subject kind
      definition: >-
        Valuation Subject Kind, is an optional attribute marking what a valuation line values (holding, position, lot,
        cash, accrued), used for distinguishing valuation subjects in the coverage closure.
      cnNote: 估值主语种类，是标记估值行所估值对象（持仓、头寸、批、现金、应计）的可选属性，用于在覆盖闭包中区分估值主语。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    valuationFinality:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/valuationFinality
      namespace: fin-portfolio
      localName: valuationFinality
      label: valuation finality
      definition: >-
        Valuation Finality, is an optional attribute marking whether a valuation line is preliminary or final, used for
        staged valuation runs.
      cnNote: 估值最终性，是标记估值行是否为初步或最终的可选属性，用于分阶段估值运行。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationFinality
      defaultCardinality:
        minCount: 0
        maxCount: 1
    coverageInclusionReason:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/coverageInclusionReason
      namespace: fin-portfolio
      localName: coverageInclusionReason
      label: coverage inclusion reason
      definition: >-
        Coverage Inclusion Reason, is an optional note recording why a valuation line is included in a summary
        coverage, used for auditability of the coverage closure.
      cnNote: 覆盖纳入原因，是记录估值行纳入汇总覆盖原因的可选说明，用于覆盖闭包的可审计性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    exclusionReason:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/exclusionReason
      namespace: fin-portfolio
      localName: exclusionReason
      label: exclusion reason
      definition: >-
        Exclusion Reason, is an optional note recording why a valuation line is excluded from a summary coverage, used
        for auditability of the coverage closure.
      cnNote: 排除原因，是记录估值行从汇总覆盖中排除原因的可选说明，用于覆盖闭包的可审计性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    totalMarketValue:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/totalMarketValue
      namespace: fin-portfolio
      localName: totalMarketValue
      label: total market value
      definition: >-
        Total Market Value, is the Money aggregate of all valuation lines in a portfolio valuation summary, used for
        the coverage closure total.
      cnNote: 市值合计，是组合估值汇总中全部估值行的货币聚合，用于覆盖闭包合计。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    lineCount:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/lineCount
      namespace: fin-portfolio
      localName: lineCount
      label: line count
      definition: Line Count, is the cardinality of valuation lines in a portfolio valuation summary, used for verifying the coverage closure count.
      cnNote: 行数，是组合估值汇总中估值行的基数，用于核验覆盖闭包计数。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    coverageStatus:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/coverageStatus
      namespace: fin-portfolio
      localName: coverageStatus
      label: coverage status
      definition: >-
        Coverage Status, is an attribute marking whether a valuation summary coverage is complete, partial, or
        excludes members, used for stating the coverage closure result.
      cnNote: 覆盖状态，是标记估值汇总覆盖是否完整、部分或排除成员的属性，用于声明覆盖闭包结果。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/CoverageStatus
      defaultCardinality:
        minCount: 1
        maxCount: 1
    coverageDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/coverageDigest
      namespace: fin-portfolio
      localName: coverageDigest
      label: coverage digest
      definition: >-
        Coverage Digest, is a hash digest of the complete valuation-line coverage set in a summary, used for verifying
        the coverage closure.
      cnNote: 覆盖摘要，是汇总中完整估值行覆盖集的哈希摘要，用于验证覆盖闭包。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    lotSourceKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/lotSourceKind
      namespace: fin-portfolio
      localName: lotSourceKind
      label: lot source kind
      definition: >-
        Lot Source Kind, is an optional attribute marking the source lineage of a PositionLot, used so that a lot is
        not forced to be execution-derived and may originate from transfer, opening balance, corporate action, or
        manual adjustment.
      cnNote: 批来源种类，是标记持仓批来源谱系的可选属性，用于使批不再被强制为执行派生，而可源自转仓、期初余额、公司行动或手工调整。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    changeKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/changeKind
      namespace: fin-portfolio
      localName: changeKind
      label: position change kind
      definition: >-
        Position Change Kind, is an attribute marking the lifecycle kind of a PositionChange (opening balance,
        transfer, corporate-action result, exercise or assignment, manual adjustment, clearing or custody statement,
        calculated aggregation), used for tracing the non-execution lifecycle of a position.
      cnNote: 头寸变更种类，是标记头寸变更生命周期种类的属性（期初余额、转仓、公司行动结果、行权/分配、手工调整、清算/托管声明、计算聚合），用于追溯头寸的非执行生命周期。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    changeQuantity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/changeQuantity
      namespace: fin-portfolio
      localName: changeQuantity
      label: change quantity
      definition: >-
        Change Quantity, is a signed quantity applied by a PositionChange, used for recording the magnitude and
        direction of a non-execution lifecycle event.
      cnNote: 变更数量，是头寸变更应用的带符号数量，用于记录非执行生命周期事件的规模与方向。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    changeEffectiveAt:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/changeEffectiveAt
      namespace: fin-portfolio
      localName: changeEffectiveAt
      label: change effective at
      definition: Change Effective At, is the business effective instant of a PositionChange, used for ordering lifecycle events.
      cnNote: 变更生效时刻，是头寸变更的业务生效时间点，用于排序生命周期事件。
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    changeEvidence:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/changeEvidence
      namespace: fin-portfolio
      localName: changeEvidence
      label: change evidence reference
      definition: >-
        Change Evidence Reference, is an immutable reference to the source evidence of a PositionChange, used for
        proving the non-execution lifecycle event.
      cnNote: 变更证据引用，是指向头寸变更来源证据的不可变引用，用于证明非执行生命周期事件。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    adjustmentKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/adjustmentKind
      namespace: fin-portfolio
      localName: adjustmentKind
      label: lot adjustment kind
      definition: >-
        Lot Adjustment Kind, is an attribute marking the kind of a LotAdjustment (split, merge, restatement,
        corporate-action adjustment), used for tracing lot transformations.
      cnNote: 批调整种类，是标记批调整种类的属性（拆分、合并、重述、公司行动调整），用于追溯批变换。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustmentKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    quantityAdjustmentFactor:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/quantityAdjustmentFactor
      namespace: fin-portfolio
      localName: quantityAdjustmentFactor
      label: quantity adjustment factor
      definition: >-
        Quantity Adjustment Factor, is an optional ratio applied to a lot's quantity by a LotAdjustment (e.g. 2-for-1
        split), used for recording the magnitude of a transformation.
      cnNote: 数量调整因子，是批调整应用于批数量的可选比率（如 2 拆 1），用于记录变换规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    basisAdjustment:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/basisAdjustment
      namespace: fin-portfolio
      localName: basisAdjustment
      label: basis adjustment
      definition: >-
        Basis Adjustment, is an optional Money delta applied to a lot's cost basis by a LotAdjustment, used for
        recording basis restatements or corporate-action basis adjustments.
      cnNote: 基准调整，是批调整应用于批成本基准的可选货币差额，用于记录基准重述或公司行动基准调整。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    realizedQuantity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/realizedQuantity
      namespace: fin-portfolio
      localName: realizedQuantity
      label: realized quantity
      definition: >-
        Realized Quantity, is a strictly positive quantity closed out by a LotRealization, used for recording the
        scale of a lot closure.
      cnNote: 已实现数量，是批实现中平仓的严格正数量，用于记录批平仓规模。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    realizedCostBasis:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/realizedCostBasis
      namespace: fin-portfolio
      localName: realizedCostBasis
      label: realized cost basis
      definition: >-
        Realized Cost Basis, is the Money cost basis of the realized quantity, used for recording the cost side of a
        realized PnL.
      cnNote: 已实现成本基准，是已实现数量的货币成本基准，用于记录已实现盈亏的成本侧。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    realizedProceeds:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/realizedProceeds
      namespace: fin-portfolio
      localName: realizedProceeds
      label: realized proceeds
      definition: >-
        Realized Proceeds, is the Money proceeds of the realized quantity, used for recording the proceeds side of a
        realized PnL.
      cnNote: 已实现收入，是已实现数量的货币收入，用于记录已实现盈亏的收入侧。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    realizedPnl:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/realizedPnl
      namespace: fin-portfolio
      localName: realizedPnl
      label: realized PnL
      definition: >-
        Realized PnL, is the Money difference between realized proceeds and realized cost basis, used for recording the
        realized profit and loss of a lot closure.
      cnNote: 已实现盈亏，是已实现收入与已实现成本基准的货币差额，用于记录批平仓的已实现盈亏。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 1
        maxCount: 1
    comparisonFamily:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/comparisonFamily
      namespace: fin-portfolio
      localName: comparisonFamily
      label: comparison family
      definition: >-
        Comparison Family, is an attribute marking whether a ReconciliationComparison compares quantity or basis,
        used for selecting the comparison branch.
      cnNote: 比较族，是标记对账比较是比较数量还是基准的属性，用于选择比较分支。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/ComparisonFamily
      defaultCardinality:
        minCount: 1
        maxCount: 1
    comparisonResult:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/comparisonResult
      namespace: fin-portfolio
      localName: comparisonResult
      label: comparison result
      definition: >-
        Comparison Result, is an attribute marking the outcome of a ReconciliationComparison (matched, break,
        ambiguous, not comparable), used so that matched is a comparison result rather than a standalone finding.
      cnNote: 比较结果，是标记对账比较结果的属性（匹配、差异、歧义、不可比），用于使匹配成为比较结果而非独立发现。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparisonResult
      defaultCardinality:
        minCount: 1
        maxCount: 1
    comparisonProfileRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/comparisonProfileRef
      namespace: fin-portfolio
      localName: comparisonProfileRef
      label: comparison profile reference
      definition: >-
        Comparison Profile Reference, is an immutable reference to the comparison profile governing a
        ReconciliationComparison, used for fixing the comparison rules.
      cnNote: 比较画像引用，是指向治理对账比较的对账画像的不可变引用，用于固定比较规则。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    findingKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/findingKind
      namespace: fin-portfolio
      localName: findingKind
      label: reconciliation finding kind
      definition: >-
        Reconciliation Finding Kind, is an attribute marking the conclusion of a ReconciliationFinding (matched,
        quantity mismatch, basis mismatch, methodology difference, timing difference, ambiguous, not comparable,
        missing external, missing derived), used for typing the disposition-requiring result.
      cnNote: 对账发现种类，是标记对账发现结论的属性（匹配、数量差异、基准差异、方法差异、时点差异、歧义、不可比、缺外部、缺派生），用于类型化需处置的结果。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    findingSeverity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/findingSeverity
      namespace: fin-portfolio
      localName: findingSeverity
      label: finding severity
      definition: >-
        Finding Severity, is an attribute marking the severity of a ReconciliationFinding, used for prioritizing
        disposition.
      cnNote: 发现严重度，是标记对账发现严重度的属性，用于优先处置。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/FindingSeverity
      defaultCardinality:
        minCount: 1
        maxCount: 1
    resolutionKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/resolutionKind
      namespace: fin-portfolio
      localName: resolutionKind
      label: resolution kind
      definition: >-
        Resolution Kind, is an attribute marking the disposition of a ReconciliationResolution (accepted,
        investigated, corrected, waived, escalated), used for recording the outcome of a break disposition.
      cnNote: 处置种类，是标记对账处置结果的属性（接受、调查、更正、放弃、升级），用于记录差异处置结果。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    resolutionNote:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/resolutionNote
      namespace: fin-portfolio
      localName: resolutionNote
      label: resolution note
      definition: Resolution Note, is an optional free-text note recording the rationale of a ReconciliationResolution, used for auditability.
      cnNote: 处置说明，是记录对账处置理由的可选自由文本说明，用于可审计性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolutionEvidence:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/resolutionEvidence
      namespace: fin-portfolio
      localName: resolutionEvidence
      label: resolution evidence reference
      definition: >-
        Resolution Evidence Reference, is an immutable reference to the evidence supporting a ReconciliationResolution,
        used for proving the disposition.
      cnNote: 处置证据引用，是指向支持对账处置证据的不可变引用，用于证明处置。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    externalBasisMethod:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/externalBasisMethod
      namespace: fin-portfolio
      localName: externalBasisMethod
      label: external basis method
      definition: >-
        External Basis Method, is an optional attribute recording the basis method reported by the external source,
        used so that the external party may report its own method rather than be forced to the internal calculation
        definition.
      cnNote: 外部基准方法，是记录外部来源报告基准方法的可选属性，用于使外部方可报告自身方法而非被迫使用内部计算定义。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    externalStatementDate:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/externalStatementDate
      namespace: fin-portfolio
      localName: externalStatementDate
      label: external statement date
      definition: >-
        External Statement Date, is an optional date of the external statement an external cost-basis observation
        belongs to, used for grouping external observations by statement.
      cnNote: 外部声明日期，是外部成本基准观测所属外部声明的可选日期，用于按声明分组外部观测。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    externalBasisMappingStatus:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/externalBasisMappingStatus
      namespace: fin-portfolio
      localName: externalBasisMappingStatus
      label: external basis mapping status
      definition: >-
        External Basis Mapping Status, is an optional attribute marking whether the external basis method is mapped,
        unknown, or unmapped to an internal calculation definition, used so that the internal definition is an optional
        mapping rather than a disguised external method.
      cnNote: 外部基准映射状态，是标记外部基准方法是否已映射、未知或未映射到内部计算定义的可选属性，用于使内部定义成为可选映射而非伪装的外部方法。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalBasisMappingStatus
      defaultCardinality:
        minCount: 0
        maxCount: 1
    constituentKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/constituentKind
      namespace: fin-portfolio
      localName: constituentKind
      label: portfolio constituent kind
      definition: >-
        Portfolio Constituent Kind, is an attribute marking the kind of a portfolio constituent (account, sub-portfolio,
        sleeve, explicit allocation), used so that a portfolio is not restricted to an account aggregation.
      cnNote: 组合成员种类，是标记组合成员种类的属性（账户、子组合、Sleeve、显式分配），用于使组合不限于账户聚合。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituentKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    rateSource:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/rateSource
      namespace: fin-portfolio
      localName: rateSource
      label: rate source reference
      definition: >-
        Rate Source Reference, is an optional reference to the source of the FX rate used by an FXConversion, used for
        auditability of the rate provenance.
      cnNote: 汇率来源引用，是指向 FXConversion 所用 FX 汇率来源的可选引用，用于汇率谱系的可审计性。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    quoteTime:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/quoteTime
      namespace: fin-portfolio
      localName: quoteTime
      label: quote time
      definition: Quote Time, is an optional instant at which the FX rate was quoted, used for rate-staleness checks.
      cnNote: 报价时刻，是 FX 汇率报价的可选时间点，用于汇率陈旧性检查。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    rateDate:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/rateDate
      namespace: fin-portfolio
      localName: rateDate
      label: rate date
      definition: Rate Date, is an optional business date of the FX rate, used for value-date alignment.
      cnNote: 汇率日期，是 FX 汇率的可选业务日期，用于起息日对齐。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    rateFinality:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/rateFinality
      namespace: fin-portfolio
      localName: rateFinality
      label: rate finality
      definition: >-
        Rate Finality, is an optional attribute marking whether an FX rate is indicative, firm, or settled, used for
        distinguishing rate-application finality.
      cnNote: 汇率最终性，是标记 FX 汇率为指示性、确定或已结算的可选属性，用于区分汇率应用最终性。
      valueType: https://axiolune.ai/ontology/finance/portfolio-positions/RateFinality
      defaultCardinality:
        minCount: 0
        maxCount: 1
    crossRatePath:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/crossRatePath
      namespace: fin-portfolio
      localName: crossRatePath
      label: cross-rate path reference
      definition: >-
        Cross-Rate Path Reference, is an optional reference to an ordered FXRateObservation chain used to derive a
        cross rate, used for multi-leg cross-currency conversions.
      cnNote: 交叉汇率路径引用，是指向用于推导交叉汇率的有序 FXRateObservation 链的可选引用，用于多腿跨币种换算。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    authorityScopeSubject:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScopeSubject
      namespace: fin-portfolio
      localName: authorityScopeSubject
      label: authority scope subject
      definition: >-
        Authority Scope Subject, is an optional structured reference to the subject of an authority scope, used so
        that authorityScope is not free text alone.
      cnNote: 权威范围主语，是指向权威范围主语的可选结构化引用，用于使权威范围不只有自由文本。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    authorityScopeRole:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScopeRole
      namespace: fin-portfolio
      localName: authorityScopeRole
      label: authority scope role
      definition: >-
        Authority Scope Role, is an optional structured role label of an authority scope, used so that authorityScope is
        not free text alone.
      cnNote: 权威范围角色，是权威范围的可选结构化角色标签，用于使权威范围不只有自由文本。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
  identifierTypes: {}
  codeLists:
    PositionScope:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionScope
      namespace: fin-portfolio
      localName: PositionScope
      label: Position Scope
      definition: >-
        Position Scope, is a closed classification of the view under which a holding or position snapshot is observed,
        used for distinguishing custody, accounting, economic, and regulatory exposures so that a single signed quantity
        is not overloaded across views.
      cnNote: 头寸口径，是持仓或头寸快照观测视角的封闭分类，用于区分托管、核算、经济与监管敞口，避免单一符号数量跨视角过载。
      vocabulary: Position Scope
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionScope/value/custody
          notation: custody
          label: custody
          definition: snapshot reported by a custodian or clearing source
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionScope/value/accounting
          notation: accounting
          label: accounting
          definition: snapshot from the books and records accounting view
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionScope/value/economic
          notation: economic
          label: economic
          definition: snapshot of economic exposure including derivative notional exposure
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionScope/value/regulatory
          notation: regulatory
          label: regulatory
          definition: snapshot reported under a regulatory position-reporting regime
    BalanceDimension:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension
      namespace: fin-portfolio
      localName: BalanceDimension
      label: Balance Dimension
      definition: >-
        Balance Dimension, is a closed classification of sub-balance buckets for a holding or position, used for
        expressing settled, pending, available, pledged, loaned, receivable, and payable quantities so that gross long,
        gross short, and net can be reported per bucket rather than collapsed into one signed number.
      cnNote: 余额维度，是持仓或头寸子余额桶的封闭分类，用于表达已结算、待结算、可用、质押、借出、应收与应付数量，使毛多、毛空与净额可按桶分别报告而非塌缩为单一符号数。
      vocabulary: Balance Dimension
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/settled
          notation: settled
          label: settled
          definition: quantity that has settled and is held free
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/pending
          notation: pending
          label: pending
          definition: quantity that has traded but not yet settled
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/available
          notation: available
          label: available
          definition: quantity free to trade or pledge
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/pledged
          notation: pledged
          label: pledged
          definition: quantity pledged as collateral
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/loaned
          notation: loaned
          label: loaned
          definition: quantity loaned out
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/receivable
          notation: receivable
          label: receivable
          definition: quantity expected to be received
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/BalanceDimension/value/payable
          notation: payable
          label: payable
          definition: quantity expected to be delivered
    PositionSourceKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind
      namespace: fin-portfolio
      localName: PositionSourceKind
      label: Position Source Kind
      definition: >-
        Position Source Kind, is a closed source branch for holding and position snapshots, used for distinguishing
        externally reported, execution-derived, and non-execution lifecycle sources so that not every non-external
        snapshot is collapsed into execution-derived.
      cnNote: 头寸来源种类，是持仓与头寸快照的封闭来源分支，用于区分外部报告、执行派生与非执行生命周期来源，避免一切非外部快照被归为执行派生。
      vocabulary: Position Source Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/externalReported
          notation: externalReported
          label: external reported
          definition: snapshot supplied by an external account or custody source
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/executionDerived
          notation: executionDerived
          label: execution derived
          definition: snapshot derived from closed Execution lot state
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/openingBalance
          notation: openingBalance
          label: opening balance
          definition: snapshot seeded from an opening-balance import
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/transfer
          notation: transfer
          label: transfer
          definition: snapshot resulting from an inter-account or inter-portfolio transfer
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/corporateActionResult
          notation: corporateActionResult
          label: corporate action result
          definition: snapshot resulting from a corporate action (split, merger, spinoff, exercise)
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/exerciseAssignment
          notation: exerciseAssignment
          label: exercise or assignment
          definition: snapshot resulting from option exercise or assignment
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/manualAdjustment
          notation: manualAdjustment
          label: manual adjustment
          definition: snapshot adjusted by a reviewed manual book adjustment
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/clearingCustodyStatement
          notation: clearingCustodyStatement
          label: clearing or custody statement
          definition: snapshot sourced from a clearing or custody statement
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSourceKind/value/calculatedAggregation
          notation: calculatedAggregation
          label: calculated aggregation
          definition: snapshot produced by a calculated aggregation across sub-positions
    ValuationMethod:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod
      namespace: fin-portfolio
      localName: ValuationMethod
      label: Valuation Method
      definition: >-
        Valuation Method, is a closed classification of the calculation method used to derive a PortfolioValuation from
        its locked inputs, used for marking the calculation convention of a valuation. The first value,
        directUnitPriceTimesQuantity, is the method of the DirectUnitValuationProfile; additional values belong to
        other ValuationMethodFamily profiles.
      cnNote: 估值方法，是从锁定输入推导组合估值的封闭计算方法分类，用于标定估值的计算口径。首值 directUnitPriceTimesQuantity 是 DirectUnitValuationProfile 的方法；其余值属其他 ValuationMethodFamily 画像。
      vocabulary: Valuation Method
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/directUnitPriceTimesQuantity
          notation: directUnitPriceTimesQuantity
          label: direct unit price times quantity
          definition: signed snapshot quantity multiplied by exact direct-unit Money price (DirectUnitValuationProfile)
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/markToModel
          notation: markToModel
          label: mark to model
          definition: valuation derived from a theoretical pricing model
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/costBasis
          notation: costBasis
          label: cost basis
          definition: valuation at original acquisition cost
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/lowerOfCostOrMarket
          notation: lowerOfCostOrMarket
          label: lower of cost or market
          definition: valuation at the lower of cost or market
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/accruedIncome
          notation: accruedIncome
          label: accrued income
          definition: valuation of accrued income component
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod/value/notionalBased
          notation: notionalBased
          label: notional based
          definition: valuation scaled by contract notional
    CostBasisMethod:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisMethod
      namespace: fin-portfolio
      localName: CostBasisMethod
      label: Cost Basis Method
      definition: >-
        Cost Basis Method, is a closed classification of methods that derive position cost basis from exact Executions,
        allocations, fees, foreign-exchange conversions, and rounding rules, used for marking the basis calculation
        convention.
      cnNote: 成本基准方法，是从精确执行分配费用 FX 换算与舍入规则推导持仓成本基准的封闭方法分类，用于标定基准计算口径。
      vocabulary: Cost Basis Method
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: >-
            https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisMethod/value/executionAllocatedDirectUnitCost
          notation: executionAllocatedDirectUnitCost
          label: execution allocated direct unit cost
          definition: basis derived from exact execution price, allocation quantity, fees, FX, and rounding
    FeeTreatment:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FeeTreatment
      namespace: fin-portfolio
      localName: FeeTreatment
      label: Fee Treatment
      definition: Fee Treatment, is a closed branch controlling whether exact Fee facts enter basis, used for deciding how fees enter the opening basis.
      cnNote: 费用处理，是控制精确费用是否进入基准的封闭分支，用于决定费用计入开仓基准的方式。
      vocabulary: Fee Treatment
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FeeTreatment/value/included
          notation: included
          label: included
          definition: every exact Fee is fully allocated into opening basis
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FeeTreatment/value/excluded
          notation: excluded
          label: excluded
          definition: no Fee allocation enters opening basis
    LotOpeningPolicy:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotOpeningPolicy
      namespace: fin-portfolio
      localName: LotOpeningPolicy
      label: Lot Opening Policy
      definition: Lot Opening Policy, is a closed classification of policies governing how residual signed exposure from an Execution opens a PositionLot, used for constraining the opening approach.
      cnNote: 批开立策略，是规定执行残余带符号敞口如何开立持仓批的封闭策略分类，用于约束开仓方式。
      vocabulary: Lot Opening Policy
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotOpeningPolicy/value/openingRemainder
          notation: openingRemainder
          label: opening remainder
          definition: at most one residual lot is opened per execution account instrument and definition tuple
    LotConsumptionPolicy:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy
      namespace: fin-portfolio
      localName: LotConsumptionPolicy
      label: Lot Consumption Policy
      definition: Lot Consumption Policy, is a closed reviewed classification of deterministic lot selection policies, used for specifying the consumption order or explicit designation of consumed lots.
      cnNote: 批消耗策略，是受审的确定性批选择策略分类，用于规定消耗批的先后顺序或显式指定方式。
      vocabulary: Lot Consumption Policy
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy/value/fifo
          notation: fifo
          label: FIFO
          definition: consume oldest eligible lot first by reviewed key
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy/value/lifo
          notation: lifo
          label: LIFO
          definition: consume newest eligible lot first by reviewed key
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotConsumptionPolicy/value/specificIdentification
          notation: specificIdentification
          label: specific identification
          definition: consume exact explicitly identified lots
    PositionLotAllocationKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind
      namespace: fin-portfolio
      localName: PositionLotAllocationKind
      label: Position Lot Allocation Kind
      definition: >-
        Position Lot Allocation Kind, is a closed classification distinguishing an allocation that opens a new
        PositionLot from one that consumes an existing PositionLot, used for marking the nature of an allocation.
      cnNote: 持仓批分配种类，是区分开立新批与消耗已有批的封闭分类，用于标定一条分配的性质。
      vocabulary: Position Lot Allocation Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind/value/opening
          notation: opening
          label: opening
          definition: allocation opens the original signed lot quantity
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocationKind/value/consumption
          notation: consumption
          label: consumption
          definition: allocation consumes prior remaining lot quantity
    FXConversionDirection:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection
      namespace: fin-portfolio
      localName: FXConversionDirection
      label: FX Conversion Direction
      definition: FX Conversion Direction, is a closed orientation classification for applying the canonical FX rate equation, used for determining the conversion direction between base and quote.
      cnNote: FX 换算方向，是应用规范汇率方程的封闭方向分类，用于确定基准与报价之间的换算方向。
      vocabulary: FX Conversion Direction
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection/value/baseToQuote
          notation: baseToQuote
          label: base to quote
          definition: output amount equals input amount multiplied by the rate
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionDirection/value/quoteToBase
          notation: quoteToBase
          label: quote to base
          definition: output amount equals input amount divided by the rate
    PortfolioReconciliationKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind
      namespace: fin-portfolio
      localName: PortfolioReconciliationKind
      label: Portfolio Reconciliation Kind
      definition: Portfolio Reconciliation Kind, is a closed classification of external-versus-derived position and basis comparison results, used for marking the conclusion of a reconciliation finding.
      cnNote: 组合对账种类，是外部与派生头寸及基准比较的封闭结果分类，用于标定对账发现的结论。
      vocabulary: Portfolio Reconciliation Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/matched
          notation: matched
          label: matched
          definition: exact compared values agree
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/quantityMismatch
          notation: quantityMismatch
          label: quantity mismatch
          definition: external and derived signed quantities differ
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/basisMismatch
          notation: basisMismatch
          label: basis mismatch
          definition: external and derived cost basis differ
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/missingExternal
          notation: missingExternal
          label: missing external
          definition: complete comparison has no external evidence
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/missingDerived
          notation: missingDerived
          label: missing derived
          definition: complete comparison has no execution-derived evidence
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/ambiguous
          notation: ambiguous
          label: ambiguous
          definition: comparison cannot be uniquely classified due to multiple plausible readings
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/notComparable
          notation: notComparable
          label: not comparable
          definition: external and derived evidence are not on a comparable basis
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/timingDifference
          notation: timingDifference
          label: timing difference
          definition: external and derived evidence differ only due to statement or as-of timing
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioReconciliationKind/value/methodologyDifference
          notation: methodologyDifference
          label: methodology difference
          definition: external and derived evidence differ due to differing calculation methodologies
    ValuationFinality:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationFinality
      namespace: fin-portfolio
      localName: ValuationFinality
      label: Valuation Finality
      definition: >-
        Valuation Finality, is a closed classification of whether a valuation line is preliminary or final, used for
        staged valuation runs.
      cnNote: 估值最终性，是估值行是否为初步或最终的封闭分类，用于分阶段估值运行。
      vocabulary: Valuation Finality
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationFinality/value/preliminary
          notation: preliminary
          label: preliminary
          definition: valuation line is preliminary and may be revised
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationFinality/value/final
          notation: final
          label: final
          definition: valuation line is final and will not be revised
    CoverageStatus:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CoverageStatus
      namespace: fin-portfolio
      localName: CoverageStatus
      label: Coverage Status
      definition: >-
        Coverage Status, is a closed classification of whether a portfolio valuation summary coverage is complete,
        partial, or excludes members, used for stating the coverage closure result.
      cnNote: 覆盖状态，是组合估值汇总覆盖是否完整、部分或排除成员的封闭分类，用于声明覆盖闭包结果。
      vocabulary: Coverage Status
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/CoverageStatus/value/complete
          notation: complete
          label: complete
          definition: all member valuations are included
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/CoverageStatus/value/partial
          notation: partial
          label: partial
          definition: some member valuations are included and some are pending
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/CoverageStatus/value/excludesMembers
          notation: excludesMembers
          label: excludes members
          definition: some members are intentionally excluded with a recorded reason
    PositionChangeKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind
      namespace: fin-portfolio
      localName: PositionChangeKind
      label: Position Change Kind
      definition: >-
        Position Change Kind, is a closed classification of non-execution lifecycle kinds of a position change
        (opening balance, transfer, corporate-action result, exercise or assignment, manual adjustment, clearing or
        custody statement, calculated aggregation), used for tracing the non-execution lifecycle of a position.
      cnNote: 头寸变更种类，是头寸变更非执行生命周期种类的封闭分类（期初余额、转仓、公司行动结果、行权/分配、手工调整、清算/托管声明、计算聚合），用于追溯头寸的非执行生命周期。
      vocabulary: Position Change Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/openingBalance
          notation: openingBalance
          label: opening balance
          definition: change seeds an opening balance
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/transfer
          notation: transfer
          label: transfer
          definition: change moves quantity between accounts or portfolios
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/corporateActionResult
          notation: corporateActionResult
          label: corporate action result
          definition: change results from a corporate action
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/exerciseAssignment
          notation: exerciseAssignment
          label: exercise or assignment
          definition: change results from option exercise or assignment
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/manualAdjustment
          notation: manualAdjustment
          label: manual adjustment
          definition: change is a reviewed manual book adjustment
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/clearingCustodyStatement
          notation: clearingCustodyStatement
          label: clearing or custody statement
          definition: change is sourced from a clearing or custody statement
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChangeKind/value/calculatedAggregation
          notation: calculatedAggregation
          label: calculated aggregation
          definition: change is produced by a calculated aggregation
    LotAdjustmentKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustmentKind
      namespace: fin-portfolio
      localName: LotAdjustmentKind
      label: Lot Adjustment Kind
      definition: >-
        Lot Adjustment Kind, is a closed classification of lot transformations (split, merge, restatement,
        corporate-action adjustment), used for tracing lot lifecycle transformations.
      cnNote: 批调整种类，是批变换的封闭分类（拆分、合并、重述、公司行动调整），用于追溯批生命周期变换。
      vocabulary: Lot Adjustment Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustmentKind/value/split
          notation: split
          label: split
          definition: one lot is split into multiple lots
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustmentKind/value/merge
          notation: merge
          label: merge
          definition: multiple lots are merged into one lot
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustmentKind/value/restatement
          notation: restatement
          label: restatement
          definition: lot quantity or basis is restated without a corporate action
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustmentKind/value/corporateActionAdjustment
          notation: corporateActionAdjustment
          label: corporate action adjustment
          definition: lot quantity or basis is adjusted by a corporate action
    ComparisonFamily:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ComparisonFamily
      namespace: fin-portfolio
      localName: ComparisonFamily
      label: Comparison Family
      definition: >-
        Comparison Family, is a closed classification of whether a reconciliation comparison compares quantity or
        basis, used for selecting the comparison branch.
      cnNote: 比较族，是对账比较是否比较数量或基准的封闭分类，用于选择比较分支。
      vocabulary: Comparison Family
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ComparisonFamily/value/quantity
          notation: quantity
          label: quantity
          definition: comparison compares external and derived quantities
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ComparisonFamily/value/basis
          notation: basis
          label: basis
          definition: comparison compares external and derived cost bases
    ReconciliationComparisonResult:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparisonResult
      namespace: fin-portfolio
      localName: ReconciliationComparisonResult
      label: Reconciliation Comparison Result
      definition: >-
        Reconciliation Comparison Result, is a closed classification of the outcome of a reconciliation comparison
        (matched, break, ambiguous, not comparable), used so that matched is a comparison result rather than a
        standalone finding.
      cnNote: 对账比较结果，是对账比较结果的封闭分类（匹配、差异、歧义、不可比），用于使匹配成为比较结果而非独立发现。
      vocabulary: Reconciliation Comparison Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparisonResult/value/matched
          notation: matched
          label: matched
          definition: compared values agree
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparisonResult/value/break
          notation: break
          label: break
          definition: compared values differ and require a finding
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparisonResult/value/ambiguous
          notation: ambiguous
          label: ambiguous
          definition: comparison cannot be uniquely classified
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparisonResult/value/notComparable
          notation: notComparable
          label: not comparable
          definition: compared values are not on a comparable basis
    ReconciliationFindingKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind
      namespace: fin-portfolio
      localName: ReconciliationFindingKind
      label: Reconciliation Finding Kind
      definition: >-
        Reconciliation Finding Kind, is a closed classification of the conclusion of a reconciliation finding (matched,
        quantity mismatch, basis mismatch, methodology difference, timing difference, ambiguous, not comparable,
        missing external, missing derived), used for typing the disposition-requiring result.
      cnNote: 对账发现种类，是对账发现结论的封闭分类（匹配、数量差异、基准差异、方法差异、时点差异、歧义、不可比、缺外部、缺派生），用于类型化需处置的结果。
      vocabulary: Reconciliation Finding Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/matched
          notation: matched
          label: matched
          definition: compared values agree (compatibility value; primarily a comparison result)
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/quantityMismatch
          notation: quantityMismatch
          label: quantity mismatch
          definition: external and derived signed quantities differ
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/basisMismatch
          notation: basisMismatch
          label: basis mismatch
          definition: external and derived cost bases differ
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/methodologyDifference
          notation: methodologyDifference
          label: methodology difference
          definition: external and derived evidence differ due to differing methodologies
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/timingDifference
          notation: timingDifference
          label: timing difference
          definition: external and derived evidence differ only due to timing
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/ambiguous
          notation: ambiguous
          label: ambiguous
          definition: comparison cannot be uniquely classified
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/notComparable
          notation: notComparable
          label: not comparable
          definition: compared values are not on a comparable basis
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/missingExternal
          notation: missingExternal
          label: missing external
          definition: complete comparison has no external evidence
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationFindingKind/value/missingDerived
          notation: missingDerived
          label: missing derived
          definition: complete comparison has no execution-derived evidence
    FindingSeverity:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FindingSeverity
      namespace: fin-portfolio
      localName: FindingSeverity
      label: Finding Severity
      definition: >-
        Finding Severity, is a closed classification of the severity of a reconciliation finding (low, medium, high,
        critical), used for prioritizing disposition.
      cnNote: 发现严重度，是对账发现严重度的封闭分类（低、中、高、严重），用于优先处置。
      vocabulary: Finding Severity
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FindingSeverity/value/low
          notation: low
          label: low
          definition: minor or informational difference
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FindingSeverity/value/medium
          notation: medium
          label: medium
          definition: notable difference requiring review
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FindingSeverity/value/high
          notation: high
          label: high
          definition: significant difference requiring prompt disposition
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/FindingSeverity/value/critical
          notation: critical
          label: critical
          definition: difference that must be resolved before downstream use
    ResolutionKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind
      namespace: fin-portfolio
      localName: ResolutionKind
      label: Resolution Kind
      definition: >-
        Resolution Kind, is a closed classification of the disposition of a reconciliation resolution (accepted,
        investigated, corrected, waived, escalated), used for recording the outcome of a break disposition.
      cnNote: 处置种类，是对账处置结果的封闭分类（接受、调查、更正、放弃、升级），用于记录差异处置结果。
      vocabulary: Resolution Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind/value/accepted
          notation: accepted
          label: accepted
          definition: the finding is accepted as-is with no change
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind/value/investigated
          notation: investigated
          label: investigated
          definition: the finding is under investigation
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind/value/corrected
          notation: corrected
          label: corrected
          definition: the underlying data was corrected to resolve the finding
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind/value/waived
          notation: waived
          label: waived
          definition: the finding is waived with a recorded rationale
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ResolutionKind/value/escalated
          notation: escalated
          label: escalated
          definition: the finding is escalated to a higher authority
    ExternalBasisMappingStatus:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalBasisMappingStatus
      namespace: fin-portfolio
      localName: ExternalBasisMappingStatus
      label: External Basis Mapping Status
      definition: >-
        External Basis Mapping Status, is a closed classification of whether an external basis method is mapped,
        unknown, or unmapped to an internal calculation definition, used so that the internal definition is an optional
        mapping rather than a disguised external method.
      cnNote: 外部基准映射状态，是外部基准方法是否已映射、未知或未映射到内部计算定义的封闭分类，用于使内部定义成为可选映射而非伪装的外部方法。
      vocabulary: External Basis Mapping Status
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalBasisMappingStatus/value/mapped
          notation: mapped
          label: mapped
          definition: external method is mapped to an internal calculation definition
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalBasisMappingStatus/value/unknown
          notation: unknown
          label: unknown
          definition: external method mapping is unknown
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalBasisMappingStatus/value/unmapped
          notation: unmapped
          label: unmapped
          definition: external method is not mapped to any internal calculation definition
    PortfolioConstituentKind:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituentKind
      namespace: fin-portfolio
      localName: PortfolioConstituentKind
      label: Portfolio Constituent Kind
      definition: >-
        Portfolio Constituent Kind, is a closed classification of the kind of a portfolio constituent (account,
        sub-portfolio, sleeve, explicit allocation), used so that a portfolio is not restricted to an account
        aggregation.
      cnNote: 组合成员种类，是组合成员种类的封闭分类（账户、子组合、Sleeve、显式分配），用于使组合不限于账户聚合。
      vocabulary: Portfolio Constituent Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituentKind/value/account
          notation: account
          label: account
          definition: constituent is a FinancialAccount
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituentKind/value/subPortfolio
          notation: subPortfolio
          label: sub-portfolio
          definition: constituent is a sub-portfolio
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituentKind/value/sleeve
          notation: sleeve
          label: sleeve
          definition: constituent is a management subdivision (sleeve) of the portfolio
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituentKind/value/explicitAllocation
          notation: explicitAllocation
          label: explicit allocation
          definition: constituent is an explicit allocation target
    RateFinality:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/RateFinality
      namespace: fin-portfolio
      localName: RateFinality
      label: Rate Finality
      definition: >-
        Rate Finality, is a closed classification of whether an FX rate is indicative, firm, or settled, used for
        distinguishing rate-application finality.
      cnNote: 汇率最终性，是 FX 汇率为指示性、确定或已结算的封闭分类，用于区分汇率应用最终性。
      vocabulary: Rate Finality
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/RateFinality/value/indicative
          notation: indicative
          label: indicative
          definition: rate is indicative and may change
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/RateFinality/value/firm
          notation: firm
          label: firm
          definition: rate is firm for a binding quote
        - iri: https://axiolune.ai/ontology/finance/portfolio-positions/RateFinality/value/settled
          notation: settled
          label: settled
          definition: rate has settled and is final
  constraints:
    PortfolioContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioContract
      namespace: fin-portfolio
      localName: PortfolioContract
      label: Portfolio Contract
      definition: validation contract for stable Portfolio identity scoped by an identifying authority
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          stable(portfolioId); exactly one logical portfolioIdentifyingAuthority;
          logicalKey(portfolioIdentifyingAuthority.logicalIri, portfolioId); versionKey(validFrom,knowledgeFrom,
          availableFrom,revision)
      severity: Error
      message: portfolio identity or standard version key is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
    PortfolioObservationStreamContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStreamContract
      namespace: fin-portfolio
      localName: PortfolioObservationStreamContract
      label: Portfolio Observation Stream Contract
      definition: validation contract for provider-scoped observation-stream identity separated from byte-locked ingestion semantics
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(portfolioObservationStreamProvider.logicalIri, portfolioObservationStreamId) is the stable stream
          identity; source-contract, completeness-contract, pagination-contract, and source-artifact reference/digest
          pairs are version-locked ingestion semantics (version content) that do not change stream identity and are
          complete and immutable within a version; sourceLocator is present; versionKey(validFrom,knowledgeFrom,
          availableFrom,revision)
      severity: Error
      message: portfolio observation stream identity, source contract, completeness, pagination, or provenance is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
    PortfolioAccountMembershipContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipContract
      namespace: fin-portfolio
      localName: PortfolioAccountMembershipContract
      label: Portfolio Account Membership Contract
      definition: validation contract for the sole temporal portfolio-to-account membership path
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(membershipPortfolio.logicalIri,memberAccount.logicalIri, membershipId); membershipAuthority,
          authorityScope, approval, and source evidence are complete; versionKey(validFrom,knowledgeFrom,
          availableFrom,revision)
      severity: Error
      message: portfolio account membership identity, authority, approval, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembership
    PortfolioManagementMandateContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandateContract
      namespace: fin-portfolio
      localName: PortfolioManagementMandateContract
      label: Portfolio Management Mandate Contract
      definition: validation contract for temporal managing-party authority and approval
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(managedPortfolio.logicalIri,managingParty.logicalIri, mandateId); mandateAuthority, authorityScope,
          approval, and source evidence are complete; versionKey(validFrom,knowledgeFrom, availableFrom,revision)
      severity: Error
      message: portfolio mandate identity, authority, scope, approval, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandate
    PortfolioAccountMembershipClosureContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosureContract
      namespace: fin-portfolio
      localName: PortfolioAccountMembershipClosureContract
      label: Portfolio Account Membership Closure Contract
      definition: validation contract for the exact PIT-eligible membership set used by valuation
      constraintType: Dependency
      scope: Association
      expression:
        language: Custom
        expression: >-
          closedMembership equals the sorted exact-version set of all PIT-eligible memberships for closurePortfolio
          under pitRequestRef and strictly prior completed inputContextRef; membershipCount equals set cardinality;
          membershipVersionSetDigest verifies the section 5.8 digest; completed membershipClosureProbe proves no
          omission; generatingContextRef is the producer
      severity: Error
      message: portfolio membership closure set, digest, probe, or temporal input context is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosure
    HoldingSnapshotContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshotContract
      namespace: fin-portfolio
      localName: HoldingSnapshotContract
      label: Holding Snapshot Contract
      definition: validation contract for non-negative owned-interest snapshots
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          holdingQuantity.value >= 0; exactly one holdingObservationStream, holdingAccount, and holdingInstrument;
          supplied holdingListing is PIT-eligible and lists holdingInstrument; account, instrument, optional listing,
          quantity, source kind, and source evidence are immutable version content; no outgoing edge may target a
          Portfolio or Portfolio/LogicalIdentity, and fin-orders:orderSide plus fin-portfolio:positionSide are absent;
          logicalKey(holdingObservationStream.logicalIri,snapshotId) is a key-to-logical-identity bijection across
          versions; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: holding snapshot scope, non-negative quantity, listing, source, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
    PositionSnapshotContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshotContract
      namespace: fin-portfolio
      localName: PositionSnapshotContract
      label: Position Snapshot Contract
      definition: validation contract for signed-exposure snapshots with net default plus optional gross/bucket truths
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactly one positionObservationStream; positionQuantity is the signed net directional truth by default;
          where grossLongQuantity and/or grossShortQuantity are present they are absolute non-negative and authoritative
          for gross exposure (the signed net does not erase them); where balanceDimension is present grossLongQuantity
          and grossShortQuantity express that bucket; supplied positionListing is PIT-eligible and lists
          positionInstrument; account, instrument, optional listing, quantity, scope, dimension, gross quantities,
          source kind, and source evidence are immutable version content; direct Portfolio, stored side, stored basis,
          and stored PnL duplicate truths are forbidden; logicalKey(positionObservationStream.logicalIri,snapshotId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: position snapshot signed quantity, scope, listing, source, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
    PositionLotContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotContract
      namespace: fin-portfolio
      localName: PositionLotContract
      label: Position Lot Contract
      definition: validation contract for lot identity, immutable basis content, and execution-derived profile scoping
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          lotDiscriminator NFC lexical value is one of openingRemainder, adjustedRemainder, transferredLot;
          logicalKey(lotInAccount.logicalIri,lotForInstrument.logicalIri,
          openingExecution.logicalIri,costBasisDefinition.logicalIri, lotDiscriminator); originalQuantity.value != 0;
          openingGross.amount > 0; sign(openingCostBasis.amount)=sign(originalQuantity.value); execution price currency
          = basis currency forbids openingGrossFxConversion and computes openingGross directly; differing currencies
          require exactly one direction-correct exact openingGrossFxConversion whose input is allocated quantity times
          execution price and whose output equals openingGross in the basis currency; lotQuotationContract =
          openingExecution.executionQuotationContract = costBasisDefinitionQuotationContract; supplied lotAtListing is
          PIT-eligible and lists lotForInstrument; exact opening execution and definition versions, original quantity,
          gross, signed basis, calculation context, quotation, listing, lotSourceKind, and source are immutable version
          content; when lotSourceKind is executionDerived (or absent defaulting to executionDerived) the
          execution-derived opening-remainder assertions hold; when lotSourceKind is a non-execution source
          (openingBalance/transfer/corporateActionResult/exerciseAssignment/manualAdjustment/clearingCustodyStatement/
          calculatedAggregation) a derivedFromChange PositionChange is required and the opening execution may be absent
          (the execution-derived profile assertions are relaxed for non-execution lots);
          forbidden(cost,side,strategy,rowNumber,arrivalOrder);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: position lot identity, immutable execution/quotation/basis chain, sign, or source is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    PositionLotOpeningAllocationCompletenessContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotOpeningAllocationCompletenessContract
      namespace: fin-portfolio
      localName: PositionLotOpeningAllocationCompletenessContract
      label: Position Lot Opening Allocation Completeness Contract
      definition: >-
        Closed inverse-cardinality contract requiring each execution-derived PositionLot version to be targeted by
        exactly one opening PositionLotAllocation version with the same opening Execution, definition, context,
        listing, and absolute original Quantity; non-execution-sourced lots are exempt.
      constraintType: Cardinality
      scope: Association
      expression:
        language: Custom
        expression: >-
          when lotSourceKind is executionDerived (or absent defaulting to executionDerived):
          exactlyOne(inverse PositionLotAllocation.allocatedLot = this PositionLot version and
          lotAllocationKind=opening); allocationExecution = openingExecution; allocatedQuantity=abs(originalQuantity);
          allocationCostBasisDefinition=costBasisDefinition; calculation context, account, instrument, optional listing,
          unit, and quotation contract agree; when lotSourceKind is a non-execution source this contract is relaxed and
          no opening PositionLotAllocation is required
      severity: Error
      message: position lot lacks exactly one matching opening allocation
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    ValuationCalculationDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinitionContract
      namespace: fin-portfolio
      localName: ValuationCalculationDefinitionContract
      label: Valuation Calculation Definition Contract
      definition: validation contract for a locked valuation method family profile with direct-unit profile scoping
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(valuationDefinitionAuthority.logicalIri, valuationDefinitionId);
          exactly one logical valuationDefinitionAuthority; exactly one valuationDefinitionMethodFamily profile;
          when valuationDefinitionMethodFamily=DirectUnitValuationProfile then
          valuationMethod=directUnitPriceTimesQuantity; other profiles bind their own method; at least one
          exact valuationDefinitionQuotationContract and
          closedSet(valuationDefinitionQuotationContract,valuationQuotationContractCount,
          valuationQuotationContractVersionSetDigest) under RFC section 5.8; formulaDigest, inputContractDigest,
          outputContractDigest, precision and rounding ref/digest pairs, tool lock ref/digest, and runtimeDigest verify
          locked executable evidence; versionKey(validFrom,knowledgeFrom, availableFrom,revision)
      severity: Error
      message: valuation definition method, quotation input, policy, or executable evidence closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
    CostBasisCalculationDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinitionContract
      namespace: fin-portfolio
      localName: CostBasisCalculationDefinitionContract
      label: Cost Basis Calculation Definition Contract
      definition: validation contract for the sole execution-derived cost-basis specification
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(costBasisDefinitionAuthority.logicalIri, costBasisDefinitionId);
          costBasisMethod=executionAllocatedDirectUnitCost; lotOpeningPolicy=openingRemainder; exactly one reviewed fee
          treatment and lot-consumption policy; exactly one logical costBasisDefinitionAuthority, one exact
          costBasisDefinitionQuotationContract and one logical costBasisDefinitionBasisCurrency; currencyPolicy and
          fxPolicy require explicit direction-correct FXConversion before grouping; precision, rounding, implementation,
          input/output contract, tool lock, runtime, and source evidence digests are complete;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: cost-basis definition method, basis currency, quotation, policies, or evidence closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
    PortfolioValuationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuationContract
      namespace: fin-portfolio
      localName: PortfolioValuationContract
      label: Portfolio Valuation Contract
      definition: validation contract for a closed valuation header and calculation run
      constraintType: Dependency
      scope: Association
      expression:
        language: Custom
        expression: >-
          memberAccountClosure.closurePortfolio=valuedPortfolio; exact valuationDefinition fixes the sole
          valuationMethod and closed quotation-input set; exactly one reportingCurrency; conversion context ref/digest,
          PIT request ref/digest, strictly prior completed input context ref/digest, valuationRunId, and
          generatingContextRef are complete; logicalKey(valuedPortfolio.logicalIri,valuationRunId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: portfolio valuation header, member closure, definition, currency, or run evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuation
    PositionValuationInputXone:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuationInputXone
      namespace: fin-portfolio
      localName: PositionValuationInputXone
      label: Position Valuation Input Xone
      definition: executable exclusive branch requiring one exact holding or position snapshot
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(valuedHoldingSnapshot,valuedPositionSnapshot)
      severity: Error
      message: position valuation must select exactly one holding or position snapshot
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
    PositionValuationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuationContract
      namespace: fin-portfolio
      localName: PositionValuationContract
      label: Position Valuation Contract
      definition: validation contract for valuation lines with direct-unit profile scoping
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          input snapshot account belongs to valuationHeader.memberAccountClosure; snapshot instrument and supplied exact
          listing equal valuationPrice truths; snapshot Quantity unit equals the exact quotation denominator;
          valuationPrice quotation contract is a member of the valuation definition's RFC-section-5.8 closed exact
          quotation-contract set; same currency forbids valuationFxConversion and
          marketValue.amount=quantity.value*price.amount; differing currencies require exactly one direction-correct
          exact valuationFxConversion and apply the header rounding policy; marketValue currency equals
          reportingCurrency; the forbidden(line valuation method,par,accrued,inverse,notional,multiplier fallback)
          clause applies only when the valuation definition's valuationDefinitionMethodFamily=DirectUnitValuationProfile;
          under other profiles those paths are permitted; optional valuationSubjectKind, valuationFinality,
          coverageInclusionReason, and exclusionReason are immutable version content;
          logicalKey(valuationHeader.versionIri,inputSnapshot.versionIri);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: valuation line snapshot, price, quotation, currency, FX, arithmetic, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
    FXConversionContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversionContract
      namespace: fin-portfolio
      localName: FXConversionContract
      label: FX Conversion Contract
      definition: validation contract for exact PIT FX evidence and direction-correct arithmetic
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          conversionRate is PIT-eligible and base Currency != quote Currency; baseToQuote requires input currency=base,
          output currency=quote, and output.amount=input.amount*rate; quoteToBase requires input currency=quote, output
          currency=base, and output.amount=input.amount/rate; inputContextRef/digest identifies a strictly prior
          completed context; rounding policy ref/digest and generatingContextRef are complete;
          exactlyOne(conversionValuationLine, conversionOpeningLot,conversionFeeAllocation), and that consumer's exact
          forward conversion role points back here; logicalKey( conversionConsumer.versionIri,inputMoney,outputMoney,
          fxConversionDirection,conversionRate.versionIri, roundingPolicyDigest,inputContextRecordDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
