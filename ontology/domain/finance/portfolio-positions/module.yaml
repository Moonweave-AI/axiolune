        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalCostBasisObservation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalCostBasisObservation
      namespace: fin-portfolio
      localName: ExternalCostBasisObservation
      label: External Cost Basis Observation
      definition: >-
        External Cost Basis Observation, is a source-provided cost-basis observation of one account and instrument from
        a single observation stream, used for retaining the external basis independently and comparing it with the
        execution-derived basis only through typed reconciliation.
      cnNote: 外部成本基准观测，是源自单一观测流的账户工具成本基准外部报告，用于独立留存外部基准并仅通过类型化对账与执行派生基准比较。
      participantRoles:
        - id: externalBasisObservationStream
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
          minCount: 1
          maxCount: 1
          label: external basis observation stream
          definition: logical provider-owned stream that scopes externalBasisId
        - id: externalBasisAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: external basis account
          definition: logical account reported by the external source
        - id: externalBasisInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: external basis instrument
          definition: logical instrument whose basis was externally reported
        - id: externalBasisListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
