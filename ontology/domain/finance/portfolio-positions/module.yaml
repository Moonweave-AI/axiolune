module:
  moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  baseIri: https://axiolune.ai/ontology/finance/portfolio-positions/
  preferredPrefix: fin-portfolio
  version: 1.1.0
  label: Portfolio and Positions
  definition: >-
    Portfolio and Positions, is a domain module that defines a generic semantic core for portfolios, holdings, position
    lots, valuation, cost basis, and reconciliation, plus an optional direct-unit-price, execution-driven-cost,
    strict-closure, and data-ingestion implementation profile. The generic core expresses portfolio state across custody,
    accounting, economic, and regulatory views with position scope, balance dimension, and lot lifecycle; the profile
    narrows the core to a concrete operating画像. The module is lot-aware and reconciliation-aware and separates domain
    facts from runtime/reproducibility evidence.
  cnNote: 组合与持仓模块，是定义组合、持仓、头寸批、估值、成本基准与对账的通用语义核心，并附可选的“直接单价、成交驱动成本、严格闭包与数据接入”实施画像的领域模块。通用核心跨托管、核算、经济与监管视图表达组合状态，含头寸口径、余额维度与批生命周期；画像把核心收敛为具体运行画像。本模块带分批与对账能力，并把领域事实与运行可复现证据分离。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/orders-execution
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    Portfolio:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
      namespace: fin-portfolio
      localName: Portfolio
      label: Portfolio
      definition: >-
        Portfolio, is a stable managed collection whose logical identity is an authority-scoped identifier, used for
        expressing account membership and management authority through temporal associations rather than storing
        membership edges directly.
      cnNote: 投资组合，是以权威域标识为逻辑身份的稳定受管集合，用于通过时态关联表达账户成员与管理授权而非直接存储成员边。其逻辑身份由组合标识权威与组合标识共同构成。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioObservationStream:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
      namespace: fin-portfolio
      localName: PortfolioObservationStream
      label: Portfolio Observation Stream
      definition: >-
        Portfolio Observation Stream, is a provider-owned versioned data stream whose stable logical identity is the
        pair (provider, stream identifier); the source, completeness, and pagination contracts are version-locked
        ingestion semantics that mutate version content but do not change stream identity. Used for scoping the source
        identifiers, completeness contracts, and pagination contracts of holding, position, and external cost-basis
        observations. The source/completeness/pagination contracts and source-artifact digests belong to the
        execution-and-reproducibility profile.
      cnNote: 组合观测流，是提供方拥有的版本化数据流，其稳定逻辑身份为 (提供方, 流标识) 二元组；来源、完整性与分页契约是版本锁定的接入语义，改变版本内容但不改变流身份。用于界定持仓、头寸与外部成本基准观测的来源标识、完整性与分页契约。来源/完整性/分页契约与来源工件摘要属执行可复现画像。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationStreamId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationSourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationSourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationCompletenessContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationCompletenessContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationPaginationContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationPaginationContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ValuationCalculationDefinition:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
      namespace: fin-portfolio
      localName: ValuationCalculationDefinition
      label: Valuation Calculation Definition
      definition: >-
        Valuation Calculation Definition, is an authority-scoped versioned valuation specification, used for locking the
        single source of truth for direct-unit quotation input closure, formula, input/output contracts, precision,
        rounding, runtime, and tool lock.
      cnNote: 估值计算定义，是权威域内的版本化估值规范，用于锁定直接计价输入闭包、公式、输入输出契约、精度舍入与运行时工具的唯一真相。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationMethod
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationQuotationContractCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationQuotationContractVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/formulaDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/runtimeDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CostBasisCalculationDefinition:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
      namespace: fin-portfolio
      localName: CostBasisCalculationDefinition
      label: Cost Basis Calculation Definition
      definition: >-
        Cost Basis Calculation Definition, is the sole authority-scoped versioned execution-derived cost-basis
        specification, used for locking the method, quotation input, fee treatment, lot opening and consumption,
        currency and FX policy, and implementation evidence.
      cnNote: 成本基准计算定义，是权威域内唯一的执行派生成本基准规范，用于锁定方法、计价输入、费用处理、批开立与消耗、货币与 FX 策略及实现证据。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisMethod
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeTreatment
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotOpeningPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lotConsumptionPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/currencyPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/fxPolicy
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/precisionPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/roundingPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExecutionLotAllocationClosure:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      namespace: fin-portfolio
      localName: ExecutionLotAllocationClosure
      label: Execution Lot Allocation Closure
      definition: >-
        Execution Lot Allocation Closure, is a closed-world header for one exact Execution and
        CostBasisCalculationDefinition version, used for encapsulating the complete eligible lot set, selection evidence,
        and allocation-fee closure while completing conservation probes.
      cnNote: 执行批分配闭包，是针对一次执行与成本基准定义版本的闭世界头部，用于封装全部合格批、选择证据及分配费用闭包并完成守恒探针。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/eligibleLotVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/eligibleLotCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeAllocationVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeAllocationCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationClosureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/allocationClosureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeClosureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/feeClosureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/consumptionSelectionProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/consumptionSelectionProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionVersionSetDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/specificSelectionCount
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ValuationMethodFamily:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethodFamily
      namespace: fin-portfolio
      localName: ValuationMethodFamily
      label: Valuation Method Family
      definition: >-
        Valuation Method Family, is an abstract parent of valuation method profiles, used as the generic semantic core
        so that the direct-unit-price method is one concrete profile rather than the only universal valuation path.
      cnNote: 估值方法族，是估值方法画像的抽象父，用作通用语义核心，使直接单价方法成为其中一个具体画像而非唯一通用估值路径。
      abstract: true
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/valuationMethodFamilyId
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    DirectUnitValuationProfile:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/DirectUnitValuationProfile
      namespace: fin-portfolio
      localName: DirectUnitValuationProfile
      label: Direct Unit Valuation Profile
      definition: >-
        Direct Unit Valuation Profile, is the concrete valuation method profile that values a position by signed
        snapshot quantity multiplied by an exact direct-unit Money price, with contractMultiplier = 1 and forbidding
        par, accrued, inverse, notional, and multiplier fallback paths. This is where the previously global hard lock
        of directUnitPriceTimesQuantity lives; other ValuationMethodFamily profiles are not bound by these forbiddals.
      cnNote: 直接单价估值画像，是以符号快照数量乘精确直接单价货币值给头寸估值的具体估值方法画像，contractMultiplier=1 且禁止 par、应计、逆算、名义与乘数回退路径。原 directUnitPriceTimesQuantity 的全局硬锁即落于此画像；其他 ValuationMethodFamily 画像不受这些禁止约束。
      superTypes:
        - https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethodFamily
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Sleeve:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/Sleeve
      namespace: fin-portfolio
      localName: Sleeve
      label: Sleeve
      definition: >-
        Sleeve, is a management subdivision of a portfolio, used as a portfolio constituent subject so that a
        portfolio may aggregate accounts, sub-portfolios, sleeves, and explicit allocations rather than only accounts.
      cnNote: Sleeve，是组合的管理细分，用作组合成员主语，使组合可聚合账户、子组合、Sleeve 与显式分配而非仅账户。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/sleeveId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/sleeveName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    PortfolioAccountMembership:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembership
      namespace: fin-portfolio
      localName: PortfolioAccountMembership
      label: Portfolio Account Membership
      definition: >-
        Portfolio Account Membership, is an effective-dated and source-approved account ownership association, used as
        the sole graph path for resolving member accounts of a Portfolio at a PIT pivot.
      cnNote: 组合账户成员关系，是带生效期与来源审批的账户归属关联，用于作为 PIT 时刻解析组合成员账户的唯一图路径。
      participantRoles:
        - id: membershipPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: membership portfolio
          definition: logical Portfolio whose membership is asserted
        - id: memberAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: member account
          definition: logical FinancialAccount included in the Portfolio
        - id: membershipAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: membership authority
          definition: logical Party authorized to assert the membership
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioManagementMandate:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioManagementMandate
      namespace: fin-portfolio
      localName: PortfolioManagementMandate
      label: Portfolio Management Mandate
      definition: >-
        Portfolio Management Mandate, is an effective-dated and source-approved authority association from a managing
        Party over a Portfolio, used for providing the sole management path for portfolio governance queries.
      cnNote: 组合管理授权，是带生效期与来源审批的管理方对组合的授权关联，用于为组合治理查询提供唯一管理路径。
      participantRoles:
        - id: managedPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: managed portfolio
          definition: logical Portfolio governed by the mandate
        - id: managingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: managing party
          definition: logical Party receiving management authority
        - id: mandateAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: mandate authority
          definition: logical Party granting or approving the mandate
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/mandateId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioAccountMembershipClosure:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioAccountMembershipClosure
      namespace: fin-portfolio
      localName: PortfolioAccountMembershipClosure
      label: Portfolio Account Membership Closure
      definition: >-
        Portfolio Account Membership Closure, is the complete exact-version set of all effective memberships of one
        Portfolio at a PIT pivot, used for turning account absence into closed-world evidence through a completed closure
        probe.
      cnNote: 组合账户成员闭包，是某组合在 PIT 时刻全部有效成员的完整精确版本集，用于以闭包探针把账户缺席作为闭世界证据。
      participantRoles:
        - id: closurePortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
