          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/stateAllocationVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/stateExecutionClosureVersionSetDigest
          minCount: 1
