    stateAllocationClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/stateAllocationClosureProbeRef
      namespace: fin-portfolio
      localName: stateAllocationClosureProbeRef
      label: state allocation closure probe reference
      definition: State Allocation Closure Probe Reference, is an immutable reference to the completed lot-allocation completeness probe, used for proving the allocation set has no omissions.
      cnNote: 状态分配闭包探针引用，是指向已完成批分配完整性探针的不可变引用，用于证明分配集合无遗漏。
