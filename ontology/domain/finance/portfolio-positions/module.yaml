      definition: Lot Closure Probe Digest, is a hash digest of the completed open-lot closure probe, used for detecting changes to the probe record.
      cnNote: 批闭包探针摘要，是已完成开仓批闭包探针的哈希摘要，用于检测探针记录的变更。
      valueType: string
