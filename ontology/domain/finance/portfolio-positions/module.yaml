    PositionChange:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChange
      namespace: fin-portfolio
      localName: PositionChange
      label: Position Change
      definition: >-
        Position Change, is a non-execution lifecycle event that changes a position's quantity or basis, used for
        tracing opening balance, transfer, corporate-action result, exercise or assignment, manual adjustment, clearing
        or custody statement, and calculated aggregation so that a position lot is not forced to be execution-derived.
        Full corporate-action workflow remains in an independent module; this association carries only the lot/position
        result and its source-event reference.
      cnNote: 头寸变更，是改变头寸数量或基准的非执行生命周期事件，用于追溯期初余额、转仓、公司行动结果、行权/分配、手工调整、清算/托管声明与计算聚合，使持仓批不再被强制为执行派生。完整公司行动流程仍在独立模块；此关联仅承载批/头寸结果及其源事件引用。
      participantRoles:
        - id: changeAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: change account
          definition: logical FinancialAccount whose position changes
        - id: changeInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: change instrument
          definition: logical FinancialInstrument whose position changes
        - id: sourceBusinessEvent
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: source business event
          definition: optional reference to the source business event (opaque uri; foundation:BusinessEvent when available)
        - id: changeLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 0
          maxCount: null
          label: change lot
          definition: exact PositionLot versions affected by the change
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/changeKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/changeQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/changeEffectiveAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/changeEvidence
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LotAdjustment:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotAdjustment
      namespace: fin-portfolio
      localName: LotAdjustment
      label: Lot Adjustment
      definition: >-
        Lot Adjustment, is a lot transformation (split, merge, restatement, or corporate-action adjustment) that adjusts
        a lot's quantity and/or cost basis, used for tracing lot lifecycle transformations such as 2-for-1 splits and
        basis restatements without a corporate action.
      cnNote: 批调整，是调整批数量与/或成本基准的批变换（拆分、合并、重述或公司行动调整），用于追溯如 2 拆 1 与无公司行动的基准重述等批生命周期变换。
      participantRoles:
        - id: adjustedLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 1
          maxCount: 1
          label: adjusted lot
          definition: exact PositionLot version produced by the adjustment
        - id: sourceLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 0
          maxCount: null
          label: source lot
          definition: exact PositionLot version(s) consumed by the adjustment
        - id: adjustmentChange
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChange
          minCount: 1
          maxCount: 1
          label: adjustment change
          definition: exact PositionChange that drives the adjustment
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/adjustmentKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/quantityAdjustmentFactor
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/basisAdjustment
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LotRealization:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/LotRealization
      namespace: fin-portfolio
      localName: LotRealization
      label: Lot Realization
      definition: >-
        Lot Realization, is a fact that closes out a strictly positive quantity of a PositionLot, used for recording
        realized cost basis, realized proceeds, and realized PnL so that lot lifecycle includes realized outcomes.
      cnNote: 批实现，是平仓持仓批严格正数量的事实，用于记录已实现成本基准、已实现收入与已实现盈亏，使批生命周期包含已实现结果。
      participantRoles:
        - id: realizedLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 1
          maxCount: 1
          label: realized lot
          definition: exact PositionLot version closed out
        - id: realizingExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: 1
          label: realizing execution
          definition: optional exact Execution version that realized the lot
        - id: realizingChange
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionChange
          minCount: 0
          maxCount: 1
          label: realizing change
          definition: optional exact PositionChange that realized the lot for non-execution closures
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/realizedQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/realizedCostBasis
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/realizedProceeds
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/realizedPnl
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationComparison:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationComparison
      namespace: fin-portfolio
      localName: ReconciliationComparison
      label: Reconciliation Comparison
      definition: >-
        Reconciliation Comparison, is the comparison act between external and execution-derived evidence, used for
        producing a typed comparison result (matched, break, ambiguous, not comparable) so that matched is a comparison
        result rather than a standalone finding.
      cnNote: 对账比较，是外部与执行派生证据之间的比较行为，用于产出类型化比较结果（匹配、差异、歧义、不可比），使匹配成为比较结果而非独立发现。
      participantRoles:
        - id: comparedExternalSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot
          minCount: 0
          maxCount: 1
          label: compared external holding snapshot
          definition: optional exact externally reported HoldingSnapshot version
        - id: comparedExternalPositionSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: compared external position snapshot
          definition: optional exact externally reported signed PositionSnapshot version
        - id: comparedDerivedSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: compared derived snapshot
          definition: optional exact execution-derived PositionSnapshot version
        - id: comparedExternalBasis
          range: https://axiolune.ai/ontology/finance/portfolio-positions/ExternalCostBasisObservation
          minCount: 0
          maxCount: 1
          label: compared external basis
          definition: optional exact external basis observation
        - id: comparedDerivedBasis
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotStateClosure
          minCount: 0
          maxCount: 1
          label: compared derived basis
          definition: optional exact execution-derived basis closure
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/comparisonFamily
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/comparisonResult
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/comparisonProfileRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/reconciliationSubjectDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationResolution:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/ReconciliationResolution
      namespace: fin-portfolio
      localName: ReconciliationResolution
      label: Reconciliation Resolution
      definition: >-
        Reconciliation Resolution, is the disposition of a ReconciliationFinding, used for recording accepted,
        investigated, corrected, waived, or escalated outcomes so that breaks carry an explicit resolution rather than
        being silently merged.
      cnNote: 对账处置，是对账发现的处置，用于记录接受、调查、更正、放弃或升级结果，使差异带显式处置而非被静默合并。
      participantRoles:
        - id: resolvedFinding
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioPositionReconciliationFinding
          minCount: 1
          maxCount: 1
          label: resolved finding
          definition: exact ReconciliationFinding version being disposed
        - id: resolvingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: resolving party
          definition: logical Party recording the resolution
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/resolutionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/resolutionNote
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/resolutionEvidence
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioValuationSummary:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuationSummary
      namespace: fin-portfolio
      localName: PortfolioValuationSummary
      label: Portfolio Valuation Summary
      definition: >-
        Portfolio Valuation Summary, is the coverage-closure aggregate of all PositionValuation lines in one
        PortfolioValuation run, used for verifying the valuation-line coverage and total market value.
      cnNote: 组合估值汇总，是一次组合估值运行中全部头寸估值行的覆盖闭包聚合，用于验证估值行覆盖与市值合计。
      participantRoles:
        - id: valuedPortfolioRun
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioValuation
          minCount: 1
          maxCount: 1
          label: valued portfolio run
          definition: exact PortfolioValuation run version summarized
        - id: summarizedLine
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
          minCount: 0
          maxCount: null
          label: summarized line
          definition: exact PositionValuation line version included in the summary
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/totalMarketValue
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/lineCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/coverageStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/coverageDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PortfolioConstituent:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioConstituent
      namespace: fin-portfolio
      localName: PortfolioConstituent
      label: Portfolio Constituent
      definition: >-
        Portfolio Constituent, is an effective-dated association from a Portfolio to a constituent subject that may be a
        FinancialAccount, a sub-Portfolio, a Sleeve, or an explicit allocation, used so that a portfolio is not
        restricted to an account aggregation. PortfolioAccountMembership is retained as the account-kind specialization.
      cnNote: 组合成员，是从组合到成员主语（可为 FinancialAccount、子组合、Sleeve 或显式分配）的生效期关联，用于使组合不限于账户聚合。PortfolioAccountMembership 作为账户种类特化保留。
      participantRoles:
        - id: constituentPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: constituent portfolio
          definition: logical Portfolio whose membership is asserted
        - id: constituentSubject
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: constituent subject
          definition: logical constituent subject (Account, Portfolio, or Sleeve; polymorphic)
        - id: constituentAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: constituent authority
          definition: logical Party authorized to assert the constituent
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/constituentKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/membershipId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/approvalDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScopeSubject
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/authorityScopeRole
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    portfolioIdentifyingAuthority:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioIdentifyingAuthority
      namespace: fin-portfolio
      localName: portfolioIdentifyingAuthority
      label: portfolio identifying authority
      definition: >-
        Portfolio Identifying Authority, is a relationship to the logical Party whose namespace governs the stable
        portfolio identifier, used for forming the authority-scoped logical identity of a Portfolio so that the same
        portfolioId under two authorities remains unambiguous.
      cnNote: 组合标识权威，是指向治理组合稳定标识的逻辑参与方的关系，用于构成组合的权威域逻辑身份，使同一 portfolioId 在两个权威下仍可无歧义识别。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    portfolioObservationStreamProvider:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationStreamProvider
      namespace: fin-portfolio
      localName: portfolioObservationStreamProvider
      label: portfolio observation stream provider
      definition: Portfolio Observation Stream Provider, is a relationship to the logical Party that owns the namespace of a portfolio observation stream, used for defining the provider attribution of the data stream.
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/PortfolioObservationStream
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    valuationDefinitionAuthority:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/valuationDefinitionAuthority
      namespace: fin-portfolio
      localName: valuationDefinitionAuthority
      label: valuation definition authority
      definition: Valuation Definition Authority, is a relationship to the logical Party whose namespace governs the stable valuation definition identifier, used for fixing the namespace attribution of the definition.
      cnNote: 估值定义权威，是指向治理估值定义稳定标识的逻辑参与方的关系，用于固定定义的命名空间归属。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    costBasisDefinitionAuthority:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisDefinitionAuthority
      namespace: fin-portfolio
      localName: costBasisDefinitionAuthority
      label: cost basis definition authority
      definition: Cost Basis Definition Authority, is a relationship to the logical Party whose namespace governs the stable cost-basis definition identifier, used for fixing the namespace attribution of the definition.
      cnNote: 成本基准定义权威，是指向治理成本基准定义稳定标识的逻辑参与方的关系，用于固定定义的命名空间归属。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    valuationDefinitionMethodFamily:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/valuationDefinitionMethodFamily
      namespace: fin-portfolio
      localName: valuationDefinitionMethodFamily
      label: valuation definition method family
      definition: >-
        Valuation Definition Method Family, is a relationship from a valuation definition to its concrete
        ValuationMethodFamily profile, used for binding the previously global hard-locked direct-unit method to a
        profile so other profiles may coexist.
      cnNote: 估值定义方法族，是从估值定义到其具体 ValuationMethodFamily 画像的关系，用于把原全局硬锁的直接单价方法绑定到画像，使其他画像可共存。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
      range: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethodFamily
      characteristics:
        - functional
    valuationDefinitionQuotationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/valuationDefinitionQuotationContract
      namespace: fin-portfolio
      localName: valuationDefinitionQuotationContract
      label: valuation definition quotation contract
      definition: >-
        Valuation Definition Quotation Contract, is a relationship from a valuation definition to every member of its
        closed exact-version direct-unit quotation input set, used for locking the valuation input collection.
      cnNote: 估值定义计价契约，是从估值定义到其闭包内全部精确版本直接计价输入的关系，用于锁定估值的输入集合。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ValuationCalculationDefinition
      range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
    costBasisDefinitionQuotationContract:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisDefinitionQuotationContract
      namespace: fin-portfolio
      localName: costBasisDefinitionQuotationContract
      label: cost basis definition quotation contract
      definition: Cost Basis Definition Quotation Contract, is a relationship from a cost-basis definition to its exact direct-unit quotation input, used for fixing the quotation basis of cost-basis calculation.
      cnNote: 成本基准定义计价契约，是从成本基准定义到其精确直接计价输入的关系，用于固定基准计算的计价基础。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
      range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      characteristics:
        - functional
    costBasisDefinitionBasisCurrency:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/costBasisDefinitionBasisCurrency
      namespace: fin-portfolio
      localName: costBasisDefinitionBasisCurrency
      label: cost basis definition basis currency
      definition: >-
        Cost Basis Definition Basis Currency, is a relationship to the single logical Currency in which a cost-basis
        definition groups opening gross, fee effects, and basis terms, used for unifying the currency after explicit FX
        conversion.
      cnNote: 成本基准定义基准货币，是指向成本基准定义中用于汇总毛额费用与基准的唯一逻辑货币的关系，用于在 FX 换算后统一币种。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    closureExecution:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureExecution
      namespace: fin-portfolio
      localName: closureExecution
      label: closure execution
      definition: Closure Execution, is a relationship from an allocation closure to its exact Execution version, used for binding the execution prerequisite of the closure.
      cnNote: 闭包执行，是从分配闭包指向其精确执行版本的关系，用于绑定闭包的执行前提。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/orders-execution/Execution
      characteristics:
        - functional
    closureCostBasisDefinition:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureCostBasisDefinition
      namespace: fin-portfolio
      localName: closureCostBasisDefinition
      label: closure cost basis definition
      definition: Closure Cost Basis Definition, is a relationship from an allocation closure to its exact calculation definition, used for binding the calculation-specification prerequisite of the closure.
      cnNote: 闭包成本基准定义，是从分配闭包指向其精确计算定义的关系，用于绑定闭包的计算规范前提。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
      characteristics:
        - functional
    closureEligibleLot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureEligibleLot
      namespace: fin-portfolio
      localName: closureEligibleLot
      label: closure eligible lot
      definition: >-
        Closure Eligible Lot, is a relationship from an allocation closure to every exact PositionLot version eligible
        for consumption before its Execution under the exact account, instrument, listing, unit, and
        calculation-definition context, used for enumerating the eligible selection domain.
      cnNote: 闭包合格批，是从分配闭包指向其执行在精确上下文下可消耗的全部精确持仓批版本的关系，用于枚举合格选择域。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    closureSelectedLot:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureSelectedLot
      namespace: fin-portfolio
      localName: closureSelectedLot
      label: closure selected lot
      definition: >-
        Closure Selected Lot, is a relationship to the exact PositionLot version explicitly selected by
        specific-identification evidence in an allocation closure, used for specific-identification scenarios other than
        FIFO and LIFO.
      cnNote: 闭包已选批，是分配闭包中由具体识别证据显式选择的精确持仓批版本关系，用于 FIFO 与 LIFO 之外的具体识别场景。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
    closureAllocation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureAllocation
      namespace: fin-portfolio
      localName: closureAllocation
      label: closure allocation
      definition: Closure Allocation, is a relationship from an allocation closure to every included exact lot allocation, used for encapsulating the opening and consumption allocation set.
      cnNote: 闭包分配，是从分配闭包指向其包含的全部精确批分配的关系，用于封装开仓与消耗分配集合。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotAllocation
    closureFee:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureFee
      namespace: fin-portfolio
      localName: closureFee
      label: closure fee
      definition: Closure Fee, is a relationship from an allocation closure to every included exact Fee version, used for encapsulating the execution fee set.
      cnNote: 闭包费用，是从分配闭包指向其包含的全部精确费用版本的关系，用于封装执行费用集合。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/orders-execution/Fee
    closureFeeAllocation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/closureFeeAllocation
      namespace: fin-portfolio
      localName: closureFeeAllocation
      label: closure fee allocation
      definition: Closure Fee Allocation, is a relationship from an allocation closure to every included exact fee allocation, used for encapsulating the set of fee-to-lot allocations.
      cnNote: 闭包费用分配，是从分配闭包指向其包含的全部精确费用分配的关系，用于封装费用计入批的集合。
      domain: https://axiolune.ai/ontology/finance/portfolio-positions/ExecutionLotAllocationClosure
      range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotFeeAllocation
  attributeTypes:
    portfolioObservationStreamId:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationStreamId
      namespace: fin-portfolio
      localName: portfolioObservationStreamId
      label: portfolio observation stream identifier
      definition: Portfolio Observation Stream Identifier, is an immutable stable identifier of an observation stream within the provider scope, used for uniquely marking a single data stream.
      cnNote: 组合观测流标识，是观测流在提供方域内不变的稳定标识，用于唯一标记一条数据流。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    portfolioObservationSourceContractRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationSourceContractRef
      namespace: fin-portfolio
      localName: portfolioObservationSourceContractRef
      label: portfolio observation source contract reference
      definition: Portfolio Observation Source Contract Reference, is an immutable reference to the provider schema and source semantics contract, used for fixing the source specification.
      cnNote: 组合观测来源契约引用，是指向提供方模式与来源语义契约的不可变引用，用于固定来源规约。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    portfolioObservationSourceContractDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationSourceContractDigest
      namespace: fin-portfolio
      localName: portfolioObservationSourceContractDigest
      label: portfolio observation source contract digest
      definition: Portfolio Observation Source Contract Digest, is a hash digest of the source contract, used for detecting changes to the source specification.
      cnNote: 组合观测来源契约摘要，是来源契约的哈希摘要，用于检测来源规约的变更。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    portfolioObservationCompletenessContractRef:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationCompletenessContractRef
      namespace: fin-portfolio
      localName: portfolioObservationCompletenessContractRef
      label: portfolio observation completeness contract reference
      definition: Portfolio Observation Completeness Contract Reference, is an immutable reference that defines full, incremental, and partial snapshot completeness semantics, used for fixing the completeness specification.
      cnNote: 组合观测完整性契约引用，是指向定义全量增量与部分快照完整性语义的不可变引用，用于固定完整性规约。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    portfolioObservationCompletenessContractDigest:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/portfolioObservationCompletenessContractDigest
      namespace: fin-portfolio
      localName: portfolioObservationCompletenessContractDigest
      label: portfolio observation completeness contract digest
