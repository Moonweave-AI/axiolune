        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    UnrealizedPnLObservation:
      iri: https://axiolune.ai/ontology/finance/portfolio-positions/UnrealizedPnLObservation
      namespace: fin-portfolio
      localName: UnrealizedPnLObservation
      label: Unrealized PnL Observation
      definition: >-
        Unrealized PnL Observation, is a reproducible fact joining one PositionValuation and one PositionLotStateClosure,
        used for satisfying the equation that PnL equals market value minus remaining basis in the header reporting
        currency.
      cnNote: 未实现盈亏观测，是连接一次头寸估值与持仓批状态闭包的可复现事实，用于以报告币种满足盈亏等于市值减剩余基准的等式。
      participantRoles:
        - id: pnlValuation
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation
          minCount: 1
          maxCount: 1
          label: PnL valuation
          definition: exact position valuation version supplying market value
        - id: pnlLotStateClosure
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLotStateClosure
          minCount: 1
          maxCount: 1
          label: PnL lot state closure
          definition: exact lot-state closure supplying remaining cost basis
        - id: pnlCostBasisDefinition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/CostBasisCalculationDefinition
          minCount: 1
          maxCount: 1
          label: PnL cost basis definition
          definition: exact definition shared with the lot-state closure
        - id: pnlQuotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: PnL quotation contract
          definition: exact quotation contract shared by valuation and lot-state closure
        - id: pnlFxConversion
          range: https://axiolune.ai/ontology/finance/portfolio-positions/FXConversion
          minCount: 0
          maxCount: 1
          label: PnL FX conversion
          definition: optional exact conversion version shared by cross-currency valuation and basis
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/marketValue
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/remainingCostBasis
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/portfolio-positions/unrealizedPnl
