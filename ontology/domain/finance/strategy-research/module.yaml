module:
  moduleIri: https://axiolune.ai/ontology/finance/strategy-research
  baseIri: https://axiolune.ai/ontology/finance/strategy-research/
  preferredPrefix: fin-strategy
  version: 1.1.0
  label: Strategy and Research
  definition: >-
    Strategy and Research, is a finance ontology module that defines versioned specifications for research questions,
    hypotheses, protocols, factors, signals, strategies, backtests, simulated trading, performance measurement,
    attribution, and live deployment governance, used for providing typed business semantics for quantitative research,
    strategy definition, simulation, and deployment together with an optional reproducibility-evidence profile that
    locks executable implementation, input and output contracts, runtime, tool lock, and source artifact evidence
    under a single authority.
  cnNote: 策略与研究模块，是本体工程中定义研究问题、假设、协议、因子、信号、策略、回测、模拟交易、业绩度量、归因与实盘部署治理的领域模块，旨在为量化研究、策略定义、模拟与部署提供类型化业务语义，并提供可选的可复现证据画像，在单一权威下锁定可执行实现、输入输出契约、运行时、工具锁与源制品证据。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
    - moduleIri: https://axiolune.ai/ontology/finance/orders-execution
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    SignalGenerator:
      iri: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      namespace: fin-strategy
      localName: SignalGenerator
      abstract: true
      label: Signal Generator
      definition: >-
        Signal Generator, is an abstract versioned specification that generates research signals or strategy decisions
        under a single authority, used as the common base type of FactorDefinition and StrategyDefinition. The audit-grade
        executable evidence (implementation, input and output contracts, runtime, tool lock, and source artifact) is
        carried as optional profile-scoped attributes governed by the ValidatedReproducibleRun profile.
      cnNote: 信号生成器，是带版本的研究信号或策略决策生成规范的抽象类型，是因子定义与策略定义的共同基类。其审计级可执行证据（实现、输入输出契约、运行时、工具锁与源制品）作为可选画像作用域属性，由 ValidatedReproducibleRun 画像治理。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/generatorId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/generatorName
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/implementationDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/outputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runtimeDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FactorDefinition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
      namespace: fin-strategy
      localName: FactorDefinition
      label: Factor Definition
      definition: >-
        Factor Definition, is a signal generator specification that defines one quantitative factor together with its
        executable expression and value contract, used for characterizing the factor itself rather than storing its
        computed observations. Its subject is generalized beyond a single instrument via the FactorSubject role family
        on FactorObservation, and its category is split into input provenance and construction method.
      cnNote: 因子定义，是定义一个量化因子及其可执行表达式与取值契约的信号生成器子类，用于刻画因子本身而不存储其计算观测结果。其主体经 FactorObservation 上的 FactorSubject 角色族泛化为超越单一工具，其类别拆分为输入来源与构造方法。
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorExpressionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorExpressionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorCategory
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorInputProvenance
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorConstructionMethod
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StrategyDefinition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
      namespace: fin-strategy
      localName: StrategyDefinition
      label: Strategy Definition
      definition: >-
        Strategy Definition, is a signal generator specification that defines one trading or allocation strategy together
        with its objective, mandate, universe, portfolio construction, rebalance, risk, and execution intent, used for
        modeling the strategy as an investment decision rule rather than merely a factor consumer, and for modeling each
        factor dependency as an explicit exact-version relation rather than an implicit source-code import. The factor
        dependency is optional; a factor-strategy profile enforces at least one factor.
      cnNote: 策略定义，是定义一个交易或配置策略及其目标、授权、投资域、组合构造、再平衡、风险与执行意图的信号生成器子类，用于把策略建模为投资决策规则而非仅仅是因子消费者，并把对每个因子的依赖显式建模为精确版本关系。因子依赖为可选；因子策略画像强制至少一个因子。
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/strategyDescription
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/strategyObjective
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/strategyMandateKind
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RunContext:
      iri: https://axiolune.ai/ontology/finance/strategy-research/RunContext
      namespace: fin-strategy
      localName: RunContext
      label: Run Context
      definition: >-
        Run Context, is a versioned execution context that fixes the identity of one research, backtest, or live run
        together with its input snapshots, used for locking parameters, ontology, mappings, calendar, compiler, and PIT
        validation requests to ensure reproducibility. The strict prior-completed input context and passed PIT request
        are profile-scoped under ValidatedReproducibleRun; run timing is split into planned, started, scheduled, and
        completed instants so a planned run need not assert an actual start.
      cnNote: 运行上下文，是固定一次研究、回测或实盘运行身份与输入快照的带版本执行上下文，用于锁定参数、本体、映射、日历、编译器与 PIT 校验请求以实现可复现。严格在先完成的输入上下文与通过的 PIT 请求由 ValidatedReproducibleRun 画像作用域化；运行时序拆分为计划、开始、计划执行与完成时刻，使计划中的运行不必断言实际开始。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runContextKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runStartedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/plannedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/scheduledFor
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/completedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runAttemptStatus
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/parameterSnapshotRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/parameterSnapshotDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/ontologyClosureDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/mappingClosureDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calendarSnapshotRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calendarSnapshotDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/compilerDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContextRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContextRecordDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitRequestRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitRequestRecordDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BacktestRun:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
      namespace: fin-strategy
      localName: BacktestRun
      label: Backtest Run
      definition: >-
        Backtest Run, is a run context that applies one exact strategy version to a half-open historical interval, used
        for locking immutable configuration such as capital, costs, slippage, fills, and benchmark, and for binding an
        exact StrategyExecutionPackage whose strategy, executable implementation, factor-dependency closure, and input
        contract must be mutually consistent; mutable run state is excluded and recorded separately by status facts,
        and simulated trading is recorded by SimulatedOrder, SimulatedFill, SimulatedPortfolioState, and
        SimulatedReturnSeries facts under a MarketSimulationPolicy. The audit-grade configuration digests are
        profile-scoped under ValidatedReproducibleRun.
      cnNote: 回测运行，是把一个精确策略版本应用于半开历史区间的运行上下文子类，用于锁定资本、费用、滑点、成交与基准等不可变配置，并绑定一个精确 StrategyExecutionPackage，其策略、可执行实现、因子依赖闭包与输入契约须相互一致；运行状态由状态事实另行记录，模拟交易由 SimulatedOrder、SimulatedFill、SimulatedPortfolioState 与 SimulatedReturnSeries 事实在 MarketSimulationPolicy 下记录。审计级配置摘要由 ValidatedReproducibleRun 画像作用域化。
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/RunContext
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/simulationFrom
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/simulationTo
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/initialCapital
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/codeDefinitionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/feeAssumptionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/feeAssumptionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/slippageAssumptionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/slippageAssumptionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/fillAssumptionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/fillAssumptionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/deterministicSeed
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ResearchRun:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ResearchRun
      namespace: fin-strategy
      localName: ResearchRun
      label: Research Run
      definition: >-
        Research Run, is a run context that evaluates one exact signal-generator version against a research question,
        hypothesis, protocol, and dataset snapshot, used for producing reproducible and falsifiable research conclusions
        under locked mappings, tools, parameters, and seed. The research question, dataset, and output contract are
        exposed as typed business objects (ResearchQuestion, DatasetSnapshot) with their digests retained as evidence;
        sample partitioning, walk-forward folds, model selection, and statistical test results are recorded by their
        own facts.
      cnNote: 研究运行，是针对一个研究问题、假设、协议与数据集快照评估信号生成器版本的运行上下文子类，用于在锁定的映射、工具、参数与种子下产出可复现且可证伪的研究结论。研究问题、数据集与输出契约以类型化业务对象（ResearchQuestion、DatasetSnapshot）暴露，其摘要保留为证据；样本划分、walk-forward 折、模型选择与统计检验结果由各自事实记录。
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/RunContext
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchQuestionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchQuestionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchDatasetRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchDatasetDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchOutputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/deterministicSeed
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MetricDefinition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
      namespace: fin-strategy
      localName: MetricDefinition
      label: Metric Definition
      definition: >-
        Metric Definition, is a versioned specification that fixes the value representation and executable formula of
        one performance or attribution metric together with its metric kind, directionality, return convention, and
        annualization convention, used for locking the implementation, input and output contracts, runtime, and tool lock
        to ensure the metric is reproducible. The formula artifact is locatable and auditable via its reference and
        locator, not only its digest.
      cnNote: 指标定义，是固定一种业绩或归因指标的取值表示与可执行公式及其指标类别、方向性、收益约定与年化约定的带版本规范，用于锁定实现、输入输出契约、运行时与工具锁以确保指标可复现。公式制品通过其引用与定位符可定位可审计，而非仅凭摘要。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricName
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricValueKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricDirectionality
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/returnConvention
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/annualizationConvention
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/formulaDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/formulaArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/formulaArtifactLocator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/implementationDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/outputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runtimeDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CalculationContext:
      iri: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
      namespace: fin-strategy
      localName: CalculationContext
      label: Calculation Context
      definition: >-
        Calculation Context, is a versioned calculation context that fixes the metric calculation frequency,
        annualization, risk-free rate, window, confidence, and result-affecting policies, used for freezing the complete
        parameter policy as an immutable snapshot to enable reproducible performance comparison. The market calendar,
        time zone, session anchor, maximum staleness, and fill-value marking are exposed as a queryable
        CalendarAnchoringPolicy rather than a hard-coded universal axiom, and the benchmark is expressed via a versioned
        BenchmarkSpecification.
      cnNote: 计算上下文，是固定指标计算频率、年化、无风险利率、窗口、置信度与各类策略的带版本计算上下文，用于把完整参数策略以不可变快照形式固化以实现可复现的业绩比较。市场日历、时区、session 锚点、最大陈旧期与填充值标记以可查询 CalendarAnchoringPolicy 暴露，而非硬编码为通用公理；基准以版本化 BenchmarkSpecification 表达。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationFrequency
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/annualizationFactor
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/riskFreeRate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationWindow
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/confidenceLevel
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationImplementationDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationParameterSnapshotRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationParameterSnapshotDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationParameterSnapshotLocator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ResearchQuestion:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ResearchQuestion
      namespace: fin-strategy
      localName: ResearchQuestion
      label: Research Question
      definition: >-
        Research Question, is a versioned specification of one falsifiable research question together with its
        hypothesis and protocol, used for exposing the research question as a queryable business object rather than a
        digest-locked artifact; the artifact digest is retained as evidence.
      cnNote: 研究问题，是定义一个可证伪研究问题及其假设与协议的带版本规范，用于把研究问题作为可查询业务对象暴露，而非仅以摘要锁定的制品；制品摘要保留为证据。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchQuestionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchQuestionText
          minCount: 1
