  constraints:
    SignalGeneratorEvidenceContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/SignalGeneratorEvidenceContract
      namespace: fin-strategy
      localName: SignalGeneratorEvidenceContract
      label: Signal Generator Evidence Contract
      definition: Validation rule that closes SignalGenerator identity and all executable implementation evidence.
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          directType in {FactorDefinition,StrategyDefinition}; logicalKey(generatorAuthority.logicalIri,generatorId);
          eachExactlyOne(implementationDigest,inputContractDigest,outputContractDigest,toolLockRef,toolLockDigest,runtimeDigest,sourceArtifactRef,sourceArtifactDigest,sourceLocator);
          digestClosureVerified=true
      severity: Error
      message: SignalGenerator identity or executable evidence closure is incomplete.
    RunInputClosureContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/RunInputClosureContract
      namespace: fin-strategy
      localName: RunInputClosureContract
      label: Run Input Closure Contract
      definition: >-
        Validation rule that requires one strictly prior completed input context and matching passed three-axis PIT
        request for every RunContext.
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(runAuthority.logicalIri,runContextId); pair(inputContextRef,inputContextRecordDigest);
          pair(pitRequestRef,pitRequestRecordDigest); inputContext.completedAt < runStartedAt;
          inputContext.status=completed; pitReport.status=passed; pitReport.requestRef=pitRequestRef;
          pitReport.contextRef=inputContextRef
      severity: Error
      message: RunContext lacks a strictly prior completed materialization context or matching passed PIT request.
    BacktestConfigurationContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestConfigurationContract
      namespace: fin-strategy
      localName: BacktestConfigurationContract
      label: Backtest Configuration Contract
      definition: >-
        Validation rule that closes immutable BacktestRun inputs and keeps lifecycle status outside the run
        configuration.
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          runContextKind=backtest; simulationFrom < simulationTo;
          eachExactlyOne(initialCapital,codeDefinitionDigest,feeAssumptionRef,feeAssumptionDigest,slippageAssumptionRef,slippageAssumptionDigest,fillAssumptionRef,fillAssumptionDigest,benchmarkRef,benchmarkDigest,deterministicSeed);
          forbidden(backtestLifecycleState); corporateActionInputResolvedOnlyThroughCompletedInputContext=true
      severity: Error
      message: BacktestRun configuration is incomplete mutable or not bound to closed historical input evidence.
    ResearchRunContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ResearchRunContract
      namespace: fin-strategy
      localName: ResearchRunContract
      label: Research Run Contract
      definition: >-
        Validation rule that closes a ResearchRun question dataset output contract generator and deterministic execution
        evidence.
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          runContextKind=research; pair(researchQuestionRef,researchQuestionDigest);
          pair(researchDatasetRef,researchDatasetDigest);
          eachExactlyOne(researchOutputContractDigest,deterministicSeed,researchGenerator)
      severity: Error
      message: ResearchRun lacks an exact question dataset generator output contract or deterministic seed.
    MetricDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinitionContract
      namespace: fin-strategy
      localName: MetricDefinitionContract
      label: Metric Definition Contract
      definition: >-
        Validation rule that fixes one metric identity value representation formula implementation and executable
        closure.
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(metricAuthority.logicalIri,metricDefinitionId); metricValueKind in {money,quantity};
          eachExactlyOne(formulaDigest,implementationDigest,inputContractDigest,outputContractDigest,toolLockRef,toolLockDigest,runtimeDigest)
      severity: Error
      message: MetricDefinition identity value kind or executable evidence closure is incomplete.
    CalculationContextContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/CalculationContextContract
      namespace: fin-strategy
      localName: CalculationContextContract
      label: Calculation Context Contract
      definition: >-
        Validation rule that fixes one calculation-context identity, frequency, implementation, paired benchmark, and
        byte-authenticated closed parameter-policy snapshot.
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(calculationAuthority.logicalIri,calculationContextId);
          eachExactlyOne(calculationFrequency,calculationImplementationDigest,calculationParameterSnapshotRef,
          calculationParameterSnapshotDigest,calculationParameterSnapshotLocator);
          selectedBytes(calculationParameterSnapshotRef,calculationParameterSnapshotLocator)=
          calculationParameterSnapshotDigest;
          snapshotMatchesContext(calculationParameterSnapshotRef,calculationFrequency,annualizationFactor,
          riskFreeRate,calculationWindow,confidenceLevel,benchmarkRef,benchmarkDigest);
          closedCalculationPolicies(returnKind in {simple,log},aggregationMode in {compound,sum}, missingValuePolicy in
          {dropPaired,zeroFill,reject},calendarTimeZone=UTC, resampleAnchorForFrequency in
          {perObservation:observation,daily:sessionClose,weekly:weekMonday,
          monthly:monthEnd,fullRun:fullRun},benchmarkAlignment in
          {none,exactIndexIntersection,forwardFillPastObservationThenIntersect}, volatilityMatch in
          {disabled,sampleStandardDeviationRatio}); forbidden(backfillFutureObservation,backwardFill,lookAheadFill);
          pairOrAbsent(benchmarkRef,benchmarkDigest); ratioOrAbsent(annualizationFactor,riskFreeRate,confidenceLevel);
          everyPresentQuantityUsesControlledUnitAndCanonicalDecimal(
          annualizationFactor,riskFreeRate,calculationWindow,confidenceLevel)
      severity: Error
      message: >-
        CalculationContext identity, executable parameter snapshot, frequency, implementation, or benchmark pair is
        incomplete.
    SignalContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/SignalContract
      namespace: fin-strategy
      localName: SignalContract
      label: Signal Contract
      definition: Validation rule that enforces Signal participants listing consistency bounded strength and exact identity.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          eachExactlyOne(signalGenerator,signalInstrument,signalRunContext,sourceSignalId,signalDirection,signalStrength,signalHorizon);
          controlledQuantityUnit(signalStrength,signalStrength); canonicalDecimal(signalStrength.value);
          exactDecimal('0') <= signalStrength.value <= exactDecimal('1');
          signalListing.listedInstrument.versionIri=signalInstrument.versionIri;
          logicalKey(signalGenerator.logicalIri,signalRunContext.logicalIri,sourceSignalId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: Signal generator context direction strength listing or identity contract is invalid.
    FactorRevisionContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/FactorRevisionContract
      namespace: fin-strategy
      localName: FactorRevisionContract
      label: Factor Revision Contract
      definition: >-
        Validation rule that preserves FactorObservation history through stable domain identity semantic supersession
        and knowledge-time closure.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(observedFactor.logicalIri,factorInstrument.logicalIri,sourceFactorId,reportingPeriodKey);
          factorRunContext and factorListing are immutable version content;
          factorListing.listedInstrument.versionIri=factorInstrument.versionIri;
          controlledQuantityUnit(factorValue,factorValue); canonicalDecimal(factorValue.value);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); if absent(supersedesFactorVersion) then revision=0
          and absent(knowledgeClosure,availabilityClosure); if present(supersedesFactorVersion) then
          supersedesFactorVersion.logicalKey=this.logicalKey and
          knowledgeClosure(targetVersion=supersedesFactorVersion.versionIri,axis=knowledge,closedAt=knowledgeFrom,causeKind=successor,causeVersion=this.versionIri)
          and
          availabilityClosure(targetVersion=supersedesFactorVersion.versionIri,axis=availability,closedAt=availableFrom,causeKind=successor,causeVersion=this.versionIri);
          forbidden(knowledgeTo,availableTo,sourceStoragePointer,sourceByteOffset)
      severity: Error
      message: FactorObservation revision identity time closure or supersession is invalid.
    BacktestStatusContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatusContract
      namespace: fin-strategy
      localName: BacktestStatusContract
      label: Backtest Status Contract
      definition: Validation rule that requires immutable ordered BacktestStatusEvent facts and legal predecessor continuity.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(statusForBacktest.logicalIri,sourceRunEventId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); if absent(previousStatusEvent) then
          statusSequence=0 and backtestLifecycleState=planned; if present(previousStatusEvent) then
          previousStatusEvent.statusSequence + 1 = statusSequence and
          reviewedTransition(previousStatusEvent.backtestLifecycleState,backtestLifecycleState)
      severity: Error
      message: BacktestStatusEvent identity ordering or reviewed transition is invalid.
    PerformanceValueContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PerformanceValueContract
      namespace: fin-strategy
      localName: PerformanceValueContract
      label: Performance Value Contract
      definition: >-
        Validation rule that implements exclusive Money-or-Quantity metric values with exact run and calculation
        context.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          xone(performanceMoneyValue,performanceQuantityValue); performanceMetric.metricValueKind selects present value;
          if present(performanceQuantityValue) then
          controlledQuantityUnit(performanceQuantityValue,performanceQuantityValue) and
          canonicalDecimal(performanceQuantityValue.value); metricRequirements(performanceCalculationContext)=satisfied;
          logicalKey(performanceRunContext.logicalIri,performanceMetric.logicalIri,performanceCalculationContext.logicalIri,sourcePerformanceId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: PerformanceObservation must carry exactly one metric-compatible typed value and complete contexts.
    PerformanceRevisionContract:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PerformanceRevisionContract
      namespace: fin-strategy
      localName: PerformanceRevisionContract
      label: Performance Revision Contract
      definition: >-
        Validation rule that returns knowledge-time PerformanceObservation versions and immutable closure evidence
        without overwriting prior facts.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          if absent(supersedesPerformanceVersion) then revision=0 and absent(knowledgeClosure,availabilityClosure); if
          present(supersedesPerformanceVersion) then supersedesPerformanceVersion.logicalKey=this.logicalKey and
          knowledgeClosure(targetVersion=supersedesPerformanceVersion.versionIri,axis=knowledge,closedAt=knowledgeFrom,causeKind=successor,causeVersion=this.versionIri)
          and
