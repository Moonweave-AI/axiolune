module:
  moduleIri: https://axiolune.ai/ontology/finance/strategy-research
  baseIri: https://axiolune.ai/ontology/finance/strategy-research/
  preferredPrefix: fin-strategy
  version: 1.0.0
  label: Strategy and Research
  definition: >-
    Finance ontology module that defines versioned factor and strategy specifications, research and backtest contexts,
    signal and factor facts, metric calculation context, performance observations, and position attribution without
    adopting implementation-private project vocabulary as canonical financial semantics.
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    SignalGenerator:
      iri: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      namespace: fin-strategy
      localName: SignalGenerator
      abstract: true
      label: Signal Generator
      definition: >-
        Versioned specification that generates research signals under one authority and fixes its executable
        implementation, input and output contracts, runtime, tool lock, and exact source artifact evidence.
        FactorDefinition and StrategyDefinition are its concrete specializations.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/generatorId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/generatorName
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FactorDefinition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
      namespace: fin-strategy
      localName: FactorDefinition
      label: Factor Definition
      definition: >-
        Signal generator specification that defines one quantitative factor, its executable expression artifact, value
        contract, input universe, and revision identity without storing computed observations.
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorExpressionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorExpressionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorCategory
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StrategyDefinition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
      namespace: fin-strategy
      localName: StrategyDefinition
      label: Strategy Definition
      definition: >-
        Signal generator specification that defines one trading or allocation strategy and makes every FactorDefinition
        dependency an explicit exact-version relation rather than an implicit source-code import.
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/strategyDescription
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RunContext:
      iri: https://axiolune.ai/ontology/finance/strategy-research/RunContext
      namespace: fin-strategy
      localName: RunContext
      label: Run Context
      definition: >-
        Versioned execution context that fixes one research, backtest, or live run identity together with its parameter
        snapshot, ontology and mapping closure, calendar snapshot, compiler, strictly prior materialization context, and
        matching three-axis PIT validation request.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runContextKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runStartedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/parameterSnapshotRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/parameterSnapshotDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/ontologyClosureDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/mappingClosureDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calendarSnapshotRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calendarSnapshotDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/compilerDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BacktestRun:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
      namespace: fin-strategy
      localName: BacktestRun
      label: Backtest Run
      definition: >-
        Run context whose immutable configuration applies one exact strategy version to a half-open historical interval
        using locked capital, cost, slippage, fill, benchmark, seed, code, calendar, mapping, and PIT inputs; mutable
        execution state is excluded and represented by status facts.
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/RunContext
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/simulationFrom
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/simulationTo
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/initialCapital
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/codeDefinitionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/feeAssumptionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/feeAssumptionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/slippageAssumptionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/slippageAssumptionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/fillAssumptionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/fillAssumptionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/deterministicSeed
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ResearchRun:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ResearchRun
      namespace: fin-strategy
      localName: ResearchRun
      label: Research Run
      definition: >-
        Run context that evaluates one exact signal-generator version against an immutable research question and dataset
        snapshot under locked mappings, tools, parameters, seed, and three-axis PIT evidence.
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/RunContext
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchQuestionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchQuestionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchDatasetRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchDatasetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchOutputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/deterministicSeed
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MetricDefinition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
      namespace: fin-strategy
      localName: MetricDefinition
      label: Metric Definition
      definition: >-
        Versioned performance or attribution metric specification that fixes one value representation and one executable
        formula, implementation, input and output contract, runtime, and tool lock.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricName
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/metricValueKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/formulaDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/runtimeDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CalculationContext:
      iri: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
      namespace: fin-strategy
      localName: CalculationContext
      label: Calculation Context
      definition: >-
        Versioned metric calculation context that fixes frequency, annualization, risk-free rate, window, confidence,
        benchmark, result-affecting return/aggregation/missing-value/calendar/alignment policies, and exact calculation
        implementation for reproducible performance comparison. The complete parameter policy is an immutable,
        byte-verifiable snapshot rather than an implicit library default.
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationFrequency
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/annualizationFactor
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/riskFreeRate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationWindow
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/confidenceLevel
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationImplementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationParameterSnapshotRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationParameterSnapshotDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/calculationParameterSnapshotLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/benchmarkDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    Signal:
      iri: https://axiolune.ai/ontology/finance/strategy-research/Signal
      namespace: fin-strategy
      localName: Signal
      label: Signal Observation
      definition: >-
        Temporal and provenanced signal observation produced by exactly one signal-generator version for exactly one
        instrument and run context, with an optional consistent listing, one reviewed direction, and a dimensionless
        strength in the closed interval from zero to one.
      participantRoles:
        - id: signalGenerator
          range: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
          minCount: 1
          maxCount: 1
          label: signal generator
          definition: exact SignalGenerator version that produced the signal
        - id: signalInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: signal instrument
          definition: exact FinancialInstrument version for which the signal was generated
        - id: signalListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: signal listing
          definition: optional exact InstrumentListing version whose listed instrument equals signalInstrument
        - id: signalRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: signal run context
          definition: exact RunContext version in which the signal was generated
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceSignalId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalDirection
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalStrength
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalHorizon
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FactorObservation:
      iri: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
      namespace: fin-strategy
      localName: FactorObservation
      label: Factor Observation
      definition: >-
        Temporal and provenanced observation of one factor version for one instrument, reporting period, and run context
        whose revisions use the canonical logical identity plus knowledge-time closure and an optional semantic
        supersedes link to the prior exact fact version; source storage offsets and linked-record pointers are excluded
        from domain semantics.
      participantRoles:
        - id: observedFactor
          range: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
          minCount: 1
          maxCount: 1
          label: observed factor
          definition: exact FactorDefinition version whose value is observed
        - id: factorInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: factor instrument
          definition: exact FinancialInstrument version to which the factor value applies
        - id: factorListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: factor listing
          definition: optional exact InstrumentListing version consistent with factorInstrument
        - id: factorRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: factor run context
          definition: >-
            exact RunContext version under which this immutable factor version was materialized or consumed; it is
            version content and not part of the stable factor-observation logical key
        - id: supersedesFactorVersion
          range: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
          minCount: 0
          maxCount: 1
          label: supersedes factor version
          definition: optional immediately prior exact FactorObservation version having the same logical key
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceFactorId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/reportingPeriodKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorValue
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BacktestStatusEvent:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatusEvent
      namespace: fin-strategy
      localName: BacktestStatusEvent
      label: Backtest Status Event
      definition: >-
        Immutable temporal and provenanced event that records one reviewed backtest lifecycle state for one exact
        BacktestRun without mutating the run configuration or replacing earlier state evidence.
      participantRoles:
        - id: statusForBacktest
          range: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
          minCount: 1
          maxCount: 1
          label: status for backtest
          definition: exact BacktestRun version whose lifecycle state is reported
        - id: previousStatusEvent
          range: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatusEvent
          minCount: 0
          maxCount: 1
          label: previous status event
          definition: optional immediate predecessor exact status-event version in occurrence order
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceRunEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/statusSequence
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/backtestLifecycleState
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PerformanceObservation:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation
      namespace: fin-strategy
      localName: PerformanceObservation
      label: Performance Observation
      definition: >-
        Temporal and provenanced metric observation that binds exactly one MetricDefinition, RunContext, and
        CalculationContext and carries exactly one typed Money or Quantity value selected by the metric definition.
        Knowledge-time corrections preserve the logical identity, point to the exact prior version, and close prior
        knowledge and availability through separate immutable FactClosureAssertion evidence.
      participantRoles:
        - id: performanceMetric
          range: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
          minCount: 1
          maxCount: 1
          label: performance metric
          definition: exact MetricDefinition version governing the observed value
        - id: performanceRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: performance run context
          definition: exact RunContext version whose performance is observed
        - id: performanceCalculationContext
          range: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
          minCount: 1
          maxCount: 1
          label: performance calculation context
          definition: exact CalculationContext version used to calculate the observation
        - id: supersedesPerformanceVersion
          range: https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation
          minCount: 0
          maxCount: 1
          label: supersedes performance version
          definition: optional immediately prior exact PerformanceObservation version having the same logical key
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourcePerformanceId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/performanceMoneyValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/performanceQuantityValue
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionAttribution:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PositionAttribution
      namespace: fin-strategy
      localName: PositionAttribution
      label: Position Attribution
      definition: >-
        Temporal and provenanced attribution fact that assigns exactly one position snapshot or position lot to one
        signal-generator and run context using one metric, one calculation context, and exactly one typed Money or
        Quantity contribution without creating a Portfolio to Strategy dependency cycle.
      participantRoles:
        - id: attributedPositionSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: attributed position snapshot
          definition: optional exact PositionSnapshot version receiving the attribution
        - id: attributedPositionLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 0
          maxCount: 1
          label: attributed position lot
          definition: optional exact PositionLot version receiving the attribution
        - id: attributionGenerator
          range: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
          minCount: 1
          maxCount: 1
          label: attribution generator
          definition: exact SignalGenerator version to which the position contribution is attributed
        - id: attributionRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: attribution run context
          definition: exact RunContext version in which the attribution was calculated
        - id: attributionMetric
          range: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
          minCount: 1
          maxCount: 1
          label: attribution metric
          definition: exact MetricDefinition version governing the contribution value
        - id: attributionCalculationContext
          range: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
          minCount: 1
          maxCount: 1
          label: attribution calculation context
          definition: exact CalculationContext version used to calculate the contribution
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceAttributionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionMoneyValue
          minCount: 0
          maxCount: 1
