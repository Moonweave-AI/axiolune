      values:
        - iri: https://axiolune.ai/ontology/finance/strategy-research/SignalDirection/value/long
          notation: long
          label: long
          definition: Signal favors positive exposure under its exact generator contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/SignalDirection/value/short
          notation: short
          label: short
          definition: Signal favors negative exposure under its exact generator contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/SignalDirection/value/neutral
          notation: neutral
          label: neutral
          definition: Signal favors no directional exposure under its exact generator contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/SignalDirection/value/exit
          notation: exit
          label: exit
          definition: Signal favors closing an existing exposure under its exact generator contract.
    FactorCategory:
      iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory
      namespace: fin-strategy
      localName: FactorCategory
      label: Factor Category
      definition: >-
        Factor Category, is a closed classification of a Factor by the primary provenance of the inputs or
        transformation that defines it, used for characterizing the main source type of a factor.
      cnNote: 因子类别分类，是按定义因子的输入来源或变换方式对因子进行的封闭分类，用于刻画因子的主要来源类型。
      vocabulary: Factor Category
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory/value/fundamental
          notation: fundamental
          label: fundamental
          definition: Factor derives from issuer or economic fundamentals under a locked input contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory/value/technical
          notation: technical
          label: technical
          definition: Factor derives from market-series transformations under a locked input contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory/value/alternative
          notation: alternative
          label: alternative
          definition: Factor derives from a reviewed non-traditional dataset under a locked input contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory/value/macro
          notation: macro
          label: macro
          definition: Factor derives from macroeconomic observations under a locked input contract.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory/value/statistical
          notation: statistical
          label: statistical
          definition: Factor derives from a reviewed statistical model under a locked implementation.
