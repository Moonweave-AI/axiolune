        Tool Lock Digest, is the SHA-256 digest of the immutable tool-lock record, used for byte-level verification of
        the tool-lock record content.
      cnNote: 工具锁摘要，是不可变工具锁记录的 SHA-256 摘要，用于字节级验证工具锁记录内容。
      valueType: string
