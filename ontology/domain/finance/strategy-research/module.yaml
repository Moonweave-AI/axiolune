        measurement period, used for giving a performance observation an explicit return series rather than a single
        scalar value; scalar results remain valid as the first profile.
      cnNote: 收益序列快照，是定义一个业绩度量期上不可变收益序列快照的带版本规范，用于给业绩观测显式的收益序列而非单一标量取值；标量结果作为首个画像保持有效。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/returnSeriesSnapshotId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/returnSeriesSnapshotDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ValuationConvention:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ValuationConvention
      namespace: fin-strategy
      localName: ValuationConvention
      label: Valuation Convention
      definition: >-
        Valuation Convention, is a versioned specification of the valuation convention under which a performance metric
        is measured, covering net/gross convention and other valuation choices, used for making performance comparable.
      cnNote: 估值约定，是定义业绩指标度量所依据的估值约定的带版本规范，涵盖净/毛口径与其他估值选择，用于使业绩可比。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/valuationConventionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/netGrossConvention
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PerformanceSubject:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PerformanceSubject
      namespace: fin-strategy
      localName: PerformanceSubject
      label: Performance Subject
      definition: >-
        Performance Subject, is a versioned specification of the subject whose performance is measured by a performance
        observation, used for making explicit what is being measured rather than leaving it implicit in the run context.
      cnNote: 业绩主体，是定义一条业绩观测所度量其业绩的主体的带版本规范，用于显式表达被度量对象，而非隐含于运行上下文。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/performanceSubjectId
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    AttributionMethod:
      iri: https://axiolune.ai/ontology/finance/strategy-research/AttributionMethod
      namespace: fin-strategy
      localName: AttributionMethod
      label: Attribution Method
      definition: >-
        Attribution Method, is a versioned specification of the attribution method used to decompose a performance result
        into contributions, covering the component type, aggregation scope, and reconciliation and residual rule, used
        for making an attribution explain a performance result rather than only carry a number.
      cnNote: 归因方法，是定义用于把业绩结果分解为贡献的归因方法的带版本规范，涵盖组件类型、聚合范围与对账和残差规则，用于使归因解释业绩结果而非仅承载一个数值。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionMethodId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionComponentType
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionAggregationScope
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionReconciliationRule
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StrategyDeployment:
      iri: https://axiolune.ai/ontology/finance/strategy-research/StrategyDeployment
      namespace: fin-strategy
      localName: StrategyDeployment
      label: Strategy Deployment
      definition: >-
        Strategy Deployment, is a versioned specification of one deployment of a strategy to live trading, used for
        backing the live run-context kind with a deployment lifecycle governed by promotion, monitoring, suspension,
        and rollback decisions.
      cnNote: 策略部署，是定义一次策略到实盘交易的部署的带版本规范，用于以由晋升、监控、暂停与回滚决策治理的部署生命周期支撑实盘运行类别。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/strategyDeploymentId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/deploymentLifecycleState
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LiveRun:
      iri: https://axiolune.ai/ontology/finance/strategy-research/LiveRun
      namespace: fin-strategy
      localName: LiveRun
      label: Live Run
      definition: >-
        Live Run, is a run context that consumes PIT-authorized live inputs under a locked execution context governed
        by a StrategyDeployment, used for giving the live run-context kind a concrete type with deployment governance.
      cnNote: 实盘运行，是在由 StrategyDeployment 治理的锁定执行上下文下消费 PIT 授权实盘输入的运行上下文子类，用于给实盘运行类别一个带有部署治理的具体类型。
      superTypes:
        - https://axiolune.ai/ontology/finance/strategy-research/RunContext
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    Signal:
      iri: https://axiolune.ai/ontology/finance/strategy-research/Signal
      namespace: fin-strategy
      localName: Signal
      label: Signal Observation
      definition: >-
        Signal Observation, is a temporal and provenanced observation produced by exactly one signal-generator version
        for one instrument and run context, used for recording a reviewed exposure direction and action intent together
        with an optional dimensionless strength in the closed interval from zero to one and optional enrichment such as
        rank, expected return, alpha score, confidence interval, target weight, and position change.
      cnNote: 信号观测，是由一个信号生成器版本针对一个金融工具与运行上下文产出的带时间与来源的观测，用于记录经评审的暴露方向与动作意图，以及可选的零至一区间内无量纲强度与可选的排名、预期收益、alpha 分数、置信区间、目标权重与仓位变化等扩展。
      participantRoles:
        - id: signalGenerator
          range: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
          minCount: 1
          maxCount: 1
          label: signal generator
          definition: exact SignalGenerator version that produced the signal
        - id: signalInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: signal instrument
          definition: exact FinancialInstrument version for which the signal was generated
        - id: signalListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: signal listing
          definition: optional exact InstrumentListing version whose listed instrument equals signalInstrument
        - id: signalRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: signal run context
          definition: exact RunContext version in which the signal was generated
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceSignalId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalDirection
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/targetExposureDirection
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalActionIntent
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalStrength
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalHorizon
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalRank
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/expectedReturn
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/alphaScore
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/signalConfidenceInterval
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/targetWeight
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/positionChange
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FactorObservation:
      iri: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
      namespace: fin-strategy
      localName: FactorObservation
      label: Factor Observation
      definition: >-
        Factor Observation, is a temporal and provenanced observation that records the value of one factor version for
        one factor subject, observation period, and run context, used for managing revisions through a stable logical
        identity plus knowledge-time closure, with an optional link to the prior exact fact version. The factor subject
        is generalized beyond a single instrument via the FactorSubject role family so that macro, sector, country,
        market-breadth, curve, and portfolio factors are not forced to masquerade as instruments; the observation period
        is a structured ObservationPeriod rather than a free-text key; and the run context is part of the stable logical
        key so that observations of the same factor and subject in different runs do not collide.
      cnNote: 因子观测，是记录一个因子版本在某个因子主体、观察期与运行上下文下取值的带时间与来源的观测，用于以稳定逻辑标识加知识时间闭包管理修正，并可链接前序精确版本。因子主体经 FactorSubject 角色族泛化为超越单一工具，使宏观、行业、国家、市场宽度、曲线与组合因子不必伪装成工具；观察期为结构化 ObservationPeriod 而非自由文本键；运行上下文纳入稳定逻辑键，使同一因子与主体在不同运行中的观测不发生身份碰撞。
      participantRoles:
        - id: observedFactor
          range: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
          minCount: 1
          maxCount: 1
          label: observed factor
          definition: exact FactorDefinition version whose value is observed
        - id: factorInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: factor instrument subject
          definition: optional exact FinancialInstrument version to which the factor value applies; one branch of the exclusive FactorSubject family
        - id: factorListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: factor listing subject
          definition: optional exact InstrumentListing version subject consistent with factorInstrument
        - id: factorIssuer
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: factor issuer subject
          definition: optional exact Party issuer version to which the factor value applies
        - id: factorIndex
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: factor index subject
          definition: optional exact index instrument version to which the factor value applies
        - id: factorCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 0
          maxCount: 1
          label: factor currency subject
          definition: optional exact Currency version to which the factor value applies
        - id: factorMarket
          range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
          minCount: 0
          maxCount: 1
          label: factor market subject
          definition: optional exact TradingVenue version to which the factor value applies
        - id: factorSector
          range: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
          minCount: 0
          maxCount: 1
          label: factor sector subject
          definition: optional exact MarketSegment version to which the factor value applies
        - id: factorPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 0
          maxCount: 1
          label: factor portfolio subject
          definition: optional exact Portfolio version to which the factor value applies
        - id: factorUniverse
          range: https://axiolune.ai/ontology/finance/strategy-research/UniverseDefinition
          minCount: 0
          maxCount: 1
          label: factor universe subject
          definition: optional exact UniverseDefinition version to which the factor value applies
        - id: factorRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: factor run context
          definition: >-
            exact RunContext version under which this immutable factor version was materialized or consumed; it is part
            of the stable factor-observation logical key
        - id: supersedesFactorVersion
          range: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
          minCount: 0
          maxCount: 1
          label: supersedes factor version
          definition: optional immediately prior exact FactorObservation version having the same logical key
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceFactorId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/reportingPeriodKey
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/observationPeriodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorSubjectKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/factorValue
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BacktestStatusEvent:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatusEvent
      namespace: fin-strategy
      localName: BacktestStatusEvent
      label: Backtest Status Event
      definition: >-
        Backtest Status Event, is an immutable temporal and provenanced event that records one reviewed lifecycle state
        for one exact BacktestRun, used for tracking the run evolution without mutating the run configuration or
        replacing earlier state evidence.
      cnNote: 回测状态事件，是针对一个回测运行记录其一次经评审生命周期状态的不可变事件，用于在不变更运行配置或覆盖既有状态证据的前提下刻画运行演进。
      participantRoles:
        - id: statusForBacktest
          range: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
          minCount: 1
          maxCount: 1
          label: status for backtest
          definition: exact BacktestRun version whose lifecycle state is reported
        - id: previousStatusEvent
          range: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatusEvent
          minCount: 0
          maxCount: 1
          label: previous status event
          definition: optional immediate predecessor exact status-event version in occurrence order
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceRunEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/statusSequence
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/backtestLifecycleState
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PerformanceObservation:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation
      namespace: fin-strategy
      localName: PerformanceObservation
      label: Performance Observation
      definition: >-
        Performance Observation, is a temporal and provenanced observation that binds one MetricDefinition, RunContext,
        and CalculationContext and carries a single Money or Quantity value, used for preserving the logical identity
        through knowledge-time corrections and closing prior availability through separate immutable closure evidence.
        The observation optionally references a PerformanceMeasurementPeriod, ReturnSeriesSnapshot,
        ValuationConvention, PerformanceSubject, and BenchmarkSpecification so that the measurement period, subject,
        return series, valuation convention, and benchmark are explicit and queryable.
      cnNote: 业绩观测，是绑定指标定义、运行上下文与计算上下文并承载单一货币或数量取值的带时间来源观测，用于以知识时间修正保留逻辑标识并通过独立闭包证据关闭先前可用性。观测可选引用 PerformanceMeasurementPeriod、ReturnSeriesSnapshot、ValuationConvention、PerformanceSubject 与 BenchmarkSpecification，使度量期、主体、收益序列、估值约定与基准显式可查询。
      participantRoles:
        - id: performanceMetric
          range: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
          minCount: 1
          maxCount: 1
          label: performance metric
          definition: exact MetricDefinition version governing the observed value
        - id: performanceRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: performance run context
          definition: exact RunContext version whose performance is observed
        - id: performanceCalculationContext
          range: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
          minCount: 1
          maxCount: 1
          label: performance calculation context
          definition: exact CalculationContext version used to calculate the observation
        - id: performanceMeasurementPeriod
          range: https://axiolune.ai/ontology/finance/strategy-research/PerformanceMeasurementPeriod
          minCount: 0
          maxCount: 1
          label: performance measurement period
          definition: optional exact PerformanceMeasurementPeriod version over which the metric is measured
        - id: performanceReturnSeries
          range: https://axiolune.ai/ontology/finance/strategy-research/ReturnSeriesSnapshot
          minCount: 0
          maxCount: 1
          label: performance return series
          definition: optional exact ReturnSeriesSnapshot version carrying the return series for the period
        - id: performanceValuationConvention
          range: https://axiolune.ai/ontology/finance/strategy-research/ValuationConvention
          minCount: 0
          maxCount: 1
          label: performance valuation convention
          definition: optional exact ValuationConvention version under which the metric is measured
        - id: performanceSubject
          range: https://axiolune.ai/ontology/finance/strategy-research/PerformanceSubject
          minCount: 0
          maxCount: 1
          label: performance subject
          definition: optional exact PerformanceSubject version whose performance is measured
        - id: performanceBenchmark
          range: https://axiolune.ai/ontology/finance/strategy-research/BenchmarkSpecification
          minCount: 0
          maxCount: 1
          label: performance benchmark
          definition: optional exact BenchmarkSpecification version used as the comparison benchmark
        - id: supersedesPerformanceVersion
          range: https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation
          minCount: 0
          maxCount: 1
          label: supersedes performance version
          definition: optional immediately prior exact PerformanceObservation version having the same logical key
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourcePerformanceId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/performanceMoneyValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/performanceQuantityValue
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PositionAttribution:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PositionAttribution
      namespace: fin-strategy
      localName: PositionAttribution
      label: Position Attribution
      definition: >-
        Position Attribution, is a temporal and provenanced fact that attributes one position snapshot or position lot
        to a signal-generator and run context, used for carrying a single Money or Quantity contribution under one
        metric and calculation context without creating a Portfolio-to-Strategy dependency cycle. The attribution
        optionally links to the PerformanceObservation it explains via attributionForPerformance, and to an
        AttributionMethod that defines the component type, aggregation scope, and reconciliation and residual rule, so
        that the attribution explains a performance result rather than only carrying a number.
      cnNote: 持仓归因，是把一个持仓快照或持仓批次归因于某信号生成器与运行上下文的事实，用于以单一指标与计算上下文承载一项货币或数量贡献，且不形成组合到策略的依赖环。归因可选通过 attributionForPerformance 链接到其解释的业绩观测，并链接到定义组件类型、聚合范围与对账和残差规则的 AttributionMethod，使归因解释业绩结果而非仅承载一个数值。
      participantRoles:
        - id: attributedPositionSnapshot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: attributed position snapshot
          definition: optional exact PositionSnapshot version receiving the attribution
        - id: attributedPositionLot
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot
          minCount: 0
          maxCount: 1
          label: attributed position lot
          definition: optional exact PositionLot version receiving the attribution
        - id: attributionGenerator
          range: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
          minCount: 1
          maxCount: 1
          label: attribution generator
          definition: exact SignalGenerator version to which the position contribution is attributed
        - id: attributionRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: attribution run context
          definition: exact RunContext version in which the attribution was calculated
        - id: attributionMetric
          range: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
          minCount: 1
          maxCount: 1
          label: attribution metric
          definition: exact MetricDefinition version governing the contribution value
        - id: attributionCalculationContext
          range: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
          minCount: 1
          maxCount: 1
          label: attribution calculation context
          definition: exact CalculationContext version used to calculate the contribution
        - id: attributionForPerformance
          range: https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation
          minCount: 0
          maxCount: 1
          label: attribution for performance
          definition: optional exact PerformanceObservation version that this attribution explains
        - id: attributionMethod
          range: https://axiolune.ai/ontology/finance/strategy-research/AttributionMethod
          minCount: 0
          maxCount: 1
          label: attribution method
          definition: optional exact AttributionMethod version defining the component type, aggregation scope, and reconciliation and residual rule
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/sourceAttributionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionMoneyValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionQuantityValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionResidual
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/attributionReconciliationStatus
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    DatasetPartition:
      iri: https://axiolune.ai/ontology/finance/strategy-research/DatasetPartition
      namespace: fin-strategy
      localName: DatasetPartition
      label: Dataset Partition
      definition: >-
        Dataset Partition, is a temporal and provenanced association that records one train, validate, test,
        walk-forward, or holdout partition over a DatasetSnapshot, used for expressing the sample-splitting step of a
        falsifiable research protocol.
      cnNote: 数据集划分，是记录对一个 DatasetSnapshot 的一次训练、验证、测试、walk-forward 或留出划分的带时间与来源关联，用于表达可证伪研究协议的样本划分步骤。
      participantRoles:
        - id: partitionDataset
          range: https://axiolune.ai/ontology/finance/strategy-research/DatasetSnapshot
          minCount: 1
          maxCount: 1
          label: partition dataset
          definition: exact DatasetSnapshot version being partitioned
        - id: partitionWalkForwardFold
          range: https://axiolune.ai/ontology/finance/strategy-research/WalkForwardFold
          minCount: 0
          maxCount: 1
          label: partition walk-forward fold
          definition: optional exact WalkForwardFold version defining the fold windows
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/datasetPartitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/partitionKind
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ModelSelectionDecision:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ModelSelectionDecision
      namespace: fin-strategy
      localName: ModelSelectionDecision
      label: Model Selection Decision
      definition: >-
        Model Selection Decision, is a temporal and provenanced association that records the selection of one candidate
        signal-generator version over rejected alternatives under a research protocol, used for expressing the
        model-selection step of a falsifiable research protocol.
      cnNote: 模型选择决策，是记录在一个研究协议下选定一个候选信号生成器版本而非被拒替代的带时间与来源关联，用于表达可证伪研究协议的模型选择步骤。
      participantRoles:
        - id: selectedGenerator
          range: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
          minCount: 1
          maxCount: 1
          label: selected generator
          definition: exact SignalGenerator version selected
        - id: selectionRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: selection run context
          definition: exact RunContext version in which the selection was made
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/modelSelectionDecisionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/selectionScore
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/selectionBasis
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StatisticalTestResult:
      iri: https://axiolune.ai/ontology/finance/strategy-research/StatisticalTestResult
      namespace: fin-strategy
      localName: StatisticalTestResult
      label: Statistical Test Result
      definition: >-
        Statistical Test Result, is a temporal and provenanced association that records one statistical test result for
        a hypothesis under a research run, used for expressing the falsifiability conclusion of a research hypothesis.
      cnNote: 统计检验结果，是记录一个研究运行下对一个假设的统计检验结果的带时间与来源关联，用于表达研究假设的可证伪结论。
      participantRoles:
        - id: testHypothesis
          range: https://axiolune.ai/ontology/finance/strategy-research/Hypothesis
          minCount: 1
          maxCount: 1
          label: test hypothesis
          definition: exact Hypothesis version being tested
        - id: testRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: test run context
          definition: exact RunContext version in which the test was run
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/statisticalTestResultId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/testStatistic
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/effectSize
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/conclusionDisposition
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ResearchFinding:
      iri: https://axiolune.ai/ontology/finance/strategy-research/ResearchFinding
      namespace: fin-strategy
      localName: ResearchFinding
      label: Research Finding
      definition: >-
        Research Finding, is a temporal and provenanced association that records one semantic finding of a research run
        linking its research question, hypothesis, and statistical test results, used for expressing the conclusion
        step of a research run.
      cnNote: 研究发现，是记录一个研究运行链接其研究问题、假设与统计检验结果的语义发现的带时间与来源关联，用于表达研究运行的结论步骤。
      participantRoles:
        - id: findingResearchQuestion
          range: https://axiolune.ai/ontology/finance/strategy-research/ResearchQuestion
          minCount: 1
          maxCount: 1
          label: finding research question
          definition: exact ResearchQuestion version the finding addresses
        - id: findingRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: finding run context
          definition: exact RunContext version that produced the finding
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/researchFindingId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/conclusionType
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/findingNarrative
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PitAssessment:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PitAssessment
      namespace: fin-strategy
      localName: PitAssessment
      label: PIT Assessment
      definition: >-
        PIT Assessment, is a temporal and provenanced association that records one three-axis point-in-time assessment
        with its reference, digest, coverage scope, and per-axis status, used for proving that each historical decision
        point consumed only data available at that point, not only that the run's input context was completed before the
        run started.
      cnNote: PIT 评估，是记录一次三轴点在时间评估及其引用、摘要、覆盖范围与各轴状态的带时间与来源关联，用于证明每个历史决策点仅消费该点可得数据，而非仅证明运行输入上下文在运行开始前完成。
      participantRoles:
        - id: assessmentRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: assessment run context
          definition: exact RunContext version whose inputs are assessed
        - id: supersedesPitAssessment
          range: https://axiolune.ai/ontology/finance/strategy-research/PitAssessment
          minCount: 0
          maxCount: 1
          label: supersedes PIT assessment
          definition: optional immediately prior exact PitAssessment version that this assessment revises
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitAssessmentId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitAssessmentRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitAssessmentDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitCoverageScope
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/pitAxisStatus
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    PromotionDecision:
      iri: https://axiolune.ai/ontology/finance/strategy-research/PromotionDecision
      namespace: fin-strategy
      localName: PromotionDecision
      label: Promotion Decision
      definition: >-
        Promotion Decision, is a temporal and provenanced association that records the promotion of a candidate
        strategy to a deployment by an approver under stated criteria, used for governing the candidate-to-approved
        transition of a live deployment.
      cnNote: 晋升决策，是记录由批准者在既定标准下把候选策略晋升为部署的带时间与来源关联，用于治理实盘部署的候选到批准转换。
      participantRoles:
        - id: promotionCandidateStrategy
          range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
          minCount: 1
          maxCount: 1
          label: promotion candidate strategy
          definition: exact StrategyDefinition version promoted
        - id: promotionDeployment
          range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDeployment
          minCount: 1
          maxCount: 1
          label: promotion deployment
          definition: exact StrategyDeployment version receiving the promotion
        - id: promotionApprover
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: promotion approver
          definition: exact Party version that approved the promotion
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/promotionDecisionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/promotionCriteria
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MonitoringObservation:
      iri: https://axiolune.ai/ontology/finance/strategy-research/MonitoringObservation
      namespace: fin-strategy
      localName: MonitoringObservation
      label: Monitoring Observation
      definition: >-
        Monitoring Observation, is a temporal and provenanced association that records one monitoring observation of a
        deployed strategy, used for detecting drift and triggering suspension or rollback.
      cnNote: 监控观测，是记录一个已部署策略的监控观测的带时间与来源关联，用于检测漂移并触发暂停或回滚。
      participantRoles:
        - id: monitoringDeployment
          range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDeployment
          minCount: 1
          maxCount: 1
          label: monitoring deployment
          definition: exact StrategyDeployment version being monitored
        - id: monitoringRunContext
          range: https://axiolune.ai/ontology/finance/strategy-research/RunContext
          minCount: 1
          maxCount: 1
          label: monitoring run context
          definition: exact RunContext version producing the monitoring observation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/monitoringObservationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/monitoringMetricValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/driftIndicator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RollbackDecision:
      iri: https://axiolune.ai/ontology/finance/strategy-research/RollbackDecision
      namespace: fin-strategy
      localName: RollbackDecision
      label: Rollback Decision
      definition: >-
        Rollback Decision, is a temporal and provenanced association that records the rollback of a deployment by an
        approver under a stated reason, used for governing the deployed-to-rolled-back transition of a live deployment.
      cnNote: 回滚决策，是记录由批准者在既定理由下回滚一个部署的带时间与来源关联，用于治理实盘部署的已部署到已回滚转换。
      participantRoles:
        - id: rollbackDeployment
          range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDeployment
          minCount: 1
          maxCount: 1
          label: rollback deployment
          definition: exact StrategyDeployment version being rolled back
        - id: rollbackApprover
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: rollback approver
          definition: exact Party version that approved the rollback
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/rollbackDecisionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/strategy-research/rollbackReason
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    generatorAuthority:
      iri: https://axiolune.ai/ontology/finance/strategy-research/generatorAuthority
      namespace: fin-strategy
      localName: generatorAuthority
      label: generator authority
      definition: >-
        Generator Authority, is a functional relationship from a SignalGenerator to the Party authority that scopes its
        stable identifier, used for restricting the logical identity of the generator to a single authority scope.
      cnNote: 生成器权威关系，是从信号生成器指向界定其稳定标识的参与方权威的功能性关系，用于把生成器的逻辑身份限定在某一权威范围之内。
      domain: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    runAuthority:
      iri: https://axiolune.ai/ontology/finance/strategy-research/runAuthority
      namespace: fin-strategy
      localName: runAuthority
      label: run authority
      definition: >-
        Run Authority, is a functional relationship from a RunContext to the Party authority that scopes its stable run
        identifier, used for restricting the identity of the run to a single authority scope.
      cnNote: 运行权威关系，是从运行上下文指向界定其稳定运行标识的参与方权威的功能性关系，用于把运行的身份限定在某一权威范围之内。
      domain: https://axiolune.ai/ontology/finance/strategy-research/RunContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    metricAuthority:
      iri: https://axiolune.ai/ontology/finance/strategy-research/metricAuthority
      namespace: fin-strategy
      localName: metricAuthority
      label: metric authority
      definition: >-
        Metric Authority, is a functional relationship from a MetricDefinition to the Party authority that scopes its
        stable identifier, used for restricting the logical identity of the metric to a single authority scope.
      cnNote: 指标权威关系，是从指标定义指向界定其稳定标识的参与方权威的功能性关系，用于把指标的逻辑身份限定在某一权威范围之内。
      domain: https://axiolune.ai/ontology/finance/strategy-research/MetricDefinition
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    calculationAuthority:
      iri: https://axiolune.ai/ontology/finance/strategy-research/calculationAuthority
      namespace: fin-strategy
      localName: calculationAuthority
      label: calculation authority
      definition: >-
        Calculation Authority, is a functional relationship from a CalculationContext to the Party authority that scopes
        its stable identifier, used for restricting the identity of the calculation context to a single authority scope.
      cnNote: 计算权威关系，是从计算上下文指向界定其稳定标识的参与方权威的功能性关系，用于把计算上下文的身份限定在某一权威范围之内。
      domain: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    usesFactor:
      iri: https://axiolune.ai/ontology/finance/strategy-research/usesFactor
      namespace: fin-strategy
      localName: usesFactor
      label: uses factor
      definition: >-
        Uses Factor, is a relationship from a StrategyDefinition version to each exact FactorDefinition version on which
        it depends, used for modeling the strategy's factor dependencies as explicit exact-version bindings. The
        dependency is optional; a factor-strategy profile enforces at least one factor, so that strategies which do not
        depend on predefined factors (index tracking, execution algorithms, market making, arbitrage, option hedging,
        event-driven, or rule-based strategies) are not forced to declare a spurious factor.
      cnNote: 使用因子关系，是从策略定义版本指向其依赖的每个精确因子定义版本的关系，用于把策略的因子依赖显式建模为精确版本绑定。该依赖为可选；因子策略画像强制至少一个因子，使不依赖预定义因子的策略（指数跟踪、执行算法、做市、套利、期权对冲、事件驱动或规则策略）不必声明伪造因子。
      domain: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
      range: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
    backtestStrategy:
      iri: https://axiolune.ai/ontology/finance/strategy-research/backtestStrategy
      namespace: fin-strategy
      localName: backtestStrategy
      label: backtest strategy
      definition: >-
        Backtest Strategy, is a functional relationship from a BacktestRun to the exact StrategyDefinition version under
        evaluation, used for locking the strategy version applied by the backtest.
      cnNote: 回测策略关系，是从回测运行指向其所评估的精确策略定义版本的功能性关系，用于锁定回测所施加的策略版本。
      domain: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
      range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
      characteristics:
        - functional
    backtestPortfolio:
      iri: https://axiolune.ai/ontology/finance/strategy-research/backtestPortfolio
      namespace: fin-strategy
      localName: backtestPortfolio
      label: backtest portfolio
      definition: >-
        Backtest Portfolio, is a functional relationship from a BacktestRun to an optional exact Portfolio version, used
        for binding the backtest's initial portfolio context to a concrete portfolio.
      cnNote: 回测组合关系，是从回测运行指向可选的精确组合版本的功能性关系，用于把回测的初始组合上下文绑定到具体组合。
      domain: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
      range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
      characteristics:
        - functional
    backtestBenchmarkInstrument:
      iri: https://axiolune.ai/ontology/finance/strategy-research/backtestBenchmarkInstrument
      namespace: fin-strategy
      localName: backtestBenchmarkInstrument
      label: backtest benchmark instrument
      definition: >-
        Backtest Benchmark Instrument, is a functional relationship from a BacktestRun to an optional exact
        FinancialInstrument version, used for designating the benchmark instrument referenced by the backtest.
      cnNote: 回测基准工具关系，是从回测运行指向可选的精确金融工具版本的功能性关系，用于指定回测所参照的基准工具。
      domain: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    researchGenerator:
      iri: https://axiolune.ai/ontology/finance/strategy-research/researchGenerator
      namespace: fin-strategy
      localName: researchGenerator
      label: research generator
      definition: >-
        Research Generator, is a functional relationship from a ResearchRun to the exact SignalGenerator version
        evaluated by the research, used for locking the generator version examined by the research.
      cnNote: 研究生成器关系，是从研究运行指向其所评估的精确信号生成器版本的功能性关系，用于锁定研究考察的生成器版本。
      domain: https://axiolune.ai/ontology/finance/strategy-research/ResearchRun
      range: https://axiolune.ai/ontology/finance/strategy-research/SignalGenerator
      characteristics:
        - functional
    researchPortfolio:
      iri: https://axiolune.ai/ontology/finance/strategy-research/researchPortfolio
      namespace: fin-strategy
      localName: researchPortfolio
      label: research portfolio
      definition: >-
        Research Portfolio, is a functional relationship from a ResearchRun to an optional exact Portfolio version, used
        for defining the portfolio universe examined by the research.
      cnNote: 研究组合关系，是从研究运行指向可选的精确组合版本的功能性关系，用于界定研究考察的组合域。
      domain: https://axiolune.ai/ontology/finance/strategy-research/ResearchRun
      range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
      characteristics:
        - functional
    calculationBenchmarkInstrument:
      iri: https://axiolune.ai/ontology/finance/strategy-research/calculationBenchmarkInstrument
      namespace: fin-strategy
      localName: calculationBenchmarkInstrument
      label: calculation benchmark instrument
      definition: >-
        Calculation Benchmark Instrument, is a functional relationship from a CalculationContext to an optional exact
        benchmark FinancialInstrument version, used for designating the benchmark instrument for metric calculation.
      cnNote: 计算基准工具关系，是从计算上下文指向可选的精确基准金融工具版本的功能性关系，用于为指标计算指定基准工具。
      domain: https://axiolune.ai/ontology/finance/strategy-research/CalculationContext
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    strategyUniverse:
      iri: https://axiolune.ai/ontology/finance/strategy-research/strategyUniverse
      namespace: fin-strategy
      localName: strategyUniverse
      label: strategy universe
      definition: >-
        Strategy Universe, is a functional relationship from a StrategyDefinition to an optional exact UniverseDefinition
        version, used for binding the strategy's investable universe.
      cnNote: 策略投资域关系，是从策略定义指向可选的精确投资域定义版本的功能性关系，用于绑定策略的可投资域。
      domain: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
      range: https://axiolune.ai/ontology/finance/strategy-research/UniverseDefinition
      characteristics:
        - functional
    strategyPortfolioConstruction:
      iri: https://axiolune.ai/ontology/finance/strategy-research/strategyPortfolioConstruction
      namespace: fin-strategy
      localName: strategyPortfolioConstruction
      label: strategy portfolio construction
      definition: >-
        Strategy Portfolio Construction, is a functional relationship from a StrategyDefinition to an optional exact
        PortfolioConstructionPolicy version, used for binding the strategy's construction step.
      cnNote: 策略组合构造关系，是从策略定义指向可选的精确组合构造策略版本的功能性关系，用于绑定策略的构造步骤。
      domain: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
      range: https://axiolune.ai/ontology/finance/strategy-research/PortfolioConstructionPolicy
      characteristics:
        - functional
    strategyRebalance:
      iri: https://axiolune.ai/ontology/finance/strategy-research/strategyRebalance
      namespace: fin-strategy
      localName: strategyRebalance
      label: strategy rebalance
      definition: >-
        Strategy Rebalance, is a functional relationship from a StrategyDefinition to an optional exact RebalancePolicy
        version, used for binding the strategy's rebalance step.
      cnNote: 策略再平衡关系，是从策略定义指向可选的精确再平衡策略版本的功能性关系，用于绑定策略的再平衡步骤。
      domain: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
