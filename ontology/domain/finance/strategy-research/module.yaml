module:
  moduleIri: https://axiolune.ai/ontology/finance/strategy-research
  baseIri: https://axiolune.ai/ontology/finance/strategy-research/
  preferredPrefix: fin-strategy
  version: 0.2.0
  label: Strategy and Research
  definition: >-
    factor definitions, signal generation, strategy specifications, backtest execution, and performance observations
    that capture quantitative research and strategy development semantics
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
      version: 0.1.0
      artifactDigest: sha256:e64d6782499a636bb016bed59056cbcffef160c9ad43d78ff93a479285998295
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
      version: 0.1.0
      artifactDigest: sha256:081b14706df28e69f9b98308709c767885a58e2d958c265bf7b16768e3b901b7
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
      version: 0.1.0
      artifactDigest: sha256:211bc89c44260a21f809e360f35a3456dc7b6da544173aa4a2366e1fd18bae50
      importMode: All
  exports: []
  status: approved
domain:
  SignalDirection:
    iri: https://axiolune.ai/ontology/finance/strategy-research/SignalDirection
    namespace: fin-strategy
    localName: SignalDirection
    label: Signal Direction
    definition: controlled vocabulary indicating the directional bias of a trading signal (long, short, neutral, exit)
    values:
      - Long
      - Short
      - Neutral
      - Exit
    note: >-
      Aligned with Qlib predictions (continuous scores) discretized to directions. NautilusTrader PositionSide. Lean
      OrderDirection.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/strategy-research/SignalDirection
  FactorCategory:
    iri: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory
    namespace: fin-strategy
    localName: FactorCategory
    label: Factor Category
    definition: controlled vocabulary of factor types (fundamental, technical, alternative, macro)
    values:
      - Fundamental
      - Technical
      - Alternative
      - Macro
      - Statistical
      - Sentiment
    note: Common factor taxonomy in quantitative research. Qlib Alpha158 dataset contains technical+fundamental features.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/strategy-research/FactorCategory
  BacktestStatus:
    iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatus
    namespace: fin-strategy
    localName: BacktestStatus
    label: Backtest Status
    definition: controlled vocabulary of backtest execution states (pending, running, completed, failed, canceled)
    values:
      - Pending
      - Running
      - Completed
      - Failed
      - Canceled
    note: Lifecycle states for backtest runs. Aligned with typical async job states.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/strategy-research/BacktestStatus
  FactorDefinition:
    iri: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
    namespace: fin-strategy
    localName: FactorDefinition
    label: Factor Definition
    definition: >-
      specification of a quantitative factor including its calculation logic, input requirements, universe scope, and
      validity conditions
    note: >-
      Qlib Factor (Alpha158, Alpha360 predefined factors). Does not store computed factor values (those are
      FactorObservation Association).
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasFactorName
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasFactorCategory
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasFactorFormula
        minCount: 0
        maxCount: 1
  StrategyDefinition:
    iri: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
    namespace: fin-strategy
    localName: StrategyDefinition
    label: Strategy Definition
    definition: specification of a trading strategy including its logic, parameters, universe, risk controls, and execution rules
    note: >-
      NautilusTrader Strategy (base class for trading strategies). Lean QCAlgorithm (user strategy definition). Qlib
      Strategy (portfolio management strategy).
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasStrategyName
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasStrategyDescription
        minCount: 0
        maxCount: 1
  Signal:
    iri: https://axiolune.ai/ontology/finance/strategy-research/Signal
    namespace: fin-strategy
    localName: Signal
    label: Signal
    definition: >-
      point-in-time trading signal generated by a factor or strategy for a specific instrument with directional bias,
      strength, and validity period
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      Qlib prediction scores → discretized signals. NautilusTrader does not have explicit Signal; strategies generate
      orders directly. Signal as intermediate research artifact.
    participantRoles:
      - roleName: generatedByFactor
        range: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
        minCount: 0
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/generatedByFactor
      - roleName: generatedByStrategy
        range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
        minCount: 0
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/generatedByStrategy
      - roleName: signalForInstrument
        range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
        minCount: 1
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/signalForInstrument
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasSignalDirection
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasSignalStrength
        minCount: 0
        maxCount: 1
  BacktestRun:
    iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
    namespace: fin-strategy
    localName: BacktestRun
    label: Backtest Run
    definition: >-
      execution of a strategy definition over historical data with specified parameters, date range, initial capital,
      and resulting performance metrics
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      Qlib Backtest executor. NautilusTrader BacktestEngine (backtesting engine with event replay). Lean Algorithm
      backtesting mode. TemporalFact not applicable (BacktestRun itself is meta-level; performance observations have
      temporal semantics).
    participantRoles:
      - roleName: backtestsStrategy
        range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
        minCount: 1
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/backtestsStrategy
      - roleName: usedPortfolio
        range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
        minCount: 0
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/usedPortfolio
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasBacktestStatus
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasStartDate
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasEndDate
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasInitialCapital
        minCount: 0
        maxCount: 1
  PerformanceObservation:
    iri: https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation
    namespace: fin-strategy
    localName: PerformanceObservation
    label: Performance Observation
    definition: >-
      point-in-time or period-aggregate performance metrics for a backtest run or live strategy including returns,
      drawdown, Sharpe ratio, and other statistics
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      Qlib analysis metrics (IC, Sharpe, max drawdown). NautilusTrader PerformanceAnalyzer. Lean Statistics. Temporal
      semantics: validTime is the performance observation date; knowledgeTime is when calculated; availableFrom is when
      made queryable.
    participantRoles:
      - roleName: observedInBacktest
        range: https://axiolune.ai/ontology/finance/strategy-research/BacktestRun
        minCount: 1
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/observedInBacktest
      - roleName: observedForStrategy
        range: https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition
        minCount: 0
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/observedForStrategy
        label: observed for strategy
        definition: optional strategy definition whose performance is being observed
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasCumulativeReturn
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasMaxDrawdown
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasSharpeRatio
        minCount: 0
        maxCount: 1
  hasFactorName:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasFactorName
    namespace: fin-strategy
    localName: hasFactorName
    label: has factor name
    definition: human-readable name of the factor
    valueType: string
  hasFactorCategory:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasFactorCategory
    namespace: fin-strategy
    localName: hasFactorCategory
    label: has factor category
    definition: category classification of the factor (fundamental, technical, etc.)
    valueType: codelist
    codeListReference: FactorCategory
  hasFactorFormula:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasFactorFormula
    namespace: fin-strategy
    localName: hasFactorFormula
    label: has factor formula
    definition: textual or symbolic representation of the factor calculation logic
    note: Not executable code; human-readable formula. Executable logic resides in runtime.
    valueType: string
  hasStrategyName:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasStrategyName
    namespace: fin-strategy
    localName: hasStrategyName
    label: has strategy name
    definition: human-readable name of the strategy
    valueType: string
  hasStrategyDescription:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasStrategyDescription
    namespace: fin-strategy
    localName: hasStrategyDescription
    label: has strategy description
    definition: textual description of the strategy logic and objectives
    valueType: string
  hasSignalDirection:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasSignalDirection
    namespace: fin-strategy
    localName: hasSignalDirection
    label: has signal direction
    definition: directional bias of the signal (long, short, neutral, exit)
    valueType: codelist
    codeListReference: SignalDirection
  hasSignalStrength:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasSignalStrength
    namespace: fin-strategy
    localName: hasSignalStrength
    label: has signal strength
    definition: numerical measure of signal confidence or magnitude, typically normalized [-1, 1] or [0, 1]
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
    note: ' Round-2: dimensionless/ratio metrics use QuantityValue (unit=ratio|1), not bare decimal.'
  hasBacktestStatus:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasBacktestStatus
    namespace: fin-strategy
    localName: hasBacktestStatus
    label: has backtest status
    definition: execution state of the backtest run
    valueType: codelist
    codeListReference: BacktestStatus
  hasStartDate:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasStartDate
    namespace: fin-strategy
    localName: hasStartDate
    label: has start date
    definition: start date of the backtest simulation period
    valueType: instant
  hasEndDate:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasEndDate
    namespace: fin-strategy
    localName: hasEndDate
    label: has end date
    definition: end date of the backtest simulation period
    valueType: instant
  hasInitialCapital:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasInitialCapital
    namespace: fin-strategy
    localName: hasInitialCapital
    label: has initial capital
    definition: starting capital amount for the backtest run
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
  hasCumulativeReturn:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasCumulativeReturn
    namespace: fin-strategy
    localName: hasCumulativeReturn
    label: has cumulative return
    definition: cumulative return percentage at the observation point
    note: >-
      Expressed as decimal (0.15 = 15% return). Round-2: dimensionless/ratio metrics use QuantityValue (unit=ratio|1),
      not bare decimal.
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
  hasMaxDrawdown:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasMaxDrawdown
    namespace: fin-strategy
    localName: hasMaxDrawdown
    label: has max drawdown
    definition: maximum peak-to-trough decline as percentage
    note: >-
      Expressed as positive decimal (0.25 = 25% drawdown). Round-2: dimensionless/ratio metrics use QuantityValue
      (unit=ratio|1), not bare decimal.
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
  hasSharpeRatio:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasSharpeRatio
    namespace: fin-strategy
    localName: hasSharpeRatio
    label: has Sharpe ratio
    definition: risk-adjusted return metric (mean excess return divided by standard deviation of returns)
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
    note: ' Round-2: dimensionless/ratio metrics use QuantityValue (unit=ratio|1), not bare decimal.'
  hasFactorPeriod:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasFactorPeriod
    namespace: fin-strategy
    localName: hasFactorPeriod
    label: Has Factor Period
    definition: reporting period key for a factor observation (e.g. 200704), distinct from publication/knowledge time
    valueType: string
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Qlib PIT period column; not the same as market-data bar valid time
  hasFactorValue:
    iri: https://axiolune.ai/ontology/finance/strategy-research/hasFactorValue
    namespace: fin-strategy
    localName: hasFactorValue
    label: Has Factor Value
    definition: observed factor numeric value for a (instrument, period) under a publication/knowledge/availability triple
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
    defaultCardinality:
      minCount: 1
      maxCount: 1
  FactorObservation:
    iri: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
    namespace: fin-strategy
    localName: FactorObservation
    label: Factor Observation
    definition: >-
      revision-aware observation of a factor value for an instrument and reporting period, with publication (knowledge)
      time distinct from period and availability time (Qlib PIT model)
    participantRoles:
      - roleName: observesFactor
        range: https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition
        minCount: 1
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/observesFactor
      - roleName: observedInstrument
        range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
        minCount: 1
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/observedInstrument
      - roleName: nextRevision
        range: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
        minCount: 0
        maxCount: 1
        roleIri: https://axiolune.ai/ontology/finance/strategy-research/nextRevision
        note: >-
          Qlib dump_pit `_next` linked-list pointer: successive revised value for the same (instrument, period).
          Null/absent means terminal revision. Distinct from knowledgeTo interval closure.
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasFactorPeriod
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/strategy-research/hasFactorValue
        minCount: 1
        maxCount: 1
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        rationale: valid≈period effectivity; knowledge≈publication/revision; available≈research availability
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      Round-3: Qlib (date, period, value, _next) — nextRevision models `_next`. Three-axis TemporalFact covers
      publication/availability; revision chain is orthogonal to PriceObservation bar axes.
