      iri: https://axiolune.ai/ontology/finance/strategy-research/RunContextKind
      namespace: fin-strategy
      localName: RunContextKind
      label: Run Context Kind
      definition: >-
        Run Context Kind, is a closed classification of the execution purpose and input regime of a RunContext, used
        for distinguishing run categories such as backtest, research, and live.
      cnNote: 运行上下文类别分类，是对运行上下文执行目的与输入制度的封闭分类，用于区分回测、研究与实盘等运行类别。
      vocabulary: Run Context Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/strategy-research/RunContextKind/value/backtest
          notation: backtest
          label: backtest
          definition: Run replays historical inputs through an immutable BacktestRun configuration.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/RunContextKind/value/research
          notation: research
          label: research
          definition: Run evaluates a research question and generator against an immutable dataset snapshot.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/RunContextKind/value/live
          notation: live
          label: live
          definition: Run consumes PIT-authorized live inputs under a locked execution context.
    BacktestLifecycleState:
      iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState
      namespace: fin-strategy
      localName: BacktestLifecycleState
      label: Backtest Lifecycle State
      definition: >-
        Backtest Lifecycle State, is a closed event-derived lifecycle classification of a BacktestRun reconstructed from
        its immutable lifecycle events, used for characterizing the evolution stage of a backtest run.
      cnNote: 回测生命周期状态分类，是由不可变生命周期事件重构的回测运行生命周期封闭分类，用于刻画回测运行的演进阶段。
      vocabulary: Backtest Lifecycle State
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/planned
          notation: planned
          label: planned
          definition: Run configuration exists but execution has not started.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/running
          notation: running
          label: running
          definition: Run execution has started and has no terminal event.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/completed
          notation: completed
          label: completed
          definition: Run execution completed and produced closed result evidence.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/failed
          notation: failed
          label: failed
          definition: Run execution terminated with immutable failure evidence.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/cancelled
          notation: cancelled
          label: cancelled
          definition: Run execution was cancelled by an authorized decision.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/invalidated
          notation: invalidated
          label: invalidated
          definition: A previously completed run was invalidated by a reviewed decision.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/paused
          notation: paused
          label: paused
          definition: Run execution was paused and may resume.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/partial
          notation: partial
          label: partial
          definition: Run execution produced a partial result before a terminal event.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/reviewed
          notation: reviewed
          label: reviewed
          definition: A previously failed run was reviewed.
        - iri: https://axiolune.ai/ontology/finance/strategy-research/BacktestLifecycleState/value/rejected
          notation: rejected
          label: rejected
          definition: A previously failed run was rejected after review.
