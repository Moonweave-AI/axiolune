  attributeTypes:
    generatorId:
      iri: https://axiolune.ai/ontology/finance/strategy-research/generatorId
      namespace: fin-strategy
      localName: generatorId
      label: generator identifier
      definition: >-
        Generator Identifier, is an authority-scoped stable identifier of a SignalGenerator logical identity, used for
        uniquely referring to a signal generator's logical identity within a single authority scope.
      cnNote: 生成器标识，是信号生成器逻辑身份的权威范围稳定标识，用于在单一权威下唯一指代一个信号生成器的逻辑身份。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    generatorName:
      iri: https://axiolune.ai/ontology/finance/strategy-research/generatorName
      namespace: fin-strategy
      localName: generatorName
      label: generator name
      definition: >-
        Generator Name, is a human-readable name attribute of a SignalGenerator version, used for providing a
        natural-language label by which the generator version can be easily recognized.
      cnNote: 生成器名称，是信号生成器版本的人类可读名称属性，用于以自然语言为该生成器版本提供便于人识别的称谓。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    implementationDigest:
      iri: https://axiolune.ai/ontology/finance/strategy-research/implementationDigest
      namespace: fin-strategy
      localName: implementationDigest
      label: implementation digest
      definition: >-
        Implementation Digest, is the SHA-256 digest of the exact executable implementation bytes, used for precisely
        locking the executable implementation content adopted by the generator.
      cnNote: 实现摘要，是可执行实现字节流的 SHA-256 摘要，用于精确锁定生成器所采用的可执行实现内容。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    inputContractDigest:
      iri: https://axiolune.ai/ontology/finance/strategy-research/inputContractDigest
      namespace: fin-strategy
      localName: inputContractDigest
      label: input contract digest
      definition: >-
        Input Contract Digest, is the SHA-256 digest of the canonical input contract, used for precisely locking the
        input contract content accepted by the generator.
      cnNote: 输入契约摘要，是规范化输入契约的 SHA-256 摘要，用于精确锁定生成器所接受的输入契约内容。
