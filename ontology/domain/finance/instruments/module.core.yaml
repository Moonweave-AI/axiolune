    - relation: https://axiolune.ai/ontology/finance/instruments/quotationInstrument
      subjectType: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      objectType: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/LogicalReference
          targetElement: https://axiolune.ai/ontology/finance/instruments/quotationInstrument
    - relation: https://axiolune.ai/ontology/finance/instruments/quotationListingContext
      subjectType: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      objectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      outboundCardinality:
        minCount: 0
