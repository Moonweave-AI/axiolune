    - relation: https://axiolune.ai/ontology/finance/instruments/listingQuoteCurrency
      subjectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      objectType: https://axiolune.ai/ontology/finance/foundation/Currency
