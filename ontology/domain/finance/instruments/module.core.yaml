    - relation: https://axiolune.ai/ontology/finance/instruments/quotationQuoteCurrency
      subjectType: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      objectType: https://axiolune.ai/ontology/finance/foundation/Currency
