    - relation: https://axiolune.ai/ontology/finance/instruments/quotationOTCContext
      subjectType: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      objectType: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
