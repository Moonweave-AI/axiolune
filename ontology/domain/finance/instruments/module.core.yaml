# fin-instruments — domain core (Phase B)
# Practitioner-first semantics. See M2-DEFINITION-STYLE-GUIDE.md

module:
  moduleIri: https://axiolune.ai/ontology/finance/instruments
  baseIri: https://axiolune.ai/ontology/finance/instruments/
  preferredPrefix: fin-instruments
  version: 2.0.0
  label: Financial Instruments
  definition: >-
    Identifies tradable instruments (securities, listings, issuers) and how they are quoted on venues.
    Covers ISIN-level instrument identity, exchange listings, primary offerings, and issuance—not orders or prices.
  cnNote: >-
    定义可交易金融工具（证券、上市、发行人）及其在场所的报价方式；涵盖 ISIN 级工具身份、挂牌、发行要约与正式发行，不含订单或行情。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    FinancialInstrument:
      iri: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      namespace: fin-instruments
      localName: FinancialInstrument
      label: Financial Instrument
      definition: >-
        A tradable financial contract identified independently of where it is listed.
        Example: corporate bond identified by ISIN. Not: a price quote, an order, or a custody balance.
      cnNote: 可独立识别的可交易金融合约（如 ISIN 标识的公司债）；不是报价、订单或托管余额。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Security:
      iri: https://axiolune.ai/ontology/finance/instruments/Security
      namespace: fin-instruments
      localName: Security
      label: Security
      definition: >-
        A financial instrument issued and regulated as a security (equity, bond, fund share, etc.).
        Example: listed common stock. Not: an OTC derivative without issuance workflow.
      cnNote: 按证券监管发行与交易的金融工具（股票、债券、基金份额等）；不是未走发行流程的场外衍生品。
      superTypes:
        - https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    EquitySecurity:
      iri: https://axiolune.ai/ontology/finance/instruments/EquitySecurity
      namespace: fin-instruments
      localName: EquitySecurity
      label: Equity Security
      definition: >-
        An ownership stake in an issuer or asset pool—typically common or preferred stock.
        Example: ordinary shares of a listed company. Not: a bond or a cash balance.
      cnNote: 对发行人或资产池的所有权份额（通常指普通股或优先股）；不是债券或现金余额。
      superTypes:
        - https://axiolune.ai/ontology/finance/instruments/Security
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SecurityOffering:
      iri: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      namespace: fin-instruments
      localName: SecurityOffering
      label: Security Offering
      definition: >-
        A planned or announced sale of a security before formal issuance completes.
        Example: IPO prospectus stage. Not: secondary-market trading or venue listing.
      cnNote: 正式发行完成前的证券发售计划或公告（如 IPO 招股阶段）；不是二级市场交易或场所挂牌。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/offeringId
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    InstrumentListing:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      namespace: fin-instruments
      localName: InstrumentListing
      label: Instrument Listing
      definition: >-
        The fact that an instrument trades on a specific venue under that venue's listing code (MIC + local symbol).
        Example: A-share on SSE with local ticker. Not: the instrument itself or a historical price.
      cnNote: 某工具在特定交易场所、以该场所上市代码挂牌交易的事实；不是工具本身，也不是历史价格。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/listingBusinessFrom
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/listingBusinessTo
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    DirectUnitPriceQuotationContract:
      iri: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      namespace: fin-instruments
      localName: DirectUnitPriceQuotationContract
      label: Direct Unit Price Quotation Contract
      definition: >-
        Prices the instrument as currency per single unit (e.g. CNY per share). Standard for listed equities.
        Example: ¥10.25 per share on SSE. Not: yield-to-maturity or percent-of-par quotes.
      cnNote: 以「货币/单位」报价（如每股 10.25 元），常见于上市股票；不是到期收益率或面值百分比报价。
      superTypes:
        - https://axiolune.ai/ontology/finance/instruments/QuotationConvention
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/quotationDenominatorUnit
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/quotationKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/contractMultiplier
          minCount: 1
          maxCount: 1
          defaultValue: '1'
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    QuotationConvention:
      iri: https://axiolune.ai/ontology/finance/instruments/QuotationConvention
      namespace: fin-instruments
      localName: QuotationConvention
      label: Quotation Convention
      definition: >-
        The rule for how market prices are expressed for an instrument (per-unit cash, percent of par, yield, etc.).
        Example: direct unit price for stocks; yield for bonds. Not: the price observation itself.
      cnNote: 工具市价如何表达（单位现金价、面值百分比、收益率等）；不是某一条具体行情记录。
      superTypes: []
      abstract: true
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    InstrumentIssuance:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentIssuance
      namespace: fin-instruments
      localName: InstrumentIssuance
      label: Instrument Issuance
      definition: >-
        Records when a security is formally issued and links it to the issuing legal entity.
        Example: IPO allotment creating new shares. Not: a secondary trade or a listing event alone.
      cnNote: 证券正式发行的事实，关联发行法人；不是二级市场买卖或单独的挂牌事件。
      participantRoles:
        - id: issuedSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 1
          maxCount: 1
          label: Issued Security
          definition: exact Security version brought into existence by this issuance
        - id: issuer
          range: https://axiolune.ai/ontology/finance/foundation/LegalEntity
          minCount: 1
          maxCount: 1
          label: Issuer
          definition: exact LegalEntity version acting as issuer in this issuance fact
        - id: originatingOffering
          range: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
          minCount: 0
          maxCount: 1
          label: Originating Offering
          definition: optional exact SecurityOffering version from which this issuance originates
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/issuanceId
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    InstrumentClassificationAssertion:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentClassificationAssertion
      namespace: fin-instruments
      localName: InstrumentClassificationAssertion
      label: Instrument Classification Assertion
      definition: >-
        States how an instrument is classified under a standard scheme (e.g. ISO CFI) during a valid period.
        Example: equity / common stock code for a share. Not: the instrument's ISIN or listing ticker.
      cnNote: 工具在某一有效期间内按标准方案（如 ISO CFI）的分类断言；不是 ISIN 或上市代码本身。
      participantRoles:
        - id: classifiedInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: classified instrument
          definition: exact FinancialInstrument version being classified
        - id: classificationScheme
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
          minCount: 1
          maxCount: 1
          label: classification scheme
          definition: logical IdentifierScheme identity governing the classification
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/classificationCode
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/classificationCategory
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/classificationEffectiveFrom
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/classificationEffectiveTo
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    offeredSecurity:
      iri: https://axiolune.ai/ontology/finance/instruments/offeredSecurity
      namespace: fin-instruments
      localName: offeredSecurity
      label: Offered Security
      definition: >-
        Offered Security, is a relation that links a SecurityOffering version to the exact Security version it offers,
        used to specify which Security version the offering is directed at.
      cnNote: 所约证券，是关联证券要约版本与其所约确切证券版本的关系，用于指明该要约具体针对哪一证券版本。
      domain: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      range: https://axiolune.ai/ontology/finance/instruments/Security
      characteristics:
        - functional
    listingIdentifierScheme:
      iri: https://axiolune.ai/ontology/finance/instruments/listingIdentifierScheme
      namespace: fin-instruments
      localName: listingIdentifierScheme
      label: Listing Identifier Scheme
      definition: >-
        Listing Identifier Scheme, is a direct identity slot relating an InstrumentListing to exactly one venue-listing
        IdentifierScheme logical identity, used to determine which identifier scheme the listing adopts.
      cnNote: 上市标识方案，是关联工具上市与其唯一场所上市标识方案逻辑身份的直接身份槽，用于确定该上市采用何种标识体系。
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      characteristics:
        - functional
    listingIdentifierValue:
      iri: https://axiolune.ai/ontology/finance/instruments/listingIdentifierValue
      namespace: fin-instruments
      localName: listingIdentifierValue
      label: Listing Identifier Value
      definition: >-
        Listing Identifier Value, is a direct identity slot relating an InstrumentListing to exactly one
        LocalIdentifierValue logical identity governed by its listing scheme, used to determine the specific value the
        listing carries under that scheme.
      cnNote: 上市标识取值，是关联工具上市与其受上市方案管辖的本地标识取值逻辑身份的直接身份槽，用于确定上市在该方案下的具体取值。
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValue
      characteristics:
        - functional
    listedInstrument:
      iri: https://axiolune.ai/ontology/finance/instruments/listedInstrument
      namespace: fin-instruments
      localName: listedInstrument
      label: Listed Instrument
      definition: >-
        Listed Instrument, is a relation that links an InstrumentListing version to the exact FinancialInstrument
        version admitted by that listing, used to specify which financial instrument the listing admits.
      cnNote: 上市工具，是关联工具上市版本与其所接纳的确切金融工具版本的关系，用于指明该上市接纳的是哪一金融工具。
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    listingFacility:
      iri: https://axiolune.ai/ontology/finance/instruments/listingFacility
      namespace: fin-instruments
      localName: listingFacility
      label: Listing Facility
      definition: >-
        Listing Facility, is a relation that links an InstrumentListing version to the exact TradingFacility version at
        which it is listed, used to record the trading facility to which the listing belongs.
      cnNote: 上市场所，是关联工具上市版本与其挂牌的确切交易场所版本的关系，用于记录该上市所属的交易设施。
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    originatingOffering:
      iri: https://axiolune.ai/ontology/finance/instruments/originatingOffering
      namespace: fin-instruments
      localName: originatingOffering
      label: Originating Offering
      definition: >-
        Originating Offering, is a relation that links an InstrumentListing version to its optional exact originating
        SecurityOffering version, used to trace which offering the listing originates from.
      cnNote: 起源要约，是关联工具上市版本与其可选的确切起源证券要约版本的关系，用于追溯该上市来自哪一要约。
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      characteristics:
        - functional
    listingQuoteCurrency:
      iri: https://axiolune.ai/ontology/finance/instruments/listingQuoteCurrency
      namespace: fin-instruments
      localName: listingQuoteCurrency
      label: Listing Quote Currency
      definition: >-
        Listing Quote Currency, is the sole stored relation from an InstrumentListing version to the Currency logical
        identity in which that listing is quoted, used to record the currency in which the listing is priced.
      cnNote: 上市计价货币，是工具上市版本到其计价货币逻辑身份的唯一存储关系，用于记录该上市以何种货币计价。
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    isTradedOn:
      iri: https://axiolune.ai/ontology/finance/instruments/isTradedOn
      namespace: fin-instruments
      localName: isTradedOn
      label: Is Traded On
      definition: >-
        Is Traded On, is a derived convenience relation from a FinancialInstrument to a TradingFacility, used to derive
        where the instrument can be traded based on point-in-time-eligible active listings, and is never stored as an
        independent truth.
      cnNote: 交易场所派生关系，是由金融工具到交易场所的派生便利关系，用于基于时点合格的有效上市推导工具可在何处交易，不作为独立事实存储。
      domain: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
    quotationInstrument:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationInstrument
      namespace: fin-instruments
      localName: quotationInstrument
      label: Quotation Instrument
      definition: >-
        Quotation Instrument, is a relation that links a DirectUnitPriceQuotationContract to its FinancialInstrument
        logical identity, used to specify which financial instrument the quotation is directed at.
      cnNote: 报价工具，是关联直接单位报价合约与其金融工具逻辑身份的关系，用于指明该报价针对哪一金融工具。
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    quotationListingContext:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationListingContext
      namespace: fin-instruments
      localName: quotationListingContext
      label: Quotation Listing Context
      definition: >-
        Quotation Listing Context, is a relation that links a quotation contract to its optional exact InstrumentListing
        context version, used to situate the quotation within a specific listing scene.
      cnNote: 报价上市语境，是关联报价合约与其可选的确切工具上市语境版本的关系，用于将报价置于特定上市场景。
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      characteristics:
        - functional
    quotationOTCContext:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationOTCContext
      namespace: fin-instruments
      localName: quotationOTCContext
      label: Quotation OTC Context
      definition: >-
        Quotation OTC Context, is a relation that links a quotation contract to its optional exact OTCTradingContext
        version, used to situate the quotation within a specific over-the-counter scene.
      cnNote: 报价场外语境，是关联报价合约与其可选的确切场外交易语境版本的关系，用于将报价置于特定场外场景。
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      characteristics:
        - functional
    quotationQuoteCurrency:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationQuoteCurrency
      namespace: fin-instruments
      localName: quotationQuoteCurrency
      label: Quotation Quote Currency
      definition: >-
        Quotation Quote Currency, is a relation that links a quotation contract to its exact quote Currency logical
        identity, used to record the currency in which the quotation is priced.
      cnNote: 报价计价货币，是关联报价合约与其确切计价货币逻辑身份的关系，用于记录该报价以何种货币计价。
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    isAdmittedToTradingOn:
      iri: https://axiolune.ai/ontology/finance/instruments/isAdmittedToTradingOn
      namespace: fin-instruments
      localName: isAdmittedToTradingOn
      label: Is Admitted To Trading On
      definition: >-
        Is Admitted To Trading On, is a derived convenience relation from a FinancialInstrument to a TradingFacility,
        holding when the instrument has at least one point-in-time-eligible active listing at the given as-of time, used
        for indicating admission to trading rather than actual tradeability
      cnNote: 准入交易场所关系，是由金融工具到交易场所的派生便利关系，当工具在给定时间点至少有一个合格有效上市时成立，用于表示准入交易而非实际可交易性。
      domain: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
  attributeTypes:
    offeringId:
      iri: https://axiolune.ai/ontology/finance/instruments/offeringId
      namespace: fin-instruments
      localName: offeringId
      label: Offering Identifier
      definition: >-
        Offering Identifier, is a non-empty source-scoped identifier for one logical SecurityOffering, used to uniquely
        denote a single security offering within source data.
      cnNote: 要约标识，是某一逻辑证券要约在来源数据作用域内的非空标识，用于在来源数据中唯一指认一个证券要约。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    issuanceId:
      iri: https://axiolune.ai/ontology/finance/instruments/issuanceId
      namespace: fin-instruments
      localName: issuanceId
      label: Issuance Identifier
      definition: >-
        Issuance Identifier, is a non-empty source-scoped identifier for one logical InstrumentIssuance, used to
        uniquely denote a single instrument issuance within source data.
      cnNote: 发行标识，是某一逻辑工具发行在来源数据作用域内的非空标识，用于在来源数据中唯一指认一次工具发行。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    listingBusinessFrom:
      iri: https://axiolune.ai/ontology/finance/instruments/listingBusinessFrom
      namespace: fin-instruments
      localName: listingBusinessFrom
      label: Listing Business From
      definition: >-
        Listing Business From, is the inclusive business date from which an InstrumentListing comes into force, used to
        mark the business day on which a listing enters its valid state.
      cnNote: 上市生效起始日，是工具上市开始生效的含起始业务日期，用于标记某一上市从哪一业务日起进入有效状态。
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    listingBusinessTo:
      iri: https://axiolune.ai/ontology/finance/instruments/listingBusinessTo
      namespace: fin-instruments
      localName: listingBusinessTo
      label: Listing Business To
      definition: >-
        Listing Business To, is the optional exclusive business date at which an InstrumentListing ceases to be in
        force, used to mark the business day on which a listing leaves its valid state.
      cnNote: 上市生效截止日，是工具上市失效的可选不含截止业务日期，用于标记某一上市于哪一业务日不再处于有效状态。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    quotationDenominatorUnit:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationDenominatorUnit
      namespace: fin-instruments
      localName: quotationDenominatorUnit
      label: Quotation Denominator Unit
      definition: >-
        Quotation Denominator Unit, is a controlled unit IRI denoting the single Quantity unit against which the direct
        price is quoted, used to determine the unit of measurement in which the price is expressed.
      cnNote: 报价分母单位，是表示直接报价所针对的唯一数量单位的受控单位 IRI，用于确定价格以何种计量单位计报。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    quotationKind:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationKind
      namespace: fin-instruments
      localName: quotationKind
      label: Quotation Kind
      definition: >-
        Quotation Kind, is a closed-set quotation application classification value required on a direct unit-price
        contract, used to constrain the quotation method of that contract.
      cnNote: 报价类型，是直接单位报价合约上所要求的封闭式报价应用分类取值，用于限定该合约的报价方式。
      valueType: https://axiolune.ai/ontology/finance/instruments/QuotationKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    contractMultiplier:
      iri: https://axiolune.ai/ontology/finance/instruments/contractMultiplier
      namespace: fin-instruments
      localName: contractMultiplier
      label: Contract Multiplier
      definition: >-
        Contract Multiplier, is a dimensionless multiplier constrained to decimal one by the direct-unit quotation
        profile, used to ensure scale consistency of unit-price quotations.
      cnNote: 合约乘数，是直接单位报价轮廓约束为十进制一的无量纲乘数，用于确保单位报价的标度一致性。
      valueType: decimal
      defaultCardinality:
        minCount: 1
        maxCount: 1
    normalizationContractRef:
      iri: https://axiolune.ai/ontology/finance/instruments/normalizationContractRef
      namespace: fin-instruments
      localName: normalizationContractRef
      label: Normalization Contract Reference
      definition: >-
        Normalization Contract Reference, is the absolute IRI of the immutable normalization contract used to
        materialize quotation semantics, used to anchor the normalization definition on which the quotation rests.
      cnNote: 规范化合约引用，是用于实体化报价语义的不可变规范化合约的绝对 IRI，用于锚定报价所依据的规范化定义。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    normalizationContractDigest:
      iri: https://axiolune.ai/ontology/finance/instruments/normalizationContractDigest
      namespace: fin-instruments
      localName: normalizationContractDigest
      label: Normalization Contract Digest
      definition: >-
        Normalization Contract Digest, is a lowercase SHA-256 digest authenticating the exact bytes of the quotation
        normalization contract, used to verify the integrity of the referenced normalization contract.
      cnNote: 规范化合约摘要，是认证确切报价规范化合约字节的 SHA-256 小写摘要，用于校验所引用规范化合约的完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    classificationCode:
      iri: https://axiolune.ai/ontology/finance/instruments/classificationCode
      namespace: fin-instruments
      localName: classificationCode
      label: Classification Code
      definition: >-
        Classification Code, is a non-empty code string assigned under a classification scheme (e.g., a 6-character CFI
        code per ISO 10962), used for carrying the classification value of an instrument
      cnNote: 分类码，是在分类方案下分配的非空代码字符串（如依ISO 10962的六字符CFI代码），用于承载工具的分类取值。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    classificationCategory:
      iri: https://axiolune.ai/ontology/finance/instruments/classificationCategory
      namespace: fin-instruments
      localName: classificationCategory
      label: Classification Category
      definition: >-
        Classification Category, is a reviewed asset-level category member required on an instrument classification
        assertion, used for characterizing the top-level asset class of the classified instrument
      cnNote: 分类类别，是工具分类断言上必备的受审资产层类别成员，用于刻画被分类工具的顶层资产类别。
      valueType: https://axiolune.ai/ontology/finance/instruments/CFICategory
      defaultCardinality:
        minCount: 1
        maxCount: 1
    classificationEffectiveFrom:
      iri: https://axiolune.ai/ontology/finance/instruments/classificationEffectiveFrom
      namespace: fin-instruments
      localName: classificationEffectiveFrom
      label: Classification Effective From
      definition: >-
        Classification Effective From, is the inclusive date from which an instrument classification assertion comes
        into force, used to mark the start of the classification's valid interval
      cnNote: 分类生效起始日，是工具分类断言开始生效的含起始日期，用于标记分类有效区间的起点。
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    classificationEffectiveTo:
      iri: https://axiolune.ai/ontology/finance/instruments/classificationEffectiveTo
      namespace: fin-instruments
      localName: classificationEffectiveTo
      label: Classification Effective To
      definition: >-
        Classification Effective To, is the optional exclusive date at which an instrument classification assertion
        ceases to be in force, used to mark the end of the classification's valid interval
      cnNote: 分类生效截止日，是工具分类断言失效的可选不含截止日期，用于标记分类有效区间的终点。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
  identifierTypes: {}
  codeLists:
    QuotationKind:
      iri: https://axiolune.ai/ontology/finance/instruments/QuotationKind
      namespace: fin-instruments
      localName: QuotationKind
      label: Quotation Kind
      definition: >-
        Quotation Kind, is a closed controlled vocabulary admitting only direct unit price, used to provide a
        classification scheme of quotation methods for direct unit-price quotation contracts.
      cnNote: 报价类型表，是仅允许直接单位报价的封闭式受控词汇，用于为直接单位报价合约提供报价方式的分类体系。
      vocabulary: Quotation Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/instruments/QuotationKind/value/directUnitPrice
          notation: directUnitPrice
          label: Direct Unit Price
          definition: quotation kind expressing one quote-currency amount per one denominator Quantity unit
    CFICategory:
      iri: https://axiolune.ai/ontology/finance/instruments/CFICategory
      namespace: fin-instruments
      localName: CFICategory
      label: CFI Category
      definition: >-
        CFI Category, is a controlled vocabulary of ISO 10962 asset-level categories, used for classifying the top-level
        asset class of a financial instrument in an instrument classification assertion
      cnNote: CFI类别，是ISO 10962资产层类别的受控词表，用于在工具分类断言中分类金融工具的顶层资产类别。
      vocabulary: CFI Category
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/instruments/CFICategory/value/equity
          notation: equity
          label: Equity
          definition: instruments representing ownership interests (ISO 10962 category E)
        - iri: https://axiolune.ai/ontology/finance/instruments/CFICategory/value/debt
          notation: debt
          label: Debt
          definition: instruments representing claims on the issuer (ISO 10962 category D)
        - iri: https://axiolune.ai/ontology/finance/instruments/CFICategory/value/derivative
          notation: derivative
          label: Derivative
          definition: instruments whose value derives from an underlying (ISO 10962 category S for futures, O for options)
        - iri: https://axiolune.ai/ontology/finance/instruments/CFICategory/value/fund
          notation: fund
          label: Fund
          definition: instruments representing collective investment vehicles (ISO 10962 category C)
        - iri: https://axiolune.ai/ontology/finance/instruments/CFICategory/value/other
          notation: other
          label: Other
          definition: instruments not falling into equity, debt, derivative, or fund categories
  constraints:
    InstrumentIssuanceContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentIssuanceContract
      namespace: fin-instruments
      localName: InstrumentIssuanceContract
      label: Instrument Issuance Contract
      definition: >-
        join constraint requiring any originating offering to offer the exact Security version issued by the issuance
        fact
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: originatingOffering absent or originatingOffering.offeredSecurity = issuedSecurity
      severity: Error
      message: issuance originating offering does not offer the issued Security version
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentIssuance
    InstrumentListingIdentityContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListingIdentityContract
      namespace: fin-instruments
      localName: InstrumentListingIdentityContract
      label: Instrument Listing Identity Contract
      definition: >-
        identity and authorization constraint fixing one listing to its facility, venue-listing scheme, venue-listing
        value, exact instrument, and sole quote-currency truth
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(versionOf(listingFacility),listingIdentifierScheme,listingIdentifierValue);
          listingIdentifierScheme.kind = venueListing; listingIdentifierValue is LocalIdentifierValue;
          listingIdentifierValue.scheme = listingIdentifierScheme; exactlyOne(listingQuoteCurrency); listingFacility and
          listedInstrument are exactVersionPITEligibleAt(self.validFrom,self.knowledgeFrom,self.availableFrom);
          exactlyOne(PITEligible listingIdentifierScheme version) and exactlyOne(PITEligible listingIdentifierValue
          version); exactlyOne(PITEligible active ListingIdentifierSchemeAuthorization covering self.validInterval);
          exactlyOne(PITEligible active ISO4217RegistryEntry for listingQuoteCurrency joined to locked authority bytes)
      severity: Error
      message: listing identity, direct identifier path, or quote-currency truth is invalid
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    InstrumentListingOfferingContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListingOfferingContract
      namespace: fin-instruments
      localName: InstrumentListingOfferingContract
      label: Instrument Listing Offering Contract
      definition: >-
        optional-offering join constraint requiring the listed instrument to be the exact Security offered by the
        originating offering
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: originatingOffering absent or originatingOffering.offeredSecurity = listedInstrument
      severity: Error
      message: listing instrument differs from its originating offering's Security
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    InstrumentListingIntervalContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListingIntervalContract
      namespace: fin-instruments
      localName: InstrumentListingIntervalContract
      label: Instrument Listing Interval Contract
      definition: >-
        interval constraint requiring listing business dates to form a valid half-open interval contained by the
        version's valid-time interval
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: listingBusinessFrom < listingBusinessTo when present and business interval is within valid interval
      severity: Error
      message: listing business dates are invalid or lie outside the version valid interval
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    DirectUnitPriceQuotationRule:
      iri: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationRule
      namespace: fin-instruments
      localName: DirectUnitPriceQuotationRule
      label: Direct Unit Price Quotation Rule
      definition: >-
        executable context and equality constraint admitting exactly one listing or OTC context and forbidding every
        non-direct quotation application
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          quotationKind = directUnitPrice; contractMultiplier is explicitDecimalLexical and decimalEquals(1); listing
          branch => exact context is PITEligible and instrument and quote currency equal listing truths; OTC branch =>
          exact context is PITEligible and quote currency equals OTC context truth; quotationInstrument resolves to
          exactly one PITEligible FinancialInstrument version; exactlyOne(PITEligible active ISO4217RegistryEntry for
          quotationQuoteCurrency joined to locked authority bytes); consumed Quantity units are nonEmpty and denominator
          unit must equal every consumed Quantity unit; denominator unit joins the
          digestLockedControlledQuantityUnitRegistry for directUnitPriceQuotationDenominator;
          par|clean|dirty|accrued|inverse|notionalScaled|indexPoint forbidden
      severity: Error
      message: quotation contract has invalid context, currency, unit, quotation kind, or multiplier
      targetElement: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
    DirectUnitPriceQuotationContextXone:
      iri: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContextXone
      namespace: fin-instruments
      localName: DirectUnitPriceQuotationContextXone
      label: Direct Unit Price Quotation Context Xone
      definition: >-
        executable SHACL exclusive branch requiring one listing context or one OTC context on every direct unit-price
        quotation contract
      constraintType: Cardinality
      scope: Object
      expression:
        language: SHACL
        expression: sh:xone(quotationListingContext,quotationOTCContext)
      severity: Error
      message: quotation contract must select exactly one listing or OTC context
      targetElement: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
  relationUses:
