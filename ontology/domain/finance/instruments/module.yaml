module:
  moduleIri: https://axiolune.ai/ontology/finance/instruments
  baseIri: https://axiolune.ai/ontology/finance/instruments/
  preferredPrefix: fin-instruments
  version: 1.0.0
  label: Financial Instruments
  definition: >-
    instrument vocabulary for financial instruments, security offerings, issuance facts, independently referenceable
    listings, and the direct unit-price quotation contract admitted by the v0.3 equity slice
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    FinancialInstrument:
      iri: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      namespace: fin-instruments
      localName: FinancialInstrument
      label: Financial Instrument
      definition: >-
        identifiable financial contract that may be issued, offered, listed, observed, traded, or valued without
        conflating its identity with any particular listing
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Security:
      iri: https://axiolune.ai/ontology/finance/instruments/Security
      namespace: fin-instruments
      localName: Security
      label: Security
      definition: FinancialInstrument that can be offered and issued as a security
      superTypes:
        - https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    EquitySecurity:
      iri: https://axiolune.ai/ontology/finance/instruments/EquitySecurity
      namespace: fin-instruments
      localName: EquitySecurity
      label: Equity Security
      definition: Security that represents an ownership interest in an entity or pool of assets
      superTypes:
        - https://axiolune.ai/ontology/finance/instruments/Security
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SecurityOffering:
      iri: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      namespace: fin-instruments
      localName: SecurityOffering
      label: Security Offering
      definition: >-
        temporal offering record that offers exactly one exact Security version and remains distinct from both issuance
        and venue listing
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/offeringId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    InstrumentListing:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      namespace: fin-instruments
      localName: InstrumentListing
      label: Instrument Listing
      definition: >-
        independently referenceable versioned listing whose logical identity is exactly the listing facility,
        venue-listing identifier scheme, and venue-listing identifier value logical identities
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/listingBusinessFrom
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/listingBusinessTo
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    DirectUnitPriceQuotationContract:
      iri: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      namespace: fin-instruments
      localName: DirectUnitPriceQuotationContract
      label: Direct Unit Price Quotation Contract
      definition: >-
        versioned quotation application in which one instrument unit is priced directly as an amount of one quote
        currency for one controlled denominator Quantity-unit IRI in exactly one listing or OTC context
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/quotationDenominatorUnit
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/quotationKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/contractMultiplier
          minCount: 1
          maxCount: 1
          defaultValue: '1'
        - attribute: https://axiolune.ai/ontology/finance/instruments/normalizationContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/instruments/normalizationContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    InstrumentIssuance:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentIssuance
      namespace: fin-instruments
      localName: InstrumentIssuance
      label: Instrument Issuance
      definition: >-
        temporal issuance fact that links one exact Security version to its exact issuer LegalEntity version and
        optionally to its exact originating SecurityOffering version
      participantRoles:
        - id: issuedSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 1
          maxCount: 1
          label: Issued Security
          definition: exact Security version brought into existence by this issuance
        - id: issuer
          range: https://axiolune.ai/ontology/finance/foundation/LegalEntity
          minCount: 1
          maxCount: 1
          label: Issuer
          definition: exact LegalEntity version acting as issuer in this issuance fact
        - id: originatingOffering
          range: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
          minCount: 0
          maxCount: 1
          label: Originating Offering
          definition: optional exact SecurityOffering version from which this issuance originates
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/instruments/issuanceId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    offeredSecurity:
      iri: https://axiolune.ai/ontology/finance/instruments/offeredSecurity
      namespace: fin-instruments
      localName: offeredSecurity
      label: Offered Security
      definition: relates a SecurityOffering version to the exact Security version that it offers
      domain: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      range: https://axiolune.ai/ontology/finance/instruments/Security
      characteristics:
        - functional
    listingIdentifierScheme:
      iri: https://axiolune.ai/ontology/finance/instruments/listingIdentifierScheme
      namespace: fin-instruments
      localName: listingIdentifierScheme
      label: Listing Identifier Scheme
      definition: >-
        direct identity slot relating an InstrumentListing to exactly one venue-listing IdentifierScheme logical
        identity
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      characteristics:
        - functional
    listingIdentifierValue:
      iri: https://axiolune.ai/ontology/finance/instruments/listingIdentifierValue
      namespace: fin-instruments
      localName: listingIdentifierValue
      label: Listing Identifier Value
      definition: >-
        direct identity slot relating an InstrumentListing to exactly one LocalIdentifierValue logical identity governed
        by its listing scheme
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValue
      characteristics:
        - functional
    listedInstrument:
      iri: https://axiolune.ai/ontology/finance/instruments/listedInstrument
      namespace: fin-instruments
      localName: listedInstrument
      label: Listed Instrument
      definition: relates an InstrumentListing version to the exact FinancialInstrument version admitted by that listing
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    listingFacility:
      iri: https://axiolune.ai/ontology/finance/instruments/listingFacility
      namespace: fin-instruments
      localName: listingFacility
      label: Listing Facility
      definition: relates an InstrumentListing version to the exact TradingFacility version at which it is listed
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    originatingOffering:
      iri: https://axiolune.ai/ontology/finance/instruments/originatingOffering
      namespace: fin-instruments
      localName: originatingOffering
      label: Originating Offering
      definition: relates an InstrumentListing version to its optional exact originating SecurityOffering version
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      characteristics:
        - functional
    listingQuoteCurrency:
      iri: https://axiolune.ai/ontology/finance/instruments/listingQuoteCurrency
      namespace: fin-instruments
      localName: listingQuoteCurrency
      label: Listing Quote Currency
      definition: >-
        sole stored relation from an InstrumentListing version to the Currency logical identity in which that listing is
        quoted
      domain: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    isTradedOn:
      iri: https://axiolune.ai/ontology/finance/instruments/isTradedOn
      namespace: fin-instruments
      localName: isTradedOn
      label: Is Traded On
      definition: >-
        derived convenience relation from a FinancialInstrument to a TradingFacility, computed only from PIT-eligible
        active listings and never stored as an independent truth
      domain: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
    quotationInstrument:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationInstrument
      namespace: fin-instruments
      localName: quotationInstrument
      label: Quotation Instrument
      definition: relates a DirectUnitPriceQuotationContract to its FinancialInstrument logical identity
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    quotationListingContext:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationListingContext
      namespace: fin-instruments
      localName: quotationListingContext
      label: Quotation Listing Context
      definition: relates a quotation contract to its optional exact InstrumentListing context version
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      characteristics:
        - functional
    quotationOTCContext:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationOTCContext
      namespace: fin-instruments
      localName: quotationOTCContext
      label: Quotation OTC Context
      definition: relates a quotation contract to its optional exact OTCTradingContext version
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      characteristics:
        - functional
    quotationQuoteCurrency:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationQuoteCurrency
      namespace: fin-instruments
      localName: quotationQuoteCurrency
      label: Quotation Quote Currency
      definition: relates a quotation contract to its exact quote Currency logical identity
      domain: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
  attributeTypes:
    offeringId:
      iri: https://axiolune.ai/ontology/finance/instruments/offeringId
      namespace: fin-instruments
      localName: offeringId
      label: Offering Identifier
      definition: non-empty source-scoped identifier for one logical SecurityOffering
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    issuanceId:
      iri: https://axiolune.ai/ontology/finance/instruments/issuanceId
      namespace: fin-instruments
      localName: issuanceId
      label: Issuance Identifier
      definition: non-empty source-scoped identifier for one logical InstrumentIssuance
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    listingBusinessFrom:
      iri: https://axiolune.ai/ontology/finance/instruments/listingBusinessFrom
      namespace: fin-instruments
      localName: listingBusinessFrom
      label: Listing Business From
      definition: inclusive business date from which an InstrumentListing is in force
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    listingBusinessTo:
      iri: https://axiolune.ai/ontology/finance/instruments/listingBusinessTo
      namespace: fin-instruments
      localName: listingBusinessTo
      label: Listing Business To
      definition: optional exclusive business date at which an InstrumentListing ceases to be in force
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    quotationDenominatorUnit:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationDenominatorUnit
      namespace: fin-instruments
      localName: quotationDenominatorUnit
      label: Quotation Denominator Unit
      definition: absolute controlled unit IRI denoting the one Quantity unit against which direct price is quoted
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    quotationKind:
      iri: https://axiolune.ai/ontology/finance/instruments/quotationKind
      namespace: fin-instruments
      localName: quotationKind
      label: Quotation Kind
      definition: closed quotation application member required on a direct unit-price contract
      valueType: https://axiolune.ai/ontology/finance/instruments/QuotationKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    contractMultiplier:
      iri: https://axiolune.ai/ontology/finance/instruments/contractMultiplier
      namespace: fin-instruments
      localName: contractMultiplier
      label: Contract Multiplier
      definition: dimensionless multiplier constrained to decimal one by the direct-unit quotation profile
      valueType: decimal
      defaultCardinality:
        minCount: 1
        maxCount: 1
    normalizationContractRef:
      iri: https://axiolune.ai/ontology/finance/instruments/normalizationContractRef
      namespace: fin-instruments
      localName: normalizationContractRef
      label: Normalization Contract Reference
      definition: absolute IRI of the immutable normalization contract used to materialize quotation semantics
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    normalizationContractDigest:
      iri: https://axiolune.ai/ontology/finance/instruments/normalizationContractDigest
      namespace: fin-instruments
      localName: normalizationContractDigest
      label: Normalization Contract Digest
      definition: lowercase SHA-256 digest authenticating the exact quotation normalization contract bytes
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
  identifierTypes: {}
  codeLists:
    QuotationKind:
      iri: https://axiolune.ai/ontology/finance/instruments/QuotationKind
      namespace: fin-instruments
      localName: QuotationKind
      label: Quotation Kind
      definition: closed quotation application classification admitting only direct unit price
      vocabulary: Quotation Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/instruments/QuotationKind/value/directUnitPrice
          notation: directUnitPrice
          label: Direct Unit Price
          definition: quotation kind expressing one quote-currency amount per one denominator Quantity unit
  constraints:
    InstrumentIssuanceContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentIssuanceContract
      namespace: fin-instruments
      localName: InstrumentIssuanceContract
      label: Instrument Issuance Contract
      definition: >-
        join constraint requiring any originating offering to offer the exact Security version issued by the issuance
        fact
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: originatingOffering absent or originatingOffering.offeredSecurity = issuedSecurity
      severity: Error
      message: issuance originating offering does not offer the issued Security version
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentIssuance
    InstrumentListingIdentityContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListingIdentityContract
      namespace: fin-instruments
      localName: InstrumentListingIdentityContract
      label: Instrument Listing Identity Contract
      definition: >-
        identity and authorization constraint fixing one listing to its facility, venue-listing scheme, venue-listing
        value, exact instrument, and sole quote-currency truth
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(versionOf(listingFacility),listingIdentifierScheme,listingIdentifierValue);
          listingIdentifierScheme.kind = venueListing; listingIdentifierValue is LocalIdentifierValue;
          listingIdentifierValue.scheme = listingIdentifierScheme; exactlyOne(listingQuoteCurrency); listingFacility and
          listedInstrument are exactVersionPITEligibleAt(self.validFrom,self.knowledgeFrom,self.availableFrom);
          exactlyOne(PITEligible listingIdentifierScheme version) and exactlyOne(PITEligible listingIdentifierValue
          version); exactlyOne(PITEligible active ListingIdentifierSchemeAuthorization covering self.validInterval);
          exactlyOne(PITEligible active ISO4217RegistryEntry for listingQuoteCurrency joined to locked authority bytes)
      severity: Error
      message: listing identity, direct identifier path, or quote-currency truth is invalid
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    InstrumentListingOfferingContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListingOfferingContract
      namespace: fin-instruments
      localName: InstrumentListingOfferingContract
      label: Instrument Listing Offering Contract
      definition: >-
        optional-offering join constraint requiring the listed instrument to be the exact Security offered by the
        originating offering
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: originatingOffering absent or originatingOffering.offeredSecurity = listedInstrument
      severity: Error
      message: listing instrument differs from its originating offering's Security
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    InstrumentListingIntervalContract:
      iri: https://axiolune.ai/ontology/finance/instruments/InstrumentListingIntervalContract
      namespace: fin-instruments
      localName: InstrumentListingIntervalContract
      label: Instrument Listing Interval Contract
      definition: >-
        interval constraint requiring listing business dates to form a valid half-open interval contained by the
        version's valid-time interval
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: listingBusinessFrom < listingBusinessTo when present and business interval is within valid interval
      severity: Error
      message: listing business dates are invalid or lie outside the version valid interval
      targetElement: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    DirectUnitPriceQuotationRule:
      iri: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationRule
      namespace: fin-instruments
      localName: DirectUnitPriceQuotationRule
      label: Direct Unit Price Quotation Rule
      definition: >-
        executable context and equality constraint admitting exactly one listing or OTC context and forbidding every
        non-direct quotation application
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          quotationKind = directUnitPrice; contractMultiplier is explicitDecimalLexical and decimalEquals(1); listing
          branch => exact context is PITEligible and instrument and quote currency equal listing truths; OTC branch =>
          exact context is PITEligible and quote currency equals OTC context truth; quotationInstrument resolves to
          exactly one PITEligible FinancialInstrument version; exactlyOne(PITEligible active ISO4217RegistryEntry for
          quotationQuoteCurrency joined to locked authority bytes); consumed Quantity units are nonEmpty and denominator
          unit must equal every consumed Quantity unit; denominator unit joins the
          digestLockedControlledQuantityUnitRegistry for directUnitPriceQuotationDenominator;
          par|clean|dirty|accrued|inverse|notionalScaled|indexPoint forbidden
      severity: Error
      message: quotation contract has invalid context, currency, unit, quotation kind, or multiplier
      targetElement: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
    DirectUnitPriceQuotationContextXone:
      iri: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContextXone
      namespace: fin-instruments
      localName: DirectUnitPriceQuotationContextXone
      label: Direct Unit Price Quotation Context Xone
      definition: >-
        executable SHACL exclusive branch requiring one listing context or one OTC context on every direct unit-price
        quotation contract
      constraintType: Cardinality
      scope: Object
      expression:
        language: SHACL
        expression: sh:xone(quotationListingContext,quotationOTCContext)
      severity: Error
      message: quotation contract must select exactly one listing or OTC context
      targetElement: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
  relationUses:
    - relation: https://axiolune.ai/ontology/finance/instruments/offeredSecurity
      subjectType: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      objectType: https://axiolune.ai/ontology/finance/instruments/Security
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/ExactVersionReference
          targetElement: https://axiolune.ai/ontology/finance/instruments/offeredSecurity
    - relation: https://axiolune.ai/ontology/finance/instruments/listingIdentifierScheme
      subjectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      objectType: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/LogicalReference
          targetElement: https://axiolune.ai/ontology/finance/instruments/listingIdentifierScheme
    - relation: https://axiolune.ai/ontology/finance/instruments/listingIdentifierValue
      subjectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      objectType: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValue
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/LogicalReference
          targetElement: https://axiolune.ai/ontology/finance/instruments/listingIdentifierValue
    - relation: https://axiolune.ai/ontology/finance/instruments/listedInstrument
      subjectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      objectType: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/ExactVersionReference
          targetElement: https://axiolune.ai/ontology/finance/instruments/listedInstrument
    - relation: https://axiolune.ai/ontology/finance/instruments/listingFacility
      subjectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      objectType: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      outboundCardinality:
        minCount: 1
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/ExactVersionReference
          targetElement: https://axiolune.ai/ontology/finance/instruments/listingFacility
    - relation: https://axiolune.ai/ontology/finance/instruments/originatingOffering
      subjectType: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      objectType: https://axiolune.ai/ontology/finance/instruments/SecurityOffering
      outboundCardinality:
        minCount: 0
        maxCount: 1
      constraints:
