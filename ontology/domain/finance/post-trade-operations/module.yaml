      label: Duplicate Value Relation
      definition: Closed same-side duplicate value relation.
      vocabulary: Duplicate Value Relation
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation/value/identical
          notation: identical
          label: Identical
          definition: all same-side canonical values are equal
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation/value/conflicting
          notation: conflicting
          label: Conflicting
          definition: same-side canonical values differ
    CrossSideValueRelation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation
      namespace: fin-post-trade
      localName: CrossSideValueRelation
      label: Cross-side Value Relation
      definition: >-
        Closed classification of whether all canonical internal and external values agree for a duplicated comparison
        key.
      vocabulary: Cross-side Value Relation
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation/value/allEqual
          notation: allEqual
          label: All equal
          definition: every internal and external canonical value is equal
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation/value/mismatch
          notation: mismatch
          label: Mismatch
          definition: at least one internal/external canonical value differs
    MismatchDimension:
