          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionFulfillmentCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionFulfillmentSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionClosureProbeRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionClosureProbeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/fulfillmentResult
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledSubscriptionCash
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledSubscriptionSecurity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionProcessingFinding:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFinding
      namespace: fin-post-trade
      localName: CorporateActionProcessingFinding
      label: Corporate Action Processing Finding
      definition: >-
        The corporate action processing finding is a typed schedule, entitlement, or due-bill failure that carries one
        exact stage subject, a closed finding kind, a deterministic evidence-set digest, and only stage-legal related
        versions, used for recording problems along the corporate-action processing chain.
      cnNote: 公司行为处理发现，是具有确切阶段主体、封闭发现种类、确定性证据集摘要且仅含阶段合法关联版本的类型化排程、权益或到期票据失败，用于记录公司行为处理链路上的问题。
      participantRoles:
        - id: findingEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: finding event
          definition: exact Event version whose processing failed
        - id: scheduleSubject
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
          minCount: 0
          maxCount: 1
          label: schedule subject
          definition: optional exact schedule-stage subject branch
        - id: entitlementSubject
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
          minCount: 0
          maxCount: 1
          label: entitlement subject
          definition: optional exact entitlement-stage subject branch
        - id: dueBillSubject
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
          minCount: 0
          maxCount: 1
          label: due-bill subject
          definition: optional exact due-bill-stage schedule-resolution subject branch
        - id: findingRuleConflict
          range: https://axiolune.ai/ontology/finance/market-rules/RuleConflict
          minCount: 0
          maxCount: 1
          label: finding rule conflict
          definition: optional exact RuleConflict legal only for schedule conflict
        - id: failedAssessment
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDistributionSizeAssessment
          minCount: 0
          maxCount: 1
          label: failed assessment
          definition: optional exact failed size assessment
        - id: relatedElection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
          minCount: 0
          maxCount: null
          label: related election
          definition: optional exact election candidate evidence
        - id: relatedElectionResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionResolution
          minCount: 0
          maxCount: 1
          label: related election resolution
          definition: optional exact election resolution evidence
        - id: relatedSubscriptionObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionObligation
          minCount: 0
          maxCount: 1
          label: related subscription obligation
          definition: optional exact subscription obligation evidence
        - id: relatedSubscriptionClosure
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillmentClosure
          minCount: 0
          maxCount: 1
          label: related subscription closure
          definition: optional exact subscription fulfillment closure
        - id: relatedAdjustment
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionAdjustment
          minCount: 0
          maxCount: 1
          label: related adjustment
          definition: optional exact adjustment evidence
        - id: relatedEntitlement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
          minCount: 0
          maxCount: 1
          label: related entitlement
          definition: optional exact Entitlement evidence legal only for due-bill-stage findings
        - id: relatedDueBillQualification
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTradeQualification
          minCount: 0
          maxCount: 1
          label: related due-bill qualification
          definition: optional exact due-bill qualification evidence
        - id: relatedDueBillObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillObligation
          minCount: 0
          maxCount: 1
          label: related due-bill obligation
          definition: optional exact due-bill obligation evidence
        - id: relatedDueBillTransfer
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransfer
          minCount: 0
          maxCount: null
          label: related due-bill transfer
          definition: optional exact due-bill transfer evidence
        - id: relatedDueBillClosure
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransferFulfillmentClosure
          minCount: 0
          maxCount: 1
          label: related due-bill closure
          definition: optional exact due-bill closure evidence
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/findingStage
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/processingFindingKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/evidenceSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionAdjustment:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionAdjustment
      namespace: fin-post-trade
      localName: CorporateActionAdjustment
      label: Corporate Action Adjustment
      definition: >-
        The corporate action adjustment is a normalized post-evidence cash or security adjustment summary for one event
        and entitlement, used for summarizing completed asset-movement results but never itself serving as proof that
        assets moved.
      cnNote: 公司行为调整，是针对某一事件与权益的规范化事后证据现金或证券调整摘要，用于汇总已完成的资产移动结果但本身并不作为资产已移动的证明。
      participantRoles:
        - id: adjustmentEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: adjustment event
          definition: exact corporate-action Event version
        - id: adjustmentScheduleResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
          minCount: 1
          maxCount: 1
          label: adjustment schedule resolution
          definition: exact schedule resolution version
        - id: adjustmentEntitlement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
          minCount: 1
          maxCount: 1
          label: adjustment entitlement
          definition: exact entitlement version whose benefit is summarized
        - id: beneficiarySecuritiesAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: beneficiary securities account
          definition: logical securities account equal to the Entitlement account for non-rights actions
        - id: cashComponentAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: cash component account
          definition: optional logical account receiving or paying the cash component
        - id: quantityComponentAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: quantity component account
          definition: optional logical account receiving the security component
        - id: adjustmentElectionResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionResolution
          minCount: 0
          maxCount: 1
          label: adjustment election resolution
          definition: optional exact selected-exercise resolution required only by rights
        - id: adjustmentSelectedElection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
          minCount: 0
          maxCount: 1
          label: adjustment selected election
          definition: optional exact selected Election required only by rights
        - id: adjustmentSubscriptionObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionObligation
          minCount: 0
          maxCount: 1
          label: adjustment subscription obligation
          definition: optional exact subscription obligation required only by rights
        - id: adjustmentSubscriptionClosure
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillmentClosure
          minCount: 0
          maxCount: 1
          label: adjustment subscription closure
          definition: optional exact fully fulfilled closure required only by rights
      attributeUses:
