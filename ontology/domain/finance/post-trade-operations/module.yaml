    CorporateActionSubscriptionObligation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionObligation
      namespace: fin-post-trade
      localName: CorporateActionSubscriptionObligation
      label: Corporate Action Subscription Obligation
      definition: >-
        The corporate action subscription obligation is a two-asset rights exercise obligation created once for a selected
        exercise, carrying the subscriber cash and securities accounts, subscription-agent endpoints, exact elected
        Quantity, and subscription Money, used for characterizing the cash and security delivery owed after a rights
        exercise.
      cnNote: 公司行为认购义务，是为选定的行权一次性创建的双资产权利行权义务，含认购人现金证券账户、代理人端点、确切行权数量与认购资金，用于刻画配股行权后应付的现金与证券交割。
      participantRoles:
        - id: subscriptionResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionResolution
          minCount: 1
          maxCount: 1
          label: subscription resolution
          definition: exact selected-exercise ElectionResolution version
        - id: subscriptionElection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
          minCount: 1
          maxCount: 1
          label: subscription election
          definition: exact selected Election version
        - id: subscriptionEntitlement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
          minCount: 1
          maxCount: 1
          label: subscription entitlement
          definition: exact rights Entitlement version
        - id: subscriptionEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: subscription event
          definition: exact rights Event version
        - id: subscriptionScheduleResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
          minCount: 1
          maxCount: 1
          label: subscription schedule resolution
          definition: exact schedule resolution supplying cash and delivery dates
        - id: subscriptionSuccessorSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 1
          maxCount: 1
          label: subscription successor security
          definition: logical successor Security delivered on fulfillment
        - id: subscriberSecuritiesAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: subscriber securities account
          definition: logical securities account credited with successor Security
        - id: subscriberCashAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: subscriber cash account
          definition: logical cash or multi-asset account debited for subscription
        - id: subscriptionAgent
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: subscription agent
          definition: exact subscription-agent Party version
        - id: subscriptionAgentCashAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: subscription agent cash account
          definition: logical agent account receiving subscription cash
        - id: subscriptionAgentSecuritiesAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: subscription agent securities account
          definition: logical agent account delivering successor Security
        - id: subscriptionAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: subscription account-party role
          definition: exact PIT role versions proving every subscriber and agent account endpoint
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electedQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionCash
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionCashDueDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/successorDeliveryDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionSubscriptionFulfillment:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillment
      namespace: fin-post-trade
      localName: CorporateActionSubscriptionFulfillment
      label: Corporate Action Subscription Fulfillment
      definition: >-
        The corporate action subscription fulfillment is an authority-scoped completed movement evidence for exactly one
        cash-payment or successor-security-delivery leg of a subscription obligation, used for recording the actual
        asset movement of one leg of the subscription obligation.
      cnNote: 公司行为认购履约，是针对某一认购义务的单一现金支付腿或继任证券交割腿的权威作用域完成移动证据，用于记录认购义务某一腿的实际资产移动。
      participantRoles:
        - id: fulfillmentAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: fulfillment authority
          definition: exact Party version issuing the fulfillment record
        - id: subscriptionObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionObligation
          minCount: 1
          maxCount: 1
          label: subscription obligation
          definition: exact subscription obligation version being fulfilled
        - id: fulfillmentFromAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: fulfillment from account
          definition: logical account equal to the selected obligation asset sender
        - id: fulfillmentToAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: fulfillment to account
          definition: logical account equal to the selected obligation asset receiver
        - id: fulfillmentFromParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: fulfillment from party
          definition: logical Party controlling the selected sender account
        - id: fulfillmentToParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: fulfillment to party
          definition: logical Party controlling the selected receiver account
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
