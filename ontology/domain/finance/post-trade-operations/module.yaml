    SettlementLeg:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
      namespace: fin-post-trade
      localName: SettlementLeg
      label: Settlement Leg
      definition: >-
        The settlement leg is a provider-scoped cash or security transfer leg with explicit directed Party and account
        endpoints that belongs to one atomic group under an exact settlement instruction, used for characterizing the
        one-directional asset movement within a settlement.
      cnNote: 结算腿，是具有明确有向方与账户端点并归属于某一结算指令原子组的提供方作用域现金或证券划转腿，用于刻画一笔结算中的单向资产移动。
      participantRoles:
        - id: legInstruction
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstruction
          minCount: 1
          maxCount: 1
          label: leg instruction
          definition: exact SettlementInstruction version owning the leg
        - id: legFromParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: leg from party
          definition: exact Party version at the debit or delivery endpoint
        - id: legToParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: leg to party
          definition: different exact Party version at the credit or receipt endpoint
        - id: legFromAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: leg from account
          definition: logical account at the transfer origin
        - id: legToAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: leg to account
          definition: different logical account at the transfer destination
        - id: legInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: leg instrument
          definition: logical instrument required only by the security branch
        - id: legAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 2
          maxCount: null
          label: leg account-party role
          definition: exact PIT role versions proving both endpoint Party/account relationships
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerLegId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/atomicGroupId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLegMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLegQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradeSettlementAllocation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/TradeSettlementAllocation
      namespace: fin-post-trade
      localName: TradeSettlementAllocation
      label: Trade Settlement Allocation
      definition: >-
        The trade settlement allocation is an exact allocation that allocates the execution quantity to the security leg,
        names both economic accounts, and independently selects direct equality or one PIT-eligible custody/omnibus
        bridge for each endpoint, used for placing an execution onto specific economic accounts.
      cnNote: 交易结算分配，是把成交流数量分配到证券腿、指名两端经济账户并为每端独立选择直接相等或一个 PIT 合格托管桥的精确分配，用于把成交落到具体经济账户。
      participantRoles:
        - id: allocationExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: allocation execution
          definition: exact Execution version whose Quantity is allocated
        - id: allocationInstruction
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstruction
          minCount: 1
          maxCount: 1
          label: allocation instruction
          definition: exact SettlementInstruction version owning the leg
        - id: allocationSecurityLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 1
          maxCount: 1
          label: allocation security leg
          definition: exact security SettlementLeg version receiving the allocation
        - id: fromEconomicAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: from economic account
          definition: logical economic account on the security-delivery side
        - id: toEconomicAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: to economic account
          definition: different logical economic account on the security-receipt side
        - id: fromAccountBridge
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CustodySettlementAccountBridge
          minCount: 0
          maxCount: 1
          label: from account bridge
          definition: optional exact PIT bridge when the from economic account differs from the leg account
        - id: toAccountBridge
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CustodySettlementAccountBridge
          minCount: 0
          maxCount: 1
          label: to account bridge
          definition: optional exact PIT bridge when the to economic account differs from the leg account
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocatedQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/fromDirectAccount
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/toDirectAccount
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SettlementLegAllocation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocation
      namespace: fin-post-trade
      localName: SettlementLegAllocation
      label: Settlement Leg Allocation
      definition: >-
        The settlement leg allocation is a generalization of trade settlement allocation that allocates any settlement
        leg (cash, security, fee, or tax) to an economic account, portfolio, beneficiary, or sub-settlement account,
        carrying the allocation basis, partial allocation, residual, and FX conversion. The existing
        TradeSettlementAllocation remains as the security-only execution-driven first profile specialization.
      cnNote: 结算腿分配，是交易结算分配的泛化，将任一结算腿（现金、证券、费用或税）分配到经济账户、组合、受益人或子结算账户，携带分配基准、部分分配、残差与外币换算。现有交易结算分配作为仅证券、执行驱动的首画像特化保留。
      participantRoles:
        - id: allocationLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 1
          maxCount: 1
          label: allocation leg
          definition: exact SettlementLeg version being allocated
        - id: allocationEconomicAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: allocation economic account
          definition: logical economic account receiving the allocation
        - id: allocationAccountBridge
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CustodySettlementAccountBridge
          minCount: 0
          maxCount: 1
          label: allocation account bridge
          definition: optional exact PIT bridge when the economic account differs from the leg account
        - id: allocationInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: allocation instrument
          definition: logical instrument required only by security allocations
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocationAssetKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocatedQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocatedMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocationBasis
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocationResidualQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocationResidualMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocationFxConversionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/allocationRoundingPolicyRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SettlementStatusEvent:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatusEvent
      namespace: fin-post-trade
      localName: SettlementStatusEvent
      label: Settlement Status Event
      definition: >-
        The settlement status event is an immutable ordered provider status event for exactly one instruction atomic
        group or exact leg, carrying DVP atomic-completion evidence and a closed transition state, used for recording
        status progression across the settlement lifecycle.
      cnNote: 结算状态事件，是针对某一结算指令原子组或确切腿的不可变有序提供方状态事件，附带 DVP 原子完成证据与封闭状态转换，用于记录结算生命周期中的状态推进。
      participantRoles:
        - id: statusInstruction
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstruction
          minCount: 1
          maxCount: 1
          label: status instruction
          definition: exact SettlementInstruction version whose status changed
        - id: statusAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: status authority
          definition: exact provider Party version issuing the status event
        - id: statusLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 0
          maxCount: 1
          label: status leg
          definition: optional exact SettlementLeg subject branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statusAtomicGroupId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/atomicCompletionEvidenceRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/atomicCompletionEvidenceDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SettlementFinalityEvent:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityEvent
      namespace: fin-post-trade
      localName: SettlementFinalityEvent
      label: Settlement Finality Event
      definition: >-
        The settlement finality event is an immutable record of legal or system settlement finality for an instruction
        atomic group or exact leg, distinct from a source-reported settled status. It records the settlement system,
        the rule basis under which finality is achieved, the finality instant, and the finality kind (provisional,
        unconditional, or irrevocable), separating legal/system finality from the observed, reported, and knowledge
        pivots captured by the TemporalFact pattern.
      cnNote: 结算最终性事件，是针对结算指令原子组或确切腿的法律或系统结算最终性不可变记录，区别于来源报告的 settled 状态。它记录结算系统、达成最终性的规则依据、最终性时点与最终性种类（暂时性、无条件、不可撤销），将法律/系统最终性与 TemporalFact 模式记录的观察、报告与知识枢轴区分开来。
      participantRoles:
        - id: finalityInstruction
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstruction
          minCount: 1
          maxCount: 1
          label: finality instruction
          definition: exact SettlementInstruction version to which finality applies
        - id: finalityAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: finality authority
          definition: exact Party version attesting finality (settlement system or regulator)
        - id: finalityLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 0
          maxCount: 1
          label: finality leg
          definition: optional exact SettlementLeg subject branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/finalityProviderEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/finalityKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/finalitySystem
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/finalityRuleBasisRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/finalityInstant
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/originalSettlementDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/amendedSettlementDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/actualSettlementInstant
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalSettlementStatementLine:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementLine
      namespace: fin-post-trade
      localName: ExternalSettlementStatementLine
      label: External Settlement Statement Line
      definition: >-
        The external settlement statement line is a provider-scoped immutable statement line that belongs to the header
        focal account, date, system, and location and carries a normalized reference, a direction, and exactly one
        positive cash or security value, used for carrying the line-level facts of external settlement reconciliation.
      cnNote: 外部结算对账单明细行，是归属表头核心账户与日期系统地点、含归一化参照、方向与单一正向现金或证券值的不可变外部对账单明细，用于承载外部结算对账的逐行事实。
      participantRoles:
        - id: lineStatement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatement
          minCount: 1
          maxCount: 1
          label: line statement
          definition: exact ExternalSettlementStatement version owning the line
        - id: lineFocalAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: line focal account
          definition: logical account equal to the statement focal account
        - id: lineInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: line instrument
          definition: logical FinancialInstrument required only by a security line
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementDate
