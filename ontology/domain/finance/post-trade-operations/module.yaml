      definition: Enforces the exhaustive count/kind/evidence matrix.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exact internal Projection and external StatementLine collections are bucketed by recomputed canonical key; i/e
          counts and member arrays equal actual bucket cardinalities; 1/1 selects matched or valueMismatch; any count >1
          selects duplicate; 1/0 or 0/1 selects missingSide; 2/0 and 0/2 are one duplicate plus one opposite-side
          absence; 0/0 forbidden; internal, external and cross relations plus their typed mismatch-dimension sets
          recompute from canonical values; matched forbids every mismatch; variant xone, absence assertion and
          evidence-set digest recompute; findingSubjectDigest is the tagged JCS digest of exactly schemaVersion,
          variant, internalVersionIris and externalVersionIris, plus missingSideAssertionVersionIri only for a required
          absence row (the optional member is omitted, never null, in every other row)
      severity: Error
      message: reconciliation finding count/kind matrix is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFinding
