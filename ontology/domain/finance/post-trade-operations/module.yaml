      label: Settlement Reconciliation Internal Projection
      definition: >-
        The settlement reconciliation internal projection is a canonical internal comparison item derived, in the
        case-selected mode, from one exact leg or from one leg plus the complete focal-account allocation and bridge
        tuple set, used for providing the comparable internal-side value in reconciliation.
      cnNote: 结算对账内部投影，是按案例选定模式由单一确切腿或该腿加完整核心账户分配桥元组集导出的规范内部比较项，用于在对账中提供内部侧的可比较值。
      participantRoles:
        - id: projectionCase
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationCase
          minCount: 1
          maxCount: 1
          label: projection case
          definition: exact ReconciliationCase version selecting mode and context
        - id: projectionComparator
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationComparator
          minCount: 1
          maxCount: 1
          label: projection comparator
          definition: exact comparator version producing key and value
        - id: projectionFocalAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: projection focal account
          definition: logical focal account equal to the Case focal account
        - id: projectionLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 1
          maxCount: 1
          label: projection leg
