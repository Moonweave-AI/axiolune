        - id: economicAccountRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: economic account role
          definition: exact PIT roles proving ownership and custody of the economic account
        - id: settlementAccountRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: settlement account role
          definition: exact PIT role proving custodian control of the settlement account
