      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CustodySettlementAccountBridge
      namespace: fin-post-trade
      localName: CustodySettlementAccountBridge
      label: Custody Settlement Account Bridge
      definition: >-
        The custody settlement account bridge is an authority-scoped PIT fact that, under explicit account-party roles,
        system, and location, connects a beneficial economic account to a different settlement or omnibus account, used
        for characterizing the custody mapping between economic and settlement accounts.
      cnNote: 托管结算账户桥，是在明确账户角色、系统与地点下把受益经济账户连接到不同结算或汇总账户的权威作用域 PIT 事实，用于刻画经济账户与结算账户间的托管映射。
      participantRoles:
        - id: bridgeAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: bridge authority
          definition: exact Party version that issued the bridge identity
        - id: economicAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: economic account
          definition: logical beneficial or account-holder economic account
        - id: settlementAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: settlement account
          definition: different logical custody or omnibus settlement account
        - id: economicParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: economic party
          definition: exact economic Party version represented by the bridge
        - id: custodianParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: custodian party
