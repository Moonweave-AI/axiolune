          label: Settlement account
          definition: compare complete leg values directly at settlement accounts
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/InternalProjectionMode/value/economicAccountAllocation
          notation: economicAccountAllocation
          label: Economic account allocation
          definition: compare exact focal-account allocation aggregates
    SettlementAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementAssetKind
      namespace: fin-post-trade
