    CorporateActionOption:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOption
      namespace: fin-post-trade
      localName: CorporateActionOption
      label: Corporate Action Option
      definition: >-
        The corporate action option is an optional selectable outcome of a voluntary or default corporate action event,
        carrying the option kind (default, voluntary election, withdrawal, amendment, or partial allocation), the
        consideration, the election deadline, and the allocation ratio. It generalizes the single-choice rule of the
        Direct Rights Due-Bill Corporate Action Profile into a multi-option lifecycle per ISO 15022 MT564/565/566/567.
      cnNote: 公司行为选项，是自愿或默认公司行为事件的可选可选项，携带选项种类（默认、自愿选举、撤回、修订或部分分配）、对价、选举截止与分配比。它将直接认购权到期票据公司行为画像的单一选择规则泛化为按 ISO 15022 MT564/565/566/567 的多选项生命周期。
      participantRoles:
        - id: optionEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: option event
          definition: exact CorporateActionEvent version offering the option
        - id: optionAffectedSecurity
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: option affected security
          definition: optional logical instrument affected by the option when distinct from the event security
