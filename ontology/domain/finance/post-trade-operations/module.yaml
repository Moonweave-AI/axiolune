          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLocation
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entryDirection
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedSettlementReference
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statementLineMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statementLineQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/bookDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/valueDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entryIsCorrection
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entryIsReversal
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationCase:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationCase
      namespace: fin-post-trade
      localName: ReconciliationCase
      label: Reconciliation Case
      definition: >-
        The reconciliation case is an authority-scoped reconciliation input that fixes the focal account, exact external
        statement and comparator, date and time pivots, prior input context, and settlement-account or complete
        economic-allocation mode, used for initiating and bounding one settlement reconciliation.
      cnNote: 对账案例，是固定核心账户、确切外部对账单与比较器、日期与时间枢轴、前置输入上下文及结算账户或经济分配模式的权威作用域对账输入，用于发起并界定一次结算对账。
      participantRoles:
        - id: caseOwner
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: case owner
          definition: exact Party version responsible for the case
        - id: internalSourceAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: internal source authority
          definition: exact internal authority Party version forming case identity
        - id: externalStatement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatement
          minCount: 1
          maxCount: 1
          label: external statement
          definition: exact current external statement version supplying provider and focal account
        - id: caseFocalAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: case focal account
          definition: logical focal account compared on both sides
        - id: caseComparator
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationComparator
          minCount: 1
          maxCount: 1
          label: case comparator
          definition: exact zero-tolerance comparator version
        - id: caseAllocation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/TradeSettlementAllocation
          minCount: 0
          maxCount: null
          label: case allocation
          definition: complete sorted allocation set required only by economic-account mode
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfValid
          minCount: 1
