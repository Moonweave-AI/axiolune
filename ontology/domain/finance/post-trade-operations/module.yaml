        expression: >-
          exact internal Projection and external StatementLine collections are bucketed by recomputed canonical key; i/e
          counts and member arrays equal actual bucket cardinalities; 1/1 selects matched or valueMismatch; under the
          Strict Technical Settlement Reconciliation Profile any count >1 selects duplicate and 1/0 or 0/1 selects
          missingSide (2/0 and 0/2 are one duplicate plus one opposite-side absence; 0/0 forbidden); the generic core
          admits one-to-many, many-to-one, and many-to-many match groups via a ReconciliationMatchGroup, where duplicate
          means the same logical business fact recorded more than once rather than any bucket count greater than one, and
          a bucket with no internal and no external members is not a finding; internal, external and cross relations plus
          their typed mismatch-dimension sets recompute from canonical values; matched forbids every mismatch; variant
          xone, absence assertion and evidence-set digest recompute; findingSubjectDigest is the tagged JCS digest of
          exactly schemaVersion, variant, internalVersionIris and externalVersionIris, plus
          missingSideAssertionVersionIri only for a required absence row (the optional member is omitted, never null, in
          every other row)
      severity: Error
      message: reconciliation finding count/kind matrix is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFinding
    ReconciliationStatusEventContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatusEventContract
      namespace: fin-post-trade
      localName: ReconciliationStatusEventContract
      label: Reconciliation Status Event Contract
      definition: Enforces immutable ordered workflow transitions.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          case and source authority exact; provider event ID and non-negative sourceOrderKey identify immutable event;
          ordered state transitions follow open -> investigating -> resolved|closedNoAction without overwrite
      severity: Error
      message: reconciliation status event is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatusEvent
    CorporateActionOptionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionContract
      namespace: fin-post-trade
      localName: CorporateActionOptionContract
      label: Corporate Action Option Contract
      definition: Enforces option event binding, consideration, and lifecycle coherence.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          option belongs to exactly one event; optionKind is one of defaultOption, voluntaryElection, withdrawal,
          amendment, partialAllocation; at most one consideration kind applies per option; amendment or withdrawal
          references a prior option version; defaultOption has optionIsDefault true; partialAllocation carries an
          allocation ratio between zero and one exclusive
      severity: Error
      message: corporate-action option is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOption
    SettlementFinalityEventContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityEventContract
      namespace: fin-post-trade
      localName: SettlementFinalityEventContract
      label: Settlement Finality Event Contract
      definition: Enforces finality subject binding and time separation.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          finality instruction or leg subject is exact; finalityAuthority identifies the attesting settlement system or
          regulator; finalityInstant, observedAt, and the TemporalFact knowledge/availability pivots are distinct and not
          conflated; finalityKind is provisional, unconditional, or irrevocable; originalSettlementDate,
          amendedSettlementDate, and actualSettlementInstant are mutually consistent when present
      severity: Error
      message: settlement finality event is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityEvent
    SettlementLegAllocationContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationContract
      namespace: fin-post-trade
      localName: SettlementLegAllocationContract
      label: Settlement Leg Allocation Contract
      definition: Enforces leg binding, asset-kind/asset consistency, and residual conservation.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          allocation belongs to exactly one leg; allocationAssetKind matches the leg asset (cash/fee/tax carry Money,
          security carries Quantity); allocatedMoney or allocatedQuantity is positive; allocation residual plus allocated
          value conserves the leg value when both are present; the security-only execution-driven allocation remains
          valid as the first profile specialization via TradeSettlementAllocation
      severity: Error
      message: settlement leg allocation is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocation
    IncompleteSourceCoverageAssertionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/IncompleteSourceCoverageAssertionContract
      namespace: fin-post-trade
      localName: IncompleteSourceCoverageAssertionContract
      label: Incomplete Source Coverage Assertion Contract
      definition: Enforces that a no-result query is not promoted to a business absence.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          case, comparator, key, and pivots are exact; the named side returned no rows but coverage is unknown or
          provably incomplete; this assertion is distinct from a MissingSideAssertion and must not be used as proof of
          economic-fact absence
      severity: Error
      message: incomplete source coverage assertion is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/IncompleteSourceCoverageAssertion
    ReconciliationMatchGroupContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationMatchGroupContract
      namespace: fin-post-trade
      localName: ReconciliationMatchGroupContract
      label: Reconciliation Match Group Contract
      definition: Enforces match-group member coherence and non-strict-profile restriction.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          the group owns exactly one finding and at least one internal and one external member; matchCardinality matches
          the actual member counts (oneToOne 1/1, oneToMany 1/n, manyToOne n/1, manyToMany n/m); the Strict Technical
          Settlement Reconciliation Profile forbids this group and restricts matches to one-to-one bucketing;
          matchGroupSubjectDigest recomputes from member version IRIs
      severity: Error
      message: reconciliation match group is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationMatchGroup
    ReconciliationDispositionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionContract
      namespace: fin-post-trade
      localName: ReconciliationDispositionContract
      label: Reconciliation Disposition Contract
      definition: Enforces finding-level disposition coherence distinct from case status.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          disposition owns exactly one finding; dispositionKind is one of accepted, investigated, corrected, waived,
          escalated, reopened, externalPending; waiver requires a waiverRef; the disposition is distinct from and does
          not overwrite the case-level ReconciliationStatusEvent transition history
      severity: Error
      message: reconciliation disposition is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDisposition
