          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementSystem
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLocation
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/upstreamCustodyBridgeRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/bridgeValidFrom
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/bridgeValidTo
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
