          <= leg and closed-context allocation sum conserves leg; comparison key/value/source digest recompute
      severity: Error
      message: settlement reconciliation internal projection is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationInternalProjection
