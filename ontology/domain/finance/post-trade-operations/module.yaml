          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/absenceProbeDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IncompleteSourceCoverageAssertion:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/IncompleteSourceCoverageAssertion
      namespace: fin-post-trade
      localName: IncompleteSourceCoverageAssertion
      label: Incomplete Source Coverage Assertion
      definition: >-
        The incomplete source coverage assertion records that a reconciliation query returned no rows for a canonical
        comparison-key bucket on a specified side, but the source coverage is unknown so a business absence cannot be
        concluded. It prevents promoting a no-result query into a MissingSideAssertion of economic-fact absence and is
        used when the probe cannot prove universe completeness.
      cnNote: 不完整来源覆盖断言，记录对账查询对某一规范比较键桶的指定侧无结果，但来源覆盖未知故不能得出业务缺失结论。它防止将无结果查询升级为经济事实缺失的缺失侧断言，用于探针无法证明宇宙完整性的情形。
      participantRoles:
        - id: coverageCase
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationCase
          minCount: 1
          maxCount: 1
          label: coverage case
          definition: exact ReconciliationCase version whose side was queried
        - id: coverageComparator
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationComparator
          minCount: 1
          maxCount: 1
          label: coverage comparator
          definition: exact comparator version defining the canonical key
        - id: coverageInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: coverage instrument
          definition: logical FinancialInstrument identity required only for a security-side key
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/expectedSide
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedSettlementReference
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementSystem
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLocation
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entryDirection
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementAssetKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonKeyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfValid
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfKnowledge
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfAvailable
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/coverageUnknownReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationFinding:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFinding
      namespace: fin-post-trade
      localName: ReconciliationFinding
      label: Reconciliation Finding
      definition: >-
        The reconciliation finding is the exactly one deterministic matched, value-mismatch, duplicate, or missing-side
        result for a non-empty canonical comparison-key bucket, carrying all exact internal and external versions, used
        for characterizing the reconciliation conclusion for one comparison-key bucket. Under the Strict Technical
        Settlement Reconciliation Profile the finding is one-to-one per bucket; the generic core admits one-to-many,
        many-to-one, and many-to-many match groups via a ReconciliationMatchGroup, where duplicate means the same
        logical business fact recorded more than once rather than any bucket count greater than one.
      cnNote: 对账发现，是针对非空规范比较键桶给出的唯一确定性匹配、数值不符、重复或缺失侧结果，承载全部确切内部与外部版本，用于刻画一次比较键桶的对账结论。在严格技术结算对账画像下，发现按桶一一对应；通用核心通过对账匹配组接纳一对多、多对一与多对多匹配，其中重复指同一逻辑业务事实被多次记录，而非任一桶计数大于一。
      participantRoles:
        - id: findingCase
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationCase
          minCount: 1
          maxCount: 1
          label: finding case
          definition: exact ReconciliationCase version
        - id: internalProjection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationInternalProjection
          minCount: 0
          maxCount: null
          label: internal projection
          definition: all exact internal Projection versions in the bucket
        - id: externalStatementLine
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementLine
          minCount: 0
          maxCount: null
          label: external statement line
          definition: all exact external StatementLine versions in the bucket
        - id: missingSideAssertion
          range: https://axiolune.ai/ontology/finance/post-trade-operations/MissingSideAssertion
          minCount: 0
          maxCount: 1
          label: missing-side assertion
          definition: exact absence assertion required only by a one-sided or zero-opposite duplicate row
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/findingKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/matchedFinding
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/valueMismatchFinding
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/duplicateFinding
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/missingSideFinding
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/internalCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/externalCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/duplicateSide
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/internalDuplicateValueRelation
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/externalDuplicateValueRelation
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/crossSideValueRelation
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/mismatchDimension
          minCount: 0
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/internalMismatchDimension
          minCount: 0
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/externalMismatchDimension
          minCount: 0
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/crossMismatchDimension
          minCount: 0
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonKeyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/evidenceSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/findingSubjectDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationMatchGroup:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationMatchGroup
      namespace: fin-post-trade
      localName: ReconciliationMatchGroup
      label: Reconciliation Match Group
      definition: >-
        The reconciliation match group is an optional grouping of one or more internal projections and one or more
        external statement lines that are determined to represent the same logical business fact under a non-strict
        reconciliation profile, carrying the match cardinality and match basis. It admits one-to-one, one-to-many,
        many-to-one, and many-to-many matches that the Strict Technical Settlement Reconciliation Profile forbids in
        favor of one-to-one bucketing.
      cnNote: 对账匹配组，是非严格对账画像下将一个或多个内部投影与一个或多个外部对账单明细行判定为同一逻辑业务事实的可选分组，携带匹配基数与匹配依据。它接纳一对一、一对多、多对一与多对多匹配，而严格技术结算对账画像为支持一对一分桶而禁止此类匹配。
      participantRoles:
        - id: matchGroupFinding
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFinding
          minCount: 1
          maxCount: 1
          label: match-group finding
          definition: exact ReconciliationFinding version owning the group
        - id: matchGroupInternalProjection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationInternalProjection
          minCount: 1
          maxCount: null
          label: match-group internal projection
          definition: exact internal Projection versions grouped as one logical fact
        - id: matchGroupExternalLine
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementLine
          minCount: 1
          maxCount: null
          label: match-group external line
          definition: exact external StatementLine versions grouped as one logical fact
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/matchCardinality
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/matchBasis
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonKeyDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/matchGroupSubjectDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationStatusEvent:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatusEvent
      namespace: fin-post-trade
      localName: ReconciliationStatusEvent
      label: Reconciliation Status Event
      definition: >-
        The reconciliation status event is an immutable source-ordered case-status event whose closed transition history
        derives the current reconciliation workflow state without overwriting prior events, used for tracking the
        lifecycle progression of a reconciliation case.
      cnNote: 对账状态事件，是不可变的源有序案例状态事件，其封闭转换历史在不覆盖先前事件的前提下推导当前对账工作流状态，用于追踪对账案例的生命周期推进。
      participantRoles:
        - id: statusCase
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationCase
          minCount: 1
          maxCount: 1
          label: status case
          definition: exact ReconciliationCase version whose workflow state changed
        - id: statusSourceAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: status source authority
          definition: exact source Party version issuing the status event
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ReconciliationDisposition:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDisposition
      namespace: fin-post-trade
      localName: ReconciliationDisposition
      label: Reconciliation Disposition
      definition: >-
        The reconciliation disposition is a finding-level disposition that carries the disposition kind (accepted,
        investigated, corrected, waived, escalated, reopened, or externally pending), the responsible party, the
        remedial action, and the waiver reference, used for characterizing the resolution workflow of an individual
        finding distinct from the case-level reconciliation status.
      cnNote: 对账处置，是发现级处置，携带处置种类（接受、调查、更正、豁免、升级、重开或外部待处理）、责任方、补救动作与豁免引用，用于刻画单个发现的解决工作流，区别于案例级对账状态。
      participantRoles:
        - id: dispositionFinding
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFinding
          minCount: 1
          maxCount: 1
          label: disposition finding
          definition: exact ReconciliationFinding version being dispositioned
        - id: responsibleParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: responsible party
          definition: optional Party version responsible for the remedial action
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/dispositionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/remedialAction
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/waiverRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    electionPolicyAuthority:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionPolicyAuthority
      namespace: fin-post-trade
      localName: electionPolicyAuthority
      label: election policy authority
      definition: The election policy authority is a Party version that issues the election-provider policy identity, used for pointing to the authority publisher behind the election policy.
      cnNote: 选举政策权威，是发布选举提供方政策身份的当事方版本，用于指向选举政策背后的权威发布方。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      range: https://axiolune.ai/ontology/finance/foundation/Party
    electionPolicyEventAuthority:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionPolicyEventAuthority
      namespace: fin-post-trade
      localName: electionPolicyEventAuthority
      label: election policy event authority
      definition: The election policy event authority is a logical event authority whose scope is normalized by the policy, used for binding the election policy to the event-authority scope it governs.
      cnNote: 选举政策事件权威，是被政策归一化其作用域的逻辑事件权威，用于把选举政策绑定到其管控的事件权威范围。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      range: https://axiolune.ai/ontology/finance/foundation/Party
    electionPolicyProviderMember:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionPolicyProviderMember
      namespace: fin-post-trade
      localName: electionPolicyProviderMember
      label: election policy provider member
      definition: The election policy provider member is an exact traversable provider-member fact closed by a given policy version, used for reaching the eligible provider members governed by that policy.
      cnNote: 选举政策提供方成员，是被某一政策版本封闭的可遍历提供方成员事实，用于从政策可达其管控的合格提供方成员。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderMember
    electionPolicyProviderNormalization:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionPolicyProviderNormalization
      namespace: fin-post-trade
      localName: electionPolicyProviderNormalization
      label: election policy provider normalization
      definition: The election policy provider normalization is an exact traversable raw-to-logical provider mapping closed by a given policy version, used for reaching the normalization mappings governed by that policy.
      cnNote: 选举政策提供方归一化，是被某一政策版本封闭的可遍历原始到逻辑提供方映射，用于从政策可达其归一化映射集。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderNormalization
    electionPolicyPrecedenceEdge:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionPolicyPrecedenceEdge
      namespace: fin-post-trade
      localName: electionPolicyPrecedenceEdge
      label: election policy precedence edge
      definition: The election policy precedence edge is an exact traversable typed precedence edge closed by a given policy version, used for reaching the acyclic precedence graph governed by that policy.
      cnNote: 选举政策优先级边，是被某一政策版本封闭的可遍历类型化优先级边，用于从政策可达其无环优先级图。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPrecedenceEdge
    statementProvider:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementProvider
      namespace: fin-post-trade
      localName: statementProvider
      label: statement provider
      definition: The statement provider is a provider Party version that issues an external settlement statement, used for pointing to the publishing source of an external statement.
      cnNote: 对账单提供方，是发布外部结算对账单的提供方当事方版本，用于指向外部对账单的发布来源。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatement
      range: https://axiolune.ai/ontology/finance/foundation/Party
    statementFocalAccount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementFocalAccount
      namespace: fin-post-trade
      localName: statementFocalAccount
      label: statement focal account
      definition: The statement focal account is a logical financial account covered by an external settlement statement, used for bounding the central account the statement addresses.
      cnNote: 对账单核心账户，是外部结算对账单所覆盖的逻辑金融账户，用于界定对账单针对的中心账户。
      domain: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatement
      range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
  attributeTypes:
    sourceEventId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceEventId
      namespace: fin-post-trade
      localName: sourceEventId
      label: source event identifier
      definition: The source event identifier is an authority-scoped immutable corporate-action event identifier, used for uniquely referring to one corporate-action event within its source authority.
      cnNote: 来源事件标识，是权威作用域内不可变的公司行为事件标识，用于在来源权威范围内唯一指代某一公司行为事件。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    announcementDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/announcementDate
      namespace: fin-post-trade
      localName: announcementDate
      label: announcement date
      definition: The announcement date is a market-calendar date on which the action was announced, used for marking the point at which the event was publicly disclosed.
      cnNote: 公告日，是公司行为按市场日历公告的市场日，用于标记该事件对外公布的时点。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    exDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/exDate
      namespace: fin-post-trade
      localName: exDate
      label: ex date
      definition: The ex date is a market-calendar date from which the security trades without the entitlement, used for marking the point at which a buyer no longer receives the entitlement.
      cnNote: 除权日，是自该日起证券按市场日历不再带权益交易的市场日，用于界定买入者不再享有该权益的起点。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    recordDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/recordDate
      namespace: fin-post-trade
      localName: recordDate
      label: record date
      definition: The record date is a market-calendar date at which the record position is evaluated, used for determining who is recognized as holder at the entitlement pivot.
      cnNote: 登记日，是按市场日历评估登记头寸的市场日，用于确定谁在权益口径时点被认定为持有人。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    paymentDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/paymentDate
      namespace: fin-post-trade
      localName: paymentDate
      label: payment date
      definition: The payment date is a market-calendar date on which a cash benefit is due, used for marking the day a cash dividend should be paid.
      cnNote: 派付日，是现金利益按市场日历到期的市场日，用于标记应支付现金分红的日子。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    effectiveDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/effectiveDate
      namespace: fin-post-trade
      localName: effectiveDate
      label: effective date
      definition: The effective date is a market-calendar date on which a security change takes effect, used for marking the point at which a split or successor-security change actually becomes effective.
      cnNote: 生效日，是证券变动按市场日历生效的市场日，用于标记拆分或继任证券等变化实际生效的时点。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electionDeadline:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadline
      namespace: fin-post-trade
      localName: electionDeadline
      label: election deadline
      definition: The election deadline is a market-calendar deadline for a rights election under explicit cutoff semantics, used for bounding the last day by which an election must be received.
      cnNote: 选举截止日，是权利选举在明确截断语义下的市场日历截止日，用于界定选举必须送达的最后日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cashPerUnit:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/cashPerUnit
      namespace: fin-post-trade
      localName: cashPerUnit
      label: cash per unit
      definition: The cash per unit is a strictly positive Money amount distributed for each entitled unit, used for characterizing the cash amount owed per unit in a cash dividend.
      cnNote: 每单位现金，是每个应得单位所分派的严格为正的 Money，用于刻画现金分红中每单位应得的现金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    splitRatio:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/splitRatio
      namespace: fin-post-trade
      localName: splitRatio
      label: split ratio
      definition: The split ratio is a strictly positive dimensionless stock-split ratio, used for characterizing how many post-split shares result from each pre-split share.
      cnNote: 拆分比率，是严格为正的无量纲股票拆分比率，用于刻画拆分后股数相对拆分前的倍数。
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: 1
    entitlementRatio:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/entitlementRatio
      namespace: fin-post-trade
      localName: entitlementRatio
      label: entitlement ratio
      definition: The entitlement ratio is a strictly positive dimensionless rights entitlement per affected-security unit, used for characterizing how many rights each share receives.
      cnNote: 权益比率，是每个受影响证券单位所享有的严格为正的无量纲权利权益，用于刻画每股可获多少配股权。
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionPrice:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionPrice
      namespace: fin-post-trade
      localName: subscriptionPrice
      label: subscription price
      definition: The subscription price is a strictly positive Money amount due for each exercised successor-security unit, used for characterizing the amount payable per unit when exercising a rights issue.
      cnNote: 认购价，是每个行权的继任证券单位应付的严格为正的 Money，用于刻画配股行权时每单位需付的认购金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    nonTransferableDirectSubscription:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/nonTransferableDirectSubscription
      namespace: fin-post-trade
      localName: nonTransferableDirectSubscription
      label: non-transferable direct subscription
      definition: The non-transferable direct subscription is a marker that is true only for the supported non-transferable direct-subscription rights profile, used for flagging that the right cannot be traded on the secondary market.
      cnNote: 不可转让直接认购，是仅在适用不可转让直接配股权利画像时为真的标记，用于标识该权利不可在二级市场转让。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    scopeConsistencyDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/scopeConsistencyDigest
      namespace: fin-post-trade
      localName: scopeConsistencyDigest
      label: scope consistency digest
      definition: The scope consistency digest is a digest of the normalized equality proof for event and request scopes and pivots, used for locking the scope consistency of an evaluation input.
      cnNote: 作用域一致性摘要，是对事件与请求作用域及时间枢轴归一化相等证明的摘要，用于锁定评估输入在作用域上的一致性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    assessmentPercentage:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentPercentage
      namespace: fin-post-trade
      localName: assessmentPercentage
      label: assessment percentage
      definition: The assessment percentage is a strictly positive candidate-specific distribution percentage produced after locked calculation or official input, used for characterizing the distribution ratio for that candidate.
      cnNote: 评估百分比，是经锁定计算或官方输入得出的严格为正的候选专属分派百分比，用于刻画该候选的分派比例。
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cashCalculatedInput:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/cashCalculatedInput
      namespace: fin-post-trade
      localName: cashCalculatedInput
      label: cash calculated input
      definition: The cash calculated input is a branch marker that is true when the distribution percentage is computed as cash per unit divided by a reviewed reference price, used for flagging the cash-kind calculation input source.
      cnNote: 现金计算输入，是当分派百分比由每单位现金除以审定参考价计算得出时为真的分支标记，用于标示现金类计算输入来源。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    splitCalculatedInput:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/splitCalculatedInput
      namespace: fin-post-trade
      localName: splitCalculatedInput
      label: split calculated input
      definition: The split calculated input is a branch marker that is true when the distribution percentage is computed from a split ratio, used for flagging the split-kind calculation input source.
      cnNote: 拆分计算输入，是当分派百分比由拆分比率计算得出时为真的分支标记，用于标示拆分类计算输入来源。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    rightsCalculatedInput:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/rightsCalculatedInput
      namespace: fin-post-trade
      localName: rightsCalculatedInput
      label: rights calculated input
      definition: The rights calculated input is a branch marker that is true when the distribution percentage is computed from a rights ratio and subscription price, used for flagging the rights-kind calculation input source.
      cnNote: 权利计算输入，是当分派百分比由权利比率与认购价计算得出时为真的分支标记，用于标示权利类计算输入来源。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    officialPercentageInput:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/officialPercentageInput
      namespace: fin-post-trade
      localName: officialPercentageInput
      label: official percentage input
      definition: The official percentage input is a branch marker that is true when the distribution percentage uses a locked authority-supplied value, used for flagging the official-source input.
      cnNote: 官方百分比输入，是当分派百分比采用锁定的权威供给值时为真的分支标记，用于标示官方来源输入。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    valuationPivot:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/valuationPivot
      namespace: fin-post-trade
      localName: valuationPivot
      label: valuation pivot
      definition: The valuation pivot is an explicit instant used by the reviewed price-selection function, used for fixing which point-in-time reference price is taken when computing the distribution percentage.
      cnNote: 估值枢轴，是审定价格选择函数所使用的明确即时时点，用于确定计算分派百分比时取哪个时点的参考价。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    assessmentInputVersionRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentInputVersionRef
      namespace: fin-post-trade
      localName: assessmentInputVersionRef
      label: assessment input version reference
      definition: The assessment input version reference is a member of the complete sorted exact-version input set used by a distribution assessment, used for pointing to each input version that participates in the calculation.
      cnNote: 评估输入版本引用，是分派评估所用完整有序确切版本输入集的成员，用于逐一指向参与计算的输入版本。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: null
    assessmentInputVersionCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentInputVersionCount
      namespace: fin-post-trade
      localName: assessmentInputVersionCount
      label: assessment input version count
      definition: The assessment input version count is the count of the complete exact-version input set used by a distribution assessment, used for verifying the completeness of the input set.
      cnNote: 评估输入版本计数，是分派评估所用完整确切版本输入集的数量，用于校验输入集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    assessmentInputVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentInputVersionSetDigest
      namespace: fin-post-trade
      localName: assessmentInputVersionSetDigest
      label: assessment input version-set digest
      definition: The assessment input version-set digest is a section-5.8 digest of the complete sorted exact-version input set used by a distribution assessment, used for locking the contents of the input set.
      cnNote: 评估输入版本集摘要，是分派评估所用完整有序确切版本输入集的摘要，用于锁定输入集合的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    formulaDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/formulaDigest
      namespace: fin-post-trade
      localName: formulaDigest
      label: formula digest
      definition: The formula digest is a SHA-256 digest of the canonical bytes that define the calculation formula, used for locking the specific formula applied to the distribution percentage.
      cnNote: 公式摘要，是定义计算公式的规范字节的摘要，用于锁定分派百分比所用的具体公式。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    roundingPolicyDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/roundingPolicyDigest
      namespace: fin-post-trade
      localName: roundingPolicyDigest
      label: rounding policy digest
      definition: The rounding policy digest is a digest of the exact precision and rounding policy, used for locking the precision and rounding rules applied to a calculation result.
      cnNote: 舍入政策摘要，是确切精度与舍入政策的摘要，用于锁定计算结果的精度与取整规则。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    implementationDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/implementationDigest
      namespace: fin-post-trade
      localName: implementationDigest
      label: implementation digest
      definition: The implementation digest is a digest of the executable implementation bytes, used for locking the implementation version that performs the calculation.
      cnNote: 实现摘要，是可执行实现字节的摘要，用于锁定执行计算的实现版本。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    runtimeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/runtimeDigest
      namespace: fin-post-trade
      localName: runtimeDigest
      label: runtime digest
      definition: The runtime digest is a SHA-256 digest of the locked execution runtime used to evaluate the calculation, used for locking the execution environment.
      cnNote: 运行时摘要，是用于评估计算的锁定执行运行时的摘要，用于锁定执行环境。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    inputContractDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/inputContractDigest
      namespace: fin-post-trade
      localName: inputContractDigest
      label: input contract digest
      definition: The input contract digest is a digest of a versioned executable input contract, used for locking the executable input agreement of a calculation.
      cnNote: 输入契约摘要，是版本化可执行输入契约的摘要，用于锁定计算的可执行输入约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    outputContractDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/outputContractDigest
      namespace: fin-post-trade
      localName: outputContractDigest
      label: output contract digest
      definition: The output contract digest is a digest of a versioned executable output contract, used for locking the executable output agreement of a calculation.
      cnNote: 输出契约摘要，是版本化可执行输出契约的摘要，用于锁定计算的可执行输出约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    referenceNormalizationDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/referenceNormalizationDigest
      namespace: fin-post-trade
      localName: referenceNormalizationDigest
      label: reference normalization digest
      definition: The reference normalization digest is a digest of the reviewed settlement-reference normalization mapping, used for locking the rules that normalize references during reconciliation.
      cnNote: 参照归一化摘要，是经审定的结算参照归一化映射的摘要，用于锁定对账时参照的规范化规则。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    canonicalizationDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/canonicalizationDigest
      namespace: fin-post-trade
      localName: canonicalizationDigest
      label: canonicalization digest
      definition: The canonicalization digest is a digest of the Money and Quantity canonicalization contract, used for locking the value-normalization conventions.
      cnNote: 规范化摘要，是 Money 与 Quantity 规范化契约的摘要，用于锁定数值规范化约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    numericTolerance:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/numericTolerance
      namespace: fin-post-trade
      localName: numericTolerance
      label: numeric tolerance
      definition: The numeric tolerance is a numeric comparison tolerance constrained to canonical zero by the reconciliation profile, used for bounding the zero-tolerance comparison in settlement reconciliation.
      cnNote: 数值容差，是被对账画像约束为规范零的数值比较容差，用于在结算对账中界定零容差比较的边界。
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: 1
    officialArtifactRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/officialArtifactRef
      namespace: fin-post-trade
      localName: officialArtifactRef
      label: official artifact reference
      definition: The official artifact reference is an absolute IRI of the authority artifact that supplies an official percentage, used for pointing to the official source artifact for the distribution ratio.
      cnNote: 官方产物引用，是供给官方百分比的权威产物的绝对 IRI，用于指向官方分派比例来源工件。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    officialArtifactDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/officialArtifactDigest
      namespace: fin-post-trade
      localName: officialArtifactDigest
      label: official artifact digest
      definition: The official artifact digest is a SHA-256 digest of the official percentage artifact, used for locking the contents of the official source artifact.
      cnNote: 官方产物摘要，是官方百分比产物的摘要，用于锁定官方来源工件的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolvedAnnouncementDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedAnnouncementDate
      namespace: fin-post-trade
      localName: resolvedAnnouncementDate
      label: resolved announcement date
      definition: The resolved announcement date is the announcement date selected by the winning schedule rule, used for recording the announcement date fixed by schedule resolution.
      cnNote: 裁决公告日，是由胜出排程规则选定的公告日，用于记录排程裁决后确定的公告日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolvedExDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedExDate
      namespace: fin-post-trade
      localName: resolvedExDate
      label: resolved ex date
      definition: The resolved ex date is the ex date selected by the winning schedule rule, used for recording the ex date fixed by schedule resolution.
      cnNote: 裁决除权日，是由胜出排程规则选定的除权日，用于记录排程裁决后确定的除权日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolvedRecordDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedRecordDate
      namespace: fin-post-trade
      localName: resolvedRecordDate
      label: resolved record date
      definition: The resolved record date is the record date selected by the winning schedule rule, used for recording the record date fixed by schedule resolution.
      cnNote: 裁决登记日，是由胜出排程规则选定的登记日，用于记录排程裁决后确定的登记日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolvedPaymentDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedPaymentDate
      namespace: fin-post-trade
      localName: resolvedPaymentDate
      label: resolved payment date
      definition: The resolved payment date is the optional payment date selected by the winning schedule rule, used for recording the payment date fixed by schedule resolution.
      cnNote: 裁决派付日，是由胜出排程规则选定的可选派付日，用于记录排程裁决后确定的派付日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolvedEffectiveDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedEffectiveDate
      namespace: fin-post-trade
      localName: resolvedEffectiveDate
      label: resolved effective date
      definition: The resolved effective date is the optional effective date selected by the winning schedule rule, used for recording the effective date fixed by schedule resolution.
      cnNote: 裁决生效日，是由胜出排程规则选定的可选生效日，用于记录排程裁决后确定的生效日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    resolvedElectionDeadline:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedElectionDeadline
      namespace: fin-post-trade
      localName: resolvedElectionDeadline
      label: resolved election deadline
      definition: The resolved election deadline is the optional election deadline selected by the winning schedule rule, used for recording the election deadline fixed by schedule resolution.
      cnNote: 裁决选举截止日，是由胜出排程规则选定的可选选举截止日，用于记录排程裁决后确定的选举截止日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionCashDueDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionCashDueDate
      namespace: fin-post-trade
      localName: subscriptionCashDueDate
      label: subscription cash due date
      definition: The subscription cash due date is the resolved date for the rights subscription cash leg, used for marking the day the subscription cash is due.
      cnNote: 认购资金到期日，是权利认购现金腿的裁决日，用于标记认购资金应付的日期。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    successorDeliveryDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/successorDeliveryDate
      namespace: fin-post-trade
      localName: successorDeliveryDate
      label: successor delivery date
      definition: The successor delivery date is the resolved date for the rights successor-security delivery leg, used for marking the day the successor security is to be delivered.
      cnNote: 继任证券交割日，是权利继任证券交割腿的裁决日，用于标记继任证券应交付的日期。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    entitlementPivot:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/entitlementPivot
      namespace: fin-post-trade
      localName: entitlementPivot
      label: entitlement pivot
      definition: The entitlement pivot is an explicit instant at which record position and account roles are evaluated, used for fixing the point-in-time position and roles taken in entitlement computation.
      cnNote: 权益枢轴，是评估登记头寸与账户角色的明确即时时点，用于确定权益计算时取哪个时点的持仓与角色。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cumEntitlementStart:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/cumEntitlementStart
      namespace: fin-post-trade
      localName: cumEntitlementStart
      label: cum-entitlement start
      definition: The cum-entitlement start is the inclusive start instant of the due-bill qualifying execution interval, used for bounding the start of the qualifying execution window for due-bill trades.
      cnNote: 含权益起，是到期票据合格成交区间的包含起点即时，用于界定到期票据合格交易的起始时点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cumEntitlementEnd:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/cumEntitlementEnd
      namespace: fin-post-trade
      localName: cumEntitlementEnd
      label: cum-entitlement end
      definition: The cum-entitlement end is the exclusive end instant of the due-bill qualifying execution interval, used for bounding the end of the qualifying execution window for due-bill trades.
      cnNote: 含权益止，是到期票据合格成交区间的排除终点即时，用于界定到期票据合格交易的结束时点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    absenceProbeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/absenceProbeRef
      namespace: fin-post-trade
      localName: absenceProbeRef
      label: absence probe reference
      definition: The absence probe reference is an absolute IRI of a completed versioned absence probe, used for pointing to the probe that proves a position is absent.
      cnNote: 缺失探针引用，是已完成版本化缺失探针的绝对 IRI，用于指向证明头寸缺失的探针。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    absenceProbeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/absenceProbeDigest
      namespace: fin-post-trade
      localName: absenceProbeDigest
      label: absence probe digest
      definition: The absence probe digest is a digest of the exact absence probe bytes and result contract, used for locking the contents and result convention of an absence probe.
      cnNote: 缺失探针摘要，是确切缺失探针字节与结果契约的摘要，用于锁定缺失探针的内容与结果约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    zeroPositionQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/zeroPositionQuantity
      namespace: fin-post-trade
      localName: zeroPositionQuantity
      label: zero position quantity
      definition: The zero position quantity is a canonical zero Quantity in the affected-security unit, used for explicitly expressing the absence of a holding in the zero-position branch.
      cnNote: 零头寸数量，是受影响证券单位下的规范零数量，用于在零头寸分支中显式表达无持仓。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    recordPositionEvidenceDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/recordPositionEvidenceDigest
      namespace: fin-post-trade
      localName: recordPositionEvidenceDigest
      label: record-position evidence digest
      definition: The record-position evidence digest is a tagged JCS digest of the exact snapshot or proven-zero evidence branch, used for locking the position evidence on which an entitlement relies.
      cnNote: 登记头寸证据摘要，是确切快照或经证明零头寸证据分支的摘要，用于锁定权益所依据的持仓证据。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    recordPositionQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/recordPositionQuantity
      namespace: fin-post-trade
      localName: recordPositionQuantity
      label: record-position quantity
      definition: The record-position quantity is the exact snapshot Quantity or canonical zero Quantity before due-bill adjustment, used for recording the original holding quantity on which entitlement computation is based.
      cnNote: 登记头寸数量，是到期票据调整前的确切快照数量或规范零数量，用于记录权益计算所基于的原始持仓量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    dueBillObligationCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/dueBillObligationCount
      namespace: fin-post-trade
      localName: dueBillObligationCount
      label: due-bill obligation count
      definition: The due-bill obligation count is the count of the complete exact-version obligation set, used for verifying the completeness of the due-bill obligation set.
      cnNote: 到期票据义务计数，是完整确切版本义务集的数量，用于校验到期票据义务集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    dueBillObligationSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/dueBillObligationSetDigest
      namespace: fin-post-trade
      localName: dueBillObligationSetDigest
      label: due-bill obligation-set digest
      definition: The due-bill obligation-set digest is a section-5.8 digest of the complete sorted obligation version IRI set, used for locking the contents of the due-bill obligation set.
      cnNote: 到期票据义务集摘要，是完整有序义务版本 IRI 集的摘要，用于锁定到期票据义务集合的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    obligationClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/obligationClosureProbeRef
      namespace: fin-post-trade
      localName: obligationClosureProbeRef
      label: obligation closure probe reference
      definition: The obligation closure probe reference is an absolute IRI of the completed obligation-set closure probe, used for pointing to the probe that proves the obligation set is complete.
      cnNote: 义务闭合探针引用，是已完成义务集闭合探针的绝对 IRI，用于指向证明义务集完整的探针。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    obligationClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/obligationClosureProbeDigest
      namespace: fin-post-trade
      localName: obligationClosureProbeDigest
      label: obligation closure probe digest
      definition: The obligation closure probe digest is a digest of the exact obligation closure probe bytes and result, used for locking the contents and result of an obligation closure probe.
      cnNote: 义务闭合探针摘要，是确切义务闭合探针字节与结果的摘要，用于锁定义务闭合探针的内容与结果。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    eligibleQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleQuantity
      namespace: fin-post-trade
      localName: eligibleQuantity
      label: eligible quantity
      definition: The eligible quantity is the record Quantity plus incoming obligations minus outgoing obligations, used for characterizing the holding quantity actually eligible for entitlement computation.
      cnNote: 合格数量，是登记数量加上应收义务减去应付义务后的数量，用于刻画权益计算中实际可享权益的持仓量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    entitledCash:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/entitledCash
      namespace: fin-post-trade
      localName: entitledCash
      label: entitled cash
      definition: The entitled cash is the cash-dividend Money computed from the eligible Quantity and the cash per unit, used for characterizing the cash amount an entitlement is owed.
      cnNote: 应得现金，是由合格数量与每单位现金计算得出的现金分红 Money，用于刻画权益应得的现金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    quantityDelta:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/quantityDelta
      namespace: fin-post-trade
      localName: quantityDelta
      label: quantity delta
      definition: The quantity delta is the security Quantity change computed under the selected split or rights contract, used for characterizing the increase or decrease in holding quantity caused by an entitlement.
      cnNote: 数量变动，是按所选拆分或权利契约计算的证券数量变化，用于刻画权益引起的持仓数量增减。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    maximumRightsQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/maximumRightsQuantity
      namespace: fin-post-trade
      localName: maximumRightsQuantity
      label: maximum rights quantity
      definition: The maximum rights quantity is the maximum successor-security Quantity eligible for rights exercise, used for capping the upper bound an exercise must not exceed.
      cnNote: 最大权利数量，是可享权利行权的最大继任证券数量，用于限制行权不得超过的上限。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    authorityScopedId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
      namespace: fin-post-trade
      localName: authorityScopedId
      label: authority-scoped identifier
      definition: The authority-scoped identifier is a non-empty identifier unique within the exact source-authority logical identity, used for uniquely referring to one object within its source authority.
      cnNote: 权威作用域标识，是在确切来源权威逻辑身份内唯一的非空标识，用于在来源权威范围内唯一指代某一对象。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementSystem:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementSystem
      namespace: fin-post-trade
      localName: settlementSystem
      label: settlement system
      definition: The settlement system is a normalized settlement system identifier under the locked source contract, used for characterizing which settlement system a settlement occurs in.
      cnNote: 结算系统，是在锁定来源契约下的规范结算系统标识，用于刻画结算发生在哪个结算系统。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementLocation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLocation
      namespace: fin-post-trade
      localName: settlementLocation
      label: settlement location
      definition: The settlement location is a normalized settlement location identifier under the locked source contract, used for characterizing the location at which a settlement occurs.
      cnNote: 结算地点，是在锁定来源契约下的规范结算地点标识，用于刻画结算发生的地点。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    executionOnlyQualification:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/executionOnlyQualification
      namespace: fin-post-trade
      localName: executionOnlyQualification
      label: execution-only qualification
      definition: The execution-only qualification is a branch marker that is true when the winning resolution permits execution-only qualification, used for flagging that a due-bill may qualify on execution alone rather than settlement evidence.
      cnNote: 仅执行资格，是当胜出裁决允许仅执行资格时为真的分支标记，用于标示到期票据可仅凭成交而非结算证据合格。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    qualifiedDueBillQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/qualifiedDueBillQuantity
      namespace: fin-post-trade
      localName: qualifiedDueBillQuantity
      label: qualified due-bill quantity
      definition: The qualified due-bill quantity is a strictly positive allocated Quantity that qualifies inside the resolved interval, used for characterizing the due-bill quantity confirmed as qualifying.
      cnNote: 合格到期票据数量，是落在裁决区间内的严格为正的已分配数量，用于刻画经合格认定的到期票据数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    qualificationResult:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/qualificationResult
      namespace: fin-post-trade
      localName: qualificationResult
      label: qualification result
      definition: The qualification result is a closed eligible or ineligible due-bill qualification result, used for giving the verdict of a due-bill trade qualification.
      cnNote: 资格结果，是封闭的合格或不合格到期票据资格结果，用于给出到期票据交易资格的判定。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult
      defaultCardinality:
        minCount: 0
        maxCount: 1
    obligationQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/obligationQuantity
      namespace: fin-post-trade
      localName: obligationQuantity
      label: obligation quantity
      definition: The obligation quantity is a strictly positive affected-security Quantity that generates the due-bill benefit, used for characterizing the security quantity on which an obligation is based.
      cnNote: 义务数量，是产生到期票据利益的严格为正的受影响证券数量，用于刻画义务所基于的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    obligationMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/obligationMoney
      namespace: fin-post-trade
      localName: obligationMoney
      label: obligation Money benefit
      definition: The obligation Money benefit is a strictly positive Money benefit owed under a cash-dividend obligation, used for characterizing the cash amount an obligation is to transfer.
      cnNote: 义务 Money 利益，是现金分红义务下应付的严格为正的 Money 利益，用于刻画义务应转移的现金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    obligationQuantityBenefit:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/obligationQuantityBenefit
      namespace: fin-post-trade
      localName: obligationQuantityBenefit
      label: obligation Quantity benefit
      definition: The obligation Quantity benefit is a strictly positive Quantity benefit owed under a split or rights obligation, used for characterizing the security quantity an obligation is to transfer.
      cnNote: 义务数量利益，是拆分或权利义务下应付的严格为正的数量利益，用于刻画义务应转移的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    externalClaimId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/externalClaimId
      namespace: fin-post-trade
      localName: externalClaimId
      label: external claim identifier
      definition: The external claim identifier is an authority-scoped immutable external claim identifier, used for referring to a locked external-claim source declaration.
      cnNote: 外部索赔标识，是权威作用域内不可变的外部索赔标识，用于指代锁定外部索赔来源的声明。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferTime:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferTime
      namespace: fin-post-trade
      localName: transferTime
      label: transfer time
      definition: The transfer time is an explicit occurrence instant of the transfer record, used for marking when a due-bill transfer occurs.
      cnNote: 划转时点，是划转记录的明确发生即时，用于标记到期票据划转发生的时间。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferState:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferState
      namespace: fin-post-trade
      localName: transferState
      label: transfer state
      definition: The transfer state is a closed pending, completed, failed, or cancelled transfer state, used for characterizing the current result of a transfer attempt.
      cnNote: 划转状态，是封闭的待办、完成、失败或取消的划转状态，用于刻画划转尝试的当前结果。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferMoney
      namespace: fin-post-trade
      localName: transferMoney
      label: transfer Money
      definition: The transfer Money is a Money asset recorded by one due-bill transfer, used for characterizing the cash amount moved by a transfer.
      cnNote: 划转 Money，是某一到期票据划转所记录的 Money 资产，用于刻画划转移动的现金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferQuantity
      namespace: fin-post-trade
      localName: transferQuantity
      label: transfer Quantity
      definition: The transfer Quantity is a Quantity asset recorded by one due-bill transfer, used for characterizing the security quantity moved by a transfer.
      cnNote: 划转数量，是某一到期票据划转所记录的数量资产，用于刻画划转移动的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    movementEvidenceRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/movementEvidenceRef
      namespace: fin-post-trade
      localName: movementEvidenceRef
      label: movement evidence reference
      definition: The movement evidence reference is an absolute IRI of exact transfer, settlement, or account-adjustment evidence, used for pointing to the evidence that proves an asset has moved.
      cnNote: 移动证据引用，是确切划转、结算或账户调整证据的绝对 IRI，用于指向证明资产已移动的证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    movementEvidenceDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/movementEvidenceDigest
      namespace: fin-post-trade
      localName: movementEvidenceDigest
      label: movement evidence digest
      definition: The movement evidence digest is a digest of exact movement evidence bytes or a fact-version set, used for locking the contents of movement evidence.
      cnNote: 移动证据摘要，是确切移动证据字节或事实版本集的摘要，用于锁定移动证据的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfillmentResult:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfillmentResult
      namespace: fin-post-trade
      localName: fulfillmentResult
      label: fulfillment result
      definition: The fulfillment result is a closed unfulfilled, partially fulfilled, or fully fulfilled closure result, used for giving the final fulfillment state of an obligation.
      cnNote: 履约结果，是封闭的未完成、部分完成或完全完成的闭合结果，用于给出义务履行的最终状态。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferCount
      namespace: fin-post-trade
      localName: transferCount
      label: transfer count
      definition: The transfer count is the count of the complete exact current transfer set, used for verifying the completeness of the current transfer set.
      cnNote: 划转计数，是完整确切当前划转集的数量，用于校验当前划转集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferVersionSetDigest
      namespace: fin-post-trade
      localName: transferVersionSetDigest
      label: transfer version-set digest
      definition: The transfer version-set digest is a section-5.8 digest of the complete sorted current transfer version IRI set, used for locking the contents of the current transfer set.
      cnNote: 划转版本集摘要，是完整有序当前划转版本 IRI 集的摘要，用于锁定当前划转集合的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferClosureProbeRef
      namespace: fin-post-trade
      localName: transferClosureProbeRef
      label: transfer closure probe reference
      definition: The transfer closure probe reference is an absolute IRI of the completed current-transfer closure probe, used for pointing to the probe that proves the current transfer set is complete.
      cnNote: 划转闭合探针引用，是已完成当前划转闭合探针的绝对 IRI，用于指向证明当前划转集完整的探针。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transferClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/transferClosureProbeDigest
      namespace: fin-post-trade
      localName: transferClosureProbeDigest
      label: transfer closure probe digest
      definition: The transfer closure probe digest is a digest of the exact transfer-closure probe bytes and result, used for locking the contents and result of a transfer closure probe.
      cnNote: 划转闭合探针摘要，是确切划转闭合探针字节与结果的摘要，用于锁定划转闭合探针的内容与结果。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfilledMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledMoney
      namespace: fin-post-trade
      localName: fulfilledMoney
      label: fulfilled Money
      definition: The fulfilled Money is the canonical sum of completed, de-duplicated Money transfers, used for characterizing the cash amount by which an obligation has been fulfilled.
      cnNote: 已完成 Money，是已完成且去重后划转的规范现金合计，用于刻画义务已履行的现金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfilledQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledQuantity
      namespace: fin-post-trade
      localName: fulfilledQuantity
      label: fulfilled Quantity
      definition: The fulfilled Quantity is the canonical sum of completed, de-duplicated Quantity transfers, used for characterizing the security quantity by which an obligation has been fulfilled.
      cnNote: 已完成数量，是已完成且去重后划转的规范数量合计，用于刻画义务已履行的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    remainingMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/remainingMoney
      namespace: fin-post-trade
      localName: remainingMoney
      label: remaining Money
      definition: The remaining Money is the Money amount still due after subtracting the fulfilled Money from the obligation Money, used for characterizing the cash an obligation has yet to fulfill.
      cnNote: 剩余 Money，是义务 Money 减去已完成 Money 后仍应付的现金额，用于刻画义务尚未履行的现金。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    remainingQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/remainingQuantity
      namespace: fin-post-trade
      localName: remainingQuantity
      label: remaining Quantity
      definition: The remaining Quantity is the obligation Quantity benefit minus the fulfilled Quantity, used for characterizing the security quantity an obligation has yet to fulfill.
      cnNote: 剩余数量，是义务数量利益减去已完成数量后的剩余，用于刻画义务尚未履行的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceRecordRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceRecordRef
      namespace: fin-post-trade
      localName: sourceRecordRef
      label: source record reference
      definition: The source record reference is an absolute IRI of the immutable provider election record, used for pointing to the original provider record of an election.
      cnNote: 来源记录引用，是不可变提供方选举记录的绝对 IRI，用于指向选举的原始提供方记录。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceRecordDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceRecordDigest
      namespace: fin-post-trade
      localName: sourceRecordDigest
      label: source record digest
      definition: The source record digest is a digest of the exact provider record bytes, used for locking the contents of an election's original record.
      cnNote: 来源记录摘要，是确切提供方记录字节的摘要，用于锁定选举原始记录的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fieldMappingDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fieldMappingDigest
      namespace: fin-post-trade
      localName: fieldMappingDigest
      label: field mapping digest
      definition: The field mapping digest is a digest of the exact provider field-normalization mapping, used for locking the convention that maps provider fields to canonical fields.
      cnNote: 字段映射摘要，是确切提供方字段归一化映射的摘要，用于锁定提供方字段到规范字段的转换约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    receivedAt:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/receivedAt
      namespace: fin-post-trade
      localName: receivedAt
      label: received at
      definition: The received-at instant is an explicit instant at which the election provider received the decision, used for judging whether an election was received in time before its deadline.
      cnNote: 接收时点，是选举提供方收到决定的明确即时，用于判定选举是否在截止前及时送达。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electionDecision:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionDecision
      namespace: fin-post-trade
      localName: electionDecision
      label: election decision
      definition: The election decision is a member of the closed classification that indicates whether the holder exercises or explicitly declines the rights election, used for characterizing the decision recorded in an election.
      cnNote: 选举决定，是表明持有人行权或明确拒绝的封闭分类成员，用于刻画选举记录中的决定。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electedQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electedQuantity
      namespace: fin-post-trade
      localName: electedQuantity
      label: elected quantity
      definition: The elected quantity is a strictly positive exercised successor-security Quantity, forbidden for decline or lapse, used for characterizing the quantity actually exercised in an election.
      cnNote: 已选数量，是行权的严格为正的继任证券数量，在拒绝或失效时禁用，用于刻画选举实际行权的数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    selfElection:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/selfElection
      namespace: fin-post-trade
      localName: selfElection
      label: self election
      definition: The self election is a branch marker that is true when the electing Party equals the entitlement beneficiary Party, used for flagging an election made by the entitlement holder itself.
      cnNote: 自选举，是当选举方与权益受益方相同时为真的分支标记，用于标示由权益持有人本人发起的选举。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    eventScopeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/eventScopeDigest
      namespace: fin-post-trade
      localName: eventScopeDigest
      label: event scope digest
      definition: The event scope digest is a digest of the event authority, kind, and scope controlled by a provider policy, used for locking the event range the policy covers.
      cnNote: 事件作用域摘要，是提供方政策管控的事件权威、种类与作用域的摘要，用于锁定政策所覆盖的事件范围。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    eligibleProviderSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleProviderSetDigest
      namespace: fin-post-trade
      localName: eligibleProviderSetDigest
      label: eligible-provider set digest
      definition: The eligible-provider set digest is a digest of the sorted eligible election-provider logical IRI set, used for locking the eligible provider set recognized by a policy.
      cnNote: 合格提供方集摘要，是有序合格选举提供方逻辑 IRI 集的摘要，用于锁定政策认定的合格提供方集合。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    eligibleProviderCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleProviderCount
      namespace: fin-post-trade
      localName: eligibleProviderCount
      label: eligible provider count
      definition: The eligible provider count is the count of traversable provider-member facts closed by the policy version, used for verifying the completeness of the eligible provider set.
      cnNote: 合格提供方计数，是被政策版本封闭的可遍历提供方成员事实的数量，用于校验合格提供方集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerMemberVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/providerMemberVersionSetDigest
      namespace: fin-post-trade
      localName: providerMemberVersionSetDigest
      label: provider-member version-set digest
      definition: The provider-member version-set digest is a section-5.8 digest of the complete sorted exact provider-member fact version IRI set, used for locking the contents of the provider-member set.
      cnNote: 提供方成员版本集摘要，是完整有序确切提供方成员事实版本 IRI 集的摘要，用于锁定提供方成员集的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceProviderKey:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceProviderKey
      namespace: fin-post-trade
      localName: sourceProviderKey
      label: source provider key
      definition: The source provider key is a non-empty authority-scoped raw provider identifier consumed by one normalization mapping, used for characterizing the original provider identifier before normalization.
      cnNote: 来源提供方键，是被某一归一化映射消费的非空权威作用域原始提供方标识，用于刻画归一化前的原始提供方标识。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    normalizedProviderKey:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedProviderKey
      namespace: fin-post-trade
      localName: normalizedProviderKey
      label: normalized provider key
      definition: The normalized provider key is a non-empty canonical provider key shared by one membership and its raw-key mappings, used for characterizing the canonical provider identifier after normalization.
      cnNote: 规范提供方键，是某成员及其原始键映射共享的非空规范提供方键，用于刻画归一化后的规范提供方标识。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerNormalizationDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/providerNormalizationDigest
      namespace: fin-post-trade
      localName: providerNormalizationDigest
      label: provider normalization digest
      definition: The provider normalization digest is a digest of the provider identifier and decision normalization mappings, used for locking the provider normalization rules.
      cnNote: 提供方归一化摘要，是提供方标识与决定归一化映射的摘要，用于锁定提供方归一化规则。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerNormalizationCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/providerNormalizationCount
      namespace: fin-post-trade
      localName: providerNormalizationCount
      label: provider normalization count
      definition: The provider normalization count is the count of traversable raw-to-logical provider mappings closed by the policy version, used for verifying the completeness of the normalization mapping set.
      cnNote: 提供方归一化计数，是被政策版本封闭的可遍历原始到逻辑提供方映射的数量，用于校验归一化映射集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    precedenceGraphDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/precedenceGraphDigest
      namespace: fin-post-trade
      localName: precedenceGraphDigest
      label: precedence graph digest
      definition: The precedence graph digest is a digest of the explicit acyclic provider precedence graph, used for locking the precedence structure that arbitrates election conflicts.
      cnNote: 优先级图摘要，是显式无环提供方优先级图的摘要，用于锁定选举冲突仲裁的优先级结构。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    precedenceEdgeCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/precedenceEdgeCount
      namespace: fin-post-trade
      localName: precedenceEdgeCount
      label: precedence edge count
      definition: The precedence edge count is the count of traversable typed precedence edges closed by the policy version, used for verifying the completeness of the precedence graph.
      cnNote: 优先级边计数，是被政策版本封闭的可遍历类型化优先级边的数量，用于校验优先级图的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electionEquivalenceField:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionEquivalenceField
      namespace: fin-post-trade
      localName: electionEquivalenceField
      label: election equivalence field
      definition: The election equivalence field is an absolute ontology-field IRI included in deterministic election-candidate equivalence, used for naming the field used to judge candidate equivalence.
      cnNote: 选举等价字段，是纳入确定性选举候选等价判定的绝对本体字段 IRI，用于指明判定候选等价时所用的字段。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: null
    equivalenceFieldsDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/equivalenceFieldsDigest
      namespace: fin-post-trade
      localName: equivalenceFieldsDigest
      label: equivalence-fields digest
      definition: The equivalence-fields digest is a digest of the exact candidate equivalence field contract, used for locking the field set used in equivalence judgement.
      cnNote: 等价字段摘要，是确切候选等价字段契约的摘要，用于锁定等价判定所用的字段集合。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electionDeadlineCutoff:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadlineCutoff
      namespace: fin-post-trade
      localName: electionDeadlineCutoff
      label: election deadline cutoff
      definition: The election deadline cutoff is an explicit policy-scope instant against which a provider's receivedAt is compared, used for judging whether an election is timely.
      cnNote: 选举截止时点，是用于比较提供方接收时点的明确政策作用域即时，用于判定选举是否及时。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    deadlineInclusive:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/deadlineInclusive
      namespace: fin-post-trade
      localName: deadlineInclusive
      label: deadline inclusive
      definition: The deadline inclusive flag is a marker that is true exactly when a candidate received at the cutoff instant remains timely, used for characterizing whether the cutoff includes its endpoint.
      cnNote: 截止包含，是当候选恰在截止时点送达仍算及时时为真的标记，用于刻画截止时点是否含端点。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    deadlineCutoffContractDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/deadlineCutoffContractDigest
      namespace: fin-post-trade
      localName: deadlineCutoffContractDigest
      label: deadline/cutoff contract digest
      definition: The deadline/cutoff contract digest is a digest of the election deadline and cutoff semantics, used for locking the rules that govern deadline judgement.
      cnNote: 截止契约摘要，是选举截止与截断语义的摘要，用于锁定截止判定的规则约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    candidateElectionCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/candidateElectionCount
      namespace: fin-post-trade
      localName: candidateElectionCount
      label: candidate election count
      definition: The candidate election count is the count of the complete exact timely candidate set, used for verifying the completeness of the timely candidate set.
      cnNote: 候选选举计数，是完整确切及时候选集的数量，用于校验及时候选集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    candidateElectionSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/candidateElectionSetDigest
      namespace: fin-post-trade
      localName: candidateElectionSetDigest
      label: candidate election-set digest
      definition: The candidate election-set digest is a section-5.8 digest of the complete sorted candidate version IRI set, used for locking the contents of the timely candidate set.
      cnNote: 候选选举集摘要，是完整有序候选版本 IRI 集的摘要，用于锁定及时候选集合的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    candidateClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/candidateClosureProbeRef
      namespace: fin-post-trade
      localName: candidateClosureProbeRef
      label: candidate closure probe reference
      definition: The candidate closure probe reference is an absolute IRI of the completed election-candidate closure probe, used for pointing to the probe that proves the candidate set is complete.
      cnNote: 候选闭合探针引用，是已完成选举候选闭合探针的绝对 IRI，用于指向证明候选集完整的探针。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    candidateClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/candidateClosureProbeDigest
      namespace: fin-post-trade
      localName: candidateClosureProbeDigest
      label: candidate closure probe digest
      definition: The candidate closure probe digest is a digest of the exact candidate-closure probe bytes and result, used for locking the contents and result of a candidate closure probe.
      cnNote: 候选闭合探针摘要，是确切候选闭合探针字节与结果的摘要，用于锁定候选闭合探针的内容与结果。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    selectedExercise:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/selectedExercise
      namespace: fin-post-trade
      localName: selectedExercise
      label: selected exercise
      definition: The selected exercise is a result branch marker that is true when an exercise is selected, used for flagging that election resolution selected an exercise.
      cnNote: 选定行权，是当选中行权时为真的结果分支标记，用于标示选举裁决选定了行权。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    selectedDecline:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/selectedDecline
      namespace: fin-post-trade
      localName: selectedDecline
      label: selected decline
      definition: The selected decline is a result branch marker that is true when a decline is selected, used for flagging that election resolution selected a decline.
      cnNote: 选定拒绝，是当选中拒绝时为真的结果分支标记，用于标示选举裁决选定了拒绝。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    defaultLapse:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/defaultLapse
      namespace: fin-post-trade
      localName: defaultLapse
      label: default lapse
      definition: The default lapse is a result branch marker that is true when a probe proves the candidate set is empty at or after the deadline, used for flagging that an election defaults to lapse because no candidate was timely.
      cnNote: 默认失效，是当截止时点及之后经探针证明候选集为空时为真的结果分支标记，用于标示选举因无候选而默认失效。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionCash:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionCash
      namespace: fin-post-trade
      localName: subscriptionCash
      label: subscription cash
      definition: The subscription cash is an exact Money debit equal to the elected Quantity times the subscription price, used for characterizing the total cash payable for a rights exercise.
      cnNote: 认购资金，是等于已选数量乘以认购价的确定 Money 借记，用于刻画配股行权应支付的现金总额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfillmentOccurrenceTime:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfillmentOccurrenceTime
      namespace: fin-post-trade
      localName: fulfillmentOccurrenceTime
      label: fulfillment occurrence time
      definition: The fulfillment occurrence time is an explicit instant of completed subscription movement evidence, used for marking when a subscription fulfillment occurs.
      cnNote: 履约发生时点，是已完成认购移动证据的明确即时，用于标记认购履约发生的时间。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionFulfillmentAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionFulfillmentAssetKind
      namespace: fin-post-trade
      localName: subscriptionFulfillmentAssetKind
      label: subscription fulfillment asset kind
      definition: The subscription fulfillment asset kind is a closed cash-payment or security-delivery selector, used for characterizing which leg a subscription fulfillment belongs to.
      cnNote: 认购履约资产种类，是封闭的现金支付或证券交割选择器，用于刻画认购履约属于哪一条腿。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfilledSubscriptionMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledSubscriptionMoney
      namespace: fin-post-trade
      localName: fulfilledSubscriptionMoney
      label: fulfilled subscription Money
      definition: The fulfilled subscription Money is a positive subscription cash payment amount, used for characterizing the cash paid by a single subscription fulfillment.
      cnNote: 已完成认购 Money，是正向的认购现金支付额，用于刻画单条认购履约已支付的现金。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfilledSubscriptionQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledSubscriptionQuantity
      namespace: fin-post-trade
      localName: fulfilledSubscriptionQuantity
      label: fulfilled subscription Quantity
      definition: The fulfilled subscription Quantity is a positive successor-security delivery Quantity, used for characterizing the securities delivered by a single subscription fulfillment.
      cnNote: 已完成认购数量，是正向的继任证券交割数量，用于刻画单条认购履约已交付的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionFulfillmentCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionFulfillmentCount
      namespace: fin-post-trade
      localName: subscriptionFulfillmentCount
      label: subscription fulfillment count
      definition: The subscription fulfillment count is the count of the complete exact current subscription fulfillment set, used for verifying the completeness of the subscription fulfillment set.
      cnNote: 认购履约计数，是完整确切当前认购履约集的数量，用于校验认购履约集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionFulfillmentSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionFulfillmentSetDigest
      namespace: fin-post-trade
      localName: subscriptionFulfillmentSetDigest
      label: subscription fulfillment-set digest
      definition: The subscription fulfillment-set digest is a section-5.8 digest of the sorted current fulfillment version set, used for locking the contents of the current subscription fulfillment set.
      cnNote: 认购履约集摘要，是有序当前履约版本集的摘要，用于锁定当前认购履约集合的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionClosureProbeRef
      namespace: fin-post-trade
      localName: subscriptionClosureProbeRef
      label: subscription closure probe reference
      definition: The subscription closure probe reference is an absolute IRI of the completed subscription-fulfillment closure probe, used for pointing to the probe that proves the subscription fulfillment set is complete.
      cnNote: 认购闭合探针引用，是已完成认购履约闭合探针的绝对 IRI，用于指向证明认购履约集完整的探针。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    subscriptionClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionClosureProbeDigest
      namespace: fin-post-trade
      localName: subscriptionClosureProbeDigest
      label: subscription closure probe digest
      definition: The subscription closure probe digest is a digest of the exact subscription closure probe bytes and result, used for locking the contents and result of a subscription closure probe.
      cnNote: 认购闭合探针摘要，是确切认购闭合探针字节与结果的摘要，用于锁定认购闭合探针的内容与结果。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfilledSubscriptionCash:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledSubscriptionCash
      namespace: fin-post-trade
      localName: fulfilledSubscriptionCash
      label: fulfilled subscription cash total
      definition: The fulfilled subscription cash total is a canonical completed cash sum, including the canonical zero for an empty set, used for characterizing the total cash a subscription obligation has fulfilled.
      cnNote: 已完成认购现金合计，是含空集规范零在内的规范已完成现金合计，用于刻画认购义务已履行的现金总额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fulfilledSubscriptionSecurity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fulfilledSubscriptionSecurity
      namespace: fin-post-trade
      localName: fulfilledSubscriptionSecurity
      label: fulfilled subscription security total
      definition: The fulfilled subscription security total is a canonical completed successor-security Quantity sum, including zero, used for characterizing the total securities a subscription obligation has delivered.
      cnNote: 已完成认购证券合计，是含零在内的规范已完成继任证券数量合计，用于刻画认购义务已交付的证券总额。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    findingStage:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/findingStage
      namespace: fin-post-trade
      localName: findingStage
      label: processing finding stage
      definition: The processing finding stage is a closed schedule, entitlement, or due-bill processing stage, used for characterizing which stage of corporate-action processing a finding occurs in.
      cnNote: 处理发现阶段，是封闭的排程、权益或到期票据处理阶段，用于刻画公司行为处理发现发生在哪个阶段。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage
      defaultCardinality:
        minCount: 0
        maxCount: 1
    processingFindingKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/processingFindingKind
      namespace: fin-post-trade
      localName: processingFindingKind
      label: processing finding kind
      definition: The processing finding kind is a member of the closed corporate-action processing failure classification, used for characterizing the specific category of a processing failure.
      cnNote: 处理发现种类，是封闭公司行为处理失败分类的成员，用于刻画处理失败的具体类别。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    evidenceSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/evidenceSetDigest
      namespace: fin-post-trade
      localName: evidenceSetDigest
      label: evidence-set digest
      definition: The evidence-set digest is a digest of the sorted exact evidence version set supporting a finding, used for locking the evidence set on which a finding relies.
      cnNote: 证据集摘要，是支撑某一发现的有序确切证据版本集的摘要，用于锁定发现所依据的证据集合。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    adjustmentMovementEvidenceRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentMovementEvidenceRef
      namespace: fin-post-trade
      localName: adjustmentMovementEvidenceRef
      label: adjustment movement evidence reference
      definition: The adjustment movement evidence reference is a member IRI of the complete exact completed-movement evidence set supporting an adjustment, used for pointing to each movement evidence item an adjustment relies on.
      cnNote: 调整移动证据引用，是支撑某一调整的完整确切已完成移动证据集的成员 IRI，用于逐一指向调整所依据的移动证据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: null
    movementEvidenceCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/movementEvidenceCount
      namespace: fin-post-trade
      localName: movementEvidenceCount
      label: movement-evidence count
      definition: The movement-evidence count is the count of the complete exact movement evidence set supporting an adjustment, used for verifying the completeness of an adjustment's evidence set.
      cnNote: 移动证据计数，是支撑某一调整的完整确切移动证据集的数量，用于校验调整证据集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    movementEvidenceSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/movementEvidenceSetDigest
      namespace: fin-post-trade
      localName: movementEvidenceSetDigest
      label: movement-evidence set digest
      definition: The movement-evidence set digest is a section-5.8 IRI-set digest of the complete exact movement evidence set supporting an adjustment, used for locking the movement evidence set an adjustment relies on.
      cnNote: 移动证据集摘要，是支撑某一调整的完整确切移动证据集的摘要，用于锁定调整所依据的移动证据集合。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cashDelta:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/cashDelta
      namespace: fin-post-trade
      localName: cashDelta
      label: cash delta
      definition: The cash delta is a signed Money adjustment from the beneficiary account perspective, used for characterizing the cash increase or decrease caused by an adjustment.
      cnNote: 现金变动，是从受益账户视角带符号的 Money 调整，用于刻画调整引起的现金增减。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cashEffectiveDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/cashEffectiveDate
      namespace: fin-post-trade
      localName: cashEffectiveDate
      label: cash effective date
      definition: The cash effective date is the resolved market-calendar date of the cash component, used for marking the date the cash part of an adjustment becomes effective.
      cnNote: 现金生效日，是现金分量的裁决市场日历日，用于标记调整中现金部分生效的日期。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    quantityEffectiveDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/quantityEffectiveDate
      namespace: fin-post-trade
      localName: quantityEffectiveDate
      label: quantity effective date
      definition: The quantity effective date is the resolved market-calendar date of the security component, used for marking the date the security part of an adjustment becomes effective.
      cnNote: 数量生效日，是证券分量的裁决市场日历日，用于标记调整中证券部分生效的日期。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementMethod:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementMethod
      namespace: fin-post-trade
      localName: settlementMethod
      label: settlement method
      definition: The settlement method is a closed delivery-versus-payment or free-of-payment method, used for characterizing whether a settlement settles as DVP or FOP.
      cnNote: 结算方式，是封闭的银货对付或纯交收方式，用于刻画结算采取 DVP 还是 FOP。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementMethod
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementDate
      namespace: fin-post-trade
      localName: settlementDate
      label: settlement date
      definition: The settlement date is a market-calendar settlement date under the exact TradingCalendar version, used for marking the market day a settlement should complete.
      cnNote: 结算日，是确切交易日历版本下的市场日历结算日，用于标记结算应完成的市场日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerLegId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/providerLegId
      namespace: fin-post-trade
      localName: providerLegId
      label: provider leg identifier
      definition: The provider leg identifier is an instruction-provider-scoped immutable leg identifier, used for uniquely referring to one settlement leg within its provider scope.
      cnNote: 提供方腿标识，是结算指令提供方作用域内不可变的腿标识，用于在提供方范围内唯一指代某条结算腿。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    atomicGroupId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/atomicGroupId
      namespace: fin-post-trade
      localName: atomicGroupId
      label: atomic group identifier
      definition: The atomic group identifier is a provider-scoped identifier that groups the complete DVP or FOP settlement-leg set, used for binding the legs that must complete atomically into one group.
      cnNote: 原子组标识，是提供方作用域内把完整 DVP 或 FOP 结算腿集分组的标识，用于把需原子完成的腿绑定为一组。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementLegMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLegMoney
      namespace: fin-post-trade
      localName: settlementLegMoney
      label: settlement-leg Money
      definition: The settlement-leg Money is a strictly positive Money amount transferred by a cash leg, used for characterizing the cash amount a cash leg moves.
      cnNote: 结算腿 Money，是现金腿划转的严格为正的 Money，用于刻画现金腿移动的金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementLegQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLegQuantity
      namespace: fin-post-trade
      localName: settlementLegQuantity
      label: settlement-leg Quantity
      definition: The settlement-leg Quantity is a strictly positive Quantity transferred by a security leg, used for characterizing the security quantity a security leg moves.
      cnNote: 结算腿数量，是证券腿划转的严格为正的数量，用于刻画证券腿移动的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocatedQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocatedQuantity
      namespace: fin-post-trade
      localName: allocatedQuantity
      label: allocated quantity
      definition: The allocated quantity is a strictly positive Execution Quantity allocated to one security SettlementLeg, used for characterizing how an execution's quantity is assigned to that leg.
      cnNote: 已分配数量，是分配到某条证券结算腿的严格为正的成交数量，用于刻画成交数量如何分到该腿。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fromDirectAccount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/fromDirectAccount
      namespace: fin-post-trade
      localName: fromDirectAccount
      label: from direct account
      definition: The from direct account is a branch marker that is true when the from economic account equals the security-leg from account, used for flagging that the from endpoint needs no custody bridge.
      cnNote: 起端直接账户，是当起端经济账户等于证券腿起端账户时为真的分支标记，用于标示该端无需托管桥。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    toDirectAccount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/toDirectAccount
      namespace: fin-post-trade
      localName: toDirectAccount
      label: to direct account
      definition: The to direct account is a branch marker that is true when the to economic account equals the security-leg to account, used for flagging that the to endpoint needs no custody bridge.
      cnNote: 终端直接账户，是当终端经济账户等于证券腿终端账户时为真的分支标记，用于标示该端无需托管桥。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerEventId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/providerEventId
      namespace: fin-post-trade
      localName: providerEventId
      label: provider event identifier
      definition: The provider event identifier is a source-scoped immutable status event identifier, used for uniquely referring to one status event within its source scope.
      cnNote: 提供方事件标识，是来源作用域内不可变的状态事件标识，用于在来源范围内唯一指代某一状态事件。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceOrderKey:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceOrderKey
      namespace: fin-post-trade
      localName: sourceOrderKey
      label: source order key
      definition: The source order key is a normalized non-negative provider ordering key, used for ordering status events by their source sequence.
      cnNote: 来源顺序键，是规范的非负提供方排序键，用于按来源顺序排列状态事件。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementStatus:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementStatus
      namespace: fin-post-trade
      localName: settlementStatus
      label: settlement status
      definition: The settlement status is a closed instructed, matched, settled, cancelled, or failed state, used for characterizing the current stage of a settlement.
      cnNote: 结算状态，是封闭的已指令、已匹配、已结算、已取消或失败状态，用于刻画结算当前所处的阶段。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statusAtomicGroupId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statusAtomicGroupId
      namespace: fin-post-trade
      localName: statusAtomicGroupId
      label: status atomic-group identifier
      definition: The status atomic-group identifier is an atomic group subject used only by a group-level status event, used for binding a group-level status event to its atomic group.
      cnNote: 状态原子组标识，是仅组级状态事件使用的原子组主体，用于把组级状态事件绑定到其原子组。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    atomicCompletionEvidenceRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/atomicCompletionEvidenceRef
      namespace: fin-post-trade
      localName: atomicCompletionEvidenceRef
      label: atomic completion evidence reference
      definition: The atomic completion evidence reference is an absolute IRI proving both DVP legs completed atomically, used for pointing to the evidence that a DVP settlement completed atomically.
      cnNote: 原子完成证据引用，是证明两条 DVP 腿原子完成的绝对 IRI，用于指向 DVP 原子结算的完成证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    atomicCompletionEvidenceDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/atomicCompletionEvidenceDigest
      namespace: fin-post-trade
      localName: atomicCompletionEvidenceDigest
      label: atomic completion evidence digest
      definition: The atomic completion evidence digest is a digest of the exact DVP group completion evidence, used for locking the contents of the DVP atomic-completion evidence.
      cnNote: 原子完成证据摘要，是确切 DVP 组完成证据的摘要，用于锁定 DVP 原子完成证据的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statementDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementDate
      namespace: fin-post-trade
      localName: statementDate
      label: statement date
      definition: The statement date is a business date to which the provider's immutable external statement snapshot applies, used for marking the date an external statement covers.
      cnNote: 对账单日，是提供方不可变外部对账单快照所适用的营业日，用于标记外部对账单覆盖的日期。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceSnapshotRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSnapshotRef
      namespace: fin-post-trade
      localName: sourceSnapshotRef
      label: source snapshot reference
      definition: The source snapshot reference is an absolute IRI of immutable external statement source bytes, used for pointing to the original bytes of an external statement.
      cnNote: 来源快照引用，是不可变外部对账单来源字节的绝对 IRI，用于指向外部对账单的原始字节。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceSnapshotDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSnapshotDigest
      namespace: fin-post-trade
      localName: sourceSnapshotDigest
      label: source snapshot digest
      definition: The source snapshot digest is a digest of the immutable external statement snapshot, used for locking the contents of an external statement snapshot.
      cnNote: 来源快照摘要，是不可变外部对账单快照的摘要，用于锁定外部对账单快照的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceSchemaDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSchemaDigest
      namespace: fin-post-trade
      localName: sourceSchemaDigest
      label: source schema digest
      definition: The source schema digest is a digest of the exact provider statement schema, used for locking the structural convention of an external statement.
      cnNote: 来源模式摘要，是确切提供方对账单模式的摘要，用于锁定外部对账单的结构约定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    entryDirection:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/entryDirection
      namespace: fin-post-trade
      localName: entryDirection
      label: statement entry direction
      definition: The statement entry direction is a closed debit or credit direction from the focal-account perspective, used for characterizing whether a statement line is a debit or credit to the focal account.
      cnNote: 入账方向，是从核心账户视角的封闭借记或贷记方向，用于刻画对账单明细是出账还是入账。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/StatementEntryDirection
      defaultCardinality:
        minCount: 0
        maxCount: 1
    normalizedSettlementReference:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedSettlementReference
      namespace: fin-post-trade
      localName: normalizedSettlementReference
      label: normalized settlement reference
      definition: The normalized settlement reference is a strictly comparator-normalized settlement reference for which fuzzy guessing is forbidden, used for serving as the deterministic matching key in reconciliation.
      cnNote: 规范结算参照，是经比较器严格规范化的结算参照，禁止模糊猜测，用于在对账中作为确定性的匹配键。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statementLineMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementLineMoney
      namespace: fin-post-trade
      localName: statementLineMoney
      label: statement-line Money
      definition: The statement-line Money is a strictly positive external cash statement value, used for characterizing the cash amount of an external statement line.
      cnNote: 对账单明细 Money，是外部现金对账单中严格为正的现金值，用于刻画外部对账单明细的现金金额。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statementLineQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementLineQuantity
      namespace: fin-post-trade
      localName: statementLineQuantity
      label: statement-line Quantity
      definition: The statement-line Quantity is a strictly positive external security statement value, used for characterizing the security quantity of an external statement line.
      cnNote: 对账单明细数量，是外部证券对账单中严格为正的证券值，用于刻画外部对账单明细的证券数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    reconciliationScope:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationScope
      namespace: fin-post-trade
      localName: reconciliationScope
      label: reconciliation scope
      definition: >-
        The reconciliation scope is a member of the closed classification that defines the account, date, and
        settlement-system boundary of a ReconciliationCase, used for characterizing the dimensional range a
        reconciliation case covers.
      cnNote: 对账作用域，是界定对账案例账户、日期与结算系统边界的封闭分类成员，用于刻画对账案例覆盖的维度范围。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationScope
      defaultCardinality:
        minCount: 0
        maxCount: 1
    reconciliationDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationDate
      namespace: fin-post-trade
      localName: reconciliationDate
      label: reconciliation date
      definition: The reconciliation date is a market-calendar business date selected by the case, used for marking the business day a reconciliation targets.
      cnNote: 对账日，是案例选定的市场日历营业日，用于标记对账所针对的营业日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    reconciliationAsOfValid:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfValid
      namespace: fin-post-trade
      localName: reconciliationAsOfValid
      label: reconciliation valid-time pivot
      definition: The reconciliation valid-time pivot is a valid-time instant at which internal settlement facts are selected for reconciliation, used for fixing the valid-time point taken for reconciliation.
      cnNote: 对账有效时间枢轴，是选取内部结算事实进行对账的有效时间即时，用于界定对账按有效时间取哪个时点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    reconciliationAsOfKnowledge:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfKnowledge
      namespace: fin-post-trade
      localName: reconciliationAsOfKnowledge
      label: reconciliation knowledge-time pivot
      definition: The reconciliation knowledge-time pivot is a knowledge-time instant at which internal settlement facts are selected for reconciliation, used for fixing the knowledge-time point taken for reconciliation.
      cnNote: 对账知识时间枢轴，是选取内部结算事实进行对账的知识时间即时，用于界定对账按知识时间取哪个时点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    reconciliationAsOfAvailable:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfAvailable
      namespace: fin-post-trade
      localName: reconciliationAsOfAvailable
      label: reconciliation availability-time pivot
      definition: The reconciliation availability-time pivot is an availability-time instant at which internal settlement facts are selected for reconciliation, used for fixing the availability-time point taken for reconciliation.
      cnNote: 对账可用时间枢轴，是选取内部结算事实进行对账的可用时间即时，用于界定对账按可用时间取哪个时点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    internalProjectionMode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/internalProjectionMode
      namespace: fin-post-trade
      localName: internalProjectionMode
      label: internal projection mode
      definition: The internal projection mode is a closed settlement-account or economic-account-allocation mode, used for characterizing how the internal side of a reconciliation aggregates comparison values.
      cnNote: 内部投影模式，是封闭的结算账户或经济账户分配模式，用于刻画对账内部侧按哪种方式聚合比较值。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/InternalProjectionMode
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementAccountMode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementAccountMode
      namespace: fin-post-trade
      localName: settlementAccountMode
      label: settlement-account mode
      definition: The settlement-account mode is a case branch marker that is true when the case projects directly from a settlement leg, used for flagging that the internal projection takes the settlement-account perspective.
      cnNote: 结算账户模式，是当案例直接按结算腿投影时为真的分支标记，用于标示内部投影采用结算账户口径。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    economicAccountAllocationMode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/economicAccountAllocationMode
      namespace: fin-post-trade
      localName: economicAccountAllocationMode
      label: economic-account allocation mode
      definition: The economic-account allocation mode is a case branch marker that is true when the case projects under complete economic allocation, used for flagging that the internal projection takes the economic-account-allocation perspective.
      cnNote: 经济账户分配模式，是当案例按完整经济分配投影时为真的分支标记，用于标示内部投影采用经济账户分配口径。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationCount
      namespace: fin-post-trade
      localName: allocationCount
      label: allocation count
      definition: The allocation count is the count of the complete exact allocation set in economic mode, used for verifying the completeness of the economic allocation set.
      cnNote: 分配计数，是经济模式下完整确切分配集的数量，用于校验经济分配集的完整性。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationVersionSetDigest
      namespace: fin-post-trade
      localName: allocationVersionSetDigest
      label: allocation version-set digest
      definition: The allocation version-set digest is a section-5.8 digest of the complete sorted allocation version IRI set, used for locking the contents of the economic allocation set.
      cnNote: 分配版本集摘要，是完整有序分配版本 IRI 集的摘要，用于锁定经济分配集合的内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationClosureProbeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationClosureProbeRef
      namespace: fin-post-trade
      localName: allocationClosureProbeRef
      label: allocation closure probe reference
      definition: The allocation closure probe reference is an absolute IRI of the completed allocation-set closure probe, used for pointing to the probe that proves the allocation set is complete.
      cnNote: 分配闭合探针引用，是已完成分配集闭合探针的绝对 IRI，用于指向证明分配集完整的探针。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationClosureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationClosureProbeDigest
      namespace: fin-post-trade
      localName: allocationClosureProbeDigest
      label: allocation closure probe digest
      definition: The allocation closure probe digest is a digest of the exact allocation closure probe bytes and result, used for locking the contents and result of an allocation closure probe.
      cnNote: 分配闭合探针摘要，是确切分配闭合探针字节与结果的摘要，用于锁定分配闭合探针的内容与结果。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    projectionSettlementAccountMode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/projectionSettlementAccountMode
      namespace: fin-post-trade
      localName: projectionSettlementAccountMode
      label: settlement-account projection
      definition: The settlement-account projection is a projection branch marker that is true when the projection is one complete SettlementLeg value, used for flagging that the projection takes the settlement-account perspective.
      cnNote: 结算账户投影，是当投影为单一完整结算腿值时为真的分支标记，用于标示该投影取结算账户口径。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    projectionEconomicAllocationMode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/projectionEconomicAllocationMode
      namespace: fin-post-trade
      localName: projectionEconomicAllocationMode
      label: economic-allocation projection
      definition: The economic-allocation projection is a projection branch marker that is true when the projection is the sum of complete focal-account allocations, used for flagging that the projection takes the economic-allocation perspective.
      cnNote: 经济分配投影，是当投影为核心账户完整分配之和时为真的分支标记，用于标示该投影取经济分配口径。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementAssetKind
      namespace: fin-post-trade
      localName: settlementAssetKind
      label: settlement asset kind
      definition: The settlement asset kind is a closed cash or security comparison-key asset kind, used for characterizing whether a comparison key corresponds to cash or to a security.
      cnNote: 结算资产种类，是封闭的现金或证券比较键资产种类，用于刻画比较键对应的是现金还是证券。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementAssetKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    comparisonCurrencyAlphaCode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonCurrencyAlphaCode
      namespace: fin-post-trade
      localName: comparisonCurrencyAlphaCode
      label: comparison currency alpha code
      definition: The comparison currency alpha code is exactly three uppercase ASCII letters forming the cash asset identity of a canonical reconciliation key, used for characterizing the currency of a cash comparison key.
      cnNote: 比较货币字母码，是构成规范对账键现金资产身份的恰好三位大写 ASCII 字母，用于刻画现金比较键的币种。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^[A-Z]{3}$
    comparisonCurrencyScale:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonCurrencyScale
      namespace: fin-post-trade
      localName: comparisonCurrencyScale
      label: comparison currency scale
      definition: >-
        The comparison currency scale is a non-negative currency minor-unit or locked decimal-scale contract that forms
        the cash unit identity of a canonical reconciliation key, used for characterizing the precision of a cash
        comparison key.
      cnNote: 比较货币精度，是构成规范对账键现金单位身份的非负货币小数位或锁定小数精度契约，用于刻画现金比较键的精度。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    comparisonQuantityUnit:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonQuantityUnit
      namespace: fin-post-trade
      localName: comparisonQuantityUnit
      label: comparison quantity unit
      definition: The comparison quantity unit is an absolute controlled Quantity-unit IRI forming the security unit identity of a canonical reconciliation key, used for characterizing the quantity unit of a security comparison key.
      cnNote: 比较数量单位，是构成规范对账键证券单位身份的受控数量单位绝对 IRI，用于刻画证券比较键的数量单位。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    comparisonKeyDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonKeyDigest
      namespace: fin-post-trade
      localName: comparisonKeyDigest
      label: comparison-key digest
      definition: The comparison-key digest is a tagged JCS digest of the complete canonical settlement comparison key, used for locking the matching key used in reconciliation.
      cnNote: 比较键摘要，是完整规范结算比较键的摘要，用于锁定对账所用的匹配键。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    internalSourceVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/internalSourceVersionSetDigest
      namespace: fin-post-trade
      localName: internalSourceVersionSetDigest
      label: internal-source version-set digest
      definition: The internal-source version-set digest is a digest of the exact leg, allocation, and bridge tuple set feeding one projection, used for locking the internal source set a projection relies on.
      cnNote: 内部来源版本集摘要，是喂给某一投影的确切腿分配桥元组集的摘要，用于锁定投影所依据的内部来源集合。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    projectedMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/projectedMoney
      namespace: fin-post-trade
      localName: projectedMoney
      label: projected Money
      definition: The projected Money is the canonical Money value of a settlement-account cash projection, used for characterizing the cash comparison value projected on the internal side.
      cnNote: 投影 Money，是结算账户现金投影的规范 Money 值，用于刻画内部侧投影出的现金比较值。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    projectedQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/projectedQuantity
      namespace: fin-post-trade
      localName: projectedQuantity
      label: projected Quantity
      definition: The projected Quantity is the canonical Quantity value of a security leg or economic allocation group, used for characterizing the security comparison value projected on the internal side.
      cnNote: 投影数量，是证券腿或经济分配组的规范数量值，用于刻画内部侧投影出的证券比较值。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    expectedSide:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/expectedSide
      namespace: fin-post-trade
      localName: expectedSide
      label: expected reconciliation side
      definition: The expected reconciliation side is a closed internal or external side proven absent, used for characterizing the side that should have been present but is empty in a missing-side assertion.
      cnNote: 期望对账侧，是经证明为空的封闭内部或外部侧，用于刻画缺失侧断言中应存在却为空的一侧。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationSide
      defaultCardinality:
        minCount: 0
        maxCount: 1
    findingKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/findingKind
      namespace: fin-post-trade
      localName: findingKind
      label: reconciliation finding kind
      definition: The reconciliation finding kind is a closed matched, valueMismatch, duplicate, or missingSide result, used for characterizing the specific category of a reconciliation finding.
      cnNote: 对账发现种类，是封闭的匹配、数值不符、重复或缺失侧结果，用于刻画对账发现的具体类别。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    matchedFinding:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/matchedFinding
      namespace: fin-post-trade
      localName: matchedFinding
      label: matched finding
      definition: The matched finding is a branch marker that is true when the comparison is one-to-one and equal, used for flagging that a key bucket is fully matched.
      cnNote: 匹配发现，是当比较为一对一且相等时为真的分支标记，用于标示该键桶为完全匹配。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    valueMismatchFinding:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/valueMismatchFinding
      namespace: fin-post-trade
      localName: valueMismatchFinding
      label: value-mismatch finding
      definition: The value-mismatch finding is a branch marker that is true when the comparison is one-to-one but unequal, used for flagging that a key bucket has a value difference.
      cnNote: 数值不符发现，是当比较为一对一但不等时为真的分支标记，用于标示该键桶存在数值差异。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    duplicateFinding:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/duplicateFinding
      namespace: fin-post-trade
      localName: duplicateFinding
      label: duplicate finding
      definition: The duplicate finding is a branch marker that is true when either exact side count exceeds one, used for flagging that a key bucket contains duplicates.
      cnNote: 重复发现，是当任一侧确切计数超过一时为真的分支标记，用于标示该键桶存在重复项。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    missingSideFinding:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/missingSideFinding
      namespace: fin-post-trade
      localName: missingSideFinding
      label: missing-side finding
      definition: The missing-side finding is a branch marker that is true when the comparison is one-to-zero or zero-to-one, used for flagging that one side of a key bucket is missing.
      cnNote: 缺失侧发现，是当比较为一对零或零对一时为真的分支标记，用于标示该键桶一侧缺失。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    internalCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/internalCount
      namespace: fin-post-trade
      localName: internalCount
      label: internal count
      definition: The internal count is the exact number of internal Projection versions in the key bucket, used for characterizing how many items the key bucket has on the internal side.
      cnNote: 内部计数，是键桶内内部投影版本的确切数量，用于刻画该键桶内部侧的项目数。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    externalCount:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/externalCount
      namespace: fin-post-trade
      localName: externalCount
      label: external count
      definition: The external count is the exact number of external StatementLine versions in the key bucket, used for characterizing how many items the key bucket has on the external side.
      cnNote: 外部计数，是键桶内外部对账单明细版本的确切数量，用于刻画该键桶外部侧的项目数。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    duplicateSide:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/duplicateSide
      namespace: fin-post-trade
      localName: duplicateSide
      label: duplicate side
      definition: The duplicate side is a closed internal, external, or both duplicate side, used for characterizing which side or sides a duplicate occurs on.
      cnNote: 重复侧，是封闭的内部、外部或双侧重复侧，用于刻画重复发生在哪一侧或两侧。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateSide
      defaultCardinality:
        minCount: 0
        maxCount: 1
    internalDuplicateValueRelation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/internalDuplicateValueRelation
      namespace: fin-post-trade
      localName: internalDuplicateValueRelation
      label: internal duplicate value relation
      definition: The internal duplicate value relation is an identical or conflicting relation among internal duplicate values, used for characterizing whether the internal-side duplicate values agree.
      cnNote: 内部重复值关系，是内部重复值之间相同或冲突的关系，用于刻画内部侧重复值是否一致。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation
      defaultCardinality:
        minCount: 0
        maxCount: 1
    externalDuplicateValueRelation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/externalDuplicateValueRelation
      namespace: fin-post-trade
      localName: externalDuplicateValueRelation
      label: external duplicate value relation
      definition: The external duplicate value relation is an identical or conflicting relation among external duplicate values, used for characterizing whether the external-side duplicate values agree.
      cnNote: 外部重复值关系，是外部重复值之间相同或冲突的关系，用于刻画外部侧重复值是否一致。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation
      defaultCardinality:
        minCount: 0
        maxCount: 1
    crossSideValueRelation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/crossSideValueRelation
      namespace: fin-post-trade
      localName: crossSideValueRelation
      label: cross-side value relation
      definition: The cross-side value relation is an allEqual or mismatch relation that holds when both duplicate-bucket sides are non-empty, used for characterizing whether the two sides of a duplicate bucket agree.
      cnNote: 跨侧值关系，是当重复桶两侧均非空时全部相等或不符的关系，用于刻画重复桶两侧数值是否一致。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation
      defaultCardinality:
        minCount: 0
        maxCount: 1
    mismatchDimension:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/mismatchDimension
      namespace: fin-post-trade
      localName: mismatchDimension
      label: mismatch dimension
      definition: The mismatch dimension is a closed typed dimension that explains a value mismatch, used for characterizing which dimension a value difference arises in.
      cnNote: 不符维度，是解释数值差异的封闭类型化维度，用于刻画数值不符具体体现在哪个维度。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension
      defaultCardinality:
        minCount: 0
        maxCount: null
    internalMismatchDimension:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/internalMismatchDimension
      namespace: fin-post-trade
      localName: internalMismatchDimension
      label: internal mismatch dimension
      definition: The internal mismatch dimension is the sorted set of dimensions that differ among internal projections in a duplicate bucket, used for characterizing the per-dimension differences of internal-side duplicate values.
      cnNote: 内部不符维度，是重复桶内内部投影之间不同的有序维度，用于刻画内部侧重复值在各维度的差异。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension
      defaultCardinality:
        minCount: 0
        maxCount: null
    externalMismatchDimension:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/externalMismatchDimension
      namespace: fin-post-trade
      localName: externalMismatchDimension
      label: external mismatch dimension
      definition: The external mismatch dimension is the sorted set of dimensions that differ among external statement lines in a duplicate bucket, used for characterizing the per-dimension differences of external-side duplicate values.
      cnNote: 外部不符维度，是重复桶内外部对账单明细之间不同的有序维度，用于刻画外部侧重复值在各维度的差异。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension
      defaultCardinality:
        minCount: 0
        maxCount: null
    crossMismatchDimension:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/crossMismatchDimension
      namespace: fin-post-trade
      localName: crossMismatchDimension
      label: cross-side mismatch dimension
      definition: The cross-side mismatch dimension is the sorted set of dimensions that differ across internal projections and external statement lines in a non-empty bucket, used for characterizing the per-dimension differences of values across both sides.
      cnNote: 跨侧不符维度，是非空桶内跨内部投影与外部对账单明细之间不同的有序维度，用于刻画两侧数值在各维度的差异。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension
      defaultCardinality:
        minCount: 0
        maxCount: null
    findingSubjectDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/findingSubjectDigest
      namespace: fin-post-trade
      localName: findingSubjectDigest
      label: finding-subject digest
      definition: >-
        The finding-subject digest is a tagged JCS digest with domain
        axiolune-reconciliation-finding-subject-v1 NUL over the strict RFC-001 object {schemaVersion:"1.0", variant,
        internalVersionIris, externalVersionIris, missingSideAssertionVersionIri?}; the optional field is omitted, never
        null, outside missing-side and composite duplicate rows, and case/comparison-key fields are not members of this
        digest domain, used for locking the subject contents a reconciliation finding carries.
      cnNote: 发现主体摘要，是对发现所承载内部与外部版本及可选缺失侧断言的摘要，用于锁定对账发现所涉及的主体内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    reconciliationStatus:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationStatus
      namespace: fin-post-trade
      localName: reconciliationStatus
      label: reconciliation status
      definition: The reconciliation status is a closed open, investigating, resolved, or closed-no-action workflow state, used for characterizing the lifecycle stage of a reconciliation case.
      cnNote: 对账状态，是封闭的待处理、调查中、已解决或无操作关闭工作流状态，用于刻画对账案例的生命周期阶段。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatus
      defaultCardinality:
        minCount: 0
        maxCount: 1
    profileScopeDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/profileScopeDigest
      namespace: fin-post-trade
      localName: profileScopeDigest
      label: profile-scope digest
      definition: >-
        The profile-scope digest is a tagged digest locking the exact set of profile-scoped constraints and locked
        values under which an implementation profile is active, used for distinguishing the active profile from the
        generic core.
      cnNote: 画像作用域摘要，是锁定某实现画像处于激活态时所适用确切画像作用域约束与锁定值的标记摘要，用于区分激活画像与通用核心。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    confirmationRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/confirmationRef
      namespace: fin-post-trade
      localName: confirmationRef
      label: confirmation reference
      definition: >-
        The confirmation reference is an optional traceability hook to a trade-confirmation fact modeled in a peer
        module, used for linking a settlement instruction to its confirmation without modeling confirmation here.
      cnNote: 确认引用，是可选可追溯钩子，指向在同级模块中建模的交易确认事实，用于将结算指令链接到其确认而不在本模块建模确认。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    affirmationRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/affirmationRef
      namespace: fin-post-trade
      localName: affirmationRef
      label: affirmation reference
      definition: >-
        The affirmation reference is an optional traceability hook to an affirmation fact modeled in a peer module,
        used for linking a settlement instruction to its affirmation without modeling affirmation here.
      cnNote: 适格引用，是可选可追溯钩子，指向在同级模块中建模的适格事实，用于将结算指令链接到其适格而不在本模块建模适格。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    clearingRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/clearingRef
      namespace: fin-post-trade
      localName: clearingRef
      label: clearing reference
      definition: >-
        The clearing reference is an optional traceability hook to a clearing obligation or CCP relationship modeled in
        a peer module, used for linking a settlement instruction to clearing without modeling clearing here.
      cnNote: 清算引用，是可选可追溯钩子，指向在同级模块中建模的清算义务或 CCP 关系，用于将结算指令链接到清算而不在本模块建模清算。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    nettingSetRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/nettingSetRef
      namespace: fin-post-trade
      localName: nettingSetRef
      label: netting-set reference
      definition: >-
        The netting-set reference is an optional traceability hook to a netting set modeled in a peer module, used for
        linking a settlement instruction to its netting context without modeling netting here.
      cnNote: 净额集合引用，是可选可追溯钩子，指向在同级模块中建模的净额集合，用于将结算指令链接到其净额上下文而不在本模块建模净额。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    finalityProviderEventId:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/finalityProviderEventId
      namespace: fin-post-trade
      localName: finalityProviderEventId
      label: finality provider event id
      definition: The finality provider event id is the provider-scoped identifier of a settlement finality event, used for distinguishing finality records within a provider scope.
      cnNote: 最终性提供方事件标识，是结算最终性事件的提供方作用域标识，用于在提供方作用域内区分最终性记录。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    finalityKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/finalityKind
      namespace: fin-post-trade
      localName: finalityKind
      label: finality kind
      definition: >-
        The finality kind is a closed classification of settlement finality as provisional, unconditional, or
        irrevocable, used for characterizing the legal or system finality status distinct from a source-reported settled
        status.
      cnNote: 最终性种类，是按暂时性、无条件或不可撤销封闭的结算最终性分类，用于刻画区别于来源报告 settled 状态的法律或系统最终性状态。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    finalitySystem:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/finalitySystem
      namespace: fin-post-trade
      localName: finalitySystem
      label: finality system
      definition: >-
        The finality system is the settlement system under whose rules finality is achieved, used for characterizing the
        finality context. The string form is a source representation; an authority-scoped identifier form is optional.
      cnNote: 最终性系统，是依据其规则达成最终性的结算系统，用于刻画最终性上下文。字符串形式为来源表示，authority-scoped 标识符形式为可选。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    finalityRuleBasisRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/finalityRuleBasisRef
      namespace: fin-post-trade
      localName: finalityRuleBasisRef
      label: finality rule-basis reference
      definition: The finality rule-basis reference is an optional reference to the rule or law under which settlement finality is achieved, used for evidencing the finality basis.
      cnNote: 最终性规则依据引用，是可选的对达成结算最终性所依据规则或法律的引用，用于为最终性依据提供证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    finalityInstant:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/finalityInstant
      namespace: fin-post-trade
      localName: finalityInstant
      label: finality instant
      definition: The finality instant is the point in time at which legal or system settlement finality is achieved, distinct from the reported observation time and the knowledge/availability pivots.
      cnNote: 最终性时点，是法律或系统结算最终性达成的时点，区别于报告观察时点与知识/可得性枢轴。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    originalSettlementDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/originalSettlementDate
      namespace: fin-post-trade
      localName: originalSettlementDate
      label: original settlement date
      definition: The original settlement date is the settlement date originally instructed, before any amendment, used for distinguishing the original from the amended settlement date.
      cnNote: 原定结算日，是任何修订前最初指示的结算日，用于区分原定与修订后的结算日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    amendedSettlementDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/amendedSettlementDate
      namespace: fin-post-trade
      localName: amendedSettlementDate
      label: amended settlement date
      definition: The amended settlement date is the settlement date after a rescheduling or amendment, used for distinguishing the amended from the original settlement date.
      cnNote: 修订结算日，是重新安排或修订后的结算日，用于区分修订与原定结算日。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    actualSettlementInstant:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/actualSettlementInstant
      namespace: fin-post-trade
      localName: actualSettlementInstant
      label: actual settlement instant
      definition: The actual settlement instant is the point in time at which the asset movement actually occurred, distinct from the instructed, reported, and finality times.
      cnNote: 实际结算时点，是资产移动实际发生的时点，区别于指示、报告与最终性时点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    matchCardinality:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/matchCardinality
      namespace: fin-post-trade
      localName: matchCardinality
      label: match cardinality
      definition: The match cardinality is a closed classification of a reconciliation match group as one-to-one, one-to-many, many-to-one, or many-to-many, used for characterizing the matching shape under a non-strict profile.
      cnNote: 匹配基数，是按一对一、一对多、多对一或多对多封闭的对账匹配组分类，用于刻画非严格画像下的匹配形状。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/MatchCardinality
      defaultCardinality:
        minCount: 0
        maxCount: 1
    matchBasis:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/matchBasis
      namespace: fin-post-trade
      localName: matchBasis
      label: match basis
      definition: The match basis is an optional description of the rule or rationale under which a reconciliation match group was formed, used for evidencing non-strict matches.
      cnNote: 匹配依据，是对形成对账匹配组所依据规则或理由的可选描述，用于为非严格匹配提供证据。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    matchGroupSubjectDigest:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/matchGroupSubjectDigest
      namespace: fin-post-trade
      localName: matchGroupSubjectDigest
      label: match-group subject digest
      definition: The match-group subject digest is a tagged digest locking the exact internal and external member versions grouped as one logical business fact, used for locking the subject contents a reconciliation match group carries.
      cnNote: 匹配组主体摘要，是锁定作为同一逻辑业务事实分组的内部与外部成员版本的标记摘要，用于锁定对账匹配组所承载的主体内容。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    absenceProofKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/absenceProofKind
      namespace: fin-post-trade
      localName: absenceProofKind
      label: absence-proof kind
      definition: >-
        The absence-proof kind is a closed classification of a missing-side assertion as deterministic side absence,
        unknown coverage, or incomplete source coverage, used for distinguishing a proven business absence from a
        no-result query whose coverage is unknown.
      cnNote: 缺失证明种类，是按确定性侧缺失、覆盖未知或不完整来源覆盖封闭的缺失侧断言分类，用于区分经证明的业务缺失与覆盖未知的无结果查询。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/AbsenceProofKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    coverageUnknownReason:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/coverageUnknownReason
      namespace: fin-post-trade
      localName: coverageUnknownReason
      label: coverage-unknown reason
      definition: The coverage-unknown reason is an optional description of why source coverage could not be established for a no-result query, used for evidencing an incomplete source coverage assertion.
      cnNote: 覆盖未知原因，是对无结果查询为何无法确立来源覆盖的可选描述，用于为不完整来源覆盖断言提供证据。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionKind
      namespace: fin-post-trade
      localName: optionKind
      label: option kind
      definition: The option kind is a closed classification of a corporate action option as a default option, voluntary election, withdrawal, amendment, or partial allocation, used for characterizing the option lifecycle.
      cnNote: 选项种类，是按默认选项、自愿选举、撤回、修订或部分分配封闭的公司行为选项分类，用于刻画选项生命周期。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionConsiderationCash:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionConsiderationCash
      namespace: fin-post-trade
      localName: optionConsiderationCash
      label: option consideration cash
      definition: The option consideration cash is the optional cash-per-unit consideration offered by a corporate action option, used for characterizing a cash-consideration option.
      cnNote: 选项对价现金，是公司行为选项提供的可选每单位现金对价，用于刻画现金对价选项。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionConsiderationSplitRatio:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionConsiderationSplitRatio
      namespace: fin-post-trade
      localName: optionConsiderationSplitRatio
      label: option consideration split ratio
      definition: The option consideration split ratio is the optional split-ratio consideration offered by a corporate action option, used for characterizing a split-consideration option.
      cnNote: 选项对价拆分比，是公司行为选项提供的可选拆分比对价，用于刻画拆分对价选项。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionConsiderationSubscriptionPrice:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionConsiderationSubscriptionPrice
      namespace: fin-post-trade
      localName: optionConsiderationSubscriptionPrice
      label: option consideration subscription price
      definition: The option consideration subscription price is the optional subscription-price consideration offered by a corporate action option, used for characterizing a subscription-consideration option.
      cnNote: 选项对价认购价，是公司行为选项提供的可选认购价对价，用于刻画认购对价选项。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionElectionDeadline:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionElectionDeadline
      namespace: fin-post-trade
      localName: optionElectionDeadline
      label: option election deadline
      definition: The option election deadline is the optional date by which an election for this option must be submitted, used for characterizing the option's election window.
      cnNote: 选项选举截止，是本选项选举须提交的可选截止日期，用于刻画选项的选举窗口。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionAllocationRatio:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionAllocationRatio
      namespace: fin-post-trade
      localName: optionAllocationRatio
      label: option allocation ratio
      definition: The option allocation ratio is the optional ratio of the elected quantity allocated to this option, used for characterizing partial allocations.
      cnNote: 选项分配比，是分配至本选项的已选举数量比例，用于刻画部分分配。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionIsDefault:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionIsDefault
      namespace: fin-post-trade
      localName: optionIsDefault
      label: option is default
      definition: The option-is-default flag indicates whether this option is the default applied when no election is submitted, used for distinguishing the default option from voluntary options.
      cnNote: 选项为默认标记，指示本选项是否为未提交选举时适用的默认选项，用于区分默认选项与自愿选项。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    optionAmendmentOfRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/optionAmendmentOfRef
      namespace: fin-post-trade
      localName: optionAmendmentOfRef
      label: option amendment-of reference
      definition: The option amendment-of reference is an optional reference to the prior option version that this option amends or withdraws, used for tracing the option lifecycle.
      cnNote: 选项修订源引用，是可选的对本选项所修订或撤回的先前选项版本的引用，用于追溯选项生命周期。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationAssetKind
      namespace: fin-post-trade
      localName: allocationAssetKind
      label: allocation asset kind
      definition: The allocation asset kind is a closed classification of a settlement leg allocation as cash, security, fee, or tax, used for characterizing the asset dimension a leg allocation applies to.
      cnNote: 分配资产种类，是按现金、证券、费用或税封闭的结算腿分配分类，用于刻画腿分配所适用的资产维度。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationAssetKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocatedMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocatedMoney
      namespace: fin-post-trade
      localName: allocatedMoney
      label: allocated money
      definition: The allocated money is the optional MonetaryAmount allocated from a cash or fee or tax leg to an economic account, used for characterizing the cash dimension of a settlement leg allocation.
      cnNote: 已分配金额，是从现金、费用或税腿分配到经济账户的可选 MonetaryAmount，用于刻画结算腿分配的现金维度。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationBasis:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationBasis
      namespace: fin-post-trade
      localName: allocationBasis
      label: allocation basis
      definition: The allocation basis is an optional description of the rule or rationale under which a settlement leg allocation was derived, used for evidencing the allocation.
      cnNote: 分配基准，是对结算腿分配所依据规则或理由的可选描述，用于为分配提供证据。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationResidualQuantity:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationResidualQuantity
      namespace: fin-post-trade
      localName: allocationResidualQuantity
      label: allocation residual quantity
      definition: The allocation residual quantity is the optional unallocated Quantity remainder of a security leg after partial allocation, used for characterizing allocation residuals.
      cnNote: 分配残差数量，是部分分配后证券腿的可选未分配 Quantity 余数，用于刻画分配残差。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationResidualMoney:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationResidualMoney
      namespace: fin-post-trade
      localName: allocationResidualMoney
      label: allocation residual money
      definition: The allocation residual money is the optional unallocated MonetaryAmount remainder of a cash, fee, or tax leg after partial allocation, used for characterizing allocation residuals.
      cnNote: 分配残差金额，是部分分配后现金、费用或税腿的可选未分配 MonetaryAmount 余数，用于刻画分配残差。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationFxConversionRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationFxConversionRef
      namespace: fin-post-trade
      localName: allocationFxConversionRef
      label: allocation FX conversion reference
      definition: The allocation FX conversion reference is an optional reference to an FX rate application used to convert the allocated amount across currencies, used for evidencing cross-currency allocation.
      cnNote: 分配外币换算引用，是可选的对用于跨币种转换已分配金额的外币汇率应用的引用，用于为跨币种分配提供证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationRoundingPolicyRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/allocationRoundingPolicyRef
      namespace: fin-post-trade
      localName: allocationRoundingPolicyRef
      label: allocation rounding-policy reference
      definition: The allocation rounding-policy reference is an optional reference to the rounding policy applied when deriving the allocated amount, used for evidencing allocation rounding.
      cnNote: 分配舍入政策引用，是可选的对推导已分配金额所适用舍入政策的引用，用于为分配舍入提供证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    dispositionKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/dispositionKind
      namespace: fin-post-trade
      localName: dispositionKind
      label: disposition kind
      definition: The disposition kind is a closed classification of a finding-level reconciliation disposition as accepted, investigated, corrected, waived, escalated, reopened, or externally pending, used for characterizing the resolution workflow.
      cnNote: 处置种类，是按接受、调查、更正、豁免、升级、重开或外部待处理封闭的发现级对账处置分类，用于刻画解决工作流。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    remedialAction:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/remedialAction
      namespace: fin-post-trade
      localName: remedialAction
      label: remedial action
      definition: The remedial action is an optional description of the corrective action taken to resolve a reconciliation finding, used for evidencing the resolution.
      cnNote: 补救动作，是对为解决对账发现所采取纠正动作的可选描述，用于为解决提供证据。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    waiverRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/waiverRef
      namespace: fin-post-trade
      localName: waiverRef
      label: waiver reference
      definition: The waiver reference is an optional reference to a documented waiver authorizing a reconciliation finding to be waived, used for evidencing a waived disposition.
      cnNote: 豁免引用，是可选的对授权豁免某对账发现的已记录豁免的引用，用于为豁免处置提供证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementSystemIdentifierRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementSystemIdentifierRef
      namespace: fin-post-trade
      localName: settlementSystemIdentifierRef
      label: settlement-system identifier reference
      definition: >-
        The settlement-system identifier reference is an optional authority-scoped identifier for the settlement system,
        complementing the source string settlementSystem, used for stable cross-source identity. The string form is
        retained as the source representation.
      cnNote: 结算系统标识符引用，是结算系统的可选 authority-scoped 标识符，补充来源字符串结算系统，用于跨来源稳定身份。字符串形式作为来源表示保留。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementLocationIdentifierRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLocationIdentifierRef
      namespace: fin-post-trade
      localName: settlementLocationIdentifierRef
      label: settlement-location identifier reference
      definition: >-
        The settlement-location identifier reference is an optional authority-scoped identifier for the settlement
        location, complementing the source string settlementLocation, used for stable cross-source identity. The string
        form is retained as the source representation.
      cnNote: 结算地点标识符引用，是结算地点的可选 authority-scoped 标识符，补充来源字符串结算地点，用于跨来源稳定身份。字符串形式作为来源表示保留。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    settlementCalendarKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/settlementCalendarKind
      namespace: fin-post-trade
      localName: settlementCalendarKind
      label: settlement-calendar kind
      definition: >-
        The settlement-calendar kind is a closed classification of a settlement calendar role as a trading calendar, a
        settlement-system calendar, or a payment-system calendar, used for distinguishing calendar types beyond the
        single TradingCalendar.
      cnNote: 结算日历种类，是按交易日历、结算系统日历或支付系统日历封闭的结算日历角色分类，用于区分单一 TradingCalendar 之外的日历类型。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementCalendarKind
      defaultCardinality:
        minCount: 0
        maxCount: 1
    upstreamCustodyBridgeRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/upstreamCustodyBridgeRef
      namespace: fin-post-trade
      localName: upstreamCustodyBridgeRef
      label: upstream custody-bridge reference
      definition: >-
        The upstream custody-bridge reference is an optional self-reference to the next upstream custody bridge in a
        global-custodian to sub-custodian to CSD chain, used for modeling multi-hop custody beyond a single bridge.
      cnNote: 上游托管桥引用，是全局托管到子托管到 CSD 链中下一上游托管桥的可选自引用，用于建模单跳桥接之外的多跳托管。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    bridgeValidFrom:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/bridgeValidFrom
      namespace: fin-post-trade
      localName: bridgeValidFrom
      label: bridge valid-from
      definition: The bridge valid-from date is the optional date from which a custody settlement account bridge is effective, used for time-scoping the bridge.
      cnNote: 桥有效起始日，是托管结算账户桥生效的可选起始日期，用于对桥进行时间作用域限定。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    bridgeValidTo:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/bridgeValidTo
      namespace: fin-post-trade
      localName: bridgeValidTo
      label: bridge valid-to
      definition: The bridge valid-to date is the optional date until which a custody settlement account bridge is effective, used for time-scoping the bridge.
      cnNote: 桥有效截止日，是托管结算账户桥有效的可选截止日期，用于对桥进行时间作用域限定。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statementType:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementType
      namespace: fin-post-trade
      localName: statementType
      label: statement type
      definition: >-
        The statement type is a closed classification of an external settlement statement as a holdings statement, a
        transactions statement, or a pending-settlement statement, used for characterizing the statement coverage beyond
        a single-day single-account flow.
      cnNote: 对账单类型，是按持仓对账单、交易对账单或待结算对账单封闭的外部结算对账单分类，用于刻画单日单账户流水之外的对账单覆盖。
      valueType: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementType
      defaultCardinality:
        minCount: 0
        maxCount: 1
    coveragePeriodStart:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/coveragePeriodStart
      namespace: fin-post-trade
      localName: coveragePeriodStart
      label: coverage-period start
      definition: The coverage-period start is the optional start date of the period covered by an external settlement statement, used for characterizing multi-day statement coverage.
      cnNote: 覆盖期起始，是外部结算对账单所覆盖期间的可选起始日期，用于刻画多日对账单覆盖。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    coveragePeriodEnd:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/coveragePeriodEnd
      namespace: fin-post-trade
      localName: coveragePeriodEnd
      label: coverage-period end
      definition: The coverage-period end is the optional end date of the period covered by an external settlement statement, used for characterizing multi-day statement coverage.
      cnNote: 覆盖期截止，是外部结算对账单所覆盖期间的可选截止日期，用于刻画多日对账单覆盖。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    statementAsOfTime:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/statementAsOfTime
      namespace: fin-post-trade
      localName: statementAsOfTime
      label: statement as-of time
      definition: The statement as-of time is the optional point in time at which an external settlement statement is asserted, used for characterizing the statement snapshot instant.
      cnNote: 对账单截至时点，是外部结算对账单所断言的可选时点，用于刻画对账单快照瞬间。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    bookDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/bookDate
      namespace: fin-post-trade
      localName: bookDate
      label: book date
      definition: The book date is the optional accounting book date of an external statement entry, distinct from its value date, used for separating book and value timing.
      cnNote: 账面日期，是外部对账单明细的可选会计账面日期，区别于其价值日期，用于分离账面与价值时点。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    valueDate:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/valueDate
      namespace: fin-post-trade
      localName: valueDate
      label: value date
      definition: The value date is the optional value date of an external statement entry, distinct from its book date, used for separating book and value timing.
      cnNote: 价值日期，是外部对账单明细的可选价值日期，区别于其账面日期，用于分离账面与价值时点。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    entryIsCorrection:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/entryIsCorrection
      namespace: fin-post-trade
      localName: entryIsCorrection
      label: entry is correction
      definition: The entry-is-correction flag indicates that an external statement entry is a correction of a prior entry, used for distinguishing corrections from originals.
      cnNote: 明细为更正标记，指示某外部对账单明细是对先前明细的更正，用于区分更正与原始。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    entryIsReversal:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/entryIsReversal
      namespace: fin-post-trade
      localName: entryIsReversal
      label: entry is reversal
      definition: The entry-is-reversal flag indicates that an external statement entry is a reversal of a prior entry, used for distinguishing reversals from originals.
      cnNote: 明细为撤销标记，指示某外部对账单明细是对先前明细的撤销，用于区分撤销与原始。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electionDeadlineTimezone:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadlineTimezone
      namespace: fin-post-trade
      localName: electionDeadlineTimezone
      label: election-deadline timezone
      definition: >-
        The election-deadline timezone is the optional timezone in which an event-level election deadline date is
        interpreted, used for deriving the policy cutoff instant without ambiguity.
      cnNote: 选举截止时区，是事件级选举截止日期所解释的可选时区，用于无歧义地推导策略截止瞬间。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    electionDeadlineCutoffSource:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadlineCutoffSource
      namespace: fin-post-trade
      localName: electionDeadlineCutoffSource
      label: election-deadline cutoff source
      definition: >-
        The election-deadline cutoff source is an optional reference to the authority or market practice that defines
        the election deadline cutoff, used for evidencing the derivation of the policy cutoff from the event date.
      cnNote: 选举截止截止来源，是定义选举截止截止的权威或市场实践的可选引用，用于为策略截止自事件日期的推导提供证据。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    adjustmentPortfolioEffectRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentPortfolioEffectRef
      namespace: fin-post-trade
      localName: adjustmentPortfolioEffectRef
      label: adjustment portfolio-effect reference
      definition: The adjustment portfolio-effect reference is an optional reference to a portfolio-level effect of a corporate action adjustment, used for tracing portfolio impact beyond cash and quantity summaries.
      cnNote: 调整组合效果引用，是对公司行为调整组合级效果的可选引用，用于追溯现金与数量摘要之外的影响。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    adjustmentPositionEffectRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentPositionEffectRef
      namespace: fin-post-trade
      localName: adjustmentPositionEffectRef
      label: adjustment position-effect reference
      definition: The adjustment position-effect reference is an optional reference to a position-level effect of a corporate action adjustment, used for tracing position impact.
      cnNote: 调整头寸效果引用，是对公司行为调整头寸级效果的可选引用，用于追溯头寸影响。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    adjustmentLotEffectRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentLotEffectRef
      namespace: fin-post-trade
      localName: adjustmentLotEffectRef
      label: adjustment lot-effect reference
      definition: The adjustment lot-effect reference is an optional reference to a lot-level effect of a corporate action adjustment, used for tracing lot impact.
      cnNote: 调整批次效果引用，是对公司行为调整批次级效果的可选引用，用于追溯批次影响。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    adjustmentCostBasisEffectRef:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentCostBasisEffectRef
      namespace: fin-post-trade
      localName: adjustmentCostBasisEffectRef
      label: adjustment cost-basis-effect reference
      definition: The adjustment cost-basis-effect reference is an optional reference to a cost-basis effect of a corporate action adjustment, used for tracing cost-basis impact.
      cnNote: 调整成本基础效果引用，是对公司行为调整成本基础效果的可选引用，用于追溯成本基础影响。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
  identifierTypes: {}
  codeLists:
    DueBillQualificationResult:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult
      namespace: fin-post-trade
      localName: DueBillQualificationResult
      label: Due Bill Qualification Result
      definition: The due-bill qualification result is a closed due-bill trade qualification outcome, used for giving the verdict on whether a trade qualifies as a due-bill.
      cnNote: 到期票据资格结果，是封闭的到期票据交易资格判定结果，用于给出某笔交易是否合格为到期票据的结论。
      vocabulary: Due Bill Qualification Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult/value/eligible
          notation: eligible
          label: Eligible
          definition: all execution, allocation, interval, endpoint and settlement clauses pass
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult/value/ineligible
          notation: ineligible
          label: Ineligible
          definition: one or more locked qualification clauses fail
    DueBillTransferState:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState
      namespace: fin-post-trade
      localName: DueBillTransferState
      label: Due Bill Transfer State
      definition: The due-bill transfer state is a closed set of transfer attempt and completion states, used for characterizing the result stage a due-bill transfer is in.
      cnNote: 到期票据划转状态，是封闭的划转尝试与完成状态，用于刻画到期票据划转所处的结果阶段。
      vocabulary: Due Bill Transfer State
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/pending
          notation: pending
          label: Pending
          definition: attempt exists but contributes zero fulfilled value
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/completed
          notation: completed
          label: Completed
          definition: completed movement evidence may contribute fulfilled value
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/failed
          notation: failed
          label: Failed
          definition: attempt failed and contributes zero
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/cancelled
          notation: cancelled
          label: Cancelled
          definition: attempt was cancelled and contributes zero
    FulfillmentResult:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult
      namespace: fin-post-trade
      localName: FulfillmentResult
      label: Fulfillment Result
      definition: >-
        The fulfillment result is a closed classification of obligation fulfillment derived from the fulfilled value
        relative to the obligation value, used for characterizing whether an obligation is unfulfilled, partially
        fulfilled, or fully fulfilled.
      cnNote: 履约结果，是由已完成值相对义务值导出的封闭义务履行分类，用于刻画义务是未完成、部分完成还是完全完成。
      vocabulary: Fulfillment Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult/value/unfulfilled
          notation: unfulfilled
          label: Unfulfilled
          definition: completed contributing subset is empty and fulfilled value is zero
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult/value/partiallyFulfilled
          notation: partiallyFulfilled
          label: Partially fulfilled
          definition: fulfilled value is strictly between zero and obligation value
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult/value/fullyFulfilled
          notation: fullyFulfilled
          label: Fully fulfilled
          definition: fulfilled value equals obligation value exactly
    ElectionDecision:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision
      namespace: fin-post-trade
      localName: ElectionDecision
      label: Election Decision
      definition: The election decision is a closed classification of a provider election as exercise or explicit decline, used for characterizing the holder's decision recorded in an election.
      cnNote: 选举决定，是按行权或明确拒绝封闭的提供方选举分类，用于刻画选举记录中的持有人决定。
      vocabulary: Election Decision
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision/value/exercise
          notation: exercise
          label: Exercise
          definition: electing Party exercises a positive bounded Quantity
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision/value/decline
          notation: decline
          label: Decline
          definition: electing Party explicitly declines and supplies no elected Quantity
    SubscriptionFulfillmentAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind
      namespace: fin-post-trade
      localName: SubscriptionFulfillmentAssetKind
      label: Subscription Fulfillment Asset Kind
      definition: The subscription fulfillment asset kind is a closed two-leg rights fulfillment selector, used for characterizing whether a subscription fulfillment belongs to the cash-payment leg or the security-delivery leg.
      cnNote: 认购履约资产种类，是封闭的双腿权利履约选择器，用于刻画认购履约属于现金支付腿还是证券交割腿。
      vocabulary: Subscription Fulfillment Asset Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind/value/cashPayment
          notation: cashPayment
          label: Cash payment
          definition: subscription cash moves from subscriber to agent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind/value/securityDelivery
          notation: securityDelivery
          label: Security delivery
          definition: successor Security moves from agent to subscriber
    ProcessingFindingStage:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage
      namespace: fin-post-trade
      localName: ProcessingFindingStage
      label: Processing Finding Stage
      definition: The processing finding stage is a closed set of corporate-action processing stages, used for characterizing whether a processing finding occurs in the schedule, entitlement, or due-bill stage.
      cnNote: 处理发现阶段，是封闭的公司行为处理阶段，用于刻画处理发现发生在排程、权益还是到期票据阶段。
      vocabulary: Processing Finding Stage
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage/value/schedule
          notation: schedule
          label: Schedule
          definition: rule selection or size assessment stage
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage/value/entitlement
          notation: entitlement
          label: Entitlement
          definition: position, election, subscription, or adjustment stage
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage/value/dueBill
          notation: dueBill
          label: Due bill
          definition: trade qualification, obligation, or transfer stage
    CorporateActionProcessingFindingKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind
      namespace: fin-post-trade
      localName: CorporateActionProcessingFindingKind
      label: Corporate Action Processing Finding Kind
      definition: >-
        The corporate action processing finding kind is a closed classification of failures detected while resolving
        schedules, entitlements, elections, subscriptions, adjustments, or due-bill processing, used for
        characterizing the specific category of a processing failure.
      cnNote: 公司行为处理发现种类，是对排程、权益、选举、认购、调整或到期票据处理过程中检出失败的封闭分类，用于刻画处理失败的具体类别。
      vocabulary: Corporate Action Processing Finding Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/noApplicableRule
          notation: noApplicableRule
          label: No applicable rule
          definition: no schedule-rule candidate survives
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/ruleConflict
          notation: ruleConflict
          label: Rule conflict
          definition: candidate precedence has no unique winner
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/sizeAssessmentFailure
          notation: sizeAssessmentFailure
          label: Size assessment failure
          definition: candidate-specific distribution assessment failed
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/missingElection
          notation: missingElection
          label: Missing election
          definition: required rights election is absent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/lateElection
          notation: lateElection
          label: Late election
          definition: election arrived after the resolved deadline
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/overElection
          notation: overElection
          label: Over election
          definition: elected Quantity exceeds entitlement maximum
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/unauthorizedElection
          notation: unauthorizedElection
          label: Unauthorized election
          definition: electing Party lacks self or account-role authority
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/electionConflict
          notation: electionConflict
          label: Election conflict
          definition: incompatible undominated provider candidates remain
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/invalidDefaultLapse
          notation: invalidDefaultLapse
          label: Invalid default lapse
          definition: default lapse lacks a completed empty-candidate proof
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/electionResolutionFailure
          notation: electionResolutionFailure
          label: Election resolution failure
          definition: provider policy cannot produce a valid closed result
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/subscriptionFulfillmentMismatch
          notation: subscriptionFulfillmentMismatch
          label: Subscription fulfillment mismatch
          definition: cash/security subscription closure is incomplete or inconsistent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/calculationMismatch
          notation: calculationMismatch
          label: Calculation mismatch
          definition: entitlement or benefit arithmetic differs from the locked formula
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/adjustmentMismatch
          notation: adjustmentMismatch
          label: Adjustment mismatch
          definition: post-evidence adjustment fields or dates differ from closure evidence
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/missingDueBillEvidence
          notation: missingDueBillEvidence
          label: Missing due-bill evidence
          definition: required qualification or obligation evidence is absent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/conflictingDueBillEvidence
          notation: conflictingDueBillEvidence
          label: Conflicting due-bill evidence
          definition: incomparable or contradictory due-bill evidence exists
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/ineligibleTradeQualification
          notation: ineligibleTradeQualification
          label: Ineligible trade qualification
          definition: an ineligible trade was used to form an obligation
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/endpointMismatch
          notation: endpointMismatch
          label: Endpoint mismatch
          definition: economic, settlement, account, or Party endpoints do not close
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/obligationBenefitMismatch
          notation: obligationBenefitMismatch
          label: Obligation benefit mismatch
          definition: benefit asset or arithmetic differs from Event and resolution
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/dueBillTransferMismatch
          notation: dueBillTransferMismatch
          label: Due-bill transfer mismatch
          definition: transfer asset, endpoints, or result differs from the obligation
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/duplicateTransfer
          notation: duplicateTransfer
          label: Duplicate transfer
          definition: movement evidence or current version is counted more than once
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/overTransfer
          notation: overTransfer
          label: Over transfer
          definition: completed transfer value exceeds obligation value
    SettlementMethod:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementMethod
      namespace: fin-post-trade
      localName: SettlementMethod
      label: Settlement Method
      definition: The settlement method is a closed classification of settlement instructions as delivery-versus-payment or free-of-payment, used for characterizing the delivery method a settlement instruction takes.
      cnNote: 结算方式，是按银货对付或纯交收封闭的结算指令分类，用于刻画结算指令采取的交收方式。
      vocabulary: Settlement Method
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementMethod/value/deliveryVersusPayment
          notation: deliveryVersusPayment
          label: Delivery versus payment
          definition: one security and one reciprocal cash leg settle atomically
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementMethod/value/freeOfPayment
          notation: freeOfPayment
          label: Free of payment
          definition: one security leg settles without a cash leg in this system
    SettlementStatus:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus
      namespace: fin-post-trade
      localName: SettlementStatus
      label: Settlement Status
      definition: >-
        The settlement status is a closed set of immutable settlement-event states, used for characterizing the stage
        an event is in across the settlement lifecycle. Note that "settled" characterizes a source-reported completion
        and is distinct from legal or system settlement finality, which is captured by a SettlementFinalityEvent.
      cnNote: 结算状态，是封闭的不可变结算事件状态，用于刻画结算生命周期中事件所处的阶段。注意 settled 刻画来源报告的完成，与法律或系统结算最终性不同，后者由结算最终性事件刻画。
      vocabulary: Settlement Status
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/instructed
          notation: instructed
          label: Instructed
          definition: instruction was created
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/matched
          notation: matched
          label: Matched
          definition: counterparties matched the instruction
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/settled
          notation: settled
          label: Settled
          definition: leg or atomic group completed under the locked profile; distinct from legal/system finality
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/cancelled
          notation: cancelled
          label: Cancelled
          definition: instruction or leg reached cancelled terminal state
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/failed
          notation: failed
          label: Failed
          definition: instruction or leg reached failed terminal state
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/pending
          notation: pending
          label: Pending
          definition: instruction accepted but not yet matched or settled
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/unmatched
          notation: unmatched
          label: Unmatched
          definition: instruction cannot be matched with a counterparty instruction
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/rejected
          notation: rejected
          label: Rejected
          definition: instruction was rejected by the receiving party or system
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/repair
          notation: repair
          label: Repair
          definition: instruction requires correction before it can progress
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/hold
          notation: hold
          label: Hold
          definition: instruction is suspended pending external resolution
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/partiallySettled
          notation: partiallySettled
          label: Partially Settled
          definition: some but not all of the instructed quantity has settled
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/rescheduled
          notation: rescheduled
          label: Rescheduled
          definition: settlement date was changed to a future date
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/reversed
          notation: reversed
          label: Reversed
          definition: a previously settled event was reversed
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatus/value/buyIn
          notation: buyIn
          label: Buy-in
          definition: a buy-in was executed to force settlement of a failing position
    StatementEntryDirection:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/StatementEntryDirection
      namespace: fin-post-trade
      localName: StatementEntryDirection
      label: Statement Entry Direction
      definition: The statement entry direction is a closed classification of an external statement entry as a debit from or a credit to the focal account, used for characterizing the cash-flow direction of a statement line.
      cnNote: 对账单入账方向，是按从核心账户借记或贷记核心账户封闭的外部对账单明细分类，用于刻画明细的资金流向。
      vocabulary: Statement Entry Direction
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/StatementEntryDirection/value/debit
          notation: debit
          label: Debit
          definition: asset leaves or is charged to the focal account
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/StatementEntryDirection/value/credit
          notation: credit
          label: Credit
          definition: asset enters or is credited to the focal account
    InternalProjectionMode:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/InternalProjectionMode
      namespace: fin-post-trade
      localName: InternalProjectionMode
      label: Internal Projection Mode
      definition: The internal projection mode is a closed set of reconciliation internal-source modes, used for characterizing whether the internal side aggregates comparison values by settlement account or by economic-account allocation.
      cnNote: 内部投影模式，是封闭的对账内部来源模式，用于刻画内部侧按结算账户还是经济账户分配口径聚合比较值。
      vocabulary: Internal Projection Mode
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/InternalProjectionMode/value/settlementAccount
          notation: settlementAccount
          label: Settlement account
          definition: compare complete leg values directly at settlement accounts
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/InternalProjectionMode/value/economicAccountAllocation
          notation: economicAccountAllocation
          label: Economic account allocation
          definition: compare exact focal-account allocation aggregates
    SettlementAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementAssetKind
      namespace: fin-post-trade
      localName: SettlementAssetKind
      label: Settlement Asset Kind
      definition: The settlement asset kind is a closed classification of a reconciliation comparison key as cash Money or security Quantity, used for characterizing whether a comparison key corresponds to cash or to a security.
      cnNote: 结算资产种类，是按现金 Money 或证券数量封闭的对账比较键分类，用于刻画比较键对应的是现金还是证券。
      vocabulary: Settlement Asset Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementAssetKind/value/cash
          notation: cash
          label: Cash
          definition: Money in one currency and scale contract
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementAssetKind/value/security
          notation: security
          label: Security
          definition: Quantity in one instrument and controlled unit
    ReconciliationScope:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationScope
      namespace: fin-post-trade
      localName: ReconciliationScope
      label: Reconciliation Scope
      definition: The reconciliation scope is a closed classification of the dimensions that jointly delimit the population compared by a ReconciliationCase, used for characterizing the account, date, and system boundary a reconciliation case covers.
      cnNote: 对账作用域，是共同界定对账案例比较总体的维度的封闭分类，用于刻画对账案例覆盖的账户、日期与系统边界。
      vocabulary: Reconciliation Scope
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationScope/value/accountDateSystem
          notation: accountDateSystem
          label: Account/date/system
          definition: one focal account, reconciliation date and settlement system/location scope
    ReconciliationFindingKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingKind
      namespace: fin-post-trade
      localName: ReconciliationFindingKind
      label: Reconciliation Finding Kind
      definition: >-
        The reconciliation finding kind is a closed and exhaustive classification derived from internal and external item
        counts and value equality for one comparison key, used for characterizing whether a reconciliation finding is a
        match, mismatch, duplicate, or missing-side result.
      cnNote: 对账发现种类，是由某一比较键的内部与外部项目计数及数值相等性导出的封闭穷尽分类，用于刻画对账发现是匹配、不符、重复还是缺失侧。
      vocabulary: Reconciliation Finding Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingKind/value/matched
          notation: matched
          label: Matched
          definition: one internal and one external value are equal
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingKind/value/valueMismatch
          notation: valueMismatch
          label: Value mismatch
          definition: one internal and one external value differ
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingKind/value/duplicate
          notation: duplicate
          label: Duplicate
          definition: at least one side has more than one exact item
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingKind/value/missingSide
          notation: missingSide
          label: Missing side
          definition: exactly one item exists on one side and zero on the other
    ReconciliationSide:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationSide
      namespace: fin-post-trade
      localName: ReconciliationSide
      label: Reconciliation Side
      definition: The reconciliation side is a closed classification of the internal projection and external statement sides used by an absence proof, used for characterizing whether an absence occurs on the internal or the external side.
      cnNote: 对账侧，是缺失证明所用的内部投影与外部对账单两侧的封闭分类，用于刻画缺失发生在内部还是外部侧。
      vocabulary: Reconciliation Side
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationSide/value/internal
          notation: internal
          label: Internal
          definition: internal Projection side
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationSide/value/external
          notation: external
          label: External
          definition: external StatementLine side
    DuplicateSide:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateSide
      namespace: fin-post-trade
      localName: DuplicateSide
      label: Duplicate Side
      definition: The duplicate side is a closed classification identifying whether duplicate items occur on the internal side, the external side, or both, used for characterizing which side or sides a duplicate occurs on.
      cnNote: 重复侧，是标识重复项出现在内部、外部还是两侧的封闭分类，用于刻画重复发生在哪一侧或两侧。
      vocabulary: Duplicate Side
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateSide/value/internal
          notation: internal
          label: Internal
          definition: only the internal side has count greater than one
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateSide/value/external
          notation: external
          label: External
          definition: only the external side has count greater than one
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateSide/value/both
          notation: both
          label: Both
          definition: both sides have count greater than one
    DuplicateValueRelation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation
      namespace: fin-post-trade
      localName: DuplicateValueRelation
      label: Duplicate Value Relation
      definition: The duplicate value relation is a closed same-side duplicate value relation, used for characterizing whether same-side duplicate values are identical or conflicting.
      cnNote: 重复值关系，是封闭的同侧重复值关系，用于刻画同侧重复值是相同还是冲突。
      vocabulary: Duplicate Value Relation
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation/value/identical
          notation: identical
          label: Identical
          definition: all same-side canonical values are equal
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DuplicateValueRelation/value/conflicting
          notation: conflicting
          label: Conflicting
          definition: same-side canonical values differ
    CrossSideValueRelation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation
      namespace: fin-post-trade
      localName: CrossSideValueRelation
      label: Cross-side Value Relation
      definition: >-
        The cross-side value relation is a closed classification of whether all canonical internal and external values
        agree for a duplicated comparison key, used for characterizing whether the two sides are all-equal or
        mismatched.
      cnNote: 跨侧值关系，是刻画某一重复比较键下全部规范内部与外部数值是否一致的封闭分类，用于刻画两侧数值是全等还是不符。
      vocabulary: Cross-side Value Relation
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation/value/allEqual
          notation: allEqual
          label: All equal
          definition: every internal and external canonical value is equal
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CrossSideValueRelation/value/mismatch
          notation: mismatch
          label: Mismatch
          definition: at least one internal/external canonical value differs
    MismatchDimension:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension
      namespace: fin-post-trade
      localName: MismatchDimension
      label: Mismatch Dimension
      definition: >-
        The mismatch dimension is a closed classification of the amount, quantity, currency, unit, scale, or precision
        dimension responsible for a value mismatch, used for characterizing which dimension a value difference arises
        in.
      cnNote: 不符维度，是导致数值差异的金额、数量、币种、单位、精度或精度契约维度的封闭分类，用于刻画数值差异具体体现在哪个维度。
      vocabulary: Mismatch Dimension
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/amount
          notation: amount
          label: Amount
          definition: Money amount differs
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/quantity
          notation: quantity
          label: Quantity
          definition: Quantity numeric value differs
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/currency
          notation: currency
          label: Currency
          definition: contradictory currency metadata under an otherwise identical key
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/unit
          notation: unit
          label: Unit
          definition: contradictory unit metadata under an otherwise identical key
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/scale
          notation: scale
          label: Scale
          definition: Money scale contract differs
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/precision
          notation: precision
          label: Precision
          definition: Quantity precision contract differs
    ReconciliationStatus:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatus
      namespace: fin-post-trade
      localName: ReconciliationStatus
      label: Reconciliation Status
      definition: >-
        The reconciliation status is a closed classification of a ReconciliationCase lifecycle state from opening through
        resolution or no-action closure, used for characterizing the workflow state of a reconciliation case.
      cnNote: 对账状态，是从开启到解决或无操作关闭的对账案例生命周期阶段的封闭分类，用于刻画对账案例的工作流状态。
      vocabulary: Reconciliation Status
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatus/value/open
          notation: open
          label: Open
          definition: case was opened
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatus/value/investigating
          notation: investigating
          label: Investigating
          definition: case is under investigation
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatus/value/resolved
          notation: resolved
          label: Resolved
          definition: case was resolved with evidence
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationStatus/value/closedNoAction
          notation: closedNoAction
          label: Closed no action
          definition: case was closed without an adjustment
    SettlementFinalityKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityKind
      namespace: fin-post-trade
      localName: SettlementFinalityKind
      label: Settlement Finality Kind
      definition: >-
        The settlement finality kind is a closed classification of settlement finality as provisional, unconditional, or
        irrevocable, used for characterizing the legal or system finality status distinct from a source-reported settled
        status. Informed by the BIS/CPMI-IOSCO PFMI finality principle.
      cnNote: 结算最终性种类，是按暂时性、无条件或不可撤销封闭的结算最终性分类，用于刻画区别于来源报告 settled 状态的法律或系统最终性状态。参考 BIS/CPMI-IOSCO PFMI 最终性原则。
      vocabulary: Settlement Finality Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityKind/value/provisional
          notation: provisional
          label: Provisional
          definition: transfer is provisional and may be reversed
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityKind/value/unconditional
          notation: unconditional
          label: Unconditional
          definition: transfer is unconditional but not yet irrevocable
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementFinalityKind/value/irrevocable
          notation: irrevocable
          label: Irrevocable
          definition: transfer is irrevocable and unconditional, satisfying PFMI final settlement
    MatchCardinality:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/MatchCardinality
      namespace: fin-post-trade
      localName: MatchCardinality
      label: Match Cardinality
      definition: >-
        The match cardinality is a closed classification of a reconciliation match group as one-to-one, one-to-many,
        many-to-one, or many-to-many, used for characterizing the matching shape under a non-strict reconciliation
        profile. The Strict Technical Settlement Reconciliation Profile restricts matches to one-to-one.
      cnNote: 匹配基数，是按一对一、一对多、多对一或多对多封闭的对账匹配组分类，用于刻画非严格对账画像下的匹配形状。严格技术结算对账画像将匹配限制为一对一。
      vocabulary: Match Cardinality
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MatchCardinality/value/oneToOne
          notation: oneToOne
          label: One to one
          definition: exactly one internal and one external member match
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MatchCardinality/value/oneToMany
          notation: oneToMany
          label: One to many
          definition: one internal member matches multiple external members
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MatchCardinality/value/manyToOne
          notation: manyToOne
          label: Many to one
          definition: multiple internal members match one external member
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MatchCardinality/value/manyToMany
          notation: manyToMany
          label: Many to many
          definition: multiple internal members match multiple external members
    AbsenceProofKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/AbsenceProofKind
      namespace: fin-post-trade
      localName: AbsenceProofKind
      label: Absence Proof Kind
      definition: >-
        The absence-proof kind is a closed classification of a missing-side assertion as deterministic side absence,
        unknown coverage, or incomplete source coverage, used for distinguishing a proven business absence from a
        no-result query whose coverage is unknown.
      cnNote: 缺失证明种类，是按确定性侧缺失、覆盖未知或不完整来源覆盖封闭的缺失侧断言分类，用于区分经证明的业务缺失与覆盖未知的无结果查询。
      vocabulary: Absence Proof Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/AbsenceProofKind/value/deterministicSideAbsence
          notation: deterministicSideAbsence
          label: Deterministic side absence
          definition: a completed universe probe proves the side is absent; required by the strict profile
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/AbsenceProofKind/value/unknownCoverage
          notation: unknownCoverage
          label: Unknown coverage
          definition: the query returned no rows but source coverage is unknown
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/AbsenceProofKind/value/incompleteSourceCoverage
          notation: incompleteSourceCoverage
          label: Incomplete source coverage
          definition: the query returned no rows and source coverage is provably incomplete
    CorporateActionOptionKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind
      namespace: fin-post-trade
      localName: CorporateActionOptionKind
      label: Corporate Action Option Kind
      definition: >-
        The corporate action option kind is a closed classification of a corporate action option as the default option, a
        voluntary election option, a withdrawal, an amendment, or a partial allocation, used for characterizing the
        lifecycle of a corporate action option. Informed by ISO 15022 MT564/565/566/567 message lifecycle.
      cnNote: 公司行为选项种类，是按默认选项、自愿选举选项、撤回、修订或部分分配封闭的公司行为选项分类，用于刻画公司行为选项的生命周期。参考 ISO 15022 MT564/565/566/567 报文生命周期。
      vocabulary: Corporate Action Option Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind/value/defaultOption
          notation: defaultOption
          label: Default option
          definition: option applied when no election is submitted by the deadline
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind/value/voluntaryElection
          notation: voluntaryElection
          label: Voluntary election
          definition: option chosen by an election instruction
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind/value/withdrawal
          notation: withdrawal
          label: Withdrawal
          definition: a previously submitted election is withdrawn
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind/value/amendment
          notation: amendment
          label: Amendment
          definition: a previously submitted election is amended
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionOptionKind/value/partialAllocation
          notation: partialAllocation
          label: Partial allocation
          definition: only part of the elected quantity is allocated to this option
    SettlementLegAllocationAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationAssetKind
      namespace: fin-post-trade
      localName: SettlementLegAllocationAssetKind
      label: Settlement Leg Allocation Asset Kind
      definition: >-
        The settlement leg allocation asset kind is a closed classification of a settlement leg allocation as cash,
        security, fee, or tax, used for characterizing the asset dimension a leg allocation applies to, generalizing
        beyond the security-only execution allocation of the first profile.
      cnNote: 结算腿分配资产种类，是按现金、证券、费用或税封闭的结算腿分配分类，用于刻画腿分配所适用的资产维度，泛化超越首画像的仅证券执行分配。
      vocabulary: Settlement Leg Allocation Asset Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationAssetKind/value/cash
          notation: cash
          label: Cash
          definition: allocation of a cash leg
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationAssetKind/value/security
          notation: security
          label: Security
          definition: allocation of a security leg
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationAssetKind/value/fee
          notation: fee
          label: Fee
          definition: allocation of a fee leg
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegAllocationAssetKind/value/tax
          notation: tax
          label: Tax
          definition: allocation of a tax leg
    ReconciliationDispositionKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind
      namespace: fin-post-trade
      localName: ReconciliationDispositionKind
      label: Reconciliation Disposition Kind
      definition: >-
        The reconciliation disposition kind is a closed classification of a finding-level disposition as accepted,
        investigated, corrected, waived, escalated, reopened, or externally pending, used for characterizing the
        resolution workflow of an individual finding distinct from the case-level status.
      cnNote: 对账处置种类，是按接受、调查、更正、豁免、升级、重开或外部待处理封闭的发现级处置分类，用于刻画单个发现的解决工作流，区别于案例级状态。
      vocabulary: Reconciliation Disposition Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/accepted
          notation: accepted
          label: Accepted
          definition: finding is accepted as a true break without remediation
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/investigated
          notation: investigated
          label: Investigated
          definition: finding is under investigation
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/corrected
          notation: corrected
          label: Corrected
          definition: finding was corrected by an adjusting entry
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/waived
          notation: waived
          label: Waived
          definition: finding is waived with a documented waiver
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/escalated
          notation: escalated
          label: Escalated
          definition: finding is escalated for external resolution
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/reopened
          notation: reopened
          label: Reopened
          definition: a previously resolved finding is reopened
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationDispositionKind/value/externalPending
          notation: externalPending
          label: External pending
          definition: finding awaits an external party action
    SettlementCalendarKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementCalendarKind
      namespace: fin-post-trade
      localName: SettlementCalendarKind
      label: Settlement Calendar Kind
      definition: >-
        The settlement calendar kind is a closed classification of a settlement calendar role as a trading calendar, a
        settlement-system calendar, or a payment-system calendar, used for distinguishing calendar types beyond the
        single TradingCalendar.
      cnNote: 结算日历种类，是按交易日历、结算系统日历或支付系统日历封闭的结算日历角色分类，用于区分单一 TradingCalendar 之外的日历类型。
      vocabulary: Settlement Calendar Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementCalendarKind/value/trading
          notation: trading
          label: Trading
          definition: calendar governing trading days
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementCalendarKind/value/settlementSystem
          notation: settlementSystem
          label: Settlement system
          definition: calendar governing the settlement system's operating days
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementCalendarKind/value/paymentSystem
          notation: paymentSystem
          label: Payment system
          definition: calendar governing the payment system's operating days
    ExternalSettlementStatementType:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementType
      namespace: fin-post-trade
      localName: ExternalSettlementStatementType
      label: External Settlement Statement Type
      definition: >-
        The external settlement statement type is a closed classification of an external settlement statement as a
        holdings statement, a transactions statement, or a pending-settlement statement, used for characterizing the
        statement coverage beyond a single-day single-account flow.
      cnNote: 外部结算对账单类型，是按持仓对账单、交易对账单或待结算对账单封闭的外部结算对账单分类，用于刻画单日单账户流水之外的对账单覆盖。
      vocabulary: External Settlement Statement Type
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementType/value/holdings
          notation: holdings
          label: Holdings
          definition: statement of holdings at a point in time
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementType/value/transactions
          notation: transactions
          label: Transactions
          definition: statement of settled transactions over a period
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatementType/value/pendingSettlement
          notation: pendingSettlement
          label: Pending settlement
          definition: statement of pending settlement instructions
