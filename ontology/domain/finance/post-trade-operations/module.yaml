          definition: Money amount differs
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/quantity
          notation: quantity
          label: Quantity
          definition: Quantity numeric value differs
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/MismatchDimension/value/currency
          notation: currency
