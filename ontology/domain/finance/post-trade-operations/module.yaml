        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/remainingMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/remainingQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElection:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
      namespace: fin-post-trade
      localName: CorporateActionElection
      label: Corporate Action Election
      definition: >-
        The corporate action election is an immutable provider election record that, for one rights entitlement,
        preserves received time, decision, electing Party, authorization branch, and optional exercise Quantity, used
        for faithfully retaining each provider's election claim before resolution.
      cnNote: 公司行为选举，是针对某一权利权益、保留接收时点、决定、选举方与授权分支及可选行权数量的不可变提供方选举记录，用于在裁决前如实留存各提供方收到的选举主张。
      participantRoles:
        - id: electionProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: election provider
          definition: exact provider Party version that issued the election record
        - id: electionEntitlement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
          minCount: 1
          maxCount: 1
          label: election entitlement
          definition: exact rights entitlement version being elected
        - id: electionEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: election event
          definition: exact rights Event version equal to the entitlement Event
        - id: electingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: electing party
          definition: exact Party version submitting the exercise or decline
        - id: authorizationAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 0
          maxCount: 1
          label: authorization account-party role
          definition: optional exact authorized-operator or custodian role branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceRecordRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/fieldMappingDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/receivedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electionDecision
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electedQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/selfElection
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionResolution:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionResolution
      namespace: fin-post-trade
      localName: CorporateActionElectionResolution
      label: Corporate Action Election Resolution
      definition: >-
        The corporate action election resolution is the sole provider-policy resolution that, for one entitlement, closes
        every timely eligible candidate and selects exercise, decline, or probe-proven default lapse without summing
        provider records, used for producing a deterministic election outcome.
      cnNote: 公司行为选举裁决，是针对某一权益封闭全部及时合格候选并选定行权、拒绝或经探针证明的默认失效的唯一提供方政策裁决，用于在不累加提供方记录的前提下得出确定选举结果。
      participantRoles:
        - id: resolutionEntitlement
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
          minCount: 1
          maxCount: 1
          label: resolution entitlement
          definition: exact rights entitlement whose election is resolved
        - id: providerPolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: provider policy
          definition: exact provider policy version controlling eligibility and precedence
        - id: candidateElection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
          minCount: 0
          maxCount: null
          label: candidate election
          definition: complete sorted exact-version set of timely eligible election candidates
        - id: selectedElection
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
          minCount: 0
          maxCount: 1
          label: selected election
          definition: optional exact selected Election required by selected exercise or decline
      attributeUses:
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/candidateElectionCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/candidateElectionSetDigest
