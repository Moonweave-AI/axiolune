        The corporate action schedule evaluation input is an immutable join between one event version and one exact
        generic rule-evaluation request version, used for proving that the two agree on kind, instrument, scope, and all
        three time pivots so that schedule resolution can proceed.
      cnNote: 公司行为排程评估输入，是一个事件版本与一个规则评估请求版本的不可变连接，用于证明两者在种类、工具、作用域与三个时间枢轴上完全一致以便排程裁决。
      participantRoles:
        - id: evaluationEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: evaluation event
          definition: exact corporate-action Event version being evaluated
        - id: evaluationRequest
          range: https://axiolune.ai/ontology/finance/market-rules/RuleEvaluationRequest
          minCount: 1
          maxCount: 1
