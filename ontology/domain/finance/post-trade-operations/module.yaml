    MissingSideAssertion:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/MissingSideAssertion
      namespace: fin-post-trade
      localName: MissingSideAssertion
      label: Missing Side Assertion
      definition: >-
        The missing side assertion is a probe-backed proof that, for one canonical comparison-key bucket, a specified
        side is absent from the case-selected complete internal projection set or the exact external statement-line set,
        while the opposite side is proven present by the finding's observable members. It is distinct from an
        IncompleteSourceCoverageAssertion, which states that a query returned no rows but coverage is unknown so absence
        cannot be concluded. Under the Strict Technical Settlement Reconciliation Profile the absence proof must be a
        deterministic side absence with a completed universe probe; the generic core admits weaker absence-proof kinds.
      cnNote: 缺失侧断言，是经探针证明某一规范比较键桶的指定侧在内部投影集或外部对账单明细集中不存在，而另一侧由发现的可观察条目证明存在的证明，用于支撑对账中一边为空的发现。它与不完整来源覆盖断言不同，后者表示查询无结果但覆盖未知故不能得出缺失结论。在严格技术结算对账画像下，缺失证明须为带完成宇宙探针的确定性侧缺失；通用核心接纳较弱的缺失证明种类。
      participantRoles:
        - id: missingCase
          range: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationCase
          minCount: 1
          maxCount: 1
          label: missing-side case
          definition: exact ReconciliationCase version whose side is searched
        - id: missingComparator
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationComparator
          minCount: 1
          maxCount: 1
          label: missing-side comparator
          definition: exact comparator version defining the canonical key
        - id: comparisonInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 0
          maxCount: 1
          label: comparison instrument
          definition: logical FinancialInstrument identity required exactly for a missing security-side key
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/expectedSide
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/absenceProofKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedSettlementReference
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementSystem
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementLocation
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entryDirection
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/settlementAssetKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonCurrencyAlphaCode
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonCurrencyScale
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonQuantityUnit
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/comparisonKeyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfValid
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfKnowledge
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/reconciliationAsOfAvailable
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 1
          maxCount: 1
