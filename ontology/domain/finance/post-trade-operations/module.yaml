          definition: exact evaluated Event/request pair
        - id: resolutionEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: resolution event
          definition: exact Event version equal to the evaluation input Event
        - id: resolutionRequest
          range: https://axiolune.ai/ontology/finance/market-rules/RuleEvaluationRequest
          minCount: 1
          maxCount: 1
          label: resolution request
          definition: exact rule-evaluation request version
        - id: winningApplicability
          range: https://axiolune.ai/ontology/finance/market-rules/RuleApplicability
