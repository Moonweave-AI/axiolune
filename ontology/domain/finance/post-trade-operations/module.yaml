      vocabulary: Subscription Fulfillment Asset Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind/value/cashPayment
          notation: cashPayment
          label: Cash payment
          definition: subscription cash moves from subscriber to agent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind/value/securityDelivery
          notation: securityDelivery
          label: Security delivery
          definition: successor Security moves from agent to subscriber
    ProcessingFindingStage:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage
      namespace: fin-post-trade
      localName: ProcessingFindingStage
      label: Processing Finding Stage
      definition: Closed corporate-action processing stages.
      vocabulary: Processing Finding Stage
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage/value/schedule
          notation: schedule
          label: Schedule
          definition: rule selection or size assessment stage
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage/value/entitlement
          notation: entitlement
          label: Entitlement
          definition: position, election, subscription, or adjustment stage
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ProcessingFindingStage/value/dueBill
          notation: dueBill
          label: Due bill
          definition: trade qualification, obligation, or transfer stage
    CorporateActionProcessingFindingKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind
      namespace: fin-post-trade
      localName: CorporateActionProcessingFindingKind
      label: Corporate Action Processing Finding Kind
      definition: >-
        Closed classification of failures detected while resolving schedules, entitlements, elections, subscriptions,
        adjustments, or due-bill processing.
      vocabulary: Corporate Action Processing Finding Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/noApplicableRule
          notation: noApplicableRule
          label: No applicable rule
          definition: no schedule-rule candidate survives
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/ruleConflict
          notation: ruleConflict
          label: Rule conflict
          definition: candidate precedence has no unique winner
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/sizeAssessmentFailure
          notation: sizeAssessmentFailure
          label: Size assessment failure
          definition: candidate-specific distribution assessment failed
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/missingElection
          notation: missingElection
          label: Missing election
          definition: required rights election is absent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/lateElection
          notation: lateElection
          label: Late election
          definition: election arrived after the resolved deadline
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/overElection
          notation: overElection
          label: Over election
          definition: elected Quantity exceeds entitlement maximum
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/unauthorizedElection
          notation: unauthorizedElection
          label: Unauthorized election
          definition: electing Party lacks self or account-role authority
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/electionConflict
          notation: electionConflict
          label: Election conflict
          definition: incompatible undominated provider candidates remain
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/invalidDefaultLapse
          notation: invalidDefaultLapse
          label: Invalid default lapse
          definition: default lapse lacks a completed empty-candidate proof
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/electionResolutionFailure
          notation: electionResolutionFailure
          label: Election resolution failure
          definition: provider policy cannot produce a valid closed result
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/subscriptionFulfillmentMismatch
          notation: subscriptionFulfillmentMismatch
          label: Subscription fulfillment mismatch
          definition: cash/security subscription closure is incomplete or inconsistent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/calculationMismatch
          notation: calculationMismatch
          label: Calculation mismatch
          definition: entitlement or benefit arithmetic differs from the locked formula
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/adjustmentMismatch
          notation: adjustmentMismatch
          label: Adjustment mismatch
          definition: post-evidence adjustment fields or dates differ from closure evidence
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/missingDueBillEvidence
          notation: missingDueBillEvidence
          label: Missing due-bill evidence
          definition: required qualification or obligation evidence is absent
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/conflictingDueBillEvidence
          notation: conflictingDueBillEvidence
          label: Conflicting due-bill evidence
          definition: incomparable or contradictory due-bill evidence exists
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/ineligibleTradeQualification
          notation: ineligibleTradeQualification
          label: Ineligible trade qualification
          definition: an ineligible trade was used to form an obligation
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/endpointMismatch
          notation: endpointMismatch
          label: Endpoint mismatch
          definition: economic, settlement, account, or Party endpoints do not close
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/obligationBenefitMismatch
          notation: obligationBenefitMismatch
          label: Obligation benefit mismatch
          definition: benefit asset or arithmetic differs from Event and resolution
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/dueBillTransferMismatch
          notation: dueBillTransferMismatch
          label: Due-bill transfer mismatch
          definition: transfer asset, endpoints, or result differs from the obligation
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/duplicateTransfer
          notation: duplicateTransfer
          label: Duplicate transfer
          definition: movement evidence or current version is counted more than once
        - iri: >-
            https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingKind/value/overTransfer
          notation: overTransfer
          label: Over transfer
          definition: completed transfer value exceeds obligation value
    SettlementMethod:
