        characterizing what an account is owed under a corporate action.
      cnNote: 公司行为权益，是由单一快照或经证明的零头寸推导、并在到期票据模式下附带完整双向义务集合的受益账户权益，用于刻画某账户在公司行为中应得利益。
      participantRoles:
        - id: entitlementEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: entitlement event
          definition: exact Event version producing the entitlement
        - id: entitlementScheduleResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
          minCount: 1
          maxCount: 1
          label: entitlement schedule resolution
          definition: exact schedule resolution supplying mode and pivot
        - id: beneficiaryAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: beneficiary account
          definition: logical financial account whose entitlement is computed
        - id: beneficiaryParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: beneficiary party
