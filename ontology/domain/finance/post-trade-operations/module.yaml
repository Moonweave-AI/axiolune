      iri: https://axiolune.ai/ontology/finance/post-trade-operations/MissingSideAssertionContract
      namespace: fin-post-trade
      localName: MissingSideAssertionContract
      label: Missing Side Assertion Contract
      definition: Enforces complete side-specific absence proof.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          Case/comparator/key/pivots equal; cash key has exactly currency alpha code and non-negative scale while
          security key has exactly logical FinancialInstrument and absolute Quantity-unit IRI; the completed probe
          parses and binds exact JCS query/function, PIT-request and input-Run bytes, proves the Run's complete internal
          Projection and external StatementLine universes, then independently filters the requested side by the three
          Case pivots and exact comparison key; comparisonKeyDigest, universe, result-set and probe digests recompute;
          ordinary absence or a self-reported coherent digest is insufficient
      severity: Error
      message: missing-side assertion is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/MissingSideAssertion
    ReconciliationFindingContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingContract
