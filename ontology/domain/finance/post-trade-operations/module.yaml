  codeLists:
    DueBillQualificationResult:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult
      namespace: fin-post-trade
      localName: DueBillQualificationResult
      label: Due Bill Qualification Result
      definition: Closed due-bill trade qualification outcome.
      vocabulary: Due Bill Qualification Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult/value/eligible
          notation: eligible
          label: Eligible
          definition: all execution, allocation, interval, endpoint and settlement clauses pass
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillQualificationResult/value/ineligible
          notation: ineligible
          label: Ineligible
          definition: one or more locked qualification clauses fail
    DueBillTransferState:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState
      namespace: fin-post-trade
      localName: DueBillTransferState
      label: Due Bill Transfer State
      definition: Closed transfer attempt and completion states.
      vocabulary: Due Bill Transfer State
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/pending
          notation: pending
          label: Pending
          definition: attempt exists but contributes zero fulfilled value
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/completed
          notation: completed
          label: Completed
          definition: completed movement evidence may contribute fulfilled value
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/failed
          notation: failed
          label: Failed
          definition: attempt failed and contributes zero
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferState/value/cancelled
          notation: cancelled
          label: Cancelled
          definition: attempt was cancelled and contributes zero
    FulfillmentResult:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult
      namespace: fin-post-trade
      localName: FulfillmentResult
      label: Fulfillment Result
      definition: >-
        Closed classification of obligation fulfillment derived from the fulfilled value relative to the obligation
        value.
      vocabulary: Fulfillment Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult/value/unfulfilled
          notation: unfulfilled
          label: Unfulfilled
          definition: completed contributing subset is empty and fulfilled value is zero
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult/value/partiallyFulfilled
          notation: partiallyFulfilled
          label: Partially fulfilled
          definition: fulfilled value is strictly between zero and obligation value
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/FulfillmentResult/value/fullyFulfilled
          notation: fullyFulfilled
          label: Fully fulfilled
          definition: fulfilled value equals obligation value exactly
    ElectionDecision:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision
      namespace: fin-post-trade
      localName: ElectionDecision
      label: Election Decision
      definition: Closed classification of a provider election as exercise or explicit decline.
      vocabulary: Election Decision
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision/value/exercise
          notation: exercise
          label: Exercise
          definition: electing Party exercises a positive bounded Quantity
        - iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionDecision/value/decline
          notation: decline
          label: Decline
          definition: electing Party explicitly declines and supplies no elected Quantity
    SubscriptionFulfillmentAssetKind:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentAssetKind
      namespace: fin-post-trade
      localName: SubscriptionFulfillmentAssetKind
      label: Subscription Fulfillment Asset Kind
