          minCount: 0
          maxCount: 1
          label: record position snapshot
          definition: optional exact PositionSnapshot branch at the entitlement pivot
        - id: recordPositionAbsence
          range: https://axiolune.ai/ontology/finance/post-trade-operations/RecordPositionAbsenceAssertion
          minCount: 0
          maxCount: 1
          label: record position absence
          definition: optional exact proven-zero branch legal only in due-bill mode
        - id: dueBillObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillObligation
