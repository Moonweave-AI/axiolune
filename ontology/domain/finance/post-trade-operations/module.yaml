module:
  moduleIri: https://axiolune.ai/ontology/finance/post-trade-operations
  baseIri: https://axiolune.ai/ontology/finance/post-trade-operations/
  preferredPrefix: fin-post-trade
  version: 1.1.0
  label: Post-Trade Operations
  definition: >-
    The post-trade operations module provides a semantic core for settlement, settlement reconciliation, and selected
    corporate-action servicing. Simple DvP/FoP settlement, direct non-transferable rights subscription, due-bill
    entitlement transfer, strict zero-tolerance reconciliation, and run-level digest/probe/closure reproducibility
    evidence are optional profiles rather than universal post-trade semantics. Confirmation, affirmation, clearing,
    CCP novation, and netting are out of scope here and are exposed only as traceability hooks on settlement
    instructions. The module characterizes cash and security flows around and after trade completion, including the
    entitlement economics that span the ex-date / settlement-window boundary, rather than only post-completion flows.
  cnNote: 交易后操作模块为结算、结算对账与受限公司行为处理提供语义核心。简单 DvP/FoP、不可转让直接认购权、到期票据权益划转、严格零容差对账及运行级摘要/探针/闭包可复现证据均为可选画像，而非通用交易后语义。确认、适格、清算、CCP 更替与净额结算不在本模块范围，仅作为结算指令上的可追溯钩子暴露。模块刻画围绕及交易完成前后的资金与证券流转，包括跨越除息日/结算窗口边界的权益经济，而非仅完成后的流转。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-rules
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/orders-execution
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    SettlementReconciliationComparator:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationComparator
      namespace: fin-post-trade
      localName: SettlementReconciliationComparator
      label: Settlement Reconciliation Comparator
      definition: >-
        The settlement reconciliation comparator is a versioned comparator that locks settlement-reference normalization
        and canonical Money and Quantity rules, used for establishing the deterministic comparison baseline in
        settlement reconciliation. Under the Strict Technical Settlement Reconciliation Profile it additionally locks
        implementation, runtime, input-output contracts, and a zero numeric tolerance; those reproducibility fields
        (implementationDigest, runtimeDigest, inputContractDigest, outputContractDigest,
        referenceNormalizationDigest, canonicalizationDigest, numericTolerance) belong to the execution-and-
        reproducibility profile and are optional evidence in the generic core, so a real but not-yet-reproducibility-
        proven external report can still be expressed.
      cnNote: 结算对账比较器，是锁定结算参照归一化与规范 Money/Quantity 规则的版本化比较器，用于在结算对账中确立确定性比较基准。在严格技术结算对账画像下，它额外锁定实现、运行时、输入输出契约与零数值容差；这些可复现字段（implementationDigest、runtimeDigest、inputContractDigest、outputContractDigest、referenceNormalizationDigest、canonicalizationDigest、numericTolerance）属于执行与可复现画像，在通用核心中为可选证据，使得真实但尚未具备完整可复现证明的外部报告仍可被表达。
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/referenceNormalizationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/canonicalizationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/numericTolerance
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionProviderPolicy:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderPolicy
      label: Corporate Action Election Provider Policy
      definition: >-
        The corporate action election provider policy is a versioned authority policy that, for a single event-authority
        scope, closes eligible election providers, normalization, equivalence, deadline semantics, and an acyclic
        precedence graph, used for governing election eligibility and conflict arbitration.
      cnNote: 公司行为选举提供方政策，是为单个事件权威作用域封闭合格选举提供方、归一化、等价性、截止语义与无环优先级图的版本化权威政策，用于管控选举资格与冲突仲裁。
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/eventScopeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleProviderSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleProviderCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerMemberVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerNormalizationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerNormalizationCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/precedenceGraphDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/precedenceEdgeCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electionEquivalenceField
          minCount: 1
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/equivalenceFieldsDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadlineCutoff
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/deadlineInclusive
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/deadlineCutoffContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SimpleDvpFopSettlementProfile:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SimpleDvpFopSettlementProfile
      namespace: fin-post-trade
      localName: SimpleDvpFopSettlementProfile
      label: Simple DvP/FoP Settlement Profile
      definition: >-
        The simple DvP/FoP settlement profile is an optional implementation profile that locks a settlement instruction
        to exactly one security leg for free-of-payment or one reciprocal security and cash leg for
        delivery-versus-payment, with distinct deliverer and receiver Parties and consistent date/system/location and
        calendar across legs. It is the first concrete profile of the generic settlement core and is not a universal
        post-trade invariant; multi-leg, multi-currency, fee/tax-leg, PvP, DvD, and netted structures are admitted by the
        generic core under additional profiles.
      cnNote: 简单 DvP/FoP 结算画像，是可选实现画像，将结算指令锁定为恰好一条证券腿（纯交收）或一条互易证券加现金腿（银货对付），两端方不同且各腿日期/系统/地点/日历一致。它是通用结算核心的首个具体画像，并非通用交易后不变量；多腿、多币种、费用/税腿、PvP、DvD 与净额结构由通用核心在附加画像下接纳。
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/profileScopeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StrictTechnicalSettlementReconciliationProfile:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/StrictTechnicalSettlementReconciliationProfile
      namespace: fin-post-trade
      localName: StrictTechnicalSettlementReconciliationProfile
      label: Strict Technical Settlement Reconciliation Profile
      definition: >-
        The strict technical settlement reconciliation profile is an optional implementation profile that locks the
        reconciliation comparator to zero numeric tolerance, exact canonical Money and Quantity normalization, exact
        reference normalization, and forbids fuzzy reference matching and non-zero business tolerance. Reconciliation
        findings under this profile bucket by exact canonical key and treat any side count greater than one as a
        duplicate. It is the first concrete profile of the generic reconciliation comparator and is not a universal
        reconciliation invariant; one-to-many, many-to-one, and many-to-many match groups, timing differences, and
        expected breaks are admitted by the generic core under additional profiles.
      cnNote: 严格技术结算对账画像，是可选实现画像，将对账比较器锁定为零数值容差、确切规范 Money 与 Quantity 归一化、确切参照归一化，并禁止模糊参照匹配与非零业务容差。该画像下的对账发现按确切规范键分桶，并将任一侧计数大于一视为重复。它是通用对账比较器的首个具体画像，并非通用对账不变量；一对多、多对一、多对多匹配组、时间差与预期差异由通用核心在附加画像下接纳。
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/profileScopeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    DirectRightsDueBillCorporateActionProfile:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DirectRightsDueBillCorporateActionProfile
      namespace: fin-post-trade
      localName: DirectRightsDueBillCorporateActionProfile
      label: Direct Rights Due-Bill Corporate Action Profile
      definition: >-
        The direct rights due-bill corporate action profile is an optional implementation profile that locks a corporate
        action event to the cash dividend, stock split, or non-transferable direct-rights issue kinds, with exactly one
        consideration per event and the due-bill entitlement transfer chain. It is the first concrete profile of the
        generic corporate action core and is not a universal corporate-action invariant; merger, redemption,
        conversion, tender, spin-off, exchange, transferable rights, interest, tax withholding, cash-in-lieu, and
        reversal/correction are admitted by the generic core under additional profiles and options.
      cnNote: 直接认购权到期票据公司行为画像，是可选实现画像，将公司行为事件锁定为现金股息、拆股或不可转让直接配股权利发行，每个事件恰好一种对价，并采用到期票据权益划转链。它是通用公司行为核心的首个具体画像，并非通用公司行为不变量；合并、赎回、转换、要约、分拆、交换、可转让权利、利息、税款扣缴、现金替代与撤销/更正由通用核心在附加画像与选项下接纳。
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/profileScopeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalSettlementStatement:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatement
      namespace: fin-post-trade
      localName: ExternalSettlementStatement
      label: External Settlement Statement
      definition: >-
        The external settlement statement is an immutable external statement header that, for a single focal account and
        statement date, is bound to exact snapshot bytes and schema evidence, used for encapsulating the source facts of
        external settlement reconciliation.
      cnNote: 外部结算对账单，是面向单一核心账户与对账日、绑定确切快照字节与模式证据的不可变外部对账单表头，用于封装外部结算对账的来源事实。
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statementType
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/coveragePeriodStart
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/coveragePeriodEnd
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statementAsOfTime
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSnapshotRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSnapshotDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSchemaDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    CorporateActionElectionProviderMember:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderMember
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderMember
      label: Corporate Action Election Provider Member
      definition: The corporate action election provider member is an exact policy membership fact that exposes one eligible logical provider and its canonical normalized provider key, used for characterizing who is admitted as an eligible provider under the election policy.
      cnNote: 公司行为选举提供方成员，是封闭某一合格逻辑提供方及其规范归一化键的精确政策成员事实，用于在选举政策中刻画谁被接纳为合格提供方。
      participantRoles:
        - id: memberPolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: member policy
          definition: exact provider-policy version owning the membership
        - id: eligibleProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: eligible provider
          definition: logical provider Party admitted by the policy
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedProviderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionProviderNormalization:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderNormalization
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderNormalization
      label: Corporate Action Election Provider Normalization
      definition: The corporate action election provider normalization is an exact policy mapping that maps one authority-scoped raw provider key to one eligible logical provider identity, used for eliminating ambiguity across multi-source provider identifiers.
      cnNote: 公司行为选举提供方归一化，是把权威作用域内原始提供方键映射到合格逻辑提供方身份的精确政策映射，用于消除多源提供方标识歧义。
      participantRoles:
        - id: normalizationPolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: normalization policy
          definition: exact provider-policy version owning the mapping
        - id: normalizedProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: normalized provider
          definition: logical eligible provider Party produced by the mapping
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceProviderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedProviderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionProviderPrecedenceEdge:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPrecedenceEdge
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderPrecedenceEdge
      label: Corporate Action Election Provider Precedence Edge
      definition: The corporate action election provider precedence edge is a typed directed edge that declares, under one exact policy, that one eligible provider dominates another, used for building the acyclic precedence graph that arbitrates election conflicts.
      cnNote: 公司行为选举提供方优先级边，是在某一确切政策下声明一个合格提供方优先于另一个的有向边，用于构建选举冲突仲裁的无环优先级图。
      participantRoles:
        - id: precedencePolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: precedence policy
          definition: exact provider-policy version owning the edge
        - id: higherPriorityProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: higher-priority provider
          definition: logical eligible provider Party that dominates the lower endpoint
        - id: lowerPriorityProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: lower-priority provider
          definition: different logical eligible provider Party dominated by the higher endpoint
      attributeUses:
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionEvent:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
      namespace: fin-post-trade
      localName: CorporateActionEvent
      label: Corporate Action Event
      definition: >-
        The corporate action event is an authority-scoped event version for exactly one supported cash dividend, stock
        split, or non-transferable direct-subscription rights issue, used for characterizing a corporate action that
        affects a security and requires schedule resolution.
      cnNote: 公司行为事件，是对单一现金分红、股票拆分或不可转让直接配股权利发行的权威作用域事件版本，用于刻画影响某只证券并需排程裁决的公司行动。
      participantRoles:
        - id: sourceAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: source authority
          definition: exact Party version that issued or announced the event
        - id: affectedSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 1
          maxCount: 1
          label: affected security
          definition: logical Security whose holders may be affected
        - id: affectedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: affected listing
          definition: optional exact listing version supplying facility scope
        - id: eventJurisdiction
          range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
          minCount: 0
          maxCount: 1
          label: event jurisdiction
          definition: optional logical jurisdiction scope supplied to rule evaluation
        - id: eventFacility
          range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
          minCount: 0
          maxCount: 1
          label: event facility
          definition: optional explicit facility that must equal the affected listing facility
        - id: successorSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 0
          maxCount: 1
          label: successor security
          definition: optional logical successor Security required only by the rights or split matrix
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-rules/corporateActionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/announcementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/exDate
          minCount: 1
          maxCount: 1
