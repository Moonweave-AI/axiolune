        schedule precedence is resolved, closes the exact event, applicability, schedule rule, reviewed method, and
        calculated or official source inputs, used for determining the distribution ratio.
      cnNote: 公司行为分派规模评估，是在排程优先级裁决前封闭确切事件、适用性、排程规则、审定方法与计算或官方来源输入的候选专属百分比评估，用于确定分派比例。
      participantRoles:
        - id: assessmentEvaluationInput
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
          minCount: 1
          maxCount: 1
