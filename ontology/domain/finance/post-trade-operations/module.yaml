module:
  moduleIri: https://axiolune.ai/ontology/finance/post-trade-operations
  baseIri: https://axiolune.ai/ontology/finance/post-trade-operations/
  preferredPrefix: fin-post-trade
  version: 1.0.0
  label: Post-Trade Operations
  definition: >-
    RFC-001 v0.3 post-trade ontology covering corporate-action schedule and entitlement closure,
    due-bill/election/subscription processing, DVP/FOP settlement allocation, and deterministic reconciliation.
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-rules
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/orders-execution
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    SettlementReconciliationComparator:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementReconciliationComparator
      namespace: fin-post-trade
      localName: SettlementReconciliationComparator
      label: Settlement Reconciliation Comparator
      definition: >-
        Versioned zero-tolerance comparator that locks settlement-reference normalization, canonical Money and Quantity
        rules, implementation, runtime, and input-output contracts.
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/referenceNormalizationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/canonicalizationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/numericTolerance
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionProviderPolicy:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderPolicy
      label: Corporate Action Election Provider Policy
      definition: >-
        Versioned authority policy that closes eligible election providers, normalization, equivalence, deadline
        semantics, and an acyclic explicit precedence graph for one event-authority scope.
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/eventScopeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleProviderSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/eligibleProviderCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerMemberVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerNormalizationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/providerNormalizationCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/precedenceGraphDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/precedenceEdgeCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electionEquivalenceField
          minCount: 1
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/equivalenceFieldsDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadlineCutoff
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/deadlineInclusive
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/deadlineCutoffContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/runtimeDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalSettlementStatement:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ExternalSettlementStatement
      namespace: fin-post-trade
      localName: ExternalSettlementStatement
      label: External Settlement Statement
      definition: >-
        Provider-scoped immutable statement header for one focal financial account and statement date, bound to exact
        snapshot bytes and schema evidence.
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/statementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSnapshotRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSnapshotDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceSchemaDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    CorporateActionElectionProviderMember:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderMember
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderMember
      label: Corporate Action Election Provider Member
      definition: Exact policy membership fact exposing one eligible logical provider and its canonical normalized provider key.
      participantRoles:
        - id: memberPolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: member policy
          definition: exact provider-policy version owning the membership
        - id: eligibleProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: eligible provider
          definition: logical provider Party admitted by the policy
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedProviderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionProviderNormalization:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderNormalization
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderNormalization
      label: Corporate Action Election Provider Normalization
      definition: Exact policy mapping from one authority-scoped raw provider key to one eligible logical provider identity.
      participantRoles:
        - id: normalizationPolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: normalization policy
          definition: exact provider-policy version owning the mapping
        - id: normalizedProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: normalized provider
          definition: logical eligible provider Party produced by the mapping
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceProviderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/normalizedProviderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionElectionProviderPrecedenceEdge:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPrecedenceEdge
      namespace: fin-post-trade
      localName: CorporateActionElectionProviderPrecedenceEdge
      label: Corporate Action Election Provider Precedence Edge
      definition: Typed directed edge declaring that one eligible logical provider dominates another under one exact policy.
      participantRoles:
        - id: precedencePolicy
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
          minCount: 1
          maxCount: 1
          label: precedence policy
          definition: exact provider-policy version owning the edge
        - id: higherPriorityProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: higher-priority provider
          definition: logical eligible provider Party that dominates the lower endpoint
        - id: lowerPriorityProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: lower-priority provider
          definition: different logical eligible provider Party dominated by the higher endpoint
      attributeUses:
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionEvent:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
      namespace: fin-post-trade
      localName: CorporateActionEvent
      label: Corporate Action Event
      definition: >-
        Authority-scoped event version for exactly one supported cash-dividend, stock-split, or non-transferable
        direct-subscription rights issue, with the affected Security and explicit schedule-resolution scope.
      participantRoles:
        - id: sourceAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: source authority
          definition: exact Party version that issued or announced the event
        - id: affectedSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 1
          maxCount: 1
          label: affected security
          definition: logical Security whose holders may be affected
        - id: affectedListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: affected listing
          definition: optional exact listing version supplying facility scope
        - id: eventJurisdiction
          range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
          minCount: 0
          maxCount: 1
          label: event jurisdiction
          definition: optional logical jurisdiction scope supplied to rule evaluation
        - id: eventFacility
          range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
          minCount: 0
          maxCount: 1
          label: event facility
          definition: optional explicit facility that must equal the affected listing facility
        - id: successorSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 0
          maxCount: 1
          label: successor security
          definition: optional logical successor Security required only by the rights or split matrix
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/sourceEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-rules/corporateActionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/announcementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/exDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/recordDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/paymentDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/effectiveDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/electionDeadline
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/cashPerUnit
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/splitRatio
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entitlementRatio
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionPrice
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/nonTransferableDirectSubscription
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionScheduleEvaluationInput:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
      namespace: fin-post-trade
      localName: CorporateActionScheduleEvaluationInput
      label: Corporate Action Schedule Evaluation Input
      definition: >-
        Immutable join between one Event version and one exact generic RuleEvaluationRequest version, proving equality
        of kind, instrument, supplied scopes, and all three pivots.
      participantRoles:
        - id: evaluationEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: evaluation event
          definition: exact corporate-action Event version being evaluated
        - id: evaluationRequest
          range: https://axiolune.ai/ontology/finance/market-rules/RuleEvaluationRequest
          minCount: 1
          maxCount: 1
          label: evaluation request
          definition: exact generic rule-evaluation request version carrying the same scopes and pivots
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/scopeConsistencyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionDistributionSizeAssessment:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDistributionSizeAssessment
      namespace: fin-post-trade
      localName: CorporateActionDistributionSizeAssessment
      label: Corporate Action Distribution Size Assessment
      definition: >-
        Candidate-specific percentage assessment closing the exact event, applicability, schedule-rule, reviewed method,
        and calculated or official source inputs before schedule precedence is resolved.
      participantRoles:
        - id: assessmentEvaluationInput
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
          minCount: 1
          maxCount: 1
          label: assessment evaluation input
          definition: exact evaluation input whose event and request are assessed
        - id: assessmentEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: assessment event
          definition: exact Event version equal to the evaluation input event
        - id: candidateApplicability
          range: https://axiolune.ai/ontology/finance/market-rules/RuleApplicability
          minCount: 1
          maxCount: 1
          label: candidate applicability
          definition: exact candidate applicability version whose percentage boundary is tested
        - id: candidateScheduleRule
          range: https://axiolune.ai/ontology/finance/market-rules/CorporateActionScheduleRule
          minCount: 1
          maxCount: 1
          label: candidate schedule rule
          definition: exact schedule-rule version selected by the candidate applicability
        - id: assessmentMethod
          range: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDistributionAssessmentMethod
          minCount: 1
          maxCount: 1
          label: assessment method
          definition: exact reviewed distribution-assessment method version named by the candidate schedule rule
        - id: assessmentPriceObservation
          range: https://axiolune.ai/ontology/finance/market-data/PriceObservation
          minCount: 0
          maxCount: 1
          label: assessment price observation
          definition: optional exact PIT-eligible price required by a reviewed calculation method
        - id: officialPercentageAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: official percentage authority
          definition: optional exact authority Party version for an official-percentage input
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentPercentage
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-rules/distributionAssessmentInputKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/cashCalculatedInput
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/splitCalculatedInput
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/rightsCalculatedInput
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/officialPercentageInput
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/valuationPivot
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-data/priceKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentInputVersionRef
          minCount: 1
          maxCount: null
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentInputVersionCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/assessmentInputVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/formulaDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/roundingPolicyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/officialArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/officialArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionScheduleResolution:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
      namespace: fin-post-trade
      localName: CorporateActionScheduleResolution
      label: Corporate Action Schedule Resolution
      definition: >-
        Unique-winner resolution binding the evaluation input, Event, request, applicability,
        CorporateActionScheduleRule, optional candidate assessment, resolved dates, entitlement pivot and due-bill
        clauses.
      participantRoles:
        - id: resolutionEvaluationInput
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
          minCount: 1
          maxCount: 1
          label: resolution evaluation input
          definition: exact evaluated Event/request pair
        - id: resolutionEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: resolution event
          definition: exact Event version equal to the evaluation input Event
        - id: resolutionRequest
          range: https://axiolune.ai/ontology/finance/market-rules/RuleEvaluationRequest
          minCount: 1
          maxCount: 1
          label: resolution request
          definition: exact rule-evaluation request version
        - id: winningApplicability
          range: https://axiolune.ai/ontology/finance/market-rules/RuleApplicability
          minCount: 1
          maxCount: 1
          label: winning applicability
          definition: unique exact winning RuleApplicability version
        - id: scheduleRule
          range: https://axiolune.ai/ontology/finance/market-rules/CorporateActionScheduleRule
          minCount: 1
          maxCount: 1
          label: schedule rule
          definition: exact CorporateActionScheduleRule version selected by the winner
        - id: distributionAssessment
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDistributionSizeAssessment
          minCount: 0
          maxCount: 1
          label: distribution assessment
          definition: optional exact candidate assessment required only by a percentage-bounded winner
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedAnnouncementDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedExDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedRecordDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedPaymentDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedEffectiveDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/resolvedElectionDeadline
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/subscriptionCashDueDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/successorDeliveryDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-rules/corporateActionEntitlementMode
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/entitlementPivot
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/cumEntitlementStart
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/cumEntitlementEnd
