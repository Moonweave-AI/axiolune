    ReconciliationFindingVariantXone:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFindingVariantXone
      namespace: fin-post-trade
      localName: ReconciliationFindingVariantXone
      label: Reconciliation Finding Variant Xone
      definition: Finding selects exactly one closed matrix variant marker.
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(matchedFinding,valueMismatchFinding,duplicateFinding,missingSideFinding)
      severity: Error
      message: finding must select exactly one matrix variant
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/ReconciliationFinding
    CorporateActionEventContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEventContract
      namespace: fin-post-trade
      localName: CorporateActionEventContract
      label: Corporate Action Event Contract
      definition: Enforces the exact RFC kind/date/consideration/scope matrix.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          kind is one of cashDividend, stockSplit, rightsIssue; required and forbidden
          date/consideration/successor/election fields follow RFC-001 5.19; at least listing or jurisdiction scope;
          supplied facility equals listing facility; rights are non-transferable direct subscription
      severity: Error
      message: corporate-action event matrix or scope is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
    ScheduleEvaluationInputContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ScheduleEvaluationInputContract
      namespace: fin-post-trade
      localName: ScheduleEvaluationInputContract
      label: Schedule Evaluation Input Contract
      definition: Enforces Event/request equality and exact pivots.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          evaluationRequest requested kind and instrument equal Event; listing/facility/jurisdiction scopes and
          valid/knowledge/availability pivots are identical; listing instrument equals affected Security
      severity: Error
      message: schedule evaluation input does not close Event/request scope
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
    DistributionSizeAssessmentContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DistributionSizeAssessmentContract
      namespace: fin-post-trade
      localName: DistributionSizeAssessmentContract
      label: Distribution Size Assessment Contract
      definition: Enforces candidate, method, source variant, price selection and arithmetic.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          candidate applicability/rule/Event/request chain is equal; selected input branch matches kind and method;
          exact price instrument/listing/PriceKind/currency/pivot is valid; the complete sorted exact input-version
          member set, count and section-5.8 digest recompute; official input has authority artifact evidence;
          percentage, formula, rounding and implementation recompute
      severity: Error
      message: distribution size assessment is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDistributionSizeAssessment
    ScheduleResolutionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ScheduleResolutionContract
      namespace: fin-post-trade
      localName: ScheduleResolutionContract
      label: Schedule Resolution Contract
      definition: Enforces one unique applicable CorporateActionScheduleRule result.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          one unique winning applicability selects exact schedule rule; assessment presence matches percentage boundary;
          dates satisfy rule clauses; rights resolves separate cash-due and successor-delivery dates; dueBillAdjusted
          carries half-open interval and qualification contract
      severity: Error
      message: corporate-action schedule resolution is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
    RecordPositionAbsenceContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/RecordPositionAbsenceContract
      namespace: fin-post-trade
      localName: RecordPositionAbsenceContract
      label: Record Position Absence Contract
      definition: Enforces completed closed-world zero-position proof.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          completed probe over exact prior input and PIT context returns zero eligible HoldingSnapshot and
          PositionSnapshot for account and affected Security; zero Quantity has exact unit; ordinary RDF absence is
          insufficient
      severity: Error
      message: record-position absence assertion is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/RecordPositionAbsenceAssertion
    CorporateActionEntitlementContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlementContract
      namespace: fin-post-trade
      localName: CorporateActionEntitlementContract
      label: Corporate Action Entitlement Contract
      definition: Enforces record evidence, complete bilateral obligation closure and benefit arithmetic.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          ordinary mode requires snapshot and zero obligations; due-bill mode admits snapshot or proven zero, exact
          complete sorted obligation set/count/digest/probe, one incoming/outgoing appearance per account and two
          conserved cross-entitlement appearances; eligible and benefit quantities recompute
      severity: Error
      message: corporate-action entitlement closure or arithmetic is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEntitlement
    CustodySettlementAccountBridgeContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CustodySettlementAccountBridgeContract
      namespace: fin-post-trade
      localName: CustodySettlementAccountBridgeContract
      label: Custody Settlement Account Bridge Contract
      definition: Enforces account distinction, account types, Party roles and mandate evidence.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          economicAccount differs from settlementAccount; exact PIT roles prove owner/beneficial owner, custodian and
          settlement operator; security endpoint account types are custody or multi-asset; system/location and mandate
          evidence are exact
      severity: Error
      message: custody settlement account bridge is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CustodySettlementAccountBridge
    DueBillTradeQualificationContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTradeQualificationContract
      namespace: fin-post-trade
      localName: DueBillTradeQualificationContract
      label: Due Bill Trade Qualification Contract
      definition: Enforces Event/allocation/execution/leg joins and settlement clauses.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          allocation execution/instruction/security leg and Event instrument agree; positive allocated Quantity is
          qualified; occurrence is inside half-open interval; buy/sell economic endpoints agree; liable and beneficiary
          economic Parties are proven by exact PIT-eligible accountHolder or beneficialOwner roles; both endpoint xones
          close; settlement evidence and atomic group are exact when required
      severity: Error
      message: due-bill trade qualification is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTradeQualification
    DueBillObligationContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillObligationContract
      namespace: fin-post-trade
      localName: DueBillObligationContract
      label: Due Bill Obligation Contract
      definition: Enforces bilateral endpoints, source evidence and benefit arithmetic.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          liable and beneficiary accounts/Parties differ and each exact Party/account pair is proven by one or more
          PIT-eligible accountHolder or beneficialOwner role versions; trade-derived endpoints and proof roles equal the
          qualification; trade source is eligible or external claim evidence is exact; positive affected-security
          Quantity and Money/Quantity benefit recompute under Event/Resolution precision and rounding
      severity: Error
      message: due-bill obligation source, endpoints, or benefit is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillObligation
    DueBillTransferContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferContract
      namespace: fin-post-trade
      localName: DueBillTransferContract
      label: Due Bill Transfer Contract
      definition: Enforces obligation endpoints, state and movement evidence.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          from/to accounts and Parties equal Obligation; asset currency/instrument/unit matches; value positive; only
          completed state has completed movement evidence that contributes value; identity corrections follow one linear
          chain
      severity: Error
      message: due-bill transfer is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransfer
    DueBillTransferClosureContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DueBillTransferClosureContract
      namespace: fin-post-trade
      localName: DueBillTransferClosureContract
      label: Due Bill Transfer Closure Contract
      definition: Enforces complete current-version closure, de-duplication and exact arithmetic.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          every transfer version joins one known Obligation and its exact account, Party, asset and authority identity;
          completed closure probe binds the Case PIT request/input context and proves all PIT-eligible transfer logical
          identities; one linear latest version per identity; transfer set/count/digest exact; movement evidence counted
          once; only completed values sum; 0 <= fulfilled <= obligation and result/remaining recompute exactly
      severity: Error
      message: due-bill transfer fulfillment closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransferFulfillmentClosure
    ElectionProviderPolicyContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionProviderPolicyContract
      namespace: fin-post-trade
      localName: ElectionProviderPolicyContract
      label: Election Provider Policy Contract
      definition: Enforces authority identity and an explicit acyclic provider policy.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          policy authority and event authority scopes are exact; every eligible provider member, raw-key normalization
          mapping and typed precedence edge is traversable and joins this exact policy; member/mapping/edge counts and
          digests recompute; endpoints are eligible, keys are unique, and the precedence graph is acyclic;
          equivalence-field IRIs, inclusive cutoff instant, runtime and source evidence are explicit and digest-locked;
          numeric/arrival priority forbidden
      severity: Error
      message: election-provider policy is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionProviderPolicy
    CorporateActionElectionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionContract
      namespace: fin-post-trade
      localName: CorporateActionElectionContract
      label: Corporate Action Election Contract
      definition: Enforces rights-only decision, deadline, authorization and Quantity.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          Event is rightsIssue and equals Entitlement Event; candidate exact policy, provider version, normalized raw
          provider key, Event and Entitlement joins are valid; receivedAt is not after the inclusive policy cutoff;
          electing Party selects exactly self or one PIT-eligible authorized role; exercise has positive Quantity <=
          maximum; decline forbids Quantity
      severity: Error
      message: corporate-action election is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElection
    ElectionResolutionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/ElectionResolutionContract
      namespace: fin-post-trade
      localName: ElectionResolutionContract
      label: Election Resolution Contract
      definition: Enforces complete candidate closure and non-additive deterministic selection.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          candidate set/count/digest/probe closes all timely eligible normalized provider versions; only an active
          explicit policy edge directly between two candidate providers dominates the lower candidate, while transitive
          reachability is used only to reject cycles; deterministic selected result has one exact candidate and a
          candidate-set-bound precedence/equivalence proof; default lapse requires canonical empty set and completed
          absence probe at/after deadline; incompatible undominated candidates produce finding, not resolution
      severity: Error
      message: corporate-action election resolution is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionElectionResolution
    SubscriptionObligationContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionObligationContract
      namespace: fin-post-trade
      localName: SubscriptionObligationContract
      label: Subscription Obligation Contract
      definition: Enforces the selected-exercise two-asset obligation.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          created only for selectedExercise; Election, Entitlement, Event and schedule chain equal; elected successor
          Quantity and subscription Money recompute; subscriber and agent cash/securities accounts and exact PIT roles
          close; cash and delivery dates are separately resolved
      severity: Error
      message: corporate-action subscription obligation is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionObligation
    SubscriptionFulfillmentContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentContract
      namespace: fin-post-trade
      localName: SubscriptionFulfillmentContract
      label: Subscription Fulfillment Contract
      definition: Enforces exact asset endpoints and completed movement evidence.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          cash branch uses obligation cash currency and subscriber-to-agent endpoints; security branch uses successor
          Security unit and agent-to-subscriber endpoints; positive value, occurrence date and exact evidence match the
          obligation
      severity: Error
      message: subscription fulfillment is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillment
    SubscriptionFulfillmentClosureContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SubscriptionFulfillmentClosureContract
      namespace: fin-post-trade
      localName: SubscriptionFulfillmentClosureContract
      label: Subscription Fulfillment Closure Contract
      definition: Enforces complete two-asset fulfillment closure.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          completed probe closes current fulfillment versions; evidence identities counted once; cash and security sums
          independently remain within obligation; fully fulfilled iff both equal exact obligations; empty set only
          unfulfilled; wrong endpoints/assets/dates or overfill invalid
      severity: Error
      message: subscription fulfillment closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillmentClosure
    CorporateActionProcessingFindingContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFindingContract
      namespace: fin-post-trade
      localName: CorporateActionProcessingFindingContract
      label: Corporate Action Processing Finding Contract
      definition: Enforces the exact stage/kind presence matrix.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          findingStage equals the one selected subject branch and finding kind belongs to that stage; schedule matrix is
          noApplicableRule {}, ruleConflict {findingRuleConflict=1}, sizeAssessmentFailure {failedAssessment=0..1};
          entitlement matrix is missingElection {}, lateElection/overElection/unauthorizedElection
          {relatedElection=1..*}, electionConflict {relatedElection=2..*}, invalidDefaultLapse
          {relatedElectionResolution=1}, electionResolutionFailure {relatedElection=0..*,
          relatedElectionResolution=0..1}, subscriptionFulfillmentMismatch {relatedElection=1..*,
          relatedElectionResolution=1, relatedSubscriptionObligation=1, relatedSubscriptionClosure=1},
          calculationMismatch {relatedElection=0..*, relatedElectionResolution=0..1, relatedSubscriptionObligation=0..1,
          relatedSubscriptionClosure=0..1, relatedAdjustment=0..1}, and adjustmentMismatch {relatedAdjustment=1 with
          those other entitlement roles optional}; due-bill matrix permits relatedEntitlement=0..1 for every due-bill
          kind and otherwise is missingDueBillEvidence {all due-bill evidence roles optional},
          conflictingDueBillEvidence {at least two due-bill evidence records}, ineligibleTradeQualification
          {relatedDueBillQualification=1}, endpointMismatch {at least one of
          relatedDueBillQualification/relatedDueBillObligation/relatedDueBillTransfer}, obligationBenefitMismatch
          {relatedDueBillObligation=1}, dueBillTransferMismatch {relatedDueBillObligation=1,
          relatedDueBillTransfer=1..*}, duplicateTransfer {relatedDueBillTransfer=2..*}, and overTransfer
          {relatedDueBillObligation=1, relatedDueBillTransfer=1..*, relatedDueBillClosure=1}; every unlisted or
          cross-stage role is forbidden; all relations join the exact stage subject; evidenceSetDigest over Event,
          subject, and all related exact versions, generating context, logical identity, and standard version chain are
          recomputed
      severity: Error
      message: corporate-action processing finding matrix is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionProcessingFinding
    CorporateActionAdjustmentContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionAdjustmentContract
      namespace: fin-post-trade
      localName: CorporateActionAdjustmentContract
      label: Corporate Action Adjustment Contract
      definition: Enforces post-evidence component values, accounts, dates, and complete movement-evidence closure.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          Event/Resolution/Entitlement equal; the unique sorted movement-evidence IRI set/count/section-5.8 digest is
          complete; cash dividend and split components equal entitlement and completed evidence; rights requires
          selected exercise, exact subscription obligation and fully fulfilled closure, distinct account-aware
          cash/security components and header validFrom no earlier than completion/dates
      severity: Error
      message: corporate-action adjustment is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionAdjustment
    SettlementInstructionContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstructionContract
      namespace: fin-post-trade
      localName: SettlementInstructionContract
      label: Settlement Instruction Contract
      definition: Enforces closed DVP/FOP structure and identity.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          authority and instruction ID identify version; deliverer differs from receiver; DVP has exactly reciprocal
          security/cash legs in one atomic group; FOP has exactly one security leg and no cash;
          date/system/location/calendar equal across legs
      severity: Error
      message: settlement instruction DVP/FOP structure is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstruction
    SettlementLegContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLegContract
      namespace: fin-post-trade
      localName: SettlementLegContract
      label: Settlement Leg Contract
      definition: Enforces directed endpoints and exact cash/security branch.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          from/to Parties and accounts differ; exact PIT account roles prove endpoints; cash has Money and
          cash/multiAsset accounts with no instrument/Quantity; security has logical instrument and Quantity with
          custody/multiAsset accounts and no Money
      severity: Error
      message: settlement leg endpoints or asset branch is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
    TradeSettlementAllocationContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/TradeSettlementAllocationContract
      namespace: fin-post-trade
      localName: TradeSettlementAllocationContract
      label: Trade Settlement Allocation Contract
      definition: Enforces execution/leg equality, economic direction and per-endpoint projection.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          Execution, Instruction and security Leg exact joins agree on instrument/unit; Quantity positive and allocation
          sum <= execution; buy account equals toEconomicAccount, sell equals fromEconomicAccount; each direct branch
          means equality and each bridge branch proves inequality plus exact system/location/custodian bridge
      severity: Error
      message: trade settlement allocation is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/TradeSettlementAllocation
    SettlementStatusEventContract:
