    CorporateActionDueBillTradeQualification:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTradeQualification
      namespace: fin-post-trade
      localName: CorporateActionDueBillTradeQualification
      label: Corporate Action Due Bill Trade Qualification
      definition: >-
        The corporate action due-bill trade qualification is a qualification result that, under execution-only or exact
        settlement evidence, closes the event, schedule resolution, execution, trade allocation, and security leg, used
        for determining whether a trade falls within the due-bill qualifying interval.
      cnNote: 公司行为到期票据交易资格，是在仅执行或确切结算证据下封闭事件、排程裁决、成交流、交易分配与证券腿的资格结果，用于判定某笔交易是否落入到期票据合格区间。
      participantRoles:
        - id: qualificationEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: qualification event
          definition: exact Event version whose due-bill interval is tested
        - id: qualificationScheduleResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
          minCount: 1
          maxCount: 1
          label: qualification schedule resolution
          definition: exact resolution version supplying interval and settlement clauses
        - id: qualificationExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: qualification execution
          definition: exact Execution version tested for due-bill qualification
        - id: qualificationAllocation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/TradeSettlementAllocation
          minCount: 1
          maxCount: 1
          label: qualification allocation
          definition: exact allocation identifying both economic endpoints and the security leg
        - id: qualificationSecurityLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 1
          maxCount: 1
          label: qualification security leg
          definition: exact security SettlementLeg version equal to the allocation leg
        - id: qualificationLiableParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: qualification liable party
          definition: logical economic Party owning or beneficially owning the liable economic account
        - id: qualificationBeneficiaryParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: qualification beneficiary party
          definition: logical economic Party owning or beneficially owning the beneficiary economic account
        - id: qualificationLiableAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: qualification liable account-party role
          definition: exact PIT-eligible accountHolder or beneficialOwner role proving the liable economic Party/account endpoint
        - id: qualificationBeneficiaryAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: qualification beneficiary account-party role
          definition: >-
            exact PIT-eligible accountHolder or beneficialOwner role proving the beneficiary economic Party/account
            endpoint
        - id: qualificationSettlementStatusEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementStatusEvent
          minCount: 0
          maxCount: 1
          label: qualification settlement status event
          definition: optional exact qualifying settlement-status evidence branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/executionOnlyQualification
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/qualifiedDueBillQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/qualificationResult
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionDueBillObligation:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillObligation
      namespace: fin-post-trade
      localName: CorporateActionDueBillObligation
      label: Corporate Action Due Bill Obligation
      definition: >-
        The corporate action due-bill obligation is a conserved bilateral benefit obligation that has distinct liable and
        beneficiary economic endpoints, one positive affected-security quantity, and exactly one trade-derived or locked
        external-claim source, used for characterizing who owes whom and how much under due-bill mode.
      cnNote: 公司行为到期票据义务，是具有不同责任与受益经济端点、一个正向受影响证券数量和单一交易来源或锁定外部索赔来源的保守双向利益义务，用于刻画到期票据模式下谁欠谁多少。
      participantRoles:
        - id: obligationEvent
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
          minCount: 1
          maxCount: 1
          label: obligation event
          definition: exact Event version under which the benefit is owed
        - id: obligationScheduleResolution
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
          minCount: 1
          maxCount: 1
          label: obligation schedule resolution
          definition: exact resolution governing due-bill qualification and arithmetic
        - id: liableAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: liable account
          definition: logical economic account owing the benefit
        - id: beneficiaryAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: beneficiary account
          definition: different logical economic account receiving the benefit
        - id: liableParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: liable party
          definition: logical economic Party proven for the liable account
        - id: beneficiaryParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: beneficiary party
          definition: logical economic Party proven for the beneficiary account
        - id: liableAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: liable account-party role
          definition: exact PIT-eligible accountHolder or beneficialOwner role proving the liable Party/account endpoint
        - id: beneficiaryAccountPartyRole
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
          minCount: 1
          maxCount: null
          label: beneficiary account-party role
          definition: exact PIT-eligible accountHolder or beneficialOwner role proving the beneficiary Party/account endpoint
        - id: obligationSecurity
          range: https://axiolune.ai/ontology/finance/instruments/Security
          minCount: 1
          maxCount: 1
          label: obligation security
          definition: logical affected Security whose Quantity is qualified
        - id: tradeQualification
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTradeQualification
          minCount: 0
          maxCount: 1
          label: trade qualification
          definition: optional exact eligible trade-qualification source branch
        - id: claimAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: claim authority
          definition: optional exact authority Party version for the external-claim source branch
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/obligationQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/obligationMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/obligationQuantityBenefit
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/externalClaimId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionDueBillTransfer:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransfer
      namespace: fin-post-trade
      localName: CorporateActionDueBillTransfer
      label: Corporate Action Due Bill Transfer
      definition: >-
        The corporate action due-bill transfer is an authority-scoped transfer attempt or completion that, for one exact
        due-bill obligation, preserves the obligation endpoints and one Money or Quantity asset, used for recording the
        actual movement of a due-bill benefit.
      cnNote: 公司行为到期票据划转，是针对某一到期票据义务、保持义务端点与单一 Money 或 Quantity 资产的权威作用域划转尝试或完成，用于记录到期票据利益的实际移动。
      participantRoles:
        - id: transferAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: transfer authority
          definition: exact Party version that issued the transfer identity
        - id: transferObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillObligation
          minCount: 1
          maxCount: 1
          label: transfer obligation
          definition: exact due-bill obligation version being fulfilled
        - id: transferFromAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: transfer from account
          definition: logical account equal to the obligation liable account
        - id: transferToAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: transfer to account
          definition: logical account equal to the obligation beneficiary account
        - id: transferFromParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: transfer from party
          definition: logical Party equal to the obligation liable Party
        - id: transferToParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: transfer to party
          definition: logical Party equal to the obligation beneficiary Party
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/authorityScopedId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/transferTime
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/transferState
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/transferMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/transferQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/movementEvidenceRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/movementEvidenceDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionDueBillTransferFulfillmentClosure:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransferFulfillmentClosure
      namespace: fin-post-trade
      localName: CorporateActionDueBillTransferFulfillmentClosure
      label: Corporate Action Due Bill Transfer Fulfillment Closure
      definition: >-
        The corporate action due-bill transfer fulfillment closure is the sole PIT result for one exact obligation that
        closes the complete current transfer set, correction de-duplication, movement evidence, and fulfilled arithmetic
        and yields an unfulfilled, partial, or full result, used for settling the final fulfillment state of a due-bill
        obligation.
      cnNote: 公司行为到期票据划转履约闭合，是针对某一义务封闭全部当前划转集合、纠错去重、移动证据与履约算术并给出未完成、部分或完全结果的唯一 PIT 结果，用于结算到期票据义务的最终履行状态。
      participantRoles:
        - id: closureObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillObligation
          minCount: 1
          maxCount: 1
          label: closure obligation
          definition: exact obligation version whose fulfillment is closed
        - id: closureTransfer
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionDueBillTransfer
          minCount: 0
          maxCount: null
          label: closure transfer
          definition: complete sorted set of exact current transfer versions including non-completed attempts
      attributeUses:
