        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CorporateActionSubscriptionFulfillmentClosure:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillmentClosure
      namespace: fin-post-trade
      localName: CorporateActionSubscriptionFulfillmentClosure
      label: Corporate Action Subscription Fulfillment Closure
      definition: >-
        The corporate action subscription fulfillment closure is a complete PIT closure that, for one subscription
        obligation, closes every current fulfillment version, separately sums the cash and security results, and yields
        an exact unfulfilled, partial, or full outcome, used for settling the final state of both legs of a subscription
        obligation.
      cnNote: 公司行为认购履约闭合，是对某一认购义务封闭全部当前履约版本、分别汇总现金与证券结果并给出确切未完成、部分或完全结果的完整 PIT 闭合，用于结算认购义务的双腿最终状态。
      participantRoles:
        - id: subscriptionClosureObligation
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionObligation
          minCount: 1
          maxCount: 1
          label: subscription closure obligation
          definition: exact subscription obligation version whose two legs are closed
        - id: subscriptionClosureFulfillment
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionSubscriptionFulfillment
          minCount: 0
          maxCount: null
          label: subscription closure fulfillment
          definition: complete sorted set of exact current fulfillment versions
      attributeUses:
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/pitRequestRecordDigest
