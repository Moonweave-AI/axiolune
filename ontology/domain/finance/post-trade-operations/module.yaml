          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/quantityEffectiveDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentPortfolioEffectRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentPositionEffectRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentLotEffectRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/post-trade-operations/adjustmentCostBasisEffectRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    SettlementInstruction:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementInstruction
      namespace: fin-post-trade
      localName: SettlementInstruction
      label: Settlement Instruction
      definition: >-
        The settlement instruction is an authority-scoped instruction that fixes the distinct securities endpoint
        Parties, settlement method, date, system, and location, the exact calendar, and the leg set. The Simple
        DvP/FoP Settlement Profile locks the leg set to exactly one security leg (FOP) or one reciprocal security and
        cash leg (DVP); the generic core permits multi-leg, multi-currency, fee/tax-leg, and netted structures via
        additional profiles. Confirmation, affirmation, clearing, novation, and netting are out of scope and are
        exposed only as optional traceability hooks.
      cnNote: 结算指令，是固定证券两端方、结算方式与日期及系统地点、确切交易日历和腿集合的权威作用域指令。简单 DvP/FoP 结算画像将腿集合锁定为恰好一条证券腿（FOP）或一条互易证券加现金腿（DVP）；通用核心通过附加画像允许多腿、多币种、费用/税腿与净额结构。确认、适格、清算、更替与净额结算不在范围，仅作为可选可追溯钩子暴露。
      participantRoles:
        - id: instructionAuthority
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: instruction authority
          definition: exact source-authority Party version
        - id: securitiesDeliverer
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: securities deliverer
          definition: exact Party version delivering securities
        - id: securitiesReceiver
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: securities receiver
          definition: different exact Party version receiving securities
        - id: settlementCalendar
          range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
          minCount: 1
          maxCount: 1
          label: settlement calendar
          definition: exact TradingCalendar version interpreting the settlement date
        - id: instructionLeg
          range: https://axiolune.ai/ontology/finance/post-trade-operations/SettlementLeg
          minCount: 1
          maxCount: null
          label: instruction leg
          definition: >-
