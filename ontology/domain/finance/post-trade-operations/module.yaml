    CorporateActionScheduleResolution:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleResolution
      namespace: fin-post-trade
      localName: CorporateActionScheduleResolution
      label: Corporate Action Schedule Resolution
      definition: >-
        The corporate action schedule resolution is a unique-winner resolution that binds the evaluation input, event,
        request, applicability, schedule rule, and optional candidate assessment and yields resolved dates, entitlement
        pivot, and due-bill clauses, used for locking the key dates and entitlement scope of a corporate action.
      cnNote: 公司行为排程裁决，是绑定评估输入、事件、请求、适用性、排程规则及可选候选评估并输出确定日期、权益枢轴与到期票据条款的唯一胜出裁决，用于锁定公司行为的关键时间与权益口径。
      participantRoles:
        - id: resolutionEvaluationInput
          range: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionScheduleEvaluationInput
          minCount: 1
          maxCount: 1
