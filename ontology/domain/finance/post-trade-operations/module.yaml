    CorporateActionEventContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEventContract
      namespace: fin-post-trade
      localName: CorporateActionEventContract
      label: Corporate Action Event Contract
      definition: Enforces the core event scope and date matrix with profile-scoped kind/consideration locks.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          source authority and scope exact; affected security/listing/jurisdiction/facility join; at least listing or
          jurisdiction scope; supplied facility equals listing facility; date fields are internally consistent. The
          restriction to cash dividend, stock split, or non-transferable direct-rights kinds with exactly one
          consideration is profile-scoped to the Direct Rights Due-Bill Corporate Action Profile and is not enforced by
          the generic core, which admits additional corporate-action kinds and multi-option events under additional
          profiles
      severity: Error
      message: corporate-action event scope or date matrix is invalid
      targetElement: https://axiolune.ai/ontology/finance/post-trade-operations/CorporateActionEvent
    DirectRightsDueBillCorporateActionProfileContract:
      iri: https://axiolune.ai/ontology/finance/post-trade-operations/DirectRightsDueBillCorporateActionProfileContract
      namespace: fin-post-trade
      localName: DirectRightsDueBillCorporateActionProfileContract
      label: Direct Rights Due-Bill Corporate Action Profile Contract
      definition: Enforces the profile-scoped kind, single-consideration, and non-transferable direct-rights locks.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          profile active; kind is one of cashDividend, stockSplit, rightsIssue; exactly one consideration per event;
          rights are non-transferable direct subscription; the due-bill entitlement transfer chain applies; required
          and forbidden date/consideration/successor/election fields follow RFC-001 5.19
      severity: Error
      message: direct rights due-bill corporate action profile is invalid
