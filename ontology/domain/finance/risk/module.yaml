module:
  moduleIri: https://axiolune.ai/ontology/finance/risk
  baseIri: https://axiolune.ai/ontology/finance/risk/
  preferredPrefix: fin-risk
  version: 1.1.0
  label: Risk
  definition: >-
    The Risk module, is a finance domain module that provides a generic semantic core for risk management concerns —
    risk categories, sources, factors, exposures, scope, appetite and tolerance; risk measure specification,
    calculation profile and implementation version; risk measurement observations and validated reproducible
    measurements; risk limit rules with comparison policy and governance lifecycle; limit evaluation, breach facts
    and breach-case governance; and stress scenarios with shocks and application evidence. It is used to give typed
    definitions for risk calculation, monitoring, limit checking, breach governance, and stress testing. The
    audit-grade reproducibility model (digest-pinned implementation, frozen input context, complete bucket closure,
    deterministic evaluation) is an optional high-assurance profile rather than a universal precondition, so that
    preliminary, data-quality-limited, revised, and non-closure results are expressible. Market, credit, liquidity,
    operational, concentration, and model risk are extensible risk categories; full regulatory frameworks (FRTB,
    BCBS 239 aggregation, model-risk governance) are explicitly out of scope and exposed only as
    terminology-calibration alignments, not hardcoded rules.
  cnNote: >-
    风险模块，是金融领域模块，提供风险管理的通用语义核心——风险类别、来源、因子、暴露、范围、偏好与承受力；风险度量
    规格、计算画像与实现版本；风险度量观察与已验证可重放度量；带比较策略与治理生命周期的风险限额规则；限额评估、
    突破事实与突破案例治理；以及带冲击与应用证据的压力情景。旨在为风险计算、监控、限额检查、突破治理与压力测试提供
    类型化定义。审计级可复现模型（摘要锁实现、冻结输入上下文、完整分桶闭包、确定性评估）是可选高保证画像而非通用前提，
    使初步、数据质量受限、修订与非闭包结果可被表达。市场、信用、流动性、操作、集中度与模型风险为可扩展风险类别；
    完整监管框架（FRTB、BCBS 239 聚合、模型风险治理）显式不在范围内，仅作为术语校准对齐暴露而非硬编码规则。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-data
    - moduleIri: https://axiolune.ai/ontology/finance/portfolio-positions
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    RiskCategory:
      iri: https://axiolune.ai/ontology/finance/risk/RiskCategory
      namespace: fin-risk
      localName: RiskCategory
      label: Risk Category
      definition: >-
        A Risk Category, is a classification of the kind of risk being managed, used to distinguish market, credit,
        liquidity, operational, concentration, model, and other extensible risk families so that measures, limits,
        exposures, and scenarios can be categorized rather than treated as undifferentiated risk. Full regulatory
        frameworks per category are explicitly out of scope; the category is a typed tag, not a rule set.
      cnNote: 风险类别，是所管理风险类型的分类，用于区分市场、信用、流动性、操作、集中度、模型等可扩展风险族，使度量、限额、暴露与情景可被归类而非视为无差别风险。各类别下的完整监管框架显式不在范围内；类别是类型化标签而非规则集。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskCategoryValue
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskCategoryName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskSource:
      iri: https://axiolune.ai/ontology/finance/risk/RiskSource
      namespace: fin-risk
      localName: RiskSource
      label: Risk Source
      definition: >-
        A Risk Source, is an identifiable origin or driver of risk that belongs to one Risk Category, used to state
        what gives rise to a risk independently of how it is measured, so that risk can be attributed to its cause
        rather than only to its numeric result.
      cnNote: 风险来源，是属于某一风险类别的可识别风险起因或驱动，用于独立于度量方式标明风险的成因，使风险可归因于原因而非仅归于数值结果。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskSourceId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskSourceName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskFactor:
      iri: https://axiolune.ai/ontology/finance/risk/RiskFactor
      namespace: fin-risk
      localName: RiskFactor
      label: Risk Factor
      definition: >-
        A Risk Factor, is an identifiable risk driver that a risk measure is sensitive to, used to state which factor
        universe moves a result independently of a single computed number. It is distinct from the strategy-research
        FactorDefinition (a research signal generator); a RiskFactor is a risk-management concept and references a
        research factor only optionally via riskFactorResearchRef.
      cnNote: 风险因子，是风险度量所敏感的可识别风险驱动，用于独立于单一计算数值标明哪个因子集合驱动结果。它与 strategy-research 的 FactorDefinition（研究信号生成器）不同；风险因子是风险管理概念，仅可选地通过 riskFactorResearchRef 引用研究因子。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskFactorId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskFactorName
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskFactorResearchRef
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskScopeDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/RiskScopeDefinition
      namespace: fin-risk
      localName: RiskScopeDefinition
      label: Risk Scope Definition
      definition: >-
        A Risk Scope Definition, is a policy or business scope (desk, strategy, legal entity, fund, counterparty,
        netting set, asset class, or combination) that a risk limit is anchored to, used to express scope as a stable
        governance object rather than as an ad-hoc per-measurement tuple. It is distinct from a RiskScopeSnapshot,
        which freezes the concrete members at an as-of.
      cnNote: 风险范围定义，是风险限额所锚定的政策或业务范围（台、策略、法律实体、基金、对手方、净额集、资产类别或其组合），用于将范围表达为稳定治理对象而非临时单次度量元组。它与在某时点冻结具体成员的风险范围快照不同。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskScopeId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskScopeKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskScopeDescription
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskAppetite:
      iri: https://axiolune.ai/ontology/finance/risk/RiskAppetite
      namespace: fin-risk
      localName: RiskAppetite
      label: Risk Appetite
      definition: >-
        A Risk Appetite, is a governance statement of the total amount and type of risk an institution is willing to
        bear, used to anchor risk tolerance and limits to an explicit preference object that may carry both
        quantitative limits and qualitative statements, so that hard-to-quantify risk is not silently dropped.
      cnNote: 风险偏好，是机构愿意承担的风险总量与类型的治理陈述，用于把风险承受力与限额锚定到显式偏好对象，使难以量化的风险不被静默丢弃；可同时携带量化限额与定性陈述。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskAppetiteId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskAppetiteStatement
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskAppetiteQuantitativeRef
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskTolerance:
      iri: https://axiolune.ai/ontology/finance/risk/RiskTolerance
      namespace: fin-risk
      localName: RiskTolerance
      label: Risk Tolerance
      definition: >-
        A Risk Tolerance, is the tolerable variation around a Risk Appetite, used to separate the willingness to bear
        risk from the tolerable deviation before escalation, so that appetite and tolerance are not conflated into a
        single threshold.
      cnNote: 风险承受力，是风险偏好周围可容忍的偏离，用于把承担风险的意愿与升级前的可容忍偏离分开，使偏好与承受力不被混为单一阈值。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskToleranceId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskToleranceBasis
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskToleranceMagnitude
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskMeasureSpecification:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureSpecification
      namespace: fin-risk
      localName: RiskMeasureSpecification
      label: Risk Measure Specification
      definition: >-
        A Risk Measure Specification, is the business semantics of a risk measure — its measure kind (VaR, ES,
        sensitivity, PFE, liquidity gap, concentration, probability, ratio, capital requirement, other), model
        purpose, loss convention, aggregation method, risk-factor universe, and valuation method — used to anchor
        limits to a stable business concept so that a code upgrade does not implicitly force every business limit to
        be re-approved. It is distinct from CalculationProfile (the method/parameters) and ImplementationVersion
        (the executable + digest).
      cnNote: 风险度量规格，是风险度量的业务语义——度量种类（VaR、ES、敏感度、PFE、流动性缺口、集中度、概率、比率、资本需求、其他）、模型目的、损失约定、聚合方法、风险因子集合与估值方法——用于把限额锚定到稳定业务概念，使一次代码升级不会隐式迫使所有业务限额重新审批。它与计算画像（方法/参数）和实现版本（可执行+摘要）不同。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskMeasureSpecificationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskMeasureKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/modelPurpose
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/lossConvention
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/aggregationMethod
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/valuationMethodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskMeasureCategoryRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/measureSpecificationAuthority
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CalculationProfile:
      iri: https://axiolune.ai/ontology/finance/risk/CalculationProfile
      namespace: fin-risk
      localName: CalculationProfile
      label: Calculation Profile
      abstract: true
      definition: >-
        A Calculation Profile, is an abstract parent of calculation-method profiles that fixes the method, parameters,
        and assumptions used to compute a risk measure, used as the generic semantic core so that a specific method is
        one concrete profile rather than the only universal calculation path. It is bound to a RiskMeasureSpecification
        and points at an ImplementationVersion for reproducibility.
      cnNote: 计算画像，是计算方法画像的抽象父，用于固定计算风险度量的方法、参数与假设，作为通用语义核心使具体方法成为其中一个画像而非唯一通用计算路径。它绑定到风险度量规格，并指向实现版本以支撑复现。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/calculationProfileId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/calculationProfileName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ImplementationVersion:
      iri: https://axiolune.ai/ontology/finance/risk/ImplementationVersion
      namespace: fin-risk
      localName: ImplementationVersion
      label: Implementation Version
      definition: >-
        An Implementation Version, is a versioned executable implementation of a calculation method together with its
        content digest, used to fix the true identity of the algorithm implementation by content fingerprint to
        support point-in-time reproducibility independently of a version label. This separates the executable from
        the methodology (RiskMeasureSpecification) and the method profile (CalculationProfile).
      cnNote: 实现版本，是计算方法的版本化可执行实现及其内容摘要，用于在版本标签之外以内容指纹固化算法实现的真实身份以支撑 PIT 复现。它把可执行实现与方法论（风险度量规格）和方法画像（计算画像）分开。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/implementationVersionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/implementationVersionLabel
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/implementationDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/implementationAuthority
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskDimension:
      iri: https://axiolune.ai/ontology/finance/risk/RiskDimension
      namespace: fin-risk
      localName: RiskDimension
      label: Risk Dimension
      definition: >-
        A Risk Dimension, is an interpretable dimension along which a bucketed risk result is sliced, used to upgrade
        a free-text bucketKey and a bare bucketDimensionRef into a typed, queryable object so that bucket alignment
        and comparison across measurements and limits are well-defined.
      cnNote: 风险维度，是分桶风险结果所沿切分的可解释维度，用于把自由文本分桶键与裸分桶维度引用升级为类型化可查询对象，使度量与限额间的桶对齐与比较有明确定义。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskDimensionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskDimensionName
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskDimensionFactorRef
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BucketDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/BucketDefinition
      namespace: fin-risk
      localName: BucketDefinition
      label: Bucket Definition
      definition: >-
        A Bucket Definition, is an interpretable definition of one bucket within a RiskBucketSchema, used to make a
        bucket key a typed object rather than an opaque string, so that key alignment, missing-bucket handling, and
        cross-granularity comparison between a measurement and a limit are unambiguous.
      cnNote: 桶定义，是分桶模式内一个桶的可解释定义，用于使分桶键成为类型化对象而非不透明字符串，使度量与限额间的键对齐、缺失桶处理与跨粒度比较无歧义。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketDefinitionKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketDefinitionLabel
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimitRule:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitRule
      namespace: fin-risk
      localName: RiskLimitRule
      label: Risk Limit Rule
      definition: >-
        A Risk Limit Rule, is the governed rule a risk limit enforces — an optional lower and/or upper threshold, a
        comparison operator and basis, a tolerance and rounding policy, a warning/soft/hard severity, and a lifecycle
        (effective/suspended/superseded) — used so that a limit is not hardcoded to a single upper bound and can express
        lower bounds, bands, absolute-value limits, two-sided sensitivities, utilization, concentration ratios, and
        temporary waivers. The single-value<=threshold comparison remains the first concrete profile.
      cnNote: 风险限额规则，是风险限额所执行的治理规则——可选下限和/或上限、比较算子与基准、容差与舍入策略、warning/soft/hard 严重度及生命周期（生效/暂停/替代）——使限额不被硬编码为单一上限，可表达下限、区间、绝对值限额、双侧敏感度、利用率、浓度比例与临时豁免。单值<=阈值比较仍是首个具体画像。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskLimitRuleId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/comparisonOperator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/comparisonBasis
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/lowerThresholdMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/upperThresholdMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/lowerThresholdQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/upperThresholdQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/limitSeverity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskLimitLifecycleStatus
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimitComparisonPolicy:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitComparisonPolicy
      namespace: fin-risk
      localName: RiskLimitComparisonPolicy
      label: Risk Limit Comparison Policy
      definition: >-
        A Risk Limit Comparison Policy, is the policy that governs how a bucketed or scalar measurement is compared
        against a bucketed or scalar limit — comparison operator, direction, per-bucket vs aggregate, key alignment,
        missing-bucket handling, tolerance, rounding, and unit/currency conversion — used so that bucket-set vs
        bucket-set comparison is well-defined rather than collapsing to a scalar value<=threshold rule.
      cnNote: 风险限额比较策略，是治理分桶或标量度量如何与分桶或标量限额比较的策略——比较算子、方向、逐桶 vs 聚合、键对齐、缺失桶处理、容差、舍入与单位/货币换算——使分桶集合对分桶集合比较有明确定义而非塌缩为标量值<=阈值规则。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/comparisonPolicyId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketComparisonMode
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/missingBucketHandling
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/comparisonTolerance
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/roundingPolicy
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/unitConversionPolicyRef
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ScenarioShock:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioShock
      namespace: fin-risk
      localName: ScenarioShock
      label: Scenario Shock
      definition: >-
        A Scenario Shock, is a typed shock applied to a shock target within a stress scenario, used to decompress the
        opaque shockParameterDigest into queryable shock parameters — shock type, target, magnitude, unit, and
        propagation rule — so that a scenario states what it shocks and how, not only that it has a digest.
      cnNote: 情景冲击，是压力情景中施加于冲击目标的类型化冲击，用于把不透明冲击参数摘要解压为可查询冲击参数——冲击类型、目标、幅度、单位与传播规则——使情景说明它冲击什么、如何冲击，而不仅是有个摘要。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioShockId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockType
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockMagnitude
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockUnit
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockPropagationRule
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskReport:
      iri: https://axiolune.ai/ontology/finance/risk/RiskReport
      namespace: fin-risk
      localName: RiskReport
      label: Risk Report
      definition: >-
        A Risk Report, is a report view over risk results — report as-of, audience, and sections — used to express the
        aggregation and reporting dimension that BCBS 239 emphasizes, distinct from the underlying computed results.
        Full BCBS 239 aggregation infrastructure is out of scope; this is a lightweight report-view hook.
      cnNote: 风险报告，是风险结果的报告视图——报告时点、受众与分节——用于表达 BCBS 239 所强调的聚合与报告维度，区别于底层计算结果。完整 BCBS 239 聚合基础设施不在范围内；这是轻量报告视图钩子。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskReportId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/reportAsOf
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/reportAudience
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskMeasureDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      namespace: fin-risk
      localName: RiskMeasureDefinition
      label: Risk Measure Definition
      definition: >-
        A Risk Measure Definition, is the retained compatibility binding of a RiskMeasureSpecification to a
        CalculationProfile and an ImplementationVersion that fixes the calculation method, parameterization, input
        and output contracts, and exactly one Money, Quantity, or bucket-schema result dimension independently of
        any computed result, used to bind a risk metric to a stable, reproducible recipe. Its IRI is retained for
        compatibility; the audit-grade digest/contract requirements (methodDigest, implementationDigest,
        inputContractDigest, outputContractDigest, source-artifact evidence) are mandatory only when the
        ValidatedReproducibleRiskMeasurement profile is active and are otherwise optional evidence, so that
        preliminary and data-quality-limited definitions remain expressible. New definitions should anchor business
        semantics on RiskMeasureSpecification and computation on CalculationProfile/ImplementationVersion.
      cnNote: 风险度量定义，是风险度量规格绑定到计算画像与实现版本的保留兼容绑定，用于独立于任何计算结果固定某一风险指标的计算方法、参数化、输入输出契约及唯一的金额、数量或分桶结果维度。其 IRI 为兼容保留；审计级摘要/契约要求（方法摘要、实现摘要、输入/输出契约摘要、源制品证据）仅在已验证可重放度量画像激活时强制，否则为可选证据，使初步与数据质量受限定义可被表达。新定义应把业务语义锚定于风险度量规格，把计算锚定于计算画像/实现版本。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskMeasureId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/definitionAuthority
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/methodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/methodVersion
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/methodDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/observationWindow
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/confidenceLevel
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskHorizon
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/samplingMethodRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/benchmarkRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/definitionUnit
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/riskMeasureKind
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/implementationDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/outputContractDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskBucketSchema:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      namespace: fin-risk
      localName: RiskBucketSchema
      label: Risk Bucket Schema
      definition: >-
        A Risk Bucket Schema, is a versioned schema for a bucketed risk result that fixes the bucket dimension, the
        admissible bucket-key contract, and the Quantity unit shared by all buckets, used to give a complete bucketed
        risk result a stable and reproducible structure
      cnNote: 风险分桶模式，是分桶风险结果的版本化结构定义，用于固定分桶维度、可接纳的分桶键契约以及所有桶值共享的数量单位。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketSchemaId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketDimensionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketKeyContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketUnit
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskBucketSet:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
      namespace: fin-risk
      localName: RiskBucketSet
      label: Risk Bucket Set
      definition: >-
        A Risk Bucket Set, is a versioned closure over the RiskBucketValue versions selected by this set version at a
        specified as-of and generating context that belong to one exact RiskBucketSchema version, used to prove a
        bucketed result is closed by means of an ordered-set digest and a successful completeness probe. A
        bucketSetPurpose attribute distinguishes a measurement-side result set from a limit-side schedule, so the
        same structure is not silently reused as both a value and a threshold. The closure-evidence requirements
        (bucketValueCount, bucketValueSetDigest, closureProbeRef/Digest, closureCompleted) are mandatory only when the
        ValidatedReproducibleRiskMeasurement profile is active; a preliminary bucket set may carry its members
        without a completed closure proof. Membership is frozen at the set version's as-of/context, not a
        context-free notion of "current".
      cnNote: 风险分桶集合，是某指定时点与生成上下文下由该集合版本所选、归属于某一精确分桶模式版本的风险分桶值版本构成的版本化闭包，用于以有序集合摘要和成功完整性探针证明分桶结果已封闭。bucketSetPurpose 属性区分度量侧结果集与限额侧计划，使同一结构不被静默同时用作值与阈值。闭包证据要求（分桶值计数、分桶值集合摘要、闭包探针引用/摘要、闭包完成）仅在已验证可重放度量画像激活时强制；初步分桶集合可携带成员而无完成闭包证明。成员身份在集合版本的时点/上下文冻结，而非无上下文的“当前”。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketSetId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketSetPurpose
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketValueCount
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketValueSetDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/closureProbeRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/closureProbeDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/closureCompleted
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ScenarioDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
      namespace: fin-risk
      localName: ScenarioDefinition
      label: Scenario Definition
      definition: >-
        A Scenario Definition, is a versioned specification of a stress or what-if scenario that fixes its shock
        parameters independently of any stress-test run or resulting measurement, used to make a scenario reusable and
        reproducible across multiple runs. It carries typed ScenarioShock members (shock type, target, magnitude,
        unit, propagation), a scenario category, a baseline-state reference, and a narrative, so that the scenario
        states what it shocks and how — not only that it has a digest. The shockParameterDigest is the digest of the
        canonical shock-parameter payload; the sourceArtifactDigest is the digest of the original source document,
        linked by an explicit extraction/canonicalization relation rather than a vague "matches" claim.
      cnNote: 情景定义，是压力测试或假设情景的版本化规格，用于独立于任何压力测试运行或其产生的度量固定冲击参数，使情景可跨运行复用复现。它携带类型化情景冲击成员（冲击类型、目标、幅度、单位、传播）、情景类别、基准状态引用与叙事，使情景说明它冲击什么、如何冲击——而非仅有个摘要。冲击参数摘要是规范化冲击参数载荷的摘要；源制品摘要是原始源文档的摘要，二者由显式抽取/规范化关系连接而非模糊的“匹配”声明。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioDefinitionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioAuthority
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioCategory
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/scenarioNarrative
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/baselineStateRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockParameterDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/shockCanonicalizationRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    RiskBucketValue:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketValue
      namespace: fin-risk
      localName: RiskBucketValue
      label: Risk Bucket Value
      definition: >-
        A Risk Bucket Value, is a temporal and provenanced scalar member of a complete risk bucket set that is identified
        within that set by an explicit dimension and bucket key, used to carry the measurement value for one bucket in the
        result
      cnNote: 风险分桶值，是完整分桶集合中一个带时间戳与来源的标量成员，用于在该集合内通过显式维度和分桶键唯一标识一个桶的度量值。
      participantRoles:
        - id: bucketValueSet
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
          minCount: 1
          maxCount: 1
          label: bucket value set
          definition: exact RiskBucketSet version whose closure contains this value version
        - id: bucketValueSchema
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
          minCount: 1
          maxCount: 1
          label: bucket value schema
          definition: exact RiskBucketSchema version copied from the governing set for executable validation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketValueDimensionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/bucketQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskMeasurement:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
      namespace: fin-risk
      localName: RiskMeasurement
      label: Risk Measurement
      definition: >-
        A Risk Measurement, is a point-in-time result for one exact risk-measure definition and at least one explicit
        portfolio, account, position, or RiskScopeSnapshot scope that carries exactly one Money, Quantity, or
        RiskBucketSet representation, used to record a computed risk number. A measurementStatus distinguishes
        preliminary, incomplete, revised, failed, estimated, and validated results, so non-audit-grade numbers are
        expressible; the strictly-prior input-context evidence (inputContextRef, inputContextRecordDigest,
        inputContextCompleted) is mandatory only when the ValidatedReproducibleRiskMeasurement profile is active.
        Optional roles link the result to its RiskMeasureSpecification, RiskInputSet, RiskCalculationContext,
        RiskScopeSnapshot, driving RiskFactor(s), and RiskExposure(s), so that "what drove the result" is queryable
        rather than hidden in a digest.
      cnNote: 风险度量，是某一精确度量定义与至少一个显式组合、账户、头寸或风险范围快照范围下的时点结果，携带唯一的金额、数量或分桶集合表示，用于记录计算出的风险数值。measurementStatus 区分初步、不完整、修订、失败、估计与已验证结果，使非审计级数值可被表达；严格先行输入上下文证据仅在已验证可重放度量画像激活时强制。可选角色把结果链接到其风险度量规格、风险输入集、风险计算上下文、风险范围快照、驱动的风险因子与风险暴露，使“什么驱动了结果”可查询而非藏在摘要中。
      participantRoles:
        - id: measurementDefinition
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
          minCount: 1
          maxCount: 1
          label: measurement definition
          definition: exact RiskMeasureDefinition version used to compute the result
        - id: measurementSpecification
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasureSpecification
          minCount: 0
          maxCount: 1
          label: measurement specification
          definition: optional exact RiskMeasureSpecification carrying the business semantics the result is an instance of
        - id: measurementScopeSnapshot
          range: https://axiolune.ai/ontology/finance/risk/RiskScopeSnapshot
          minCount: 0
          maxCount: 1
          label: measurement scope snapshot
          definition: optional exact RiskScopeSnapshot freezing the concrete scope members at the as-of
        - id: measurementInputSet
          range: https://axiolune.ai/ontology/finance/risk/RiskInputSet
          minCount: 0
          maxCount: 1
          label: measurement input set
          definition: optional exact RiskInputSet carrying the positions, market-data snapshots, curves, and parameters used
        - id: measurementCalculationContext
          range: https://axiolune.ai/ontology/finance/risk/RiskCalculationContext
          minCount: 0
          maxCount: 1
          label: measurement calculation context
          definition: optional exact RiskCalculationContext binding the input set to the run
        - id: measurementPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 0
          maxCount: 1
          label: measurement portfolio
          definition: optional logical Portfolio identity included in the measurement scope (legacy single-scope profile)
        - id: measurementAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: measurement account
          definition: optional logical FinancialAccount identity included in the measurement scope (legacy single-scope profile)
        - id: measurementPosition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: measurement position
          definition: optional exact PositionSnapshot version included in the measurement scope (legacy single-scope profile)
        - id: measurementMarketDataStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 0
          maxCount: 1
          label: measurement market data stream
          definition: optional exact source-locked MarketDataStream version used by the input context
        - id: measurementBucketSet
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
          minCount: 0
          maxCount: 1
          label: measurement bucket set
          definition: optional RiskBucketSet version selected by the bucket branch (purpose = measurement)
        - id: measurementRiskFactor
          range: https://axiolune.ai/ontology/finance/risk/RiskFactor
          minCount: 0
          maxCount: 1
          label: measurement risk factor
          definition: optional RiskFactor the result is sensitive to (use multiple bindings for a factor universe)
        - id: measurementRiskExposure
          range: https://axiolune.ai/ontology/finance/risk/RiskExposure
          minCount: 0
          maxCount: 1
          label: measurement risk exposure
          definition: optional RiskExposure the result measures
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/measuredMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/measuredQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/measurementStatus
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/inputContextRecordDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputContextCompleted
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimit:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimit
      namespace: fin-risk
      localName: RiskLimit
      label: Risk Limit
      definition: >-
        A Risk Limit, is an approved temporal and provenanced threshold fact that binds one exact RiskMeasureDefinition
        version, at least one explicit scope (a RiskScopeDefinition and/or legacy Portfolio/Account/Position), an owner,
        exactly one Money, Quantity, or bucket-set representation, and an optional RiskLimitRule and
        RiskLimitComparisonPolicy, used to set a governed risk threshold that subsequent measurements are evaluated
        against. The single-value upper threshold remains the first concrete profile; a RiskLimitRule generalizes to
        lower/upper bounds, bands, absolute-value, two-sided, utilization, and concentration limits. A lifecycle
        (effective/suspended/superseded) separates approval from effectiveness, and approvedBy is modeled as a typed
        Party role consistent with limitOwner rather than a bare uri.
      cnNote: 风险限额，是经批准的带时间戳与来源的阈值事实，用于绑定一个精确度量定义版本、至少一个显式范围（风险范围定义和/或遗留组合/账户/头寸）、一个责任主体、唯一的金额、数量或分桶集合表示，及可选的风险限额规则与风险限额比较策略，以设定后续度量所对照的治理阈值。单值上限仍是首个具体画像；风险限额规则泛化为下/上限、区间、绝对值、双侧、利用率与集中度限额。生命周期（生效/暂停/替代）把批准与生效分开，approvedBy 建模为类型化 Party 角色与 limitOwner 一致，而非裸 uri。
      participantRoles:
        - id: limitDefinition
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
          minCount: 1
          maxCount: 1
          label: limit definition
          definition: exact RiskMeasureDefinition version that fixes the threshold representation
        - id: limitSpecification
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasureSpecification
          minCount: 0
          maxCount: 1
          label: limit specification
          definition: optional exact RiskMeasureSpecification the limit is anchored to for business stability
        - id: limitScopeDefinition
          range: https://axiolune.ai/ontology/finance/risk/RiskScopeDefinition
          minCount: 0
          maxCount: 1
          label: limit scope definition
          definition: optional RiskScopeDefinition the limit is anchored to (policy/business scope)
        - id: limitRule
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitRule
          minCount: 0
          maxCount: 1
          label: limit rule
          definition: optional RiskLimitRule generalizing the single upper threshold to bounds/bands/lifecycle
        - id: limitComparisonPolicy
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitComparisonPolicy
          minCount: 0
          maxCount: 1
          label: limit comparison policy
          definition: optional RiskLimitComparisonPolicy governing bucket-vs-bucket comparison semantics
        - id: limitAppetite
          range: https://axiolune.ai/ontology/finance/risk/RiskAppetite
          minCount: 0
          maxCount: 1
          label: limit appetite
          definition: optional RiskAppetite the limit operationalizes
        - id: limitPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 0
          maxCount: 1
          label: limit portfolio
          definition: optional logical Portfolio identity included in the limit scope (legacy single-scope profile)
        - id: limitAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: limit account
          definition: optional logical FinancialAccount identity included in the limit scope (legacy single-scope profile)
        - id: limitPosition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: limit position
          definition: optional exact PositionSnapshot version included in the limit scope (legacy single-scope profile)
        - id: limitOwner
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: limit owner
          definition: logical Party identity accountable for the approved limit
        - id: approver
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: approver
          definition: optional logical Party that approved the limit version (typed form of approvedBy)
        - id: limitBucketSet
          range: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
          minCount: 0
          maxCount: 1
          label: limit bucket set
          definition: optional RiskBucketSet version selected by the bucket branch (purpose = limit)
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/limitId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/limitMoney
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/limitQuantity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvalDecisionRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvalDecisionDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvedBy
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/approvedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/effectiveAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/suspendedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/supersededBy
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimitEvaluation:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
      namespace: fin-risk
      localName: RiskLimitEvaluation
      label: Risk Limit Evaluation
      definition: >-
        A Risk Limit Evaluation, is an explicit deterministic conclusion for one exact RiskMeasurement version and one
        compatible exact RiskLimit version that represents withinLimit, breach, or indeterminate as a required code value
        rather than as an absence, used to make the outcome of comparing a measurement with its limit unambiguous and
        non-empty. Scope compatibility is defined by an explicit scopeMatchRule (exactMatch / approvedRollup / contains)
        rather than a vague "same scope", and a comparison policy role governs bucket-vs-bucket comparison. For the
        bucket branch the result is determined per the RiskLimitComparisonPolicy (per-bucket and/or aggregate, with key
        alignment, missing-bucket handling, tolerance, rounding, and unit/currency conversion) rather than a scalar
        value<=threshold. evaluatorDigest is mandatory only when the ValidatedReproducibleRiskMeasurement profile is
        active.
      cnNote: 风险限额评估，是针对一个精确度量版本与一个兼容精确限额版本的确定性结论，用于把限额内、突破或不确定表示为必填码值而非缺失。范围兼容性由显式 scopeMatchRule（精确匹配/已批准聚合/包含）定义，而非模糊的“同范围”；比较策略角色治理分桶对分桶比较。分桶分支下结果由风险限额比较策略（逐桶和/或聚合，含键对齐、缺失桶处理、容差、舍入与单位/货币换算）决定，而非标量值<=阈值。评估器摘要仅在已验证可重放度量画像激活时强制。
      participantRoles:
        - id: evaluatedMeasurement
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 1
          maxCount: 1
          label: evaluated measurement
          definition: exact RiskMeasurement version evaluated against the limit
        - id: evaluatedLimit
          range: https://axiolune.ai/ontology/finance/risk/RiskLimit
          minCount: 1
          maxCount: 1
          label: evaluated limit
          definition: exact compatible RiskLimit version used by the evaluation
        - id: evaluationComparisonPolicy
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitComparisonPolicy
          minCount: 0
          maxCount: 1
          label: evaluation comparison policy
          definition: optional RiskLimitComparisonPolicy governing the comparison (defaults to scalar value<=threshold)
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/evaluationResult
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/scopeMatchRule
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/evaluationReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/evaluatorDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LimitBreach:
      iri: https://axiolune.ai/ontology/finance/risk/LimitBreach
      namespace: fin-risk
      localName: LimitBreach
      label: Limit Breach
      definition: >-
        A Limit Breach, is an immutable breach fact that exists only for a breach evaluation and repeats that evaluation's
        exact measurement, exact limit, and generating context without introducing a second threshold or result truth,
        used to give a limit breach a single authoritative and traceable record
      cnNote: 限额突破，是仅在突破评估时存在的不可变违约事实，用于复述该评估的精确度量、精确限额及生成上下文而不引入第二个阈值或结果真值。
      participantRoles:
        - id: breachEvaluation
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
          minCount: 1
          maxCount: 1
          label: breach evaluation
          definition: exact RiskLimitEvaluation version whose result is breach
        - id: breachMeasurement
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 1
          maxCount: 1
          label: breach measurement
          definition: exact RiskMeasurement version copied from the evaluation
        - id: breachLimit
          range: https://axiolune.ai/ontology/finance/risk/RiskLimit
          minCount: 1
          maxCount: 1
          label: breach limit
          definition: exact RiskLimit version copied from the evaluation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    StressTestRun:
      iri: https://axiolune.ai/ontology/finance/risk/StressTestRun
      namespace: fin-risk
      localName: StressTestRun
      label: Stress Test Run
      definition: >-
        A Stress Test Run, is a completed stress test that applies one exact ScenarioDefinition version to a portfolio
        scope and records the output RiskMeasurement version produced by the run, used to bind the scenario, the shocked
        holdings, and the output result in a replayable way. It carries a run authority in its logical key, an exact
        RiskScopeSnapshot or RiskInputSet whose members were shocked, an optional baseline measurement, one or more
        stressed measurements, and a ScenarioApplicationEvidence role proving the output's input context was actually
        shocked by the scenario. The run's contract requires the output's generating context to equal the run's, the
        output's scope to match the stress scope, and the measure definition's scenarioRef to equal the run's exact
        ScenarioDefinition.
      cnNote: 压力测试运行，是将一个精确情景定义版本施加于投资组合范围并记录运行产出度量版本的完成压力测试，用于以可回放方式绑定情景、持仓冲击与输出结果。其逻辑键携带运行权威、被冲击成员的精确风险范围快照或风险输入集、可选基线度量、一个或多个受压度量，及证明输出输入上下文确被情景冲击的情景应用证据角色。运行合同要求输出生成上下文等于运行、输出范围匹配压力范围、度量定义的情景引用等于运行的精确情景定义。
      participantRoles:
        - id: stressRunScenario
          range: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
          minCount: 1
          maxCount: 1
          label: stress run scenario
          definition: exact ScenarioDefinition version whose shock parameters were applied
        - id: stressRunPortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 1
          maxCount: 1
          label: stress run portfolio
          definition: logical Portfolio identity whose holdings were shocked
        - id: stressRunScopeSnapshot
          range: https://axiolune.ai/ontology/finance/risk/RiskScopeSnapshot
          minCount: 0
          maxCount: 1
          label: stress run scope snapshot
          definition: optional exact RiskScopeSnapshot whose frozen members were shocked
        - id: stressRunInputSet
          range: https://axiolune.ai/ontology/finance/risk/RiskInputSet
          minCount: 0
          maxCount: 1
          label: stress run input set
          definition: optional exact RiskInputSet carrying the shocked positions and market data
        - id: stressRunBaseline
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 0
          maxCount: 1
          label: stress run baseline
          definition: optional exact baseline RiskMeasurement before the shock
        - id: stressRunOutput
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 1
          maxCount: 1
          label: stress run output
          definition: exact stressed RiskMeasurement version produced by the stress run
        - id: stressRunApplicationEvidence
          range: https://axiolune.ai/ontology/finance/risk/ScenarioApplicationEvidence
          minCount: 0
          maxCount: 1
          label: stress run application evidence
          definition: optional ScenarioApplicationEvidence proving the output input context was shocked by the scenario
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/stressRunId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/runAuthority
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskExposure:
      iri: https://axiolune.ai/ontology/finance/risk/RiskExposure
      namespace: fin-risk
      localName: RiskExposure
      label: Risk Exposure
      definition: >-
        A Risk Exposure, is the risk an institution bears at a scope to a risk factor or category with a magnitude kind,
        used to state "what risk is borne, driven by what, at which scope" independently of a single computed number, so
        that exposure is a first-class concept rather than an implicit by-product of a measurement.
      cnNote: 风险暴露，是机构在某范围下因某风险因子或类别而承担的、带幅度种类的风险，用于独立于单一计算数值标明“承担了什么风险、由什么驱动、在哪个范围”，使暴露成为一等概念而非度量的隐含副产品。
      participantRoles:
        - id: exposureScope
          range: https://axiolune.ai/ontology/finance/risk/RiskScopeSnapshot
          minCount: 0
          maxCount: 1
          label: exposure scope
          definition: optional RiskScopeSnapshot at which the exposure is borne
        - id: exposureFactor
          range: https://axiolune.ai/ontology/finance/risk/RiskFactor
          minCount: 0
          maxCount: 1
          label: exposure factor
          definition: optional RiskFactor driving the exposure
        - id: exposureCategory
          range: https://axiolune.ai/ontology/finance/risk/RiskCategory
          minCount: 0
          maxCount: 1
          label: exposure category
          definition: optional RiskCategory classifying the exposure
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskExposureId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/exposureMagnitudeKind
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskScopeSnapshot:
      iri: https://axiolune.ai/ontology/finance/risk/RiskScopeSnapshot
      namespace: fin-risk
      localName: RiskScopeSnapshot
      label: Risk Scope Snapshot
      definition: >-
        A Risk Scope Snapshot, is the frozen concrete members of a RiskScopeDefinition at an as-of together with the
        selection rules that produced them, used to bind a measurement to the exact scope version evaluated rather than
        a free-floating policy scope.
      cnNote: 风险范围快照，是某时点下风险范围定义的冻结具体成员及其选择规则，用于把度量绑定到所评估的精确范围版本而非自由浮动的政策范围。
      participantRoles:
        - id: snapshotScopeDefinition
          range: https://axiolune.ai/ontology/finance/risk/RiskScopeDefinition
          minCount: 1
          maxCount: 1
          label: snapshot scope definition
          definition: RiskScopeDefinition the snapshot freezes members of
        - id: snapshotScopePortfolio
          range: https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio
          minCount: 0
          maxCount: 1
          label: snapshot scope portfolio
          definition: optional logical Portfolio whose members the snapshot freezes at the as-of
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskScopeSnapshotId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/snapshotAsOf
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/snapshotSelectionRule
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/snapshotMemberDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskInputSet:
      iri: https://axiolune.ai/ontology/finance/risk/RiskInputSet
      namespace: fin-risk
      localName: RiskInputSet
      label: Risk Input Set
      definition: >-
        A Risk Input Set, is the collection of inputs a risk calculation used — multiple position snapshots, market-data
        snapshots, curves, volatility surfaces, FX rates, parameter sets, FX/valuation policy, and data-quality status
        — used to decompress the opaque inputContextRef/digest so that the actual inputs are queryable, with their
        valuation as-of, availability, and quality.
      cnNote: 风险输入集，是风险计算所使用输入的集合——多个头寸快照、市场数据快照、曲线、波动率面、汇率、参数集、FX/估值策略与数据质量状态——用于解压不透明输入上下文引用/摘要，使实际输入及其估值时点、可得性与质量可查询。
      participantRoles:
        - id: inputSetPosition
          range: https://axiolune.ai/ontology/finance/portfolio-positions/PositionSnapshot
          minCount: 0
          maxCount: 1
          label: input set position
          definition: optional exact PositionSnapshot version in the input set (use multiple bindings)
        - id: inputSetMarketDataStream
          range: https://axiolune.ai/ontology/finance/market-data/MarketDataStream
          minCount: 0
          maxCount: 1
          label: input set market data stream
          definition: optional exact MarketDataStream version in the input set (use multiple bindings)
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/riskInputSetId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputValuationAsOf
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputDataQualityStatus
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/inputParameterSetRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/fxPolicyRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/valuationPolicyRef
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskCalculationContext:
      iri: https://axiolune.ai/ontology/finance/risk/RiskCalculationContext
      namespace: fin-risk
      localName: RiskCalculationContext
      label: Risk Calculation Context
      definition: >-
        A Risk Calculation Context, is the binding of a RiskInputSet to a RiskCalculationRun, used to record that a
        particular run consumed a particular frozen input set, so that input-to-run linkage is explicit and queryable.
      cnNote: 风险计算上下文，是风险输入集到风险计算运行的绑定，用于记录某次运行消耗了某个冻结输入集，使输入到运行的链接显式可查询。
      participantRoles:
        - id: calcContextInputSet
          range: https://axiolune.ai/ontology/finance/risk/RiskInputSet
          minCount: 1
          maxCount: 1
          label: calc context input set
          definition: exact RiskInputSet bound to the run
        - id: calcContextRun
          range: https://axiolune.ai/ontology/finance/risk/RiskCalculationRun
          minCount: 0
          maxCount: 1
          label: calc context run
          definition: optional RiskCalculationRun the input set is bound to
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/calcContextId
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskCalculationRun:
      iri: https://axiolune.ai/ontology/finance/risk/RiskCalculationRun
      namespace: fin-risk
      localName: RiskCalculationRun
      label: Risk Calculation Run
      definition: >-
        A Risk Calculation Run, is the execution of a CalculationProfile/ImplementationVersion over a RiskInputSet that
        produces a RiskMeasurement, used to record "this run, these inputs, this output" so that a measurement is
        traceable to the run that produced it rather than only to a definition.
      cnNote: 风险计算运行，是对计算画像/实现版本在风险输入集上的执行并产出风险度量，用于记录“此运行、此输入、此输出”，使度量可追溯到产生它的运行而非仅定义。
      participantRoles:
        - id: calcRunProfile
          range: https://axiolune.ai/ontology/finance/risk/CalculationProfile
          minCount: 0
          maxCount: 1
          label: calc run profile
          definition: optional exact CalculationProfile version executed
        - id: calcRunImplementation
          range: https://axiolune.ai/ontology/finance/risk/ImplementationVersion
          minCount: 0
          maxCount: 1
          label: calc run implementation
          definition: optional exact ImplementationVersion executed
        - id: calcRunInputSet
          range: https://axiolune.ai/ontology/finance/risk/RiskInputSet
          minCount: 0
          maxCount: 1
          label: calc run input set
          definition: optional exact RiskInputSet consumed
        - id: calcRunOutput
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 0
          maxCount: 1
          label: calc run output
          definition: optional exact RiskMeasurement produced
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/calcRunId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RiskLimitBreachCase:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCase
      namespace: fin-risk
      localName: RiskLimitBreachCase
      label: Risk Limit Breach Case
      definition: >-
        A Risk Limit Breach Case, is the governance case opened for a LimitBreach — carrying breach magnitude,
        duration, responsible party, and a workflow status — used to separate the immutable computational breach fact
        from its governance disposition, so that a breach has a case, acknowledgements, waivers, remediation, and
        escalations rather than a single fact.
      cnNote: 风险限额突破案例，是为限额突破开启的治理案例——携带突破幅度、持续时间、责任方与工作流状态——用于把不可变计算突破事实与其治理处置分开，使突破有案例、确认、豁免、整改与升级而非单一事实。
      participantRoles:
        - id: breachCaseBreach
          range: https://axiolune.ai/ontology/finance/risk/LimitBreach
          minCount: 1
          maxCount: 1
          label: breach case breach
          definition: exact LimitBreach the case is opened for
        - id: breachCaseResponsible
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: breach case responsible
          definition: optional Party responsible for disposition
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/breachCaseId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/breachMagnitude
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/breachDuration
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/breachCaseStatus
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BreachAcknowledgement:
      iri: https://axiolune.ai/ontology/finance/risk/BreachAcknowledgement
      namespace: fin-risk
      localName: BreachAcknowledgement
      label: Breach Acknowledgement
      definition: >-
        A Breach Acknowledgement, is the acknowledgement of a RiskLimitBreachCase by a Party, used to record that a
        breach was seen and accepted into governance rather than remaining an unattended computed fact.
      cnNote: 突破确认，是某主体对风险限额突破案例的确认，用于记录突破已被看到并纳入治理而非停留在无人处理的计算事实。
      participantRoles:
        - id: acknowledgedCase
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCase
          minCount: 1
          maxCount: 1
          label: acknowledged case
          definition: exact RiskLimitBreachCase acknowledged
        - id: acknowledgingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: acknowledging party
          definition: Party acknowledging the breach case
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/acknowledgementId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/acknowledgedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LimitWaiver:
      iri: https://axiolune.ai/ontology/finance/risk/LimitWaiver
      namespace: fin-risk
      localName: LimitWaiver
      label: Limit Waiver
      definition: >-
        A Limit Waiver, is a temporary or permanent exception granted for a RiskLimitBreachCase, used to record that a
        breach was formally waived with a kind, rationale, approver, and expiry rather than silently tolerated.
      cnNote: 限额豁免，是对风险限额突破案例授予的临时或永久例外，用于记录突破已被正式豁免并附种类、理由、审批者与到期，而非静默容忍。
      participantRoles:
        - id: waiverCase
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCase
          minCount: 1
          maxCount: 1
          label: waiver case
          definition: exact RiskLimitBreachCase the waiver applies to
        - id: waiverApprover
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: waiver approver
          definition: Party approving the waiver
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/waiverId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/waiverKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/waiverRationale
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/waiverExpiry
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    RemediationAction:
      iri: https://axiolune.ai/ontology/finance/risk/RemediationAction
      namespace: fin-risk
      localName: RemediationAction
      label: Remediation Action
      definition: >-
        A Remediation Action, is an action taken to remediate a RiskLimitBreachCase — reducing exposure, adjusting the
        limit, or correcting data — used to record what was done, by whom, and with what evidence, so that a breach has
        a remediation chain rather than only a conclusion.
      cnNote: 整改行动，是为整改风险限额突破案例所采取的行动——降低暴露、调整限额或纠正数据——用于记录做了什么、由谁做、附什么证据，使突破有整改链而非仅结论。
      participantRoles:
        - id: remediationCase
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCase
          minCount: 1
          maxCount: 1
          label: remediation case
          definition: exact RiskLimitBreachCase remediated
        - id: remediationActor
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: remediation actor
          definition: optional Party performing the remediation
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/remediationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/remediationKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/remediationEvidence
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    EscalationEvent:
      iri: https://axiolune.ai/ontology/finance/risk/EscalationEvent
      namespace: fin-risk
      localName: EscalationEvent
      label: Escalation Event
      definition: >-
        An Escalation Event, is the escalation of a RiskLimitBreachCase to a higher governance level, used to record
        that a breach was escalated with a level, target, and time, so that breach governance has an escalation chain.
      cnNote: 升级事件，是风险限额突破案例向更高治理层级的升级，用于记录突破已升级并附层级、目标与时间，使突破治理有升级链。
      participantRoles:
        - id: escalationCase
          range: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCase
          minCount: 1
          maxCount: 1
          label: escalation case
          definition: exact RiskLimitBreachCase escalated
        - id: escalatedTo
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: escalated to
          definition: optional Party the escalation is directed to
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/escalationId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/escalationLevel
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/escalationTarget
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/escalatedAt
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ScenarioApplicationEvidence:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioApplicationEvidence
      namespace: fin-risk
      localName: ScenarioApplicationEvidence
      label: Scenario Application Evidence
      definition: >-
        A Scenario Application Evidence, is the evidence that a stress-test output's input context was actually
        shocked by the run's exact ScenarioDefinition — binding the scenario, the input set, and the output — used to
        prove the scenario was applied rather than merely referenced, so that a stress run demonstrates the scenario
        acted on the output.
      cnNote: 情景应用证据，是证明压力测试输出输入上下文确被运行精确情景定义冲击的证据——绑定情景、输入集与输出——用于证明情景被实际施加而非仅被引用，使压力运行证明情景作用于输出。
      participantRoles:
        - id: applicationScenario
          range: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
          minCount: 1
          maxCount: 1
          label: application scenario
          definition: exact ScenarioDefinition applied
        - id: applicationInputSet
          range: https://axiolune.ai/ontology/finance/risk/RiskInputSet
          minCount: 0
          maxCount: 1
          label: application input set
          definition: optional exact RiskInputSet that was shocked
        - id: applicationOutput
          range: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
          minCount: 0
          maxCount: 1
          label: application output
          definition: optional exact RiskMeasurement produced under the shock
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/risk/applicationEvidenceId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/risk/applicationProofDigest
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    definitionCurrency:
      iri: https://axiolune.ai/ontology/finance/risk/definitionCurrency
      namespace: fin-risk
      localName: definitionCurrency
      label: Definition Currency
      definition: The Definition Currency, is an optional Money-branch Currency logical identity that is fixed by a
        RiskMeasureDefinition version, used to specify the currency in which a money-valued risk result is denominated
      cnNote: 定义币种，是风险度量定义版本所固定的可选金额分支货币逻辑标识，用于在金额结果分支下指定度量结果计价的货币。
      domain: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    definitionBucketSchema:
      iri: https://axiolune.ai/ontology/finance/risk/definitionBucketSchema
      namespace: fin-risk
      localName: definitionBucketSchema
      label: Definition Bucket Schema
      definition: The Definition Bucket Schema, is an optional bucket-branch RiskBucketSchema version that is fixed by a
        RiskMeasureDefinition, used to bind a bucketed risk result to the bucket structure it must conform to
      cnNote: 定义分桶模式，是风险度量定义所固定的可选分桶分支模式版本，用于在分桶结果分支下绑定度量结果所遵循的桶结构。
      domain: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      range: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      characteristics:
        - functional
    bucketSetSchema:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSetSchema
      namespace: fin-risk
      localName: bucketSetSchema
      label: Bucket Set Schema
      definition: The Bucket Set Schema, is the exact RiskBucketSchema version that governs one complete RiskBucketSet
        version, used to ensure that every bucket value in the set shares the same dimension, key contract, and unit
      cnNote: 分桶集合模式，是支配某一完整分桶集合版本的精确分桶模式版本，用于确保集合内所有桶值共享同一维度、键契约与单位。
      domain: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
      range: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      characteristics:
        - functional
    measureSpecificationProfile:
      iri: https://axiolune.ai/ontology/finance/risk/measureSpecificationProfile
      namespace: fin-risk
      localName: measureSpecificationProfile
      label: Measure Specification Profile
      definition: The Measure Specification Profile, is the CalculationProfile bound to a RiskMeasureSpecification,
        used to bind business semantics to a concrete calculation method profile.
      cnNote: 度量规格画像，是绑定到风险度量规格的计算画像，用于把业务语义绑定到具体计算方法画像。
      domain: https://axiolune.ai/ontology/finance/risk/RiskMeasureSpecification
      range: https://axiolune.ai/ontology/finance/risk/CalculationProfile
      characteristics:
        - functional
    calculationProfileImplementation:
      iri: https://axiolune.ai/ontology/finance/risk/calculationProfileImplementation
      namespace: fin-risk
      localName: calculationProfileImplementation
      label: Calculation Profile Implementation
      definition: The Calculation Profile Implementation, is the ImplementationVersion bound to a CalculationProfile,
        used to bind a method profile to the exact executable implementation that realizes it.
      cnNote: 计算画像实现，是绑定到计算画像的实现版本，用于把方法画像绑定到实现它的精确可执行实现。
      domain: https://axiolune.ai/ontology/finance/risk/CalculationProfile
      range: https://axiolune.ai/ontology/finance/risk/ImplementationVersion
      characteristics:
        - functional
    scenarioShockMember:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioShockMember
      namespace: fin-risk
      localName: scenarioShockMember
      label: Scenario Shock Member
      definition: The Scenario Shock Member, is a ScenarioShock that belongs to a ScenarioDefinition, used to give a
        scenario typed, queryable shock members rather than an opaque digest.
      cnNote: 情景冲击成员，是属于情景定义的情景冲击，用于给情景类型化可查询冲击成员而非不透明摘要。
      domain: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
      range: https://axiolune.ai/ontology/finance/risk/ScenarioShock
      characteristics: []
    shockTargetFactor:
      iri: https://axiolune.ai/ontology/finance/risk/shockTargetFactor
      namespace: fin-risk
      localName: shockTargetFactor
      label: Shock Target Factor
      definition: The Shock Target Factor, is the RiskFactor targeted by a ScenarioShock, used to state which factor a
        shock acts on.
      cnNote: 冲击目标因子，是情景冲击所作用的风险因子，用于标明冲击作用于哪个因子。
      domain: https://axiolune.ai/ontology/finance/risk/ScenarioShock
      range: https://axiolune.ai/ontology/finance/risk/RiskFactor
      characteristics:
        - functional
    bucketSchemaDimension:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSchemaDimension
      namespace: fin-risk
      localName: bucketSchemaDimension
      label: Bucket Schema Dimension
      definition: The Bucket Schema Dimension, is the typed RiskDimension that a RiskBucketSchema slices along, used
        to upgrade the bare bucketDimensionRef into a typed, queryable dimension.
      cnNote: 分桶模式维度，是分桶模式所沿切分的类型化风险维度，用于把裸分桶维度引用升级为类型化可查询维度。
      domain: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      range: https://axiolune.ai/ontology/finance/risk/RiskDimension
      characteristics:
        - functional
    bucketSchemaBucketDefinition:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSchemaBucketDefinition
      namespace: fin-risk
      localName: bucketSchemaBucketDefinition
      label: Bucket Schema Bucket Definition
      definition: The Bucket Schema Bucket Definition, is a typed BucketDefinition admitted by a RiskBucketSchema, used
        to upgrade free-text bucket keys into typed, interpretable bucket objects.
      cnNote: 分桶模式桶定义，是分桶模式所接纳的类型化桶定义，用于把自由文本分桶键升级为类型化可解释桶对象。
      domain: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      range: https://axiolune.ai/ontology/finance/risk/BucketDefinition
      characteristics: []
    riskSourceCategory:
      iri: https://axiolune.ai/ontology/finance/risk/riskSourceCategory
      namespace: fin-risk
      localName: riskSourceCategory
      label: Risk Source Category
      definition: The Risk Source Category, is the RiskCategory a RiskSource belongs to, used to classify a source by
        the kind of risk it gives rise to.
      cnNote: 风险来源类别，是风险来源所属的风险类别，用于按其所致风险种类对来源分类。
      domain: https://axiolune.ai/ontology/finance/risk/RiskSource
      range: https://axiolune.ai/ontology/finance/risk/RiskCategory
      characteristics:
        - functional
    riskFactorCategory:
      iri: https://axiolune.ai/ontology/finance/risk/riskFactorCategory
      namespace: fin-risk
      localName: riskFactorCategory
      label: Risk Factor Category
      definition: The Risk Factor Category, is the RiskCategory a RiskFactor belongs to, used to classify a factor by
        the kind of risk it drives.
      cnNote: 风险因子类别，是风险因子所属的风险类别，用于按其驱动风险种类对因子分类。
      domain: https://axiolune.ai/ontology/finance/risk/RiskFactor
      range: https://axiolune.ai/ontology/finance/risk/RiskCategory
      characteristics:
        - functional
  attributeTypes:
    riskMeasureId:
      iri: https://axiolune.ai/ontology/finance/risk/riskMeasureId
      namespace: fin-risk
      localName: riskMeasureId
      label: Risk Measure ID
      definition: The Risk Measure ID, is an authority-scoped stable lexical identifier of a risk-measure definition,
        used to index one risk-measure specification uniquely while its definition version stays immutable
      cnNote: 风险度量标识，是风险度量定义的权威作用域稳定词法标识符，用于在该定义版本不可变的前提下唯一索引一条风险度量规格。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    methodRef:
      iri: https://axiolune.ai/ontology/finance/risk/methodRef
      namespace: fin-risk
      localName: methodRef
      label: Method Reference
      definition: The Method Reference, is an absolute reference that identifies the declared calculation method, used
        to point a risk-measure definition at the algorithmic source it depends on
      cnNote: 方法引用，是标识所声明计算方法的绝对引用，用于把风险度量定义指向其依赖的算法实现来源。
      valueType: uri
    methodVersion:
      iri: https://axiolune.ai/ontology/finance/risk/methodVersion
      namespace: fin-risk
      localName: methodVersion
      label: Method Version
      definition: The Method Version, is an immutable version label of the declared calculation method, used to pin
        the exact algorithm version a measure definition references when the method is iterated
      cnNote: 方法版本，是所声明计算方法的不可变版本标签，用于在方法迭代时精确锁定度量定义所引用的算法版本。
      valueType: string
    methodDigest:
      iri: https://axiolune.ai/ontology/finance/risk/methodDigest
      namespace: fin-risk
      localName: methodDigest
      label: Method Digest
      definition: The Method Digest, is the SHA-256 digest of the method specification selected by the definition, used
        to fix the true identity of the algorithm implementation by content fingerprint beyond a version label
      cnNote: 方法摘要，是度量定义所选方法规格的 SHA-256 摘要，用于在版本标签之外以内容指纹固化算法实现的真实身份。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    observationWindow:
      iri: https://axiolune.ai/ontology/finance/risk/observationWindow
      namespace: fin-risk
      localName: observationWindow
      label: Observation Window
      definition: The Observation Window, is an optional Quantity-valued historical observation window that is used by
        the method, used to bound the historical data span on which a risk measure is based
      cnNote: 观测窗口，是方法所使用的可选数量型历史观测窗口，用于界定风险度量所依据的历史数据时间跨度。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    confidenceLevel:
      iri: https://axiolune.ai/ontology/finance/risk/confidenceLevel
      namespace: fin-risk
      localName: confidenceLevel
      label: Confidence Level
      definition: The Confidence Level, is an optional dimensionless Quantity confidence level that is required by a
        statistical risk measure, used to express the probability that a result falls within a stated interval
      cnNote: 置信水平，是统计性风险度量所需的可选无量纲数量置信度，用于表示度量结果落在某区间内的概率保证。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    riskHorizon:
      iri: https://axiolune.ai/ontology/finance/risk/riskHorizon
      namespace: fin-risk
      localName: riskHorizon
      label: Risk Horizon
      definition: The Risk Horizon, is an optional duration Quantity over which the risk result is interpreted, used to
        state the future time length a measurement covers
      cnNote: 风险期限，是风险结果赖以解释的可选持续时间数量，用于标明度量所覆盖的未来时间长度。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    samplingMethodRef:
      iri: https://axiolune.ai/ontology/finance/risk/samplingMethodRef
      namespace: fin-risk
      localName: samplingMethodRef
      label: Sampling Method Reference
      definition: The Sampling Method Reference, is an optional absolute reference to the sampling or resampling
        contract, used to point a measure definition at the data-sampling rules it depends on
      cnNote: 抽样方法引用，是抽样或重抽样契约的可选绝对引用，用于把度量定义指向其依赖的数据抽样规则来源。
      valueType: uri
    benchmarkRef:
      iri: https://axiolune.ai/ontology/finance/risk/benchmarkRef
      namespace: fin-risk
      localName: benchmarkRef
      label: Benchmark Reference
      definition: The Benchmark Reference, is an optional absolute reference to the benchmark version used by the
        measure, used to bind a risk measure to the benchmark it is measured against
      cnNote: 基准引用，是度量所使用基准版本的可选绝对引用，用于把风险度量绑定到其参照的基准标的来源。
      valueType: uri
    scenarioRef:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioRef
      namespace: fin-risk
      localName: scenarioRef
      label: Scenario Reference
      definition: The Scenario Reference, is an optional absolute reference to the scenario version used by the
        measure, used to bind a risk measure to the stress or what-if scenario it is based on
      cnNote: 情景引用，是度量所使用情景版本的可选绝对引用，用于把风险度量绑定到其依据的压力或假设情景来源。
      valueType: uri
    scenarioDefinitionId:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioDefinitionId
      namespace: fin-risk
      localName: scenarioDefinitionId
      label: Scenario Definition ID
      definition: The Scenario Definition ID, is an authority-scoped stable lexical identifier of a stress scenario
        definition, used to index one scenario specification uniquely while its definition version stays immutable
      cnNote: 情景定义标识，是压力情景定义的权威作用域稳定词法标识符，用于在该定义版本不可变的前提下唯一索引一条情景规格。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    shockParameterDigest:
      iri: https://axiolune.ai/ontology/finance/risk/shockParameterDigest
      namespace: fin-risk
      localName: shockParameterDigest
      label: Shock Parameter Digest
      definition: The Shock Parameter Digest, is the SHA-256 digest of the canonical shock-parameter payload for the
        scenario, used to fix the true content of a scenario's shock parameters by content fingerprint
      cnNote: 冲击参数摘要，是情景规范化冲击参数载荷的 SHA-256 摘要，用于以内容指纹固化情景冲击参数集的真实内容。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    stressRunId:
      iri: https://axiolune.ai/ontology/finance/risk/stressRunId
      namespace: fin-risk
      localName: stressRunId
      label: Stress Run ID
      definition: The Stress Run ID, is an authority-scoped stable lexical identifier of one stress test run, used to
        index one stress-test execution record uniquely once the run completes
      cnNote: 压力测试运行标识，是一次压力测试运行的权威作用域稳定词法标识符，用于在该运行完成时唯一索引一条压力测试执行记录。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    definitionUnit:
      iri: https://axiolune.ai/ontology/finance/risk/definitionUnit
      namespace: fin-risk
      localName: definitionUnit
      label: Definition Unit
      definition: The Definition Unit, is an optional Quantity-branch unit IRI that is fixed by a RiskMeasureDefinition
        version, used to specify the unit of measure for a quantity-valued risk result
      cnNote: 定义单位，是风险度量定义版本所固定的可选数量分支单位 IRI，用于在数量结果分支下指定度量结果的计量单位。
      valueType: uri
    implementationDigest:
      iri: https://axiolune.ai/ontology/finance/risk/implementationDigest
      namespace: fin-risk
      localName: implementationDigest
      label: Implementation Digest
      definition: The Implementation Digest, is the SHA-256 digest of the executable implementation selected by the
        definition, used to fix the true identity of the algorithm implementation by content fingerprint to support
        point-in-time reproducibility
      cnNote: 实现摘要，是度量定义所选可执行实现的 SHA-256 摘要，用于以内容指纹固化算法实现的真实身份以支撑 PIT 复现。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    inputContractDigest:
      iri: https://axiolune.ai/ontology/finance/risk/inputContractDigest
      namespace: fin-risk
      localName: inputContractDigest
      label: Input Contract Digest
      definition: The Input Contract Digest, is the SHA-256 digest of the canonical risk-model input contract, used to
        fix the input data structure a measure definition declares by content fingerprint
      cnNote: 输入契约摘要，是规范化风险模型输入契约的 SHA-256 摘要，用于以内容指纹固化度量定义所声明的输入数据结构。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    outputContractDigest:
      iri: https://axiolune.ai/ontology/finance/risk/outputContractDigest
      namespace: fin-risk
      localName: outputContractDigest
      label: Output Contract Digest
      definition: The Output Contract Digest, is the SHA-256 digest of the canonical risk-model output contract, used
        to fix the output result structure a measure definition declares by content fingerprint
      cnNote: 输出契约摘要，是规范化风险模型输出契约的 SHA-256 摘要，用于以内容指纹固化度量定义所声明的输出结果结构。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    bucketSchemaId:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSchemaId
      namespace: fin-risk
      localName: bucketSchemaId
      label: Bucket Schema ID
      definition: The Bucket Schema ID, is a stable lexical identifier of a risk bucket schema, used to index one
        bucket-structure specification uniquely while its schema version stays immutable
      cnNote: 分桶模式标识，是风险分桶模式的稳定词法标识符，用于在该模式版本不可变的前提下唯一索引一条分桶结构规格。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    bucketDimensionRef:
      iri: https://axiolune.ai/ontology/finance/risk/bucketDimensionRef
      namespace: fin-risk
      localName: bucketDimensionRef
      label: Bucket Dimension Reference
      definition: The Bucket Dimension Reference, is an absolute reference that identifies the dimension partitioned by
        the bucket schema, used to state which risk dimension a bucketed result is sliced along
      cnNote: 分桶维度引用，是标识分桶模式所划分维度的绝对引用，用于指明分桶结果沿哪一个风险维度进行切分。
      valueType: uri
    bucketKeyContractDigest:
      iri: https://axiolune.ai/ontology/finance/risk/bucketKeyContractDigest
      namespace: fin-risk
      localName: bucketKeyContractDigest
      label: Bucket Key Contract Digest
      definition: The Bucket Key Contract Digest, is the SHA-256 digest of the canonical bucket-key set and ordering
        contract, used to fix the admissible set and order of bucket keys by content fingerprint
      cnNote: 分桶键契约摘要，是规范化分桶键集合与排序契约的 SHA-256 摘要，用于以内容指纹固化分桶键的可接纳集合与顺序。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    bucketUnit:
      iri: https://axiolune.ai/ontology/finance/risk/bucketUnit
      namespace: fin-risk
      localName: bucketUnit
      label: Bucket Unit
      definition: The Bucket Unit, is a Quantity unit IRI that is shared by every scalar value governed by the bucket
        schema, used to ensure all buckets in one bucket set are measured in a consistent unit
      cnNote: 分桶单位，是分桶模式所辖所有标量值共享的数量单位 IRI，用于确保同一分桶集合内所有桶值以一致单位计量。
      valueType: uri
    bucketSetId:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSetId
      namespace: fin-risk
      localName: bucketSetId
      label: Bucket Set ID
      definition: The Bucket Set ID, is a generating-context-scoped stable lexical identifier of a bucket set, used
        to index one complete bucketed result uniquely once the set is closed
      cnNote: 分桶集合标识，是分桶集合的生成上下文作用域稳定词法标识符，用于在该集合完成时唯一索引一条完整分桶结果。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    bucketValueCount:
      iri: https://axiolune.ai/ontology/finance/risk/bucketValueCount
      namespace: fin-risk
      localName: bucketValueCount
      label: Bucket Value Count
      definition: The Bucket Value Count, is the exact count of current RiskBucketValue versions in the completed
        closure, used to prove a bucket set contains every current bucket value without omission
      cnNote: 分桶值计数，是完成闭包中当前分桶值版本的精确数量，用于证明分桶集合已包含全部当前桶值且无遗漏。
      valueType: integer
    bucketValueSetDigest:
      iri: https://axiolune.ai/ontology/finance/risk/bucketValueSetDigest
      namespace: fin-risk
      localName: bucketValueSetDigest
      label: Bucket Value Set Digest
      definition: The Bucket Value Set Digest, is the SHA-256 digest of the canonical ordered set of current bucket-value
        version IRIs, used to fix the reproducible snapshot of set membership by content fingerprint
      cnNote: 分桶值集合摘要，是规范化有序当前分桶值版本 IRI 集合的 SHA-256 摘要，用于以内容指纹固化集合成员身份的可复现快照。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    closureProbeRef:
      iri: https://axiolune.ai/ontology/finance/risk/closureProbeRef
      namespace: fin-risk
      localName: closureProbeRef
      label: Closure Probe Reference
      definition: The Closure Probe Reference, is an absolute reference to the executable completeness probe invocation,
        used to point at the execution record that proves a bucket set's membership is complete
      cnNote: 闭包探针引用，是可执行完整性探针调用的绝对引用，用于指向证明分桶集合成员身份完整性的执行记录。
      valueType: uri
    closureProbeDigest:
      iri: https://axiolune.ai/ontology/finance/risk/closureProbeDigest
      namespace: fin-risk
      localName: closureProbeDigest
      label: Closure Probe Digest
      definition: The Closure Probe Digest, is the SHA-256 digest of the executable closure probe and its frozen
        parameters, used to fix the true identity of the completeness probe by content fingerprint
      cnNote: 闭包探针摘要，是可执行闭包探针及其冻结参数的 SHA-256 摘要，用于以内容指纹固化完整性探针的真实身份。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    closureCompleted:
      iri: https://axiolune.ai/ontology/finance/risk/closureCompleted
      namespace: fin-risk
      localName: closureCompleted
      label: Closure Completed
      definition: The Closure Completed flag, is a boolean that is true only when the exact bucket-membership closure
        probe completed successfully, used to declare explicitly that a bucket set's membership has been verified as
        closed
      cnNote: 闭包完成标志，是仅在精确分桶成员身份闭包探针成功完成时为真的布尔值，用于显式声明分桶集合的成员身份已验证封闭。
      valueType: boolean
    bucketKey:
      iri: https://axiolune.ai/ontology/finance/risk/bucketKey
      namespace: fin-risk
      localName: bucketKey
      label: Bucket Key
      definition: The Bucket Key, is a canonical non-blank key that identifies one member within a bucket schema, used
        to distinguish the measurement value of different buckets within a bucket set
      cnNote: 分桶键，是在分桶模式内唯一标识一个成员的规范化非空白键，用于在分桶集合中区分不同桶的度量值。
      valueType: string
      pattern: ^\S(?:.*\S)?$
    bucketValueDimensionRef:
      iri: https://axiolune.ai/ontology/finance/risk/bucketValueDimensionRef
      namespace: fin-risk
      localName: bucketValueDimensionRef
      label: Bucket Value Dimension Reference
      definition: The Bucket Value Dimension Reference, is a dimension reference copied from the exact governing
        RiskBucketSchema version, used to keep a bucket value dimensionally consistent with its schema at the value level
      cnNote: 分桶值维度引用，是从支配分桶模式精确版本复制而来的维度引用，用于在桶值级别与所属模式保持维度一致。
      valueType: uri
    bucketQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/bucketQuantity
      namespace: fin-risk
      localName: bucketQuantity
      label: Bucket Quantity
      definition: The Bucket Quantity, is a required structured Quantity scalar for one risk bucket, used to carry that
        bucket's measured value along the bucket dimension
      cnNote: 分桶数量，是一个风险桶所需的规范化结构化数量标量，用于承载该桶在分桶维度上的度量结果值。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    measuredMoney:
      iri: https://axiolune.ai/ontology/finance/risk/measuredMoney
      namespace: fin-risk
      localName: measuredMoney
      label: Measured Money
      definition: The Measured Money, is an optional canonical Money result that is selected by the measurement value
        xone, used to carry the monetary value of a risk measurement on the money result branch
      cnNote: 度量金额，是度量值互斥分支所选的可选规范化金额结果，用于在金额结果分支下承载风险度量的货币数值。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
    measuredQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/measuredQuantity
      namespace: fin-risk
      localName: measuredQuantity
      label: Measured Quantity
      definition: The Measured Quantity, is an optional canonical Quantity result that is selected by the measurement
        value xone, used to carry the non-monetary value of a risk measurement on the quantity result branch
      cnNote: 度量数量，是度量值互斥分支所选的可选规范化数量结果，用于在数量结果分支下承载风险度量的非货币数值。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    inputContextCompleted:
      iri: https://axiolune.ai/ontology/finance/risk/inputContextCompleted
      namespace: fin-risk
      localName: inputContextCompleted
      label: Input Context Completed
      definition: The Input Context Completed flag, is a boolean that is true only when the strictly prior input-context
        record is complete and immutable, used to declare explicitly that a measurement's inputs are frozen and
        reproducible
      cnNote: 输入上下文完成标志，是仅在严格先行输入上下文记录完整且不可变时为真的布尔值，用于显式声明度量所依赖的输入已冻结可复现。
      valueType: boolean
    limitId:
      iri: https://axiolune.ai/ontology/finance/risk/limitId
      namespace: fin-risk
      localName: limitId
      label: Limit ID
      definition: The Limit ID, is an owner-scoped stable lexical identifier of a risk limit, used to index one
        limit-threshold fact uniquely after the limit version is approved
      cnNote: 限额标识，是风险限额的属主作用域稳定词法标识符，用于在该限额版本经批准后唯一索引一条限额阈值事实。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    limitMoney:
      iri: https://axiolune.ai/ontology/finance/risk/limitMoney
      namespace: fin-risk
      localName: limitMoney
      label: Limit Money
      definition: The Limit Money, is an optional canonical Money threshold that is selected by the limit value xone,
        used to carry the monetary upper bound of a risk limit on the money threshold branch
      cnNote: 限额金额，是限额值互斥分支所选的可选规范化金额阈值，用于在金额阈值分支下承载风险限额的货币上限。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
    limitQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/limitQuantity
      namespace: fin-risk
      localName: limitQuantity
      label: Limit Quantity
      definition: The Limit Quantity, is an optional canonical Quantity threshold that is selected by the limit value
        xone, used to carry the non-monetary upper bound of a risk limit on the quantity threshold branch
      cnNote: 限额数量，是限额值互斥分支所选的可选规范化数量阈值，用于在数量阈值分支下承载风险限额的非货币上限。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    approvalDecisionRef:
      iri: https://axiolune.ai/ontology/finance/risk/approvalDecisionRef
      namespace: fin-risk
      localName: approvalDecisionRef
      label: Approval Decision Reference
      definition: The Approval Decision Reference, is an absolute immutable reference to the human or governed
        limit-approval decision, used to bind a risk limit to the formal approval record it came from
      cnNote: 批准决策引用，是人工或治理限额批准决策的绝对不可变引用，用于把风险限额绑定到其正式审批记录来源。
      valueType: uri
    approvalDecisionDigest:
      iri: https://axiolune.ai/ontology/finance/risk/approvalDecisionDigest
      namespace: fin-risk
      localName: approvalDecisionDigest
      label: Approval Decision Digest
      definition: The Approval Decision Digest, is the SHA-256 digest of the exact limit-approval decision record, used
        to fix the true content of an approval decision by content fingerprint to support audit traceability
      cnNote: 批准决策摘要，是精确限额批准决策记录的 SHA-256 摘要，用于以内容指纹固化审批决策的真实内容以支撑审计可追溯。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    approvedBy:
      iri: https://axiolune.ai/ontology/finance/risk/approvedBy
      namespace: fin-risk
      localName: approvedBy
      label: Approved By
      definition: The Approved By, is an absolute principal IRI that approved the limit version, used to identify the
        governance entity accountable for approving the risk threshold
      cnNote: 批准主体，是批准该限额版本的主体的绝对 IRI，用于标明对限额阈值承担审批责任的治理实体。
      valueType: uri
    approvedAt:
      iri: https://axiolune.ai/ontology/finance/risk/approvedAt
      namespace: fin-risk
      localName: approvedAt
      label: Approved At
      definition: The Approved At, is an explicit-timezone instant at which the limit version was approved, used to
        record the approval point in time at which a risk limit takes effect with a deterministic timestamp
      cnNote: 批准时刻，是该限额版本被批准的带显式时区时刻，用于以确定性时间戳记录限额生效的批准时点。
      valueType: instant
    evaluationResult:
      iri: https://axiolune.ai/ontology/finance/risk/evaluationResult
      namespace: fin-risk
      localName: evaluationResult
      label: Evaluation Result
      definition: The Evaluation Result, is a required closed result code of a risk-limit evaluation, used to express a
        withinLimit, breach, or indeterminate conclusion as a definite code value rather than as an absence
      cnNote: 评估结果，是风险限额评估的必填封闭结果码值，用于以确定码值而非缺失表示限额内、突破或不确定的结论。
      valueType: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult
    evaluationReason:
      iri: https://axiolune.ai/ontology/finance/risk/evaluationReason
      namespace: fin-risk
      localName: evaluationReason
      label: Evaluation Reason
      definition: The Evaluation Reason, is an optional deterministic reason that explains an indeterminate evaluation,
        used to state why the evidence was insufficient to reach a withinLimit or breach conclusion
      cnNote: 评估理由，是解释不确定评估的可选确定性理由，用于在无法得出限额内或突破结论时说明证据受限的原因。
      valueType: string
    evaluatorDigest:
      iri: https://axiolune.ai/ontology/finance/risk/evaluatorDigest
      namespace: fin-risk
      localName: evaluatorDigest
      label: Evaluator Digest
      definition: The Evaluator Digest, is the SHA-256 digest of the executable comparison implementation, used to fix
        the true identity of the measurement-to-limit comparison algorithm by content fingerprint
      cnNote: 评估器摘要，是可执行比较实现的 SHA-256 摘要，用于以内容指纹固化度量与限额比较算法的真实身份。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    riskCategoryValue:
      iri: https://axiolune.ai/ontology/finance/risk/riskCategoryValue
      namespace: fin-risk
      localName: riskCategoryValue
      label: Risk Category Value
      definition: The Risk Category Value, is a closed classification value of the kind of risk, used to categorize
        measures, limits, exposures, and scenarios.
      cnNote: 风险类别值，是风险种类的封闭分类取值，用于归类度量、限额、暴露与情景。
      valueType: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue
    riskCategoryName:
      iri: https://axiolune.ai/ontology/finance/risk/riskCategoryName
      namespace: fin-risk
      localName: riskCategoryName
      label: Risk Category Name
      definition: The Risk Category Name, is an optional human-readable name of a RiskCategory.
      cnNote: 风险类别名称，是风险类别的可选可读名称。
      valueType: string
    riskSourceId:
      iri: https://axiolune.ai/ontology/finance/risk/riskSourceId
      namespace: fin-risk
      localName: riskSourceId
      label: Risk Source ID
      definition: The Risk Source ID, is a stable lexical identifier of a RiskSource.
      cnNote: 风险来源标识，是风险来源的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskSourceName:
      iri: https://axiolune.ai/ontology/finance/risk/riskSourceName
      namespace: fin-risk
      localName: riskSourceName
      label: Risk Source Name
      definition: The Risk Source Name, is an optional human-readable name of a RiskSource.
      cnNote: 风险来源名称，是风险来源的可选可读名称。
      valueType: string
    riskFactorId:
      iri: https://axiolune.ai/ontology/finance/risk/riskFactorId
      namespace: fin-risk
      localName: riskFactorId
      label: Risk Factor ID
      definition: The Risk Factor ID, is a stable lexical identifier of a RiskFactor.
      cnNote: 风险因子标识，是风险因子的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskFactorName:
      iri: https://axiolune.ai/ontology/finance/risk/riskFactorName
      namespace: fin-risk
      localName: riskFactorName
      label: Risk Factor Name
      definition: The Risk Factor Name, is an optional human-readable name of a RiskFactor.
      cnNote: 风险因子名称，是风险因子的可选可读名称。
      valueType: string
    riskFactorResearchRef:
      iri: https://axiolune.ai/ontology/finance/risk/riskFactorResearchRef
      namespace: fin-risk
      localName: riskFactorResearchRef
      label: Risk Factor Research Reference
      definition: The Risk Factor Research Reference, is an optional reference to a strategy-research FactorDefinition
        when a risk factor corresponds to a research signal generator, used to keep risk-management and research factor
        concepts distinct while allowing cross-linking.
      cnNote: 风险因子研究引用，是当风险因子对应某研究信号生成器时对 strategy-research FactorDefinition 的可选引用，用于在保持风险管理因子与研究因子概念区分的同时允许交叉链接。
      valueType: uri
    riskScopeId:
      iri: https://axiolune.ai/ontology/finance/risk/riskScopeId
      namespace: fin-risk
      localName: riskScopeId
      label: Risk Scope ID
      definition: The Risk Scope ID, is a stable lexical identifier of a RiskScopeDefinition.
      cnNote: 风险范围标识，是风险范围定义的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskScopeKind:
      iri: https://axiolune.ai/ontology/finance/risk/riskScopeKind
      namespace: fin-risk
      localName: riskScopeKind
      label: Risk Scope Kind
      definition: The Risk Scope Kind, is the kind of business scope (desk, strategy, legal entity, fund, counterparty,
        netting set, asset class, or combination).
      cnNote: 风险范围种类，是业务范围的种类（台、策略、法律实体、基金、对手方、净额集、资产类别或组合）。
      valueType: string
    riskScopeDescription:
      iri: https://axiolune.ai/ontology/finance/risk/riskScopeDescription
      namespace: fin-risk
      localName: riskScopeDescription
      label: Risk Scope Description
      definition: The Risk Scope Description, is an optional human-readable description of a RiskScopeDefinition.
      cnNote: 风险范围描述，是风险范围定义的可选可读描述。
      valueType: string
    riskScopeSnapshotId:
      iri: https://axiolune.ai/ontology/finance/risk/riskScopeSnapshotId
      namespace: fin-risk
      localName: riskScopeSnapshotId
      label: Risk Scope Snapshot ID
      definition: The Risk Scope Snapshot ID, is a stable lexical identifier of a RiskScopeSnapshot.
      cnNote: 风险范围快照标识，是风险范围快照的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    snapshotAsOf:
      iri: https://axiolune.ai/ontology/finance/risk/snapshotAsOf
      namespace: fin-risk
      localName: snapshotAsOf
      label: Snapshot As Of
      definition: The Snapshot As Of, is the as-of time at which a RiskScopeSnapshot freezes the scope members.
      cnNote: 快照时点，是风险范围快照冻结范围成员的时点。
      valueType: instant
    snapshotSelectionRule:
      iri: https://axiolune.ai/ontology/finance/risk/snapshotSelectionRule
      namespace: fin-risk
      localName: snapshotSelectionRule
      label: Snapshot Selection Rule
      definition: The Snapshot Selection Rule, is the rule that selected the members of a RiskScopeSnapshot.
      cnNote: 快照选择规则，是选取风险范围快照成员的规则。
      valueType: string
    snapshotMemberDigest:
      iri: https://axiolune.ai/ontology/finance/risk/snapshotMemberDigest
      namespace: fin-risk
      localName: snapshotMemberDigest
      label: Snapshot Member Digest
      definition: The Snapshot Member Digest, is the SHA-256 digest of the canonical member set of a RiskScopeSnapshot.
      cnNote: 快照成员摘要，是风险范围快照规范化成员集合的 SHA-256 摘要。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
    riskAppetiteId:
      iri: https://axiolune.ai/ontology/finance/risk/riskAppetiteId
      namespace: fin-risk
      localName: riskAppetiteId
      label: Risk Appetite ID
      definition: The Risk Appetite ID, is a stable lexical identifier of a RiskAppetite.
      cnNote: 风险偏好标识，是风险偏好的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskAppetiteStatement:
      iri: https://axiolune.ai/ontology/finance/risk/riskAppetiteStatement
      namespace: fin-risk
      localName: riskAppetiteStatement
      label: Risk Appetite Statement
      definition: The Risk Appetite Statement, is a qualitative statement of the risk an institution is willing to bear.
      cnNote: 风险偏好陈述，是机构愿意承担风险的定性陈述。
      valueType: string
    riskAppetiteQuantitativeRef:
      iri: https://axiolune.ai/ontology/finance/risk/riskAppetiteQuantitativeRef
      namespace: fin-risk
      localName: riskAppetiteQuantitativeRef
      label: Risk Appetite Quantitative Reference
      definition: The Risk Appetite Quantitative Reference, is an optional reference to the quantitative limits
        operationalizing a RiskAppetite.
      cnNote: 风险偏好量化引用，是对使风险偏好可操作化的量化限额的可选引用。
      valueType: uri
    riskToleranceId:
      iri: https://axiolune.ai/ontology/finance/risk/riskToleranceId
      namespace: fin-risk
      localName: riskToleranceId
      label: Risk Tolerance ID
      definition: The Risk Tolerance ID, is a stable lexical identifier of a RiskTolerance.
      cnNote: 风险承受力标识，是风险承受力的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskToleranceBasis:
      iri: https://axiolune.ai/ontology/finance/risk/riskToleranceBasis
      namespace: fin-risk
      localName: riskToleranceBasis
      label: Risk Tolerance Basis
      definition: The Risk Tolerance Basis, is the basis on which a RiskTolerance is expressed.
      cnNote: 风险承受力基准，是风险承受力所依据的基准。
      valueType: string
    riskToleranceMagnitude:
      iri: https://axiolune.ai/ontology/finance/risk/riskToleranceMagnitude
      namespace: fin-risk
      localName: riskToleranceMagnitude
      label: Risk Tolerance Magnitude
      definition: The Risk Tolerance Magnitude, is the magnitude of tolerable variation around a RiskAppetite.
      cnNote: 风险承受力幅度，是风险偏好周围可容忍偏离的幅度。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    riskMeasureSpecificationId:
      iri: https://axiolune.ai/ontology/finance/risk/riskMeasureSpecificationId
      namespace: fin-risk
      localName: riskMeasureSpecificationId
      label: Risk Measure Specification ID
      definition: The Risk Measure Specification ID, is a stable lexical identifier of a RiskMeasureSpecification.
      cnNote: 风险度量规格标识，是风险度量规格的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskMeasureKind:
      iri: https://axiolune.ai/ontology/finance/risk/riskMeasureKind
      namespace: fin-risk
      localName: riskMeasureKind
      label: Risk Measure Kind
      definition: The Risk Measure Kind, is the kind of risk measure (VaR, ES, sensitivity, PFE, liquidity gap,
        concentration, probability, ratio, capital requirement, other), used to make a measure's business kind
        queryable rather than hidden in a method reference.
      cnNote: 风险度量种类，是风险度量的种类（VaR、ES、敏感度、PFE、流动性缺口、集中度、概率、比率、资本需求、其他），用于使度量的业务种类可查询而非藏在方法引用中。
      valueType: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind
    modelPurpose:
      iri: https://axiolune.ai/ontology/finance/risk/modelPurpose
      namespace: fin-risk
      localName: modelPurpose
      label: Model Purpose
      definition: The Model Purpose, is the intended use of the risk model (regulatory capital, internal limit
        monitoring, economic capital, stress, disclosure).
      cnNote: 模型目的，是风险模型的预期用途（监管资本、内部限额监控、经济资本、压力、披露）。
      valueType: string
    lossConvention:
      iri: https://axiolune.ai/ontology/finance/risk/lossConvention
      namespace: fin-risk
      localName: lossConvention
      label: Loss Convention
      definition: The Loss Convention, is how the result expresses loss (loss-as-positive, gain-as-positive,
        absolute value, net exposure, probability, ratio).
      cnNote: 损失约定，是结果表达损失的方式（损失为正、收益为正、绝对值、净敞口、概率、比率）。
      valueType: string
    aggregationMethod:
      iri: https://axiolune.ai/ontology/finance/risk/aggregationMethod
      namespace: fin-risk
      localName: aggregationMethod
      label: Aggregation Method
      definition: The Aggregation Method, is how risk is aggregated from position to portfolio/desk/entity/group
        (sum, variance-covariance, historical simulation, Monte Carlo, other).
      cnNote: 聚合方法，是风险从头寸聚合到组合/台/实体/集团的方式（求和、方差-协方差、历史模拟、蒙特卡洛、其他）。
      valueType: string
    valuationMethodRef:
      iri: https://axiolune.ai/ontology/finance/risk/valuationMethodRef
      namespace: fin-risk
      localName: valuationMethodRef
      label: Valuation Method Reference
      definition: The Valuation Method Reference, is an optional reference to the valuation method used by the measure.
      cnNote: 估值方法引用，是度量所使用估值方法的可选引用。
      valueType: uri
    riskMeasureCategoryRef:
      iri: https://axiolune.ai/ontology/finance/risk/riskMeasureCategoryRef
      namespace: fin-risk
      localName: riskMeasureCategoryRef
      label: Risk Measure Category Reference
      definition: The Risk Measure Category Reference, is an optional reference to the RiskCategory a measure belongs to.
      cnNote: 风险度量类别引用，是度量所属风险类别的可选引用。
      valueType: uri
    measureSpecificationAuthority:
      iri: https://axiolune.ai/ontology/finance/risk/measureSpecificationAuthority
      namespace: fin-risk
      localName: measureSpecificationAuthority
      label: Measure Specification Authority
      definition: The Measure Specification Authority, is the authority that scopes a RiskMeasureSpecification's
        identity, used to prevent identifier collisions across institutions.
      cnNote: 度量规格权威，是界定风险度量规格身份的权威，用于防止跨机构标识符碰撞。
      valueType: uri
    definitionAuthority:
      iri: https://axiolune.ai/ontology/finance/risk/definitionAuthority
      namespace: fin-risk
      localName: definitionAuthority
      label: Definition Authority
      definition: The Definition Authority, is the authority that scopes a RiskMeasureDefinition's identity, used to
        prevent identifier collisions across institutions.
      cnNote: 定义权威，是界定风险度量定义身份的权威，用于防止跨机构标识符碰撞。
      valueType: uri
    scenarioAuthority:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioAuthority
      namespace: fin-risk
      localName: scenarioAuthority
      label: Scenario Authority
      definition: The Scenario Authority, is the authority that scopes a ScenarioDefinition's identity.
      cnNote: 情景权威，是界定情景定义身份的权威。
      valueType: uri
    runAuthority:
      iri: https://axiolune.ai/ontology/finance/risk/runAuthority
      namespace: fin-risk
      localName: runAuthority
      label: Run Authority
      definition: The Run Authority, is the authority that scopes a StressTestRun's identity.
      cnNote: 运行权威，是界定压力测试运行身份的权威。
      valueType: uri
    calculationProfileId:
      iri: https://axiolune.ai/ontology/finance/risk/calculationProfileId
      namespace: fin-risk
      localName: calculationProfileId
      label: Calculation Profile ID
      definition: The Calculation Profile ID, is a stable lexical identifier of a CalculationProfile.
      cnNote: 计算画像标识，是计算画像的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    calculationProfileName:
      iri: https://axiolune.ai/ontology/finance/risk/calculationProfileName
      namespace: fin-risk
      localName: calculationProfileName
      label: Calculation Profile Name
      definition: The Calculation Profile Name, is an optional human-readable name of a CalculationProfile.
      cnNote: 计算画像名称，是计算画像的可选可读名称。
      valueType: string
    implementationVersionId:
      iri: https://axiolune.ai/ontology/finance/risk/implementationVersionId
      namespace: fin-risk
      localName: implementationVersionId
      label: Implementation Version ID
      definition: The Implementation Version ID, is a stable lexical identifier of an ImplementationVersion.
      cnNote: 实现版本标识，是实现版本的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    implementationVersionLabel:
      iri: https://axiolune.ai/ontology/finance/risk/implementationVersionLabel
      namespace: fin-risk
      localName: implementationVersionLabel
      label: Implementation Version Label
      definition: The Implementation Version Label, is the immutable version label of an ImplementationVersion.
      cnNote: 实现版本标签，是实现版本的不可变版本标签。
      valueType: string
    implementationAuthority:
      iri: https://axiolune.ai/ontology/finance/risk/implementationAuthority
      namespace: fin-risk
      localName: implementationAuthority
      label: Implementation Authority
      definition: The Implementation Authority, is the authority that scopes an ImplementationVersion's identity.
      cnNote: 实现权威，是界定实现版本身份的权威。
      valueType: uri
    riskDimensionId:
      iri: https://axiolune.ai/ontology/finance/risk/riskDimensionId
      namespace: fin-risk
      localName: riskDimensionId
      label: Risk Dimension ID
      definition: The Risk Dimension ID, is a stable lexical identifier of a RiskDimension.
      cnNote: 风险维度标识，是风险维度的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskDimensionName:
      iri: https://axiolune.ai/ontology/finance/risk/riskDimensionName
      namespace: fin-risk
      localName: riskDimensionName
      label: Risk Dimension Name
      definition: The Risk Dimension Name, is an optional human-readable name of a RiskDimension.
      cnNote: 风险维度名称，是风险维度的可选可读名称。
      valueType: string
    riskDimensionFactorRef:
      iri: https://axiolune.ai/ontology/finance/risk/riskDimensionFactorRef
      namespace: fin-risk
      localName: riskDimensionFactorRef
      label: Risk Dimension Factor Reference
      definition: The Risk Dimension Factor Reference, is an optional reference to the RiskFactor a dimension
        partitions, used to tie a bucket dimension to its driving factor.
      cnNote: 风险维度因子引用，是对维度所划分风险因子的可选引用，用于把分桶维度绑定到其驱动因子。
      valueType: uri
    bucketDefinitionId:
      iri: https://axiolune.ai/ontology/finance/risk/bucketDefinitionId
      namespace: fin-risk
      localName: bucketDefinitionId
      label: Bucket Definition ID
      definition: The Bucket Definition ID, is a stable lexical identifier of a BucketDefinition.
      cnNote: 桶定义标识，是桶定义的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    bucketDefinitionKey:
      iri: https://axiolune.ai/ontology/finance/risk/bucketDefinitionKey
      namespace: fin-risk
      localName: bucketDefinitionKey
      label: Bucket Definition Key
      definition: The Bucket Definition Key, is the canonical non-blank key identifying a bucket within a schema.
      cnNote: 桶定义键，是在模式内标识桶的规范化非空白键。
      valueType: string
      pattern: ^\S(?:.*\S)?$
    bucketDefinitionLabel:
      iri: https://axiolune.ai/ontology/finance/risk/bucketDefinitionLabel
      namespace: fin-risk
      localName: bucketDefinitionLabel
      label: Bucket Definition Label
      definition: The Bucket Definition Label, is an optional human-readable label of a BucketDefinition.
      cnNote: 桶定义标签，是桶定义的可选可读标签。
      valueType: string
    bucketSetPurpose:
      iri: https://axiolune.ai/ontology/finance/risk/bucketSetPurpose
      namespace: fin-risk
      localName: bucketSetPurpose
      label: Bucket Set Purpose
      definition: The Bucket Set Purpose, distinguishes a measurement-side bucket result set from a limit-side bucket
        schedule, used so the same structure is not silently reused as both a value and a threshold.
      cnNote: 分桶集合用途，区分度量侧分桶结果集与限额侧分桶计划，使同一结构不被静默同时用作值与阈值。
      valueType: https://axiolune.ai/ontology/finance/risk/BucketSetPurpose
    measurementStatus:
      iri: https://axiolune.ai/ontology/finance/risk/measurementStatus
      namespace: fin-risk
      localName: measurementStatus
      label: Measurement Status
      definition: The Measurement Status, is the status of a risk measurement (preliminary, incomplete, revised,
        failed, estimated, validated), used so non-audit-grade results are expressible.
      cnNote: 度量状态，是风险度量的状态（初步、不完整、修订、失败、估计、已验证），使非审计级结果可被表达。
      valueType: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus
    riskExposureId:
      iri: https://axiolune.ai/ontology/finance/risk/riskExposureId
      namespace: fin-risk
      localName: riskExposureId
      label: Risk Exposure ID
      definition: The Risk Exposure ID, is a stable lexical identifier of a RiskExposure.
      cnNote: 风险暴露标识，是风险暴露的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    exposureMagnitudeKind:
      iri: https://axiolune.ai/ontology/finance/risk/exposureMagnitudeKind
      namespace: fin-risk
      localName: exposureMagnitudeKind
      label: Exposure Magnitude Kind
      definition: The Exposure Magnitude Kind, is the kind of magnitude a RiskExposure carries (notional, market value,
        delta, present value, other).
      cnNote: 暴露幅度种类，是风险暴露所承载幅度的种类（名义、市值、delta、现值、其他）。
      valueType: string
    riskInputSetId:
      iri: https://axiolune.ai/ontology/finance/risk/riskInputSetId
      namespace: fin-risk
      localName: riskInputSetId
      label: Risk Input Set ID
      definition: The Risk Input Set ID, is a stable lexical identifier of a RiskInputSet.
      cnNote: 风险输入集标识，是风险输入集的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    inputValuationAsOf:
      iri: https://axiolune.ai/ontology/finance/risk/inputValuationAsOf
      namespace: fin-risk
      localName: inputValuationAsOf
      label: Input Valuation As Of
      definition: The Input Valuation As Of, is the valuation as-of time of the inputs in a RiskInputSet.
      cnNote: 输入估值时点，是风险输入集中输入的估值时点。
      valueType: instant
    inputDataQualityStatus:
      iri: https://axiolune.ai/ontology/finance/risk/inputDataQualityStatus
      namespace: fin-risk
      localName: inputDataQualityStatus
      label: Input Data Quality Status
      definition: The Input Data Quality Status, is the data-quality status of a RiskInputSet (complete, partial,
        stale, missing, uncertain).
      cnNote: 输入数据质量状态，是风险输入集的数据质量状态（完整、部分、过期、缺失、不确定）。
      valueType: string
    inputParameterSetRef:
      iri: https://axiolune.ai/ontology/finance/risk/inputParameterSetRef
      namespace: fin-risk
      localName: inputParameterSetRef
      label: Input Parameter Set Reference
      definition: The Input Parameter Set Reference, is an optional reference to the parameter set used.
      cnNote: 输入参数集引用，是所用参数集的可选引用。
      valueType: uri
    fxPolicyRef:
      iri: https://axiolune.ai/ontology/finance/risk/fxPolicyRef
      namespace: fin-risk
      localName: fxPolicyRef
      label: FX Policy Reference
      definition: The FX Policy Reference, is an optional reference to the FX conversion policy applied to inputs.
      cnNote: FX 策略引用，是对输入所施 FX 换算策略的可选引用。
      valueType: uri
    valuationPolicyRef:
      iri: https://axiolune.ai/ontology/finance/risk/valuationPolicyRef
      namespace: fin-risk
      localName: valuationPolicyRef
      label: Valuation Policy Reference
      definition: The Valuation Policy Reference, is an optional reference to the valuation policy applied to inputs.
      cnNote: 估值策略引用，是对输入所施估值策略的可选引用。
      valueType: uri
    calcContextId:
      iri: https://axiolune.ai/ontology/finance/risk/calcContextId
      namespace: fin-risk
      localName: calcContextId
      label: Calculation Context ID
      definition: The Calculation Context ID, is a stable lexical identifier of a RiskCalculationContext.
      cnNote: 计算上下文标识，是风险计算上下文的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    calcRunId:
      iri: https://axiolune.ai/ontology/finance/risk/calcRunId
      namespace: fin-risk
      localName: calcRunId
      label: Calculation Run ID
      definition: The Calculation Run ID, is a stable lexical identifier of a RiskCalculationRun.
      cnNote: 计算运行标识，是风险计算运行的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    riskLimitRuleId:
      iri: https://axiolune.ai/ontology/finance/risk/riskLimitRuleId
      namespace: fin-risk
      localName: riskLimitRuleId
      label: Risk Limit Rule ID
      definition: The Risk Limit Rule ID, is a stable lexical identifier of a RiskLimitRule.
      cnNote: 风险限额规则标识，是风险限额规则的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    comparisonOperator:
      iri: https://axiolune.ai/ontology/finance/risk/comparisonOperator
      namespace: fin-risk
      localName: comparisonOperator
      label: Comparison Operator
      definition: The Comparison Operator, is the operator a RiskLimitRule applies (le, ge, lt, gt, withinBand,
        outsideBand, absoluteValueLe, absoluteValueGe).
      cnNote: 比较算子，是风险限额规则所施算子（le、ge、lt、gt、区间内、区间外、绝对值 le、绝对值 ge）。
      valueType: https://axiolune.ai/ontology/finance/risk/ComparisonOperator
    comparisonBasis:
      iri: https://axiolune.ai/ontology/finance/risk/comparisonBasis
      namespace: fin-risk
      localName: comparisonBasis
      label: Comparison Basis
      definition: The Comparison Basis, is the basis on which a RiskLimitRule compares (net exposure, gross exposure,
        utilization, concentration ratio, absolute value).
      cnNote: 比较基准，是风险限额规则所依比较基准（净敞口、总敞口、利用率、集中度比例、绝对值）。
      valueType: string
    lowerThresholdMoney:
      iri: https://axiolune.ai/ontology/finance/risk/lowerThresholdMoney
      namespace: fin-risk
      localName: lowerThresholdMoney
      label: Lower Threshold Money
      definition: The Lower Threshold Money, is an optional Money lower bound of a RiskLimitRule.
      cnNote: 下限金额，是风险限额规则的可选金额下限。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
    upperThresholdMoney:
      iri: https://axiolune.ai/ontology/finance/risk/upperThresholdMoney
      namespace: fin-risk
      localName: upperThresholdMoney
      label: Upper Threshold Money
      definition: The Upper Threshold Money, is an optional Money upper bound of a RiskLimitRule.
      cnNote: 上限金额，是风险限额规则的可选金额上限。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
    lowerThresholdQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/lowerThresholdQuantity
      namespace: fin-risk
      localName: lowerThresholdQuantity
      label: Lower Threshold Quantity
      definition: The Lower Threshold Quantity, is an optional Quantity lower bound of a RiskLimitRule.
      cnNote: 下限数量，是风险限额规则的可选数量下限。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    upperThresholdQuantity:
      iri: https://axiolune.ai/ontology/finance/risk/upperThresholdQuantity
      namespace: fin-risk
      localName: upperThresholdQuantity
      label: Upper Threshold Quantity
      definition: The Upper Threshold Quantity, is an optional Quantity upper bound of a RiskLimitRule.
      cnNote: 上限数量，是风险限额规则的可选数量上限。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    limitSeverity:
      iri: https://axiolune.ai/ontology/finance/risk/limitSeverity
      namespace: fin-risk
      localName: limitSeverity
      label: Limit Severity
      definition: The Limit Severity, is the severity of a RiskLimitRule (warning, soft, hard).
      cnNote: 限额严重度，是风险限额规则的严重度（警告、软、硬）。
      valueType: https://axiolune.ai/ontology/finance/risk/LimitSeverity
    riskLimitLifecycleStatus:
      iri: https://axiolune.ai/ontology/finance/risk/riskLimitLifecycleStatus
      namespace: fin-risk
      localName: riskLimitLifecycleStatus
      label: Risk Limit Lifecycle Status
      definition: The Risk Limit Lifecycle Status, is the lifecycle status of a RiskLimitRule (effective, suspended,
        superseded).
      cnNote: 风险限额生命周期状态，是风险限额规则的生命周期状态（生效、暂停、替代）。
      valueType: https://axiolune.ai/ontology/finance/risk/RiskLimitLifecycleStatus
    comparisonPolicyId:
      iri: https://axiolune.ai/ontology/finance/risk/comparisonPolicyId
      namespace: fin-risk
      localName: comparisonPolicyId
      label: Comparison Policy ID
      definition: The Comparison Policy ID, is a stable lexical identifier of a RiskLimitComparisonPolicy.
      cnNote: 比较策略标识，是风险限额比较策略的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    bucketComparisonMode:
      iri: https://axiolune.ai/ontology/finance/risk/bucketComparisonMode
      namespace: fin-risk
      localName: bucketComparisonMode
      label: Bucket Comparison Mode
      definition: The Bucket Comparison Mode, is how a bucket measurement is compared to a bucket limit (perBucket,
        aggregate, perBucketAndAggregate, anyBucket, allBuckets).
      cnNote: 分桶比较模式，是分桶度量与分桶限额的比较方式（逐桶、聚合、逐桶且聚合、任一桶、所有桶）。
      valueType: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode
    missingBucketHandling:
      iri: https://axiolune.ai/ontology/finance/risk/missingBucketHandling
      namespace: fin-risk
      localName: missingBucketHandling
      label: Missing Bucket Handling
      definition: The Missing Bucket Handling, is how a missing bucket is treated in comparison (failClosed,
        treatAsZero, ignore, indeterminate).
      cnNote: 缺失桶处理，是比较中对缺失桶的处理方式（失败封闭、视为零、忽略、不确定）。
      valueType: https://axiolune.ai/ontology/finance/risk/MissingBucketHandling
    comparisonTolerance:
      iri: https://axiolune.ai/ontology/finance/risk/comparisonTolerance
      namespace: fin-risk
      localName: comparisonTolerance
      label: Comparison Tolerance
      definition: The Comparison Tolerance, is the tolerance applied in a limit comparison.
      cnNote: 比较容差，是限额比较中应用的容差。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    roundingPolicy:
      iri: https://axiolune.ai/ontology/finance/risk/roundingPolicy
      namespace: fin-risk
      localName: roundingPolicy
      label: Rounding Policy
      definition: The Rounding Policy, is the rounding applied before a limit comparison.
      cnNote: 舍入策略，是限额比较前应用的舍入。
      valueType: string
    unitConversionPolicyRef:
      iri: https://axiolune.ai/ontology/finance/risk/unitConversionPolicyRef
      namespace: fin-risk
      localName: unitConversionPolicyRef
      label: Unit Conversion Policy Reference
      definition: The Unit Conversion Policy Reference, is an optional reference to the unit/currency conversion
        policy applied before comparison.
      cnNote: 单位换算策略引用，是比较前所施单位/货币换算策略的可选引用。
      valueType: uri
    scopeMatchRule:
      iri: https://axiolune.ai/ontology/finance/risk/scopeMatchRule
      namespace: fin-risk
      localName: scopeMatchRule
      label: Scope Match Rule
      definition: The Scope Match Rule, is the rule by which a measurement scope and a limit scope are deemed
        compatible in a RiskLimitEvaluation (exactMatch, approvedRollup, contains).
      cnNote: 范围匹配规则，是风险限额评估中度量范围与限额范围被视为兼容的规则（精确匹配、已批准聚合、包含）。
      valueType: https://axiolune.ai/ontology/finance/risk/ScopeMatchRule
    effectiveAt:
      iri: https://axiolune.ai/ontology/finance/risk/effectiveAt
      namespace: fin-risk
      localName: effectiveAt
      label: Effective At
      definition: The Effective At, is the instant at which a RiskLimit actually takes effect, distinct from approvedAt.
      cnNote: 生效时刻，是风险限额实际生效的带显式时区时刻，区别于批准时刻。
      valueType: instant
    suspendedAt:
      iri: https://axiolune.ai/ontology/finance/risk/suspendedAt
      namespace: fin-risk
      localName: suspendedAt
      label: Suspended At
      definition: The Suspended At, is the instant at which a RiskLimit was suspended.
      cnNote: 暂停时刻，是风险限额被暂停的带显式时区时刻。
      valueType: instant
    supersededBy:
      iri: https://axiolune.ai/ontology/finance/risk/supersededBy
      namespace: fin-risk
      localName: supersededBy
      label: Superseded By
      definition: The Superseded By, is an optional reference to the RiskLimit version that supersedes this one.
      cnNote: 替代为，是替代本限额版本的风险限额版本的可选引用。
      valueType: uri
    scenarioCategory:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioCategory
      namespace: fin-risk
      localName: scenarioCategory
      label: Scenario Category
      definition: The Scenario Category, is the category of a scenario (hypothetical, historical, regulatory,
        reverse stress, whatIf).
      cnNote: 情景类别，是情景的类别（假设、历史、监管、反向压力、假设分析）。
      valueType: string
    scenarioNarrative:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioNarrative
      namespace: fin-risk
      localName: scenarioNarrative
      label: Scenario Narrative
      definition: The Scenario Narrative, is the narrative explaining how the scenario captures the risk.
      cnNote: 情景叙事，是说明情景如何捕捉风险的叙事。
      valueType: string
    baselineStateRef:
      iri: https://axiolune.ai/ontology/finance/risk/baselineStateRef
      namespace: fin-risk
      localName: baselineStateRef
      label: Baseline State Reference
      definition: The Baseline State Reference, is an optional reference to the baseline state a scenario shocks.
      cnNote: 基准状态引用，是情景所冲击基准状态的可选引用。
      valueType: uri
    shockCanonicalizationRef:
      iri: https://axiolune.ai/ontology/finance/risk/shockCanonicalizationRef
      namespace: fin-risk
      localName: shockCanonicalizationRef
      label: Shock Canonicalization Reference
      definition: The Shock Canonicalization Reference, is an explicit reference to the canonicalization that maps the
        source document to the shock parameter payload, used to make the shockParameterDigest ↔ sourceArtifactDigest
        relationship explicit rather than a vague "matches".
      cnNote: 冲击规范化引用，是把源文档映射到冲击参数载荷的规范化的显式引用，用于使冲击参数摘要与源制品摘要关系显式而非模糊的“匹配”。
      valueType: uri
    scenarioShockId:
      iri: https://axiolune.ai/ontology/finance/risk/scenarioShockId
      namespace: fin-risk
      localName: scenarioShockId
      label: Scenario Shock ID
      definition: The Scenario Shock ID, is a stable lexical identifier of a ScenarioShock.
      cnNote: 情景冲击标识，是情景冲击的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    shockType:
      iri: https://axiolune.ai/ontology/finance/risk/shockType
      namespace: fin-risk
      localName: shockType
      label: Shock Type
      definition: The Shock Type, is the type of shock (absolute shift, relative shift, multiplier, curve twist,
        basis shock, volatility shock, default event).
      cnNote: 冲击类型，是冲击的类型（绝对平移、相对平移、乘数、曲线扭转、基差冲击、波动率冲击、违约事件）。
      valueType: string
    shockMagnitude:
      iri: https://axiolune.ai/ontology/finance/risk/shockMagnitude
      namespace: fin-risk
      localName: shockMagnitude
      label: Shock Magnitude
      definition: The Shock Magnitude, is the magnitude of a ScenarioShock.
      cnNote: 冲击幅度，是情景冲击的幅度。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    shockUnit:
      iri: https://axiolune.ai/ontology/finance/risk/shockUnit
      namespace: fin-risk
      localName: shockUnit
      label: Shock Unit
      definition: The Shock Unit, is the unit of a ScenarioShock magnitude (basis points, percent, absolute, multiplier).
      cnNote: 冲击单位，是情景冲击幅度的单位（基点、百分比、绝对值、乘数）。
      valueType: uri
    shockPropagationRule:
      iri: https://axiolune.ai/ontology/finance/risk/shockPropagationRule
      namespace: fin-risk
      localName: shockPropagationRule
      label: Shock Propagation Rule
      definition: The Shock Propagation Rule, is the rule by which a shock propagates to the portfolio.
      cnNote: 冲击传播规则，是冲击传播到组合的规则。
      valueType: string
    riskReportId:
      iri: https://axiolune.ai/ontology/finance/risk/riskReportId
      namespace: fin-risk
      localName: riskReportId
      label: Risk Report ID
      definition: The Risk Report ID, is a stable lexical identifier of a RiskReport.
      cnNote: 风险报告标识，是风险报告的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    reportAsOf:
      iri: https://axiolune.ai/ontology/finance/risk/reportAsOf
      namespace: fin-risk
      localName: reportAsOf
      label: Report As Of
      definition: The Report As Of, is the as-of time of a RiskReport.
      cnNote: 报告时点，是风险报告的时点。
      valueType: instant
    reportAudience:
      iri: https://axiolune.ai/ontology/finance/risk/reportAudience
      namespace: fin-risk
      localName: reportAudience
      label: Report Audience
      definition: The Report Audience, is the intended audience of a RiskReport (board, regulator, risk committee,
        management).
      cnNote: 报告受众，是风险报告的预期受众（董事会、监管、风险委员会、管理层）。
      valueType: string
    breachCaseId:
      iri: https://axiolune.ai/ontology/finance/risk/breachCaseId
      namespace: fin-risk
      localName: breachCaseId
      label: Breach Case ID
      definition: The Breach Case ID, is a stable lexical identifier of a RiskLimitBreachCase.
      cnNote: 突破案例标识，是风险限额突破案例的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    breachMagnitude:
      iri: https://axiolune.ai/ontology/finance/risk/breachMagnitude
      namespace: fin-risk
      localName: breachMagnitude
      label: Breach Magnitude
      definition: The Breach Magnitude, is the magnitude by which the limit was breached.
      cnNote: 突破幅度，是限额被突破的幅度。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    breachDuration:
      iri: https://axiolune.ai/ontology/finance/risk/breachDuration
      namespace: fin-risk
      localName: breachDuration
      label: Breach Duration
      definition: The Breach Duration, is the duration for which the breach persisted.
      cnNote: 突破持续时间，是突破持续的时间。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
    breachCaseStatus:
      iri: https://axiolune.ai/ontology/finance/risk/breachCaseStatus
      namespace: fin-risk
      localName: breachCaseStatus
      label: Breach Case Status
      definition: The Breach Case Status, is the workflow status of a RiskLimitBreachCase (open, acknowledged,
        remediated, waived, escalated, closed, reopened).
      cnNote: 突破案例状态，是风险限额突破案例的工作流状态（打开、已确认、已整改、已豁免、已升级、已关闭、重开）。
      valueType: https://axiolune.ai/ontology/finance/risk/BreachCaseStatus
    acknowledgementId:
      iri: https://axiolune.ai/ontology/finance/risk/acknowledgementId
      namespace: fin-risk
      localName: acknowledgementId
      label: Acknowledgement ID
      definition: The Acknowledgement ID, is a stable lexical identifier of a BreachAcknowledgement.
      cnNote: 确认标识，是突破确认的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    acknowledgedAt:
      iri: https://axiolune.ai/ontology/finance/risk/acknowledgedAt
      namespace: fin-risk
      localName: acknowledgedAt
      label: Acknowledged At
      definition: The Acknowledged At, is the instant at which a breach case was acknowledged.
      cnNote: 确认时刻，是突破案例被确认的带显式时区时刻。
      valueType: instant
    waiverId:
      iri: https://axiolune.ai/ontology/finance/risk/waiverId
      namespace: fin-risk
      localName: waiverId
      label: Waiver ID
      definition: The Waiver ID, is a stable lexical identifier of a LimitWaiver.
      cnNote: 豁免标识，是限额豁免的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    waiverKind:
      iri: https://axiolune.ai/ontology/finance/risk/waiverKind
      namespace: fin-risk
      localName: waiverKind
      label: Waiver Kind
      definition: The Waiver Kind, is the kind of waiver (temporary, permanent, conditional).
      cnNote: 豁免种类，是豁免的种类（临时、永久、有条件）。
      valueType: https://axiolune.ai/ontology/finance/risk/WaiverKind
    waiverRationale:
      iri: https://axiolune.ai/ontology/finance/risk/waiverRationale
      namespace: fin-risk
      localName: waiverRationale
      label: Waiver Rationale
      definition: The Waiver Rationale, is the rationale for a LimitWaiver.
      cnNote: 豁免理由，是限额豁免的理由。
      valueType: string
    waiverExpiry:
      iri: https://axiolune.ai/ontology/finance/risk/waiverExpiry
      namespace: fin-risk
      localName: waiverExpiry
      label: Waiver Expiry
      definition: The Waiver Expiry, is the expiry of a temporary LimitWaiver.
      cnNote: 豁免到期，是临时限额豁免的到期。
      valueType: instant
    remediationId:
      iri: https://axiolune.ai/ontology/finance/risk/remediationId
      namespace: fin-risk
      localName: remediationId
      label: Remediation ID
      definition: The Remediation ID, is a stable lexical identifier of a RemediationAction.
      cnNote: 整改标识，是整改行动的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    remediationKind:
      iri: https://axiolune.ai/ontology/finance/risk/remediationKind
      namespace: fin-risk
      localName: remediationKind
      label: Remediation Kind
      definition: The Remediation Kind, is the kind of remediation (exposureReduction, limitAdjustment,
        dataCorrection, positionCloseout).
      cnNote: 整改种类，是整改的种类（降低暴露、调整限额、纠正数据、平仓）。
      valueType: https://axiolune.ai/ontology/finance/risk/RemediationKind
    remediationEvidence:
      iri: https://axiolune.ai/ontology/finance/risk/remediationEvidence
      namespace: fin-risk
      localName: remediationEvidence
      label: Remediation Evidence
      definition: The Remediation Evidence, is an optional reference to the evidence of a RemediationAction.
      cnNote: 整改证据，是整改行动证据的可选引用。
      valueType: uri
    escalationId:
      iri: https://axiolune.ai/ontology/finance/risk/escalationId
      namespace: fin-risk
      localName: escalationId
      label: Escalation ID
      definition: The Escalation ID, is a stable lexical identifier of an EscalationEvent.
      cnNote: 升级标识，是升级事件的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    escalationLevel:
      iri: https://axiolune.ai/ontology/finance/risk/escalationLevel
      namespace: fin-risk
      localName: escalationLevel
      label: Escalation Level
      definition: The Escalation Level, is the governance level an EscalationEvent escalates to.
      cnNote: 升级层级，是升级事件所升至的治理层级。
      valueType: string
    escalationTarget:
      iri: https://axiolune.ai/ontology/finance/risk/escalationTarget
      namespace: fin-risk
      localName: escalationTarget
      label: Escalation Target
      definition: The Escalation Target, is the optional target entity of an EscalationEvent.
      cnNote: 升级目标，是升级事件的可选目标实体。
      valueType: uri
    escalatedAt:
      iri: https://axiolune.ai/ontology/finance/risk/escalatedAt
      namespace: fin-risk
      localName: escalatedAt
      label: Escalated At
      definition: The Escalated At, is the instant at which an EscalationEvent occurred.
      cnNote: 升级时刻，是升级事件发生的带显式时区时刻。
      valueType: instant
    applicationEvidenceId:
      iri: https://axiolune.ai/ontology/finance/risk/applicationEvidenceId
      namespace: fin-risk
      localName: applicationEvidenceId
      label: Application Evidence ID
      definition: The Application Evidence ID, is a stable lexical identifier of a ScenarioApplicationEvidence.
      cnNote: 应用证据标识，是情景应用证据的稳定词法标识符。
      valueType: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    applicationProofDigest:
      iri: https://axiolune.ai/ontology/finance/risk/applicationProofDigest
      namespace: fin-risk
      localName: applicationProofDigest
      label: Application Proof Digest
      definition: The Application Proof Digest, is an optional SHA-256 digest of the proof that the scenario was
        applied to the input context.
      cnNote: 应用证明摘要，是证明情景已施加于输入上下文的可选 SHA-256 摘要。
      valueType: string
      pattern: ^sha256:[0-9a-f]{64}$
  identifierTypes: {}
  codeLists:
    RiskLimitEvaluationResult:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult
      namespace: fin-risk
      localName: RiskLimitEvaluationResult
      label: Risk Limit Evaluation Result
      definition: >-
        The Risk Limit Evaluation Result, is a closed classification that makes a successful comparison, a detected
        breach, or an evidence-limited indeterminate conclusion explicit, used to give limit evaluations a normalized
        and unambiguous set of conclusion values
      cnNote: 风险限额评估结果，是把成功比较、检测到突破或证据受限的不确定结论显式化的封闭分类，用于为限额评估提供规范化且无歧义的结论取值集。
      vocabulary: Axiolune Risk Limit Evaluation Result
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult/value/withinLimit
          notation: withinLimit
          label: Within Limit
          definition: compatible measurement is within or equal to the approved threshold
        - iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult/value/breach
          notation: breach
          label: Breach
          definition: compatible measurement exceeds the approved threshold
        - iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationResult/value/indeterminate
          notation: indeterminate
          label: Indeterminate
          definition: comparison cannot conclude within-limit or breach from complete admissible evidence
    RiskCategoryValue:
      iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue
      namespace: fin-risk
      localName: RiskCategoryValue
      label: Risk Category Value
      definition: >-
        The Risk Category Value, is a closed classification of the kind of risk, used to categorize measures, limits,
        exposures, factors, and scenarios. The set is extensible via additional code-list values; full regulatory
        frameworks per category remain out of scope.
      cnNote: 风险类别值，是风险种类的封闭分类，用于归类度量、限额、暴露、因子与情景。集合可经附加码表取值扩展；各类别下完整监管框架不在范围内。
      vocabulary: Axiolune Risk Category
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/market
          notation: market
          label: Market Risk
          definition: risk arising from movements in market prices
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/credit
          notation: credit
          label: Credit Risk
          definition: risk of loss from a counterparty or obligor failure to perform
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/liquidity
          notation: liquidity
          label: Liquidity Risk
          definition: risk of being unable to meet obligations as they fall due
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/operational
          notation: operational
          label: Operational Risk
          definition: risk of loss from failed internal processes, people, or systems
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/concentration
          notation: concentration
          label: Concentration Risk
          definition: risk from concentrated exposure to a single name, sector, or factor
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/model
          notation: model
          label: Model Risk
          definition: risk from model error or misuse
        - iri: https://axiolune.ai/ontology/finance/risk/RiskCategoryValue/value/other
          notation: other
          label: Other
          definition: extensible slot for additional risk categories
    RiskMeasureKind:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind
      namespace: fin-risk
      localName: RiskMeasureKind
      label: Risk Measure Kind
      definition: >-
        The Risk Measure Kind, is a closed classification of the business kind of a risk measure, used to make a
        measure queryable by kind rather than hidden in a method reference.
      cnNote: 风险度量种类，是风险度量业务种类的封闭分类，用于使度量可按种类查询而非藏在方法引用中。
      vocabulary: Axiolune Risk Measure Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/var
          notation: var
          label: Value at Risk
          definition: value at risk
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/es
          notation: es
          label: Expected Shortfall
          definition: expected shortfall
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/sensitivity
          notation: sensitivity
          label: Sensitivity
          definition: sensitivity to a risk factor
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/pfe
          notation: pfe
          label: Potential Future Exposure
          definition: potential future exposure
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/liquidityGap
          notation: liquidityGap
          label: Liquidity Gap
          definition: liquidity gap
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/concentration
          notation: concentration
          label: Concentration
          definition: concentration measure
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/probability
          notation: probability
          label: Probability
          definition: probability measure
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/ratio
          notation: ratio
          label: Ratio
          definition: ratio measure
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/capitalRequirement
          notation: capitalRequirement
          label: Capital Requirement
          definition: capital requirement
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureKind/value/other
          notation: other
          label: Other
          definition: extensible slot for additional measure kinds
    RiskMeasurementStatus:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus
      namespace: fin-risk
      localName: RiskMeasurementStatus
      label: Risk Measurement Status
      definition: >-
        The Risk Measurement Status, is a closed classification of the status of a risk measurement, used so that
        preliminary, incomplete, revised, failed, estimated, and validated results are all expressible rather than
        requiring every result to be audit-grade.
      cnNote: 风险度量状态，是风险度量状态的封闭分类，使初步、不完整、修订、失败、估计与已验证结果均可被表达，而非要求每个结果都达审计级。
      vocabulary: Axiolune Risk Measurement Status
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus/value/preliminary
          notation: preliminary
          label: Preliminary
          definition: preliminary result, not yet validated
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus/value/incomplete
          notation: incomplete
          label: Incomplete
          definition: result based on incomplete inputs
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus/value/revised
          notation: revised
          label: Revised
          definition: revised result correcting a prior version
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus/value/failed
          notation: failed
          label: Failed
          definition: calculation failed to produce a result
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus/value/estimated
          notation: estimated
          label: Estimated
          definition: result based on estimated or fallback inputs
        - iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementStatus/value/validated
          notation: validated
          label: Validated
          definition: validated reproducible result (ValidatedReproducibleRiskMeasurement profile)
    BucketSetPurpose:
      iri: https://axiolune.ai/ontology/finance/risk/BucketSetPurpose
      namespace: fin-risk
      localName: BucketSetPurpose
      label: Bucket Set Purpose
      definition: >-
        The Bucket Set Purpose, distinguishes a measurement-side bucket result set from a limit-side bucket schedule.
      cnNote: 分桶集合用途，区分度量侧分桶结果集与限额侧分桶计划。
      vocabulary: Axiolune Bucket Set Purpose
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/BucketSetPurpose/value/measurement
          notation: measurement
          label: Measurement
          definition: bucket set carries measured values
        - iri: https://axiolune.ai/ontology/finance/risk/BucketSetPurpose/value/limit
          notation: limit
          label: Limit
          definition: bucket set carries threshold schedule
    ComparisonOperator:
      iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator
      namespace: fin-risk
      localName: ComparisonOperator
      label: Comparison Operator
      definition: >-
        The Comparison Operator, is a closed classification of the operator a RiskLimitRule applies, used so that a
        limit is not hardcoded to a single upper bound.
      cnNote: 比较算子，是风险限额规则所施算子的封闭分类，使限额不被硬编码为单一上限。
      vocabulary: Axiolune Comparison Operator
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/le
          notation: le
          label: Less Or Equal
          definition: value must be less than or equal to threshold
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/ge
          notation: ge
          label: Greater Or Equal
          definition: value must be greater than or equal to threshold
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/lt
          notation: lt
          label: Less Than
          definition: value must be less than threshold
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/gt
          notation: gt
          label: Greater Than
          definition: value must be greater than threshold
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/withinBand
          notation: withinBand
          label: Within Band
          definition: value must be within a lower and upper band
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/outsideBand
          notation: outsideBand
          label: Outside Band
          definition: value must be outside a lower and upper band
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/absoluteValueLe
          notation: absoluteValueLe
          label: Absolute Value Less Or Equal
          definition: absolute value must be less than or equal to threshold
        - iri: https://axiolune.ai/ontology/finance/risk/ComparisonOperator/value/absoluteValueGe
          notation: absoluteValueGe
          label: Absolute Value Greater Or Equal
          definition: absolute value must be greater than or equal to threshold
    BucketComparisonMode:
      iri: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode
      namespace: fin-risk
      localName: BucketComparisonMode
      label: Bucket Comparison Mode
      definition: >-
        The Bucket Comparison Mode, is a closed classification of how a bucket measurement is compared to a bucket limit.
      cnNote: 分桶比较模式，是分桶度量与分桶限额比较方式的封闭分类。
      vocabulary: Axiolune Bucket Comparison Mode
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode/value/perBucket
          notation: perBucket
          label: Per Bucket
          definition: each bucket compared individually
        - iri: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode/value/aggregate
          notation: aggregate
          label: Aggregate
          definition: aggregate compared as one
        - iri: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode/value/perBucketAndAggregate
          notation: perBucketAndAggregate
          label: Per Bucket And Aggregate
          definition: both per-bucket and aggregate comparison
        - iri: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode/value/anyBucket
          notation: anyBucket
          label: Any Bucket
          definition: breach if any bucket breaches
        - iri: https://axiolune.ai/ontology/finance/risk/BucketComparisonMode/value/allBuckets
          notation: allBuckets
          label: All Buckets
