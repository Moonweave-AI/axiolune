      cnNote: 范围匹配规则，是风险限额评估中度量范围与限额范围被视为兼容的封闭分类。
      vocabulary: Axiolune Scope Match Rule
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/risk/ScopeMatchRule/value/exactMatch
