  constraints:
    RiskMeasureDefinitionRepresentationXone:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinitionRepresentationXone
      namespace: fin-risk
      localName: RiskMeasureDefinitionRepresentationXone
      label: Risk Measure Definition Representation Xone
      definition: requires exactly one Money currency, Quantity unit, or bucket schema branch
      constraintType: Cardinality
      scope: Object
      expression:
        language: SHACL
        expression: sh:xone(definitionCurrency,definitionUnit,definitionBucketSchema)
      severity: Error
      message: RiskMeasureDefinition must select exactly one result representation
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
    RiskMeasurementValueXone:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementValueXone
      namespace: fin-risk
      localName: RiskMeasurementValueXone
      label: Risk Measurement Value Xone
      definition: requires exactly one Money, Quantity, or bucket-set result branch
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(measuredMoney,measuredQuantity,measurementBucketSet)
      severity: Error
      message: RiskMeasurement must carry exactly one result representation
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
    RiskLimitValueXone:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitValueXone
      namespace: fin-risk
      localName: RiskLimitValueXone
      label: Risk Limit Value Xone
      definition: requires exactly one Money, Quantity, or bucket-set threshold branch
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(limitMoney,limitQuantity,limitBucketSet)
      severity: Error
      message: RiskLimit must carry exactly one threshold representation
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimit
    RiskMeasureDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinitionContract
      namespace: fin-risk
      localName: RiskMeasureDefinitionContract
      label: Risk Measure Definition Contract
      definition: >-
        freezes logical identity (authority-scoped), method/version/digests, parameter dimensions, and
        representation-specific currency, unit, or bucket-schema evidence. The audit-grade digest/contract requirements
        are mandatory only when the ValidatedReproducibleRiskMeasurement profile is active.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(definitionAuthority, riskMeasureId); method/version/implementation/input/output digests immutable
          when present; confidenceLevel is dimensionless and in (0,1), interpreted as the method-specified
          probability/quantile parameter per riskMeasureKind; window and horizon use duration units; xone branch fixes
          every result; digests and source-artifact evidence mandatory only under ValidatedReproducibleRiskMeasurement
      severity: Error
      message: risk-measure definition identity, parameters, or result dimension is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
    RiskBucketSchemaContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSchemaContract
      namespace: fin-risk
      localName: RiskBucketSchemaContract
      label: Risk Bucket Schema Contract
      definition: freezes schema identity, dimension, key contract, and Quantity unit
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: logicalKey(bucketSchemaId); dimension and unit are absolute IRIs; key contract digest is immutable
      severity: Error
      message: risk bucket schema identity or dimension contract is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
    RiskBucketSetClosureContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketSetClosureContract
      namespace: fin-risk
      localName: RiskBucketSetClosureContract
      label: Risk Bucket Set Closure Contract
      definition: >-
        requires, when the ValidatedReproducibleRiskMeasurement profile is active, the complete unique RiskBucketValue
        version set selected at the set version's as-of/context, exact count, canonical digest, successful probe, and
        one exact schema version. Membership is frozen at the set version's as-of/context, not a context-free
        "current". A preliminary bucket set may carry members without a completed closure proof.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(bucketSetId,generatingContextRef); membership frozen at set-version as-of/context; under
          ValidatedReproducibleRiskMeasurement: closureCompleted=true, unique bucket keys at that as-of,
          bucketValueCount and bucketValueSetDigest equal the completed reverse-membership probe; bucketSetPurpose
          distinguishes measurement vs limit
      severity: Error
      message: RiskBucketSet membership closure is incomplete, duplicated, or stale
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
    RiskBucketValueContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskBucketValueContract
      namespace: fin-risk
      localName: RiskBucketValueContract
      label: Risk Bucket Value Contract
      definition: requires key, dimension, unit, and generating context to equal the governing set/schema
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(bucketValueSet version IRI,bucketKey); bucketValueSchema equals the set schema; dimension equals
          exact schema dimension; Quantity unit equals schema unit; generatingContextRef equals set generatingContextRef
      severity: Error
      message: RiskBucketValue does not conform to its exact completed set and schema
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskBucketValue
    RiskMeasurementContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasurementContract
      namespace: fin-risk
      localName: RiskMeasurementContract
      label: Risk Measurement Contract
      definition: >-
        requires an explicit scope, representation/dimension compatibility with the exact measure definition, and a
        measurementStatus; the completed strictly-prior input-context evidence is required only under the
        ValidatedReproducibleRiskMeasurement profile, so that preliminary/incomplete/revised/estimated results are
        expressible.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          atLeastOne(measurementPortfolio,measurementAccount,measurementPosition,measurementScopeSnapshot,
          measurementSpecification); selected value branch equals definition branch; Money currency, Quantity unit,
          or bucket schema must match exactly; measurementStatus optional but when absent defaults to preliminary;
          under ValidatedReproducibleRiskMeasurement: inputContextCompleted=true, inputContextRef precedes and differs
          from generatingContextRef
      severity: Error
      message: RiskMeasurement scope, context evidence, or value dimension is incompatible
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
    RiskLimitContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitContract
      namespace: fin-risk
      localName: RiskLimitContract
      label: Risk Limit Contract
      definition: >-
        requires stable owner-scoped identity, at least one explicit scope (RiskScopeDefinition and/or legacy
        Portfolio/Account/Position), approval evidence, a threshold branch compatible with its exact measure
        definition, and a lifecycle that separates approval from effectiveness (approvedAt, effectiveAt, suspendedAt,
        supersededBy).
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(limitOwner logical IRI,limitId); atLeastOne(limitScopeDefinition,limitPortfolio,limitAccount,
          limitPosition); approvedAt within valid interval; approval digest immutable when present; selected threshold
          branch and currency/unit/schema equal definition; effectiveAt defaults to approvedAt when absent;
          riskLimitLifecycleStatus transitions are monotonic (effective→suspended→superseded); approver Party role and
          approvedBy are consistent representations of the same principal
      severity: Error
      message: RiskLimit identity, scope, approval, lifecycle, or threshold dimension is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimit
    RiskLimitEvaluationContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluationContract
      namespace: fin-risk
      localName: RiskLimitEvaluationContract
      label: Risk Limit Evaluation Contract
      definition: >-
        compares only compatible exact versions under an explicit scopeMatchRule and makes the deterministic
        withinLimit, breach, or evidence-limited indeterminate result explicit; for bucket branches the result is
        determined per the RiskLimitComparisonPolicy rather than a scalar value<=threshold.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(evaluatedMeasurement version IRI,evaluatedLimit version IRI); same definition; scope compatible per
          scopeMatchRule (exactMatch/approvedRollup/contains); same representation and currency/unit/schema; scalar branch:
          withinLimit iff value<=threshold, breach iff value>threshold; bucket branch: result per
          evaluationComparisonPolicy (bucketComparisonMode, key alignment, missingBucketHandling, tolerance, rounding,
          unit/currency conversion); indeterminate requires evaluationReason; historical measurement must use the
          limit version actually effective at the measurement as-of, not a post-hoc superseding version
      severity: Error
      message: RiskLimitEvaluation versions, compatibility, scope match, comparison policy, identity, or result is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
    LimitBreachContract:
      iri: https://axiolune.ai/ontology/finance/risk/LimitBreachContract
      namespace: fin-risk
      localName: LimitBreachContract
      label: Limit Breach Contract
      definition: >-
        requires a breach fact if and only if the evaluation result is breach and fixes exact role/context equality plus
        the canonical version key
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exists iff breachEvaluation.evaluationResult=breach; logicalKey(breachEvaluation version IRI);
          breachMeasurement=evaluation.measurement; breachLimit=evaluation.limit;
          generatingContextRef=evaluation.generatingContextRef;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: LimitBreach does not exactly close its breach evaluation
      targetElement: https://axiolune.ai/ontology/finance/risk/LimitBreach
    ScenarioDefinitionContract:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioDefinitionContract
      namespace: fin-risk
      localName: ScenarioDefinitionContract
      label: Scenario Definition Contract
      definition: >-
        requires stable authority-scoped scenario identity, immutable shock parameter digest, typed ScenarioShock
        members, and source evidence linked to the shock digest by an explicit canonicalization rather than a vague
        "matches".
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(scenarioAuthority,scenarioDefinitionId); shockParameterDigest immutable when present; when typed
          ScenarioShock members are present their canonical aggregate digest equals shockParameterDigest;
          sourceArtifactDigest linked to shockParameterDigest via shockCanonicalizationRef, not a bare "matches";
          valid interval non-zero
      severity: Error
      message: ScenarioDefinition identity, shock digest, canonicalization, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/ScenarioDefinition
    StressTestRunContract:
      iri: https://axiolune.ai/ontology/finance/risk/StressTestRunContract
      namespace: fin-risk
      localName: StressTestRunContract
      label: Stress Test Run Contract
      definition: >-
        requires exact scenario, portfolio, and output measurement versions plus generating context for replay, and
        proves the scenario actually acted on the output: the output's generating context equals the run's, the
        output's scope matches the stress scope, and the measure definition's scenarioRef equals the run's exact
        ScenarioDefinition.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(runAuthority,stressRunId); stressRunScenario exact version; stressRunPortfolio logical identity;
          stressRunOutput exact measurement version; generatingContextRef present; stressRunOutput.generatingContextRef
          = run.generatingContextRef; stressRunOutput scope matches stressRunScopeSnapshot/stressRunPortfolio;
          measurementDefinition.scenarioRef = stressRunScenario exact version; when stressRunApplicationEvidence
          present, it binds scenario, input set, and output
      severity: Error
      message: StressTestRun scenario, portfolio, output, application evidence, or context linkage is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/StressTestRun
    RiskMeasureSpecificationContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskMeasureSpecificationContract
      namespace: fin-risk
      localName: RiskMeasureSpecificationContract
      label: Risk Measure Specification Contract
      definition: >-
        freezes authority-scoped specification identity, measure kind, and the optional category/factor-universe/valuation
        bindings, so that a limit anchored to a specification survives implementation upgrades.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(measureSpecificationAuthority,riskMeasureSpecificationId); riskMeasureKind required and immutable
          per version; lossConvention, aggregationMethod, valuationMethodRef, riskMeasureCategoryRef immutable when
          present
      severity: Error
      message: RiskMeasureSpecification identity, kind, or semantic bindings are invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskMeasureSpecification
    RiskLimitRuleContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitRuleContract
      namespace: fin-risk
      localName: RiskLimitRuleContract
      label: Risk Limit Rule Contract
      definition: >-
        requires a comparison operator, at least one threshold representation consistent with the operator, and a
        monotonic lifecycle, so that a limit is not hardcoded to a single upper bound.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(riskLimitRuleId); comparisonOperator required; withinBand/outsideBand require both lower and upper
          thresholds; absoluteValue operators compare absolute value; single-sided operators require the matching
          single threshold; limitSeverity and riskLimitLifecycleStatus monotonic (effective→suspended→superseded);
          threshold value kind (Money/Quantity) consistent with the measure definition
      severity: Error
      message: RiskLimitRule operator, threshold, severity, or lifecycle is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimitRule
    RiskLimitComparisonPolicyContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitComparisonPolicyContract
      namespace: fin-risk
      localName: RiskLimitComparisonPolicyContract
      label: Risk Limit Comparison Policy Contract
      definition: >-
        requires a comparison policy to be well-formed for the comparison it governs, so that bucket-vs-bucket
        comparison is unambiguous.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(comparisonPolicyId); bucketComparisonMode determines per-bucket/aggregate/any/all semantics;
          missingBucketHandling defined; comparisonTolerance and roundingPolicy non-negative; unitConversionPolicyRef
          present when measurement and limit differ in unit/currency
      severity: Error
      message: RiskLimitComparisonPolicy is incomplete or inconsistent
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimitComparisonPolicy
    RiskLimitBreachCaseContract:
      iri: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCaseContract
      namespace: fin-risk
      localName: RiskLimitBreachCaseContract
      label: Risk Limit Breach Case Contract
      definition: >-
        requires a breach case to reference exactly one LimitBreach and to carry a monotonic workflow status, so that
        the immutable computational breach fact and its governance disposition are layered.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(breachCaseId); breachCaseBreach exact LimitBreach; breachCaseStatus monotonic
          (open→acknowledged→remediated/waived/escalated→closed→reopened); acknowledgements, waivers, remediation,
          escalations reference this case
      severity: Error
      message: RiskLimitBreachCase breach linkage or workflow is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/RiskLimitBreachCase
    ScenarioShockContract:
      iri: https://axiolune.ai/ontology/finance/risk/ScenarioShockContract
      namespace: fin-risk
      localName: ScenarioShockContract
      label: Scenario Shock Contract
      definition: >-
        requires a shock type and an optional typed shock target, so that a shock states what it shocks and how.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(scenarioShockId); shockType required; shockMagnitude and shockUnit consistent when both present;
          shockTargetFactor optional typed target
      severity: Error
      message: ScenarioShock type, magnitude, unit, or target is invalid
      targetElement: https://axiolune.ai/ontology/finance/risk/ScenarioShock
  relationUses:
    - relation: https://axiolune.ai/ontology/finance/risk/definitionCurrency
      subjectType: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      objectType: https://axiolune.ai/ontology/finance/foundation/Currency
      outboundCardinality:
        minCount: 0
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/LogicalReference
          targetElement: https://axiolune.ai/ontology/finance/risk/definitionCurrency
    - relation: https://axiolune.ai/ontology/finance/risk/definitionBucketSchema
      subjectType: https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition
      objectType: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      outboundCardinality:
        minCount: 0
        maxCount: 1
      constraints:
        - constraintRef: https://axiolune.ai/ontology/meta/core/constraints/ExactVersionReference
          targetElement: https://axiolune.ai/ontology/finance/risk/definitionBucketSchema
    - relation: https://axiolune.ai/ontology/finance/risk/bucketSetSchema
      subjectType: https://axiolune.ai/ontology/finance/risk/RiskBucketSet
      objectType: https://axiolune.ai/ontology/finance/risk/RiskBucketSchema
      outboundCardinality:
        minCount: 1
