        - iri: https://axiolune.ai/ontology/finance/risk/ScopeMatchRule/value/approvedRollup
          notation: approvedRollup
          label: Approved Rollup
          definition: measurement scope rolls up to limit scope under an approved aggregation
        - iri: https://axiolune.ai/ontology/finance/risk/ScopeMatchRule/value/contains
