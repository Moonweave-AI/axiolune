      iri: https://axiolune.ai/ontology/finance/orders-execution/missingKeyFrom
      namespace: fin-orders
      localName: missingKeyFrom
      label: missing key from
      definition: inclusive start of a sequence-gap half-open interval, used for bounding the lower end of the missing key interval
      cnNote: 缺失键起点，是序号缺口半开区间的包含性起点，用于界定缺失序号区间的下界。
