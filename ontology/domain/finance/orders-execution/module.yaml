        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Submitted
          notation: Submitted
          label: Submitted
          definition: order submitted to provider
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Accepted
          notation: Accepted
          label: Accepted
          definition: provider accepted the order
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Rejected
          notation: Rejected
          label: Rejected
          definition: provider rejected the order
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/PendingUpdate
          notation: PendingUpdate
          label: Pending Update
          definition: update request awaiting resolution
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/PendingCancel
          notation: PendingCancel
          label: Pending Cancel
          definition: cancel request awaiting resolution
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/PartiallyFilled
          notation: PartiallyFilled
          label: Partially Filled
          definition: order has a non-final fill
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Filled
          notation: Filled
          label: Filled
          definition: order has reached its fill terminal state
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Canceled
          notation: Canceled
          label: Canceled
          definition: order was cancelled
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Expired
          notation: Expired
          label: Expired
          definition: order validity expired
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Triggered
          notation: Triggered
          label: Triggered
          definition: trigger condition became true
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/PendingNew
          notation: PendingNew
          label: Pending New
          definition: order has been sent but not yet acknowledged by the provider
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/DoneForDay
          notation: DoneForDay
          label: Done For Day
          definition: order is done for the day
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Stopped
          notation: Stopped
          label: Stopped
          definition: order was stopped
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Suspended
          notation: Suspended
          label: Suspended
          definition: order was suspended
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Calculated
          notation: Calculated
          label: Calculated
          definition: order has been calculated
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Restated
          notation: Restated
          label: Restated
          definition: order state was restated
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/PendingReplace
          notation: PendingReplace
          label: Pending Replace
          definition: replace request is awaiting resolution
    OrderEventKind:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderEventKind
      namespace: fin-orders
      localName: OrderEventKind
      label: Order Event Kind
      definition: Immutable event-kind vocabulary distinct from the resulting lifecycle state, used for canonically expressing the type of the event itself in the event log.
      cnNote: 订单事件类别词表，是与结果生命周期状态相区别的不可变事件类别词表，用于规范表达事件日志中事件本身的类型。
      vocabulary: Order Event Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
