  constraints:
    OrderIntentContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentContract
      namespace: fin-orders
      localName: OrderIntentContract
      label: Order Intent Contract
      definition: >-
        Validation contract for stable client intent identity, positive absolute quantity, order-type fields, validity,
        source evidence, and instrument/listing consistency.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(intentIdentifierAuthority, clientIntentId); intentIssuer and intentIdentifierAuthority are
          logical references; intentAccount and intentInstrument are logical references; orderQuantity.value > 0;
          orderSide in {Buy,Sell}; Market forbids limitPrice, triggerPrice, and triggerPriceBasis; Limit requires only
          limitPrice and forbids triggerPriceBasis; Stop and MarketIfTouched require triggerPrice and exactly one
          triggerPriceBasis in TriggerPriceBasis; StopLimit and LimitIfTouched require limitPrice, triggerPrice, and
          exactly one triggerPriceBasis; GTD iff orderValidUntil; supplied intentListing.listedInstrument =
          intentInstrument and is PIT-eligible; source evidence is complete; forbidden(signedQuantity,
          facility,previousState)
      severity: Error
      message: order intent identity, quantity, validity, context, or field matrix is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
    OrderIntentContextXone:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentContextXone
      namespace: fin-orders
      localName: OrderIntentContextXone
      label: Order Intent Context Xone
      definition: Requires an OrderIntent to identify exactly one executable market context, either one Listing or one OTCContext.
      constraintType: Cardinality
      scope: Object
      expression:
        language: SHACL
        expression: sh:xone(intentListing,intentOtcContext)
      severity: Error
      message: order intent must select exactly one listing or OTC context
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
    ExternalOrderContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderContract
      namespace: fin-orders
      localName: ExternalOrderContract
      label: External Order Contract
      definition: validation contract for provider-scoped order identity and exact originating intent
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(externalOrderProvider.logicalIri,providerApiIdentifier, providerSchemaVersion,externalOrderId);
          exactlyOne(externalOrderOriginatingIntent exact version); source evidence is complete;
          versionKey(validFrom,knowledgeFrom, availableFrom,revision)
      severity: Error
      message: external order provider identity, originating intent, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
    OrderEventStreamContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStreamContract
