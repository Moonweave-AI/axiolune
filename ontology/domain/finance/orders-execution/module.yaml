      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(streamProvider.logicalIri,sourceContractRef, providerApiIdentifier,providerSchemaVersion,
          streamExternalOrder.logicalIri,providerStreamId); sourceContractDigest = sha256(locked source schema, mapping,
          and liquidityRoleCapability bytes); liquidityRoleCapability in {required,optional,unsupported}; source
          evidence is complete; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: order event stream identity, source contract digest, or capability is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
    ExternalOrderStatusVocabularyContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusVocabularyContract
      namespace: fin-orders
      localName: ExternalOrderStatusVocabularyContract
      label: External Order Status Vocabulary Contract
      definition: validation contract for a provider and schema scoped external status vocabulary
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(statusVocabularyProvider.logicalIri,providerApiIdentifier,
          providerSchemaVersion,statusVocabularyId); source evidence is complete;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: external status vocabulary scope, identity, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusVocabulary
    OrderTransitionProfileContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfileContract
      namespace: fin-orders
      localName: OrderTransitionProfileContract
      label: Order Transition Profile Contract
      definition: validation contract for provider transition semantics and executable evidence locks
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(transitionProfileProvider.logicalIri,transitionProfileId);
          exactlyOne(implementationDigest,inputContractDigest,
          outputContractDigest,toolLockRef,toolLockDigest,runtimeDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: transition profile provider identity or executable evidence closure is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfile
    LiquidityRoleMappingContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleMappingContract
      namespace: fin-orders
      localName: LiquidityRoleMappingContract
      label: Liquidity Role Mapping Contract
      definition: validation contract for raw field perspective, reviewed inversion, and mapping bytes
      constraintType: Dependency
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(sourceContractRef,liquidityMappingId); sourceContractDigest and mappingDigest verify locked bytes;
          rawPerspective in {executionAccountOrder,contraOrder}; rawPerspective=contraOrder requires
          perspectiveInversion=true; every raw value maps to exactly one reviewed LiquidityRole and auctionUndefined
          requires an explicit auction semantic; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: liquidity mapping contract, perspective, inversion, or digest evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleMapping
    OrderLifecycleEventContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEventContract
      namespace: fin-orders
      localName: OrderLifecycleEventContract
      label: Order Lifecycle Event Contract
      definition: validation contract for immutable stream-scoped lifecycle event identity and ordering
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(eventStream.logicalIri,providerEventId); sourceOrderKey >= 0; exact eventStream, externalOrder, and
          orderIntent versions agree; providerEventId is unique in stream; repeats whose complete event object has
          identical RFC 8785 JCS canonical bytes are idempotent; any difference anywhere in the complete canonical event
          content, rather than only kind/state/order-key fields, requires a duplicateConflict finding; previousState is
          derived from sourceOrderKey and forbidden as stored truth;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: lifecycle event identity, exact order chain, ordering, or immutable content is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
    OrderIntentLineageContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLineageContract
      namespace: fin-orders
      localName: OrderIntentLineageContract
      label: Order Intent Lineage Contract
      definition: >-
        Validation contract for closed, conserved, acyclic, non-duplicated split and aggregation lineage over exact
        OrderIntent versions.
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          sourceOrderIntent and resultOrderIntent are sorted unique closed exact-version sets whose stored counts and
          RFC section-5.8 framed IRI-set digests match; split requires sourceIntentCount = 1 and resultIntentCount >= 2;
          aggregation requires sourceIntentCount >= 2 and resultIntentCount = 1; endpoint sets are disjoint; every
          endpoint resolves to a PIT-eligible OrderIntent version; all endpoints have the same instrument logical IRI,
          orderSide, and Quantity unit, and exact source Quantity sum equals exact result Quantity sum;
          sourceArtifactRef, sourceArtifactDigest, and sourceLocator resolve one canonical selected-graph inventory
          artifact whose sorted lineageVersionIris, lineageVersionCount, and RFC section-5.8 framed
          lineageVersionSetDigest equal the runtime graph exactly, and every lineage fact binds that same artifact; its
          exact PITValidationRequest has a verifier-replayed selected FactVersion inventory containing every graph
          lineage and endpoint version, one completed MaterializationRun, one passed ValidationReport, and one sealed
          EvidenceLedger; the complete selected lineage graph contains no self edge, directed cycle, duplicate directed
          source/result pair, or duplicate orderLineageKeyDigest; orderLineageKeyDigest =
          SHA-256(UTF8("axiolune-order-intent-lineage-key-v1\0") ||
          RFC8785-JCS({kind,sourceIntentVersionSetDigest,resultIntentVersionSetDigest}));
          logicalKey(orderLineageKeyDigest); versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: order-intent lineage branch, endpoint closure, conservation, PIT eligibility, or graph integrity is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLineage
    ExecutionContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionContract
      namespace: fin-orders
      localName: ExecutionContract
      label: Execution Contract
      definition: validation contract for exact order chain and direct-unit execution economics
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(executionStream.logicalIri,providerExecutionId); executionQuantity.value > 0; orderSide in
          {Buy,Sell}; executionAccount and executionInstrument equal OrderIntent truths; executionParty and
          executionAccount are explicit logical participant roles; contraParty and contraAccount are optional and
          absent when disclosureStatus is anonymous or no bilateral evidence is available; a "unknown Party" or
          "unknown Account" placeholder is forbidden; executingBroker is an optional intermediary and cannot
          substitute for any principal or contra party/account role; supplied executionListing is PIT-eligible and
          lists executionInstrument; executionQuotationContract context equals the selected listing or OTC version,
          instrument logical IRI equals executionInstrument, quote Currency equals executionPrice.currency, and
          denominator unit equals executionQuantity.unit; executionAccount may differ from intentAccount when an
          ExecutionAllocation is present; forbidden(signedQuantity,liquidityRole,commission,facility);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: execution order chain, quantity, context, quotation, bilateral, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/Execution
    ExecutionLiquidityDeterminationCompletenessContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionLiquidityDeterminationCompletenessContract
      namespace: fin-orders
      localName: ExecutionLiquidityDeterminationCompletenessContract
      label: Execution Liquidity Determination Completeness Contract
      definition: >-
        Closed inverse-cardinality contract requiring every Execution version to be the determinedExecution of exactly
        one LiquidityRoleDetermination version in the same exact OrderEventStream.
      constraintType: Cardinality
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(inverse LiquidityRoleDetermination.determinedExecution = this Execution version);
          determinationStream exact version equals executionStream; classified/unavailable follows
          LiquidityRoleDeterminationContract
      severity: Error
      message: execution lacks exactly one same-stream liquidity-role determination
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/Execution
    ExecutionContextXone:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionContextXone
      namespace: fin-orders
      localName: ExecutionContextXone
      label: Execution Context Xone
      definition: Requires an Execution to identify exactly one execution market context, either one Listing or one OTCContext.
      constraintType: Cardinality
      scope: Association
      expression:
        language: SHACL
        expression: sh:xone(executionListing,executionOtcContext)
      severity: Error
      message: execution must select exactly one listing or OTC context
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/Execution
    FeeContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/FeeContract
      namespace: fin-orders
      localName: FeeContract
      label: Fee Contract
      definition: validation contract for one execution fee as positive magnitude plus effect
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(feeExecution.versionIri,feeId); feeAmount.amount > 0; feeEffect in {charge,rebate}; signed fee
          amount is forbidden; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: fee execution identity, positive magnitude, or charge/rebate effect is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/Fee
    ExternalOrderStatusMappingContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMappingContract
      namespace: fin-orders
      localName: ExternalOrderStatusMappingContract
      label: External Order Status Mapping Contract
      definition: validation contract for provider schema scoped reviewed status normalization
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(statusProvider.logicalIri,providerApiIdentifier,
          providerSchemaVersion,statusMappingVersion,rawStatusCode); statusVocabulary provider/API/schema equals the
          mapping scope; exactlyOne(canonicalLifecycleState); source and review ref/digest evidence are complete; every
          retired authoring alias is forbidden; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: external status mapping scope, target, source, review, or canonical name is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping
    LiquidityRoleDeterminationContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleDeterminationContract
      namespace: fin-orders
      localName: LiquidityRoleDeterminationContract
      label: Liquidity Role Determination Contract
      definition: validation contract for capability-governed classification or exact unavailability
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          logicalKey(determinedExecution.versionIri,determinationStream.versionIri); determinationStream is the
          determinedExecution stream; liquidityPerspective=executionAccountOrder; determinationStream
          sourceContractRef/digest equal the exact liquidityMapping sourceContractRef/digest; sourceRecordDigest equals
          SHA-256(RFC8785-JCS(sourceRecord)); rawFieldLocator equals the exact mapping JSON Pointer, resolves in that
          source record, and its lexical value equals rawLexicalValue; required => classified with exactly one
          liquidityMapping, liquidityRole, source record, raw field locator/value, and no absence reason/probe;
          unsupported => unavailable(contractUnsupported), no mapping/raw field/probe; optional => classified or
          unavailable(providerNotSpecified) with completed exact absence probe over the same source-record digest and
          declared JSON Pointer, which must be absent from that exact record; unknown or malformed values fail mapping
          and are never unavailable; mapping raw value produces the stored role and contra perspective requires reviewed
          inversion; versionKey(validFrom,knowledgeFrom, availableFrom,revision)
      severity: Error
      message: liquidity role determination capability branch, perspective, mapping, or source evidence is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleDetermination
    OrderEventIntegrityFindingContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderEventIntegrityFindingContract
      namespace: fin-orders
      localName: OrderEventIntegrityFindingContract
      label: Order Event Integrity Finding Contract
      definition: validation contract for closed kind-discriminated stream defect findings
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          atLeastOne(relatedLifecycleEvent,relatedExecution); duplicateConflict requires exactly findingProviderEventId
          and two related event versions with the same providerEventId whose RFC 8785 JCS EventConflictContent differs,
          where EventConflictContent is exactly eventStreamVersionIri, externalOrderVersionIri, orderIntentVersionIri,
          providerEventId, sourceOrderKey, orderEventKind, lifecycleState, observedAt, sourceArtifactDigest, and the
          exact source-artifact object; version/provenance envelopes are excluded, so a canonical-content-identical
          retry is not a conflict; sequenceGap requires exactly [missingKeyFrom,missingKeyTo) and its boundary-event
          closure; outOfOrder requires exactly observedSourceOrderKey and requiredPredecessorSourceOrderKey plus the
          later-arrival proof; lateFill requires exactly subjectFillExecution and subjectTerminalEvent;
          missingAcknowledgement requires exactly subjectMissingAcknowledgementOrder and expectedAfterSourceOrderKey;
          transitionViolation requires exactly subjectFromEvent,subjectToEvent,evaluatedTransitionProfile and the
          profile input-contract bytes must reject that state pair; affectedKeyDigest =
          SHA-256(UTF8("axiolune-order-finding-subject-v1\0") || RFC8785-JCS(OrderFindingSubject));
          relatedVersionSetDigest uses RFC §5.8 over the unique union of relatedLifecycleEvent, relatedExecution, and
          every exact kind-specific subject/profile role; logicalKey(findingStream.logicalIri,
          orderIntegrityKind,affectedKeyDigest,relatedVersionSetDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: order integrity finding kind, subject, closed version set, digest, or identity is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderEventIntegrityFinding
    OrderIntentLifecycleEventContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLifecycleEventContract
      namespace: fin-orders
      localName: OrderIntentLifecycleEventContract
      label: Order Intent Lifecycle Event Contract
      definition: validation contract for an internal pre-submission lifecycle event bound only to an OrderIntent and carrying no provider order, stream, raw status, or applied mapping
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(intentLifecycleOrderIntent) and exactlyOne(intentEventEmitter); no externalOrder, no
          eventStream, no providerEventId, no sourceOrderKey, no rawProviderStatusCode, no appliedStatusMapping,
          no appliedTransitionProfile; orderEventKind in {Initialized,Denied,Emulated,Released}; lifecycleState
          consistent with orderEventKind; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: order intent lifecycle event binds a provider order, stream, or provider field it must not carry
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLifecycleEvent
    FillSnapshotConsistencyContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/FillSnapshotConsistencyContract
      namespace: fin-orders
      localName: FillSnapshotConsistencyContract
      label: Fill Snapshot Consistency Contract
      definition: validation contract requiring a FillSnapshot's cumulative and leaves quantities to be consistent with the effective net execution quantity of the stream's executions for the order
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          cumQty = sum(executionQuantity) over the stream's Execution versions for the same external order up to and
          including the reported execution; leavesQty = orderQuantity - cumQty - cancelledQty and leavesQty >= 0;
          averagePrice is the executionQuantity-weighted average of executionPrice over the same execution set;
          Filled iff leavesQty = 0; PartiallyFilled iff leavesQty > 0 and cumQty > 0
      severity: Error
      message: fill snapshot cumulative, leaves, cancelled, or average price is inconsistent with the stream executions
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/FillSnapshot
    OrderRouteContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderRouteContract
      namespace: fin-orders
      localName: OrderRouteContract
      label: Order Route Contract
      definition: validation contract for a routing fact linking a parent intent to a child external order or child intent with a routed quantity, time, and status
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(routeParentIntent); at least one of routeChildExternalOrder or routeChildIntent is present;
          routedQuantity.value > 0; routeStatus in {routed,accepted,rejected,cancelled}; routeTime present;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: order route parent, child, quantity, time, or status is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderRoute
    ExecutionAllocationConservationContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionAllocationConservationContract
      namespace: fin-orders
      localName: ExecutionAllocationConservationContract
      label: Execution Allocation Conservation Contract
      definition: validation contract requiring the sum of allocation line quantities to equal the source execution quantity
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(allocationSourceExecution); at least one allocationLine; sum(allocationLine.allocationQuantity)
          = allocationSourceExecution.executionQuantity; every allocationLine.allocationTargetAccount is a logical
          FinancialAccount; allocationStatus in {proposed,accepted,rejected,cancelled,corrected};
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: execution allocation does not conserve the source execution quantity
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/ExecutionAllocation
    OrderRevisionContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderRevisionContract
      namespace: fin-orders
      localName: OrderRevisionContract
      label: Order Revision Contract
      definition: validation contract for a cancel/replace chain fact linking a revision request to its previous and root order
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(revisionOrder); revisionRequestId stable; revisionKind in {replace,cancel,cancelReplace};
          revisionPreviousOrder and revisionRootOrder are exact ExternalOrder versions when present; replacedTerms
          present only for replace or cancelReplace; versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: order revision chain, kind, previous/root order, or replaced terms is invalid
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderRevision
    MatchedTradeContract:
      iri: https://axiolune.ai/ontology/finance/orders-execution/MatchedTradeContract
      namespace: fin-orders
      localName: MatchedTradeContract
      label: Matched Trade Contract
      definition: validation contract for a bilateral matched trade requiring both contra roles and a disclosure status
      constraintType: Logical
      scope: Association
      expression:
        language: Custom
        expression: >-
          exactlyOne(matchedExecution); matchedContraParty and matchedContraAccount are explicit logical roles (no
          "unknown" placeholder); disclosureStatus in {disclosed,anonymous,partiallyDisclosed}; matchId stable;
          versionKey(validFrom,knowledgeFrom,availableFrom,revision)
      severity: Error
      message: matched trade is missing required bilateral contra roles, disclosure status, or match identity
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/MatchedTrade
    OrderIntentRoutingPolicy:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentRoutingPolicy
      namespace: fin-orders
      localName: OrderIntentRoutingPolicy
      label: Order Intent Routing Policy
      definition: constraint admitting a venue-neutral OrderIntent that specifies an acceptableVenueSet (one or more) or a routingPolicy instead of a single listing or OTC context, so that venue-neutral, SOR, and broker-decides-venue intents are expressible
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          either (exactlyOne of intentListing, intentOtcContext) or (atLeastOne acceptableVenueSet) or (routingPolicy
          present); the three context modes are mutually exclusive; an intent with no context binding at all is
          forbidden
      severity: Error
      message: order intent must select either a single listing/OTC context or a venue-neutral acceptable venue set or routing policy
      targetElement: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
