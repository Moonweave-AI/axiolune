      defaultCardinality:
        minCount: 0
        maxCount: 1
    observedSourceOrderKey:
      iri: https://axiolune.ai/ontology/finance/orders-execution/observedSourceOrderKey
      namespace: fin-orders
      localName: observedSourceOrderKey
      label: observed source order key
      definition: observed source order key in an outOfOrder finding subject, used for recording the actual arrival order of events
      cnNote: 观察到的源订单序键，是乱序发现主体中所观察到的源订单序键，用于记录实际到达事件的发生次序。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    requiredPredecessorSourceOrderKey:
      iri: https://axiolune.ai/ontology/finance/orders-execution/requiredPredecessorSourceOrderKey
      namespace: fin-orders
      localName: requiredPredecessorSourceOrderKey
      label: required predecessor source order key
      definition: predecessor key required before an outOfOrder event, used for judging whether the event violates the order constraint
      cnNote: 所需前驱源订单序键，是乱序事件之前所必需的前驱序键，用于判定事件是否违反了次序约束。
