        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Denied
          notation: Denied
          label: Denied
          definition: intent denied before provider submission
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState/value/Emulated
          notation: Emulated
          label: Emulated
