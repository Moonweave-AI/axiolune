      defaultCardinality:
        minCount: 0
        maxCount: 1
    expectedAfterSourceOrderKey:
      iri: https://axiolune.ai/ontology/finance/orders-execution/expectedAfterSourceOrderKey
      namespace: fin-orders
      localName: expectedAfterSourceOrderKey
      label: expected after source order key
      definition: source order key after which an acknowledgement was required, used for judging whether an acknowledgement is missing
      cnNote: 期望之后源订单序键，是确认本应在其之后到达的源订单序键，用于判定应答是否缺失。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    rawProviderStatusCode:
      iri: https://axiolune.ai/ontology/finance/orders-execution/rawProviderStatusCode
      namespace: fin-orders
      localName: rawProviderStatusCode
      label: raw provider status code
      definition: exact provider lexical status code carried by an external lifecycle event before canonical mapping, used to make the applied status mapping auditable on the event itself
      cnNote: 原始供应方状态码，是外部生命周期事件在规范映射前携带的确切供应方原始状态码，用于使所应用状态映射在事件本身可审计。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    transitionTable:
      iri: https://axiolune.ai/ontology/finance/orders-execution/transitionTable
      namespace: fin-orders
      localName: transitionTable
      label: transition table
      definition: declarative fromState × eventKind → toState + condition transition table carried by an OrderTransitionProfile, used to make the profile reviewable without executing the digest-locked evaluator
      cnNote: 转移表，是订单流转配置携带的声明式 fromState × eventKind → toState + condition 转移表，用于使配置可评审而无需执行摘要锁定的评估器。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    lastQty:
      iri: https://axiolune.ai/ontology/finance/orders-execution/lastQty
      namespace: fin-orders
      localName: lastQty
      label: last quantity
      definition: strictly positive absolute Quantity filled by the last execution recorded in a FillSnapshot, used to express the incremental fill quantity of the event
      cnNote: 本次数量，是成交快照中记录的最后一次成交的严格为正的绝对数量，用于表达该事件的增量成交数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cumQty:
      iri: https://axiolune.ai/ontology/finance/orders-execution/cumQty
      namespace: fin-orders
      localName: cumQty
      label: cumulative quantity
      definition: cumulative filled Quantity recorded in a FillSnapshot, used to audit Filled and PartiallyFilled states against the effective net quantity
      cnNote: 累计数量，是成交快照中记录的累计成交数量，用于按有效净成交量审计 Filled 与 PartiallyFilled 状态。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    leavesQty:
      iri: https://axiolune.ai/ontology/finance/orders-execution/leavesQty
      namespace: fin-orders
      localName: leavesQty
      label: leaves quantity
      definition: remaining (open) Quantity recorded in a FillSnapshot, used to express the quantity still eligible for filling
      cnNote: 剩余数量，是成交快照中记录的剩余（未成交）数量，用于表达仍可成交的数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    cancelledQty:
      iri: https://axiolune.ai/ontology/finance/orders-execution/cancelledQty
      namespace: fin-orders
      localName: cancelledQty
      label: cancelled quantity
      definition: cancelled Quantity recorded in a FillSnapshot, used to express the quantity removed from the order by cancellation
      cnNote: 取消数量，是成交快照中记录的取消数量，用于表达因撤销而从订单移除的数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 0
        maxCount: 1
    averagePrice:
      iri: https://axiolune.ai/ontology/finance/orders-execution/averagePrice
      namespace: fin-orders
      localName: averagePrice
