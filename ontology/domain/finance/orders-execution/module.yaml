      label: Order Event Integrity Finding
      definition: >-
        Typed event-stream defect finding for duplicate conflict, sequence gap, out-of-order event, late fill, missing
        acknowledgement, or transition violation. Logical identity is stream logical IRI, finding kind, affected-key
        digest, and exact related-version-set digest.
      participantRoles:
        - id: findingStream
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
          minCount: 1
          maxCount: 1
          label: finding stream
          definition: exact event stream version evaluated for the defect
        - id: relatedLifecycleEvent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
          minCount: 0
          maxCount: null
          label: related lifecycle event
          definition: exact lifecycle event version in the kind-specific subject set
        - id: relatedExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: null
          label: related execution
          definition: exact execution version in the kind-specific subject set
        - id: evaluatedTransitionProfile
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfile
          minCount: 0
          maxCount: 1
          label: evaluated transition profile
          definition: exact transition-profile version required for a transition violation
        - id: subjectFillExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: 1
          label: subject fill execution
          definition: exact fill version in the kind-specific lateFill subject
        - id: subjectTerminalEvent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
          minCount: 0
          maxCount: 1
