module:
  moduleIri: https://axiolune.ai/ontology/finance/orders-execution
  baseIri: https://axiolune.ai/ontology/finance/orders-execution/
  preferredPrefix: fin-orders
  version: 1.1.0
  label: Orders and Execution
  definition: >-
    The Orders and Execution module is a domain module that defines the trade lifecycle from order intent through
    routing and external order to execution and allocation, used for providing state-machine and audit-backed
    definitions for the order-to-fill process. The domain facts (intent, route, external order, lifecycle event,
    execution, fee, allocation) are separated from provider raw-code mapping/adapter implementation and from
    runtime/validation/quality findings, which are evidence of an interpretation or check rather than existence
    conditions of an order fact. v1.1.0 covers single-instrument, direct-unit-quotation orders; multi-leg and
    non-direct-unit quotation are scaffolded as extension points and completed via a cross-module follow-up gated
    on the instruments QuotationConvention (ADR-021).
  cnNote: 订单与执行模块，是本体工程中定义从订单意图经路由与外部订单到执行与分配的交易生命周期的领域模块，旨在为下单到成交的全过程提供带状态机与审计的定义。领域事实（意图、路由、外部订单、生命周期事件、成交、费用、分配）与供应方原始码映射/适配器实现、运行时/验证/质量发现相分离，后两者是解释或检查的证据而非订单事实的存在条件。v1.1.0 覆盖单工具、直接单位报价的订单；多腿与非直接单位报价作为扩展点骨架化，经跨模块后续 ADR（以 instruments QuotationConvention/ADR-021 为门控）完成。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
    - moduleIri: https://axiolune.ai/ontology/finance/market-rules
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    OrderIntent:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      namespace: fin-orders
      localName: OrderIntent
      label: Order Intent
      definition: >-
        An Order Intent is a stable trade intent issued by a client, strategy, or authorized routing process, used for
        fixing account, instrument, and trade conditions before provider acceptance, and for guaranteeing traceability
        and immutability through source evidence.
      cnNote: 订单意图，是由客户、策略或授权路由过程发出的稳定交易意图，用于在报送执行方之前固化账户、工具与交易条件等核心要素，并以来源证据保证其可追溯且不可篡改。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/clientIntentId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderSide
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderType
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/timeInForce
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderValidUntil
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/limitPrice
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/triggerPrice
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/triggerPriceBasis
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalOrder:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
      namespace: fin-orders
      localName: ExternalOrder
      label: External Order
      definition: >-
        An External Order is a provider-scoped order that has been accepted or submitted by a provider, used for binding
        one exact OrderIntent version to a specific provider interface and external order identifier as the order fact
        anchor of an external system.
      cnNote: 外部订单，是已被执行方受理或提交的、按供应方作用域标识的订单，用于把某条确切的订单意图版本绑定到具体供应方的接口与外部订单标识，作为外部系统的订单事实锚点。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/externalOrderId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerApiIdentifier
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerSchemaVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderEventStream:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
      namespace: fin-orders
      localName: OrderEventStream
      label: Order Event Stream
      definition: >-
        An Order Event Stream is a provider event stream locked to a single ExternalOrder logical identity, used for
        carrying all lifecycle events and fill reports of that order, and for declaring the degree of support for its
        liquidity role classification capability.
      cnNote: 订单事件流，是为单一外部订单逻辑身份锁定的供应方事件流，用于承载该订单的全部生命周期事件与成交回报，并声明其流动性角色分类能力的支持程度。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerApiIdentifier
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerSchemaVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerStreamId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/liquidityRoleCapability
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalOrderStatusVocabulary:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusVocabulary
      namespace: fin-orders
      localName: ExternalOrderStatusVocabulary
      label: External Order Status Vocabulary
      definition: >-
        An External Order Status Vocabulary is a raw status-code vocabulary scoped by provider, API, and schema version,
        used for collecting each provider's raw status-code values before they are reviewed and mapped to the canonical
        lifecycle state vocabulary.
      cnNote: 外部订单状态词表，是按供应方、接口与版本作用域标识的原始状态码词表，用于在评审映射到规范生命周期状态之前，收录各供应方的原始状态码取值。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/statusVocabularyId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerApiIdentifier
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerSchemaVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderTransitionProfile:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfile
      namespace: fin-orders
      localName: OrderTransitionProfile
      label: Order Transition Profile
      definition: >-
        An Order Transition Profile is a versioned provider lifecycle-transition evaluator, used for fixing the
        canonical event ordering, legal state transitions, and expiry and trigger rules, and for locking the evidence
        digests of its implementation and runtime environment.
      cnNote: 订单流转配置，是按供应方版本化的生命周期流转评估器，用于固化规范事件次序、合法状态转移、到期与触发规则，并锁定其实现与运行环境的证据摘要。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/transitionProfileId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/implementationDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/inputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/outputContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/toolLockRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/toolLockDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/runtimeDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LiquidityRoleMapping:
      iri: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleMapping
      namespace: fin-orders
      localName: LiquidityRoleMapping
      label: Liquidity Role Mapping
      definition: >-
        A Liquidity Role Mapping is a versioned source-contract mapping, used for converting a provider-declared raw field
        and perspective into the canonical liquidity role from the execution account-order perspective, and for recording
        any reviewed contra-perspective inversion.
      cnNote: 流动性角色映射，是版本化的来源契约映射，用于把供应方声明的原始字段与视角转换为执行账户订单视角的规范流动性角色，并可记录评审后的对手视角反转。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/liquidityMappingId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/rawFieldLocator
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/rawPerspective
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/perspectiveInversion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/mappingDigest
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FillSnapshot:
      iri: https://axiolune.ai/ontology/finance/orders-execution/FillSnapshot
      namespace: fin-orders
      localName: FillSnapshot
      label: Fill Snapshot
      definition: >-
        A Fill Snapshot is an immutable cumulative-quantity snapshot object carried by a fill-kind lifecycle event,
        used to express the last fill quantity, cumulative filled quantity, remaining (leaves) quantity, cancelled
        quantity, and average price so that the event—execution—cumulative-quantity—state closed loop is auditable
        without recomputation.
      cnNote: 成交快照，是由成交类生命周期事件携带的不可变累计数量快照对象，用于表达本次成交数量、累计成交数量、剩余数量、取消数量与均价，使事件—成交—累计数量—状态闭环可审计而无需重算。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/lastQty
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/cumQty
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/leavesQty
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/cancelledQty
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/averagePrice
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    AllocationLine:
      iri: https://axiolune.ai/ontology/finance/orders-execution/AllocationLine
      namespace: fin-orders
      localName: AllocationLine
      label: Allocation Line
      definition: >-
        An Allocation Line is an immutable allocation target line expressing one account's share of a source execution,
        used to model post-execution allocation, average-price allocation, and bunched-order back-allocation together
        with an ExecutionAllocation, while detailed allocation and clearing semantics remain in post-trade-operations.
      cnNote: 分配行，是表达某一账户对源成交份额的不可变分配目标行，用于与 ExecutionAllocation 共同建模执行后分配、均分配与打包订单后分配，而详细分配与清算语义保留在 post-trade-operations。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/allocationQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/allocationStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderLeg:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLeg
      namespace: fin-orders
      localName: OrderLeg
      label: Order Leg
      definition: >-
        An Order Leg is an optional single-leg component of a multi-leg order intent, used as an extension point for
        multi-leg instruments (FX swap, strategies) whose full multi-leg semantics are completed via a cross-module
        follow-up gated on the instruments QuotationConvention (ADR-021). In v1.1.0 a single-instrument order carries no
        OrderLeg and remains described directly on the OrderIntent.
      cnNote: 订单腿，是多腿订单意图的可选单腿组件，作为多腿工具（外汇掉期、策略）的扩展点，其完整多腿语义经以 instruments QuotationConvention（ADR-021）为门控的跨模块后续完成。在 v1.1.0 中，单工具订单不携带 OrderLeg，仍直接在 OrderIntent 上描述。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderSide
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExecutionLeg:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionLeg
      namespace: fin-orders
      localName: ExecutionLeg
      label: Execution Leg
      definition: >-
        An Execution Leg is an optional single-leg execution component corresponding to an OrderLeg, used as an
        extension point for multi-leg executions whose full semantics are completed via a cross-module follow-up gated
        on the instruments QuotationConvention (ADR-021). In v1.1.0 a single-instrument execution carries no
        ExecutionLeg and remains described directly on the Execution.
      cnNote: 成交腿，是对应某一 OrderLeg 的可选单腿成交组件，作为多腿成交的扩展点，其完整语义经以 instruments QuotationConvention（ADR-021）为门控的跨模块后续完成。在 v1.1.0 中，单工具成交不携带 ExecutionLeg，仍直接在 Execution 上描述。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/executionQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/executionPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    OrderLifecycleEvent:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
      namespace: fin-orders
      localName: OrderLifecycleEvent
      label: External Order Lifecycle Event
      definition: >-
        An External Order Lifecycle Event is an immutable provider event that occurs in one exact event stream version
        and is bound to an exact ExternalOrder, used for determining its identity and occurrence order from the
        provider event identifier and source order key, recording the resulting canonical lifecycle state, and
        tracing the raw provider status code and the exact applied status mapping and transition profile versions.
        Pre-submission internal lifecycle events (Initialized, Denied, Emulated, Released) that have no provider
        order or stream are modeled by OrderIntentLifecycleEvent, not by this external event type.
      cnNote: 外部订单生命周期事件，是发生在确切事件流版本中并绑定到确切外部订单的不可变供应方事件，用于以供应方事件标识与源订单序键确定其身份与发生次序，记录经规范化的结果生命周期状态，并追溯原始供应方状态码与所应用的精确状态映射与流转配置版本。无供应方订单或事件流的提交前内部生命周期事件（Initialized、Denied、Emulated、Released）由 OrderIntentLifecycleEvent 而非本外部事件类型建模。
      participantRoles:
        - id: eventStream
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
          minCount: 1
          maxCount: 1
          label: event stream
          definition: exact source-locked stream version containing this event
        - id: externalOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 1
          maxCount: 1
          label: external order
          definition: exact provider order version transitioned by this event
        - id: orderIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 1
          maxCount: 1
          label: order intent
          definition: exact originating client intent version
        - id: reportedExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: 1
          label: reported execution
          definition: exact execution version recorded by this event when the event is a fill report
        - id: fillSnapshot
          range: https://axiolune.ai/ontology/finance/orders-execution/FillSnapshot
          minCount: 0
          maxCount: 1
          label: fill snapshot
          definition: exact cumulative-quantity snapshot carried by a fill-kind event
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerEventId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/lifecycleState
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderEventKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/rawProviderStatusCode
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/eventReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderIntentLifecycleEvent:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLifecycleEvent
      namespace: fin-orders
      localName: OrderIntentLifecycleEvent
      label: Order Intent Lifecycle Event
      definition: >-
        An Order Intent Lifecycle Event is an immutable internal lifecycle event bound to an exact OrderIntent version
        but not to any ExternalOrder or OrderEventStream, used to record pre-submission internal transitions such as
        intent initialization, pre-submission denial, internal emulation, and emulated-order release before a provider
        order exists. It shares the OrderEventKind and OrderLifecycleState vocabularies with the external
        OrderLifecycleEvent but does not carry provider event identifiers, source order keys, raw provider status
        codes, or applied provider mappings.
      cnNote: 订单意图生命周期事件，是绑定到确切订单意图版本但不绑定任何外部订单或事件流的不可变内部生命周期事件，用于记录提交前内部转移，如意图初始化、提交前拒绝、内部模拟与模拟订单释放（此时尚无供应方订单）。它与外部 OrderLifecycleEvent 共享 OrderEventKind 与 OrderLifecycleState 词表，但不携带供应方事件标识、源订单序键、原始供应方状态码或所应用的供应方映射。
      participantRoles:
        - id: intentLifecycleOrderIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 1
          maxCount: 1
          label: order intent
          definition: exact originating client intent version transitioned by this internal event
        - id: intentEventEmitter
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: intent event emitter
          definition: logical Party that emitted the internal event (the client, strategy, emulator, or authorized routing process), distinct from any provider
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/lifecycleState
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderEventKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/eventReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderIntentLineage:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntentLineage
      namespace: fin-orders
      localName: OrderIntentLineage
      label: Order Intent Lineage
      definition: >-
        An Order Intent Lineage is an immutable, source-evidenced routing transformation fact, used for connecting an exact
        set of source intent versions to an exact set of result intent versions to express the domain provenance of a
        split or aggregation, without representing any external side effect such as order submission.
      cnNote: 订单意图谱系，是不可变且有来源证据的路由变换事实，用于把确切的源意图版本集合连接到确切的结果意图版本集合，表达拆分或聚合的领域溯源关系，而不代表报送等外部副作用。
      participantRoles:
        - id: sourceOrderIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 1
          maxCount: null
          label: source order intent
          definition: sorted unique closed set of exact input OrderIntent versions transformed by this lineage fact
        - id: resultOrderIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 1
          maxCount: null
          label: result order intent
          definition: sorted unique closed set of exact output OrderIntent versions produced by this lineage fact
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderLineageKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceIntentCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceIntentVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/resultIntentCount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/resultIntentVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderLineageKeyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Execution:
      iri: https://axiolune.ai/ontology/finance/orders-execution/Execution
      namespace: fin-orders
      localName: Execution
      label: Execution
      definition: >-
        An Execution is an immutable provider fill or fill-report fact that occurs in one exact event stream, used for
        recording the real economic content of a trade through explicit execution-side and contra-side accounts, party
        roles, instrument, quantity, price, and the matching quotation contract.
      cnNote: 成交，是发生在确切事件流中的不可变供应方成交或成交回报事实，用于以显式的执行方与对手方账户、当事人角色、工具、数量、价格与报价契约记录一笔买卖的真实经济内容。
      participantRoles:
        - id: executionStream
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
          minCount: 1
          maxCount: 1
          label: execution stream
          definition: exact source-locked event stream version reporting the execution
        - id: executionExternalOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 1
          maxCount: 1
          label: execution external order
          definition: exact external order version filled by the execution
        - id: executionOrderIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 1
          maxCount: 1
          label: execution order intent
          definition: exact originating order intent version
        - id: executionAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: execution account
          definition: logical financial account whose order perspective is represented
        - id: executionParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: execution party
          definition: logical principal Party whose account-side perspective is represented by the execution
        - id: contraAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 0
          maxCount: 1
          label: contra account
          definition: optional logical FinancialAccount occupying the counterparty-side account role; absent when the execution is an anonymous order-book fill or a client-side report without bilateral evidence
        - id: contraParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: contra party
          definition: optional logical Party occupying the counterparty role; absent when no bilateral evidence is available, independently of any executing broker; a "unknown Party" placeholder is forbidden
        - id: executionInstrument
          range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
          minCount: 1
          maxCount: 1
          label: execution instrument
          definition: logical financial instrument that was bought or sold
        - id: executionListing
          range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
          minCount: 0
          maxCount: 1
          label: execution listing
          definition: optional exact PIT-eligible listing version for a listed execution
        - id: executionOtcContext
          range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
          minCount: 0
          maxCount: 1
          label: execution OTC context
          definition: optional exact OTC context; required only when no listing is supplied (deprecated with OTCTradingContext per ADR-024; to be migrated to NonVenueMarketContext via a cross-module follow-up)
        - id: executionVenue
          range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
          minCount: 0
          maxCount: 1
          label: execution venue
          definition: optional logical TradingFacility where the execution occurred, distinct from the execution listing
        - id: executionQuotationContract
          range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
          minCount: 1
          maxCount: 1
          label: execution quotation contract
          definition: exact direct-unit quotation contract matching context, instrument, currency, and quantity unit; v1.1.0 covers single-instrument direct-unit quotation only
        - id: executingBroker
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: executing broker
          definition: optional logical party that executed or reported the fill
        - id: clientBeneficialOwner
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: client beneficial owner
          definition: optional logical party that is the beneficial owner on whose behalf the execution is made
        - id: investmentDecisionMaker
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: investment decision maker
          definition: optional logical party responsible for the investment decision
        - id: executionDecisionMaker
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: execution decision maker
          definition: optional logical party responsible for the execution decision
        - id: executingAlgorithm
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: executing algorithm
          definition: optional logical party representing the algorithm that generated or routed the order
        - id: transmittingFirm
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: transmitting firm
          definition: optional logical firm that transmitted the order to the executing venue
        - id: executingFirm
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: executing firm
          definition: optional logical firm that executed the order
        - id: reportingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: reporting party
          definition: optional logical party responsible for reporting the execution
        - id: clearingMember
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: clearing member
          definition: optional logical clearing member party
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerExecutionId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceOrderKey
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderSide
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/executionQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/executionPrice
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/disclosureStatus
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/executedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerReportedAt
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/tradeDate
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/venueTradeId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerReportId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/matchId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/positionEffect
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/shortSaleIndicator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderCapacity
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MatchedTrade:
      iri: https://axiolune.ai/ontology/finance/orders-execution/MatchedTrade
      namespace: fin-orders
      localName: MatchedTrade
      label: Matched Trade
      definition: >-
        A Matched Trade is an immutable bilateral trade fact that links two account-side executions (or one execution
        to its known counterparty) when bilateral evidence is sufficient, used to record the real two-sided economic
        trade with both contra roles required and a disclosure status. It is absent for anonymous order-book fills or
        client-side reports that cannot supply bilateral facts; those remain as single-sided Executions.
      cnNote: 已匹配成交，是当双边证据充分时将两个账户侧成交（或一个成交与其已知对手方）联系起来的不可变双边成交事实，用于以双方对手角色均必需并带披露状态记录真实双边经济成交。对于无法提供双边事实的匿名订单簿成交或客户侧报告，该对象缺席，仍为单边成交。
      participantRoles:
        - id: matchedExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: matched execution
          definition: exact account-side execution version that is one side of the matched trade
        - id: matchedContraExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: 1
          label: matched contra execution
          definition: optional exact contra-side execution version when both sides are recorded as executions
        - id: matchedContraParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: matched contra party
          definition: logical Party occupying the counterparty role in the matched trade; required for a bilateral trade
        - id: matchedContraAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: matched contra account
          definition: logical FinancialAccount occupying the counterparty-side account role in the matched trade; required for a bilateral trade
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/disclosureStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/matchId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Fee:
      iri: https://axiolune.ai/ontology/finance/orders-execution/Fee
      namespace: fin-orders
      localName: Fee
      label: Execution Fee
      definition: >-
        A Fee is an immutable charge or rebate fact recorded for one exact Execution version, used for expressing the
        economic or regulatory cost of a trade through a strictly positive amount together with a fee-effect direction,
        whose direction is never carried by a signed amount.
      cnNote: 成交费用，是针对确切成交版本记录的不可变收费或返利事实，用于以严格为正的金额配合费用效应方向表达一笔成交的经济或监管费用，其方向不以符号金额承载。
      participantRoles:
        - id: feeExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: fee execution
          definition: exact execution version assessed the fee
        - id: feeAssessor
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 0
          maxCount: 1
          label: fee assessor
          definition: optional logical venue, broker, clearer, or authority assessing the fee
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/feeId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/feeKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/feeEffect
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/feeAmount
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExternalOrderStatusMapping:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping
      namespace: fin-orders
      localName: ExternalOrderStatusMapping
      label: External Order Status Mapping
      definition: >-
        An External Order Status Mapping is a reviewed, effective-dated mapping, used for translating one provider raw
        status code into exactly one canonical lifecycle state, and for preventing provider values from entering the
        canonical vocabulary.
      cnNote: 外部订单状态映射，是经评审且带生效期的映射，用于把某一供应方原始状态码映射到唯一的规范生命周期状态，阻止供应方取值进入规范词表。
      participantRoles:
        - id: statusProvider
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: status provider
          definition: logical provider publishing the raw status code
        - id: statusVocabulary
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusVocabulary
          minCount: 1
          maxCount: 1
          label: status vocabulary
          definition: exact external status vocabulary version containing the raw code
        - id: statusMappingReviewer
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: status mapping reviewer
          definition: logical reviewing authority accepting the mapping decision
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerApiIdentifier
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/providerSchemaVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/statusMappingVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/rawStatusCode
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/canonicalLifecycleState
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/reviewDecisionRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/reviewDecisionDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LiquidityRoleDetermination:
      iri: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleDetermination
      namespace: fin-orders
      localName: LiquidityRoleDetermination
      label: Liquidity Role Determination
      definition: >-
        A Liquidity Role Determination is a source-capability-governed liquidity-role fact for one exact Execution, used
        for delivering, from the execution account-order perspective, either a classified liquidity role supported by
        exact raw-field and mapping evidence, or an unavailable conclusion supported by exact contract or field-absence
        evidence.
      cnNote: 流动性角色判定，是受来源能力约束、针对确切成交的流动性角色判定事实，用于从执行账户订单视角给出已分类的流动性角色或基于确切契约与字段缺失证据的不可用结论。
      participantRoles:
        - id: determinedExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: determined execution
          definition: exact execution version whose account-order liquidity role is determined
        - id: determinationStream
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
          minCount: 1
          maxCount: 1
          label: determination stream
          definition: exact event stream version whose capability controls the result branch
        - id: liquidityMapping
          range: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRoleMapping
          minCount: 0
          maxCount: 1
          label: liquidity mapping
          definition: exact reviewed mapping version required for a classified result
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/liquidityPerspective
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/liquidityDeterminationResult
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/liquidityRole
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/liquidityUnavailableReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceRecordRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/sourceRecordDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/rawFieldLocator
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/rawLexicalValue
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/fieldAbsenceProbeRef
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/fieldAbsenceProbeDigest
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderEventIntegrityFinding:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderEventIntegrityFinding
      namespace: fin-orders
      localName: OrderEventIntegrityFinding
      label: Order Event Integrity Finding
      definition: >-
        An Order Event Integrity Finding is a typed finding fact for an event-stream defect, used for recording each kind
        of integrity problem occurring in the event stream by defect kind, and for fixing the subject and evidence set
        for each defect kind.
      cnNote: 订单事件完整性发现，是针对事件流缺陷的类型化发现事实，用于按缺陷类别记录事件流中发生的各类完整性问题，并为每类缺陷固化其主体与证据集合。
      participantRoles:
        - id: findingStream
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
          minCount: 1
          maxCount: 1
          label: finding stream
          definition: exact event stream version evaluated for the defect
        - id: relatedLifecycleEvent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
          minCount: 0
          maxCount: null
          label: related lifecycle event
          definition: exact lifecycle event version in the kind-specific subject set
        - id: relatedExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: null
          label: related execution
          definition: exact execution version in the kind-specific subject set
        - id: evaluatedTransitionProfile
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfile
          minCount: 0
          maxCount: 1
          label: evaluated transition profile
          definition: exact transition-profile version required for a transition violation
        - id: subjectFillExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 0
          maxCount: 1
          label: subject fill execution
          definition: exact fill version in the kind-specific lateFill subject
        - id: subjectTerminalEvent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
          minCount: 0
          maxCount: 1
          label: subject terminal event
          definition: exact terminal event version preceding a kind-specific lateFill
        - id: subjectMissingAcknowledgementOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 0
          maxCount: 1
          label: subject missing acknowledgement order
          definition: exact ExternalOrder version in a missingAcknowledgement subject
        - id: subjectFromEvent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
          minCount: 0
          maxCount: 1
          label: subject from event
          definition: exact predecessor event version in a transitionViolation subject
        - id: subjectToEvent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
          minCount: 0
          maxCount: 1
          label: subject to event
          definition: exact successor event version in a transitionViolation subject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/orderIntegrityKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/affectedKeyDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/relatedVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/missingKeyFrom
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/missingKeyTo
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/findingProviderEventId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/observedSourceOrderKey
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/requiredPredecessorSourceOrderKey
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/expectedAfterSourceOrderKey
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderRoute:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderRoute
      namespace: fin-orders
      localName: OrderRoute
      label: Order Route
      definition: >-
        An Order Route is an immutable routing fact that connects a parent OrderIntent (or parent route) to a child
        ExternalOrder or child intent via a destination, routed quantity, route time, and route status/reason, used to
        express venue-neutral, smart-order-router, best-execution, multi-child, and broker-decides-venue delegation
        without forcing the parent intent to bind a single listing or OTC context before provider acceptance.
      cnNote: 订单路由，是把父订单意图（或父路由）经目的地、路由数量、路由时间与路由状态/原因连接到子外部订单或子意图的不可变路由事实，用于表达场所中立、智能订单路由、最佳执行、多子单与经纪商决定场所的委托，而无需在供应方接受前强制父意图绑定单一挂牌或场外上下文。
      participantRoles:
        - id: routeParentIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 1
          maxCount: 1
          label: route parent intent
          definition: exact parent OrderIntent version being routed
        - id: routeChildExternalOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 0
          maxCount: 1
          label: route child external order
          definition: optional exact child ExternalOrder version produced by the route
        - id: routeChildIntent
          range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
          minCount: 0
          maxCount: 1
          label: route child intent
          definition: optional exact child OrderIntent version produced by the route for further routing
        - id: routeDestination
          range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
          minCount: 0
          maxCount: 1
          label: route destination
          definition: optional logical TradingFacility destination of the route
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/routedQuantity
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/routeTime
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/routeStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/routeReason
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ExecutionAllocation:
      iri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionAllocation
      namespace: fin-orders
      localName: ExecutionAllocation
      label: Execution Allocation
      definition: >-
        An Execution Allocation is an immutable allocation fact that distributes one source Execution across one or
        more AllocationLine target accounts, used to express post-execution allocation, average-price allocation, and
        bunched-order back-allocation with quantity conservation, while detailed allocation and clearing semantics
        remain in post-trade-operations with a stable cross-module reference to the source Execution.
      cnNote: 成交分配，是把单一源成交分配到一个或多个 AllocationLine 目标账户的不可变分配事实，用于以数量守恒表达执行后分配、均分配与打包订单后分配，而详细分配与清算语义保留在 post-trade-operations 并通过稳定的跨模块引用指向源成交。
      participantRoles:
        - id: allocationSourceExecution
          range: https://axiolune.ai/ontology/finance/orders-execution/Execution
          minCount: 1
          maxCount: 1
          label: allocation source execution
          definition: exact source Execution version being allocated
        - id: allocationLine
          range: https://axiolune.ai/ontology/finance/orders-execution/AllocationLine
          minCount: 1
          maxCount: null
          label: allocation line
          definition: one or more exact AllocationLine versions that partition the source execution quantity
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/allocationStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OrderRevision:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderRevision
      namespace: fin-orders
      localName: OrderRevision
      label: Order Revision
      definition: >-
        An Order Revision is an immutable cancel/replace chain fact that links a revision request to its previous and
        root order, used to express the FIX ClOrdID/OrigClOrdID-style order chain with replace, cancel, cancel-replace,
        reject, replaced terms, and a priority-preserved flag, rather than a single fixed order identifier updated
        in place.
      cnNote: 订单修订，是把修订请求链接到其前序与根订单的不可撤改单链事实，用于以 FIX ClOrdID/OrigClOrdID 风格订单链表达替换、撤销、撤改、拒绝、被替换条款与优先级保留标记，而非以单个固定订单标识原地更新。
      participantRoles:
        - id: revisionOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 1
          maxCount: 1
          label: revision order
          definition: exact ExternalOrder version that is the subject of the revision
        - id: revisionPreviousOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 0
          maxCount: 1
          label: revision previous order
          definition: optional exact previous ExternalOrder version in the chain
        - id: revisionRootOrder
          range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
          minCount: 0
          maxCount: 1
          label: revision root order
          definition: optional exact root ExternalOrder version of the chain
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/revisionRequestId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/revisionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/replacedTerms
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/orders-execution/priorityPreserved
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/patterns/attributes/observedAt
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    intentAccount:
      iri: https://axiolune.ai/ontology/finance/orders-execution/intentAccount
      namespace: fin-orders
      localName: intentAccount
      label: intent account
      definition: relationship from an OrderIntent to its logical FinancialAccount, used for identifying the account principal of the trade at the intent level
      cnNote: 意图账户，是从订单意图指向其逻辑金融账户的关系，用于在意图层面标识该交易所属的账户主体。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
      characteristics:
        - functional
    intentInstrument:
      iri: https://axiolune.ai/ontology/finance/orders-execution/intentInstrument
      namespace: fin-orders
      localName: intentInstrument
      label: intent instrument
      definition: relationship from an OrderIntent to its logical FinancialInstrument, used for identifying the instrument to be bought or sold by the trade intent
      cnNote: 意图工具，是从订单意图指向其逻辑金融工具的关系，用于标识该交易意图所欲买卖的工具标的。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      characteristics:
        - functional
    intentListing:
      iri: https://axiolune.ai/ontology/finance/orders-execution/intentListing
      namespace: fin-orders
      localName: intentListing
      label: intent listing
      definition: relationship from an OrderIntent to its optional exact listed trading context, used for binding the listed trading context of the intent when trading on an exchange
      cnNote: 意图挂牌，是从订单意图指向其可选的确切场内交易挂牌的关系，用于在挂牌交易时绑定该意图的挂牌交易上下文。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      characteristics:
        - functional
    intentOtcContext:
      iri: https://axiolune.ai/ontology/finance/orders-execution/intentOtcContext
      namespace: fin-orders
      localName: intentOtcContext
      label: intent OTC context
      definition: relationship from an OrderIntent to its optional exact OTC trading context, used for binding the OTC trading context of the intent when trading over the counter
      cnNote: 意图场外上下文，是从订单意图指向其可选的确切场外交易上下文的关系，用于在场外交易时绑定该意图的场外交易上下文。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      characteristics:
        - functional
    externalOrderProvider:
      iri: https://axiolune.ai/ontology/finance/orders-execution/externalOrderProvider
      namespace: fin-orders
      localName: externalOrderProvider
      label: external order provider
      definition: relationship from an ExternalOrder to the logical provider Party, used for identifying the execution service provider that accepted or holds the external order
      cnNote: 外部订单供应方，是从外部订单指向其逻辑供应方当事人的关系，用于标识受理或托管该外部订单的执行服务方。
      domain: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    externalOrderOriginatingIntent:
      iri: https://axiolune.ai/ontology/finance/orders-execution/externalOrderOriginatingIntent
      namespace: fin-orders
      localName: externalOrderOriginatingIntent
      label: external order originating intent
      definition: relationship from an ExternalOrder to its exact originating OrderIntent version, used for anchoring the external order to its unique client trade intent
      cnNote: 外部订单源起意图，是从外部订单指向其确切的源起订单意图版本的关系，用于把外部订单锚定到其唯一的客户交易意图。
      domain: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
      range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      characteristics:
        - functional
    streamProvider:
      iri: https://axiolune.ai/ontology/finance/orders-execution/streamProvider
      namespace: fin-orders
      localName: streamProvider
      label: stream provider
      definition: relationship from an OrderEventStream to its logical provider Party, used for identifying the execution service provider that supplies the event stream data
      cnNote: 事件流供应方，是从订单事件流指向其逻辑供应方当事人的关系，用于标识提供该事件流数据的执行服务方。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    streamExternalOrder:
      iri: https://axiolune.ai/ontology/finance/orders-execution/streamExternalOrder
      namespace: fin-orders
      localName: streamExternalOrder
      label: stream external order
      definition: relationship from an OrderEventStream to its one ExternalOrder logical identity, used for locking the event stream to the single external order it carries
      cnNote: 事件流外部订单，是从订单事件流指向其唯一外部订单逻辑身份的关系，用于把事件流锁定到其承载的那一笔外部订单。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderEventStream
      range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
      characteristics:
        - functional
    statusVocabularyProvider:
      iri: https://axiolune.ai/ontology/finance/orders-execution/statusVocabularyProvider
      namespace: fin-orders
      localName: statusVocabularyProvider
      label: status vocabulary provider
      definition: relationship from an external status vocabulary to its logical publishing Party, used for identifying the provider that publishes the raw status-code vocabulary
      cnNote: 状态词表供应方，是从外部状态词表指向其逻辑发布当事人的关系，用于标识发布该原始状态码词表的供应方。
      domain: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusVocabulary
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    transitionProfileProvider:
      iri: https://axiolune.ai/ontology/finance/orders-execution/transitionProfileProvider
      namespace: fin-orders
      localName: transitionProfileProvider
      label: transition profile provider
      definition: relationship from a transition profile to the logical provider whose lifecycle it evaluates, used for identifying the provider whose lifecycle the profile evaluates
      cnNote: 流转配置供应方，是从订单流转配置指向其逻辑供应方当事人的关系，用于标识该配置所评估其生命周期的供应方。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfile
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    intentIssuer:
      iri: https://axiolune.ai/ontology/finance/orders-execution/intentIssuer
      namespace: fin-orders
      localName: intentIssuer
      label: intent issuer
      definition: relationship from an OrderIntent to the logical Party that issued the intent, used to identify the client, strategy, or authorized routing process that originated the trade intent independently of the account
      cnNote: 意图发起方，是从订单意图指向发出该意图的逻辑参与方的关系，用于独立于账户标识发起该交易意图的客户、策略或授权路由过程。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    intentIdentifierAuthority:
      iri: https://axiolune.ai/ontology/finance/orders-execution/intentIdentifierAuthority
      namespace: fin-orders
      localName: intentIdentifierAuthority
      label: intent identifier authority
      definition: relationship from an OrderIntent to the logical IdentifierAuthority that scopes its clientIntentId, used to establish the two-component logical key (authority, clientIntentId) so that two different authorities using the same clientIntentId remain distinct
      cnNote: 意图标识权威，是从订单意图指向限定其 clientIntentId 的逻辑标识权威的关系，用于建立两分量逻辑键（权威，clientIntentId），使两个不同权威使用相同 clientIntentId 仍可区分。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
      characteristics:
        - functional
    executionVenue:
      iri: https://axiolune.ai/ontology/finance/orders-execution/executionVenue
      namespace: fin-orders
      localName: executionVenue
      label: execution venue
      definition: relationship from an Execution to the logical TradingFacility where the execution occurred, used to distinguish the actual execution venue from the execution listing
      cnNote: 成交场所，是从成交指向成交发生所在的逻辑交易设施的关系，用于区分实际成交场所与成交挂牌。
      domain: https://axiolune.ai/ontology/finance/orders-execution/Execution
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    reportsExecution:
      iri: https://axiolune.ai/ontology/finance/orders-execution/reportsExecution
      namespace: fin-orders
      localName: reportsExecution
      label: reports execution
      definition: relationship from a fill-kind OrderLifecycleEvent to the exact Execution version it records, used to close the event—execution—cumulative-quantity—state loop
      cnNote: 报告成交，是从成交类生命周期事件指向其所记录的确切成交版本的关系，用于闭合事件—成交—累计数量—状态闭环。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
      range: https://axiolune.ai/ontology/finance/orders-execution/Execution
      characteristics:
        - functional
    appliedStatusMapping:
      iri: https://axiolune.ai/ontology/finance/orders-execution/appliedStatusMapping
      namespace: fin-orders
      localName: appliedStatusMapping
      label: applied status mapping
      definition: relationship from an OrderLifecycleEvent to the exact ExternalOrderStatusMapping version applied to translate its raw provider status code into a canonical lifecycle state, used to make the state machine auditable
      cnNote: 所应用状态映射，是从生命周期事件指向用于将其原始供应方状态码翻译为规范生命周期状态的确切外部订单状态映射版本的关系，用于使状态机可审计。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
      range: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping
      characteristics:
        - functional
    appliedTransitionProfile:
      iri: https://axiolune.ai/ontology/finance/orders-execution/appliedTransitionProfile
      namespace: fin-orders
      localName: appliedTransitionProfile
      label: applied transition profile
      definition: relationship from an OrderLifecycleEvent to the exact OrderTransitionProfile version whose transition table governed the event's state transition, used to make the transition auditable
      cnNote: 所应用流转配置，是从生命周期事件指向其状态转移所依据转移表的确切订单流转配置版本的关系，用于使转移可审计。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
      range: https://axiolune.ai/ontology/finance/orders-execution/OrderTransitionProfile
      characteristics:
        - functional
    acceptableVenueSet:
      iri: https://axiolune.ai/ontology/finance/orders-execution/acceptableVenueSet
      namespace: fin-orders
      localName: acceptableVenueSet
      label: acceptable venue set
      definition: relationship from a venue-neutral OrderIntent to one or more logical TradingFacility venues acceptable for its execution, used as the venue-neutral alternative to a single listing or OTC context binding
      cnNote: 可接受场所集合，是从场所中立订单意图指向一个或多个可接受执行场所的逻辑交易设施的关系，作为单一挂牌或场外上下文绑定的场所中立替代。
      domain: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics: []
    executionQuotationConvention:
      iri: https://axiolune.ai/ontology/finance/orders-execution/executionQuotationConvention
      namespace: fin-orders
      localName: executionQuotationConvention
      label: execution quotation convention
      definition: relationship from an Execution to its quotation convention, used as the hook to be broadened from DirectUnitPriceQuotationContract to the abstract QuotationConvention (ADR-021) in a cross-module follow-up; in v1.1.0 it references the retained DirectUnitPriceQuotationContract
      cnNote: 成交报价约定，是从成交指向其报价约定的关系，作为从 DirectUnitPriceQuotationContract 扩展为抽象 QuotationConvention（ADR-021）的跨模块后续钩子；在 v1.1.0 中引用保留的 DirectUnitPriceQuotationContract。
      domain: https://axiolune.ai/ontology/finance/orders-execution/Execution
      range: https://axiolune.ai/ontology/finance/instruments/DirectUnitPriceQuotationContract
      characteristics:
        - functional
    allocationTargetAccount:
      iri: https://axiolune.ai/ontology/finance/orders-execution/allocationTargetAccount
      namespace: fin-orders
      localName: allocationTargetAccount
      label: allocation target account
      definition: relationship from an AllocationLine to the logical FinancialAccount that is the allocation target, used to express post-execution allocation across multiple final accounts
