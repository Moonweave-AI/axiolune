module:
  moduleIri: https://axiolune.ai/ontology/finance/orders-execution
  baseIri: https://axiolune.ai/ontology/finance/orders-execution/
  preferredPrefix: fin-orders
  version: 0.2.0
  label: Orders and Execution
  definition: >-
    order intent, lifecycle events, execution facts, and external status mappings that capture trade order semantics
    with event-driven state transitions and explicit execution-to-position derivation
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
      version: 0.1.0
      artifactDigest: sha256:e64d6782499a636bb016bed59056cbcffef160c9ad43d78ff93a479285998295
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/finance/instruments
      version: 0.1.0
      artifactDigest: sha256:081b14706df28e69f9b98308709c767885a58e2d958c265bf7b16768e3b901b7
      importMode: All
    - moduleIri: https://axiolune.ai/ontology/finance/market-structure
      version: 0.1.0
      artifactDigest: sha256:53ad88cebb3a0525721bcbe8620cc49fae1cd051511df395b7212e0b283d9d7e
      importMode: All
  exports: []
  status: approved
domain:
  OrderSide:
    iri: https://axiolune.ai/ontology/finance/orders-execution/OrderSide
    namespace: fin-orders
    localName: OrderSide
    label: Order Side
    definition: controlled vocabulary indicating the direction of an order (buy or sell)
    values:
      - Buy
      - Sell
    note: >-
      Aligned with FIX Side (54): 1=Buy, 2=Sell. NautilusTrader OrderSide (BUY/SELL). Does not include NO_ORDER_SIDE
      sentinel.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/orders-execution/OrderSide
  OrderType:
    iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType
    namespace: fin-orders
    localName: OrderType
    label: Order Type
    definition: controlled vocabulary of order execution instructions (market, limit, stop, stop-limit)
    values:
      - Market
      - Limit
      - Stop
      - StopLimit
      - MarketIfTouched
      - LimitIfTouched
    note: >-
      Aligned with FIX OrdType (40). NautilusTrader OrderType enum. Lean OrderType enum. First release covers common
      types; complex types (trailing stop, iceberg) deferred.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/orders-execution/OrderType
  TimeInForce:
    iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce
    namespace: fin-orders
    localName: TimeInForce
    label: Time In Force
    definition: controlled vocabulary of order validity duration (GTC, IOC, FOK, DAY)
    values:
      - GTC
      - IOC
      - FOK
      - DAY
      - GTD
      - AtTheOpen
      - AtTheClose
    note: >-
      Aligned with FIX TimeInForce (59). NautilusTrader TimeInForce enum. GTC=Good-Till-Cancel, IOC=Immediate-Or-Cancel,
      FOK=Fill-Or-Kill, DAY=Day, GTD=Good-Till-Date.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce
  OrderLifecycleState:
    iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState
    namespace: fin-orders
    localName: OrderLifecycleState
    label: Order Lifecycle State
    definition: controlled vocabulary of canonical order states in the lifecycle state machine
    values:
      - Initialized
      - Denied
      - Emulated
      - Released
      - Submitted
      - Accepted
      - Rejected
      - PendingUpdate
      - PendingCancel
      - PartiallyFilled
      - Filled
      - Canceled
      - Expired
      - Triggered
    note: >-
      Expanded Round-2 from Nautilus OrderStatus (PendingUpdate/PendingCancel/Denied/Emulated/Released/Triggered) and
      Lean CancelPending/UpdateSubmitted. Orders remain an event log via OrderLifecycleEvent + OrderEventKind;
      ExternalOrderStatusMapping bridges venue codes. Not a compression of FIX OrdStatus to 8 states.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState
  OrderEventKind:
    iri: https://axiolune.ai/ontology/finance/orders-execution/OrderEventKind
    namespace: fin-orders
    localName: OrderEventKind
    label: Order Event Kind
    definition: controlled vocabulary of immutable order event kinds in the event-sourced audit trail
    values:
      - Initialized
      - Denied
      - Submitted
      - Accepted
      - Rejected
      - PendingUpdate
      - PendingCancel
      - Updated
      - ModifyRejected
      - CancelRejected
      - PartiallyFilled
      - Filled
      - Canceled
      - Expired
      - Triggered
    note: >-
      Mirrors Nautilus OrderEventAny (event types) distinct from OrderLifecycleState (resulting state). Lean
      OrderEvent.Status is the state payload on each event.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/orders-execution/OrderEventKind
  LiquiditySide:
    iri: https://axiolune.ai/ontology/finance/orders-execution/LiquiditySide
    namespace: fin-orders
    localName: LiquiditySide
    label: Liquidity Side
    definition: controlled vocabulary indicating whether an execution was a maker (added liquidity) or taker (removed liquidity)
    values:
      - Maker
      - Taker
      - NoLiquiditySide
    note: >-
      Aligned with FIX LiquidityInd (851). NautilusTrader LiquiditySide. Impacts fee calculation and market
      microstructure analysis.
    version: 0.1.0
    maintainer: Axiolune
    vocabulary: https://axiolune.ai/ontology/finance/orders-execution/LiquiditySide
  hasOrderSide:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasOrderSide
    namespace: fin-orders
    localName: hasOrderSide
    label: Has Order Side
    definition: relation from an order intent or execution to its side (Buy or Sell)
    valueType: codelist
    codeListReference: OrderSide
    defaultCardinality:
      minCount: 1
      maxCount: 1
  hasOrderType:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasOrderType
    namespace: fin-orders
    localName: hasOrderType
    label: Has Order Type
    definition: relation from an order intent to its type (Market, Limit, Stop, etc.)
    valueType: codelist
    codeListReference: OrderType
    defaultCardinality:
      minCount: 1
      maxCount: 1
  hasTimeInForce:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasTimeInForce
    namespace: fin-orders
    localName: hasTimeInForce
    label: Has Time In Force
    definition: relation from an order intent to its validity duration
    valueType: codelist
    codeListReference: TimeInForce
    defaultCardinality:
      minCount: 1
      maxCount: 1
  hasOrderQuantity:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasOrderQuantity
    namespace: fin-orders
    localName: hasOrderQuantity
    label: Has Order Quantity
    definition: relation from an order intent to its requested quantity
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Should use Quantity type binding from M3 when cross-module type references are wired
  hasLimitPrice:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasLimitPrice
    namespace: fin-orders
    localName: hasLimitPrice
    label: Has Limit Price
    definition: relation from a limit or stop-limit order to its limit price
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Required for Limit/StopLimit orders; absent for Market orders. Should use Money type binding from M3.
  hasStopPrice:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasStopPrice
    namespace: fin-orders
    localName: hasStopPrice
    label: Has Stop Price
    definition: relation from a stop or stop-limit order to its stop trigger price
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Required for Stop/StopLimit orders; absent for Market/Limit orders. Should use Money type binding from M3.
  hasLifecycleState:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasLifecycleState
    namespace: fin-orders
    localName: hasLifecycleState
    label: Has Lifecycle State
    definition: relation from an order lifecycle event to the resulting canonical state
    valueType: codelist
    codeListReference: OrderLifecycleState
    defaultCardinality:
      minCount: 1
      maxCount: 1
  hasEventKind:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasEventKind
    namespace: fin-orders
    localName: hasEventKind
    label: Has Event Kind
    definition: relation from an order lifecycle event to its event-log kind (distinct from resulting lifecycle state)
    valueType: codelist
    codeListReference: OrderEventKind
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Nautilus OrderEventAny discriminant; Lean OrderEvent carries Status as payload
  hasPreviousState:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasPreviousState
    namespace: fin-orders
    localName: hasPreviousState
    label: Has Previous State
    definition: relation from an order lifecycle event to the previous canonical state (for state transition validation)
    valueType: codelist
    codeListReference: OrderLifecycleState
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Absent for Initialized events (no previous state). Required for all subsequent events.
  hasExecutionPrice:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasExecutionPrice
    namespace: fin-orders
    localName: hasExecutionPrice
    label: Has Execution Price
    definition: relation from an execution to its actual executed price
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Should use Money type binding from M3 when cross-module type references are wired
  hasExecutionQuantity:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasExecutionQuantity
    namespace: fin-orders
    localName: hasExecutionQuantity
    label: Has Execution Quantity
    definition: relation from an execution to its actual executed quantity
    valueType: https://axiolune.ai/ontology/finance/foundation/QuantityValue
    defaultCardinality:
      minCount: 1
      maxCount: 1
    note: Should use Quantity type binding from M3 when cross-module type references are wired
  hasCommission:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasCommission
    namespace: fin-orders
    localName: hasCommission
    label: Has Commission
    definition: relation from an execution to its commission or fee amount
    valueType: https://axiolune.ai/ontology/finance/foundation/MonetaryAmount
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Optional; some executions may have zero fees or fees not yet known. Should use Money type binding from M3.
  hasLiquiditySide:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasLiquiditySide
    namespace: fin-orders
    localName: hasLiquiditySide
    label: Has Liquidity Side
    definition: relation from an execution to its liquidity classification (maker or taker)
    valueType: codelist
    codeListReference: LiquiditySide
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Optional; some venues do not report liquidity side
  hasExternalOrderId:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasExternalOrderId
    namespace: fin-orders
    localName: hasExternalOrderId
    label: Has External Order ID
    definition: relation from an order lifecycle event to the venue/broker-assigned order identifier
    valueType: string
    defaultCardinality:
      minCount: 0
      maxCount: 1
    note: Absent for Initialized/Submitted events (not yet assigned by venue). Present after Accepted.
  hasExternalStatus:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasExternalStatus
    namespace: fin-orders
    localName: hasExternalStatus
    label: Has External Status
    definition: relation from an external order status mapping to the venue-specific raw status code
    valueType: string
    defaultCardinality:
      minCount: 1
      maxCount: 1
  hasCanonicalState:
    iri: https://axiolune.ai/ontology/finance/orders-execution/hasCanonicalState
    namespace: fin-orders
    localName: hasCanonicalState
    label: Has Canonical State
    definition: relation from an external order status mapping to the mapped canonical lifecycle state
    valueType: codelist
    codeListReference: OrderLifecycleState
    defaultCardinality:
      minCount: 1
      maxCount: 1
  OrderIntent:
    iri: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
    namespace: fin-orders
    localName: OrderIntent
    label: Order Intent
    definition: >-
      trader or strategy desired trade instruction specifying instrument, side, quantity, type, time-in-force, and price
      constraints, representing the business intent before venue submission
    note: >-
      Aligned with nautilus_trader OrderInitialized event, Lean OrderTicket, FIX NewOrderSingle. Not the same as an
      external venue order (ExternalOrderStatusMapping bridges the two). M2-PLAN §6.3: semantic intent model, not actual
      submission. Round-5: intentsInstrument required; intentsListing optional (venue-specific listing).
    patternBindings:
      - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    participantRoles:
      - roleName: intentsInstrument
        range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
        minCount: 1
        maxCount: 1
        label: intents instrument
        definition: the financial instrument this order intent seeks to buy or sell
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/intentsInstrument
      - roleName: intentsListing
        range: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
        minCount: 0
        maxCount: 1
        label: intents listing
        definition: optional venue listing on which the intent should execute
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/intentsListing
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasOrderSide
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasOrderType
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasTimeInForce
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasOrderQuantity
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasLimitPrice
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasStopPrice
        minCount: 0
        maxCount: 1
  OrderLifecycleEvent:
    iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleEvent
    namespace: fin-orders
    localName: OrderLifecycleEvent
    label: Order Lifecycle Event
    definition: >-
      immutable state transition fact recording a change in order status, with previous state, resulting state,
      timestamp, reason, and external identifiers, forming an event-sourced audit trail
    patternBindings:
      - rationale: >-
          Order lifecycle events have valid time (when event occurred in business time), knowledge time (when platform
          learned of event), and availability time (when event was made queryable)
        pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - rationale: >-
          Order lifecycle events must track source (venue, broker, internal emulator), revision, and evidence for audit
          and reconciliation
        pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      Event-sourced design per nautilus_trader (10 event types). FIX ExecutionReport (35=8). Lean OrderEvent. State
      machine enforces valid transitions (e.g., Initialized→Submitted→Accepted, not Initialized→Filled). M2-PLAN §6.3:
      handles out-of-order, duplicates, missing acknowledgments via reconciliation field.
    participantRoles:
      - roleName: transitionsOrder
        range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
        minCount: 1
        maxCount: 1
        label: transitions order
        definition: the order intent that this lifecycle event applies to
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/transitionsOrder
      - roleName: occurredAtVenue
        range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
        minCount: 0
        maxCount: 1
        label: occurred at venue
        definition: the trading venue where this lifecycle event occurred (optional; internal events may not have venue)
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/occurredAtVenue
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasLifecycleState
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasEventKind
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasPreviousState
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasExternalOrderId
        minCount: 0
        maxCount: 1
  Execution:
    iri: https://axiolune.ai/ontology/finance/orders-execution/Execution
    namespace: fin-orders
    localName: Execution
    label: Execution
    definition: >-
      trade execution fact recording actual fill of an order or part thereof, with executed price, quantity, venue,
      commission, liquidity side, and trade identifier, enabling position derivation
    patternBindings:
      - rationale: >-
          Executions have valid time (trade timestamp), knowledge time (when platform received trade report), and
          availability time (when execution became queryable for position calc)
        pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - rationale: >-
          Executions must track source (venue trade report, broker confirmation), trade ID, and evidence for
          reconciliation and audit
        pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      Aligned with FIX ExecutionReport with ExecType=Trade (150=F). NautilusTrader OrderFilled event → Execution. Lean
      OrderEvent with Status=Filled. M2-PLAN §6.3: Execution facts enable position derivation and reconciliation with
      external HoldingSnapshot.
    participantRoles:
      - roleName: executesOrder
        range: https://axiolune.ai/ontology/finance/orders-execution/OrderIntent
        minCount: 1
        maxCount: 1
        label: executes order
        definition: the order intent that this execution partially or fully fills
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/executesOrder
      - roleName: executedInstrument
        range: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
        minCount: 1
        maxCount: 1
        label: executed instrument
        definition: the financial instrument that was executed
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/executedInstrument
      - roleName: executedAtVenue
        range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
        minCount: 1
        maxCount: 1
        label: executed at venue
        definition: the trading venue where this execution occurred
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/executedAtVenue
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasOrderSide
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasExecutionPrice
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasExecutionQuantity
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasCommission
        minCount: 0
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasLiquiditySide
        minCount: 0
        maxCount: 1
  ExternalOrderStatusMapping:
    iri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping
    namespace: fin-orders
    localName: ExternalOrderStatusMapping
    label: External Order Status Mapping
    definition: >-
      versioned mapping from venue-specific or broker-specific raw order status codes to canonical Axiolune lifecycle
      states, enabling status translation without polluting canonical vocabulary
    patternBindings:
      - rationale: >-
          Status mappings are versioned (venues change their status codes over time); valid time tracks mapping
          effective period
        pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - rationale: Status mappings must track source (venue API documentation version), evidence, and approval
        pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    note: >-
      M2-PLAN §5.2 fin-orders-execution: 'ExternalOrderStatusMapping bridges venue codes to canonical states, not
      pollute canonical CodeList'. Examples: Binance 'NEW'→Accepted, 'PARTIALLY_FILLED'→PartiallyFilled,
      'FILLED'→Filled, 'CANCELED'→Canceled, 'REJECTED'→Rejected. Each venue/broker gets its own mapping set.
    participantRoles:
      - roleName: appliesToVenue
        range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
        minCount: 1
        maxCount: 1
        label: applies to venue
        definition: the trading venue or broker whose status codes this mapping applies to
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/appliesToVenue
      - roleName: mapsToCanonicalLifecycleState
        range: https://axiolune.ai/ontology/finance/orders-execution/OrderLifecycleState
        minCount: 0
        maxCount: 1
        label: maps to canonical lifecycle state
        definition: optional canonical lifecycle state that the external status maps to
        roleIri: https://axiolune.ai/ontology/finance/orders-execution/mapsToCanonicalLifecycleState
    attributeUses:
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasExternalStatus
        minCount: 1
        maxCount: 1
      - attribute: https://axiolune.ai/ontology/finance/orders-execution/hasCanonicalState
        minCount: 1
        maxCount: 1
