      cnNote: 均价，是成交快照中记录的成交量加权平均成交货币价格，通过确切的直接单位报价契约解释。
      valueType: https://axiolune.ai/ontology/meta/core/values/MonetaryAmount
      defaultCardinality:
        minCount: 0
        maxCount: 1
    disclosureStatus:
      iri: https://axiolune.ai/ontology/finance/orders-execution/disclosureStatus
      namespace: fin-orders
      localName: disclosureStatus
      label: disclosure status
      definition: closed disclosure classification attribute of an Execution or MatchedTrade, used to express whether the counterparty is disclosed, anonymous, or partially disclosed
      cnNote: 披露状态，是成交或已匹配成交的封闭披露分类属性，用于表达对手方是已披露、匿名还是部分披露。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/DisclosureStatus
      defaultCardinality:
        minCount: 0
        maxCount: 1
    executedAt:
      iri: https://axiolune.ai/ontology/finance/orders-execution/executedAt
      namespace: fin-orders
      localName: executedAt
      label: executed at
      definition: optional inclusive UTC instant at which the trade represented by an execution actually occurred, distinct from the provider-reporteded and observed timestamps
      cnNote: 成交时刻，是成交所代表交易实际发生的可选含端 UTC 瞬时，区别于供应方上报与系统观察时间戳。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerReportedAt:
      iri: https://axiolune.ai/ontology/finance/orders-execution/providerReportedAt
      namespace: fin-orders
      localName: providerReportedAt
      label: provider reported at
      definition: optional inclusive UTC instant at which the provider reported the execution, distinct from the actual execution and system observation timestamps
      cnNote: 供应方上报时刻，是供应方上报成交的可选含端 UTC 瞬时，区别于实际成交与系统观察时间戳。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    tradeDate:
      iri: https://axiolune.ai/ontology/finance/orders-execution/tradeDate
      namespace: fin-orders
      localName: tradeDate
      label: trade date
      definition: optional business trade date to which an execution belongs, used for trade-date attribution that may differ from the execution and observation dates
      cnNote: 交易日，是成交所属的可选营业交易日，用于可能区别于成交与观察日期的交易日归属。
      valueType: date
      defaultCardinality:
        minCount: 0
        maxCount: 1
    venueTradeId:
      iri: https://axiolune.ai/ontology/finance/orders-execution/venueTradeId
      namespace: fin-orders
      localName: venueTradeId
      label: venue trade identifier
      definition: optional venue-side trade identifier string assigned by the execution venue, distinct from the provider execution identifier and the match identifier
      cnNote: 场所成交标识，是成交场所分配的可选场所侧成交标识字符串，区别于供应方成交标识与匹配标识。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerReportId:
      iri: https://axiolune.ai/ontology/finance/orders-execution/providerReportId
      namespace: fin-orders
      localName: providerReportId
      label: provider report identifier
      definition: optional provider report identifier string for the execution report, distinct from the venue trade identifier and the match identifier
      cnNote: 供应方报告标识，是成交回报的可选供应方报告标识字符串，区别于场所成交标识与匹配标识。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    matchId:
      iri: https://axiolune.ai/ontology/finance/orders-execution/matchId
      namespace: fin-orders
      localName: matchId
      label: match identifier
      definition: optional match identifier string for the matched trade, distinct from the venue trade identifier and the provider report identifier
      cnNote: 匹配标识，是已匹配成交的可选匹配标识字符串，区别于场所成交标识与供应方报告标识。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    positionEffect:
      iri: https://axiolune.ai/ontology/finance/orders-execution/positionEffect
      namespace: fin-orders
      localName: positionEffect
      label: position effect
      definition: closed position-effect classification attribute separate from order side, used to express open, close, roll, and similar position effects
      cnNote: 头寸效应，是与订单方向相区别的封闭头寸效应分类属性，用于表达开仓、平仓、滚动等头寸效应。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/PositionEffect
      defaultCardinality:
        minCount: 0
        maxCount: 1
    shortSaleIndicator:
      iri: https://axiolune.ai/ontology/finance/orders-execution/shortSaleIndicator
      namespace: fin-orders
      localName: shortSaleIndicator
      label: short sale indicator
      definition: closed short-sale indicator classification attribute, used to express long, short, and short-exempt markers required by short-sale regulation (e.g. SEC Regulation SHO)
      cnNote: 卖空标记，是封闭卖空标记分类属性，用于表达卖空监管（如 SEC Regulation SHO）所要求的 long、short、short-exempt 标记。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/ShortSaleIndicator
      defaultCardinality:
        minCount: 0
        maxCount: 1
    orderCapacity:
      iri: https://axiolune.ai/ontology/finance/orders-execution/orderCapacity
      namespace: fin-orders
      localName: orderCapacity
      label: order capacity
      definition: closed capacity classification attribute, used to express agency, principal, and riskless-principal capacity separate from the order side and position effect
      cnNote: 订单能力，是封闭能力分类属性，用于表达独立于订单方向与头寸效应的 agency、principal、riskless-principal 能力。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/OrderCapacity
      defaultCardinality:
        minCount: 0
        maxCount: 1
    routingPolicy:
      iri: https://axiolune.ai/ontology/finance/orders-execution/routingPolicy
      namespace: fin-orders
      localName: routingPolicy
      label: routing policy
      definition: optional string describing the routing policy governing a venue-neutral OrderIntent (e.g. best-execution, SOR), used when no single listing or OTC context is bound
      cnNote: 路由策略，是描述管辖场所中立订单意图路由策略（如最佳执行、SOR）的可选字符串，在未绑定单一挂牌或场外上下文时使用。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    routedQuantity:
      iri: https://axiolune.ai/ontology/finance/orders-execution/routedQuantity
      namespace: fin-orders
      localName: routedQuantity
      label: routed quantity
      definition: strictly positive absolute Quantity routed by an OrderRoute, used to express the quantity delegated to a child order or destination
      cnNote: 路由数量，是某订单路由路由的严格为正的绝对数量，用于表达委托给子单或目的地的数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    routeTime:
      iri: https://axiolune.ai/ontology/finance/orders-execution/routeTime
      namespace: fin-orders
      localName: routeTime
      label: route time
      definition: inclusive UTC instant at which an OrderRoute was made, used to order routes within a parent intent
      cnNote: 路由时刻，是某订单路由发生的含端 UTC 瞬时，用于在父意图内排列路由次序。
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    routeStatus:
      iri: https://axiolune.ai/ontology/finance/orders-execution/routeStatus
      namespace: fin-orders
      localName: routeStatus
      label: route status
      definition: closed route-status classification attribute of an OrderRoute, used to express the state of a route (e.g. routed, accepted, rejected, cancelled)
      cnNote: 路由状态，是某订单路由的封闭路由状态分类属性，用于表达路由的状态（如 routed、accepted、rejected、cancelled）。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/RouteStatus
      defaultCardinality:
        minCount: 1
        maxCount: 1
    routeReason:
      iri: https://axiolune.ai/ontology/finance/orders-execution/routeReason
      namespace: fin-orders
      localName: routeReason
      label: route reason
      definition: optional reason text or normalized identifier explaining why a route was made or changed, used to explain routing decisions
      cnNote: 路由原因，是解释路由为何发生或变更的可选原因文本或规范化标识，用于解释路由决策。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    allocationQuantity:
      iri: https://axiolune.ai/ontology/finance/orders-execution/allocationQuantity
      namespace: fin-orders
      localName: allocationQuantity
      label: allocation quantity
      definition: strictly positive absolute Quantity allocated to one AllocationLine target account, used to partition a source execution quantity with conservation
      cnNote: 分配数量，是分配给某一分配行目标账户的严格为正的绝对数量，用于以守恒分割源成交数量。
      valueType: https://axiolune.ai/ontology/meta/core/values/QuantityValue
      defaultCardinality:
        minCount: 1
        maxCount: 1
    allocationStatus:
      iri: https://axiolune.ai/ontology/finance/orders-execution/allocationStatus
      namespace: fin-orders
      localName: allocationStatus
      label: allocation status
      definition: closed allocation-status classification attribute of an ExecutionAllocation or AllocationLine, used to express the state of an allocation (e.g. proposed, accepted, rejected, cancelled, corrected)
      cnNote: 分配状态，是成交分配或分配行的封闭分配状态分类属性，用于表达分配的状态（如 proposed、accepted、rejected、cancelled、corrected）。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/AllocationStatus
      defaultCardinality:
        minCount: 1
        maxCount: 1
    revisionRequestId:
      iri: https://axiolune.ai/ontology/finance/orders-execution/revisionRequestId
      namespace: fin-orders
      localName: revisionRequestId
      label: revision request identifier
      definition: immutable string identifier of a cancel/replace revision request, used to provide the logical identity primary key of an OrderRevision
      cnNote: 修订请求标识，是撤改修订请求的不可变字符串标识，用于为订单修订提供逻辑身份主键。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    revisionKind:
      iri: https://axiolune.ai/ontology/finance/orders-execution/revisionKind
      namespace: fin-orders
      localName: revisionKind
      label: revision kind
      definition: closed classification attribute of an OrderRevision, used to distinguish replace, cancel, and cancel-replace revision kinds
      cnNote: 修订类别，是订单修订的封闭分类属性，用于区分 replace、cancel、cancel-replace 修订类别。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/RevisionKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    replacedTerms:
      iri: https://axiolune.ai/ontology/finance/orders-execution/replacedTerms
      namespace: fin-orders
      localName: replacedTerms
      label: replaced terms
      definition: optional string describing the terms that replace the previous order terms in a replace or cancel-replace revision
      cnNote: 替换条款，是描述在替换或撤改修订中替换前序订单条款的可选字符串。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    priorityPreserved:
      iri: https://axiolune.ai/ontology/finance/orders-execution/priorityPreserved
      namespace: fin-orders
      localName: priorityPreserved
      label: priority preserved
      definition: boolean attribute indicating whether a replace or cancel-replace revision preserves the original order priority in the book
      cnNote: 优先级保留，是表明替换或撤改修订是否保留原订单在簿中的优先级的布尔属性。
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: 1
    feePayer:
      iri: https://axiolune.ai/ontology/finance/orders-execution/feePayer
      namespace: fin-orders
      localName: feePayer
      label: fee payer
      definition: relationship from a Fee to the logical Party that pays the fee, used to fix the fee effect relative to an explicit payer
      cnNote: 费用支付方，是从费用指向支付该费用的逻辑参与方的关系，用于将费用效应相对于明确支付方固定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    feePayee:
      iri: https://axiolune.ai/ontology/finance/orders-execution/feePayee
      namespace: fin-orders
      localName: feePayee
      label: fee payee
      definition: relationship from a Fee to the logical Party that receives the fee, used to fix the fee effect relative to an explicit payee or assessor
      cnNote: 费用收取方，是从费用指向收取该费用的逻辑参与方的关系，用于将费用效应相对于明确收取方或评估方固定。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    feeBasis:
      iri: https://axiolune.ai/ontology/finance/orders-execution/feeBasis
      namespace: fin-orders
      localName: feeBasis
      label: fee basis
      definition: optional string describing the basis on which a fee was calculated (e.g. per-share, notional, bps), used to explain the fee amount
      cnNote: 费用依据，是描述费用计算依据（如每股、按名义、按基点）的可选字符串，用于解释费用金额。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    feeTaxJurisdiction:
      iri: https://axiolune.ai/ontology/finance/orders-execution/feeTaxJurisdiction
      namespace: fin-orders
      localName: feeTaxJurisdiction
      label: fee tax jurisdiction
      definition: optional logical Jurisdiction under whose tax authority a fee falls, used for tax-jurisdiction-scoped fees
      cnNote: 费用税务辖区，是费用所属税务辖区的可选逻辑辖区，用于按税务辖区划分的费用。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
  identifierTypes: {}
  codeLists:
    OrderSide:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderSide
      namespace: fin-orders
      localName: OrderSide
      label: Order Side
      definition: Closed semantic direction vocabulary without implementation sentinel members, used for canonically expressing the buy-or-sell direction of an order.
      cnNote: 订单方向词表，是不含实现哨兵成员的封闭语义方向词表，用于规范表达订单的买卖方向。
      vocabulary: Order Side
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderSide/value/Buy
          notation: Buy
          label: Buy
          definition: direction that increases long exposure or decreases short exposure
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderSide/value/Sell
          notation: Sell
          label: Sell
          definition: direction that decreases long exposure or increases short exposure
    OrderLineageKind:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLineageKind
      namespace: fin-orders
      localName: OrderLineageKind
      label: Order Lineage Kind
      definition: Closed classification of immutable order-intent routing transformations, used for distinguishing the two lineage transformation types, split and aggregation.
      cnNote: 订单谱系类别词表，是不可变订单意图路由变换的封闭分类，用于区分拆分与聚合两类谱系变换。
      vocabulary: Order Lineage Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLineageKind/value/split
          notation: split
          label: split
          definition: one exact source intent is transformed into at least two exact result intents
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderLineageKind/value/aggregation
          notation: aggregation
          label: aggregation
          definition: at least two exact source intents are transformed into one exact result intent
    OrderType:
      iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType
      namespace: fin-orders
      localName: OrderType
      label: Order Type
      definition: Closed classification of executable order instructions by their price and trigger semantics, used for canonically expressing order types such as market, limit, and stop.
      cnNote: 订单类型词表，是按价格与触发语义对可执行订单指令的封闭分类，用于规范表达市价、限价、止损等订单类型。
      vocabulary: Order Type
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType/value/Market
          notation: Market
          label: Market
          definition: order without a limit or trigger price
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType/value/Limit
          notation: Limit
          label: Limit
          definition: order constrained by a limit price
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType/value/Stop
          notation: Stop
          label: Stop
          definition: order activated by a trigger price
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType/value/StopLimit
          notation: StopLimit
          label: Stop Limit
          definition: triggered order constrained by a limit price
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType/value/MarketIfTouched
          notation: MarketIfTouched
          label: Market If Touched
          definition: market order activated by a touched trigger
        - iri: https://axiolune.ai/ontology/finance/orders-execution/OrderType/value/LimitIfTouched
          notation: LimitIfTouched
          label: Limit If Touched
          definition: limit order activated by a touched trigger
    TriggerPriceBasis:
      iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis
      namespace: fin-orders
      localName: TriggerPriceBasis
      label: Trigger Price Basis
      definition: >-
        Closed classification of the market observation basis evaluated by a conditional order trigger, used for
        canonically expressing which market quote serves as the trigger evaluation basis.
      cnNote: 触发价基准词表，是条件订单触发所评估的市场观察基准的封闭分类，用于规范表达以何种行情作为触发判定依据。
      vocabulary: Trigger Price Basis
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/venueDefault
          notation: venueDefault
          label: venue default
          definition: trigger basis selected by the reviewed venue or adapter contract
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/lastPrice
          notation: lastPrice
          label: last price
          definition: most recent eligible trade price
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/markPrice
          notation: markPrice
          label: mark price
          definition: reviewed mark-price observation
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/indexPrice
          notation: indexPrice
          label: index price
          definition: reviewed index-price observation
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/bidAsk
          notation: bidAsk
          label: bid or ask
          definition: side-aware eligible bid or ask observation
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/doubleLast
          notation: doubleLast
          label: double last
          definition: reviewed consecutive-last-price trigger rule
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/doubleBidAsk
          notation: doubleBidAsk
          label: double bid or ask
          definition: reviewed consecutive side-aware quote trigger rule
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/lastOrBidAsk
          notation: lastOrBidAsk
          label: last or bid or ask
          definition: reviewed composite last-trade or side-aware quote rule
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TriggerPriceBasis/value/midPoint
          notation: midPoint
          label: midpoint
          definition: midpoint of the reviewed eligible bid and ask
    TimeInForce:
      iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce
      namespace: fin-orders
      localName: TimeInForce
      label: Time In Force
      definition: Closed vocabulary of order validity duration instructions, used for canonically expressing how long an order remains effective in the market.
      cnNote: 有效期词表，是订单有效期时长指令的封闭词表，用于规范表达订单在市场中保持有效的持续时间。
      vocabulary: Time In Force
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/GTC
          notation: GTC
          label: Good Till Cancel
          definition: valid until explicitly cancelled
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/IOC
          notation: IOC
          label: Immediate Or Cancel
          definition: execute immediately and cancel remainder
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/FOK
          notation: FOK
          label: Fill Or Kill
          definition: execute fully immediately or cancel
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/DAY
          notation: DAY
          label: Day
          definition: valid for the applicable trading day
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/GTD
          notation: GTD
          label: Good Till Date
          definition: valid until the explicit expiry instant
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/AtTheOpen
          notation: AtTheOpen
          label: At The Open
          definition: executable at the applicable opening session
        - iri: https://axiolune.ai/ontology/finance/orders-execution/TimeInForce/value/AtTheClose
          notation: AtTheClose
          label: At The Close
          definition: executable at the applicable closing session
    OrderLifecycleState:
