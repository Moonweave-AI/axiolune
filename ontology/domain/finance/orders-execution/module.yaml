      defaultCardinality:
        minCount: 1
        maxCount: 1
    implementationDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/implementationDigest
      namespace: fin-orders
      localName: implementationDigest
      label: implementation digest
      definition: SHA-256 digest value over the canonical executable implementation bytes, used for locking the implementation content of the transition evaluator
      cnNote: 实现摘要，是规范可执行实现字节的摘要值，用于锁定流转评估器的实现内容。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    inputContractDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/inputContractDigest
      namespace: fin-orders
      localName: inputContractDigest
      label: input contract digest
      definition: SHA-256 digest value of the evaluator input contract, used for locking the input contract of the evaluator
      cnNote: 输入契约摘要，是评估器输入契约的摘要值，用于锁定评估器的输入约定。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    outputContractDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/outputContractDigest
      namespace: fin-orders
      localName: outputContractDigest
      label: output contract digest
      definition: SHA-256 digest value of the evaluator output contract, used for locking the output contract of the evaluator
      cnNote: 输出契约摘要，是评估器输出契约的摘要值，用于锁定评估器的输出约定。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    toolLockRef:
      iri: https://axiolune.ai/ontology/finance/orders-execution/toolLockRef
      namespace: fin-orders
      localName: toolLockRef
      label: tool lock reference
      definition: immutable URI reference to the exact evaluator tool lock, used for locating the tool lock record of the evaluation tool in use
      cnNote: 工具锁引用，是指向确切评估器工具锁的不可变引用，用于定位所用的评估工具锁定记录。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    toolLockDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/toolLockDigest
      namespace: fin-orders
      localName: toolLockDigest
      label: tool lock digest
      definition: SHA-256 digest value of the exact evaluator tool lock bytes, used for verifying the content integrity of the tool lock record
      cnNote: 工具锁摘要，是确切评估器工具锁字节的摘要值，用于验证工具锁记录的内容完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    runtimeDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/runtimeDigest
      namespace: fin-orders
      localName: runtimeDigest
      label: runtime digest
      definition: SHA-256 digest value of the evaluator runtime environment, used for locking the content of the evaluator runtime environment
      cnNote: 运行时摘要，是评估器运行时环境的摘要值，用于锁定评估器运行环境的内容。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    liquidityMappingId:
      iri: https://axiolune.ai/ontology/finance/orders-execution/liquidityMappingId
      namespace: fin-orders
      localName: liquidityMappingId
      label: liquidity mapping identifier
      definition: stable string identifier of a source liquidity-role mapping, used for providing the logical identity primary key of a liquidity mapping
      cnNote: 流动性映射标识，是来源流动性角色映射的稳定字符串标识，用于为流动性映射提供逻辑身份主键。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    rawFieldLocator:
      iri: https://axiolune.ai/ontology/finance/orders-execution/rawFieldLocator
      namespace: fin-orders
      localName: rawFieldLocator
      label: raw field locator
      definition: canonical source-schema field locator string for a liquidity value, used for locating the field in the source record that carries the liquidity value
      cnNote: 原始字段定位符，是流动性数值的来源结构字段规范定位符，用于在来源记录中定位承载流动性取值的字段。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    rawPerspective:
      iri: https://axiolune.ai/ontology/finance/orders-execution/rawPerspective
      namespace: fin-orders
      localName: rawPerspective
      label: raw perspective
      definition: source-contract perspective from which a raw liquidity value is expressed, used for identifying which side perspective the value is given from
      cnNote: 原始视角，是原始流动性取值所表达的来源契约视角，用于标识该取值是从哪一方视角给出的。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
    perspectiveInversion:
      iri: https://axiolune.ai/ontology/finance/orders-execution/perspectiveInversion
      namespace: fin-orders
      localName: perspectiveInversion
      label: perspective inversion
      definition: boolean attribute indicating whether a reviewed mapping inverts a contra-perspective source value, used for handling liquidity values that originate from the counterparty side
      cnNote: 视角反转，是表明评审映射是否反转对手视角来源取值的布尔属性，用于处理来自对手方的流动性取值。
      valueType: boolean
      defaultCardinality:
        minCount: 1
        maxCount: 1
    mappingDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/mappingDigest
      namespace: fin-orders
      localName: mappingDigest
      label: mapping digest
      definition: SHA-256 digest value of the canonical raw-value mapping table, used for verifying the content integrity of the mapping table
      cnNote: 映射摘要，是规范原始取值映射表的摘要值，用于验证映射表的内容完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    liquidityPerspective:
      iri: https://axiolune.ai/ontology/finance/orders-execution/liquidityPerspective
      namespace: fin-orders
      localName: liquidityPerspective
      label: liquidity perspective
      definition: fixed execution-account-order perspective attribute of a liquidity determination, used for specifying the perspective on which the determination result is based
      cnNote: 流动性视角，是流动性判定的固定执行账户订单视角属性，用于明确判定结果所基于的视角。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/LiquidityPerspective
      defaultCardinality:
        minCount: 1
        maxCount: 1
    liquidityDeterminationResult:
      iri: https://axiolune.ai/ontology/finance/orders-execution/liquidityDeterminationResult
      namespace: fin-orders
      localName: liquidityDeterminationResult
      label: liquidity determination result
      definition: classified-or-unavailable branch discriminator attribute, used for expressing whether the determination yields a role or declares unavailability
      cnNote: 流动性判定结果，是区分已分类与不可用分支的判定属性，用于表达判定是给出角色还是声明不可用。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/LiquidityDeterminationResult
      defaultCardinality:
        minCount: 1
        maxCount: 1
    liquidityRole:
      iri: https://axiolune.ai/ontology/finance/orders-execution/liquidityRole
      namespace: fin-orders
      localName: liquidityRole
      label: liquidity role
      definition: maker, taker, or contract-defined auction-undefined result attribute, used for expressing the role of the execution order in providing liquidity
      cnNote: 流动性角色，是表明执行订单作为 maker、taker 或拍卖未定义的结果属性，用于表达该成交在提供流动性方面的角色。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/LiquidityRole
      defaultCardinality:
        minCount: 0
        maxCount: 1
    liquidityUnavailableReason:
      iri: https://axiolune.ai/ontology/finance/orders-execution/liquidityUnavailableReason
      namespace: fin-orders
      localName: liquidityUnavailableReason
      label: liquidity unavailable reason
      definition: contractUnsupported or providerNotSpecified evidence branch reason attribute, used for explaining why a liquidity role cannot be classified
      cnNote: 流动性不可用原因，是支持契约不支持或供应方未指定证据分支的原因属性，用于解释为何无法分类流动性角色。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/LiquidityUnavailableReason
      defaultCardinality:
        minCount: 0
        maxCount: 1
    sourceRecordRef:
      iri: https://axiolune.ai/ontology/finance/orders-execution/sourceRecordRef
      namespace: fin-orders
      localName: sourceRecordRef
      label: source record reference
      definition: immutable URI reference to the exact provider record evaluated, used for locating the original record that was determined
      cnNote: 来源记录引用，是指向所评估的确切供应方记录的不可变引用，用于定位被判定的原始记录。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceRecordDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/sourceRecordDigest
      namespace: fin-orders
      localName: sourceRecordDigest
      label: source record digest
      definition: SHA-256 digest value of the exact canonical provider record bytes, used for verifying the content integrity of the evaluated record
      cnNote: 来源记录摘要，是确切的规范供应方记录字节的摘要值，用于验证所评估记录的内容完整性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    rawLexicalValue:
      iri: https://axiolune.ai/ontology/finance/orders-execution/rawLexicalValue
      namespace: fin-orders
      localName: rawLexicalValue
      label: raw lexical value
      definition: exact source lexical value used by a classified liquidity mapping, used for recording the raw field value on which the mapping was based
      cnNote: 原始词法取值，是已分类流动性映射所用的确切来源词法取值，用于记录映射所依据的原始字段取值。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fieldAbsenceProbeRef:
      iri: https://axiolune.ai/ontology/finance/orders-execution/fieldAbsenceProbeRef
      namespace: fin-orders
      localName: fieldAbsenceProbeRef
      label: field absence probe reference
      definition: immutable URI reference to the completed source-record field-absence probe, used for locating the probe record that proves the absence of a field
      cnNote: 字段缺失探针引用，是指向已完成的来源记录字段缺失探针的不可变引用，用于定位证明某字段缺失的探针记录。
      valueType: uri
      defaultCardinality:
        minCount: 0
        maxCount: 1
    fieldAbsenceProbeDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/fieldAbsenceProbeDigest
      namespace: fin-orders
      localName: fieldAbsenceProbeDigest
      label: field absence probe digest
      definition: SHA-256 digest value of the completed field-absence probe record, used for verifying the content integrity of the probe record
      cnNote: 字段缺失探针摘要，是已完成的字段缺失探针记录的摘要值，用于验证探针记录的内容完整性。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    orderIntegrityKind:
      iri: https://axiolune.ai/ontology/finance/orders-execution/orderIntegrityKind
      namespace: fin-orders
      localName: orderIntegrityKind
      label: order integrity kind
      definition: closed kind attribute of order event stream defect, used for distinguishing different defect types such as duplicate conflict and sequence gap
      cnNote: 订单完整性类别，是订单事件流缺陷的封闭类别属性，用于区分重复冲突、序号缺口等不同缺陷类型。
      valueType: https://axiolune.ai/ontology/finance/orders-execution/OrderIntegrityKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    affectedKeyDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/affectedKeyDigest
      namespace: fin-orders
      localName: affectedKeyDigest
      label: affected key digest
      definition: kind-discriminated digest value of the strict OrderFindingSubject object, used for digesting and distinguishing finding subjects by defect kind
      cnNote: 受影响键摘要，是完整性发现主体对象的摘要值，用于按缺陷类别对发现主体进行摘要与区分。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    relatedVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/orders-execution/relatedVersionSetDigest
      namespace: fin-orders
      localName: relatedVersionSetDigest
      label: related version set digest
      definition: digest value of the sorted unique exact versions cited by an integrity finding, used for verifying the integrity and consistency of the version set involved in the finding
      cnNote: 关联版本集摘要，是完整性发现所引用的排序去重确切版本集合的摘要值，用于验证发现所涉版本集合的完整性与一致性。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
