        maxCount: 1
    missingKeyTo:
      iri: https://axiolune.ai/ontology/finance/orders-execution/missingKeyTo
      namespace: fin-orders
      localName: missingKeyTo
      label: missing key to
      definition: exclusive end of a sequence-gap half-open interval, used for bounding the upper end of the missing key interval
      cnNote: 缺失键终点，是序号缺口半开区间的排他性终点，用于界定缺失序号区间的上界。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    findingProviderEventId:
      iri: https://axiolune.ai/ontology/finance/orders-execution/findingProviderEventId
      namespace: fin-orders
      localName: findingProviderEventId
      label: finding provider event identifier
      definition: provider event identifier in a duplicateConflict finding subject, used for indicating which event identifier is in conflict
      cnNote: 发现供应方事件标识，是重复冲突发现主体中的供应方事件标识，用于指明发生冲突的事件标识。
