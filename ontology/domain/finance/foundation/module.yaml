      localName: hasLegalName
      label: Has Legal Name
      definition: Has Legal Name, is a relation from a legal entity to its
        registered legal name, used for carrying the formal designation of an
        entity in a legal context
      cnNote: 法律名称，是从法律实体指向其注册法律名称的关系，用于承载实体在法律语境下的正式称谓。
      alignments:
