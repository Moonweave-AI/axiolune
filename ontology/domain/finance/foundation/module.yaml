module:
  moduleIri: https://axiolune.ai/ontology/finance/foundation
  baseIri: https://axiolune.ai/ontology/finance/foundation/
  preferredPrefix: fin-foundation
  version: 2.0.0
  label: Financial Foundation
  definition: Financial Foundation, is a domain module that defines shared
    vocabulary for identity, identifiers, currency, jurisdiction, and party,
    used for providing a common identity and classification basis across all
    finance domain modules
  cnNote: 金融基础模块，是本体工程中定义标识、标识符、货币、司法管辖区与参与方等共享词汇的领域模块，旨在为所有金融领域模块提供共同的身份与分类基础。
  imports: []
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    IdentifiableSubject:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      namespace: fin-foundation
      localName: IdentifiableSubject
      label: Identifiable Subject
      definition: Identifiable Subject, is a common base class for domain subjects
        that can be assigned a governed identifier, used for providing a unified
        identity foundation for everything in the finance domain that has
        identity
      cnNote: 可标识主体，是可被赋予受治理标识符的领域主体共同基类，用于为金融领域一切有同一性的事物提供统一的标识基础。
      superTypes: []
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IdentifierAuthority:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
      namespace: fin-foundation
      localName: IdentifierAuthority
      label: Identifier Authority
      definition: Identifier Authority, is an organization authorized to maintain a
        scheme or issue identifier assignments under it, used for defining who
        is entitled to issue and manage identifiers within a given scheme
      cnNote: 标识符授权机构，是经授权维护标识方案或在方案下签发标识赋值的组织，用于界定谁有权在某一方案下发放与管理标识符。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/Party
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IdentifierScheme:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      namespace: fin-foundation
      localName: IdentifierScheme
      label: Identifier Scheme
      definition: Identifier Scheme, is a versioned specification that governs the
        syntax, compatibility, uniqueness, and evidence of identifiers, used
        for providing a verifiable and traceable rule framework for a class of
        identifiers
      cnNote: 标识方案，是治理标识符语法、兼容性、唯一性与证据的版本化规范，用于为一类标识符提供可验证、可追溯的规则框架。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeValidatorRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierUniquenessScope
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeSourceEvidenceRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IdentifierValue:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      namespace: fin-foundation
      localName: IdentifierValue
      label: Identifier Value
      definition: Identifier Value, is a canonical identifier value bound to a
        specific identifier scheme, whose logical identity is determined jointly
        by the scheme identity and the canonical lexical form
      cnNote: 标识值，是绑定到特定标识方案的规范标识符取值，其逻辑同一性由方案身份与规范词法形式共同确定。
      superTypes: []
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ISINValue:
      iri: https://axiolune.ai/ontology/finance/foundation/ISINValue
      namespace: fin-foundation
      localName: ISINValue
      label: ISIN Value
      definition: ISIN Value, is a versioned identifier value governed by the ISO
        6166 scheme that carries one canonical ISIN lexical value, used for
        uniquely identifying securities worldwide
      cnNote: ISIN值，是受ISO 6166方案治理的版本化标识值，承载一个规范ISIN词法取值，用于在全球范围内唯一识别证券。
      alignments:
        - vocabulary: FIBO
          targetIri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/InternationalSecuritiesIdentificationNumber
          relation: rdfs:subClassOf
          sourceRelease:
            vocabulary: FIBO
            release: FIBO development snapshot; observed versionIRI 20260701
            artifactDigest: sha256:202f38c7d61f6d5abe57935d9165b3729f33c6ada5a9632c2e596725fb79694f
          rationale: FIBO models the ISO 6166 identifier as an OWL class; Axiolune
            ISINValue is the narrower scheme-bound, temporal, and provenanced
            identifier-value class, while the lexical ISIN datatype remains
            unaligned.
          verification:
            status: reviewed
            verifiedBy: urn:axiolune:agent:codex:m2-alignment-semantic-review-2026-08-01
            verifiedAt: 2026-08-01T01:35:11+08:00
            notes: Machine semantic review closed against locked FIBO bytes and generated
              OWL projection; not terminal DRI approval.
          sourceLocator:
            kind: rdfResource
            path: SEC/Securities/SecuritiesIdentification.rdf
            mediaType: application/rdf+xml
            extractorProfileRef:
              kind: path
              root: sourceTree
              path: scripts/domain/reference-extractors/rdf-resource-rdfxml-v1.json
            extractorProfileDigest: sha256:28b979f70323a4b46008d8aadc7ee1085cb433a89ee16b4f2e4ca136c35bf39a
            selectionDigest: sha256:22de90bf1b919f1bc77a294373f92758a2f3abf51cc77bfb04c3224d4a2dc829
            resourceIri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/InternationalSecuritiesIdentificationNumber
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/isinLexicalValue
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LEIValue:
      iri: https://axiolune.ai/ontology/finance/foundation/LEIValue
      namespace: fin-foundation
      localName: LEIValue
      label: LEI Value
      definition: LEI Value, is a versioned identifier value governed by ISO 17442
        and the GLEIF LEI system that carries one canonical LEI lexical value,
        used for uniquely identifying legal entities
      cnNote: LEI值，是受ISO 17442与GLEIF LEI体系治理的版本化标识值，承载一个规范LEI词法取值，用于唯一识别法律实体。
      alignments:
        - vocabulary: FIBO
          targetIri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/LegalEntityIdentifier
          relation: rdfs:subClassOf
          sourceRelease:
            vocabulary: FIBO
            release: FIBO development snapshot; observed versionIRI 20260701
            artifactDigest: sha256:202f38c7d61f6d5abe57935d9165b3729f33c6ada5a9632c2e596725fb79694f
          rationale: FIBO models the ISO 17442 identifier as an OWL class; Axiolune
            LEIValue is the narrower scheme-bound, temporal, and provenanced
            identifier-value class, while the lexical LEI datatype remains
            unaligned.
          verification:
            status: reviewed
            verifiedBy: urn:axiolune:agent:codex:m2-alignment-semantic-review-2026-08-01
            verifiedAt: 2026-08-01T01:35:11+08:00
            notes: Machine semantic review closed against locked FIBO bytes and generated
              OWL projection; not terminal DRI approval.
          sourceLocator:
            kind: rdfResource
            path: BE/LegalEntities/LEIEntities.rdf
            mediaType: application/rdf+xml
            extractorProfileRef:
              kind: path
              root: sourceTree
              path: scripts/domain/reference-extractors/rdf-resource-rdfxml-v1.json
            extractorProfileDigest: sha256:28b979f70323a4b46008d8aadc7ee1085cb433a89ee16b4f2e4ca136c35bf39a
            selectionDigest: sha256:2f0beaad1354541771aac38f7a4fb3dde5c92d92fe6a761c0d1792af4b6fe047
            resourceIri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/LegalEntityIdentifier
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/leiLexicalValue
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MICValue:
      iri: https://axiolune.ai/ontology/finance/foundation/MICValue
      namespace: fin-foundation
      localName: MICValue
      label: MIC Value
      definition: MIC Value, is a versioned identifier value governed by the ISO
        10383 scheme that carries one canonical four-character MIC lexical
        value, used for uniquely identifying markets and trading venues
      cnNote: MIC值，是受ISO 10383方案治理的版本化标识值，承载一个规范四字符MIC词法取值，用于唯一识别市场与交易场所。
      alignments:
        - vocabulary: FIBO
          targetIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifier
          relation: rdfs:subClassOf
          sourceRelease:
            vocabulary: FIBO
            release: FIBO development snapshot; observed versionIRI 20260701
            artifactDigest: sha256:202f38c7d61f6d5abe57935d9165b3729f33c6ada5a9632c2e596725fb79694f
          rationale: FIBO models the ISO 10383 market identifier as an OWL class; Axiolune
            MICValue is the narrower scheme-bound, temporal, and provenanced
            identifier-value class, while the lexical MIC datatype remains
            unaligned.
          verification:
            status: reviewed
            verifiedBy: urn:axiolune:agent:codex:m2-alignment-semantic-review-2026-08-01
            verifiedAt: 2026-08-01T01:35:11+08:00
            notes: Machine semantic review closed against locked FIBO bytes and generated
              OWL projection; not terminal DRI approval.
          sourceLocator:
            kind: rdfResource
            path: FBC/FunctionalEntities/Markets.rdf
            mediaType: application/rdf+xml
            extractorProfileRef:
              kind: path
              root: sourceTree
              path: scripts/domain/reference-extractors/rdf-resource-rdfxml-v1.json
            extractorProfileDigest: sha256:28b979f70323a4b46008d8aadc7ee1085cb433a89ee16b4f2e4ca136c35bf39a
            selectionDigest: sha256:f321ba9f4798a6b84953a49eada86a60e97700b55e0f8ec8b4ef0c1c17d189a2
            resourceIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifier
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/micLexicalValue
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LocalIdentifierValue:
      iri: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValue
      namespace: fin-foundation
      localName: LocalIdentifierValue
      label: Local Identifier Value
      definition: Local Identifier Value, is an authority-scoped identifier value
        whose lexical form has no meaning independently of its identifier
        scheme, used for identifying subjects within a specific authority scope
      cnNote: 本地标识值，是其词法形式脱离所属标识方案即无意义的授权范围标识值，用于在特定机构范围内标识主体。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/localIdentifierLexicalValue
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FinancialAccount:
      iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
      namespace: fin-foundation
      localName: FinancialAccount
      label: Financial Account
      definition: "Financial Account, is an account that identifies a governed cash,
        securities-custody, or multi-asset holding capability, used for
        precisely representing the identity of a holding party through a
        scheme-bound identifier"
      cnNote: 金融账户，是标识受治理现金、证券托管或多资产持仓能力的账户，用于以方案绑定的标识精确刻画一个持仓主体的同一性。
      alignments:
        - vocabulary: FIBO
          targetIri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
          relation: rdfs:subClassOf
          sourceRelease:
            vocabulary: FIBO
            release: FIBO development snapshot; observed versionIRI 20260701
            artifactDigest: sha256:202f38c7d61f6d5abe57935d9165b3729f33c6ada5a9632c2e596725fb79694f
          rationale: FIBO Account is the broader account container for regular
            transactions and services; Axiolune narrows it to a governed cash,
            securities-custody, or multi-asset holding account with scheme-bound
            identity and separate temporal party-role facts.
          verification:
            status: reviewed
            verifiedBy: urn:axiolune:agent:codex:m2-alignment-semantic-review-2026-08-01
            verifiedAt: 2026-08-01T01:35:11+08:00
            notes: Machine semantic review closed against locked FIBO bytes and generated
              OWL projection; not terminal DRI approval.
          sourceLocator:
            kind: rdfResource
            path: FBC/ProductsAndServices/ClientsAndAccounts.rdf
            mediaType: application/rdf+xml
            extractorProfileRef:
              kind: path
              root: sourceTree
              path: scripts/domain/reference-extractors/rdf-resource-rdfxml-v1.json
            extractorProfileDigest: sha256:28b979f70323a4b46008d8aadc7ee1085cb433a89ee16b4f2e4ca136c35bf39a
            selectionDigest: sha256:ceb23447467629b7ec5f56b141e72e8b99257cddc35704c046114d0dc27a10f4
            resourceIri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/accountType
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Party:
      iri: https://axiolune.ai/ontology/finance/foundation/Party
      namespace: fin-foundation
      localName: Party
      label: Party
      definition: Party, is an autonomous agent that can participate in legal or
        financial relationships, including natural persons and legal entities,
        used for uniformly representing all kinds of actors in financial
        activity
      cnNote: 参与方，是能参与法律或金融关系的自主主体，涵盖自然人与法律实体，用于统一表示金融活动中的各类行为方。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    LegalEntity:
      iri: https://axiolune.ai/ontology/finance/foundation/LegalEntity
      namespace: fin-foundation
      localName: LegalEntity
      label: Legal Entity
      definition: Legal Entity, is an organization that is legally responsible for
        the performance of financial transactions and capable of accruing
        liability on its own, excluding natural persons but including
        governments and supranational entities, used for representing
        non-natural-person subjects
      cnNote: 法律实体，是对金融交易履约承担法律责任且可独立负债的组织，排除自然人但包括政府与超国家机构，用于刻画非自然人主体。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/Party
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/hasLegalName
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Currency:
      iri: https://axiolune.ai/ontology/finance/foundation/Currency
      namespace: fin-foundation
      localName: Currency
      label: Currency
      definition: Currency, is a financial foundation type that serves as a unit of
        valuation and settlement, defined per ISO 4217 by the relevant monetary
        authority, used for uniformly referencing canonical currencies in
        concepts such as monetary amounts and exchange rates
      cnNote: 货币，是作为计价与结算单位的金融基础类型，依ISO 4217由相应货币当局定义，用于在金额、汇率等概念中统一引用规范币种。
      alignments:
        - vocabulary: FIBO
          targetIri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Currency
          relation: rdfs:subClassOf
          sourceRelease:
            vocabulary: FIBO
            release: FIBO development snapshot; observed versionIRI 20260701
            artifactDigest: sha256:202f38c7d61f6d5abe57935d9165b3729f33c6ada5a9632c2e596725fb79694f
          rationale: FIBO Currency is the ISO 4217 monetary measurement-unit concept;
            Axiolune narrows it to a versioned and provenanced currency identity
            whose registry attributes are represented by ISO4217RegistryEntry
            facts.
          verification:
            status: reviewed
            verifiedBy: urn:axiolune:agent:codex:m2-alignment-semantic-review-2026-08-01
            verifiedAt: 2026-08-01T01:35:11+08:00
            notes: Machine semantic review closed against locked FIBO bytes and generated
              OWL projection; not terminal DRI approval.
          sourceLocator:
            kind: rdfResource
            path: FND/Accounting/CurrencyAmount.rdf
            mediaType: application/rdf+xml
            extractorProfileRef:
              kind: path
              root: sourceTree
              path: scripts/domain/reference-extractors/rdf-resource-rdfxml-v1.json
            extractorProfileDigest: sha256:28b979f70323a4b46008d8aadc7ee1085cb433a89ee16b4f2e4ca136c35bf39a
            selectionDigest: sha256:8a4ecdb977fbd0ebaa70c00470edbb597e14d4ec8c090ea3412e2aab4f7ad700
            resourceIri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Currency
      superTypes: []
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    Jurisdiction:
      iri: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
      namespace: fin-foundation
      localName: Jurisdiction
      label: Jurisdiction
      definition: Jurisdiction, is a legal authority that has the power to make and
        enforce rules of conduct within a defined geographical or functional
        scope, used for indicating which legal system governs a financial
        activity
      cnNote: 管辖权，是在确定地理或职能范围内有权制定与执行行为规则的法律权威，用于标注金融活动受何种法律体系约束。
      superTypes: []
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ISO4217RegistryEntry:
      iri: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryEntry
      namespace: fin-foundation
      localName: ISO4217RegistryEntry
      label: ISO 4217 Registry Entry
      definition: ISO 4217 Registry Entry, is an immutable version of an ISO 4217
        registry assertion for one registry authority and alphabetic code, used
        for carrying the numeric code, minor unit, and the currency represented
        by the entry
      cnNote: ISO 4217注册条目，是关于一个注册机构与字母代码的ISO 4217注册断言的不可变版本，用于承载币种数字代码、最小单位及所代表的货币。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217AlphaCode
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217NumericCode
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217MinorUnit
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217EntryStatus
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217RegistrySourceRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IdentifierNamespace:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierNamespace
      namespace: fin-foundation
      localName: IdentifierNamespace
      label: Identifier Namespace
      definition: Identifier Namespace, is a governed naming scope that disambiguates
        authority-scoped identifier values sharing the same lexical form, used as the
        third dimension of the identity key for non-global schemes
      cnNote: 标识符命名空间，是消歧共享同一词法形式的授权范围标识值的受治理命名作用域，用作非全局方案身份键的第三维度。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IdentifierSchemeRelease:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeRelease
      namespace: fin-foundation
      localName: IdentifierSchemeRelease
      label: Identifier Scheme Release
      definition: Identifier Scheme Release, is a versioned set of rules (syntax,
        compatibility, validator profile) for a stable identifier scheme, used for
        separating the stable scheme identity from its evolving rule versions
      cnNote: 标识方案版次，是稳定标识方案的版本化规则集合（语法、兼容性、校验器配置），用于分离稳定方案身份与其演化的规则版本。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeReleaseVersion
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeReleaseValidatorRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierSchemeReleaseSourceEvidenceRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    ISO4217RegistryPublication:
      iri: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryPublication
      namespace: fin-foundation
      localName: ISO4217RegistryPublication
      label: ISO 4217 Registry Publication
      definition: ISO 4217 Registry Publication, is an immutable versioned snapshot of
        an ISO 4217 registry list (current currency & funds, fund codes, or historical),
        used for distinguishing which list an entry belongs to and when it was published
      cnNote: ISO 4217注册发布物，是一个ISO 4217注册清单（当前货币与基金、基金代码或历史清单）的不可变版本化快照，用于区分条目所属清单及其发布时间。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217PublicationListCategory
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/foundation/iso4217PublicationSourceRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    BusinessCalendar:
      iri: https://axiolune.ai/ontology/finance/foundation/BusinessCalendar
      namespace: fin-foundation
      localName: BusinessCalendar
      label: Business Calendar
      definition: Business Calendar, is a thin calendar interface that defines a
        sequence of business days for a jurisdiction, intended to be specialized by
        domain modules such as market-structure's TradingCalendar
      cnNote: 业务日历，是定义某一管辖权下工作日序列的薄日历接口，旨在由领域模块（如 market-structure 的 TradingCalendar）特化实现。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    IdentifierSchemeAuthorization:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeAuthorization
      namespace: fin-foundation
      localName: IdentifierSchemeAuthorization
      label: Identifier Scheme Authorization
      definition: Identifier Scheme Authorization, is a temporal authorization fact
        that empowers an identifier authority to act in one reviewed role under
        a given scheme version, whose validity interval must cover every
        identifier assignment or account identity use that depends on it
      cnNote: 标识方案授权，是赋予标识授权机构在某一方案版本下担任受审角色的时态授权事实，其有效期须覆盖依赖它的标识赋值或账户身份使用。
      participantRoles:
        - id: authorizedSchemeVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
          minCount: 1
          maxCount: 1
          label: authorized scheme version
          definition: exact IdentifierScheme fact version under which the authority role
            is granted
        - id: authorizedAuthorityVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
          minCount: 1
          maxCount: 1
          label: authorized authority version
          definition: exact IdentifierAuthority fact version receiving the scheme
            authorization
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/identifierAuthorityRole
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FinancialIdentifierAssignment:
      iri: https://axiolune.ai/ontology/finance/foundation/FinancialIdentifierAssignment
      namespace: fin-foundation
      localName: FinancialIdentifierAssignment
      label: Financial Identifier Assignment
      definition: "Financial Identifier Assignment, is an authority-scoped temporal
        fact that assigns one governed identifier value version to exactly one
        subject version, used for recording who issued which identifier to
        whom under which scheme"
      cnNote: 金融标识赋值，是将一个受治理标识值版本赋给唯一主体版本的授权范围时态事实，用于记录谁在何种方案下向谁发放了哪个标识符。
      participantRoles:
        - id: identifiedSubjectVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
          minCount: 1
          maxCount: 1
          label: identified subject version
          definition: exact fact version of the subject to which the governed identifier
            is assigned
        - id: identifierValueVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierValue
          minCount: 1
          maxCount: 1
          label: identifier value version
          definition: exact scheme-bound IdentifierValue fact version assigned to the
            subject
        - id: identifierSchemeVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
          minCount: 1
          maxCount: 1
          label: identifier scheme version
          definition: exact IdentifierScheme fact version providing assignment evidence
            and compatibility rules
        - id: assigningAuthorityVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
          minCount: 1
          maxCount: 1
          label: assigning authority version
          definition: exact authorized IdentifierAuthority fact version that made the
            assignment
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/assignmentId
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    IdentifierAssignmentConflict:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAssignmentConflict
      namespace: fin-foundation
      localName: IdentifierAssignmentConflict
      label: Identifier Assignment Conflict
      definition: Identifier Assignment Conflict, is an explicit conflict fact
        emitted when assignments under a globally unique scheme overlap across
        different subjects, used for forbidding silent resolution and
        preserving evidence of the conflict
      cnNote: 标识赋值冲突，是当全局唯一方案的赋值跨不同主体重叠时显式生成的冲突事实，用于禁止静默裁决并留存冲突证据。
      participantRoles:
        - id: conflictingAssignmentVersion
          range: https://axiolune.ai/ontology/finance/foundation/FinancialIdentifierAssignment
          minCount: 2
          maxCount: null
          label: conflicting assignment version
          definition: exact assignment fact version participating in the incompatible
            overlapping assignment set
        - id: conflictSchemeVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
          minCount: 1
          maxCount: 1
          label: conflict scheme version
          definition: exact scheme version whose uniqueness contract is violated by the
            assignment set
        - id: conflictValueVersion
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierValue
          minCount: 1
          maxCount: 1
          label: conflict value version
          definition: exact IdentifierValue version assigned incompatibly to different
            subject identities
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/assignmentVersionSetDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/generatingContextRef
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    FinancialAccountPartyRole:
      iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRole
      namespace: fin-foundation
      localName: FinancialAccountPartyRole
      label: Financial Account Party Role
      definition: Financial Account Party Role, is a temporal fact that assigns one
        reviewed account role to a party for a financial account, serving as
        the sole stored truth of the relationship between an account and a party
      cnNote: 金融账户参与方角色，是为某一参与方在某一金融账户上赋予一个受审账户角色的时态事实，是账户与参与方关系的唯一存储真相。
      participantRoles:
        - id: roleAccount
          range: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
          minCount: 1
          maxCount: 1
          label: role account
          definition: logical FinancialAccount identity to which the Party role applies
        - id: roleParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: role party
          definition: logical Party identity that bears the reviewed role for the account
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/financialAccountPartyRoleKind
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    CurrencyUsage:
      iri: https://axiolune.ai/ontology/finance/foundation/CurrencyUsage
      namespace: fin-foundation
      localName: CurrencyUsage
      label: Currency Usage
      definition: Currency Usage, is a temporal fact asserting that one currency
        identity is used within one jurisdiction, used for recording the lawful
        usage of a currency within a jurisdictional territory
      cnNote: 货币使用，是断言某一货币逻辑身份在某一管辖权内使用的时态事实，用于记录币种在司法地域范围内的合法使用关系。
      participantRoles:
        - id: usedCurrency
          range: https://axiolune.ai/ontology/finance/foundation/Currency
          minCount: 1
          maxCount: 1
          label: used currency
          definition: logical Currency identity whose jurisdictional usage is asserted
        - id: usageJurisdiction
          range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
          minCount: 1
          maxCount: 1
          label: usage jurisdiction
          definition: logical Jurisdiction identity within which the currency usage is
            asserted
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    AuthorityRoleAssignment:
      iri: https://axiolune.ai/ontology/finance/foundation/AuthorityRoleAssignment
      namespace: fin-foundation
      localName: AuthorityRoleAssignment
      label: Authority Role Assignment
      definition: Authority Role Assignment, is a temporal fact that assigns one
        organization a reviewed authority role under a given scheme release, with a
        validity interval and evidence, used for expressing real-world governance
        divisions such as registration authority, maintenance agency, and assigning
        authority
      cnNote: 权威角色任命，是将一个组织在某一方案版次下赋予受审权威角色的时态事实，带有效期与证据，用于表达注册机构、维护机构、赋值机构等现实治理分工。
      participantRoles:
        - id: roleSchemeRelease
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeRelease
          minCount: 1
          maxCount: 1
          label: role scheme release
          definition: exact IdentifierSchemeRelease fact version under which the authority role is granted
        - id: roleAuthority
          range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
          minCount: 1
          maxCount: 1
          label: role authority
          definition: exact IdentifierAuthority fact version receiving the role assignment
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/foundation/authorityRoleKind
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    identifierSchemeMaintainer:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeMaintainer
      namespace: fin-foundation
      localName: identifierSchemeMaintainer
      label: Identifier Scheme Maintainer
      definition: Identifier Scheme Maintainer, is a direct logical reference from an
        identifier scheme version to the identifier authority responsible for
        maintaining that scheme, used for establishing the maintenance
        accountability of a scheme
      cnNote: 标识方案维护方，是从标识方案版本指向负责维护该方案的标识授权机构的直接逻辑引用，用于确立方案的维护责任归属。
      domain: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
      characteristics:
        - functional
    identifierValueScheme:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierValueScheme
      namespace: fin-foundation
      localName: identifierValueScheme
      label: Identifier Value Scheme
      definition: Identifier Value Scheme, is a relation that links an identifier
        value to exactly one identifier scheme identity, used for indicating
        which scheme governs an identifier value
      cnNote: 标识值方案，是将标识值关联到唯一标识方案身份的关系，用于说明一个标识值受哪个方案治理。
      domain: https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      characteristics:
        - functional
    accountIdentifierScheme:
      iri: https://axiolune.ai/ontology/finance/foundation/accountIdentifierScheme
      namespace: fin-foundation
      localName: accountIdentifierScheme
      label: Account Identifier Scheme
      definition: Account Identifier Scheme, is a direct logical reference from a
        financial account to exactly one account identifier scheme identity,
        used for forming the scheme side of an account's identity
      cnNote: 账户标识方案，是金融账户指向唯一账户标识方案身份的直接逻辑引用，用于构成账户的方案侧身份。
      domain: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      characteristics:
        - functional
    accountIdentifierValue:
      iri: https://axiolune.ai/ontology/finance/foundation/accountIdentifierValue
      namespace: fin-foundation
      localName: accountIdentifierValue
      label: Account Identifier Value
      definition: Account Identifier Value, is a direct logical reference from a
        financial account to exactly one local identifier value identity, used
        for forming the value side of an account's identity
      cnNote: 账户标识值，是金融账户指向唯一本地标识值身份的直接逻辑引用，用于构成账户的取值侧身份。
      domain: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
      range: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValue
      characteristics:
        - functional
    iso4217RegistryAuthority:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217RegistryAuthority
      namespace: fin-foundation
      localName: iso4217RegistryAuthority
      label: ISO 4217 Registry Authority
      definition: ISO 4217 Registry Authority, is a direct logical reference from a
        registry entry to the identifier authority that owns the registry
        assertion, used for establishing the registry accountability of an
        entry
      cnNote: ISO 4217注册机构，是从注册条目指向拥有该注册断言的标识授权机构的直接逻辑引用，用于确立条目的注册责任归属。
      domain: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
      characteristics:
        - functional
    iso4217EntryCurrency:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217EntryCurrency
      namespace: fin-foundation
      localName: iso4217EntryCurrency
      label: ISO 4217 Entry Currency
      definition: ISO 4217 Entry Currency, is a direct logical reference from a
        registry entry to the currency represented by that entry, used for
        linking currency registry information to a currency identity
      cnNote: ISO 4217条目货币，是从注册条目指向该条目所代表货币的直接逻辑引用，用于将币种注册信息与货币身份关联。
      domain: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    schemeHasRelease:
      iri: https://axiolune.ai/ontology/finance/foundation/schemeHasRelease
      namespace: fin-foundation
      localName: schemeHasRelease
      label: Scheme Has Release
      definition: Scheme Has Release, is a relation linking a stable identifier scheme
        to one of its versioned releases, used for separating scheme identity from
        rule versioning
      cnNote: 方案拥有版次，是将稳定标识方案关联到其某一版本化版次的关系，用于分离方案身份与规则版本化。
      domain: https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeRelease
    identifierValueNamespace:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierValueNamespace
      namespace: fin-foundation
      localName: identifierValueNamespace
      label: Identifier Value Namespace
      definition: Identifier Value Namespace, is a relation linking an authority-scoped
        identifier value to its governing namespace, used as the third dimension of
        the identity key for non-global schemes
      cnNote: 标识值命名空间，是将授权范围标识值关联到其治理命名空间的关系，用作非全局方案身份键的第三维度。
      domain: https://axiolune.ai/ontology/finance/foundation/IdentifierValue
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierNamespace
    registryEntryPublication:
      iri: https://axiolune.ai/ontology/finance/foundation/registryEntryPublication
      namespace: fin-foundation
      localName: registryEntryPublication
      label: Registry Entry Publication
      definition: Registry Entry Publication, is a relation linking an ISO 4217 registry
        entry to the publication snapshot it belongs to, used for distinguishing which
        list (current, fund, historical) an entry comes from
      cnNote: 注册条目发布物，是将ISO 4217注册条目关联到其所属发布快照的关系，用于区分条目来自哪个清单（当前、基金、历史）。
      domain: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryPublication
  attributeTypes:
    identifierSchemeKind:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeKind
      namespace: fin-foundation
      localName: identifierSchemeKind
      label: Identifier Scheme Kind
      definition: Identifier Scheme Kind, is a reviewed compatibility kind of an
        identifier scheme version, used for distinguishing the identifier value
        subtype and legal subject range that a scheme corresponds to
      cnNote: 标识方案类别，是标识方案版本的受审兼容性类别，用于区分方案所对应的标识值子类型与合法主体范围。
      valueType: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    identifierSchemeVersion:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeVersion
      namespace: fin-foundation
      localName: identifierSchemeVersion
      label: Identifier Scheme Version
      definition: Identifier Scheme Version, is a non-empty version identifier
        assigned by the scheme maintainer, used for identifying a governed
        version of a scheme
      cnNote: 标识方案版本，是方案维护者分配的非空版本标识符，用于标识方案的一个受治理版本。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    identifierSchemeValidatorRef:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeValidatorRef
      namespace: fin-foundation
      localName: identifierSchemeValidatorRef
      label: Identifier Scheme Validator Reference
      definition: Identifier Scheme Validator Reference, is the absolute IRI of the
        scheme-locked validator executable contract, used for locating the
        lexical and algorithmic validation rules of a scheme
      cnNote: 标识方案校验器引用，是方案锁定的校验器可执行契约的绝对地址，用于定位该方案的词法与算法校验规则。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    identifierUniquenessScope:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierUniquenessScope
      namespace: fin-foundation
      localName: identifierUniquenessScope
      label: Identifier Uniqueness Scope
      definition: Identifier Uniqueness Scope, is a reviewed uniqueness scope
        category of an identifier scheme version, used for defining within which
        population canonical identifier values must be unique
      cnNote: 标识唯一性范围，是标识方案版本的受审唯一性范围类别，用于界定规范标识值在何种群体内必须唯一。
      valueType: https://axiolune.ai/ontology/finance/foundation/IdentifierUniquenessScope
      defaultCardinality:
        minCount: 1
        maxCount: 1
    identifierSchemeSourceEvidenceRef:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeSourceEvidenceRef
      namespace: fin-foundation
      localName: identifierSchemeSourceEvidenceRef
      label: Identifier Scheme Source Evidence Reference
      definition: Identifier Scheme Source Evidence Reference, is the absolute IRI
        of the immutable source-evidence record governing a scheme version, used
        for providing a traceable credential for the scheme version
      cnNote: 标识方案源证据引用，是治理该方案版本的不可变源证据记录的绝对地址，用于为方案版本提供可追溯凭据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    isinLexicalValue:
      iri: https://axiolune.ai/ontology/finance/foundation/isinLexicalValue
      namespace: fin-foundation
      localName: isinLexicalValue
      label: ISIN Lexical Value
      definition: ISIN Lexical Value, is a canonical lexical value validated by the
        referenced ISIN identifier type definition, used for carrying the
        canonical string of an ISIN
      cnNote: ISIN词法值，是由所引用ISIN标识类型定义校验的规范词法取值，用于承载ISIN的规范字符串。
      valueType: https://axiolune.ai/ontology/finance/foundation/ISIN
      defaultCardinality:
        minCount: 1
        maxCount: 1
    leiLexicalValue:
      iri: https://axiolune.ai/ontology/finance/foundation/leiLexicalValue
      namespace: fin-foundation
      localName: leiLexicalValue
      label: LEI Lexical Value
      definition: LEI Lexical Value, is a canonical lexical value validated by the
        referenced LEI identifier type definition, used for carrying the
        canonical string of an LEI
      cnNote: LEI词法值，是由所引用LEI标识类型定义校验的规范词法取值，用于承载LEI的规范字符串。
      valueType: https://axiolune.ai/ontology/finance/foundation/LEI
      defaultCardinality:
        minCount: 1
        maxCount: 1
    micLexicalValue:
      iri: https://axiolune.ai/ontology/finance/foundation/micLexicalValue
      namespace: fin-foundation
      localName: micLexicalValue
      label: MIC Lexical Value
      definition: MIC Lexical Value, is a canonical lexical value validated by the
        referenced MIC identifier type definition, used for carrying the
        canonical string of a MIC
      cnNote: MIC词法值，是由所引用MIC标识类型定义校验的规范词法取值，用于承载MIC的规范字符串。
      valueType: https://axiolune.ai/ontology/finance/foundation/MIC
      defaultCardinality:
        minCount: 1
        maxCount: 1
    localIdentifierLexicalValue:
      iri: https://axiolune.ai/ontology/finance/foundation/localIdentifierLexicalValue
      namespace: fin-foundation
      localName: localIdentifierLexicalValue
      label: Local Identifier Lexical Value
      definition: Local Identifier Lexical Value, is a non-empty canonical local
        identifier lexical value interpreted only together with its identifier
        scheme, used for carrying the string of a local identifier
      cnNote: 本地标识词法值，是仅与其标识方案一起解释的非空规范本地标识符词法取值，用于承载本地标识的字符串。
      valueType: https://axiolune.ai/ontology/finance/foundation/LocalIdentifier
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    assignmentId:
      iri: https://axiolune.ai/ontology/finance/foundation/assignmentId
      namespace: fin-foundation
      localName: assignmentId
      label: Assignment Identifier
      definition: Assignment Identifier, is a non-empty identifier scoped to the
        assigning authority, used for distinguishing the different identifier
        assignments made by that authority
      cnNote: 赋值标识符，是在赋值机构范围内作用的非空标识符，用于区分该机构作出的不同标识赋值。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    identifierAuthorityRole:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierAuthorityRole
      namespace: fin-foundation
      localName: identifierAuthorityRole
      label: Identifier Authority Role
      definition: Identifier Authority Role, is a reviewed role held by an authority
        in an identifier scheme authorization, used for clarifying the type of
        responsibility that authority bears under a scheme
      cnNote: 标识授权机构角色，是授权机构在标识方案授权中所持的受审角色，用于明确其在方案下的职责类型。
      valueType: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole
      defaultCardinality:
        minCount: 1
        maxCount: 1
    assignmentVersionSetDigest:
      iri: https://axiolune.ai/ontology/finance/foundation/assignmentVersionSetDigest
      namespace: fin-foundation
      localName: assignmentVersionSetDigest
      label: Assignment Version Set Digest
      definition: Assignment Version Set Digest, is a framed digest of the sorted
        assignment-version set that forms an identifier assignment conflict,
        used for uniquely identifying a conflict
      cnNote: 赋值版本集摘要，是构成标识赋值冲突的已排序赋值版本集合的框架化摘要，用于唯一标识一个冲突。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    accountType:
      iri: https://axiolune.ai/ontology/finance/foundation/accountType
      namespace: fin-foundation
      localName: accountType
      label: Account Type
      definition: Account Type, is a reviewed account-type member required on a
        financial account version, used for characterizing the holding
        capability category that an account represents
      cnNote: 账户类型，是金融账户版本上必备的受审账户类型成员，用于刻画账户所代表的持仓能力类别。
      valueType: https://axiolune.ai/ontology/finance/foundation/AccountType
      defaultCardinality:
        minCount: 1
        maxCount: 1
    financialAccountPartyRoleKind:
      iri: https://axiolune.ai/ontology/finance/foundation/financialAccountPartyRoleKind
      namespace: fin-foundation
      localName: financialAccountPartyRoleKind
      label: Financial Account Party Role Kind
      definition: Financial Account Party Role Kind, is a reviewed role member
        required on a financial account party role version, used for
        characterizing the type of relationship a party bears with respect to an
        account
      cnNote: 金融账户参与方角色类别，是金融账户参与方角色版本上必备的受审角色成员，用于刻画参与方相对账户的关系类型。
      valueType: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRoleKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    hasLegalName:
