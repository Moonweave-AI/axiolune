    iso4217AlphaCode:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217AlphaCode
      namespace: fin-foundation
      localName: iso4217AlphaCode
      label: ISO 4217 Alphabetic Code
      definition: ISO 4217 Alphabetic Code, is a code of exactly three uppercase
        ASCII letters asserted by an ISO 4217 registry entry version, used for
        identifying a currency
      cnNote: ISO 4217字母代码，是由一个ISO 4217注册条目断言的恰好三位大写字母代码，用于标识币种。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^[A-Z]{3}$
    iso4217NumericCode:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217NumericCode
      namespace: fin-foundation
      localName: iso4217NumericCode
      label: ISO 4217 Numeric Code
      definition: ISO 4217 Numeric Code, is a code of exactly three ASCII digits,
        including leading zeroes, asserted by an ISO 4217 registry entry
        version, used for identifying a currency
      cnNote: ISO 4217数字代码，是由一个ISO 4217注册条目断言的恰好三位数字代码，含前导零，用于标识币种。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^[0-9]{3}$
    iso4217MinorUnit:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217MinorUnit
      namespace: fin-foundation
      localName: iso4217MinorUnit
      label: ISO 4217 Minor Unit
      definition: ISO 4217 Minor Unit, is a non-negative decimal exponent for the
        currency minor unit in a locked ISO 4217 registry assertion, used for
        determining the decimal precision of a currency
      cnNote: ISO 4217最小单位，是锁定ISO 4217注册断言中货币最小单位的非负十进制指数，用于确定币种的小数精度。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    iso4217EntryStatus:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217EntryStatus
      namespace: fin-foundation
      localName: iso4217EntryStatus
      label: ISO 4217 Entry Status
      definition: ISO 4217 Entry Status, is a reviewed lifecycle status of an ISO
        4217 registry entry version, used for indicating the stage of an entry
        within a registry snapshot
      cnNote: ISO 4217条目状态，是一个ISO 4217注册条目版本的受审生命周期状态，用于表明条目在注册快照中的所处阶段。
      valueType: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryStatus
      defaultCardinality:
        minCount: 1
        maxCount: 1
    iso4217RegistrySourceRef:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217RegistrySourceRef
      namespace: fin-foundation
      localName: iso4217RegistrySourceRef
      label: ISO 4217 Registry Source Reference
      definition: ISO 4217 Registry Source Reference, is the absolute IRI of the
        locked registry artifact and locator record supporting an entry version,
        used for providing a traceable credential for the entry
      cnNote: ISO 4217注册来源引用，是支持该注册条目版本的锁定注册工件与定位记录的绝对地址，用于为条目提供可追溯凭据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    canonicalLexicalForm:
      iri: https://axiolune.ai/ontology/finance/foundation/canonicalLexicalForm
      namespace: fin-foundation
      localName: canonicalLexicalForm
      label: Canonical Lexical Form
      definition: Canonical Lexical Form, is the normalized string representation of an
        identifier value, used as the lexical component of the identifier identity key
      cnNote: 规范词法形式，是标识值的规范化字符串表示，用作标识符身份键的词法分量。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    identifierSchemeReleaseVersion:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeReleaseVersion
      namespace: fin-foundation
      localName: identifierSchemeReleaseVersion
      label: Identifier Scheme Release Version
      definition: Identifier Scheme Release Version, is a non-empty version identifier
        assigned by the scheme maintainer to a specific release, used for identifying a
        governed release of a scheme
      cnNote: 标识方案版次版本，是方案维护者分配给特定版次的非空版本标识符，用于标识方案的一个受治理版次。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    identifierSchemeReleaseValidatorRef:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeReleaseValidatorRef
      namespace: fin-foundation
      localName: identifierSchemeReleaseValidatorRef
      label: Identifier Scheme Release Validator Reference
      definition: Identifier Scheme Release Validator Reference, is the absolute IRI of
        the release-locked validator executable contract, used for locating the lexical and
        algorithmic validation rules of a specific scheme release
      cnNote: 标识方案版次校验器引用，是版次锁定的校验器可执行契约的绝对地址，用于定位特定方案版次的词法与算法校验规则。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    identifierSchemeReleaseSourceEvidenceRef:
      iri: https://axiolune.ai/ontology/finance/foundation/identifierSchemeReleaseSourceEvidenceRef
      namespace: fin-foundation
      localName: identifierSchemeReleaseSourceEvidenceRef
      label: Identifier Scheme Release Source Evidence Reference
      definition: Identifier Scheme Release Source Evidence Reference, is the absolute
        IRI of the immutable source-evidence record governing a scheme release, used for
        providing a traceable credential for the release
      cnNote: 标识方案版次源证据引用，是治理该方案版次的不可变源证据记录的绝对地址，用于为版次提供可追溯凭据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    authorityRoleKind:
      iri: https://axiolune.ai/ontology/finance/foundation/authorityRoleKind
      namespace: fin-foundation
      localName: authorityRoleKind
      label: Authority Role Kind
      definition: Authority Role Kind, is a reviewed authority role member required on an
        authority role assignment version, used for characterizing the type of governance
        responsibility an authority bears under a scheme release
      cnNote: 权威角色类别，是权威角色任命版本上必备的受审角色成员，用于刻画机构在方案版次下的治理职责类型。
      valueType: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole
      defaultCardinality:
        minCount: 1
        maxCount: 1
    iso4217EntryKind:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217EntryKind
      namespace: fin-foundation
      localName: iso4217EntryKind
      label: ISO 4217 Entry Kind
      definition: ISO 4217 Entry Kind, is a reviewed entry-kind member that classifies an
        ISO 4217 registry entry as currency, fund, precious metal, or special item, used
        for distinguishing what an entry denotes
      cnNote: ISO 4217条目类别，是将ISO 4217注册条目分类为货币、基金、贵金属或特殊项目的受审条目类别成员，用于区分条目所指。
      valueType: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    iso4217PublicationListCategory:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217PublicationListCategory
      namespace: fin-foundation
      localName: iso4217PublicationListCategory
      label: ISO 4217 Publication List Category
      definition: ISO 4217 Publication List Category, is a reviewed list-category member
        that classifies an ISO 4217 publication as current currency & funds, fund codes,
        or historical, used for distinguishing which SIX-maintained list a publication
        belongs to
      cnNote: ISO 4217发布清单类别，是将ISO 4217发布物分类为当前货币与基金、基金代码或历史的受审清单类别成员，用于区分发布物属于SIX维护的哪个清单。
      valueType: https://axiolune.ai/ontology/finance/foundation/ISO4217ListCategory
      defaultCardinality:
        minCount: 1
        maxCount: 1
    iso4217PublicationSourceRef:
      iri: https://axiolune.ai/ontology/finance/foundation/iso4217PublicationSourceRef
      namespace: fin-foundation
      localName: iso4217PublicationSourceRef
      label: ISO 4217 Publication Source Reference
      definition: ISO 4217 Publication Source Reference, is the absolute IRI of the locked
        publication artifact supporting a registry publication, used for providing a
        traceable credential for the publication
      cnNote: ISO 4217发布来源引用，是支持该注册发布物的锁定发布工件的绝对地址，用于为发布物提供可追溯凭据。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
  identifierTypes:
    ISIN:
      iri: https://axiolune.ai/ontology/finance/foundation/ISIN
      namespace: fin-foundation
      localName: ISIN
      label: International Securities Identification Number
      definition: International Securities Identification Number, is a
        twelve-character alphanumeric identifier defined by ISO 6166 that
        consists of a two-character country prefix, a nine-character basic
        number, and a check digit, used for uniquely identifying securities
        worldwide
      cnNote: 国际证券识别码，是依ISO 6166定义的十二位字母数字标识符，由两位国家前缀、九位基本号码与校验位构成，用于全球唯一识别证券。
      baseType: string
      standard: ISO 6166:2021
      validatorRef: https://axiolune.ai/ontology/finance/foundation/ISINValidation
      issuingAuthority: ANNA-recognized National Numbering Agency or Derivatives
        Service Bureau, according to instrument scope
    LEI:
      iri: https://axiolune.ai/ontology/finance/foundation/LEI
      namespace: fin-foundation
      localName: LEI
      label: Legal Entity Identifier
      definition: Legal Entity Identifier, is a twenty-character uppercase
        alphanumeric identifier defined by ISO 17442 that consists of an issuer
        prefix, an entity-specific section, and check digits, used for uniquely
        identifying legal entities worldwide
      cnNote: 法律实体标识符，是依ISO 17442定义的二十位大写字母数字标识符，由发行机构前缀、实体段与校验位构成，用于全球唯一识别法律实体。
      baseType: string
      standard: ISO 17442-1:2020
      validatorRef: https://axiolune.ai/ontology/finance/foundation/LEIValidation
      issuingAuthority: a GLEIF-accredited LEI Issuer (Local Operating Unit)
    MIC:
      iri: https://axiolune.ai/ontology/finance/foundation/MIC
      namespace: fin-foundation
      localName: MIC
      label: Market Identifier Code
      definition: Market Identifier Code, is a four-character uppercase alphanumeric
        code allocated under ISO 10383, used for uniquely identifying an
        exchange, trading platform, market, or trade-reporting facility
      cnNote: 市场识别码，是依ISO 10383分配的四位大写字母数字代码，用于唯一识别交易所、交易平台、市场或交易报告设施。
      baseType: string
      standard: ISO 10383:2012
      validatorRef: https://axiolune.ai/ontology/finance/foundation/MICValidation
      issuingAuthority: SWIFT as ISO 10383 Registration Authority
    LocalIdentifier:
      iri: https://axiolune.ai/ontology/finance/foundation/LocalIdentifier
      namespace: fin-foundation
      localName: LocalIdentifier
      label: Authority-scoped Local Identifier
      definition: Authority-scoped Local Identifier, is a non-empty canonical
        identifier lexical form whose meaning and stronger syntax are
        determined only by its locked identifier scheme and authorized assigning
        authority
      cnNote: 授权范围本地标识符，是其含义与更强语法仅由所属锁定标识方案与授权赋值机构确定的非空规范标识词法形式。
      baseType: string
      standard: Axiolune Local Identifier Contract 1.0
      validatorRef: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValidation
      issuingAuthority: scheme-specific authorized assigning authority
  codeLists:
    IdentifierSchemeKind:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind
      namespace: fin-foundation
      localName: IdentifierSchemeKind
      label: Identifier Scheme Kind
      definition: Identifier Scheme Kind, is a closed compatibility discriminator
        that determines the identifier value subtype and legal identified
        subject range of a scheme, used for classifying different kinds of
        identifier schemes
      cnNote: 标识方案类别，是确定标识方案值子类型与合法标识主体范围的封闭兼容性判别器，用于分类不同种类的标识方案。
      vocabulary: Identifier Scheme Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind/value/gleifLei
          notation: gleifLei
          label: GLEIF LEI
          definition: identifier scheme maintained for Legal Entity Identifiers
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind/value/iso6166Isin
          notation: iso6166Isin
          label: ISO 6166 ISIN
          definition: identifier scheme maintained for International Securities
            Identification Numbers
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind/value/iso10383Mic
          notation: iso10383Mic
          label: ISO 10383 MIC
          definition: identifier scheme maintained for Market Identifier Codes
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind/value/internalInstrument
          notation: internalInstrument
          label: Internal Instrument
          definition: authority-scoped local identifier scheme for FinancialInstrument
            subjects
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind/value/financialAccount
          notation: financialAccount
          label: Financial Account
          definition: authority-scoped local identifier scheme for FinancialAccount
            subjects
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeKind/value/venueListing
          notation: venueListing
          label: Venue Listing
          definition: authority-scoped local identifier scheme for InstrumentListing
            subjects
    IdentifierUniquenessScope:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierUniquenessScope
      namespace: fin-foundation
      localName: IdentifierUniquenessScope
      label: Identifier Uniqueness Scope
      definition: Identifier Uniqueness Scope, is a controlled vocabulary that
        classifies the population within which canonical identifier values must
        be unique, used for defining the uniqueness boundary of identifier
        values
      cnNote: 标识唯一性范围，是对规范标识值须在其中唯一的群体进行封闭分类的受控词表，用于界定标识值的唯一性边界。
      vocabulary: Identifier Uniqueness Scope
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierUniquenessScope/value/global
          notation: global
          label: Global
          definition: the scheme and canonical lexical value pair is unique across all
            assigning authorities
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierUniquenessScope/value/authorityScoped
          notation: authorityScoped
          label: Authority Scoped
          definition: the canonical lexical value is unique only within its assigning
            authority and scheme
    IdentifierAuthorityRole:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole
      namespace: fin-foundation
      localName: IdentifierAuthorityRole
      label: Identifier Authority Role
      definition: Identifier Authority Role, is a controlled vocabulary that
        classifies the role an authority plays in an identifier scheme
        authorization, used for clarifying the responsibilities of an authority
      cnNote: 标识授权机构角色，是对授权机构在标识方案授权中所任角色进行封闭分类的受控词表，用于明确机构职责。
      vocabulary: Identifier Authority Role
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole/value/assigningAuthority
          notation: assigningAuthority
          label: Assigning Authority
          definition: authority authorized to issue assignments under the identified
            scheme during the authorization interval
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole/value/registrationAuthority
          notation: registrationAuthority
          label: Registration Authority
          definition: authority responsible for the overall registration and governance
            of a standard scheme, such as SWIFT for ISO 10383 or GLEIF for ISO 17442
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole/value/maintenanceAgency
          notation: maintenanceAgency
          label: Maintenance Agency
          definition: authority responsible for maintaining the code list or registry
            content, such as SIX for ISO 4217
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole/value/issuingAuthority
          notation: issuingAuthority
          label: Issuing Authority
          definition: authority that issues individual identifier values to subjects,
            such as an ANNA-recognized National Numbering Agency for ISIN
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole/value/registryPublisher
          notation: registryPublisher
          label: Registry Publisher
          definition: authority that publishes an immutable registry snapshot or
            publication version
        - iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorityRole/value/validationAuthority
          notation: validationAuthority
          label: Validation Authority
          definition: authority responsible for validating identifier values against
            the scheme's lexical and check-digit rules
    AccountType:
      iri: https://axiolune.ai/ontology/finance/foundation/AccountType
      namespace: fin-foundation
      localName: AccountType
      label: Account Type
      definition: Account Type, is a controlled vocabulary that classifies the
        asset-holding capability represented by a financial account, used for
        distinguishing different kinds of holding accounts
      cnNote: 账户类型，是对金融账户所代表的持仓能力进行封闭分类的受控词表，用于区分不同种类的持仓账户。
      vocabulary: Account Type
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/AccountType/value/cash
          notation: cash
          label: Cash
          definition: account whose governed holding capability is cash
        - iri: https://axiolune.ai/ontology/finance/foundation/AccountType/value/securitiesCustody
          notation: securitiesCustody
          label: Securities Custody
          definition: account whose governed holding capability is custody of securities
        - iri: https://axiolune.ai/ontology/finance/foundation/AccountType/value/multiAsset
          notation: multiAsset
          label: Multi-asset
          definition: account whose governed holding capability includes cash and
            securities
    FinancialAccountPartyRoleKind:
      iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRoleKind
      namespace: fin-foundation
      localName: FinancialAccountPartyRoleKind
      label: Financial Account Party Role Kind
      definition: Financial Account Party Role Kind, is a controlled vocabulary that
        classifies the role a party plays with respect to a financial account,
        used for characterizing the various kinds of relationships between a
        party and an account
      cnNote: 金融账户参与方角色类别，是对参与方相对金融账户所任角色进行封闭分类的受控词表，用于刻画参与方与账户的各类关系。
      vocabulary: Financial Account Party Role Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRoleKind/value/accountHolder
          notation: accountHolder
          label: Account Holder
          definition: party named as a holder of the account
        - iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRoleKind/value/beneficialOwner
          notation: beneficialOwner
          label: Beneficial Owner
          definition: party that beneficially owns assets represented by the account
        - iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRoleKind/value/authorizedOperator
          notation: authorizedOperator
          label: Authorized Operator
          definition: party authorized to operate the account without thereby being
            asserted as its owner
        - iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountPartyRoleKind/value/custodian
          notation: custodian
          label: Custodian
          definition: party responsible for custody of assets represented by the account
    ISO4217EntryStatus:
      iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryStatus
      namespace: fin-foundation
      localName: ISO4217EntryStatus
      label: ISO 4217 Entry Status
      definition: ISO 4217 Entry Status, is a controlled vocabulary that classifies
        the lifecycle stage of an ISO 4217 registry entry within a locked
        snapshot
      cnNote: ISO 4217条目状态，是对ISO 4217注册条目在锁定快照中生命周期阶段进行封闭分类的受控词表。
      vocabulary: ISO 4217 Entry Status
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryStatus/value/active
          notation: active
          label: Active
          definition: registry entry currently active in the selected ISO 4217 snapshot
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryStatus/value/withdrawn
          notation: withdrawn
          label: Withdrawn
          definition: registry entry withdrawn in or before the selected ISO 4217 snapshot
    ISO4217EntryKind:
      iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryKind
      namespace: fin-foundation
      localName: ISO4217EntryKind
      label: ISO 4217 Entry Kind
      definition: ISO 4217 Entry Kind, is a controlled vocabulary that classifies what an
        ISO 4217 registry entry denotes, used for distinguishing currencies, funds,
        precious metals, and special items
      cnNote: ISO 4217条目类别，是对ISO 4217注册条目所指进行封闭分类的受控词表，用于区分货币、基金、贵金属与特殊项目。
      vocabulary: ISO 4217 Entry Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryKind/value/currency
          notation: currency
          label: Currency
          definition: entry denoting a national or supranational monetary currency
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryKind/value/fund
          notation: fund
          label: Fund
          definition: entry denoting a fund code used in financial messaging
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryKind/value/preciousMetal
          notation: preciousMetal
          label: Precious Metal
          definition: entry denoting a precious metal unit such as gold or silver
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217EntryKind/value/specialItem
          notation: specialItem
          label: Special Item
          definition: entry denoting a special clearing or settlement unit that is neither
            currency, fund, nor precious metal
    ISO4217ListCategory:
      iri: https://axiolune.ai/ontology/finance/foundation/ISO4217ListCategory
      namespace: fin-foundation
      localName: ISO4217ListCategory
      label: ISO 4217 List Category
      definition: ISO 4217 List Category, is a controlled vocabulary that classifies which
        SIX-maintained ISO 4217 list a registry publication belongs to, used for
        distinguishing current, fund, and historical lists
      cnNote: ISO 4217清单类别，是对注册发布物所属SIX维护的ISO 4217清单进行封闭分类的受控词表，用于区分当前、基金与历史清单。
      vocabulary: ISO 4217 List Category
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217ListCategory/value/currentCurrencyFunds
          notation: currentCurrencyFunds
          label: Current Currency & Funds
          definition: the current list of active currency and fund codes
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217ListCategory/value/fundCodes
          notation: fundCodes
          label: Fund Codes
          definition: the list of fund codes used in financial messaging
        - iri: https://axiolune.ai/ontology/finance/foundation/ISO4217ListCategory/value/historical
          notation: historical
          label: Historical
          definition: the historical list of withdrawn or replaced currency and fund codes
  constraints:
    ISINValidation:
      iri: https://axiolune.ai/ontology/finance/foundation/ISINValidation
      namespace: fin-foundation
      localName: ISINValidation
      label: International Securities Identification Number Validation
      definition: identifier validation rule that enforces the reviewed lexical and
        check algorithm profile for International Securities Identification
        Number
      constraintType: Custom
      scope: Identifier
      expression:
        language: Custom
        expression: profile=ISIN;pattern=^[A-Z]{2}[A-Z0-9]{9}[0-9]$;length=12;algorithm=Luhn
      severity: Error
      message: ISIN value does not satisfy its reviewed identifier profile
      targetElement: https://axiolune.ai/ontology/finance/foundation/ISIN
    LEIValidation:
      iri: https://axiolune.ai/ontology/finance/foundation/LEIValidation
      namespace: fin-foundation
      localName: LEIValidation
      label: Legal Entity Identifier Validation
      definition: identifier validation rule that enforces the reviewed lexical and
        check algorithm profile for Legal Entity Identifier
      constraintType: Custom
      scope: Identifier
      expression:
        language: Custom
        expression: profile=LEI;pattern=^[A-Z0-9]{18}[0-9]{2}$;length=20;algorithm=ISO/IEC
          7064 MOD 97-10
      severity: Error
      message: LEI value does not satisfy its reviewed identifier profile
      targetElement: https://axiolune.ai/ontology/finance/foundation/LEI
    MICValidation:
      iri: https://axiolune.ai/ontology/finance/foundation/MICValidation
      namespace: fin-foundation
      localName: MICValidation
      label: Market Identifier Code Validation
      definition: identifier validation rule that enforces the reviewed lexical and
        check algorithm profile for Market Identifier Code
      constraintType: Custom
      scope: Identifier
      expression:
        language: Custom
        expression: profile=MIC;pattern=^[A-Z0-9]{4}$;length=4;algorithm=none
      severity: Error
      message: MIC value does not satisfy its reviewed identifier profile
      targetElement: https://axiolune.ai/ontology/finance/foundation/MIC
    LocalIdentifierValidation:
      iri: https://axiolune.ai/ontology/finance/foundation/LocalIdentifierValidation
      namespace: fin-foundation
      localName: LocalIdentifierValidation
      label: Authority-scoped Local Identifier Validation
      definition: validates the generic non-empty NFC lexical contract before a
        scheme-locked validator applies stronger rules
      constraintType: Custom
      scope: Identifier
      expression:
        language: Custom
        expression: profile=LocalIdentifier;normalization=NFC;trim=false;minUtf8Bytes=1;schemeValidator=required
      severity: Error
      message: local identifier is empty, not NFC, or lacks a scheme-locked validator
      targetElement: https://axiolune.ai/ontology/finance/foundation/LocalIdentifier
    IdentifierSchemeCompatibilityMatrix:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierSchemeCompatibilityMatrix
      namespace: fin-foundation
      localName: IdentifierSchemeCompatibilityMatrix
      label: Identifier Scheme Compatibility Matrix
      definition: enforces the closed mapping from scheme kind to IdentifierValue
        subtype and legal identified-subject range, including direct account and
        listing identity slots
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: contract=rfc001-identifier-scheme-value-subject-matrix-v1;closed=true
      severity: Error
      message: identifier scheme kind, value subtype, and identified subject are
        incompatible
    IdentifierAuthorizationCoverage:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthorizationCoverage
      namespace: fin-foundation
      localName: IdentifierAuthorizationCoverage
      label: Identifier Authorization Coverage
      definition: requires the assigning authority and exact scheme version to have
        one PIT-eligible authorization whose half-open valid interval covers the
        assignment or direct account identity interval
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: contract=rfc001-identifier-authorization-coverage-v1;interval=half-open;pit=true
      severity: Error
      message: identifier assignment or direct account identity lacks covering
        authority authorization
    IdentifierGlobalUniquenessConflict:
      iri: https://axiolune.ai/ontology/finance/foundation/IdentifierGlobalUniquenessConflict
      namespace: fin-foundation
      localName: IdentifierGlobalUniquenessConflict
      label: Identifier Global Uniqueness Conflict
      definition: requires overlapping assignments of one globally unique scheme/value
        to different subject identities to emit one explicit
        IdentifierAssignmentConflict and forbids selection of a silent winner
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: contract=rfc001-global-identifier-conflict-v1;winner=forbidden
      severity: Error
      message: globally unique identifier overlap lacks its exact explicit conflict fact
    FinancialAccountIdentityIntegrity:
      iri: https://axiolune.ai/ontology/finance/foundation/FinancialAccountIdentityIntegrity
      namespace: fin-foundation
      localName: FinancialAccountIdentityIntegrity
      label: Financial Account Identity Integrity
      definition: enforces one financial-account IdentifierScheme logical reference,
        one LocalIdentifierValue logical reference, scheme equality,
        authorization coverage, and the exact two-component logical account key
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-financial-account-identity-v1;key=schemeLogicalIri,valueLogicalIri
      severity: Error
      message: FinancialAccount identity slots, scheme, value, or authorization are
        inconsistent
    ISO4217RegistryEntryIntegrity:
      iri: https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryEntryIntegrity
      namespace: fin-foundation
      localName: ISO4217RegistryEntryIntegrity
      label: ISO 4217 Registry Entry Integrity
      definition: enforces the authority/alpha logical key, unique PIT-eligible
        authority/alpha entry, numeric-code lexical preservation, non-negative
        minor unit, exact Currency relation, and locked source reference
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-iso4217-registry-entry-v1;pitUnique=true;numericCode=threeDigits
      severity: Error
      message: ISO4217RegistryEntry violates its identity, cardinality, value, source,
        or PIT uniqueness contract
    CurrencyUsageIntegrity:
      iri: https://axiolune.ai/ontology/finance/foundation/CurrencyUsageIntegrity
      namespace: fin-foundation
      localName: CurrencyUsageIntegrity
      label: Currency Usage Integrity
      definition: requires exactly one logical Currency and one logical Jurisdiction
        with complete three-axis provenance
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: contract=rfc001-currency-usage-v1;referenceMode=logical
      severity: Error
      message: CurrencyUsage must relate exactly one logical currency and one logical
        jurisdiction
