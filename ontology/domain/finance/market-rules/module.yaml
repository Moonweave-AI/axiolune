        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionEventDateField/value/effectiveDate
          notation: effectiveDate
          label: Effective date
          definition: event effective date field
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionEventDateField/value/electionDeadline
