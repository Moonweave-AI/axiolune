        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionEventDateField/value/exDate
          notation: exDate
          label: Ex date
          definition: event ex date field
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionEventDateField/value/recordDate
          notation: recordDate
