          definition: separately resolved rights subscription cash due date
        - iri: >-
            https://axiolune.ai/ontology/finance/market-rules/CorporateActionResolvedDateRole/value/successorDeliveryDate
          notation: successorDeliveryDate
          label: Successor delivery date
          definition: separately resolved successor-security delivery date
    CorporateActionBusinessDayAdjustment:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionBusinessDayAdjustment
      namespace: fin-market-rules
      localName: CorporateActionBusinessDayAdjustment
      label: Corporate Action Business-day Adjustment
      definition: >-
        Corporate Action Business-day Adjustment, is a closed business-day adjustment convention for schedule
        date resolution, used for normalizing a candidate date onto a valid business day.
      cnNote: 公司行为营业日调整，是日程日期解析所用的封闭营业日调整规则，用于把候选日期规范化到合法营业日。
      vocabulary: Corporate Action Business-day Adjustment
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionBusinessDayAdjustment/value/unadjusted
          notation: unadjusted
          label: Unadjusted
          definition: retain the offset date even when it is not a business day
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionBusinessDayAdjustment/value/preceding
          notation: preceding
          label: Preceding
          definition: choose the first prior business day
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionBusinessDayAdjustment/value/following
          notation: following
          label: Following
          definition: choose the first following business day
    CorporateActionDateOrderingOperator:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingOperator
      namespace: fin-market-rules
      localName: CorporateActionDateOrderingOperator
      label: Corporate Action Date Ordering Operator
      definition: >-
        Corporate Action Date Ordering Operator, is a closed comparison operator between two resolved date roles, used
        for expressing the before/after or equality constraint between dates within a schedule.
      cnNote: 公司行为日期排序算子，是两个已解析日期角色之间的封闭比较算子，用于表达日程内日期的先后或相等约束。
      vocabulary: Corporate Action Date Ordering Operator
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingOperator/value/before
          notation: before
          label: Before
          definition: left date is strictly before right date
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingOperator/value/notAfter
          notation: notAfter
          label: Not after
          definition: left date is before or equal to right date
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingOperator/value/sameDate
          notation: sameDate
          label: Same date
          definition: left and right dates are equal
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingOperator/value/notBefore
          notation: notBefore
          label: Not before
          definition: left date is after or equal to right date
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingOperator/value/after
          notation: after
          label: After
          definition: left date is strictly after right date
    CorporateActionSettlementQualification:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionSettlementQualification
      namespace: fin-market-rules
      localName: CorporateActionSettlementQualification
      label: Corporate Action Settlement Qualification
      definition: >-
        Corporate Action Settlement Qualification, is a closed evidence requirement for a due-bill trade
        qualification, used for specifying the evidence type required to qualify for due-bill processing.
      cnNote: 公司行为结算资格审查，是 due-bill 交易合格性的封闭证据要求，用于规定获得 due-bill 处理资格所需的证据类型。
      vocabulary: Corporate Action Settlement Qualification
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionSettlementQualification/value/executionOnly
          notation: executionOnly
          label: Execution only
          definition: qualifying execution evidence is sufficient
        - iri: >-
            https://axiolune.ai/ontology/finance/market-rules/CorporateActionSettlementQualification/value/settlementEvidence
          notation: settlementEvidence
          label: Settlement evidence
          definition: exact eligible settlement-status and DVP atomic evidence are required
    SelectionOutcomeKind:
      iri: https://axiolune.ai/ontology/finance/market-rules/SelectionOutcomeKind
      namespace: fin-market-rules
      localName: SelectionOutcomeKind
      label: Selection Outcome Kind
      definition: >-
        Selection Outcome Kind, is a closed classification of rule selection outcomes, used for classifying each
        evaluation result as a resolved selection, no-applicable-rule, conflict, unsupported, or indeterminate.
      cnNote: 选择结果种类，是规则选择结果的封闭分类，用于把每次评估结果分类为已消解选择、无适用规则、冲突、不支持或不确定。
      vocabulary: Selection Outcome Kind
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/SelectionOutcomeKind/value/resolvedSelection
          notation: resolvedSelection
          label: Resolved selection
          definition: exactly one surviving applicability version won
        - iri: https://axiolune.ai/ontology/finance/market-rules/SelectionOutcomeKind/value/noApplicableRule
          notation: noApplicableRule
          label: No applicable rule
          definition: no surviving applicability version matched the request
        - iri: https://axiolune.ai/ontology/finance/market-rules/SelectionOutcomeKind/value/conflict
          notation: conflict
          label: Conflict
          definition: at least two surviving applicability versions produced incompatible results
        - iri: https://axiolune.ai/ontology/finance/market-rules/SelectionOutcomeKind/value/unsupported
          notation: unsupported
          label: Unsupported
          definition: the request targets a rule kind or clause shape the profile does not support
        - iri: https://axiolune.ai/ontology/finance/market-rules/SelectionOutcomeKind/value/indeterminate
          notation: indeterminate
          label: Indeterminate
          definition: evaluation could not complete due to missing inputs or unresolved references
    PrecedenceBasis:
      iri: https://axiolune.ai/ontology/finance/market-rules/PrecedenceBasis
      namespace: fin-market-rules
      localName: PrecedenceBasis
      label: Precedence Basis
      definition: >-
        Precedence Basis, is a closed classification of the basis on which a resolved selection or precedence edge was
        chosen, used for recording whether resolution used numeric priority, an explicit reviewed precedence edge, or
        derived specificity.
      cnNote: 优先依据，是已消解选择或优先关系边所选依据的封闭分类，用于记录消解是否使用数值优先级、显式经审阅优先关系边或派生特异性。
      vocabulary: Precedence Basis
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/PrecedenceBasis/value/numericPriority
          notation: numericPriority
          label: Numeric priority
          definition: the winning applicability had the highest numeric priority within one comparable set
        - iri: https://axiolune.ai/ontology/finance/market-rules/PrecedenceBasis/value/explicitPrecedence
          notation: explicitPrecedence
          label: Explicit precedence
          definition: a reviewed RulePrecedence edge declared the winner
        - iri: https://axiolune.ai/ontology/finance/market-rules/PrecedenceBasis/value/derivedSpecificity
          notation: derivedSpecificity
          label: Derived specificity
          definition: the winning applicability had the most specific authored scope
    ReferencePriceSource:
      iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceSource
      namespace: fin-market-rules
      localName: ReferencePriceSource
      label: Reference Price Source
      definition: >-
        Reference Price Source, is a closed classification of where a price-limit or circuit-breaker reference price is
        drawn from, used for making the reference price computable.
      cnNote: 参考价来源，是价格限制或熔断参考价取自何处的封闭分类，用于使参考价可计算。
      vocabulary: Reference Price Source
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceSource/value/previousClose
          notation: previousClose
          label: Previous close
          definition: the reference price is the previous trading day close
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceSource/value/openingAuction
          notation: openingAuction
          label: Opening auction
          definition: the reference price is the opening auction price
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceSource/value/fixedPrice
          notation: fixedPrice
          label: Fixed price
          definition: the reference price is a authority-declared fixed price
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceSource/value/intradaySnapshot
          notation: intradaySnapshot
          label: Intraday snapshot
          definition: the reference price is a locked intraday observation snapshot
    ReferencePriceMissingPolicy:
      iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceMissingPolicy
      namespace: fin-market-rules
      localName: ReferencePriceMissingPolicy
      label: Reference Price Missing Policy
      definition: >-
        Reference Price Missing Policy, is a closed decision for when the reference price is unavailable at the
        evaluation point, used for making missing-reference behavior explicit rather than silent.
      cnNote: 参考价缺失策略，是当评估时点参考价不可用时的封闭决策，用于使缺失参考价行为显式而非静默。
      vocabulary: Reference Price Missing Policy
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceMissingPolicy/value/reject
          notation: reject
          label: Reject
          definition: evaluation fails with an indeterminate outcome
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceMissingPolicy/value/fallbackPrior
          notation: fallbackPrior
          label: Fallback to prior
          definition: fall back to the latest strictly-prior eligible observation
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceMissingPolicy/value/suspend
          notation: suspend
          label: Suspend
          definition: suspend trading until a reference price becomes available
    ReferencePriceRounding:
      iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceRounding
      namespace: fin-market-rules
      localName: ReferencePriceRounding
      label: Reference Price Rounding
      definition: >-
        Reference Price Rounding, is a closed rounding convention applied to the computed price band, used for making
        the limit up/down a valid quotable price.
      cnNote: 参考价取整，是对计算价格区间施加的封闭取整规则，用于使涨跌幅成为合法可报价价格。
      vocabulary: Reference Price Rounding
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceRounding/value/nearestTick
          notation: nearestTick
          label: Nearest tick
          definition: round to the nearest minimum price increment
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceRounding/value/floor
          notation: floor
          label: Floor
          definition: round down to the minimum price increment
        - iri: https://axiolune.ai/ontology/finance/market-rules/ReferencePriceRounding/value/ceiling
          notation: ceiling
          label: Ceiling
          definition: round up to the minimum price increment
    PriceBandSide:
      iri: https://axiolune.ai/ontology/finance/market-rules/PriceBandSide
      namespace: fin-market-rules
      localName: PriceBandSide
      label: Price Band Side
      definition: >-
        Price Band Side, is a closed classification of whether a price-limit clause sets the upper limit, lower limit,
        or both, used for distinguishing limit up from limit down.
      cnNote: 价格区间方向，是价格限制条款设定上限、下限或两者的封闭分类，用于区分涨停与跌停。
      vocabulary: Price Band Side
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/PriceBandSide/value/upperLimit
          notation: upperLimit
          label: Upper limit
          definition: the clause sets the limit up
        - iri: https://axiolune.ai/ontology/finance/market-rules/PriceBandSide/value/lowerLimit
          notation: lowerLimit
          label: Lower limit
          definition: the clause sets the limit down
        - iri: https://axiolune.ai/ontology/finance/market-rules/PriceBandSide/value/bothSides
          notation: bothSides
          label: Both sides
          definition: the clause sets both limit up and limit down
    CircuitBreakerMonitor:
      iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerMonitor
      namespace: fin-market-rules
      localName: CircuitBreakerMonitor
      label: Circuit Breaker Monitor
      definition: >-
        Circuit Breaker Monitor, is a closed classification of the observed value that triggers a circuit breaker,
        used for making the trigger object explicit.
      cnNote: 熔断监测对象，是触发熔断的被监测值的封闭分类，用于使触发对象显式。
      vocabulary: Circuit Breaker Monitor
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerMonitor/value/indexLevel
          notation: indexLevel
          label: Index level
          definition: the breaker monitors a market index level
        - iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerMonitor/value/singleSecurityPrice
          notation: singleSecurityPrice
          label: Single-security price
          definition: the breaker monitors a single security price
        - iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerMonitor/value/percentageMove
          notation: percentageMove
          label: Percentage move
          definition: the breaker monitors a percentage move from the reference
    CircuitBreakerDirection:
      iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerDirection
      namespace: fin-market-rules
      localName: CircuitBreakerDirection
      label: Circuit Breaker Direction
      definition: >-
        Circuit Breaker Direction, is a closed classification of the direction that triggers a circuit breaker, used
        for distinguishing downside halts from upside halts.
      cnNote: 熔断方向，是触发熔断方向的封闭分类，用于区分下行停市与上行停市。
      vocabulary: Circuit Breaker Direction
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerDirection/value/downward
          notation: downward
          label: Downward
          definition: the breaker triggers on a downward move
        - iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerDirection/value/upward
          notation: upward
          label: Upward
          definition: the breaker triggers on an upward move
        - iri: https://axiolune.ai/ontology/finance/market-rules/CircuitBreakerDirection/value/either
          notation: either
          label: Either
