      definition: closed evidence requirement for a due-bill trade qualification
      vocabulary: Corporate Action Settlement Qualification
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionSettlementQualification/value/executionOnly
          notation: executionOnly
          label: Execution only
          definition: qualifying execution evidence is sufficient
        - iri: >-
            https://axiolune.ai/ontology/finance/market-rules/CorporateActionSettlementQualification/value/settlementEvidence
          notation: settlementEvidence
          label: Settlement evidence
          definition: exact eligible settlement-status and DVP atomic evidence are required
  constraints:
    RuleApplicabilityRequiresExplicitScope:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleApplicabilityRequiresExplicitScope
      namespace: fin-market-rules
      localName: RuleApplicabilityRequiresExplicitScope
      label: Rule Applicability Requires Explicit Scope
      definition: >-
        requires at least one authored listing, instrument, segment, venue, Foundation AccountType, or jurisdiction
        scope and rejects classifier, investor-category, and implicit-global substitutes
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: contract=rfc001-rule-scope-nonempty-v1;scopeOrder=listing,instrument,segment,venue,accountType,jurisdiction
      severity: Error
      message: RuleApplicability must carry at least one explicit supported scope
    RuleApplicabilityMustMatchRequest:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleApplicabilityMustMatchRequest
      namespace: fin-market-rules
      localName: RuleApplicabilityMustMatchRequest
      label: Rule Applicability Must Match Request
      definition: >-
        requires every authored applicability scope to match the PIT-normalized evaluation request and computes the
        six-position specificity vector without accepting a caller-authored specificity value
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: contract=rfc001-rule-scope-match-v1;allAuthoredScopesMatch=true;specificity=derived
      severity: Error
      message: one or more authored applicability scopes do not match the normalized request
    RulePriorityComparability:
      iri: https://axiolune.ai/ontology/finance/market-rules/RulePriorityComparability
      namespace: fin-market-rules
      localName: RulePriorityComparability
      label: Rule Priority Comparability
      definition: >-
        permits numeric-priority comparison only inside one RuleSet version, authoritative source, and identical
        normalized-scope digest; other candidates require explicit precedence
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          contract=rfc001-rule-priority-comparability-v1; crossAuthority=false; sameRuleSetVersion=true;
          authoritativeSource=provenance.source; normalizedScopeDigest=identical; authorityLedgerJoin=reviewed
      severity: Error
      message: numeric priority was used across incomparable rule candidates
    RuleParameterExclusiveOneOf:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleParameterExclusiveOneOf
      namespace: fin-market-rules
      localName: RuleParameterExclusiveOneOf
      label: Rule Parameter Exclusive One Of
      definition: >-
        requires exactly one RuleParameter value branch among Money, Quantity, reviewed CodeValue, or exact referenced
        RuleClause and rejects zero or multiple branches
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-rule-parameter-xone-v1;branches=money,quantity,code,clauseReference
      severity: Error
      message: RuleParameter must populate exactly one typed value branch
    RuleClauseRangeIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleClauseRangeIntegrity
      namespace: fin-market-rules
      localName: RuleClauseRangeIntegrity
      label: Rule Clause Range Integrity
      definition: >-
        requires ordered clause ranges to use compatible Quantity units, be non-reversed and non-overlapping, and either
        reject or explicitly allow every gap
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-rule-clause-range-v1;ordered=true;overlap=false;gapPolicy=required
      severity: Error
      message: rule clauses are unordered, overlapping, reversed, unit-incompatible, or have an implicit gap
    RuleSubtypeClauseCompatibility:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleSubtypeClauseCompatibility
      namespace: fin-market-rules
      localName: RuleSubtypeClauseCompatibility
      label: Rule Subtype Clause Compatibility
      definition: >-
        closes the matrix from each supported MarketRule subtype and RuleType member to its legal RuleClause subtype,
        including distinct settlement-cycle and resale-restriction branches and the entitlement, date-resolution, and
        date-ordering clauses that are the only legal CorporateActionScheduleRule clause types
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-rule-subtype-clause-matrix-v2;closed=true
      severity: Error
      message: MarketRule subtype, RuleType member, and clause subtype are incompatible
    PriceLimitClauseExclusiveBoundary:
      iri: https://axiolune.ai/ontology/finance/market-rules/PriceLimitClauseExclusiveBoundary
      namespace: fin-market-rules
      localName: PriceLimitClauseExclusiveBoundary
      label: Price Limit Clause Exclusive Boundary
      definition: requires exactly one percentage Quantity or Money amount boundary on a PriceLimitClause
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-price-limit-boundary-xone-v1;branches=percentage,amount
      severity: Error
      message: PriceLimitClause must carry exactly one compatible boundary branch
    RulePrecedenceIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/RulePrecedenceIntegrity
      namespace: fin-market-rules
      localName: RulePrecedenceIntegrity
      label: Rule Precedence Integrity
      definition: >-
        requires distinct same-kind rule versions with overlapping normalized scope and an authoritative reviewed
        source; active precedence facts form a directed acyclic graph
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          contract=rfc001-rule-precedence-v1; sameRuleKind=true; normalizedScopeOverlap=true;
          authoritativeSource=provenance.source; reviewedReason=required; authorityLedgerJoin=reviewed;
          activeAtThreeAxisPit=true; closureAware=true; closureRunCompletedByReference=true; halfOpenIntervals=true;
          irreflexive=true; acyclic=true
      severity: Error
      message: RulePrecedence is reflexive, cyclic, cross-kind, unsupported, or non-overlapping
    RuleConflictNoSilentWinner:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleConflictNoSilentWinner
      namespace: fin-market-rules
      localName: RuleConflictNoSilentWinner
      label: Rule Conflict No Silent Winner
      definition: >-
        requires one RuleConflict for incompatible surviving candidates, exact candidate-set identity, one generating
        Run reference, and no normal result selected from that request
      constraintType: CrossField
      scope: Association
      expression:
        language: Custom
        expression: >-
          contract=rfc001-rule-conflict-v1; identityBaseIri=https://axiolune.ai/data/rule-conflict;
          logicalKey(versionOf(evaluationRequestVersion),candidateApplicabilitySetDigest);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); winner=forbidden; candidateSetDigest=required;
          exactCurrentConflictCount=1; generatingRunLedgerJoin=completed
      severity: Error
      message: incompatible surviving rule candidates were silently resolved or conflict identity is incomplete
    RuleEvaluationRequestIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/RuleEvaluationRequestIntegrity
      namespace: fin-market-rules
      localName: RuleEvaluationRequestIntegrity
      label: Rule Evaluation Request Integrity
      definition: >-
        enforces request-authority/request-ID logical identity, three explicit PIT pivots, a strictly prior completed
        input context, and exact scope versions; schedule requests additionally require CorporateActionKind
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: >-
          contract=rfc001-rule-evaluation-request-v1; identityBaseIri=https://axiolune.ai/data/rule-evaluation-request;
          logicalKey(versionOf(requestAuthority),ruleEvaluationRequestId);
          versionKey(validFrom,knowledgeFrom,availableFrom,revision); inputContext=strictlyPrior; pitAxes=3;
          scopeClosure=listingToInstrumentAndFacility|segmentToVenue
      severity: Error
      message: RuleEvaluationRequest identity, context, PIT pivots, scope, or typed schedule parameter is incomplete
    CorporateActionScheduleRuleIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionScheduleRuleIntegrity
      namespace: fin-market-rules
      localName: CorporateActionScheduleRuleIntegrity
      label: Corporate Action Schedule Rule Integrity
      definition: >-
        freezes the three-kind field matrix and date contracts, requires exactly one typed resolution clause for each
        kind-required output date and at least one explicit ordering clause, requires a non-empty well-formed percentage
        interval xone no interval, binds one exact assessment-method version iff an interval exists, requires exactly
        one entitlement clause, and limits rightsIssue to non-transferable direct subscription with both due-date roles
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: >-
          contract=rfc001-corporate-action-schedule-rule-v3;kindSet=cashDividend|stockSplit|rightsIssue;requiredDateResolutionCoverage=true;orderingClauseMinCount=1;methodIffPercentageInterval=true;entitlementClauseCount=1;downstreamEventReference=false
      severity: Error
      message: >-
        CorporateActionScheduleRule violates the frozen kind, method, percentage interval, date, rights, or
        entitlement-clause contract
    CorporateActionDistributionAssessmentMethodIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDistributionAssessmentMethodIntegrity
      namespace: fin-market-rules
      localName: CorporateActionDistributionAssessmentMethodIntegrity
      label: Corporate Action Distribution Assessment Method Integrity
      definition: >-
        enforces authority-scoped logical identity, exact input branch, non-negative precision, formula and
        implementation digests, and the requires-market-price iff non-notApplicable selection and required PriceKind IRI
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-corporate-action-distribution-assessment-method-v1;priceFields=iffRequiresMarketPrice
      severity: Error
      message: distribution-assessment method identity, execution lock, or price-selection matrix is inconsistent
    CorporateActionEntitlementClauseIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionEntitlementClauseIntegrity
      namespace: fin-market-rules
      localName: CorporateActionEntitlementClauseIntegrity
      label: Corporate Action Entitlement Clause Integrity
      definition: >-
        requires exactly ordinaryRecordPosition xone dueBillAdjusted; ordinary mode forbids due-bill fields, while
        due-bill mode requires a valid half-open trade interval and one exact settlement-qualification member
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-corporate-action-entitlement-clause-v1;interval=halfOpen;modeFields=exact
      severity: Error
      message: corporate-action entitlement mode, pivot, due-bill interval, or settlement qualification is inconsistent
    CorporateActionDateResolutionClauseIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateResolutionClauseIntegrity
      namespace: fin-market-rules
      localName: CorporateActionDateResolutionClauseIntegrity
      label: Corporate Action Date Resolution Clause Integrity
      definition: >-
        requires one output role, one published Event date-field role, one business-day Quantity offset, and one
        explicit adjustment convention; a ScheduleRule may resolve each required output role exactly once
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-corporate-action-date-resolution-clause-v1;outputRoleUniquePerSchedule=true
      severity: Error
      message: corporate-action date-resolution clause is incomplete, duplicated, or uses an invalid offset/adjustment
    CorporateActionDateOrderingClauseIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-rules/CorporateActionDateOrderingClauseIntegrity
      namespace: fin-market-rules
      localName: CorporateActionDateOrderingClauseIntegrity
      label: Corporate Action Date Ordering Clause Integrity
      definition: requires two distinct resolved date roles and one reviewed ordering operator
      constraintType: CrossField
      scope: Object
      expression:
        language: Custom
        expression: contract=rfc001-corporate-action-date-ordering-clause-v1;distinctRoles=true
      severity: Error
      message: corporate-action date-ordering clause has missing or identical roles or an unsupported operator
