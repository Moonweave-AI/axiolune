      cnNote: 夏令时重叠策略，是某一交易日历携带的封闭分类属性，用于声明本地到 UTC 物化时落在夏令时 gap 或 fold 内的本地时钟瞬时的解释方式。
      valueType: https://axiolune.ai/ontology/finance/market-structure/DstOverlapPolicy
      defaultCardinality:
        minCount: 0
        maxCount: 1
  identifierTypes: {}
  codeLists:
    MICEntryType:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType
      namespace: fin-market-structure
      localName: MICEntryType
      label: MIC Entry Type
      definition: MIC Entry Type, is a closed controlled vocabulary based on ISO 10383 that distinguishes operating-level MICs from segment-level MICs, used to provide a standard enumeration of entry kinds for MIC registry entries.
      cnNote: MIC 条目类型表，是依据 ISO 10383 区分运营级 MIC 与板块级 MIC 的封闭受控词汇，用于为 MIC 注册条目提供条目种类的标准枚举。
      vocabulary: MIC Entry Type
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType/value/OPRT
          notation: OPRT
          label: Operating MIC
          definition: registry entry that identifies an operating-level MICIdentifiedMarketInfrastructure, which may be a TradingVenue or a TradeReportingFacility
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType/value/SGMT
          notation: SGMT
          label: Segment MIC
          definition: registry entry that identifies a MarketSegment (a section of a TradingVenue or a TradeReportingFacility) and refers to its operating MIC entry
    CalendarExceptionKind:
      iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind
      namespace: fin-market-structure
      localName: CalendarExceptionKind
      label: Calendar Exception Kind
      definition: Calendar Exception Kind, is a closed classification controlled vocabulary of deterministic changes to scheduled session occurrences, used to provide a standard enumeration of holidays, closures, early and late opens and closes, extra sessions, and segmented interruptions and resumptions for calendar exceptions and schedule override notices.
      cnNote: 日历例外类型表，是对已计划时段实例进行确定性变更的封闭分类受控词汇，用于为日历例外与日程变更公告提供节假日、停市、提前/延后开收盘、额外时段、分段中断与恢复等标准枚举。
      vocabulary: Calendar Exception Kind
      version: 1.1.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/holiday
          notation: holiday
          label: Holiday
          definition: calendar exception that removes the affected session occurrence for a recognized holiday
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/closure
          notation: closure
          label: Closure
          definition: calendar exception that removes the affected session occurrence for a non-holiday closure
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/earlyClose
          notation: earlyClose
          label: Early Close
          definition: calendar exception that shortens an occurrence by replacing its exclusive end instant with an earlier instant
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/lateOpen
          notation: lateOpen
          label: Late Open
          definition: calendar exception that delays an occurrence by replacing its inclusive start instant with a later instant
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/earlyOpen
          notation: earlyOpen
          label: Early Open
          definition: calendar exception that advances an occurrence by replacing its inclusive start instant with an earlier instant
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/lateClose
          notation: lateClose
          label: Late Close
          definition: calendar exception that extends an occurrence by replacing its exclusive end instant with a later instant
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/extraSession
          notation: extraSession
          label: Extra Session
          definition: calendar exception that adds a session occurrence not present in the template schedule
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/segmentedInterrupt
          notation: segmentedInterrupt
          label: Segmented Interrupt
          definition: calendar exception that interrupts a session occurrence for a sub-interval, used with a matching segmentedResume to model a trading halt within the session
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/segmentedResume
          notation: segmentedResume
          label: Segmented Resume
          definition: calendar exception that resumes a previously interrupted session occurrence after a matching segmentedInterrupt
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/earlySession
          notation: earlySession
          label: Early Session (deprecated)
          definition: legacy alias for earlyClose; retained for compatibility, replaced by earlyClose
        - iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind/value/lateSession
          notation: lateSession
          label: Late Session (deprecated)
          definition: legacy alias for lateOpen; retained for compatibility, replaced by lateOpen
    MarketConvention:
      iri: https://axiolune.ai/ontology/finance/market-structure/MarketConvention
      namespace: fin-market-structure
      localName: MarketConvention
      label: Market Convention
      definition: Market Convention, is a closed convention classification controlled vocabulary, used to orient direct quote-per-unit OTC contexts and provide a standard enumeration of over-the-counter quoting methods.
      cnNote: 市场约定表，是用于为按单位直接报价的场外上下文定向的封闭约定分类受控词汇，用于为场外报价方式提供标准枚举。
      vocabulary: Market Convention
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/MarketConvention/value/directQuotePerUnit
          notation: directQuotePerUnit
          label: Direct Quote Per Unit
          definition: convention in which one instrument unit is valued directly in the context quote currency
    VenueCategory:
      iri: https://axiolune.ai/ontology/finance/market-structure/VenueCategory
      namespace: fin-market-structure
      localName: VenueCategory
      label: Venue Category
      definition: Venue Category, is a closed controlled vocabulary of regulatory trading-venue categories, used to classify a TradingVenue as a temporal evidenced fact rather than a global supertree.
      cnNote: 场所类别表，是监管交易场所类别的封闭受控词汇，用于将交易场所分类为带时间与证据的事实而非全局超类树。
      vocabulary: Venue Category
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/VenueCategory/value/regulatedMarket
          notation: regulatedMarket
          label: Regulated Market
          definition: venue authorized as a regulated market (e.g. EU RM)
        - iri: https://axiolune.ai/ontology/finance/market-structure/VenueCategory/value/multilateralTradingFacility
          notation: multilateralTradingFacility
          label: Multilateral Trading Facility
          definition: venue authorized as a multilateral trading facility (e.g. EU MTF)
        - iri: https://axiolune.ai/ontology/finance/market-structure/VenueCategory/value/organizedTradingFacility
          notation: organizedTradingFacility
          label: Organized Trading Facility
          definition: venue authorized as an organized trading facility (e.g. EU OTF)
        - iri: https://axiolune.ai/ontology/finance/market-structure/VenueCategory/value/otherTradingVenue
          notation: otherTradingVenue
          label: Other Trading Venue
          definition: venue authorized under another comparable trading-venue regime (e.g. ATS, exchange)
    ScheduledTradingPhase:
      iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase
      namespace: fin-market-structure
      localName: ScheduledTradingPhase
      label: Scheduled Trading Phase
      definition: Scheduled Trading Phase, is a closed controlled vocabulary of the scheduled phases of a trading session, used to distinguish pre-open, opening auction, continuous trading, closing auction, post-close, maintenance, and reporting-only phases.
      cnNote: 计划交易阶段表，是交易时段计划阶段的封闭受控词汇，用于区分 preOpen、openingAuction、continuousTrading、closingAuction、postClose、maintenance 与 reportingOnly 阶段。
      vocabulary: Scheduled Trading Phase
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/preOpen
          notation: preOpen
          label: Pre-Open
          definition: phase in which orders may be accepted but not matched
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/openingAuction
          notation: openingAuction
          label: Opening Auction
          definition: phase in which opening auction matching occurs
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/continuousTrading
          notation: continuousTrading
          label: Continuous Trading
          definition: phase in which orders match continuously
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/closingAuction
          notation: closingAuction
          label: Closing Auction
          definition: phase in which closing auction matching occurs
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/postClose
          notation: postClose
          label: Post-Close
          definition: phase after the trading session in which post-close processing occurs
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/maintenance
          notation: maintenance
          label: Maintenance
          definition: phase reserved for venue maintenance, not open for trading
        - iri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase/value/reportingOnly
          notation: reportingOnly
          label: Reporting Only
          definition: phase in which the venue accepts reports but does not operate a trading market
    MICOperationalStatus:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICOperationalStatus
      namespace: fin-market-structure
      localName: MICOperationalStatus
      label: MIC Operational Status
      definition: MIC Operational Status, is a closed controlled vocabulary of the ISO 10383 lifecycle status of a MIC registry entry, used to record whether an entry is active, updated, or expired.
      cnNote: MIC 运营状态表，是某一 MIC 注册条目 ISO 10383 生命周期状态的封闭受控词汇，用于记录条目是 active、updated 还是 expired。
      vocabulary: MIC Operational Status
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICOperationalStatus/value/active
          notation: active
          label: Active
          definition: MIC registry entry is currently active
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICOperationalStatus/value/updated
          notation: updated
          label: Updated
          definition: MIC registry entry has been updated and the update is recorded
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICOperationalStatus/value/expired
          notation: expired
          label: Expired
          definition: MIC registry entry has expired and is no longer active
    MICMarketCategory:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICMarketCategory
      namespace: fin-market-structure
      localName: MICMarketCategory
      label: MIC Market Category
      definition: MIC Market Category, is a closed controlled vocabulary of the ISO 10383 market category of the infrastructure identified by a MIC registry entry, used to record whether the identified infrastructure operates a trading market, reports trades, or performs another market function.
      cnNote: MIC 市场类别表，是某一 MIC 注册条目所标识基础设施 ISO 10383 市场类别的封闭受控词汇，用于记录所标识基础设施是运营交易市场、报告交易还是执行其他市场功能。
      vocabulary: MIC Market Category
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICMarketCategory/value/operating
          notation: operating
          label: Operating
          definition: the MIC identifies an operating-level market infrastructure
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICMarketCategory/value/segment
          notation: segment
          label: Segment
          definition: the MIC identifies a segment-level section of an operating market infrastructure
        - iri: https://axiolune.ai/ontology/finance/market-structure/MICMarketCategory/value/reporting
          notation: reporting
          label: Reporting
          definition: the MIC identifies a trade reporting facility or reporting arrangement
    DstOverlapPolicy:
      iri: https://axiolune.ai/ontology/finance/market-structure/DstOverlapPolicy
      namespace: fin-market-structure
      localName: DstOverlapPolicy
      label: DST Overlap Policy
      definition: DST Overlap Policy, is a closed controlled vocabulary of the interpretation policy for local-clock instants that fall inside a DST gap or fold, used to make local-to-UTC materialization deterministic.
      cnNote: 夏令时重叠策略表，是落在夏令时 gap 或 fold 内的本地时钟瞬时解释策略的封闭受控词汇，用于使本地到 UTC 物化具有确定性。
      vocabulary: DST Overlap Policy
      version: 1.0.0
      maintainer: Axiolune ontology maintainers
      sourceEvidenceRef: https://axiolune.ai/references/axiolune-m2-controlled-vocabularies
      values:
        - iri: https://axiolune.ai/ontology/finance/market-structure/DstOverlapPolicy/value/earlierTime
          notation: earlierTime
          label: Earlier Time
          definition: ambiguous local instant is interpreted as the earlier of the two UTC instants
        - iri: https://axiolune.ai/ontology/finance/market-structure/DstOverlapPolicy/value/laterTime
          notation: laterTime
          label: Later Time
          definition: ambiguous local instant is interpreted as the later of the two UTC instants
        - iri: https://axiolune.ai/ontology/finance/market-structure/DstOverlapPolicy/value/invalid
          notation: invalid
          label: Invalid
          definition: local instant inside a DST gap is invalid and rejected
  constraints:
    MICRegistryEntryContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntryContract
      namespace: fin-market-structure
      localName: MICRegistryEntryContract
      label: MIC Registry Entry Contract
      definition: >-
        logical constraint requiring OPRT entries to identify an operating-level MICIdentifiedMarketInfrastructure
        (a TradingVenue or a TradeReportingFacility) and SGMT entries to identify a MarketSegment section of such
        an operating entity, with the logical/exact version bridge comparing registryFacility.marketSegmentVenue or
        componentOf against versionOf(operatingMICEntry.registryFacility)
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(registryAuthority,registryMICValue.micLexicalValue); registryMICValue.micLexicalValue matches
          ^[A-Z0-9]{4}$; OPRT => facility is MICIdentifiedMarketInfrastructure (TradingVenue or TradeReportingFacility)
          and operatingMICEntry absent; SGMT => facility is MarketSegment and exactlyOne(operatingMICEntry) and
          operatingMICEntry.type = OPRT and versionOf(operatingMICEntry.registryFacility) =
          facility.marketSegmentVenue (or facility.componentOf) so the segment's logical parent equals the logical
          identity of the operating MIC's exact facility version
      severity: Error
      message: MIC registry entry violates its OPRT or SGMT facility contract or its logical/exact version bridge
      targetElement: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
    TradingCalendarIdentityContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarIdentityContract
      namespace: fin-market-structure
      localName: TradingCalendarIdentityContract
      label: Trading Calendar Identity Contract
      definition: >-
        identity constraint fixing calendar logical identity to facility, calendar authority, and authority calendar
        identifier while source revisions remain version content
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: logicalKey(calendarFacility,calendarAuthority,authorityCalendarId)
      severity: Error
      message: trading calendar logical identity does not match the canonical three-component key
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
    TradingSessionOccurrenceContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrenceContract
      namespace: fin-market-structure
      localName: TradingSessionOccurrenceContract
      label: Trading Session Occurrence Contract
      definition: >-
        interval, join, and materialization consistency constraint requiring exact template, calendar, and facility
        versions, a non-empty half-open scheduled UTC interval, and consistency between the occurrence UTC interval
        and the template recurrence rule, local start/end, endDayOffset, and calendar IANA time zone and tzdb release
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          occurrenceTemplate.templateCalendar = occurrenceCalendar and occurrenceCalendar.calendarFacility =
          versionOf(occurrenceFacility) and sessionStartUtc < sessionEndUtc and materializeUtc(
          occurrenceTemplate.recurrenceRule|sessionRecurrence, occurrenceTemplate.localSessionStart,
          occurrenceTemplate.localSessionEnd, occurrenceTemplate.endDayOffset, occurrenceCalendar.ianaTimeZone,
          occurrenceCalendar.tzdbRelease, occurrenceCalendar.dstOverlapPolicy) = (sessionStartUtc, sessionEndUtc)
          for sessionBusinessDate
      severity: Error
      message: session occurrence is inconsistent with its exact template, calendar, facility, UTC interval, or materialization
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
    TradingCalendarExceptionContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarExceptionContract
      namespace: fin-market-structure
      localName: TradingCalendarExceptionContract
      label: Trading Calendar Exception Contract
      definition: deterministic exception constraint that changes an occurrence rather than mutating a reusable session template, covering the v1.1.0 extended exception kinds
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          holiday|closure => no replacement interval; earlyClose|earlySession => replacementSessionEndUtc present and
          earlier; lateOpen|lateSession => replacementSessionStartUtc present and later; earlyOpen =>
          replacementSessionStartUtc present and earlier; lateClose => replacementSessionEndUtc present and later;
          extraSession => replacement interval present; segmentedInterrupt|segmentedResume => paired and within the
          scheduled interval
      severity: Error
      message: calendar exception does not deterministically alter its exact occurrence
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarException
    OTCTradingContextContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContextContract
      namespace: fin-market-structure
      localName: OTCTradingContextContract
      label: OTC Trading Context Contract
      definition: >-
        executable pair constraint for provider-scoped non-listing contexts whose optional exact-version counterparties
        must be absent together or present as two distinct IRIs in canonical lexical order. Deprecated as of v1.1.0
        with OTCTradingContext; counterparty semantics move to orders-execution or post-trade-operations.
      constraintType: Logical
      scope: Object
      expression:
        language: SPARQL
        expression: |-
          SELECT $this ?path
          WHERE {
            OPTIONAL { $this <https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyA> ?counterpartyA . }
            OPTIONAL { $this <https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyB> ?counterpartyB . }
            BIND(<https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyA> AS ?path)
            FILTER (
              (BOUND(?counterpartyA) && !BOUND(?counterpartyB))
              || (!BOUND(?counterpartyA) && BOUND(?counterpartyB))
              || (BOUND(?counterpartyA) && BOUND(?counterpartyB)
                  && STR(?counterpartyA) >= STR(?counterpartyB))
            )
          }
      severity: Error
      message: OTC counterparties must be absent together or present as two distinct exact-version IRIs in lexical order
      targetElement: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
    OTCTradingContextReferenceContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContextReferenceContract
      namespace: fin-market-structure
      localName: OTCTradingContextReferenceContract
      label: OTC Trading Context Reference Contract
      definition: three-axis reference and authority-registry constraint for provider-scoped non-listing market contexts. Deprecated as of v1.1.0 with OTCTradingContext; the source contract moves to Layer 4 and currency evidence to instruments.
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(versionOf(otcSourceProvider),sourceContractRef,providerContextId); otcSourceProvider,
          otcReportingFacility when present, and both counterparties when present are exactVersionPITEligibleAt(
          self.validFrom,self.knowledgeFrom,self.availableFrom); exactlyOne(PITEligible active ISO4217RegistryEntry for
          otcQuoteCurrency joined to locked authority bytes); otcSettlementCurrency when present has exactlyOne(
          PITEligible active ISO4217RegistryEntry joined to locked authority bytes); sourceContractDigest authenticates
          sourceContractRef bytes
      severity: Error
      message: OTC context identity, exact references, Currency registry evidence, or source contract is invalid
      targetElement: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
    VenueOperationIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-structure/VenueOperationIntegrity
      namespace: fin-market-structure
      localName: VenueOperationIntegrity
      label: Venue Operation Integrity
      definition: >-
        integrity constraint requiring a VenueOperation to bind one logical TradingVenue to one logical Party over a
        non-empty validity interval, with venueOperationValidFrom < venueOperationValidTo when the end is present,
        and at most one active VenueOperation per venue at any valid time
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          exactlyOne(operatedVenue) and exactlyOne(operatingParty) and venueOperationValidFrom present and
          (venueOperationValidTo absent or venueOperationValidFrom < venueOperationValidTo) and
          atMostOneActiveVenueOperationFor(operatedVenue, self.validFrom)
      severity: Error
      message: venue operation is inconsistent in its venue, party, validity interval, or active uniqueness
      targetElement: https://axiolune.ai/ontology/finance/market-structure/VenueOperation
    CalendarExceptionSupersession:
      iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionSupersession
      namespace: fin-market-structure
      localName: CalendarExceptionSupersession
      label: Calendar Exception Supersession
      definition: >-
        supersession constraint requiring that when multiple TradingScheduleOverrideNotice facts affect the same
        occurrence, the notice with the greatest overrideSupersessionOrder (tie-broken by overrideAnnouncementOrder)
        determines the single final effective interval or cancellation, and that the final effective interval is
        consistent with all applied notices
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          for each occurrence, the final effective interval or cancellation is synthesized from the notice with
          max(overrideSupersessionOrder, overrideAnnouncementOrder); holiday|closure => no effective interval;
          earlyClose|lateOpen|earlyOpen|lateClose|extraSession => effective interval derived from the scheduled
          interval and the notice replacement instants; segmentedInterrupt|segmentedResume => effective interval
          excludes the interrupted sub-interval
      severity: Error
      message: multiple schedule override notices do not synthesize a single consistent final effective interval
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingScheduleOverrideNotice
    CalendarExceptionDateConsistency:
      iri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionDateConsistency
      namespace: fin-market-structure
      localName: CalendarExceptionDateConsistency
      label: Calendar Exception Date Consistency
      definition: >-
        date consistency constraint requiring that a calendar exception's exceptionBusinessDate equals the
        sessionBusinessDate of the exact session occurrence it alters
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: exceptionBusinessDate = exceptionOccurrence.sessionBusinessDate
      severity: Error
      message: calendar exception business date does not match the affected occurrence session business date
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarException
    CalendarJurisdictionConsistency:
      iri: https://axiolune.ai/ontology/finance/market-structure/CalendarJurisdictionConsistency
      namespace: fin-market-structure
      localName: CalendarJurisdictionConsistency
      label: Calendar Jurisdiction Consistency
      definition: >-
        consistency constraint requiring that the direct calendarJurisdiction logical identity of a TradingCalendar
        matches the jurisdiction of the active JurisdictionCalendarBinding for the same calendar version, so the
        direct relation and the association are a single source of truth
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          calendarJurisdiction = bindingJurisdiction of the JurisdictionCalendarBinding whose bindingCalendar =
          versionOf(self) and whose TemporalFact interval contains self.validFrom
      severity: Error
      message: calendar direct jurisdiction does not match the active jurisdiction calendar binding
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
    ScheduleOverrideNoticeIntegrity:
      iri: https://axiolune.ai/ontology/finance/market-structure/ScheduleOverrideNoticeIntegrity
      namespace: fin-market-structure
      localName: ScheduleOverrideNoticeIntegrity
      label: Schedule Override Notice Integrity
      definition: >-
        integrity constraint requiring a TradingScheduleOverrideNotice to bind one exact calendar, one exact
        facility, and one or more exact session occurrences under that calendar and facility, with a positive
        announcement order and supersession order
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          exactlyOne(overrideForCalendar) and exactlyOne(overrideForFacility) and atLeastOne(overrideAppliesToOccurrence)
          and overrideAnnouncementOrder >= 0 and overrideSupersessionOrder >= 0 and for each occurrence:
          occurrenceCalendar = overrideForCalendar and versionOf(occurrenceFacility) = overrideForFacility
      severity: Error
      message: schedule override notice is inconsistent in its calendar, facility, occurrences, or order fields
      targetElement: https://axiolune.ai/ontology/finance/market-structure/TradingScheduleOverrideNotice
    NonVenueMarketContextContract:
      iri: https://axiolune.ai/ontology/finance/market-structure/NonVenueMarketContextContract
      namespace: fin-market-structure
      localName: NonVenueMarketContextContract
      label: Non-Venue Market Context Contract
      definition: >-
        identity constraint for a stable non-venue market context whose logical key is the provider-scoped context
        identifier and market-convention orientation, carrying no counterparty pair, no concrete currencies, and no
        source contract
      constraintType: Logical
      scope: Object
      expression:
        language: Custom
        expression: >-
          logicalKey(providerContextId, marketConvention); no otcCounterpartyA, no otcCounterpartyB, no
          otcQuoteCurrency, no otcSettlementCurrency, no sourceContractRef, no sourceContractDigest;
          nonVenueContextProvider when present is a logical Party reference
      severity: Error
      message: non-venue market context carries disallowed counterparty, currency, or source-contract fields
      targetElement: https://axiolune.ai/ontology/finance/market-structure/NonVenueMarketContext
