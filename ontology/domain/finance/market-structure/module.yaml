module:
  moduleIri: https://axiolune.ai/ontology/finance/market-structure
  baseIri: https://axiolune.ai/ontology/finance/market-structure/
  preferredPrefix: fin-market-structure
  version: 1.1.0
  label: Market Structure
  definition: Market Structure, is a domain module in ontology engineering that defines market infrastructure identified by MIC, trading venues and their operating entities, trading sessions, trading calendars, and pre-announced schedule overrides, used to provide typed definitions for the stable organizational structure and temporal scheduling of trading. It does not carry one-off venue rules, tickers, real-time market status, OTC counterparty pairs, or provider source contracts, which belong to market-rules, instruments, market-data, orders-execution, or Layer 4 respectively.
  cnNote: 市场结构模块，是本体工程中定义由 MIC 标识的市场基础设施、交易场所及其运营实体、交易时段、交易日历与预公布日程变更的领域模块，旨在为交易的组织结构与时间安排提供类型化定义。本模块不承载一时规则、ticker、实时市场状态、场外对手方对或数据源契约，这些分别归 market-rules、instruments、market-data、orders-execution 或 Layer 4。
  imports:
    - moduleIri: https://axiolune.ai/ontology/finance/foundation
  exports: []
  status: approved
  governance:
    ownerRef: urn:axiolune:principal:repository-owner
    status: approved
domain:
  objectTypes:
    MICIdentifiedMarketInfrastructure:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICIdentifiedMarketInfrastructure
      namespace: fin-market-structure
      localName: MICIdentifiedMarketInfrastructure
      label: MIC-Identified Market Infrastructure
      definition: MIC-Identified Market Infrastructure, is the abstract base class for any operating or reporting market infrastructure entity identifiable by an ISO 10383 Market Identifier Code, used to broaden the MIC target taxonomy beyond trading venues to include trade reporting facilities, approved publication arrangements, approved reporting mechanisms, and similar infrastructure while preserving a common reference range.
      cnNote: MIC 标识的市场基础设施，是任何可由 ISO 10383 市场标识符代码标识的运营或报告市场基础设施实体的抽象基类，用于将 MIC 目标分类从交易场所拓宽至交易报告设施、获批发布安排、获批报告机制等基础设施，同时保留公共参照范围。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MarketInfrastructureComponent:
      iri: https://axiolune.ai/ontology/finance/market-structure/MarketInfrastructureComponent
      namespace: fin-market-structure
      localName: MarketInfrastructureComponent
      label: Market Infrastructure Component
      definition: Market Infrastructure Component, is the abstract base class for a section or component of an operating market infrastructure entity, used to model the ISO 10383 "section" semantics (a part of a market, exchange, or reporting facility) as a component rather than as an independent facility, while allowing concrete components to share a facility supertype for reference range where useful.
      cnNote: 市场基础设施组成部分，是某一运营中市场基础设施实体的板块或组成部分的抽象基类，用于将 ISO 10383 "section" 语义（市场、交易所或报告设施的一部分）建模为组成部分而非独立设施，同时允许具体组成部分在需要时共享设施超类以获得参照范围。
      superTypes:
        - https://axiolune.ai/ontology/finance/foundation/IdentifiableSubject
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      namespace: fin-market-structure
      localName: TradingFacility
      label: Trading Facility
      definition: Trading Facility, is an identifiable market facility concept that provides a common reference range for an operating trading venue or one of its market segments, used as the base class for venue identity in the market-structure ontology.
      cnNote: 交易设施，是可标识的市场设施类概念，用于为某一运营交易场所或其市场板块提供公共参照范围，构成市场结构本体中场所标识的基类。
      superTypes:
        - https://axiolune.ai/ontology/finance/market-structure/MICIdentifiedMarketInfrastructure
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingVenue:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
      namespace: fin-market-structure
      localName: TradingVenue
      label: Trading Venue
      definition: Trading Venue, is a trading facility that constitutes, maintains, or provides a market system on which financial instruments may be admitted to trading, used to identify a market system or venue (a regulated market, multilateral trading facility, organized trading facility, or comparable trading platform) distinct from the legal entity that operates it. The operator and the regulatory category of the venue are modeled separately as temporal, evidenced facts via VenueOperation rather than as part of the venue identity.
      cnNote: 交易场所，是构成、维护或提供可接纳金融工具上市交易之市场系统的交易设施，用于在市场结构中标识一个市场系统或场所（受监管市场、多边交易设施、有组织交易设施或可比交易平台），与运营它的法人实体相区分。场所的运营者与监管类别作为带时间与证据的事实经 VenueOperation 单独建模，而非场所身份的一部分。
      superTypes:
        - https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradeReportingFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradeReportingFacility
      namespace: fin-market-structure
      localName: TradeReportingFacility
      label: Trade Reporting Facility
      definition: Trade Reporting Facility, is a market infrastructure entity to which trade reports are made but which does not itself operate a trading market, used to identify an approved publication arrangement, approved reporting mechanism, trade reporting facility, or comparable non-trading reporting infrastructure that an ISO 10383 Operating MIC may identify.
      cnNote: 交易报告设施，是接收交易报告但自身不运营交易市场的市场基础设施实体，用于标识获批发布安排、获批报告机制、交易报告设施或可比非交易报告基础设施，这些设施可由 ISO 10383 运营 MIC 标识。
      superTypes:
        - https://axiolune.ai/ontology/finance/market-structure/MICIdentifiedMarketInfrastructure
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MarketSegment:
      iri: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
      namespace: fin-market-structure
      localName: MarketSegment
      label: Market Segment
      definition: Market Segment, is a section or component of an operating market infrastructure entity (a trading venue or a trade reporting facility), modeled as a TradingFacility subtype for shared reference range but carrying its part-of semantics through the componentOf relation, used to characterize a subdomain divided by instrument type, regulation, or reporting section within the parent entity. The MarketSegment is a section, not an independent facility; it belongs to exactly one operating entity identified by the segment's marketSegmentVenue or componentOf relation.
      cnNote: 市场板块，是某一运营中市场基础设施实体（交易场所或交易报告设施）的板块或组成部分，为共享参照范围而建模为 TradingFacility 子类，但其归属语义通过 componentOf 关系承载，用于刻画父实体内部按品种、规则或报告板块划分的子域。市场板块是一个 section 而非独立设施；它属于且仅属于一个运营实体，该实体由板块的 marketSegmentVenue 或 componentOf 关系标识。
      superTypes:
        - https://axiolune.ai/ontology/finance/market-structure/TradingFacility
        - https://axiolune.ai/ontology/finance/market-structure/MarketInfrastructureComponent
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    MICRegistryEntry:
      iri: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      namespace: fin-market-structure
      localName: MICRegistryEntry
      label: MIC Registry Entry
      definition: MIC Registry Entry, is a timestamped minimal MIC identity slice that binds a four-character MIC value and its entry kind to the exact market infrastructure version identified by that registry record, used to anchor the registration record to the underlying facility version. The entry carries optional ISO 10383 lifecycle fields (operational status, effective/expiry dates, replacement, market category) when available; it is an identity anchor, not a full ISO 10383 registry mirror.
      cnNote: MIC 注册条目，是带时间戳的最小 MIC 身份切片，用于把一个四位 MIC 值及其条目种类绑定到该注册记录所标识的确切市场基础设施版本。条目在可用时携带可选的 ISO 10383 生命周期字段（运营状态、生效/到期日期、替换、市场类别）；它是身份锚点，而非完整的 ISO 10383 注册表镜像。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/micEntryType
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/micOperationalStatus
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/micEffectiveFrom
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/micEffectiveTo
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/marketCategory
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingCalendar:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      namespace: fin-market-structure
      localName: TradingCalendar
      label: Trading Calendar
      definition: Trading Calendar, is an immutable calendar version maintained by an authority for one trading facility, jurisdiction, and IANA time zone, used to characterize the trading-day and non-trading-day arrangements of that facility under a specific time zone. It is the concrete specialization of the foundation BusinessCalendar interface for a trading facility and pins an optional IANA tzdb release together with a DST overlap policy for deterministic local-to-UTC materialization.
      cnNote: 交易日历，是由权威机构为某一交易设施、司法辖区与 IANA 时区维护的不可变日历版本，用于刻画该设施在特定时区下的交易日与非交易日安排。它是 foundation BusinessCalendar 接口针对交易设施的具体特化，并锁定可选的 IANA tzdb 发行版本与夏令时重叠策略以支持确定性的本地到 UTC 物化。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/authorityCalendarId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/ianaTimeZone
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/tzdbRelease
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/dstOverlapPolicy
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingSessionTemplate:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingSessionTemplate
      namespace: fin-market-structure
      localName: TradingSessionTemplate
      label: Trading Session Template
      definition: Trading Session Template, is a local-clock recurring session specification attached to one exact TradingCalendar version, used to define repeatedly applicable session start, end, phase, and recurrence rules that deterministically materialize into UTC half-open occurrence intervals under the calendar's IANA time zone.
      cnNote: 交易时段模板，是附加于某一确切交易日历版本的按本地时钟重复的时段规范，用于定义可反复套用且可在日历 IANA 时区下确定性物化为 UTC 半开实例区间的交易时段起止、阶段与复发规则。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionRecurrence
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/recurrenceRule
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/authoritySessionId
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/scheduledTradingPhase
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/localSessionStart
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/localSessionEnd
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/endDayOffset
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingSessionOccurrence:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      namespace: fin-market-structure
      localName: TradingSessionOccurrence
      label: Trading Session Occurrence
      definition: Trading Session Occurrence, is a dated scheduled session window materialized from one exact session template and calendar version for one exact facility version and represented as a UTC half-open interval, used to denote a concrete scheduled time window. Whether the window is effectively tradable is a derived result expressed by the optional effectiveSessionStartUtc and effectiveSessionEndUtc attributes after applying any TradingScheduleOverrideNotice facts; a window removed by a holiday or closure has no effective tradable interval rather than losing its scheduled identity.
      cnNote: 交易时段实例，是由某一确切时段模板与日历版本为某一确切设施版本物化出的以 UTC 半开区间表示的带日期计划时段窗口，用于表示一个具体的计划时间窗。该窗口是否实际可交易是派生结果，由应用 TradingScheduleOverrideNotice 事实后的可选 effectiveSessionStartUtc 与 effectiveSessionEndUtc 属性表达；被节假日或停市移除的窗口没有有效可交易区间，而非失去其计划身份。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionBusinessDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionStartUtc
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sessionEndUtc
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/effectiveSessionStartUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/effectiveSessionEndUtc
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingCalendarException:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarException
      namespace: fin-market-structure
      localName: TradingCalendarException
      label: Trading Calendar Exception
      definition: Trading Calendar Exception, is a timestamped exception fact, used to deterministically close or adjust one exact session occurrence without mutating its session template, characterizing holidays, temporary closures, or early and late session openings and closings.
      cnNote: 交易日历例外，是带时间戳的例外事实，用于在不改动原时段模板的前提下确定性地关闭或调整某一确切时段实例，刻画节假日、临时停市或提前延后开收盘。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/calendarExceptionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/exceptionBusinessDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/replacementSessionStartUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/replacementSessionEndUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    OTCTradingContext:
      iri: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      namespace: fin-market-structure
      localName: OTCTradingContext
      label: OTC Trading Context
      definition: OTC Trading Context, is a non-listing trading context whose logical identity is determined by the source-provider logical IRI, the immutable source-contract IRI, and a provider-scoped context identifier, used to characterize the market-convention environment for over-the-counter quotes and executions. This type is deprecated as of v1.1.0 because it mixes provider source contract, quote/settlement currency, reporting facility, concrete counterparty pair, and execution semantics that are not stable market structure; it is replaced by NonVenueMarketContext for the stable non-venue structure, while the provider contract moves to Layer 4, currencies/convention to instruments, and counterparty/execution/reporting to orders-execution or post-trade-operations. The type is retained for IRI stability because market-data, instruments, and orders-execution reference it as an association range; its cross-module migration is deferred to a follow-up ADR.
      cnNote: 场外交易上下文，是非上市交易语境，其逻辑身份由数据源提供方逻辑 IRI、不可变源契约 IRI 与提供方作用域内上下文标识共同确定，用于刻画场外报价与成交的市场约定环境。该类型自 v1.1.0 起弃用，因其混合了数据源契约、报价/结算币种、报告设施、具体对手方对与成交语义，并非稳定市场结构；其稳定非场所结构由 NonVenueMarketContext 取代，数据源契约归 Layer 4，币种/约定归 instruments，对手方/成交/报告归 orders-execution 或 post-trade-operations。因 market-data、instruments 与 orders-execution 以其为关联 range，该类型为 IRI 稳定性而保留；其跨模块迁移延后至后续 ADR。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/providerContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/marketConvention
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sourceContractRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/sourceContractDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    NonVenueMarketContext:
      iri: https://axiolune.ai/ontology/finance/market-structure/NonVenueMarketContext
      namespace: fin-market-structure
      localName: NonVenueMarketContext
      label: Non-Venue Market Context
      definition: Non-Venue Market Context, is a stable non-venue market context that characterizes the market-convention orientation of over-the-counter quoting without carrying provider source contracts, concrete currencies, counterparty pairs, or execution/reporting semantics, used to express only the stable structure that belongs in market-structure. Its logical identity is determined by the non-venue context identity and its market-convention orientation; provider attribution is a logical reference to a Party. Provider contract and source mapping belong to Layer 4, currencies and quotation convention to instruments, and counterparty/execution/reporting to orders-execution or post-trade-operations.
      cnNote: 非场所市场上下文，是刻画场外报价市场约定取向的稳定非场所市场上下文，不承载数据源契约、具体币种、对手方对或成交/报告语义，用于表达仅属于市场结构的稳定结构。其逻辑身份由非场所上下文身份及其市场约定取向确定；提供方归属是对 Party 的逻辑引用。数据源契约与映射归 Layer 4，币种与报价约定归 instruments，对手方/成交/报告归 orders-execution 或 post-trade-operations。
      superTypes: []
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/providerContextId
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/marketConvention
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  associationTypes:
    JurisdictionCalendarBinding:
      iri: https://axiolune.ai/ontology/finance/market-structure/JurisdictionCalendarBinding
      namespace: fin-market-structure
      localName: JurisdictionCalendarBinding
      label: Jurisdiction Calendar Binding
      definition: Jurisdiction Calendar Binding, is an explicit temporal binding between one logical Jurisdiction identity and one exact TradingCalendar version, used to materialize the relationship between a calendar and its governing jurisdiction to support audit and mapping slices.
      cnNote: 司法辖区日历绑定，是某一逻辑司法辖区身份与某一确切交易日历版本之间的显式时态绑定，用于将日历与所辖司法辖区关系实例化以支持审计与映射切片。
      participantRoles:
        - id: bindingJurisdiction
          range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
          minCount: 1
          maxCount: 1
          label: binding jurisdiction
          definition: logical Jurisdiction identity governed by the calendar
        - id: bindingCalendar
          range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
          minCount: 1
          maxCount: 1
          label: binding calendar
          definition: exact TradingCalendar version bound to the jurisdiction
      attributeUses: []
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    VenueOperation:
      iri: https://axiolune.ai/ontology/finance/market-structure/VenueOperation
      namespace: fin-market-structure
      localName: VenueOperation
      label: Venue Operation
      definition: Venue Operation, is a temporal provenance-bearing association that records one logical Party operating one logical TradingVenue over a validity interval together with an optional regulatory venue category, used to separate the market system/venue from the legal entity that operates it and to model operator history without conflating venue identity with its operator.
      cnNote: 场所运营，是带时间与来源的关联，记录某一逻辑参与方在某一有效区间内运营某一逻辑交易场所及可选监管场所类别，用于将市场系统/场所与运营它的法人实体分离，并建模运营方历史而不把场所身份与运营方混淆。
      participantRoles:
        - id: operatedVenue
          range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
          minCount: 1
          maxCount: 1
          label: operated venue
          definition: logical TradingVenue identity operated by the party
        - id: operatingParty
          range: https://axiolune.ai/ontology/finance/foundation/Party
          minCount: 1
          maxCount: 1
          label: operating party
          definition: logical Party identity that operates the venue
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/venueCategory
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/venueOperationValidFrom
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/venueOperationValidTo
          minCount: 0
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    TradingScheduleOverrideNotice:
      iri: https://axiolune.ai/ontology/finance/market-structure/TradingScheduleOverrideNotice
      namespace: fin-market-structure
      localName: TradingScheduleOverrideNotice
      label: Trading Schedule Override Notice
      definition: Trading Schedule Override Notice, is a temporal provenance-bearing n-ary association that records one pre-announced schedule override applying to one or more exact TradingSessionOccurrence versions under one exact calendar and one exact facility, carrying an announcement order and a supersession order together with an optional replacement interval, used to separate the planned schedule from real-time status and to deterministically synthesize a single final effective interval or cancellation across multiple affected sessions.
      cnNote: 交易日程变更公告，是带时间与来源的 n 元关联，记录某一预公布的日程变更作用于某一确切日历与设施下的一个或多个确切交易时段实例版本，携带公告顺序与覆盖顺序及可选替换区间，用于将计划日程与实时状态分离，并跨多个受影响时段确定性合成单一最终有效区间或取消结果。
      participantRoles:
        - id: overrideForCalendar
          range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
          minCount: 1
          maxCount: 1
          label: override calendar
          definition: exact TradingCalendar version under which the override applies
        - id: overrideForFacility
          range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
          minCount: 1
          maxCount: 1
          label: override facility
          definition: exact TradingFacility version whose sessions are overridden
        - id: overrideAppliesToOccurrence
          range: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
          minCount: 1
          maxCount: null
          label: overridden occurrence
          definition: one or more exact TradingSessionOccurrence versions affected by the notice
      attributeUses:
        - attribute: https://axiolune.ai/ontology/finance/market-structure/calendarExceptionKind
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/exceptionBusinessDate
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/overrideAnnouncementOrder
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/overrideSupersessionOrder
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/overrideReplacementStartUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/finance/market-structure/overrideReplacementEndUtc
          minCount: 0
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactRef
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceArtifactDigest
          minCount: 1
          maxCount: 1
        - attribute: https://axiolune.ai/ontology/meta/data-binding/attributes/sourceLocator
          minCount: 1
          maxCount: 1
      patternBindings:
        - pattern: https://axiolune.ai/ontology/meta/patterns/TemporalFact
        - pattern: https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
  relationTypes:
    marketSegmentVenue:
      iri: https://axiolune.ai/ontology/finance/market-structure/marketSegmentVenue
      namespace: fin-market-structure
      localName: marketSegmentVenue
      label: Market Segment Venue
      definition: Market Segment Venue, is a functional relation that associates a market segment with the unique operating trading venue it belongs to, used to characterize the ownership structure between segments and venues.
      cnNote: 市场板块场所关系，是将某一市场板块关联到其所隶属的唯一运营交易场所的功能性关系，用于刻画板块与场所的归属结构。
      domain: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
      range: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
      characteristics:
        - functional
    registryMICValue:
      iri: https://axiolune.ai/ontology/finance/market-structure/registryMICValue
      namespace: fin-market-structure
      localName: registryMICValue
      label: Registry MIC Value
      definition: Registry MIC Value, is a functional relation that associates a MIC registry entry with the unique four-character MIC logical identity it represents, used to link registry entries to their ISO 10383 MIC identifiers.
      cnNote: 注册 MIC 值关系，是将某一 MIC 注册条目关联到其所代表的唯一四位 MIC 逻辑身份的功能性关系，用于把注册条目与 ISO 10383 MIC 标识挂钩。
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/MICValue
      characteristics:
        - functional
    registryAuthority:
      iri: https://axiolune.ai/ontology/finance/market-structure/registryAuthority
      namespace: fin-market-structure
      localName: registryAuthority
      label: Registry Authority
      definition: Registry Authority, is a functional relation that associates a MIC registry entry with the logical identifier authority that maintains it, used to characterize the maintenance responsibility for MIC registry.
      cnNote: 注册权威关系，是将某一 MIC 注册条目关联到维护该条目的逻辑标识符权威的功能性关系，用于刻画 MIC 注册的维护责任归属。
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/foundation/IdentifierAuthority
      characteristics:
        - functional
    registryFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/registryFacility
      namespace: fin-market-structure
      localName: registryFacility
      label: Registry Facility
      definition: Registry Facility, is a functional relation that associates a MIC registry entry with the exact TradingFacility version it identifies, used to bind MIC registry facts to a concrete venue version.
      cnNote: 注册设施关系，是将某一 MIC 注册条目关联到该条目所标识的确切交易设施版本的功能性关系，用于把 MIC 注册事实与具体场所版本绑定。
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    operatingMICEntry:
      iri: https://axiolune.ai/ontology/finance/market-structure/operatingMICEntry
      namespace: fin-market-structure
      localName: operatingMICEntry
      label: Operating MIC Entry
      definition: Operating MIC Entry, is a functional relation that associates a segment MIC entry with the exact operating MIC entry of its trading venue, used to characterize the correspondence between a segment and its venue's operating-level MIC.
      cnNote: 运营 MIC 条目关系，是将某一板块 MIC 条目关联到其交易场所对应的确切运营 MIC 条目的功能性关系，用于刻画板块与其场所运营级 MIC 的对应关系。
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      characteristics:
        - functional
    calendarFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarFacility
      namespace: fin-market-structure
      localName: calendarFacility
      label: Calendar Facility
      definition: Calendar Facility, is a functional relation that associates a trading calendar with the stable logical identity of its trading facility, used to characterize the venue that the calendar serves.
      cnNote: 日历设施关系，是将某一交易日历关联到其交易设施的稳定逻辑身份的功能性关系，用于刻画日历所服务的场所逻辑归属。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    calendarAuthority:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarAuthority
      namespace: fin-market-structure
      localName: calendarAuthority
      label: Calendar Authority
      definition: Calendar Authority, is a functional relation that associates a trading calendar with the Party logical identity of its maintaining authority, used to characterize the institutional responsibility for the calendar.
      cnNote: 日历权威关系，是将某一交易日历关联到其维护权威的参与方逻辑身份的功能性关系，用于刻画日历的机构责任归属。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    calendarJurisdiction:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarJurisdiction
      namespace: fin-market-structure
      localName: calendarJurisdiction
      label: Calendar Jurisdiction
      definition: Calendar Jurisdiction, is a functional relation that associates a trading calendar with its unique governing jurisdiction logical identity, used to characterize the regulatory and territorial attribution of the calendar.
      cnNote: 日历司法辖区关系，是将某一交易日历关联到其所辖唯一司法辖区逻辑身份的功能性关系，用于刻画日历的法规地域归属。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      range: https://axiolune.ai/ontology/finance/foundation/Jurisdiction
      characteristics:
        - functional
    templateCalendar:
      iri: https://axiolune.ai/ontology/finance/market-structure/templateCalendar
      namespace: fin-market-structure
      localName: templateCalendar
      label: Template Calendar
      definition: Template Calendar, is a functional relation that associates a session template with the exact trading-calendar version it specializes, used to attach a session specification to a concrete calendar version.
      cnNote: 模板日历关系，是将某一交易时段模板关联到其所特化的确切交易日历版本的功能性关系，用于把时段规范挂接到具体日历版本。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionTemplate
      range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      characteristics:
        - functional
    occurrenceTemplate:
      iri: https://axiolune.ai/ontology/finance/market-structure/occurrenceTemplate
      namespace: fin-market-structure
      localName: occurrenceTemplate
      label: Occurrence Template
      definition: Occurrence Template, is a functional relation that associates a session occurrence with the exact template version that generated it, used to trace the template source of an occurrence.
      cnNote: 实例模板关系，是将某一交易时段实例关联到生成它的确切时段模板版本的功能性关系，用于追溯实例的模板来源。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      range: https://axiolune.ai/ontology/finance/market-structure/TradingSessionTemplate
      characteristics:
        - functional
    occurrenceCalendar:
      iri: https://axiolune.ai/ontology/finance/market-structure/occurrenceCalendar
      namespace: fin-market-structure
      localName: occurrenceCalendar
      label: Occurrence Calendar
      definition: Occurrence Calendar, is a functional relation that associates a session occurrence with the exact calendar version applied to it, used to characterize the calendar version on which an occurrence is based.
      cnNote: 实例日历关系，是将某一交易时段实例关联到应用于它的确切日历版本的功能性关系，用于刻画实例所依据的日历版本。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      range: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
      characteristics:
        - functional
    occurrenceFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/occurrenceFacility
      namespace: fin-market-structure
      localName: occurrenceFacility
      label: Occurrence Facility
      definition: Occurrence Facility, is a functional relation that associates a session occurrence with the exact TradingFacility version whose interval it controls, used to bind a tradable time window to a concrete venue version.
      cnNote: 实例设施关系，是将某一交易时段实例关联到其时段所控制的确切交易设施版本的功能性关系，用于把可交易时间窗绑定到具体场所版本。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    exceptionOccurrence:
      iri: https://axiolune.ai/ontology/finance/market-structure/exceptionOccurrence
      namespace: fin-market-structure
      localName: exceptionOccurrence
      label: Exception Occurrence
      definition: Exception Occurrence, is a functional relation that associates a calendar exception with the exact session occurrence it deterministically alters, used to attach an exception fact to the affected session occurrence.
      cnNote: 例外实例关系，是将某一交易日历例外关联到其确定性地修改的确切交易时段实例的功能性关系，用于把例外事实挂接到被影响的时段实例。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingCalendarException
      range: https://axiolune.ai/ontology/finance/market-structure/TradingSessionOccurrence
      characteristics:
        - functional
    otcSourceProvider:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcSourceProvider
      namespace: fin-market-structure
      localName: otcSourceProvider
      label: OTC Source Provider
      definition: OTC Source Provider, is a functional relation that associates an OTC trading context with its exact source-provider Party version, used to characterize the data-source attribution of an over-the-counter context. Deprecated as of v1.1.0 with OTCTradingContext; provider attribution for the stable context is the logical nonVenueContextProvider, and the source contract moves to Layer 4.
      cnNote: 场外数据源提供方关系，是将某一场外交易上下文关联到其确切数据源提供方参与方版本的功能性关系，用于刻画场外语境的数据来源归属。自 v1.1.0 起随 OTCTradingContext 弃用；稳定上下文的提供方归属为逻辑 nonVenueContextProvider，源契约归 Layer 4。
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    otcQuoteCurrency:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcQuoteCurrency
      namespace: fin-market-structure
      localName: otcQuoteCurrency
      label: OTC Quote Currency
      definition: OTC Quote Currency, is a functional relation that associates an OTC trading context with its unique quote Currency logical identity, used to characterize the pricing currency of over-the-counter quotes. Deprecated as of v1.1.0 with OTCTradingContext; quote currency and quotation convention belong to instruments.
      cnNote: 场外报价货币关系，是将某一场外交易上下文关联到其唯一报价货币逻辑身份的功能性关系，用于刻画场外报价的计价货币。自 v1.1.0 起随 OTCTradingContext 弃用；报价币种与报价约定归 instruments。
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    otcSettlementCurrency:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcSettlementCurrency
      namespace: fin-market-structure
      localName: otcSettlementCurrency
      label: OTC Settlement Currency
      definition: OTC Settlement Currency, is a functional relation that associates an OTC trading context with its optional settlement Currency logical identity, used to characterize the settlement currency of over-the-counter executions. Deprecated as of v1.1.0 with OTCTradingContext; settlement currency belongs to instruments or post-trade-operations.
      cnNote: 场外结算货币关系，是将某一场外交易上下文关联到其可选结算货币逻辑身份的功能性关系，用于刻画场外成交的结算货币。自 v1.1.0 起随 OTCTradingContext 弃用；结算币种归 instruments 或 post-trade-operations。
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Currency
      characteristics:
        - functional
    otcReportingFacility:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcReportingFacility
      namespace: fin-market-structure
      localName: otcReportingFacility
      label: OTC Reporting Facility
      definition: OTC Reporting Facility, is a functional relation that associates an OTC trading context with its optional exact reporting-facility version, used to characterize the reporting venue on which an over-the-counter context relies. Deprecated as of v1.1.0 with OTCTradingContext; reporting obligation belongs to orders-execution or post-trade-operations.
      cnNote: 场外报告设施关系，是将某一场外交易上下文关联到其可选确切报告设施版本的功能性关系，用于刻画场外语境所挂靠的报告场所。自 v1.1.0 起随 OTCTradingContext 弃用；报告义务归 orders-execution 或 post-trade-operations。
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      characteristics:
        - functional
    otcCounterpartyA:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyA
      namespace: fin-market-structure
      localName: otcCounterpartyA
      label: OTC Counterparty A
      definition: OTC Counterparty A, is a functional relation that associates an OTC trading context with the lexically first exact Party version in its optional counterparty pair, used to record one party of an over-the-counter execution in canonical form. Deprecated as of v1.1.0 with OTCTradingContext; counterparty semantics belong to orders-execution or post-trade-operations.
      cnNote: 场外对手方甲关系，是将某一场外交易上下文关联到其可选对手方对中按词典序居首的确切参与方版本的功能性关系，用于规范化记录场外成交的一方。自 v1.1.0 起随 OTCTradingContext 弃用；对手方语义归 orders-execution 或 post-trade-operations。
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    otcCounterpartyB:
      iri: https://axiolune.ai/ontology/finance/market-structure/otcCounterpartyB
      namespace: fin-market-structure
      localName: otcCounterpartyB
      label: OTC Counterparty B
      definition: OTC Counterparty B, is a functional relation that associates an OTC trading context with the lexically second exact Party version in its optional counterparty pair, used to record the other party of an over-the-counter execution in canonical form. This relation is deprecated as of v1.1.0 together with OTCTradingContext; counterparty semantics belong to orders-execution or post-trade-operations.
      cnNote: 场外对手方乙关系，是将某一场外交易上下文关联到其可选对手方对中按词典序居次的确切参与方版本的功能性关系，用于规范化记录场外成交的另一方。该关系自 v1.1.0 起随 OTCTradingContext 一并弃用；对手方语义归 orders-execution 或 post-trade-operations。
      domain: https://axiolune.ai/ontology/finance/market-structure/OTCTradingContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    operatedBy:
      iri: https://axiolune.ai/ontology/finance/market-structure/operatedBy
      namespace: fin-market-structure
      localName: operatedBy
      label: Operated By
      definition: Operated By, is a functional relation that associates a TradingVenue with the logical Party identity that operates it, used to separate the market system/venue from its operator. The temporal validity and regulatory category of the operation are carried by VenueOperation; this relation is the logical-reference projection of the currently active operator.
      cnNote: 运营方关系，是将某一交易场所关联到运营它的逻辑参与方身份的功能性关系，用于将市场系统/场所与运营方分离。运营的时间有效性与监管类别由 VenueOperation 承载；该关系是当前生效运营方的逻辑引用投影。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
    venueRegulatoryClassification:
      iri: https://axiolune.ai/ontology/finance/market-structure/venueRegulatoryClassification
      namespace: fin-market-structure
      localName: venueRegulatoryClassification
      label: Venue Regulatory Classification
      definition: Venue Regulatory Classification, is a functional relation that associates a TradingVenue with its regulatory venue category (regulated market, multilateral trading facility, organized trading facility, or comparable category), used to model regulatory categorization as a temporal evidenced fact rather than a hardcoded global supertree. The temporal validity is carried by VenueOperation.
      cnNote: 场所监管分类关系，是将某一交易场所关联到其监管场所类别（受监管市场、多边交易设施、有组织交易设施或可比类别）的功能性关系，用于将监管分类建模为带时间与证据的事实而非硬编码全局超类树。时间有效性由 VenueOperation 承载。
      domain: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
      range: https://axiolune.ai/ontology/finance/market-structure/VenueCategory
      characteristics:
        - functional
    componentOf:
      iri: https://axiolune.ai/ontology/finance/market-structure/componentOf
      namespace: fin-market-structure
      localName: componentOf
      label: Component Of
      definition: Component Of, is a functional relation that associates a MarketInfrastructureComponent with the unique operating market infrastructure entity it is a section or component of, used to carry the ISO 10383 "section" part-of semantics independently of any facility supertype shared for reference range.
      cnNote: 组成归属关系，是将某一市场基础设施组成部分关联到其所构成板块或组成部分所属的唯一运营中市场基础设施实体的功能性关系，用于独立于任何为参照范围共享的设施超类来承载 ISO 10383 "section" 归属语义。
      domain: https://axiolune.ai/ontology/finance/market-structure/MarketInfrastructureComponent
      range: https://axiolune.ai/ontology/finance/market-structure/MICIdentifiedMarketInfrastructure
      characteristics:
        - functional
    micReplacedBy:
      iri: https://axiolune.ai/ontology/finance/market-structure/micReplacedBy
      namespace: fin-market-structure
      localName: micReplacedBy
      label: MIC Replaced By
      definition: MIC Replaced By, is a functional relation that associates a MIC registry entry with the MIC registry entry that replaces it when the entry has been superseded, used to model the ISO 10383 replacement chain as a logical reference.
      cnNote: MIC 替换关系，是将某一 MIC 注册条目关联到在其被取代后替换它的 MIC 注册条目的功能性关系，用于将 ISO 10383 替换链建模为逻辑引用。
      domain: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      range: https://axiolune.ai/ontology/finance/market-structure/MICRegistryEntry
      characteristics:
        - functional
    nonVenueContextConvention:
      iri: https://axiolune.ai/ontology/finance/market-structure/nonVenueContextConvention
      namespace: fin-market-structure
      localName: nonVenueContextConvention
      label: Non-Venue Context Convention
      definition: Non-Venue Context Convention, is a functional relation that associates a NonVenueMarketContext with its market-convention orientation, used to characterize the quoting orientation of a stable non-venue market context without carrying concrete currencies or execution semantics.
      cnNote: 非场所上下文约定关系，是将某一非场所市场上下文关联到其市场约定取向的功能性关系，用于刻画稳定非场所市场上下文的报价取向而不承载具体币种或成交语义。
      domain: https://axiolune.ai/ontology/finance/market-structure/NonVenueMarketContext
      range: https://axiolune.ai/ontology/finance/market-structure/MarketConvention
      characteristics:
        - functional
    nonVenueContextProvider:
      iri: https://axiolune.ai/ontology/finance/market-structure/nonVenueContextProvider
      namespace: fin-market-structure
      localName: nonVenueContextProvider
      label: Non-Venue Context Provider
      definition: Non-Venue Context Provider, is a functional relation that associates a NonVenueMarketContext with the logical Party identity of its provider, used to characterize the data-source attribution of a stable non-venue context as a logical reference rather than an exact-version source contract.
      cnNote: 非场所上下文提供方关系，是将某一非场所市场上下文关联到其提供方的逻辑参与方身份的功能性关系，用于将稳定非场所上下文的数据来源归属刻画为逻辑引用而非确切版本源契约。
      domain: https://axiolune.ai/ontology/finance/market-structure/NonVenueMarketContext
      range: https://axiolune.ai/ontology/finance/foundation/Party
      characteristics:
        - functional
  attributeTypes:
    micEntryType:
      iri: https://axiolune.ai/ontology/finance/market-structure/micEntryType
      namespace: fin-market-structure
      localName: micEntryType
      label: MIC Entry Type
      definition: MIC Entry Type, is a closed classification attribute carried by one MIC registry entry, used to distinguish whether the entry is an operating-level or segment-level registry record.
      cnNote: MIC 条目类型，是某一 MIC 注册条目携带的封闭分类属性，用于区分该条目是运营级还是板块级注册记录。
      valueType: https://axiolune.ai/ontology/finance/market-structure/MICEntryType
      defaultCardinality:
        minCount: 1
        maxCount: 1
    authorityCalendarId:
      iri: https://axiolune.ai/ontology/finance/market-structure/authorityCalendarId
      namespace: fin-market-structure
      localName: authorityCalendarId
      label: Authority Calendar Identifier
      definition: Authority Calendar Identifier, is a non-empty NFC string identifier assigned to a trading calendar by its maintaining authority, used to uniquely denote that calendar within the scope of (authority, facility). The calendar logical key is the three-component (calendarFacility, calendarAuthority, authorityCalendarId) per TradingCalendarIdentityContract, so the identifier is unique within each authority-and-facility pair, not within the authority alone.
      cnNote: 权威日历标识符，是由维护权威分配给某一交易日历的非空 NFC 字符串标识，用于在（权威，设施）范围内唯一指代该日历。日历逻辑键为三分量（calendarFacility、calendarAuthority、authorityCalendarId），见 TradingCalendarIdentityContract，因此该标识在每个权威与设施配对范围内唯一，而非仅在权威范围内唯一。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    ianaTimeZone:
      iri: https://axiolune.ai/ontology/finance/market-structure/ianaTimeZone
      namespace: fin-market-structure
      localName: ianaTimeZone
      label: IANA Time Zone
      definition: IANA Time Zone, is a canonical IANA time-zone identifier, used to interpret the local-clock sessions of a trading calendar and anchor local sessions to a specific geographical time zone.
      cnNote: IANA 时区，是用于解释交易日历本地时钟时段的规范 IANA 时区标识符，用于把本地时段锚定到具体地理时区。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^[A-Za-z_+-]+(?:/[A-Za-z0-9_+-]+)+$
    sessionRecurrence:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionRecurrence
      namespace: fin-market-structure
      localName: sessionRecurrence
      label: Session Recurrence
      definition: Session Recurrence, is a deterministic recurrence expression, used to select the business dates to which a session template applies and bind a session specification to a concrete set of dates. Deprecated as of v1.1.0 in favor of the formal recurrenceRule attribute which is bounded and materializable; retained for compatibility.
      cnNote: 时段复发规则，是确定性地选取某一时段模板所适用营业日期的复发表达式，用于把时段规范与具体日期集合挂钩。自 v1.1.0 起弃用，改用有界且可物化的形式化 recurrenceRule 属性；为兼容性保留。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    localSessionStart:
      iri: https://axiolune.ai/ontology/finance/market-structure/localSessionStart
      namespace: fin-market-structure
      localName: localSessionStart
      label: Local Session Start
      definition: Local Session Start, is the ISO local-clock time at which a recurring session interval begins, used to define the opening of a trading session in local time.
      cnNote: 本地时段开始，是某一重复时段区间开始的 ISO 本地时钟时刻，用于以本地时间定义交易时段的开端。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$
    localSessionEnd:
      iri: https://axiolune.ai/ontology/finance/market-structure/localSessionEnd
      namespace: fin-market-structure
      localName: localSessionEnd
      label: Local Session End
      definition: Local Session End, is the ISO local-clock time at which a recurring half-open session interval ends, used to define the closing of a trading session in local time.
      cnNote: 本地时段结束，是某一重复半开时段区间结束的 ISO 本地时钟时刻，用于以本地时间定义交易时段的收尾。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$
    sessionBusinessDate:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionBusinessDate
      namespace: fin-market-structure
      localName: sessionBusinessDate
      label: Session Business Date
      definition: Session Business Date, is the local calendar date to which a concrete trading-session occurrence belongs, used to assign an occurrence to a business day.
      cnNote: 时段营业日期，是某一具体交易时段实例所属的本地日历日期，用于把时段实例归属到一个营业日。
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sessionStartUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionStartUtc
      namespace: fin-market-structure
      localName: sessionStartUtc
      label: Session Start UTC
      definition: Session Start UTC, is the inclusive UTC instant at which a concrete trading-session occurrence starts, used to bound the start of a trading session in absolute time.
      cnNote: 时段 UTC 开始，是某一具体交易时段实例开始时刻的含端 UTC 瞬时，用于以绝对时间界定交易时段起点。
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sessionEndUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/sessionEndUtc
      namespace: fin-market-structure
      localName: sessionEndUtc
      label: Session End UTC
      definition: Session End UTC, is the exclusive UTC instant at which a concrete trading-session occurrence ends, used to bound the end of a trading session in absolute time.
      cnNote: 时段 UTC 结束，是某一具体交易时段实例结束时刻的不含端 UTC 瞬时，用于以绝对时间界定交易时段终点。
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    calendarExceptionKind:
      iri: https://axiolune.ai/ontology/finance/market-structure/calendarExceptionKind
      namespace: fin-market-structure
      localName: calendarExceptionKind
      label: Calendar Exception Kind
      definition: Calendar Exception Kind, is a closed classification attribute of a calendar exception, used to distinguish holidays, closures, early closings, late openings, and similar exceptional circumstances.
      cnNote: 日历例外类型，是对某一日历例外的封闭分类属性，用于区分节假日、临时停市、提前收盘或延后开盘等例外情形。
      valueType: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind
      defaultCardinality:
        minCount: 1
        maxCount: 1
    exceptionBusinessDate:
      iri: https://axiolune.ai/ontology/finance/market-structure/exceptionBusinessDate
      namespace: fin-market-structure
      localName: exceptionBusinessDate
      label: Exception Business Date
      definition: Exception Business Date, is the local business date on which a trading-calendar exception applies, used to attach an exception fact to a specific date.
      cnNote: 例外营业日期，是某一交易日历例外所作用的本地营业日期，用于把例外事实挂接到具体日期。
      valueType: date
      defaultCardinality:
        minCount: 1
        maxCount: 1
    replacementSessionStartUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/replacementSessionStartUtc
      namespace: fin-market-structure
      localName: replacementSessionStartUtc
      label: Replacement Session Start UTC
      definition: Replacement Session Start UTC, is an optional inclusive replacement start instant supplied by an early or late session exception, used to override the opening instant of the original session occurrence.
      cnNote: 替换时段 UTC 开始，是由提前或延后开盘例外提供的可选含端替换开始瞬时，用于覆盖原时段实例的开盘时刻。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    replacementSessionEndUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/replacementSessionEndUtc
      namespace: fin-market-structure
      localName: replacementSessionEndUtc
      label: Replacement Session End UTC
      definition: Replacement Session End UTC, is an optional exclusive replacement end instant supplied by an early closing exception, used to override the closing instant of the original session occurrence.
      cnNote: 替换时段 UTC 结束，是由提前收盘例外提供的可选不含端替换结束瞬时，用于覆盖原时段实例的收盘时刻。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    providerContextId:
      iri: https://axiolune.ai/ontology/finance/market-structure/providerContextId
      namespace: fin-market-structure
      localName: providerContextId
      label: Provider Context Identifier
      definition: Provider Context Identifier, is a non-empty NFC business identifier scoped by one source provider and its immutable source contract, used to uniquely denote a context within an over-the-counter setting.
      cnNote: 提供方上下文标识，是由某一数据源提供方与不可变源契约共同作用域的非空 NFC 业务标识，用于在场外语境中唯一指代一个上下文。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    marketConvention:
      iri: https://axiolune.ai/ontology/finance/market-structure/marketConvention
      namespace: fin-market-structure
      localName: marketConvention
      label: Market Convention
      definition: Market Convention, is a reviewed convention member, used to fix the orientation and application semantics of one OTC context and characterize the pricing and unit orientation of over-the-counter quotes.
      cnNote: 市场约定，是用于确定某一场外上下文报价方向与应用语义的经审核约定成员，用于刻画场外报价的计价与单位取向。
      valueType: https://axiolune.ai/ontology/finance/market-structure/MarketConvention
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceContractRef:
      iri: https://axiolune.ai/ontology/finance/market-structure/sourceContractRef
      namespace: fin-market-structure
      localName: sourceContractRef
      label: Source Contract Reference
      definition: Source Contract Reference, is the absolute IRI of the immutable provider schema or contract that defines the extraction of the provider context identifier, used to anchor the data-contract source of an over-the-counter context. Deprecated as of v1.1.0 with OTCTradingContext; the source contract belongs to Layer 4 SemanticMappingDefinition.
      cnNote: 源契约引用，是定义提供方上下文标识抽取规则的不可变提供方模式或契约的绝对 IRI，用于锚定场外语境的数据契约来源。自 v1.1.0 起随 OTCTradingContext 弃用；源契约归 Layer 4 SemanticMappingDefinition。
      valueType: uri
      defaultCardinality:
        minCount: 1
        maxCount: 1
    sourceContractDigest:
      iri: https://axiolune.ai/ontology/finance/market-structure/sourceContractDigest
      namespace: fin-market-structure
      localName: sourceContractDigest
      label: Source Contract Digest
      definition: Source Contract Digest, is a lowercase SHA-256 digest, used to authenticate the exact bytes of the referenced source contract and verify that the contract content has not been tampered with. Deprecated as of v1.1.0 with OTCTradingContext; source-contract authentication belongs to Layer 4.
      cnNote: 源契约摘要，是认证所引用源契约确切字节的小写 SHA-256 摘要，用于校验源契约内容未被篡改。自 v1.1.0 起随 OTCTradingContext 弃用；源契约鉴权归 Layer 4。
      valueType: string
      defaultCardinality:
        minCount: 1
        maxCount: 1
      pattern: ^sha256:[0-9a-f]{64}$
    venueCategory:
      iri: https://axiolune.ai/ontology/finance/market-structure/venueCategory
      namespace: fin-market-structure
      localName: venueCategory
      label: Venue Category
      definition: Venue Category, is a closed classification attribute carried by a VenueOperation, used to record the regulatory category of a trading venue (regulated market, multilateral trading facility, organized trading facility, or comparable category) as a temporal evidenced fact.
      cnNote: 场所类别，是某一 VenueOperation 携带的封闭分类属性，用于将交易场所的监管类别（受监管市场、多边交易设施、有组织交易设施或可比类别）记录为带时间与证据的事实。
      valueType: https://axiolune.ai/ontology/finance/market-structure/VenueCategory
      defaultCardinality:
        minCount: 0
        maxCount: 1
    venueOperationValidFrom:
      iri: https://axiolune.ai/ontology/finance/market-structure/venueOperationValidFrom
      namespace: fin-market-structure
      localName: venueOperationValidFrom
      label: Venue Operation Valid From
      definition: Venue Operation Valid From, is the inclusive instant from which a VenueOperation is valid, used to bound the operator history of a trading venue.
      cnNote: 场所运营生效起始，是某一 VenueOperation 生效的含端瞬时，用于界定交易场所运营方历史的起点。
      valueType: instant
      defaultCardinality:
        minCount: 1
        maxCount: 1
    venueOperationValidTo:
      iri: https://axiolune.ai/ontology/finance/market-structure/venueOperationValidTo
      namespace: fin-market-structure
      localName: venueOperationValidTo
      label: Venue Operation Valid To
      definition: Venue Operation Valid To, is the exclusive instant at which a VenueOperation ends, used to bound the operator history of a trading venue.
      cnNote: 场所运营生效结束，是某一 VenueOperation 结束的不含端瞬时，用于界定交易场所运营方历史的终点。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    authoritySessionId:
      iri: https://axiolune.ai/ontology/finance/market-structure/authoritySessionId
      namespace: fin-market-structure
      localName: authoritySessionId
      label: Authority Session Identifier
      definition: Authority Session Identifier, is a non-empty NFC string identifier assigned to a session template by its maintaining authority, used to uniquely denote that session within the authority-and-calendar scope.
      cnNote: 权威时段标识符，是由维护权威分配给某一时段模板的非空 NFC 字符串标识，用于在权威与日历范围内唯一指代该时段。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^\S(?:.*\S)?$
    scheduledTradingPhase:
      iri: https://axiolune.ai/ontology/finance/market-structure/scheduledTradingPhase
      namespace: fin-market-structure
      localName: scheduledTradingPhase
      label: Scheduled Trading Phase
      definition: Scheduled Trading Phase, is a closed classification attribute carried by a session template, used to distinguish preOpen, openingAuction, continuousTrading, closingAuction, postClose, maintenance, and reportingOnly phases of a trading session.
      cnNote: 计划交易阶段，是某一时段模板携带的封闭分类属性，用于区分交易时段的 preOpen、openingAuction、continuousTrading、closingAuction、postClose、maintenance 与 reportingOnly 阶段。
      valueType: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase
      defaultCardinality:
        minCount: 0
        maxCount: 1
    endDayOffset:
      iri: https://axiolune.ai/ontology/finance/market-structure/endDayOffset
      namespace: fin-market-structure
      localName: endDayOffset
      label: End Day Offset
      definition: End Day Offset, is a signed integer day offset between the local start date and the local end date of a session, used to model cross-midnight sessions where the end falls on a later calendar day than the start.
      cnNote: 结束日期偏移，是某一时段本地开始日期与本地结束日期之间的有符号整数日偏移，用于建模结束日期晚于开始日期的跨午夜时段。
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: 1
    recurrenceRule:
      iri: https://axiolune.ai/ontology/finance/market-structure/recurrenceRule
      namespace: fin-market-structure
      localName: recurrenceRule
      label: Recurrence Rule
      definition: Recurrence Rule, is a bounded RFC 5545 RRULE-style recurrence expression that selects the business dates to which a session template applies, used to deterministically materialize occurrences under the calendar's IANA time zone. This attribute is the formal, materializable companion to the retained sessionRecurrence string.
      cnNote: 复发规则，是选取某一时段模板所适用营业日的有界 RFC 5545 RRULE 风格复发表达式，用于在日历 IANA 时区下确定性物化实例。该属性是保留的 sessionRecurrence 字符串的形式化、可物化伴随项。
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: 1
      pattern: ^RRULE:.*$
    effectiveSessionStartUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/effectiveSessionStartUtc
      namespace: fin-market-structure
      localName: effectiveSessionStartUtc
      label: Effective Session Start UTC
      definition: Effective Session Start UTC, is an optional inclusive UTC instant at which a session occurrence becomes effectively tradable after applying any TradingScheduleOverrideNotice facts, used to separate the scheduled window from the effective tradable interval. When absent and no cancellation applies, the effective interval equals the scheduled interval.
      cnNote: 有效时段 UTC 开始，是某一时段实例在应用任意 TradingScheduleOverrideNotice 事实后实际可交易的含端 UTC 瞬时，用于将计划窗口与有效可交易区间分离。当其缺席且未发生取消时，有效区间等于计划区间。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    effectiveSessionEndUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/effectiveSessionEndUtc
      namespace: fin-market-structure
      localName: effectiveSessionEndUtc
      label: Effective Session End UTC
      definition: Effective Session End UTC, is an optional exclusive UTC instant at which a session occurrence stops being effectively tradable after applying any TradingScheduleOverrideNotice facts, used to separate the scheduled window from the effective tradable interval.
      cnNote: 有效时段 UTC 结束，是某一时段实例在应用任意 TradingScheduleOverrideNotice 事实后停止实际可交易的不含端 UTC 瞬时，用于将计划窗口与有效可交易区间分离。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    overrideAnnouncementOrder:
      iri: https://axiolune.ai/ontology/finance/market-structure/overrideAnnouncementOrder
      namespace: fin-market-structure
      localName: overrideAnnouncementOrder
      label: Override Announcement Order
      definition: Override Announcement Order, is a non-negative integer recording the publication order of a TradingScheduleOverrideNotice within its calendar and facility scope, used to sequence notices by their announcement time.
      cnNote: 变更公告顺序，是记录某一 TradingScheduleOverrideNotice 在其日历与设施范围内发布顺序的非负整数，用于按公告时间排列公告。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    overrideSupersessionOrder:
      iri: https://axiolune.ai/ontology/finance/market-structure/overrideSupersessionOrder
      namespace: fin-market-structure
      localName: overrideSupersessionOrder
      label: Override Supersession Order
      definition: Override Supersession Order, is a non-negative integer recording the precedence of a TradingScheduleOverrideNotice when multiple notices affect the same occurrence, used together with the announcement order to synthesize a single final effective interval or cancellation.
      cnNote: 变更覆盖顺序，是当多个公告影响同一时段实例时记录某一 TradingScheduleOverrideNotice 优先级的非负整数，与公告顺序共同用于合成单一最终有效区间或取消结果。
      valueType: integer
      defaultCardinality:
        minCount: 1
        maxCount: 1
    overrideReplacementStartUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/overrideReplacementStartUtc
      namespace: fin-market-structure
      localName: overrideReplacementStartUtc
      label: Override Replacement Start UTC
      definition: Override Replacement Start UTC, is an optional inclusive replacement start instant supplied by a TradingScheduleOverrideNotice, used to override the opening instant of the affected scheduled occurrence when synthesizing the effective interval.
      cnNote: 变更替换 UTC 开始，是由某一 TradingScheduleOverrideNotice 提供的可选含端替换开始瞬时，用于在合成有效区间时覆盖受影响计划实例的开盘时刻。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    overrideReplacementEndUtc:
      iri: https://axiolune.ai/ontology/finance/market-structure/overrideReplacementEndUtc
      namespace: fin-market-structure
      localName: overrideReplacementEndUtc
      label: Override Replacement End UTC
      definition: Override Replacement End UTC, is an optional exclusive replacement end instant supplied by a TradingScheduleOverrideNotice, used to override the closing instant of the affected scheduled occurrence when synthesizing the effective interval.
      cnNote: 变更替换 UTC 结束，是由某一 TradingScheduleOverrideNotice 提供的可选不含端替换结束瞬时，用于在合成有效区间时覆盖受影响计划实例的收盘时刻。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    micOperationalStatus:
      iri: https://axiolune.ai/ontology/finance/market-structure/micOperationalStatus
      namespace: fin-market-structure
      localName: micOperationalStatus
      label: MIC Operational Status
      definition: MIC Operational Status, is a closed classification attribute carried by a MIC registry entry, used to record the ISO 10383 lifecycle status (active, updated, expired) of the entry.
      cnNote: MIC 运营状态，是某一 MIC 注册条目携带的封闭分类属性，用于记录该条目的 ISO 10383 生命周期状态（active、updated、expired）。
      valueType: https://axiolune.ai/ontology/finance/market-structure/MICOperationalStatus
      defaultCardinality:
        minCount: 0
        maxCount: 1
    micEffectiveFrom:
      iri: https://axiolune.ai/ontology/finance/market-structure/micEffectiveFrom
      namespace: fin-market-structure
      localName: micEffectiveFrom
      label: MIC Effective From
      definition: MIC Effective From, is the optional inclusive instant from which a MIC registry entry is effective per ISO 10383, used to record the entry lifecycle.
      cnNote: MIC 生效起始，是某一 MIC 注册条目按 ISO 10383 生效的可选含端瞬时，用于记录条目生命周期。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    micEffectiveTo:
      iri: https://axiolune.ai/ontology/finance/market-structure/micEffectiveTo
      namespace: fin-market-structure
      localName: micEffectiveTo
      label: MIC Effective To
      definition: MIC Effective To, is the optional exclusive instant at which a MIC registry entry expires per ISO 10383, used to record the entry lifecycle.
      cnNote: MIC 生效结束，是某一 MIC 注册条目按 ISO 10383 到期的可选不含端瞬时，用于记录条目生命周期。
      valueType: instant
      defaultCardinality:
        minCount: 0
        maxCount: 1
    marketCategory:
      iri: https://axiolune.ai/ontology/finance/market-structure/marketCategory
      namespace: fin-market-structure
      localName: marketCategory
      label: MIC Market Category
      definition: MIC Market Category, is a closed classification attribute carried by a MIC registry entry, used to record the ISO 10383 market category of the identified infrastructure.
      cnNote: MIC 市场类别，是某一 MIC 注册条目携带的封闭分类属性，用于记录所标识基础设施的 ISO 10383 市场类别。
      valueType: https://axiolune.ai/ontology/finance/market-structure/MICMarketCategory
      defaultCardinality:
        minCount: 0
        maxCount: 1
    tzdbRelease:
      iri: https://axiolune.ai/ontology/finance/market-structure/tzdbRelease
      namespace: fin-market-structure
      localName: tzdbRelease
      label: IANA tzdb Release
      definition: IANA tzdb Release, is an optional versioned IANA time-zone database release identifier, used to pin the tzdb revision under which a trading calendar's local-clock sessions are materialized to UTC for deterministic replay.
      cnNote: IANA tzdb 发行版本，是可选的版本化 IANA 时区数据库发行标识，用于锁定交易日历本地时钟时段物化为 UTC 所依据的 tzdb 修订以支持确定性回放。
      valueType: string
      defaultCardinality:
        minCount: 0
