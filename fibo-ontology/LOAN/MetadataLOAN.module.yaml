  label: Metadata for the FIBO Loans (LOAN) Domain
  definition: The FIBO Loan domain defines concepts that are common to loans in various market categories including but not
    limited to commercial, small business, automobile, education and mortgage. High-level concepts relevant to loan contracts
    include the obligations of parties playing different roles, credit and risk, security agreements as well as additional
    detail for HMDA-specific loans. Details defining debt instruments in general are covered in a separate debt module in
    the Securities domain.
