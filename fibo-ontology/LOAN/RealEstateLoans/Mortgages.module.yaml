domain:
  objectTypes:
    ClosedEndMortgageLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/ClosedEndMortgageLoan
      namespace: fibo-loan-reamor
      localName: ClosedEndMortgageLoan
      label: closed-end mortgage loan
      definition: loan secured by real estate with no ability for the borrower to receive additional funds under the loan
        at a later date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/ClosedEndCredit
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/LoanSecuredByRealEstate
      attributeUses: []
      patternBindings: []
    ClosedEndReverseMortgage:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/ClosedEndReverseMortgage
      namespace: fibo-loan-reamor
      localName: ClosedEndReverseMortgage
      label: closed-end reverse mortgage
      definition: reverse mortgage that provides a lump sum payment to the borrower at closing, with no ability for the borrower
        to receive additional funds under the mortgage at a later date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/ClosedEndMortgageLoan
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/ReverseMortgageLoan
      attributeUses: []
      patternBindings: []
    LoanSecuredByRealEstate:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/LoanSecuredByRealEstate
      namespace: fibo-loan-reamor
      localName: LoanSecuredByRealEstate
      label: loan secured by real estate
      definition: loan that, at origination, is secured wholly or substantially by a lien or liens on real property for which
        the lien or liens are central to the extension of the credit - that is, the borrower would not have been extended
        credit in the same amount or on terms as favorable without the lien or liens on real property
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/CollateralizedLoan
      attributeUses: []
      patternBindings: []
    Mortgage:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/Mortgage
      namespace: fibo-loan-reamor
      localName: Mortgage
      label: mortgage
      definition: grant of financial interest in real property to a party that is not an owner of that real property and is
        recorded by a registration authority
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/SecurityAgreement
      attributeUses: []
      patternBindings: []
    OpenEndMortgageLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/OpenEndMortgageLoan
      namespace: fibo-loan-reamor
      localName: OpenEndMortgageLoan
      label: open-end mortgage loan
      definition: loan secured by real estate with a provision that the outstanding loan amount may be increased upon mutual
        agreement of the lender and the borrower
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/OpenEndCredit
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/LoanSecuredByRealEstate
      attributeUses: []
      patternBindings: []
    OpenEndReverseMortgage:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/OpenEndReverseMortgage
      namespace: fibo-loan-reamor
      localName: OpenEndReverseMortgage
      label: open-end reverse mortgage
      definition: reverse mortgage structured like a home equity line of credit in that it provides the borrower with additional
        funds after closing (either as fixed monthly payments, under a line of credit, or both)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/OpenEndMortgageLoan
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/ReverseMortgageLoan
      attributeUses: []
      patternBindings: []
    ReverseMortgageLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/ReverseMortgageLoan
      namespace: fibo-loan-reamor
      localName: ReverseMortgageLoan
      label: reverse mortgage loan
      definition: loan secured by real estate that pays money to the borrower against a set principal limit based on the value
        of existing equity in the underlying collateral
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/LoanSecuredByRealEstate
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasInitialFundingDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/hasInitialFundingDate
      namespace: fibo-loan-reamor
      localName: hasInitialFundingDate
      label: has initial funding date
      definition: relates a mortgage to the date on which the contract is consummated, officially creating the obligations
        therein
      domain: ''
      range: ''
      inverseOf: ''
      characteristics: []
  attributeTypes:
    isARMConvertible:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/isARMConvertible
      namespace: fibo-loan-reamor
      localName: isARMConvertible
      label: is ARM convertible
      definition: indicates whether or not the loan can be converted into an adjustable-rate mortgage contract (ARM)
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
