  label: Home Mortgage Disclosure Act (HMDA) Covered Mortgages Ontology
  definition: This ontology defines concepts specific to mortgages that are covered by the Home Mortgage Disclosure Act (HMDA)
    and related regulations. This includes the concept of a HMDA report as well as specializations of the core classes for
    pre-approval requests, covered loan contracts.
