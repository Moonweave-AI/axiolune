domain:
  objectTypes:
    ConsumerLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/ConsumerLoan
      namespace: fibo-loan-loacon
      localName: ConsumerLoan
      label: consumer loan
      definition: loan to one or more individuals for household, family, or other personal expenditures, excluding mortgages
        and student loans
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/Loan
      attributeUses: []
      patternBindings: []
    HomeEquityLineOfCredit:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/HomeEquityLineOfCredit
      namespace: fibo-loan-loacon
      localName: HomeEquityLineOfCredit
      label: home equity line of credit
      definition: line of credit granted to a homeowner secured by the equity value in a borrower's home or other property
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/RevolvingLineOfCredit
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/SecuredConsumerLoan
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/Mortgages/LoanSecuredByRealEstate
      attributeUses: []
      patternBindings: []
    MotorVehicleLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/MotorVehicleLoan
      namespace: fibo-loan-loacon
      localName: MotorVehicleLoan
      label: motor vehicle loan
      definition: collateralized, simple-interest loan that is repaid in monthly installments over a period of typically three
        to five years, for the purpose of purchasing a vehicle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/CollateralizedLoan
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/SecuredConsumerLoan
      attributeUses: []
      patternBindings: []
    SecuredConsumerLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/SecuredConsumerLoan
      namespace: fibo-loan-loacon
      localName: SecuredConsumerLoan
      label: secured consumer loan
      definition: loan to one or more individuals for household, family, or other personal expenditures in which the borrower
        pledges some asset via a security agreement as collateral for the loan, or that is secured via third-party guarantee
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/SecuredLoan
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/ConsumerLoan
      attributeUses: []
      patternBindings: []
    UnsecuredConsumerLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/UnsecuredConsumerLoan
      namespace: fibo-loan-loacon
      localName: UnsecuredConsumerLoan
      label: unsecured consumer loan
      definition: loan to one or more individuals for household, family, or other personal expenditures granted based on the
        strength of the borrower's credit history or reputation in the community
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/UnsecuredLoan
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/ConsumerLoan
      attributeUses: []
      patternBindings: []
