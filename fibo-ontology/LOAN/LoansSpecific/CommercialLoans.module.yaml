  label: Commercial Loans Ontology
  definition: Commercial loans are loans where the loan purpose is some commercial purpose. Note that these are distinguished
    by the loan purpose not by the borrower type - borrowers may be corporate or personal, though in the majority of cases
    they would also be corporate loans that is loans with a corporate borrower.
