      namespace: fibo-loan-loacar
      localName: DebitCardAccount
      label: debit card account
      definition: card account that is represented by a one or more debit cards
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/CardAccount
      attributeUses: []
      patternBindings: []
