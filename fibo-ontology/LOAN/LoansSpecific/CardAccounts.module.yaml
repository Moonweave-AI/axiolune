      namespace: fibo-loan-loacar
      localName: SmartCard
      label: smart card
      definition: payment card that has integrated circuits embedded within it
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/PaymentCard
      attributeUses: []
      patternBindings: []
    ThreeDigitVerificationCodeValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/ThreeDigitVerificationCodeValue
