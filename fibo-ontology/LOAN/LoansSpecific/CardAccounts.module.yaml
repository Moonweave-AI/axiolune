      namespace: fibo-loan-loacar
      localName: MagneticStripeVerificationCodeValue
      label: magnetic stripe verification code or value
      definition: card verification code on a card's magnetic stripe that uses secure cryptographic processes to protect data
        integrity on the stripe, and reveals any alteration or counterfeiting
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/CardVerificationCodeValue
      attributeUses: []
      patternBindings: []
    PaymentCard:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/PaymentCard
      namespace: fibo-loan-loacar
      localName: PaymentCard
      label: payment card
      definition: legal document issued by a financial services provider that enables the cardholder to access the funds in
        the customer's designated bank accounts, or through a credit account and make payments by electronic funds transfer
        and access automated teller machines (ATMs)
      superTypes:
      - https://www.omg.org/spec/Commons/Documents/LegalDocument
      attributeUses: []
      patternBindings: []
    PaymentCardAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/PaymentCardAgreement
      namespace: fibo-loan-loacar
      localName: PaymentCardAgreement
