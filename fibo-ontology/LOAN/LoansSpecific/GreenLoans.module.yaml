      - https://www.omg.org/spec/Commons/ContextualIdentifiers/ContextualIdentifier
      attributeUses: []
      patternBindings: []
    SustainabilityLinkedLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/SustainabilityLinkedLoan
      namespace: fibo-loan-loagre
      localName: SustainabilityLinkedLoan
      label: sustainability-linked loan
      definition: credit agreement and/or contingent facility (such as a bonding line, guarantee line or letter of credit)
        for which the economic characteristics can vary depending on whether the borrower achieves ambitious, material and
        quantifiable predetermined sustainability performance objectives aligned with Sustainability-Linked Loan Principles
        (SSLP)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidPeriodically
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CommercialLoans/CommercialLoan
      attributeUses: []
      patternBindings: []
    SustainabilityPerformanceTarget:
