      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/GreenLoan
      namespace: fibo-loan-loagre
      localName: GreenLoan
      label: green loan
      definition: credit agreement and/or contingent facility (such as a bonding line, guarantee line or letter of credit)
        made available exclusively to finance, re-finance or guarantee, in whole or in part, new and/or existing eligible
        green projects that are aligned to the four core components of the Green Loan Principles (GLP)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidPeriodically
      attributeUses: []
      patternBindings: []
    GreenProject:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/GreenProject
      namespace: fibo-loan-loagre
      localName: GreenProject
      label: green project
      definition: project that contributes to environmental sustainability by addressing climate change, conserving natural
        resources, reducing pollution, or promoting ecological balance
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/EnvironmentalProject
      attributeUses: []
      patternBindings: []
    GreenProjectUseOfProceedsProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/GreenProjectUseOfProceedsProvision
      namespace: fibo-loan-loagre
      localName: GreenProjectUseOfProceedsProvision
      label: green project use of proceeds provision
      definition: use of proceeds provision specifying that funds obtained through financing, such as through a credit agreement,
        offering, warrant, or other instrument are intended to be used for Green Projects (including other related and supporting
        expenditures, including research and development)
      superTypes:
