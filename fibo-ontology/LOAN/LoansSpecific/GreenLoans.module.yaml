      definition: project that supports broad, sector-specific efforts to reduce environmental impact
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/EnvironmentalProject
      attributeUses: []
      patternBindings: []
    TransitionStrategy:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/TransitionStrategy
      namespace: fibo-loan-loagre
      localName: TransitionStrategy
      label: transition strategy
      definition: strategy for achieving specific business objectives related to sustainability in the context of long-term
        decarbonization or sustainability transitions
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/BusinessStrategy
      attributeUses: []
      patternBindings: []
    TransitionUseOfProceedsProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/TransitionUseOfProceedsProvision
      namespace: fibo-loan-loagre
      localName: TransitionUseOfProceedsProvision
      label: transition use of proceeds provision
      definition: use of proceeds provision specifying that funds obtained through financing, such as through a credit agreement,
        offering, warrant, or other instrument are intended to be used to fund specific projects, investments, or operational
        changes that support a company's transition toward sustainability
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/UseOfProceedsProvision
      attributeUses: []
      patternBindings: []
