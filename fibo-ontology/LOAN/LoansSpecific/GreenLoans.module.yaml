  version: '20251201'
  label: Green Loans Ontology
  definition: The green loans ontology defines concepts specific to loans made available exclusively to finance or refinance,
    in whole or in part, new and/or existing eligible 'green projects'. Examples include loans whose purpose involves renewable
    energy, energy efficiency, climate change adaptation and green buildings that meet regional, national or internationally
    recognized standards or certifications.
