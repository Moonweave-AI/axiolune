      namespace: fibo-loan-loagre
      localName: SustainabilityPerformanceTarget
      label: sustainability performance target
      definition: collection of quantitative target values used to calibrate the level of achievement a borrower makes with
        respect to a key performance indicator, by date, including, but not limited to, the methodology used to calculate
        its value at any point over the lifetime of a loan
      superTypes:
