    TransitionLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/GreenLoans/TransitionLoan
      namespace: fibo-loan-loagre
      localName: TransitionLoan
      label: transition loan
      definition: credit agreement and/or contingent facility (such as a bonding line, guarantee line or letter of credit)
        designed to help a business or organization shift from carbon-intensive or environmentally harmful practices to more
        sustainable and environmentally friendly operations
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidPeriodically
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CommercialLoans/CommercialLoan
