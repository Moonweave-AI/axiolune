    ClosedEndCredit:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/ClosedEndCredit
      namespace: fibo-loan-loaloa
      localName: ClosedEndCredit
      label: closed-end credit
      definition: credit agreement in which the loan principal cannot be increased after funds are dispersed in full when
