      namespace: fibo-loan-loaloa
      localName: CollateralizedLoan
      label: collateralized loan
      definition: secured loan that is secured with cash or other acceptable collateral (real property, securities or other
        assets) provided by the borrower as specified in the collateral agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/SecuredLoan
      attributeUses: []
      patternBindings: []
    Comaker:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/Comaker
      namespace: fibo-loan-loaloa
      localName: Comaker
      label: co-maker
      definition: party that signs a borrower's promissory note, providing additional security and potentially improving the
        quality of the debt
      superTypes:
