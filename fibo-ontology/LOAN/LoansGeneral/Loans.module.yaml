      patternBindings: []
    UnsecuredLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/UnsecuredLoan
      namespace: fibo-loan-loaloa
      localName: UnsecuredLoan
