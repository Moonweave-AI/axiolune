    LoanDefaultProceeding:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoanEvents/LoanDefaultProceeding
      namespace: fibo-loan-loaloa
      localName: LoanDefaultProceeding
      label: loan default proceeding
      definition: '[no definition] Further Review This is typically part of mortgagte servicing. THere would typically be
        a whole department dealing with this. Dealing with default, helping borrowers make payment Collections Default admin
        Foreclosure Reselling All dealt with by several sub departments. This requires subject matter experts in this area.
        1. scoping Identify default as a possible state. This hands off to other business processes. Once you get into the
        default scenario we are talking about a proces that is going to fall into place over a period of time. The bank works
        out what to do with the default scenario, e.g. whether it restructures, forecloses, seeks restitution from the security
        (collateral). It does nto help us to understand the structure of the loan, rather tha consequences of the loan. If
        we were to further explore the default detail we would bring in other SMEs. And we would have to model a process flow.
        1.1 impact on the pool of an MBS Loan Default Proceeding (special ase of legal thing) is an aspect of Default Management
        / Administratoin. there is also the State of the Loan. Sale / something / fulfilment / fiunduing / approved = servicing
        mode. Something happens (non payment) =&gt; Default Grace Period followed by negotiation. Some threshold whereby after
        a given amount of delinquency it needs to go into some other process moving towards foreclosure. Do State Diagram.
        Stages of loan.'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoanEvents/LegalProceeding
      attributeUses: []
      patternBindings: []
