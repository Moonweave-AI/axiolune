      localName: DataProtectionRequirement
      label: data protection requirement
      definition: Requirements defining how data about individuals is held. Example is the EU DA directive and laws, which
        make the data the property of the individual that data is about. Covers - what information i sheld - who information
        can be divulged to. - the individual's rights in respect of that information Privacy regulations cover most of this.
        EU defines "Personal Data" and "Sensitive Personal Data". For credit reference agencies the latter would be covered.
        More detail about whether they can divulge facts which are not subject to formal judgements etc.
