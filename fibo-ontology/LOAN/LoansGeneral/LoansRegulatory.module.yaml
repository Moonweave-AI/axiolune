    LenderRight:
      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoansRegulatory/LenderRight
      namespace: fibo-loan-loaloa
      localName: LenderRight
      label: lender right
      definition: 'Rights on the lender to protect them against loss. furthe rNtoes: Logically, considering the two parties,
        they both have protecxtion mechanisms. so while the lender has protecxtion mechanisms through mortgage insurance,
        and the consumer has protextion mechanisms such as good faith estimates. also the agencies (see Consumer Protection
        Agency), an instance of which is the CFPB in the US (just set up). Lender rights are: - expressed in the Contract
        Consumer protection develops becaues the contract is written by the potential Lender. So the rights are introcued
        to rectify the imbalance between the two parties. Same goes for insurance. consumer protection laws (governe dby the
        relevant consumer protection agency. So the lender protexts itself as it writes th contract AND does the things it
        needs to do to protext itself, but on the approval process, and with later instruments such as insurance. Interestingly.,
        it is the Borrower who pays for this by paying for credit reports etc. So the borrower protects itself by other mechanisms.
        Caveat emptor - displaced by regulation (the buyer is protected by regulation). Uberimae Fidae - in the utmost good
        faith. Mortgage Insurance is an additional means of mitigating the risk, that the lended may have., so if the information
        assessed is not accurate, or if the borrower''s situation changes for the worse. then the risk rating may go down.
        So the Mortgage Insurance is a further strategy which mitigates any shortfall in the Lender Righrs that you may have
        - ie someone guarantees. In the US you can also avoid that by having paid a deposit. PIMI: Principal, Interst and
        Morgage Insurance. So the Borrower pays towards the MI, esxcept if they have paid a given amount as deposit. there
        are 2 types of MI: 1. protects the lender in the event of borrower degault 2. Insurance for "Incapacity to pay the
        mortage" (these can be bought off the shelf - can combine health, unemployment etc.). - this is the Borrower mitigating
        their own risk. Prevents foreclosure. Similar to general sickness etc. Where the lender charges for MI, the cost is
        passed onto the Borrower. e.g. if there is a % valuation (e.g. 70% in Aus, 80% in US for example) then no insurance
        is required.'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/LegalRight
      attributeUses: []
      patternBindings: []
