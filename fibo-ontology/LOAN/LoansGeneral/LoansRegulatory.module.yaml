      namespace: fibo-loan-loaloa
      localName: ConsumerCreditReferenceAgency
      label: consumer credit reference agency
      definition: 'Applicable regulations: vary by jurisdiciton. for example, only being allowed ot divulge actual judgements
        against a party, but not things that are not substantiated by judgements. For example, slow payments which are not
        covered by some judgement against the party. There will be different regulatory requirments about: 1. What the CR
        Agency can hold 2. Who they can divulge it to 3. What information they must provide the borrower at his/her request
        Some of the third thing there is covered in the EU the Data Protection Directive and local acts that implement this.'
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/FormalOrganization
      attributeUses: []
      patternBindings: []
