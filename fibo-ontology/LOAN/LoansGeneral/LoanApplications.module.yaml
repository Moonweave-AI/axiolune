      iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/LoanApplications/hasIntendedLoanPurpose
      namespace: fibo-loan-loaloa
      localName: hasIntendedLoanPurpose
      label: has intended loan purpose
