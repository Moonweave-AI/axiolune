  label: Loan Applications Ontology
  definition: This ontology defines concepts for the loan application process, along with kinds of loan application and the
    parties thereto. Another major thread of this ontology is credit risk assessment at the highest level, which includes
    security agreements, pre-approvals, and credit reports.
