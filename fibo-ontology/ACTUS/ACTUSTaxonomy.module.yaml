  sourceDigest: sha256:8c65cbd8d5453f3cf4ab3079bcd237d1954c2cf2bd2ae749c904f29212fc8add
  sourcePath: ACTUS/ACTUSTaxonomy.rdf
  fiboDomain: ACTUS
domain:
  objectTypes:
    ACTUSContractType:
      iri: https://spec.edmcouncil.org/fibo/ontology/ACTUS/ACTUSTaxonomy/ACTUSContractType
      namespace: fibo-actus-act
      localName: ACTUSContractType
      label: ACTUS contract type
      definition: classifier for an algorithmic capability, i.e., the rules, from which the cashflows for a credit agreement,
        financial instrument or related contract, based on their characteristics, can be analyzed
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    AlgorithmicContractCategory:
      iri: https://spec.edmcouncil.org/fibo/ontology/ACTUS/ACTUSTaxonomy/AlgorithmicContractCategory
      namespace: fibo-actus-act
      localName: AlgorithmicContractCategory
      label: algorithmic contract category
      definition: classifier for the cashflows generated by a group of credit agreements, financial instruments, or related
        contracts, within an ACTUS cashflow family, based on their more specific, common characteristics
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    AlgorithmicContractFamily:
      iri: https://spec.edmcouncil.org/fibo/ontology/ACTUS/ACTUSTaxonomy/AlgorithmicContractFamily
      namespace: fibo-actus-act
      localName: AlgorithmicContractFamily
      label: algorithmic contract family
      definition: classifier for a collection of types of contracts, such as credit agreements, financial instruments, or
        related kinds of contracts, based on their common characteristics from an ACTUS perspective
      superTypes:
      - https://www.omg.org/spec/Commons/Collections/Collection
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes:
    hasCoverageDescription:
      iri: https://spec.edmcouncil.org/fibo/ontology/ACTUS/ACTUSTaxonomy/hasCoverageDescription
      namespace: fibo-actus-act
      localName: hasCoverageDescription
      label: has coverage description
      definition: describes the contracts that the classifier applies to
      valueType: any
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
