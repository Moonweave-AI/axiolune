module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/ACTUS/ACTUSTaxonomy/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/ACTUS/ACTUSTaxonomy/
  preferredPrefix: fibo-actus-act
  version: local
  label: ACTUS Controlled Vocabulary
  definition: This ontology represents the ACTUS taxonomy as a controlled vocabulary and maps it to FIBO, providing the corresponding
    semantics and enabling integration of knowledge graphs based on FIBO with the ACTUS system.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Classifiers/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/CodesAndCodeSets/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Collections/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Designators/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Documents/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/TextDatatype/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
