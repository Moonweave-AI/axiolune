  label: ACTUS Contract Terms
  definition: This ontology represents the ACTUS contract terms that comprise the ACTUS data dictionary as a controlled vocabulary
    and maps it to FIBO, providing the corresponding semantics and enabling integration of knowledge graphs based on FIBO
    with the ACTUS system.
