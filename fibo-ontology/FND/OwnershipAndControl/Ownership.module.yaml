domain:
  objectTypes:
    Asset:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Asset
      namespace: fibo-fnd-ownown
      localName: Asset
      label: asset
      definition: something of monetary value that is owned or provides benefit to some party
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Undergoer
      attributeUses: []
      patternBindings: []
    CapitalSurplus:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/CapitalSurplus
      namespace: fibo-fnd-ownown
      localName: CapitalSurplus
      label: capital surplus
      definition: capital contributed in excess of the par value (stated value) of the ownership interest issued
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/PaidInCapital
      attributeUses: []
      patternBindings: []
    EarningsBeforeInterestTaxesDepreciationAmortization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/EarningsBeforeInterestTaxesDepreciationAmortization
      namespace: fibo-fnd-ownown
      localName: EarningsBeforeInterestTaxesDepreciationAmortization
      label: earnings before interest, taxes, depreciation and amortization
      definition: measure of potential cash flow that excludes the effects of capital structure, taxes and non-cash expenses
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    FinancialAsset:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/FinancialAsset
      namespace: fibo-fnd-ownown
      localName: FinancialAsset
      label: financial asset
      definition: non-physical, tangible asset whose value is derived from a contractual claim, such as bank deposits, bonds,
        stocks, rights, certificates, and bank balances
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/TangibleAsset
      attributeUses: []
      patternBindings: []
    Holding:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Holding
      namespace: fibo-fnd-ownown
      localName: Holding
      label: holding
      definition: owned financial interest consisting of legal or beneficial ownership of an asset or security that confers
        economic rights on its owner
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Asset
      attributeUses: []
      patternBindings: []
    Income:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Income
      namespace: fibo-fnd-ownown
      localName: Income
      label: income
      definition: revenue received during a period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      attributeUses: []
      patternBindings: []
    IntangibleAsset:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/IntangibleAsset
      namespace: fibo-fnd-ownown
      localName: IntangibleAsset
      label: intangible asset
      definition: identifiable, non-monetary asset that lacks physical substance
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Asset
      attributeUses: []
      patternBindings: []
    Owner:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Owner
      namespace: fibo-fnd-ownown
      localName: Owner
      label: owner
      definition: party that is legally recognized as having the right to possess, the privilege to use, and ability to transfer
        any rights or privileges associated with something, as permitted by law
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Actor
      attributeUses: []
      patternBindings: []
    OwnersEquity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/OwnersEquity
      namespace: fibo-fnd-ownown
      localName: OwnersEquity
      label: owners' equity
      definition: owners' share in a business plus operating profit
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    Ownership:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Ownership
      namespace: fibo-fnd-ownown
      localName: Ownership
      label: ownership
      definition: situation in which some party holds the legal title to something (explicitly or implicitly) and has the
        right to transfer that title and/or possession
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Situation
      attributeUses: []
      patternBindings: []
    PaidInCapital:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/PaidInCapital
      namespace: fibo-fnd-ownown
      localName: PaidInCapital
      label: paid-in capital
      definition: assets received from investors in exchange for an ownership interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/OwnersEquity
      attributeUses: []
      patternBindings: []
    PhysicalAsset:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/PhysicalAsset
      namespace: fibo-fnd-ownown
      localName: PhysicalAsset
      label: physical asset
      definition: tangible asset that has a material form, such as property, equipment, and inventory
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/TangibleAsset
      attributeUses: []
      patternBindings: []
    Portfolio:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Portfolio
      namespace: fibo-fnd-ownown
      localName: Portfolio
      label: portfolio
      definition: collection of holdings assembled and maintained as a unit for management purposes to achieve strategic objectives
      superTypes:
      - https://www.omg.org/spec/Commons/Collections/Collection
      attributeUses: []
      patternBindings: []
    RetainedEarnings:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/RetainedEarnings
      namespace: fibo-fnd-ownown
      localName: RetainedEarnings
      label: retained earnings
      definition: net profits kept to accumulate in a business after dividends are paid
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/OwnersEquity
      attributeUses: []
      patternBindings: []
    ShareholdersEquity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/ShareholdersEquity
      namespace: fibo-fnd-ownown
      localName: ShareholdersEquity
      label: shareholders' equity
      definition: equity that is manifested in the form of shares in an entity, fund or structured product
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/OwnersEquity
      attributeUses: []
      patternBindings: []
    TangibleAsset:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/TangibleAsset
      namespace: fibo-fnd-ownown
      localName: TangibleAsset
      label: tangible asset
      definition: asset that is a physical, measurable resource, i.e., one that takes a physical form
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Asset
      attributeUses: []
      patternBindings: []
