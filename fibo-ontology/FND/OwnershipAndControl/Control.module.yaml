domain:
  objectTypes:
    Control:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/Control
      namespace: fibo-fnd-owncon
      localName: Control
      label: control
      definition: situation in which some party has the power to direct or strongly influence the direction of the management
        and policies related to something
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Situation
      attributeUses: []
      patternBindings: []
    ControlledThing:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/ControlledThing
      namespace: fibo-fnd-owncon
      localName: ControlledThing
      label: controlled thing
      definition: something over which some party exercises some form of control with respect to some situation
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Undergoer
      attributeUses: []
      patternBindings: []
    ControllingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/ControllingParty
      namespace: fibo-fnd-owncon
      localName: ControllingParty
      label: controlling party
      definition: actor that exercises some form of control in the context of some situation
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Actor
      attributeUses: []
      patternBindings: []
    DeFactoControl:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/DeFactoControl
      namespace: fibo-fnd-owncon
      localName: DeFactoControl
      label: de facto control
      definition: control that exists informally and is accepted, although not formally recognized
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/Control
      attributeUses: []
      patternBindings: []
    DeJureControl:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/DeJureControl
      namespace: fibo-fnd-owncon
      localName: DeJureControl
      label: de jure control
      definition: control that exists as a matter of law, i.e., legitimate, legal control of something
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/LegalConstruct
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/Control
      attributeUses: []
      patternBindings: []
