      attributeUses: []
      patternBindings: []
    PhysicalAddressingScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddressingScheme
      namespace: fibo-fnd-plaadd
      localName: PhysicalAddressingScheme
      label: physical addressing scheme
      definition: scheme for specifying physical addresses according to a country specific standard
