      definition: identifier for a street in some context (e.g., city, municipality, geographic region)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/AddressComponent
      - https://www.omg.org/spec/Commons/Designators/Name
      attributeUses: []
      patternBindings: []
    StreetSuffix:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/StreetSuffix
      namespace: fibo-fnd-plaadd
      localName: StreetSuffix
      label: street suffix
      definition: classifier for a street or other delivery location, such as a dwelling located along a waterway
