      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/AddressComponent
      attributeUses: []
      patternBindings: []
    VirtualAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/VirtualAddress
      namespace: fibo-fnd-plaadd
      localName: VirtualAddress
      label: virtual address
      definition: address identifying a virtual, i.e. non-physical, location
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/Address
      attributeUses: []
      patternBindings: []
