      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PostOfficeBoxAddress
      namespace: fibo-fnd-plaadd
      localName: PostOfficeBoxAddress
      label: post office box address
      definition: physical address used to deliver communications to a designated container at a local post office or the
        local equivalent for the jurisdiction, where mail is held until the recipient collects it, rather than to a given
        house, building, or other location
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
