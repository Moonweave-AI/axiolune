      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/Address
      attributeUses: []
      patternBindings: []
    PhysicalAddressIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddressIdentifier
      namespace: fibo-fnd-plaadd
      localName: PhysicalAddressIdentifier
      label: physical address identifier
      definition: unique identifier for a physical address
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
