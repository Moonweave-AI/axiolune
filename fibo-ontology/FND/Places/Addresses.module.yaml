      namespace: fibo-fnd-plaadd
      localName: RegionSpecificIdentifier
      label: region-specific identifier
      definition: geographic region or subdivision identifier used internally by a country or other region
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/GeographicRegionIdentifier
      attributeUses: []
      patternBindings: []
