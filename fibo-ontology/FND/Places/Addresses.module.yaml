      namespace: fibo-fnd-plaadd
      localName: PostCodeArea
      label: post code area
      definition: physical area uniquely identified by some postal code
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/GeographicRegion
      attributeUses: []
      patternBindings: []
    PostOfficeBox:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PostOfficeBox
      namespace: fibo-fnd-plaadd
      localName: PostOfficeBox
      label: post office box
      definition: post office box associated with an address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressComponent
      attributeUses: []
      patternBindings: []
