      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/AddressComponent
      attributeUses: []
      patternBindings: []
    SupplementalAddressDesignator:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressDesignator
      namespace: fibo-fnd-plaadd
      localName: SupplementalAddressDesignator
      label: supplemental address designator
      definition: classifier for supplemental address information, such as a highway contract route, rural route, building
