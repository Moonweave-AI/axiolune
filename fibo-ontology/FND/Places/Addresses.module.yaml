      attributeUses: []
      patternBindings: []
    AddressingScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/AddressingScheme
      namespace: fibo-fnd-plaadd
      localName: AddressingScheme
