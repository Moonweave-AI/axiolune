      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    SupplementalAddressUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressUnit
      namespace: fibo-fnd-plaadd
      localName: SupplementalAddressUnit
      label: supplemental address unit
      definition: address component that includes a specific route, box, apartment, condominium or other indicator or unit
