      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PostOfficeBoxDesignator
      namespace: fibo-fnd-plaadd
      localName: PostOfficeBoxDesignator
      label: post office box designator
      definition: designator used, together with an identifier, for a post office box
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressDesignator
      attributeUses: []
      patternBindings: []
    Postcode:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/Postcode
      namespace: fibo-fnd-plaadd
      localName: Postcode
      label: postcode
