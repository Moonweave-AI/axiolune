      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/GeographicDirectionalSymbol
      attributeUses: []
      patternBindings: []
    PredirectionalSymbol:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PredirectionalSymbol
      namespace: fibo-fnd-plaadd
      localName: PredirectionalSymbol
