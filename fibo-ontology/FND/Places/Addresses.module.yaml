      attributeUses: []
      patternBindings: []
    StructureName:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/StructureName
      namespace: fibo-fnd-plaadd
      localName: StructureName
      label: structure name
      definition: name for a building, house, office complex, shopping center, or other structure or group of structures
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/AddressComponent
      - https://www.omg.org/spec/Commons/Designators/Name
      attributeUses: []
      patternBindings: []
    SupplementalAddressComponent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressComponent
      namespace: fibo-fnd-plaadd
      localName: SupplementalAddressComponent
      label: supplemental address component
      definition: address component that provides additional information that is important to ensuring proper delivery of
