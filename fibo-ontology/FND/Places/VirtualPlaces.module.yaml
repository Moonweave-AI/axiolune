  preferredPrefix: fibo-fnd-plavir
  version: '20251201'
  label: Virtual Places Ontology
  definition: This ontology provides scaffolding for use in describing virtual location-oriented concepts.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Identifiers/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Locations/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Organizations/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: VirtualPlaces.rdf
  sourceDigest: sha256:438392ab8ef9dce6a82f22719521b06cd6aaa6c8e0e4266cf15f5e4f6428a79c
  sourcePath: FND/Places/VirtualPlaces.rdf
  fiboDomain: FND
domain:
  objectTypes:
    ElectronicMailAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/ElectronicMailAddress
      namespace: fibo-fnd-plavir
      localName: ElectronicMailAddress
      label: electronic mail address
      definition: virtual address that defines an electronic messaging endpoint to which email messages can be delivered,
        typically via an Simple Mail Transfer Protocol (SMTP) based communications system
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/VirtualAddress
      attributeUses: []
      patternBindings: []
    NetworkLocation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/NetworkLocation
      namespace: fibo-fnd-plavir
      localName: NetworkLocation
      label: network location
      definition: a virtual location that may be identified by a network address (an identifier for a node or interface)
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/VirtualLocation
      attributeUses: []
      patternBindings: []
    NotionalPlace:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/NotionalPlace
      namespace: fibo-fnd-plavir
      localName: NotionalPlace
      label: notional place
      definition: an abstract place; one of many commonly understood concepts such as domestic, Eurozone etc.
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/Location
      attributeUses: []
      patternBindings: []
    TelephoneNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/TelephoneNumber
      namespace: fibo-fnd-plavir
      localName: TelephoneNumber
      label: telephone number
      definition: virtual address that may be assigned to a fixed-line telephone subscriber station connected to a telephone
        line or to a wireless electronic telephony device, such as a radio telephone or a mobile telephone, or to other devices
        or services for data transmission via the public switched telephone network (PSTN) or other public and private networks
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/VirtualAddress
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasElectronicMailAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/hasElectronicMailAddress
      namespace: fibo-fnd-plavir
      localName: hasElectronicMailAddress
      label: has electronic mail address
      definition: specifies an electronic messaging endpoint at which some entity may be located or contacted or may receive
        correspondence
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/ElectronicMailAddress
      inverseOf: ''
      characteristics: []
    hasTelephoneNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/hasTelephoneNumber
      namespace: fibo-fnd-plavir
      localName: hasTelephoneNumber
      label: has telephone number
      definition: indicates a virtual address composed of a sequence of digits and symbols that may be assigned to a fixed-line
        telephone subscriber station, a wireless electronic telephony device, such as a radio telephone or a mobile telephone,
        or other similar device or service
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Places/VirtualPlaces/TelephoneNumber
      inverseOf: ''
      characteristics: []
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
