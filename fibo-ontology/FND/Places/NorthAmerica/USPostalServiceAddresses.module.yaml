module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/
  preferredPrefix: fibo-fnd-planor
  version: '20260701'
  label: U.S. Postal Service Addresses Ontology
  definition: This ontology augments the Addresses ontology in FND with concepts that conform to the USPS Pub 28. The USPS
    provides automated address verification services that use the concepts defined herein for that purpose, and which many
    financial services entities use for data quality purposes.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/
    version: external
