domain:
  objectTypes:
    GeographicDirectionalSymbol:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/GeographicDirectionalSymbol
      namespace: fibo-fnd-planor
      localName: GeographicDirectionalSymbol
      label: GeographicDirectionalSymbol
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    CompleteAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/CompleteAddress
      namespace: fibo-fnd-planor
      localName: CompleteAddress
      label: complete address
      definition: delivery address that has all the address elements necessary to allow an exact match with the current Postal
        Service ZIP+4 and City State files to obtain the finest level of ZIP+4 and delivery point codes for the delivery address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/StandardizedAddress
      attributeUses: []
      patternBindings: []
    DeliveryAddressCodeSet:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/DeliveryAddressCodeSet
      namespace: fibo-fnd-planor
      localName: DeliveryAddressCodeSet
      label: delivery address code set
      definition: system of numeric codes that substitute for specified delivery point details according to the U.S. Postal
        Service Publication 28
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeSet
      - https://www.omg.org/spec/Commons/Identifiers/IdentificationScheme
      attributeUses: []
      patternBindings: []
    DeliveryPointCode:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/DeliveryPointCode
      namespace: fibo-fnd-planor
      localName: DeliveryPointCode
      label: delivery point code
      definition: specific set of digits between 00 and 99 assigned to a delivery point
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
      attributeUses: []
      patternBindings: []
    DeliveryPointCodeSet:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/DeliveryPointCodeSet
      namespace: fibo-fnd-planor
      localName: DeliveryPointCodeSet
      label: delivery point code set
      definition: system of numeric codes that substitute for specified delivery point details according to the U.S. Postal
        Service Publication 28
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeSet
      attributeUses: []
      patternBindings: []
    DepartmentOfStateAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/DepartmentOfStateAddress
      namespace: fibo-fnd-planor
      localName: DepartmentOfStateAddress
      label: Department of State address
      definition: delivery address whose delivery address line uses 'UNIT' followed by the unit identifier, followed by 'BOX'
        followed by box number, in place of a street address, 'DPO' as the literal value for the city, and the appropriate
        armed forces subdivision code in place of a subdivision (state) code
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    DepartmentOfStateUnitComponent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/DepartmentOfStateUnitComponent
      namespace: fibo-fnd-planor
      localName: DepartmentOfStateUnitComponent
      label: Department of State unit component
      definition: component of a Department of State address that includes 'UNIT' followed by the unit identifier
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressComponent
      attributeUses: []
      patternBindings: []
    GeneralDeliveryAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/GeneralDeliveryAddress
      namespace: fibo-fnd-planor
      localName: GeneralDeliveryAddress
      label: general delivery address
      definition: delivery address that uses the words 'GENERAL DELIVERY', uppercase preferred, spelled out (no abbreviation),
        in place of a street address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    HighwayContractRoute:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/HighwayContractRoute
      namespace: fibo-fnd-planor
      localName: HighwayContractRoute
      label: highway contract route
      definition: highway contract route associated with an address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressComponent
      attributeUses: []
      patternBindings: []
    HighwayContractRouteAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/HighwayContractRouteAddress
      namespace: fibo-fnd-planor
      localName: HighwayContractRouteAddress
      label: highway contract address
      definition: delivery address whose delivery address line uses the abbreviation 'HC', followed by the route identifier,
        followed by 'BOX' followed by box number, in place of a street address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    InternationalAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/InternationalAddress
      namespace: fibo-fnd-planor
      localName: InternationalAddress
      label: international address
      definition: physical address that explicitly includes a country
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    Mailbox:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/Mailbox
      namespace: fibo-fnd-planor
      localName: Mailbox
      label: mailbox
      definition: mailbox, other than a U.S. Post Office box, associated with an address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressComponent
      attributeUses: []
      patternBindings: []
    OverseasMilitaryAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/OverseasMilitaryAddress
      namespace: fibo-fnd-planor
      localName: OverseasMilitaryAddress
      label: overseas military address
      definition: delivery address whose delivery address line uses an abbreviation for the unit or command such as 'CMR',
        'PSC', or 'UNIT', or 'HC', followed by the unit identifier, followed by 'BOX' followed by box number, in place of
        a street address, either 'APO' or 'FPO' as the literal value for the city and the appropriate armed forces subdivision
        code in place of a subdivision (state) code
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    PrivateMailBoxAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/PrivateMailBoxAddress
      namespace: fibo-fnd-planor
      localName: PrivateMailBoxAddress
      label: private mail box address
      definition: delivery address provided by a commercial mail receiving company that includes a supplementary address line
        containing the abbreviation 'PMB' or the pound "#" symbol followed by the mailbox number; alternatively, 'PMB' or
        '#" and the mailbox number can be appended to the street address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/ConventionalStreetAddress
      attributeUses: []
      patternBindings: []
    PuertoRicoAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/PuertoRicoAddress
      namespace: fibo-fnd-planor
      localName: PuertoRicoAddress
      label: Puerto Rico address
      definition: delivery address for a delivery point in Puerto Rico that may include a supplementary address line containing
        the abbreviation 'URB' followed by the name of the urbanization area that is appropriate for that address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/ConventionalStreetAddress
      attributeUses: []
      patternBindings: []
    RuralRoute:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/RuralRoute
      namespace: fibo-fnd-planor
      localName: RuralRoute
      label: highway contract route address
      definition: mail route outside the city or township limits in a rural area associated with an address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/SupplementalAddressComponent
      attributeUses: []
      patternBindings: []
    RuralRouteAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/RuralRouteAddress
      namespace: fibo-fnd-planor
      localName: RuralRouteAddress
      label: rural route address
      definition: delivery address whose delivery address line uses the abbreviation 'RR', followed by the route identifier,
        followed by 'BOX' followed by box number, in place of a street address
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    StandardizedAddress:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/StandardizedAddress
      namespace: fibo-fnd-planor
      localName: StandardizedAddress
      label: standardized address
      definition: delivery address that is fully spelled out, abbreviated by using the Postal Service standard abbreviations
        or as given in the current Postal Service ZIP+4 file
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddress
      attributeUses: []
      patternBindings: []
    USPostalServiceAddressIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/USPostalServiceAddressIdentifier
      namespace: fibo-fnd-planor
      localName: USPostalServiceAddressIdentifier
      label: U.S. Postal Service address identifier
      definition: combined with the ZIP + 4 code, the delivery point code provides a unique identifier for every deliverable
        address served by the USPS
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/PhysicalAddressIdentifier
      attributeUses: []
      patternBindings: []
    Urbanization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/Urbanization
      namespace: fibo-fnd-planor
      localName: Urbanization
      label: urbanization
      definition: an area, sector, or development within a larger geographic area
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/CountrySubdivision
      attributeUses: []
      patternBindings: []
    ZIPCode:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/ZIPCode
      namespace: fibo-fnd-planor
      localName: ZIPCode
      label: Zip Code
      definition: five-digit code code assigned to a delivery address indicating the state and post office or postal zone
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/Postcode
      attributeUses: []
      patternBindings: []
    ZIPPlus4Code:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/ZIPPlus4Code
      namespace: fibo-fnd-planor
      localName: ZIPPlus4Code
      label: ZIP+4 Code
      definition: nine-digit number consisting of five digits, a hyphen, and four digits, which the USPS describes by its
        trademark ZIP+4
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Places/Addresses/Postcode
      attributeUses: []
      patternBindings: []
    ZipCodeScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/ZipCodeScheme
      namespace: fibo-fnd-planor
      localName: ZipCodeScheme
      label: zip code scheme
      definition: system used in the U.S. to facilitate the delivery of mail, consisting of a five- or nine-digit code Zone
        Improvement Plan (ZIP) printed directly after the address, the first five digits (initial code) indicating the state
        and post office or postal zone, the last four (expanded code) the box section or number, portion of a rural route,
        building, or other specific delivery location
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeSet
      - https://www.omg.org/spec/Commons/Identifiers/IdentificationScheme
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasUrbanization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/hasUrbanization
      namespace: fibo-fnd-planor
      localName: hasUrbanization
      label: has urbanization
      definition: indicates area, sector, or development within a geographic area relevant to a delivery address
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Places/NorthAmerica/USPostalServiceAddresses/Urbanization
      inverseOf: ''
      characteristics: []
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
