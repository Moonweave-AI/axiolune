  sourcePath: FND/ProductsAndServices/PaymentsAndSchedules.rdf
  fiboDomain: FND
domain:
  objectTypes:
    Payee:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payee
      namespace: fibo-fnd-propay
      localName: Payee
      label: payee
      definition: a party to whom a debt should be paid, or to whose order a bill of exchange, note, or check is made payable,
        or who receives or will receive a payment from a payer in partial or complete fulfillment of an obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligee
      attributeUses: []
      patternBindings: []
    Payer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payer
      namespace: fibo-fnd-propay
      localName: Payer
      label: payer
      definition: a party who pays a bill or fees, or who makes payments to a payee in partial or complete fulfillment of
        an obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligor
      attributeUses: []
      patternBindings: []
    Payment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payment
      namespace: fibo-fnd-propay
      localName: Payment
      label: payment
      definition: delivery of money in fulfillment of an obligation, such as to satisfy a claim or debt
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/Occurrence
      attributeUses: []
      patternBindings: []
    PaymentEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentEvent
      namespace: fibo-fnd-propay
      localName: PaymentEvent
      label: payment event
      definition: an event that involves delivery of money in fulfillment of an obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/TransactionEvent
      attributeUses: []
      patternBindings: []
    PaymentObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentObligation
      namespace: fibo-fnd-propay
      localName: PaymentObligation
      label: payment obligation
      definition: legally enforceable duty to pay a sum of money according to the terms stated in a contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Commitment
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/Duty
      attributeUses: []
      patternBindings: []
    PaymentSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentSchedule
      namespace: fibo-fnd-propay
      localName: PaymentSchedule
      label: payment schedule
      definition: schedule for delivery of money in fulfillment of an obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/Schedule
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    fulfillsObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/fulfillsObligation
      namespace: fibo-fnd-propay
      localName: fulfillsObligation
      label: fulfills obligation
      definition: satisfies a requirement for payment of some claim, debt, or other obligation
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payment
      range: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentObligation
      inverseOf: ''
      characteristics: []
    hasPaymentAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/hasPaymentAmount
      namespace: fibo-fnd-propay
      localName: hasPaymentAmount
      label: has payment amount
      definition: specifies the amount of money involved in a payment
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payment
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    hasPaymentSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/hasPaymentSchedule
      namespace: fibo-fnd-propay
      localName: hasPaymentSchedule
      label: has payment schedule
      definition: specifies the schedule for fulfillment of an obligation
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentSchedule
      inverseOf: ''
      characteristics: []
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
