  preferredPrefix: fibo-fnd-propay
  version: '20250701'
  label: Payments and Schedules Ontology
  definition: This ontology defines basic concepts such as payment, payee, payer, and payment schedule, extending the scheduling
    concepts from the Dates and Times module, among others.
