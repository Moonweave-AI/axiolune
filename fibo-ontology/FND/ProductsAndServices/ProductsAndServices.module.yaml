      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/CustomProduct
      namespace: fibo-fnd-propro
      localName: CustomProduct
      label: custom product
      definition: product that is made to order, commissioned based on a customer's specifications
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Product
      attributeUses: []
      patternBindings: []
