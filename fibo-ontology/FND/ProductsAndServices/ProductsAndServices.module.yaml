      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    ServiceAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/ServiceAgreement
      namespace: fibo-fnd-propro
      localName: ServiceAgreement
      label: service agreement
      definition: written contract between a client and service provider whereby the service provider supplies some service
        in the form of time, effort, and/or expertise in exchange for compensation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    Supplier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Supplier
      namespace: fibo-fnd-propro
      localName: Supplier
      label: supplier
      definition: party that provides goods or services that some party wants or needs, especially over a long period of time
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    TransactionConfirmation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/TransactionConfirmation
      namespace: fibo-fnd-propro
      localName: TransactionConfirmation
      label: transaction confirmation
      definition: written communication from a seller or service provider reciting the relevant details of a transaction
      superTypes:
      - https://www.omg.org/spec/Commons/Documents/LegalDocument
      attributeUses: []
      patternBindings: []
    TransactionEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/TransactionEvent
      namespace: fibo-fnd-propro
      localName: TransactionEvent
      label: transaction event
      definition: any sale, assignment, lease, license, loan, advance, contribution, or other transfer of any interest in
        or right to use any property (tangible or intangible) or money, however that transaction is effected, and regardless
        of whether the terms of the transaction are formally documented
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/OccurrenceKind
      attributeUses: []
      patternBindings: []
    Service:
      iri: https://www.omg.org/spec/Commons/Organizations/Service
      namespace: fibo-fnd-propro
      localName: Service
      label: Service
      definition: ''
