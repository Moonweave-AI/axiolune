    Buyer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Buyer
      namespace: fibo-fnd-propro
      localName: Buyer
      label: buyer
      definition: party that purchases something in exchange for money or other consideration under a contract of sale
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    Client:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Client
      namespace: fibo-fnd-propro
      localName: Client
      label: client
      definition: party that purchases professional services from, or has a formal relationship to purchase services from
