      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Product
      namespace: fibo-fnd-propro
      localName: Product
      label: product
      definition: commercially distributed good that is (1) tangible property, (2) the output or result of a fabrication,
        manufacturing, or production process, or (3) something that passes through a distribution channel before being consumed
        or used.
      superTypes: []
      attributeUses: []
      patternBindings: []
    ProductIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/ProductIdentifier
      namespace: fibo-fnd-propro
      localName: ProductIdentifier
      label: product identifier
      definition: sequence of characters uniquely identifying a product in some context
      superTypes:
      - https://www.omg.org/spec/Commons/Identifiers/Identifier
      attributeUses: []
      patternBindings: []
