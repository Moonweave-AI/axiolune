      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    ContractualProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/ContractualProduct
      namespace: fibo-fnd-propro
      localName: ContractualProduct
      label: contractual product
      definition: product that takes the form of an agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Product
      attributeUses: []
      patternBindings: []
    ContractualTemplateProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/ContractualTemplateProduct
      namespace: fibo-fnd-propro
      localName: ContractualTemplateProduct
      label: contractual template product
