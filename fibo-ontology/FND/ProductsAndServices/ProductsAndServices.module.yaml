      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Good
      namespace: fibo-fnd-propro
      localName: Good
      label: good
      definition: physical, produced item over which ownership rights can be established, whose ownership can be passed from
        one party to another by engaging in transactions, and that is not money or real estate
      superTypes: []
      attributeUses: []
      patternBindings: []
    NegotiableCommodity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      namespace: fibo-fnd-propro
      localName: NegotiableCommodity
      label: negotiable commodity
      definition: commodity that can be bought or sold in some marketplace
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Commodity
      attributeUses: []
      patternBindings: []
    OffTheShelfProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/OffTheShelfProduct
      namespace: fibo-fnd-propro
      localName: OffTheShelfProduct
      label: off-the-shelf product
      definition: product that is readily available from merchandise in stock, or can be quickly and easily configured to
        order, not specially designed or custom-made
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Product
      attributeUses: []
      patternBindings: []
