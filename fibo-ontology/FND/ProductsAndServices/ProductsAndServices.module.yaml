      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Customer
      namespace: fibo-fnd-propro
      localName: Customer
      label: customer
      definition: party that receives or consumes products (goods or services) and has the ability to choose between different
        products and suppliers
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Buyer
      attributeUses: []
      patternBindings: []
