domain:
  objectTypes:
    Employee:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Organizations/FormalOrganizations/Employee
      namespace: fibo-fnd-orgfor
      localName: Employee
      label: employee
      definition: person in the service of another under any contract of hire, express or implied, oral or written, where
        the employer has the right to control and direct that person in the material details of how the work is to be performed
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationMember
      attributeUses: []
      patternBindings: []
    Employer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Organizations/FormalOrganizations/Employer
      namespace: fibo-fnd-orgfor
      localName: Employer
      label: employer
      definition: party that provides compensation, including wages or a salary and potentially other benefits, in exchange
        for work performed by one or more people, and that has the right to control and direct the employee in the material
        details of how the work is to be performed
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/MemberBearingOrganization
      attributeUses: []
      patternBindings: []
    Employment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Organizations/FormalOrganizations/Employment
      namespace: fibo-fnd-orgfor
      localName: Employment
      label: employment
      definition: situation representing the state of being employed, i.e., the relationship that holds between an employer
        and employee for some period of time
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/Membership
      attributeUses: []
      patternBindings: []
    Group:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Organizations/FormalOrganizations/Group
      namespace: fibo-fnd-orgfor
      localName: Group
      label: group
      definition: collection of agents (people, organizations, software agents, etc.) that are considered as a unit
      superTypes:
      - https://www.omg.org/spec/Commons/Collections/Collection
      attributeUses: []
      patternBindings: []
