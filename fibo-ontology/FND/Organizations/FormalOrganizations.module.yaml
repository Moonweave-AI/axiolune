  version: '20260701'
  label: Formal Organizations Ontology
  definition: This ontology extends the Commons concept of a formal organization, which is purposefully underspecified to
    facilitate mapping to other organization ontologies, such as the W3C organization ontology, or others defined for specific
    business and financial services standards. It also defines general concepts related to employment by a formal organization.
