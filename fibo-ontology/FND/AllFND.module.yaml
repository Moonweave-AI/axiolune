  version: '20260701'
  label: all FND
  definition: "The Foundations (FND) domain includes ontologies that define general purpose concepts required to support other\
    \ FIBO domains. These include concepts and relationships about people, organizations, places, and most importantly, contracts\
    \ that are essential to domains such as Business Entities (BE), Financial Business and Commerce (FBC), Indices and Indicators\
    \ (IND), and Securities (SEC). \n\nThe scope of the definitions provided in FND is limited to coverage of exactly those\
    \ concepts needed by other FIBO domain areas. They may be useful for other domains, such as insurance, but are intentionally\
    \ underspecified to avoid unintended consequences and thus do not provide exhaustive coverage for any concept contained\
    \ herein. However, Foundations is designed for growth over time. The expectation is that as additional foundational knowledge\
    \ is needed to define concepts in other FIBO domain areas, additional ontologies and/or concepts will be integrated into\
    \ Foundations as required."
