    takesMaterialForm:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/TransactionsExt/REATransactions/takesMaterialForm
      namespace: fibo-fnd-trarea
      localName: takesMaterialForm
      label: takes material form
      definition: 'The material form of the Economic Resource; that is the thing which is recognized as being an Economic
        Resource as defined here, Editorial Note: This would usually be some Independent Thing. However it is conceivable
        that the existence of some relative thing, for example an asset, may itself be regarded and defined as a resource,
        over and above the role or context already defined for it. Therefore this identity relationship has a range of Thing,
        but is modeled as a sub property of "identity" to make this conclusion explicit. Editorial Note: This is a relationship
        with the sense that some relative thing takes the form of something, but is distinct from the similar concept as applied
        to Asset, in which the thing which takes the form of some asset is owned by someone. Here it is a resource, irrespective
        of whether or by whom it is owned. Labeled as "takes material form" to disambiguate these two relationships.'
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/TransactionsExt/REATransactions/EconomicResource
      range: ''
      inverseOf: ''
      characteristics: []
