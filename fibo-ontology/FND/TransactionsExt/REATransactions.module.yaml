  label: REA Transactions Ontology
  definition: This is the core REA-derived ontology for transactions. A transaction is defined as an exchange of commitments
    between parties. Other aspects of REA such as claims and transaction events (commitment lifecycles) are given in separate
    ontologies in this module.
