  label: Legal Capacity Ontology
  definition: This ontology defines high-level legal concepts related to legal responsibilities. The ontology defines things
    which are conferred upon some entity by some legal instrument, and elaborates this into a number of specific capacities,
    responsibilities and powers, each of which forms the basis for many of the concepts used elsewhere in FIBO in defining
    legal personhood, executive powers and the like.
