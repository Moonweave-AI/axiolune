domain:
  objectTypes:
    Agreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Agreement
      namespace: fibo-fnd-agragr
      localName: Agreement
      label: agreement
      definition: negotiated understanding between two or more parties, reflecting the offer and acceptance of commitments
        on the part of either party
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Situation
      attributeUses: []
      patternBindings: []
    Beneficiary:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Beneficiary
      namespace: fibo-fnd-agragr
      localName: Beneficiary
      label: beneficiary
      definition: party that receives some benefit or advantage or profits from something
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    BilateralAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/BilateralAgreement
      namespace: fibo-fnd-agragr
      localName: BilateralAgreement
      label: bilateral agreement
      definition: agreement where two parties commit to perform specific actions or obligations towards each other
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Agreement
      attributeUses: []
      patternBindings: []
    Commitment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Commitment
      namespace: fibo-fnd-agragr
      localName: Commitment
      label: commitment
      definition: promise made by some party to act or refrain from acting in some manner
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Situation
      attributeUses: []
      patternBindings: []
    CommitmentAtLarge:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/CommitmentAtLarge
      namespace: fibo-fnd-agragr
      localName: CommitmentAtLarge
      label: commitment at large
      definition: commitment made by some party without direct involvement from the potential beneficiaries of that commitment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/UnilateralCommitment
      attributeUses: []
      patternBindings: []
    MultilateralAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/MultilateralAgreement
      namespace: fibo-fnd-agragr
      localName: MultilateralAgreement
      label: multilateral agreement
      definition: agreements that involve or include multiple parties
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Agreement
      attributeUses: []
      patternBindings: []
    Obligee:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligee
      namespace: fibo-fnd-agragr
      localName: Obligee
      label: obligee
      definition: party to whom some commitment or obligation is owed, either legally or per the terms of an agreement
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    Obligor:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligor
      namespace: fibo-fnd-agragr
      localName: Obligor
      label: obligor
      definition: party that is bound legally or by agreement to repay a debt, make a payment, do something, or refrain from
        doing something
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    UnilateralCommitment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/UnilateralCommitment
      namespace: fibo-fnd-agragr
      localName: UnilateralCommitment
      label: unilateral commitment
      definition: commitment (promise or obligation) made by one party without requiring a reciprocal promise from another
        party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Commitment
      attributeUses: []
      patternBindings: []
