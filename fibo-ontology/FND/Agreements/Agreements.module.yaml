    version: external
  - moduleIri: https://www.omg.org/spec/Commons/PartiesAndSituations/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/RolesAndCompositions/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
