      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Agreement
      attributeUses: []
      patternBindings: []
    TerminationProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/TerminationProvision
      namespace: fibo-fnd-agrcon
      localName: TerminationProvision
      label: termination provision
      definition: contractual element that specifies the circumstances under which the parties can dissolve their legal relationship
        and discontinue the fulfillment of their obligations under the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    TransferableContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/TransferableContract
      namespace: fibo-fnd-agrcon
      localName: TransferableContract
      label: transferable contract
      definition: contract in which the rights and obligations of one party may be transferred to another party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    UnilateralContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/UnilateralContract
      namespace: fibo-fnd-agrcon
      localName: UnilateralContract
      label: unilateral contract
      definition: contract in which one party makes an offer that can only be accepted through performance rather than a return
        promise
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    UseOfProceedsProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/UseOfProceedsProvision
      namespace: fibo-fnd-agrcon
      localName: UseOfProceedsProvision
      label: use of proceeds provision
      definition: contract provision specifying how funds obtained through financing, such as through a credit agreement,
        offering, warrant, or other instrument are intended to be used
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    VerbalContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/VerbalContract
      namespace: fibo-fnd-agrcon
      localName: VerbalContract
      label: verbal contract
      definition: contract that exists as a result of some verbal exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Contract
      attributeUses: []
      patternBindings: []
    Warranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Warranty
      namespace: fibo-fnd-agrcon
      localName: Warranty
      label: warranty
      definition: contractual element that is a statement of fact
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
