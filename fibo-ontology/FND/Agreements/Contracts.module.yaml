      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    NovateableContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/NovateableContract
      namespace: fibo-fnd-agrcon
      localName: NovateableContract
      label: novateable contract
      definition: contract that may be replaced by another contract, and in that event, extinguishes the rights and obligations
        in effect under the original contract with those in the new agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/TransferableContract
      attributeUses: []
      patternBindings: []
    NovationNettingProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/NovationNettingProvision
      namespace: fibo-fnd-agrcon
      localName: NovationNettingProvision
      label: novation netting provision
      definition: contractual element that specifies what should be done with respect to netting when a given contract is
        replaced with another
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/NettingProvision
      attributeUses: []
      patternBindings: []
    PaymentNettingProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/PaymentNettingProvision
      namespace: fibo-fnd-agrcon
      localName: PaymentNettingProvision
      label: payment netting provision
      definition: netting provision that specifies the way in which all payments in a single currency owed between parties
        will be aggregated for each traded currency per value date and within the larger aggregate obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/NettingProvision
      attributeUses: []
      patternBindings: []
    Representation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Representation
      namespace: fibo-fnd-agrcon
      localName: Representation
      label: representation
      definition: contractual element that is a statement made by a party to the contract, before or at the time of making
        the contract, in regard to some fact, circumstance, or state of affairs pertinent to the contract, which the counterparty(ies)
        rely on, or is influential in bringing about the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    SettlementNettingProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/SettlementNettingProvision
      namespace: fibo-fnd-agrcon
      localName: SettlementNettingProvision
      label: settlement netting provision
      definition: netting provision that specifies the way in which on a given payment date, each party will aggregate the
        amounts of a currency to be delivered by it, and only the difference in the aggregate amounts will be delivered by
