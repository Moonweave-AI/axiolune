      attributeUses: []
      patternBindings: []
    NotificationProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/NotificationProvision
      namespace: fibo-fnd-agrcon
      localName: NotificationProvision
      label: notification provision
      definition: provision indicating that notification is required prior to the occurrence of a relevant event
