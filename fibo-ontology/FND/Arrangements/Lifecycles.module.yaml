      namespace: fibo-fnd-arrlif
      localName: Lifecycle
      label: lifecycle
      definition: arrangement that compares the cyclical nature of families, organizations, processes, products, marketing,
        and order management, portfolio management or other systems with the cradle to grave life stages (birth, growth, maturity,
        decay, and death) of living organisms
