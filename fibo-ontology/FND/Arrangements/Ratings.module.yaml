  fiboDomain: FND
domain:
  objectTypes:
    QualitativeRatingScore:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/QualitativeRatingScore
      namespace: fibo-fnd-arrrat
      localName: QualitativeRatingScore
      label: qualitative rating score
      definition: rating score that is represented as a qualitative code with respect to some rating scale
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScore
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
      attributeUses: []
      patternBindings: []
    QuantitativeRatingScore:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/QuantitativeRatingScore
      namespace: fibo-fnd-arrrat
      localName: QuantitativeRatingScore
      label: quantitative rating score
      definition: rating score that is a simple numeric value on some scale, such as a credit rating for an individual
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScore
      attributeUses: []
      patternBindings: []
    Rating:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/Rating
      namespace: fibo-fnd-arrrat
      localName: Rating
      label: rating
      definition: standing of something at a particular time, indicated by at least one scores with respect to some scale,
        based on an assessment by some party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Assessments/Opinion
      attributeUses: []
      patternBindings: []
    RatingAgency:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingAgency
      namespace: fibo-fnd-arrrat
      localName: RatingAgency
      label: rating agency
      definition: rating issuer that is also a rating scale publisher, frequently but not always an independent rating service
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingIssuer
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScalePublisher
      attributeUses: []
      patternBindings: []
    RatingAssessmentActivity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingAssessmentActivity
      namespace: fibo-fnd-arrrat
      localName: RatingAssessmentActivity
      label: rating assessment activity
      definition: assessment activity resulting in a grade or score and potentially a report describing the score and the
        process used to determine that score
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Assessments/AssessmentActivity
      attributeUses: []
      patternBindings: []
    RatingAssessmentEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingAssessmentEvent
      namespace: fibo-fnd-arrrat
      localName: RatingAssessmentEvent
      label: rating assessment event
      definition: individual assessment resulting in a grade or score and potentially a report describing the score
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Assessments/AssessmentEvent
      attributeUses: []
      patternBindings: []
    RatingIssuer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingIssuer
      namespace: fibo-fnd-arrrat
      localName: RatingIssuer
      label: rating issuer
      definition: party that is responsible for issuing ratings
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    RatingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingParty
      namespace: fibo-fnd-arrrat
      localName: RatingParty
      label: rating party
      definition: person, organization or group that analyzes some aspect of something and develops a rating
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    RatingReport:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingReport
      namespace: fibo-fnd-arrrat
      localName: RatingReport
      label: rating report
      definition: report describing a set of ratings
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Assessments/AssessmentReport
      attributeUses: []
      patternBindings: []
    RatingScale:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScale
      namespace: fibo-fnd-arrrat
      localName: RatingScale
      label: rating scale
      definition: system for assigning a value to something according to some scale with respect to quality, a standard, or
        ranking
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/ClassificationScheme
      attributeUses: []
      patternBindings: []
    RatingScalePublisher:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScalePublisher
      namespace: fibo-fnd-arrrat
      localName: RatingScalePublisher
      label: rating scale publisher
      definition: party responsible for managing one or more rating schemes and potentially publishing ratings based on those
        schemes
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    RatingScore:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScore
      namespace: fibo-fnd-arrrat
      localName: RatingScore
      label: rating score
      definition: grade, classification, or ranking of for something in accordance with some rating scale
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasRating:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/hasRating
      namespace: fibo-fnd-arrrat
      localName: hasRating
      label: has rating
      definition: indicates the rating assigned to a thing based on a grade or score according to a particular rating scale
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/Rating
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/rates
      characteristics: []
    hasRatingScore:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/hasRatingScore
      namespace: fibo-fnd-arrrat
      localName: hasRatingScore
      label: has rating score
      definition: indicates the grade or score associated with a rating with respect to a particular rating scale
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/Rating
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingScore
      inverseOf: ''
      characteristics: []
    producesRatingsFor:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/producesRatingsFor
      namespace: fibo-fnd-arrrat
      localName: producesRatingsFor
      label: produces ratings for
      definition: issuer for which ratings are produced or posted through
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingParty
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingIssuer
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/usesRatingParty
      characteristics: []
    rates:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/rates
      namespace: fibo-fnd-arrrat
      localName: rates
      label: rates
      definition: indicates the instrument, party or something else to which a rating applies
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/Rating
      range: ''
      inverseOf: ''
      characteristics: []
    usesRatingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/usesRatingParty
      namespace: fibo-fnd-arrrat
      localName: usesRatingParty
      label: uses rating performer
      definition: rating performer an issuer uses to assess ratings
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingIssuer
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/RatingParty
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasBestMeasure:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/hasBestMeasure
      namespace: fibo-fnd-arrrat
      localName: hasBestMeasure
      label: has best measure
      definition: indicates the 'best' (most desirable) possible value for a rating score's hasMeasureWithinScale property
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasMeasureWithinScale:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/hasMeasureWithinScale
      namespace: fibo-fnd-arrrat
      localName: hasMeasureWithinScale
      label: has measure within scale
      definition: indicates a relative, numeric measure or ordering on a rating scale
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasWorstMeasure:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Ratings/hasWorstMeasure
      namespace: fibo-fnd-arrrat
      localName: hasWorstMeasure
      label: has worst measure
      definition: indicates the 'worst' (least desirable) possible value for a rating score's hasMeasureWithinScale property
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
