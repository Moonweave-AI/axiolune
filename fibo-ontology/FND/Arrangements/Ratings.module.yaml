  preferredPrefix: fibo-fnd-arrrat
  version: '20260701'
  label: Ratings Ontology
  definition: This ontology defines abstract concepts for representation of ratings and rating schemes, particularly for ratings
    describing aspects of business performance, credit worthiness, and investment quality at a high level.
