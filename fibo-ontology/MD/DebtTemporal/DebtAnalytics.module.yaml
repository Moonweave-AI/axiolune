      namespace: fibo-md-debdeb
      localName: priceQuotedExDividend
      label: price quoted ex dividend
      definition: Whether or not the yield is based on a price which is quoted ex-dividend. When a bond is said to trade ex-dividend
        it means that there is a period of time prior to each coupon payment during which a bond purchaser does not receive
        custody of the next coupon. That payment is made to the previous bond holder and accrued interest is therefore negative
        during the ex-dividend period.
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
