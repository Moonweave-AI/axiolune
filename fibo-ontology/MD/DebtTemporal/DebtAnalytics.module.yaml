  baseIri: https://spec.edmcouncil.org/fibo/ontology/MD/DebtTemporal/DebtAnalytics/
  preferredPrefix: fibo-md-debdeb
  version: local
  label: Debt Analytics Ontology
  definition: This ontology covers an extensive range of analytical measures for debt instruments and pools of debt instruments.
    These cover the well-known concepts of convexity, duration and life, as well as weighted average loan ages and maturities,
    prepayments speeds etc. for debt pools. Most of the widely referenced variants of these are included, for example modified
    duration. Some yield related concepts (e.g. for equivalent yield) are also included. Debt pricing and yields are intimately
    related, and this ontology sets out the basic concepts of debt price, including different ways in which debt and bod prices
    are described and calculated, as well as a range of different kinds of yield (simple yield, Wall Street Yield, Japanese
    Yield and so on). The pricing terms are supported by a range of trading and exchange related concepts that are used to
    differentiate different kinds of debt price, for example last, high and low exchange prices.
