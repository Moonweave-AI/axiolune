  label: SecurityCreditStatuses
  definition: "This ontology extends the credit status ontology to define credit status concepts that are specific to issued\
    \ securities. These include cashflow status and the basic credit statuses of being OK or in default. \n\t\tNote that in\
    \ application data models these concepts would be represented as one or more selectable code lists or enumerations."
