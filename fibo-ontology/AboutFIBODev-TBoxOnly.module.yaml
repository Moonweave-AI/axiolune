  label: About FIBO Development - T-Box Only
  definition: This ontology is provided for the convenience of FIBO users. It loads the latest FIBO development ontologies,
    excluding reference data and examples, based on the contents of GitHub, rather than those that comprise a specific version,
    such as a quarterly release. Note that metadata files and other 'load' files, such as the various domain-specific 'all'
    files, are intentionally excluded.
