module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/AboutFIBOProd-IncludingReferenceData/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/AboutFIBOProd-IncludingReferenceData/
  preferredPrefix: fibo-aboutfiboprod-inclu
  version: '20260701'
  label: About FIBO Production - including Reference Data
  definition: This ontology is provided for the convenience of FIBO users. It loads the latest FIBO production ontologies,
    including reference data but excluding examples, based on the contents of GitHub, rather than those that comprise a specific
    version, such as a quarterly release. By reference data we mean ISO currency codes and USPS individuals in FND, juridictions
    and governments in BE, regulatory agencies and related financial services entities as well as business centers and MIC
    codes in FBC, FpML interest rates in IND, CFI codes in SEC (incomplete but planned for extension in subsequent releases),
    and so forth. Note that metadata files and other 'load' files, such as the various domain-specific 'all' files, are intentionally
    excluded.
