domain:
  objectTypes:
    AlignedCommunityInvestmentFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/AlignedCommunityInvestmentFund
      namespace: fibo-sec-funfun
      localName: AlignedCommunityInvestmentFund
      label: aligned community investment fund
      definition: community investment fund that raises capital publicly from community members and deploys some of that capital
        via investments into its client businesses or other businesses in the community
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/CommunityInvestmentFund
      attributeUses: []
      patternBindings: []
    ClosedEndInvestment:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/ClosedEndInvestment
      namespace: fibo-sec-funfun
      localName: ClosedEndInvestment
      label: closed-end investment
      definition: investment fund that has a fixed number of shares offered by an investment company through an initial public
        offering
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/ManagedInvestment
      attributeUses: []
      patternBindings: []
    CommunityInvestmentFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/CommunityInvestmentFund
      namespace: fibo-sec-funfun
      localName: CommunityInvestmentFund
      label: community investment fund
      definition: 'professionally-managed investment fund with three essential characteristics: capital is sourced from people
        in the community (ideally from retail/non-accredited investors); capital is invested into local people, projects,
        and businesses; and capital is deployed by individuals in the community, typically but not necessarily a nonprofit
        fund'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PrivateFund
      attributeUses: []
      patternBindings: []
    DiversifiedCommunityInvestmentFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/DiversifiedCommunityInvestmentFund
      namespace: fibo-sec-funfun
      localName: DiversifiedCommunityInvestmentFund
      label: diversified community investment fund
      definition: community investment fund that invests primarily in real estate but can also invest in any local business
        or project, and can do so with investment capital raised publicly from within the fund's own community, including
        community investors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/CommunityInvestmentFund
      attributeUses: []
      patternBindings: []
    ExchangeTradedFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/ExchangeTradedFund
      namespace: fibo-sec-funfun
      localName: ExchangeTradedFund
      label: exchange-traded fund
      definition: investment fund whose fund units are traded on an exchange, much like stocks
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/OpenEndInvestment
      attributeUses: []
      patternBindings: []
    FundAdministrator:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundAdministrator
      namespace: fibo-sec-funfun
      localName: FundAdministrator
      label: fund administrator
      definition: role of the party responsible for managing the operational, accounting, and compliance functions of an investment
        fund
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/ServiceProvider
      attributeUses: []
      patternBindings: []
    FundContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundContract
      namespace: fibo-sec-funfun
      localName: FundContract
      label: fund contract
      definition: contract that embodies and defines the fund legal form in cases where there is no independent organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/OrganizationCoveringAgreement
      attributeUses: []
      patternBindings: []
    FundHolder:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundHolder
      namespace: fibo-sec-funfun
      localName: FundHolder
      label: fund holder
      definition: party that owns units in or a percentage of and has rights and responsibilities with respect to some fund,
        provided in exchange for investment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/BeneficialOwner
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Counterparty
      attributeUses: []
      patternBindings: []
    FundHolding:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundHolding
      namespace: fibo-sec-funfun
      localName: FundHolding
      label: fund holding
      definition: ownership interest in a fund, which may represented by fund units that confer financial rights and governance
        privileges
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/FinancialAsset
      attributeUses: []
      patternBindings: []
    FundManager:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundManager
      namespace: fibo-sec-funfun
      localName: FundManager
      label: fund manager
      definition: role of the party responsible for making investment decisions and managing the portfolio of an investment
        fund
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/ServiceProvider
      attributeUses: []
      patternBindings: []
    FundOfFunds:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundOfFunds
      namespace: fibo-sec-funfun
      localName: FundOfFunds
      label: fund of funds
      definition: investment fund that invests directly in other investment funds rather than investing in stocks, bonds,
        and other securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/ManagedInvestment
      attributeUses: []
      patternBindings: []
    FundPosition:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundPosition
      namespace: fibo-sec-funfun
      localName: FundPosition
      label: fund position
      definition: position in some fund, which may be defined in terms of fund units
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Position
      attributeUses: []
      patternBindings: []
    FundUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundUnit
      namespace: fibo-sec-funfun
      localName: FundUnit
      label: fund unit
      definition: quantified share of beneficial interest in a pooled fund, representing a proportional claim on the fund's
        assets, income, or entitlements
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/ContractualInterest
      attributeUses: []
      patternBindings: []
    HedgeFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/HedgeFund
      namespace: fibo-sec-funfun
      localName: HedgeFund
      label: hedge fund
      definition: investment fund that pursues a total return and is usually open to qualified investors only
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/OpenEndInvestment
      attributeUses: []
      patternBindings: []
    LegalFundStructure:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/LegalFundStructure
      namespace: fibo-sec-funfun
      localName: LegalFundStructure
      label: legal fund structure
      definition: structure of a fund with respect to its legal formation in some jurisdiction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/LegalConstruct
      attributeUses: []
      patternBindings: []
    MutualFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/MutualFund
      namespace: fibo-sec-funfun
      localName: MutualFund
      label: mutual fund
      definition: open-end professionally managed investment fund established for the purpose of investing in securities such
        as stocks, bonds, money market instruments and similar assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/OpenEndInvestment
      attributeUses: []
      patternBindings: []
    NonTradableFundUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/NonTradableFundUnit
      namespace: fibo-sec-funfun
      localName: NonTradableFundUnit
      label: non-tradable fund unit
      definition: security representing an interest in a fund that cannot be traded ontside of the fund itself
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/NonNegotiableSecurity
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundUnit
      attributeUses: []
      patternBindings: []
    NonprofitFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/NonprofitFund
      namespace: fibo-sec-funfun
      localName: NonprofitFund
      label: nonprofit fund
      definition: investment vehicle designed to support a nonprofit mission, whose objectives include environmental stewardship
        and/or social responsibility in addition to financial performance
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PrivateFund
      attributeUses: []
      patternBindings: []
    OpenEndInvestment:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/OpenEndInvestment
      namespace: fibo-sec-funfun
      localName: OpenEndInvestment
      label: open-end investment
      definition: investment fund that offered through a fund company that sells shares directly to investors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/ManagedInvestment
      attributeUses: []
      patternBindings: []
    PensionFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/PensionFund
      namespace: fibo-sec-funfun
      localName: PensionFund
      label: pension fund
      definition: investment fund run by a financial intermediary on behalf of an organization and its employees/members
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/ManagedInvestment
      attributeUses: []
      patternBindings: []
    PrivateCreditFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/PrivateCreditFund
      namespace: fibo-sec-funfun
      localName: PrivateCreditFund
      label: private credit fund
      definition: investment vehicle that provides loans or other forms of credit to companies, typically outside of the traditional
        banking system
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PrivateFund
      attributeUses: []
      patternBindings: []
    PrivateEquityFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/PrivateEquityFund
      namespace: fibo-sec-funfun
      localName: PrivateEquityFund
      label: private equity fund
      definition: investment fund used for making investments in various equity (and to a lesser extent debt) securities according
        to an investment strategy associated with private equity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PrivateFund
      attributeUses: []
      patternBindings: []
    RealEstateInvestmentTrust:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/RealEstateInvestmentTrust
      namespace: fibo-sec-funfun
      localName: RealEstateInvestmentTrust
      label: real estate investment trust
      definition: investment fund that offers shares/units to the public and invests in real estate directly
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/ManagedInvestment
      attributeUses: []
      patternBindings: []
    SovereignWealthFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/SovereignWealthFund
      namespace: fibo-sec-funfun
      localName: SovereignWealthFund
      label: sovereign wealth fund
      definition: state-owned investment fund that consists of pools of money derived from a country's reserves
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/CollectiveInvestmentVehicle
      attributeUses: []
      patternBindings: []
    TradableFundUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/TradableFundUnit
      namespace: fibo-sec-funfun
      localName: TradableFundUnit
      label: tradable fund unit
      definition: security representing a tradable interest in a fund
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/EquityInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/NegotiableSecurity
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundUnit
      attributeUses: []
      patternBindings: []
    UnitTrust:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/UnitTrust
      namespace: fibo-sec-funfun
      localName: UnitTrust
      label: unit trust
      definition: pooled investment vehicle in which investors hold units that represent beneficial ownership in a trust-managed
        portfolio of assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/UnitizedFund
      attributeUses: []
      patternBindings: []
    UnitizedFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/UnitizedFund
      namespace: fibo-sec-funfun
      localName: UnitizedFund
      label: unitized fund
      definition: pooled investment vehicle in which investors hold units that represent a proportional share of the fund's
        underlying assets, typically used in pensions or insurance-based products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/CollectiveInvestmentVehicle
      attributeUses: []
      patternBindings: []
    CollectiveInvestmentVehicle:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/CollectiveInvestmentVehicle
      namespace: fibo-sec-funfun
      localName: CollectiveInvestmentVehicle
      label: CollectiveInvestmentVehicle
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    ManagedInvestment:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/ManagedInvestment
      namespace: fibo-sec-funfun
      localName: ManagedInvestment
      label: ManagedInvestment
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/CollectiveInvestmentVehicle
      attributeUses: []
      patternBindings: []
    PooledFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PooledFund
      namespace: fibo-sec-funfun
      localName: PooledFund
      label: PooledFund
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/FinancialAsset
      attributeUses: []
      patternBindings: []
    PrivateFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PrivateFund
      namespace: fibo-sec-funfun
      localName: PrivateFund
      label: PrivateFund
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasLegalStructure:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/hasLegalStructure
      namespace: fibo-sec-funfun
      localName: hasLegalStructure
      label: has legal structure
      definition: indicates the legal form that the fund takes
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PooledFund
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/LegalFundStructure
      inverseOf: ''
      characteristics: []
    hasSubFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/hasSubFund
      namespace: fibo-sec-funfun
      localName: hasSubFund
      label: has sub-fund
      definition: relates a pooled fund to a sub-fund that is a constituent of the parent fund
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PooledFund
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PooledFund
      inverseOf: ''
      characteristics: []
    isSubFundOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/isSubFundOf
      namespace: fibo-sec-funfun
      localName: isSubFundOf
      label: is sub-fund of
      definition: relates a pooled fund to a parent fund
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PooledFund
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/PooledFund
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/hasSubFund
      characteristics: []
  attributeTypes:
    isOpenEnded:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/isOpenEnded
      namespace: fibo-sec-funfun
      localName: isOpenEnded
      label: is open ended
      definition: indicates whether the fund is an open-end/closed-end fund
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
    isPrivate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/isPrivate
      namespace: fibo-sec-funfun
      localName: isPrivate
      label: is private
      definition: indicates that the fund does not offer its securities to the general public
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
