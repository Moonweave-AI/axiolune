domain:
  objectTypes:
    AccumulatingShareClass:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/AccumulatingShareClass
      namespace: fibo-sec-funcol
      localName: AccumulatingShareClass
      label: accumulating share class
      definition: A share class in which there is no option to reinvest.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundShareClassUnit
      attributeUses: []
      patternBindings: []
    AssetClassStrategy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/AssetClassStrategy
      namespace: fibo-sec-funcol
      localName: AssetClassStrategy
      label: asset class strategy
      definition: Strategy which is asset class based.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundPortfolioInvestmentLimitations
      attributeUses: []
      patternBindings: []
    CommonShareInFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/CommonShareInFund
      namespace: fibo-sec-funcol
      localName: CommonShareInFund
      label: common share in fund
      definition: A share unit in a fund, which is classified as a Common Share class.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundShareClassUnit
      attributeUses: []
      patternBindings: []
    CurrencyStrategy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/CurrencyStrategy
      namespace: fibo-sec-funcol
      localName: CurrencyStrategy
      label: currency strategy
      definition: Strategy which is currency based.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundPortfolioInvestmentLimitations
      attributeUses: []
      patternBindings: []
    DistributingShareClass:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/DistributingShareClass
      namespace: fibo-sec-funcol
      localName: DistributingShareClass
      label: distributing share class
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundShareClassUnit
      attributeUses: []
      patternBindings: []
    EquityFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/EquityFund
      namespace: fibo-sec-funcol
      localName: EquityFund
      label: equity fund
      definition: A fund which invests in at least 85% shares.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/CollectiveInvestmentVehicle
      attributeUses: []
      patternBindings: []
    EquityPortfolio:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/EquityPortfolio
      namespace: fibo-sec-funcol
      localName: EquityPortfolio
      label: equity portfolio
      definition: A portfolio which has at least 85% exposure to shares.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundPortfolio
      attributeUses: []
      patternBindings: []
    FondsCommunDePlacement:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FondsCommunDePlacement
      namespace: fibo-sec-funcol
      localName: FondsCommunDePlacement
      label: fonds commun de placement
      definition: open-ended collective investment fund, which is a contractual form set up between the fund manager and investors
        and not a separate legal entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Pools/CollectiveInvestmentVehicle
      attributeUses: []
      patternBindings: []
    FundAccountant:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundAccountant
      namespace: fibo-sec-funcol
      localName: FundAccountant
      label: fund accountant
      definition: The party that keeps accounting records of the available assets and liabilities of the Fund. It calculates
        dealing prices, the Net Asset Value (NAV) of the Fund, and may provide fund performance and tax data. Can be subcontracted
        by the FundAdministrator.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundsProcessingParty
      attributeUses: []
      patternBindings: []
    FundBondClassUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundBondClassUnit
      namespace: fibo-sec-funcol
      localName: FundBondClassUnit
      label: fund bond class unit
      definition: A fund unit which takes the form of debt in that fund.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundUnit
      attributeUses: []
      patternBindings: []
    FundBondUnitCoupon:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundBondUnitCoupon
      namespace: fibo-sec-funcol
      localName: FundBondUnitCoupon
      label: fund bond unit coupon
      definition: A fixed coupon paid out to holders of the Fund Bond Unit.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/InterestRate
      attributeUses: []
      patternBindings: []
    FundCashDistributionPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundCashDistributionPolicy
      namespace: fibo-sec-funcol
      localName: FundCashDistributionPolicy
      label: fund cash distribution policy
      definition: Policy for distribution of cash dividends or notes in the event that the fund units have a distribution
        policy of "Cash" rather than "Reinvestment".
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundUnitDistributionPolicy
      attributeUses: []
      patternBindings: []
    FundClassification:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundClassification
      namespace: fibo-sec-funcol
      localName: FundClassification
      label: fund classification
      definition: 'The category of the fund according to the asset class. This is a published code by which the Fund is classified.
        Further notes: Could be EFCF codes. This is the way in which "Type of fund" is articulated.'
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    FundClassificationScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundClassificationScheme
      namespace: fibo-sec-funcol
      localName: FundClassificationScheme
      label: fund classification scheme
      definition: A published scheme for the category of a fund according to the asset class.
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/ClassificationScheme
      attributeUses: []
      patternBindings: []
    FundCouponPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundCouponPolicy
      namespace: fibo-sec-funcol
      localName: FundCouponPolicy
      label: fund coupon policy
      definition: Terms for the expected distribution of bond unit coupons.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundCashDistributionPolicy
      attributeUses: []
      patternBindings: []
    FundDepositary:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundDepositary
      namespace: fibo-sec-funcol
      localName: FundDepositary
      label: fund depositary
      definition: The party that holds and safeguards holdings owned by a fund. It is also responsible for compliance of the
        portfolio with legal ratios etc.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundsProcessingParty
      attributeUses: []
      patternBindings: []
    FundDistributionPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundDistributionPolicy
      namespace: fibo-sec-funcol
      localName: FundDistributionPolicy
      label: fund distribution policy
      definition: policy indicating the overall strategy or limitations on distribution for the fund
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/Policy
      attributeUses: []
      patternBindings: []
    FundDistributor:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundDistributor
      namespace: fibo-sec-funcol
      localName: FundDistributor
      label: fund distributor
      definition: an entity through which a fund may be bought by or for an investor. This may be on a discretionary or advisory
        basis, or as an execution-only service. Definition origin:EFAMA DD
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundsProcessingParty
      attributeUses: []
      patternBindings: []
    FundDividendPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundDividendPolicy
      namespace: fibo-sec-funcol
      localName: FundDividendPolicy
      label: fund dividend policy
      definition: Terms for the expected distributions of dividends.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundCashDistributionPolicy
      attributeUses: []
      patternBindings: []
    FundInvestmentObjective:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundInvestmentObjective
      namespace: fibo-sec-funcol
      localName: FundInvestmentObjective
      label: fund investment objective
      definition: The aim of a Fund e.g outperfom a given benchmark.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/InvestmentObjective
      attributeUses: []
      patternBindings: []
    FundInvestmentPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundInvestmentPolicy
      namespace: fibo-sec-funcol
      localName: FundInvestmentPolicy
      label: fund investment policy
      definition: policy that the fund implements in order to achieve the stated fund objectives
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/Policy
      attributeUses: []
      patternBindings: []
    FundLegalFormDocumentation:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundLegalFormDocumentation
      namespace: fibo-sec-funcol
      localName: FundLegalFormDocumentation
      label: fund legal form documentation
      definition: For a fund which is constituted under the law of contract, the constitution or articles that define the
        fund. These are embodied in a Contract.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCore/Constitution
      attributeUses: []
      patternBindings: []
    FundOrderDesk:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundOrderDesk
      namespace: fibo-sec-funcol
      localName: FundOrderDesk
      label: fund order desk
      definition: The Fund Order Desk is a party to the Fund Order Desk Account.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/AccountProvider
      attributeUses: []
      patternBindings: []
    FundPortfolio:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundPortfolio
      namespace: fibo-sec-funcol
      localName: FundPortfolio
      label: fund portfolio
      definition: An account containing a number of financial instruments along with cash positions in one or more currencies
        and belonging to a Fund
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Portfolio
      attributeUses: []
      patternBindings: []
    FundPortfolioInvestmentLimitations:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundPortfolioInvestmentLimitations
      namespace: fibo-sec-funcol
      localName: FundPortfolioInvestmentLimitations
      label: fund portfolio investment limitations
      definition: Detailed Policy on approximately how the portfolio is to be allocated to achieve the stated investment goals.
        This underpins the detailed strategy of how to achieve this.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/InvestmentRestriction
      attributeUses: []
      patternBindings: []
    FundPortfolioInvestmentPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundPortfolioInvestmentPolicy
      namespace: fibo-sec-funcol
      localName: FundPortfolioInvestmentPolicy
      label: fund portfolio investment policy
      definition: policy with respect to allocation of the portfolio that is designed to meet the stated investment strategy
        and goals
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/Policy
      attributeUses: []
      patternBindings: []
    FundProcessingGeneralTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundProcessingGeneralTerms
      namespace: fibo-sec-funcol
      localName: FundProcessingGeneralTerms
      label: fund processing general terms
      definition: Formal terms for general processing of the fund. These set out what the investor and the fund may or may
        not do.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundProcessingTerms
      attributeUses: []
      patternBindings: []
    FundProcessingTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundProcessingTerms
      namespace: fibo-sec-funcol
      localName: FundProcessingTerms
      label: fund processing terms
      definition: 'Formal terms for processing of the fund. These set out what the investor and the fund may or may not do.
        These include terms for redemption and subscription processing as well as general processing terms. ISO FIBIM definition:
        Processing characteristics linked to the instrument, ie, not to the market.'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    FundRedemptionRestriction:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundRedemptionRestriction
      namespace: fibo-sec-funcol
      localName: FundRedemptionRestriction
      label: fund redemption restriction
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesRestrictions/SecuritiesRestriction
      attributeUses: []
      patternBindings: []
    FundRedemptionTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundRedemptionTerms
      namespace: fibo-sec-funcol
      localName: FundRedemptionTerms
      label: fund redemption terms
      definition: Formal terms for redemption of units in the fund. These set out what the investor and the fund may or may
        not do.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundProcessingTerms
      attributeUses: []
      patternBindings: []
    FundReinvestmentPolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundReinvestmentPolicy
      namespace: fibo-sec-funcol
      localName: FundReinvestmentPolicy
      label: fund reinvestment policy
      definition: Terms for the expected reinvestment of profits on fund units.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundUnitDistributionPolicy
      attributeUses: []
      patternBindings: []
    FundShareClassUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundShareClassUnit
      namespace: fibo-sec-funcol
      localName: FundShareClassUnit
      label: fund share class unit
      definition: The legal structure in which you can purchase part of an investment pool, defined by a variety of characteristics
        like investor type, minimum size of investment, distribution type, fee and currency. A fund unit which gives the holder
        an equity stake in the fund.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/Funds/FundUnit
      attributeUses: []
      patternBindings: []
    FundSubscriptionTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundSubscriptionTerms
      namespace: fibo-sec-funcol
      localName: FundSubscriptionTerms
      label: fund subscription terms
      definition: 'Subscription terms for the fund. Further notes: ISO FIBIM, EFAMA DD and FPP combine terms for subscription,
        redemption and general holding requirements. These have been separated here as they are different kinds of term, but
        this can be reviewed. Subscription Terms are identified as terms of the fund and not the fund unit, since terms for
        how you might subscribe can''t be binding one someone who has not yet subscribed.'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundProcessingTerms
      attributeUses: []
      patternBindings: []
    FundSupervisoryAuthority:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundSupervisoryAuthority
      namespace: fibo-sec-funcol
      localName: FundSupervisoryAuthority
      label: fund supervisory authority
      definition: party that supervises the fund or fund industry
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    FundTransferAgent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundTransferAgent
      namespace: fibo-sec-funcol
      localName: FundTransferAgent
      label: fund transfer agent
      definition: An entity that undertakes the execution of subscription, redemption and switch orders on behalf of a fund.
        Definition origin:EFAMA DD
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundsProcessingParty
      attributeUses: []
      patternBindings: []
    FundUnitDistributionMethod:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Funds/CollectiveInvestmentVehicles/FundUnitDistributionMethod
      namespace: fibo-sec-funcol
      localName: FundUnitDistributionMethod
      label: fund unit distribution method
      definition: The normal distribution policy for funds.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/DistributionStrategy
      attributeUses: []
