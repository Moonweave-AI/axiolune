  label: all SEC, North American Extension
  definition: The FIBO Securities (SEC) domain provides a model of concepts that are common to financial instruments that
    are also securities, including but not limited to exchange-traded securities. High-level concepts relevant to securities
    classification, identification, issuance, and registration of securities generally are covered, as well as additional
    detail for equities, debt instruments, and funds. More details defining derivatives in particular are covered in a separate
    derivatives domain area.
