domain:
  objectTypes:
    DebtInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      namespace: fibo-sec-debdeb
      localName: DebtInstrument
      label: DebtInstrument
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    CallEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallEvent
      namespace: fibo-sec-debdeb
      localName: CallEvent
      label: call event
      definition: an event associated with the call schedule for a debt instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RedemptionEvent
      attributeUses: []
      patternBindings: []
    CallFeature:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallFeature
      namespace: fibo-sec-debdeb
      localName: CallFeature
      label: call feature
      definition: redemption provision defining the rights of the issuer to buy back a security at a call price after a call
        protection period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/RedemptionProvision
      attributeUses: []
      patternBindings: []
    CallNotificationProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallNotificationProvision
      namespace: fibo-sec-debdeb
      localName: CallNotificationProvision
      label: call notification provision
      definition: provision of a call feature defining notification requirements
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/NotificationProvision
      attributeUses: []
      patternBindings: []
    CallPremium:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallPremium
      namespace: fibo-sec-debdeb
      localName: CallPremium
      label: call premium
      definition: the price over par paid by an issuer to redeem securities when exercising a call provision
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      attributeUses: []
      patternBindings: []
    CallSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallSchedule
      namespace: fibo-sec-debdeb
      localName: CallSchedule
      label: call schedule
      definition: a schedule of call prices and when they are in effect
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/Schedule
      attributeUses: []
      patternBindings: []
    CallWindow:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallWindow
      namespace: fibo-sec-debdeb
      localName: CallWindow
      label: call window
      definition: an explicit period of time prior to a call date during which an issuer or agent must give notice to holders
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      attributeUses: []
      patternBindings: []
    DebtOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/DebtOffering
      namespace: fibo-sec-debdeb
      localName: DebtOffering
      label: debt offering
      definition: an offering of one or more debt instruments for sale
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      attributeUses: []
      patternBindings: []
    FixedIncomeSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/FixedIncomeSecurity
      namespace: fibo-sec-debdeb
      localName: FixedIncomeSecurity
      label: fixed income security
      definition: tradeable debt instrument that provides a return in the form of fixed periodic payments and typically the
        return of principal at maturity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      attributeUses: []
      patternBindings: []
    FullyIndexedInterestRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/FullyIndexedInterestRate
      namespace: fibo-sec-debdeb
      localName: FullyIndexedInterestRate
      label: fully-indexed interest rate
      definition: a variable interest rate that is calculated by adding a margin to a specified index rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FloatingInterestRate
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    InterestOnlyStrip:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/InterestOnlyStrip
      namespace: fibo-sec-debdeb
      localName: InterestOnlyStrip
      label: interest-only strip
      definition: a strip that represents the non-principal portion of the monthly payments on the underlying debt instrument,
        such as a bond
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/Strip
      attributeUses: []
      patternBindings: []
    IssuedDebt:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/IssuedDebt
      namespace: fibo-sec-debdeb
      localName: IssuedDebt
      label: issued debt
      definition: debt that is set out by the borrower in some form of financial security in which the lender is the holder
        or counterparty of that security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Debt
      attributeUses: []
      patternBindings: []
    MakeWholeFeature:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/MakeWholeFeature
      namespace: fibo-sec-debdeb
      localName: MakeWholeFeature
      label: make whole feature
      definition: a call provision allowing the issuer to pay off remaining debt early
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallFeature
      attributeUses: []
      patternBindings: []
    Margin:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/Margin
      namespace: fibo-sec-debdeb
      localName: Margin
      label: margin
      definition: a variable that is added to a specified index rate to determine the fully indexed interest rate charged
        to a borrower on a credit balance
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Variable
      attributeUses: []
      patternBindings: []
    NonTradableDebtInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/NonTradableDebtInstrument
      namespace: fibo-sec-debdeb
      localName: NonTradableDebtInstrument
      label: non-tradable debt instrument
      definition: a debt instrument that may not be bought or sold
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    NotificationProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/NotificationProvision
      namespace: fibo-sec-debdeb
      localName: NotificationProvision
      label: notification provision
      definition: provision of a redemption feature defining notification requirements
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/RedemptionProvision
      attributeUses: []
      patternBindings: []
    PrescriptiveEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PrescriptiveEvent
      namespace: fibo-sec-debdeb
      localName: PrescriptiveEvent
      label: prescriptive event
      definition: event related to the imposition or enforcement of a rule, method, formula, etc.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/OccurrenceKind
      attributeUses: []
      patternBindings: []
    PrincipalOnlyStrip:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PrincipalOnlyStrip
      namespace: fibo-sec-debdeb
      localName: PrincipalOnlyStrip
      label: principal-only strip
      definition: a strip that represents the principal portion of the monthly payments on the underlying debt instrument,
        such as a bond
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/Strip
      attributeUses: []
      patternBindings: []
    PubliclyIssuedDebt:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PubliclyIssuedDebt
      namespace: fibo-sec-debdeb
      localName: PubliclyIssuedDebt
      label: publicly issued debt
      definition: an issued debt in the form of a tradable debt instrument (security)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/IssuedDebt
      attributeUses: []
      patternBindings: []
    PutEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutEvent
      namespace: fibo-sec-debdeb
      localName: PutEvent
      label: put event
      definition: an event associated with the put schedule for a debt instrument, i.e., an event involving the 'put', or
        surrender of the instrument by the holder
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RedemptionEvent
      attributeUses: []
      patternBindings: []
    PutFeature:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutFeature
      namespace: fibo-sec-debdeb
      localName: PutFeature
      label: put feature
      definition: redemption provision giving the holder the right, but not the obligation, to sell a specified amount of
        the debt instrument (i.e., redeem it), prior to maturity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/DebtTerms
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/RedemptionProvision
      attributeUses: []
      patternBindings: []
    PutNotificationProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutNotificationProvision
      namespace: fibo-sec-debdeb
      localName: PutNotificationProvision
      label: put notification provision
      definition: a provision of a put feature defining notification requirements
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/NotificationProvision
      attributeUses: []
      patternBindings: []
    PutPremium:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutPremium
      namespace: fibo-sec-debdeb
      localName: PutPremium
      label: put premium
      definition: an amount over par that a debt instrument holder must pay to sell the security early
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      attributeUses: []
      patternBindings: []
    PutSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutSchedule
      namespace: fibo-sec-debdeb
      localName: PutSchedule
      label: put schedule
      definition: a schedule that defines the events associated with the put feature of a debt instrument, i.e, the dates
        on which the debt instrument may be sold at what price by the holder
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/Schedule
      attributeUses: []
      patternBindings: []
    PutWindow:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutWindow
      namespace: fibo-sec-debdeb
      localName: PutWindow
      label: put window
      definition: an explicit period of time prior to a put date during which holder or agent must give notice to an issuer
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      attributeUses: []
      patternBindings: []
    RedemptionEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RedemptionEvent
      namespace: fibo-sec-debdeb
      localName: RedemptionEvent
      label: redemption event
      definition: a prescriptive event involving the return of an investor's principal in a fixed-income security, such as
        a preferred stock or bond, or the sale of units in a mutual fund
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PrescriptiveEvent
      attributeUses: []
      patternBindings: []
    RelativePrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RelativePrice
      namespace: fibo-sec-debdeb
      localName: RelativePrice
      label: relative price
      definition: security price specified in comparison with either a stated or market value for a debt instrument at some
        point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    StepEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/StepEvent
      namespace: fibo-sec-debdeb
      localName: StepEvent
      label: step event
      definition: event that prescribes a change in a contractual term, such as a rate or notional amount, for a given contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/CalculationEvent
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PrescriptiveEvent
      attributeUses: []
      patternBindings: []
    StepSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/StepSchedule
      namespace: fibo-sec-debdeb
      localName: StepSchedule
      label: step schedule
      definition: schedule specifying the date(s) and change in a contractual term(s), e.g., rate or notional amount, for
        a contract that has a feature where stipulated changes occur at specified intervals or on specified dates
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/Schedule
      attributeUses: []
      patternBindings: []
    Strip:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/Strip
      namespace: fibo-sec-debdeb
      localName: Strip
      label: strip
      definition: a tradeable debt instrument created either through the process of removing coupons from a bond and then
        selling the separate parts as a zero coupon bond and an interest paying coupon bond or through taking the opposite
        position from some variant in the options market
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/FixedIncomeSecurity
      attributeUses: []
      patternBindings: []
    TradableDebtInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      namespace: fibo-sec-debdeb
      localName: TradableDebtInstrument
      label: tradable debt instrument
      definition: a debt instrument that is also a security, i.e., that can be bought and sold by the holder
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      attributeUses: []
      patternBindings: []
    VariableIncomeSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/VariableIncomeSecurity
      namespace: fibo-sec-debdeb
      localName: VariableIncomeSecurity
      label: variable income security
      definition: tradeable debt instrument that provide their owners with a rate of return that is dynamic and determined
        by market forces
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasCallFeature:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasCallFeature
      namespace: fibo-sec-debdeb
      localName: hasCallFeature
      label: has call feature
      definition: indicates the specific terms related to any inherent call feature as specified in the offering/instrument
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallFeature
      inverseOf: ''
      characteristics: []
    hasDatedDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasDatedDate
      namespace: fibo-sec-debdeb
      localName: hasDatedDate
      label: has dated date
      definition: specifies the date on which interest begins to accrue on a fixed-income security
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestPaymentTerms
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasInterestPaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasInterestPaymentTerms
      namespace: fibo-sec-debdeb
      localName: hasInterestPaymentTerms
      label: has interest payment terms
      definition: indicates the specific terms related to interest payments on the principal as specified in the instrument
        or a related contract document
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestPaymentTerms
      inverseOf: ''
      characteristics: []
    hasNotificationProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasNotificationProvision
      namespace: fibo-sec-debdeb
      localName: hasNotificationProvision
      label: has notification provision
      definition: relates the redemption provision of a debt instrument to a notification provision (e.g., call or put notification)
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/RedemptionProvision
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/NotificationProvision
      inverseOf: ''
      characteristics: []
    hasPriceAndYieldDayCountConvention:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasPriceAndYieldDayCountConvention
      namespace: fibo-sec-debdeb
      localName: hasPriceAndYieldDayCountConvention
      label: has price and yield day count convention
      definition: indicates the convention used to determine the number of days in a month and days in a year that are counted
        when performing calculations for yield and price figures
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/DayCountConvention
      inverseOf: ''
      characteristics: []
    hasPutFeature:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasPutFeature
      namespace: fibo-sec-debdeb
      localName: hasPutFeature
      label: has put feature
      definition: indicates the specific terms related to any inherent put feature as specified in the offering/instrument
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/PutFeature
      inverseOf: ''
      characteristics: []
    hasRelativePriceAtIssue:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasRelativePriceAtIssue
      namespace: fibo-sec-debdeb
      localName: hasRelativePriceAtIssue
      label: has relative price at issue
      definition: indicates a relative price with respect to the face value at which an instrument is issued, namely par,
        premium or discount
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RelativePrice
      inverseOf: ''
      characteristics: []
    hasRelativePriceAtMaturity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasRelativePriceAtMaturity
      namespace: fibo-sec-debdeb
      localName: hasRelativePriceAtMaturity
      label: has relative price at maturity
      definition: indicates a relative price with respect to the face value at the time an instrument matures, namely par,
        discount or premium
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RelativePrice
      inverseOf: ''
      characteristics: []
    hasRelativePriceAtRedemption:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasRelativePriceAtRedemption
      namespace: fibo-sec-debdeb
      localName: hasRelativePriceAtRedemption
      label: has relative price at redemption
      definition: indicates a relative price with respect to the face value at the time an instrument is redeemed, namely
        par, discount or premium
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/RelativePrice
      inverseOf: ''
      characteristics: []
    hasRepaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/hasRepaymentTerms
      namespace: fibo-sec-debdeb
      localName: hasRepaymentTerms
      label: has repayment terms
      definition: indicates the specific terms related to repayment of principal as specified in the instrument or a related
        contract document
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/PrincipalRepaymentTerms
      inverseOf: ''
      characteristics: []
    isSubordinatedTo:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/isSubordinatedTo
      namespace: fibo-sec-debdeb
      localName: isSubordinatedTo
      label: is subordinated to
      definition: indicates the target security (i.e., the one in the range) has a higher priority than the security in question
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      inverseOf: ''
      characteristics: []
  attributeTypes:
    allowsAutoReinvestment:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/allowsAutoReinvestment
      namespace: fibo-sec-debdeb
      localName: allowsAutoReinvestment
      label: allows auto-reinvestment
      definition: indicates whether the security allows automatically re-investing the interest on that security towards purchasing
