domain:
  objectTypes:
    AmortizingBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/AmortizingBond
      namespace: fibo-sec-debbon
      localName: AmortizingBond
      label: amortizing bond
      definition: bond that regularly pays down the principal (face value) on the debt along with its interest expense over
        the life of the bond
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      attributeUses: []
      patternBindings: []
    Bond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      namespace: fibo-sec-debbon
      localName: Bond
      label: bond
      definition: tradable debt instrument representing a loan in which the issuer owes the holder(s) a debt
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidAtMaturity
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      attributeUses: []
      patternBindings: []
    BondAmortizationPaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondAmortizationPaymentTerms
      namespace: fibo-sec-debbon
      localName: BondAmortizationPaymentTerms
      label: bond amortization payment terms
      definition: terms that include a schedule for repayment of the principal over the lifetime of the bond, typically in
        equal payments at regular intervals
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondPrincipalRepaymentTerms
      attributeUses: []
      patternBindings: []
    BondConversionTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondConversionTerms
      namespace: fibo-sec-debbon
      localName: BondConversionTerms
      label: bond conversion terms
      definition: terms indicating when a convertible bond can be converted to another security (usually a publicly traded
        share issued by of the same issuer)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ConversionTerms
      attributeUses: []
      patternBindings: []
    BondCoupon:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondCoupon
      namespace: fibo-sec-debbon
      localName: BondCoupon
      label: bond coupon
      definition: interest rate on a debt security that the issuer promises to pay to the holder until maturity, expressed
        as an annual percentage of the face value
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/InterestRate
      attributeUses: []
      patternBindings: []
    BondInsurance:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondInsurance
      namespace: fibo-sec-debbon
      localName: BondInsurance
      label: bond insurance
      definition: insurance policy that a bond issuer purchases that guarantees the repayment of the principal and all associated
        interest payments to the bondholders in the event of default
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/InsurancePolicy
      attributeUses: []
      patternBindings: []
    BondPrincipalRepaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondPrincipalRepaymentTerms
      namespace: fibo-sec-debbon
      localName: BondPrincipalRepaymentTerms
      label: bond principal repayment terms
      definition: terms for the repayment of the principal on a bond
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/PrincipalRepaymentTerms
      attributeUses: []
      patternBindings: []
    BondRegistrar:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondRegistrar
      namespace: fibo-sec-debbon
      localName: BondRegistrar
      label: bond registrar
      definition: party responsible for maintaining records on behalf of the issuer that identify the owners of a registered
        bond issue
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/LegalAgent
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/Registrar
      attributeUses: []
      patternBindings: []
    BondVariableCoupon:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondVariableCoupon
      namespace: fibo-sec-debbon
      localName: BondVariableCoupon
      label: bond variable coupon
      definition: bond coupon that has a variable interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/VariableInterestRate
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondCoupon
      attributeUses: []
      patternBindings: []
    BondWithPartialCall:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondWithPartialCall
      namespace: fibo-sec-debbon
      localName: BondWithPartialCall
      label: bond with partial call
      definition: bond with a feature whereby the issue can be partially called for amounts that are at the discretion of
        the issuer
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CallableBond
      attributeUses: []
      patternBindings: []
    BondWithPublishedSinkingFund:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondWithPublishedSinkingFund
      namespace: fibo-sec-debbon
      localName: BondWithPublishedSinkingFund
      label: bond with published sinking fund
      definition: bond whereby amortization is via a known and published schedule
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/AmortizingBond
      attributeUses: []
      patternBindings: []
    BondWithWarrant:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondWithWarrant
      namespace: fibo-sec-debbon
      localName: BondWithWarrant
      label: bond with warrant
      definition: bond that is issued together with one or more warrant(s) attached as part of the offer, the warrant(s) granting
        the holder the right to purchase a designated security, often the common stock of the issuer of the debt, at a specified
        price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      attributeUses: []
      patternBindings: []
    BuildAmericaBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BuildAmericaBond
      namespace: fibo-sec-debbon
      localName: BuildAmericaBond
      label: Build America Bond
      definition: taxable municipal bond issued through December 31, 2010 under the American Recovery and Reinvestment Act
        of 2009 (ARRA)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/MunicipalBond
      attributeUses: []
      patternBindings: []
    BulletBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BulletBond
      namespace: fibo-sec-debbon
      localName: BulletBond
      label: bullet bond
      definition: bond whose entire principal value is paid on the maturity date, rather than amortized over its lifetime
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      attributeUses: []
      patternBindings: []
    BulletPrincipalRepaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BulletPrincipalRepaymentTerms
      namespace: fibo-sec-debbon
      localName: BulletPrincipalRepaymentTerms
      label: bond bullet principal repayment terms
      definition: terms for repayment of the principal for a bond as a single payment covering the whole principal amount
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondPrincipalRepaymentTerms
      attributeUses: []
      patternBindings: []
    CallableBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CallableBond
      namespace: fibo-sec-debbon
      localName: CallableBond
      label: callable bond
      definition: bond that includes a stipulation allowing the issuer the right to repurchase and retire the bond at the
        call price after the call protection period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      attributeUses: []
      patternBindings: []
    CallableConvertibleBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CallableConvertibleBond
      namespace: fibo-sec-debbon
      localName: CallableConvertibleBond
      label: callable convertible bond
      definition: convertible bond that is also callable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CallableBond
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/ConvertibleBond
      attributeUses: []
      patternBindings: []
    CertificateOfObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CertificateOfObligation
      namespace: fibo-sec-debbon
      localName: CertificateOfObligation
      label: certificate of obligation
      definition: municipal security available to governing councils in case of emergency, such as a natural disaster, that
        needs immediate action without time for voter referendum
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/MunicipalSecurity
      attributeUses: []
      patternBindings: []
    CertificateOfParticipation:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CertificateOfParticipation
      namespace: fibo-sec-debbon
      localName: CertificateOfParticipation
      label: certificate of participation
      definition: debt instrument evidencing a pro rata share in a specific pledged revenue stream, usually lease payments
        by the issuer that are typically subject to annual appropriation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      attributeUses: []
      patternBindings: []
    ConventionalGilt:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/ConventionalGilt
      namespace: fibo-sec-debbon
      localName: ConventionalGilt
      label: conventional gilt
      definition: fixed coupon bond issued by HM Treasury that guarantees to pay the holder of the gilt a fixed cash payment
        (coupon) every six months until the maturity date, at which point the holder receives the final coupon payment and
        the return of the principal
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FixedCouponBond
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/UKGovernmentSecurity
      attributeUses: []
      patternBindings: []
    ConvertibleBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/ConvertibleBond
      namespace: fibo-sec-debbon
      localName: ConvertibleBond
      label: convertible bond
      definition: bond that gives the holder the right to convert the bond into a fixed number of shares (conversion ratio)
        if the equity price rises above a specified level (strike price)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ConvertibleSecurity
      attributeUses: []
      patternBindings: []
    CorporateBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CorporateBond
      namespace: fibo-sec-debbon
      localName: CorporateBond
      label: corporate bond
      definition: bond issued by a company in order to raise financing
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      attributeUses: []
      patternBindings: []
    CouponPaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CouponPaymentTerms
      namespace: fibo-sec-debbon
      localName: CouponPaymentTerms
      label: coupon payment terms
      definition: terms for payment of interest on a bond
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestPaymentTerms
      attributeUses: []
      patternBindings: []
    EquityLinkedBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/EquityLinkedBond
      namespace: fibo-sec-debbon
      localName: EquityLinkedBond
      label: equity linked bond
      definition: bond based on the return on an equity over time, i.e. the price and dividend payments or the total return
        (similar to total return swaps)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/VariableCouponBond
      attributeUses: []
      patternBindings: []
    ExtraordinaryRedemptionProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/ExtraordinaryRedemptionProvision
      namespace: fibo-sec-debbon
      localName: ExtraordinaryRedemptionProvision
      label: extraordinary redemption provision
      definition: provision that gives a bond issuer the right to call its bonds due to an unusual one-time occurrence, as
        specified in the offering statement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/CallFeature
      attributeUses: []
      patternBindings: []
    FirstRegularCouponDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FirstRegularCouponDate
      namespace: fibo-sec-debbon
      localName: FirstRegularCouponDate
      label: first regular coupon date
      definition: scheduled date for the first regular coupon payment, in a regular repeating series of coupon periods, after
        any non standard (long or short) first coupon period in the schedule
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      attributeUses: []
      patternBindings: []
    FixedCouponBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FixedCouponBond
      namespace: fibo-sec-debbon
      localName: FixedCouponBond
      label: fixed coupon bond
      definition: bond whose coupon rate and principal amount are fixed at the time of origination or sale and remain constant
        while the security is outstanding
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/FixedIncomeSecurity
      attributeUses: []
      patternBindings: []
    FixedCouponTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FixedCouponTerms
      namespace: fibo-sec-debbon
      localName: FixedCouponTerms
      label: fixed coupon terms
      definition: terms for payment of interest on a bond with a fixed interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/CouponPaymentTerms
      attributeUses: []
      patternBindings: []
    FloatingRateNote:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FloatingRateNote
      namespace: fibo-sec-debbon
      localName: FloatingRateNote
      label: floating rate note
      definition: bond with a variable interest rate based on a published reference interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/VariableCouponBond
      attributeUses: []
      patternBindings: []
    FullFaithCreditBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FullFaithCreditBond
      namespace: fibo-sec-debbon
      localName: FullFaithCreditBond
      label: full faith credit bond
      definition: bond secured by an unconditional promise to pay by another entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/UnsecuredBond
      attributeUses: []
      patternBindings: []
    GeneralObligationMunicipalBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/GeneralObligationMunicipalBond
      namespace: fibo-sec-debbon
      localName: GeneralObligationMunicipalBond
      label: general obligation municipal bond
      definition: municipal bond that is backed by the full faith and credit and general resources of the issuing municipality,
        including its general taxing authority
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/FullFaithCreditBond
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/MunicipalBond
      attributeUses: []
      patternBindings: []
    GovernmentBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/GovernmentBond
      namespace: fibo-sec-debbon
      localName: GovernmentBond
      label: government bond
      definition: debt security issued by a government to fund government spending
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/GovernmentIssuedDebtSecurity
      attributeUses: []
      patternBindings: []
    GovernmentIssuedDebtSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/GovernmentIssuedDebtSecurity
      namespace: fibo-sec-debbon
      localName: GovernmentIssuedDebtSecurity
      label: government issued debt security
      definition: debt security issued by some government on behalf of some polity, including sovereign and municipal debt
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      attributeUses: []
      patternBindings: []
    GreenBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/GreenBond
      namespace: fibo-sec-debbon
      localName: GreenBond
      label: green bond
      definition: bond issued specifically to fund climate or environmental projects
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/Bond
      attributeUses: []
      patternBindings: []
    ImplicitFullFaithCreditBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/ImplicitFullFaithCreditBond
      namespace: fibo-sec-debbon
      localName: ImplicitFullFaithCreditBond
      label: implicit full faith credit bond
      definition: bond issued by a government sponsored agency or corporation rather than by the government directly
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/UnsecuredBond
      attributeUses: []
      patternBindings: []
    IndexLinkedBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/IndexLinkedBond
      namespace: fibo-sec-debbon
      localName: IndexLinkedBond
      label: index-linked bond
      definition: bond whose income may vary over time, because either the coupon rate or principal amount is related to a
        specific index, such as the Consumer Price Index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/VariableIncomeBond
      attributeUses: []
      patternBindings: []
    InflationLinkedBond:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/InflationLinkedBond
      namespace: fibo-sec-debbon
      localName: InflationLinkedBond
      label: inflation-linked bond
      definition: bond indexed to inflation so that the principal or interest payments rise and fall with the rate of inflation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/IndexLinkedBond
      attributeUses: []
      patternBindings: []
    LastRegularCouponDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/LastRegularCouponDate
      namespace: fibo-sec-debbon
      localName: LastRegularCouponDate
      label: last regular coupon date
      definition: scheduled date of the last regular coupon payment, that is the last of the payments that are made according
        to a regular repeating series of coupon periods, before any non-standard (long or short) final coupon period in the
        schedule
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
