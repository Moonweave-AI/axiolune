      localName: seniority
      label: seniority
      definition: 'The seniority which defines this tranche. This is the precedence order for scheduled payments. Further
        notes: Tranches are categorized as senior, mezzanine, and subordinated/equity, according to their degree of credit
        risk. If there are defaults or the CDO''s collateral otherwise underperforms, scheduled payments to senior tranches
        take precedence over those of mezzanine tranches, and scheduled payments to mezzanine tranches take precedence over
        those to subordinated/equity tranches. Senior and mezzanine tranches are typically rated, with the former receiving
        ratings of A to AAA and the latter receiving ratings of B to BBB. The ratings reflect both the credit quality of underlying
        collateral as well as how much protection a given tranch is afforded by tranches that are subordinate to it.'
