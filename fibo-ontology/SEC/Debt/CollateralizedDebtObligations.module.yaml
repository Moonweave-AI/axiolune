    CollateralizedDebtObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/CollateralizedDebtObligations/CollateralizedDebtObligation
      namespace: fibo-sec-debcol
      localName: CollateralizedDebtObligation
      label: collateralized debt obligation
      definition: 'structured finance constructed from a portfolio of fixed income assets including corporate loans and mortgage
        backed securities. A special purpose vehicle (SPV) issues notes to investors in order to raise funds that are invested
        in a portfolio of those fixed income assets, held by the SPV as collateral for the notes. Further notes: Collateralized
        Debt Obligation, for example, ABS CDO which consists of a portfolio of different ABS bonds, and the payments to the
        holders of these trust certificates are derived from the cash flows of the ABS bonds. This CDO instrument is part
        of a CDO issue, consisting of individual CDO instruments of a given seniority. Often referred to as tranches and slices
        (Investopedia). Investopedia: Similar in structure to a collateralized mortgage obligation (CMO) or collateralized
        bond obligation (CBO), CDOs are unique in that they represent different types of debt and credit risk. In the case
        of CDOs, these different types of debt are often referred to as ''tranches'' or ''slices''. Each slice has a different
        maturity and risk associated with it. The higher the risk, the more the CDO pays. Further details: Collateralized
        Debt obligations are securitized interests in pools of - generally non-mortgage - assets. Assets - called collateral
        - usually comprise loans or debt instruments. A CDO may be called a collateralized loan obligation (CLO) or collateralized
        bond obligation (CBO) if it holds only loans or bonds, respectively. Investors bear the credit risk of the collateral.
        Multiple tranches of securities are issued by the CDO, offering investors various maturity and credit risk characteristics.'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      attributeUses: []
      patternBindings: []
