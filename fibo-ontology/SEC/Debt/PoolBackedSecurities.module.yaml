  baseIri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/
  preferredPrefix: fibo-sec-debpoo
  version: '20250301'
  label: Pool-backed Securities Ontology
  definition: This ontology defines concepts that are common to asset-backed and mortgage-backed securities, including pools,
    as well as structured finance instruments.
  imports:
