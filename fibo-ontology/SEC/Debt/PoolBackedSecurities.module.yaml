  fiboDomain: SEC
domain:
  objectTypes:
    AbsolutePrepaymentRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/AbsolutePrepaymentRate
      namespace: fibo-sec-debpoo
      localName: AbsolutePrepaymentRate
      label: absolute prepayment rate
      definition: measure of the monthly rate of loan prepayments as a percentage of the original pool balance
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
    AssetBackedSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/AssetBackedSecurity
      namespace: fibo-sec-debpoo
      localName: AssetBackedSecurity
      label: asset-backed security
      definition: debt instrument backed by receivables other than those arising out of real estate loans or mortgages
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/PoolBackedSecurity
      attributeUses: []
      patternBindings: []
    AttachmentPoint:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/AttachmentPoint
      namespace: fibo-sec-debpoo
      localName: AttachmentPoint
      label: attachment point
      definition: lower tranche boundary of a tranche defined as a percentage of the value of the total pool of collateral,
        either at issuance or as of some point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/PercentageMonetaryAmount
      attributeUses: []
      patternBindings: []
    DebtPoolStatisticalMeasure:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      namespace: fibo-sec-debpoo
      localName: DebtPoolStatisticalMeasure
      label: debt pool statistical measure
      definition: qualified measure of some aspect of the behavior of one or more debt instrument(s) that may vary over time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/QualifiedMeasure
      attributeUses: []
      patternBindings: []
    DefaultRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DefaultRate
      namespace: fibo-sec-debpoo
      localName: DefaultRate
      label: default rate
      definition: qualified measure of the rate at which holders of the debt instruments in the pool default on those instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Ratio
      attributeUses: []
      patternBindings: []
    DetachmentPoint:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DetachmentPoint
      namespace: fibo-sec-debpoo
      localName: DetachmentPoint
      label: detachment point
      definition: upper tranche boundary of a tranche defined as a percentage of the value of the total pool of collateral,
        either at issuance or as of some point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/PercentageMonetaryAmount
      attributeUses: []
      patternBindings: []
    PoolBackedSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/PoolBackedSecurity
      namespace: fibo-sec-debpoo
      localName: PoolBackedSecurity
      label: pool-backed security
      definition: debt instrument that derives its cashflow from an underlying pool of mortgage loans or other receivables
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/TradableDebtInstrument
      attributeUses: []
      patternBindings: []
    PrepaymentSpeed:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/PrepaymentSpeed
      namespace: fibo-sec-debpoo
      localName: PrepaymentSpeed
      label: prepayment speed
      definition: estimated rate at which a debt or part of a debt is paid off ahead of schedule
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
    PrincipalProtectedNote:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/PrincipalProtectedNote
      namespace: fibo-sec-debpoo
      localName: PrincipalProtectedNote
      label: principal protected note
      definition: structured finance that offers investors exposure to chosen underlying assets using various approaches and
        asymmetric pay-off profiles
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      attributeUses: []
      patternBindings: []
    SingleMonthlyMortality:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/SingleMonthlyMortality
      namespace: fibo-sec-debpoo
      localName: SingleMonthlyMortality
      label: single monthly mortality
      definition: estimated per-month percentage of mortgages in an MBS pool that will be paid off early
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Percentage
      attributeUses: []
      patternBindings: []
    StructuredFinanceInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      namespace: fibo-sec-debpoo
      localName: StructuredFinanceInstrument
      label: structured finance instrument
      definition: pool-backed security wherein the risk associated with the pool has been uncoupled from the risk associated
        with the originating institution through a special purpose vehicle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/PoolBackedSecurity
      attributeUses: []
      patternBindings: []
    StructuredFinanceWithoutPrincipalProtection:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceWithoutPrincipalProtection
      namespace: fibo-sec-debpoo
      localName: StructuredFinanceWithoutPrincipalProtection
      label: structured finance without principal protection
      definition: structured finance that is a short-term note linked to an underlying asset that offers a steady stream of
        income
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      attributeUses: []
      patternBindings: []
    Tranche:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/Tranche
      namespace: fibo-sec-debpoo
      localName: Tranche
      label: tranche
      definition: segment of a pool of securities, typically debt instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      attributeUses: []
      patternBindings: []
    WeightedAverageCoupon:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/WeightedAverageCoupon
      namespace: fibo-sec-debpoo
      localName: WeightedAverageCoupon
      label: weighted average coupon
      definition: weighted-average gross interest rates of the pool of mortgages that underlie a mortgage-backed security
        (MBS) weighed by their balances at the time the securities were issued
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ArithmeticMean
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
    WeightedAverageLife:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/WeightedAverageLife
      namespace: fibo-sec-debpoo
      localName: WeightedAverageLife
      label: weighted average life
      definition: weighted average of the times of the principal repayments Average life is calculated using the weighted
        average time to the receipt of all future cash flows.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ArithmeticMean
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
    WeightedAverageLoanAge:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/WeightedAverageLoanAge
      namespace: fibo-sec-debpoo
      localName: WeightedAverageLoanAge
      label: weighted average loan age
      definition: dollar-weighted average measuring the age of the individual loans in a mortgage pass-through or pooled security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ArithmeticMean
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
    WeightedAverageMaturity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/WeightedAverageMaturity
      namespace: fibo-sec-debpoo
      localName: WeightedAverageMaturity
      label: weighted average maturity
      definition: weighted average amount of time until the maturities on mortgages in a mortgage-backed security (MBS)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ArithmeticMean
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
    WeightedAverageRemainingTerm:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/WeightedAverageRemainingTerm
      namespace: fibo-sec-debpoo
      localName: WeightedAverageRemainingTerm
      label: weighted average remaining term
      definition: weighted average time to maturity of a portfolio of asset-backed securities (ABS) or mortgage-backed (MBS)
        securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ArithmeticMean
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DebtPoolStatisticalMeasure
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasAttachmentPoint:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/hasAttachmentPoint
      namespace: fibo-sec-debpoo
      localName: hasAttachmentPoint
      label: has attachment point
      definition: indicates the minimum (lower boundary) of the total value of the underlying collateral, either at issuance
        or as of some point in time, at which point a given tranche becomes liable for losses
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/AttachmentPoint
      inverseOf: ''
      characteristics: []
    hasDetachmentPoint:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/hasDetachmentPoint
      namespace: fibo-sec-debpoo
      localName: hasDetachmentPoint
      label: has detachment point
      definition: indicates the maximum (upper boundary) of the total value of the underlying collateral, either at issuance
        or as of some point in time, at which point the value of given tranche is wiped out
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/DetachmentPoint
      inverseOf: ''
      characteristics: []
    hasEstimatedTotalCollateralValueAtIssuance:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/hasEstimatedTotalCollateralValueAtIssuance
      namespace: fibo-sec-debpoo
      localName: hasEstimatedTotalCollateralValueAtIssuance
      label: is estimated value of
      definition: indicates the estimated value of the combined underlying collateral for a given tranche at the time the
        instrument was issued
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CollateralValueAsOfDate
      inverseOf: ''
      characteristics: []
  attributeTypes:
    isPassThrough:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/isPassThrough
      namespace: fibo-sec-debpoo
      localName: isPassThrough
      label: is pass through
      definition: indicates whether the cash flows from the underlying asset pool are passed through to the investor by way
        of redemption payments
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
