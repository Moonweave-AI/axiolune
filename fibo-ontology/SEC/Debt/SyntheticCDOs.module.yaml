      namespace: fibo-sec-debsyn
      localName: percentageOfDefaultsThisTranche
      label: percentage of defaults this tranche
      definition: 'The percentage of defaults which holders of this are exposed to, that is the percentage of defaults that
        this tranche represents. Further Notes Review session notes 21 April: The first, second and so on, to stop paying
        out when there is a default. In each case you get the first, second etc. x% of defaults. Base underlying may be high
        or low quality. Create the pool by buying or selling protection depending on hich way you want to go, e..g. have high
        quality funds, (borrowers), would sell protection. If low quality, would buy protection to improve quality. So risk
        is no longer bound to the funding. REVIEW: More likely this is a band of percentages (from and to); review and formalize.
        See also note on attachment and detachment points.'
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/SyntheticCDOs/SyntheticCDOTranche
