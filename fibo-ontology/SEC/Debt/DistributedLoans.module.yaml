domain:
  objectTypes:
    AdministrativeAgent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/AdministrativeAgent
      namespace: fibo-sec-debdis
      localName: AdministrativeAgent
      label: administrative agent
      definition: role of a financial institution (often one of the primary lenders in the syndicate) designated to act as
        an intermediary between the borrowers and the syndicate lenders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/SyndicateMember
      attributeUses: []
      patternBindings: []
    Bookrunner:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/Bookrunner
      namespace: fibo-sec-debdis
      localName: Bookrunner
      label: bookrunner
      definition: financial institution (typically a commercial or investment bank) responsible for coordinating the arrangement,
        structuring, and marketing of the loan to potential lenders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    DocumentationAgent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/DocumentationAgent
      namespace: fibo-sec-debdis
      localName: DocumentationAgent
      label: documentation agent
      definition: financial institution designated to oversee the drafting, negotiation, and finalization of the loan documentation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/SyndicateMember
      attributeUses: []
      patternBindings: []
    FinanceSyndicate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/FinanceSyndicate
      namespace: fibo-sec-debdis
      localName: FinanceSyndicate
      label: finance syndicate
      definition: group of financial institutions or lenders that collectively agree to provide funding for a large loan to
        a single borrower
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/Syndicate
      attributeUses: []
      patternBindings: []
    FinanceSyndicateMember:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/FinanceSyndicateMember
      namespace: fibo-sec-debdis
      localName: FinanceSyndicateMember
      label: finance syndicate member
      definition: syndicate member that is a financial services provider that contributes funds to a syndicated loan or loan
        participation note
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/SyndicateMember
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    LeadArranger:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/LeadArranger
      namespace: fibo-sec-debdis
      localName: LeadArranger
      label: lead arranger
      definition: financial institution that spearheads the loan structuring and syndication process on behalf of the borrower
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    LoanParticipationNote:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/LoanParticipationNote
      namespace: fibo-sec-debdis
      localName: LoanParticipationNote
      label: loan participation note
      definition: credit facility and fixed-income security that may be distributed across a group of lenders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditFacility
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CommercialLoans/CommercialLoan
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/FixedIncomeSecurity
      attributeUses: []
      patternBindings: []
    SyndicatedLoan:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/SyndicatedLoan
      namespace: fibo-sec-debdis
      localName: SyndicatedLoan
      label: syndicated loan
      definition: credit agreement in which a group of lenders, known as a syndicate, collectively provides a large loan to
        a single borrower
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditFacility
      - https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CommercialLoans/CommercialLoan
      attributeUses: []
      patternBindings: []
    SyndicationAgent:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DistributedLoans/SyndicationAgent
      namespace: fibo-sec-debdis
      localName: SyndicationAgent
      label: syndication agent
      definition: financial institution (typically a commercial or investment bank) designated to help structure, arrange,
        and manage the loan syndication process
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
