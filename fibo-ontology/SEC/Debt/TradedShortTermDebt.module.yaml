domain:
  objectTypes:
    BankersAcceptance:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/BankersAcceptance
      namespace: fibo-sec-debtra
      localName: BankersAcceptance
      label: bankers' acceptance
      definition: short-term debt instrument that is guaranteed and paid by a bank and used as a relatively safe form of payment
        for large transactions
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/BillOfExchange
      attributeUses: []
      patternBindings: []
    BillOfExchange:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/BillOfExchange
      namespace: fibo-sec-debtra
      localName: BillOfExchange
      label: bill of exchange
      definition: short-term negotiable financial instrument consisting of an order in writing addressed by one person (the
        seller of goods) to another (the buyer), requiring the latter to pay a fixed amount of money on demand (a sight draft)
        or on a predetermined date (a time draft)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/MoneyMarketInstrument
      attributeUses: []
      patternBindings: []
    CommercialPaper:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/CommercialPaper
      namespace: fibo-sec-debtra
      localName: CommercialPaper
      label: commercial paper
      definition: an unsecured short-term debt instrument typically issued by a bank, corporation, or foreign government to
        obtain funds to meet short-term debt obligations, such as accounts receivable, inventories, or payroll, backed only
        by an issuing bank or company promise to pay the face amount on the maturity date specified on the note
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/MoneyMarketInstrument
      attributeUses: []
      patternBindings: []
    Drawee:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/Drawee
      namespace: fibo-sec-debtra
      localName: Drawee
      label: drawee
      definition: party that is required to pay the amount stated on the bill of exchange to the payee
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payer
      attributeUses: []
      patternBindings: []
    Drawer:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/Drawer
      namespace: fibo-sec-debtra
      localName: Drawer
      label: drawer
      definition: party that requires a drawee to pay either a third party or themselves with respect to a bill of exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligee
      attributeUses: []
      patternBindings: []
    EurodollarDeposit:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/EurodollarDeposit
      namespace: fibo-sec-debtra
      localName: EurodollarDeposit
      label: eurodollar deposit
      definition: a certificate of deposit with a fixed interest rate issued in U.S. dollars outside the jurisdiction of the
        Federal Reserve, held at banks outside of the United States, including branches of U.S. banks located outside of the
        U.S.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/CertificateOfDeposit
      attributeUses: []
      patternBindings: []
    MoneyMarketInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/MoneyMarketInstrument
      namespace: fibo-sec-debtra
      localName: MoneyMarketInstrument
      label: money market instrument
      definition: a short-term debt security that gives the owner the unconditional right to receive a stated, fixed sum of
        money on a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/FixedIncomeSecurity
      attributeUses: []
      patternBindings: []
    RepurchaseAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/RepurchaseAgreement
      namespace: fibo-sec-debtra
      localName: RepurchaseAgreement
      label: repurchase agreement
      definition: agreement between two parties whereby one party lends the other a security at a specified price with a commitment
        to take the security back at a later date for another specified price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/TradedShortTermDebt/MoneyMarketInstrument
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
