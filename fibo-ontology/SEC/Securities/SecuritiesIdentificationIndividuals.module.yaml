domain:
  objectTypes:
    CUSIPInternationalNumberingSystemNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/CUSIPInternationalNumberingSystemNumber
      namespace: fibo-sec-secsec
      localName: CUSIPInternationalNumberingSystemNumber
      label: CUSIP International Numbering System (CINS) number
      definition: 9-character alphanumeric identifier that employs the same 9 characters as CUSIP, but also contains a letter
        of the alphabet in the first position signifying the issuer's country or geographic region, issued by CUSIP Global
        Services
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegisteredIdentifier
      attributeUses: []
      patternBindings: []
    CommitteeOnUniformSecuritiesIdentificationProceduresNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/CommitteeOnUniformSecuritiesIdentificationProceduresNumber
      namespace: fibo-sec-secsec
      localName: CommitteeOnUniformSecuritiesIdentificationProceduresNumber
      label: Committee on Uniform Securities Identification Procedures (CUSIP) number
      definition: nine-character alphanumeric number that identifies all North American stocks and registered bonds for the
        purposes of facilitating clearing and settlement of trades, issued by CUSIP Global Services on behalf of the American
        Bankers' Association, which is a part of Standard and Poor's Capital IQ, that is the National Numbering Agency Identifier
        for securities issued in North America, which is also part of the ISIN for the security it identifies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/NationalSecuritiesIdentifyingNumber
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegisteredIdentifier
      attributeUses: []
      patternBindings: []
    CommonCodeRegistryEntry:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/CommonCodeRegistryEntry
      namespace: fibo-sec-secsec
      localName: CommonCodeRegistryEntry
      label: common code registry entry
      definition: entry in a common code registry
      superTypes:
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistryEntry
      attributeUses: []
      patternBindings: []
    EuroclearClearstreamCommonCode:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/EuroclearClearstreamCommonCode
      namespace: fibo-sec-secsec
      localName: EuroclearClearstreamCommonCode
      label: Euroclear Clearstream common code
      definition: nine-character alphanumeric securities identifier, issued in Luxembourg, jointly by Euroclear and Clearstream
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegisteredIdentifier
      attributeUses: []
      patternBindings: []
    FinancialInstrumentGlobalIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/FinancialInstrumentGlobalIdentifier
      namespace: fibo-sec-secsec
      localName: FinancialInstrumentGlobalIdentifier
      label: financial instrument global identifier
      definition: financial instrument identifier that is defined as specified in the Object Management Group (OMG) Financial
        Instrument Global Identifier (FIGI) Specification
      superTypes:
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegisteredIdentifier
      attributeUses: []
      patternBindings: []
    FinancialInstrumentGlobalIdentifierRegistryEntry:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/FinancialInstrumentGlobalIdentifierRegistryEntry
      namespace: fibo-sec-secsec
      localName: FinancialInstrumentGlobalIdentifierRegistryEntry
      label: Financial Instrument Global Identifier (FIGI) registry entry
      definition: entry in a Financial Instrument Global Identifier (FIGI) registry
      superTypes:
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistryEntry
      attributeUses: []
      patternBindings: []
    RefinitivInstrumentCode:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/RefinitivInstrumentCode
      namespace: fibo-sec-secsec
      localName: RefinitivInstrumentCode
      label: Refinitiv instrument code
      definition: proprietary code for financial instruments and indices owned, managed, and distributed by the London Stock
        Exchange Group's LSEG Financial Solutions (branded as Refinitiv)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      attributeUses: []
      patternBindings: []
    StockExchangeDailyOfficialListCode:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/StockExchangeDailyOfficialListCode
      namespace: fibo-sec-secsec
      localName: StockExchangeDailyOfficialListCode
      label: Stock Exchange Daily Official List (SEDOL) code
      definition: seven-character security identifier, issued by the London Stock Exchange, that is the National Securities
        Identifying Number (NSIN) for securities issued in the United Kingdom, which is also part of the ISIN for the security
        it identifies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ListedSecurityIdentifier
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/NationalSecuritiesIdentifyingNumber
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      attributeUses: []
      patternBindings: []
    TelekursId:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/TelekursId
      namespace: fibo-sec-secsec
      localName: TelekursId
      label: Telekurs Id
      definition: identifier used to identify financial instruments owned, managed, and distributed by SIX Financial Information
        (formerly Telekurs AG and subsequently SIX Telekurs Ltd.)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      attributeUses: []
      patternBindings: []
    Valoren:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentificationIndividuals/Valoren
      namespace: fibo-sec-secsec
      localName: Valoren
      label: Valoren
      definition: identification number assigned to financial instruments in Switzerland, Liechtenstein and Belgium, issued
        by SIX Financial Information, that is the National Securities Identifying Number (NSIN) for securities issued in those
        countries and is also part of the ISIN for the security it identifies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ListedSecurityIdentifier
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/NationalSecuritiesIdentifyingNumber
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/ProprietarySecurityIdentifier
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
