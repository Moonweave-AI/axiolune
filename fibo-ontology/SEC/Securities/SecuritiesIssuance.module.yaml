      attributeUses: []
      patternBindings: []
    Issuer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Issuer
      namespace: fibo-sec-secsec
      localName: Issuer
      label: Issuer
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    Security:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      namespace: fibo-sec-secsec
      localName: Security
      label: Security
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    BestEffortsOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/BestEffortsOffering
      namespace: fibo-sec-secsec
      localName: BestEffortsOffering
      label: best efforts offering
      definition: securities offering whereby investment bankers commit to doing their best to sell the securities offered,
        but do not assume the full risk of an underwriter
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      attributeUses: []
      patternBindings: []
    ConversionTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ConversionTerms
      namespace: fibo-sec-secsec
      localName: ConversionTerms
      label: conversion terms
      definition: contract terms specifying when and how a security may be converted to another security (usually of the same
        issuer)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/RedemptionProvision
      attributeUses: []
      patternBindings: []
    ConvertibleSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ConvertibleSecurity
      namespace: fibo-sec-secsec
      localName: ConvertibleSecurity
      label: convertible security
      definition: security that can be converted into another security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      attributeUses: []
      patternBindings: []
    ExemptIssuer:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ExemptIssuer
      namespace: fibo-sec-secsec
      localName: ExemptIssuer
      label: exempt issuer
      definition: issuer that issues securities that are excused from certain regulatory reporting requirements
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Issuer
      attributeUses: []
      patternBindings: []
    ExemptOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ExemptOffering
      namespace: fibo-sec-secsec
      localName: ExemptOffering
      label: exempt offering
      definition: public offering involving securities that are excused from certain regulatory reporting requirements
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/PublicOffering
      attributeUses: []
      patternBindings: []
    ExemptTransaction:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ExemptTransaction
      namespace: fibo-sec-secsec
      localName: ExemptTransaction
      label: exempt transaction
      definition: securities transaction for which there is no requirement to register the transaction with a regulatory agency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/SecuritiesTransaction
      attributeUses: []
      patternBindings: []
    FinancialInstrumentShortName:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/FinancialInstrumentShortName
      namespace: fibo-sec-secsec
      localName: FinancialInstrumentShortName
      label: financial instrument short name
      definition: abbreviated name for a financial instrument within a defined structure as specified in ISO 18774
      superTypes:
      - https://www.omg.org/spec/Commons/Identifiers/Identifier
      attributeUses: []
      patternBindings: []
    FirmCommitmentOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/FirmCommitmentOffering
      namespace: fibo-sec-secsec
      localName: FirmCommitmentOffering
      label: firm commitment offering
      definition: securities offering whereby the underwriter purchases the securities outright for their own account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      attributeUses: []
      patternBindings: []
    OfferingDocument:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/OfferingDocument
      namespace: fibo-sec-secsec
      localName: OfferingDocument
      label: offering document
      definition: legal document that states the objectives, risks and terms of an investment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publication
      - https://www.omg.org/spec/Commons/Documents/LegalDocument
      attributeUses: []
      patternBindings: []
    OfferingStatement:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/OfferingStatement
      namespace: fibo-sec-secsec
      localName: OfferingStatement
      label: offering statement
      definition: offering memorandum that conforms to Regulation A, Offering Statement, of the Securities Act of 1933
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/OfferingDocument
      attributeUses: []
      patternBindings: []
    PrivateOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/PrivateOffering
      namespace: fibo-sec-secsec
      localName: PrivateOffering
      label: private offering
      definition: offering of securities made privately to a limited number of qualified potential investors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      attributeUses: []
      patternBindings: []
    PrivatePlacementMemorandum:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/PrivatePlacementMemorandum
      namespace: fibo-sec-secsec
      localName: PrivatePlacementMemorandum
      label: private placement memorandum
      definition: legal document stating the objectives, risks and terms of investment involved with a private placement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/OfferingDocument
      attributeUses: []
      patternBindings: []
    Prospectus:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/Prospectus
      namespace: fibo-sec-secsec
      localName: Prospectus
      label: prospectus
      definition: formal, written offering document to sell securities that provides the facts an investor needs to make an
        informed investment decision
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/OfferingDocument
      attributeUses: []
      patternBindings: []
    PublicOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/PublicOffering
      namespace: fibo-sec-secsec
      localName: PublicOffering
      label: public offering
      definition: offering of securities for sale to the investment public, after compliance with registration requirements
        of the relevant regulatory authorities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      attributeUses: []
      patternBindings: []
    SecuritiesOffering:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      namespace: fibo-sec-secsec
      localName: SecuritiesOffering
      label: securities offering
      definition: offering of a security (or securities) for sale
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Offering
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Agreement
      attributeUses: []
      patternBindings: []
    SecurityForm:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecurityForm
      namespace: fibo-sec-secsec
      localName: SecurityForm
      label: security form
      definition: nature of the proof of ownership of a security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractDocument
      attributeUses: []
      patternBindings: []
    SecurityUnderwriter:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecurityUnderwriter
      namespace: fibo-sec-secsec
      localName: SecurityUnderwriter
      label: security underwriter
      definition: party that has purchased from an issuer with a view to, or sells for an issuer in connection with, the distribution
        of any security, or participates or has a direct or indirect participation in any such undertaking, or participates
        or has a participation in the direct or indirect underwriting of any such undertaking
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Underwriter
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ThirdPartyAgent
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractThirdParty
      attributeUses: []
      patternBindings: []
    SecurityUnderwritingArrangement:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecurityUnderwritingArrangement
      namespace: fibo-sec-secsec
      localName: SecurityUnderwritingArrangement
      label: security underwriting arrangement
      definition: underwriting agreement between an organization (typically an investment bank) and a securities issuer that
        commits the underwriter to assuming risk involved in buying a new issue of securities and reselling it to the public
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/UnderwritingArrangement
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasActualClosingDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasActualClosingDate
      namespace: fibo-sec-secsec
      localName: hasActualClosingDate
      label: has actual closing date
      definition: indicates the date on which an offering or transaction officially closes, in contrast with an intended closing
        date
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasAnnouncementDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasAnnouncementDate
      namespace: fibo-sec-secsec
      localName: hasAnnouncementDate
      label: has announcement date
      definition: indicates the first day the public will receive information regarding a new security issue
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/Date
      inverseOf: ''
      characteristics: []
    hasFinancialInstrumentShortName:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasFinancialInstrumentShortName
      namespace: fibo-sec-secsec
      localName: hasFinancialInstrumentShortName
      label: has financial instrument short name
      definition: relates a security to its ISO 18774-compliant short name, which includes an issuer short name, abbreviated
        instrument characteristics, and abbreviated instrument description per the ISO standard
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/FinancialInstrumentShortName
      inverseOf: ''
      characteristics: []
    hasFirstTradeDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasFirstTradeDate
      namespace: fibo-sec-secsec
      localName: hasFirstTradeDate
      label: has first trade date
      definition: indicates the date on which a newly issued security starts trading
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasFirstTradeSettlementDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasFirstTradeSettlementDate
      namespace: fibo-sec-secsec
      localName: hasFirstTradeSettlementDate
      label: has first trade settlement date
      definition: indicates the date on which the first trade of a newly issued security is settled
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/Date
      inverseOf: ''
      characteristics: []
    hasSubscriptionPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasSubscriptionPeriod
      namespace: fibo-sec-secsec
      localName: hasSubscriptionPeriod
      label: has subscription period
      definition: indicates a period of time in which investors can commit to purchase shares (or units) to be issued
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      inverseOf: ''
      characteristics: []
    isIssuedInForm:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/isIssuedInForm
      namespace: fibo-sec-secsec
      localName: isIssuedInForm
      label: is issued in form
      definition: indicates the form in which the security is issued, typically in registered form
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecurityForm
      inverseOf: ''
      characteristics: []
    isRegisteredWith:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/isRegisteredWith
      namespace: fibo-sec-secsec
      localName: isRegisteredWith
      label: is registered
      definition: indicates the registration authority for a given security, i.e., in the name of the owner on the books of
        the issuer, with the issuer's registrar, with a third-party transfer agent, with a broker-dealer, or other competent
        party
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      range: https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistrationAuthority
      inverseOf: ''
      characteristics: []
    isUnderwrittenBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/isUnderwrittenBy
      namespace: fibo-sec-secsec
      localName: isUnderwrittenBy
      label: is underwritten by
      definition: relates an offering to an underwriter involved in raising capital for or distributing the instruments that
        are the subject of the offering
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Underwriter
      inverseOf: ''
      characteristics: []
    specifiesConversionInto:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/specifiesConversionInto
      namespace: fibo-sec-secsec
      localName: specifiesConversionInto
      label: specifies conversion into
      definition: specifies a security that will replace a convertible security under the terms of the agreement
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/ConversionTerms
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      inverseOf: ''
      characteristics: []
    underwrites:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/underwrites
      namespace: fibo-sec-secsec
      localName: underwrites
      label: underwrites
      definition: identifies one or more underwriters involved in raising capital for or distributing the instruments that
        are the subject of the offering
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Underwriter
      range: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/SecuritiesOffering
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/isUnderwrittenBy
      characteristics: []
  attributeTypes:
    hasInstrumentDescription:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasInstrumentDescription
      namespace: fibo-sec-secsec
      localName: hasInstrumentDescription
      label: has instrument description
      definition: relates a financial instrument or FISN to an ISO 18774-compliant instrument description, that is, a collection
        of characteristics and attributes defining a financial instrument with a maximum length up to 19 alphanumeric characters
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasIssuerShortName:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasIssuerShortName
      namespace: fibo-sec-secsec
      localName: hasIssuerShortName
      label: has issuer short name
      definition: relates a security issuer or FISN to an ISO 18774-compliant issuer short name, that is, an abbreviation
        of the official issuer name, limited to a maximum of 15 alphanumeric characters
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasSeries:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasSeries
      namespace: fibo-sec-secsec
      localName: hasSeries
      label: has series
      definition: indicates the series identified by the issuer in the event that the instrument is issued in several series
        (also known as tranches)
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasSubscriptionAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/hasSubscriptionAmount
      namespace: fibo-sec-secsec
      localName: hasSubscriptionAmount
      label: has subscription amount
      definition: indicates a number of shares or units
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: null
    isOverAllotted:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/isOverAllotted
      namespace: fibo-sec-secsec
      localName: isOverAllotted
      label: is over-allotted
      definition: indicates whether or not the subscription is over-subscribed
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
