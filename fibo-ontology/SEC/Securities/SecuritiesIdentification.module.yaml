      localName: ProprietarySecurityIdentificationScheme
      label: proprietary security identification scheme
      definition: security identification scheme published by a commercial entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/SecurityIdentificationScheme
      attributeUses: []
      patternBindings: []
