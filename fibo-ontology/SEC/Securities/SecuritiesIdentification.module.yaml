      namespace: fibo-sec-secsec
      localName: NationalSecuritiesIdentifyingNumber
      label: National Securities Identifying Number
      definition: generic, nine-digit alpha numeric code which identifies a fungible security, assigned by a national numbering
        agency under the ISO 6166 standard
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/SecurityIdentifier
      attributeUses: []
      patternBindings: []
