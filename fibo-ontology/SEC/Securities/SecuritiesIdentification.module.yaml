      namespace: fibo-sec-secsec
      localName: InternationalSecuritiesIdentificationNumber
      label: international securities identification number
      definition: security identifier that is defined as specified in ISO 6166, Securities and related financial instruments
        -- International securities identification numbering system (ISIN)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/SecurityIdentifier
      - https://www.omg.org/spec/Commons/ContextualIdentifiers/StructuredIdentifier
      attributeUses: []
      patternBindings: []
