      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/InternationalSecuritiesIdentificationNumberingScheme
      namespace: fibo-sec-secsec
      localName: InternationalSecuritiesIdentificationNumberingScheme
      label: international securities identification numbering scheme
      definition: formal definition of the structure and application of a ISINs as defined in ISO 6166
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIdentification/SecurityIdentificationScheme
      attributeUses: []
      patternBindings: []
    ListedSecurityIdentifier:
