      definition: trading date rule defined as the last trading day / expiration day of the Canadian Derivatives Exchange
        (Bourse do Montreal Inc.), three month Bankers' Acceptance Futures (Ticker symbol BAX), the second London banking
        day prior to the third Wednesday of the contract month
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/ParametricSchedules/TradingDateRule
      attributeUses: []
