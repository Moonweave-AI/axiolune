  preferredPrefix: fibo-sec-secsec
  version: '20251201'
  label: Securities Listings Ontology
  definition: This ontology defines the fundamental concepts for listing securities, such as registered, listed, and exchange-traded
    security, the notion of a securities exchange, and related services.
