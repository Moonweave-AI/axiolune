    BlueSkyLaw:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/NorthAmericanSecurities/USSecuritiesRestrictions/BlueSkyLaw
      namespace: fibo-sec-secnor
      localName: BlueSkyLaw
      label: blue sky law
      definition: state-level securities regulation, designed to protect investors against securities fraud that require issuers
        to be registered and to disclose details of their offerings
