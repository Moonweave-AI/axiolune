      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/NorthAmericanSecurities/USSecuritiesRestrictions/isEmployeeRetirementIncomeSecurityActConformant
      namespace: fibo-sec-secnor
      localName: isEmployeeRetirementIncomeSecurityActConformant
      label: is Employee Retirement Income Security Act conformant
      definition: indicates whether the security conforms to the Employee Retirement Income Security Act (ERISA) of 1974,
