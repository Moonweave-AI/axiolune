  preferredPrefix: fibo-sec-equdep
  version: '20230301'
  label: Depositary Receipts
  definition: Depositary receipts are certificates which represent ownership of some underlying security. They are issued
    by a bank and give the holder the ability to participate in the returns on an instrument that they may not be able to
    hold directly.
