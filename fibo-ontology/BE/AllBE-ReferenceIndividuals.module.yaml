  label: Business Entities Domain, Reference Individuals
  definition: "This ontology provides metadata about the FIBO Business Entities (BE) Domain, which covers defines business\
    \ concepts that are used for data governance, interoperability, and in regulatory reporting about business entities.\n\
    \nThe business scope of the BE ontologies covers a range of business and legal entities that are considered by financial\
    \ industry firms, regulators and other industry participants to be of relevance in the financial services domain, including:\n\
    \ - Legal entities generally\n - Corporate structure, ownership and control, including primary executive roles for businesses,\n\
    \ - Functional entities such as governments and government entities, non-governmental organizations, international organizations,\
    \ not-for-profit organization, etc.\n - Concepts specific to corporations, partnerships, private limited companies, sole\
    \ proprietorships, and trusts."
