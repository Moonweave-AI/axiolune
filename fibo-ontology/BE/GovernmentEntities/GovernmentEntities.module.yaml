domain:
  objectTypes:
    BranchOfGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/BranchOfGovernment
      namespace: fibo-be-govgov
      localName: BranchOfGovernment
      label: branch of government
      definition: division of the government of a state, with separate and independent powers and areas of responsibility
        so that the powers of one branch are not in conflict with the powers associated with the other branches
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentBody
      attributeUses: []
      patternBindings: []
    DevolvedGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/DevolvedGovernment
      namespace: fibo-be-govgov
      localName: DevolvedGovernment
      label: devolved government
      definition: government and the politicians that that run a subnational territory with powers that may be temporary and
        reversible, ultimately residing with the central government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      attributeUses: []
      patternBindings: []
    ExecutiveBranch:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/ExecutiveBranch
      namespace: fibo-be-govgov
      localName: ExecutiveBranch
      label: executive branch
      definition: the branch of government that is authorized and responsible for the daily administration of the government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/BranchOfGovernment
      attributeUses: []
      patternBindings: []
    FederalGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/FederalGovernment
      namespace: fibo-be-govgov
      localName: FederalGovernment
      label: federal government
      definition: union of states under a central government distinct from the individual governments of the separate states
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/NationalGovernment
      attributeUses: []
      patternBindings: []
    FederatedSovereignty:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/FederatedSovereignty
      namespace: fibo-be-govgov
      localName: FederatedSovereignty
      label: federated sovereignty
      definition: polity characterized by a union of partially self-governing states or regions under a central (federal)
        government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/SovereignState
      attributeUses: []
      patternBindings: []
    Government:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      namespace: fibo-be-govgov
      localName: Government
      label: government
      definition: system by which a state or community is controlled
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/FunctionalEntity
      attributeUses: []
      patternBindings: []
    GovernmentAgency:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentAgency
      namespace: fibo-be-govgov
      localName: GovernmentAgency
      label: government agency
      definition: permanent or semi-permanent organization, often an appointed commission, in the machinery of government
        that is responsible for the oversight and administration of specific functions
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentBody
      attributeUses: []
      patternBindings: []
    GovernmentAppointee:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentAppointee
      namespace: fibo-be-govgov
      localName: GovernmentAppointee
      label: government appointee
      definition: individual designated by government decree to lead, or participate in some capacity in a government body
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentOfficial
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/Executives/Executive
      attributeUses: []
      patternBindings: []
    GovernmentBody:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentBody
      namespace: fibo-be-govgov
      localName: GovernmentBody
      label: government body
      definition: formal organization that is an agency, instrumentality, or other body of a supranational, national, federal,
        state, or local government, including certain multijurisdictional agencies and departments that carry out the business
        of government
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/FormalOrganization
      attributeUses: []
      patternBindings: []
    GovernmentDepartment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentDepartment
      namespace: fibo-be-govgov
      localName: GovernmentDepartment
      label: government department
      definition: specialized organization responsible for a sector of government public administration
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentBody
      attributeUses: []
      patternBindings: []
    GovernmentMinister:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentMinister
      namespace: fibo-be-govgov
      localName: GovernmentMinister
      label: government minister
      definition: government official that is an executive, who is either appointed or elected to a high office in the government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentOfficial
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/Executives/Executive
      attributeUses: []
      patternBindings: []
    GovernmentOfficial:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentOfficial
      namespace: fibo-be-govgov
      localName: GovernmentOfficial
      label: government official
      definition: person elected or appointed to administer some aspect of a government
      superTypes:
      - https://www.omg.org/spec/Commons/BusinessAuthorizations/ResponsibleParty
      attributeUses: []
      patternBindings: []
    Instrumentality:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Instrumentality
      namespace: fibo-be-govgov
      localName: Instrumentality
      label: instrumentality
      definition: organization that serves a public purpose and is closely tied to a government, but is not a government agency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentBody
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    Judiciary:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Judiciary
      namespace: fibo-be-govgov
      localName: Judiciary
      label: judiciary
      definition: branch of government that comprises the system of courts that interprets and applies the law in the name
        of the supranational, national, federal, or regional government, depending on its jurisdiction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/BranchOfGovernment
      attributeUses: []
      patternBindings: []
    Legislature:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Legislature
      namespace: fibo-be-govgov
      localName: Legislature
      label: legislature
      definition: the law-making body of a political unit, usually a national government, that has power to enact, amend,
        and repeal public policy
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/BranchOfGovernment
      attributeUses: []
      patternBindings: []
    MunicipalEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/MunicipalEntity
      namespace: fibo-be-govgov
      localName: MunicipalEntity
      label: municipal entity
      definition: polity that typically represents a city, township, or other administrative subdivision having corporate
        status and powers of self-government or jurisdiction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      attributeUses: []
      patternBindings: []
    MunicipalGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/MunicipalGovernment
      namespace: fibo-be-govgov
      localName: MunicipalGovernment
      label: municipal government
      definition: regional government of a city, township, or other administrative subdivision
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      attributeUses: []
      patternBindings: []
    NationalGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/NationalGovernment
      namespace: fibo-be-govgov
      localName: NationalGovernment
      label: national government
      definition: government and the politicians that that run a country as a whole (as opposed to local government)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      attributeUses: []
      patternBindings: []
    Polity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      namespace: fibo-be-govgov
      localName: Polity
      label: polity
      definition: legal person that is a supranational entity, crown, state, or subordinate civil authority, such as a province,
        prefecture, county, municipality, city, or district representing the people of that entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/GovernmentBody
      - https://www.omg.org/spec/Commons/Organizations/LegalPerson
      attributeUses: []
      patternBindings: []
    RegionalGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/RegionalGovernment
      namespace: fibo-be-govgov
      localName: RegionalGovernment
      label: regional government
      definition: administrative body for a geographic area, such as a county, smaller town, or other similar community
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      attributeUses: []
      patternBindings: []
    RegionalSovereignty:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/RegionalSovereignty
      namespace: fibo-be-govgov
      localName: RegionalSovereignty
      label: regional sovereignty
      definition: legal person that corresponds to an administrative division, administrative unit, administrative entity
        or country subdivision (or, sometimes, geopolitical division or subnational entity), that has the capacity to incur
        debt, issue contracts, and enter into relations with other similar entities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      attributeUses: []
      patternBindings: []
    SovereignState:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/SovereignState
      namespace: fibo-be-govgov
      localName: SovereignState
      label: sovereign state
      definition: non-physical juridical entity that is represented by one centralized government that has sovereignty over
        a geographic area
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      attributeUses: []
      patternBindings: []
    SupranationalEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/SupranationalEntity
      namespace: fibo-be-govgov
      localName: SupranationalEntity
      label: supranational entity
      definition: governmental or non-governmental entity that is established by international law or treaty or incorporated
        at an international level
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      attributeUses: []
      patternBindings: []
    TribalArea:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/TribalArea
      namespace: fibo-be-govgov
      localName: TribalArea
      label: tribal area
      definition: designation for geographic region administered by a group of indigenous people rather than by a sovereign
        state or regional governmental entity
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/GeopoliticalEntity
      attributeUses: []
      patternBindings: []
    TribalEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/TribalEntity
      namespace: fibo-be-govgov
      localName: TribalEntity
      label: tribal entity
      definition: legal entity that represents fundamental unit of sovereign tribal (indigenous) government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      attributeUses: []
      patternBindings: []
    TribalGovernment:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/TribalGovernment
      namespace: fibo-be-govgov
      localName: TribalGovernment
      label: tribal government
      definition: government representing a group of indigenous people that has legal authority to govern those people, including
        authority to legislate the existence of tribal entities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      attributeUses: []
      patternBindings: []
    IdentityDocument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/IdentityDocument
      namespace: fibo-be-govgov
      localName: IdentityDocument
      label: IdentityDocument
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    NationalIdentificationNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/NationalIdentificationNumber
      namespace: fibo-be-govgov
      localName: NationalIdentificationNumber
      label: NationalIdentificationNumber
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasFullSovereigntyOver:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/hasFullSovereigntyOver
      namespace: fibo-be-govgov
      localName: hasFullSovereigntyOver
      label: has full sovereignty over
      definition: relates a polity to a geopolitical entity where the polity has absolute, supreme and ultimate dominion and
        authority of a political state subject to no higher power, expressed within its territory in full self-government
        and in complete freedom from any outside influence
      domain: ''
      range: ''
      inverseOf: ''
      characteristics: []
    hasSharedSovereigntyOver:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/hasSharedSovereigntyOver
      namespace: fibo-be-govgov
      localName: hasSharedSovereigntyOver
      label: has shared sovereignty over
      definition: relates a polity to a geopolitical entity where the polity exercises shared dominion and authority of a
        political state
      domain: ''
      range: ''
      inverseOf: ''
      characteristics: []
    hasSovereigntyOver:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/hasSovereigntyOver
      namespace: fibo-be-govgov
      localName: hasSovereigntyOver
      label: has sovereignty over
      definition: relates a polity to a geopolitical entity where the polity exercises dominion and authority of a political
        state
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Polity
      range: https://www.omg.org/spec/Commons/Locations/GeopoliticalEntity
      inverseOf: ''
      characteristics: []
    isElectedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/isElectedBy
      namespace: fibo-be-govgov
      localName: isElectedBy
      label: is elected by
      definition: identifies an official or government chosen to hold office by voting
      domain: ''
      range: ''
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/Executives/elects
      characteristics: []
    isInstrumentOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/isInstrumentOf
      namespace: fibo-be-govgov
      localName: isInstrumentOf
      label: is an instrument of
      definition: relates an instrumentality of some government to the government that it supports
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Instrumentality
      range: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/Government
      inverseOf: ''
      characteristics: []
    isRepresentedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/GovernmentEntities/GovernmentEntities/isRepresentedBy
      namespace: fibo-be-govgov
      localName: isRepresentedBy
      label: is represented by
      definition: relates a system of governance to its chosen representatives
      domain: ''
      range: ''
      inverseOf: ''
      characteristics: []
