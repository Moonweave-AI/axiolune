  label: Metadata about the EDMC-FIBO Business Entities (BE) Partnerships Module
  definition: The partnerships module contains ontologies that define concepts relating to types of partnerships, including
    incorporated and non-incorporated organizations. Partnerships are defined without reference to jurisdiction-specific legal
    forms. The abstractions distinguish between types of partnerships and related formation characteristics, as well as kinds
