domain:
  objectTypes:
    GeneralPartner:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/GeneralPartner
      namespace: fibo-be-parpar
      localName: GeneralPartner
      label: general partner
      definition: partner and part-owner that is responsible for managing the day to day operations of the partnership and
        that may be jointly and severally liable for the obligations of the partnership
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/DeJureControllingInterestParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partner
      attributeUses: []
      patternBindings: []
    GeneralPartnership:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/GeneralPartnership
      namespace: fibo-be-parpar
      localName: GeneralPartnership
      label: general partnership
      definition: partnership that has at least two general partners that agree to share in all assets, profits, and financial
        and legal liabilities of the business
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partnership
      attributeUses: []
      patternBindings: []
    LimitedLiabilityLimitedPartnership:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/LimitedLiabilityLimitedPartnership
      namespace: fibo-be-parpar
      localName: LimitedLiabilityLimitedPartnership
      label: limited liability limited partnership
      definition: limited partnership that consists of one or more general partners who are liable for the obligations of
        the entity as well as one or more protected limited liability partners
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/LimitedPartnership
      attributeUses: []
      patternBindings: []
    LimitedLiabilityPartnership:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/LimitedLiabilityPartnership
      namespace: fibo-be-parpar
      localName: LimitedLiabilityPartnership
      label: limited liability partnership
      definition: partnership that has general partners but provides its individual partners some level of protection against
        personal liability for certain partnership liabilities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partnership
      attributeUses: []
      patternBindings: []
    LimitedPartner:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/LimitedPartner
      namespace: fibo-be-parpar
      localName: LimitedPartner
      label: limited partner
      definition: partner whose liabilities are limited to the extent of their investment or guarantees and that has no involvement
        in the day to day operations of the partnership
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partner
      attributeUses: []
      patternBindings: []
    LimitedPartnership:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/LimitedPartnership
      namespace: fibo-be-parpar
      localName: LimitedPartnership
      label: limited partnership
      definition: partnership that has at least one general partner and at least one limited partner
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partnership
      attributeUses: []
      patternBindings: []
    Partner:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partner
      namespace: fibo-be-parpar
      localName: Partner
      label: partner
      definition: co-owner, member, and agent of a partnership whose participation level, including proportional liabilities
        and share in the profit / loss of the business is specified in a partnership agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/OwnershipParties/ConstitutionalOwner
      - https://www.omg.org/spec/Commons/Organizations/OrganizationMember
      attributeUses: []
      patternBindings: []
    Partnership:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partnership
      namespace: fibo-be-parpar
      localName: Partnership
      label: partnership
      definition: association of two or more legal persons to carry on as co-owners a business for profit
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessEntity
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    PartnershipAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/PartnershipAgreement
      namespace: fibo-be-parpar
      localName: PartnershipAgreement
      label: partnership agreement
      definition: contract between partners in a partnership that establishes the terms and conditions of the relationship
        between the partners
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/OrganizationCoveringAgreement
      attributeUses: []
      patternBindings: []
  associationTypes: {}
