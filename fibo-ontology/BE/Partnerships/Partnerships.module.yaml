      namespace: fibo-be-parpar
      localName: isGeneralPartnerOf
      label: is general partner of
      definition: indicates the organization that the general partner manages
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/GeneralPartner
      range: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/Partnership
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/hasGeneralPartner
      characteristics: []
    isLimitedPartnerOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/isLimitedPartnerOf
      namespace: fibo-be-parpar
      localName: isLimitedPartnerOf
      label: is limited partner of
      definition: indicates the organization that the limited partner participates in
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/Partnerships/Partnerships/LimitedPartner
