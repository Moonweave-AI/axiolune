  preferredPrefix: fibo-be-pripri
  version: '20250301'
  label: Private Limited Companies Ontology
  definition: This ontology defines the fundamental concepts for representing private limited companies -- i.e., companies
    that have characteristics of corporations and of partnerships but are neither.
