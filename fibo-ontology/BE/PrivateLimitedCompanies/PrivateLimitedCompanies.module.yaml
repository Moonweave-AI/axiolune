  fiboDomain: BE
domain:
  objectTypes:
    LimitedLiabilityCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/LimitedLiabilityCompany
      namespace: fibo-be-pripri
      localName: LimitedLiabilityCompany
      label: limited liability company
      definition: private limited company that combines the pass through taxation of a sole proprietorship or partnership
        with the limited liability of a corporation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/PrivateCompanyWithLimitedLiability
      attributeUses: []
      patternBindings: []
    LimitedLiabilityCompanyMember:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/LimitedLiabilityCompanyMember
      namespace: fibo-be-pripri
      localName: LimitedLiabilityCompanyMember
      label: limited liability company member
      definition: owner of an interest in a limited liability company
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/DeJureControllingInterestParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/EntityControllingParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/OwnershipParties/EntityOwner
      - https://www.omg.org/spec/Commons/Organizations/OrganizationMember
      attributeUses: []
      patternBindings: []
    LimitedLiabilityCompanyTaxedAsACorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/LimitedLiabilityCompanyTaxedAsACorporation
      namespace: fibo-be-pripri
      localName: LimitedLiabilityCompanyTaxedAsACorporation
      label: limited liability company taxed as a corporation
      definition: limited liability company that has elected to have corporate tax status
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/LimitedLiabilityCompany
      attributeUses: []
      patternBindings: []
    ManagerManagedLimitedLiabilityCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/ManagerManagedLimitedLiabilityCompany
      namespace: fibo-be-pripri
      localName: ManagerManagedLimitedLiabilityCompany
      label: manager-managed limited liability company
      definition: limited liability company in which the members appoint one or more managers to handle the daily operations
        and administrative responsibilities of the organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/LimitedLiabilityCompany
      attributeUses: []
      patternBindings: []
    ManagingMember:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/ManagingMember
      namespace: fibo-be-pripri
      localName: ManagingMember
      label: managing member
      definition: owner of an interest in a limited liability company who also runs the day-to-day business operations
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/Executives/PrincipalParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/LimitedLiabilityCompanyMember
      attributeUses: []
      patternBindings: []
    PrivateCompanyWithLimitedLiability:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/PrivateCompanyWithLimitedLiability
      namespace: fibo-be-pripri
      localName: PrivateCompanyWithLimitedLiability
      label: private company with limited liability
      definition: hybrid business entity having characteristics of both a corporation and a partnership or sole proprietorship
        (depending on how many owners there are)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessEntity
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    PrivateLimitedCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/PrivateLimitedCompany
      namespace: fibo-be-pripri
      localName: PrivateLimitedCompany
      label: private limited company
      definition: private limited company whose shareholders' liability is limited to the capital they originally invested
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/PrivateCompanyWithLimitedLiability
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasManagingMember:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/hasManagingMember
      namespace: fibo-be-pripri
      localName: hasManagingMember
      label: has managing member
      definition: indicates a managing member in a controlling role of a limited liability company that has responsibility
        for the day-to-day business operations
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/ManagingMember
      inverseOf: ''
      characteristics: []
    isManagingMemberOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/isManagingMemberOf
      namespace: fibo-be-pripri
      localName: isManagingMemberOf
      label: is managing member of
      definition: indicates the controlled limited liability company that the managing member runs
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/ManagingMember
      range: ''
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/BE/PrivateLimitedCompanies/PrivateLimitedCompanies/hasManagingMember
      characteristics: []
