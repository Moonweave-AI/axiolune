    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/OwnershipParties/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
