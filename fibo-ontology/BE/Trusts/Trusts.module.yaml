domain:
  objectTypes:
    IrrevocableTrust:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/IrrevocableTrust
      namespace: fibo-be-trutru
      localName: IrrevocableTrust
      label: irrevocable trust
      definition: trust that cannot be modified, amended or terminated except under certain legal circumstances and typically
        not without the permission of the grantor's named beneficiary or beneficiaries
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trust
      attributeUses: []
      patternBindings: []
    LivingTrust:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/LivingTrust
      namespace: fibo-be-trutru
      localName: LivingTrust
      label: living trust
      definition: trust created during an individual's lifetime where a designated person, the trustee, is given responsibility
        for managing that individual's assets for the benefit of the eventual beneficiary
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trust
      attributeUses: []
      patternBindings: []
    RevocableTrust:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/RevocableTrust
      namespace: fibo-be-trutru
      localName: RevocableTrust
      label: revocable trust
      definition: trust in which legal ownership of the trust property is transferred to the trustee, but the trustor retains
        full power to revoke, modify or amend the trust
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trust
      attributeUses: []
      patternBindings: []
    TestamentaryTrust:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/TestamentaryTrust
      namespace: fibo-be-trutru
      localName: TestamentaryTrust
      label: testamentary trust
      definition: trust established in accordance with the instructions contained in a last will and testament
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/IrrevocableTrust
      attributeUses: []
      patternBindings: []
    Trust:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trust
      namespace: fibo-be-trutru
      localName: Trust
      label: trust
      definition: fiduciary relationship and legal entity in which one party, known as a trustor, gives another party, the
        trustee, the right to hold title to and manage assets for the benefit of a third party, the beneficiary
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessEntity
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    TrustAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/TrustAgreement
      namespace: fibo-be-trutru
      localName: TrustAgreement
      label: trust agreement
      definition: formal agreement that establishes a trust, whereby the trustor(s) gives the trustee(s) the responsibility
        to hold and manage assets for the beneficiary(ies)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/OrganizationCoveringAgreement
      attributeUses: []
      patternBindings: []
    TrustBeneficiary:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/TrustBeneficiary
      namespace: fibo-be-trutru
      localName: TrustBeneficiary
      label: trust beneficiary
      definition: party for whose interest (benefit) an annuity, assignment (such as a letter of credit), contract, insurance
        policy, judgment, promise, trust, will, etc., is made
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Beneficiary
      attributeUses: []
      patternBindings: []
    TrustFundManager:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/TrustFundManager
      namespace: fibo-be-trutru
      localName: TrustFundManager
      label: trust fund manager
      definition: party empowered to act on behalf of the trustee to manage the assets of the trust
      superTypes:
      - https://www.omg.org/spec/Commons/BusinessAuthorizations/LegallyDelegatedAuthority
      attributeUses: []
      patternBindings: []
    Trustee:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trustee
      namespace: fibo-be-trutru
      localName: Trustee
      label: trustee
      definition: party that holds and manages assets for the benefit of another
      superTypes:
      - https://www.omg.org/spec/Commons/BusinessAuthorizations/LegallyDelegatedAuthority
      - https://www.omg.org/spec/Commons/Organizations/OrganizationMember
      attributeUses: []
      patternBindings: []
    Trustor:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trustor
      namespace: fibo-be-trutru
      localName: Trustor
      label: trustor
      definition: party that establishes a trust and places property under the protection and management of one or more trustees
        for the benefit of at least one beneficiary
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationMember
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasTrustee:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/hasTrustee
      namespace: fibo-be-trutru
      localName: hasTrustee
      label: has trustee
      definition: links a trust to a named trustee
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trust
      range: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trustee
