    isTrusteeOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/isTrusteeOf
      namespace: fibo-be-trutru
      localName: isTrusteeOf
      label: is trustee of
      definition: identifies the trust over which a trustee has some measure of control
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trustee
      range: https://spec.edmcouncil.org/fibo/ontology/BE/Trusts/Trusts/Trust
      inverseOf: ''
      characteristics: []
