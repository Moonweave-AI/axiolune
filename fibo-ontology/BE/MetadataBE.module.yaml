  label: Metadata about the FIBO Business Entities (BE) Domain
  definition: "This ontology provides metadata about the FIBO Business Entities (BE) Domain, which defines business concepts\
    \ for data governance, interoperability, and in regulatory reporting about business entities.\n\nThe scope of the BE domain\
    \ includes business and legal entity concepts that are considered by financial industry firms, regulators and other industry\
    \ participants relevant to financial services and more broadly, including:\n - Legal entities generally\n - Corporate\
    \ structure, ownership and control, including primary executive roles for businesses,\n - Functional entities such as\
    \ governments and government entities, non-governmental organizations, international organizations, not-for-profit organizations,\
    \ etc.\n - Concepts specific to corporations, partnerships, private limited companies, sole proprietorships, and trusts."
