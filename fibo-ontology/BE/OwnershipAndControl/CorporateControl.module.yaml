      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/hasGlobalUltimateParent
      namespace: fibo-be-owncor
      localName: hasGlobalUltimateParent
      label: has global ultimate parent
      definition: relates an organization to another recognized as its ultimate parent, if it has one
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/GlobalUltimateParent
      inverseOf: ''
      characteristics: []
    hasSubsidiary:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/hasSubsidiary
      namespace: fibo-be-owncor
      localName: hasSubsidiary
      label: has subsidiary
      definition: relates a legal entity to another organization that it owns at least 50 percent of
