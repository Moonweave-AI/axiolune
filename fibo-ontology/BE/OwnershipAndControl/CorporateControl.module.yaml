      namespace: fibo-be-owncor
      localName: hasControllingAffiliate
      label: has controlling affiliate
      definition: is directly, or indirectly through one or more intermediaries, controlled by
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/ControlledAffiliate
      range: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/ControllingAffiliate
      inverseOf: ''
