domain:
  objectTypes:
    Affiliate:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/Affiliate
      namespace: fibo-be-owncor
      localName: Affiliate
      label: affiliate
      definition: party that is related to a legal entity, directly, or indirectly through one or more intermediaries, and
        controls, or is controlled by, or is under common control with that entity, typically determined by the degree of
        ownership
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    Affiliation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/Affiliation
      namespace: fibo-be-owncor
      localName: Affiliation
      label: affiliation
      definition: situation in which a controlled party is affiliated with a controlling party for some period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Control/Control
      attributeUses: []
      patternBindings: []
    ControlledAffiliate:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/ControlledAffiliate
      namespace: fibo-be-owncor
      localName: ControlledAffiliate
      label: controlled affiliate
      definition: controlled party in an affiliation situation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/ControlledParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/Affiliate
      attributeUses: []
      patternBindings: []
    ControllingAffiliate:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/ControllingAffiliate
      namespace: fibo-be-owncor
      localName: ControllingAffiliate
      label: controlling affiliate
      definition: controlling party in an affiliation situation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/MajorityControllingParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/Affiliate
      attributeUses: []
      patternBindings: []
    DomesticUltimateParent:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/DomesticUltimateParent
      namespace: fibo-be-owncor
      localName: DomesticUltimateParent
      label: domestic ultimate parent
      definition: party that is recognized as the ultimate parent of a given organization within the country or jurisdiction
        of incorporation or organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/TotalControllingInterestParty
      attributeUses: []
      patternBindings: []
    GlobalUltimateParent:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/GlobalUltimateParent
      namespace: fibo-be-owncor
      localName: GlobalUltimateParent
      label: global ultimate parent
      definition: party that is recognized as the ultimate parent of a given organization world-wide
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/TotalControllingInterestParty
      attributeUses: []
      patternBindings: []
    JointVenturePartner:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/JointVenturePartner
      namespace: fibo-be-owncor
      localName: JointVenturePartner
      label: joint venture partner
      definition: party that shares capital, technology, human resources, risks, and benefits of an entity under shared control
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/EntityControllingParty
      attributeUses: []
      patternBindings: []
    SignificantShareholder:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/SignificantShareholder
      namespace: fibo-be-owncor
      localName: SignificantShareholder
      label: significant shareholder
      definition: party that owns a significant voting stake in an organization that is less than 50 percent but greater than
        some threshold
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/VotingShareholder
      attributeUses: []
      patternBindings: []
    Subsidiary:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/Subsidiary
      namespace: fibo-be-owncor
      localName: Subsidiary
      label: subsidiary
      definition: legal entity that is entirely or majority owned and controlled by another legal entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/ControlledAffiliate
      attributeUses: []
      patternBindings: []
    TotalControllingInterestParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/TotalControllingInterestParty
      namespace: fibo-be-owncor
      localName: TotalControllingInterestParty
      label: total controlling interest party
      definition: voting shareholder that owns 100 percent of the voting shares in some legal entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/TotalOwner
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/SignificantShareholder
      attributeUses: []
      patternBindings: []
    VotingShareholder:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateControl/VotingShareholder
      namespace: fibo-be-owncor
      localName: VotingShareholder
      label: voting shareholder
      definition: shareholder whose shares confer the right to vote in corporate elections, including the right to elect directors
        at annual or special meetings, and to express their views to corporate management and directors on significant issues
        that may affect the value of those shares
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/DeJureControllingInterestParty
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/Shareholder
      attributeUses: []
      patternBindings: []
