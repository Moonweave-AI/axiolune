  label: Executives Ontology
  definition: This ontology defines concepts relating to executives and their formal capacities. The concepts defined in this
    ontology cover types of corporate officers, board members and the like, along with the capacities in terms of which those
    party roles are defined, and the kinds of entity (principally natural persons) that are able to perform in those roles.
