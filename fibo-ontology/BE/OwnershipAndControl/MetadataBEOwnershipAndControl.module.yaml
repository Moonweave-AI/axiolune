  label: Metadata about the EDMC-FIBO Business Entities (BE) Ownership and Control Module
  definition: The ownership and control module contains ontologies that define various types and aspects of ownership and
    control as they apply among and between business entities. The ontologies in this module include the definition of types
    of party as defined in the roles of ownership and control along with the capacities which define those parties, and separately
    the relationships of ownership and control directly between organizations, which arise from the existence of those roles.
    Specific types of ownership and control relationships that are unique to incorporated companies are defined in addition
    to the more general terms to which these relate. Also included is an ontology of the types of control relationships that
    exist by virtue of the powers conferred upon corporate officers, board members and other executive roles.
