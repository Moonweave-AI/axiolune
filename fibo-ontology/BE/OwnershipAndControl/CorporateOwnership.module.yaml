domain:
  objectTypes:
    BeneficialOwner:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/BeneficialOwner
      namespace: fibo-be-owncor
      localName: BeneficialOwner
      label: beneficial owner
      definition: party that enjoys the benefits of ownership (such as receipt of income) of something even though its ownership
        (title) may be in the name of another party (called a nominee or registered owner)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Owner
      attributeUses: []
      patternBindings: []
    BeneficialOwnership:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/BeneficialOwnership
      namespace: fibo-be-owncor
      localName: BeneficialOwnership
      label: beneficial ownership
      definition: situation linking party that enjoys the benefits of ownership (such as receipt of income) of something even
        though its ownership (title) may be in the name of another party (called a nominee or registered owner) to the asset
        that they own
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Ownership
      attributeUses: []
      patternBindings: []
    PurchaseLot:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/PurchaseLot
      namespace: fibo-be-owncor
      localName: PurchaseLot
      label: purchase lot
      definition: financial asset that is a block of securities or other financial assets bought in one transaction on a given
        date at a specific price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/FinancialAsset
      attributeUses: []
      patternBindings: []
    Shareholder:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/Shareholder
      namespace: fibo-be-owncor
      localName: Shareholder
      label: shareholder
      definition: party that owns shares in and has rights and responsibilities with respect to some asset, provided in exchange
        for investment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/OwnershipParties/ConstitutionalOwner
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Counterparty
      attributeUses: []
      patternBindings: []
    Shareholding:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/Shareholding
      namespace: fibo-be-owncor
      localName: Shareholding
      label: shareholding
      definition: ownership interest in the equity of a company, represented by shares that confer financial rights and governance
        privileges
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/FinancialAsset
      attributeUses: []
      patternBindings: []
    TaxLot:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/TaxLot
      namespace: fibo-be-owncor
      localName: TaxLot
      label: tax lot
      definition: financial asset that is a block of securities or other financial assets with a distinct cost basis for tax
        reporting purposes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/FinancialAsset
      attributeUses: []
      patternBindings: []
