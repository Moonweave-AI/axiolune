      namespace: fibo-be-owncor
      localName: hasBeneficialOwner
      label: has beneficial owner
      definition: indicates the party that retains rights in the asset they own in a beneficial ownership situation
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Asset
