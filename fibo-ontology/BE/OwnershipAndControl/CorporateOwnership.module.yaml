      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/isBeneficialOwnerOf
      namespace: fibo-be-owncor
      localName: isBeneficialOwnerOf
      label: is beneficial owner of
      definition: indicates an asset in which the beneficial owner holds rights (typically voting rights, management rights,
        etc.) in a beneficial ownership situation
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/BeneficialOwner
      range: https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Asset
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/hasBeneficialOwner
      characteristics: []
  attributeTypes:
    consistsOfNumberOfUnits:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/CorporateOwnership/consistsOfNumberOfUnits
      namespace: fibo-be-owncor
      localName: consistsOfNumberOfUnits
      label: consists of number of units
      definition: indicates the number of units of
      valueType: decimal
