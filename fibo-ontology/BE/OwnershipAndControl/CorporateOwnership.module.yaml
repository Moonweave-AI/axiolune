  label: Corporate Ownership Ontology
  definition: This ontology defines concepts relating to corporation-specific ownership. Roles are defined in terms of the
    ownership enjoyed by the party, and are the specific examples of these concepts as they apply to companies incorporated
    by the issuance of shares.
