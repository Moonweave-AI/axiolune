module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/
  preferredPrefix: fibo-be-funpub
  version: '20260601'
  label: Publishers Ontology
  definition: The concept of a publisher is central to the notion of a data provider in financial markets. This ontology defines
    the fundamental concepts for publishers of information, including entities whose primary function is to publish, and those
    (whether or not they are publishers in that sense) that play the role of the publisher of some information.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Documents/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/PartiesAndSituations/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/RolesAndCompositions/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: Publishers.rdf
  sourceDigest: sha256:52dc4fa3121b945675a09d16cf2ac667857ea974e3e8d588be8576218b9a93d6
  sourcePath: BE/FunctionalEntities/Publishers.rdf
  fiboDomain: BE
domain:
  objectTypes:
    APIFirstMarketDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/APIFirstMarketDataProvider
      namespace: fibo-be-funpub
      localName: APIFirstMarketDataProvider
      label: API-first market data provider
      definition: market data provider that delivers financial information primarily through programmatic interfaces, offering
        real-time or historical data via APIs for automated consumption
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    AlternativeDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/AlternativeDataProvider
      namespace: fibo-be-funpub
      localName: AlternativeDataProvider
      label: alternative data provider
      definition: market data provider that supplies non-traditional datasets derived from sources such as web activity, sentiment
        analysis, geospatial signals, or other alternative information channels
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    CryptoDigitalAssetDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/CryptoDigitalAssetDataProvider
      namespace: fibo-be-funpub
      localName: CryptoDigitalAssetDataProvider
      label: crypto and digital-asset data provider
      definition: market data provider that supplies pricing, reference data, and analytics for digital tokens and crypto-assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    DerivativesVolatilityDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/DerivativesVolatilityDataProvider
      namespace: fibo-be-funpub
      localName: DerivativesVolatilityDataProvider
      label: derivatives and volatility data provider
      definition: market data provider that supplies pricing, implied-volatility surfaces, and analytics for derivatives,
        including options, futures, and structured products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    ExchangeSourcedDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/ExchangeSourcedDataProvider
      namespace: fibo-be-funpub
      localName: ExchangeSourcedDataProvider
      label: exchange-sourced data provider
      definition: market data provider that distributes financial information originating directly from trading venues, including
        order-book data, trades, quotes, and venue-specific reference data
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    FixedIncomeSpecialistProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/FixedIncomeSpecialistProvider
      namespace: fibo-be-funpub
      localName: FixedIncomeSpecialistProvider
      label: fixed income specialist provider
      definition: market data provider that focuses on pricing, reference data, and analytics for fixed-income instruments
        such as bonds, credit products, and money-market securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    InstitutionalMarketDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/InstitutionalMarketDataProvider
      namespace: fibo-be-funpub
      localName: InstitutionalMarketDataProvider
      label: institutional market data provider
      definition: market data provider that supplies multi-asset financial information, analytics, and reference data to financial
        institutions such as banks, asset managers, and trading firms
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
    MarketDataProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      namespace: fibo-be-funpub
      localName: MarketDataProvider
      label: market data provider
      definition: publisher that supplies financial information, reference data, analytics, or related datasets used in financial
        markets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publisher
      attributeUses: []
      patternBindings: []
    Publication:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publication
      namespace: fibo-be-funpub
      localName: Publication
      label: publication
      definition: document offered for general distribution and usually produced in multiple copies
      superTypes:
      - https://www.omg.org/spec/Commons/Documents/Document
      attributeUses: []
      patternBindings: []
    Publisher:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publisher
      namespace: fibo-be-funpub
      localName: Publisher
      label: publisher
      definition: role of person(s) or organization(s) responsible for the printing or distribution of an item, whether in
        digital or print (physical) form
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    ReferenceDataSpecialistProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/ReferenceDataSpecialistProvider
      namespace: fibo-be-funpub
      localName: ReferenceDataSpecialistProvider
      label: reference data specialist provider
      definition: market data provider that focuses on authoritative reference data, including corporate actions, instrument
        identifiers, classifications, and entity information aligned with ISO standards
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasPublisher:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/hasPublisher
      namespace: fibo-be-funpub
      localName: hasPublisher
      label: has publisher
      definition: indicates the party in the role of issuing the information
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publication
      range: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publisher
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/publishes
      characteristics: []
    isPublishedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/isPublishedBy
      namespace: fibo-be-funpub
      localName: isPublishedBy
      label: is published by
      definition: identifies the independent party (i.e., the individual or organization) that disseminates the material
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publication
      range: https://www.omg.org/spec/Commons/PartiesAndSituations/Party
      inverseOf: ''
      characteristics: []
    publishes:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/publishes
      namespace: fibo-be-funpub
      localName: publishes
      label: publishes
      definition: prepares and issues material for public consumption
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publisher
      range: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publication
      inverseOf: ''
      characteristics: []
