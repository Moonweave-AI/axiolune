  preferredPrefix: fibo-be-legmet
  version: '20260601'
  label: Metadata about the EDMC-FIBO Business Entities (BE) Legal Entities Module
  definition: The legal entities module contains ontologies that extend the basis for legal personhood and business entities
    establiched in the OMG's Commons Ontology Library. This includes (1) definitions that distinguish between judicial and
    natural person, (2) definitions of formally constituted organizations, their members and high-level subdivisions, and
    identification and classification schemes, (3) definitions of corporate entities and the ways in which they may be incorporated,
    and (4) definitions required for implementation and use of the ISO 17442 Legal Entity Identifier (LEI) standard.
