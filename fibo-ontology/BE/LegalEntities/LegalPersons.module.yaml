domain:
  objectTypes:
    BusinessEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessEntity
      namespace: fibo-be-legleg
      localName: BusinessEntity
      label: business entity
      definition: entity that is formed and administered as per commercial law in order to engage in business activities
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/FormalOrganization
      attributeUses: []
      patternBindings: []
    BusinessLicense:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessLicense
      namespace: fibo-be-legleg
      localName: BusinessLicense
      label: business license
      definition: license that allows the holder to conduct business or carry out a specific profession within some jurisdiction
        for some period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/License
      attributeUses: []
      patternBindings: []
    CharteredLegalPerson:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/CharteredLegalPerson
      namespace: fibo-be-legleg
      localName: CharteredLegalPerson
      label: chartered legal person
      definition: a legal person created by a royal charter or decree
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    LegallyCompetentNaturalPerson:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/LegallyCompetentNaturalPerson
      namespace: fibo-be-legleg
      localName: LegallyCompetentNaturalPerson
      label: legally competent natural person
      definition: person who is considered competent, under the circumstances, to enter into a contract, conduct business,
        or participate in other activities that generally require the mental ability to understand problems and make decisions
        on his or her own behalf
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/Person
      - https://www.omg.org/spec/Commons/Organizations/LegalPerson
      attributeUses: []
      patternBindings: []
    NotForProfitObjective:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/NotForProfitObjective
      namespace: fibo-be-legleg
      localName: NotForProfitObjective
      label: not for profit objective
      definition: objective that reflects the charitable, educational, religious, humanitarian, public services, or other
        not for profit goals of an organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/Objective
      attributeUses: []
      patternBindings: []
    PowerOfAttorney:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/PowerOfAttorney
      namespace: fibo-be-legleg
      localName: PowerOfAttorney
      label: power of attorney
      definition: legal authorization given by one party (the principal) to another (the agent or attorney-in-fact) to perform
        certain acts on the principal's behalf
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/LegalCapacity
      attributeUses: []
      patternBindings: []
    ProfitObjective:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/ProfitObjective
      namespace: fibo-be-legleg
      localName: ProfitObjective
      label: profit objective
      definition: objective that reflects pursuit of a financial benefit that may be realized when the amount of revenue gained
        from a business activity exceeds the expenses, costs and taxes needed to sustain that activity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/BusinessObjective
      attributeUses: []
      patternBindings: []
    PublicPurpose:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/PublicPurpose
      namespace: fibo-be-legleg
      localName: PublicPurpose
      label: public purpose
      definition: objective that reflects values generally thought to be shared by and that is intended to benefit the populace
        as a whole
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/Objective
      attributeUses: []
      patternBindings: []
    ReligiousObjective:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/ReligiousObjective
      namespace: fibo-be-legleg
      localName: ReligiousObjective
      label: religious objective
      definition: not-for-profit objective that reflects the religious goals of an organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/NotForProfitObjective
      attributeUses: []
      patternBindings: []
    SpecialPurposeVehicle:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/SpecialPurposeVehicle
      namespace: fibo-be-legleg
      localName: SpecialPurposeVehicle
      label: fonds commun de placement
      definition: legal entity created to fulfill narrow, specific, and frequently temporary objectives
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    StatutoryBody:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/StatutoryBody
      namespace: fibo-be-legleg
      localName: StatutoryBody
      label: statutory body
      definition: legal entity established by a government to consider evidence and make judgements in some field of activity
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    VariableInterestEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/VariableInterestEntity
      namespace: fibo-be-legleg
      localName: VariableInterestEntity
      label: variable interest entity
      definition: legal entity whose shareholders are entitled to a percentage of a named company's profits via a private
        contract
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    LegalEntity:
      iri: https://www.omg.org/spec/Commons/Organizations/LegalEntity
      namespace: fibo-be-legleg
      localName: LegalEntity
      label: LegalEntity
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    LegalPerson:
      iri: https://www.omg.org/spec/Commons/Organizations/LegalPerson
      namespace: fibo-be-legleg
      localName: LegalPerson
      label: LegalPerson
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
