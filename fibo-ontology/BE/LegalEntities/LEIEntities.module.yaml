    isDirectlyConsolidatedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/isDirectlyConsolidatedBy
      namespace: fibo-be-leglei
      localName: isDirectlyConsolidatedBy
      label: is directly consolidated by
      definition: indicates that the entity considered the 'end node' or consolidating entity (parent) fully consolidates
        the accounting of the 'start node' (child) per the accounting rules specified, and is the closest consolidating entity
        to that child in any applicable ownership hierarchy
      domain: ''
      range: https://www.omg.org/spec/Commons/Organizations/LegalEntity
      inverseOf: ''
      characteristics: []
    isInternationalBranchOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/isInternationalBranchOf
      namespace: fibo-be-leglei
      localName: isInternationalBranchOf
      label: is an international branch of
      definition: indicates that the entity considered the 'start node' or consolidated entity (child) is an international
        subsidiary of the 'end node' (parent) in the jurisdiction of the child
      domain: ''
      range: https://www.omg.org/spec/Commons/Organizations/LegalEntity
      inverseOf: ''
      characteristics: []
    isUltimatelyConsolidatedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/isUltimatelyConsolidatedBy
      namespace: fibo-be-leglei
      localName: isUltimatelyConsolidatedBy
      label: is ultimately consolidated by
      definition: indicates that the entity considered the 'end node' or consolidating entity (parent) fully consolidates
        the accounting of the 'start node' (child) per the accounting rules specified, and is the most distant consolidating
        entity to that child in any applicable ownership hierarchy
      domain: ''
      range: https://www.omg.org/spec/Commons/Organizations/LegalEntity
      inverseOf: ''
      characteristics: []
