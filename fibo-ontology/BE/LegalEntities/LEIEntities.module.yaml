domain:
  objectTypes:
    AccountingFramework:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/AccountingFramework
      namespace: fibo-be-leglei
      localName: AccountingFramework
      label: accounting framework
      definition: framework, including policies, methods, rules, and processes, used to measure, recognize, present, and disclose
        the information appearing in an entity's financial statements, and, from a legal ownership perspective, that is applied
        for accounting consolidation determination
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/RelationshipQualifier
      attributeUses: []
      patternBindings: []
    ContractuallyCapableEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/ContractuallyCapableEntity
      namespace: fibo-be-leglei
      localName: ContractuallyCapableEntity
      label: contractually capable entity
      definition: a unique entity that is legally or financially responsible for the performance of financial transactions,
        or has the legal right in its jurisdiction to enter independently into legal contracts, regardless of whether it is
        incorporated or constituted in some other way (e.g. trust, partnership, contractual). This excludes natural persons,
        but includes governmental organizations and supranationals.
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/AgentRole
      attributeUses: []
      patternBindings: []
    EntityLegalForm:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/EntityLegalForm
      namespace: fibo-be-leglei
      localName: EntityLegalForm
      label: entity legal form
      definition: a classifier for a legal entity that indicates the nature of that entity as defined from a legal or regulatory
        perspective, in the jurisdiction in which it was established
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    EntityLegalFormIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/EntityLegalFormIdentifier
      namespace: fibo-be-leglei
      localName: EntityLegalFormIdentifier
      label: entity legal form identifier
      definition: code that denotes an entity legal form as defined in ISO 20275
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
      attributeUses: []
      patternBindings: []
    EntityLegalFormScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/EntityLegalFormScheme
      namespace: fibo-be-leglei
      localName: EntityLegalFormScheme
      label: entity legal form scheme
      definition: scheme that specifies the elements of the codes for entity legal forms, such as those that are sanctioned
        in a given jurisdiction as defined in ISO 20725
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/ClassificationScheme
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeSet
      attributeUses: []
      patternBindings: []
    LEIRegisteredEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/LEIRegisteredEntity
      namespace: fibo-be-leglei
      localName: LEIRegisteredEntity
      label: LEI registered entity
      definition: a legal person that has registered for and is identified by a legal entity identifier
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalPerson
      attributeUses: []
      patternBindings: []
    LegalEntityIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/LegalEntityIdentifier
      namespace: fibo-be-leglei
      localName: LegalEntityIdentifier
      label: legal entity identifier
      definition: an organization identifier that uniquely identifies a legal person as defined in ISO 17442
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentifier
      attributeUses: []
      patternBindings: []
    LegalEntityIdentifierScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/LegalEntityIdentifierScheme
      namespace: fibo-be-leglei
      localName: LegalEntityIdentifierScheme
      label: legal entity identifier scheme
      definition: a scheme that specifies the elements of an unambiguous legal entity identifier (LEI) scheme to identify
        the legal entities relevant to any financial transaction
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentificationScheme
      attributeUses: []
      patternBindings: []
    RelationshipPeriodQualifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/RelationshipPeriodQualifier
      namespace: fibo-be-leglei
      localName: RelationshipPeriodQualifier
      label: relationship period qualifier
      definition: a classifier that qualifies something about the reporting period specified, such as that the date period
        reflects an accounting or document filing period
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    RelationshipQualifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/RelationshipQualifier
      namespace: fibo-be-leglei
      localName: RelationshipQualifier
      label: relationship qualifier
      definition: a classifier that qualifies something about the relationship between consolidated entities during the reporting
        period, such as the accounting framework used
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    RelationshipRecord:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/RelationshipRecord
      namespace: fibo-be-leglei
      localName: RelationshipRecord
      label: relationship record
      definition: a record describing relationships between legal entities
      superTypes:
      - https://www.omg.org/spec/Commons/Collections/Constituent
      attributeUses: []
      patternBindings: []
    RelationshipStatus:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LEIEntities/RelationshipStatus
      namespace: fibo-be-leglei
      localName: RelationshipStatus
      label: relationship status
      definition: a classifier that specifies the status of the relationship between consolidated entities during the reporting
        period (active or inactive)
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
