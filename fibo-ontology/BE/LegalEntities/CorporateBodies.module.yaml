module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/
  preferredPrefix: fibo-be-legcor
  version: '20251002'
  label: Corporate Bodies Ontology
  definition: This ontology defines the basic constructs for corporate bodies, including for-profit as well as not-for-profit
    corporations, and includes fundamental concepts for companies incorporated through the issuance of shares.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCore/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/DatesAndTimes/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Designators/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Identifiers/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Organizations/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/RegulatoryAgencies/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: CorporateBodies.rdf
  sourceDigest: sha256:13bcc4c012154230cd00f775c3ec12f4cf29616e7c484f2b2b9f61f659dd3235
  sourcePath: BE/LegalEntities/CorporateBodies.rdf
  fiboDomain: BE
domain:
  objectTypes:
    BenefitCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/BenefitCorporation
      namespace: fibo-be-legcor
      localName: BenefitCorporation
      label: benefit corporation
      definition: not-for-profit corporation set up under specific state legislation, typically to provide some social benefit,
        without an obligation to maximize shareholder return
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/NotForProfitCorporation
      attributeUses: []
      patternBindings: []
    BoardAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/BoardAgreement
      namespace: fibo-be-legcor
      localName: BoardAgreement
      label: board agreement
      definition: formal, legally binding agreement between members of the Board of Directors of the organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/OrganizationCoveringAgreement
      attributeUses: []
      patternBindings: []
    CommonInterestDevelopmentCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/CommonInterestDevelopmentCorporation
      namespace: fibo-be-legcor
      localName: CommonInterestDevelopmentCorporation
      label: common interest development corporation
      definition: not-for-profit corporation set up under specific state legislation as a business entity for homeowners'
        associations
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/NotForProfitCorporation
      attributeUses: []
      patternBindings: []
    Corporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/Corporation
      namespace: fibo-be-legcor
      localName: Corporation
      label: corporation
      definition: formal organization that is a legal entity (artificial person) distinct from its owners, created under the
        jurisdiction of the laws of a state or nation
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    ForProfitCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/ForProfitCorporation
      namespace: fibo-be-legcor
      localName: ForProfitCorporation
      label: for profit corporation
      definition: corporation whose objective is to make money, i.e., to ensure realization of a financial benefit such that
        the amount of revenue gained from a business activity exceeds the expenses, costs and taxes needed to sustain that
        activity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/Corporation
      attributeUses: []
      patternBindings: []
    IncorporationGuarantee:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/IncorporationGuarantee
      namespace: fibo-be-legcor
      localName: IncorporationGuarantee
      label: incorporation guarantee
      definition: guarantee that is part of the financial basis by which some legal entity is incorporated
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCore/Constitution
      attributeUses: []
      patternBindings: []
    InstrumentOfIncorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/InstrumentOfIncorporation
      namespace: fibo-be-legcor
      localName: InstrumentOfIncorporation
      label: instrument of incorporation
      definition: memorandum and articles of association by which some legal entity is established
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCore/Constitution
      attributeUses: []
      patternBindings: []
    JointStockCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/JointStockCompany
      namespace: fibo-be-legcor
      localName: JointStockCompany
      label: joint stock company
      definition: for-profit, unincorporated business that has some characteristics of a corporation and some features of
        a partnership, with ownership interests represented by shares of stock
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessEntity
      attributeUses: []
      patternBindings: []
    NotForProfitCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/NotForProfitCorporation
      namespace: fibo-be-legcor
      localName: NotForProfitCorporation
      label: not-for-profit corporation
      definition: corporation approved by its jurisdictional oversight and tax authorities as operating for educational, charitable,
        social, religious, civic or humanitarian purposes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/Corporation
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/NotForProfitOrganization
      attributeUses: []
      patternBindings: []
    PrivatelyHeldCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/PrivatelyHeldCompany
      namespace: fibo-be-legcor
      localName: PrivatelyHeldCompany
      label: privately held company
      definition: corporation whose issued shares are all held by a family or a small group of investors and, therefore, cannot
        be bought by the public
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/StockCorporation
      attributeUses: []
      patternBindings: []
    PubliclyHeldCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/PubliclyHeldCompany
      namespace: fibo-be-legcor
      localName: PubliclyHeldCompany
      label: publicly held company
      definition: corporation whose shares are traded and held publicly
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/StockCorporation
      attributeUses: []
      patternBindings: []
    RegistrationIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/RegistrationIdentifier
      namespace: fibo-be-legcor
      localName: RegistrationIdentifier
      label: registration identifier
      definition: identifier that is officially allocated to an organization at the time of registration, typically in a jurisdiction
        in which said organization is organized or registered and used in that jurisdiction to identify the organization
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentifier
      attributeUses: []
      patternBindings: []
    RegistrationIdentifierScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/RegistrationIdentifierScheme
      namespace: fibo-be-legcor
      localName: RegistrationIdentifierScheme
      label: registration identifier scheme
      definition: scheme that defines the registration identifier per the issuing registration authority
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentificationScheme
      attributeUses: []
      patternBindings: []
    ReligiousCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/ReligiousCorporation
      namespace: fibo-be-legcor
      localName: ReligiousCorporation
      label: religious corporation
      definition: not-for-profit corporation whose objective is specific to some fundamental set of beliefs and practices
        generally agreed upon by a number of people, and that is incorporated under the law
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/NotForProfitCorporation
      attributeUses: []
      patternBindings: []
    StockCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/StockCorporation
      namespace: fibo-be-legcor
      localName: StockCorporation
      label: stock corporation
      definition: corporation that has shareholders, each of whom receives a portion of the ownership of the corporation through
        shares of stock
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/Corporation
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasDateOfIncorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/hasDateOfIncorporation
      namespace: fibo-be-legcor
      localName: hasDateOfIncorporation
      label: has date of incorporation
      definition: indicates the formal date of incorporation as stated in filing documents
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasDateOfRegistration:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/hasDateOfRegistration
      namespace: fibo-be-legcor
      localName: hasDateOfRegistration
      label: has date of registration
      definition: indicates the date on which the corporation has registered in some jurisdiction for regulatory and / or
        for tax purposes
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasIssuedCapital:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/hasIssuedCapital
      namespace: fibo-be-legcor
      localName: hasIssuedCapital
      label: has issued capital
      definition: indicates the aggregate value of all shares held by shareholders
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    isConstitutedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/isConstitutedBy
      namespace: fibo-be-legcor
      localName: isConstitutedBy
      label: is constituted by
      definition: the instrument by which an entity is incorporated
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/Corporation
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCore/Constitution
      inverseOf: ''
      characteristics: []
    isIncorporatedIn:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/isIncorporatedIn
      namespace: fibo-be-legcor
      localName: isIncorporatedIn
      label: is incorporated in
      definition: the legal jurisdiction under which the legal entity is incorporated
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/Corporation
      range: https://www.omg.org/spec/Commons/RegulatoryAgencies/Jurisdiction
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasSharesAuthorized:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/CorporateBodies/hasSharesAuthorized
      namespace: fibo-be-legcor
      localName: hasSharesAuthorized
      label: has shares authorized
      definition: indicates the maximum number of shares that are permitted to be issued, as established by the board of directors
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
