domain:
  objectTypes:
    Branch:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/Branch
      namespace: fibo-be-legfor
      localName: Branch
      label: branch
      definition: part of a larger organization that might not be co-located with it
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationalSubUnit
      attributeUses: []
      patternBindings: []
    Division:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/Division
      namespace: fibo-be-legfor
      localName: Division
      label: division
      definition: part of an organization, such as a line of business, that may have separate accounting and reporting requirements
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/OrganizationalSubUnit
      attributeUses: []
      patternBindings: []
    JointVenture:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/JointVenture
      namespace: fibo-be-legfor
      localName: JointVenture
      label: joint venture
      definition: legal entity that is formed between parties that pool their resources for the purpose of accomplishing a
        specific task but otherwise retain their distinct identities
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/LegalEntity
      attributeUses: []
      patternBindings: []
    NonGovernmentalOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/NonGovernmentalOrganization
      namespace: fibo-be-legfor
      localName: NonGovernmentalOrganization
      label: non-governmental organization
      definition: not-for-profit organization that functions independently of government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/NotForProfitOrganization
      attributeUses: []
      patternBindings: []
    NotForProfitOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/NotForProfitOrganization
      namespace: fibo-be-legfor
      localName: NotForProfitOrganization
      label: not for profit organization
      definition: organization that uses its surplus revenues to further achieve its purpose rather than distributing its
        surplus income to the organization's owners (directors, investors, and equivalents) as profit / dividends
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/FormalOrganization
      attributeUses: []
      patternBindings: []
    OrganizationCoveringAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/OrganizationCoveringAgreement
      namespace: fibo-be-legfor
      localName: OrganizationCoveringAgreement
      label: organization covering agreement
      definition: contract between the principals in a formal organization that specifies the relationship between the principals,
        and between the principals and the entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    ValueAddedTaxIdentificationNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/ValueAddedTaxIdentificationNumber
      namespace: fibo-be-legfor
      localName: ValueAddedTaxIdentificationNumber
      label: value-added tax identification number
      definition: tax identifier that identifies a taxable person (business) or non-taxable legal entity for a consumption
        tax that is assessed incrementally, levied on the price of a product or service at each stage of production, distribution,
        and sale to the end consumer
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/TaxIdentifier
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentifier
      attributeUses: []
      patternBindings: []
