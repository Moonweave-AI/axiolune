  label: Formal Business Organizations Ontology
  definition: This ontology defines formal business organizations and related concepts. The ontology covers parts of organizations,
    membership, classification, address relations and other properties which are applicable to formal business organizations
    generally. The concept of a formal business organization forms the basis for articulation of types of organization, both
    incorporated and non-incorporated, in other FIBO-BE ontologies.
