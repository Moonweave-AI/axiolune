  label: Indices and Indicators Domain, North American Extension
  definition: The FIBO Indices and Indicators (IND) Domain covers market indices and reference rates including economic indicators,
    foreign exchange, interest rates, and other benchmarks. The ontologies cover quoted interest rates, economic measures
    such as employment rates, and quoted indices required to support baskets of securities, including specific kinds of securities
    in share indices or bond indices, as well as credit indices.
