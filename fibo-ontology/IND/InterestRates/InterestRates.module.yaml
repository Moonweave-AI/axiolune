      namespace: fibo-ind-intint
      localName: hasReferenceCurrency
      label: has reference currency
      definition: relates something to the currency it is based on
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Currency
      inverseOf: ''
      characteristics: []
    hasTenor:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/hasTenor
      namespace: fibo-ind-intint
      localName: hasTenor
      label: has tenor
      definition: indicates the length of time for which a given rate, such as an interbank rate, exchange rate, other market
        rate is quoted, or a debt instrument has remaining prior to maturity or expiration
      domain: ''
