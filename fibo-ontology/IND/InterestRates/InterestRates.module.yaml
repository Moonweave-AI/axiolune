  preferredPrefix: fibo-ind-intint
  version: '20250301'
  label: Interest Rates Ontology
  definition: This ontology provides the basic types of interest rate which are recognized in the financial markets, and the
    relationships between these where applicable. These include bank base rates, inter-bank offer rates, overnight rates of
    interest and the US Federal Funds rate which is widely used as a rate of reference. It also includes the concept of a
    market rate spread between two interest rates.
