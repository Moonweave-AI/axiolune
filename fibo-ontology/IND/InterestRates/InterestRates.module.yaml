domain:
  objectTypes:
    FloatingInterestRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FloatingInterestRate
      namespace: fibo-ind-intint
      localName: FloatingInterestRate
      label: FloatingInterestRate
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    BaseRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/BaseRate
      namespace: fibo-ind-intint
      localName: BaseRate
      label: base rate
      definition: basic rate of interest on which the actual rate a bank charges on loans to its customers is calculated
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/ReferenceInterestRate
      attributeUses: []
      patternBindings: []
    InterbankBidRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankBidRate
      namespace: fibo-ind-intint
      localName: InterbankBidRate
      label: interbank bid rate
      definition: interbank rate that is the interest rate at which participating banks are willing to borrow deposits from
        other banks
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankRate
      attributeUses: []
      patternBindings: []
    InterbankMidRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankMidRate
      namespace: fibo-ind-intint
      localName: InterbankMidRate
      label: interbank mid rate
      definition: interbank rate that represents the mid-point between bid and offer rates
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankRate
      attributeUses: []
      patternBindings: []
    InterbankOfferedRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankOfferedRate
      namespace: fibo-ind-intint
      localName: InterbankOfferedRate
      label: interbank offered rate
      definition: interbank rate that is the interest rate at which participating banks lend money
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankRate
      attributeUses: []
      patternBindings: []
    InterbankRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterbankRate
      namespace: fibo-ind-intint
      localName: InterbankRate
      label: interbank rate
      definition: reference rate that is the rate of interest charged on short-term loans between banks
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/ReferenceInterestRate
      attributeUses: []
      patternBindings: []
    InterestRateAuthority:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterestRateAuthority
      namespace: fibo-ind-intint
      localName: InterestRateAuthority
      label: interest rate authority
      definition: financial service provider/publisher responsible for specifying some benchmark interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/Publisher
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    InterestRateBenchmark:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterestRateBenchmark
      namespace: fibo-ind-intint
      localName: InterestRateBenchmark
      label: interest rate benchmark
      definition: classifier for regularly updated interest rates that are publicly accessible, typically set by a central
        bank or group of financial institutions
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/QuantityKind
      attributeUses: []
      patternBindings: []
    InterestRateBenchmarkClassificationScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterestRateBenchmarkClassificationScheme
      namespace: fibo-ind-intint
      localName: InterestRateBenchmarkClassificationScheme
      label: interest rate benchmark classification scheme
      definition: scheme for classifying interest rate benchmarks, such as the FpML classification scheme
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/ClassificationScheme
      attributeUses: []
      patternBindings: []
    OvernightRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/OvernightRate
      namespace: fibo-ind-intint
      localName: OvernightRate
      label: overnight rate
      definition: reference rate that is an interest rate at which a depository institution lends funds to another depository
        institution (short-term), or the interest rate the central bank charges a financial institution to borrow money overnight
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/ReferenceInterestRate
      attributeUses: []
      patternBindings: []
    ReferenceInterestRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/ReferenceInterestRate
      namespace: fibo-ind-intint
      localName: ReferenceInterestRate
      label: reference interest rate
      definition: market rate that is a rate of interest paid by or agreed among some bank or set of banks
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/InterestRate
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/MarketRate
      attributeUses: []
      patternBindings: []
    SpecificProviderInterestRateBenchmark:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/SpecificProviderInterestRateBenchmark
      namespace: fibo-ind-intint
      localName: SpecificProviderInterestRateBenchmark
      label: specific-provider interest rate benchmark
      definition: interest rate benchmark that is made available by a specific market data provider for reference purposes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/InterestRates/InterestRates/InterestRateBenchmark
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
