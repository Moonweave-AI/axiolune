module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/
  preferredPrefix: fibo-ind-forfor
  version: '20250701'
  label: Foreign Exchange Ontology
  definition: This ontology provides the parameters for foreign exchange rates, covering spot and forward rates, as well as
    foreign exchange spot rate volatilities.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Collections/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/DatesAndTimes/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Documents/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/QuantitiesAndUnits/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: ForeignExchange.rdf
  sourceDigest: sha256:951abe905fae8bf8f78b8884827c6fd56eed715fcc5df70616fc5d640eb3db98
  sourcePath: IND/ForeignExchange/ForeignExchange.rdf
  fiboDomain: IND
domain:
  objectTypes:
    CurrencyConversionService:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencyConversionService
      namespace: fibo-ind-forfor
      localName: CurrencyConversionService
      label: currency conversion service
      definition: foreign exchange service involving the conversion of currency of one country or group of countries for another,
        typically, but not always, as a counter transaction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ForeignExchangeService
      attributeUses: []
      patternBindings: []
    CurrencyForwardRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencyForwardRate
      namespace: fibo-ind-forfor
      localName: CurrencyForwardRate
      label: currency forward rate
      definition: rate of exchange between two currencies for settlement at some future point in time, expressed as a premium
        on the spot rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      attributeUses: []
      patternBindings: []
    CurrencyForwardRateVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencyForwardRateVolatility
      namespace: fibo-ind-forfor
      localName: CurrencyForwardRateVolatility
      label: currency forward rate volatility
      definition: measure of exchange rate fluctuation based on a range of projected values for exchange rates
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ExchangeRateVolatility
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/ImpliedVolatility
      attributeUses: []
      patternBindings: []
    CurrencySpotBuyRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotBuyRate
      namespace: fibo-ind-forfor
      localName: CurrencySpotBuyRate
      label: currency spot buy rate
      definition: indicative spot buying market rate as observed by the reporting source
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotRate
      attributeUses: []
      patternBindings: []
    CurrencySpotMidRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotMidRate
      namespace: fibo-ind-forfor
      localName: CurrencySpotMidRate
      label: currency spot mid rate
      definition: indicative middle market (mean of spot buying and selling) rate as observed by the reporting source
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotRate
      attributeUses: []
      patternBindings: []
    CurrencySpotRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotRate
      namespace: fibo-ind-forfor
      localName: CurrencySpotRate
      label: currency spot rate
      definition: rate at which one currency may be exchanged for another for immediate delivery
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      attributeUses: []
      patternBindings: []
    CurrencySpotSellRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotSellRate
      namespace: fibo-ind-forfor
      localName: CurrencySpotSellRate
      label: currency spot sell rate
      definition: indicative spot selling market rate as observed by the reporting source
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotRate
      attributeUses: []
      patternBindings: []
    CurrencySpotVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencySpotVolatility
      namespace: fibo-ind-forfor
      localName: CurrencySpotVolatility
      label: currency spot volatility
      definition: measure of exchange rate fluctuation based on a range of past actual values for exchange rates
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ExchangeRateVolatility
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/HistoricalVolatility
      attributeUses: []
      patternBindings: []
    ExchangeRateStructure:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ExchangeRateStructure
      namespace: fibo-ind-forfor
      localName: ExchangeRateStructure
      label: exchange rate structure
      definition: structured collection of quoted or projected exchange rates, such that volatility may be constructed for
        the structure
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedStructuredCollection
      attributeUses: []
      patternBindings: []
    ExchangeRateVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ExchangeRateVolatility
      namespace: fibo-ind-forfor
      localName: ExchangeRateVolatility
      label: exchange rate volatility
      definition: statistical measure of the rate of change in the rate at which one currency can be exchanged for another
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/Volatility
      attributeUses: []
      patternBindings: []
    ForeignExchangeService:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ForeignExchangeService
      namespace: fibo-ind-forfor
      localName: ForeignExchangeService
      label: foreign exchange service
      definition: financial service involving the exchange of one currency for another, conversion of one currency for another,
        and transfer of money from one country to another whereby currency conversion is required
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
    InternationalElectronicFundsTransferService:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/InternationalElectronicFundsTransferService
      namespace: fibo-ind-forfor
      localName: InternationalElectronicFundsTransferService
      label: international electronic funds transfer service
      definition: electronic funds transfer (EFT) service involving the transfer of funds across national borders, that may
        also involve currency conversion
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ElectronicFundsTransferService
      - https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/ForeignExchangeService
      attributeUses: []
      patternBindings: []
    QuotedExchangeRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      namespace: fibo-ind-forfor
      localName: QuotedExchangeRate
      label: quoted exchange rate
      definition: exchange rate quoted at a specific point in time, for a given block amount of currency as quoted against
        another (base) currency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/ExchangeRate
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/MarketRate
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasExchangeRateQuotationSource:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/hasExchangeRateQuotationSource
      namespace: fibo-ind-forfor
      localName: hasExchangeRateQuotationSource
      label: has exchange rate quotation source
      definition: indicates the origin of a quoted exchange rate
      domain: ''
      range: ''
      inverseOf: ''
      characteristics: []
    hasQuotationBlockAmountBasis:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/hasQuotationBlockAmountBasis
      namespace: fibo-ind-forfor
      localName: hasQuotationBlockAmountBasis
      label: has quotation block amount basis
      definition: indicates the amount of the dealt currency which would be exchanged in a trade for which the stated spot
        rate applies
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    hasQuotationSettlementBasis:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/hasQuotationSettlementBasis
      namespace: fibo-ind-forfor
      localName: hasQuotationSettlementBasis
      label: has quotation settlement basis
      definition: indicates the settlement period for a trade for which the stated spot rate applies
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      range: https://www.omg.org/spec/Commons/DatesAndTimes/Duration
      inverseOf: ''
      characteristics: []
    hasQuoteCurrency:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/hasQuoteCurrency
      namespace: fibo-ind-forfor
      localName: hasQuoteCurrency
      label: has quote currency
      definition: indicates the quote currency in an exchange rate; R units of this currency represent one unit of the base
        currency
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Currency
      inverseOf: ''
      characteristics: []
    hasQuotedExchangeRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/hasQuotedExchangeRate
      namespace: fibo-ind-forfor
      localName: hasQuotedExchangeRate
      label: has quoted exchange rate
      definition: rate of exchange between two currencies as specified as of some date and time as quoted by a specific source
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      inverseOf: ''
      characteristics: []
    isPremiumOn:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/isPremiumOn
      namespace: fibo-ind-forfor
      localName: isPremiumOn
      label: is premium on
      definition: an exchange rate expressed as a premium on the spot rate for the currency pair
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/CurrencyForwardRate
      range: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      inverseOf: ''
      characteristics: []
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
