  fiboDomain: IND
domain:
  objectTypes:
    DailyAverageMarketRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/DailyAverageMarketRate
      namespace: fibo-ind-indind
      localName: DailyAverageMarketRate
      label: daily average market rate
      definition: overall level of a given rate, calculated as the sum of some selected observed values of the rates for a
        particular reference rate, foreign exchange rate, lending rate, or other market rate divided by the number of samples
        collected over the course of a twenty-four (24) hour period for a specific date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/MarketRate
      attributeUses: []
      patternBindings: []
    EndOfDayMarketRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/EndOfDayMarketRate
      namespace: fibo-ind-indind
      localName: EndOfDayMarketRate
      label: end-of-day market rate
      definition: value of a given market rate of the end of the business day for a specific date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/MarketRate
      attributeUses: []
      patternBindings: []
    HistoricalPriceVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/HistoricalPriceVolatility
      namespace: fibo-ind-indind
      localName: HistoricalPriceVolatility
      label: historical price volatility
      definition: historical volatility measure of past trading ranges of prices of underlying securities and indexes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/HistoricalVolatility
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/PriceVolatility
      attributeUses: []
      patternBindings: []
    HistoricalVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/HistoricalVolatility
      namespace: fibo-ind-indind
      localName: HistoricalVolatility
      label: historical volatility
      definition: measure of volatility that uses actual values for pricing, rates, and other measurements calculated over
        some prior period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/Volatility
      attributeUses: []
      patternBindings: []
    ImpliedPriceVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/ImpliedPriceVolatility
      namespace: fibo-ind-indind
      localName: ImpliedPriceVolatility
      label: implied price volatility
      definition: measure of volatility that represents the expected fluctuations of an underlying stock or index over a specific
        time frame
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/ImpliedVolatility
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/PriceVolatility
      attributeUses: []
      patternBindings: []
    ImpliedVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/ImpliedVolatility
      namespace: fibo-ind-indind
      localName: ImpliedVolatility
      label: implied volatility
      definition: measure of volatility that is a forward-looking metric used to calculate probability
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/Volatility
      attributeUses: []
      patternBindings: []
    MarketRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/MarketRate
      namespace: fibo-ind-indind
      localName: MarketRate
      label: market rate
      definition: value of a rate established in the marketplace for a set of instruments or that describes the economic climate
        for an industry and/or political region (e.g., SOFR, Prime)
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Ratio
      attributeUses: []
      patternBindings: []
    MarketSpread:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/MarketSpread
      namespace: fibo-ind-indind
      localName: MarketSpread
      label: market spread
      definition: statistical measure providing the difference (or spread) between two market rates
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ScopedMeasure
      attributeUses: []
      patternBindings: []
    PriceStructure:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/PriceStructure
      namespace: fibo-ind-indind
      localName: PriceStructure
      label: price structure
      definition: structured collection of prices, such as market prices for some index or security, such that volatility
        or other analyses may be performed over the structure
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedStructuredCollection
      attributeUses: []
      patternBindings: []
    PriceVolatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/PriceVolatility
      namespace: fibo-ind-indind
      localName: PriceVolatility
      label: price volatility
      definition: statistical measure of the rate of change in pricing for a given security or market index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/Volatility
      attributeUses: []
      patternBindings: []
    QuotedPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/QuotedPrice
      namespace: fibo-ind-indind
      localName: QuotedPrice
      label: quoted price
      definition: a monetary price quoted by some publisher on a given date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      attributeUses: []
      patternBindings: []
    TermStructure:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/TermStructure
      namespace: fibo-ind-indind
      localName: TermStructure
      label: term structure
      definition: structured collection of rates, such as interest rates, or bond yields with different terms to maturity,
        such that a yield curve may be constructed for the structure
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedStructuredCollection
      attributeUses: []
      patternBindings: []
    Volatility:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/Volatility
      namespace: fibo-ind-indind
      localName: Volatility
      label: volatility
      definition: statistical measure of the dispersion around the average of some random variable over some period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/Dispersion
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasQuotationDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/hasQuotationDate
      namespace: fibo-ind-indind
      localName: hasQuotationDate
      label: has quotation date
      definition: indicates the quotation date for a given market rate or indicator
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/Date
      inverseOf: ''
      characteristics: []
    isVolatilityOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/isVolatilityOf
      namespace: fibo-ind-indind
      localName: isVolatilityOf
      label: is volatility of
      definition: indicates something to which the volatility measure applies and of which it is a measure
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/Volatility
      range: ''
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasQuotationDateTime:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/hasQuotationDateTime
      namespace: fibo-ind-indind
      localName: hasQuotationDateTime
      label: has quotation date and time
      definition: indicates a quotation date and possibly a time for a given market rate, interest rate, indicator, or other
        quoted pricing information
      valueType: https://www.omg.org/spec/Commons/DatesAndTimes/CombinedDateTime
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
