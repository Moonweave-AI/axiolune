module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/IND/Indicators/Indicators/
  preferredPrefix: fibo-ind-indind
  version: '20250701'
  label: Indicators Ontology
  definition: This ontology provides the concepts common to all market rates, indices and indicators; that is concepts descriptive
    of the numeric parameters themselves. These are modeled independently of the values they may take over time.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Organizations/FormalOrganizations/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Collections/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/ContextualDesignators/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/DatesAndTimes/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/QuantitiesAndUnits/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: Indicators.rdf
