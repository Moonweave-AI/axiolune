domain:
  objectTypes:
    BasketOfCreditRisks:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/BasketOfCreditRisks
      namespace: fibo-ind-marbas
      localName: BasketOfCreditRisks
      label: basket of credit risks
      definition: basket of instruments, legal entities, or a combination thereof collected for the purpose of analyzing risk
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/WeightedBasket
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedStructuredCollection
      attributeUses: []
      patternBindings: []
    BasketOfEquities:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/BasketOfEquities
      namespace: fibo-ind-marbas
      localName: BasketOfEquities
      label: basket of equities
      definition: basket of securities whose constituents are listed shares
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Baskets/BasketOfSecurities
      attributeUses: []
      patternBindings: []
    CapitalizationBasedWeightingFunction:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/CapitalizationBasedWeightingFunction
      namespace: fibo-ind-marbas
      localName: CapitalizationBasedWeightingFunction
      label: capitalization-based weighting function
      definition: weighting function derived from the relative market capitalization (share price times the number of shares
        outstanding) of the companies tracked by an index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/WeightingFunction
      attributeUses: []
      patternBindings: []
    CreditIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/CreditIndex
      namespace: fibo-ind-marbas
      localName: CreditIndex
      label: credit index
      definition: reference index that is a function of credit events that change the value of an underlying portfolio
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/ReferenceIndex
      attributeUses: []
      patternBindings: []
    CreditIndexConstituent:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/CreditIndexConstituent
      namespace: fibo-ind-marbas
      localName: CreditIndexConstituent
      label: credit index constituent
      definition: constituent of a basket of credit risks
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/WeightedBasketConstituent
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedCollectionConstituent
      attributeUses: []
      patternBindings: []
    EquityIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/EquityIndex
      namespace: fibo-ind-marbas
      localName: EquityIndex
      label: equity index
      definition: benchmark whose constituents are exclusively equity instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/ReferenceIndex
      attributeUses: []
      patternBindings: []
    MarketCapitalization:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/MarketCapitalization
      namespace: fibo-ind-marbas
      localName: MarketCapitalization
      label: market capitalization
      definition: expression representing the perceived value of a company as determined by the stock market at a specific
        point in time
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    ReferenceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/ReferenceIndex
      namespace: fibo-ind-marbas
      localName: ReferenceIndex
      label: reference index
      definition: measure of change in the value of the contents of a basket over a given period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ScopedMeasure
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasMarketCapitalization:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasMarketCapitalization
      namespace: fibo-ind-marbas
      localName: hasMarketCapitalization
      label: has market capitalization
      definition: indicates the market capitalization of some issuer as of some date
      domain: https://spec.edmcouncil.org/fibo/ontology/SEC/Equities/EquityInstruments/ShareIssuer
      range: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/MarketCapitalization
      inverseOf: ''
      characteristics: []
    hasMarketCapitalizationValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasMarketCapitalizationValue
      namespace: fibo-ind-marbas
      localName: hasMarketCapitalizationValue
      label: has market capitalization value
      definition: indicates the monetary amount representing the market capitalization of some issuer as of some date
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/MarketCapitalization
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    hasOriginalNotionalValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasOriginalNotionalValue
      namespace: fibo-ind-marbas
      localName: hasOriginalNotionalValue
      label: has original notional value
      definition: indicates the notional amount represented by the index when it is first constituted
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/CreditIndex
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    hasPremium:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasPremium
      namespace: fibo-ind-marbas
      localName: hasPremium
      label: has premium
      definition: indicates a premium payable for a contract based on the index
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/CreditIndex
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    hasUpFrontFee:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasUpFrontFee
      namespace: fibo-ind-marbas
      localName: hasUpFrontFee
      label: has up front fee
      definition: specifies a fee payable by any party that wishes to participate in a contract based on the index after the
        start of its life
      domain: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/CreditIndex
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasDebtRanking:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasDebtRanking
      namespace: fibo-ind-marbas
      localName: hasDebtRanking
      label: has debt ranking
      definition: indicates the ranking of this debt instrument with respect to the credit index as a whole
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasIndexName:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasIndexName
      namespace: fibo-ind-marbas
      localName: hasIndexName
      label: has index name
      definition: specifies a formal name for the index
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasIndexValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasIndexValue
      namespace: fibo-ind-marbas
      localName: hasIndexValue
      label: has index value
      definition: specifies the value of a given index as of the release date
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasSpreadRange:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/hasSpreadRange
      namespace: fibo-ind-marbas
      localName: hasSpreadRange
      label: has spread range
      definition: the range of credit spread for the constituents of the index
      valueType: string
      defaultCardinality:
        minCount: 0
        maxCount: null
