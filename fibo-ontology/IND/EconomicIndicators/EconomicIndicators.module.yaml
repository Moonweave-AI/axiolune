domain:
  objectTypes:
    AverageDailyEarnings:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageDailyEarnings
      namespace: fibo-ind-ecoeco
      localName: AverageDailyEarnings
      label: average daily earnings
      definition: measure of the average daily wage an employee makes over the reporting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageEarnings
      attributeUses: []
      patternBindings: []
    AverageEarnings:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageEarnings
      namespace: fibo-ind-ecoeco
      localName: AverageEarnings
      label: average earnings
      definition: measure of the average wage an hourly or salaried worker makes in a given period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    AverageHourlyEarnings:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageHourlyEarnings
      namespace: fibo-ind-ecoeco
      localName: AverageHourlyEarnings
      label: average hourly earnings
      definition: measure of the average hourly wage an employee makes over the reporting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageEarnings
      attributeUses: []
      patternBindings: []
    AverageMonthlyEarnings:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageMonthlyEarnings
      namespace: fibo-ind-ecoeco
      localName: AverageMonthlyEarnings
      label: average monthly earnings
      definition: measure of the average monthly wage an employee makes over the reporting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageEarnings
      attributeUses: []
      patternBindings: []
    AverageWeeklyEarnings:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageWeeklyEarnings
      namespace: fibo-ind-ecoeco
      localName: AverageWeeklyEarnings
      label: average weekly earnings
      definition: measure of the average weekly wage an employee makes over the reporting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/AverageEarnings
      attributeUses: []
      patternBindings: []
    CapitalLaborEnergyMaterialsMultifactorProductivity:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CapitalLaborEnergyMaterialsMultifactorProductivity
      namespace: fibo-ind-ecoeco
      localName: CapitalLaborEnergyMaterialsMultifactorProductivity
      label: capital-labor-energy-materials multifactor productivity
      definition: ratio of a quantity index of gross output to a quantity index of combined inputs
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Productivity
      attributeUses: []
      patternBindings: []
    CapitalLaborMultifactorProductivityValueAdded:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CapitalLaborMultifactorProductivityValueAdded
      namespace: fibo-ind-ecoeco
      localName: CapitalLaborMultifactorProductivityValueAdded
      label: capital-labor multifactor productivity (MFP), based on value added
      definition: ratio of a quantity index of value added to a quantity index of combined labor and capital input
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Productivity
      attributeUses: []
      patternBindings: []
    CapitalProductivityValueAdded:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CapitalProductivityValueAdded
      namespace: fibo-ind-ecoeco
      localName: CapitalProductivityValueAdded
      label: capital productivity, based on value added
      definition: ratio of a quantity index of value added to a quantity index of capital input
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Productivity
      attributeUses: []
      patternBindings: []
    Civilian:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Civilian
      namespace: fibo-ind-ecoeco
      localName: Civilian
      label: civilian
      definition: person that is not a member of the military (i.e., that is not on active duty)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/LegallyCompetentNaturalPerson
      attributeUses: []
      patternBindings: []
    CivilianLaborForce:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianLaborForce
      namespace: fibo-ind-ecoeco
      localName: CivilianLaborForce
      label: civilian labor force
      definition: subset of the civilian, non-institutional population considered to be part of the labor force during a given
        reporting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianNonInstitutionalPopulation
      attributeUses: []
      patternBindings: []
    CivilianLaborForceParticipationRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianLaborForceParticipationRate
      namespace: fibo-ind-ecoeco
      localName: CivilianLaborForceParticipationRate
      label: civilian labor force participation rate
      definition: economic indicator representing the rate of participation the labor force of a given economy for some specified
        period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    CivilianNonInstitutionalPerson:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianNonInstitutionalPerson
      namespace: fibo-ind-ecoeco
      localName: CivilianNonInstitutionalPerson
      label: civilian non-institutional person
      definition: legal working-age person that does not live in an institution (for example, a correctional facility, long-term
        care hospital, or nursing home), and is not on active military duty
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/LegalWorkingAgePerson
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Civilian
      attributeUses: []
      patternBindings: []
    CivilianNonInstitutionalPopulation:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianNonInstitutionalPopulation
      namespace: fibo-ind-ecoeco
      localName: CivilianNonInstitutionalPopulation
      label: civilian non-institutional population
      definition: statistical universe consisting of people of a certain age who reside in a given region, do not live in
        institutions (for example, correctional facilities, long-term care hospitals, and nursing homes), and are not on active
        military duty
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalUniverse
      attributeUses: []
      patternBindings: []
    CombinedStatisticalArea:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CombinedStatisticalArea
      namespace: fibo-ind-ecoeco
      localName: CombinedStatisticalArea
      label: combined statistical area
      definition: combination of adjacent metropolitan and micropolitan areas with economic ties measured by commuting patterns
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/GovernmentSpecifiedStatisticalArea
      attributeUses: []
      patternBindings: []
    ConsumerPriceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/ConsumerPriceIndex
      namespace: fibo-ind-ecoeco
      localName: ConsumerPriceIndex
      label: consumer price index
      definition: economic indicator representing measure of the change over time in the prices of consumer goods and services
        that households consume
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    DiscouragedWorkerPopulation:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/DiscouragedWorkerPopulation
      namespace: fibo-ind-ecoeco
      localName: DiscouragedWorkerPopulation
      label: discouraged worker population
      definition: subset of the marginally attached population that have given a job-market related reason for not currently
        looking for work
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/MarginallyAttachedPopulation
      attributeUses: []
      patternBindings: []
    EconomicIndicator:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      namespace: fibo-ind-ecoeco
      localName: EconomicIndicator
      label: economic indicator
      definition: statistical measure of economic activity that is regular and comparable in the context of a statistical
        area (region), used for analysis of economic performance and predictions of future performance
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ScopedMeasure
      attributeUses: []
      patternBindings: []
    EmployedPopulation:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulation
      namespace: fibo-ind-ecoeco
      localName: EmployedPopulation
      label: employed population
      definition: subset of the civilian labor force considered to be employed during the reporting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianLaborForce
      attributeUses: []
      patternBindings: []
    EmployedPopulationPartTime:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulationPartTime
      namespace: fibo-ind-ecoeco
      localName: EmployedPopulationPartTime
      label: employed population part-time
      definition: subset of the employed population that includes persons that are working fewer than 30 to 35 hours per week
        based on usual working hours
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulation
      attributeUses: []
      patternBindings: []
    EmployedPopulationPartTimeForEconomicReasons:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulationPartTimeForEconomicReasons
      namespace: fibo-ind-ecoeco
      localName: EmployedPopulationPartTimeForEconomicReasons
      label: employed population part-time for economic reasons
      definition: subset of the employed population that includes persons that are working fewer than 30 to 35 hours per week
        due to slack work, unfavorable business conditions, inability to find full-time work, and seasonal declines in demand
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulationPartTime
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/UnderemployedPopulation
      attributeUses: []
      patternBindings: []
    EmployedPopulationPartTimeForNonEconomicReasons:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulationPartTimeForNonEconomicReasons
      namespace: fibo-ind-ecoeco
      localName: EmployedPopulationPartTimeForNonEconomicReasons
      label: employed population part-time for non-economic reasons
      definition: subset of the employed population that includes persons that are working fewer than 30 to 35 hours per week
        due to illness or other health or medical limitations, childcare problems, family or personal obligations, being in
        school or training, retirement or Social Security limits on earnings, and having a job where full-time work is less
        than 35 hours
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulationPartTime
      attributeUses: []
      patternBindings: []
    EmployedPopulationTemporarilyNotAtWork:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulationTemporarilyNotAtWork
      namespace: fibo-ind-ecoeco
      localName: EmployedPopulationTemporarilyNotAtWork
      label: employed population temporarily not at work
      definition: subset of the employed population that includes persons that are temporarily absent from work for various
        reasons
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmployedPopulation
      attributeUses: []
      patternBindings: []
    EmploymentPopulationRatio:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EmploymentPopulationRatio
      namespace: fibo-ind-ecoeco
      localName: EmploymentPopulationRatio
      label: employment-population ratio
      definition: economic indicator representing the ratio of the employed population with respect to the overall civilian
        non-institutional population of a given economy for some specified period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    Enterprise:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Enterprise
      namespace: fibo-ind-ecoeco
      localName: Enterprise
      label: enterprise
      definition: functional business entity that produces and/or sells goods or services
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/FunctionalBusinessEntity
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/InstitutionalUnit
      attributeUses: []
      patternBindings: []
    EnterprisePopulation:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EnterprisePopulation
      namespace: fibo-ind-ecoeco
      localName: EnterprisePopulation
      label: enterprise population
      definition: statistical universe consisting of enterprises designed for the purposes of supporting surveys such as those
        used as the basis for employment and producer price indices
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalUniverse
      attributeUses: []
      patternBindings: []
    Establishment:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Establishment
      namespace: fibo-ind-ecoeco
      localName: Establishment
      label: establishment
      definition: an enterprise (or part of an enterprise) that operates from a single physical location
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/InstitutionalUnit
      attributeUses: []
      patternBindings: []
    EstablishmentEmployment:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EstablishmentEmployment
      namespace: fibo-ind-ecoeco
      localName: EstablishmentEmployment
      label: establishment employment
      definition: economic indicator representing the total number of persons who work in or for the establishment including
        working proprietors, active business partners and unpaid family workers, as well as persons working outside the establishment
        when paid by and under the control of the establishment, for example, sales representatives, outside service engineers
        and repair and maintenance personnel
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    EstablishmentPopulation:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EstablishmentPopulation
      namespace: fibo-ind-ecoeco
      localName: EstablishmentPopulation
      label: establishment population
      definition: a subset of the enterprise population focused on establishments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EnterprisePopulation
      attributeUses: []
      patternBindings: []
    FixedBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/FixedBasket
      namespace: fibo-ind-ecoeco
      localName: FixedBasket
      label: fixed basket
      definition: basket of goods and services whose quantity and quality are held fixed for some period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Basket
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedStructuredCollection
      attributeUses: []
      patternBindings: []
    FixedBasketConstituent:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/FixedBasketConstituent
      namespace: fibo-ind-ecoeco
      localName: FixedBasketConstituent
      label: fixed basket constituent
      definition: component of a fixed basket
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/BasketConstituent
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedCollectionConstituent
      attributeUses: []
      patternBindings: []
    FixedBasketPopulation:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/FixedBasketPopulation
      namespace: fibo-ind-ecoeco
      localName: FixedBasketPopulation
      label: fixed basket population
      definition: statistical universe consisting of specific goods and/or services designed for the purposes of supporting
        surveys such as those used as the basis for price indices
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalUniverse
      attributeUses: []
      patternBindings: []
    GovernmentSpecifiedStatisticalArea:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/GovernmentSpecifiedStatisticalArea
      namespace: fibo-ind-ecoeco
      localName: GovernmentSpecifiedStatisticalArea
      label: government-specified statistical area
      definition: statistical area defined by a government agency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalArea
      attributeUses: []
      patternBindings: []
    GrossDomesticProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/GrossDomesticProduct
      namespace: fibo-ind-ecoeco
      localName: GrossDomesticProduct
      label: gross domestic product
      definition: economic indicator representing the broadest measure of aggregate economic activity, measuring the total
        unduplicated market value of all final goods and services produced within a statistical area in a period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      attributeUses: []
      patternBindings: []
    Household:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/Household
      namespace: fibo-ind-ecoeco
      localName: Household
      label: household
      definition: individual or small group of persons who occupy a housing unit (such as a house or apartment) as their usual
        place of residence, who pool some, or all, of their income and wealth and who consume certain types of goods and services
        collectively, mainly housing and food
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/InstitutionalUnit
      attributeUses: []
      patternBindings: []
    HousingUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/HousingUnit
      namespace: fibo-ind-ecoeco
      localName: HousingUnit
      label: housing unit
      definition: house, an apartment, a mobile home or trailer, a group of rooms, or a single room occupied as separate living
        quarters, or if vacant, intended for occupancy as separate living quarters
      superTypes:
      - https://www.omg.org/spec/Commons/Locations/PhysicalLocation
      attributeUses: []
      patternBindings: []
    InflationRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/InflationRate
      namespace: fibo-ind-ecoeco
      localName: InflationRate
      label: inflation rate
      definition: economic indicator representing a change in prices of goods and services for a specified period, for a given
        statistical area
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/EconomicIndicator
      attributeUses: []
      patternBindings: []
    InputProducerPriceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/InputProducerPriceIndex
      namespace: fibo-ind-ecoeco
      localName: InputProducerPriceIndex
      label: input producer price index
      definition: economic indicator representing measure of the rate of change over time in the prices of inputs of goods
        and services purchased by the producer
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/ProducerPriceIndex
      attributeUses: []
      patternBindings: []
    InstitutionalPerson:
