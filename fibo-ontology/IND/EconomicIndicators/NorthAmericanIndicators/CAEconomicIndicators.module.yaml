domain:
  objectTypes:
    CanadianConsumerPriceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/CAEconomicIndicators/CanadianConsumerPriceIndex
      namespace: fibo-ind-econor
      localName: CanadianConsumerPriceIndex
      label: Canadian consumer price index
      definition: economic indicator representing a measure of changes over time in the prices of a fixed basket of consumer
        goods and services that Canadian private households consume
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/ConsumerPriceIndex
      attributeUses: []
      patternBindings: []
    CanadianHouseholdsConsumersUniverse:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/CAEconomicIndicators/CanadianHouseholdsConsumersUniverse
      namespace: fibo-ind-econor
      localName: CanadianHouseholdsConsumersUniverse
      label: Canadian households consumers universe
      definition: a statistical universe consisting of all private households in Canada, with the exception of soldiers on
        military bases, people living on First Nations reserves, institutionalized persons, and households living in the rural
        areas of the three northern territories
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianNonInstitutionalPopulation
      attributeUses: []
      patternBindings: []
    CanadianProducerPriceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/CAEconomicIndicators/CanadianProducerPriceIndex
      namespace: fibo-ind-econor
      localName: CanadianProducerPriceIndex
      label: Canadian producer price index
      definition: an economic indicator representing a measure of the change over time in the prices of a fixed-basket of
        domestic producer goods and services
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/ProducerPriceIndex
      attributeUses: []
      patternBindings: []
    IndustrialProductsSector:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/CAEconomicIndicators/IndustrialProductsSector
      namespace: fibo-ind-econor
      localName: IndustrialProductsSector
      label: industrial products sector
      definition: a classifier for a sector of the economy used for price indices focused on major commodities sold by manufacturers
        in Canada
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/ClassificationSchemes/IndustrySectorClassifier
      attributeUses: []
      patternBindings: []
    NewHousingSector:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/CAEconomicIndicators/NewHousingSector
      namespace: fibo-ind-econor
      localName: NewHousingSector
      label: new housing sector
      definition: a classifier for a sector of the economy used for price indices focused on contractors' selling prices of
        new residential houses, where detailed specifications pertaining to each house remain the same between two consecutive
        periods
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/ClassificationSchemes/IndustrySectorClassifier
      attributeUses: []
      patternBindings: []
    RawMaterialsSector:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/CAEconomicIndicators/RawMaterialsSector
      namespace: fibo-ind-econor
      localName: RawMaterialsSector
      label: raw materials sector
      definition: a classifier used for price indices related to raw materials purchased by industries in Canada for further
        processing
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/ClassificationSchemes/IndustrySectorClassifier
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
