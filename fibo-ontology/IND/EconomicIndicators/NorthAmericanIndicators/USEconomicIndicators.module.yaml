domain:
  objectTypes:
    AmericanStatisticsPublisher:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/AmericanStatisticsPublisher
      namespace: fibo-ind-econor
      localName: AmericanStatisticsPublisher
      label: American statistics publisher
      definition: statistical information publisher comprised of the government agencies and departments that publish statistical
        information on behalf of the U.S. Federal Government
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/StatisticalInformationPublisher
      attributeUses: []
      patternBindings: []
    ConsumerExpenditureSurvey:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/ConsumerExpenditureSurvey
      namespace: fibo-ind-econor
      localName: ConsumerExpenditureSurvey
      label: consumer expenditure survey
      definition: statistical program conducted on a regular basis that provides information on the buying habits of consumers,
        including data on their expenditures, income, and consumer unit (families and single consumers) characteristics
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalProgram
      attributeUses: []
      patternBindings: []
    CurrentEmploymentStatistics:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/CurrentEmploymentStatistics
      namespace: fibo-ind-econor
      localName: CurrentEmploymentStatistics
      label: current employment statistics
      definition: survey conducted on a regular basis that presents analytical information related to businesses and government
        agencies, in order to provide detailed industry data on employment, hours, and earnings of workers
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalProgram
      attributeUses: []
      patternBindings: []
    CurrentPopulationSurvey:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/CurrentPopulationSurvey
      namespace: fibo-ind-econor
      localName: CurrentPopulationSurvey
      label: current population survey
      definition: survey conducted on a regular basis that presents analytical information related to the general population
        of a given statistical area with respect to labor force, employment, unemployment, persons not in the labor force,
        hours of work, earnings, and other demographic and labor force characteristics
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalProgram
      attributeUses: []
      patternBindings: []
    EmploymentSituationEstablishmentSurvey:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/EmploymentSituationEstablishmentSurvey
      namespace: fibo-ind-econor
      localName: EmploymentSituationEstablishmentSurvey
      label: employment situation establishment survey
      definition: survey conducted on a regular basis that presents analytical information related to the labor force of a
        given statistical area, surveyed with respect to businesses, and is, for the most part, seasonally adjusted
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/EmploymentSituationSurvey
      attributeUses: []
      patternBindings: []
    EmploymentSituationHouseholdSurvey:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/EmploymentSituationHouseholdSurvey
      namespace: fibo-ind-econor
      localName: EmploymentSituationHouseholdSurvey
      label: employment situation household survey
      definition: a survey conducted on a regular basis that presents analytical information related to the labor force of
        a given statistical area, surveyed with respect to households, and is, for the most part, seasonally adjusted
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/EmploymentSituationSurvey
      attributeUses: []
      patternBindings: []
    EmploymentSituationSurvey:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/EmploymentSituationSurvey
      namespace: fibo-ind-econor
      localName: EmploymentSituationSurvey
      label: employment situation survey
      definition: a survey conducted on a regular basis that presents analytical information focused on the employment characteristics
        of a given statistical area
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/CurrentEmploymentStatistics
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/CurrentPopulationSurvey
      attributeUses: []
      patternBindings: []
    PointOfPurchaseSurvey:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/PointOfPurchaseSurvey
      namespace: fibo-ind-econor
      localName: PointOfPurchaseSurvey
      label: point of purchase survey
      definition: a program conducted on a regular basis that provides information on purchases of various items and services
        by consumers
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/StatisticalProgram
      attributeUses: []
      patternBindings: []
    USProducerPriceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/USProducerPriceIndex
      namespace: fibo-ind-econor
      localName: USProducerPriceIndex
      label: U.S. producer price index
      definition: an economic indicator representing a measure of the change over time in the selling prices received by domestic
        producers for their output
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/ProducerPriceIndex
      attributeUses: []
      patternBindings: []
    UrbanConsumerPriceIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/UrbanConsumerPriceIndex
      namespace: fibo-ind-econor
      localName: UrbanConsumerPriceIndex
      label: urban consumer price index
      definition: an economic indicator representing a measure of the average change over time in the prices paid by urban
        consumers for a market basket of consumer goods and services
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/ConsumerPriceIndex
      attributeUses: []
      patternBindings: []
    UrbanConsumersUniverse:
      iri: https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/NorthAmericanIndicators/USEconomicIndicators/UrbanConsumersUniverse
      namespace: fibo-ind-econor
      localName: UrbanConsumersUniverse
      label: urban consumers universe
      definition: a statistical universe for consumer expenditure surveys consisting of people within a household that make
        joint expenditure decisions
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/EconomicIndicators/EconomicIndicators/CivilianNonInstitutionalPopulation
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
