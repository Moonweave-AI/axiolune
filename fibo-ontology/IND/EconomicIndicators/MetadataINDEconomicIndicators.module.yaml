  label: Metadata about the EDMC-FIBO Indices and Indicators (IND) Economic Indicators Module
  definition: The economic indicators module includes ontologies defining concepts to do with published economic indicators.
    These give some indication of the state of some economy. Indicators of this type are usually published by governments
    or government agencies, or by international agencies or agencies of countries other than the ones reported on. Examples
    include Gross Domestic Product (GDP) and unemployment rates.
