  objectTypes:
    FinalProspectus:
      iri: https://spec.edmcouncil.org/fibo/ontology/BP/SecuritiesIssuance/IssuanceDocuments/FinalProspectus
      namespace: fibo-bp-seciss
      localName: FinalProspectus
      label: final prospectus
      definition: The final Prospectus for an issue describes the Offer Issue, including facts about the issue itself such
        as closing dates, and known facts about the securities that will form part of that issue.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesIssuance/Prospectus
