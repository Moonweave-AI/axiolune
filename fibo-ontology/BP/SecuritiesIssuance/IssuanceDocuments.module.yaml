    Indenture:
      iri: https://spec.edmcouncil.org/fibo/ontology/BP/SecuritiesIssuance/IssuanceDocuments/Indenture
      namespace: fibo-bp-seciss
      localName: Indenture
      label: indenture
      definition: A written contract, also known as a "Deed of Trust", under which bonds and debentures are issued, setting
        forth maturity date, interest rate, redemption rights, call privileges and other terms. Under the rules of the Trust
        Indenture Act of 1939, the contract is executed by the issuer and a trustee who acts on behalf of the bondholders.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BP/SecuritiesIssuance/IssuanceDocuments/SecuritiesIssuanceAgreement
