      label: bond offering with warrant
      definition: 'a bond offering where the issue includes a warrant; Further notes: ISO 10962 CFI definition is A bond that
        is issued together with one or more warrant(s) attached as part of the offer, the warrant(s) granting the holder the
        right to purchase a designated security, often the common stock of the issuer of the debt, at a specified price. Review
        notes: This need not be any specific type of bond. The warrant is used as a sweetener to encourage people to subscribe
        to a new bond issue. The Bond and the Warrant trade together as a unit (called "Bond Unit").'
      superTypes:
