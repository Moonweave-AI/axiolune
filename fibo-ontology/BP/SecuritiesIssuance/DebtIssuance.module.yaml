  attributeTypes:
    isBankQualified:
      iri: https://spec.edmcouncil.org/fibo/ontology/BP/SecuritiesIssuance/DebtIssuance/isBankQualified
      namespace: fibo-bp-secdeb
      localName: isBankQualified
      label: is bank qualified
      definition: designation given to a public purpose bond offering by the issuer if it reasonably expects to issue in the
        calendar year of such offering no more than $10 million par amount of bonds of the type required to be included in
        making such calculation under the Internal Revenue Code.  When purchased by a commercial bank for its portfolio, the
        bank may receive an 80% tax deduction for the interest cost of carry for the issue.  A bond that is bank qualified
        is also known as a qualified tax-exempt obligation.
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
