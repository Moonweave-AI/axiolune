  version: '20260401'
  label: Metadata for the FIBO Business Process (BP) Domain
  definition: "The Business Process (BP) domain includes ontologies that define financial process flows such as securities\
    \ issuance and transaction workflows. In the case of securities issuance process models, these are provided in order to\
    \ be able to represent reference data concepts that are dependent on the process by which a security was issued. Transaction\
    \ process semantics provide the basis for the temporal dimension of securities and derivatives transactions.  These are\
    \ process models represented using basic semantic primitive concepts of events, activities and control flows.\n\t\t\n\t\
    \tNote that the ontologies included in the BP domain are considered provisional and have not undergone serious review\
    \ or integration with other parts of FIBO as of Q1 2026."
