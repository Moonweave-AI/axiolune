  label: Commercial Registration Authorities Ontology
  definition: This ontology specifies definitions for a number of organizations that provide broad based data services, including
    registration services, such as market data providers, instrument identifier issuers, organizations that provide exchanges
    in multiple countries, and the like. It is not intended to be exhaustive, but covers the primary LOUs for LEI issuance
    among others. Note that this ontology only provides reference data, no additional semantics.
