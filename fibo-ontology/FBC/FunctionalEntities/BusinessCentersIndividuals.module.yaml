  label: Business Centers Individuals
  definition: "This ontology includes individuals representing the set of international business centers corresponding to\
    \ those identified in FpML as well as additional municipalities called out in the ISO 10383 Codes for exchanges and market\
    \ identification (MIC) standard.\n\t\tThis set of business centers is current with respect to the FpML published XML data\
    \ as of Q2 2023 and additional municipalities included in the MIC codes as of Q1 2026. Note that we have deviated from\
    \ the standard FIBO naming convention of strict use of camel case to add underscores in certain city names for readability\
    \ purposes."
