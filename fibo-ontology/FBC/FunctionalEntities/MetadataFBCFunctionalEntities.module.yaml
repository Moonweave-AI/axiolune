  label: Metadata about the FIBO Financial Business and Commerce (FBC) Functional Entities Module
  definition: The functional entities module includes ontologies that define business entities according to their function
    as opposed to their form. They include service providers such as financial institutions (e.g., banks, investment companies,
    and insurance companies), government regulatory and registration agencies, as well as entities described in terms of their
    function in some process, such as clearing houses.
