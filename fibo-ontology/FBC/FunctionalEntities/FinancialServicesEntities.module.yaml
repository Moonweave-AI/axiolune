      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/PayrollService
      namespace: fibo-fbc-funfin
      localName: PayrollService
      label: payroll service
      definition: financial service, typically provided to small businesses that are not large enough to have an internal
