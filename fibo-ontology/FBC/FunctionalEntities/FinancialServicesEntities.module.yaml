      namespace: fibo-fbc-funfin
      localName: MoneyServicesBusiness
      label: money services business
      definition: 'any person doing business, whether or not on a regular basis or as an organized business concern, in one
        of the following capacities: (1) currency dealer or exchanger, (2) check casher, (3) issuer of traveler''s checks,
        money orders, or stored value, (4) seller or redeemer of traveler''s checks, money orders, or stored value, (5) money
        transmitter, or (6) postal service'
