domain:
  objectTypes:
    Bank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Bank
      namespace: fibo-fbc-funfin
      localName: Bank
      label: bank
      definition: depository institution, usually a corporation, that accepts deposits, makes loans, pays checks, and performs
        related services, for individual members of the public, businesses or other organizations
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DepositoryInstitution
      attributeUses: []
      patternBindings: []
    BankHoldingCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BankHoldingCompany
      namespace: fibo-fbc-funfin
      localName: BankHoldingCompany
      label: bank holding company
      definition: any company that owns and/or has direct or indirect control of one or more banks; BHCs may also own nonbanking
        subsidiaries such as broker-dealers and asset managers
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/HoldingCompany
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    BankingProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BankingProduct
      namespace: fibo-fbc-funfin
      localName: BankingProduct
      label: banking product
      definition: product provided to consumers and businesses by a depository institution
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProduct
      attributeUses: []
      patternBindings: []
    BankingService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BankingService
      namespace: fibo-fbc-funfin
      localName: BankingService
      label: banking service
      definition: financial service offered by a depository institution
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
    BrokerageFirm:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BrokerageFirm
      namespace: fibo-fbc-funfin
      localName: BrokerageFirm
      label: brokerage firm
      definition: firm in the business of buying and selling securities, operating as both a broker and a dealer, depending
        on the transaction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/BrokerDealer
      attributeUses: []
      patternBindings: []
    BusinessIdentifierCode:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BusinessIdentifierCode
      namespace: fibo-fbc-funfin
      localName: BusinessIdentifierCode
      label: business identifier code
      definition: international identifier for financial and non-financial institutions used to facilitate automated processing
        of information for financial services
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
      - https://www.omg.org/spec/Commons/ContextualIdentifiers/StructuredIdentifier
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentifier
      attributeUses: []
      patternBindings: []
    BusinessIdentifierCodeScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BusinessIdentifierCodeScheme
      namespace: fibo-fbc-funfin
      localName: BusinessIdentifierCodeScheme
      label: business identifier code scheme
      definition: scheme that specifies the elements of a unique business identifier code (BIC) scheme to identify financial
        and non-financial institutions used to facilitate automated processing of information for financial services
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeSet
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentificationScheme
      attributeUses: []
      patternBindings: []
    BusinessPartyPrefix:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BusinessPartyPrefix
      namespace: fibo-fbc-funfin
      localName: BusinessPartyPrefix
      label: business party prefix
      definition: four-character (4 alphanumeric) code associated with an organization for the purposes of banking telecommunications
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentifier
      attributeUses: []
      patternBindings: []
    BusinessPartySuffix:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BusinessPartySuffix
      namespace: fibo-fbc-funfin
      localName: BusinessPartySuffix
      label: business party suffix
      definition: two-character (2 alphanumeric) code associated with the organization for the purposes of banking telecommunications
      superTypes:
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeElement
      attributeUses: []
      patternBindings: []
    CentralBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CentralBank
      namespace: fibo-fbc-funfin
      localName: CentralBank
      label: central bank
      definition: financial institution that is the monetary authority and major regulatory bank for a country (or group of
        countries)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Bank
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/MonetaryAuthority
      attributeUses: []
      patternBindings: []
    CentralCounterpartyClearingHouse:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CentralCounterpartyClearingHouse
      namespace: fibo-fbc-funfin
      localName: CentralCounterpartyClearingHouse
      label: central counterparty clearing house
      definition: clearing house that helps facilitate trading in derivatives and equities markets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingHouse
      attributeUses: []
      patternBindings: []
    CentralSecuritiesDepository:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CentralSecuritiesDepository
      namespace: fibo-fbc-funfin
      localName: CentralSecuritiesDepository
      label: central securities depository
      definition: functional entity that provides a central point for depositing financial instruments ('securities'), for
        example, bonds and shares
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    ClearingBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingBank
      namespace: fibo-fbc-funfin
      localName: ClearingBank
      label: clearing bank
      definition: commercial bank that facilitates payment and settlement of financial transactions, such as check clearing
        or facilitating trades between the sellers and buyers of securities or other financial instruments or contracts
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingHouse
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CommercialBank
      attributeUses: []
      patternBindings: []
    ClearingCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingCorporation
      namespace: fibo-fbc-funfin
      localName: ClearingCorporation
      label: clearing corporation
      definition: clearing house that is organized as a corporation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingHouse
      attributeUses: []
      patternBindings: []
    ClearingHouse:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingHouse
      namespace: fibo-fbc-funfin
      localName: ClearingHouse
      label: clearing house
      definition: financial service provider that is exchange affiliated and provides clearing services, including the validation,
        delivery, and settlement of financial transactions, for financial intermediaries
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    ClearingService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingService
      namespace: fibo-fbc-funfin
      localName: ClearingService
      label: clearing service
      definition: service provided on behalf of an institutional market participant by a clearing services provider following
        a trade that finalizes the transfer of security ownership
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
    CommercialBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CommercialBank
      namespace: fibo-fbc-funfin
      localName: CommercialBank
      label: commercial bank
      definition: depository institution that engages in various financial services, such as accepting deposits and making
        loans
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Bank
      attributeUses: []
      patternBindings: []
    CommercialFinanceCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CommercialFinanceCompany
      namespace: fibo-fbc-funfin
      localName: CommercialFinanceCompany
      label: commercial finance company
      definition: finance company that makes loans to manufacturers and wholesalers, secured by accounts receivable, inventories,
        and equipment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinanceCompany
      attributeUses: []
      patternBindings: []
    CommodityTradingAdvisor:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CommodityTradingAdvisor
      namespace: fibo-fbc-funfin
      localName: CommodityTradingAdvisor
      label: commodity trading advisor
      definition: party that directly or indirectly advises others as to the value or advisability of buying or selling futures
        contracts or options
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
    ConsumerFinanceCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ConsumerFinanceCompany
      namespace: fibo-fbc-funfin
      localName: ConsumerFinanceCompany
      label: consumer finance company
      definition: finance company that lends to individuals under the small loans laws of the jurisdiction in which they operate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinanceCompany
      attributeUses: []
      patternBindings: []
    ContractualSavingsInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ContractualSavingsInstitution
      namespace: fibo-fbc-funfin
      localName: ContractualSavingsInstitution
      label: contractual savings institution
      definition: financial institution that provides the opportunity for individuals to invest in collective investment vehicles
        in a fiduciary rather than a principle role
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/OwnershipParties/Investor
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
    CreditUnion:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CreditUnion
      namespace: fibo-fbc-funfin
      localName: CreditUnion
      label: credit union
      definition: not-for-profit depository institution that makes personal loans and offers other consumer banking services,
        organized for the purpose of promoting thrift among its members and creating a source of credit for provident or productive
        purposes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/CooperativeSociety
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DepositoryInstitution
      attributeUses: []
      patternBindings: []
    DataProcessingService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DataProcessingService
      namespace: fibo-fbc-funfin
      localName: DataProcessingService
      label: data processing service
      definition: financial service offered by an entity primarily engaged in providing infrastructure for hosting or data
        processing services
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
    DataProcessingServicer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DataProcessingServicer
      namespace: fibo-fbc-funfin
      localName: DataProcessingServicer
      label: data processing servicer
      definition: finance services provider primarily engaged in providing infrastructure for hosting or data processing services
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    DepositoryInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DepositoryInstitution
      namespace: fibo-fbc-funfin
      localName: DepositoryInstitution
      label: depository institution
      definition: any financial institution engaged in the business of receiving demand deposits from the public or other
        institutions
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    DevelopmentBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DevelopmentBank
      namespace: fibo-fbc-funfin
      localName: DevelopmentBank
      label: development bank
      definition: national or regional financial institution designed to provide medium- and long-term capital for productive
        investment, often accompanied by technical assistance, in poor countries
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    ElectronicFundsTransferService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ElectronicFundsTransferService
      namespace: fibo-fbc-funfin
      localName: ElectronicFundsTransferService
      label: electronic funds transfer service
      definition: service involving any transfer of funds other than a transaction involving a paper instrument, that is initiated
        through an electronic terminal, telephone, or computer and that orders or authorizes a financial institution to debit
        or credit an account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
    FaceAmountCertificateCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FaceAmountCertificateCompany
      namespace: fibo-fbc-funfin
      localName: FaceAmountCertificateCompany
      label: face amount certificate company
      definition: investment company which is engaged or proposes to engage in the business of issuing face-amount certificates
        of the installment type, or which has been engaged in such business and has any such certificate outstanding
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InvestmentCompany
      attributeUses: []
      patternBindings: []
    FinanceCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinanceCompany
      namespace: fibo-fbc-funfin
      localName: FinanceCompany
      label: finance company
      definition: financial intermediary in the business of making loans that obtains its financing from banks, institutions,
        and other money market sources rather than from deposits
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
    FinancialInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      namespace: fibo-fbc-funfin
      localName: FinancialInstitution
      label: financial institution
      definition: financial service provider identified as either a government agency or privately owned entity that collects
        funds from the public and from other institutions, and invests those funds in financial assets, such as loans, securities,
        bank deposits, and income-generating property
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    FinancialServiceProviderIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialServiceProviderIdentifier
      namespace: fibo-fbc-funfin
      localName: FinancialServiceProviderIdentifier
      label: financial service provider identifier
      definition: identifier that is officially allocated to a financial service provider based on a function that they provide,
        typically in a jurisdiction over which a regulatory agency has some jurisdiction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/PartyRoleIdentifier
      attributeUses: []
      patternBindings: []
    FinancialServiceProviderIdentifierScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialServiceProviderIdentifierScheme
      namespace: fibo-fbc-funfin
      localName: FinancialServiceProviderIdentifierScheme
      label: financial service provider identifier scheme
      definition: scheme that defines the financial service provider identifier per the issuing registration authority or
        regulatory agency
      superTypes:
      - https://www.omg.org/spec/Commons/Identifiers/IdentificationScheme
      attributeUses: []
      patternBindings: []
    FuturesCommissionMerchant:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FuturesCommissionMerchant
      namespace: fibo-fbc-funfin
      localName: FuturesCommissionMerchant
      label: futures commission merchant
      definition: 'party that does both of the following: (1) solicits or accepts orders to buy or sell futures contracts,
        options on futures, retail off-exchange forex contracts, or swaps and (2) accepts money or other assets from customers
        to support such orders'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
    HoldingCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/HoldingCompany
      namespace: fibo-fbc-funfin
      localName: HoldingCompany
      label: holding company
      definition: business entity established to own stock in another company, typically to own enough voting shares to have
        some level of control over that company's policies and management
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/FunctionalBusinessEntity
      attributeUses: []
      patternBindings: []
    InsuranceCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InsuranceCompany
      namespace: fibo-fbc-funfin
      localName: InsuranceCompany
      label: insurance company
      definition: non-depository institution whose primary and predominant business activity is the writing of insurance or
        the reinsuring of risks underwritten by insurance companies, and that provides compensation based on the happening
        of at least one contingency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/RiskPoolingInstitution
      attributeUses: []
      patternBindings: []
    InsuranceService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InsuranceService
      namespace: fibo-fbc-funfin
      localName: InsuranceService
      label: insurance service
      definition: financial service in which the insurer promises to provide compensation for specific potential future losses
        in exchange for a periodic payment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
    InvestmentBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InvestmentBank
      namespace: fibo-fbc-funfin
      localName: InvestmentBank
      label: investment bank
      definition: financial service provider that acts as an underwriter or agent that serves as intermediary between the
        issuer of securities and the investing public
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    InvestmentCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InvestmentCompany
      namespace: fibo-fbc-funfin
      localName: InvestmentCompany
      label: investment company
      definition: 'any issuer which: (a) is or holds itself out as being engaged primarily, or proposes to engage primarily,
        in the business of investing, reinvesting, or trading in securities; (b) is engaged or proposes to engage in the business
        of issuing face-amount certificates of the installment type, or has been engaged in such business and has any such
        certificate outstanding; or (c) is engaged or proposes to engage in the business of investing, reinvesting, owning,
        holding, or trading in securities, and owns or proposes to acquire investment securities having a value exceeding
        40 per centum of the value of such issuer&apos;s total assets (exclusive of Government securities and cash items)
        on an unconsolidated basis'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
