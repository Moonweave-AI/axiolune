      localName: InvestmentService
      label: investment service
      definition: financial service designed to assist investors in using capital to create more money, either through income-producing
        vehicles or through more risk-oriented ventures to result in capital gains, including but not limited to providing
        investment advice, asset and portfolio management, and brokerage services
