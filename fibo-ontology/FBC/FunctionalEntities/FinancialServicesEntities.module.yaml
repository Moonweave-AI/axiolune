        or homestead association; or (c) any cooperative bank (other than a cooperative bank which is a state bank as defined
        in subsection (a)(2)) of the Federal Deposit Insurance Act, which is organized and operating according to the laws
        of the State (as defined in subsection (a)(3)) in which it is chartered or organized; and (c) any corporation (other
