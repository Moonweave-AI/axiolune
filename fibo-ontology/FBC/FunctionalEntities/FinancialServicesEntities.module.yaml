  label: Financial Services Entities Ontology
  definition: This ontology defines basic financial service providers, such as holding companies, financial institutions (both
    depository and non-depository institutions), and clearing houses at a relatively general level. Nuances specific to the
    institutions located in a specific country are defined in jurisdiction specific dependent ontologies.
