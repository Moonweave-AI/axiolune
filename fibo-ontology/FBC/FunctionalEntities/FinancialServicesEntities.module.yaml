      attributeUses: []
      patternBindings: []
    MerchantService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/MerchantService
      namespace: fibo-fbc-funfin
      localName: MerchantService
      label: merchant service
      definition: financial service provided by a financial institution to a merchant or other business, including but not
        limited to managing financial transactions via a secure channel
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      attributeUses: []
      patternBindings: []
