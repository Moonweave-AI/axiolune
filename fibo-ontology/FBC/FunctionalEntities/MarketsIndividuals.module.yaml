  label: Markets Individuals
  definition: "This ontology includes individuals representing the set of markets and exchanges corresponding to the ISO 10383\
    \ Codes for exchanges and market identification (MIC) standard.\n      This set of markets and MIC codes is current with\
    \ respect to the published ISO 10383 data as of the dct:issued date, as processed for FIBO on the dct:modified date."
