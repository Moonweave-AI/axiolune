      definition: concatenation of an entity's business number, the 'RT' abbreviation and a 4-digit subaccount number used
        for reporting GST/HST
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/ValueAddedTaxIdentificationNumber
