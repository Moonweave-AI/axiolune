      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/CARegulatoryAgencies/CorporationIncomeTaxNumber
      namespace: fibo-fbc-funnor
      localName: CorporationIncomeTaxNumber
      label: corporation income tax number
      definition: concatenation of an entity's business number, the 'RC' abbreviation and a 4-digit subaccount number used
        for reporting corporate income tax
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/CARegulatoryAgencies/BusinessNumber
      attributeUses: []
      patternBindings: []
