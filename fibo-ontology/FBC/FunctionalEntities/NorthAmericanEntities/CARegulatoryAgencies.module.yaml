    BusinessNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/CARegulatoryAgencies/BusinessNumber
      namespace: fibo-fbc-funnor
      localName: BusinessNumber
      label: business number
      definition: unique, 9-digit number that is the standard identifier for legal entities in Canada which are typically
        a business
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/TaxIdentifier
      - https://www.omg.org/spec/Commons/Organizations/OrganizationIdentifier
