domain:
  objectTypes:
    AgencyOfAForeignBankingOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgencyOfAForeignBankingOrganization
      namespace: fibo-fbc-funnor
      localName: AgencyOfAForeignBankingOrganization
      label: agency of a foreign banking organization
      definition: place of business of a foreign bank, located in any state, at which credit balances are maintained, checks
        are paid, money is lent, or, to the extent not prohibited by state or federal law, deposits are accepted from a person
        or entity that is not a citizen or resident of the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    AgreementCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgreementCorporation
      namespace: fibo-fbc-funnor
      localName: AgreementCorporation
      label: agreement corporation
      definition: corporation chartered by a state to engage in international banking, so named because the corporation enters
        into an 'agreement' with the Fed's Board of Governors that it will limit its activities to those permitted
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    AgreementCorporation-Banking:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgreementCorporation-Banking
      namespace: fibo-fbc-funnor
      localName: AgreementCorporation-Banking
      label: agreement corporation - banking
      definition: agreement corporation whose charter allows the corporation to engage in international banking
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DepositoryInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgreementCorporation
      attributeUses: []
      patternBindings: []
    AgreementCorporation-Investment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgreementCorporation-Investment
      namespace: fibo-fbc-funnor
      localName: AgreementCorporation-Investment
      label: agreement corporation - investment
      definition: agreement corporation whose charter allows the corporation to engage in international investment banking
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InvestmentBank
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgreementCorporation
      attributeUses: []
      patternBindings: []
    BankersBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BankersBank
      namespace: fibo-fbc-funnor
      localName: BankersBank
      label: bankers' bank
      definition: commercial bank owned exclusively (except to the extent directors' qualifying shares are required by law)
        by other depository institutions or depository institution holding companies, the activities of which are limited
        by its articles of association exclusively to providing services to or for other depository institutions, their holding
        companies, and the officers, directors, and employees of such institutions and companies, and to providing correspondent
        banking services at the request of other depository institutions or their holding companies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/CommercialBank
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/USBank
      attributeUses: []
      patternBindings: []
    BankersBankNotSubjectToReserveRequirements:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BankersBankNotSubjectToReserveRequirements
      namespace: fibo-fbc-funnor
      localName: BankersBankNotSubjectToReserveRequirements
      label: bankers' bank that is not subject to reserve requirements
      definition: bankers' bank whose activities are not limited by specific requirements of the Federal Reserve
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BankersBank
      attributeUses: []
      patternBindings: []
    BankersBankSubjectToReserveRequirements:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BankersBankSubjectToReserveRequirements
      namespace: fibo-fbc-funnor
      localName: BankersBankSubjectToReserveRequirements
      label: bankers' bank subject to reserve requirements
      definition: bankers' bank whose activities are limited by specific requirements of the Federal Reserve
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BankersBank
      attributeUses: []
      patternBindings: []
    BranchOfADepositoryInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BranchOfADepositoryInstitution
      namespace: fibo-fbc-funnor
      localName: BranchOfADepositoryInstitution
      label: branch of a depository institution
      definition: any office or any place of business located in any State of the United States at which deposits are received
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/Branch
      attributeUses: []
      patternBindings: []
    CommercialLendingCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/CommercialLendingCompany
      namespace: fibo-fbc-funnor
      localName: CommercialLendingCompany
      label: commercial lending company
      definition: any institution, other than a bank or an organization operating under section 25 of the Federal Reserve
        Act [12 U.S.C. 601 et seq.], organized under the laws of any State of the United States, or the District of Columbia
        which maintains credit balances incidental to or arising out of the exercise of banking powers and engages in the
        business of making commercial loans
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
    CooperativeBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/CooperativeBank
      namespace: fibo-fbc-funnor
      localName: CooperativeBank
      label: cooperative bank
      definition: state-chartered savings association that is organized and operates according to the laws of the state in
        which it is chartered or organized, including Massachusetts, New Hampshire, Rhode Island or Vermont
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ThriftInstitution
      attributeUses: []
      patternBindings: []
    DomesticBranchOfAForeignBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticBranchOfAForeignBank
      namespace: fibo-fbc-funnor
      localName: DomesticBranchOfAForeignBank
      label: domestic branch of a foreign bank
      definition: place of business of a foreign bank, located in any state, at which deposits are received, and that is not
        an agency as defined in https://www.ecfr.gov/current/title-12/chapter-II/subchapter-A/part-211/subpart-B/section-211.21
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BranchOfADepositoryInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/OfficeOfAForeignBank
      attributeUses: []
      patternBindings: []
    DomesticBranchOfDomesticBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticBranchOfDomesticBank
      namespace: fibo-fbc-funnor
      localName: DomesticBranchOfDomesticBank
      label: domestic branch of domestic bank
      definition: branch that resides in the United States, and whose parent is also located in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BranchOfADepositoryInstitution
      attributeUses: []
      patternBindings: []
    DomesticEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticEntity
      namespace: fibo-fbc-funnor
      localName: DomesticEntity
      label: domestic entity
      definition: financial service provider that is incorporated and domiciled in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    DomesticEntityOther:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticEntityOther
      namespace: fibo-fbc-funnor
      localName: DomesticEntityOther
      label: domestic entity other
      definition: domestic institution that engages in banking activities usually in connection with the business of banking
        in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticEntity
      attributeUses: []
      patternBindings: []
    DomesticNonBankSubsidiaryOfADomesticEntity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticNonBankSubsidiaryOfADomesticEntity
      namespace: fibo-fbc-funnor
      localName: DomesticNonBankSubsidiaryOfADomesticEntity
      label: domestic non-bank subsidiary of a domestic entity
      definition: non-bank financial service provider based in the United States of which 25 percent or more of whose voting
        shares are owned or controlled by an entity that is also based in the United States, or of which a majority of its
        directors are controlled by such domestic entity, or of which 25 percent or more of whose voting shares are held by
        trustees for the benefit of the shareholders or members of such domestic entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticEntity
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/NonBankSubsidiaryOfADomesticEntity
      attributeUses: []
      patternBindings: []
    EdgeCorporation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/EdgeCorporation
      namespace: fibo-fbc-funnor
      localName: EdgeCorporation
      label: edge corporation
      definition: corporation chartered by the Federal Reserve to engage in international banking and financial operations
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    EdgeCorporation-Banking:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/EdgeCorporation-Banking
      namespace: fibo-fbc-funnor
      localName: EdgeCorporation-Banking
      label: edge corporation - banking
      definition: edge corporation whose charter allows the corporation to engage in international banking
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DepositoryInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/EdgeCorporation
      attributeUses: []
      patternBindings: []
    EdgeCorporation-DomesticBranch:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/EdgeCorporation-DomesticBranch
      namespace: fibo-fbc-funnor
      localName: EdgeCorporation-DomesticBranch
      label: edge corporation - domestic branch
      definition: branch of an edge corporation that is located in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/FormalBusinessOrganizations/Branch
      attributeUses: []
      patternBindings: []
    EdgeCorporation-Investment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/EdgeCorporation-Investment
      namespace: fibo-fbc-funnor
      localName: EdgeCorporation-Investment
      label: edge corporation - investment
      definition: edge corporation whose charter allows the corporation to engage in international investment banking
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/InvestmentBank
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/EdgeCorporation
      attributeUses: []
      patternBindings: []
    FarmCreditSystemInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FarmCreditSystemInstitution
      namespace: fibo-fbc-funnor
      localName: FarmCreditSystemInstitution
      label: farm credit system institution
      definition: federally-chartered financial institution that is supervised, examined, and regulated by the Farm Credit
        Administration and operates in accordance with the Farm Credit Act of 1971, as amended, 12 U.S.C. 2001 et seq
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticEntity
      attributeUses: []
      patternBindings: []
    FederalAgencyOfForeignBankingOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FederalAgencyOfForeignBankingOrganization
      namespace: fibo-fbc-funnor
      localName: FederalAgencyOfForeignBankingOrganization
      label: federal agency of foreign banking organization
      definition: agency of a foreign bank established and operating under section 3102 of CFR Title 12, Chapter 32 and section
        4 of the International Banking Act of 1978
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/AgencyOfAForeignBankingOrganization
      attributeUses: []
      patternBindings: []
    FederalBranchOfForeignBankingOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FederalBranchOfForeignBankingOrganization
      namespace: fibo-fbc-funnor
      localName: FederalBranchOfForeignBankingOrganization
      label: federal branch of foreign banking organization
      definition: branch of a foreign bank established and operating under section 3102 of CFR Title 12, Chapter 32 and section
        4 of the International Banking Act of 1978
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/DomesticBranchOfAForeignBank
      attributeUses: []
      patternBindings: []
    FederalCreditUnion:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FederalCreditUnion
      namespace: fibo-fbc-funnor
      localName: FederalCreditUnion
      label: federal credit union
      definition: credit union that has a federal affiliation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/USCreditUnion
      attributeUses: []
      patternBindings: []
    FederalSavingsBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FederalSavingsBank
      namespace: fibo-fbc-funnor
      localName: FederalSavingsBank
      label: federal savings bank
      definition: savings bank that has a federal affiliation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/SavingsBank
      attributeUses: []
      patternBindings: []
    FinancialHoldingCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FinancialHoldingCompany
      namespace: fibo-fbc-funnor
      localName: FinancialHoldingCompany
      label: financial holding company
      definition: financial entity engaged in a broad range of banking-related activities as permitted under the Gramm-Leach-Bliley
        Act of 1999
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BankHoldingCompany
      attributeUses: []
      patternBindings: []
    ForeignBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBank
      namespace: fibo-fbc-funnor
      localName: ForeignBank
      label: foreign bank
      definition: financial institution organized under the laws of a foreign country, a territory of the United States, Puerto
        Rico, Guam, American Samoa, or the Virgin Islands, which engages in the business of banking, or any subsidiary or
        affiliate, organized under such laws, of any such institution
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Bank
      attributeUses: []
      patternBindings: []
    ForeignBankingOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBankingOrganization
      namespace: fibo-fbc-funnor
      localName: ForeignBankingOrganization
      label: foreign banking organization
      definition: financial service provider that is headquartered outside the United States and that can acquire or establish
        freestanding banks or bank holding companies in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    ForeignBankingOrganizationAsABankHoldingCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBankingOrganizationAsABankHoldingCompany
      namespace: fibo-fbc-funnor
      localName: ForeignBankingOrganizationAsABankHoldingCompany
      label: foreign banking organization as a bank holding company
      definition: foreign banking organization that is a bank holding company in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BankHoldingCompany
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBankingOrganization
      attributeUses: []
      patternBindings: []
    ForeignBankingOrganizationOfABankHoldingCompany:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBankingOrganizationOfABankHoldingCompany
      namespace: fibo-fbc-funnor
      localName: ForeignBankingOrganizationOfABankHoldingCompany
      label: foreign banking organization of a bank holding company
      definition: foreign banking organization that is owned or controlled by a bank holding company
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBankingOrganization
      attributeUses: []
      patternBindings: []
    ForeignBranchOfForeignBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBranchOfForeignBank
      namespace: fibo-fbc-funnor
      localName: ForeignBranchOfForeignBank
      label: foreign branch of foreign bank
      definition: branch that resides outside of the United States whose parent is located outside of the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BranchOfADepositoryInstitution
      attributeUses: []
      patternBindings: []
    ForeignBranchOfForeignBankManagedByUSOffice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBranchOfForeignBankManagedByUSOffice
      namespace: fibo-fbc-funnor
      localName: ForeignBranchOfForeignBankManagedByUSOffice
      label: foreign branch of foreign bank managed by US office
      definition: branch that resides outside of the United States whose parent is located outside of the United States that
        is managed by a US branch or agency of the foreign bank
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBranchOfForeignBank
      attributeUses: []
      patternBindings: []
    ForeignBranchOfUSBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignBranchOfUSBank
      namespace: fibo-fbc-funnor
      localName: ForeignBranchOfUSBank
      label: foreign branch of US bank
      definition: branch that resides outside of the United States, but has a parent that is located in the United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/BranchOfADepositoryInstitution
      attributeUses: []
      patternBindings: []
    ForeignEntityOther:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/ForeignEntityOther
      namespace: fibo-fbc-funnor
      localName: ForeignEntityOther
      label: foreign entity other
      definition: foreign institution that engages in banking activities usually in connection with the business of banking
        in the countries where such foreign institutions are organized or operating
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    IndustrialBank:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/IndustrialBank
      namespace: fibo-fbc-funnor
      localName: IndustrialBank
      label: industrial bank
      definition: limited service financial institution that raises funds by selling certificates called 'investment shares'
        and by accepting deposits
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/Bank
      attributeUses: []
      patternBindings: []
    InsuredFederalBranchOfForeignBankingOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/InsuredFederalBranchOfForeignBankingOrganization
      namespace: fibo-fbc-funnor
      localName: InsuredFederalBranchOfForeignBankingOrganization
      label: insured federal branch of foreign banking organization
      definition: any office or any place of business of a foreign bank located in any State of the United States at which
        deposits are received established and operating under section 4 of the International Banking Act of 1978 that is insured
        and regulated by the Federal Deposit Insurance Corporation (FDIC)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/FederalBranchOfForeignBankingOrganization
      attributeUses: []
      patternBindings: []
