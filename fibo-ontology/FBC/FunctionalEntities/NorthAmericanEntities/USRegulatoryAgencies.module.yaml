      localName: FederalReserveSystemNonMemberInstitution
      label: Federal Reserve System non-member institution
      definition: depository institution that is not member of the Federal Reserve System (FRS)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/DepositoryInstitution
      attributeUses: []
      patternBindings: []
    IssuerIdentificationNumber:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/IssuerIdentificationNumber
