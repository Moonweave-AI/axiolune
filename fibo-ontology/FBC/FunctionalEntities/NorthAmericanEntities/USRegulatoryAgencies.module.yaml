      namespace: fibo-fbc-funnor
      localName: ResearchStatisticsSupervisionDiscountIdentifier
      label: Research, Statistics, Supervision and Regulation, and Discount and Credit identifier
      definition: unique identifier assigned by the Federal Reserve to financial institutions for regulatory and oversight
        purposes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialServiceProviderIdentifier
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegisteredIdentifier
      attributeUses: []
      patternBindings: []
    RoutingTransitNumber:
