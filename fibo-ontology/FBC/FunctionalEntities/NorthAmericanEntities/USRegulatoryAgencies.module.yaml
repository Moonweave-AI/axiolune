      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/PrimaryFederalRegulator
      namespace: fibo-fbc-funnor
      localName: PrimaryFederalRegulator
      label: primary federal regulator
      definition: federal regulatory agency that is designated as the main agency responsible for oversight of a given institution
