      localName: NonDepositoryTrustCompany-NonMemberInstitution
      label: non-depository trust company - non-member institution
      definition: non-depository trust company that is not a member of the Federal Reserve system
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USFinancialServicesEntities/NonDepositoryTrustCompany
      attributeUses: []
      patternBindings: []
