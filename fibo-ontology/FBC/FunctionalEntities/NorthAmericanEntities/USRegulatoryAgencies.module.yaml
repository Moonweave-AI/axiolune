      definition: an entry in the the National Information Center (NIC) repository, a repository of financial data and institution
        characteristics collected by the Federal Reserve System
      superTypes:
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistryEntry
      attributeUses: []
      patternBindings: []
