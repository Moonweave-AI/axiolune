      localName: FederalGovernmentEntity
      label: federal government entity
      definition: formal organization that is an independent agency, instrumentality or other permanent or semi-permanent
        organization in the machinery of government in the United States, authorized by the executive branch or by Congress,
        that operates at the national (federal) level
