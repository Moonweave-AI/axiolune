      localName: EmployerIdentificationNumberingScheme
      label: employer identification numbering scheme
      definition: taxpayer identification numbering scheme used in the United States to identify business entities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/TaxpayerIdentificationNumberingScheme
      attributeUses: []
      patternBindings: []
