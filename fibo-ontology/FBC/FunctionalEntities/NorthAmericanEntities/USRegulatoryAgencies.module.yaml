      label: Federal Reserve district
      definition: a region of the US identifying the jurisdiction of a Federal Reserve Bank, numbered and named for the city
        in which that reserve bank is located
      superTypes:
      - https://www.omg.org/spec/Commons/RegulatoryAgencies/Jurisdiction
      attributeUses: []
      patternBindings: []
