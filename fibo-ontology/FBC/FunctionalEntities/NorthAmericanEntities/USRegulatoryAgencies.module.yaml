      label: taxpayer identification number
      definition: identification number used by the Internal Revenue Service (IRS) in the administration of tax laws in the
        United States
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/TaxIdentifier
      attributeUses: []
      patternBindings: []
