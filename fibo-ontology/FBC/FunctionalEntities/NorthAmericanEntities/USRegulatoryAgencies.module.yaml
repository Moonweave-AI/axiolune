      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/FDICRegistryEntry
      namespace: fibo-fbc-funnor
      localName: FDICRegistryEntry
      label: FDIC registry entry
      definition: an entry in the FDIC institution directory, a repository of financial institution characteristics collected
        by the FDIC related to the institutions they insure
      superTypes:
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistryEntry
      attributeUses: []
      patternBindings: []
