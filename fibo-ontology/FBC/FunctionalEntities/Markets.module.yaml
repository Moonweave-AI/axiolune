module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/
  preferredPrefix: fibo-fbc-funmar
  version: '20260701'
  label: Markets Ontology
  definition: This ontology defines the fundamental concepts for markets, exchanges, regulated markets, and multilateral trading
    facilities.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/BusinessRegistries/
    version: external
