    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Classifiers/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Collections/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Designators/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Identifiers/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Locations/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Organizations/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/RegistrationAuthorities/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/RegulatoryAgencies/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/RolesAndCompositions/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/SitesAndFacilities/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: Markets.rdf
  sourceDigest: sha256:c26937c21f4184f4d1658f552b1275860efad33674e8199d269661b8ffd2ffc4
  sourcePath: FBC/FunctionalEntities/Markets.rdf
  fiboDomain: FBC
domain:
  objectTypes:
    AlternativeTradingSystem:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/AlternativeTradingSystem
      namespace: fibo-fbc-funmar
      localName: AlternativeTradingSystem
      label: alternative trading system
      definition: trading venue that is more loosely regulated than a regulated exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    ApprovedPublicationArrangement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/ApprovedPublicationArrangement
      namespace: fibo-fbc-funmar
      localName: ApprovedPublicationArrangement
      label: approved publication arrangement
      definition: data reporting services provider that is authorized to provide the service of publishing certain trade reports
        on behalf of banks, investment firms, or asset management companies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/DataReportingServicesProvider
      attributeUses: []
      patternBindings: []
    ApprovedReportingMechanism:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/ApprovedReportingMechanism
      namespace: fibo-fbc-funmar
      localName: ApprovedReportingMechanism
      label: approved reporting mechanism
      definition: data reporting services provider that is authorized to provide the service of reporting details of transactions
        to competent authorities or ESMA (the European Securities and Markets Authority) on behalf of investment firms
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/DataReportingServicesProvider
      attributeUses: []
      patternBindings: []
    AuctionMarket:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/AuctionMarket
      namespace: fibo-fbc-funmar
      localName: AuctionMarket
      label: auction market
      definition: exchange in which buyers and sellers submit competitive bids that do not involve direct negotiations between
        parties, as part of an auction scheduled either on demand or on a periodic basis
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    ConsolidatedTapeProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/ConsolidatedTapeProvider
      namespace: fibo-fbc-funmar
      localName: ConsolidatedTapeProvider
      label: consolidated tape provider
      definition: data reporting services provider that is authorized to provide the service of collecting trade reports for
        financial instruments from regulated markets, MTFs, OTFs and APAs and consolidating them into a continuous electronic
        live data stream providing price and volume data per financial instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/DataReportingServicesProvider
      attributeUses: []
      patternBindings: []
    CryptoAssetServicesProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/CryptoAssetServicesProvider
      namespace: fibo-fbc-funmar
      localName: CryptoAssetServicesProvider
      label: crypto asset services provider
      definition: financial services provider that provides services for crypto assets that enable the control of crypto assets,
        and participate in, or provide, financial services for issuers' offers, or sale, of crypto assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    DarkPool:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/DarkPool
      namespace: fibo-fbc-funmar
      localName: DarkPool
      label: dark pool
      definition: privately organized alternative trading system, that allows institutional investors the ability to trade
        without exposure until after the trade has been executed and reported
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/AlternativeTradingSystem
      attributeUses: []
      patternBindings: []
    DataReportingServicesProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/DataReportingServicesProvider
      namespace: fibo-fbc-funmar
      localName: DataReportingServicesProvider
      label: data reporting services provider
      definition: market data provider and reporting party that reports and/or publishes data on securities transactions,
        including required regulatory reporting for such transactions, and as such is subject to regulatory supervision
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/Publishers/MarketDataProvider
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Reporting/ReportingParty
      attributeUses: []
      patternBindings: []
    DesignatedContractMarket:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/DesignatedContractMarket
      namespace: fibo-fbc-funmar
      localName: DesignatedContractMarket
      label: designated contract market
      definition: exchange, trading system, or platform that enables listing for trading futures or option contracts based
        on any underlying commodity, index or instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    ElectronicCommunicationNetwork:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/ElectronicCommunicationNetwork
      namespace: fibo-fbc-funmar
      localName: ElectronicCommunicationNetwork
      label: electronic communication network
      definition: alternative trading system that automatically matches buy and sell orders for securities in the market
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/AlternativeTradingSystem
      attributeUses: []
      patternBindings: []
    Exchange:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      namespace: fibo-fbc-funmar
      localName: Exchange
      label: exchange
      definition: any organization, association, or group of persons, whether incorporated or unincorporated, which constitutes,
        maintains, or provides a facility for bringing together purchasers and sellers of financial instruments, commodities,
        or other products, services, or goods, and includes the market place and facilities maintained by such exchange
      superTypes:
      - https://www.omg.org/spec/Commons/SitesAndFacilities/Facility
      attributeUses: []
      patternBindings: []
    ExchangeParticipant:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/ExchangeParticipant
      namespace: fibo-fbc-funmar
      localName: ExchangeParticipant
      label: exchange participant
      definition: registered agent who, in accordance with the rules of an exchange, may trade on or through the exchange
        and whose name is entered in a list, register or roll kept by the exchange as an agent who may trade on or through
        the exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/RegisteredAgent
      - https://www.omg.org/spec/Commons/Organizations/OrganizationMember
      attributeUses: []
      patternBindings: []
    InterdealerQuotationSystem:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/InterdealerQuotationSystem
      namespace: fibo-fbc-funmar
      localName: InterdealerQuotationSystem
      label: interdealer quotation system
      definition: automated system for organizing and disseminating price quotes by brokers and dealer firms that facilitates
        electronic trading in securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    MarketCategoryClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketCategoryClassifier
      namespace: fibo-fbc-funmar
      localName: MarketCategoryClassifier
      label: market category classifier
      definition: classifier representing the controlled vocabulary that delineates the nature of the exchange or data reporting
        services provider where possible
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    MarketIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifier
      namespace: fibo-fbc-funmar
      localName: MarketIdentifier
      label: market identifier
      definition: identifier that specifies a universal method of identifying exchanges, trading platforms, regulated or non-regulated
        markets, and data reporting services providers as sources of prices and related information in order to facilitate
        automated processing
      superTypes:
      - https://www.omg.org/spec/Commons/Identifiers/Identifier
      attributeUses: []
      patternBindings: []
    MarketIdentifierCodeStatus:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifierCodeStatus
      namespace: fibo-fbc-funmar
      localName: MarketIdentifierCodeStatus
      label: market indicator code status
      definition: lifecycle stage indicating the status of the MIC code, as specified by the registration authority
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleStage
      attributeUses: []
      patternBindings: []
    MarketLevelClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketLevelClassifier
      namespace: fibo-fbc-funmar
      localName: MarketLevelClassifier
      label: market level classifier
      definition: classifier that indicates whether the exchange or data reporting services provider is an operating level
        or market segment level facility
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    MarketSegmentLevelMarket:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketSegmentLevelMarket
      namespace: fibo-fbc-funmar
      localName: MarketSegmentLevelMarket
      label: market segment-level market
      definition: section of an exchange/market/trade reporting facility that specialises in one or more specific instruments
        or that is regulated differently
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    MarketSegmentLevelMarketIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketSegmentLevelMarketIdentifier
      namespace: fibo-fbc-funmar
      localName: MarketSegmentLevelMarketIdentifier
      label: market segment-level market identifier
      definition: market identifier that identifies a section of an exchange/market/trade reporting facility that specialises
        in one or more specific instruments or that is regulated differently
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifier
      attributeUses: []
      patternBindings: []
    MultilateralTradingFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MultilateralTradingFacility
      namespace: fibo-fbc-funmar
      localName: MultilateralTradingFacility
      label: multilateral trading facility
      definition: trading system that facilitates the exchange of financial instruments between multiple parties
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/AlternativeTradingSystem
      attributeUses: []
      patternBindings: []
    OffMarketFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/OffMarketFacility
      namespace: fibo-fbc-funmar
      localName: OffMarketFacility
      label: off-market facility
      definition: facility used for reporting over-the-counter (OTC) and other direct trades that are not executed by the
        exchange but are reported through the exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    OperatingLevelMarket:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/OperatingLevelMarket
      namespace: fibo-fbc-funmar
      localName: OperatingLevelMarket
      label: operating-level market
      definition: exchange/market/trade reporting facility in a specific market/country
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    OperatingLevelMarketIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/OperatingLevelMarketIdentifier
      namespace: fibo-fbc-funmar
      localName: OperatingLevelMarketIdentifier
      label: operating-level market identifier
      definition: market identifier that identifies an exchange/market/trade reporting facility in a specific market/country
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifier
      attributeUses: []
      patternBindings: []
    OrganizedTradingFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/OrganizedTradingFacility
      namespace: fibo-fbc-funmar
      localName: OrganizedTradingFacility
      label: organised trading facility
      definition: multi-lateral system which is not an RM or an MTF and in which multiple third-party buying and selling interests
        in bonds, structured finance products, emission allowances or derivatives are able to interact in the system in a
        way that results in a contract in accordance with the provisions of Title II of MiFID II
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/AlternativeTradingSystem
      attributeUses: []
      patternBindings: []
    QuoteDrivenMarket:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/QuoteDrivenMarket
      namespace: fibo-fbc-funmar
      localName: QuoteDrivenMarket
      label: quote-driven market
      definition: exchange in which prices are determined from bid and ask quotations made by market makers, dealers, or specialists
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    RecognizedMarketOperator:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/RecognizedMarketOperator
      namespace: fibo-fbc-funmar
      localName: RecognizedMarketOperator
      label: recognised market operator
      definition: exchange that is operated or maintained by an operator registered under certain securities regulations that
        brings together purchasers and sellers of capital market products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    RegisteredMultilateralTradingFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/RegisteredMultilateralTradingFacility
      namespace: fibo-fbc-funmar
      localName: RegisteredMultilateralTradingFacility
      label: registered multilateral trading facility
      definition: multilateral system operated by an investment firm or market operator, which brings together multiple third-party
        buying and selling interests in financial instruments in the system, in accordance with non-discretionary rules, in
        a way that results in a contract in accordance with the provisions of Title II of the MiFID II
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MultilateralTradingFacility
      attributeUses: []
      patternBindings: []
    RegulatedExchange:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/RegulatedExchange
      namespace: fibo-fbc-funmar
      localName: RegulatedExchange
      label: regulated exchange
      definition: regulated market that is operated by and/or managed by a market operator that brings together or facilitates
        the bringing together of multiple third-party buying and selling interests in financial instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    SwapExecutionFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/SwapExecutionFacility
      namespace: fibo-fbc-funmar
      localName: SwapExecutionFacility
      label: swap execution facility
      definition: exchange that enables participants to execute and trade swaps
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    SystematicInternaliser:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/SystematicInternaliser
      namespace: fibo-fbc-funmar
      localName: SystematicInternaliser
      label: systematic internaliser
      definition: investment firm that, on an organised, frequent, systematic and substantial basis, deals on its own account
        by executing client orders outside a regulated exchange, MTF or OTF without operating a multilateral system
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/Exchange
      attributeUses: []
      patternBindings: []
    TradeReportingFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/TradeReportingFacility
      namespace: fibo-fbc-funmar
      localName: TradeReportingFacility
      label: trade reporting facility
      definition: facility that provides a mechanism for the reporting of transactions effected otherwise than on an exchange
      superTypes:
      - https://www.omg.org/spec/Commons/SitesAndFacilities/Facility
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasMarketIdentifierCodeStatus:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/hasMarketIdentifierCodeStatus
      namespace: fibo-fbc-funmar
      localName: hasMarketIdentifierCodeStatus
      label: has market identifier code status
      definition: indicates the status of a specific market identifier code (MIC)
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/MarketIdentifierCodeStatus
      inverseOf: ''
      characteristics: []
    operatesInCountry:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/operatesInCountry
      namespace: fibo-fbc-funmar
      localName: operatesInCountry
      label: operates in country
      definition: indicates the ISO 3166-1 country in which an exchange, data reporting services provider, or crypto asset
        services provider operates
      domain: ''
      range: https://www.omg.org/spec/Commons/Locations/Country
      inverseOf: ''
      characteristics: []
    operatesInMunicipality:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/operatesInMunicipality
      namespace: fibo-fbc-funmar
      localName: operatesInMunicipality
      label: operates in municipality
      definition: indicates the municipality or business center in which in which an exchange, data reporting services provider,
        or crypto asset services provider operates
      domain: ''
      range: https://www.omg.org/spec/Commons/Locations/Municipality
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasFacilityAcronym:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/Markets/hasFacilityAcronym
      namespace: fibo-fbc-funmar
      localName: hasFacilityAcronym
      label: has facility acronym
      definition: indicates a known acronym of the market
      valueType: any
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
