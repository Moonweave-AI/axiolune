    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Reporting/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
