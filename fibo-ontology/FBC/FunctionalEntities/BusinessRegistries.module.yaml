  label: Business Registries Ontology
  definition: This ontology extends the Registration Authorities ontology to define specific kinds of registries, such as
    business entity registries, registries for identifiers and codes of various sorts, and registries for financial institutions
    and intermediaries based on jurisdiction, who regulates them, and the services they provide.
