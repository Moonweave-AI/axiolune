module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/
  preferredPrefix: fibo-fbc-funeur
  version: '20250301'
  label: European Financial Services Entities Ontology
  definition: This ontology extends the primary financial services entities ontology in FBC with additional kinds of entities
    that that provide services in Europe, across national boundaries, such as European market data providers, organizations
    that provide exchanges in multiple countries, organizations that support the European Union, and so forth.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Organizations/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: EUFinancialServicesEntities.rdf
  sourceDigest: sha256:909275bc01b8952cb65c03c8d350d22d7064d0fcbc607434bb30ad8b8834b3ba
  sourcePath: FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities.rdf
  fiboDomain: FBC
domain:
  objectTypes:
    CRDCreditInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CRDCreditInstitution
      namespace: fibo-fbc-funeur
      localName: CRDCreditInstitution
      label: CRD credit institution
      definition: an undertaking whose business is to receive deposits or other repayable funds from the public and to grant
        credits for its own account as defined by the European Banking Authority (EBA)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitution
      attributeUses: []
      patternBindings: []
    CreditInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitution
      namespace: fibo-fbc-funeur
      localName: CreditInstitution
      label: credit institution
      definition: an undertaking the business of which is to take deposits or other repayable funds from the public and to
        grant credits for its own account, and to which authorisation has been granted to operate within the European Union
        and European Economic Area countries (EEA)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitutionInvestmentFirm
      attributeUses: []
      patternBindings: []
    CreditInstitutionInvestmentFirm:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitutionInvestmentFirm
      namespace: fibo-fbc-funeur
      localName: CreditInstitutionInvestmentFirm
      label: credit institution / investment firm
      definition: classification specific to European financial institutions that designates them as credit institutions /
        investment firms as defined by the European Banking Authority (EBA)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialInstitution
      attributeUses: []
      patternBindings: []
    EuropeanEconomicAreaBranch:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/EuropeanEconomicAreaBranch
      namespace: fibo-fbc-funeur
      localName: EuropeanEconomicAreaBranch
      label: European Economic Area branch
      definition: a branch of a credit institution authorised in another European Economic Area (EEA) country that has the
        right to passport its activities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitution
      attributeUses: []
      patternBindings: []
    InvestmentFirm:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/InvestmentFirm
      namespace: fibo-fbc-funeur
      localName: InvestmentFirm
      label: investment firm
      definition: any legal person whose regular occupation or business is the provision of one or more investment services
        to third parties and/or the performance of one or more investment activities on a professional basis
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitutionInvestmentFirm
      attributeUses: []
      patternBindings: []
    LocalFirm:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/LocalFirm
      namespace: fibo-fbc-funeur
      localName: LocalFirm
      label: local firm
      definition: a firm dealing for its own account on markets in financial futures or options or other derivatives and on
        cash markets for the sole purpose of hedging positions on derivatives markets, or dealing for the accounts of other
        members of those markets and being guaranteed by clearing members of the same markets, where responsibility for ensuring
        the performance of contracts entered into by such a firm is assumed by clearing members of the same markets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitutionInvestmentFirm
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BrokerageFirm
      attributeUses: []
      patternBindings: []
    NonEuropeanEconomicAreaBranch:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/NonEuropeanEconomicAreaBranch
      namespace: fibo-fbc-funeur
      localName: NonEuropeanEconomicAreaBranch
      label: non European Economic Area branch
      definition: a branch of a credit institution whose Head Office is in a third country
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitution
      attributeUses: []
      patternBindings: []
    PaymentInstitution:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/PaymentInstitution
      namespace: fibo-fbc-funeur
      localName: PaymentInstitution
      label: payment institution
      definition: a legal person that has been granted authorisation in accordance with Article 10 to provide and execute
        payment services throughout the European community
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/EuropeanEntities/EUFinancialServicesEntities/CreditInstitutionInvestmentFirm
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
