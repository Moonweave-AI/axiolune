      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Catalog
      attributeUses: []
      patternBindings: []
    FinancialService:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialService
      namespace: fibo-fbc-profin
      localName: FinancialService
      label: financial service
      definition: service provided to consumers and businesses by financial institutions such as banks, insurance companies,
        brokerage firms, consumer finance companies, and investment companies
