      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Offeree
      namespace: fibo-fbc-profin
      localName: Offeree
      label: offeree
      definition: party that receives an offer from something from someone (i.e., an offerer) based on the terms of the offering
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
    Offering:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Offering
      namespace: fibo-fbc-profin
      localName: Offering
      label: offering
      definition: expression of interest in providing something to someone that is contingent upon acceptance, forbearance,
        or some other consideration, as might be desired by an offeree(s)
      superTypes: []
      attributeUses: []
      patternBindings: []
