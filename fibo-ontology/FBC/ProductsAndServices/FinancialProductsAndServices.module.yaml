      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Offeror
      namespace: fibo-fbc-profin
      localName: Offeror
      label: offeror
      definition: party that proposes to make something available to someone (i.e., an offeree) based on the terms of the
        offering
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/PartyRole
      attributeUses: []
      patternBindings: []
