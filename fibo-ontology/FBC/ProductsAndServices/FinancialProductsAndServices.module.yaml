      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ProductLifecycleEvent
      namespace: fibo-fbc-profin
      localName: ProductLifecycleEvent
      label: product lifecycle event
      definition: kind of event that occurs during one or more stages of a product lifecycle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleEvent
      attributeUses: []
      patternBindings: []
    ProductLifecycleEventOccurrence:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ProductLifecycleEventOccurrence
      namespace: fibo-fbc-profin
      localName: ProductLifecycleEventOccurrence
      label: product lifecycle event occurrence
      definition: actual occurrence of an event that happens during a specific stage of a specific product lifecycle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleEventOccurrence
