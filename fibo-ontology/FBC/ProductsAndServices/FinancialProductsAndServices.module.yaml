      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Position
      namespace: fibo-fbc-profin
      localName: Position
      label: position
      definition: financial exposure resulting from owning, borrowing, shorting, or entering into a contract (e.g., derivatives)
