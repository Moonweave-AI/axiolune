      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProductCatalog
      namespace: fibo-fbc-profin
      localName: FinancialProductCatalog
      label: financial product catalog
      definition: catalog of financial products and/or services available for sale with their description and other product
