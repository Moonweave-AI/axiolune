      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    AgentForServiceOfProcess:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/AgentForServiceOfProcess
      namespace: fibo-fbc-profin
      localName: AgentForServiceOfProcess
      label: agent for service of process
      definition: registered agent (person or organization) designated by a business entity, such as a corporation, to receive
        legal correspondence on behalf of the business entity in the jurisdiction in which the agent's address is located
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/RegisteredAgent
      attributeUses: []
      patternBindings: []
    Basket:
