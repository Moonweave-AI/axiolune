      superTypes:
      - https://www.omg.org/spec/Commons/Collections/Constituent
      attributeUses: []
      patternBindings: []
    Broker:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Broker
      namespace: fibo-fbc-profin
      localName: Broker
      label: broker
      definition: any party that acts as an intermediary between a buyer and a seller, usually charging a commission
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractThirdParty
      attributeUses: []
      patternBindings: []
    BrokerDealer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/BrokerDealer
      namespace: fibo-fbc-profin
      localName: BrokerDealer
      label: broker-dealer
      definition: any party in the business of buying and selling securities, operating as both a broker and a dealer, depending
        on the transaction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/FunctionalEntity
      attributeUses: []
      patternBindings: []
    Catalog:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Catalog
      namespace: fibo-fbc-profin
      localName: Catalog
