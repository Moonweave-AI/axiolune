      namespace: fibo-fbc-profin
      localName: ExposureBearer
      label: exposure bearer
      definition: party subject to influence or risk arising from a specific contract, instrument, or arrangement
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Actor
      attributeUses: []
      patternBindings: []
    ExposureSituation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ExposureSituation
      namespace: fibo-fbc-profin
      localName: ExposureSituation
      label: exposure situation
      definition: state of affairs in which some party is subject to influence or risk arising from a specific contract, instrument,
        or arrangement
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Situation
      attributeUses: []
      patternBindings: []
    FinancialExposure:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialExposure
      namespace: fibo-fbc-profin
      localName: FinancialExposure
      label: financial exposure
      definition: the extent to which an individual or organization is open to risk of suffering a loss in a transaction,
        or with respect to some investment or set of investments, e.g., some holding; the amount one stands to lose in that
        transaction or investment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Exposure
      attributeUses: []
      patternBindings: []
