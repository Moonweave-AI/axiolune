      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleEvent
      namespace: fibo-fbc-profin
      localName: ContractLifecycleEvent
      label: contract lifecycle event
      definition: kind of event that occurs during one or more stages of the lifecycle of an agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleEvent
      attributeUses: []
      patternBindings: []
    ContractLifecycleEventOccurrence:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleEventOccurrence
      namespace: fibo-fbc-profin
      localName: ContractLifecycleEventOccurrence
      label: contract lifecycle event occurrence
      definition: actual occurrence of an event during a specific stage of a specific contract lifecycle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleEventOccurrence
      attributeUses: []
      patternBindings: []
    ContractLifecycleOccurrence:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleOccurrence
      namespace: fibo-fbc-profin
      localName: ContractLifecycleOccurrence
      label: contract lifecycle occurrence
      definition: realization of the lifecycle of a specific contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleOccurrence
      attributeUses: []
      patternBindings: []
    ContractLifecycleStage:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleStage
      namespace: fibo-fbc-profin
      localName: ContractLifecycleStage
      label: contract lifecycle stage
      definition: phase in the lifecycle of an agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleStage
      attributeUses: []
      patternBindings: []
    ContractLifecycleStageOccurrence:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleStageOccurrence
      namespace: fibo-fbc-profin
      localName: ContractLifecycleStageOccurrence
      label: contract lifecycle stage occurrence
      definition: realization, from start to finish of a phase in an occurrence of a specific contract lifecycle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleStageOccurrence
      attributeUses: []
      patternBindings: []
    Dealer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Dealer
      namespace: fibo-fbc-profin
      localName: Dealer
      label: dealer
      definition: any party that purchases goods or services for resale and acts on their own behalf in a transaction
      superTypes:
      - https://www.omg.org/spec/Commons/Organizations/ServiceProvider
      attributeUses: []
      patternBindings: []
    Exposure:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Exposure
      namespace: fibo-fbc-profin
      localName: Exposure
      label: exposure
      definition: means by which an individual or organization is unprotected and open to damage, danger, risk of suffering
        a loss, or uncertainty
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Undergoer
      attributeUses: []
      patternBindings: []
