      patternBindings: []
    ProductLifecycle:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ProductLifecycle
      namespace: fibo-fbc-profin
      localName: ProductLifecycle
      label: product lifecycle
