      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProduct
      namespace: fibo-fbc-profin
      localName: FinancialProduct
      label: financial product
      definition: product provided to consumers and businesses by financial institutions such as banks, insurance companies,
        brokerage firms, consumer finance companies, and investment companies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Product
      attributeUses: []
      patternBindings: []
