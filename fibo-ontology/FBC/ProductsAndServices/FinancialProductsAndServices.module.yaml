      patternBindings: []
    ProductLifecycleStageOccurrence:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ProductLifecycleStageOccurrence
      namespace: fibo-fbc-profin
      localName: ProductLifecycleStageOccurrence
      label: product lifecycle stage occurrence
      definition: realization of a specific stage in the lifecycle of a given product
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleStageOccurrence
      attributeUses: []
      patternBindings: []
