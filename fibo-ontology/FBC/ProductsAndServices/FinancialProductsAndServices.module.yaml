    ProductLifecycleOccurrence:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ProductLifecycleOccurrence
      namespace: fibo-fbc-profin
      localName: ProductLifecycleOccurrence
      label: product lifecycle occurrence
      definition: realization of the lifecycle of a specific product
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleOccurrence
      attributeUses: []
      patternBindings: []
    ProductLifecycleStage:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ProductLifecycleStage
      namespace: fibo-fbc-profin
      localName: ProductLifecycleStage
      label: product lifecycle stage
      definition: phase in a product lifecycle
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleStage
