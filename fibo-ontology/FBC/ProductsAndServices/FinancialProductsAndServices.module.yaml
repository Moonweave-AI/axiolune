      namespace: fibo-fbc-profin
      localName: Basket
      label: basket
      definition: collection of goods, services, or other things (e.g., financial contracts) that can be purchased and sold
        in some marketplace
      superTypes:
      - https://www.omg.org/spec/Commons/Collections/Collection
      attributeUses: []
      patternBindings: []
    BasketConstituent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/BasketConstituent
      namespace: fibo-fbc-profin
      localName: BasketConstituent
      label: basket constituent
