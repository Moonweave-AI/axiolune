      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/FinancialServiceProviderIdentifier
      attributeUses: []
      patternBindings: []
    BasicBankAccountIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BasicBankAccountIdentifier
      namespace: fibo-fbc-procli
      localName: BasicBankAccountIdentifier
      label: basic bank account identifier
      definition: identifier that uniquely identifies an individual account at a specific financial institution in a particular
        country and which includes a bank identifier of the financial institution servicing that account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BankAccountIdentifier
      - https://www.omg.org/spec/Commons/ContextualIdentifiers/StructuredIdentifier
      attributeUses: []
      patternBindings: []
