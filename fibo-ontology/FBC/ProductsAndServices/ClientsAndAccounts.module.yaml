      namespace: fibo-fbc-procli
      localName: BrokerageAccount
      label: brokerage account
      definition: account offered by a broker that allows the investor to deposit funds and place investment orders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/InvestmentAccount
      attributeUses: []
      patternBindings: []
    CertificateOfDeposit:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/CertificateOfDeposit
      namespace: fibo-fbc-procli
      localName: CertificateOfDeposit
      label: certificate of deposit
      definition: cash instrument associated with a time deposit account that cannot be withdrawn for a certain period of
        time (term)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CashInstrument
      attributeUses: []
      patternBindings: []
    ChartOfAccounts:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/ChartOfAccounts
      namespace: fibo-fbc-procli
      localName: ChartOfAccounts
      label: chart of accounts
      definition: structured system of financial account codes used to classify, record, and organize an entity's financial
