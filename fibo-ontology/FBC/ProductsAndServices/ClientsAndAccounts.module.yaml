      patternBindings: []
    CustomerAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/CustomerAccount
      namespace: fibo-fbc-procli
      localName: CustomerAccount
      label: customer account
      definition: account that represents an identified, named collection of balances and cumulative totals used to summarize
        customer transaction-related activity over a designated period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
      attributeUses: []
      patternBindings: []
    CustomerAccountHolder:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/CustomerAccountHolder
      namespace: fibo-fbc-procli
      localName: CustomerAccountHolder
      label: customer account holder
      definition: party that owns a customer account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/AccountHolder
      attributeUses: []
      patternBindings: []
    DemandDepositAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/DemandDepositAccount
      namespace: fibo-fbc-procli
      localName: DemandDepositAccount
      label: demand deposit account
      definition: non-interest-bearing deposit account in which deposits are payable immediately on demand, or that are issued
        with an original maturity or required notice period of less than seven days, or that represent funds for which the
        depository institution does not reserve the right to require at least seven days' written notice of an intended withdrawal
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/TransactionDepositAccount
      attributeUses: []
      patternBindings: []
    DepositAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/DepositAccount
      namespace: fibo-fbc-procli
      localName: DepositAccount
      label: deposit account
      definition: account that provides a record of money placed with a depository institution for safekeeping and management
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/BankingProduct
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/InvestmentOrDepositAccount
      attributeUses: []
      patternBindings: []
    Fee:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Fee
      namespace: fibo-fbc-procli
      localName: Fee
      label: fee
      definition: charge for services performed
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      attributeUses: []
      patternBindings: []
    GeneralLedger:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/GeneralLedger
      namespace: fibo-fbc-procli
      localName: GeneralLedger
      label: general ledger
      definition: organized collection of ledger accounts used to record and summarize changes in position as transactions
        are posted during an accounting period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Documents/FinancialRecord
      attributeUses: []
      patternBindings: []
    IndividualTransaction:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/IndividualTransaction
      namespace: fibo-fbc-procli
      localName: IndividualTransaction
      label: individual transaction
      definition: event that has a monetary impact and is documented in the records associated with an account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedCollectionConstituent
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/Occurrence
      attributeUses: []
      patternBindings: []
    InternationalBankAccountIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/InternationalBankAccountIdentifier
      namespace: fibo-fbc-procli
      localName: InternationalBankAccountIdentifier
      label: international bank account identifier
      definition: identifier for a bank account that is an expanded version of the basic bank account number (BBAN), intended
        for use internationally
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BankAccountIdentifier
      - https://www.omg.org/spec/Commons/ContextualIdentifiers/StructuredIdentifier
      attributeUses: []
      patternBindings: []
    InvestmentAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/InvestmentAccount
      namespace: fibo-fbc-procli
      localName: InvestmentAccount
      label: investment account
      definition: account that provides a record of deposits of funds and/or securities held at a financial institution
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/InvestmentOrDepositAccount
      attributeUses: []
      patternBindings: []
    InvestmentOrDepositAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/InvestmentOrDepositAccount
      namespace: fibo-fbc-procli
      localName: InvestmentOrDepositAccount
      label: investment or deposit account
      definition: account associated with a product or service that requires the account holder to provide funds for management
        by the account provider
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
      attributeUses: []
      patternBindings: []
    LedgerAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/LedgerAccount
      namespace: fibo-fbc-procli
      localName: LedgerAccount
      label: ledger account
      definition: individual record for one element or sub-element in a ledger that records and summarizes increases, decreases,
        and balances associated with that specific element
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
      attributeUses: []
      patternBindings: []
    LedgerAccountClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/LedgerAccountClassifier
      namespace: fibo-fbc-procli
      localName: LedgerAccountClassifier
      label: ledger account classifier
      definition: classifier used to organize an entity's financial accounts in accordance with applicable legal, regulatory,
        and reporting requirements
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    LendingOfficer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/LendingOfficer
      namespace: fibo-fbc-procli
      localName: LendingOfficer
      label: lending officer
      definition: corporate officer that has overarching responsibility for the relationship with a specific borrower or account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/Executives/CorporateOfficer
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/RelationshipManager
      attributeUses: []
      patternBindings: []
    LoanOrCreditAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/LoanOrCreditAccount
      namespace: fibo-fbc-procli
      localName: LoanOrCreditAccount
      label: loan or credit account
      definition: account associated with a service in which the account holder receives funds from the account provider under
        certain terms and conditions for repayment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
      attributeUses: []
      patternBindings: []
    NonTransactionDepositAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/NonTransactionDepositAccount
      namespace: fibo-fbc-procli
      localName: NonTransactionDepositAccount
      label: non-transaction deposit account
      definition: any deposit account that is not explicitly considered a transaction account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/DepositAccount
      attributeUses: []
      patternBindings: []
    OpenDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/OpenDate
      namespace: fibo-fbc-procli
      localName: OpenDate
      label: open date
      definition: date on which something was created
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      attributeUses: []
      patternBindings: []
    PaymentDueDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/PaymentDueDate
      namespace: fibo-fbc-procli
      localName: PaymentDueDate
      label: payment due date
      definition: date by which payment of the current outstanding balance, part thereof, or a minimum amount due must be
        made to the creditor
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      attributeUses: []
      patternBindings: []
    PostingDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/PostingDate
      namespace: fibo-fbc-procli
      localName: PostingDate
      label: posting date
      definition: date that determines in which posting period a document or journal entry is added to an account record
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      attributeUses: []
      patternBindings: []
    RelationshipManager:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/RelationshipManager
      namespace: fibo-fbc-procli
      localName: RelationshipManager
      label: relationship manager
      definition: responsible party who manages a client's account and oversees their relationship with the service provider
      superTypes:
      - https://www.omg.org/spec/Commons/BusinessAuthorizations/ResponsibleParty
      attributeUses: []
      patternBindings: []
    TimeCertificateOfDepositAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/TimeCertificateOfDepositAccount
      namespace: fibo-fbc-procli
      localName: TimeCertificateOfDepositAccount
      label: time certificate of deposit account
      definition: 'time deposit account that allows deposits evidenced by a negotiable or nonnegotiable instrument, or a deposit
        in book entry form evidenced by a receipt or similar acknowledgement issued by the bank, that provides, on its face,
        that the amount of such deposit is payable to the bearer, to any specified person, or to the order of a specified
        person, as follows: (1) on a certain date not less than seven days after the date of deposit, (2) at the expiration
        of a specified period not less than seven days after the date of the deposit, or (3) upon written notice to the bank
        which is to be given not less than seven days before the date of withdrawal.'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/TimeDepositAccount
      attributeUses: []
      patternBindings: []
    TimeDepositAccount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/TimeDepositAccount
      namespace: fibo-fbc-procli
      localName: TimeDepositAccount
      label: time deposit account
      definition: deposit account that the depositor does not have a right, and is not permitted, to make withdrawals from
        within six days after the date of deposit unless the deposit is subject to an early withdrawal penalty of at least
        seven days' simple interest on amounts withdrawn within the first six days after deposit
      superTypes:
