      localName: BankAccountIdentifier
      label: bank account identifier
      definition: identifier that identifies a demand deposit account provided by a bank
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/AccountIdentifier
      attributeUses: []
      patternBindings: []
    BankIdentifier:
