  label: Financial Business and Commerce Domain, Reference Individuals Extension
  definition: The financial business and commerce domain covers business concepts that are common to common to a number of
    finance areas, such as loans, securities, and corporate actions, including products and services, financial intermediaries,
    registrars and regulators, and financial instruments and products. This extension includes all reference data from FND,
    BE, and FBC combined, rather than limiting that content to Europe and North America.
