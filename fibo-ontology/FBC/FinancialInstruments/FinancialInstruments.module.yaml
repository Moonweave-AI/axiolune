      namespace: fibo-fbc-finfin
      localName: NegotiableSecurity
      label: negotiable security
      definition: security that can be transferred to another party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/TransferableContract
      attributeUses: []
      patternBindings: []
    NonNegotiableSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/NonNegotiableSecurity
      namespace: fibo-fbc-finfin
      localName: NonNegotiableSecurity
      label: non-negotiable security
      definition: security that is not transferable to another party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      attributeUses: []
      patternBindings: []
    Option:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Option
      namespace: fibo-fbc-finfin
      localName: Option
      label: option
      definition: derivative instrument that grants to the holder either the privilege to purchase or the privilege to sell
        the assets specified at a predetermined price or formula at or within a time period in the future
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    PackagedFinancialProduct:
