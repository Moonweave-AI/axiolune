      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      attributeUses: []
      patternBindings: []
    RedemptionProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/RedemptionProvision
      namespace: fibo-fbc-finfin
      localName: RedemptionProvision
      label: redemption provision
      definition: contract provision enabling the issuer (writer) to regain possession through repayment of some stipulated
        price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
