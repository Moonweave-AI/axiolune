    CalculationAgent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CalculationAgent
      namespace: fibo-fbc-finfin
      localName: CalculationAgent
      label: calculation agent
      definition: party that is responsible for determining the value of an instrument and in some cases, determines how much
        the parties owe one another
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ThirdPartyAgent
      attributeUses: []
      patternBindings: []
    CashInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CashInstrument
      namespace: fibo-fbc-finfin
      localName: CashInstrument
      label: cash instrument
      definition: financial instrument whose value is determined by the market and that is readily transferable (highly liquid)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    CommodityInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CommodityInstrument
      namespace: fibo-fbc-finfin
      localName: CommodityInstrument
      label: commodity instrument
      definition: financial instrument representing an ownership interest in bulk goods, such as raw materials and primary
        agricultural products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    CurrencyInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CurrencyInstrument
      namespace: fibo-fbc-finfin
      localName: CurrencyInstrument
      label: currency instrument
      definition: financial instrument used for the purposes of currency trading
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    DebtInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DebtInstrument
      namespace: fibo-fbc-finfin
      localName: DebtInstrument
      label: debt instrument
      definition: financial instrument and credit agreement evidencing monies owed by the issuer to the holder on terms as
        specified
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreement
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    DerivativeInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      namespace: fibo-fbc-finfin
      localName: DerivativeInstrument
      label: derivative instrument
      definition: financial instrument that confers on its holders certain rights or obligations, whose value is derived from
        one or more underlying assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    Entitlement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Entitlement
      namespace: fibo-fbc-finfin
      localName: Entitlement
      label: entitlement
      definition: financial instrument that provides the holder an interest in, or the privilege to subscribe to, or to receive
        specific assets under terms specified
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    EquityInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/EquityInstrument
      namespace: fibo-fbc-finfin
      localName: EquityInstrument
      label: equity instrument
      definition: financial instrument representing an ownership interest in an entity or pool of assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      attributeUses: []
      patternBindings: []
    ExemptSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/ExemptSecurity
      namespace: fibo-fbc-finfin
      localName: ExemptSecurity
      label: exempt security
      definition: security that is exempt from certain regulatory rules
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      attributeUses: []
      patternBindings: []
    FinancialInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      namespace: fibo-fbc-finfin
      localName: FinancialInstrument
      label: financial instrument
      definition: written contract that gives rise to both a financial asset of one entity and a financial liability of another
        entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    FinancialInstrumentIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrumentIdentifier
      namespace: fibo-fbc-finfin
      localName: FinancialInstrumentIdentifier
      label: financial instrument identifier
      definition: sequence of characters uniquely identifying a financial instrument for some purpose and within a specified
        context
      superTypes:
      - https://www.omg.org/spec/Commons/Identifiers/Identifier
      attributeUses: []
      patternBindings: []
    Future:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Future
      namespace: fibo-fbc-finfin
      localName: Future
      label: future
      definition: derivative instrument that obligates the buyer to receive and the seller to deliver the assets specified
        at an agreed price, at some later point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    Issuer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Issuer
      namespace: fibo-fbc-finfin
      localName: Issuer
      label: issuer
      definition: role of a party that issues (or proposes to issue in a formal filing) one or more financial instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractPrincipal
      attributeUses: []
      patternBindings: []
