      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Trade
      attributeUses: []
      patternBindings: []
    Security:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Security
      namespace: fibo-fbc-finfin
      localName: Security
      label: security
      definition: financial instrument that can be bought or sold
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
