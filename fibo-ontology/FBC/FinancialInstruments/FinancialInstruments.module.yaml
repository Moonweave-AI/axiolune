      definition: financial product that acts as a container for at least one financial instrument, including other financial
        products, and whose value is derived from, or based on a reference asset, market measure, or investment strategy
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProduct
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/ContractualProduct
      attributeUses: []
      patternBindings: []
