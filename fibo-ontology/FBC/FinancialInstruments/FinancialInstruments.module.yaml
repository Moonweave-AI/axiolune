      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/SpotContract
      namespace: fibo-fbc-finfin
      localName: SpotContract
      label: spot contract
      definition: financial instrument that settles for immediate delivery on a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    StandardizedTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/StandardizedTerms
      namespace: fibo-fbc-finfin
      localName: StandardizedTerms
      label: standardized terms
      definition: contract terms that, grouped together, that are generally and consistently reused across many contracts,
