      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    Underlier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Underlier
      namespace: fibo-fbc-finfin
      localName: Underlier
      label: underlier
      definition: something that can be assigned a value in the marketplace that forms the basis for a derivative or pool-backed
        instrument
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Undergoer
      attributeUses: []
      patternBindings: []
    UniqueTransactionIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/UniqueTransactionIdentifier
      namespace: fibo-fbc-finfin
      localName: UniqueTransactionIdentifier
      label: UniqueTransactionIdentifier
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
