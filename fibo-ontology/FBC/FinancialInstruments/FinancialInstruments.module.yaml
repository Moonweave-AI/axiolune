  label: Financial Instruments Ontology
  definition: This ontology defines the fundamental concepts for financial instruments in general, providing the high-level
    hooks for build-out in more detail in the relevant domain areas. These include, but are not limited to, equities, options,
    debt instruments, and so forth, some of which may be negotiable.
