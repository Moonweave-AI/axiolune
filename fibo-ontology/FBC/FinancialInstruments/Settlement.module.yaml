      label: is fractional eligible
      definition: indicates whether the security can contain fractional share/amounts
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
    isFullyAutomatedSecuritiesTransferApplicable:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/isFullyAutomatedSecuritiesTransferApplicable
      namespace: fibo-fbc-finset
      localName: isFullyAutomatedSecuritiesTransferApplicable
      label: is fully automated securities transfer applicable
      definition: indicates whether the security is to be held at the transfer agent as part of the FAST (Fully Automated
        Securities Transfer) program
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
