domain:
  objectTypes:
    CashSettlementTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/CashSettlementTerms
      namespace: fibo-fbc-finset
      localName: CashSettlementTerms
      label: cash settlement terms
      definition: contractual commitment to settle in cash
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/SettlementTerms
      attributeUses: []
      patternBindings: []
    DeliveryMethod:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/DeliveryMethod
      namespace: fibo-fbc-finset
      localName: DeliveryMethod
      label: delivery method
      definition: method and commitment to transfer a commodity, currency, security, cash or another instrument as defined
        in the settlement terms of the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/DistributionStrategy
      attributeUses: []
      patternBindings: []
    PhysicalSettlementTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/PhysicalSettlementTerms
      namespace: fibo-fbc-finset
      localName: PhysicalSettlementTerms
      label: physical settlement terms
      definition: commitment to deliver the actual underlying asset on the specified delivery date, rather than cash
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/SettlementTerms
      attributeUses: []
      patternBindings: []
    Settlement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/Settlement
      namespace: fibo-fbc-finset
      localName: Settlement
      label: settlement
      definition: act of finalizing a transaction, including but not limited to finalizing accounting, exchanging consideration,
        and/or legally recording documents, as applicable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleEvent
      attributeUses: []
      patternBindings: []
    SettlementConvention:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/SettlementConvention
      namespace: fibo-fbc-finset
      localName: SettlementConvention
      label: settlement convention
      definition: convention employed to determine the closing date (from the stated settlement date) in the process of settling
        a transaction on which securities or interests in securities are delivered, usually against (in simultaneous exchange
        for) payment of some consideration
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/BusinessDates/Convention
      attributeUses: []
      patternBindings: []
    SettlementEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/SettlementEvent
      namespace: fibo-fbc-finset
      localName: SettlementEvent
      label: settlement event
      definition: specific event involving the finalization a transaction or portion thereof, including but not limited to
        finalizing accounting, exchanging consideration, and/or legally recording documents, as applicable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleEventOccurrence
      attributeUses: []
      patternBindings: []
    SettlementTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/SettlementTerms
      namespace: fibo-fbc-finset
      localName: SettlementTerms
