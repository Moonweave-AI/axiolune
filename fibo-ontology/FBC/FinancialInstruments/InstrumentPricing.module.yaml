      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/CollectionOfSecurityPrices
      namespace: fibo-fbc-finins
      localName: CollectionOfSecurityPrices
      label: collection of security prices
      definition: collection consisting of a series of prices, each of which has a specific date and time associated with
        it, for some security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/DatedStructuredCollection
      attributeUses: []
      patternBindings: []
    CompositeMarket:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/CompositeMarket
      namespace: fibo-fbc-finins
      localName: CompositeMarket
      label: composite market
      definition: group of exchanges and trading venues referenced for pricing purposes
      superTypes:
      - https://www.omg.org/spec/Commons/Collections/StructuredCollection
      attributeUses: []
      patternBindings: []
