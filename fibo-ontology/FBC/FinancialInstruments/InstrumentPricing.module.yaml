      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/DerivedPrice
      namespace: fibo-fbc-finins
      localName: DerivedPrice
      label: derived price
      definition: price that stems from another source or calculation rather than being quoted or based on actual trading
        data
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/CalculatedPrice
      attributeUses: []
      patternBindings: []
    DirtyPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/DirtyPrice
      namespace: fibo-fbc-finins
      localName: DirtyPrice
      label: dirty price
      definition: debt instrument price that includes accrued interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    HighPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/HighPrice
      namespace: fibo-fbc-finins
      localName: HighPrice
      label: high price
      definition: highest price for a given security over the period specified
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    InternalRateOfReturn:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/InternalRateOfReturn
      namespace: fibo-fbc-finins
      localName: InternalRateOfReturn
      label: internal rate of return
      definition: discount rate that results in a net present value (NPV) of zero for a series of future cash flows
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/RateOfReturn
      attributeUses: []
      patternBindings: []
    IntraDayPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/IntraDayPrice
      namespace: fibo-fbc-finins
      localName: IntraDayPrice
      label: intra day price
      definition: price for a given security at some point between the opening and official closing price on an exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/MarketPrice
      attributeUses: []
      patternBindings: []
    LowPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/LowPrice
      namespace: fibo-fbc-finins
      localName: LowPrice
      label: low price
      definition: lowest value for a given security over the period specified
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    MarketPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/MarketPrice
      namespace: fibo-fbc-finins
      localName: MarketPrice
      label: market price
      definition: last reported price at which a security was sold
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
