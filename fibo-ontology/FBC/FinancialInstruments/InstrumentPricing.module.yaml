      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Percentage
      attributeUses: []
      patternBindings: []
    YieldSpread:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/YieldSpread
      namespace: fibo-fbc-finins
      localName: YieldSpread
      label: yield spread
      definition: the spread between the yields of two items
