      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/MarketPrice
      attributeUses: []
      patternBindings: []
    PriceAnalytic:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceAnalytic
      namespace: fibo-fbc-finins
      localName: PriceAnalytic
      label: price analytic
      definition: statistical measure involving security prices
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ScopedMeasure
      attributeUses: []
      patternBindings: []
    PriceDeterminationMethod:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceDeterminationMethod
      namespace: fibo-fbc-finins
      localName: PriceDeterminationMethod
      label: price determination method
      definition: strategy for calculating or otherwise establishing a price for something
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/Strategy
      attributeUses: []
      patternBindings: []
    PriceSpread:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceSpread
      namespace: fibo-fbc-finins
      localName: PriceSpread
      label: price spread
      definition: difference between two prices
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/Difference
      attributeUses: []
      patternBindings: []
    PricingModel:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PricingModel
      namespace: fibo-fbc-finins
      localName: PricingModel
      label: pricing model
      definition: expression used to determine a value for an instrument at a given point in time
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    RateOfReturn:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/RateOfReturn
      namespace: fibo-fbc-finins
      localName: RateOfReturn
      label: rate of return
      definition: net gain or loss on an investment over a specified time period, expressed as a percentage of the investment's
