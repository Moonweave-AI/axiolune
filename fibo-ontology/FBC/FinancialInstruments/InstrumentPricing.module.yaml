      label: volume-weighted average price
      definition: average price at which a given security has traded throughout a trading day, determined by multiplying each
        trade by its volume, adding the results, then dividing by the volume traded for the day
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceAnalytic
      attributeUses: []
      patternBindings: []
    VolumeWeightedOpenPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/VolumeWeightedOpenPrice
      namespace: fibo-fbc-finins
      localName: VolumeWeightedOpenPrice
      label: volume-weighted open price
      definition: price determined by multiplying each trade by its volume, adding the results, then dividing by the volume
        over a certain period during the trading day (rather than over the course of the entire day)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceAnalytic
      attributeUses: []
      patternBindings: []
    Yield:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/Yield
