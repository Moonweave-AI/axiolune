      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Percentage
      attributeUses: []
      patternBindings: []
    SecurityPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      namespace: fibo-fbc-finins
      localName: SecurityPrice
      label: security price
      definition: monetary price for a financial instrument at some point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      attributeUses: []
      patternBindings: []
    TradingDay:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/TradingDay
      namespace: fibo-fbc-finins
      localName: TradingDay
      label: trading day
      definition: time span that a particular trading venue is open
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDatePeriod
      attributeUses: []
      patternBindings: []
    TradingSession:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/TradingSession
      namespace: fibo-fbc-finins
      localName: TradingSession
      label: trading session
      definition: window of time within a trading day in which orders may be placed and filled
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDatePeriod
      attributeUses: []
      patternBindings: []
    VolumeWeightedAveragePrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/VolumeWeightedAveragePrice
      namespace: fibo-fbc-finins
