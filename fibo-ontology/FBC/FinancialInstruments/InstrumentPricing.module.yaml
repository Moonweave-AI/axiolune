      definition: arithmetic mean between bid and offer prices
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/ArithmeticMean
      attributeUses: []
      patternBindings: []
    OfferPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/OfferPrice
      namespace: fibo-fbc-finins
      localName: OfferPrice
      label: offer price
      definition: price suggested by a prospective seller at a particular time for a given security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    OfficialClosingPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/OfficialClosingPrice
      namespace: fibo-fbc-finins
      localName: OfficialClosingPrice
      label: official closing price
      definition: price of the final trade of a security at the end of a trading day on a given exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/ClosingPrice
      attributeUses: []
      patternBindings: []
    OpeningPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/OpeningPrice
      namespace: fibo-fbc-finins
      localName: OpeningPrice
