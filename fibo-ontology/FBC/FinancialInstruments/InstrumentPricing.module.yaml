domain:
  objectTypes:
    AdjustedClosingPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/AdjustedClosingPrice
      namespace: fibo-fbc-finins
      localName: AdjustedClosingPrice
      label: adjusted closing price
      definition: amended closing price to reflect a security's value after accounting for any corporate actions, such as
        stock splits, dividends, and rights offerings
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/ClosingPrice
      attributeUses: []
      patternBindings: []
    BestBid:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/BestBid
      namespace: fibo-fbc-finins
      localName: BestBid
      label: best bid
      definition: highest bid price a prospective buyer is willing to pay at a particular time for a given security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/BidPrice
      attributeUses: []
      patternBindings: []
    BestOffer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/BestOffer
      namespace: fibo-fbc-finins
      localName: BestOffer
      label: best offer
      definition: lowest price acceptable to a prospective seller for a given security at a particular point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/OfferPrice
      attributeUses: []
      patternBindings: []
    BidAskSpread:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/BidAskSpread
      namespace: fibo-fbc-finins
      localName: BidAskSpread
      label: bid ask spread
      definition: difference between an offer (ask) price and a bid price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceSpread
      attributeUses: []
      patternBindings: []
    BidPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/BidPrice
      namespace: fibo-fbc-finins
      localName: BidPrice
      label: bid price
      definition: price a prospective buyer is willing to pay
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    CleanPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/CleanPrice
      namespace: fibo-fbc-finins
      localName: CleanPrice
      label: clean price
      definition: debt instrument price that does not include accrued interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
      attributeUses: []
      patternBindings: []
    ClosingPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/ClosingPrice
      namespace: fibo-fbc-finins
      localName: ClosingPrice
      label: closing price
      definition: cash value of the last transacted price before the market closes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/MarketPrice
      attributeUses: []
      patternBindings: []
    ClosingPriceDeterminationMethod:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/ClosingPriceDeterminationMethod
      namespace: fibo-fbc-finins
      localName: ClosingPriceDeterminationMethod
      label: closing price determination method
      definition: strategy for calculating or otherwise determining an official closing price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/PriceDeterminationMethod
      attributeUses: []
      patternBindings: []
