domain:
  objectTypes:
    Accrual:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Accrual
      namespace: fibo-fbc-debdeb
      localName: Accrual
      label: accrual
      definition: the process of accumulating interest or other income that has been earned but not paid
      superTypes:
      - https://www.omg.org/spec/Commons/RolesAndCompositions/Role
      attributeUses: []
      patternBindings: []
    AccruedInterest:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/AccruedInterest
      namespace: fibo-fbc-debdeb
      localName: AccruedInterest
      label: accrued interest
      definition: amount of interest that has been incurred, as of a specific date, on a loan or other financial obligation
        but has not yet been paid out
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Interest
      attributeUses: []
      patternBindings: []
    Amortization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Amortization
      namespace: fibo-fbc-debdeb
      localName: Amortization
      label: amortization
      definition: the process of reduction of debt or other costs through periodic charges to assets or liabilities, such
        as through principal payments on mortgages
      superTypes:
      - https://www.omg.org/spec/Commons/RolesAndCompositions/Role
      attributeUses: []
      patternBindings: []
    AmortizationSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/AmortizationSchedule
      namespace: fibo-fbc-debdeb
      localName: AmortizationSchedule
      label: amortization schedule
      definition: schedule of periodic payments (repayment installments) that specify changes in the balance of the debt over
        time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ProjectedContractEventSchedule
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentSchedule
      attributeUses: []
      patternBindings: []
    Borrower:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Borrower
      namespace: fibo-fbc-debdeb
      localName: Borrower
      label: borrower
      definition: party to a credit agreement that is obligated to repay the amount borrowed (principal) with interest and
        other fees according to the terms of the instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Debtor
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractParty
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Customer
      attributeUses: []
      patternBindings: []
    BorrowerIdentificationScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/BorrowerIdentificationScheme
      namespace: fibo-fbc-debdeb
      localName: BorrowerIdentificationScheme
      label: borrower identification scheme
      definition: system for allocating identifiers to borrowers
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/PartyRoleIdentificationScheme
      attributeUses: []
      patternBindings: []
    BorrowerIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/BorrowerIdentifier
      namespace: fibo-fbc-debdeb
      localName: BorrowerIdentifier
      label: borrower identifier
      definition: sequence of characters, capable of uniquely identifying a borrower
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/PartyRoleIdentifier
      attributeUses: []
      patternBindings: []
    BorrowingCapacity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/BorrowingCapacity
      namespace: fibo-fbc-debdeb
      localName: BorrowingCapacity
      label: borrowing capacity
      definition: upper bound on the total amount of money that a lender believes a party has the ability to repay an obligation
        when due, as of some point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      attributeUses: []
      patternBindings: []
    CapitalLease:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CapitalLease
      namespace: fibo-fbc-debdeb
      localName: CapitalLease
      label: capital lease
      definition: lease that must be reflected on an organization's balance sheet as an asset and as a corresponding liability
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Lease
      attributeUses: []
      patternBindings: []
    Collateral:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Collateral
      namespace: fibo-fbc-debdeb
      localName: Collateral
      label: collateral
      definition: something pledged as security to ensure fulfillment of an obligation to another party, to lend money, extend
        credit, or provision securities
      superTypes:
      - https://www.omg.org/spec/Commons/PartiesAndSituations/Undergoer
      attributeUses: []
      patternBindings: []
    CollateralValueAsOfDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CollateralValueAsOfDate
      namespace: fibo-fbc-debdeb
      localName: CollateralValueAsOfDate
      label: collateral value as of date
      definition: appraised value of the collateral for an obligation as of a given date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Assessments/AppraisedValue
      attributeUses: []
      patternBindings: []
    CommittedCreditFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CommittedCreditFacility
      namespace: fibo-fbc-debdeb
      localName: CommittedCreditFacility
      label: committed credit facility
      definition: credit facility that is a confirmed source of financing for the borrower, as long as the borrower meets
        the conditions of the agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditFacility
      attributeUses: []
      patternBindings: []
    CommittedSubFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CommittedSubFacility
      namespace: fibo-fbc-debdeb
      localName: CommittedSubFacility
      label: committed sub-facility
      definition: contractually committed portion of a credit facility that is available to the borrower and may be associated
        with some specific collateral
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/SubFacility
      attributeUses: []
      patternBindings: []
    CreditAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreement
      namespace: fibo-fbc-debdeb
      localName: CreditAgreement
      label: credit agreement
      definition: contractual agreement in which a debtor receives something of value and typically agrees to repay the creditor
        by some date in the future, in some form (e.g., cash, securities, etc.), generally with interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    CreditAgreementRepaidAtMaturity:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidAtMaturity
      namespace: fibo-fbc-debdeb
      localName: CreditAgreementRepaidAtMaturity
      label: credit agreement repaid at maturity
      definition: credit agreement in which accrued interest may be periodically repaid or paid at maturity, but principal
        is paid at maturity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreement
      attributeUses: []
      patternBindings: []
    CreditAgreementRepaidPeriodically:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidPeriodically
      namespace: fibo-fbc-debdeb
      localName: CreditAgreementRepaidPeriodically
      label: credit agreement repaid periodically
      definition: credit agreement in which the principal and accrued interest may be periodically repaid or exchanged
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreement
      attributeUses: []
      patternBindings: []
    CreditEnhancementAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditEnhancementAgreement
      namespace: fibo-fbc-debdeb
      localName: CreditEnhancementAgreement
      label: credit enhancement agreement
      definition: collateral agreement that governs the exchange of collateral between parties to mitigate counterparty credit
        risk
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/CollateralAgreement
      attributeUses: []
      patternBindings: []
    CreditEnhancementBeneficiary:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditEnhancementBeneficiary
      namespace: fibo-fbc-debdeb
      localName: CreditEnhancementBeneficiary
      label: credit enhancement beneficiary
      definition: party that benefits from the collateral or guarantee established under the agreement, i.e., that is protected
        against counterparty credit risk because the collateral or guarantee serves as security for the obligation(s) owed
        to them
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Beneficiary
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Counterparty
      attributeUses: []
      patternBindings: []
    CreditFacility:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditFacility
      namespace: fibo-fbc-debdeb
      localName: CreditFacility
      label: credit facility
      definition: credit agreement that allows the borrower to periodically take out money over an extended period of time
        rather than reapplying for a loan every time they need funds
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidPeriodically
      attributeUses: []
      patternBindings: []
    Creditor:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Creditor
      namespace: fibo-fbc-debdeb
      localName: Creditor
      label: creditor
      definition: a party to whom an obligation, such as an amount of money, or good, or performance of some service exists
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligee
      attributeUses: []
      patternBindings: []
    DayCountConvention:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/DayCountConvention
      namespace: fibo-fbc-debdeb
      localName: DayCountConvention
      label: day-count convention
      definition: a business recurrence interval convention that is used to calculate the number of days in an interest payment,
        which applies to the amount of accrued interest or the present value for debt instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/BusinessDates/BusinessRecurrenceIntervalConvention
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    Debt:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Debt
      namespace: fibo-fbc-debdeb
      localName: Debt
      label: debt
      definition: obligation to pay something, such as an amount of money, good, service, or instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Commitment
      attributeUses: []
      patternBindings: []
    DebtTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/DebtTerms
      namespace: fibo-fbc-debdeb
      localName: DebtTerms
      label: debt terms
      definition: contract terms that specify the formal rights and obligations of borrower and lender under a contract in
        which funds are lent from the one party to the other
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    Debtor:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Debtor
      namespace: fibo-fbc-debdeb
      localName: Debtor
      label: debtor
      definition: a party that owes a debt or other obligation to another party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligor
      attributeUses: []
      patternBindings: []
    ExplicitContractEventSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ExplicitContractEventSchedule
      namespace: fibo-fbc-debdeb
      localName: ExplicitContractEventSchedule
      label: explicit contract event schedule
      definition: schedule of events, including but not limited to payment events, rate reset events and others that will
        occur over the lifetime of the credit agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/AdHocSchedule
      attributeUses: []
      patternBindings: []
    FixedInterestRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FixedInterestRate
      namespace: fibo-fbc-debdeb
      localName: FixedInterestRate
      label: fixed interest rate
      definition: interest rate that does not fluctuate over the lifetime of a loan or other debt instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/InterestRate
      attributeUses: []
      patternBindings: []
    FloatingInterestRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FloatingInterestRate
      namespace: fibo-fbc-debdeb
      localName: FloatingInterestRate
      label: floating interest rate
      definition: variable interest rate that is based on a specific index or benchmark rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/VariableInterestRate
      attributeUses: []
      patternBindings: []
    FullAmortization:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FullAmortization
      namespace: fibo-fbc-debdeb
      localName: FullAmortization
      label: full amortization
      definition: amortization in which the very last payment (which, if the schedule was calculated correctly, should be
        equal to all others) pays off all remaining principal and interest on the loan
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Amortization
      attributeUses: []
      patternBindings: []
    Interest:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Interest
      namespace: fibo-fbc-debdeb
      localName: Interest
      label: interest
      definition: the cost of using credit, or another's money, expressed as a rate per period of time, payable by a debtor
        to a creditor in consideration of the credit extended to the debtor
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      attributeUses: []
      patternBindings: []
    InterestCalculation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestCalculation
      namespace: fibo-fbc-debdeb
      localName: InterestCalculation
      label: interest calculation
      definition: event reflecting the calculation of interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleEventOccurrence
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/Calculation
      attributeUses: []
      patternBindings: []
    InterestCalculationSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestCalculationSchedule
      namespace: fibo-fbc-debdeb
      localName: InterestCalculationSchedule
      label: interest calculation schedule
      definition: regular, contract-specific schedule including the dates on which interest is calculated
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ProjectedContractEventSchedule
      attributeUses: []
      patternBindings: []
    InterestPayment:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestPayment
      namespace: fibo-fbc-debdeb
      localName: InterestPayment
      label: interest payment
      definition: event reflecting the actual payment of interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payment
      attributeUses: []
      patternBindings: []
    InterestPaymentSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestPaymentSchedule
      namespace: fibo-fbc-debdeb
      localName: InterestPaymentSchedule
      label: interest payment schedule
      definition: regular, contract-specific schedule including the dates on which interest is due to be paid
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ProjectedContractEventSchedule
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/PaymentSchedule
      attributeUses: []
      patternBindings: []
    InterestPaymentTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestPaymentTerms
      namespace: fibo-fbc-debdeb
      localName: InterestPaymentTerms
      label: interest payment terms
      definition: contract terms for payment of interest on a debt
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/DebtTerms
      attributeUses: []
      patternBindings: []
    InterestRateReset:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestRateReset
      namespace: fibo-fbc-debdeb
      localName: InterestRateReset
      label: interest rate reset
      definition: event reflecting a potential adjustment to an interest rate, typically corresponding to a change in the
        underlying benchmark interest rate or index specified in the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestCalculation
      attributeUses: []
      patternBindings: []
    InterestRateResetSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestRateResetSchedule
      namespace: fibo-fbc-debdeb
      localName: InterestRateResetSchedule
      label: interest rate reset schedule
      definition: regular, contract-specific schedule including the dates on which a rate reset, and corresponding actual
        rate, is recalculated
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ProjectedContractEventSchedule
      attributeUses: []
      patternBindings: []
    InterestRateSettingEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestRateSettingEvent
      namespace: fibo-fbc-debdeb
      localName: InterestRateSettingEvent
      label: interest rate setting event
      definition: event on which an initial rate for a given contract is set, which may be relative the the occurrence of
        some other contract lifecycle event, such as the execution date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/InterestCalculation
      attributeUses: []
      patternBindings: []
    Lease:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Lease
      namespace: fibo-fbc-debdeb
      localName: Lease
      label: lease
      definition: credit agreement permitting the use of real estate, equipment or another asset, such as a vehicle, by the
        owner of that asset (the lessor) to a user (the lessee) for a specific period of time in return for payment as specified
        in the agreement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreementRepaidPeriodically
      attributeUses: []
      patternBindings: []
    Lender:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Lender
      namespace: fibo-fbc-debdeb
      localName: Lender
      label: lender
      definition: a party that extends credit or money to a borrower with the expectation of being repaid, usually with interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Creditor
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractParty
      attributeUses: []
      patternBindings: []
    ManagedInterestRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ManagedInterestRate
      namespace: fibo-fbc-debdeb
      localName: ManagedInterestRate
      label: managed interest rate
      definition: variable interest rate charged by a financial institution for borrowing that is not prescribed as a margin
        over base rate but is set from time to time by the institution
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/VariableInterestRate
