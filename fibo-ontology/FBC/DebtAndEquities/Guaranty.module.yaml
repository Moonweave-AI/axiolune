domain:
  objectTypes:
    CreditEnhancementAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditEnhancementAgreement
      namespace: fibo-fbc-debgua
      localName: CreditEnhancementAgreement
      label: CreditEnhancementAgreement
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    CollateralizedGuaranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/CollateralizedGuaranty
      namespace: fibo-fbc-debgua
      localName: CollateralizedGuaranty
      label: collateralized guaranty
      definition: guaranty that takes the form of some asset that is pledged by a borrower to a lender (usually in return
        for a loan)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      attributeUses: []
      patternBindings: []
    GovernmentGuaranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/GovernmentGuaranty
      namespace: fibo-fbc-debgua
      localName: GovernmentGuaranty
      label: government guaranty
      definition: guaranty provided by a government entity, such as for a government-backed security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      attributeUses: []
      patternBindings: []
    Guarantor:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guarantor
      namespace: fibo-fbc-debgua
      localName: Guarantor
      label: guarantor
      definition: party that guarantees, endorses, or provides indemnity for some obligation on behalf of some other party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/DeJureControllingInterestParty
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractThirdParty
      attributeUses: []
      patternBindings: []
    Guaranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      namespace: fibo-fbc-debgua
      localName: Guaranty
      label: guaranty
      definition: commitment whereby something is formally assured if a party with primary liability fails to perform
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Commitment
      attributeUses: []
      patternBindings: []
    InsuranceBackedGuaranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/InsuranceBackedGuaranty
      namespace: fibo-fbc-debgua
      localName: InsuranceBackedGuaranty
      label: insurance-backed guaranty
      definition: guaranty that is realized as an insurance policy
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      attributeUses: []
      patternBindings: []
    InsurancePolicy:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/InsurancePolicy
      namespace: fibo-fbc-debgua
      localName: InsurancePolicy
      label: insurance policy
      definition: contract that (1) puts an indemnity cover into effect, (2) serves as a legal evidence of the insurance agreement,
        (3) sets out the exact terms on which the indemnity cover has been provided, and (4) states associated information
        such as the (a) specific risks and perils covered, (b) duration of coverage, (c) amount of premium, (d) mode of premium
        payment, and (e) deductibles, if any
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/WrittenContract
      attributeUses: []
      patternBindings: []
    Insurer:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Insurer
      namespace: fibo-fbc-debgua
      localName: Insurer
      label: insurer
      definition: financial service provider that issues an insurance policy
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractPrincipal
      attributeUses: []
      patternBindings: []
    JointGuaranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/JointGuaranty
      namespace: fibo-fbc-debgua
      localName: JointGuaranty
      label: joint guaranty
      definition: guaranty provided by at least two parties, jointly and severally
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      attributeUses: []
      patternBindings: []
    LetterOfCredit:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/LetterOfCredit
      namespace: fibo-fbc-debgua
      localName: LetterOfCredit
      label: letter of credit
      definition: letter from a bank or other creditworthy institution guaranteeing that a buyer's payment to a seller will
        be received on time and for the correct amount
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CommittedCreditFacility
      attributeUses: []
      patternBindings: []
    LetterOfCreditGuaranty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/LetterOfCreditGuaranty
      namespace: fibo-fbc-debgua
      localName: LetterOfCreditGuaranty
      label: letter of credit guaranty
      definition: guaranty that takes the form of a letter of credit, i.e., a document issued by a bank guaranteeing the payment
        up to a stated amount for a specified period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/CollateralizedGuaranty
      attributeUses: []
      patternBindings: []
    NegativePledge:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/NegativePledge
      namespace: fibo-fbc-debgua
      localName: NegativePledge
      label: negative pledge
      definition: guaranty whereby the issuer will not pledge any assets if doing so would result in less security for lender(s)
        or investor(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      attributeUses: []
      patternBindings: []
    Policyholder:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Policyholder
      namespace: fibo-fbc-debgua
      localName: Policyholder
      label: policyholder
      definition: counterparty to and typically owner of an insurance policy
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Counterparty
      attributeUses: []
      patternBindings: []
    PriorityLevel:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/PriorityLevel
      namespace: fibo-fbc-debgua
      localName: PriorityLevel
      label: priority level
      definition: relative ranking that a guaranty has in the context of a contract, for example for a credit enhancement
        priority
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasGuaranteedAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/hasGuaranteedAmount
      namespace: fibo-fbc-debgua
      localName: hasGuaranteedAmount
      label: has guaranteed amount
      definition: relates the guaranty to the monetary amount guaranteed
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
