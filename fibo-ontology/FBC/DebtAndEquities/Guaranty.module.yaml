      namespace: fibo-fbc-debgua
      localName: hasGuarantor
      label: has guarantor
      definition: relates the guarantor to the contract for which they are providing a guaranty
      domain: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Contract
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guarantor
      inverseOf: ''
      characteristics: []
    hasGuarantorParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/hasGuarantorParty
      namespace: fibo-fbc-debgua
      localName: hasGuarantorParty
      label: has guarantor party
      definition: indicates a party that guarantees, endorses, or provides indemnity for some obligation on its behalf
      domain: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/ControlledParty
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guarantor
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/isGuarantorOf
      characteristics: []
    hasPriorityLevel:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/hasPriorityLevel
      namespace: fibo-fbc-debgua
      localName: hasPriorityLevel
      label: has priority level
      definition: relates a guaranty to some relative ranking that the guaranty has in the context of the contract, for example
        for a credit enhancement priority
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/PriorityLevel
      inverseOf: ''
      characteristics: []
    isGuaranteedBy:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/isGuaranteedBy
      namespace: fibo-fbc-debgua
      localName: isGuaranteedBy
      label: is guaranteed by
      definition: relates guaranty to the contract guarantor, i.e., to the legal person providing the guaranty
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guarantor
      inverseOf: ''
      characteristics: []
    isGuarantorOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/isGuarantorOf
      namespace: fibo-fbc-debgua
      localName: isGuarantorOf
      label: is guarantor of
      definition: identifies a party over which a guarantor has some measure of control by virtue of the guarantee
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guarantor
      range: https://spec.edmcouncil.org/fibo/ontology/BE/OwnershipAndControl/ControlParties/ControlledParty
      inverseOf: ''
      characteristics: []
