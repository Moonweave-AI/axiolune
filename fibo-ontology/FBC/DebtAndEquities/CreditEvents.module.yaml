module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/
  preferredPrefix: fibo-fbc-debcre
  version: '20250401'
  label: Credit Events Ontology
  definition: "This ontology defines a range of credit events, that is events in which some payment or payments are not made.\
    \ These include credit events relating to a specific debt obligation and events relating to the business entity as a whole.\
    \ \n\t\tNote: the events defined herein are primarily business rather than consumer oriented, and are specified fairly\
    \ generally. Many credit events are jurisdiction-specific, such as Chapter 11 restructuring and Chapter 7 bankruptcy in\
    \ the United States. This ontology is designed to facilitate jurisdiction and instrument-specific extensions as needed."
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Relations/Relations/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/ContextualDesignators/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/DatesAndTimes/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/Organizations/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: CreditEvents.rdf
  sourceDigest: sha256:1d3df1c69304ab50a1bbd9de4bab3ef1bb1342670894db940ccf5e175687caa7
  sourcePath: FBC/DebtAndEquities/CreditEvents.rdf
  fiboDomain: FBC
domain:
  objectTypes:
    Bankruptcy:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/Bankruptcy
      namespace: fibo-fbc-debcre
      localName: Bankruptcy
      label: bankruptcy
      definition: credit event involving a change in state or condition in which a party becomes insolvent
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/EntitySpecificCreditEvent
      attributeUses: []
      patternBindings: []
    CreditEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/CreditEvent
      namespace: fibo-fbc-debcre
      localName: CreditEvent
      label: credit event
      definition: event signifying a sudden change in credit standing, such as bankruptcy or a violation of a bond indenture
        or loan agreement, that raises doubts about the party's ability to meet current or future obligations
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/Occurrence
      attributeUses: []
      patternBindings: []
    CrossDefaultProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/CrossDefaultProvision
      namespace: fibo-fbc-debcre
      localName: CrossDefaultProvision
      label: cross default provision
      definition: contract provision that triggers a default under one contract if the borrower defaults on another related
        obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ConditionPrecedent
      attributeUses: []
      patternBindings: []
    DefaultEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DefaultEvent
      namespace: fibo-fbc-debcre
      localName: DefaultEvent
      label: default event
      definition: credit event representing a failure to meet a contractual obligation, such as failure to repay a debt including
        interest or principal on a loan or security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
    DistressedRatingsDowngrade:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DistressedRatingsDowngrade
      namespace: fibo-fbc-debcre
      localName: DistressedRatingsDowngrade
      label: distressed ratings downgrade
      definition: credit event triggered when the credit rating of an obligation is downgraded to a distressed debt level
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/Downgrade
      attributeUses: []
      patternBindings: []
    Downgrade:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/Downgrade
      namespace: fibo-fbc-debcre
      localName: Downgrade
      label: downgrade
      definition: credit event triggered when the credit rating of a party or obligation is lowered
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/CreditEvent
      attributeUses: []
      patternBindings: []
    EntitySpecificCreditEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/EntitySpecificCreditEvent
      namespace: fibo-fbc-debcre
      localName: EntitySpecificCreditEvent
      label: entity-specific credit event
      definition: credit event that applies to a given legal person
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/CreditEvent
      attributeUses: []
      patternBindings: []
    FailureToPay:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/FailureToPay
      namespace: fibo-fbc-debcre
      localName: FailureToPay
      label: failure to pay
      definition: default event that is triggered following any applicable grace period in which a payment obligation is missed
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DefaultEvent
      attributeUses: []
      patternBindings: []
    FailureToPayInterest:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/FailureToPayInterest
      namespace: fibo-fbc-debcre
      localName: FailureToPayInterest
      label: failure to pay interest
      definition: default event that where either an expected interest payment is missed altogether or the amount paid is
        less than the required amount
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/FailureToPay
      attributeUses: []
      patternBindings: []
    FailureToPayPrincipal:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/FailureToPayPrincipal
      namespace: fibo-fbc-debcre
      localName: FailureToPayPrincipal
      label: failure to pay principal
      definition: default event that where either an expected principal payment is missed altogether or the amount paid is
        less than the required amount
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/FailureToPay
      attributeUses: []
      patternBindings: []
    FilingForBankruptcy:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/FilingForBankruptcy
      namespace: fibo-fbc-debcre
      localName: FilingForBankruptcy
      label: filing for bankruptcy
      definition: credit event that involves a request to a court to be recognized as bankrupt
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/EntitySpecificCreditEvent
      attributeUses: []
      patternBindings: []
    HardCreditEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/HardCreditEvent
      namespace: fibo-fbc-debcre
      localName: HardCreditEvent
      label: hard credit event
      definition: default event that is not repairable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DefaultEvent
      attributeUses: []
      patternBindings: []
    InstallmentDefault:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/InstallmentDefault
      namespace: fibo-fbc-debcre
      localName: InstallmentDefault
      label: installment default
      definition: default event involving non-payment of several installment payments as scheduled in the terms of the agreement,
        or non-payment of a call by the beneficial owner
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DefaultEvent
      attributeUses: []
      patternBindings: []
    InterestObligationInLightOfDefault:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/InterestObligationInLightOfDefault
      namespace: fibo-fbc-debcre
      localName: InterestObligationInLightOfDefault
      label: interest obligation in light of default
      definition: obligation in respect of default(s) in the performance of any payment obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/ContingentObligation
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/ContractualObligation
      attributeUses: []
      patternBindings: []
    MaturityExtension:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/MaturityExtension
      namespace: fibo-fbc-debcre
      localName: MaturityExtension
      label: maturity extension
      definition: credit event involving extension of payments beyond the original maturity date of the obligation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
    Moratorium:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/Moratorium
      namespace: fibo-fbc-debcre
      localName: Moratorium
      label: moratorium
      definition: entity-specific credit event involving a temporary suspension of payments until related issues are resolved
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/EntitySpecificCreditEvent
      attributeUses: []
      patternBindings: []
    ObligationAcceleration:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationAcceleration
      namespace: fibo-fbc-debcre
      localName: ObligationAcceleration
      label: obligation acceleration
      definition: credit event triggered when one or more reference obligations become immediately due and payable as a result
        of a default or covenant breach on the reference entity's other debt instruments, subject to a materiality threshold
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
    ObligationDefault:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationDefault
      namespace: fibo-fbc-debcre
      localName: ObligationDefault
      label: obligation default
      definition: credit event triggered as a result of an obligation-specific default
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DefaultEvent
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
    ObligationRestructuring:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationRestructuring
      namespace: fibo-fbc-debcre
      localName: ObligationRestructuring
      label: obligation restructuring
      definition: credit event that materially impacts an obligation, such as an interest rate reduction, principal reduction,
        deferral of interest or principal, change in priority ranking, or change in currency or composition of payment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
    ObligationSpecificCreditEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      namespace: fibo-fbc-debcre
      localName: ObligationSpecificCreditEvent
      label: obligation-specific credit event
      definition: credit event that relates to an individual credit agreement or debt instrument (reference obligation)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/CreditEvent
      attributeUses: []
      patternBindings: []
    Repudiation:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/Repudiation
      namespace: fibo-fbc-debcre
      localName: Repudiation
      label: repudiation
      definition: credit event involving the refusal to honor the terms of a contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
    SoftCreditEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/SoftCreditEvent
      namespace: fibo-fbc-debcre
      localName: SoftCreditEvent
      label: soft credit event
      definition: default event that is repairable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/DefaultEvent
      attributeUses: []
      patternBindings: []
    WriteDown:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/WriteDown
      namespace: fibo-fbc-debcre
      localName: WriteDown
      label: write-down
      definition: obligation-specific credit event whereby the book value of the obligation, such as the outstanding principal
        amount, is reduced
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationSpecificCreditEvent
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasDefaultInterestCompoundingBasis:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/hasDefaultInterestCompoundingBasis
      namespace: fibo-fbc-debcre
      localName: hasDefaultInterestCompoundingBasis
      label: has default interest compounding basis
      definition: indicates the basis on which default interest is to be calculated, as a period of time
      domain: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/InterestObligationInLightOfDefault
      range: https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      inverseOf: ''
      characteristics: []
    hasDefaultThresholdAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/hasDefaultThresholdAmount
      namespace: fibo-fbc-debcre
      localName: hasDefaultThresholdAmount
      label: has default threshold amount
      definition: specifies an amount of money that triggers a failure to pay, repudiation/moratorium or restructuring event
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      inverseOf: ''
      characteristics: []
    hasGracePeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/hasGracePeriod
      namespace: fibo-fbc-debcre
      localName: hasGracePeriod
      label: has grace period
      definition: window following any payment due date during which a party must fulfill its obligations before a failure
        to pay credit event occurs
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      inverseOf: ''
      characteristics: []
  attributeTypes:
    involvesMultipleEvents:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/involvesMultipleEvents
      namespace: fibo-fbc-debcre
      localName: involvesMultipleEvents
      label: involves multiple events
      definition: indicates that the restructuring spans more than one credit event
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
    isDefaultInterestApplicable:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/isDefaultInterestApplicable
      namespace: fibo-fbc-debcre
      localName: isDefaultInterestApplicable
      label: is default interest applicable
      definition: indicates whether a party that defaults in the performance of any payment obligation is, to the extent permitted
        by law and the applicable agreement, required to pay interest (before as well as after judgment) on the overdue amount
        to the other party on demand in the same currency as such overdue amount, for the period from (and including) the
        original due date for payment to (but excluding) the date of actual payment
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
    isGracePeriodExtendable:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/isGracePeriodExtendable
      namespace: fibo-fbc-debcre
      localName: isGracePeriodExtendable
      label: is grace period extendable
      definition: indicates whether or not the grace period may be extended, which may be jurisdiction specific
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
