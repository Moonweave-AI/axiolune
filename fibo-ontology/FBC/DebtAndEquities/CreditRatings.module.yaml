  label: Credit Ratings Ontology
  definition: "This ontology defines the concept of a credit rating, along with credit watch and outlook qualifying terms.\
    \ There are credit ratings for individuals, for organizations and for instruments. \n\t\tThese are referenced extensively\
    \ in the securities models but are also applicable to business entities generally and in the context of lending and account\
    \ maintenance."
