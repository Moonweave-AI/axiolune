  label: Credit Default Swaps Ontology
  definition: Credit default swaps are financial instruments that allow the transfer of credit risk among market participants,
    potentially facilitating greater efficiency in the pricing and distribution/offset of credit risk. They are bilateral
    contracts in which one party (the protection seller) agrees to provide payment(s) to the other party (the protection buyer)
    should a credit event occur against the underlying. The underlier for a CDS may be a specified debt (the reference obligation),
    a specific debt issuer (reference entity), in which case the credit events involving the entity is what triggers the payment,
    a basket of reference entities and/or reference obligations, or a credit index (reference index). This ontology defines
    the concept of a basic credit default swap as well as more specific kinds of CDS and specifies related details.
