domain:
  objectTypes:
    AsianOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/AsianOption
      namespace: fibo-der-derexo
      localName: AsianOption
      label: Asian option
      definition: option whose exercise terms involve a payoff determined by the average underlying price (either the strike
        price or the settlement price) of the underlying asset over a predetermined period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    AsianOptionClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/AsianOptionClassifier
      namespace: fibo-der-derexo
      localName: AsianOptionClassifier
      label: Asian option classifier
      definition: financial instrument classifier that classifies Asian options based on whether they are rate-based or price
        based
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/SecuritiesClassification/FinancialInstrumentClassifier
      attributeUses: []
      patternBindings: []
    AveragingStrategy:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/AveragingStrategy
      namespace: fibo-der-derexo
      localName: AveragingStrategy
      label: averaging strategy
      definition: method used for calculating the average rate or price of an Asian option
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/Strategy
      attributeUses: []
      patternBindings: []
    BarrierOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/BarrierOption
      namespace: fibo-der-derexo
      localName: BarrierOption
      label: barrier option
      definition: option whose final exercise depends upon the path taken by the price of an underlying instrument, i.e.,
        whose payoff depends on whether or not the underlying asset has reached or exceeded a predetermined price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    ChooserOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/ChooserOption
      namespace: fibo-der-derexo
      localName: ChooserOption
      label: chooser option
      definition: exotic option that allows its holder (buyer) to exercise the right to buy (call) or sell (put) specified
        assets at a fixed price whereby the buyer does not have to decide whether the contract will be a put or a call until
        an agreed future date, prior to expiration
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    CliquetOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/CliquetOption
      namespace: fibo-der-derexo
      localName: CliquetOption
      label: cliquet option
      definition: exotic option that is a series of at-the-money (ATM) options, either puts or calls, where each successive
        option becomes active when the previous one expires
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    CommodoreOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/CommodoreOption
      namespace: fibo-der-derexo
      localName: CommodoreOption
      label: commodore option
      definition: exotic option consisting of a number of digital barrier options that pay a coupon if a pre-determined level
        of the underlying or basket of underlyings is reached
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    CompoundOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/CompoundOption
      namespace: fibo-der-derexo
      localName: CompoundOption
      label: compound option
      definition: exotic option for which the underlying asset is another option
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    DigitalOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/DigitalOption
      namespace: fibo-der-derexo
      localName: DigitalOption
      label: digital option
      definition: exotic option that has a pre-determined payout if the option is in-the-money and the payoff condition is
        satisfied
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/BarrierOption
      attributeUses: []
      patternBindings: []
    DoubleBarrierOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/DoubleBarrierOption
      namespace: fibo-der-derexo
      localName: DoubleBarrierOption
      label: double barrier option
      definition: barrier option applied to currencies or over the counter stocks that works as a binary, or digital option
        in that it pays out only under defined circumstances, or it is worthless, at expiration
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/BarrierOption
      attributeUses: []
      patternBindings: []
    FixedLookbackStrikeExpression:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/FixedLookbackStrikeExpression
      namespace: fibo-der-derexo
      localName: FixedLookbackStrikeExpression
      label: fixed lookback strike expression
      definition: cashflow expression specifying the arguments required to calculate the fixed price at which the lookback
        option is to be exercised
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowExpression
      attributeUses: []
      patternBindings: []
    FloatingLookbackStrikeExpression:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/FloatingLookbackStrikeExpression
      namespace: fibo-der-derexo
      localName: FloatingLookbackStrikeExpression
      label: floating lookback strike expression
      definition: cashflow expression specifying the arguments required to calculate the best projected price at which the
        lookback option may be exercised
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowExpression
      attributeUses: []
      patternBindings: []
    ForwardStartOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/ForwardStartOption
      namespace: fibo-der-derexo
      localName: ForwardStartOption
      label: forward start option
      definition: exotic option that is fully specified with respect to a set expiry date, underlying asset and other parameters,
        purchased and paid for on initiation, but that becomes active at a set activation date with a strike price determined
        at the time of activation
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    InterestRateCapOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/InterestRateCapOption
      namespace: fibo-der-derexo
      localName: InterestRateCapOption
      label: interest rate cap option
      definition: interest rate derivative in which the buyer receives payments at the end of each period in which the interest
        rate exceeds the agreed strike price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/InterestRateOption
      attributeUses: []
      patternBindings: []
    InterestRateFloorOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/InterestRateFloorOption
      namespace: fibo-der-derexo
      localName: InterestRateFloorOption
      label: interest rate floor option
      definition: interest rate derivative in which the buyer receives payments at the end of each period in which the interest
        rate is below the agreed strike price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/InterestRateOption
      attributeUses: []
      patternBindings: []
    KnockInOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/KnockInOption
      namespace: fibo-der-derexo
      localName: KnockInOption
      label: knock-in option
      definition: barrier option that is not triggered until a certain price threshold is met
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/BarrierOption
      attributeUses: []
      patternBindings: []
    KnockOutOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/KnockOutOption
      namespace: fibo-der-derexo
      localName: KnockOutOption
      label: knock-out option
      definition: barrier option with a built-in mechanism to expire as worthless if a specified price level in the underlying
        asset is reached
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/BarrierOption
      attributeUses: []
      patternBindings: []
    LookbackOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/LookbackOption
      namespace: fibo-der-derexo
      localName: LookbackOption
      label: lookback option
      definition: exotic option that minimizes the uncertainties related to the timing of market entry, providing the holder
        the advantage of knowing history when determining when to exercise their option
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    LookbackStrikeTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/LookbackStrikeTerms
      namespace: fibo-der-derexo
      localName: LookbackStrikeTerms
      label: lookback strike terms
      definition: terms specifying the value of the underlying asset based on analysis during a specific period, typically
        ending in the maturity of the option, whereby the payoff is determined by comparing the strike price with the value
        of the selected price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      attributeUses: []
      patternBindings: []
    LowExercisePriceOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/LowExercisePriceOption
      namespace: fibo-der-derexo
      localName: LowExercisePriceOption
      label: low exercise price option
      definition: exotic option that is a European-style call option with an exercise price of one cent that mimics a futures
        contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CallOption
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    MountainRangeOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/MountainRangeOption
      namespace: fibo-der-derexo
      localName: MountainRangeOption
      label: mountain range option
      definition: exotic option based on multiple underlying securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    ObservedBestValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/ObservedBestValue
      namespace: fibo-der-derexo
      localName: ObservedBestValue
      label: observed best value
      definition: observed value of the underlying asset as of some date during the lookback period that is considered the
        best value from the perspective of the option holder during the lookback period (depending on whether the option is
        a call or put)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/MarketPrice
      attributeUses: []
      patternBindings: []
    ProjectedValueAtMaturity:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/ProjectedValueAtMaturity
      namespace: fibo-der-derexo
      localName: ProjectedValueAtMaturity
      label: projected value at maturity
      definition: expected value of the underlying asset at maturity calculated as of some date during the lookback period
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/CalculatedPrice
      attributeUses: []
      patternBindings: []
    RainbowOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/RainbowOption
      namespace: fibo-der-derexo
      localName: RainbowOption
      label: rainbow option
      definition: exotic option linked to the performances of two or more underlying assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    Swaption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/Swaption
      namespace: fibo-der-derexo
      localName: Swaption
      label: swaption
      definition: over-the-counter option that confers the right but not the obligation, to enter into a swap transaction
        at some time in the future
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasAsianTailPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasAsianTailPeriod
      namespace: fibo-der-derexo
      localName: hasAsianTailPeriod
      label: has Asian tail period
      definition: window of time during which averaging of the price of the underlying contract is effective
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/AsianOption
      range: https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      inverseOf: ''
      characteristics: []
    hasFirstBarrierPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasFirstBarrierPrice
      namespace: fibo-der-derexo
      localName: hasFirstBarrierPrice
      label: has first barrier price
      definition: has price (or level) that activates or deactivates the option
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      inverseOf: ''
      characteristics: []
    hasFirstRebateAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasFirstRebateAmount
      namespace: fibo-der-derexo
      localName: hasFirstRebateAmount
      label: has first rebate amount
      definition: indicates the percentage of the premium paid by the holder for the option
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/PercentageMonetaryAmount
      inverseOf: ''
      characteristics: []
    hasLookbackPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasLookbackPeriod
      namespace: fibo-der-derexo
      localName: hasLookbackPeriod
      label: has lookback period
      definition: window of time during which the lookback is effective
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/LookbackStrikeTerms
      range: https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      inverseOf: ''
      characteristics: []
    hasMonitoringPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasMonitoringPeriod
      namespace: fibo-der-derexo
      localName: hasMonitoringPeriod
      label: has monitoring period
      definition: window of time during which pricing is monitored
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/BarrierOption
      range: https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      inverseOf: ''
      characteristics: []
    hasOptionTypeElectionDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasOptionTypeElectionDate
      namespace: fibo-der-derexo
      localName: hasOptionTypeElectionDate
      label: has option type election date
      definition: indicates the date on which the holder of the chooser option contract determines a choice of either a call
        or a put
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/ChooserOption
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasSecondBarrierPrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasSecondBarrierPrice
      namespace: fibo-der-derexo
      localName: hasSecondBarrierPrice
      label: has second barrier price
      definition: has price (or level) that the second barrier activates or deactivates in the case of a double barrier option
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      inverseOf: ''
      characteristics: []
    hasSecondRebateAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasSecondRebateAmount
      namespace: fibo-der-derexo
      localName: hasSecondRebateAmount
      label: has second rebate amount
      definition: indicates the percentage of the premium paid by the holder in the case of a double barrier option
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/PercentageMonetaryAmount
      inverseOf: ''
      characteristics: []
    usesCurrencyInAveraging:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/usesCurrencyInAveraging
      namespace: fibo-der-derexo
      localName: usesCurrencyInAveraging
      label: uses currency in averaging
      definition: indicates the currency used in averaging calculation
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Currency
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasMonitoringFrequency:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/hasMonitoringFrequency
      namespace: fibo-der-derexo
      localName: hasMonitoringFrequency
      label: has monitoring frequency
      definition: has frequency with respect to how often, in days, the asset price is checked to see if the barrier has been
        breached
      valueType: integer
      defaultCardinality:
        minCount: 0
        maxCount: null
    isAboveStrikePrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/isAboveStrikePrice
      namespace: fibo-der-derexo
      localName: isAboveStrikePrice
      label: is above strike price
      definition: indicates whether the barrier is crossed when the price of the underlier is above (or below, if not) the
        strike price (threshold)
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
    usesWeightedAverage:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/ExoticOptions/usesWeightedAverage
      namespace: fibo-der-derexo
      localName: usesWeightedAverage
      label: uses weighted average
      definition: indicates whether a weighted average is being used to calculate the average rate or strike price
      valueType: boolean
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
