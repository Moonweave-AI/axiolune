  version: '20250301'
  label: Exotic Options Ontology
  definition: This ontology covers exotic options, a category of options contracts that differ from traditional options in
    their payment structures, expiration dates, and strike prices. The underlying asset or security can vary with exotic options
    allowing for more investment alternatives. Exotic options are hybrid securities that are often customizable to the needs
    of the investor, and most are traded over the counter (OTC).
