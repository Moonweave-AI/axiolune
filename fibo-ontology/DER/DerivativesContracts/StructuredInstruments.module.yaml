module:
  moduleIri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/
  baseIri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/
  preferredPrefix: fibo-der-derstr
  version: '20230401'
  label: Structured Instruments Ontology
  definition: This ontology defines concepts common to pre-packaged structured finance investment strategies based on a host
    of underlying instruments, pools, or other assets.
  imports:
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/AnnotationVocabulary/
    version: external
  - moduleIri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/
    version: external
  - moduleIri: https://www.omg.org/spec/Commons/AnnotationVocabulary/
    version: external
  exports: []
  status: reference
  governance:
    ownerRef: urn:axiolune:authority:fibo-edmcouncil
    status: reference
  sourceArtifact: StructuredInstruments.rdf
  sourceDigest: sha256:7d4335bea0a4fba9f203f06842515f37074c64049de0e71ac98733eb2ca86974
  sourcePath: DER/DerivativesContracts/StructuredInstruments.rdf
  fiboDomain: DER
domain:
  objectTypes:
    BarrierCapitalProtectionCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/BarrierCapitalProtectionCertificate
      namespace: fibo-der-derstr
      localName: BarrierCapitalProtectionCertificate
      label: barrier capital protection certificate
      definition: capital-protected product whose protection is defined as a percentage of the nominal price (e.g. 100 percent),
        with minimum redemption at expiry equivalent to the capital protection
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectedProduct
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    BarrierDiscountCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/BarrierDiscountCertificate
      namespace: fibo-der-derstr
      localName: BarrierDiscountCertificate
      label: barrier discount certificate
      definition: participation certificate that enables the investor to acquire the underlying asset at a lower price in
        return for a limited payout, and for which the maximum redemption amount (Cap) is paid out if the barrier is never
        breached
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceWithoutPrincipalProtection
      attributeUses: []
      patternBindings: []
    BarrierReverseConvertibleCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/BarrierReverseConvertibleCertificate
      namespace: fibo-der-derstr
      localName: BarrierReverseConvertibleCertificate
      label: barrier reverse convertible certificate
      definition: 'participation certificate whose payout is conditional: should the barrier never be breached, the nominal
        price plus coupon is paid at redemption; if the barrier is breached the product changes into a reverse convertible'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceWithoutPrincipalProtection
      attributeUses: []
      patternBindings: []
    BasketCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/BasketCertificate
      namespace: fibo-der-derstr
      localName: BasketCertificate
      label: basket certificate
      definition: certificate whose underlying asset represents a fraction of a basket of securities that corresponds to the
        subscription ratio
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    BonusCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/BonusCertificate
      namespace: fibo-der-derstr
      localName: BonusCertificate
      label: bonus certificate
      definition: certificate whose minimum redemption is equal to the nominal value provided the barrier has not been breached,
        with a greater risk in relation to multiple underlying asset(s) (worst-of), allowing for a higher bonus level or lower
        barrier, and with a reduced risk compared to a direct investment into the underlying asset(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    CapitalProtectedProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectedProduct
      namespace: fibo-der-derstr
      localName: CapitalProtectedProduct
      label: capital-protected product
      definition: structured product that participates in the performance of a financial asset, such as a stock, fund or index,
        while protecting the investor's capital
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/StructuredProduct
      attributeUses: []
      patternBindings: []
    CapitalProtectionCertificateWithCoupons:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectionCertificateWithCoupons
      namespace: fibo-der-derstr
      localName: CapitalProtectionCertificateWithCoupons
      label: capital protection certificate with coupons
      definition: capital-protected product whose protection is defined as a percentage of the nominal price (e.g. 100 percent),
        with minimum redemption at expiry equivalent to the capital protection
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectedProduct
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    CapitalProtectionCertificateWithParticipation:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectionCertificateWithParticipation
      namespace: fibo-der-derstr
      localName: CapitalProtectionCertificateWithParticipation
      label: capital protection certificate with participation
      definition: capital-protected product whose protection is defined as a percentage of the nominal amount (e.g. 100 percent),
        with minimum redemption at expiry equivalent to the capital protection
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectedProduct
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    CapitalProtectionConvertibleCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectionConvertibleCertificate
      namespace: fibo-der-derstr
      localName: CapitalProtectionConvertibleCertificate
      label: capital protection convertible certificate
      definition: capital-protected product whose protection is defined as a percentage of the nominal price (e.g. 100 percent),
        with minimum redemption at expiry equivalent to the capital protection
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectedProduct
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    DiscountCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/DiscountCertificate
      namespace: fibo-der-derstr
      localName: DiscountCertificate
      label: discount certificate
      definition: participation certificate that enables the investor to acquire the underlying asset at a lower price in
        return for a limited payout, and for which the underlying asset(s) and/or a cash amount is redeemed should the underlying
        asset close below the strike on expiry, for which, in return, the potential profit is capped
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceWithoutPrincipalProtection
      attributeUses: []
      patternBindings: []
    ExpressCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ExpressCertificate
      namespace: fibo-der-derstr
      localName: ExpressCertificate
      label: express certificate
      definition: 'participation certificate whose payout is conditional: should the underlying trade above the strike on
        the observation date, an early redemption consisting of nominal price plus an additional coupon amount is paid'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceWithoutPrincipalProtection
      attributeUses: []
      patternBindings: []
    IndexCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/IndexCertificate
      namespace: fibo-der-derstr
      localName: IndexCertificate
      label: index certificate
      definition: certificate whose underlying asset is an index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    LeveragedProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/LeveragedProduct
      namespace: fibo-der-derstr
      localName: LeveragedProduct
      label: leveraged product
      definition: structured product that provides a further enhanced yield (over and above that of a yield-enhancement product),
        often without any limit to the upside participation, and frequently with a stop-loss in order to limit potential capital
        losses
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/StructuredProduct
      attributeUses: []
      patternBindings: []
    OutperformanceBonusCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/OutperformanceBonusCertificate
      namespace: fibo-der-derstr
      localName: OutperformanceBonusCertificate
      label: outperformance bonus certificate
      definition: certificate that allows disproportionate participation (outperformance) in positive performance above the
        strike, in which the minimum redemption is equal to the nominal value provided the barrier has not been breached,
        with greater risk multiple underlying asset(s) (worst-of) allow for a higher bonus level or lower barrier, and reduced
        risk compared to a direct investment into the underlying asset(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/BonusCertificate
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/OutperformanceCertificate
      attributeUses: []
      patternBindings: []
    OutperformanceCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/OutperformanceCertificate
      namespace: fibo-der-derstr
      localName: OutperformanceCertificate
      label: outperformance certificate
      definition: certificate that allows disproportionate participation (outperformance) in positive performance above the
        strike, reflecting underlying price moves 1:1 (adjusted by the conversion ratio and any related fees), and whose risk
        is comparable to direct investment in the underlying asset(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    ParticipationCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      namespace: fibo-der-derstr
      localName: ParticipationCertificate
      label: participation certificate
      definition: participation product that provides the possibility to participate in the gains or losses in the price of
        an asset, subject to counterparty risk
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationInstrument
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      attributeUses: []
      patternBindings: []
    ParticipationInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationInstrument
      namespace: fibo-der-derstr
      localName: ParticipationInstrument
      label: participation instrument
      definition: structured product that provides the possibility to participate in the performance of an asset or basket
        of assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/StructuredProduct
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/SecurityBasedDerivative
      attributeUses: []
      patternBindings: []
    ReverseConvertibleCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ReverseConvertibleCertificate
      namespace: fibo-der-derstr
      localName: ReverseConvertibleCertificate
      label: reverse convertible certificate
      definition: 'participation certificate whose payout is conditional: should the underlying asset close below the strike
        on expiry, the underlying asset(s) and/ or a cash amount is redeemed; should the underlying asset close above the
        strike at expiry, the nominal amount plus the coupon is paid at redemption'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceWithoutPrincipalProtection
      attributeUses: []
      patternBindings: []
    StructuredProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/StructuredProduct
      namespace: fibo-der-derstr
      localName: StructuredProduct
      label: structured product
      definition: security whose cash flow characteristics depend upon one or more indices or that have embedded forwards
        or options or securities where an investor's investment return and the issuer's payment obligations are contingent
        on, or highly sensitive to, changes in the value of underlying assets, indices, interest rates or cash flows
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    TrackerCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/TrackerCertificate
      namespace: fibo-der-derstr
      localName: TrackerCertificate
      label: tracker certificate
      definition: certificate that reflects underlying price moves 1:1 (adjusted by conversion ratio and any related fees),
        in which the associated risk is comparable to direct investment in the underlying asset(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    TurboCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/TurboCertificate
      namespace: fibo-der-derstr
      localName: TurboCertificate
      label: turbo certificate
      definition: certificate that acts as a leveraged security, whose price tracks an underlying financial asset's price
        one for one, and that can be used to go long or short
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    TwinWinCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/TwinWinCertificate
      namespace: fibo-der-derstr
      localName: TwinWinCertificate
      label: twin-win certificate
      definition: certificate that makes profits possible with rising and falling underlying asset values, in which a falling
        underlying asset price converts into profit up to the barrier, and whose minimum redemption is equal to the nominal
        value provided the barrier has not been breached
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/ParticipationCertificate
      attributeUses: []
      patternBindings: []
    YieldEnhancementProduct:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/YieldEnhancementProduct
      namespace: fibo-der-derstr
      localName: YieldEnhancementProduct
      label: yield-enhancement product
      definition: structured product that provides a predefined yield in return for a downside risk
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/StructuredProduct
      attributeUses: []
      patternBindings: []
    PrincipalProtectedNote:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/PrincipalProtectedNote
      namespace: fibo-der-derstr
      localName: PrincipalProtectedNote
      label: PrincipalProtectedNote
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/CapitalProtectedProduct
      attributeUses: []
      patternBindings: []
    StructuredFinanceInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/PoolBackedSecurities/StructuredFinanceInstrument
      namespace: fibo-der-derstr
      localName: StructuredFinanceInstrument
      label: StructuredFinanceInstrument
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/StructuredInstruments/StructuredProduct
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
