      attributeUses: []
      patternBindings: []
    UniqueProductIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/UniqueProductIdentifier
      namespace: fibo-der-derder
      localName: UniqueProductIdentifier
      label: unique product identifier
      definition: sequence of characters uniquely identifying an OTC derivative product that is reportable to a trade repository
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrumentIdentifier
      - https://www.omg.org/spec/Commons/ContextualIdentifiers/StructuredIdentifier
      attributeUses: []
      patternBindings: []
    UniqueProductIdentifierRegistryEntry:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/UniqueProductIdentifierRegistryEntry
      namespace: fibo-der-derder
      localName: UniqueProductIdentifierRegistryEntry
