      patternBindings: []
    UniqueProductIdentifierServiceProvider:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/UniqueProductIdentifierServiceProvider
      namespace: fibo-der-derder
      localName: UniqueProductIdentifierServiceProvider
      label: unique product identifier service provider
      definition: organization designated by an external body of financial regulators to assign UPIs and operate a UPI reference
        data library
      superTypes:
      - https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistrationAuthority
      attributeUses: []
      patternBindings: []
    ValuationTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ValuationTerms
      namespace: fibo-der-derder
      localName: ValuationTerms
      label: valuation terms
      definition: contract terms specific to valuation of the underlying asset(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      attributeUses: []
      patternBindings: []
