  objectTypes:
    CashflowExpression:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowExpression
      namespace: fibo-der-derder
      localName: CashflowExpression
      label: cashflow expression
      definition: expression that specifies a calculation of a cash flow as a component of a cashflow formula
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    CashflowFormula:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowFormula
      namespace: fibo-der-derder
      localName: CashflowFormula
      label: cashflow formula
      definition: formula for determining cashflows for a derivative instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/Formula
      attributeUses: []
      patternBindings: []
    CashflowTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowTerms
      namespace: fibo-der-derder
      localName: CashflowTerms
      label: cashflow terms
      definition: terms setting out a cashflow structure of payments committed to by one party to a contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/DebtTerms
      attributeUses: []
      patternBindings: []
    ContractForDifference:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ContractForDifference
      namespace: fibo-der-derder
      localName: ContractForDifference
      label: contract for difference
      definition: cash-settled derivative where the parties agree to exchange on the maturity of the contract the difference
        between the current value of the underlying asset and the initial value of that asset when the contract is initiated
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    CreditDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CreditDerivative
      namespace: fibo-der-derder
      localName: CreditDerivative
      label: credit derivative
      definition: derivative instrument that is a privately held, negotiable bilateral contract traded over-the-counter (OTC)
        between two parties in a creditor/debtor relationship, enabling the creditor to effectively transfer some or all of
        the risk of a debtor defaulting to a third party
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    DerivativeSettlementTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeSettlementTerms
      namespace: fibo-der-derder
      localName: DerivativeSettlementTerms
      label: derivative settlement terms
      definition: settlement terms specifying additional details with respect to what is to be delivered when, to whom, under
        what conditions at the time of settlement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/SettlementTerms
      attributeUses: []
      patternBindings: []
    DerivativeTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      namespace: fibo-der-derder
      localName: DerivativeTerms
      label: derivative terms
      definition: contractual terms specific to derivative contracts, including terms related to payments and delivery between
        parties
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractualCommitment
      attributeUses: []
      patternBindings: []
    DerivativesClearingOrganization:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativesClearingOrganization
      namespace: fibo-der-derder
      localName: DerivativesClearingOrganization
      label: derivatives clearing organization
      definition: clearing house that enables parties to substitute the credit of the DCO for the credit of the parties
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/ClearingHouse
      attributeUses: []
      patternBindings: []
    EconomicRateBasedDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/EconomicRateBasedDerivative
      namespace: fibo-der-derder
      localName: EconomicRateBasedDerivative
      label: economic rate-based derivative
      definition: rate-based derivative whose underlier is some economic indicator
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/RateBasedDerivative
      attributeUses: []
      patternBindings: []
    ForwardRateAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ForwardRateAgreement
      namespace: fibo-der-derder
      localName: ForwardRateAgreement
      label: forward rate agreement
      definition: agreement to exchange an interest rate commitment on a notional amount at a future date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/InterestRateDerivative
      attributeUses: []
      patternBindings: []
    InterestRateDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/InterestRateDerivative
      namespace: fibo-der-derder
      localName: InterestRateDerivative
      label: interest rate derivative
      definition: rate-based derivative whose underlier is an interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/RateBasedDerivative
      attributeUses: []
      patternBindings: []
    IntroducingBroker:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/IntroducingBroker
      namespace: fibo-der-derder
      localName: IntroducingBroker
      label: introducing broker
      definition: broker that solicits or accepts orders for derivatives that are traded on or subject to the rules of an
        exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Broker
      attributeUses: []
      patternBindings: []
    ObservableValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ObservableValue
      namespace: fibo-der-derder
      localName: ObservableValue
      label: observable value
      definition: specification for the value for something discernible and for which evidence can be obtained
      superTypes:
      - https://www.omg.org/spec/Commons/Documents/Specification
      attributeUses: []
      patternBindings: []
    OverTheCounterDerivativeInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/OverTheCounterDerivativeInstrument
      namespace: fibo-der-derder
      localName: OverTheCounterDerivativeInstrument
      label: over-the-counter derivative instrument
      definition: derivative instrument that is not listed on an organized exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/OverTheCounterInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    OverTheCounterInstrument:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/OverTheCounterInstrument
      namespace: fibo-der-derder
      localName: OverTheCounterInstrument
      label: over-the-counter instrument
      definition: financial instrument and bilateral contract that is not listed on an organized exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
      attributeUses: []
      patternBindings: []
    ParametricCashflowTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ParametricCashflowTerms
      namespace: fibo-der-derder
      localName: ParametricCashflowTerms
      label: parametric cashflow terms
      definition: terms for a set of cashflows defined according to a mathematical formula
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowTerms
      attributeUses: []
      patternBindings: []
    PayingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/PayingParty
      namespace: fibo-der-derder
      localName: PayingParty
      label: paying party
      definition: party responsible for making payments in a transaction specified in a contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractParty
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payer
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Buyer
      attributeUses: []
      patternBindings: []
    RateBasedDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/RateBasedDerivative
      namespace: fibo-der-derder
      localName: RateBasedDerivative
      label: rate-based derivative
      definition: derivative instrument where the holder has the right but may not have the obligation, depending on the nature
        of the instrument, to enter into the underlying contract, or pay or receive payment related to the underlying financial
        rate (or rate contract) on a specified future date based on a specified future rate and term
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    ReceivingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ReceivingParty
      namespace: fibo-der-derder
      localName: ReceivingParty
      label: receiving counterparty
      definition: party that receives payments in a transaction specified in a contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractParty
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/PaymentsAndSchedules/Payee
