    BasketOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/BasketOption
      namespace: fibo-der-deropt
      localName: BasketOption
      label: basket option
      definition: option whose underlying asset is a group, or basket, of commodities, securities, indices, or currencies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      attributeUses: []
      patternBindings: []
    BondOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/BondOption
      namespace: fibo-der-deropt
      localName: BondOption
      label: bond option
      definition: option giving the buyer (holder) the right, but not the obligation, to buy or sell (depending on whether
        it is a call or a put) a bond at a certain price on or before a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/FixedIncomeOption
      attributeUses: []
      patternBindings: []
    Butterfly:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Butterfly
      namespace: fibo-der-deropt
      localName: Butterfly
      label: butterfly
      definition: strategy that combines bull and bear spreads with a fixed risk and capped profit
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    CallOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CallOption
      namespace: fibo-der-deropt
      localName: CallOption
      label: call option
      definition: option giving the buyer (holder) the right, but not the obligation, to buy the assets specified at a fixed
        price or formula, on or before a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Option
      attributeUses: []
      patternBindings: []
    CappedOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CappedOption
      namespace: fibo-der-deropt
      localName: CappedOption
      label: capped option
      definition: option with an established profit cap or cap price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      attributeUses: []
      patternBindings: []
    Collar:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Collar
      namespace: fibo-der-deropt
      localName: Collar
      label: collar
      definition: option trading strategy that involves buying a downside put and selling an upside call that is implemented
        to protect against large losses, but which also limits large upside gains
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    CondorSpread:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CondorSpread
      namespace: fibo-der-deropt
      localName: CondorSpread
      label: condor spread
      definition: non-directional options strategy that limits both gains and losses while seeking to profit from either low
        or high volatility
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    CoveredCall:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CoveredCall
      namespace: fibo-der-deropt
      localName: CoveredCall
      label: covered call
      definition: call option in which the seller (investor) owns an equivalent amount of the underlying security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CallOption
      attributeUses: []
      patternBindings: []
    EquityOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/EquityOption
      namespace: fibo-der-deropt
      localName: EquityOption
      label: equity option
      definition: option giving the buyer (holder) the right, but not the obligation, to buy (via a call option) or sell (via
        a put option) the underlying equity assets specified at a pre-determined price (i.e., the strike price, fixed or calculated),
        on or before a specified date (the expiration date)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/EquityDerivative
      attributeUses: []
      patternBindings: []
    ExoticOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExoticOption
      namespace: fibo-der-deropt
      localName: ExoticOption
      label: exotic option
      definition: option that has a non-standard payout structure or other feature
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/OverTheCounterDerivativeInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Option
      attributeUses: []
      patternBindings: []
    ExtrinsicValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ExtrinsicValue
      namespace: fibo-der-deropt
      localName: ExtrinsicValue
      label: extrinsic value
      definition: measure of the difference between the market price of an option, called the premium, and its intrinsic value
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      attributeUses: []
      patternBindings: []
    Fence:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Fence
      namespace: fibo-der-deropt
      localName: Fence
      label: fence
      definition: option trading strategy that uses options to limit the range of possible returns on a financial instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    FixedIncomeOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/FixedIncomeOption
      namespace: fibo-der-deropt
      localName: FixedIncomeOption
      label: fixed income option
      definition: option giving the buyer (holder) the right, but not the obligation, to buy (via a call option) or sell (via
        a put option) the underlying fixed income assets specified at a pre-determined price (i.e., the strike price, fixed
        or calculated), on or before a specified date (the expiration date)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/DebtInstrumentDerivative
      attributeUses: []
      patternBindings: []
    InterestRateOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/InterestRateOption
      namespace: fibo-der-deropt
      localName: InterestRateOption
      label: interest rate option
      definition: option that giving the buyer (holder) the right, but not the obligation, to receive a cash payment if market
        interest rate of a reference rate is higher or lower, depending on the option, than the strike rate of the option
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/InterestRateDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      attributeUses: []
      patternBindings: []
    IntrinsicValue:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/IntrinsicValue
      namespace: fibo-der-deropt
      localName: IntrinsicValue
      label: intrinsic value
      definition: measure of what an asset is worth, i.e. with respect to its current price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryAmount
      attributeUses: []
      patternBindings: []
    IronButterfly:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/IronButterfly
      namespace: fibo-der-deropt
      localName: IronButterfly
      label: iron butterfly
      definition: butterfly strategy that consists of two call options and two put options, three strike prices and the same
        expiration date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Butterfly
      attributeUses: []
      patternBindings: []
    IronCondor:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/IronCondor
      namespace: fibo-der-deropt
      localName: IronCondor
      label: iron condor
      definition: condor strategy consisting of two puts (one long and one short) and two calls (one long and one short),
        and four strike prices, all with the same expiration date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/CondorSpread
      attributeUses: []
      patternBindings: []
    LongTermEquityAnticipationSecurity:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/LongTermEquityAnticipationSecurity
      namespace: fibo-der-deropt
      localName: LongTermEquityAnticipationSecurity
      label: long-term equity anticipation security
      definition: equity option that allows the holder to buy or sell shares of stock with expiration dates that are longer
        than one year, and typically up to three years from issue
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/EquityOption
      attributeUses: []
      patternBindings: []
    Moneyness:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Moneyness
      namespace: fibo-der-deropt
      localName: Moneyness
      label: moneyness
      definition: classifier for a derivative relating its strike price to the price of its underlying asset
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    OptionHolder:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionHolder
      namespace: fibo-der-deropt
      localName: OptionHolder
      label: option holder
      definition: party that owns an option
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/OwnershipAndControl/Ownership/Owner
      attributeUses: []
      patternBindings: []
    OptionIssuer:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionIssuer
      namespace: fibo-der-deropt
      localName: OptionIssuer
      label: option issuer
      definition: issuer granting the rights defined in the option in exchange for some consideration
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Issuer
      attributeUses: []
      patternBindings: []
    OptionOnFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionOnFuture
      namespace: fibo-der-deropt
      localName: OptionOnFuture
      label: option on future
      definition: option that gives the holder the right, but not the obligation, to buy or sell a specific futures contract
        at a specified price on or before the option's expiration date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      attributeUses: []
      patternBindings: []
    OptionPremium:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionPremium
      namespace: fibo-der-deropt
      localName: OptionPremium
      label: option premium
      definition: current market price of an option contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/MarketPrice
      attributeUses: []
      patternBindings: []
    OptionPremiumFormula:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionPremiumFormula
      namespace: fibo-der-deropt
      localName: OptionPremiumFormula
      label: option premium formula
      definition: expression used to calculate the premium based either on the price per option or percentage of the notional
        amount
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/Expression
      attributeUses: []
      patternBindings: []
    OptionTradingStrategy:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      namespace: fibo-der-deropt
      localName: OptionTradingStrategy
      label: option trading strategy
      definition: trading tactic involving more than one option type, strike price, or expiration date on the same underlying
        asset
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/TradingStrategy
      attributeUses: []
      patternBindings: []
    ProtectiveCollar:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ProtectiveCollar
      namespace: fibo-der-deropt
      localName: ProtectiveCollar
      label: protective collar
      definition: collar that consists of a covered call and protective put
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Collar
      attributeUses: []
      patternBindings: []
    ProtectivePut:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/ProtectivePut
      namespace: fibo-der-deropt
      localName: ProtectivePut
      label: protective put
      definition: put option giving the buyer (holder) the right, but not the obligation, to sell the assets specified at
        with a strike price equal or close to the current price of the underlying asset, on or before a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/PutOption
      attributeUses: []
      patternBindings: []
    PutOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/PutOption
      namespace: fibo-der-deropt
      localName: PutOption
      label: put option
      definition: option giving the buyer (holder) the right, but not the obligation, to sell the assets specified at a fixed
        price or formula, on or before a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Option
      attributeUses: []
      patternBindings: []
    RiskReversal:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/RiskReversal
      namespace: fibo-der-deropt
      localName: RiskReversal
      label: risk reversal
      definition: option trading strategy that consists of being short (selling) an out of the money put and being long (i.e.,
        buying) an out of the money call, both with the same maturity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    StandardizedOptionsTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/StandardizedOptionsTerms
      namespace: fibo-der-deropt
      localName: StandardizedOptionsTerms
      label: standardized options terms
      definition: standardized contract terms established by a securities or options exchange or by an options clearing entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/StandardizedTerms
      attributeUses: []
      patternBindings: []
    Straddle:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Straddle
      namespace: fibo-der-deropt
      localName: Straddle
      label: straddle
      definition: neutral option trading strategy that involves simultaneously buying both a put option and a call option
        for the underlying security with the same strike price and the same expiration date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    Strangle:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/Strangle
      namespace: fibo-der-deropt
      localName: Strangle
      label: strangle
      definition: option trading strategy in which the investor holds a position in both a call and a put option with different
        strike prices, but with the same expiration date and underlying asset
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    StrikePrice:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/StrikePrice
      namespace: fibo-der-deropt
      localName: StrikePrice
      label: strike price
      definition: price at which a lot of the underlying asset may be bought or sold when the contract is exercised
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/MonetaryPrice
      attributeUses: []
      patternBindings: []
    StripStrategy:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/StripStrategy
      namespace: fibo-der-deropt
      localName: StripStrategy
      label: strip strategy
      definition: option trading strategy that involves a sequential set of options with periodic reset dates, such that each
        period between resets behaves like an individual option
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/OptionTradingStrategy
      attributeUses: []
      patternBindings: []
    VanillaOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      namespace: fibo-der-deropt
      localName: VanillaOption
      label: vanilla option
      definition: common option giving the buyer (holder) the right, but not the obligation, to buy (via a call option) or
        sell (via a put option) the underlying assets specified at a pre-determined price (i.e., the strike price, fixed or
        calculated), on or before a specified date (the expiration date)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Option
      attributeUses: []
      patternBindings: []
    Option:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Option
      namespace: fibo-der-deropt
      localName: Option
      label: Option
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
