  label: Commodities Contracts Ontology
  definition: This ontology specifies core concepts for commodities-based derivatives and spot contracts, including the definitions
    of the most common categories of underlying negotiable commodities, corresponding to those outlined in the ISO 10962 CFI
    standard. Note that the ontology does not include any specific units of measure for these commodities. The intent is that
    FIBO users would select one of the many available units ontologies to use in specifying the details of individual contracts.
