    PreciousMetal:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/PreciousMetal
      namespace: fibo-der-dercom
      localName: PreciousMetal
      label: PreciousMetal
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/Metal
