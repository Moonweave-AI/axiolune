      definition: negotiable commodity that is a paper product, including containerboard, newsprint, pulp, recovered paper
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
