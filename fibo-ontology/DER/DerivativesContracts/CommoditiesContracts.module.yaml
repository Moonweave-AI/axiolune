      namespace: fibo-der-dercom
      localName: PolypropyleneResource
      label: polypropylene resource
      definition: negotiable commodity including plastics
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    ServiceResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/ServiceResource
      namespace: fibo-der-dercom
      localName: ServiceResource
      label: service resource
      definition: negotiable commodity involving services such as transportation, communications, and trade
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    WeatherDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/WeatherDerivative
      namespace: fibo-der-dercom
      localName: WeatherDerivative
      label: weather derivative
      definition: derivative instrument whose primary underlying notional item is based on something related to the weather,
        for example, the average temperature in Chicago in January
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivative
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
