      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/AgriculturalResource
      attributeUses: []
      patternBindings: []
    Metal:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/Metal
      namespace: fibo-der-dercom
      localName: Metal
      label: metal
      definition: material that, when freshly prepared, polished, or fractured, shows a lustrous appearance, and conducts
        electricity and heat relatively well
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/ExtractionResource
      attributeUses: []
      patternBindings: []
    OilCommodity:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/OilCommodity
      namespace: fibo-der-dercom
      localName: OilCommodity
      label: oil commodity
      definition: generated resource that is a viscous liquid derived from petroleum, including for use as fuel, or as a lubricant,
