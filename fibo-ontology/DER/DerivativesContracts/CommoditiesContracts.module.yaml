domain:
  objectTypes:
    AgriculturalResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/AgriculturalResource
      namespace: fibo-der-dercom
      localName: AgriculturalResource
      label: agricultural resource
      definition: negotiable commodity that is obtained via some agricultural process, including forestry, fishing, livestock,
        grain, dairy, corn, cocoa, soybeans, sugar, coffee
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    BaseMetal:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/BaseMetal
      namespace: fibo-der-dercom
      localName: BaseMetal
      label: base metal
      definition: common metal that tarnishes, oxidizes, or corrodes relatively quickly when exposed to air or moisture, that
        is widely used in commercial and industrial applications, such as construction and manufacturing
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/Metal
      attributeUses: []
      patternBindings: []
    BasketOfCommodities:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/BasketOfCommodities
      namespace: fibo-der-dercom
      localName: BasketOfCommodities
      label: basket of commodities
      definition: custom basket whose constituents consist of one or more negotiable commodities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/WeightedBasket
      attributeUses: []
      patternBindings: []
    Bullion:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/Bullion
      namespace: fibo-der-dercom
      localName: Bullion
      label: bullion
      definition: physical precious metal that is officially recognized as being at least 99.5 percent pure
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/PreciousMetal
      attributeUses: []
      patternBindings: []
    CommodityBasketConstituent:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityBasketConstituent
      namespace: fibo-der-dercom
      localName: CommodityBasketConstituent
      label: commodity basket constituent
      definition: component of a custom commodity basket whose relative importance with respect to other basket constituents
        is known
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/WeightedBasketConstituent
      attributeUses: []
      patternBindings: []
    CommodityDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivative
      namespace: fibo-der-dercom
      localName: CommodityDerivative
      label: commodity derivative
      definition: derivative instrument whose primary underlying item is a physical commodity, or the price, or related index,
        or any other aspect related to a physical commodity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CommodityInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    CommodityDerivativeUnderlier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivativeUnderlier
      namespace: fibo-der-dercom
      localName: CommodityDerivativeUnderlier
      label: commodity derivative underlier
      definition: underlier of a commodity derivative, including, but not limited to, the negotiable commodity itself
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Underlier
      attributeUses: []
      patternBindings: []
    CommodityForward:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityForward
      namespace: fibo-der-dercom
      localName: CommodityForward
      label: commodity forward
      definition: forward contract in which a buyer and seller agree upon delivery of a specified quality and quantity of
        goods at a specified future date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/Forward
      attributeUses: []
      patternBindings: []
    CommodityFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityFuture
      namespace: fibo-der-dercom
      localName: CommodityFuture
      label: commodity future
      definition: futures contract to buy or sell a predetermined amount of a commodity at a specific price on a specific
        date in the future
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivative
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Future
      attributeUses: []
      patternBindings: []
    CommodityIndex:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityIndex
      namespace: fibo-der-dercom
      localName: CommodityIndex
      label: commodity index
      definition: investment vehicle that tracks a basket of commodities to measure their price and investment return performance
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/IND/MarketIndices/BasketIndices/ReferenceIndex
      attributeUses: []
      patternBindings: []
    CommodityOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityOption
      namespace: fibo-der-dercom
      localName: CommodityOption
      label: commodity option
      definition: option where the option buyer has the right to buy or sell specified commodities or commodity related index
        at a fixed price or formula, on or before a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      attributeUses: []
      patternBindings: []
    CommodityReturnLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityReturnLeg
      namespace: fibo-der-dercom
      localName: CommodityReturnLeg
      label: commodity return leg
      definition: leg of a commodity return swap in which the return is based on a physical commodity, or the price, or behavior
        of the price, or any other aspect related to a physical commodity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnLeg
      attributeUses: []
      patternBindings: []
    CommoditySpotContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommoditySpotContract
      namespace: fibo-der-dercom
      localName: CommoditySpotContract
      label: commodity spot contract
      definition: contract that involves physical delivery of the commodity asset at settlement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CommodityInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/SpotContract
      attributeUses: []
      patternBindings: []
    CommoditySwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommoditySwap
      namespace: fibo-der-dercom
      localName: CommoditySwap
      label: commodity swap
      definition: commodity derivative that includes, without limitation, any swap for which the primary underlying notional
        item is a physical commodity, or the price, or behavior of the price, or the level of a commodity index, or other
        aspect related to a physical commodity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/CommodityDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      attributeUses: []
      patternBindings: []
    EnergyResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/EnergyResource
      namespace: fibo-der-dercom
      localName: EnergyResource
      label: energy resource
      definition: negotiable commodity that is an energy-related product, or a derivative of an energy-related product, including
        electricity, renewable energy, or any power/energy delivered through a utility network of provider; diesel fuel, fuel
        oil, gas oil, gasoline, heating oil, jet fuel, kerosene, natural gas, oil (Brent, Tapis, Dubai, WTI)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    EnergyTransmissionRights:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/EnergyTransmissionRights
      namespace: fibo-der-dercom
      localName: EnergyTransmissionRights
      label: energy transmission rights
      definition: rights to the transmission of power across an electricity distribution network
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/EnergyResource
      attributeUses: []
      patternBindings: []
    EnvironmentalResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/EnvironmentalResource
      namespace: fibo-der-dercom
      localName: EnvironmentalResource
      label: environmental resource
      definition: negotiable commodity including offset credits
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    ExtractionResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/ExtractionResource
      namespace: fibo-der-dercom
      localName: ExtractionResource
      label: extraction resource
      definition: negotiable commodity that is a mineral resource obtained via withdrawal from the natural environment
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    FertilizerResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/FertilizerResource
      namespace: fibo-der-dercom
      localName: FertilizerResource
      label: fertilizer resource
      definition: negotiable commodity that includes ammonia, diammonium phosphate (DAP), potash, sulphur, urea, urea and
        ammonium nitrate (UAN)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    FreightResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/FreightResource
      namespace: fibo-der-dercom
      localName: FreightResource
      label: freight resource
      definition: negotiable commodity that is a freight index route
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    GasCommodity:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/GasCommodity
      namespace: fibo-der-dercom
      localName: GasCommodity
      label: gas commodity
      definition: extraction resource that is natural gas
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/EnergyResource
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/ExtractionResource
      attributeUses: []
      patternBindings: []
    GeneratedResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/GeneratedResource
      namespace: fibo-der-dercom
      localName: GeneratedResource
      label: generated resource
      definition: negotiable commodity obtained via some generation process, including electricity, renewable energy, or any
        power/energy delivered through a utility network or provider
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    GrainCommodity:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/GrainCommodity
      namespace: fibo-der-dercom
      localName: GrainCommodity
      label: grain commodity
      definition: agricultural resource that is a small, hard seed, of a food plant, especially of a cereal plant, such as
        wheat, corn, rye, oats, rice, and millet
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/AgriculturalResource
      attributeUses: []
      patternBindings: []
    IndustrialResource:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/IndustrialResource
      namespace: fibo-der-dercom
      localName: IndustrialResource
      label: industrial resource
      definition: negotiable commodity that is obtained via some industrial process, including construction and manufacturing
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/NegotiableCommodity
      attributeUses: []
      patternBindings: []
    MeatCommodity:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CommoditiesContracts/MeatCommodity
      namespace: fibo-der-dercom
      localName: MeatCommodity
      label: meat commodity
