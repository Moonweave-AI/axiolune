    PutWarrant:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/PutWarrant
      namespace: fibo-der-derrig
      localName: PutWarrant
      label: put warrant
      definition: warrant giving the buyer (holder) the right, but not the obligation, to sell the assets specified (i.e.,
        acquire cash in exchange for the underlying assets, such as stock) back to the issuer at a fixed price or formula,
        on or before a specified date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/Warrant
      attributeUses: []
      patternBindings: []
    ShortMiniFutureCertificate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/ShortMiniFutureCertificate
      namespace: fibo-der-derrig
      localName: ShortMiniFutureCertificate
      label: short mini-future certificate
      definition: mini-future certificate that entitles the holder to acquire cash in exchange for specific underlying assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/MiniFutureCertificate
      attributeUses: []
      patternBindings: []
    StructuredWarrant:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/StructuredWarrant
      namespace: fibo-der-derrig
      localName: StructuredWarrant
      label: structured warrant
      definition: warrant that is listed on an exchange, offering investors a way to participate in the price performance
        of an underlying asset without buying it directly
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/Warrant
      attributeUses: []
      patternBindings: []
    SubscriptionRight:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/SubscriptionRight
      namespace: fibo-der-derrig
      localName: SubscriptionRight
      label: subscription right
      definition: privileges allotted to existing security holders, entitling them to subscribe to new securities at a price
        normally lower than the prevailing market price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Entitlement
      attributeUses: []
      patternBindings: []
    TraditionalWarrant:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/TraditionalWarrant
      namespace: fibo-der-derrig
      localName: TraditionalWarrant
      label: traditional warrant
      definition: warrant that gives the holder the right, but not the obligation, to buy (call warrant) or to sell (put warrant)
        an underlying asset at a specified price (the strike or exercise price) by a predetermined date, issued by the issuer
        of the underlying instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/Warrant
      attributeUses: []
      patternBindings: []
    Warrant:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/Warrant
      namespace: fibo-der-derrig
      localName: Warrant
      label: warrant
      definition: entitlement that permits the holder to purchase a specified amount of a financial instrument, commodity,
        currency or other asset during a specified period at a specified price
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Entitlement
      attributeUses: []
      patternBindings: []
    Entitlement:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Entitlement
      namespace: fibo-der-derrig
      localName: Entitlement
      label: Entitlement
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
    BondWithWarrant:
      iri: https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/Bonds/BondWithWarrant
      namespace: fibo-der-derrig
      localName: BondWithWarrant
      label: BondWithWarrant
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes:
    hasConversionRatio:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/hasConversionRatio
      namespace: fibo-der-derrig
      localName: hasConversionRatio
      label: has conversion ratio
      definition: indicates the factor used to determine the number of warrants needed in order to buy or sell a specific
        number of securities or investment units
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasOversubscribeOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/RightsAndWarrants/hasOversubscribeOption
      namespace: fibo-der-derrig
      localName: hasOversubscribeOption
      label: has oversubscribe option
      definition: indicates whether the holders of the rights instrument may get securities in the event that other right
        holders choose not to subscribe
      valueType: boolean
