domain:
  objectTypes:
    CurrencyDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyDerivative
      namespace: fibo-der-dercur
      localName: CurrencyDerivative
      label: currency derivative
      definition: agreement to deliver and settle a given amount of money in one currency, in exchange for a given amount
        in another currency at an agreed rate of exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CurrencyInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    CurrencyForward:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyForward
      namespace: fibo-der-dercur
      localName: CurrencyForward
      label: currency forward
      definition: agreement to deliver and settle a given amount of money in one currency, in exchange for a given amount
        in another currency, at an agreed date in the future and at an agreed rate of exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/Forward
      attributeUses: []
      patternBindings: []
    CurrencyForwardOutright:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyForwardOutright
      namespace: fibo-der-dercur
      localName: CurrencyForwardOutright
      label: currency forward outright
      definition: forward contract in a foreign exchange market that locks in the price at which an entity must buy or sell
        a currency on a future date
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyForward
      attributeUses: []
      patternBindings: []
    CurrencyOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyOption
      namespace: fibo-der-dercur
      localName: CurrencyOption
      label: currency option
      definition: option giving the buyer (holder) the right, but not the obligation, to buy or sell currency at a specified
        exchange rate during a specified period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Options/VanillaOption
      attributeUses: []
      patternBindings: []
    CurrencySpotContract:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencySpotContract
      namespace: fibo-der-dercur
      localName: CurrencySpotContract
      label: currency spot contract
      definition: foreign-exchange contract for immediate delivery
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/CurrencyInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/SpotContract
      attributeUses: []
      patternBindings: []
    CurrencySpotForwardSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencySpotForwardSwap
      namespace: fibo-der-dercur
      localName: CurrencySpotForwardSwap
      label: currency spot forward swap
      definition: 'foreign exchange agreement between two parties involving an exchange of two currencies at agreed fixed
        rates: a) on the spot settlement date and b) a reverse exchange on a later specified date'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencySwap
      attributeUses: []
      patternBindings: []
    CurrencySwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencySwap
      namespace: fibo-der-dercur
      localName: CurrencySwap
      label: currency swap
      definition: foreign exchange agreement between two parties to exchange a given amount of one currency for another currency
        for spot delivery or for forward delivery at an agreed rate after a specified period of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      attributeUses: []
      patternBindings: []
    CurrencyVolatilityOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyVolatilityOption
      namespace: fibo-der-dercur
      localName: CurrencyVolatilityOption
      label: currency volatility option
      definition: currency option whose underlying asset is based on the volatility of a foreign exchange rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyOption
      attributeUses: []
      patternBindings: []
    ForeignExchangeMasterAgreement:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/ForeignExchangeMasterAgreement
      namespace: fibo-der-dercur
      localName: ForeignExchangeMasterAgreement
      label: foreign exchange master agreement
      definition: product-specific master agreement intended to reflect best market practice and to provide a standard agreement
        for participants in the foreign exchange markets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/MasterAgreement
      attributeUses: []
      patternBindings: []
    ForeignExchangeSettlementNettingProvision:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/ForeignExchangeSettlementNettingProvision
      namespace: fibo-der-dercur
      localName: ForeignExchangeSettlementNettingProvision
      label: foreign exchange settlement netting provision
      definition: settlement netting provision that is specific to foreign exchange contracts
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/SettlementNettingProvision
      attributeUses: []
      patternBindings: []
    CurrencyFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/CurrencyFuture
      namespace: fibo-der-dercur
      localName: CurrencyFuture
      label: CurrencyFuture
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyDerivative
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasForwardExchangeRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/hasForwardExchangeRate
      namespace: fibo-der-dercur
      localName: hasForwardExchangeRate
      label: has forward exchange rate
      definition: rate of exchange between two currencies as specified in a forward contract
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/CurrencyForward
      range: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/ExchangeRate
      inverseOf: ''
      characteristics: []
    hasSpotExchangeRate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/CurrencyContracts/hasSpotExchangeRate
      namespace: fibo-der-dercur
      localName: hasSpotExchangeRate
      label: has spot exchange rate
      definition: rate of exchange between two currencies as specified as of some date and time as quoted by a specific source,
        typically for a spot contract
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/IND/ForeignExchange/ForeignExchange/QuotedExchangeRate
      inverseOf: ''
      characteristics: []
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
