  preferredPrefix: fibo-der-derfut
  version: '20250701'
  label: Futures and Forwards Ontology
  definition: This ontology defines concepts for derivative contracts, including forwards and futures, representing a commitment
    to sell or purchase the underlier at a defined price at a given time in the future.
