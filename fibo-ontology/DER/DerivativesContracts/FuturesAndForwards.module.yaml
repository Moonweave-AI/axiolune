domain:
  objectTypes:
    BasketFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/BasketFuture
      namespace: fibo-der-derfut
      localName: BasketFuture
      label: basket future
      definition: futures contract whose underlying asset is a basket of securities and/or indices
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    BondFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/BondFuture
      namespace: fibo-der-derfut
      localName: BondFuture
      label: bond future
      definition: futures contract whose underlying asset is at least one bond
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/DebtInstrumentFuture
      attributeUses: []
      patternBindings: []
    CurrencyFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/CurrencyFuture
      namespace: fibo-der-derfut
      localName: CurrencyFuture
      label: currency future
      definition: futures contract whose underlying asset is an agreement to exchange a specified amount of one currency for
        another at some point in the future based on pricing stated in the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    DebtInstrumentFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/DebtInstrumentFuture
      namespace: fibo-der-derfut
      localName: DebtInstrumentFuture
      label: debt instrument future
      definition: futures contract whose underlying asset is at least one debt instrument
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/DebtInstrumentDerivative
      attributeUses: []
      patternBindings: []
    DividendAdjustmentPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/DividendAdjustmentPeriod
      namespace: fibo-der-derfut
      localName: DividendAdjustmentPeriod
      label: dividend adjustment period
      definition: date period used to calculate the difference, if any between an anticipated dividend and the actual dividend
        distributed in that period
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/DatePeriod
      attributeUses: []
      patternBindings: []
    DividendFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/DividendFuture
      namespace: fibo-der-derfut
      localName: DividendFuture
      label: dividend future
      definition: futures contract whose underlying asset is at least one stock dividend
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/EquityDerivative
      attributeUses: []
      patternBindings: []
    EquityForward:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/EquityForward
      namespace: fibo-der-derfut
      localName: EquityForward
      label: equity forward
      definition: forward contract to buy or sell the underlying equity stock, equity index, basket of equity stock, equity
        futures contract, or equity option at a specified future date at the price specified at the outset of the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/Forward
      attributeUses: []
      patternBindings: []
    EquityFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/EquityFuture
      namespace: fibo-der-derfut
      localName: EquityFuture
      label: equity future
      definition: futures contract whose underlying asset is at least one equity security, specifically a publicly issued
        and traded share
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/EquityDerivative
      attributeUses: []
      patternBindings: []
    FinancialFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      namespace: fibo-der-derfut
      localName: FinancialFuture
      label: financial future
      definition: futures contract based on underlying assets excluding commodities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Future
      attributeUses: []
      patternBindings: []
    Forward:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/Forward
      namespace: fibo-der-derfut
      localName: Forward
      label: forward
      definition: derivative instrument that is privately negotiated between parties to buy the underlier at a specified future
        date at the price specified in the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/OverTheCounterDerivativeInstrument
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    ForwardContractAdjustmentMethod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/ForwardContractAdjustmentMethod
      namespace: fibo-der-derfut
      localName: ForwardContractAdjustmentMethod
      label: forward contract adjustment method
      definition: method by which adjustments will be made to the contract should one or more of a number of extraordinary
        events occur
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/GoalsAndObjectives/Objectives/Strategy
      attributeUses: []
      patternBindings: []
    FutureOnFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FutureOnFuture
      namespace: fibo-der-derfut
      localName: FutureOnFuture
      label: future on future
      definition: futures contract whose underlying asset is at least one (other) futures contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    FutureOnOption:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FutureOnOption
      namespace: fibo-der-derfut
      localName: FutureOnOption
      label: future on option
      definition: futures contract whose underlying asset is at least one option contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    FutureOnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FutureOnSwap
      namespace: fibo-der-derfut
      localName: FutureOnSwap
      label: future on swap
      definition: futures contract whose underlying asset is at least one swap contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    IndexFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/IndexFuture
      namespace: fibo-der-derfut
      localName: IndexFuture
      label: index future
      definition: futures contract whose underlying asset is at least one reference index or economic indicator
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    InterestRateFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/InterestRateFuture
      namespace: fibo-der-derfut
      localName: InterestRateFuture
      label: interest rate future
      definition: futures contract with an interest-bearing instrument as the underlying asset
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/FinancialFuture
      attributeUses: []
      patternBindings: []
    MoneyMarketFuture:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/MoneyMarketFuture
      namespace: fibo-der-derfut
      localName: MoneyMarketFuture
      label: money market future
      definition: futures contract with a money market instrument as the underlying asset
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/DebtInstrumentFuture
      attributeUses: []
      patternBindings: []
    StandardizedFuturesListingTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/StandardizedFuturesListingTerms
      namespace: fibo-der-derfut
      localName: StandardizedFuturesListingTerms
      label: standardized futures listing terms
      definition: contract terms established by a derivatives exchange that apply to any listing of a futures contract on
        that exchange.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/StandardizedTerms
      attributeUses: []
      patternBindings: []
    StandardizedFuturesTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/StandardizedFuturesTerms
      namespace: fibo-der-derfut
      localName: StandardizedFuturesTerms
      label: standardized futures terms
      definition: contract terms established by a derivatives exchange that apply to any futures contract traded on that exchange
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/StandardizedTerms
      attributeUses: []
      patternBindings: []
    Future:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Future
      namespace: fibo-der-derfut
      localName: Future
      label: Future
      definition: ''
      superTypes: []
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasDividendAdjustmentPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/hasDividendAdjustmentPeriod
      namespace: fibo-der-derfut
      localName: hasDividendAdjustmentPeriod
      label: has dividend adjustment period
      definition: indicates at least one date period used to calculate the deviation between an anticipated/expected dividend
        and the actual dividend issued during that period
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/EquityForward
      range: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/DividendAdjustmentPeriod
      inverseOf: ''
      characteristics: []
    hasMethodOfAdjustment:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/hasMethodOfAdjustment
      namespace: fibo-der-derfut
      localName: hasMethodOfAdjustment
      label: has method of adjustment
      definition: indicates the method used to address any changes to the contract based on events that occur over the contract
        lifecycle
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/EquityForward
      range: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/ForwardContractAdjustmentMethod
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasConversionFactor:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/hasConversionFactor
      namespace: fibo-der-derfut
      localName: hasConversionFactor
      label: has conversion factor
      definition: indicates the price of the delivered bond/note ($1 par value) to yield a fixed rate. The conversion factor
        is used to calculate a final delivery price.
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasMultiple:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/FuturesAndForwards/hasMultiple
      namespace: fibo-der-derfut
      localName: hasMultiple
      label: has multiple
      definition: indicates the multiple for determining the price of the futures contract in relation to the underlying index
        rate
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
