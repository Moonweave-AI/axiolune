domain:
  objectTypes:
    BasisSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/BasisSwap
      namespace: fibo-der-derswa
      localName: BasisSwap
      label: basis swap
      definition: swap in which payment streams are referenced to different bases
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RatesSwap
      attributeUses: []
      patternBindings: []
    CorrelationLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/CorrelationLeg
      namespace: fibo-der-derswa
      localName: CorrelationLeg
      label: correlation leg
      definition: floating leg of a correlation swap that pays an amount based on the observed average correlation of the
        prices of a collection of underlying products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/PerformanceBasedVariableLeg
      attributeUses: []
      patternBindings: []
    CorrelationSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/CorrelationSwap
      namespace: fibo-der-derswa
      localName: CorrelationSwap
      label: correlation swap
      definition: over-the-counter statistical derivative that allows one to hedge risks associated with the observed average
        correlation of a collection of underlying products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/StatisticalSwap
      attributeUses: []
      patternBindings: []
    DispersionLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/DispersionLeg
      namespace: fibo-der-derswa
      localName: DispersionLeg
      label: dispersion leg
      definition: floating leg of a dispersion swap that pays an amount based on the realized dispersion of the price changes
        of the underlying product
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/PerformanceBasedVariableLeg
      attributeUses: []
      patternBindings: []
    DispersionSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/DispersionSwap
      namespace: fibo-der-derswa
      localName: DispersionSwap
      label: dispersion swap
      definition: statistical derivative used to hedge on the magnitude of a price movement of an underlying asset
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/StatisticalSwap
      attributeUses: []
      patternBindings: []
    ExcessReturnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ExcessReturnSwap
      namespace: fibo-der-derswa
      localName: ExcessReturnSwap
      label: excess return swap
      definition: return swap in which the change in the level of the index will be equal to the returns generated primarily
        by the changes in price of each of the contracts that comprise the index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/IndexReturnSwap
      attributeUses: []
      patternBindings: []
    FixedLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FixedLeg
      namespace: fibo-der-derswa
      localName: FixedLeg
      label: fixed leg
      definition: swap leg whose paying party is obligated to make payments from time to time over the term of a swap calculated
        by reference to a fixed annual rate or consisting of at least one payment of a fixed amount
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      attributeUses: []
      patternBindings: []
    FixedPaymentLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FixedPaymentLeg
      namespace: fibo-der-derswa
      localName: FixedPaymentLeg
      label: fixed payment leg
      definition: swap leg that specifies contractual terms associated with a schedule of payments for any swap calculated
        by reference to a fixed annual rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      attributeUses: []
      patternBindings: []
    FloatingLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FloatingLeg
      namespace: fibo-der-derswa
      localName: FloatingLeg
      label: floating leg
      definition: swap leg whose paying party is obligated to make payments from time to time over the term of a swap calculated
        by reference to some variable rate, calculated based on the change in value of some underlying asset, or consisting
        of at least one payment of some floating amount
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      attributeUses: []
      patternBindings: []
    IndexReturnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/IndexReturnSwap
      namespace: fibo-der-derswa
      localName: IndexReturnSwap
      label: index return swap
      definition: return swap in which payments are based on a fee paid to the seller of the swap and on a floating reference
        price based on changes in the level of an index from an initial level to a level observed on some valuation date(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      attributeUses: []
      patternBindings: []
    MajorSwapParticipant:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/MajorSwapParticipant
      namespace: fibo-der-derswa
      localName: MajorSwapParticipant
      label: major swap participant
      definition: financial service provider that maintains a substantial position in swaps for any of the major swap categories
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      attributeUses: []
      patternBindings: []
    PerformanceBasedVariableLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/PerformanceBasedVariableLeg
      namespace: fibo-der-derswa
      localName: PerformanceBasedVariableLeg
      label: performance-based variable leg
      definition: floating leg of a swap that depends on some statistical measure of the performance of the underlier
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FloatingLeg
      attributeUses: []
      patternBindings: []
    RateBasedLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RateBasedLeg
      namespace: fibo-der-derswa
      localName: RateBasedLeg
      label: rate-based leg
      definition: swap leg of a rate-based swap based on a floating interest, floating inflation or fixed interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      attributeUses: []
      patternBindings: []
    RatesSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RatesSwap
      namespace: fibo-der-derswa
      localName: RatesSwap
      label: rates swap
      definition: swap in two counterparties each agree to pay the other cash flows on defined dates during an agreed period,
        based on a specified notional amount and a floating interest, floating inflation or fixed interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      attributeUses: []
      patternBindings: []
    RealizedVariableLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RealizedVariableLeg
      namespace: fibo-der-derswa
      localName: RealizedVariableLeg
      label: realized variable leg
      definition: performance-based leg wherein the payment is netted at maturity rather than periodically
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/PerformanceBasedVariableLeg
      attributeUses: []
      patternBindings: []
    ReturnLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnLeg
      namespace: fibo-der-derswa
      localName: ReturnLeg
      label: return leg
      definition: leg of a swap in which the income generated by some underlier is paid
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FloatingLeg
      attributeUses: []
      patternBindings: []
    ReturnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      namespace: fibo-der-derswa
      localName: ReturnSwap
      label: return swap
      definition: swap in which one leg, the return leg, is based on income generated from some underlier
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      attributeUses: []
      patternBindings: []
    SimpleReturnLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SimpleReturnLeg
      namespace: fibo-der-derswa
      localName: SimpleReturnLeg
      label: simple return leg
      definition: return leg based strictly on the income generated by the underlying asset, excluding appreciation, decrease
        in value, capital gains, and fees on any increase in value
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnLeg
      attributeUses: []
      patternBindings: []
    StatisticalSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/StatisticalSwap
      namespace: fibo-der-derswa
      localName: StatisticalSwap
      label: statistical swap
      definition: swap that depends on some statistical measure of the performance of the underlier
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      attributeUses: []
      patternBindings: []
    StrikeLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/StrikeLeg
      namespace: fibo-der-derswa
      localName: StrikeLeg
      label: strike leg
      definition: swap leg that specifies a fixed amount, 'the strike', quoted at the time of execution
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FixedLeg
      attributeUses: []
      patternBindings: []
    Swap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      namespace: fibo-der-derswa
      localName: Swap
      label: swap
      definition: derivative instrument whereby counterparties agree to exchange periodic streams of cash flows or liabilities
        from two different financial instruments with each other
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
    SwapConfirmation:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapConfirmation
      namespace: fibo-der-derswa
      localName: SwapConfirmation
      label: swap confirmation
      definition: formal confirmation that codifies the terms and conditions specific to a lifecycle event with respect to
        the overall transaction between the parties
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLifecycleEvent
      - https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/TransactionConfirmation
      attributeUses: []
      patternBindings: []
    SwapDataRepository:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapDataRepository
      namespace: fibo-der-derswa
      localName: SwapDataRepository
      label: swap data repository
      definition: financial service provider that provides a central facility for swap data reporting and recordkeeping
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider
      attributeUses: []
      patternBindings: []
    SwapDealer:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapDealer
      namespace: fibo-der-derswa
      localName: SwapDealer
      label: swap dealer
      definition: non-depository institution such as one that deals in swaps, makes a market in swaps, regularly enters into
        swaps with counterparties as an ordinary course of business for its own account, and engages in any activity causing
        the person to be commonly known in the trade as a dealer/market maker in swaps
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/FinancialServicesEntities/NonDepositoryInstitution
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Dealer
      attributeUses: []
      patternBindings: []
    SwapLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      namespace: fibo-der-derswa
      localName: SwapLeg
      label: swap leg
      definition: terms defining and the commitment to fulfill cashflow requirements (e.g., interest payments, coupon payments,
        etc.) for a component of a swap
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowTerms
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapTerms
      attributeUses: []
      patternBindings: []
    SwapLegEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLegEvent
      namespace: fibo-der-derswa
      localName: SwapLegEvent
      label: swap leg event
      definition: swap lifecycle event, such as a payment or rate reset event, that applies to one leg of a swap
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLifecycleEvent
      attributeUses: []
      patternBindings: []
    SwapLifecycleEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLifecycleEvent
      namespace: fibo-der-derswa
      localName: SwapLifecycleEvent
      label: swap lifecycle event
      definition: event that occurs during the lifecycle of a swap, where the overall set of events includes those specific
        to the issuer, front office, middle office, and/or back office processes
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleEvent
      attributeUses: []
      patternBindings: []
    SwapLifecycleEventIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLifecycleEventIdentifier
      namespace: fibo-der-derswa
      localName: SwapLifecycleEventIdentifier
      label: swap lifecycle event identifier
      definition: identifier that uniquely identifies a specific event in the lifecycle of a swap
      superTypes:
      - https://www.omg.org/spec/Commons/Identifiers/Identifier
      attributeUses: []
      patternBindings: []
    SwapParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapParty
      namespace: fibo-der-derswa
      localName: SwapParty
      label: swap party
      definition: party to a swap and therefore a legal party to the contract that embodies that transaction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/ContractParty
      attributeUses: []
      patternBindings: []
    SwapPayingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapPayingParty
      namespace: fibo-der-derswa
      localName: SwapPayingParty
      label: swap paying party
      definition: swap party responsible for making payments for a given leg of the transaction as defined in the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/PayingParty
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapParty
      attributeUses: []
      patternBindings: []
    SwapReceivingParty:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapReceivingParty
      namespace: fibo-der-derswa
      localName: SwapReceivingParty
      label: swap receiving party
      definition: swap party that receives payments for a given leg of the transaction as defined in the contract
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ReceivingParty
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapParty
      attributeUses: []
      patternBindings: []
    SwapTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapTerms
      namespace: fibo-der-derswa
      localName: SwapTerms
      label: swap terms
      definition: legal contractual terms of a swap transaction
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeTerms
      attributeUses: []
      patternBindings: []
    TotalReturnLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/TotalReturnLeg
      namespace: fibo-der-derswa
      localName: TotalReturnLeg
      label: total return leg
      definition: return leg based on the income generated by the underlying asset as well as any appreciation, decrease in
        value, capital gains, and fees on any increase in value
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnLeg
      attributeUses: []
      patternBindings: []
    TotalReturnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/TotalReturnSwap
      namespace: fibo-der-derswa
      localName: TotalReturnSwap
      label: total return swap
      definition: return swap where the seller agrees to pay the other party the difference in value of some underlying asset
        multiplied by an agreed-upon notional value should the asset value increase between specified periods of time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CreditDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      attributeUses: []
      patternBindings: []
    UniqueSwapIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/UniqueSwapIdentifier
      namespace: fibo-der-derswa
      localName: UniqueSwapIdentifier
      label: unique swap identifier
      definition: identifier for a swap that is used in recordkeeping and swap data reporting
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrumentIdentifier
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasFundingLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/hasFundingLeg
      namespace: fibo-der-derswa
      localName: hasFundingLeg
      label: has funding leg
      definition: indicates the leg of a return swap that specifies a set payment rate, typically benchmark based but possibly
        a fixed rate
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      range: ''
      inverseOf: ''
      characteristics: []
    hasLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/hasLeg
      namespace: fibo-der-derswa
      localName: hasLeg
      label: has leg
      definition: relates a swap contract to a leg that is part of that swap
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      range: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      inverseOf: ''
      characteristics: []
    hasReturnLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/hasReturnLeg
      namespace: fibo-der-derswa
      localName: hasReturnLeg
      label: has return leg
      definition: indicates the leg of a return swap whose payments are based on the return of an underlying asset
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      range: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnLeg
      inverseOf: ''
      characteristics: []
    hasSwapIdentifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/hasSwapIdentifier
      namespace: fibo-der-derswa
      localName: hasSwapIdentifier
      label: has swap identifier
      definition: relates a swap lifecycle event to the identifier for the swap
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/FinancialInstrumentIdentifier
      inverseOf: ''
      characteristics: []
    isLegOf:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/isLegOf
      namespace: fibo-der-derswa
      localName: isLegOf
      label: is leg of
      definition: relates a swap leg to the to the swap that includes it
      domain: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SwapLeg
      range: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      inverseOf: https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/hasLeg
      characteristics: []
