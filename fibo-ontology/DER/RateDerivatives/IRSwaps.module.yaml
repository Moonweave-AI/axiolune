  preferredPrefix: fibo-der-ratirs
  version: '20250401'
  label: Interest Rate Swaps Ontology
  definition: This ontology defines concepts specific to interest rate swap contracts, including but not limited to fixed
    and floating rate combinations, single and cross-currency contracts, etc.
  imports:
