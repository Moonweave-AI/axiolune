domain:
  objectTypes:
    CrossCurrencyInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/CrossCurrencyInterestRateSwap
      namespace: fibo-der-ratirs
      localName: CrossCurrencyInterestRateSwap
      label: cross-currency interest rate swap
      definition: interest rate swap in which the two streams of interest payments are in different currencies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
    FixedFixedInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFixedInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FixedFixedInterestRateSwap
      label: fixed fixed interest rate swap
      definition: interest rate swap in which both parties pay a fixed interest rate that they could not otherwise obtain
        outside of a swap arrangement
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
    FixedFloatCrossCurrencyInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFloatCrossCurrencyInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FixedFloatCrossCurrencyInterestRateSwap
      label: fixed float cross-currency interest rate swap
      definition: interest rate swap in which fixed interest payments on the notional are exchanged for floating interest
        payments and the two streams of interest payments are in different currencies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/CrossCurrencyInterestRateSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFloatInterestRateSwap
      attributeUses: []
      patternBindings: []
    FixedFloatInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFloatInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FixedFloatInterestRateSwap
      label: fixed float interest rate swap
      definition: interest rate swap in which fixed interest payments on the notional are exchanged for floating interest
        payments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
    FixedFloatSingleCurrencyInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFloatSingleCurrencyInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FixedFloatSingleCurrencyInterestRateSwap
      label: fixed float single currency interest rate swap
      definition: interest rate swap in which fixed interest payments on the notional are exchanged for floating interest
        payments and where both payment streams are expressed in terms of the same currency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFloatInterestRateSwap
      attributeUses: []
      patternBindings: []
    FixedInterestRateLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedInterestRateLeg
      namespace: fibo-der-ratirs
      localName: FixedInterestRateLeg
      label: fixed interest rate leg
      definition: fixed leg that specifies fixed interest amounts and terms for the payment of that interest
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FixedLeg
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwapLeg
      attributeUses: []
      patternBindings: []
    FloatFloatCrossCurrencyInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatFloatCrossCurrencyInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FloatFloatCrossCurrencyInterestRateSwap
      label: float float cross-currency interest rate swap
      definition: interest rate swap that exchanges cashflows based on two different interest rates in different currencies
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatFloatInterestRateSwap
      attributeUses: []
      patternBindings: []
    FloatFloatInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatFloatInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FloatFloatInterestRateSwap
      label: float float interest rate swap
      definition: interest rate swap that exchanges cashflows based on two different floating interest rates
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/BasisSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
    FloatFloatSingleCurrencyInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatFloatSingleCurrencyInterestRateSwap
      namespace: fibo-der-ratirs
      localName: FloatFloatSingleCurrencyInterestRateSwap
      label: float float single currency interest rate swap
      definition: interest rate swap that exchanges cashflows based on two different floating interest rates in the same currency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatFloatInterestRateSwap
      attributeUses: []
      patternBindings: []
    FloatingInterestRateLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatingInterestRateLeg
      namespace: fibo-der-ratirs
      localName: FloatingInterestRateLeg
      label: floating interest rate leg
      definition: floating leg in which variable interest is paid on some notional amount, linked to some underlying interest
        reference rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FloatingLeg
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwapLeg
      attributeUses: []
      patternBindings: []
    InflationLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InflationLeg
      namespace: fibo-der-ratirs
      localName: InflationLeg
      label: inflation leg
      definition: floating rate leg of an inflation swap linked to an inflation index, such as the Consumer Price Index (CPI)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/FloatingLeg
      attributeUses: []
      patternBindings: []
    InflationSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InflationSwap
      namespace: fibo-der-ratirs
      localName: InflationSwap
      label: inflation swap
      definition: rate swap in which one party pays an amount calculated using an inflation rate index, and the other party
        pays an amount calculated using another inflation rate index, or a fixed or floating interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/RateBasedDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RatesSwap
      attributeUses: []
      patternBindings: []
    InterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      namespace: fibo-der-ratirs
      localName: InterestRateSwap
      label: interest rate swap
      definition: swap in which the reference (underlier) for at least one leg is an interest rate
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/InterestRateDerivative
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RatesSwap
      attributeUses: []
      patternBindings: []
    InterestRateSwapLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwapLeg
      namespace: fibo-der-ratirs
      localName: InterestRateSwapLeg
      label: interest rate swap leg
      definition: swap leg that has an interest rate payment stream, including both a parametric and cashflow representation
        for the stream of payments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/RateBasedLeg
      attributeUses: []
      patternBindings: []
    NotionalStepAmount:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/NotionalStepAmount
      namespace: fibo-der-ratirs
      localName: NotionalStepAmount
      label: notional step amount
      definition: the amount of money that is subtracted from the notional on each step date
      superTypes:
      - https://www.omg.org/spec/Commons/QuantitiesAndUnits/ScalarQuantityValue
      attributeUses: []
      patternBindings: []
    NotionalStepChangeEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/NotionalStepChangeEvent
      namespace: fibo-der-ratirs
      localName: NotionalStepChangeEvent
      label: notional step change event
      definition: event in which a step change in the notional amount for a given swap leg occurs
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/ContractLifecycleEventOccurrence
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/StepEvent
      attributeUses: []
      patternBindings: []
    NotionalStepPeriodLength:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/NotionalStepPeriodLength
      namespace: fibo-der-ratirs
      localName: NotionalStepPeriodLength
      label: notional step period length
      definition: recurrence interval indicating the frequency with which step changes occur, which is a multiple of the calculation
        period in the calculation schedule
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/FinancialDates/RecurrenceInterval
      attributeUses: []
      patternBindings: []
    NotionalStepSchedule:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/NotionalStepSchedule
      namespace: fibo-der-ratirs
      localName: NotionalStepSchedule
      label: notional step schedule
      definition: schedule of changes in the notional amount on which interest is paid, comprising the regular sequence of
        step events
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/ProjectedContractEventSchedule
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Debt/DebtInstruments/StepSchedule
      attributeUses: []
      patternBindings: []
    OvernightIndexSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/OvernightIndexSwap
      namespace: fibo-der-ratirs
      localName: OvernightIndexSwap
      label: overnight index swap
      definition: swap in which the periodic payments for one leg are based on an overnight interest rate index multiplied
        by the same notional amount upon which payments for the other leg of the swap are based
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
    OvernightRateIndexLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/OvernightRateIndexLeg
      namespace: fibo-der-ratirs
      localName: OvernightRateIndexLeg
      label: overnight rate index leg
      definition: floating leg in which periodic payments are based on an overnight interest rate index multiplied by the
        same notional amount on which the payments for the other leg of the swap are based
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatingInterestRateLeg
      attributeUses: []
      patternBindings: []
    PlainVanillaInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/PlainVanillaInterestRateSwap
      namespace: fibo-der-ratirs
      localName: PlainVanillaInterestRateSwap
      label: plain vanilla interest rate swap
      definition: fixed-float single currency interest rate swap in which interest payments are netted, the notional principal
        does not change, and there are no embedded options
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedFloatSingleCurrencyInterestRateSwap
      attributeUses: []
      patternBindings: []
    SingleCurrencyInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/SingleCurrencyInterestRateSwap
      namespace: fibo-der-ratirs
      localName: SingleCurrencyInterestRateSwap
      label: single currency interest rate swap
      definition: interest rate swap in which the two streams of interest payments are in the same currency
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
    ZeroCouponInterestRateSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/ZeroCouponInterestRateSwap
      namespace: fibo-der-ratirs
      localName: ZeroCouponInterestRateSwap
      label: zero coupon interest rate swap
      definition: interest rate swap in which the fixed rate cash flows are compounded and paid once on the expiration date,
        rather than periodically; the payments on the other side (which can be based on a floating interest rate or a fixed
        rate) follow typical swap payment schedules
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes:
    hasFirstNotionalStepDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/hasFirstNotionalStepDate
      namespace: fibo-der-ratirs
      localName: hasFirstNotionalStepDate
      label: has first notional step date
      definition: indicates the initial date in a notional step schedule
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
    hasFloatingRateCap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/hasFloatingRateCap
      namespace: fibo-der-ratirs
      localName: hasFloatingRateCap
      label: has floating rate cap
      definition: indicates an optional ceiling (cap) on interest rates on floating rate debts
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FloatingInterestRate
      inverseOf: ''
      characteristics: []
    hasFloatingRateFloor:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/hasFloatingRateFloor
      namespace: fibo-der-ratirs
      localName: hasFloatingRateFloor
      label: has floating rate floor
      definition: indicates an optional lower bound on interest rates on floating rate debts
      domain: ''
      range: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/FloatingInterestRate
      inverseOf: ''
      characteristics: []
    hasLastNotionalStepDate:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/hasLastNotionalStepDate
      namespace: fibo-der-ratirs
      localName: hasLastNotionalStepDate
      label: has last notional step date
      definition: indicates the final date in a notional step schedule
      domain: ''
      range: https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDate
      inverseOf: ''
      characteristics: []
  attributeTypes:
    hasFloatingRateSpread:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/hasFloatingRateSpread
      namespace: fibo-der-ratirs
      localName: hasFloatingRateSpread
      label: has floating rate spread
      definition: defines the spread rate that can optionally be used to adjust the floating rate
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
    hasRateMultiplier:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/hasRateMultiplier
      namespace: fibo-der-ratirs
      localName: hasRateMultiplier
      label: has rate multiplier
      definition: indicates a multiplier applied to the coupon before adding the floating rate spread
      valueType: decimal
      defaultCardinality:
        minCount: 0
        maxCount: null
  identifierTypes: {}
  codeLists: {}
  constraints: {}
