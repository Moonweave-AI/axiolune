domain:
  objectTypes:
    BasketOfDebtInstruments:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      namespace: fibo-der-secsec
      localName: BasketOfDebtInstruments
      label: basket of debt instruments
      definition: basket of securities whose constituents are debt instruments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/SEC/Securities/Baskets/BasketOfSecurities
      attributeUses: []
      patternBindings: []
    CapitalizedLeaseObligationDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/CapitalizedLeaseObligationDebtBasket
      namespace: fibo-der-secsec
      localName: CapitalizedLeaseObligationDebtBasket
      label: capitalized lease obligation debt basket
      definition: basket of debt instruments whose constituents are contracts entitling a renter the temporary use of an asset
        and, in accounting terms, has asset ownership characteristics
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    ContributionDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/ContributionDebtBasket
      namespace: fibo-der-secsec
      localName: ContributionDebtBasket
      label: contribution debt basket
      definition: basket of debt instruments that allows a company to incur an amount of indebtedness that is equal to (or
        in top tier sponsor transactions in the U.S., up to two times) the amount of equity contributed to the group
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    CreditFacilityDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/CreditFacilityDebtBasket
      namespace: fibo-der-secsec
      localName: CreditFacilityDebtBasket
      label: credit facility debt basket
      definition: basket of securities whose constituents are credit agreements that allow the borrower to periodically take
        out money over an extended period of time rather than reapplying for a loan every time they need funds
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    DebtInstrumentDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/DebtInstrumentDerivative
      namespace: fibo-der-secsec
      localName: DebtInstrumentDerivative
      label: debt instrument derivative
      definition: security-based derivative whose underlier is a debt observable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/SecurityBasedDerivative
      attributeUses: []
      patternBindings: []
    EquityDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/EquityDerivative
      namespace: fibo-der-secsec
      localName: EquityDerivative
      label: equity derivative
      definition: security-based derivative whose underlier is based on equities (e.g. shares, basket of equities or index)
        or their cashflow(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/SecurityBasedDerivative
      attributeUses: []
      patternBindings: []
    GeneralDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/GeneralDebtBasket
      namespace: fibo-der-secsec
      localName: GeneralDebtBasket
      label: general debt basket
      definition: basket of debt instruments that provides additional capacity for potential funding and does not require
        the proceeds to be used for any particular purpose
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    IncrementalFacilityDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/IncrementalFacilityDebtBasket
      namespace: fibo-der-secsec
      localName: IncrementalFacilityDebtBasket
      label: incremental facility debt basket
      definition: basket of credit facilities whose constituents are extensible, allowing companies to borrow an additional
        term loan or revolving credit facility (or increase the commitments applicable thereto) under the same credit agreement
        subject to certain parameters
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/CreditFacilityDebtBasket
      attributeUses: []
      patternBindings: []
    LocalLinesOfCreditDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/LocalLinesOfCreditDebtBasket
      namespace: fibo-der-secsec
      localName: LocalLinesOfCreditDebtBasket
      label: local lines of credit debt basket
      definition: basket of debt instruments that may be relevant for companies with international operations, often permitting
        debt to be incurred by a non-guarantor restricted subsidiary
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    Non-GuarantorDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/Non-GuarantorDebtBasket
      namespace: fibo-der-secsec
      localName: Non-GuarantorDebtBasket
      label: non-guarantor debt basket
      definition: basket of debt instruments that include a provision allowing certain subsidiaries within a corporate group,
        which are not part of the loan guarantee, to incur a specified amount of indebtedness
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    RatioDebtBasket:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/RatioDebtBasket
      namespace: fibo-der-secsec
      localName: RatioDebtBasket
      label: ratio debt basket
      definition: basket of debt instruments whose constituents are specified based on a leverage ratio based on total debt
        rather than only secured debt
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/BasketOfDebtInstruments
      attributeUses: []
      patternBindings: []
    SecurityBasedDerivative:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/SecurityBasedDerivative
      namespace: fibo-der-secsec
      localName: SecurityBasedDerivative
      label: security-based derivative
      definition: derivative instrument whose underlier is based on a security, including collections of securities and indices
        based on securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
  constraints: {}
