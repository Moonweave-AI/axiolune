domain:
  objectTypes:
    DispersionSwapIndexConstituentsLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/DispersionSwapIndexConstituentsLeg
      namespace: fibo-der-secequ
      localName: DispersionSwapIndexConstituentsLeg
      label: dispersion swap index constituents leg
      definition: dispersion leg whose underlier is a defined set of constituents of a given equity index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/DispersionLeg
      attributeUses: []
      patternBindings: []
    DispersionSwapIndexLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/DispersionSwapIndexLeg
      namespace: fibo-der-secequ
      localName: DispersionSwapIndexLeg
      label: dispersion swap index leg
      definition: dispersion leg whose underlier is an equity index
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/DispersionLeg
      attributeUses: []
      patternBindings: []
    DividendLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/DividendLeg
      namespace: fibo-der-secequ
      localName: DividendLeg
      label: dividend leg
      definition: floating leg of a dividend swap
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/SimpleReturnLeg
      attributeUses: []
      patternBindings: []
    DividendSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/DividendSwap
      namespace: fibo-der-secequ
      localName: DividendSwap
      label: dividend swap
      definition: equity swap that has at least one leg whose underlier is a dividend stream
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      attributeUses: []
      patternBindings: []
    EquityCorrelationSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquityCorrelationSwap
      namespace: fibo-der-secequ
      localName: EquityCorrelationSwap
      label: equity correlation swap
      definition: correlation swap that allows one to hedge risks associated with the observed average correlation of a collection
        of underlying equity products
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/CorrelationSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      attributeUses: []
      patternBindings: []
    EquityPriceReturnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquityPriceReturnSwap
      namespace: fibo-der-secequ
      localName: EquityPriceReturnSwap
      label: equity price return swap
      definition: return swap whose return leg underlier is based on equities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      attributeUses: []
      patternBindings: []
    EquityReturnLeg:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquityReturnLeg
      namespace: fibo-der-secequ
      localName: EquityReturnLeg
      label: equity return leg
      definition: return leg whose income is based on equities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/ReturnLeg
      attributeUses: []
      patternBindings: []
    EquitySwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      namespace: fibo-der-secequ
      localName: EquitySwap
      label: equity swap
      definition: swap whose payments are linked to the change in value of underlying equities (e.g. shares, basket of equities
        or index) or their cashflow(s)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/Swap
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/SecurityBasedDerivatives/EquityDerivative
      attributeUses: []
      patternBindings: []
    EquityTotalReturnSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquityTotalReturnSwap
      namespace: fibo-der-secequ
      localName: EquityTotalReturnSwap
      label: equity total return swap
      definition: total return swap whose return leg underlier is based on equities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/TotalReturnSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      attributeUses: []
      patternBindings: []
    EquityVarianceSwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquityVarianceSwap
      namespace: fibo-der-secequ
      localName: EquityVarianceSwap
      label: equity variance swap
      definition: dispersion swap in which the parties agree to exchange payments based on the difference between (i) the
        realized variance of the price changes of a specified equity underlier over a stated observation period and (ii) a
        fixed amount of variance that is agreed when the contract is executed
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/DispersionSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      attributeUses: []
      patternBindings: []
    EquityVolatilitySwap:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquityVolatilitySwap
      namespace: fibo-der-secequ
      localName: EquityVolatilitySwap
      label: equity volatility swap
      definition: dispersion swap that is a forward contract on the variability of movements in the price of its underlying
        equities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/Swaps/DispersionSwap
      - https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/EquitySwap
      attributeUses: []
      patternBindings: []
    QualifyingDividendPeriod:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/QualifyingDividendPeriod
      namespace: fibo-der-secequ
      localName: QualifyingDividendPeriod
      label: qualifying dividend period
      definition: date period over which the sum of all qualifying dividends paid by the relevant issuers as identified in
        the swap terms is calculated
      superTypes:
      - https://www.omg.org/spec/Commons/DatesAndTimes/ExplicitDatePeriod
      attributeUses: []
      patternBindings: []
    SpecialDividendLegTerms:
      iri: https://spec.edmcouncil.org/fibo/ontology/DER/SecurityBasedDerivatives/EquitySwaps/SpecialDividendLegTerms
      namespace: fibo-der-secequ
      localName: SpecialDividendLegTerms
      label: special dividend leg terms
      definition: terms that are invoked if special dividend and memorial dividends are applicable
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/CashflowTerms
      attributeUses: []
      patternBindings: []
