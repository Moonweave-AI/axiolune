  version: '20250301'
  label: Equity Swaps Ontology
  definition: This ontology defines concepts specific to swap contracts in which one leg gives some form of return on an equity
    asset, including dividend returns, total asset returns equity dispersion and correlation measurement terms. Many of these
    return calculations are based on a variety of calculation methods and may vary widely.
