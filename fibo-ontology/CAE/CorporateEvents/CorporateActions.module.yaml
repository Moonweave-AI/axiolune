domain:
  objectTypes:
    Action:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Action
      namespace: fibo-cae-corcor
      localName: Action
      label: action
      definition: event announced, initiated or carried out by an organization that affects a legal entity or the securities
        it issues and may have a material impact on that entity's stakeholders, such as shareholders and creditors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/Occurrence
      attributeUses: []
      patternBindings: []
    ActionClassificationScheme:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ActionClassificationScheme
      namespace: fibo-cae-corcor
      localName: ActionClassificationScheme
      label: action classification scheme
      definition: scheme for classifying the kinds of actions and events that may be announced, initiated or carried out by
        an organization that affects a legal entity or the securities it issues
      superTypes:
      - https://www.omg.org/spec/Commons/Classifiers/ClassificationScheme
      - https://www.omg.org/spec/Commons/CodesAndCodeSets/CodeSet
      attributeUses: []
      patternBindings: []
    ActionClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ActionClassifier
      namespace: fibo-cae-corcor
      localName: ActionClassifier
      label: action classifier
      definition: classifier that distinguishes the kinds of actions and events that may be announced, initiated or carried
        out by an organization that affects a legal entity or the securities it issues, such as income-oriented events
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/DatesAndTimes/Occurrences/OccurrenceKind
      - https://www.omg.org/spec/Commons/Classifiers/Classifier
      attributeUses: []
      patternBindings: []
    ActionStatus:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ActionStatus
      namespace: fibo-cae-corcor
      localName: ActionStatus
      label: action status
      definition: state of some action at some point in time
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleStatus
      attributeUses: []
      patternBindings: []
    BusinessStrategyClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/BusinessStrategyClassifier
      namespace: fibo-cae-corcor
      localName: BusinessStrategyClassifier
      label: business strategy classifier
      definition: classifier of corporate actions that involve improving liquidity or changing the overall structure of the
        organization through diversification, combining and closing parts of the business, etc, to increase long-term profitability
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ActionClassifier
      attributeUses: []
      patternBindings: []
    ChangeAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ChangeAction
      namespace: fibo-cae-corcor
      localName: ChangeAction
      label: change action
      definition: corporate action to disseminate information regarding a change further described in the corporate action
        details
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    ClassAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ClassAction
      namespace: fibo-cae-corcor
      localName: ClassAction
      label: class action
      definition: corporate action involving a situation where interested parties seek restitution for financial loss
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    ConsentSolicitation:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ConsentSolicitation
      namespace: fibo-cae-corcor
      localName: ConsentSolicitation
      label: consent solicitation
      definition: corporate action that is a procedure that aims to obtain consent of holder to a proposal by the issuer or
        a third party without convening a meeting
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    CorporateAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      namespace: fibo-cae-corcor
      localName: CorporateAction
      label: corporate action
      definition: action carried out by or specifically relating to a legal entity that may affect the securities it issues
        and may have a material impact on its stakeholders, such as shareholders and creditors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Action
      attributeUses: []
      patternBindings: []
    DisclosureAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/DisclosureAction
      namespace: fibo-cae-corcor
      localName: DisclosureAction
      label: disclosure action
      definition: corporate action involving a request for holders or beneficial owners to disclose their name, location and
        holdings of any issue to the issuer
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    Divestiture:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Divestiture
      namespace: fibo-cae-corcor
      localName: Divestiture
      label: divestiture
      definition: corporate action involving the sales of subsidiary business interests or investments
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    IncomeOrientedClassifier:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/IncomeOrientedClassifier
      namespace: fibo-cae-corcor
      localName: IncomeOrientedClassifier
      label: income-oriented classifier
      definition: classifier of corporate actions that impacts income to shareholders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/ActionClassifier
      attributeUses: []
      patternBindings: []
    LegalFormChange:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/LegalFormChange
      namespace: fibo-cae-corcor
      localName: LegalFormChange
      label: legal form change
      definition: corporate action indicating a modification of the legal form of the organization
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    Liquidation:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Liquidation
      namespace: fibo-cae-corcor
      localName: Liquidation
      label: liquidation
      definition: corporate action related to winding up a business, including but not limited to distribution of cash, assets,
        or both
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Divestiture
      attributeUses: []
      patternBindings: []
    MandatoryCorporateAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      namespace: fibo-cae-corcor
      localName: MandatoryCorporateAction
      label: mandatory corporate action
      definition: action initiated by the board of directors of a corporation that affects all shareholders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    MandatoryWithChoiceCorporateAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryWithChoiceCorporateAction
      namespace: fibo-cae-corcor
      localName: MandatoryWithChoiceCorporateAction
      label: mandatory with choice corporate action
      definition: mandatory corporate action where shareholders are given an opportunity to choose among several options
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    MarketAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MarketAction
      namespace: fibo-cae-corcor
      localName: MarketAction
      label: market action
      definition: action that is initiated by a market, such as a securities exchange, that affects a legal entity or the
        securities it issues and may have a material impact on that entity's stakeholders, such as shareholders and creditors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Action
      attributeUses: []
      patternBindings: []
    MergerAcquisition:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MergerAcquisition
      namespace: fibo-cae-corcor
      localName: MergerAcquisition
      label: merger / acquisition
      definition: corporate action involving the consolidation of legal entities or assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    Notification:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Notification
      namespace: fibo-cae-corcor
      localName: Notification
      label: notification
      definition: corporate action involving information provided by the issuer having no accounting/financial impact on the
        holder
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    OrganizationAddressChange:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/OrganizationAddressChange
      namespace: fibo-cae-corcor
      localName: OrganizationAddressChange
      label: organization address change
      definition: information action that provides details of address changes for a legal entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Notification
      attributeUses: []
      patternBindings: []
    OrganizationNameChange:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/OrganizationNameChange
      namespace: fibo-cae-corcor
      localName: OrganizationNameChange
      label: organization name change
      definition: information action that provides details of name changes for a legal entity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Notification
      attributeUses: []
      patternBindings: []
    PriorityIssue:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/PriorityIssue
      namespace: fibo-cae-corcor
      localName: PriorityIssue
      label: priority issue
      definition: corporate action that is a public offer where, due to a limited amount of securities available, priority
        is given to existing shareholders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    RegulatoryAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/RegulatoryAction
      namespace: fibo-cae-corcor
      localName: RegulatoryAction
      label: regulatory action
      definition: action initiated by a regulatory agency that affects a legal entity or the securities it issues and may
        have a material impact on that entity's stakeholders, such as shareholders and creditors
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Action
      attributeUses: []
      patternBindings: []
    SpinOff:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/SpinOff
      namespace: fibo-cae-corcor
      localName: SpinOff
      label: spin off
      definition: corporate action involving the distribution of subsidiary stock to the shareholders of the parent company
        without a surrender of shares
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/Divestiture
      attributeUses: []
      patternBindings: []
    VoluntaryCorporateAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      namespace: fibo-cae-corcor
      localName: VoluntaryCorporateAction
      label: voluntary corporate action
      definition: event in which the shareholders elect to participate and must respond in order for the issuer to process
        the action
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
  associationTypes: {}
  relationTypes: {}
  attributeTypes: {}
  identifierTypes: {}
  codeLists: {}
