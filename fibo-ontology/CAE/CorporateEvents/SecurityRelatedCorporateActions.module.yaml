  label: Security-related Corporate Actions Ontology
  definition: This ontology defines the kinds of income and corporate action events covered by ISO 15022 and other standards,
    including recent extensions to those standards. Scope has been limited to security-related events and actions, and excludes
    most notification and meetings related events.
