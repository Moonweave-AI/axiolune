domain:
  objectTypes:
    BondDefaultAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/BondDefaultAction
      namespace: fibo-cae-corsec
      localName: BondDefaultAction
      label: bond default event
      definition: corporate action which indicates a failure by the issuer to perform obligations defined as default events
        under the bond agreement and that have not been remedied
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      - https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/ObligationDefault
      attributeUses: []
      patternBindings: []
    BonusIssue:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/BonusIssue
      namespace: fibo-cae-corsec
      localName: BonusIssue
      label: bonus issue
      definition: corporate action in which security holders are awarded additional assets free of payment from the issuer
        in proportion to their holding
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    BonusRightsIssue:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/BonusRightsIssue
      namespace: fibo-cae-corsec
      localName: BonusRightsIssue
      label: bonus rights issue
      definition: A Rights Issue in which the rights are given to the holders of the referenced shares for free.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/IntermediateSecuritiesDistribution
      attributeUses: []
      patternBindings: []
    BonusSharePlanDistribution:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/BonusSharePlanDistribution
      namespace: fibo-cae-corsec
      localName: BonusSharePlanDistribution
      label: bonus share plan distribution
      definition: 'Event in which shares are issued from the Share Premium Reserve of the company and are considered as a
        capital distribution rather than a disbursement of income, with different tax implications. SWIFT Definition (adapted
        above) "Typically found in Australia, shares are issued from the Share Premium Reserve of the company and are considered
        as a capital distribution rather than a disbursement of income, with different tax implications." To be researches
        further. There are certainly Share Plans in Australia, where you can take a dividend as shares. Thewse would be in
        the nature of Bonus Shares. They are a tradeoff from cash dividends. Other terms to model: A "Scheme of Arrangment"
        - does this change the capital reserves or is it just another word for restructure. An arrangement with the company''s
        debtors, and coule potentially change the capital base by converting the debt to shares (see other diagram note with
        these in).'
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CapitalDistribution
      attributeUses: []
      patternBindings: []
    CallOnIntermediateSecurities:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CallOnIntermediateSecurities
      namespace: fibo-cae-corsec
      localName: CallOnIntermediateSecurities
      label: call on intermediate securities
      definition: corporate action that involves a call or exercise on nil paid securities or intermediate securities resulting
        from an intermediate securities distribution (RHDI)
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryWithChoiceCorporateAction
      attributeUses: []
      patternBindings: []
    CancellationOfShares:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CancellationOfShares
      namespace: fibo-cae-corsec
      localName: CancellationOfShares
      label: cancellation of shares
      definition: The cancellation of shares. Further Notes Only possible with shares not publicly issued i.e. treasury shares
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    CapitalDistribution:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CapitalDistribution
      namespace: fibo-cae-corsec
      localName: CapitalDistribution
      label: capital distribution
      definition: corporate action that pays shareholders an amount in cash issued from the issuer's capital account
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    CapitalGainsDistribution:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CapitalGainsDistribution
      namespace: fibo-cae-corsec
      localName: CapitalGainsDistribution
      label: capital gains distribution
      definition: corporate action that distributes profits resulting from the sale of company assets to shareholders
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    CashDividendAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CashDividendAction
      namespace: fibo-cae-corsec
      localName: CashDividendAction
      label: cash dividend action
      definition: corporate action that distributes cash to shareholders in proportion to their equity holding
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    ChangeOfSecurityTradingStatusEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/ChangeOfSecurityTradingStatusEvent
      namespace: fibo-cae-corsec
      localName: ChangeOfSecurityTradingStatusEvent
      label: change of security trading status event
      definition: An event in which the trading status of a tradable security changes.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateChangeOfStatusEvent
      attributeUses: []
      patternBindings: []
    ChangeToSmallestNegotiableUnit:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/ChangeToSmallestNegotiableUnit
      namespace: fibo-cae-corsec
      localName: ChangeToSmallestNegotiableUnit
      label: change to smallest negotiable unit
      definition: Modification of the smallest negotiable unit of shares in order to obtain a new negotiable unit. SWIFT:SMAL
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    ConversionAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/ConversionAction
      namespace: fibo-cae-corsec
      localName: ConversionAction
      label: conversion action
      definition: corporate action involving conversion of securities (generally convertible bonds or preferred shares) into
        another form of securities (usually common shares) at a pre-stated price/ratio
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    ConversionSuspensionAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/ConversionSuspensionAction
      namespace: fibo-cae-corsec
      localName: ConversionSuspensionAction
      label: conversion suspension action
      definition: Suspension of conversion of securities, generally a couple of weeks before a meeting takes place. SWIFT
        = SCOP
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    CorporateActionObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateActionObligation
      namespace: fibo-cae-corsec
      localName: CorporateActionObligation
      label: corporate action obligation
      definition: An obligation related to the holding of a Security.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      - https://spec.edmcouncil.org/fibo/ontology/FND/Law/LegalCapacity/Duty
      attributeUses: []
      patternBindings: []
    CorporateActionPaymentObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateActionPaymentObligation
      namespace: fibo-cae-corsec
      localName: CorporateActionPaymentObligation
      label: corporate action payment obligation
      definition: ''
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateActionObligation
      attributeUses: []
      patternBindings: []
    CorporateActionSecuritiesDeliveryObligation:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateActionSecuritiesDeliveryObligation
      namespace: fibo-cae-corsec
      localName: CorporateActionSecuritiesDeliveryObligation
      label: corporate action securities delivery obligation
      definition: Some obligation to deliver some security in the thr context of corporate actions. All cash proceeds and
        security proceeds can be represented a s acontractual obligation. Where does that obligation arise? Usually in the
        Contract itself - but there may be other answers to this. Defines what has to be delivered. or paid. Entitlement meanwhile
        is a calculation based on the Contract.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateActionObligation
      attributeUses: []
      patternBindings: []
    CorporateChangeOfStatusEvent:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CorporateChangeOfStatusEvent
      namespace: fibo-cae-corsec
      localName: CorporateChangeOfStatusEvent
      label: corporate change of status event
      definition: Some change to the status of some security.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      - https://spec.edmcouncil.org/fibo/ontology/FND/Arrangements/Lifecycles/LifecycleEvent
      attributeUses: []
      patternBindings: []
    CouponStrip:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/CouponStrip
      namespace: fibo-cae-corsec
      localName: CouponStrip
      label: coupon strip
      definition: Coupon stripping is the process whereby interest coupons for future payment dates are separated from the
        security corpus that entitles the holder to the principal repayment.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    DecreaseInValueAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/DecreaseInValueAction
      namespace: fibo-cae-corsec
      localName: DecreaseInValueAction
      label: decrease in value action
      definition: corporate action resulting in a reduction of face value of a share or the value of fund assets
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    DividendOptionAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/DividendOptionAction
      namespace: fibo-cae-corsec
      localName: DividendOptionAction
      label: dividend option action
      definition: corporate action that involves distribution of a dividend to shareholders with a choice of benefit to receive
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryWithChoiceCorporateAction
      attributeUses: []
      patternBindings: []
    DividendReinvestmentAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/DividendReinvestmentAction
      namespace: fibo-cae-corsec
      localName: DividendReinvestmentAction
      label: dividend reinvestment action
      definition: corporate action that involves a dividend payment whereby holders can keep cash or have the cash reinvested
        into additional shares in the issuing company
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryWithChoiceCorporateAction
      attributeUses: []
      patternBindings: []
    Drawing:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/Drawing
      namespace: fibo-cae-corsec
      localName: Drawing
      label: drawing
      definition: Redemption in part before the scheduled final maturity date of a security.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    DutchAuction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/DutchAuction
      namespace: fibo-cae-corsec
      localName: DutchAuction
      label: dutch auction
      definition: corporate action by a party wishing to acquire a security
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    ExchangeAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/ExchangeAction
      namespace: fibo-cae-corsec
      localName: ExchangeAction
      label: exchange action
      definition: corporate action that reflects an exchange of holdings for other securities and/or cash
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    FormalOffer:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/FormalOffer
      namespace: fibo-cae-corsec
      localName: FormalOffer
      label: formal offer
      definition: corporate action involving an offer to a holder, potential holder, or other intersted party, to enter into
        a trade which is or would be legally binding on the part of the party making the offer (the offeror).
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    FullCallEarlyRedemptionAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/FullCallEarlyRedemptionAction
      namespace: fibo-cae-corsec
      localName: FullCallEarlyRedemptionAction
      label: full call early redemption action
      definition: corporate action that involves redemption of an entire issue outstanding of securities prior to maturity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    InterestPaymentAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/InterestPaymentAction
      namespace: fibo-cae-corsec
      localName: InterestPaymentAction
      label: interest payment action
      definition: corporate action that involves distribution of a regular interest payment to holders of an interest-bearing
        asset
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    InterestPaymentInKind:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/InterestPaymentInKind
      namespace: fibo-cae-corsec
      localName: InterestPaymentInKind
      label: interest payment in kind
      definition: Interest payment, in any kind except cash, distributed to holders of an interest bearing asset. SWIFT =
        PINK
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/InterestPaymentAction
      attributeUses: []
      patternBindings: []
    InterestPaymentWithPrincipal:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/InterestPaymentWithPrincipal
      namespace: fibo-cae-corsec
      localName: InterestPaymentWithPrincipal
      label: interest payment with principal
      definition: A payment of a portion of the principal of an interest bearing asset, in addition to the interest payment.
        SWIFT = PRII
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/InterestPaymentAction
      attributeUses: []
      patternBindings: []
    InterestRateAdjustment:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/InterestRateAdjustment
      namespace: fibo-cae-corsec
      localName: InterestRateAdjustment
      label: interest rate adjustment
      definition: Scheduled change to the coupon rate for a floating or adjustable rate security.
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    IntermediateSecuritiesDistribution:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/IntermediateSecuritiesDistribution
      namespace: fibo-cae-corsec
      localName: IntermediateSecuritiesDistribution
      label: intermediate securities distribution
      definition: corporate action involving the distribution of intermediate securities or privilege that gives the holder
        the right to take part in a future event
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    ListingStatusDelistingMessage:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/ListingStatusDelistingMessage
      namespace: fibo-cae-corsec
      localName: ListingStatusDelistingMessage
      label: listing status delisting message
      definition: Security is no longer able to comply with the listing requirements of a stock exchange and is removed from
        official board quotation.
      superTypes:
      - https://www.omg.org/spec/Commons/Documents/Notice
      attributeUses: []
      patternBindings: []
    OddLotOffer:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/OddLotOffer
      namespace: fibo-cae-corsec
      localName: OddLotOffer
      label: odd lot offer
      definition: Offer by issuer to allow holders of an odd lot of a security to order a commission-free transaction at market
        price, to sell the odd lot, or to buy an amount of shares which will bring the position to a round lot (board lot).
        SWIFT = ODLT
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    PariPassuAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/PariPassuAction
      namespace: fibo-cae-corsec
      localName: PariPassuAction
      label: pari-passu action
      definition: corporate action that occurs when securities with different characteristics become identical in all respects
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    PartialRedemptionWithReductionOfNominalValueAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/PartialRedemptionWithReductionOfNominalValueAction
      namespace: fibo-cae-corsec
      localName: PartialRedemptionWithReductionOfNominalValueAction
      label: partial redemption with reduction of nominal value action
      definition: corporate action that involves redemption of securities in part before their scheduled final maturity date
        with reduction of the nominal value of the securities
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    PartialRedemptionWithoutReductionOfNominalValueAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/PartialRedemptionWithoutReductionOfNominalValueAction
      namespace: fibo-cae-corsec
      localName: PartialRedemptionWithoutReductionOfNominalValueAction
      label: partial redemption without reduction of nominal value action
      definition: corporate action that involves redemption of securities in part before their scheduled final maturity date
        with no reduction in nominal value
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    PostMergerSecuritiesExchange:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/PostMergerSecuritiesExchange
      namespace: fibo-cae-corsec
      localName: PostMergerSecuritiesExchange
      label: post-merger securities exchange
      definition: corporate action that involves the exchange of outstanding securities, initiated by the issuer which may
        include options, as the result of two or more companies combining assets, that is, an external, third party company
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/CorporateAction
      attributeUses: []
      patternBindings: []
    PutRedemptionAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/PutRedemptionAction
      namespace: fibo-cae-corsec
      localName: PutRedemptionAction
      label: put redemption action
      definition: corporate action involving early redemption of a security at the election of the holder subject to the terms
        and condition of the issue with no reduction in nominal value
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/VoluntaryCorporateAction
      attributeUses: []
      patternBindings: []
    RedemptionAtMaturityAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/RedemptionAtMaturityAction
      namespace: fibo-cae-corsec
      localName: RedemptionAtMaturityAction
      label: redemption at maturity action
      definition: corporate action that involves redemption of an entire issue outstanding of securities at final maturity
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
    RedenominationAction:
      iri: https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/SecurityRelatedCorporateActions/RedenominationAction
      namespace: fibo-cae-corsec
      localName: RedenominationAction
      label: redenomination action
      definition: corporate action by which the unit (currency and/or nominal) of a security is restated
      superTypes:
      - https://spec.edmcouncil.org/fibo/ontology/CAE/CorporateEvents/CorporateActions/MandatoryCorporateAction
      attributeUses: []
      patternBindings: []
