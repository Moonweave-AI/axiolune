  label: Dow Jones Industrial Average Companies
  definition: This ontology includes example entities that are companies in the US that issue stock and that are represented
    in the Dow Jones Industrial Average (DJIA), to demonstrate how to begin to model those entities in FIBO. Note that the
    examples included are a subset of the DJIA, not the entire set of companies, and the content may be dated. There is no
    guarantee that the content is current.
