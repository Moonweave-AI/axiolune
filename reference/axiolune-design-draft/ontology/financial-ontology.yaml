    properties:
      fundType: {type: string}
  Index:
    domain: instruments-markets
    interfaces: [Identified, EffectiveDated, Sourced]
    implements: [Instrument]
    properties:
      methodologyVersion: {type: string}
  FutureContract:
    domain: instruments-markets
    interfaces: [Identified, EffectiveDated, Sourced]
