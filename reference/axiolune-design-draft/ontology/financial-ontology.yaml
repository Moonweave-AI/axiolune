      timeZone: {type: string}
  TradingCalendar:
    domain: instruments-markets
    interfaces: [Identified, Versioned, Sourced]
    properties:
      market: {type: string}
      timeZone: {type: string}
  TradingSession:
    domain: instruments-markets
    interfaces: [Identified, EffectiveDated]
    properties:
      sessionType: {type: string}
