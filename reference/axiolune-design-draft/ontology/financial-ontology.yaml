ontology:
  id: finance-platform
  title: 金融本体驱动平台
  version: 1.0.0
  status: proposed
  releasedOn: "2026-07-27"
  defaultTimeZone: Asia/Shanghai
  designRules:
    - canonical identity is separated from source identifiers
    - business valid time and system transaction time are explicit
    - actions are business verbs with policy and audit
    - graph search vector and OLAP stores are rebuildable projections
    - every derived result references inputs and function or model version
    - environment is mandatory for transactional objects

valueTypes:
  CanonicalId:
    base: string
    pattern: "^[a-z][a-z0-9_-]{2,127}$"
  ExternalId:
    base: string
    maxLength: 256
  CorrelationId:
    base: string
    format: uuid
  IdempotencyKey:
    base: string
    minLength: 16
    maxLength: 128
  ISIN:
    base: string
    pattern: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
  CurrencyCode:
    base: string
    pattern: "^[A-Z]{3}$"
  MIC:
    base: string
    pattern: "^[A-Z0-9]{4}$"
  BusinessDate:
    base: string
    format: date
  Instant:
    base: string
    format: date-time
  Percentage:
    base: decimal
    precision: 18
    scale: 10
    unit: ratio
  BasisPoints:
    base: decimal
    precision: 18
    scale: 6
    unit: bp
  Quantity:
    base: decimal
    precision: 30
    scale: 10
  Price:
    base: decimal
    precision: 30
    scale: 12
  Money:
    base: struct
    fields:
      amount: {type: decimal, precision: 30, scale: 8}
      currency: {type: CurrencyCode}
  TimeRange:
    base: struct
    fields:
      from: {type: Instant}
      to: {type: Instant, nullable: true}
  EvidencePointer:
    base: struct
    fields:
      artifactId: {type: CanonicalId}
      locator: {type: string}
      hash: {type: string}
  DataClassification:
    base: enum
    values: [core, important, sensitive_general, ordinary_general]
  Environment:
    base: enum
    values: [development, test, simulation, staging, production]

interfaces:
  Identified:
    required: [id]
    properties:
      id: {type: CanonicalId}
      externalIds: {type: ExternalId, collection: true}
  EffectiveDated:
    required: [validFrom, recordedAt]
    properties:
      validFrom: {type: Instant}
      validTo: {type: Instant, nullable: true}
      recordedAt: {type: Instant}
      supersededAt: {type: Instant, nullable: true}
  Sourced:
    required: [sourceId]
    properties:
      sourceId: {type: CanonicalId}
      sourceRecordId: {type: ExternalId, nullable: true}
      observedAt: {type: Instant}
      ingestedAt: {type: Instant}
  Classified:
    required: [classification]
    properties:
      classification: {type: DataClassification}
      jurisdiction: {type: string, collection: true}
  Versioned:
    required: [version]
    properties:
      version: {type: string}
      lifecycleState: {type: string}
  Approvable:
    properties:
      approvalState: {type: string}
      approvalPolicyId: {type: CanonicalId, nullable: true}
  Evidenced:
    properties:
      evidenceIds: {type: CanonicalId, collection: true}
      qualityState: {type: string}
  EnvironmentScoped:
    required: [environment]
    properties:
      environment: {type: Environment}

domains:
  - id: organization-access
    owner: Identity and Security
  - id: parties
    owner: Master Data
  - id: instruments-markets
    owner: Market Data
  - id: products-accounts
    owner: Product Operations
  - id: portfolios-positions
    owner: Investment Operations
  - id: research-factors
    owner: Research Platform
  - id: orders-execution
    owner: Trading Engineering
  - id: risk-compliance
    owner: Risk and Compliance
  - id: companies-events
    owner: Research Data
  - id: information-evidence
    owner: Data Governance
  - id: product-business
    owner: Business Operations
  - id: platform-governance
    owner: Platform Engineering

objectTypes:
  Tenant:
    domain: organization-access
    interfaces: [Identified, EffectiveDated, Classified]
    properties:
      name: {type: string, required: true}
      status: {type: string, required: true}
  OrganizationUnit:
    domain: organization-access
    interfaces: [Identified, EffectiveDated]
    properties:
      name: {type: string, required: true}
      unitType: {type: string, required: true}
  Subject:
    domain: organization-access
    interfaces: [Identified, EffectiveDated]
    abstract: true
    properties:
      displayName: {type: string, required: true}
      subjectType: {type: string, required: true}
  Person:
    domain: organization-access
    interfaces: [Identified, EffectiveDated, Classified]
    implements: [Subject]
    properties:
      employeeRef: {type: ExternalId, nullable: true}
      status: {type: string}
  ServiceIdentity:
    domain: organization-access
    interfaces: [Identified, EffectiveDated]
    implements: [Subject]
    properties:
      workload: {type: string}
      credentialRef: {type: string, description: secret-manager reference only}
  Entitlement:
    domain: organization-access
    interfaces: [Identified, EffectiveDated, Approvable, Evidenced]
    properties:
      resourceScope: {type: string, required: true}
      allowedActions: {type: string, collection: true}
      purpose: {type: string, required: true}
  Delegation:
    domain: organization-access
    interfaces: [Identified, EffectiveDated, Approvable]
    properties:
      actionScope: {type: string, collection: true}
      justification: {type: string, required: true}
  Party:
    domain: parties
    interfaces: [Identified, EffectiveDated, Sourced, Classified, Evidenced]
    abstract: true
    properties:
      legalName: {type: string, required: true}
      partyType: {type: string, required: true}
      status: {type: string, required: true}
  LegalEntity:
    domain: parties
    interfaces: [Identified, EffectiveDated, Sourced, Classified, Evidenced]
    implements: [Party]
    properties:
      lei: {type: string, nullable: true}
      countryOfIncorporation: {type: string, nullable: true}
  Issuer:
    domain: parties
    interfaces: [Identified, EffectiveDated, Sourced, Evidenced]
    implements: [Party]
    properties:
      issuerCategory: {type: string}
  Broker:
    domain: parties
    interfaces: [Identified, EffectiveDated, Sourced, Classified]
    implements: [Party]
    properties:
      regulatoryStatus: {type: string}
  Client:
    domain: parties
    interfaces: [Identified, EffectiveDated, Sourced, Classified, Evidenced]
    implements: [Party]
    properties:
      riskRating: {type: string, nullable: true}
      suitabilityProfileId: {type: CanonicalId, nullable: true}
  Instrument:
    domain: instruments-markets
    interfaces: [Identified, EffectiveDated, Sourced, Classified, Evidenced]
    abstract: true
    properties:
      name: {type: string, required: true}
      symbol: {type: string, required: true}
      instrumentType: {type: string, required: true}
      currency: {type: CurrencyCode, required: true}
      pricePrecision: {type: integer}
      lotSize: {type: Quantity}
      tradingStatus: {type: string}
  Equity:
    domain: instruments-markets
    interfaces: [Identified, EffectiveDated, Sourced, Classified, Evidenced]
    implements: [Instrument]
    properties:
      isin: {type: ISIN, nullable: true}
      shareClass: {type: string, nullable: true}
  FundInstrument:
    domain: instruments-markets
    interfaces: [Identified, EffectiveDated, Sourced, Classified]
