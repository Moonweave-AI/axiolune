linkTypes:
  memberOf: {from: Subject, to: OrganizationUnit, cardinality: many-to-many, temporal: true}
  entitledBy: {from: Subject, to: Entitlement, cardinality: one-to-many, temporal: true}
  delegationFrom: {from: Delegation, to: Subject, cardinality: many-to-one, temporal: true}
  delegationTo: {from: Delegation, to: Subject, cardinality: many-to-one, temporal: true}
  issuedBy: {from: Instrument, to: Issuer, cardinality: many-to-one, temporal: true}
  tradedOn: {from: Instrument, to: Venue, cardinality: many-to-many, temporal: true}
  classifiedAs: {from: Instrument, to: ClassificationMembership, cardinality: one-to-many, temporal: true, evidenced: true}
  underlying: {from: Instrument, to: Instrument, cardinality: many-to-many, temporal: true}
  productHasPortfolio: {from: FundProduct, to: Portfolio, cardinality: one-to-many, temporal: true}
  productGovernedBy: {from: FundProduct, to: Mandate, cardinality: many-to-one, temporal: true}
  productAuthorizedForAccount: {from: FundProduct, to: TradingAccount, cardinality: many-to-many, temporal: true, approvalRequired: true}
  assetUnitBelongsToAccount: {from: AssetUnit, to: TradingAccount, cardinality: many-to-one, temporal: true}
  accountConnectedViaGateway: {from: TradingAccount, to: Gateway, cardinality: many-to-many, temporal: true}
  portfolioHasPosition: {from: Portfolio, to: Position, cardinality: one-to-many, temporal: false}
  positionInInstrument: {from: Position, to: Instrument, cardinality: many-to-one, temporal: false}
  portfolioHasTarget: {from: Portfolio, to: TargetPosition, cardinality: one-to-many, temporal: true}
  targetForInstrument: {from: TargetPosition, to: Instrument, cardinality: many-to-one, temporal: true}
  factorHasVersion: {from: FactorDefinition, to: FactorVersion, cardinality: one-to-many, temporal: false}
  researchUsesSnapshot: {from: ResearchRun, to: DatasetSnapshot, cardinality: many-to-many, immutable: true}
  backtestUsesFactor: {from: BacktestRun, to: FactorVersion, cardinality: many-to-many, immutable: true}
  recommendationTargets: {from: Recommendation, to: Instrument, cardinality: many-to-many, temporal: true}
  intentUsesPortfolio: {from: OrderIntent, to: Portfolio, cardinality: many-to-one, immutable: true}
  orderImplementsIntent: {from: ParentOrder, to: OrderIntent, cardinality: many-to-one, immutable: true}
  orderUsesAccount: {from: ParentOrder, to: TradingAccount, cardinality: many-to-one, immutable: true}
  orderForInstrument: {from: ParentOrder, to: Instrument, cardinality: many-to-one, immutable: true}
  parentHasChild: {from: ParentOrder, to: ChildOrder, cardinality: one-to-many, immutable: true}
  childHasExecution: {from: ChildOrder, to: Execution, cardinality: one-to-many, immutable: true}
  orderUsesAlgo: {from: ParentOrder, to: AlgoDefinition, cardinality: many-to-one, immutable: true}
  tcaEvaluatesOrder: {from: TCAResult, to: ParentOrder, cardinality: many-to-one, immutable: true}
  assessmentUsesRule: {from: RiskAssessment, to: RiskRule, cardinality: many-to-many, immutable: true}
  assessmentUsesLimit: {from: RiskAssessment, to: Limit, cardinality: many-to-many, immutable: true}
  alertFromAssessment: {from: RiskAlert, to: RiskAssessment, cardinality: many-to-many, immutable: true}
  exceptionOverridesRule: {from: RiskException, to: RiskRule, cardinality: many-to-one, temporal: true, approvalRequired: true}
  borrowForInstrument: {from: BorrowAvailability, to: Instrument, cardinality: many-to-one, temporal: true}
  reportForIssuer: {from: FinancialReport, to: Issuer, cardinality: many-to-one, temporal: true}
  estimateForIssuer: {from: ConsensusEstimate, to: Issuer, cardinality: many-to-one, temporal: true}
  documentHasFragment: {from: Document, to: EvidenceFragment, cardinality: one-to-many, immutable: true}
  claimSupportedBy: {from: Claim, to: EvidenceFragment, cardinality: many-to-many, immutable: true}
  snapshotOfAsset: {from: DatasetSnapshot, to: DataAsset, cardinality: many-to-one, immutable: true}
  actionExecutedBy: {from: ActionRun, to: Subject, cardinality: many-to-one, immutable: true}
  approvalApprovesAction: {from: ApprovalTask, to: ActionRun, cardinality: many-to-one, immutable: true}
  agentUsedTool: {from: AgentRun, to: ToolCall, cardinality: one-to-many, immutable: true}

actionTypes:
  SubmitOrder:
    version: 1.0.0
    input: [OrderIntent, IdempotencyKey]
    creates: [ParentOrder, ActionRun]
    policies: [order-write, pre-trade-risk, maker-checker-threshold]
    externalEffect: trading-gateway
    compensation: CancelOrder
  CancelOrder:
    version: 1.0.0
    input: [ParentOrder, IdempotencyKey]
    updates: [ParentOrder]
    policies: [order-write, valid-order-transition]
    externalEffect: trading-gateway
  ApproveRiskException:
    version: 1.0.0
    input: [RiskException, IdempotencyKey]
    updates: [RiskException]
    creates: [ApprovalTask, ActionRun]
    policies: [risk-approver, maker-checker]
  ResolveReconciliationBreak:
    version: 1.0.0
    input: [ReconciliationBreak, string, IdempotencyKey]
    updates: [ReconciliationBreak]
    policies: [operations-write, evidence-required]
  PublishFactorVersion:
    version: 1.0.0
    input: [FactorVersion, IdempotencyKey]
    updates: [FactorVersion]
    creates: [ApprovalTask, ActionRun]
    policies: [research-reviewer, reproducibility-gate]
  PublishReport:
    version: 1.0.0
    input: [ReportRun, IdempotencyKey]
    updates: [ReportRun]
    policies: [report-publisher, evidence-required, maker-checker]
  GrantEntitlement:
    version: 1.0.0
    input: [Entitlement, IdempotencyKey]
    creates: [ApprovalTask, ActionRun]
    updates: [Entitlement]
    policies: [access-governance, separation-of-duties]
  ActivateKillSwitch:
    version: 1.0.0
    input: [Gateway, string, IdempotencyKey]
    updates: [Gateway]
    creates: [ActionRun]
    policies: [emergency-control]
    externalEffect: gateway-control
  MergeOntologyRelease:
    version: 1.0.0
    input: [OntologyRelease, IdempotencyKey]
    updates: [OntologyRelease]
    policies: [ontology-owner, compatibility-gate, security-diff-gate]

functionTypes:
  ResolveIdentity:
    version: 1.0.0
    inputs: [Source, ExternalId]
    output: {type: CanonicalId}
    deterministic: true
  BuildPointInTimeUniverse:
    version: 1.0.0
    inputs: [BusinessDate, string]
    output: {type: CanonicalId, collection: true}
    deterministic: true
  ComputeFactor:
    version: 1.0.0
    inputs: [FactorVersion, DatasetSnapshot]
    output: {type: DataAsset}
    deterministic: true
  RunBacktest:
    version: 1.0.0
    inputs: [BacktestRun]
    output: {type: BacktestRun}
    deterministic: true
  ComputePreTradeRisk:
    version: 1.0.0
    inputs: [OrderIntent, Portfolio, Limit]
    output: {type: RiskAssessment}
    deterministic: true
  ComputeTCA:
    version: 1.0.0
    inputs: [ParentOrder, Execution]
    output: {type: TCAResult}
    deterministic: true
  ComputeNAV:
    version: 1.0.0
    inputs: [Portfolio, Position, DatasetSnapshot]
    output: {type: NAVObservation}
    deterministic: true
  RetrieveEvidence:
    version: 1.0.0
    inputs: [string, Subject]
    output: {type: EvidenceFragment, collection: true}
    securityTrimmed: true
  ExtractClaims:
    version: 1.0.0
    inputs: [Document, ModelVersion]
    output: {type: Claim, collection: true}
    humanReviewRequired: conditional

policies:
  order-write:
    effect: allow
    conditions:
      - subject has active entitlement for account and action
      - subject purpose permits trading
      - object environment equals request environment
  pre-trade-risk:
    effect: deny-unless
    conditions:
      - current deterministic RiskAssessment decision is allow
      - market data and limits satisfy freshness policy
  maker-checker:
    effect: deny-unless
    conditions:
      - maker differs from every checker
      - required approvals are complete
  maker-checker-threshold:
    effect: conditional
    conditions:
      - dual approval is required above configured amount or risk threshold
  evidence-required:
    effect: deny-unless
    conditions:
      - at least one accessible immutable evidence pointer exists
  separation-of-duties:
    effect: deny-unless
    conditions:
      - requester cannot approve own privileged access
  agent-action:
    effect: deny-unless
    conditions:
      - tool is on allowlist
      - delegated scope is no broader than user scope
      - high risk action has deterministic validation and human approval
  export-control:
    effect: deny-unless
    conditions:
      - purpose and destination are approved
      - row property and evidence policies are applied to export
      - export is watermarked logged and expires

invariants:
  - id: order-context
    expression: ParentOrder.environment and ParentOrder.account and ParentOrder.instrument and ParentOrder.side are present
  - id: execution-parent
    expression: Execution links to one ChildOrder or is explicitly classified as unmatched
  - id: immutable-ledger-events
    expression: order execution and audit events are amended or reversed, never overwritten
  - id: reproducible-factor
    expression: a published FactorVersion links to snapshots, code digest, parameters, tests and approval
  - id: exception-expiry
    expression: an active RiskException has rule, scope, evidence, approval and future expiresAt
  - id: action-audit
    expression: every ActionRun has actor, type version, idempotency key, correlation id, policy decision and before/after references
  - id: projection-as-of
    expression: graph search vector and OLAP responses expose source offset or asOf time
