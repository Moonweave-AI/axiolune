module: fin-risk
version: 1.1.0
alignments:
  - targetIri: BIAN::RiskAndCompliance::RiskManagement
    relation: skos:closeMatch
    sourceRelease: BIAN
    rationale: Risk measure definitions and limit breaches map to BIAN risk management service domain controls.
    reviewStatus: accepted
    bibliographyRef: bian-local
  - targetIri: https://spec.edmcouncil.org/fibo/ontology/FND/Utilities/Analytics/Measurement
    relation: skos:closeMatch
    sourceRelease: FIBO 2026Q1
    rationale: RiskMeasurement separates measure definition from observed result per FIBO measurement pattern.
    reviewStatus: accepted
    bibliographyRef: fibo-local
  - targetIri: internal::ScenarioDefinition
    relation: skos:closeMatch
    sourceRelease: internal
    rationale: Stress scenario versioning is Axiolune-native with immutable shock parameters per CQ-R5 contract.
    reviewStatus: accepted
  - targetIri: internal::LimitBreach
    relation: skos:closeMatch
    sourceRelease: internal
    rationale: Limit breach facts bind measurements to limits with provenance evidence per M2-PLAN fin-risk scope.
    reviewStatus: accepted
  - targetIri: BCBS::239::RiskDataAggregation
    relation: skos:relatedMatch
    sourceRelease: BCBS 239
    rationale: RiskExposure, RiskScopeDefinition/RiskScopeSnapshot, and RiskReport calibrate to BCBS 239 risk-data aggregation and reporting principles; full aggregation infrastructure is out of scope.
    reviewStatus: accepted
    bibliographyRef: bcbs-239-local
  - targetIri: FSB::RiskAppetiteFramework
    relation: skos:relatedMatch
    sourceRelease: FSB
    rationale: RiskAppetite and RiskTolerance calibrate to the FSB Risk Appetite Framework (quantitative limits plus qualitative statements); terminology only, not a regulatory obligation.
    reviewStatus: accepted
    bibliographyRef: fsb-raf-local
  - targetIri: BCBS::StressTestingPrinciples
    relation: skos:relatedMatch
    sourceRelease: BCBS
    rationale: ScenarioDefinition (with ScenarioShock, narrative, baselineStateRef) and ScenarioApplicationEvidence calibrate to BCBS stress-testing principles (governance, scenario narrative, risk coverage, application); terminology only.
    reviewStatus: accepted
    bibliographyRef: bcbs-stress-local
  - targetIri: BCBS::MarketRiskFramework
    relation: skos:relatedMatch
    sourceRelease: BCBS
    rationale: RiskFactor, RiskDimension/BucketDefinition, and RiskLimitComparisonPolicy calibrate to the BCBS market-risk framework's factor/liquidity-horizon/sensitivity/bucket distinctions; FRTB rules are out of scope.
    reviewStatus: accepted
    bibliographyRef: bcbs-market-risk-local
  - targetIri: Fed::SR26-2::ModelRisk
    relation: skos:relatedMatch
    sourceRelease: US Federal Reserve
    rationale: RiskMeasureSpecification/CalculationProfile/ImplementationVersion and measurementStatus calibrate to US model-risk guidance (purpose, assumptions, validation, monitoring); US regulatory context only, not a global rule.
    reviewStatus: accepted
    bibliographyRef: fed-sr26-2-local
  - targetIri: BCBS::CreditRiskPrinciples
    relation: skos:relatedMatch
    sourceRelease: BCBS
    rationale: RiskCategory (credit) and the measure/monitor/control process calibrate to BCBS credit-risk principles; terminology only.
    reviewStatus: accepted
    bibliographyRef: bcbs-credit-local

