module: fin-market-data
version: 2.0.0
alignments:
  - targetIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/SecurityPrice
    relation: skos:closeMatch
    sourceRelease: FIBO 2026Q1
    rationale: PriceObservation extends FIBO SecurityPrice with ADR-012 three-axis temporal and provenance patterns.
    reviewStatus: accepted
    bibliographyRef: fibo-local
  - targetIri: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/InstrumentPricing/CollectionOfSecurityPrices
    relation: skos:closeMatch
    sourceRelease: FIBO 2026Q1
    rationale: Bar specifications and TradeBar/QuoteBar aggregates map to FIBO price collections while preserving OHLCV interval and bar-price-basis semantics.
    reviewStatus: accepted
    bibliographyRef: fibo-local
  - targetIri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Trade
    relation: skos:closeMatch
    sourceRelease: FIBO 2026Q1
    rationale: >-
      TradeObservation is a provider observation of a reported trade event, whereas FIBO Trade is a
      situation that realizes an agreement between parties in a voluntary exchange. The two are
      close matches because both describe trade facts, but they are not equivalent: TradeObservation
      is a market-data observation scoped to a provider stream and carries observation identity,
      ordering, and revision provenance, not the economic agreement itself.
    reviewStatus: accepted
    bibliographyRef: fibo-local
