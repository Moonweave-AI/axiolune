# fin-foundation Competency Questions
# Module: fin-foundation | Version: 2.0.0

cqs:
  - id: CQ-F1
    question: >-
      Given an ISIN and a LEI at a specified as-of time, does the issuer of the
      instrument identified by that ISIN correspond to the legal entity identified
      by that LEI?
    businessContext: Cross-identifier issuer resolution at a point in time
    scopeConstraints:
      - ISIN checksum and scheme binding must validate
      - LEI must identify a LegalEntity, not the instrument itself
      - ISIN identifies a financial instrument; LEI identifies its issuer
    expectedResult: >-
      The LegalEntity IRI referenced by the ISIN-identified instrument's issuer
      role matches the LEI-identified LegalEntity IRI, or explicit no-match with reason
    negativeExample: invalid ISIN checksum or LEI-instrument conflation rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      - https://axiolune.ai/ontology/finance/foundation/ISINValue
      - https://axiolune.ai/ontology/finance/foundation/LEIValue
      - https://axiolune.ai/ontology/finance/foundation/FinancialIdentifierAssignment
      - https://axiolune.ai/ontology/finance/foundation/LegalEntity
      - https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
    riskLevel: high
    status: active

  - id: CQ-F2
    question: >-
      What currencies are valid for a given jurisdiction at a given valid time,
      according to ISO 4217 registry entries and currency-usage facts?
    businessContext: Currency eligibility for accounts, listings, and valuations
    scopeConstraints:
      - ISO 4217 registry entry must be active at the as-of time
      - CurrencyUsage fact must cover the as-of valid time
    expectedResult: >-
      List of ISO 4217 currency codes whose registry entries are active and whose
      CurrencyUsage facts cover the jurisdiction at the as-of time
    negativeExample: expired, withdrawn, or unknown currency code rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/foundation/Currency
      - https://axiolune.ai/ontology/finance/foundation/Jurisdiction
      - https://axiolune.ai/ontology/finance/foundation/CurrencyUsage
      - https://axiolune.ai/ontology/finance/foundation/ISO4217RegistryEntry
    riskLevel: medium
    status: active

  - id: CQ-F3
    question: >-
      Is a given MIC code active at a specified as-of time, which trading venue
      does it identify, and what is its registry status?
    businessContext: Venue identification for routing and rule applicability
    scopeConstraints:
      - MIC must satisfy the ISO 10383 four-character lexical pattern
      - MIC registry entry must be active at the as-of time
    expectedResult: >-
      TradingVenue IRI with registry status (active/withdrawn) for the MIC at
      the as-of time
    negativeExample: expired, withdrawn, or malformed MIC rejected (ISO 10383 pattern)
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      - https://axiolune.ai/ontology/finance/foundation/MICValue
      - https://axiolune.ai/ontology/finance/market-structure/TradingVenue
    riskLevel: medium
    status: active

  - id: CQ-F4
    question: >-
      Can two identifier assignments for the same scheme and subject coexist without
      violating uniqueness scope?
    businessContext: Flights-style identity integrity — one canonical identifier per scheme scope
    expectedResult: conflict report or confirmed single active assignment
    negativeExample: duplicate active ISIN assignment for different instruments rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/foundation/FinancialIdentifierAssignment
      - https://axiolune.ai/ontology/finance/foundation/IdentifierScheme
      - https://axiolune.ai/ontology/finance/foundation/IdentifierAssignmentConflict
      - https://axiolune.ai/ontology/finance/foundation/IdentifierUniquenessScope
    testFixtures:
      - fixture: foundation-account-identity-positive
        expectedOutcome: single assignment
      - fixture: foundation-duplicate-isin-negative
        expectedOutcome: rejected
    riskLevel: high
    status: active
