# fin-market-data Competency Questions
# Module: fin-market-data | Version: 2.0.0

cqs:
  - id: CQ-MD1
    question: >-
      Given an instrument, a listing or OTC context, a price kind, and three-axis
      as-of timestamps (asOfValid, asOfKnowledge, asOfAvailable), what is the
      available price observation?
    scope: PIT price query with three-axis temporal semantics and quotation convention
    expectedResult: >-
      The unique PriceObservation satisfying all PIT conditions (validFrom <= asOfValid
      < effectiveValidTo, knowledgeFrom <= asOfKnowledge < effectiveKnowledgeTo,
      availableFrom <= asOfAvailable < effectiveAvailableTo), matching instrument,
      context, priceKind, and quotationConvention; or explicit 'no data available'
    negativeExamples:
      - data with availableFrom after asOfAvailable is rejected (future data leakage)
      - data with validFrom after asOfValid is rejected (not yet valid)
      - data with knowledgeFrom after asOfKnowledge is rejected (revision not yet known)
      - data with missing availableFrom is rejected (fail-closed per ADR-012)
      - interval inversion (validTo <= validFrom) is rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/PriceObservation
      - https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - https://axiolune.ai/ontology/meta/data-binding/PITValidationRequest
    riskLevel: high
    status: active

  - id: CQ-MD2
    question: >-
      Given an instrument, a market context, and a time interval [t_start, t_end),
      return all trade observations whose source-declared event time (observedAt)
      falls in that interval, with correct canonical ordering
    scope: temporal range query for trade observations
    expectedResult: >-
      All TradeObservation instances where observedAt is in [t_start, t_end), ordered
      by (observedAt, versionOf(observationStream), sourceOrderKey, sourceTradeId)
      ascending, with provenance (source, revision) for each
    negativeExamples:
      - observations outside the interval are excluded
      - observations with missing observedAt are rejected
      - observations with inverted intervals (validTo < validFrom) are rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/TradeObservation
      - https://axiolune.ai/ontology/meta/patterns/TemporalFact
    riskLevel: medium
    status: active

  - id: CQ-MD3
    question: >-
      When a price observation is revised (knowledge-time changes), can historical
      queries with fixed asOfKnowledge still reproduce the original result?
    scope: revision tracking and reproducibility
    expectedResult: >-
      Query with asOfKnowledge = T1 returns version V1; after revision at T2, query
      with asOfKnowledge = T1 still returns V1, and query with asOfKnowledge = T2
      returns V2; the revision chain is traceable via supersedes
    negativeExamples:
      - revision overwrites history without preserving old version (fails reproducibility)
      - knowledge-time not recorded (cannot distinguish versions)
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/PriceObservation
      - https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    riskLevel: high
    status: active

  - id: CQ-MD4
    question: >-
      Given a QuoteObservation (complete paired top-of-book L1 snapshot), are both
      bid and ask present with non-negative sizes?
    scope: quote observation structural constraint
    expectedResult: >-
      Returns the QuoteObservation if bidPrice, bidSize, askPrice, askSize are all
      present and bidSize/askSize >= 0; rejects if any of the four fields is missing
    negativeExamples:
      - quote with missing bidPrice or askPrice is rejected
      - quote with negative bidSize or askSize is rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/QuoteObservation
    riskLevel: low
    status: active

  - id: CQ-MD5
    question: >-
      Given a TradeBar or QuoteBar, does it satisfy OHLC ordering (Low <= Open/Close
      <= High) and valid bar specification?
    scope: bar data integrity constraint
    expectedResult: >-
      Returns valid bar if tradeLowPrice <= tradeOpenPrice <= tradeHighPrice and
      tradeLowPrice <= tradeClosePrice <= tradeHighPrice (for TradeBar), or
      bidLowPrice <= bidOpenPrice <= bidHighPrice and bidLowPrice <= bidClosePrice
      <= bidHighPrice (and ask side) for QuoteBar; rejects otherwise
    negativeExamples:
      - bar with Open > High is rejected
      - bar with Close < Low is rejected
      - bar with Low > High is rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/TradeBar
      - https://axiolune.ai/ontology/finance/market-data/QuoteBar
      - https://axiolune.ai/ontology/finance/market-data/BarSpecification
    riskLevel: medium
    status: active

  - id: CQ-MD6
    question: >-
      Can I retrieve the data source stream, provider observation identifier,
      and revision chain for a given observation?
    scope: provenance and audit trail
    expectedResult: >-
      Returns the MarketDataStream (provider, purpose, revision policy),
      providerObservationId, sourceOrderKey, and revision chain (sourceRevisionToken,
      sourceRevisionOrder, supersedes) for the observation
    negativeExamples:
      - observation without source provenance is rejected or flagged as unverified
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/MarketDataStream
      - https://axiolune.ai/ontology/finance/market-data/PriceObservation
      - https://axiolune.ai/ontology/meta/patterns/ProvenancedFact
    riskLevel: medium
    status: active

  - id: CQ-MD7
    question: >-
      Given an instrument, a market context, and a timestamp T, return the most
      recent close price observation whose three-axis PIT intervals contain T
    scope: last-known price query for valuation
    expectedResult: >-
      The PriceObservation with priceKind = close, satisfying validFrom <= T <
      effectiveValidTo, knowledgeFrom <= asOfKnowledge < effectiveKnowledgeTo,
      availableFrom <= asOfAvailable < effectiveAvailableTo, with max(validFrom)
    negativeExamples:
      - price with availableFrom > T is excluded (not yet available)
      - price with validFrom >= T is excluded (future price)
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/market-data/PriceObservation
      - https://axiolune.ai/ontology/meta/patterns/TemporalFact
      - https://axiolune.ai/ontology/meta/data-binding/PITValidationRequest
    riskLevel: high
    status: active
