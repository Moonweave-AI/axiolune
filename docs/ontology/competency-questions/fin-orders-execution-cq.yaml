# fin-orders-execution Competency Questions (CQ)
# M2-PLAN §6.3: Slice B order lifecycle CQ with state machine validation
# v1.1.0 (ADR-025): CQ-OE1..OE10 retained; CQ-OE11..OE17 added for the P0/P1
# architecture revision (identity authority, internal-vs-external event,
# event-execution-cumulative loop, bilateral disclosure, venue-neutral routing,
# allocation, cancel/replace chain). New-type fixture staging is SME-gated
# (OE-A7/A9/A10 follow-ups); probes report honestly — pass for structurally
# verifiable contract guarantees, pending where staging is not yet present.

cqs:
  - id: "CQ-OE1"
    question: "Given an order intent ID, what is the complete lifecycle event sequence in temporal order?"
    scope: "Order lifecycle audit trail"
    expectedResult: "returns all OrderLifecycleEvent instances for the order, ordered by validFrom (or knowledgeFrom if validFrom identical), showing state transitions: Initialized �?Submitted �?Accepted �?PartiallyFilled �?Filled (or other terminal states)"
    negativeExamples:
      - "events out of temporal order are flagged"
      - "events with invalid state transitions (e.g., Initialized �?Filled without Accepted) are rejected"
      - "events with missing previousState (except Initialized) are rejected"
    dependsOn: ["OrderIntent", "OrderLifecycleEvent", "TemporalFact"]
    riskLevel: "high"
    status: active
    note: "Core audit trail query. Event-sourced design per nautilus_trader. State machine validation ensures no invalid transitions."

  - id: "CQ-OE2"
    question: "Given an order intent, was the order accepted by the venue, and if so, what is the external order ID?"
    scope: "Order acceptance and external ID lookup"
    expectedResult: "returns the OrderLifecycleEvent with state=Accepted and the hasExternalOrderId value, or returns explicit 'not accepted' if no Accepted event exists"
    negativeExamples:
      - "order in Initialized or Submitted state returns 'not accepted'"
      - "order in Rejected state returns 'rejected, no external ID'"
    dependsOn: ["OrderIntent", "OrderLifecycleEvent", "OrderLifecycleState"]
    riskLevel: "medium"
    status: active
    note: "Critical for order tracking and reconciliation with venue systems."

  - id: "CQ-OE3"
    question: "Given an order intent, what is the total executed quantity and average execution price?"
    scope: "Order fill summary and execution aggregation"
    expectedResult: "returns sum of all Execution.hasExecutionQuantity for the order, and weighted average of Execution.hasExecutionPrice by quantity, or returns 'no executions' if no Execution facts exist"
    negativeExamples:
      - "order with no executions returns zero quantity"
      - "order with PartiallyFilled state but no Execution facts is flagged as inconsistent"
    dependsOn: ["OrderIntent", "Execution", "OrderLifecycleEvent"]
    riskLevel: "high"
    status: active
    note: "Enables position derivation from execution stream. M2-PLAN §6.3: Execution �?Position derivation."

  - id: "CQ-OE4"
    question: "Given an execution, can I trace back to the originating order intent and its lifecycle events?"
    scope: "Execution-to-order traceability"
    expectedResult: "returns the OrderIntent via Execution.executesOrder relation, and all OrderLifecycleEvent instances for that order, forming complete audit chain"
    negativeExamples:
      - "execution with no executesOrder relation is rejected (orphaned execution)"
      - "execution for order with no lifecycle events is flagged as incomplete"
    dependsOn: ["Execution", "OrderIntent", "OrderLifecycleEvent"]
    riskLevel: "high"
    status: active
    note: "Critical for trade reconciliation and audit. Analogous to CQ-S4 price-to-valuation traceability."

  - id: "CQ-OE5"
    question: "Given a venue and external status code, what is the canonical lifecycle state?"
    scope: "External status mapping lookup"
    expectedResult: "returns the ExternalOrderStatusMapping.hasCanonicalState for the given venue and external status, with mapping valid time and provenance"
    negativeExamples:
      - "unknown external status code returns 'no mapping found'"
      - "mapping outside valid time range is excluded"
      - "mapping with missing provenance is rejected"
    dependsOn: ["ExternalOrderStatusMapping", "TradingVenue", "OrderLifecycleState"]
    riskLevel: "medium"
    status: active
    note: "M2-PLAN §5.2: ExternalOrderStatusMapping bridges venue codes to canonical states. Each venue has its own mapping set."

  - id: "CQ-OE6"
    question: "Given an order intent, are all state transitions valid according to the canonical state machine?"
    scope: "State machine validation"
    expectedResult: "validates that each OrderLifecycleEvent.previousState matches the prior event's lifecycleState, and that transitions follow valid paths (e.g., Initialized→Submitted→Accepted, not Initialized→Filled)"
    negativeExamples:
      - "Initialized �?Filled without intermediate Accepted is rejected"
      - "Filled �?PartiallyFilled (backward transition) is rejected"
      - "Canceled �?Accepted (terminal to active) is rejected"
      - "event with previousState mismatch is rejected"
    dependsOn: ["OrderLifecycleEvent", "OrderLifecycleState"]
    riskLevel: "high"
    status: active
    note: "State machine constraint per M2-PLAN §6.3. Valid transitions: Initialized→{Submitted,Rejected}, Submitted→{Accepted,Rejected}, Accepted→{PartiallyFilled,Filled,Canceled,Expired}, PartiallyFilled→{Filled,Canceled}. Terminal states: Filled, Canceled, Rejected, Expired."
    sparqlPattern: |
      # Pseudo-SPARQL for state machine validation
      SELECT ?event ?state ?prevState ?priorEventState
      WHERE {
        ?event a fin-orders:OrderLifecycleEvent ;
               fin-orders:transitionsOrder ?order ;
               fin-orders:hasLifecycleState ?state ;
               fin-orders:hasPreviousState ?prevState ;
               m3:validFrom ?eventTime .

        # Find prior event
        OPTIONAL {
          ?priorEvent a fin-orders:OrderLifecycleEvent ;
                      fin-orders:transitionsOrder ?order ;
                      fin-orders:hasLifecycleState ?priorEventState ;
                      m3:validFrom ?priorTime .
          FILTER(?priorTime < ?eventTime)
        }

        # Validate previousState matches priorEventState
        FILTER(?prevState = ?priorEventState || !BOUND(?priorEvent))
      }

  - id: "CQ-OE7"
    question: "Given an execution, what was the commission and liquidity side, and how does it impact position cost basis?"
    scope: "Execution cost breakdown and position derivation"
    expectedResult: "returns Execution.hasCommission, Execution.hasLiquiditySide, Execution.hasExecutionPrice, and Execution.hasExecutionQuantity, enabling cost basis calculation: costBasis = (executionPrice × executionQuantity) + commission"
    negativeExamples:
      - "execution with missing commission is flagged (or assumed zero with warning)"
      - "execution with missing liquidity side is noted (some venues don't report)"
    dependsOn: ["Execution", "LiquiditySide"]
    riskLevel: "medium"
    status: active
    note: "Enables accurate position cost basis tracking. M2-PLAN §6.3: Execution �?Position derivation."

  - id: "CQ-OE8"
    question: "Can historical order lifecycle queries at a fixed knowledge-time reproduce past order states?"
    scope: "Knowledge-time reproducibility for order events"
    expectedResult: "query with asOfKnowledge = T1 returns order state as known at T1; after event revision at T2, query with asOfKnowledge = T1 still returns original state, and query with asOfKnowledge = T2 returns revised state"
    negativeExamples:
      - "revision overwrites history without preserving old version (fails reproducibility)"
      - "knowledge-time not recorded (cannot distinguish versions)"
    dependsOn: ["OrderLifecycleEvent", "TemporalFact"]
    riskLevel: "high"
    status: active
    note: "Analogous to CQ-S5 for market data. Critical for order reconciliation and dispute resolution."

  - id: "CQ-OE9"
    question: "Given a time window and venue, return all executions with their order intents and instruments"
    scope: "Execution query with denormalized context"
    expectedResult: "returns all Execution instances where validFrom in [t_start, t_end) and executedAtVenue = venue, joined with executedInstrument and executesOrder, providing complete execution context for reporting"
    negativeExamples:
      - "executions outside time window are excluded"
      - "executions with missing temporal fields are rejected"
      - "executions with missing executesOrder or executedInstrument are flagged as incomplete"
    dependsOn: ["Execution", "OrderIntent", "FinancialInstrument", "TradingVenue"]
    riskLevel: "medium"
    status: active
    note: "Common reporting query for trade blotter and execution analysis."

  - id: "CQ-OE10"
    question: "Can out-of-order or duplicate lifecycle events be detected and reconciled?"
    scope: "Event reconciliation and idempotency"
    expectedResult: "duplicate events (same order, same state, same timestamp, same external ID) are detected and deduplicated; out-of-order events (validFrom earlier than latest event, but knowledgeFrom later) are flagged for reconciliation via OrderLifecycleEvent.reconciliation field"
    negativeExamples:
      - "duplicate events with different state or timestamp are rejected as conflicting"
      - "out-of-order events silently rewrite history without reconciliation flag"
    dependsOn: ["OrderLifecycleEvent", "TemporalFact", "ProvenancedFact"]
    riskLevel: "high"
    status: active
    note: "M2-PLAN §6.3: handles out-of-order, duplicates, missing acknowledgments. Nautilus_trader OrderEvent.reconciliation field."

  # --- v1.1.0 (ADR-025) additions: P0/P1 architecture revision CQs ---

  - id: "CQ-OE11"
    question: "Given two strategies using the same clientIntentId, can they be distinguished as distinct order intents?"
    scope: "Identity authority disambiguation (P0-01)"
    expectedResult: "returns distinct OrderIntent facts keyed by (intentIdentifierAuthority, clientIntentId); two intents with the same clientIntentId under different authorities are not conflated; an intent without intentIssuer or intentIdentifierAuthority is rejected by OrderIntentContract"
    negativeExamples:
      - "an intent using clientIntentId alone (no authority) is rejected as having no real logical key"
      - "an account substituted for intentIssuer or intentIdentifierAuthority is rejected"
    dependsOn: ["OrderIntent", "OrderIntentContract", "intentIssuer", "intentIdentifierAuthority"]
    riskLevel: "high"
    status: active
    note: "ADR-025 D1 (OE-A1). FIX does not assume a single global ClOrdID namespace; authority scoping prevents cross-strategy collision."

  - id: "CQ-OE12"
    question: "Can a pre-submission internal lifecycle event (Initialized/Denied/Emulated/Released) be recorded without a provider order or event stream?"
    scope: "Internal vs external lifecycle event separation (P0-02)"
    expectedResult: "an OrderIntentLifecycleEvent binds only an OrderIntent and an intentEventEmitter and carries no providerEventId, sourceOrderKey, rawProviderStatusCode, appliedStatusMapping, or appliedTransitionProfile; an external OrderLifecycleEvent that omits its ExternalOrder/OrderEventStream binding is rejected"
    negativeExamples:
      - "an internal event carrying a providerEventId or appliedStatusMapping is rejected by OrderIntentLifecycleEventContract"
      - "an external event using an internal-only event kind (Initialized/Denied/Emulated/Released) without an external order is rejected"
    dependsOn: ["OrderIntentLifecycleEvent", "OrderLifecycleEvent", "OrderIntentLifecycleEventContract"]
    riskLevel: "high"
    status: active
    note: "ADR-025 D2 (OE-A2). Pre-submission intents cannot honestly own a provider order or provider event."

  - id: "CQ-OE13"
    question: "Given a fill-kind lifecycle event, can Filled/PartiallyFilled be audited against the effective net executed quantity without recomputation?"
    scope: "Event-execution-cumulative-quantity-state closed loop (P0-04)"
    expectedResult: "the event's FillSnapshot cumQty equals the sum of executionQuantity over the stream's executions for that order up to and including the reported execution; leavesQty = orderQuantity - cumQty - cancelledQty and is non-negative; Filled iff leavesQty = 0; PartiallyFilled iff leavesQty > 0 and cumQty > 0; the event's reportsExecution points to the exact Execution it records"
    negativeExamples:
      - "a FillSnapshot whose cumQty disagrees with the summed executions is rejected by FillSnapshotConsistencyContract"
      - "a fill-kind event with no reportsExecution relation is flagged as breaking the closed loop"
    dependsOn: ["OrderLifecycleEvent", "FillSnapshot", "Execution", "reportsExecution", "FillSnapshotConsistencyContract"]
    riskLevel: "high"
    status: active
    note: "ADR-025 D4 (OE-A4). FIX ExecutionReport carries CumQty/LeavesQty/AvgPx; the snapshot makes the loop auditable rather than recomputed."

  - id: "CQ-OE14"
    question: "Can an anonymous order-book fill be recorded as a single-sided Execution without fabricating a counterparty?"
    scope: "Account-side fill vs bilateral disclosure (P0-05)"
    expectedResult: "an Execution with disclosureStatus=anonymous omits contraParty and contraAccount; a 'unknown Party'/'unknown Account' placeholder is forbidden; a MatchedTrade (when bilateral evidence suffices) requires matchedContraParty and matchedContraAccount and a disclosureStatus"
    negativeExamples:
      - "an anonymous Execution carrying a contraParty or contraAccount is rejected by ExecutionContract"
      - "a MatchedTrade missing matchedContraParty/matchedContraAccount, or using an 'unknown' placeholder, is rejected by MatchedTradeContract"
    dependsOn: ["Execution", "MatchedTrade", "disclosureStatus", "ExecutionContract", "MatchedTradeContract"]
    riskLevel: "high"
    status: active
    note: "ADR-025 D5 (OE-A5). FIX contra group is optional; bilateral facts are asserted only when evidence is sufficient."

  - id: "CQ-OE15"
    question: "Can a venue-neutral / SOR / broker-decides-venue intent produce multiple child external orders without binding a single listing or OTC context?"
    scope: "Venue-neutral routing (P0-08)"
    expectedResult: "an OrderIntent with an acceptableVenueSet (one or more TradingFacility) or a routingPolicy and no intentListing/intentOtcContext is admitted by OrderIntentRoutingPolicy; OrderRoute facts connect the parent intent to child ExternalOrders (or child intents) with routedQuantity, routeTime, routeStatus; the actual venue lands on the route/external-order/execution, not the intent"
    negativeExamples:
      - "an intent with no context binding at all (no listing/OTC, no acceptableVenueSet, no routingPolicy) is rejected"
      - "an intent mixing a single intentListing with an acceptableVenueSet is rejected (the three context modes are mutually exclusive)"
    dependsOn: ["OrderIntent", "OrderRoute", "acceptableVenueSet", "routingPolicy", "OrderIntentRoutingPolicy", "OrderRouteContract"]
    riskLevel: "high"
    status: active
    note: "ADR-025 D8 (OE-A8). SOR/best-execution/multi-child delegation without forcing a pre-acceptance single venue."

  - id: "CQ-OE16"
    question: "Can a single source execution be allocated across multiple target accounts with quantity conservation?"
    scope: "Post-execution allocation (P0-09)"
    expectedResult: "an ExecutionAllocation references one source Execution and one or more AllocationLines; the sum of AllocationLine.allocationQuantity equals the source executionQuantity (ExecutionAllocationConservationContract); executionAccount may differ from intentAccount when an allocation is present; detailed allocation/clearing semantics remain in post-trade-operations via a stable cross-module reference"
    negativeExamples:
      - "an ExecutionAllocation whose line quantities do not sum to the source executionQuantity is rejected"
      - "an ExecutionAllocation with no AllocationLine is rejected"
    dependsOn: ["ExecutionAllocation", "AllocationLine", "ExecutionAllocationConservationContract", "allocationTargetAccount"]
    riskLevel: "medium"
    status: active
    note: "ADR-025 D9 (OE-A9). Allocation boundary detail is SME-gated on post-trade-operations; v1.1.0 adds the stable scaffold with conservation."

  - id: "CQ-OE17"
    question: "Can a cancel/replace chain be expressed with distinct request IDs and previous/root order links rather than a single fixed order ID updated in place?"
    scope: "Cancel/replace chain (P1)"
    expectedResult: "an OrderRevision carries a revisionRequestId, revisionKind (replace/cancel/cancelReplace), optional previousOrder and rootOrder exact ExternalOrder versions, replacedTerms (present only for replace/cancelReplace), and priorityPreserved; the existing OrderEventKind/Updated is retained and does not conflate the chain"
    negativeExamples:
      - "an OrderRevision with revisionKind=cancel carrying replacedTerms is rejected by OrderRevisionContract"
      - "an OrderRevision missing revisionRequestId is rejected"
    dependsOn: ["OrderRevision", "OrderRevisionContract", "RevisionKind", "ExternalOrder"]
    riskLevel: "medium"
    status: active
    note: "ADR-025 D11. FIX uses ClOrdID/OrigClOrdID for the order chain, not a single mutable order ID."
