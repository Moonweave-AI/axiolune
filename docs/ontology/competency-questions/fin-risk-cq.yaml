# Axiolune M2 Risk Module — Competency Questions (stub)
# Status: draft

cqs:
  - id: CQ-R1
    question: 在指定三轴 as-of 下，某组合对某风险度量的敞口是多少？
    dependsOn:
      - https://axiolune.ai/ontology/finance/risk/ExposureObservation
    expected: 返回可追溯 ExposureObservation 或明确空结果
    negative: 缺 availableFrom 或使用未来知识的敞口必须被拒绝
    status: draft
  - id: CQ-R2
    question: 某敞口是否触发限额违例，依据哪条限额与证据？
    dependsOn:
      - https://axiolune.ai/ontology/finance/risk/LimitBreach
    expected: 返回 LimitBreach 到 limit/exposure/evidence 的链
    negative: 无证据或限额已失效的违例不得放行
    status: draft
