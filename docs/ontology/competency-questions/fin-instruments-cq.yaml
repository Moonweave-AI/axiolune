# fin-instruments Competency Questions
# Module: fin-instruments | Version: 2.0.0

cqs:
  - id: CQ-I1
    question: >-
      Given an ISIN at a specified as-of time, which financial instrument does it
      identify, and if that instrument is an issued security, who is its issuer?
    scope: instrument identification and conditional issuer resolution
    expectedResult: >-
      The FinancialInstrument IRI identified by the ISIN; if an InstrumentIssuance
      fact exists at the as-of time, the LegalEntity IRI of its issuer role; otherwise
      a not-applicable reason (e.g., referential instrument with no issuer)
    negativeExample: invalid ISIN checksum or ISIN with no registered instrument rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/foundation/ISINValue
      - https://axiolune.ai/ontology/finance/foundation/FinancialIdentifierAssignment
      - https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      - https://axiolune.ai/ontology/finance/instruments/InstrumentIssuance
      - https://axiolune.ai/ontology/finance/foundation/LegalEntity
    riskLevel: high
    status: active

  - id: CQ-I2
    question: >-
      On which trading facilities is a given instrument admitted to trading at a
      specified as-of time, and what are the active listing terms (venue, quote
      currency, tick size, lot size)?
    scope: cross-module listing lookup with market-rules terms
    expectedResult: >-
      A list of InstrumentListings whose business interval covers the as-of time,
      joined with their TradingFacility and listing quote currency from instruments,
      and tick size / lot size from fin-market-rules rule applicability at the as-of
      time
    negativeExample: delisted or suspended instrument returns empty list or explicitly marked delisted
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      - https://axiolune.ai/ontology/finance/instruments/InstrumentListing
      - https://axiolune.ai/ontology/finance/market-structure/TradingFacility
      - https://axiolune.ai/ontology/finance/market-rules/MarketRuleSet
      - https://axiolune.ai/ontology/finance/market-rules/RuleApplicability
    riskLevel: medium
    status: active

  - id: CQ-I3
    question: >-
      What is the type hierarchy of a given instrument (e.g., is AAPL an EquitySecurity,
      which is a Security, which is a FinancialInstrument), and what is its current CFI
      classification at a specified as-of time?
    scope: instrument type hierarchy and temporal classification
    expectedResult: >-
      The full superTypes chain from the concrete type to FinancialInstrument, plus
      the active InstrumentClassificationAssertion with its CFI code at the as-of time
    negativeExample: an instrument with a circular or broken superTypes chain rejected
    dependsOnElements:
      - https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
      - https://axiolune.ai/ontology/finance/instruments/Security
      - https://axiolune.ai/ontology/finance/instruments/EquitySecurity
      - https://axiolune.ai/ontology/finance/instruments/InstrumentClassificationAssertion
    riskLevel: medium
    status: active
