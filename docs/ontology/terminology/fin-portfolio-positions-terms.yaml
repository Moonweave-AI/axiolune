# Axiolune M2 Finance — Portfolio & Positions Terminology
# Module: fin-portfolio-positions
# Version: 0.1.0
# Standard: ISO 704:2022 (Terminology work — Principles and methods)
# Evidence sources: FIBO SEC/Portfolios, nautilus_trader, Lean

terms:
  - term: "Account"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/Account"
    definition: "financial account that serves as the unit of ownership, authorization, and accounting for trading activities and asset holdings"
    genus: "financial account"
    differentia:
      - "serves as unit of ownership"
      - "serves as unit of authorization"
      - "serves as unit of accounting for trading activities"
    excludes:
      - "a portfolio (which may span multiple accounts)"
      - "a legal entity (which may own multiple accounts)"
      - "an account statement or report"
    sources:
      - reference: "nautilus_trader"
        locator: "model/identifiers.pyx:Account"
        retrievalDate: "2026-07-30"
        note: "nautilus_trader defines Account as identifier for segregated account"
      - reference: "FIBO-2026Q1"
        locator: "FBC/ProductsAndServices/ClientsAndAccounts/Account"
        note: "FIBO Account is broader (banking/payments); Axiolune focuses on trading context"
    status: review

  - term: "Portfolio"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/Portfolio"
    definition: "collection of financial instruments and cash positions managed as a unit for investment objectives, performance tracking, or risk management"
    genus: "collection of financial instruments and cash positions"
    differentia:
      - "managed as a unit"
      - "for investment objectives"
      - "for performance tracking"
      - "for risk management"
    excludes:
      - "a single instrument or holding"
      - "an account (the ownership/custody container)"
      - "a strategy definition (the rule set)"
    sources:
      - reference: "FIBO-2026Q1"
        locator: "SEC/Portfolios/PortfolioManagement/Portfolio"
        retrievalDate: "2026-07-30"
        note: "FIBO defines Portfolio as collection of holdings; Axiolune aligns with this"
      - reference: "Lean"
        locator: "Algorithm/QCAlgorithm.Portfolio.cs"
        note: "Lean SecurityPortfolioManager tracks holdings and statistics"
    status: review

  - term: "Holding Snapshot"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/HoldingSnapshot"
    definition: "time-stamped observation of an account or portfolio's holding of a specific financial instrument at a point in time, with three-axis temporal semantics distinguishing the business effective time, knowledge time, and data availability time"
    genus: "time-stamped observation"
    differentia:
      - "of an account or portfolio's holding"
      - "of a specific financial instrument"
      - "with three-axis temporal semantics (valid/knowledge/availability)"
    excludes:
      - "the financial instrument itself"
      - "a position lot (more granular acquisition tracking)"
      - "a valuation (computed market value)"
      - "a transaction or execution that caused the holding"
    sources:
      - reference: "FIBO-2026Q1"
        locator: "SEC/Portfolios/PortfolioManagement/PortfolioHolding"
        retrievalDate: "2026-07-30"
        note: "FIBO PortfolioHolding exists but lacks three-axis temporal semantics"
      - reference: "nautilus_trader"
        locator: "model/position.pyx:Position"
        note: "nautilus_trader Position tracks quantity, side, realized/unrealized PnL"
      - reference: "ADR-012"
        locator: "docs/domain/decisions/ADR-012-three-axis-time.md"
        note: "Three-axis temporal semantics requirement"
    status: review

  - term: "Position Valuation"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/PositionValuation"
    definition: "time-stamped valuation of a holding that explicitly references the price observation used, the valuation method applied, and the resulting market value, enabling full traceability from price to valuation result"
    genus: "time-stamped valuation"
    differentia:
      - "of a holding"
      - "explicitly references the price observation used"
      - "specifies the valuation method applied"
      - "provides resulting market value"
      - "enables full traceability from price to valuation"
    excludes:
      - "the price observation itself"
      - "the holding snapshot (position without valuation)"
      - "a valuation rule or method definition"
      - "unrealized PnL calculated without explicit price reference"
    sources:
      - reference: "M2-PLAN"
        locator: "§6.1 Slice A, CQ-S4"
        retrievalDate: "2026-07-30"
        note: "CQ-S4 requires explicit price-to-valuation traceability"
      - reference: "Lean"
        locator: "Securities/SecurityHolding.cs"
        note: "Lean SecurityHolding tracks UnrealizedProfit, TotalMarketValue but doesn't make price reference explicit"
    status: review

  - term: "Position Lot"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/PositionLot"
    definition: "distinct acquisition or disposition of a specific quantity of an instrument, tracked separately for tax basis, holding period, or accounting purposes"
    genus: "distinct acquisition or disposition"
    differentia:
      - "of a specific quantity of an instrument"
      - "tracked separately for tax basis"
      - "tracked separately for holding period"
      - "tracked separately for accounting purposes"
    excludes:
      - "a holding snapshot (net position aggregate)"
      - "a transaction or execution record"
      - "a cost basis methodology"
    sources:
      - reference: "IRS-Publication-550"
        locator: "Basis of Investment Property"
        retrievalDate: "2026-07-30"
        note: "Tax lot tracking for capital gains calculation"
      - reference: "Lean"
        locator: "Securities/SecurityHolding.cs:Quantity"
        note: "Lean tracks aggregate position; lot tracking would be enhancement"
    status: review

  - term: "Position Side"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/PositionSide"
    definition: "controlled vocabulary indicating whether a position is long (owns the asset), short (owes the asset), or flat (no position)"
    genus: "controlled vocabulary"
    differentia:
      - "indicates long (owns the asset)"
      - "indicates short (owes the asset)"
      - "indicates flat (no position)"
    excludes:
      - "order side (buy/sell intent)"
      - "trade direction"
      - "quantity sign (positive/negative)"
    sources:
      - reference: "nautilus_trader"
        locator: "model/enums.pyx:PositionSide"
        retrievalDate: "2026-07-30"
        note: "nautilus_trader defines LONG/SHORT/FLAT as position states"
    status: review

  - term: "Valuation Method"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/ValuationMethod"
    definition: "controlled vocabulary of valuation methodologies including mark-to-market (current market price), mark-to-model (theoretical price), cost basis (original acquisition cost), and lower-of-cost-or-market"
    genus: "controlled vocabulary of valuation methodologies"
    differentia:
      - "includes mark-to-market (current market price)"
      - "includes mark-to-model (theoretical price)"
      - "includes cost basis (original acquisition cost)"
      - "includes lower-of-cost-or-market"
    excludes:
      - "a specific valuation result or amount"
      - "a pricing model or algorithm"
      - "an accounting standard (though may be driven by one)"
    sources:
      - reference: "FASB-ASC-820"
        locator: "Fair Value Measurement"
        retrievalDate: "2026-07-30"
        note: "Fair value measurement framework distinguishes market-based vs model-based valuation"
      - reference: "IAS-2"
        locator: "Inventories - lower of cost and net realizable value"
        note: "Lower-of-cost-or-market principle"
    status: review

  - term: "Account Type"
    canonicalIri: "https://axiolune.ai/ontology/finance/portfolio-positions/AccountType"
    definition: "controlled vocabulary of account categories including cash (no borrowing), margin (allows leverage), simulated (paper trading), managed (third-party discretion), and custodial"
    genus: "controlled vocabulary of account categories"
    differentia:
      - "includes cash (no borrowing allowed)"
      - "includes margin (leverage allowed)"
      - "includes simulated (paper trading)"
      - "includes managed (third-party discretion)"
      - "includes custodial"
    excludes:
      - "a specific account instance"
      - "account status (active/closed)"
      - "account ownership structure"
    sources:
      - reference: "nautilus_trader"
        locator: "model/enums.pyx:AccountType"
        retrievalDate: "2026-07-30"
        note: "nautilus_trader defines CASH/MARGIN account types"
      - reference: "Regulation-T"
        locator: "12 CFR 220"
        note: "Federal Reserve regulation distinguishing cash and margin accounts"
    status: review
