# fin-instruments — Terminology Cards

cards:
  - term: FinancialInstrument
    canonicalIri: https://axiolune.ai/ontology/finance/instruments/FinancialInstrument
    definition: >-
      written contract that gives rise to both a financial asset of one entity and a financial liability of another
      entity, as defined in IAS 32
    genus: written contract
    differentia:
      - gives rise to a financial asset and a financial liability
      - identified by a financial instrument identifier (e.g. ISIN)
      - may be negotiable or non-negotiable
    excludes:
      - physical commodities (not contracts)
      - services (not contracts)
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FinancialInstruments/FinancialInstruments/FinancialInstrument
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: Security
    canonicalIri: https://axiolune.ai/ontology/finance/instruments/Security
    definition: financial instrument that can be bought or sold, as defined in the Securities Exchange Act 1934
    genus: financial instrument
    differentia:
      - can be bought or sold
      - is legally recorded in a jurisdiction
    excludes:
      - non-tradable contracts
      - internal agreements
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FinancialInstruments/FinancialInstruments/Security
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: EquitySecurity
    canonicalIri: https://axiolune.ai/ontology/finance/instruments/EquitySecurity
    definition: financial instrument representing an ownership interest in an entity or pool of assets, as defined in ISO 10962
    genus: security
    differentia:
      - represents ownership interest
      - confers voting and dividend rights
    excludes:
      - debt instruments (represent claims, not ownership)
      - derivatives (derive from underlying, not direct ownership)
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FinancialInstruments/FinancialInstruments/EquityInstrument; SEC/Equities/EquityInstruments/Share
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: InstrumentListing
    canonicalIri: https://axiolune.ai/ontology/finance/instruments/InstrumentListing
    definition: >-
      catalog entry for a securities offering managed by an exchange that provides the terms under which that security
      is made available on that exchange
    genus: catalog entry
    differentia:
      - managed by a specific exchange
      - provides the terms for trading on that exchange
      - has a listing date and optional delisting date
      - may have tick size, lot size, and currency
    excludes:
      - the financial instrument itself (a listing is the venue-specific admission, not the instrument)
      - a market price observation
    sources:
      - reference: fibo-local-evidence
        locator: FIBO SEC/Securities/SecuritiesListings/Listing
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: Issuer
    canonicalIri: https://axiolune.ai/ontology/finance/instruments/Issuer
    definition: role of a party that issues or proposes to issue in a formal filing one or more financial instruments
    genus: role
    differentia:
      - played by a party (typically a legal entity)
      - issues financial instruments
      - is the counterpart of the isIssuedBy relation
    excludes:
      - market makers (facilitate trading, do not issue)
      - brokers (intermediaries, do not issue)
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FinancialInstruments/FinancialInstruments/Issuer; FND/Relations/Relations/isIssuedBy
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: SecuritiesOffering
    canonicalIri: https://axiolune.ai/ontology/finance/instruments/SecuritiesOffering
    definition: >-
      offering of a security (or securities) for sale; distinct from the instrument contract and from an exchange
      listing
    genus: offering
    differentia:
      - an offering of securities for sale to investors
      - distinct from the financial instrument contract
      - distinct from an exchange listing (a listing lists an offering)
    excludes:
      - the instrument contract itself
      - an exchange listing
    sources:
      - reference: fibo-local-evidence
        locator: FIBO SEC/Securities/SecuritiesIssuance/SecuritiesOffering
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
