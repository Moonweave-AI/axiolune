  - term: FactorObservation
    canonicalIri: https://axiolune.ai/ontology/finance/strategy-research/FactorObservation
    definition: >-
      temporal and provenanced observation that records the value of one factor version for one factor subject,
      observation period, and run context, used for managing revisions through a stable logical identity plus
      knowledge-time closure, with an optional link to the prior exact fact version. The factor subject is generalized
      beyond a single instrument via the FactorSubject role family so that macro, sector, country, market-breadth,
      curve, and portfolio factors are not forced to masquerade as instruments; the observation period is a structured
      ObservationPeriod rather than a free-text key; and the run context is part of the stable logical key so that
      observations of the same factor and subject in different runs do not collide.
    genus: Factor Observation
    differentia:
      - >-
        因子观测，是记录一个因子版本在某个因子主体、观察期与运行上下文下取值的带时间与来源的观测，用于以稳定逻辑标识加知识时间闭包管理修正，并可链接前序精确版本。因子主体经 FactorSubject
        角色族泛化为超越单一工具，使宏观、行业、国家、市场宽度、曲线与组合因子不必伪装成工具；观察期为结构化 ObservationPeriod
        而非自由文本键；运行上下文纳入稳定逻辑键，使同一因子与主体在不同运行中的观测不发生身份碰撞。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
