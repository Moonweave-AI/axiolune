# Axiolune M2 Finance — Strategy & Research Terminology
# Module: fin-strategy-research
# Version: 0.1.0
# Standard: ISO 704:2022 (Terminology work — Principles and methods)
# Evidence sources: Qlib, nautilus_trader, Lean
# Status: accepted — v1.1.0 sidecar evidence (v1.0.0 cards retained; v1.1.0 cards added per ADR-033)

terms:
  - term: "Factor Definition"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/FactorDefinition"
    definition: "specification of a quantitative factor including its calculation logic, input requirements, universe scope, and validity conditions"
    genus: "specification of a quantitative factor"
    differentia:
      - "includes calculation logic"
      - "includes input requirements"
      - "includes universe scope"
      - "includes validity conditions"
    excludes:
      - "computed factor values (those are FactorObservation)"
      - "a signal (which is a trading decision)"
      - "a strategy (which orchestrates multiple factors)"
    sources:
      - reference: "Qlib"
        locator: "qlib/contrib/data/handler.py (DataHandler with factor expressions)"
        retrievalDate: "2026-07-30"
        note: "Qlib Alpha158, Alpha360 are predefined factor sets"
      - reference: "Qlib"
        locator: "qlib/data/dataset/handler.py"
        note: "Factor definitions in expression language ($close, $volume, etc.)"
    status: accepted

  - term: "Signal"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/Signal"
    definition: "point-in-time trading signal generated by a factor or strategy for a specific instrument with directional bias, strength, and validity period"
    genus: "point-in-time trading signal"
    differentia:
      - "generated by a factor or strategy"
      - "for a specific instrument"
      - "with directional bias"
      - "with strength measure"
      - "with validity period"
    excludes:
      - "an order intent (which is an actual trade request)"
      - "a factor value (which is a raw metric)"
      - "a strategy definition (which is the rule set)"
    sources:
      - reference: "Qlib"
        locator: "qlib/model/trainer.py (model predictions → signals)"
        retrievalDate: "2026-07-30"
        note: "Qlib models produce prediction scores that are discretized to trading signals"
      - reference: "nautilus_trader"
        locator: "nautilus_trader/trading/strategy.py"
        note: "Strategies generate orders directly; Signal is an intermediate research concept in Axiolune"
    status: accepted

  - term: "Strategy Definition"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/StrategyDefinition"
    definition: "specification of a trading strategy including its logic, parameters, universe, risk controls, and execution rules"
    genus: "specification of a trading strategy"
    differentia:
      - "includes logic specification"
      - "includes parameters"
      - "includes universe definition"
      - "includes risk controls"
      - "includes execution rules"
    excludes:
      - "a backtest run (which is an execution of the strategy)"
      - "a signal (which is a single decision point)"
      - "a factor definition (which is a data transformation)"
      - "runtime strategy execution (which is L3/runtime concern)"
    sources:
      - reference: "nautilus_trader"
        locator: "nautilus_trader/trading/strategy.py (Strategy base class)"
        retrievalDate: "2026-07-30"
        note: "Base class for all trading strategies with lifecycle hooks"
      - reference: "Lean"
        locator: "Algorithm/QCAlgorithm.cs"
        note: "User algorithm definition with Initialize, OnData, OnOrderEvent methods"
      - reference: "Qlib"
        locator: "qlib/contrib/strategy/strategy.py (BaseStrategy)"
        note: "Portfolio management strategy (TopkDropoutStrategy, WeightStrategyBase)"
    status: accepted

  - term: "Backtest Run"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/BacktestRun"
    definition: "execution of a strategy definition over historical data with specified parameters, date range, initial capital, and resulting performance metrics"
    genus: "execution of a strategy definition over historical data"
    differentia:
      - "with specified parameters"
      - "with date range"
      - "with initial capital"
      - "producing performance metrics"
    excludes:
      - "a strategy definition (which is the specification)"
      - "live trading execution (which uses real-time data)"
      - "a performance observation (which is a single metric snapshot)"
    sources:
      - reference: "Qlib"
        locator: "qlib/backtest/executor.py (BacktestExecutor)"
        retrievalDate: "2026-07-30"
        note: "Executes backtest with order splitting, slippage, and cost models"
      - reference: "nautilus_trader"
        locator: "nautilus_trader/backtest/engine.py (BacktestEngine)"
        note: "Event-driven backtesting with replay of historical data"
      - reference: "Lean"
        locator: "Engine/Engine.cs (backtesting mode)"
        note: "Backtesting engine with event replay"
    status: accepted

  - term: "Performance Observation"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/PerformanceObservation"
    definition: "point-in-time or period-aggregate performance metrics for a backtest run or live strategy including returns, drawdown, Sharpe ratio, and other statistics"
    genus: "performance metrics"
    differentia:
      - "for a backtest run or live strategy"
      - "point-in-time or period-aggregate"
      - "includes returns"
      - "includes drawdown"
      - "includes risk-adjusted metrics"
    excludes:
      - "a backtest run (which is the execution context)"
      - "a position valuation (which is portfolio value, not performance)"
      - "a signal (which is a trading decision)"
    sources:
      - reference: "Qlib"
        locator: "qlib/contrib/report/analysis_position.py (PortAnaRecord)"
        retrievalDate: "2026-07-30"
        note: "IC, Sharpe, max drawdown, cumulative return analysis"
      - reference: "nautilus_trader"
        locator: "nautilus_trader/analysis/performance.py (PerformanceAnalyzer)"
        note: "Performance statistics calculation"
      - reference: "Lean"
        locator: "Statistics/Statistics.cs"
        note: "Algorithm statistics (Sharpe, drawdown, win rate)"
    status: accepted

  - term: "Signal Direction"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/SignalDirection"
    definition: "controlled vocabulary indicating the directional bias of a trading signal (long, short, neutral, exit)"
    genus: "controlled vocabulary"
    differentia:
      - "indicating directional bias"
      - "of a trading signal"
    excludes:
      - "order side (which is the actual trade direction)"
      - "position side (which is the resulting position)"
    sources:
      - reference: "Qlib"
        locator: "qlib/contrib/strategy/strategy.py (signal → position translation)"
        retrievalDate: "2026-07-30"
        note: "Predictions discretized to buy/sell/hold signals"
      - reference: "nautilus_trader"
        locator: "nautilus_trader/model/enums.py (PositionSide)"
        note: "LONG, SHORT, FLAT position sides"
    status: accepted

  - term: "Factor Category"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/FactorCategory"
    definition: "controlled vocabulary of factor types (fundamental, technical, alternative, macro)"
    genus: "controlled vocabulary of factor types"
    differentia:
      - "includes fundamental factors"
      - "includes technical factors"
      - "includes alternative data factors"
      - "includes macroeconomic factors"
    excludes:
      - "a specific factor definition"
      - "a factor value"
    sources:
      - reference: "Qlib"
        locator: "qlib/contrib/data/handler.py (Alpha158 dataset)"
        retrievalDate: "2026-07-30"
        note: "Alpha158 contains technical + fundamental features (volume, price, KBAR, KDJ, RSI, etc.)"
    status: accepted

  - term: "Backtest Status"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/BacktestStatus"
    definition: "controlled vocabulary of backtest execution states (pending, running, completed, failed, canceled)"
    genus: "controlled vocabulary of execution states"
    differentia:
      - "for backtest runs"
    excludes:
      - "order lifecycle state (which is for orders)"
      - "strategy status (live vs. backtest mode)"
    sources:
      - reference: "nautilus_trader"
        locator: "nautilus_trader/backtest/engine.py"
        retrievalDate: "2026-07-30"
        note: "BacktestEngine lifecycle (not explicitly enumerated but implied)"
    status: accepted

  - term: "Research Question"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/ResearchQuestion"
    definition: "versioned specification of one falsifiable research question together with its hypothesis and protocol, with the artifact digest retained as evidence"
    genus: "versioned research-question specification"
    differentia:
      - "exposes the research question as a queryable business object"
      - "links to one or more Hypothesis objects"
      - "links to an optional ResearchProtocol"
    excludes:
      - "a digest-locked artifact with no business semantics"
      - "a research run (which evaluates the question)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D1"
    status: accepted

  - term: "Hypothesis"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/Hypothesis"
    definition: "versioned specification of one falsifiable hypothesis linked to a research question with an effect direction and a statistical test plan"
    genus: "versioned hypothesis specification"
    differentia:
      - "carries a hypothesized effect direction"
      - "links to a falsifiability test plan"
    excludes:
      - "a research question (which poses the question)"
      - "a statistical test result (which records the outcome)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D2"
    status: accepted

  - term: "Research Protocol"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/ResearchProtocol"
    definition: "versioned specification of the research methodology covering sample partitioning, walk-forward plan, and model-selection criteria"
    genus: "versioned research-methodology specification"
    differentia:
      - "makes the research process falsifiable, not only re-runnable"
      - "carries model-selection criteria"
    excludes:
      - "a dataset snapshot (which is the input)"
      - "a research finding (which is the conclusion)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D3"
    status: accepted

  - term: "Strategy Execution Package"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/StrategyExecutionPackage"
    definition: "versioned specification binding one exact strategy version to its executable implementation, factor-dependency closure, and input contract"
    genus: "versioned execution-package specification"
    differentia:
      - "ensures a backtest runs the strategy it declares"
      - "closes the declare-strategy-A-run-digest-of-strategy-B gap"
    excludes:
      - "the strategy definition itself"
      - "a backtest run (which consumes the package)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D13"
    status: accepted

  - term: "Simulated Order"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/SimulatedOrder"
    definition: "temporal and provenanced fact recording one simulated order produced by a backtest decision under a MarketSimulationPolicy"
    genus: "simulated trading-chain fact"
    differentia:
      - "records the Decision-to-order step"
      - "references orders-execution order semantics without re-defining them"
    excludes:
      - "a live order (which is placed in a real market)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D14"
    status: accepted

  - term: "Market Simulation Policy"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/MarketSimulationPolicy"
    definition: "versioned specification of the market-mechanics assumptions under which a backtest simulates trading, covering cash, financing, stock borrow, tax, FX, liquidity and capacity, suspension, and survivorship"
    genus: "versioned market-mechanics policy"
    differentia:
      - "exposes market mechanics as a queryable policy"
      - "not compressed into an unqueryable artifact digest"
    excludes:
      - "fee, slippage, and fill assumptions (which are retained as evidence but now also queryable)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D14"
    status: accepted

  - term: "Benchmark Specification"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/BenchmarkSpecification"
    definition: "versioned specification of one benchmark used in performance comparison, covering return kind, currency, rebalance, availability, and its relation to an instrument, allowing a documented no-suitable-benchmark case"
    genus: "versioned benchmark specification"
    differentia:
      - "unifies previously scattered and inconsistent benchmark references"
      - "allows a no-suitable-benchmark case with a reason"
    excludes:
      - "a bare benchmark URI and digest with no semantics"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D15"
    status: accepted

  - term: "Performance Measurement Period"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/PerformanceMeasurementPeriod"
    definition: "versioned specification of the period over which a performance metric is measured, covering the period bounds and the measurement as-of"
    genus: "versioned measurement-period specification"
    differentia:
      - "gives a performance observation an explicit measurement period"
    excludes:
      - "an implicit period derived from the run context"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D15"
    status: accepted

  - term: "Attribution Method"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/AttributionMethod"
    definition: "versioned specification of the attribution method used to decompose a performance result, covering component type, aggregation scope, and reconciliation and residual rule"
    genus: "versioned attribution-method specification"
    differentia:
      - "makes an attribution explain a performance result"
      - "carries a reconciliation and residual rule"
    excludes:
      - "an attribution contribution without a method"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D15"
    status: accepted

  - term: "Strategy Deployment"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/StrategyDeployment"
    definition: "versioned specification of one deployment of a strategy to live trading governed by promotion, monitoring, suspension, and rollback"
    genus: "versioned strategy-deployment specification"
    differentia:
      - "backs the live run-context kind with a deployment lifecycle"
      - "governed by PromotionDecision, MonitoringObservation, and RollbackDecision"
    excludes:
      - "a backtest run (which is not live)"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D17"
    status: accepted

  - term: "Validated Reproducible Run"
    canonicalIri: "https://axiolune.ai/ontology/finance/strategy-research/ValidatedReproducibleRun"
    definition: "document-scoped profile marker downgrading audit-grade digest, contract, closure, and PIT-passed requirements to profile-Mandatory, core-optional"
    genus: "reproducibility-evidence profile"
    differentia:
      - "keeps preliminary, failed, data-quality-limited, and streaming runs expressible"
      - "core constraints stay Mandatory"
    excludes:
      - "a universal precondition for all run facts"
    sources:
      - reference: "internal-axiolune"
        locator: "ADR-033 D20"
    status: accepted
