  - term: BarSpecification
    canonicalIri: https://axiolune.ai/ontology/finance/market-data/BarSpecification
    definition: >-
      structured value describing how a bar is aggregated, used for specifying the aggregation kind, price basis,
      timestamp convention, and source calendar of a bar, and for selecting either a time-interval or a non-time
      threshold branch
    genus: object type
    differentia:
      - carries exactly one barAggregation (time, tick, volume, notional, range, or renko)
      - carries exactly one barPriceBasis (trade or bidAsk) distinguishing trade OHLCV from paired bid/ask OHLC
      - carries exactly one barTimestampConvention (intervalStart or intervalEnd) fixing observedAt semantics
      - requires exactly one of barInterval (for time bars) or barThreshold (for non-time bars)
      - references a source MarketDataStream and a TradingCalendar for aggregation boundaries
    excludes:
      - a bar observation itself (which is TradeBar or QuoteBar)
      - a raw tick (which is unaggregated)
    sources:
      - reference: nautilus-trader
        locator: model/data/bar.pyx BarSpecification (step, price_type, aggregation_source)
      - reference: lean
        locator: Data/Market/TradeBar.cs, Data/Market/QuoteBar.cs (consolidator settings)
    status: accepted
