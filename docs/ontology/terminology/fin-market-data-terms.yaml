      used for declaring the exact calendar version that governs its aggregation boundaries.
    genus: Bar Specification Calendar
    differentia:
      - K 线规格日历关系，是连接 K 线规格与其源交易日历的功能关系，用于规定聚合边界所依据的日历版本。
