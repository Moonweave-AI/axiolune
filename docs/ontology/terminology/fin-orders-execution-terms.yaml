    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/allocationTargetAccount
    definition: >-
      relationship from an AllocationLine to the logical FinancialAccount that is the allocation target, used to express
      post-execution allocation across multiple final accounts
    genus: allocation target account
    differentia:
      - 分配目标账户，是从分配行指向作为分配目标的逻辑金融账户的关系，用于表达跨多个最终账户的执行后分配。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
