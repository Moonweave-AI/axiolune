    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: DisclosureStatus
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/DisclosureStatus
    definition: >-
      closed disclosure classification vocabulary, used to express whether an execution counterparty is disclosed,
      anonymous, or partially disclosed
    genus: Disclosure Status
    differentia:
      - 披露状态词表，是封闭披露分类词表，用于表达成交对手方是已披露、匿名还是部分披露。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
