    status: accepted
    owner: axiolune-m2-team
  - term: ExternalOrder
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrder
    definition: >-
      An External Order is a provider-scoped order that has been accepted or submitted by a provider, used for binding
