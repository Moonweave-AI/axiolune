terms:
  - term: acceptableVenueSet
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/acceptableVenueSet
    definition: >-
      relationship from a venue-neutral OrderIntent to one or more logical TradingFacility venues acceptable for its
      execution, used as the venue-neutral alternative to a single listing or OTC context binding
    genus: acceptable venue set
    differentia:
      - 可接受场所集合，是从场所中立订单意图指向一个或多个可接受执行场所的逻辑交易设施的关系，作为单一挂牌或场外上下文绑定的场所中立替代。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: affectedKeyDigest
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/affectedKeyDigest
    definition: >-
      kind-discriminated digest value of the strict OrderFindingSubject object, used for digesting and distinguishing
      finding subjects by defect kind
    genus: affected key digest
    differentia:
      - 受影响键摘要，是完整性发现主体对象的摘要值，用于按缺陷类别对发现主体进行摘要与区分。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: AllocationLine
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/AllocationLine
    definition: >-
      immutable allocation target line expressing one account's share of a source execution, paired with an
      ExecutionAllocation
    genus: allocation target
    differentia:
      - carries a strictly positive allocationQuantity and an allocationStatus
      - targets exactly one FinancialAccount via allocationTargetAccount
      - the set of lines under one ExecutionAllocation partitions the source execution quantity with conservation
    excludes:
      - the source execution (referenced via the parent ExecutionAllocation)
      - the target account's full position state (portfolio-positions)
    sources:
      - reference: iso-20022
        locator: ISO 20022 securities_trade — AllocationLine
        note: ISO 20022 allocation line carries account, quantity, and status
    status: accepted
  - term: allocationQuantity
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/allocationQuantity
    definition: >-
      strictly positive absolute Quantity allocated to one AllocationLine target account, used to partition a source
      execution quantity with conservation
    genus: allocation quantity
    differentia:
      - 分配数量，是分配给某一分配行目标账户的严格为正的绝对数量，用于以守恒分割源成交数量。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: allocationStatus
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/allocationStatus
    definition: >-
      closed allocation-status classification attribute of an ExecutionAllocation or AllocationLine, used to express the
      state of an allocation (e.g. proposed, accepted, rejected, cancelled, corrected)
    genus: allocation status
    differentia:
      - 分配状态，是成交分配或分配行的封闭分配状态分类属性，用于表达分配的状态（如 proposed、accepted、rejected、cancelled、corrected）。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: AllocationStatus
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/AllocationStatus
    definition: closed allocation-status classification vocabulary, used to express the state of an execution allocation
    genus: Allocation Status
    differentia:
      - 分配状态词表，是封闭分配状态分类词表，用于表达成交分配的状态。
    excludes: []
    sources:
      - reference: module-yaml
