  - term: executedAt
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/executedAt
    definition: >-
      optional inclusive UTC instant at which the trade represented by an execution actually occurred, distinct from the
      provider-reporteded and observed timestamps
    genus: executed at
    differentia:
      - 成交时刻，是成交所代表交易实际发生的可选含端 UTC 瞬时，区别于供应方上报与系统观察时间戳。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: Execution
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/Execution
    definition: >-
      An Execution is an immutable provider fill or fill-report fact that occurs in one exact event stream, used for
      recording the real economic content of a trade through explicit execution-side and contra-side accounts, party
      roles, instrument, quantity, price, and the matching quotation contract.
    genus: Execution
    differentia:
      - 成交，是发生在确切事件流中的不可变供应方成交或成交回报事实，用于以显式的执行方与对手方账户、当事人角色、工具、数量、价格与报价契约记录一笔买卖的真实经济内容。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: ExecutionAllocation
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionAllocation
    definition: >-
      An Execution Allocation is an immutable allocation fact that distributes one source Execution across one or more
      AllocationLine target accounts, used to express post-execution allocation, average-price allocation, and
      bunched-order back-allocation with quantity conservation, while detailed allocation and clearing semantics remain
      in post-trade-operations with a stable cross-module reference to the source Execution.
    genus: Execution Allocation
    differentia:
      - >-
        成交分配，是把单一源成交分配到一个或多个 AllocationLine 目标账户的不可变分配事实，用于以数量守恒表达执行后分配、均分配与打包订单后分配，而详细分配与清算语义保留在 post-trade-operations
        并通过稳定的跨模块引用指向源成交。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: ExecutionLeg
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/ExecutionLeg
    definition: >-
      optional single-leg execution component corresponding to an OrderLeg, used as an extension point for multi-leg
      executions; in v1.1.0 a single-instrument execution carries no ExecutionLeg
    genus: execution leg component
    differentia:
      - carries an executionQuantity and an executionPrice per leg
      - corresponds to an OrderLeg of a multi-leg order
      - full semantics are completed via a cross-module follow-up gated on the instruments QuotationConvention (ADR-021)
      - absent for single-instrument v1.1.0 executions (described directly on the Execution)
    excludes:
      - the single-instrument execution (no leg in v1.1.0)
      - the order leg (OrderLeg is the instruction; ExecutionLeg is the fill)
    sources:
      - reference: fix
        locator: 'FIX 5.0 SP2 :: ExecutionReport legs'
        note: FIX ExecutionReport may carry per-leg fill data for multi-leg strategies
    status: accepted
  - term: executionPrice
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/executionPrice
    definition: >-
      Money price attribute interpreted only through the exact direct-unit quotation contract, used for expressing the
      trade price of the execution
    genus: execution price
    differentia:
      - 成交价，是仅通过确切的直接单位报价契约来解释的货币价格属性，用于表达该笔成交的成交价格。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: executionQuantity
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/executionQuantity
    definition: >-
      strictly positive absolute Quantity attribute filled by an Execution, used for expressing the amount of the
      instrument traded in that execution
    genus: execution quantity
    differentia:
      - 成交数量，是某次成交所成交的严格为正的绝对数量属性，用于表达该笔成交的标的数量。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: executionQuotationConvention
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/executionQuotationConvention
    definition: >-
      relationship from an Execution to its quotation convention, used as the hook to be broadened from
      DirectUnitPriceQuotationContract to the abstract QuotationConvention (ADR-021) in a cross-module follow-up; in
      v1.1.0 it references the retained DirectUnitPriceQuotationContract
    genus: execution quotation convention
    differentia:
      - >-
        成交报价约定，是从成交指向其报价约定的关系，作为从 DirectUnitPriceQuotationContract 扩展为抽象 QuotationConvention（ADR-021）的跨模块后续钩子；在 v1.1.0
        中引用保留的 DirectUnitPriceQuotationContract。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: executionVenue
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/executionVenue
    definition: >-
      relationship from an Execution to the logical TradingFacility where the execution occurred, used to distinguish
      the actual execution venue from the execution listing
    genus: execution venue
    differentia:
      - 成交场所，是从成交指向成交发生所在的逻辑交易设施的关系，用于区分实际成交场所与成交挂牌。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
