        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: ExternalOrderStatusVocabulary
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusVocabulary
    definition: >-
      An External Order Status Vocabulary is a raw status-code vocabulary scoped by provider, API, and schema version,
      used for collecting each provider's raw status-code values before they are reviewed and mapped to the canonical
      lifecycle state vocabulary.
    genus: External Order Status Vocabulary
    differentia:
      - 外部订单状态词表，是按供应方、接口与版本作用域标识的原始状态码词表，用于在评审映射到规范生命周期状态之前，收录各供应方的原始状态码取值。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: Fee
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/Fee
    definition: >-
      A Fee is an immutable charge or rebate fact recorded for one exact Execution version, used for expressing the
      economic or regulatory cost of a trade through a strictly positive amount together with a fee-effect direction,
      whose direction is never carried by a signed amount.
    genus: Execution Fee
    differentia:
      - 成交费用，是针对确切成交版本记录的不可变收费或返利事实，用于以严格为正的金额配合费用效应方向表达一笔成交的经济或监管费用，其方向不以符号金额承载。
    excludes: []
    sources:
