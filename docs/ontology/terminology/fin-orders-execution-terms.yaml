  - term: eventReason
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/eventReason
    definition: provider reason text or normalized reason identifier for an event, used for explaining the cause of the event
    genus: event reason
    differentia:
      - 事件原因，是供应方为某事件提供的原因文本或规范化原因标识，用于解释该事件发生的缘由。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
