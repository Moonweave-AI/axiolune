    genus: External Order Status Mapping
    differentia:
      - 外部订单状态映射，是经评审且带生效期的映射，用于把某一供应方原始状态码映射到唯一的规范生命周期状态，阻止供应方取值进入规范词表。
    excludes: []
    sources:
