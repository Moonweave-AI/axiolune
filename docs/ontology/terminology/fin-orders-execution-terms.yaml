  - term: FillSnapshot
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/FillSnapshot
    definition: >-
      immutable cumulative-quantity snapshot object carried by a fill-kind lifecycle event, expressing last fill
      quantity, cumulative filled quantity, remaining (leaves) quantity, cancelled quantity, and average price so the
      event-execution-cumulative-quantity-state loop is auditable without recomputation
    genus: cumulative quantity snapshot
    differentia:
      - carries lastQty, cumQty, leavesQty, cancelledQty, and averagePrice (all optional)
      - >-
        cumQty equals the sum of executionQuantity over the stream's executions for the order up to and including the
        reported execution
      - leavesQty = orderQuantity - cumQty - cancelledQty and is non-negative
      - Filled iff leavesQty = 0; PartiallyFilled iff leavesQty > 0 and cumQty > 0
    excludes:
      - the executions themselves (the snapshot is derived-auditable, not the source of truth)
      - the order state (the snapshot supports state audit, it is not the state)
    sources:
      - reference: fix
        locator: 'FIX 5.0 SP2 :: ExecutionReport CumQty / LeavesQty / AvgPx'
        note: >-
          FIX ExecutionReport carries CumQty, LeavesQty, and AvgPx; Axiolune captures them as an immutable snapshot for
          audit
    status: accepted
