    definition: >-
      cumulative filled Quantity recorded in a FillSnapshot, used to audit Filled and PartiallyFilled states against the
      effective net quantity
    genus: cumulative quantity
    differentia:
      - 累计数量，是成交快照中记录的累计成交数量，用于按有效净成交量审计 Filled 与 PartiallyFilled 状态。
