    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: externalOrderProvider
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/externalOrderProvider
    definition: >-
      relationship from an ExternalOrder to the logical provider Party, used for identifying the execution service
