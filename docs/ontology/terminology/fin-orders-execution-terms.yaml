    genus: External Order
    differentia:
      - 外部订单，是已被执行方受理或提交的、按供应方作用域标识的订单，用于把某条确切的订单意图版本绑定到具体供应方的接口与外部订单标识，作为外部系统的订单事实锚点。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: externalOrderId
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/externalOrderId
    definition: >-
      provider-scoped immutable string identifier of an external order, used for providing the logical identity primary
      key of an ExternalOrder
    genus: external order identifier
    differentia:
      - 外部订单标识，是供应方作用域内不可变的外部订单字符串标识，用于为外部订单提供逻辑身份主键。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
