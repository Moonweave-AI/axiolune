  - term: ExternalOrderStatusMapping
    canonicalIri: https://axiolune.ai/ontology/finance/orders-execution/ExternalOrderStatusMapping
    definition: >-
      An External Order Status Mapping is a reviewed, effective-dated mapping, used for translating one provider raw
      status code into exactly one canonical lifecycle state, and for preventing provider values from entering the
