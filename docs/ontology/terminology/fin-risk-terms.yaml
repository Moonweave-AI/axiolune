  - term: RiskLimit
    canonicalIri: https://axiolune.ai/ontology/finance/risk/RiskLimit
    definition: >-
      approved temporal and provenanced threshold fact that binds one exact RiskMeasureDefinition version, at least one
      explicit scope (a RiskScopeDefinition and/or legacy Portfolio/Account/Position), an owner, exactly one Money,
      Quantity, or bucket-set representation, and an optional RiskLimitRule and RiskLimitComparisonPolicy, used to set a
      governed risk threshold that subsequent measurements are evaluated against. The single-value upper threshold
      remains the first concrete profile; a RiskLimitRule generalizes to lower/upper bounds, bands, absolute-value,
      two-sided, utilization, and concentration limits. A lifecycle (effective/suspended/superseded) separates approval
      from effectiveness, and approvedBy is modeled as a typed Party role consistent with limitOwner rather than a bare
      uri.
    genus: Risk Limit
    differentia:
      - >-
        风险限额，是经批准的带时间戳与来源的阈值事实，用于绑定一个精确度量定义版本、至少一个显式范围（风险范围定义和/或遗留组合/账户/头寸）、一个责任主体、唯一的金额、数量或分桶集合表示，及可选的风险限额规则与风险限额比较策略，以设定后续度量所对照的治理阈值。单值上限仍是首个具体画像；风险限额规则泛化为下/上限、区间、绝对值、双侧、利用率与集中度限额。生命周期（生效/暂停/替代）把批准与生效分开，approvedBy
        建模为类型化 Party 角色与 limitOwner 一致，而非裸 uri。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
