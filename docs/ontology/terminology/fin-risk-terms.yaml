  - term: RiskMeasurement
    canonicalIri: https://axiolune.ai/ontology/finance/risk/RiskMeasurement
    definition: >-
      point-in-time result for one exact risk-measure definition and at least one explicit portfolio, account, position,
      or RiskScopeSnapshot scope that carries exactly one Money, Quantity, or RiskBucketSet representation, used to
      record a computed risk number. A measurementStatus distinguishes preliminary, incomplete, revised, failed,
      estimated, and validated results, so non-audit-grade numbers are expressible; the strictly-prior input-context
      evidence (inputContextRef, inputContextRecordDigest, inputContextCompleted) is mandatory only when the
      ValidatedReproducibleRiskMeasurement profile is active. Optional roles link the result to its
      RiskMeasureSpecification, RiskInputSet, RiskCalculationContext, RiskScopeSnapshot, driving RiskFactor(s), and
      RiskExposure(s), so that "what drove the result" is queryable rather than hidden in a digest.
    genus: Risk Measurement
    differentia:
      - >-
        风险度量，是某一精确度量定义与至少一个显式组合、账户、头寸或风险范围快照范围下的时点结果，携带唯一的金额、数量或分桶集合表示，用于记录计算出的风险数值。measurementStatus
        区分初步、不完整、修订、失败、估计与已验证结果，使非审计级数值可被表达；严格先行输入上下文证据仅在已验证可重放度量画像激活时强制。可选角色把结果链接到其风险度量规格、风险输入集、风险计算上下文、风险范围快照、驱动的风险因子与风险暴露，使“什么驱动了结果”可查询而非藏在摘要中。
