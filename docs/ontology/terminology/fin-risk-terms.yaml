  - term: StressTestRun
    canonicalIri: https://axiolune.ai/ontology/finance/risk/StressTestRun
    definition: >-
      completed stress test that applies one exact ScenarioDefinition version to a portfolio scope and records the
      output RiskMeasurement version produced by the run, used to bind the scenario, the shocked holdings, and the
      output result in a replayable way. It carries a run authority in its logical key, an exact RiskScopeSnapshot or
      RiskInputSet whose members were shocked, an optional baseline measurement, one or more stressed measurements, and
      a ScenarioApplicationEvidence role proving the output's input context was actually shocked by the scenario. The
      run's contract requires the output's generating context to equal the run's, the output's scope to match the stress
      scope, and the measure definition's scenarioRef to equal the run's exact ScenarioDefinition.
    genus: Stress Test Run
    differentia:
      - >-
        压力测试运行，是将一个精确情景定义版本施加于投资组合范围并记录运行产出度量版本的完成压力测试，用于以可回放方式绑定情景、持仓冲击与输出结果。其逻辑键携带运行权威、被冲击成员的精确风险范围快照或风险输入集、可选基线度量、一个或多个受压度量，及证明输出输入上下文确被情景冲击的情景应用证据角色。运行合同要求输出生成上下文等于运行、输出范围匹配压力范围、度量定义的情景引用等于运行的精确情景定义。
