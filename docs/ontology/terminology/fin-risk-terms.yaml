    genus: comparison policy
    differentia:
      - defines bucket mode, missing-bucket handling, tolerance, conversion
      - replaces scalar value<=threshold for bucket sets
    excludes:
      - the limit threshold
    sources:
      - reference: internal-axiolune
        locator: ADR-032 D5
    status: accepted
  - term: RiskLimitEvaluation
    canonicalIri: https://axiolune.ai/ontology/finance/risk/RiskLimitEvaluation
    definition: >-
      explicit deterministic conclusion for one exact RiskMeasurement version and one compatible exact RiskLimit version
      that represents withinLimit, breach, or indeterminate as a required code value rather than as an absence, used to
      make the outcome of comparing a measurement with its limit unambiguous and non-empty. Scope compatibility is
      defined by an explicit scopeMatchRule (exactMatch / approvedRollup / contains) rather than a vague "same scope",
      and a comparison policy role governs bucket-vs-bucket comparison. For the bucket branch the result is determined
      per the RiskLimitComparisonPolicy (per-bucket and/or aggregate, with key alignment, missing-bucket handling,
      tolerance, rounding, and unit/currency conversion) rather than a scalar value<=threshold. evaluatorDigest is
      mandatory only when the ValidatedReproducibleRiskMeasurement profile is active.
    genus: Risk Limit Evaluation
    differentia:
      - >-
        风险限额评估，是针对一个精确度量版本与一个兼容精确限额版本的确定性结论，用于把限额内、突破或不确定表示为必填码值而非缺失。范围兼容性由显式
        scopeMatchRule（精确匹配/已批准聚合/包含）定义，而非模糊的“同范围”；比较策略角色治理分桶对分桶比较。分桶分支下结果由风险限额比较策略（逐桶和/或聚合，含键对齐、缺失桶处理、容差、舍入与单位/货币换算）决定，而非标量值<=阈值。评估器摘要仅在已验证可重放度量画像激活时强制。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
