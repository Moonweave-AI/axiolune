# Axiolune M2 Risk Module — Terminology Cards (stub)
# Status: draft — required sidecar evidence (review M6). Definitions subject to G1 review.

terms:
  - term: "Risk Measure Definition"
    canonicalIri: "https://axiolune.ai/ontology/finance/risk/RiskMeasureDefinition"
    definition: "specification of a risk metric including inputs, horizon, confidence level, and computation contract without embedding a single result instance"
    genus: "measure definition"
    differentia:
      - "defines how risk is measured"
      - "separates definition from a single observation"
    excludes:
      - "a one-off exposure observation"
      - "a limit breach event"
    sources:
      - reference: "internal-axiolune"
        locator: "M2-PLAN §5.2 fin-risk"
    status: draft

  - term: "Exposure Observation"
    canonicalIri: "https://axiolune.ai/ontology/finance/risk/ExposureObservation"
    definition: "time-stamped observation of portfolio or position exposure under a stated risk measure and three-axis temporal semantics"
    genus: "observation"
    differentia:
      - "binds a risk measure"
      - "records exposure at valid/knowledge/availability times"
    excludes:
      - "the risk measure definition itself"
    sources:
      - reference: "internal-axiolune"
        locator: "M2-PLAN §5.2 fin-risk"
    status: draft

  - term: "Limit Breach"
    canonicalIri: "https://axiolune.ai/ontology/finance/risk/LimitBreach"
    definition: "fact that an exposure observation violates a risk limit under stated applicability and evidence"
    genus: "compliance fact"
    differentia:
      - "references a limit and an exposure"
      - "is provenance-bound"
    excludes:
      - "the limit definition alone"
    sources:
      - reference: "internal-axiolune"
        locator: "M2-PLAN §5.2 fin-risk"
    status: draft
