cards:
  - term: accountIdentifierScheme
    canonicalIri: https://axiolune.ai/ontology/finance/foundation/accountIdentifierScheme
    definition: >-
      direct logical reference from a financial account to exactly one account identifier scheme identity, used for
      forming the scheme side of an account's identity
    genus: Account Identifier Scheme
    differentia:
      - 账户标识方案，是金融账户指向唯一账户标识方案身份的直接逻辑引用，用于构成账户的方案侧身份。
