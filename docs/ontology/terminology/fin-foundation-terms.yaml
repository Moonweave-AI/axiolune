  - term: Currency
    canonicalIri: https://axiolune.ai/ontology/finance/foundation/Currency
    definition: >-
      medium of exchange value defined by reference to the geographical location of the monetary authorities responsible
      for it, as specified in ISO 4217
    genus: medium of exchange
    differentia:
      - defined by reference to monetary authority geography
      - has a 3-character alphabetic code and a 3-digit numeric code (ISO 4217)
      - has a minor unit (decimal places)
    excludes:
      - cryptocurrency tokens without ISO 4217 codes
      - commodity units
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FND/Accounting/CurrencyAmount/Currency
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: CurrencyUsage
    canonicalIri: https://axiolune.ai/ontology/finance/foundation/CurrencyUsage
    definition: >-
      temporal fact asserting that one currency identity is used within one jurisdiction, used for recording the lawful
      usage of a currency within a jurisdictional territory
    genus: Currency Usage
    differentia:
      - 货币使用，是断言某一货币逻辑身份在某一管辖权内使用的时态事实，用于记录币种在司法地域范围内的合法使用关系。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v2.0.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: FinancialAccount
    canonicalIri: https://axiolune.ai/ontology/finance/foundation/FinancialAccount
    definition: >-
      account that identifies a governed cash, securities-custody, or multi-asset holding capability, used for precisely
      representing the identity of a holding party through a scheme-bound identifier
    genus: Financial Account
    differentia:
      - 金融账户，是标识受治理现金、证券托管或多资产持仓能力的账户，用于以方案绑定的标识精确刻画一个持仓主体的同一性。
