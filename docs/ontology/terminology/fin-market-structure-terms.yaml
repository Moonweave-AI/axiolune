# fin-market-structure — Terminology Cards
# Synced from module.yaml v1.1.0 — 2026-08-07
# Each card: term (module.yaml entity key), canonicalIri, ISO 704 definition

cards:
  - term: authorityCalendarId
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/authorityCalendarId
    definition: >-
      non-empty NFC string identifier assigned to a trading calendar by its maintaining authority, used to uniquely
      denote that calendar within the scope of (authority, facility). The calendar logical key is the three-component
      (calendarFacility, calendarAuthority, authorityCalendarId) per TradingCalendarIdentityContract, so the identifier
      is unique within each authority-and-facility pair, not within the authority alone.
    genus: Authority Calendar Identifier
    differentia:
      - >-
        权威日历标识符，是由维护权威分配给某一交易日历的非空 NFC
        字符串标识，用于在（权威，设施）范围内唯一指代该日历。日历逻辑键为三分量（calendarFacility、calendarAuthority、authorityCalendarId），见
        TradingCalendarIdentityContract，因此该标识在每个权威与设施配对范围内唯一，而非仅在权威范围内唯一。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: authoritySessionId
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/authoritySessionId
    definition: >-
      non-empty NFC string identifier assigned to a session template by its maintaining authority, used to uniquely
      denote that session within the authority-and-calendar scope.
    genus: Authority Session Identifier
    differentia:
      - 权威时段标识符，是由维护权威分配给某一时段模板的非空 NFC 字符串标识，用于在权威与日历范围内唯一指代该时段。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: calendarAuthority
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/calendarAuthority
    definition: >-
      functional relation that associates a trading calendar with the Party logical identity of its maintaining
      authority, used to characterize the institutional responsibility for the calendar.
    genus: Calendar Authority
    differentia:
      - 日历权威关系，是将某一交易日历关联到其维护权威的参与方逻辑身份的功能性关系，用于刻画日历的机构责任归属。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: calendarExceptionKind
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/calendarExceptionKind
    definition: >-
      closed classification attribute of a calendar exception, used to distinguish holidays, closures, early closings,
      late openings, and similar exceptional circumstances.
    genus: Calendar Exception Kind
    differentia:
      - 日历例外类型，是对某一日历例外的封闭分类属性，用于区分节假日、临时停市、提前收盘或延后开盘等例外情形。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: CalendarExceptionKind
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/CalendarExceptionKind
    definition: >-
      closed classification controlled vocabulary of deterministic changes to scheduled session occurrences, used to
      provide a standard enumeration of holidays, closures, early and late opens and closes, extra sessions, and
      segmented interruptions and resumptions for calendar exceptions and schedule override notices.
    genus: Calendar Exception Kind
    differentia:
      - 日历例外类型表，是对已计划时段实例进行确定性变更的封闭分类受控词汇，用于为日历例外与日程变更公告提供节假日、停市、提前/延后开收盘、额外时段、分段中断与恢复等标准枚举。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: calendarFacility
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/calendarFacility
    definition: >-
      functional relation that associates a trading calendar with the stable logical identity of its trading facility,
      used to characterize the venue that the calendar serves.
    genus: Calendar Facility
    differentia:
      - 日历设施关系，是将某一交易日历关联到其交易设施的稳定逻辑身份的功能性关系，用于刻画日历所服务的场所逻辑归属。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: calendarJurisdiction
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/calendarJurisdiction
    definition: >-
      functional relation that associates a trading calendar with its unique governing jurisdiction logical identity,
      used to characterize the regulatory and territorial attribution of the calendar.
    genus: Calendar Jurisdiction
    differentia:
      - 日历司法辖区关系，是将某一交易日历关联到其所辖唯一司法辖区逻辑身份的功能性关系，用于刻画日历的法规地域归属。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: componentOf
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/componentOf
    definition: >-
      functional relation that associates a MarketInfrastructureComponent with the unique operating market
      infrastructure entity it is a section or component of, used to carry the ISO 10383 "section" part-of semantics
      independently of any facility supertype shared for reference range.
    genus: Component Of
    differentia:
      - 组成归属关系，是将某一市场基础设施组成部分关联到其所构成板块或组成部分所属的唯一运营中市场基础设施实体的功能性关系，用于独立于任何为参照范围共享的设施超类来承载 ISO 10383 "section" 归属语义。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: dstOverlapPolicy
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/dstOverlapPolicy
    definition: >-
      closed classification attribute carried by a trading calendar, used to declare how local-clock instants that fall
      inside a DST gap or fold are interpreted during local-to-UTC materialization.
    genus: DST Overlap Policy
    differentia:
      - 夏令时重叠策略，是某一交易日历携带的封闭分类属性，用于声明本地到 UTC 物化时落在夏令时 gap 或 fold 内的本地时钟瞬时的解释方式。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: DstOverlapPolicy
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/DstOverlapPolicy
    definition: >-
      closed controlled vocabulary of the interpretation policy for local-clock instants that fall inside a DST gap or
      fold, used to make local-to-UTC materialization deterministic.
    genus: DST Overlap Policy
    differentia:
      - 夏令时重叠策略表，是落在夏令时 gap 或 fold 内的本地时钟瞬时解释策略的封闭受控词汇，用于使本地到 UTC 物化具有确定性。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: effectiveSessionEndUtc
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/effectiveSessionEndUtc
    definition: >-
      optional exclusive UTC instant at which a session occurrence stops being effectively tradable after applying any
      TradingScheduleOverrideNotice facts, used to separate the scheduled window from the effective tradable interval.
    genus: Effective Session End UTC
    differentia:
      - 有效时段 UTC 结束，是某一时段实例在应用任意 TradingScheduleOverrideNotice 事实后停止实际可交易的不含端 UTC 瞬时，用于将计划窗口与有效可交易区间分离。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: effectiveSessionStartUtc
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/effectiveSessionStartUtc
    definition: >-
      optional inclusive UTC instant at which a session occurrence becomes effectively tradable after applying any
      TradingScheduleOverrideNotice facts, used to separate the scheduled window from the effective tradable interval.
      When absent and no cancellation applies, the effective interval equals the scheduled interval.
    genus: Effective Session Start UTC
    differentia:
      - >-
        有效时段 UTC 开始，是某一时段实例在应用任意 TradingScheduleOverrideNotice 事实后实际可交易的含端 UTC
        瞬时，用于将计划窗口与有效可交易区间分离。当其缺席且未发生取消时，有效区间等于计划区间。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: endDayOffset
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/endDayOffset
    definition: >-
      signed integer day offset between the local start date and the local end date of a session, used to model
      cross-midnight sessions where the end falls on a later calendar day than the start.
    genus: End Day Offset
    differentia:
      - 结束日期偏移，是某一时段本地开始日期与本地结束日期之间的有符号整数日偏移，用于建模结束日期晚于开始日期的跨午夜时段。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: exceptionBusinessDate
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/exceptionBusinessDate
    definition: >-
      the local business date on which a trading-calendar exception applies, used to attach an exception fact to a
      specific date.
    genus: Exception Business Date
    differentia:
      - 例外营业日期，是某一交易日历例外所作用的本地营业日期，用于把例外事实挂接到具体日期。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: exceptionOccurrence
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/exceptionOccurrence
    definition: >-
      functional relation that associates a calendar exception with the exact session occurrence it deterministically
      alters, used to attach an exception fact to the affected session occurrence.
    genus: Exception Occurrence
    differentia:
      - 例外实例关系，是将某一交易日历例外关联到其确定性地修改的确切交易时段实例的功能性关系，用于把例外事实挂接到被影响的时段实例。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: ianaTimeZone
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/ianaTimeZone
    definition: >-
      canonical IANA time-zone identifier, used to interpret the local-clock sessions of a trading calendar and anchor
      local sessions to a specific geographical time zone.
    genus: IANA Time Zone
    differentia:
      - IANA 时区，是用于解释交易日历本地时钟时段的规范 IANA 时区标识符，用于把本地时段锚定到具体地理时区。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: JurisdictionCalendarBinding
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/JurisdictionCalendarBinding
    definition: >-
      explicit temporal binding between one logical Jurisdiction identity and one exact TradingCalendar version, used to
      materialize the relationship between a calendar and its governing jurisdiction to support audit and mapping
      slices.
    genus: Jurisdiction Calendar Binding
    differentia:
      - 司法辖区日历绑定，是某一逻辑司法辖区身份与某一确切交易日历版本之间的显式时态绑定，用于将日历与所辖司法辖区关系实例化以支持审计与映射切片。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: localSessionEnd
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/localSessionEnd
    definition: >-
      the ISO local-clock time at which a recurring half-open session interval ends, used to define the closing of a
      trading session in local time.
    genus: Local Session End
    differentia:
      - 本地时段结束，是某一重复半开时段区间结束的 ISO 本地时钟时刻，用于以本地时间定义交易时段的收尾。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: localSessionStart
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/localSessionStart
    definition: >-
      the ISO local-clock time at which a recurring session interval begins, used to define the opening of a trading
      session in local time.
    genus: Local Session Start
    differentia:
      - 本地时段开始，是某一重复时段区间开始的 ISO 本地时钟时刻，用于以本地时间定义交易时段的开端。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: marketCategory
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/marketCategory
    definition: >-
      closed classification attribute carried by a MIC registry entry, used to record the ISO 10383 market category of
      the identified infrastructure.
    genus: MIC Market Category
    differentia:
      - MIC 市场类别，是某一 MIC 注册条目携带的封闭分类属性，用于记录所标识基础设施的 ISO 10383 市场类别。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: marketConvention
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/marketConvention
    definition: >-
      reviewed convention member, used to fix the orientation and application semantics of one OTC context and
      characterize the pricing and unit orientation of over-the-counter quotes.
    genus: Market Convention
    differentia:
      - 市场约定，是用于确定某一场外上下文报价方向与应用语义的经审核约定成员，用于刻画场外报价的计价与单位取向。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MarketConvention
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MarketConvention
    definition: >-
      closed convention classification controlled vocabulary, used to orient direct quote-per-unit OTC contexts and
      provide a standard enumeration of over-the-counter quoting methods.
    genus: Market Convention
    differentia:
      - 市场约定表，是用于为按单位直接报价的场外上下文定向的封闭约定分类受控词汇，用于为场外报价方式提供标准枚举。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MarketInfrastructureComponent
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MarketInfrastructureComponent
    definition: >-
      the abstract base class for a section or component of an operating market infrastructure entity, used to model the
      ISO 10383 "section" semantics (a part of a market, exchange, or reporting facility) as a component rather than as
      an independent facility, while allowing concrete components to share a facility supertype for reference range
      where useful.
    genus: Market Infrastructure Component
    differentia:
      - >-
        市场基础设施组成部分，是某一运营中市场基础设施实体的板块或组成部分的抽象基类，用于将 ISO 10383 "section"
        语义（市场、交易所或报告设施的一部分）建模为组成部分而非独立设施，同时允许具体组成部分在需要时共享设施超类以获得参照范围。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MarketSegment
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
    definition: >-
      section or component of an operating market infrastructure entity (a trading venue or a trade reporting facility),
      modeled as a TradingFacility subtype for shared reference range but carrying its part-of semantics through the
      componentOf relation
    genus: market section
    differentia:
      - a section/component of an operating entity, not an independent facility
      - specialized by instrument type, regulation, or reporting section
      - identified by a Segment MIC (ISO 10383)
      - belongs to exactly one operating entity via marketSegmentVenue or componentOf
    excludes:
      - a standalone exchange (not a segment)
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FunctionalEntities/Markets/MarketSegmentLevelMarket
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: marketSegmentVenue
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/marketSegmentVenue
    definition: >-
      functional relation that associates a market segment with the unique operating trading venue it belongs to, used
      to characterize the ownership structure between segments and venues.
    genus: Market Segment Venue
    differentia:
      - 市场板块场所关系，是将某一市场板块关联到其所隶属的唯一运营交易场所的功能性关系，用于刻画板块与场所的归属结构。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: micEffectiveFrom
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/micEffectiveFrom
    definition: >-
      the optional inclusive instant from which a MIC registry entry is effective per ISO 10383, used to record the
      entry lifecycle.
    genus: MIC Effective From
    differentia:
      - MIC 生效起始，是某一 MIC 注册条目按 ISO 10383 生效的可选含端瞬时，用于记录条目生命周期。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: micEffectiveTo
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/micEffectiveTo
    definition: >-
      the optional exclusive instant at which a MIC registry entry expires per ISO 10383, used to record the entry
      lifecycle.
    genus: MIC Effective To
    differentia:
      - MIC 生效结束，是某一 MIC 注册条目按 ISO 10383 到期的可选不含端瞬时，用于记录条目生命周期。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: micEntryType
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/micEntryType
    definition: >-
      closed classification attribute carried by one MIC registry entry, used to distinguish whether the entry is an
      operating-level or segment-level registry record.
    genus: MIC Entry Type
    differentia:
      - MIC 条目类型，是某一 MIC 注册条目携带的封闭分类属性，用于区分该条目是运营级还是板块级注册记录。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MICEntryType
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MICEntryType
    definition: >-
      closed controlled vocabulary based on ISO 10383 that distinguishes operating-level MICs from segment-level MICs,
      used to provide a standard enumeration of entry kinds for MIC registry entries.
    genus: MIC Entry Type
    differentia:
      - MIC 条目类型表，是依据 ISO 10383 区分运营级 MIC 与板块级 MIC 的封闭受控词汇，用于为 MIC 注册条目提供条目种类的标准枚举。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MICIdentifiedMarketInfrastructure
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MICIdentifiedMarketInfrastructure
    definition: >-
      abstract base class for any operating or reporting market infrastructure entity identifiable by an ISO 10383
      Market Identifier Code
    genus: market infrastructure
    differentia:
      - identified by an ISO 10383 MIC
      - broadens the MIC target taxonomy beyond trading venues to include reporting facilities
    excludes:
      - entities not identifiable by a MIC
    sources:
      - reference: iso-10383-mic
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MICMarketCategory
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MICMarketCategory
    definition: >-
      closed controlled vocabulary of the ISO 10383 market category of the infrastructure identified by a MIC registry
      entry, used to record whether the identified infrastructure operates a trading market, reports trades, or performs
      another market function.
    genus: MIC Market Category
    differentia:
      - MIC 市场类别表，是某一 MIC 注册条目所标识基础设施 ISO 10383 市场类别的封闭受控词汇，用于记录所标识基础设施是运营交易市场、报告交易还是执行其他市场功能。
    excludes: []
    sources:
      - reference: module-yaml
        locator: ontology/domain/finance (v1.1.0)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
