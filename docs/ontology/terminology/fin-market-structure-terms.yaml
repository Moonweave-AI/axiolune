# fin-market-structure — Terminology Cards

cards:
  - term: TradingVenue
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/TradingVenue
    definition: >-
      market system or venue that constitutes, maintains, or provides a facility for bringing together purchasers and
      sellers of financial instruments, distinct from the legal entity that operates it
    genus: market system
    differentia:
      - brings together purchasers and sellers
      - identified by an Operating MIC (ISO 10383)
      - may be a regulated market, MTF, OTF, ATS, or other venue category
      - operator and regulatory category modeled separately as temporal facts via VenueOperation
    excludes:
      - the operating legal entity (modeled via VenueOperation/operatedBy)
      - data reporting services (use TradeReportingFacility)
      - internal matching engines without external clients
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FunctionalEntities/Markets/Exchange
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MarketSegment
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MarketSegment
    definition: >-
      section or component of an operating market infrastructure entity (a trading venue or a trade reporting facility),
      modeled as a TradingFacility subtype for shared reference range but carrying its part-of semantics through the
      componentOf relation
    genus: market section
    differentia:
      - a section/component of an operating entity, not an independent facility
      - specialized by instrument type, regulation, or reporting section
      - identified by a Segment MIC (ISO 10383)
      - belongs to exactly one operating entity via marketSegmentVenue or componentOf
    excludes:
      - a standalone exchange (not a segment)
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FBC/FunctionalEntities/Markets/MarketSegmentLevelMarket
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: MICIdentifiedMarketInfrastructure
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/MICIdentifiedMarketInfrastructure
    definition: >-
      abstract base class for any operating or reporting market infrastructure entity identifiable by an ISO 10383
      Market Identifier Code
    genus: market infrastructure
    differentia:
      - identified by an ISO 10383 MIC
      - broadens the MIC target taxonomy beyond trading venues to include reporting facilities
    excludes:
      - entities not identifiable by a MIC
    sources:
      - reference: iso-10383-mic
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: TradeReportingFacility
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/TradeReportingFacility
    definition: >-
      market infrastructure entity to which trade reports are made but which does not itself operate a trading market
    genus: market infrastructure
    differentia:
      - receives trade reports
      - does not operate a trading market
      - may be identified by an ISO 10383 Operating MIC
    excludes:
      - trading venues (use TradingVenue)
    sources:
      - reference: iso-10383-mic
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: VenueOperation
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/VenueOperation
    definition: >-
      temporal provenance-bearing association recording one Party operating one TradingVenue over a validity interval
      with an optional regulatory venue category
    genus: operation fact
    differentia:
      - binds one logical Party to one logical TradingVenue
      - carries a validity interval
      - carries an optional VenueCategory
    excludes:
      - venue identity (belongs to TradingVenue)
    sources:
      - reference: w3c-org
        locator: W3C ORG organization-role-temporal pattern
    candidateM3Type: AssociationTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: NonVenueMarketContext
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/NonVenueMarketContext
    definition: >-
      stable non-venue market context characterizing the market-convention orientation of over-the-counter quoting
      without carrying provider source contracts, concrete currencies, counterparty pairs, or execution semantics
    genus: market context
    differentia:
      - non-venue (not a TradingFacility)
      - carries only market-convention orientation and provider logical reference
      - replaces the deprecated OTCTradingContext for the stable-structure part
    excludes:
      - counterparty pairs (belong to orders-execution/post-trade)
      - concrete currencies (belong to instruments)
      - source contracts (belong to Layer 4)
    sources:
      - reference: axiolune-adr
        locator: ADR-024 D8
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: TradingScheduleOverrideNotice
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/TradingScheduleOverrideNotice
    definition: >-
      n-ary association recording one pre-announced schedule override applying to one or more session occurrences,
      carrying an announcement order and a supersession order with an optional replacement interval
    genus: schedule override fact
    differentia:
      - applies to one or more TradingSessionOccurrence versions
      - carries announcement and supersession order
      - synthesizes a single final effective interval or cancellation
    excludes:
      - real-time status/halt (belongs to market-data)
    sources:
      - reference: axiolune-adr
        locator: ADR-024 D7/D9
    candidateM3Type: AssociationTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: ScheduledTradingPhase
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/ScheduledTradingPhase
    definition: >-
      closed controlled vocabulary of scheduled trading-session phases (preOpen, openingAuction, continuousTrading,
      closingAuction, postClose, maintenance, reportingOnly)
    genus: phase classification
    differentia:
      - carried by a session template
      - distinguishes order-acceptance vs matching vs reporting phases
    excludes: []
    sources:
      - reference: nyse-trading-hours
    candidateM3Type: CodeList
    status: accepted
    owner: axiolune-m2-team
  - term: TradingSession
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/TradingSession
    definition: >-
      scheduled time period during which a trading venue accepts orders and executes trades, characterized by a session
      type (e.g. pre-market, regular, post-market, auction)
    genus: scheduled period
    differentia:
      - defined by a trading venue
      - characterized by session type
      - has start and end times
    excludes:
      - ad-hoc trading outside scheduled sessions
      - settlement periods
    sources:
      - reference: nautilus-trader
        locator: model/enums.py — MarketStatus enum; no FIBO equivalent (gap)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
  - term: TradingCalendar
    canonicalIri: https://axiolune.ai/ontology/finance/market-structure/TradingCalendar
    definition: >-
      schedule of trading sessions for a trading venue across calendar dates, defining which dates and times the venue
      is open for trading
    genus: schedule
    differentia:
      - specific to a trading venue
      - defines open trading dates and times
      - excludes holidays and non-trading days
    excludes:
      - settlement calendars (different concern)
      - business calendars for general organizations
    sources:
      - reference: fibo-local-evidence
        locator: FIBO FND/DatesAndTimes/FinancialDates/BusinessCalendar (partial; no session schedule)
    candidateM3Type: ObjectTypeDefinition
    status: accepted
    owner: axiolune-m2-team
