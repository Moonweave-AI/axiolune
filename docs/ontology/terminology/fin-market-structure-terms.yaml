# fin-market-structure — Terminology Cards

cards:
  - term: "TradingVenue"
    canonicalIri: "https://axiolune.ai/ontology/finance/market-structure/TradingVenue"
    definition: "organization, association, or group that constitutes, maintains, or provides a facility for bringing together purchasers and sellers of financial instruments"
    genus: "facility"
    differentia:
      - "brings together purchasers and sellers"
      - "identified by a MIC (ISO 10383)"
      - "may be a regulated exchange, MTF, OTF, ATS, or other venue type"
    excludes:
      - "data reporting services (not trading venues)"
      - "internal matching engines without external clients"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO FBC/FunctionalEntities/Markets/Exchange"
    candidateM3Type: "ObjectTypeDefinition"
    status: review

  - term: "MarketSegment"
    canonicalIri: "https://axiolune.ai/ontology/finance/market-structure/MarketSegment"
    definition: "section of a trading venue that specializes in one or more specific instruments or that is regulated differently from other sections of the same venue"
    genus: "market section"
    differentia:
      - "part of a trading venue"
      - "specialized by instrument type or regulation"
      - "identified by a segment MIC (4+4 character)"
    excludes:
      - "a standalone exchange (not a segment)"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO FBC/FunctionalEntities/Markets/MarketSegmentLevelMarket"
    candidateM3Type: "ObjectTypeDefinition"
    status: review

  - term: "TradingSession"
    canonicalIri: "https://axiolune.ai/ontology/finance/market-structure/TradingSession"
    definition: "scheduled time period during which a trading venue accepts orders and executes trades, characterized by a session type (e.g. pre-market, regular, post-market, auction)"
    genus: "scheduled period"
    differentia:
      - "defined by a trading venue"
      - "characterized by session type"
      - "has start and end times"
    excludes:
      - "ad-hoc trading outside scheduled sessions"
      - "settlement periods"
    sources:
      - reference: "nautilus-trader"
        locator: "model/enums.py — MarketStatus enum; no FIBO equivalent (gap)"
    candidateM3Type: "ObjectTypeDefinition"
    status: review

  - term: "TradingCalendar"
    canonicalIri: "https://axiolune.ai/ontology/finance/market-structure/TradingCalendar"
    definition: "schedule of trading sessions for a trading venue across calendar dates, defining which dates and times the venue is open for trading"
    genus: "schedule"
    differentia:
      - "specific to a trading venue"
      - "defines open trading dates and times"
      - "excludes holidays and non-trading days"
    excludes:
      - "settlement calendars (different concern)"
      - "business calendars for general organizations"
    sources:
      - reference: "fibo-2026Q1"
        locator: "FIBO FND/DatesAndTimes/FinancialDates/BusinessCalendar (partial; no session schedule)"
    candidateM3Type: "ObjectTypeDefinition"
    status: review
